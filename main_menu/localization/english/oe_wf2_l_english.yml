l_english:
 STATIC_MODIFIER_NAME_oe_wf2_mod_strict_haijin:0 "Strict Jiajing Maritime Ban (Haijin)"
 STATIC_MODIFIER_DESC_oe_wf2_mod_strict_haijin:0 "Imperial coastal patrol edicts seal private wharves and reinforce blockades against pirate junks, sharply curtailing overseas maritime trade and bruising coastal burghers."
 STATIC_MODIFIER_NAME_oe_wf2_mod_regulated_sea_trade:0 "Tang Shu's Licensed Trade Debate"
 STATIC_MODIFIER_DESC_oe_wf2_mod_regulated_sea_trade:0 "Permitting registered coastal guilds to trade under imperial tally bonds converts clandestine brokers into lawful taxpayers while loosening direct coastal control and vexing conservative gentry."
 STATIC_MODIFIER_NAME_oe_wf2_mod_silver_exchange:0 "Regulated Iwami Silver Customs"
 STATIC_MODIFIER_DESC_oe_wf2_mod_silver_exchange:0 "Taxing Japanese and maritime silver inflows through provincial bullion offices swells imperial treasury receipts while nudging monetary inflation and unsettling traditional landed houses."
 STATIC_MODIFIER_NAME_oe_wf2_mod_wang_zhi_amnesty:0 "Hu Zongxian's Amnesty Charter for Wang Zhi"
 STATIC_MODIFIER_DESC_oe_wf2_mod_wang_zhi_amnesty:0 "Honoring safe-conduct terms to turn the maritime syndicate leader into a licensed coast warden quiets pirate fleets and revives sea commerce at the price of censorate fury and humbled prestige."
 STATIC_MODIFIER_NAME_oe_wf2_mod_yiwu_qi_army:0 "Qi Jiguang's Yiwu Volunteer Corps"
 STATIC_MODIFIER_DESC_oe_wf2_mod_yiwu_qi_army:0 "Replacing hollow hereditary Weisuo rolls with fiercely loyal Zhejiang miners and hill farmers creates an elite disciplined strike army at higher regular silver payrolls."
 STATIC_MODIFIER_NAME_oe_wf2_mod_yuanyang_tactics:0 "Mandarin Duck Formation & Jixiao Xinshu"
 STATIC_MODIFIER_DESC_oe_wf2_mod_yuanyang_tactics:0 "Codifying twelve-man interlocking squads of bamboo wolf-brushes, rattan shields, long pikes, and tridents neutralizes pirate shock assaults across coastal waterways while demanding rigorous drill outlays."
 STATIC_MODIFIER_NAME_oe_wf2_mod_longqing_open_ports:0 "Longqing Opening of Moon Harbor (Yuegang)"
 STATIC_MODIFIER_DESC_oe_wf2_mod_longqing_open_ports:0 "Opening Zhangzhou's Moon Harbor under licensed imperial voyages drains smuggling at its root and draws global silver into imperial customs while mildly easing coastal fortifications and irking inland conservatives."
 STATIC_MODIFIER_NAME_oe_wf2_mod_wokou_pacified:0 "Pacified Southeastern Seas"
 STATIC_MODIFIER_DESC_oe_wf2_mod_wokou_pacified:0 "With Wokou strongholds shattered and coastal garrisons reorganized from Zhejiang to Guangdong, maritime security and civil confidence flourish under permanent naval patrols."
 STATIC_MODIFIER_NAME_oe_wf2_loc_shuangyu_smuggling:0 "Shuangyu Clandestine Entrepot"
 STATIC_MODIFIER_DESC_oe_wf2_loc_shuangyu_smuggling:0 "Armed smugglers, offshore brokers, and foreign traders crowd hidden coves, boosting informal commercial turnover while undermining imperial control and inviting coastal raids."
 STATIC_MODIFIER_NAME_oe_wf2_loc_coastal_bastion:0 "Southeastern Stone Sea-Bastion"
 STATIC_MODIFIER_DESC_oe_wf2_loc_coastal_bastion:0 "Granite sea-walls, signal beacons, and rotating garrison batteries anchor coastal defense and deter pirate landings."
 STATIC_MODIFIER_NAME_oe_wf2_loc_yuegang_customs:0 "Moon Harbor Imperial Maritime Customs"
 STATIC_MODIFIER_DESC_oe_wf2_loc_yuegang_customs:0 "Licensed ocean junks clear customs in orderly convoys for Manila and Southeast Asia, turning the port into a prosperous silver gateway."
 STATIC_MODIFIER_NAME_oe_wf2_mod_shushui_gongsha:0 "Confine the Water to Scour the Silt"
 STATIC_MODIFIER_DESC_oe_wf2_mod_shushui_gongsha:0 "Pan Jixun's twin inner-and-outer dikes channel clear Huai waters from Hongze Lake to flush Yellow River silt out to sea, securing North China grain and stability at steady hydraulic maintenance cost."
 STATIC_MODIFIER_NAME_oe_wf2_mod_canal_grain_security:0 "Huai'an Grand Canal Grain Security"
 STATIC_MODIFIER_DESC_oe_wf2_mod_canal_grain_security:0 "Coordinated locks, bypass channels, and Huai'an grain depots keep southern tribute barges flowing uninterrupted to Beijing, lifting overland commerce, harvests, and Celestial Authority at regular canal upkeep."
 STATIC_MODIFIER_NAME_oe_wf2_mod_paid_dike_labor:0 "Silver-Paid Hydraulic Labor Guilds"
 STATIC_MODIFIER_DESC_oe_wf2_mod_paid_dike_labor:0 "Replacing coercive peasant corvee with silver-paid hydraulic laborers soothes rural grievances and improves dike workmanship at the expense of net tax receipts."
 STATIC_MODIFIER_NAME_oe_wf2_mod_river_neglect_crisis:0 "Neglected Yellow River Breaches"
 STATIC_MODIFIER_DESC_oe_wf2_mod_river_neglect_crisis:0 "Embezzled dike funds and deferred repairs leave the Yellow River and Grand Canal choked with silt, eroding grain harvests, popular morale, and Heaven's Mandate."
 STATIC_MODIFIER_NAME_oe_wf2_loc_yellow_river_flood:0 "Yellow River Embankment Breach"
 STATIC_MODIFIER_DESC_oe_wf2_loc_yellow_river_flood:0 "Silt-heavy floodwaters have broken the embankments, inundating croplands and severing roads and canal locks."
 STATIC_MODIFIER_NAME_oe_wf2_loc_gaojia_dike_fortified:0 "Reinforced Gaojia Stone Dike"
 STATIC_MODIFIER_DESC_oe_wf2_loc_gaojia_dike_fortified:0 "Masonry revetments and auxiliary sluices protect the Huai-Yellow watershed, stabilizing irrigation and grain transit."
 STATIC_MODIFIER_NAME_oe_wf2_mod_fengshan_zenith:0 "Imperial Fengshan Benediction"
 STATIC_MODIFIER_DESC_oe_wf2_mod_fengshan_zenith:0 "Solemn sacrifices upon Mount Tai proclaim an age of great harmony to every province and tributary court, sustained by magnificent ceremonial patronage."
 STATIC_MODIFIER_NAME_oe_wf2_mod_salt_tea_treasury:0 "Kaizhong Salt & Tea Voucher Ledger"
 STATIC_MODIFIER_DESC_oe_wf2_mod_salt_tea_treasury:0 "Synchronizing frontier grain deliveries with state salt vouchers and western tea-horse stations fortifies treasury revenues while raising staple costs for common households."
 STATIC_MODIFIER_NAME_oe_wf2_mod_osmanli_charter:0 "Twin-Rome Charter of Toleration"
 STATIC_MODIFIER_DESC_oe_wf2_mod_osmanli_charter:0 "Guaranteeing legal standing to Greek Orthodox synods and Italian civic statutes under the Sultan's writ expands cultural harmony and diplomatic reach while angering strict orthodox jurists."
 STATIC_MODIFIER_NAME_oe_wf2_mod_osmanli_kanun_juris:0 "Kanunname & Corpus Juris Divan"
 STATIC_MODIFIER_DESC_oe_wf2_mod_osmanli_kanun_juris:0 "Blending Ottoman Kanunname fiscal registers with Roman imperial jurisprudence streamlines cabinet administration across Anatolia, Rumelia, and Italy at heightened palace costs and aristocratic friction."
 STATIC_MODIFIER_NAME_oe_wf2_mod_osmanli_rome_crown:0 "Crown of Osmanli Rome (Kayser-i Rum)"
 STATIC_MODIFIER_DESC_oe_wf2_mod_osmanli_rome_crown:0 "Uniting Constantinople and Rome beneath a pluralistic imperial synthesis crowns the House of Osman as heirs to Mediterranean universal monarchy, though conservative clerics and vast imperial pageantry weigh heavily on the court."
 oe_wf_dis_wokou_raids:0 "Jiajing Southeastern Wokou Crisis"
 oe_wf_dis_wokou_raids_desc:0 "Clandestine maritime syndicates, displaced coastal seamen, and armed pirate flotillas from Shuangyu to Zhangzhou raid the rich southeastern provinces. Only sustained military reorganization under leaders like Qi Jiguang, reinforced coastal bastions, or a principled resolution of the maritime ban can restore tranquil seas."
 oe_wf2_cab_coastal_pacification:0 "Southeastern Coastal Pacification"
 oe_wf2_cab_coastal_pacification_desc:0 "Assign a military commissioner to coordinate coastal signal beacons, patrol junks, and local garrisons across a province—raising local defense and control while crushing pirate spawn rates at naval upkeep and burgher friction."
 oe_wf2_cab_coastal_pacification_action:0 "Carry out: Southeastern Coastal Pacification"
 oe_wf2_cab_coastal_pacification_active:0 "Carrying out: Southeastern Coastal Pacification"
 oe_wf2_cab_coastal_pacification_action_progress:0 "Southeastern Coastal Pacification progress"
 oe_wf2_cab_coastal_pacification_action_progress_wordier:0 "Southeastern Coastal Pacification is under way"
 oe_wf2_cab_coastal_pacification_action_progress_long_wordier:0 "Coastal wardens are clearing pirate coves, repairing sea-walls, and registering harbor craft across the province."
 oe_wf2_cab_coastal_pacification_action_progress_tooltip:0 "How far Southeastern Coastal Pacification has progressed"
 oe_wf2_cab_coastal_pacification_select_province:0 "Choose a province for Coastal Pacification"
 oe_wf2_cab_coastal_pacification_no_provinces:0 "@trigger_no! No controlled province available for coastal pacification"
 oe_wf2_cab_river_hydraulics:0 "Yellow River & Grand Canal Hydraulics"
 oe_wf2_cab_river_hydraulics_desc:0 "Dispatch hydraulic engineers to reinforce levees, dredge silted canal locks, and protect grain transport—lifting local harvests, prosperity, and overland commerce at steady court expense and peasant corvee friction."
 oe_wf2_cab_river_hydraulics_action:0 "Carry out: Yellow River & Grand Canal Hydraulics"
 oe_wf2_cab_river_hydraulics_active:0 "Carrying out: Yellow River & Grand Canal Hydraulics"
 oe_wf2_cab_river_hydraulics_action_progress:0 "Yellow River & Grand Canal Hydraulics progress"
 oe_wf2_cab_river_hydraulics_action_progress_wordier:0 "Yellow River & Grand Canal Hydraulics is under way"
 oe_wf2_cab_river_hydraulics_action_progress_long_wordier:0 "Hydraulic crews are reinforcing earthen levees with stonework and clearing silt from Grand Canal sluices."
 oe_wf2_cab_river_hydraulics_action_progress_tooltip:0 "How far Yellow River & Grand Canal Hydraulics has progressed"
 oe_wf2_cab_river_hydraulics_select_province:0 "Choose a province for Hydraulic Works"
 oe_wf2_cab_river_hydraulics_no_provinces:0 "@trigger_no! No controlled province available for hydraulic works"
 oe_wfm_bld_grand_canal_huaian:0 "Grand Canal Huai'an Grain Directorate"
 oe_wfm_bld_grand_canal_huaian_desc:0 "The imperial headquarters of the Director-General of Grain Transport at Huai'an (Shanyang), commanding the decisive junction where the Grand Canal crosses the Yellow and Huai Rivers to feed Beijing and anchor Jianghuai trade."
 oe_wf2_dec_appoint_river_commissioner.title:0 "Appoint Chief Hydraulic Commissioner (Confine-Water Works)"
 oe_wf2_dec_appoint_river_commissioner.desc:0 "Spend #Y 100#! gold (15-year cooldown) to empower a Chief Hydraulic Commissioner in the tradition of Pan Jixun—fortifying Gaojia Dike, flushing Yellow River silt with clear Huai water, clearing neglected-dike penalties, and unlocking enhanced synergy if the Grand Canal Huai'an Directorate stands."
 oe_wf2_dec_appoint_river_commissioner.a:0 "Commission the Yellow River & Huai'an Hydraulic Works"
 oe_wf2_dec_proclaim_osmanli_rome.title:0 "Proclaim the Osmanli Roman Synthesis"
 oe_wf2_dec_proclaim_osmanli_rome.desc:0 "Holding both Constantinople and Rome while fostering Greek or Orthodox pluralism opens an extraordinary alt-history imperial path: weave Ottoman Kanunname statecraft with classical Roman universalism as Kayser-i Rum (player-guided Easter Egg branch, 200 gold)."
 oe_wf2_dec_proclaim_osmanli_rome.a:0 "Convene the Twin-Rome Imperial Divan"
 oe_wf_ref_abolish_chancellor:0 "Abolition of the Chancellery"
 oe_wf_ref_abolish_chancellor_desc:0 "Following the early-Ming abolition of the Chief Chancellery, the Six Ministries report directly to the throne—sharply lifting crown power, provincial control, and legislative authority while burdening cabinet throughput and antagonizing entrenched nobles. Mutually exclusive with the Ming Grand Secretariat and Qing Grand Council courts."
 oe_wf_ref_ming_celestial_court:0 "Ming Grand Secretariat Court"
 oe_wf_ref_ming_celestial_court_desc:0 "Institutionalizes the Grand Secretariat (Neige) and Censorate balance to coordinate civil administration, silver taxation, and Celestial prestige, trading direct royal autocracy and military economy for refined bureaucratic efficiency. Mutually exclusive with Abolition of the Chancellery and the Qing Grand Council court."
 oe_wf_ref_qing_celestial_court:0 "Qing Grand Council & Banner Court"
 oe_wf_ref_qing_celestial_court_desc:0 "Pairs a secretive Grand Council (Junjichu) with disciplined banner command to project decisive royal absolutism and military rigor across Inner and East Asia, at heavier palace spending and commercial burgher friction. Mutually exclusive with Abolition of the Chancellery and the Ming Grand Secretariat court."
 oe_wf_ref_imperial_examination:0 "Triennial Imperial Examination Bureau"
 oe_wf_ref_imperial_examination_desc:0 "Standardizes county, provincial, and palace civil service examinations to recruit administrative talent on merit—accelerating research, literacy, and cabinet governance while eroding hereditary noble privileges and drawing on court stipends."
 oe_wf_ref_fengshan_sacred_peak:0 "Fengshan Rites of Mount Tai"
 oe_wf_ref_fengshan_sacred_peak_desc:0 "Reserves the supreme classical mountain sacrifice at Mount Tai near Qufu for a stable Son of Heaven—radiating Celestial Authority, legitimacy, cultural influence, and diplomatic prestige at heavy ceremonial spending and peasant service."
 oe_wf_ref_celestial_seal_mandate:0 "Heirloom Seal of the Celestial Mandate"
 oe_wf_ref_celestial_seal_mandate_desc:0 "Enshrines the sacred jade seal of imperial succession in the capital, binding tributary realms in deeper loyalty and elevating prestige, diplomatic reach, and stability at the expense of court upkeep and estate deference."
 oe_wf_priv_encourage_exam:0 "Encourage Provincial Examination Academies"
 oe_wf_priv_encourage_exam_desc:0 "Endows prefectural academies and scholar-gentry examination stipends, lifting scholarly satisfaction, literacy, and research speed while conceding clerical clout and a slice of land tax and crown power."
 oe_wf_priv_imperial_princes:0 "Princely Appanages & Clan Stipends"
 oe_wf_priv_imperial_princes_desc:0 "Grants hereditary princely domains and silver stipends to imperial kinsmen, bolstering noble loyalty, dynastic legitimacy, and regional defense while imposing a heavy fiscal drain on court spending and crown authority."
 oe_wf_priv_military_exam:0 "Imperial Martial Examination Commission"
 oe_wf_priv_military_exam_desc:0 "Empowers military houses and provincial commanders to administer triennial martial examinations in archery, cavalry, and tactics—boosting army tradition, morale, and noble satisfaction at steeper military upkeep and civil-scholar resentment."
 oe_wf_priv_tea_salt_monopoly:0 "Licensed Tea-Horse & Salt Voucher Monopoly"
 oe_wf_priv_tea_salt_monopoly_desc:0 "Contracts major merchant syndicates to distribute state salt vouchers and border tea quotas, raising burgher satisfaction, tax yields, and overland commerce while squeezing peasant households and enlarging merchant power."
 oe_wf2_wokou.1.t:0 "Shadows Over Shuangyu Island"
 oe_wf2_wokou.1.d:0 "Off the mist-shrouded coast of Dinghai, Shuangyu Island has swelled into a fortified clandestine entrepot where Fujianese shipmasters, Jiangnan silver brokers, Portuguese factors, and armed Japanese ronin trade silk and gunpowder beyond imperial writ. As local officials lose control of the coves, coastal raids spill onto the mainland—marking the onset of the Jiajing Wokou Crisis."
 oe_wf2_wokou.1.a:0 "Dispatch imperial patrols and enforce a strict Haijin blockade"
 oe_wf2_wokou.1.b:0 "Seek a quiet customs compromise with coastal merchant brokers"
 oe_wf2_wokou.2.t:0 "The Great Haijin Debate at Court"
 oe_wf2_wokou.2.d:0 "Inside the Meridian Gate, ministers clash bitterly over the root cause of coastal piracy. Hardline censors insist that banning all private ocean voyages is ancestral law and must be enforced with iron rigor. Reformist jurists like Tang Shu counter that 'pirates and merchants are the same people: when trade is permitted, pirates become merchants; when trade is banned, merchants turn into pirates.'"
 oe_wf2_wokou.2.a:0 "Uphold strict ancestral Haijin and fortify coastal barriers"
 oe_wf2_wokou.2.b:0 "Permit trial licensed coastal commerce to peel merchants away from pirates"
 oe_wf2_wokou.3.t:0 "Gentry Collusion in the Jiangnan Deltas"
 oe_wf2_wokou.3.d:0 "Captured smuggling ledgers reveal an explosive scandal: several prominent coastal gentry lineages have financed private junks, sheltered pirate captains in manor compounds, and tipped off raiders ahead of garrison sweeps. Moving ruthlessly against the great houses will swell the war chest and break piracy's inland network, at the cost of fierce aristocratic and burgher anger."
 oe_wf2_wokou.3.a:0 "Prosecute the colluding lineages and confiscate contraband fortunes"
 oe_wf2_wokou.3.b:0 "Offer a quiet tax-bond amnesty in exchange for militia funding"
 oe_wf2_wokou.4.t:0 "The Silver Tide from Iwami and Kyushu"
 oe_wf2_wokou.4.d:0 "Booming silver mines in western Japan have flooded the East China Sea with bullion hungry for Chinese raw silk, porcelain, and medicinal herbs. Because official tribute tallies cannot absorb a fraction of this demand, armed smuggling fleets swell every spring monsoon. Shall the court channel this silver through provincial bullion offices, or interdict every silver-laden junk on sight?"
 oe_wf2_wokou.4.a:0 "Establish provincial bullion customs to tax the incoming silver"
 oe_wf2_wokou.4.b:0 "Order naval squadrons to intercept and burn contraband silver junks"
 oe_wf2_wokou.5.t:0 "Hu Zongxian's Envoy to Hirado: Enticing Wang Zhi"
 oe_wf2_wokou.5.d:0 "Supreme Commander Hu Zongxian reports that the vast Wokou coalition answers chiefly to Wang Zhi—a Huizhou merchant-captain styled 'King of the Hui' operating out of Hirado in Kyushu. Hu dispatches envoys bearing imperial credentials to lure Wang Zhi back to Zhejiang waters: shall we secretly prepare a trap to seize him upon landing, or back a genuine amnesty charter turning his fleet into coastal wardens?"
 oe_wf2_wokou.5.a:0 "Approve Hu Zongxian's covert stratagem to lure and capture Wang Zhi"
 oe_wf2_wokou.5.b:0 "Authorize a genuine imperial amnesty to convert Wang Zhi's fleet"
 oe_wf2_wokou.6.t:0 "Trial of the Sea King at Hangzhou"
 oe_wf2_wokou.6.d:0 "Wang Zhi has sailed into Dinghai harbor and surrendered to provincial authorities, expecting his followers to receive licensed trade charters. Yet furious censors in Beijing demand his immediate execution as a rebel traitor. Executing Wang Zhi vindicates imperial law while scattering his furious lieutenants into leaderless coastal raids; honoring amnesty quiets his fleets at severe political cost."
 oe_wf2_wokou.6.a:0 "Execute Wang Zhi at Hangzhou to uphold uncompromising imperial law"
 oe_wf2_wokou.6.b:0 "Honor the safe-conduct pact and integrate his captains under strict watch"
 oe_wf2_wokou.7.t:0 "Storm on the Zhejiang Coast: Raids on Songjiang and Hangzhou"
 oe_wf2_wokou.7.d:0 "Splinter Wokou bands have struck deep along the canals of Songjiang and the approaches to Hangzhou, burning suburbs and ambushing demoralized hereditary garrison detachments. Provincial treasuries beg the throne to fund stone ramparts and mobile relief columns before the rich Yangtze Delta loses a full harvest season."
 oe_wf2_wokou.7.a:0 "Fund emergency stone fortifications and urban militia in Hangzhou and Songjiang"
 oe_wf2_wokou.7.b:0 "Dispatch regular mobile columns to hunt the raiders across the canals"
 oe_wf2_wokou.8.t:0 "Qi Jiguang Recruits the Yiwu Miners"
 oe_wf2_wokou.8.d:0 "Recognizing that decayed hereditary Weisuo soldiers flee at the first charge of seasoned pirate bladesmen, Commander Qi Jiguang petitions to dismiss paper garrisons and enlist sturdy hill farmers and miners from Yiwu in eastern Zhejiang. Backed by honest silver wages and strict collective discipline, this 'Qi Family Army' promises a true fighting instrument for the southeast."
 oe_wf2_wokou.8.a:0 "Fully finance Qi Jiguang's Yiwu recruitment and silver payroll"
 oe_wf2_wokou.8.b:0 "Supplement existing Weisuo garrisons with smaller provincial levies"
 oe_wf2_wokou.9.t:0 "Forging the Mandarin Duck Formation (Yuanyang Zhen)"
 oe_wf2_wokou.9.d:0 "Inside the Zhejiang drill grounds, Qi Jiguang unveils a revolutionary twelve-man tactical squad: rattan shield-bearers protect thorny bamboo wolf-brush bearers, backed by four long-pikes and forked tridents, rotating seamlessly across narrow paddy dikes where loose pirate swordsmen once dominated. Publishing the complete drill manual as the Jixiao Xinshu will institutionalize this mastery across our armies."
 oe_wf2_wokou.9.a:0 "Codify the Mandarin Duck Formation and distribute the Jixiao Xinshu manual"
 oe_wf2_wokou.9.b:0 "Focus resources instead on expanding coastal war-junk artillery drills"
 oe_wf2_wokou.10.t:0 "Nine Battles, Nine Victories: The Great Triumph at Taizhou"
 oe_wf2_wokou.10.d:0 "When thousands of Wokou raiders storm ashore across Taizhou Bay near Linhai, Qi Jiguang's newly drilled Yiwu regiments intercept them in nine consecutive engagements—at Xinhe, Huajie, Shangfengling, and Changsha—annihilating every landing column with astonishingly light casualties. Celebratory dispatches race north: the myth of Wokou invincibility on land has been shattered forever."
 oe_wf2_wokou.10.a:0 "Honor Qi Jiguang's Taizhou triumph and fortify the victorious Linhai coast"
 oe_wf2_wokou.10.b:0 "Redirect captured pirate spoils directly into imperial treasury relief"
 oe_wf2_wokou.11.t:0 "Relief of Putian and the Fujian Coast"
 oe_wf2_wokou.11.d:0 "Driven from Zhejiang, veteran Wokou hordes concentrate along the rugged Fujian coast, seizing coastal towns around Putian and menacing Fuzhou and Quanzhou. Marching south over mountain passes in coordination with Tan Lun and Fujian war-junk squadrons, our armies prepare a decisive combined land-and-sea sweep to clear the southern littoral."
 oe_wf2_wokou.11.a:0 "Launch the combined land-and-sea offensive across Fujian"
 oe_wf2_wokou.11.b:0 "Hold defensive garrison perimeters around Fuzhou and Quanzhou"
 oe_wf2_wokou.12.t:0 "Bastions of Stone: Chongwu and the Coastal Beacon Chain"
 oe_wf2_wokou.12.d:0 "Veteran coastal commanders warn that battlefield victories alone cannot prevent future raids if harbors remain unfortified. Constructing granite bastion towns such as Chongwu beside Jinjiang, linking Dinghai and Linhai with smoke-and-fire beacon towers, and pre-positioning grain magazines will turn the entire southeastern shoreline into an interlocking defensive shield."
 oe_wf2_wokou.12.a:0 "Construct the southeastern stone sea-bastions and beacon chain"
 oe_wf2_wokou.12.b:0 "Rely primarily on light naval patrol boats to economize on stonework"
 oe_wf2_wokou.13.t:0 "The Moon Harbor Memorial (Yuegang Opening)"
 oe_wf2_wokou.13.d:0 "With military victories breaking the armed pirate leagues, Fujian Governor Tu Zemin submits a landmark memorial: open Moon Harbor (Yuegang) in Zhangzhou to licensed private Chinese vessels sailing to Southeast Asia and Manila while keeping direct illegal smuggling strictly barred. By channeling restless coastal energy into taxed, lawful overseas commerce, piracy will wither without fuel."
 oe_wf2_wokou.13.a:0 "Approve the Moon Harbor Charter and establish licensed maritime customs"
 oe_wf2_wokou.13.b:0 "Reject private overseas voyages and maintain permanent armed maritime restriction"
 oe_wf2_wokou.14.t:0 "Tranquil Seas: End of the Jiajing Wokou Crisis"
 oe_wf2_wokou.14.d:0 "From the islands of Zhoushan to the estuaries of Fujian and Guangdong, the smoke of burning villages has cleared. Disciplined new regiments, masonry sea-fortresses, and settled maritime policy have brought the long southeastern nightmare to an end. Merchants repair their wharves, fishermen sail without fear, and chroniclers record that the Eastern Seas stand tranquil once more."
 oe_wf2_wokou.14.a:0 "Celebrate tranquil seas under thriving licensed coastal commerce"
 oe_wf2_wokou.14.b:0 "Preserve an ironclad coastal garrison shield along the eastern littoral"
 oe_wf2_yr.1.t:0 "Silt and Torrent: Legacy of Jia Lu's Embankments"
 oe_wf2_yr.1.d:0 "More than a century after Master Jia Lu harnessed the Yellow River in the final decades of the Yuan, relentless loess silt has once again raised the riverbed above the rooftops of Kaifeng and Xuzhou. Hydraulic surveyors warn that unless inner and outer embankments are systematically raised and maintained, the next summer monsoon will send the river smashing into the Grand Canal."
 oe_wf2_yr.1.a:0 "Commit full treasury funds to fortify the Kaifeng and Huai'an levees"
 oe_wf2_yr.1.b:0 "Authorize modest seasonal patching to preserve palace reserves"
 oe_wf2_yr.2.t:0 "Breach at Kaifeng and Xuzhou!"
 oe_wf2_yr.2.d:0 "Summer rains have swollen the Yellow River past its earthen crests, tearing wide breaches near Kaifeng and flooding fields down toward the Huai basin. Magistrates report submerged granaries and stranded tribute barges. Emergency silver and labor can close the gaps before autumn planting—or the court may leave local counties to fend for themselves, risking famine, unrest, and Heaven's stern displeasure."
 oe_wf2_yr.2.a:0 "Release emergency silver and mobilize flood-closure crews immediately"
 oe_wf2_yr.2.b:0 "Defer costly imperial repairs and leave provincial prefects to cope"
 oe_wf2_yr.3.t:0 "The Huai'an Grand Canal Grain Bottleneck"
 oe_wf2_yr.3.d:0 "At Shanyang in Huai'an—the vital throat where the Grand Canal meets the Yellow and Huai Rivers—accumulating silt bars threaten to halt the annual armada of southern grain barges feeding Beijing and the northern frontier garrisons. Establishing and expanding the imperial Grand Canal Huai'an Grain Directorate will secure the lifeline of the entire empire."
 oe_wf2_yr.3.a:0 "Establish and fund the Grand Canal Huai'an Grain Directorate"
 oe_wf2_yr.3.b:0 "Dredge a temporary bypass channel without expanding permanent offices"
 oe_wf2_yr.4.t:0 "Corvee Exhaustion Along the River"
 oe_wf2_yr.4.d:0 "Successive seasons of hauling willow fascines and ramming clay levees have pushed Henan and Jianghuai peasant villages to the brink of exhaustion. Reformist supervisors urge converting traditional unpaid Lijia corvee into silver-paid wage labor hired from landless artisans, easing rural anger while raising engineering discipline."
 oe_wf2_yr.4.a:0 "Transition to silver-paid hydraulic labor guilds"
 oe_wf2_yr.4.b:0 "Enforce traditional Lijia corvee quotas to save treasury silver"
 oe_wf2_yr.5.t:0 "Grand Debate: Divert the Branches or Confine the Channel?"
 oe_wf2_yr.5.d:0 "Two rival schools of hydraulic mastery stand before the throne. Traditionalists advocate digging multiple diversion branches to split floodwaters harmlessly across the plain. Master engineer Pan Jixun argues the opposite: splitting the current slows the water and drops ever more silt; only by confining the Yellow River between tight embankments and releasing clear Huai water from Hongze Lake can the torrent scour its own bed clean to the sea."
 oe_wf2_yr.5.a:0 "Adopt Pan Jixun's 'Confine the Water to Scour the Silt' doctrine"
 oe_wf2_yr.5.b:0 "Favor gentler multi-branch diversions and paid local upkeep"
 oe_wf2_yr.6.t:0 "Pan Jixun's Gaojia Dike & Clear-Huai Scouring Masterwork"
 oe_wf2_yr.6.d:0 "Under the Chief Hydraulic Commissioner's tireless oversight, miles of stone-faced levees rise along Gaojia Dike and the twin embankments of the Yellow River. As clear waters banked in Lake Hongze surge into the confluence at Qingkou, the concentrated torrent scours away decades of suffocating silt, reopening deep channels for the imperial grain fleet."
 oe_wf2_yr.6.a:0 "Institutionalize the Gaojia Dike & Confine-Water hydraulic statute"
 oe_wf2_yr.6.b:0 "Prioritize lock expansions for the Huai'an grain convoy network"
 oe_wf2_yr.7.t:0 "The Tribute Grain Fleet Reaches Tongzhou"
 oe_wf2_yr.7.d:0 "Banners fluttering above thousands of flat-bottomed grain barges signal a triumphant harvest season: our fortified Yellow River dikes held firm against summer floods, and the full annual quota of southern rice and silk has docked safely at Tongzhou outside Beijing. Granaries overflow, grain prices steady across the north, and the court celebrates visible proof of Heaven's favor."
 oe_wf2_yr.7.a:0 "Store the surplus in imperial granaries and celebrate Heaven's favor"
 oe_wf2_yr.7.b:0 "Distribute grain remissions to northern peasant counties"
 oe_wf2_yr.8.t:0 "Neglected Dikes: Heaven's Rebuke on the Central Plain"
 oe_wf2_yr.8.d:0 "Years of underfunded levees and silted canal locks have culminated in a devastating breach across the Central Plain and northern Jiangsu. Starving refugees crowd prefecture gates, tribute barges lie stranded in mudflats, and censors warn that neglecting the river imperils the very Mandate of Heaven. Only immediate, decisive imperial intervention can arrest the spiral."
 oe_wf2_yr.8.a:0 "Overhaul the River Directorate immediately with full imperial funding"
 oe_wf2_yr.8.b:0 "Offer only local relief while accepting the blow to order and Mandate"
 oe_wf2_ref.1.t:0 "Sovereign and Secretariat: Reordering the Imperial Center"
 oe_wf2_ref.1.d:0 "With our new imperial court constitution fully enacted, memorials from the Six Ministries and provincial governors flow through newly forged channels beneath the Dragon Throne. Veteran statesmen ask whether to emphasize austere imperial awe over noble lineages or cultivate harmonious collaboration with the scholar-officials of the Hanlin Academy."
 oe_wf2_ref.1.a:0 "Assert strict imperial authority over court factions and nobles"
 oe_wf2_ref.1.b:0 "Cultivate harmony with the Hanlin Academy and scholar-officials"
 oe_wf2_ref.2.t:0 "Ascent to Mount Tai: The Fengshan Altar"
 oe_wf2_ref.2.d:0 "Escorted by ceremonial banners and tributary delegates, the imperial procession ascends the stone steps of Mount Tai above Qufu. At the summit altar of Heaven and the earthly shrine below, inscribed jade tablets proclaim an era of unified peace and moral legitimacy across all under Heaven."
 oe_wf2_ref.2.a:0 "Perform the full classical Fengshan sacrifice in imperial splendor"
 oe_wf2_ref.2.b:0 "Hold a frugal mountain prayer and remit Shandong peasant taxes"
 oe_wf2_ref.3.t:0 "The Heirloom Seal of Heaven's Mandate"
 oe_wf2_ref.3.d:0 "Before assembled ministers and foreign ambassadors, the Ministry of Rites unveils the venerated Jade Seal of the Celestial Mandate, engraved with classical bird-script characters attesting that the dynasty governs by Heaven's decree. Tributary realms far beyond the passes hasten to renew their patents of investiture."
 oe_wf2_ref.3.a:0 "Enshrine the Jade Seal in the Grand Hall to awe the four quarters"
 oe_wf2_ref.3.b:0 "Dispatch engraved impressions of the Seal to affirm tributary peace"
 oe_wf2_ref.4.t:0 "Salt Vouchers, Tea Caravans, and Imperial Academies"
 oe_wf2_ref.4.d:0 "Our chartered estate institutions are bearing fruit across the empire: licensed salt-and-tea syndicates finance frontier grain deliveries, provincial academies nurture fresh cohorts of degree-holders, and martial examiners drill promising officers. How shall the court channel this rising institutional momentum?"
 oe_wf2_ref.4.a:0 "Expand the Kaizhong salt-and-tea voucher ledgers to swell the fisc"
 oe_wf2_ref.4.b:0 "Channel surplus patronage into academies and officer training"
 oe_wf2_osmanli.1.t:0 "Kayser-i Rum Between Two Romes"
 oe_wf2_osmanli.1.d:0 "From the marble halls of Constantinople to the seven hills of Rome, the banners of the House of Osman now wave over both ancient capitals of the Caesars. Greek scholars, Italian jurists, and Rumelian pashas gather before the Divan with an audacious vision: rather than ruling the western peninsula as a mere border province, proclaim an unprecedented Osmanli Roman synthesis uniting Islamic statecraft with universal Roman legitimacy."
 oe_wf2_osmanli.1.a:0 "Embrace the grand vision of Osmanli Rome across both seas"
 oe_wf2_osmanli.1.b:0 "Rule Italy as a conventional frontier dominion and pocket the tribute"
 oe_wf2_osmanli.2.t:0 "The Phanar, the Capitol, and the Twin Patriarchates"
 oe_wf2_osmanli.2.d:0 "To win lasting allegiance across both the Aegean and the Tyrrhenian shores, our jurists propose an Imperial Charter of Toleration recognizing Ecumenical Orthodox synods in Constantinople alongside autonomous Latin municipal councils in Rome. Such pluralism will bind diverse peoples to the throne, though conservative religious scholars mutter darkly against unprecedented concessions."
 oe_wf2_osmanli.2.a:0 "Proclaim the Twin-Rome Charter of Toleration"
 oe_wf2_osmanli.2.b:0 "Limit concessions to customary dhimmi protections"
 oe_wf2_osmanli.3.t:0 "Kanunname & Corpus Juris: The Bilingual Imperial Divan"
 oe_wf2_osmanli.3.d:0 "Chancery secretaries fluent in Ottoman Turkish, Greek, and Latin lay side by side the Sultan's Kanunname decrees and Justinian's Corpus Juris Civilis. By harmonizing cadastral tax rolls, maritime law, and provincial appeals into a single imperial code administered by a bilingual Divan, the Porte can govern an empire spanning the Danube, Nile, and Tiber with unmatched cohesion."
 oe_wf2_osmanli.3.a:0 "Harmonize Kanunname and Roman law under a Bilingual Imperial Divan"
 oe_wf2_osmanli.3.b:0 "Preserve separate provincial courts to avoid administrative upheaval"
 oe_wf2_osmanli.4.t:0 "The Imperial Varangian-Janissary Guard"
 oe_wf2_osmanli.4.d:0 "Commanders in Rumelia and Italy propose pairing the disciplined firepower of our household infantry with Mediterranean naval arsenals and cosmopolitan officer corps drawn from Balkans, Anatolia, and Italian ports—forging a truly imperial guard worthy of the dual capitals."
 oe_wf2_osmanli.4.a:0 "Commission the joint Imperial Guard & Mediterranean Arsenal reforms"
 oe_wf2_osmanli.4.b:0 "Prioritize frontier garrison reserves and fiscal restraint"
 oe_wf2_osmanli.5.t:0 "Embassies of a Restored Mediterranean Order"
 oe_wf2_osmanli.5.d:0 "Across Christendom and the Islamic world alike, foreign chancelleries scramble to comprehend an empire that issues imperial rescripts in both Istanbul and Rome, protects Mediterranean trade lanes, and styles its sovereign Kayser-i Rum without erasing the civic heritage of either capital. Envoys flock to our twin courts seeking treaties and commercial charters."
 oe_wf2_osmanli.5.a:0 "Receive the embassies in imperial majesty as arbiter of the Mediterranean"
 oe_wf2_osmanli.5.b:0 "Leverage our diplomatic ascendancy for favorable customs tributes"
 oe_wf2_osmanli.6.t:0 "Crown of Osmanli Rome"
 oe_wf2_osmanli.6.d:0 "Beneath gilded mosaics in Constantinople and marble colonnades in Rome, heralds proclaim the culmination of our pluralistic imperial synthesis: Osmanli Rome stands restored from the Tigris to the Tiber. Though purists grumble at the audacity of this fusion and imperial pageantry strains the fisc, a new Mediterranean Rome endures under the crescent and imperial eagle."
 oe_wf2_osmanli.6.a:0 "Assume the Crown of Osmanli Rome (Kayser-i Rum)"
 oe_wf2_osmanli.6.b:0 "Celebrate a measured civic concord without new imperial titles"
