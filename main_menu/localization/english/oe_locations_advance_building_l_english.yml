 oe_byz_org_build_roman_bank_action_I: "Issue Ten-Year Government Bonds"
 oe_byz_org_build_roman_bank_action_I_desc: "As our financial sector matures and after the recovery of Rome, investor confidence in our country is also growing."
 oe_byz_org_build_roman_bank_action_II: "Purchase Debt Claims"
 oe_byz_org_build_roman_bank_action_II_desc: "Debt claims are also tradable assets. Our country will identify and acquire some high-quality claims."
 oe_byz_org_build_roman_bank_action_II_tt: "Acquire the target claim at its principal price."
 oe_byz_selcet_oe_byz_org_build_roman_bank_action_II: "Select Country to Acquire Debt Claims From"
 oe_byz_selcet_oe_byz_org_build_roman_bank_action_II_II: "Select Debt Claim to Acquire"
 oe_byz_bank_org_selection_desc: "The Emperor holds the sole vote and has absolute power in deciding the position of Bureau Director-General. If we do not vote, the Empire will temporarily manage the Bureau."
 oe_byz_bank_org_selection: "Emperor's Appointment"
 OE_BANK_ORG_LAWS: "Financial Regulations"
 oe_org_law_save_money: "Savings Law"
 oe_org_law_save_money_desc: "Depositing and withdrawing money are the most basic functions of banking, determining the primary source of funds for the financial industry."
 oe_org_law_save_money_I: "Charge Management Fees"
 oe_org_law_save_money_I_desc: "Early bank savings not only yielded no interest but also incurred fees charged to customers for providing a secure place to store money."
 oe_org_law_save_money_I_tri_tt_III: "Is [GetCountry('BYZ').GetName]"
 oe_org_law_save_money_I_tri_tt_II: "Is #bold #color_yellow a Regular Member#!#!"
 oe_org_law_save_money_I_tri_tt_I: "Is #bold #color_yellow the Bureau Headquarters Bank#!#!"
 oe_org_law_save_money_II: "Fixed-Term Interest"
 oe_org_law_save_money_II_desc: "With the progress of our financial industry, savings are no longer seen merely as burdens to be safeguarded, but as sources of wealth that generate more income. Due to the long investment cycles in various industries, we now only offer stable interest on large, fixed-term deposits."
 oe_org_law_save_money_III: "Demand Deposit Interest"
 oe_org_law_save_money_III_desc: "Due to greatly increased liquidity, our banks can now offer interest on demand deposits that can be withdrawn at any time. This, in turn, attracts a large number of deposits from the citizenry and commoners."
 oe_org_law_paper_set_money: "Bill of Exchange"
 oe_org_law_paper_set_money_desc: "A bill of exchange is similar to a check. The user can exchange it for an equivalent amount of currency at a bank. In the Eastern Mediterranean, it is commonly used in large-scale international trade transactions."
 oe_org_law_paper_set_money_I: "Assorted Bills of Exchange"
 oe_org_law_paper_set_money_I_desc: "Each of the empire's chartered banks has its own exclusive bills, leading to chaotic management and incompatibility between different banks."
 oe_org_law_paper_set_money_II: "Purple Bill of Exchange"
 oe_org_law_paper_set_money_II_desc: "Bills printed directly by the imperial government, known as 'Purple Bills' for their distinctive color, are accepted by all official institutions and chartered banks under the empire."
 oe_org_law_paper_protect_money: "Insurance Law"
 oe_org_law_paper_protect_money_desc: "The insurance system is one of the most fundamental services of the financial industry, providing risk hedging for insured projects."
 oe_org_law_paper_protect_money_I: "Marine Insurance"
 oe_org_law_paper_protect_money_I_desc: "Before a voyage, merchants sign a loan contract with a capital provider (an early underwriter). If the ship arrives safely, the borrower repays the principal and a high 'interest'; if the ship is lost, the loan is forgiven. This is essentially a form of risk betting agreement, a prototype of insurance."
 oe_org_law_paper_protect_money_II: "Life Insurance"
 oe_org_law_paper_protect_money_II_desc: "In the 17th century, mathematicians began studying mortality rates. A milestone was the first life table compiled by astronomer Edmond Halley in 1693 based on data from the city of Breslau, revealing the mathematical relationship between age and mortality."
 oe_org_law_protect_money_III: "Insurance Law"
 oe_org_law_protect_money_III_desc: "The professional profession of 'actuary' emerged. They used increasingly precise mortality tables, probability theory, and compound interest mathematics to make the pricing of insurance products and the calculation of reserves highly scientific. Governments also began to intervene in regulation, formulating standards for insurance company solvency and operational norms to protect policyholders' interests."
 oe_sub_unit_tra_soldier: "Theme Foot Soldier"
 oe_sub_unit_tra_soldier_desc: "Local regular troops trained by the theme governor."
 oe_sub_unit_rena_soldier: "Imperial Foot Soldier"
 oe_sub_unit_rena_soldier_desc: "Local regular troops trained according to unified imperial standards."
 oe_sub_unit_dis_soldier: "Phalanx Foot Soldier"
 oe_sub_unit_dis_soldier_desc: "These well-trained infantrymen fight using tactical phalanxes."
 oe_sub_unit_ref_soldier: "Theme Arquebusier"
 oe_sub_unit_ref_soldier_desc: "These infantrymen are trained by the theme and equipped with powerful arquebuses."
 oe_sub_unit_abs_soldier: "Theme Musketeer"
 oe_sub_unit_abs_soldier_desc: "These infantrymen are trained by the theme and equipped with powerful flintlock muskets."
 oe_sub_unit_rev_soldier: "Imperial Infantry"
 oe_sub_unit_rev_soldier_desc: "These infantrymen fully meet the empire's military standards."
 oe_byz_king_army_I: "Palace Guard"
 oe_byz_king_army_I_desc: "This army has the finest equipment in the nation. It is responsible for both the emperor's safety and faithfully executing his orders.\n\n#Y Era Upgrade Path:#! Next tier unlocks automatically via the vanilla military advance #Y Pike and Shot#! (full chain: Pike and Shot -> Siege Artillery -> Military Revolution -> Levée en Masse); upgrade directly in the army panel once researched."
 oe_byz_king_army_I_unlock: "Palace Guard"
 oe_byz_king_army_I_unlock_desc: "Duties are not limited to security; they often undertake special missions such as diplomatic escort, military supervision, and secret arrests."
 phoenix_nirvana_is_end: "Completed Action 'Imperial Supremacy'"
 john_war.6.t: "The Hesychast Controversy"
 john_war.6.d: "Hesychasm is a mystical ascetic practice rooted in early Christianity, particularly prevalent among the monks of Mount Athos. Its core involves repeating the 'Jesus Prayer' and controlling breathing to achieve a state of inner stillness, ultimately aiming to witness the 'Uncreated Light'. This drew opposition from [GetCharacter('byz_barlaam_of_seminara').GetName], a Greek-rite monk from Calabria deeply influenced by Western Scholasticism. He wrote a series of treatises attacking the methods and theology of the Hesychasts, especially ridiculing their doctrine of the 'Uncreated Light', sparking a protracted and intense debate among the clergy."
 john_war.6.a: "Why all this incessant quarreling...?"
 john_war.2.t: "Barlaam Publicly Denounces Hesychasm"
 john_war.2.d: "During a church event, [GetCharacter('byz_barlaam_of_seminara').GetName] publicly denounced the practices of the Hesychast monks during a sermon as 'witchcraft', arguing that the 'divine light' they claimed to see could only be a created symbol, not God's own energy. He maintained that man cannot directly participate in or experience God's essence."
 john_war.2.a: "Well said!"
 john_war.2.b: "A lost lamb..."
 john_war.3.t: "Hesychasts Counter Barlaam"
 john_war.3.d: "Facing the challenges from Barlaam and his supporters, the 'rationalists', the leader of the Hesychasts, [GetCharacter('byz_gregory_palamas').GetName], defended their position using the distinction between 'essence' and 'energies': God's essence is absolutely unknowable and unparticipable; but God's energies (such as grace, glory, light) are uncreated, real manifestations of God Himself to the world, and man can unite with them. This concerns the possibility of man's true 'theosis' (deification) and the mode of God's communication with the world."
 john_war.3.a: "Well said!"
 john_war.3.b: "A lost lamb..."
 john_war.4.t: "Citizens Sympathize with the Hesychasts"
 john_war.4.d: "Due to simple nationalist sentiments and the influence of sermons by lower clergy, our citizenry is full of sympathy for the Hesychasts. They often express support for them on multiple occasions and even harass clergy who oppose Hesychasm."
 john_war.4.a: "We support them."
 john_war.4.b: "We are God's shepherds."
 john_war.5.t: "Rationalists Support Barlaam"
 john_war.5.d: "Many clergy in the intellectual circles and higher church hierarchy of Constantinople who were trained in classical philosophy (later called 'rationalists') expressed sympathy for Barlaam. Figures like Gregory Akindynos (a teacher of court rhetoric) and Nikephoros Gregoras (a renowned scholar) used their influence to strongly support Barlaam's views."
 john_war.5.a: "These men are truly pillars of the state."
 john_war.5.b: "These men are truly lawless."
 john_war_work_religion_sup_work: "Defense of the Holy Hesychasts"
 john_war.7.t: "Defense of the Holy Hesychasts"
 john_war.7.d: "In response to the rationalists' challenges, Palamas quickly wrote works such as the 'Defense of the Holy Hesychasts' to counter them. He systematically expounded the theological distinction between 'essence' and 'energies', grounding it in the patristic tradition (especially the Cappadocian Fathers like Basil the Great and Gregory of Nazianzus)."
 john_war.7.a: "Makes sense..."
 john_war.8.t: "The Council of Constantinople in 1341"
 john_war.8.d: "The council convened in June 1341 in Hagia Sophia, presided over by [ROOT.GetCountry.GetGovernment.GetRuler.GetName] and Patriarch John XIV Kalekas. It examined the theological claims of both sides, and debates began. Kantakouzenos himself sympathized with the Hesychasts, while Patriarch Kalekas tentatively expressed support for Barlaam's ideas."
 john_war.8.a: "The Emperor heeds Kantakouzenos' opinion."
 john_war.8.b: "The Emperor heeds Kalekas' opinion."
 john_war_8_b_tt: "Hesychast leader Palamas will be forced into seclusion."
 john_war_7_has_on: "The work 'Defense of the Holy Hesychasts' exists."
 destroy_latin_building: "Forcibly Reclaim Genoese Mines"
 destroy_latin_building_desc: "Having driven back the Genoese in the Aegean, we finally have the opportunity to reclaim our sovereign mines."
 navy_control_island: "Recover Aegean Islands"
 navy_control_island_desc: "Drive the enemy from our sea!"
 oe_byz_rebuild_empire_navy: "Rebuild Naval Superiority"
 oe_byz_rebuild_empire_navy_desc: "Due to Andronikos II's folly, our naval superiority vanished. Rebuilding the imperial navy almost from scratch was an extremely arduous process, but we have done it. We now possess naval superiority over the Latins."
