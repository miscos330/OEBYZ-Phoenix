 oe_byz_policy_org_leader_tt_desc: "#bold Imperial Praetorian Consistorium (Sacrum Consistorium)#!\nChartered Prefectures: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_prf_active_prefectures')|0]#! / 4  Organized Dioceses: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_prf_active_dioceses')|0]#! / 12\nMonthly Imperial Strain Relief: #G [GetCountry('BYZ').MakeScope.ScriptValue('oe_prf_strain_relief')|2]#!\nSenatorial Civil charters strengthen revenue and strain relief, while Imperial Military and Foederati charters fortify frontiers and levies — each carries real trade-offs."
 oe_byz_policy_org_leader_tt_tit: "Praetorian Consistorium"
 oe_byz_change_dynasty_to_crown: "Crown Co-Emperor"
 oe_byz_change_dynasty_to_crown_desc_specific: "Crown this character Co-Emperor, sharing imperial authority and strengthening their claim to the throne. Candidates must be dynastic descendants of the ruler or hold the title of Caesar. Domestic characters and rulers of all theme types are eligible; only one Co-Emperor may serve at a time."
 oe_byz_change_dynasty_to_crown_concept: "#bold #color_yellow Imperial Prerogative Action#!#!"
 oe_byz_change_dynasty_to_crown_act_past: "This character has been selected as Co-Emperor."
 oe_rr_build_policy_org: "Revival of the Imperial Administrative System"
 oe_rr_build_policy_org_desc: "On the path of reconquest, an imperial administrative system as glorious and efficient as in the past is essential."
 oe_rr_build_policy_org_tt: "Create International Organization 'Imperial Administrative System'"
 oe_real_gov_elect: "Bureaucratic Promotion"
 oe_real_gov_elect_desc: "Like most administrative institutions in the world, imperial bureaucrats are mainly promoted based on seniority and ability, unless patronized by important figures."
 oe_byz_elect: "Eastern Roman Succession Law"
 oe_byz_elect_desc: "The succession law of the Eastern Roman Empire was a complex and flexible unwritten system, blending Roman legal principles, Christian theocratic concepts, military realities, and political traditions. Its core feature was the dynamic balance sought between 'hereditary legitimacy' and the 'principle of capability'."
