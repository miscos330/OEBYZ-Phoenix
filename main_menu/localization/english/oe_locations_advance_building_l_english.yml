 oe_create_theme: "Create Imperial Theme"
 oe_create_theme_desc: "Issue a Theme charter for a historical theme, placing its jurisdiction under a strategos. Highlighted provinces hold the centre of a theme you can found: you must own the #Y historical theme#!'s centre and at least half of its locations; the capital district never becomes a theme. Outside the historical themes, the Balkans, Anatolia, the Armenian Highlands, Wallachia and the Levant still use the area rule. The jurisdiction will provide its own troops instead of #Y levies#! to the central government.\n\nCosts #Y 5 Authority#!; no Public Opinion or Privy Purse gold." # FIX 2026-11-17 theme-rework
 oe_create_theme_tt: "Create Imperial Theme"
 oe_flavor_byz.600.t: "Kantakouzenos Dies"
 oe_flavor_byz.600.d: "Kantakouzenos served as Andronikos III's chief minister, responsible for formulating domestic and foreign policy, overseeing the imperial navy's shipbuilding program, and leading armies against Serbs and Epirotes, achieving countless victories. He was also an energetic literary figure, writing many works that were passed down to later generations. People's reactions to Kantakouzenos's death were mixed. Some saw him as a hero who could have saved the empire, while others viewed him as a despicable schemer for power. Regardless, we should give him a grand burial befitting a noble."
 oe_flavor_byz.600.a: "Let the past be past."
 oe_byz_john_war_noble: "Favor the Military Aristocracy"
 oe_byz_john_war_noble_desc: "The local military magnates are a crucial pillar of our regime. Let us gain their loyalty by granting these nobles more honors and rights."
# PAUSED:  oe_byz_john_war_gov: "Favor the Court Ministers"
# PAUSED:  oe_byz_john_war_gov_desc: "The capable ministers and officials of Constantinople have always been important aides in governing the country. Let us strengthen the rights of the court ministers to facilitate their work."
 oe_byz_john_war_clergy: "Suppress the Hesychast Controversy"
 oe_byz_john_war_clergy_desc: "We have noted the spillover effect of the Hesychast controversy. This originally academic theological debate has now spread widely throughout our society, stirring up significant social division. Let us use our central authority to make the two quarreling factions mind their language and calm the disputes among the populace."
 oe_byz_john_war_clergy_tt: "Reduce Class Antagonism by 3 points."
 oe_byz_john_war_noble_tt: "Increase Class Antagonism by 1 point, increase Military-Aristocratic Faction by 2 points."
# PAUSED:  oe_byz_john_war_gov_tt: "Increase Class Antagonism by 1 point, increase Bureaucratic Faction by 2 points."
 oe_byz_john_war_noble_manpower: "Order Nobles to Enlist Troops"
 oe_byz_john_war_noble_manpower_desc: "We will order local nobles to intensify recruitment efforts, providing the center with more available manpower. (This will increase the Aristocratic Faction by 2 points and Class Antagonism by 1 point.)"
