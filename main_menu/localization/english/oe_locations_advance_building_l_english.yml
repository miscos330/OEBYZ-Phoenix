 a_oe_byz_tur_heavy_cavalry: "Rûm Cataphracts"
 a_oe_byz_tur_heavy_cavalry_desc: "Rûm Cataphracts are primarily drawn from Sipahi cavalry who received land through the Timar system. After reconquering Asia Minor, we have respected their income from the land to a certain extent, in exchange for these fierce cavalrymen fighting for us."
 a_oe_byz_tur_light_cavalry: "Turkic Light Cavalry"
 a_oe_byz_tur_light_cavalry_desc: "The Turks living on the Anatolian plateau are born horsemen, perfect sources for harassment and reconnaissance cavalry."
 a_oe_byz_albania: "Albanian Mountain Companies"
 a_oe_byz_albania_desc: "The Albanian highlanders are naturally familiar with mountain warfare, fighting fiercely and tenaciously, often able to defeat powerful enemies in their area of expertise."
 a_oe_byz_discovery_artillery: "Roman Breachers"
 a_oe_byz_discovery_artillery_desc: "We are one of the first countries in the world to develop artillery technology. A highly specialized artillery corps will help us prevail in war."
 a_oe_byz_tur_heavy_cavalry_unlock: "Enlist Rûm Cavalry"
 a_oe_byz_tur_heavy_cavalry_unlock_desc: "The Rûm are excellent riders; they should be enlisted into our army."
 a_oe_byz_albania_unlock: "Albanian Levies"
 a_oe_byz_albania_unlock_desc: "Albanians are adapted to mountain warfare and can be used as special forces in complex battlefield situations."
