 oe_walk_for_religion_yelusa_law: "Jerusalem Pilgrimage Law"
 oe_walk_for_religion_yelusa_law_desc: "We control the holy city of Jerusalem, sacred to three religions. Countless devout believers come here on pilgrimage every year."
 yelusa_allow_everyone_policy: "Allow Pilgrimage for All Believers"
 yelusa_allow_everyone_policy_desc: "Everyone has the right to prove their devotion to God."
 yelusa_forbid_muslin_policy: "Forbid Infidel Pilgrimage"
 yelusa_forbid_muslin_policy_desc: "The meaning of liberating Jerusalem is to free her from the defilement of infidels."
 yelusa_forbid_enemy_policy: "Forbid Heretic and Infidel Pilgrimage"
 yelusa_forbid_enemy_policy_desc: "Only those who believe in the one true faith are permitted near this holy city."
 yelusa_for_money_policy: "Charge Pilgrimage Fees"
 yelusa_for_money_policy_desc: "We don't care what people believe; as long as they pay, it's God."
 yelusa_allow_byz_policy: "Jerusalem Patriarchate"
 yelusa_allow_byz_policy_desc: "The Roman Empire's administration of Jerusalem has a long history, and many Roman-built structures still remain in the city. The Patriarchate allows pilgrimage for all believers."
 oe_walk_for_religion_maika_law: "Guardian of the Two Holy Cities"
 oe_walk_for_religion_maika_law_desc: "The two holy cities of the Islamic world, Mecca and Medina, are now under our control."
 maika_allow_everyone_policy: "Allow Muslim Pilgrimage (Hajj)"
 maika_allow_everyone_policy_desc: "This action not only greatly appeases Muslims within the country but also generates considerable tax revenue from pilgrimage activities."
 maika_forbid_muslin_policy: "Close Down Hajj Activities"
 maika_forbid_muslin_policy_desc: "Although Muslims are still permitted to enter Mecca, the annual Hajj activities assisted by the state will cease."
 maika_forbid_byz_policy: "Kaaba Church"
 maika_forbid_byz_policy_desc: "The Romans will convert the Kaaba Mosque into a church. The Kaaba itself will be transported and displayed in the Great Hippodrome of Constantinople. Crosses will be erected in the Prophet's Mosque."
