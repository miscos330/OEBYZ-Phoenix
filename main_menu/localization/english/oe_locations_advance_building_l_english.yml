 OE_BYZ_GUI_ROMEIII: "#bold #R A pillar amidst the raging waves, a sage's toil turns back the foe a thousand miles:#!#!\n#color_yellow #bold Ruling Dynasty: #!#![GetCountry('BYZ').GetGovernment.GetRuler.GetDynasty.GetName]\n$oe_byz_nobleI_reformmm_var$: $oe_byz_nobleI_refor_counter$/3"
# PAUSED:  OE_BYZ_GUI_ROMEIV: "#bold #R Li Si, the Qin chancellor, died in prison; Zhao Gao's towers crumbled to ruins#!#!\n#bold #color_yellow Balance of Power:#!#! $oe_byz_nobleIII_reformmm_var$: $oe_byz_nobleIII_refor_counter$#bold #R / #!#!$oe_byz_nobleIV_reformmm_var$: $oe_byz_nobleIV_refor_counter$\n#bold #color_yellow Popular Support:#!#! $oe_byz_nobleV_reformmm_var$: $oe_byz_nobleV_refor_counter$\nWhen Andronikos dies, if the military-aristocratic faction's power exceeds the bureaucratic faction by more than $oe_byz_nobleV_reformmm_var$, then [GetCountry('BBY').GetGovernment.GetRuler.GetName] will successfully seize control of #bold #color_yellow Constantinople#!#! and be crowned co-emperor. If the bureaucratic faction's power exceeds the military-aristocratic faction by more than $oe_byz_nobleV_reformmm_var$, then [GetCountry('BBY').GetGovernment.GetRuler.GetName] will be forced to surrender military command and submit to the central government. If neither condition is met, we will descend into #bold #R civil war!#!#!"
 phoenix_nirvana.301.t: "Investigate the Lawless Acts of the Magnates"
 phoenix_nirvana.301.d: "Although the pronoia system grants magnates personal control over the peasants on their lands, this does not mean they can treat imperial law as nothing, do whatever they want to their peasants, or defy central authority. We will send special ad hoc judges to various places to hear peasant grievances, review injustices, and strike down a few of the most egregious local magnates as a warning to others."
 phoenix_nirvana.301.a: "Strict Enforcement of the Law!"
 phoenix_nirvana.301.b: "The empire needs to rely on these local magnates; let's just go through the motions."
 STATIC_MODIFIER_NAME_phoenix_nirvana_301_a_mod: "Local Magnates Discontent"
 STATIC_MODIFIER_NAME_phoenix_nirvana_301_b_mod: "Support from Local Magnates"
 STATIC_MODIFIER_NAME_phoenix_nirvana_301_aa_mod: "Peasants Grateful for Imperial Grace"
 phoenix_nirvana.302.t: "Clarify Taxation"
 phoenix_nirvana.302.d: "No one likes paying taxes, especially those wealthy rural landowners and officials at all levels. They seem to have devoted all their ingenuity to tax evasion activities; concealing landholdings and embezzling tax revenues are commonplace for them. The emperor has ordered the formation of an investigative commission to scrutinize the underreporting at every level of imperial taxation. We intend to severely punish some of the worst offenders to deter all the petty cheaters."
 phoenix_nirvana.302.a: "The law is merciless; we are impartial."
 phoenix_nirvana.302.b: "We cannot be bound by legal provisions; we will spare those factions loyal to us."
 STATIC_MODIFIER_NAME_phoenix_nirvana_302_a_mod: "Impartial Justice"
 STATIC_MODIFIER_NAME_phoenix_nirvana_302_b_mod: "Strike at Dissidents"
 flavor_byz_3_on: "Nicaean Coast Recovered"
 STATIC_MODIFIER_NAME_phoenix_nirvana_303_a_mod: "Stagnant Pool"
 phoenix_nirvana.303.t: "Fickle Policies"
 phoenix_nirvana.303.d: "We have made too many #R concessions#! to the local magnates who undermine our authority and to the bureaucrats at all levels who pay lip service, causing all our efforts to restore local control to become mere formalities. In the foreseeable future, the local situation in the empire will continue to degenerate like a #R stagnant pool#! until a new conqueror arrives."
 phoenix_nirvana.303.a: "So be it."
 phoenix_nirvana_304_on: "Rural Control Largely Restored"
 phoenix_nirvana_305_on: "Undisputed Authority Returns"
 phoenix_nirvana.304.t: "Rural Control Restored"
 phoenix_nirvana.304.d: "In the face of military defeats and internal divisions throughout the 13th century, the empire's control over the countryside once hit rock bottom. Our prosperous villages became a lawless world for local magnates and a breeding ground for #R conspirators and rebels#!. Under the wise leadership of [ROOT.GetCountry.GetGovernment.GetRulerTitle], we have halted this decline and improved the situation to some extent."
 phoenix_nirvana.304.a: "We will continue to advance."
 phoenix_nirvana.305.t: "Central Authority Returns"
 phoenix_nirvana.305.d: "In the face of military defeats and internal divisions throughout the 13th century, the empire's control over the countryside once hit rock bottom. Our prosperous villages became a lawless world for local magnates and a breeding ground for #R conspirators and rebels#!. Through a series of forceful centralization measures, this phenomenon has finally been curbed. [ROOT.GetCountry.GetGovernment.GetRuler.GetName] has declared that the deterioration of the situation in the countryside has been reversed and will continue to improve."
 phoenix_nirvana.305.a: "Reverse the Course of Events"
 STATIC_MODIFIER_NAME_phoenix_nirvana_305_a_mod: "Dawn of the Palaiologan Restoration"
