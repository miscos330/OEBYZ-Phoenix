 oe_byz_rebuild_empire_navy_tt: "Unlock Naval Capability: #G Recover the Aegean Islands#!"
 oe_byz_reown_aegean: "Restore the Aegean Sea"
 oe_byz_reown_aegean_desc: "The ancient Aegean Sea witnessed Jason and the Argonauts sailing in search of the Golden Fleece, and watched over Alexander as he marched east from Macedonia. Amidst the passing tides of history, Rome has been its longest ruler. Beneath the blue skies and azure waters, we have never left."
