 oe_byz_bank: "Bank"
 oe_byz_bank_desc: "This building is a center of financial activity, handling deposits, loans, government bond issuance, bill exchange, financial investments, and other operations."
 oe_byz_bank_org_selection_has_over: "The Emperor Has Decided on the Bank President"
 oe_byz_create_bank_org_over: "Imperial Banking Supervision Bureau Established"
 oe_byz_create_bank_org_over_tt: "We will create the #G International Organization#! 'Imperial Banking Supervision Bureau'."
 oe_byz_create_bank_org: "Create Imperial Banking Supervision Bureau"
 oe_byz_create_bank_org_desc: "We have noted some developments in the imperial financial sector. Let us bring them under the empire's management."
 oe_byz_bank_org: "Imperial Banking Supervision Bureau"
 oe_byz_bank_org_desc: "This organization is responsible for managing all banks operating within the empire and reports directly to the emperor."
 oe_byz_bank_org_leader_tt_tit: "Duties of the Imperial Banking Supervision Bureau"
 oe_byz_bank_org_leader_tt_desc: "The Imperial Banking Supervision Bureau is a powerful tool for [GetCountry('BYZ').GetName] to macro-control the domestic economy.\nThe Imperial Banking Supervision Bureau is not run directly by the empire's ruler, but by its Director-General, who is appointed solely by the emperor's decree and chosen from among the presidents of the imperial banks.\nThe Director-General's character attributes provide the following #G modifiers#!:\n#bold #color_yellow Administration 100#!#!: Tax Efficiency +10%\n#bold #color_yellow Diplomacy 100#!#!: Bank Interest Rate -2%\n#bold #color_yellow Military 100#!#!: Loan Capacity +20%"
 oe_byz_bank_org_leader_name: "Director-General of the Bureau"
 oe_byz_org_rebuy_money: "Withdraw Currency from Circulation"
 oe_byz_org_rebuy_money_desc: "Our excessive money issuance has caused persistently high inflation. Let us import a batch of basic goods in the government's name and sell them to stabilize prices, while withdrawing the excess currency circulating in society back to the treasury, reducing liquidity."
 oe_byz_org_build_saisa_bank_over: "Thessaloniki Mint Bank Established"
 TSBK: "Thessaloniki Mint"
 oe_byz_org_build_saisa_bank: "Establish the Thessaloniki Chartered Mint Bank"
 oe_byz_org_build_saisa_bank_desc: "One of the empire's largest mints is located in Thessaloniki. Let us establish a state bank with minting privileges, guaranteed by the flourishing local minting business."
 oe_byz_org_build_saisa_bank_tt: "We will create a new bank building nation in Thessaloniki."
 oe_byz_bank_org_big_bank_pay: "Bureau Charges Fees to Subordinate Banks"
 oe_byz_bank_org_big_bank_pay_desc: "The Bureau has the authority to charge fees to all banks under its jurisdiction."
 oe_byz_bank_org_leader_pay: "Bureau Pays Fees to the Empire"
 oe_byz_bank_org_leader_pay_desc: "All banks within the empire should pay a portion of their income to the central government."
 oe_bank_org_byz: "Imperial Center"
 oe_bank_org_byz_desc: "This member is the central government of the Eastern Roman Empire and holds absolute power over the Bureau."
 oe_bank_org_big_bank: "Bureau Headquarters Bank"
 oe_bank_org_big_bank_desc: "This member is the imperial chartered bank appointed by the emperor, responsible for the normal operations of the Bureau."
 oe_byz_org_tuozhan_bank: "Encourage Branch Establishment"
 oe_byz_org_tuozhan_bank_desc: "We should help subordinate banks establish branches to generate more profit."
 oe_byz_org_tuozhan_bank_tt: "We will spend 300 gold to help the selected bank establish a branch in a specific location."
 oe_byz_bank_choose_location: "Choose City to Establish Branch"
 oe_byz_selcet_bank_country_non: "@trigger_no! No valid target found."
 oe_byz_selcet_bank_country: "Select Imperial Bank to Assist"
 oe_byz_org_build_genoa_bank: "Take Over Genoese Bank of San Giorgio"
 oe_byz_org_build_genoa_bank_desc: "Genoa has a prosperous and mature financial industry. Let us directly take over their original central bank."
 oe_byz_org_build_genoa_bank_over: "Genoese Bank of San Giorgio Established"
 oe_byz_org_build_genoa_bank_tt: "We will create a new bank building nation in Genoa."
 GEBK: "San Giorgio"
 oe_byz_org_build_ven_bank: "Take Over Venetian Public Bank"
 oe_byz_org_build_ven_bank_desc: "Having avenged the wrong of 1204, we have not forgotten that Venice was once an extremely prosperous commercial state. Let us rebuild the economy on the ruins of Venice."
 oe_byz_org_build_ven_bank_over: "Venetian Public Bank Established"
 oe_byz_org_build_ven_bank_tt: "We will create a new bank building nation in Venice."
 VEBK: "Venetian Public"
 oe_byz_org_build_annatolia_bank: "Establish the Anatolian Agricultural Bank"
 oe_byz_org_build_annatolia_bank_desc: "Anatolia has possessed immense agricultural potential since ancient times. After expelling the Turks, we must rebuild it into a land flowing with milk and honey. A bank focused on investing in the Anatolian agricultural sector will achieve mutual success with Asia Minor."
 oe_byz_org_build_annatolia_bank_over: "Anatolian Agricultural Bank Established"
 oe_byz_org_build_annatolia_bank_tt: "We will create a new bank building nation in Ankara."
 ATBK: "Anatolian Agricultural"
 oe_byz_org_build_diodro_bank: "Establish the Black Sea Bank"
 oe_byz_org_build_diodro_bank_desc: "The Crimean Peninsula is known as the pearl of the Black Sea, involved in the prosperous Black Sea trade. This bank, with its headquarters across the Black Sea, will be deeply intertwined with Black Sea commerce and will deal with Slavs and Tatars on our behalf."
 oe_byz_org_build_diodro_bank_over: "Black Sea Bank Established"
 oe_byz_org_build_diodro_bank_tt: "We will create a new bank building nation in Theodoro."
 DOBK: "Black Sea"
 oe_byz_org_build_ath_bank: "Establish the Athenian Press Bank"
 oe_byz_org_build_ath_bank_desc: "The invention of the printing press has blown winds of change through our country. Our burgeoning printing, education, journalism, and academic sectors have given rise to this bank, which focuses on investing in the cultural industry."
 oe_byz_org_build_ath_bank_over: "Athenian Press Bank Established"
 oe_byz_org_build_ath_bank_tt: "We will create a new bank building nation in Athens."
 YDBK: "Athenian Press"
 oe_byz_org_build_lifant_bank: "Establish the Levantine Commercial Bank"
 oe_byz_org_build_lifant_bank_desc: "The Levant region has been a hub for merchants since ancient times. The long-term nature and high risk of international caravan trade naturally require banks to provide insurance services, yet the local financial industry has stagnated due to the constraints of Islamic law."
 oe_byz_org_build_lifant_bank_over: "Levantine Commercial Bank Established"
 oe_byz_org_build_lifant_bank_tt: "We will create a new bank building nation in Lebanon."
 LFBK: "Levantine Commercial"
 oe_byz_org_build_egypt_bank: "Establish the Nile Bank"
 oe_byz_org_build_egypt_bank_desc: "After a thousand years, our country has finally returned to the beautiful and fertile region of Egypt. Let us establish a state bank with deep official backing in the port of Alexandria."
 oe_byz_org_build_egypt_bank_over: "Nile Bank Established"
 oe_byz_org_build_egypt_bank_tt: "We will create a new bank building nation in Alexandria."
 EGBK: "Nile"
 oe_byz_org_build_roman_bank: "Establish the Roman Central Bank"
 oe_byz_org_build_roman_bank_desc: "If asked which city's importance rivals Constantinople in our hearts, it must be Rome. The financial headquarters in Rome are established at the highest level, holding a special, transcendent status among all banks."
 oe_byz_org_build_roman_bank_over: "Roman Central Bank Established"
 oe_byz_org_build_roman_bank_tt: "We will create a new bank building nation in Rome."
 ROBK: "Roman Central"
 oe_byz_org_build_nor_afrac_bank: "Establish the Bank of Carthage"
 oe_byz_org_build_nor_afrac_bank_desc: "Compared to classical times, North Africa today is utterly transformed, yet our beloved ancient land of Carthage remains a good place for trade."
 oe_byz_org_build_nor_afrac_bank_over: "Bank of Carthage Established"
 oe_byz_org_build_nor_afrac_bank_tt: "We will create a new bank building nation in Tunis."
 NFBK: "Carthage"
 oe_byz_org_build_sisic_bank: "Establish the Sicilian Mining Bank"
 oe_byz_org_build_sisic_bank_desc: "Sicily was once our important agricultural province, but is now also renowned for its extraordinary mining potential. Its sulfur mines supply our crucial gunpowder production."
 oe_byz_org_build_sisic_bank_over: "Sicilian Mining Bank Established"
 oe_byz_org_build_sisic_bank_tt: "We will create a new bank building nation in Palermo."
 SSBK: "Sicilian Mining"
 oe_byz_org_money_king_face: "Issue Coinage with Monarch's Portrait"
 oe_byz_org_money_king_face_desc: "Engraving an exquisite portrait of the monarch on coinage constantly reminds subjects of their loyalty and strengthens the government's legitimacy."
 oe_byz_ed_own_whole_east_trade: "Eastern Trade Hegemony"
 oe_byz_ed_own_whole_east_trade_desc: "From [ShowLocationName('constantinople')] to [ShowLocationName('alexandria')], from the grasslands of the Black Sea coast to the deserts of the Red Sea coast, only one voice remains. Our country has monopolized all major routes of Eastern trade. No country can continue operating this Eastern trade route against our will. Let us declare Eastern Trade Hegemony and tame this path of wealth."
 oe_byz_ed_own_whole_east_trade_over: "Eastern Trade Hegemony Triggered"
 oe_byz_ed_own_whole_east_trade_tt: "Our country will become the undisputed, #G sole#! Eastern trade power and monopolize all Eastern trade goods until the situation ends."
 oe_byz_ed_sell_salves: "Sell Eastern Goods"
 oe_byz_ed_sell_salves_desc: "We will sell goods to a selected market.\n#R Purchase:#! [to.GetName][goods.GetName][goods.GetIcon]\n#G Export:#! [from.GetName][goods.GetName][goods.GetIcon]"
 oe_byz_ed_sell_salves_tt: "We will select a market with goods in storage and then export to a target market, directly gaining profit from the market price difference (does not consume trade capacity)."
