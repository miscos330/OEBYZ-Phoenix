 oe_policy_org_law_get_burch_I_tri_tt_II: "#Y Powerful Department#!"
 rome_reconquista.1000.t: "The World Restored"
 rome_reconquista.1000.d: "On the lush green fields of England, a shepherd drives his flock homeward. His life seems little different from when the Romans left a thousand years ago. The only things around that speak of that long era are a crumbling stone wall on the hillside, and place names no longer called Aelius Bridge. The people here may need another ten or twenty years to accept their new Roman identity. And it might take a hundred years before they marvel at a great story—the story of an indomitable people. They conquered Hannibal, and were broken by Muhammad; they amassed all the world's wealth, and teetered on the brink of annihilation; they lost the Eternal City, and even lost the City of the World's Desire. But this people always adapted with astonishing resilience to a changing world. Time can raise mountains, deepen seas, topple mighty empires, and raise the humble and unknown, but it could not conquer this people's dream, nor grind down their ambition. Now that all the empire's lands are finally united under one banner, we can at last console the spirits of #color_yellow the Roman Emperors#! in heaven."
 rome_reconquista.1000.a: "From One City to the World"
 rome_reconquista_1000_a_tt: "#Y Thank you for playing our mod, 'Project Phoenix'#!"
 oe_end: "Restoration of the Roman Empire"
 oe_end_desc: "We have written the most magnificent epic in human history, reconquering every inch of the Roman Empire's territory."
