 oe_byz_policy_org_real_power_country: "Praetorian Prefecture Seat"
 oe_byz_policy_org_real_power_country_desc: "An imperial exarchate or senior theme bearing active provincial duties and drawing Consistorium stipends."
 oe_byz_policy_org_real_empire_king: "Augustan Consistory"
 oe_byz_policy_org_real_empire_king_desc: "The Roman Emperor presides over the Consistorium, chartering Prefectures and balancing civil and military offices."
 oe_byz_policy_org_low_power_country: "Foederati & Client Seat"
 oe_byz_policy_org_low_power_country_desc: "An outer Roman client kingdom or foederatus registered in the Consistorium for frontier defense and tribute."
 OE_BYZ_POLICY_ORG_LAWS: "Prefectural Edicts"
 oe_byz_plicy_org_leader_pay: "Salaries"
 oe_byz_plicy_org_leader_pay_desc: "This is the monthly salary paid to officials in Eastern Rome."
 oe_byz_policy_org_build_valuns_water: "Restore the Aqueduct of Valens"
 oe_byz_policy_org_build_valuns_water_desc: "Since the Latin Empire period, the Aqueduct of Valens has not been properly maintained or repaired. If we wish to ensure this facility continues to serve us, we must restore it."
 oe_byz_policy_org_build_valuns_water_text: "The Aqueduct of Valens can undergo four major restorations, each gaining one building level."
 oe_valuns_water_building: "Aqueduct of Valens"
 oe_valuns_water_building_desc: "The Aqueduct of Valens was the core water supply facility of Constantinople, constructed under the direction of Roman Emperor Valens between 368-375 AD. The structure features a two-tiered stone arch design, with an original length exceeding 1000 meters and a maximum height of 29 meters."
 oe_valuns_water_building_maintain: "Aqueduct Maintenance"
 OE_BYZ_oe_valuns_water_building_DESC: "Restoration of the Aqueduct of Valens"
 choose_area: "Select Region"
 choose_culture: "Select Culture"
 oe_byz_policy_org_romenization_culture: "Romanization"
 oe_byz_policy_org_romenization_culture_desc: "Romanization refers to the process of influence and fusion of Roman culture, language, law, and social structures within the territories it ruled."
 oe_byz_policy_org_romenization_culture_text: "Implement Romanization on the [target_culture.GetName] culture in [target_area.GetName]."
 oe_real_gov_reform_romenization_org: "Romanization"
 oe_real_gov_reform_romenization_org_desc: "Romanization refers to the process of influence and fusion of Roman culture, language, law, and social structures within the territories it ruled."
 oe_byz_constantinople_university: "University of Constantinople"
 oe_byz_constantinople_university_desc: "The University of Constantinople was founded in 425 AD to cultivate talent for state governance through systematic education. It transcended class barriers in teaching, training both bureaucratic elites and commoners' children. The curriculum included rhetoric, philosophy, law, and more."
 oe_byz_constantinople_university_maintain: "Academic Theses"
 oe_byz_constantinople_rome_university: "New Rome Patriarchal University"
 oe_byz_constantinople_rome_university_desc: "The New Rome Patriarchal University began as a theological school with only three professors, its history traceable to the 5th century. Today, the Patriarchal University offers a complete religious education, including instruction on the Gospels, Apostolic Epistles, and hymns."
 oe_byz_policy_org_build_underground_water: "Restore the Basilica Cistern"
 oe_byz_policy_org_build_underground_water_desc: "Fresh water brought by the Aqueduct of Valens is first stored in the Basilica Cistern before being distributed for the city's use."
 oe_byz_policy_org_build_underground_water_text: "The Basilica Cistern can undergo four major restorations, each gaining one building level."
 OE_BYZ_oe_byz_constantinople_water_palace_DESC: "Restoration of the Basilica Cistern"
