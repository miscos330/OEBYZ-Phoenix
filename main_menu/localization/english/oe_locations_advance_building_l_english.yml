l_english:
 STATIC_MODIFIER_NAME_byz_Constantinople_silk_base: "Byzantine Silk"
 STATIC_MODIFIER_NAME_unlocked_byz_Constantinople_silk: "Imperial Purple"
 oe_byz_Hagia_Sophia: "Hagia Sophia"
 oe_byz_Hagia_Sophia_desc: "Hagia Sophia, the main cathedral of the Byzantine Empire, is renowned worldwide for its massive dome. It is a representative of Byzantine architecture, the central church of Eastern Orthodoxy, and a monument of the empire's golden age."
 dip_check_tt: "Diplomatic expenditure input greater than 50%"
 food_check_tt: "Food purchase expenditure input less than 50%"
 oe_byz_Hagia_Sophia_maintain: "Ecumenical Church Production Method"
# PAUSED:  oe_byz_mint: "Thessaloniki Royal Mint"
# PAUSED:  oe_byz_mint_desc: "The mint of Thessaloniki was one of the most important provincial mints of the Byzantine Empire, its history spanning the entire Middle Ages, exerting a profound influence on the empire's economy, politics, and culture."
# PAUSED:  oe_byz_mint_maintain: "Royal Mint: Gold Coinage"
 STATIC_MODIFIER_NAME_byz_polygyros_gold_base: "Pangaeon Mountain Gold Mining Area"
 oe_byz_athos: "Mount Athos Monasteries"
 oe_byz_athos_desc: "Mount Athos (also known as the 'Holy Mountain') held an extremely unique and important position in the medieval Byzantine Empire. It was not only a spiritual beacon and center of monasticism for the Orthodox world, but also a special region with a high degree of autonomy in politics, economy, and culture. Regarding its library, Mount Athos was undoubtedly one of the most important centers for manuscript collection and copying in the medieval world, producing and preserving a vast number of precious books."
 oe_byz_athos_maintain: "Library of Athos"
 STATIC_MODIFIER_NAME_oe_byz_kill_venice: "Venetian Wealth Restitution"
 oe_byz_greek_capital: "Acropolis of Athens"
 oe_byz_greek_capital_desc: "The restored Acropolis houses an imperial administrative centre for Greece. Its offices keep the tax registers, hear local petitions and convey the emperor’s decrees to the surrounding towns."
 oe_greek_capital_maintain: "Byzantine Administration"
 OE_BYZ_SOPHIA_DESC: "Renovate Hagia Sophia"
 STATIC_MODIFIER_NAME_oe_byz_constantinople_clergy_sat: "Relaxation of Church Supervision"
 oe_byz_destroy_athos: "Destroy $oe_byz_athos$"
 oe_byz_build_demotica_house: "Noble Manor"
 oe_byz_build_demotica_house_desc: "A family-owned estate providing income, manpower and local influence. It survives the departure or death of its head."
 oe_demotica_house_maintain: "Full of Distinguished Guests"
 oe_byz_pronia_house: "Pronoia Grand Estate"
 oe_byz_pronia_house_desc: "This is the private estate of a great pronoiar. Due to the weakening of central authority, they have turned the pronoia lands into hereditary private property and forced many free peasants into bankruptcy, becoming their dependent farmers."
 oe_pronia_house_maintain: "Landlord Militia"
 unlock_destroy_pronia_house: "Address the Pronoia Issue"
 oe_byz_pronia_good_house: "Military Service Estate"
 oe_byz_pronia_good_house_desc: "The small pronoians on this land strictly adhere to the regulations of the pronoia system and loyally fight for the state when needed."
 oe_pronia_good_house_maintain: "Rights and Obligations"
 oe_alasehir_city_maintain: "Autonomous Militia"
 oe_byz_alasehir_city: "Fortress of Desperation"
 oe_byz_alasehir_city_desc: "As the Byzantine Empire fully retreated in Asia Minor, this city fell into complete encirclement by the Turks, but we will never give up resistance until the enemy's swords annihilate us all."
 oe_byz_constantinople_gold_door: "Golden Gate"
 oe_byz_constantinople_gold_door_desc: "The Golden Gate was the most magnificent land gate of the Walls of Constantinople, often used for triumphal ceremonies."
 oe_byz_constantinople_gold_door_maintain: "Golden Gate Honor Guard"
 oe_byz_constantinople_small_palace: "Blachernae Palace"
 oe_byz_constantinople_small_palace_desc: "Located at the northwestern corner of the Theodosian Walls, on the shore of the Golden Horn. It became the main imperial residence after the Komnenian dynasty. Compared to the once magnificent Great Palace complex, it resembles more a heavily fortified castle fortress."
 oe_byz_constantinople_small_palace_maintain: "Byzantine Imperial Palace Use"
 oe_byz_constantinople_holy_church_maintain: "Church of the Holy Apostles Maintenance"
 oe_byz_constantinople_holy_church_desc: "The Church of the Holy Apostles was the second largest church in the empire and the traditional burial place for emperors and patriarchs."
 oe_byz_constantinople_holy_church: "Church of the Holy Apostles"
 oe_byz_build_country_gov: "Administrative Headquarters"
 oe_byz_build_country_gov_desc: "This is the supreme power center of the region, where its governor works, resides, and holds court."
 oe_byz_mis_burgher_maintain: "Peloponnese Castle Maintenance"
 oe_gen_gold_control: "Genoese-Controlled Mines"
 oe_gen_gold_control_desc: "According to the treaty, part of the mining rights for this mine are mortgaged to the Genoese, who can obtain considerable profits from these minerals."
 oe_gen_gold_control_maintain: "Privileged Mining"
 oe_gen_latin_house: "Genoese Trading Post"
 oe_gen_latin_house_desc: "This is the commercial outpost of [GetCountry('GEN').GetName], providing important commercial influence for Genoa."
 oe_gen_latin_house_maintain: "Latin Trade Route"
 oe_ven_latin_house: "Venetian Trading Post"
 oe_ven_latin_house_desc: "This is the commercial outpost of [GetCountry('VEN').GetName], providing important commercial influence for Venice."
 oe_byz_clergy_house: "Village Chapel"
 oe_byz_clergy_house_desc: "This is a building that any devout Christian settlement must possess."
 oe_byz_clergy_house_maintain: "Faith and Welfare"
 oe_byz_mis_burgher: "Mystras Castle"
 oe_byz_mis_burgher_desc: "The history of Mystras Castle originates from the Fourth Crusade. After the Crusaders conquered the Peloponnese in 1206 and 1207, the nobleman Geoffrey I of Villehardouin from Bar-sur-Aube in northern France became the ruler of the Principality of Achaea. His brother William II conquered other parts of Laconia and in 1249 built a very strong castle at Mystras, which was then uninhabited, to control Laconia. In 1259, the Byzantine army captured William, and he only regained his freedom by surrendering Mystras and other castles."
 oe_byz_monem_sea_burgher: "Monemvasia Sea Fortress"
 oe_byz_monem_sea_burgher_desc: "Monemvasia is located on the east coast of the Peloponnese peninsula. Its core is a large rocky island connected to the mainland only by a narrow causeway. This rock rises nearly 300 meters above sea level, with almost vertical cliffs on all sides, unclimbable from the sea. After the fall of Constantinople in 1204, Monemvasia was one of three Byzantine strongholds not conquered by the Crusaders. It became a center of Byzantine resistance in the Morea region."
 oe_byz_edirne_burgher_maintain: "Adrianople Defense"
 oe_byz_edirne_burgher: "Adrianople"
 oe_byz_edirne_burgher_desc: "In 125 AD, the Roman emperor Hadrian rebuilt this city as a military hub in the Balkans, guarding the passage from Constantinople to Central Europe."
 phoenix_nirvana: "Phoenix Nirvana"
 phoenix_nirvana_desc: "Without a doubt, the empire has fallen into a situation far more #bold #R dangerous#!#! than in 1204, or even any time in history. [ShowSituationName('rise_of_the_ottomans')] has encroached upon our vital recruitment grounds in Asia Minor, the rising [GetCountry('SER').GetName] makes our Balkan territories uneasy, and the empire internally is in a mess due to years of weakening central authority. But we will never forget that we are the descendants of the great #bold #color_yellow Romans#!#! and the [GetCountry('BYZ').GetCulture.GetName] #bold #color_yellow people#!#!. No matter what darkness and suffering lie ahead, we are determined to lead [GetCountry('BYZ').GetName] towards a #bold #G future she has never foreseen#!#!"
 oe_byz_press_claims: "Recover Imperial Lost Lands"
 oe_byz_press_claims_desc: "The Balkans and Anatolia are our traditional spheres of influence. Recovering these lost lands is the wish of every Roman subject.\n\nSelecting a bordering province owned by Hungary grants #Y The Crown of Saint Stephen#! casus belli. Hungarian provinces may be selected outside the Balkans and Anatolia."
 oe_byz_latin_attack: "Depose the Despot of Epirus"
 oe_byz_latin_attack_desc: "In the early 14th century, Epirus was ruled by Andronikos Palaiologos, but his power was weak. There were fierce struggles within the country between a pro-Byzantine faction (advocating union with Constantinople) and an independence faction (inclined to ally with Latins or Serbs). The Byzantine emperor Andronikos III, aided by his minister John Kantakouzenos, sought to restore imperial authority in the Greek region. Previously, Byzantium had gradually controlled Thessaly and parts of Macedonia through diplomatic and military means; Epirus became the next target."
 oe_byz_press_claims_tt: "Grants us a #bold #R casus belli#!#! on a region in #bold #color_yellow the Balkans#!#! or #bold #color_yellow Anatolia#!#!."
 oe_byz_latin_attack_tt: "The Emperor will personally besiege #R Arta#! to force the Epirotes to submit."
 phoenix_nirvana_byz_map_tt: "#bold Rise from the ashes, or perish#!"
 phoenix_nirvana_byz_map_ttt: "#bold #G Subjects Loyal to the Eastern Roman Empire#!#!"
 phoenix_nirvana_byz_map_tttt: "#bold #R Turkish Beyliks#!#!"
 phoenix_nirvana.1.title: "The Reign of Andronikos III"
 phoenix_nirvana.1.desc: "The reign of Andronikos III was the last afterglow before the Byzantine Empire's final plunge into the abyss. Under the rule of [ROOT.GetCountry.GetGovernment.GetRuler.GetName], the imperial regular army was partially rebuilt, the navy was reorganized, and some maritime territories such as Chios were recovered. After overthrowing his grandfather's rule, he focused on restoring imperial order and implemented some administrative reforms and economic measures. However, the continuous loss of imperial territory, the rise of the Turks and Serbs, the exhaustion of the imperial treasury, and the shadow of civil war always hung over the empire like the Sword of Damocles."
 phoenix_nirvana.1.a: "May God Bless Rome"
 oe_byz_road_to_roman_situation: "Roman Revival"
 phoenix_nirvana.100.title: "March into Anatolia"
 phoenix_nirvana.100.desc: "[ShowRegionName('anatolia_region')] is the core region of Hellenization in the East, the empire's strongest pillar. It was once our most important recruitment ground and provided the empire with a steady stream of grain, livestock, and minerals. We must not cede this to the Turks; we must reclaim this cornerstone that determines the empire's survival."
 phoenix_nirvana.100.a: "In the Name of God!"
 phoenix_nirvana.101.title: "Struggle in the Balkans"
 phoenix_nirvana.101.desc: "[ShowRegionName('balkan_region')] is one of the longest-ruled regions of the empire. Once considered a secure rear, it is now filled with ambitious Orthodox kingdoms and heretical Latin principalities. Our army will strike them hard, lest they forget who has ruled here for a thousand years."
 phoenix_nirvana.101.a: "Assemble the Army!"
 phoenix_nirvana.200.title: "March on Arta"
 phoenix_nirvana.200.desc: "In the 1330s, after the death of the ruler of Epirus, John Orsini, his son Nikephoros II Orsini was young, and internal strife among the nobles broke out. Byzantium took the opportunity to weaken the authority of the Epirote ruler by supporting pro-Byzantine nobles. From 1337 to 1338, Andronikos III personally led his army into Epirus and besieged its capital, Arta. Due to internal chaos and lack of external aid, resistance quickly collapsed. In early 1338, Arta surrendered, and the Byzantine army occupied all of Epirus. The Despotate of Epirus was formally annexed into the Byzantine Empire, becoming a province."
 phoenix_nirvana.200.a: "Depose Nikephoros II, Appoint a Governor"
 oe_byz_latin_attack_over: "Annexation of Epirus has already been triggered."
 oe_byz_reform_nobleI_start: "The event chain for restoring rural authority has begun."
 oe_byz_reform_nobleI: "[GetCountry('BYZ').GetGovernment.GetRuler.GetDynasty.GetName] Reform"
 oe_byz_reform_nobleI_desc: "During the period 1321-1328, the eight-year civil war left glaring rifts in our country; central authority in the countryside is still ignored. As the situation gradually stabilizes, we should send trained bureaucrats to the countryside to fill vacancies, crack down on local magnates' overreach, audit landholdings, and strictly enforce taxation."
 oe_byz_reform_nobleI_tt: "We will start an event chain containing 3 events. At least #G 2 events#! must be completed to receive a reward. Completing all grants an additional #G permanent reward#!."
 phoenix_nirvana.300.title: "Appointment and Dismissal of Local Officials"
 phoenix_nirvana.300.desc: "In theory, #bold #color_yellow the Byzantine imperial court#!#! fully retains the power to appoint and dismiss local officials. However, with the continuous weakening of central control, the appointment and dismissal of local officials has effectively become the power of local governors and high administrators; they can freely decide on officials, with the center only providing post-facto ratification. Now let us reaffirm our #bold ancient and sacred right#!; all #bold #P governors#!#! must select officials from the list we provide and cannot arbitrarily dismiss them."
 phoenix_nirvana.300.a: "Candidates must be provided by Constantinople!"
 phoenix_nirvana.300.b: "Let the governors continue to select locally."
 STATIC_MODIFIER_NAME_phoenix_nirvana_300_b_mod: "Local Governors Satisfied"
 oe_byz_treat_gov: "Expand the Bureaucracy"
 oe_byz_reform_nobleI_finnish: "Rural Situation Addressed"
 oe_byz_reform_nobleII_start: "The event chain for the fate of the pronoia system has begun."
 oe_byz_reform_peasantI_start: "Central Army Rebuilt"
 oe_byz_reform_nobleII_tt: "We will choose to either continue strengthening the pronoia system or abolish it entirely."
 oe_byz_reform_peasantI_tt: "We can increase $oe_byz_nobleII_reformmm_var$ through the following actions:\nArmy led by the ruler wins a #G battle#!: +1\nByzantine army wins a #G major battle#!: +3\nArmy led by the ruler #R loses a battle#!: -1\nByzantine army #R loses a major battle#!: -5\nByzantium #G wins a war#!: +2\nByzantium #R loses a war#!: -10\nByzantium #R receives a diplomatic insult#!: -1\nByzantine army captures a #G key location#!: +3\n"
 oe_byz_reform_nobleII: "The Fate of the Pronoia System"
 oe_byz_reform_nobleII_desc: "In the imperial countryside, the failure of the pronoia system is glaring. Peasants are forced to lose their freedom and become dependent on land-owning pronoians, leading to the enserfment of the Byzantine Empire. Disloyal local powers conceal from us population, taxes, and even soldiers; the established pronoia system's provisions also open the door wide for land annexation by aristocratic magnates, causing severe land consolidation. With the threats from Asia and the Balkans repelled, we can choose to reform this system or abolish it entirely and reinstate the bureaucratic network."
 oe_byz_reform_peasantI: "Rebuild the Central Army"
 oe_byz_reform_peasantI_desc: "Andronikos II's decision to disband the central army and the imperial navy was truly the most foolish act in history, leading to a series of military collapses in Asia Minor and Greece. Let us, harboring discontent towards this foolish emperor, work diligently until the central army is restored to a level matching our empire's glory."
 OE_BYZ_GUI_ROMEI: "#color_yellow Roman Empire#!"
