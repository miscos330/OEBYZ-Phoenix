 phoenix_nirvana.506.t: "Invest in Armaments"
 phoenix_nirvana.506.d: "Mercenaries are never a reliable force. They often plunder any territory they pass through, and may even betray us and seize cities for themselves. Therefore, we must invest funds to rebuild a reliable and powerful army."
 phoenix_nirvana.506.a: "Enlist more noble officers."
 phoenix_nirvana.506.b: "Order bureaucrats to procure equipment."
 phoenix_nirvana.506.c: "Increase military pay."
