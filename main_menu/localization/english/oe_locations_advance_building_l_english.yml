 oe_byz_empier_money_gII_allow: "Monetary Credit is Healthy"
 oe_byz_empier_money_gII: "Hyperpyron"
 oe_byz_empier_money_gII_desc: "Hyperpyron is the Latinized transliteration of its Greek name #bold #color_yellow νόμισμα υπέρπυρον#!#!, meaning 'highly refined' or 'super-pure' coin. Initially, its standard weight was about 4.5 grams (similar to the solidus), with extremely high purity. However, to pay for civil war costs and respond to the Turkish threat, emperors continuously 'cut corners'. By the mid-14th century, the gold content of the hyperpyron may have fallen to 50% or even lower, turning it into a silver-gold alloy coin. This led to severe inflation, domestic economic chaos, and the complete collapse of its international reputation. Foreign merchants (like Venetians and Genoese) refused to accept the debased hyperpyron, turning instead to their own stable currencies (like the Venetian ducat)."
 king_army_control: "Guard Training and Stationing"
 king_army_control_desc: "This is where the empire's most elite guard units train and are stationed."
 phoenix_nirvana.102.title: "Conquer Serbia"
 phoenix_nirvana.102.desc: "Serbia has long been viewed as a mere troublemaker on the frontier. But if we completely neglect them, perhaps they might grow into a power under a wise ruler. Let us launch a military expedition against Serbia to remind them who the ancient masters of their land are."
 phoenix_nirvana.102.a: "Water the horses at the Danube"
 phoenix_nirvana.103.title: "Conquer Bulgaria"
 phoenix_nirvana.103.desc: "Since the 5th century, Slavs have continuously invaded our lands south of the Danube and have established independent states multiple times. To ensure the security of the north, our empire must reconquer Bulgaria. Although the Bulgarians retain the fierce fighting style of their ancestors, the empire has successfully conquered Bulgaria many times in history, and this time will be no exception."
 phoenix_nirvana.103.a: "We are the heirs of Basil II."
 oe_cb_byz_vs_bul: "Shatter the Crown of Ohrid"
 oe_cb_byz_vs_bul_desc: "The Crown of Ohrid was made during the reign of Bulgarian Tsar Simeon I (893-927 AD) to celebrate his victory over the Byzantine Empire in 894."
 oe_cb_byz_vs_ser: "Serbian Expedition"
 oe_cb_byz_vs_ser_desc: "The empire once ruled Serbia for a long time. Recovering this land is our ancient and sacred duty."
 oe_cb_byz_vs_mam: "March into Egypt"
 oe_cb_byz_vs_mam_desc: "We must personally reverse the tragedy of Heraclius. We must personally end the endless suffering Muhammad has inflicted upon us."
 oe_cb_byz_vs_hun: "The Crown of Saint Stephen"
 oe_cb_byz_vs_hun_desc: "The crown beyond the Danube cannot stand in the way of restored Roman authority. Hungary must be compelled to recognize the rights of the empire."
 oe_cb_byz_vs_fra: "Conquer the Heirs of the Franks"
 oe_cb_byz_vs_fra_desc: "The Frankish kingdom was once just an ordinary vassal under Rome. They merely inherited a portion of the inheritance by taking advantage of our weakness, and now sit smugly in their ridiculous castles. Clearly, they need reminding of who their suzerain is."
 oe_rome_sub: "Roman Ally"
 oe_rome_sub_desc: "Rome has great influence in this country. It is regarded as a friend and ally of the Roman people."
 oe_rome_sub_II: "Provincialized Subject"
 oe_rome_sub_II_desc: "This country's autonomous privileges have been greatly weakened. It is only one step away from becoming an internal administrative region of Rome."
