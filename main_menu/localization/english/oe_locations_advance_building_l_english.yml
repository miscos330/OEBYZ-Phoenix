 oe_rr_start_sci_mil_I_tt: "Research Complete"
 oe_rr_start_sci_mil_I_advance: "Crow's Beak Forceps"
 oe_rr_start_sci_mil_I_advance_desc: "#color_yellow Crow's Beak Forceps#! can accurately clamp blood vessels. Combined with needle and thread techniques, it enables precise suturing and circulatory closure of blood vessels, thus effectively stopping bleeding. This innovative method is known as clamping hemostasis."
 oe_rr_start_sci_mil_II_advance: "Turkish Bow"
 oe_rr_start_sci_mil_II_advance_desc: "The Turkish bow has a very high rate of fire on horseback (up to 10-12 arrows per minute), is silent, and is particularly suitable for harassment, reconnaissance, and steppe guerrilla warfare. Until the 16th-17th centuries, some European light cavalry (such as Hungarian Hajdú soldiers, Polish Cossacks) still insisted on using composite bows originating from the Ottomans."
 oe_rr_start_sci_mil_III_advance: "Roman Military Band"
 oe_rr_start_sci_mil_III_advance_desc: "The Ottomans formed the world's earliest military bands. Let us learn from this and form military bands to ensure high morale and orderly marching."
 oe_rr_start_sci_mil_IV_advance: "Great Cannon Doctrine"
 oe_rr_start_sci_mil_IV_advance_desc: "Tear down the very walls of Babylon!"
 oe_rr_start_sci_mil_V_advance: "Engineer Equipment"
 oe_rr_start_sci_mil_V_advance_desc: "We will uniformly issue engineering equipment to dedicated engineers to better meet the needs of earthworks."
 oe_rr_start_sci_mil_VI_advance: "Reduced Coverage Area"
 oe_rr_start_sci_mil_VI_advance_desc: "After research, we are systematically reducing the coverage area of metal armor, removing parts with a lower probability of being hit and focusing on key protection to ensure the army's mobility."
 oe_rr_start_sci_mil_VII_advance: "Terror Tactics"
 oe_rr_start_sci_mil_VII_advance_desc: "We have learned much from our encounters with nomadic peoples. Through constant harassment, attrition, and wave attacks, we exert immense psychological pressure on the enemy, causing them to collapse."
 oe_rr_start_sci_mil_VIII_advance: "Modernized Greek Fire"
 oe_rr_start_sci_mil_VIII_advance_desc: "Greek fire was a liquid incendiary weapon invented by the Eastern Roman Empire, mainly used in naval warfare. The Arabs called it 'Greek fire', while the Romans named it 'Sea fire', 'Liquid fire', 'Liquid flame', etc. Its basic components were petroleum, mixed with sulfur and other substances, allowing it to burn continuously on water and be difficult to extinguish."
 oe_rr_start_sci_mil_IX_advance: "Bayonet"
 oe_rr_start_sci_mil_IX_advance_desc: "A ring socket fits over the outside of the muzzle, locked by a catch or spring. This was a decisive innovation, allowing a musketeer to possess both firepower and spear capabilities, ultimately eliminating the need for pikemen."
 oe_rr_start_sci_mil_X_advance: "Standardized Gunpowder"
 oe_rr_start_sci_mil_X_advance_desc: "With the progress of the military industry, our country has begun issuing soldiers with standardized gunpowder in paper cartridges. Soldiers no longer need to manually estimate the amount of gunpowder before each shot."
 oe_rr_start_sci_mil_XI_advance: "Imperial Staff"
 oe_rr_start_sci_mil_XI_advance_desc: "Specialized staff teams begin to appear around the main commander, responsible for intelligence gathering, map drawing, march route planning, camp layout, and fortification design."
 oe_rr_start_sci_mil_XII_advance: "Specialized Artillery"
 oe_rr_start_sci_mil_XII_advance_desc: "According to battlefield needs, our army has developed various types of artillery such as cannons, howitzers, and mortars, as well as ammunition like solid shot, grapeshot, and explosive shells."
 oe_rr_start_sci_mil_XIII_advance: "Rifling"
 oe_rr_start_sci_mil_XIII_advance_desc: "Rifling is the soul of a firearm, greatly improving shooting accuracy."
 oe_rr_sit_create_theme: "Create Imperial Theme"
 oe_rr_sit_create_theme_desc: "We will create an Imperial Theme in the selected province. The area will no longer provide us with levies, but will instead recruit its own troops to fight for us."
 oe_rr_sit_byz_press_claims: "Restore the Empire's Lost Lands"
 oe_rr_sit_byz_press_claims_desc: "Restoring the ancestral lands of the Roman Empire is the empire's highest ideal."
 oe_rr_sit_byz_press_claims_tt: "Grants us a casus belli against the owner of [target.GetName]."
 oe_rr_reown_rome: "Celebrate the Restoration of Lost Lands"
 oe_rr_reown_rome_desc: "The empire has miraculously recovered lost territory. We must hold a grand triumph and celebratory events to publicize our great victory."
 oe_rr_reown_rome_tt: "Trigger event 'Restoration of [target_location.GetName]'"
 oe_rr_reown_rome_text: "Select the target for restoration celebration."
 oe_bbyz_phoe_own_greek_country: "Peaceful Unification with Brethren"
 oe_bbyz_phoe_own_greek_country_desc: "There is no need to take up arms against our brethren living abroad. Peaceful unification is something everyone would welcome."
 oe_bbyz_phoe_own_greek_country_tt: "[target_country.GetName] becomes a Roman Ally subject of our country."
