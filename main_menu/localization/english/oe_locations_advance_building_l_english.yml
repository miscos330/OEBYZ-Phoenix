 oe_byz_pronia_better_house: "Military Service Estate"
 oe_byz_pronia_better_house_desc: "The small pronoians on this land strictly adhere to the regulations of the pronoia system and loyally fight for the state when needed."
 unlock_pronia_noble_building_on: "Chosen to Amend the Pronoia System in #G The Fate of the Pronoia#!."
 phoenix_nirvana.507.t: "Rebuild the Army"
 phoenix_nirvana.507.d: "The Romans once possessed one of the most powerful armies in the world. From the cunning Hannibal to the savage Attila, countless invaders who claimed invincibility fell before the resilience of the Romans and their allies. Although we have suffered a terrible decline, through persistent struggle we have gradually caught up with the step of Ares, the god of war. With the favor of the Fates, we will regain our lost lands and rebuild the homeland of the Romans."
 phoenix_nirvana.507.a: "Raise the Eagle Banners High"
 phoenix_nirvana_507_tt: "We will remove [ShowGovernmentReformName('oe_byz_lose_army')] and add [ShowGovernmentReformName('oe_byz_rebuild_army')]."
