 oe_flavor_byz.700.t: "Conquest of Egypt"
 oe_flavor_byz.700.d: "After we dealt a heavy blow to the Mamluks and swept through Egypt, the Mamluk regime completely collapsed and was forced to cede their core regions, the Levant and Egypt. Egypt was once one of Rome's highest-income provinces, and it remains a fertile land that can provide us with immense wealth—if the Muslims have no objection."
