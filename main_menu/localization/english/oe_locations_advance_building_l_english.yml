 oe_flavor_byz.800.d: "Adjusting the intensity of the Anatolian Turkic regime"
 oe_flavor_byz.800.a: "What makes the barbarians so special?"
 oe_flavor_byz.800.b: "Bring it on!"
 oe_flavor_byz.800.c: "A hard-fought battle"
