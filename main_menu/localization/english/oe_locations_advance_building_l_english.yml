 oe_byz_bad_thief_greek_maintain: "Bandits and Brigands"
 oe_byz_bad_thief_greek: "Bandit Stronghold"
 oe_byz_bad_thief_greek_desc: "Due to the empire's failed governance, countless bankrupt peasants and homeless people have been forced to become outlaws. The local countryside is overrun with bandits, and public security is extremely poor."
 oe_byz_defend_wall_I_maintain: "Patrol and Garrison"
 oe_byz_defend_wall_I: "Frontier Army Camp"
 oe_byz_defend_wall_I_desc: "The term 'Frontier Army' (Aκρίται) originates from the Greek Akron/Akra, meaning 'border'. The official use of the term 'Akritai' generally refers to the military and civilian populations living on the eastern frontier, including Muslims residing in those areas. Influenced by the literary 'Akritic Songs', people often imagine the imperial frontier army as troops stationed on the borders. In fact, the frontier army was a mixed force of professional soldiers, local theme militia, and irregular troops."
 phoenix_nirvana.1000.t: "Serbs Raid Our Border"
 phoenix_nirvana.1000.d: "With the tacit approval of Stefan Dušan, the military lords on the Serbian border raided [target_location.GetName] in the borderlands between the two countries. Due to the lack of sufficient garrison patrols in [target_location.GetName], the enemy was satisfied to plunder our villages and burn them to ashes."
 phoenix_nirvana.1000.a: "We should build [ShowBuildingTypeName('castle')] locally to stop Serbian raids."
 phoenix_nirvana.1001.t: "Dušan Provokes Border Dispute"
 phoenix_nirvana.1001.d: "Stefan Dušan is an ambitious and dangerous figure, always eyeing our country's fertile lands. Dušan has provoked a new border conflict in [target_location.GetName]. A small-scale clash has caused some casualties among our local troops."
 phoenix_nirvana.1001.a: "Damn it."
