 oe_gov_burchen_building_desc: "This building is the main office and document storage location for the administrative bureaucracy."
 oe_sub_tax_get_building: "Provincial Tax Collection Office"
 oe_sub_tax_get_building_desc: "This institution is responsible for remitting local taxes to the central government."
