# PAUSED:  oe_byz_plicy_org_ldec_corrupt_pay_desc: "This is our expenditure for combating corruption."
 oe_byz_constantinople_water_palace: "Basilica Cistern"
 oe_byz_constantinople_water_palace_desc: "The Basilica Cistern was built in the 6th century by order of Emperor Justinian the Great, employing seven thousand slaves over several years. It was primarily used for palace water supply and wartime reserves. The structure is 140 meters long and 70 meters wide, supported by 336 Corinthian columns 9 meters high, mostly taken from temples in the Anatolian region. It could store up to 100,000 tons of water."
 oe_byz_constantinople_water_palace_maintain: "Basilica Cistern Maintenance"
 oe_byz_constantinople_great_arena: "Great Hippodrome"
 oe_byz_constantinople_great_arena_desc: "Throughout the Eastern Roman period, the Hippodrome was the center of social life in Constantinople. Although severely damaged by the catastrophic sack of 1204, the ancient legendary artworks standing within it, such as the Obelisk of Thutmose III, the Serpent Column, and the Statue of Porphyrius, still testify to the empire's past boundless glory."
 oe_byz_constantinople_great_arena_maintain: "Great Hippodrome Maintenance"
 oe_byz_constantinople_big_palace: "Great Palace"
 oe_byz_constantinople_big_palace_desc: "The Great Palace of Constantinople is an eternal symbol of the Eastern Roman Empire's grandeur and cultural heritage. Established by Emperor Constantine I in the early 4th century, it served as the political and ceremonial center of the Byzantine Empire, symbolizing the continuity of Roman power and Christian significance."
 oe_byz_constantinople_rebuild_port: "Propontis Harbor"
 oe_byz_constantinople_rebuild_port_desc: "The Propontis Harbor was the port on the Sea of Marmara side of Constantinople. This bustling port was once abandoned due to siltation. After clearing the silt, this port will soon return to its former prosperity."
 oe_byz_constantinople_rebuild_port_maintain: "Harbor Maintenance"
 oe_byz_policy_org_build_oe_byz_constantinople_university: "Expand the University of Constantinople"
 oe_byz_policy_org_build_oe_byz_constantinople_university_desc: "The University of Constantinople is our country's most renowned institution of higher learning. Let us properly expand this school to cultivate more talent for our country."
 oe_byz_policy_org_build_oe_byz_constantinople_university_text: "Expanding the University of Constantinople will unlock the character interaction allowing 'young' characters to enter university for advanced study."
 oe_byz_policy_org_build_oe_byz_constantinople_rome_university: "Expand the New Rome Patriarchal University"
 oe_byz_policy_org_build_oe_byz_constantinople_rome_university_desc: "The New Rome Patriarchal University is one of the best theological schools in the capital. At the suggestion of the Ecumenical Patriarch, we have decided to expand this university."
 oe_byz_policy_org_build_oe_byz_constantinople_rome_university_text: "Unlocks more options for the character interaction 'Send to University for Advanced Study'."
 oe_byz_policy_org_build_oe_byz_constantinople_great_arena: "Restore the Great Hippodrome"
 oe_byz_policy_org_build_oe_byz_constantinople_great_arena_desc: "The Great Hippodrome of Constantinople was the activity center of the entire city and one of our country's proudest buildings. It houses many ancient artworks that testify to our country's past glory."
 oe_byz_policy_org_build_oe_byz_constantinople_great_arena_text: "We will restore the Great Hippodrome. It will become a unique city center square, rather than a venue for chariot races."
 oe_byz_policy_org_build_oe_byz_constantinople_big_palace: "Restore the Great Palace"
 oe_byz_policy_org_build_oe_byz_constantinople_big_palace_desc: "The Great Palace of Constantinople was severely damaged in 1204. For the glory of the empire, we must restore it."
 oe_byz_policy_org_build_oe_byz_constantinople_big_palace_text: "Restore the Great Palace"
 oe_byz_policy_org_build_oe_byz_constantinople_rebuild_port: "Clear Silted Harbor"
 oe_byz_policy_org_build_oe_byz_constantinople_rebuild_port_desc: "The port on the southern side of Constantinople once saw a thousand sails, but is now abandoned due to long-term neglect and severe siltation. Let us send laborers to clear the silt and restore the harbor's prosperity."
 oe_byz_policy_org_build_oe_byz_constantinople_rebuild_port_text: "Unlocks the Propontis Harbor."
 oe_rr_destiny_of_tur: "Fate of the Turks"
 oe_rr_destiny_of_tur_desc: "Since the Battle of Manzikert, the Turks have become our most troublesome problem. Restoring Asia Minor was once a distant dream, but now, we have once again recovered every inch of land in Asia Minor. It is time to decide the fate of these migratory Turkic peoples."
 oe_rr_destiny_of_tur_tt: "We will attempt to assimilate the Turks and unlock special troop types."
 oe_rr_destiny_of_albania: "Fate of the Albanians"
 oe_rr_destiny_of_albania_desc: "The Albanian people are one of the main ethnic groups in the Balkan Peninsula, primarily distributed in Albania, with communities also in Kosovo, North Macedonia, and Greece. They call themselves 'Shqiptarët' and speak the Albanian language, with their origins traceable to the ancient Illyrians."
 oe_rr_destiny_of_albania_tt: "We will attempt to assimilate the Albanians and unlock special troop types."
