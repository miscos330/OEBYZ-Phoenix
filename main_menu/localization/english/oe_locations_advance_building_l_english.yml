 oe_byz_policy_org: "Imperial Praetorian Consistorium"
 oe_byz_policy_org_desc: "The supreme imperial council modeled on the Late Roman Notitia Dignitatum, coordinating the four Praetorian Prefectures (Oriens, Illyricum, Italia et Africa, Galliae) and twelve classical dioceses to balance provincial governance and relieve Imperial Strain."
