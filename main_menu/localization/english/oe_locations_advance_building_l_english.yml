 STATIC_MODIFIER_NAME_oe_mos_subject_mod_I: "Grand Duchy of Moscow"
 oe_flavor_byz.900.t: "Pereyaslav Council"
 oe_flavor_byz.900.d: "[GetCountry('MOS').GetGovernment.GetRuler.GetName]A council of princes convened in Pereslavl to deliberate on the great cause of independence—resisting the Mongols and breaking the Tatar yoke. Our envoy was invited to attend this assembly. During the meeting, Grand Prince Vladimir expressed his hope that the Eastern Roman Empire would join forces with the Rus' people. To this, the envoy replied:"
 oe_flavor_byz.900.a: "Rome is the protector of all Orthodox Christians!"
 oe_flavor_byz.900.b: "The fate of the Rus' people is none of our concern."
 oe_flavor_byz_900_tt: "We and the Rus' people will wage war against the Golden Horde in one month's time. (Ensure the war treaty is executed: the Don River rendezvous, to unlock subsequent content for the Rus' Church.)"
 oe_flavor_byz.901.t: "The Mongols assemble their army."
 oe_flavor_byz.901.d: "Following the Pereyaslavl Council, the Grand Duchy of Moscow formally detained the Mongol envoys sent to collect additional tribute. This act, viewed as an act of high treason by the Mongols, immediately sparked war. Now the Golden Horde has begun summoning the various nomadic tribes loyal to it, and full-scale conflict has become inevitable."
 oe_flavor_byz.901.a: "Break the Yoke."
 oe_flavor_byz.902.t: "[GetCharacter('mos_ivan_i_danilovich_kalita_rurikovich').GetName] passed away"
 oe_flavor_byz.902.d: "[GetCharacter('mos_ivan_i_danilovich_kalita_rurikovich').GetName], known as the “moneybag,” passed away. During his reign, Moscow first leveraged Mongol forces to suppress the anti-Mongol uprising in the Principality of Tver, earning the trust of the Great Khan. Later, exploiting his monopoly on collecting tribute throughout Russia, he amassed wealth through ruthless accumulation. Using these funds, he purchased vast tracts of villages and lands from neighboring principalities, propelling himself to become the leader of all northeastern Rus'."
 oe_flavor_byz.902.a: "Interesting. Let's send a few permanent ambassadors to Moscow."
 oe_flavor_byz.902.b: "Trivial matters."
 rus_tithe: "Church of Rus' Tithe."
 rus_tithe_desc: "Orthodox Christianity does not directly levy tithes like Catholicism does, but instead generates religious income through means such as bishop appointment fees, ecclesiastical court litigation fees, fees for conducting religious ceremonies, and establishing theological seminaries."
 pe_byz_vs_mog: "#R Don River Rendezvous#!"
 pe_byz_vs_mog_entry_short: "#R Don River Rendezvous#!"
 pe_byz_vs_mog_entry: "#R Don River Rendezvous#!"
 oe_game_concept_tolerance: "Orthodox tolerance."
 rus_religion_law_church_rule_II_I_tri_tt_II: "#Y Diocese#!"
 rus_religion_law_church_rule_II: "Rus' Church"
 rus_religion_law_church_rule_II_desc: "After breaking the shackles of the Tatars, the Eastern Roman Empire reestablished ties with the Church of Rus', and the sacred glory of the Ecumenical Patriarchate once again shone upon the lands."
 rus_religion_law_church_rule_II_I: "The Ecumenical Patriarch appoints bishops."
 rus_religion_law_church_rule_II_I_desc: "Walk into the patriarchal headquarters in Kiev or Moscow, and you might find a bishop from Constantinople engaged in lively conversation with an abbot. Strolling through the monastery's cloisters, the monks take pride in having studied theology in the Eastern Roman Empire and passionately debate the theological issues currently circulating within its borders."
 rus_religion_action_call_rus_for_war: "Summon Rus' to join the battle"
 rus_religion_action_call_rus_for_war_desc: "We can leverage our religious influence to rally the Rus' people to fight for us."
 oe_byz_selcet_country: "Select Country."
 oe_enforce_landfriede_select_title: "Choose War."
 rus_religion_action_own_all_fur_trade: "Monopoly on the Black Sea fur trade."
 rus_religion_action_own_all_fur_trade_desc: "The Eastern Slavs control vast fur-producing regions. With our nation now commanding the mouths of all major rivers along the Black Sea coast, we can leverage our influence to negotiate trade treaties with the Rus' principalities and establish a monopoly in the Black Sea fur trade."
 rus_religion_action_own_all_fur_trade_tt: "All fur trade in the Eastern trade region is now monopolized by us."
 rus_religion_action_hold_religion_active: "Preside over religious meetings."
 rus_religion_action_hold_religion_active_desc: "We were invited to host a religious conference for the Church of Rus'. Such conferences typically last from several days to several weeks, serving as forums for theological debate, evangelism, and the promulgation of diocesan policies and directives."
 rus_religion_action_hold_religion_active_tt: "#Y Each parish member will gain +5 Orthodoxy and +3 Stability#!"
 rus_religion_action_student_form_rus: "Cultural Hegemony."
 rus_religion_action_student_form_rus_desc: "The unique culture, art, and literature of the Eastern Roman Empire sparked a craze among the upper classes of the Rus' principalities. Increasing numbers of Rus' elites began purchasing Byzantine artworks, sending their offspring to study at the universities of Constantinople, and making pilgrimages to Hagia Sophia, among other activities, which brought substantial revenue to our country."
 rus_religion_action_student_form_rus_tt: "We can now obtain faith income from the burghers and nobles estate of the Rus' states."
 oe_character_cabinet_experience_trait_I: "Novice in Court"
 desc_oe_character_cabinet_experience_trait_I: "This character has recently entered the cabinet and lacks experience."
 oe_character_cabinet_experience_trait_II: "Acquainted with Bureaucracy"
 desc_oe_character_cabinet_experience_trait_II: "Having served in the cabinet for over a year, this character is familiar with various administrative affairs."
 oe_character_cabinet_experience_trait_III: "Burdened by Paperwork"
 desc_oe_character_cabinet_experience_trait_III: "Having served in the cabinet for over four years, this character is a key worker handling affairs within the cabinet."
 oe_character_cabinet_experience_trait_IV: "Master of Court Affairs"
 desc_oe_character_cabinet_experience_trait_IV: "Having served in the cabinet for over eight years, this character possesses high ability and extensive connections."
 oe_character_cabinet_experience_trait_V: "Pillar of the State"
 desc_oe_character_cabinet_experience_trait_V: "Having served in the cabinet for sixteen years, this character has witnessed numerous political changes yet remains unshaken."

 oe_byz_theme_governor_administration: "Government by Governors"

 oe_byz_theme_governor_administration_desc: "The governors of the themes defend the provinces and oversee local military registers and provisions. Their authority sustains the districts, but leaves the throne with less direct influence over provincial affairs.\n\n#Y Byzantium:#! Crown Power #R −10%#!.\n#Y Military Districts:#! Army Maintenance Efficiency up to #G +800%#! and Food Consumption #G −20%#!.\n\nThis policy is in effect at the start of the campaign. Army Maintenance Efficiency scales linearly with the Military District Pay slider in Imperial Finance: #Y 0%#! at 0% funding, #G +400%#! at 50%, and #G +800%#! at 100%. Food Consumption and other modifiers are unaffected by this slider."

 OE_THEME_CENTRAL_REFORM_REQUIRED: "Byzantium has completed the #Y Centralization#! imperial reform"
