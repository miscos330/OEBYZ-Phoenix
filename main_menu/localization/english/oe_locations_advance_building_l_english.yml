 oe_byz_org_build_genoa_bank_action_I: "Issue Five-Year Government Bonds"
 oe_byz_org_build_genoa_bank_action_I_desc: "We have benefited greatly from Genoa's banking sector and plan to issue more formal government bonds."
 oe_byz_org_build_genoa_bank_action_II: "Mandatory Interest Adjustment"
 oe_byz_org_build_genoa_bank_action_II_desc: "Our financial situation is experiencing a slight problem. Therefore, we require the Imperial Chartered Bank to waive the interest on our loans. They have no choice!"
 oe_byz_org_build_genoa_bank_action_III: "Mandatory Debt Restructuring"
 oe_byz_org_build_genoa_bank_action_III_desc: "Our financial situation is not optimistic. Clearly, the Imperial Chartered Bank should make some sacrifices for the imperial economy."
