 oe_flavor_byz.200.t: "Eastern Trade Fades from History"
 oe_flavor_byz.200.d: "With Europeans discovering the sea route to India via the Cape of Good Hope, the Mediterranean spice trade monopoly has collapsed. In the foreseeable future, the spice trade will gradually fade from the historical stage."
 oe_flavor_byz.200.a: "Rise and fall, the natural cycle."
 phoenix_nirvana.600.t: "Imperial Supremacy"
 phoenix_nirvana.600.d: "Since 1204, we have fallen into incredible weakness. Nomads and Latins have taken turns riding roughshod over the empire. Fortunately, this terrible scene has become a thing of the past. We have successfully curbed the power of local nobles, reorganized the central army, and driven back the Turks in Asia. Now we can proudly declare that Rome's situation is stable, and it is time to begin reclaiming our ancestral lands."
 phoenix_nirvana.600.a: "Rise from the Ashes"
 oe_flavor_byz.701.t: "Subject State Converted to Provincialized Subject"
 oe_flavor_byz.701.d: "Through years of sustained administrative reform, rotating officials, and careful fiscal auditing, the entrenched autonomous privileges of this subject realm have been steadily pared away. With its courts, levies, and tax rolls aligned to imperial standards, it has formally transitioned into a tightly integrated provincialized dependency."
 oe_flavor_byz.701.a: "Excellent."
