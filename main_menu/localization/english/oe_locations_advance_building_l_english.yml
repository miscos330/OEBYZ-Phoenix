 child_byz_john_V: "Pampered Childhood"
 desc_child_byz_john_V: "John V was born in the imperial palace of Constantinople, enjoying material abundance and receiving a standard imperial education (theology, classical literature, military theory)."
 child_byz_john_V_after_1341: "A Puppet Honored as Legitimate"
 desc_child_byz_john_V_after_1341: "With the sudden death of Andronikos III, the nine-year-old John V was swept into an unprecedented storm; the brutal political struggles cast a lifelong shadow over John V."
 john_war.1.t: "Byzantine-Style Court Intrigue"
 john_war.1.d: "The close friendship between Andronikos III and Kantakouzenos won him the throne and the support of the military aristocracy. But to effectively rule the empire, he also had to rely on the professional bureaucrats of Constantinople, the Patriarch of the Ecumenical Patriarchate, and the commercial guilds of various trades to ensure the empire's revenue and functioning. Thus, the Byzantine court was subtly in a state of dangerous opposition: on one side, the all-powerful minister Kantakouzenos, completely trusted by Andronikos III and supported by the dominant military aristocracy; on the other side, Andronikos III's eldest son, John V, the widely accepted legitimate heir, who could expect support from most of the empire's orthodox institutions and strata dissatisfied with Kantakouzenos. Of course, the emperor himself dismissed this danger. On one hand, he fully trusted his friend not to harm his heir; on the other, he was in the #R prime of his life#!, so what was there to worry about?"
 john_war.1.a: "At least for now, everyone is loyal to [GetCountry('BYZ').GetGovernment.GetRuler.GetName]"
