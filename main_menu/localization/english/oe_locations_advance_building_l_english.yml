 oe_byz_rom_dream: "Roman Dream"
 oe_byz_rom_dream_desc: "Restoring the territory of the Roman Empire is our country's highest ideal. We will never give this up."
 oe_byz_rom_rome: "Sicilian Mines"
 oe_byz_rom_rome_desc: "The island of Sicily contains many mines useful to our country. Let us make good use of these resources."
 oe_byz_rom_alexandria: "Nile Granary"
 oe_byz_rom_alexandria_desc: "Having driven out the shameless Muslims, Egypt's agricultural potential will be fully developed once again under the meticulous planning of the Romans."
 oe_byz_rom_jeulus: "Syrian Crossroads"
 oe_byz_rom_jeulus_desc: "Syria is the geographical center of the crossroads of five seas and three continents. Merchants from all corners of the earth must pass through here."
 oe_byz_rom_siwas: "Land Flowing with Milk and Honey"
 oe_byz_rom_siwas_desc: "Anatolia is one of our country's most important sources of resources and troops. Retaking it is as significant to our country as the Jews finding Canaan."
 oe_byz_rom_bghad: "Fertile Crescent"
 oe_byz_rom_bghad_desc: "The land of the Two Rivers is rich in produce. Our country has conquered it several times in history."
 oe_byz_rom_paris: "Gallic Wine"
 oe_byz_rom_paris_desc: "The Gauls' research into wine is indeed accomplished, and it has become popular among our country's upper class."
 oe_byz_rom_london: "British Coal Mines"
 oe_byz_rom_london_desc: "The island of Britain is rich in coal mines, which may prove useful."
 oe_byz_rom_milan: "Po Valley Granary"
 oe_byz_rom_milan_desc: "The Po Valley was once Rome's traditional granary. We will ensure this once again."
 rise_of_the_ottomans.208.b: "Turks, the Romans have returned!"
 oe_byz_empire_theme_org_law_army_rule_I: "Military discipline."
 oe_byz_empire_theme_org_law_army_rule_I_desc: "Military discipline is one of the most important defining characteristics of an army, representing how it conducts itself after capturing a location."
 oe_byz_empire_theme_org_law_army_rule_I_I: "Discipline in the military has deteriorated."
 oe_byz_empire_theme_org_law_army_rule_I_I_desc: "Following the rapid collapse of the professional army, the mercenaries and local forces fighting for us were virtually devoid of military discipline, pillaging both our own and enemy territories indiscriminately."
 oe_byz_empire_theme_org_law_army_rule_I_II: "Orders are strictly enforced."
 oe_byz_empire_theme_org_law_army_rule_I_II_desc: "We have enforced strict military discipline, permitting only commanding officers to order extortion of settlements and strictly prohibiting individual soldiers from engaging in looting."
 oe_byz_empire_theme_org_law_army_rule_I_III: "Military Court."
 oe_byz_empire_theme_org_law_army_rule_I_III_desc: "In the ancient Roman legions, commanders held absolute authority over life and death for their soldiers. They dealt with serious crimes such as desertion and mutiny through summary trials (expedited proceedings), which can be seen as the precursor to military tribunals. The ancient Roman Military Law Code clearly defined disciplinary offenses. We have now revived this ancient tradition and taken it a step further. Professional military courts will ensure that any soldier or officer thinks twice before committing an offence."
 oe_byz_empire_theme_org_law_army_rule_II: "Military pay."
 oe_byz_empire_theme_org_law_army_rule_II_desc: "The command, military registers and provisioning of the themes require a settled order. The emperor may entrust local military administration to governors or, after centralizing the empire, bring their commands under direct imperial supervision."
 oe_byz_empire_theme_org_law_army_rule_II_I: "Central Administration"
 oe_byz_empire_theme_org_law_army_rule_II_I_desc: "The throne regulates military registers, provisions and appointments, while provincial commanders hold their commands at the emperor's pleasure.\n\n#Y Byzantium:#! Crown Power #G +10%#!.\n#Y Military Districts:#! Army Maintenance Efficiency up to #G +800%#!, Food Consumption #G −20%#!, Loyalty to Overlord #G +50#!.\n\nRequires the #Y Centralization#! imperial reform. Army Maintenance Efficiency scales linearly with the Military District Pay slider in Imperial Finance: #Y 0%#! at 0% funding, #G +400%#! at 50%, and #G +800%#! at 100%. Food Consumption and other modifiers are unaffected by this slider."
 oe_byz_empire_theme_org_law_army_rule_III: "Military manpower."
 oe_byz_empire_theme_org_law_army_rule_III_desc: "Determines whether more local manpower flows into local armies or central armies."
 oe_byz_empire_theme_org_law_army_rule_III_I: "Strong branches, weak trunk."
 oe_byz_empire_theme_org_law_army_rule_III_I_desc: "The influence of local armies is deeply entrenched, and they often have the first pick on the region's best recruits."
 oe_byz_empire_theme_org_law_army_rule_III_II: "Strong trunk, weak branches."
 oe_byz_empire_theme_org_law_army_rule_III_II_desc: "The central government wields formidable authority, Its armed forces gather the finest talents, Local militias dare not act recklessly."
 oe_byz_empire_theme_org_law_army_rule_IV: "Tactics."
 oe_byz_empire_theme_org_law_army_rule_IV_desc: "Tactical style determines the decisions our military commanders will make during campaigns."
 oe_byz_empire_theme_org_law_army_rule_IV_I: "Infantry Tactics."
 oe_byz_empire_theme_org_law_army_rule_IV_I_desc: "Our tactics rely on the formidable resilience and discipline of our infantry."
 oe_byz_empire_theme_org_law_army_rule_IV_II: "Manuever Tactics."
 oe_byz_empire_theme_org_law_army_rule_IV_II_desc: "Our tactics depend on the decisive strike of highly mobile forces such as cavalry."
 oe_byz_empire_theme_org_law_army_rule_IV_III: "Fire support."
 oe_byz_empire_theme_org_law_army_rule_IV_III_desc: "Our most distinctive advantage lies in emphasizing the overwhelming firepower of our rear echelon."
 oe_byz_empire_theme_org_law_army_rule_IV_IV: "human wave tactic."
 oe_byz_empire_theme_org_law_army_rule_IV_IV_desc: "Outnumbering the opponent is our strength."
 oe_byz_empire_theme_org_law_army_rule_V: "Logistics."
 oe_byz_empire_theme_org_law_army_rule_V_desc: "Coordinated logistics serve as the critical backbone for joint operations among multiple military forces."
 oe_byz_empire_theme_org_law_army_rule_V_I: "Centralized allocation."
 oe_byz_empire_theme_org_law_army_rule_V_I_desc: "We are responsible for the logistics of the local military forces."
 oe_byz_empire_theme_org_law_army_rule_I_I_tri_tt_I: "Imperial Throne."
 oe_byz_empire_theme_org_law_army_rule_I_I_tri_tt_II: "Regional Military Command."
 oe_byz_empire_pillars: "Pillars of the Empire"
 oe_byz_empire_pillars_desc: "The throne, noble houses, military districts and subject realms sustain the imperial order. The Privy Purse, Authority and Public Opinion express its resources and legitimacy."
 OE_BYZ_EMPIRE_THEME_ORG_LAWS: "Military Regulations."
 oe_byz_empire_theme_org_leader_tt_tit: "The Empire's Double-Edged Sword"
 oe_byz_empire_theme_org_leader_tt_desc: "We must provide monthly pay for the imperial army, as maintenance costs directly impact troop morale. Byzantine politics rests on balancing hereditary legitimacy with practical power—ambitious military governors could trigger dynastic collapse."
 oe_pillars_empire: "Empire"
 oe_pillars_empire_desc: "Byzantium and its emperor, the sole leader of the imperial organization."
 oe_pillars_theme: "Military Districts"
 oe_pillars_theme_desc: "Members with the military district government reform, receiving military pay and manpower transfers."
 oe_byz_empire_theme_org_leader_pay_for_army: "Military Region Pay."
 oe_byz_empire_theme_org_leader_pay_for_army_desc: "Live off the imperial treasury to repay the emperor's grace.\nRecipient shares are allocated solely in proportion to each recipient country's army size."
 oe_byz_selcet_oe_byz_empire_org_action_abolish_theme: "Select Military Region."
 oe_byz_empire_org_action_abolish_theme: "Abolish Military Regions."
 oe_byz_empire_org_action_abolish_theme_desc: "Abolish [target_country.GetName] and return its authority to the imperial throne. Costs #Y 5 Authority#!."
 oe_byz_empire_org_action_abolish_army: "Order the reduction of military forces."
 oe_byz_empire_org_action_abolish_army_desc: "[target_country.GetName] has too many soldiers; we cannot support so many troops."
 oe_byz_selcet_oe_byz_empire_org_action_abolish_army: "Select Unit."
 oe_greek_capital_maintain_II: "Byzantine Administration."
 oe_byz_policy_org_orthdox_win: "Announcing the Reunification of the Eastern and Western Churches."
 oe_byz_policy_org_orthdox_win_desc: "With the complete restoration of the five patriarchates in our country, the history of the Great Schism between the Eastern and Western Christian Churches will become a thing of the past."
 oe_byz_policy_org_orthdox_win_text: "All Catholic countries will convert to Orthodox Christianity."
 rome_reconquista.2.t: "Revival Fever -1"
 oe_byz_empire_theme_org_leader_pay_for_soldier: "Military manpower."
 oe_byz_empire_theme_org_leader_pay_for_soldier_desc: "Military rolls record the men supplied by the imperial government to its themes.\nThe manpower transfer base scales by age: Traditions x0.4, Renaissance x0.6, Discovery x0.8, Reformation x1, Absolutism x1.2, and Revolutions x1.5.\nRecipient shares are allocated solely in proportion to each recipient country's army size."
 oe_army_ability_kill_mus: "Order the expuslion of Heretics."
 oe_army_ability_kill_mus_desc: "Permitting soldiers to legally plunder pagans."
 oe_army_ability_kill_unrome: "Naturalization Act."
 oe_army_ability_kill_unrome_desc: "Permit soldiers to legally plunder all residents of different cultures."
 oe_flavor_byz.6.t: "City of Victory."
 oe_flavor_byz.6.d: "Since the 1920s, when the empire's territories in Asia declined due to the mass migration of the Turks, Philadelphia found itself completely surrounded by enemies. During Anatolia's dark ages, Philadelphia stood like a beacon amidst the sea of Turks, steadfastly maintaining its loyalty to the empire. Now, with the empire having repelled the Turks once more, we can finally celebrate victory within these city walls."
 oe_flavor_byz.6.a: "Never Surrender!"
 oe_byz_memory_victory_building: "Victory Monument."
 oe_byz_memory_victory_building_desc: "This building commemorates the great victory achieved by our nation."
 oe_byz_memory_victory_building_maintain: "Monument Maintenance"
 oe_character_war_score_trait_I: "Greenhorn."
 desc_oe_character_war_score_trait_I: "This character is new to the field and lacks experience."
 oe_character_war_score_trait_II: "Come into prominence."
 desc_oe_character_war_score_trait_II: "This character has mastered the ways of the battlefield."
 oe_character_war_score_trait_III: "Battle-hardened veteran."
 desc_oe_character_war_score_trait_III: "This character has commanded dozens of battles and possesses extensive experience."
 oe_character_war_score_trait_IV: "War Hero."
 desc_oe_character_war_score_trait_IV: "This person has rendered outstanding service to our nation and is known to every household."
 oe_character_war_score_trait_V: "Military Genius of the Era."
 desc_oe_character_war_score_trait_V: "The number of battles commanded by this figure is enough to go down in history."
 oe_character_war_score_trait_VI: "Military Governor."
 desc_oe_character_war_score_trait_VI: "This character is a military governor of the Eastern Roman Empire, holding a position of great authority and influence."
 byz_oe_pretender_rebel_I_country: "Restoration of the Old Dynasty."
 oe_byz_empire_org_action_abolish_ruler: "Reporting for duty in the capital."
 oe_byz_empire_org_action_abolish_ruler_desc: "Recall the theme governor to Constantinople. The incumbent leaves office and returns to the Eastern Roman Empire; the theme appoints a successor under its existing succession rules. Requires a spy network greater than 20 and costs #Y 1 Authority#! after a successful recall."
 RUS_RELIGION_LAWS: "Archdiocesan Doctrine."
 rus_religion: "Rus' Church"
 rus_religion_desc: "From Kyiv to Moscow, the Church in Rus' remained de jure a part of the Ecumenical Patriarchate of Constantinople, regarded as a metropolitan see. Since the baptism of Kyivan Rus', the Rus' people have devoutly adhered to Orthodoxy, a glorious legacy of our nation's once formidable religious influence."
 rus_religion_leader_tt_tit: "Rus' Church"
 rus_religion_leader_tt_desc: "Reestablishing ties with the Church of Rus offers us numerous advantages. The Church of Rus must pay us substantial fees annually for bishop appointments and ecclesiastical court proceedings, provides us with loyal foreign soldiers, and grants preferential trade terms for Rus goods such as beeswax and timber. If necessary, we could even rally the Rus' princes to fight for us. Yet despite our unshakable cultural and religious dominance, we must guard against treating these distant Rus' lords with arbitrary disregard. Otherwise, they might rebel against us as fiercely as they did against the Mongols."
 rus_religion_king: "Ecumenical Patriarch."
 rus_religion_king_desc: "This nation may appoint a universal patriarch, who serves as the leader of the patriarchate."
 rus_religion_mos_members: "Metropolitan Archdiocese."
 rus_religion_mos_members_desc: "This nation can appoint the Bishop of Rus', who serves as the de facto leader of the Church in the Rus' region."
 rus_religion_normal_members: "diocese."
 rus_religion_normal_members_desc: "The Church in this country belongs to an ordinary diocese of the Ecumenical Patriarchate."
 rus_religion_action_mongu_scare: "The Church of Russia Under the Tatar Yoke."
 rus_religion_action_mongu_scare_desc: "The Church of Rus' now lives in fear of the Mongol sword, Terrifying nomadic armies roam the steppes, Until the Rus' break the Tatar yoke, Our ties to the Church of Rus' are thin."
 rus_religion_law_church_rule_I: "Current Situation."
 rus_religion_law_church_rule_I_desc: "After the Mongols arrived on the Eastern European steppes, we lost practical control over the churches of Rus'. Especially following the catastrophe of 1204, our nation's strength had greatly diminished, leaving us unable to traverse the steppes teeming with nomadic armies to establish reliable connections with the Rus'."
 rus_religion_law_church_rule_I_I: "Loss of contact with churches in Rus'"
 rus_religion_law_church_rule_I_I_desc: "Our brothers in faith are suffering slaughter and oppression at the hands of the Mongols, which has undoubtedly undermined the prestige of the Ecumenical Patriarchate."
