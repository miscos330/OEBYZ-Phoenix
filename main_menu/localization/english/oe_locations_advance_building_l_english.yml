 phoenix_nirvana.400.t: "The Future of the Pronoia"
 phoenix_nirvana.400.d: "The dysfunctional pronoia system is a major chronic ailment of our country. With the core regions of the empire once again secure, we must undertake necessary reforms to this chaotic system. We can choose to continue strengthening the feudal characteristics of the pronoia, fostering beneficial autonomy without excessively damaging centralization; military aristocrats supported by properly supervised military lands will become the backbone of our army. Alternatively, we can turn the pronoia into a mere title, divorcing it from its original meaning and making it synonymous with a complete set of local administrative institutions. We will systematically control key local powers and advance centralization."
 phoenix_nirvana.400.a: "The pronoia system has proven effective."
 phoenix_nirvana.400.b: "Only a centralized state apparatus can save Rome."
 phoenix_nirvana_400_tt: "Unlock Law: #bold #G Byzantine Bureaucracy#!#!"
 empire_debt: "Eastern Trade"
 empire_debt_desc: "Along the maritime and overland Silk Roads, the Eastern Mediterranean was the last stop for all Eastern goods heading to Western Europe, and one of the most profitable trades in the world. Eastern spices from Egypt and Syria, such as [ShowGoodsName('cloves')], [ShowGoodsName('pepper')], as well as [ShowGoodsName('tea')] and [ShowGoodsName('porcelain')]; [ShowGoodsName('slaves_goods')] and bulk grain from the Black Sea coast; [ShowGoodsName('dyes')] from the Levant, and [ShowGoodsName('fine_cloth')] from China, Persia, and Byzantium were the main components of this Eastern trade."
 empire_debt.1.t: "Marginalized Commerce"
 empire_debt.1.d: "The Eastern Roman Empire was once the most important bridge state between East-West trade. But as we fell into centuries of chaos and decline, the Italian maritime republics, especially [GetCountry('GEN').GetName] and [GetCountry('VEN').GetName], have risen to become the two giants of Eastern Mediterranean trade. The Eastern Roman Empire, after a series of civil wars and defeats, has been reduced to a minor player that can only collect some transit fees, watching helplessly as the immense profits of Eastern trade flow past from the Black Sea and the Levant. Especially after [GetCharacter('byz_andronikos_ii_palaiologos').GetName] disbanded the imperial navy, the gap between us and the Latins at sea has never been so vast."
 empire_debt.1.a: "How can we recover from decline?"
 OBY: "Golden Horn"
 oe_byz_move_debt: "Reduce Coinage Gold Content"
 oe_byz_move_debt_desc: "Our treasury is exhausted; we are forced to reduce the gold content of coinage to gain more revenue."
 oe_byz_ed_money_break: "Monetary Credit Completely Collapsed"
 oe_byz_ed_money_over: "Monetary Credit Rebuilt"
 oe_byz_rebuild_money: "Increase Coinage Gold Content"
 empire_debt.101.t: "Repurchase Currency"
 empire_debt.101.d: "This is bound to be an expensive undertaking, but for the long-term benefit of our economy, we must restore the gold content of our coinage and repurchase and recoin the debased currency in the hands of the people. This will restore our sacred honor and ensure our control over monetary policy."
 empire_debt.101.a: "In the Name of the Emperor"
 empire_debt.101.tt: "#G The Estate Privilege Hyperpyron will appreciate#!"
 oe_byz_rebuild_money_desc: "Our economy still has some leeway; we are determined to invest funds and effort to restore our ancient and sacred monetary credit."
 oe_byz_rebuild_money_tt: "We will increase the gold content of the currency and spend funds to repurchase and recoin the debased money in people's hands to rebuild monetary credit. This will help us #G improve commercial credit#!."
 oe_byz_move_debt_tt: "We will further reduce the gold content of the currency and mint large quantities at once. This will bring us #G a large one-time income#!, but will lead to #R increased inflation#! and #R collapse of commercial credit#!."
 empire_debt.100.t: "Currency Devaluation"
 empire_debt.100.d: "Byzantine currency was once a hard currency popular throughout the Eastern Mediterranean, renowned for its stability and high gold content. Clearly, our historically good monetary credit is being ruthlessly trampled. We must further reduce the gold content of the coinage to meet government expenditure needs."
 empire_debt.100.a: "Necessary Evil"
 empire_debt.100.tt: "#R The Estate Privilege Hyperpyron will depreciate#!"
 oe_bank_opinion_ai_desire_to_join: "Dare not defy the Emperor"
 john_war: "Powerful Minister and the Imperial Court"
 john_war_desc: "Our country is experiencing a dual rift, both in the court and in society. Within the palace, the gap grows daily between the rising leader of regional military power, [GetCountry('BBY').GetGovernment.GetRuler.GetName], and the orthodox bureaucratic faction headed by [GetCountry('BAP').GetGovernment.GetRuler.GetName]. In society, the [GetCountry('BYZ').GetGovernment.GetEstateName('burghers_estate')] estate and the [GetCountry('BYZ').GetGovernment.GetEstateName('clergy_estate')] estate are increasingly discontent with the ever-expanding [GetCountry('BYZ').GetGovernment.GetEstateName('nobles_estate')] estate, leading to constant conflicts. Since Andronikos III overthrew his grandfather through civil war in 1328, the shadow of #R civil war#! has never left the #bold #color_yellow Empire#!#! of [GetCountry('BYZ').GetName]. If we cannot properly handle these growing divisions, then we must seriously consider a #R devastating civil war#!."
 BBY: "Kantakouzenos"
 oe_bank: "Imperial Chartered Bank"
 oe_bank_desc: "The Chartered Bank grew from Andronikos II’s compromise with commercial guilds and the work of pioneering bankers. It manages deposits, loans, government bonds, bills of exchange and investments under imperial charter. Its overlord receives Bank Interest −0.5%, Maximum Government Bonds +33% and Creditworthiness Bonus +10%."
 oe_noble: "Byzantine Noble House"
 oe_noble_desc: "A Byzantine noble household supported by family estates, private wealth and military connections. Its assets and household troops survive changes of leadership."
 oe_empire_theme: "Imperial Theme"
 oe_empire_theme_desc: "This country is an Imperial Theme of [GetCountry('BYZ').GetName]. This is a military-civilian, farmer-soldier integrated organization. It essentially solved the difficulties of recruitment and military funding, and also controlled the disorganized state of population movement, alleviating acute social contradictions."
