 oe_bells_of_revolution: "The Bells of Revolution"
 oe_bells_of_revolution_desc: "The reborn empire has never been so vast—or so strained. The arguments of Constantinople echo across straits and frontiers. Some hear the promise of a new order; others hear a warning that the throne may fall."
 oe_bells_clamor: "Revolutionary Clamor"
 oe_bells_overview: "Imperial order, dynastic legitimacy and voices in the streets shape revolutionary clamor. Continuous monthly changes are not logged; event and action changes are recorded.\n\n#bold Resolution#!: After 20 years, stability and legitimacy must both exceed 75 and clamor must be below 20. After 30 years, both must exceed 50 and clamor must be below 50. After 40 years the situation ends. The outbreak of the Great Eastern Roman Revolution ends it immediately.\n#bold Monthly revolution risk#!: Clamor above 50 / 60 / 70 / 75 / 90 gives a 1% / 3% / 5% / 10% / 50% chance respectively; only the highest qualifying tier applies."
