 oe_bells.7.t: "The Coffeehouses of Constantinople"
 oe_bells.7.d: "At first, the inspectors thought it merely a new fashion. Copper pots murmured over charcoal, and a bitter fragrance escaped the curtains. Merchants discussed shipping, clerks exchanged news, and disappointed scholars bought an afternoon’s audience with a cup of coffee.\n\nThen pamphlets appeared beside the bills, and arguments beside the chessboards. One man read the history of the ancient republic; another asked why taxes required no consent from those who paid them. A noble pedigree could be answered by a well-turned argument, and imperial decrees examined line by line. Those who left carried more than gossip: they took carefully copied pages to their neighbours.\n\nNo bell had summoned these assemblies. Yet the empire’s most elusive gathering had begun around every little table."
 oe_bells.7.a: "Even a cup of coffee can hold a challenge to the throne."
 oe_bells.8.t: "A Speech in the Hippodrome"
 oe_bells.8.d: "Chariots no longer thunder through the Hippodrome each day, but the imperial balcony still overlooks the great enclosure. Today its occupant wears neither purple nor a guard’s escort. A simple laurel wreath crowns his head, and an open law book rests beside him. Merchants, artisans and students settle along the old stands, leaving broad paths across the arena.\n\nHe begins with bread, taxes and the courts. Only then does he speak of the republic. If the Roman people can give their sons, property and blood, why should they have no voice in their own fate? The wind carries his words across the enclosure; neighbours repeat them to those who cannot hear. When he asks to whom Rome belongs, the answer no longer needs a speaker.\n\nFrom the place where emperors once looked down upon their subjects, a man has demanded that the throne explain itself to the people. In the palace, a clerk hesitates over whether to call the gathering subjects—or citizens."
 oe_bells.8.a: "That balcony should carry only the emperor’s voice."
 oe_bells.9.t: "The March Along the Mese"
 oe_bells.9.d: "At dawn, shutters close along the Mese. There are no military drums or lords’ banners. Guild elders carry petitions at the head of the procession, followed by students, artisans without their tools, and parents carrying children. Their demands differ: lighter levies, fair hearings, a voice for the provinces. Yet every column follows the same avenue towards the palace.\n\nThe guards form ranks at the crossroads. Officers await orders while the citizens lift their petitions higher. To let them pass may make the court seem weak. To clear the avenue with steel may teach its people to remember an emperor who refused to hear them.\n\nSunlight advances across the colonnades. Two Romes face one another across a line of spears, waiting for the same command."
 oe_bells.9.a: "Suppress them by force."
 oe_bells.9.b: "Let them march."
 oe_bells.10.t: "Gathering Protesters"
 oe_bells.10.d: "At first, only a few petitioners refused to leave the square in [oe_bells_protest_target.GetName]. Now artisans and traders from the neighbouring streets have joined them with grievances of their own. Someone reads an essay sent from the capital beside the fountain; someone else nails the local tax accounts to a board for literate citizens to read aloud.\n\nThe magistrates request instructions. A decisive dispersal, they argue, will restore order to the streets. Yet those driven from the square may tell the story to a far larger audience."
 oe_bells.10.a: "Disperse them."
 oe_bells.10.b: "Leave them alone."
 oe_bells.11.t: "Demands to Release a Thinker"
 oe_bells.11.d: "[oe_bells_detained_target.GetName] can no longer write at his desk, but his name appears on ever more petitions. Supporters leave an empty chair at their meetings and take turns reading his earlier essays, as though the locked door has given every sentence greater clarity.\n\nNow the petitioners demand his release. A confident sovereign, they insist, should not fear a scholar’s pen. The ministers wonder how many decrees will remain unquestioned if a crowd can open a prison gate."
 oe_bells.11.a: "Grant the petitioners’ request."
 oe_bells.11.b: "He will remain imprisoned until he dies."
 oe_bells.11.c: "The subject of the petition is no longer in custody."
 oe_bells_detained: "Detained"
 oe_bells_detained_desc: "This prisoner cannot serve in the cabinet or command armies or navies. Their monthly effects on legitimacy and revolutionary clamor cease while detained and resume upon release."
 oe_bells_dangerous_salons: "Salons of Dangerous Ideas"
 oe_bells_dangerous_salons_desc: "Coffeehouse conversations spread knowledge alongside doubts about ancient authority. These effects gradually diminish over fifty years."
 oe_bells_republican_calls: "Calls for a Republic"
 oe_bells_republican_calls_desc: "A speech in the Hippodrome has brought the republic out of history books and into the streets. These effects gradually diminish over fifty years."
 oe_bells_protest_crackdown: "Suppression of Protesters"
 oe_bells_protest_crackdown_desc: "The guards have cleared the Mese, but the citizens remember the throne behind the spears. These effects gradually diminish over ten years."
