 oe_bells_change_camp_desc: "Spend #Y 10 political influence#! to join another camp or remain neutral. Cooldown: #Y 10 years#!."
 oe_bells_monthly_breakdown: "#bold Monthly Clamor#!　[SituationView.GetActiveSituation.GetSituation.MakeScope.ScriptValue('oe_bells_monthly_total')|-=2]\nNatural decline　[SituationView.GetActiveSituation.GetSituation.MakeScope.ScriptValue('oe_bells_monthly_decay')|-=2]\nStability　[GetCountry('BYZ').MakeScope.ScriptValue('oe_bells_stability_delta')|-=2]　Legitimacy　[GetCountry('BYZ').MakeScope.ScriptValue('oe_bells_legitimacy_delta')|-=2]\nFree thinkers　[GetCountry('BYZ').MakeScope.ScriptValue('oe_bells_thinker_clamor')|-=2]　Modifiers　[GetCountry('BYZ').MakeScope.ScriptValue('oe_bells_country_modifier_delta')|-=2]"
 oe_bells.3.t: "Voices Beneath the Purple"
 oe_bells.3.d: "When the phoenix returned, every recovered city seemed to bring Rome closer to its former glory. Gold letters still shine upon the triumphal arches, yet the breadth of the frontiers does not cheapen bread. Guild masters resent privileges and levies; villagers ask what became of promised justice. Nobles have lost old powers, while common people still await the better life they expected to follow.\n\nA common law and tax register have crossed the mountains, bringing roads, courts and more exacting collection. They have also measured different tongues, customs and local dignities against standards set in the capital. The themes say Constantinople sees only figures in a ledger; the palace says the provinces disguise private advantage as ancient right. Every party can cite an authority. Every party believes itself unheard.\n\nOnce confined to taverns, schools and church porches, these arguments now appear on printed sheets and public walls. Men speak again of a name older than the throne: the Roman people. The bells still cross the Golden Horn, but growing numbers hear in them a different summons."
 oe_bells.3.a: "Why do the empire’s bells sound so unfamiliar?"
 oe_bells.4.t: "A Dangerous Thinker"
 oe_bells.4.d: "[oe_bells_new_thinker.GetName] commands no army and possesses no treasury capable of buying a city. He has a writing desk, a circle of students reluctant to leave, and a disquieting gift: turning familiar suffering into questions that can no longer be ignored.\n\nHis essays quote Roman law and sacred authorities alike. He does not openly demand the emperor’s fall, but asks whether legitimacy resides in the purple itself or in the duties it must fulfil. Readers at court dismiss this as scholarly arrogance. Yet copies travel from schools to workshops, and from workshops to barracks.\n\nTo punish him rashly would supply the final proof his argument lacks. A man without office has acquired an audience no office could bestow."
 oe_bells.4.a: "We cannot close every ear."
 oe_bells_thinker_alive_tt: "Each living, undetained #Y Dangerous Thinker#! adds #R +0.1#! monthly clamor and costs Byzantium #R 0.1#! legitimacy per month. Effects stack, cease on death or detention, and resume upon release.\nThe thinker is protected from execution, banishment, monastic confinement and transfers into office, and cannot serve in the cabinet or command armies or navies."
 oe_bells.5.t: "An Alienated People"
 oe_bells.5.d: "Taxes can still be collected and edicts proclaimed, but people in the markets no longer raise their heads as they once did. Disappointment does not always shout. It may be a closed door, a conversation abruptly silenced, or a crowd that offers no cheer when the imperial procession passes.\n\nCitizens who once defended the emperor now ask why every sacrifice must begin with them. The throne still stands above the people, yet it is retreating from their hearts."
 oe_bells.5.a: "Silence, too, can be an answer."
 oe_bells.6.t: "A Defiant Subject"
 oe_bells.6.d: "Dispatches from [oe_bells_rebellious_subject.GetName] retain their respectful forms, but their tone has changed. This subject commands revenues sufficient to sustain an army, prosperity enough to nourish pride, and increasingly ambitious ideas about its place in the imperial order. Every demand from the capital invites a new calculation of who needs whom.\n\nIts envoys call this the defence of established rights. Other subjects are watching—and quietly learning the phrase."
 oe_bells.6.a: "The fault line has crossed the frontier."
 oe_bells_dangerous_thinker: "Dangerous Thinker"
 oe_bells_dangerous_thinker_desc: "This thinker gives form to the empire’s dissent. Without office, he commands an audience no office could bestow."
 oe_bells_opening_record: "$oe_bells.3.t$"
 oe_bells_alienated_people: "An Alienated People"
 oe_bells_alienated_people_desc: "Popular alienation erodes the foundations of imperial rule. Its effects gradually diminish over thirty years."
 oe_bells_rebellious_subjects: "Defiant Subjects"
 oe_bells_rebellious_subjects_desc: "Defiance among powerful subjects unsettles the imperial order. Each crisis has diminishing effects over twenty years, and multiple crises can stack."
 oe_bells_revolutionary_subject: "Agitating for Imperial Revolution"
 oe_bells_revolutionary_subject_desc: "This subject has joined the Revolutionary Agitators and turned against its overlord’s order."
