 oe_bells.12.t: "A Clandestine Printing Network"
 oe_bells.12.d: "The inspectors closed one press. The next day, the same pamphlet appeared in a town several days away. Another search revealed that paper, type, binding and transport passed through different hands. Boatmen knew only the booksellers who received their cargo; booksellers received unsigned parcels; printers never asked who had written the text.\n\nThere was no single meeting to raid and no headquarters for the guards to storm. The network used imperial roads and the empire’s flourishing trade to carry arguments out from the capital and grievances back from the provinces. Readers discovered that sufferings they had thought theirs alone were already described on strangers’ pages.\n\nAt last, the officials drew up a list of suspects. Before it reached the palace, a satire about the list was already in print."
 oe_bells.12.a: "We close one door; they open ten windows."
 oe_bells.13.t: "The Universities’ Public Declaration"
 oe_bells.13.d: "The palace has received no anonymous leaflet, but a declaration bearing university seals and scholars’ signatures. Jurists invoke Roman law, theologians describe the duties of rulers, and teachers of rhetoric supply a dangerous conclusion: a state cannot prove its legitimacy through obedience alone.\n\nThey demand written limits on imperial power, public scrutiny of taxation and the right to petition without punishment. They do not call for crowds in the streets. Yet when the empire’s own schools question its order, those crowds acquire an authority they previously lacked.\n\nTo reject the declaration is to denounce scholars whom the emperor supports and who train his officials. To accept it is to admit that the throne may answer to a standard above itself."
 oe_bells.13.a: "They question us with the seals we granted them."
 oe_bells.14.t: "The Defection of a Court Historiographer"
 oe_bells.14.d: "The historiographer once wrote the finest praises of the imperial house. He knew the origins of every decree, how each triumph entered the official record, and which failures the court hoped posterity would forget. Now he has left the palace with years of manuscripts and published a very different history of Rome.\n\nHe still celebrates the empire’s recovery, but credits its soldiers, artisans, taxpayers and many peoples. The dynasty, he writes, accepted their sacrifices and gradually treated a common victory as private property. What wounds the court most is not hostile accusation, but his quotations from original documents bearing the imperial seal.\n\nThe man who once wove splendour around the purple is unravelling its sanctity, thread by thread."
 oe_bells.14.a: "Even our history has crossed to the other side."
 oe_bells.15.t: "Republican Societies in the Army"
 oe_bells.15.d: "The officers’ letters were first dismissed as youthful speculation. They circulated ancient histories, debated citizen armies and republics, and called the army the nation’s shield rather than a dynasty’s sword. Later, the same language appeared at private meetings in several regiments—and in unauthorised oaths.\n\nAn inquiry has exposed connected societies, but cannot establish the loyalties of those who remain silent. Veterans demand renewed oaths; their subordinates ask which command should prevail if the court’s wishes conflict with Rome’s interests. Commanders begin to distrust their deputies, while soldiers wonder what their comrades believe.\n\nThe empire still has armies beneath splendid banners. It can no longer be certain that those beneath them mean the same thing when they swear loyalty to Rome."
 oe_bells.15.a: "Our strongest shield is cracking from within."
 oe_bells.16.t: "A Caricature on the Wall"
 oe_bells.16.d: "At dawn, passers-by discover a new picture on a wall: an enormous crown bends a little donkey beneath its load of tax registers, while courtiers debate why it will not hold its head high. There is no signature, but the joke needs none.\n\nThe patrol can scrape away the paint. Before it arrives, however, apprentices have copied the drawing. The magistrates demand a search for its author; the spectators wait to see how an emperor will answer a painted donkey."
 oe_bells.16.a: "Find the artist."
 oe_bells.16.b: "Ignore it."
 oe_bells.17.t: "The Students’ Night Debate"
 oe_bells.17.d: "Long after the dormitories go dark, candlelight still shines from a schoolroom facing the street. Students argue over borrowed books, citing authorities and applauding bold conclusions. They discuss taxation, law and the republic as though a sufficiently clear argument might persuade the empire to rearrange itself.\n\nThe watchmen ask whether to disperse them. The schoolmaster worries about tomorrow’s lessons; the officials worry about the courts, schools and offices these students will one day enter."
 oe_bells.17.a: "Disperse the gathering."
 oe_bells.17.b: "Let them debate."
 oe_bells.18.t: "Guards Refuse to Suppress Protesters"
 oe_bells.18.d: "The order has been given, but the guards do not advance. Before them stand artisans and their families, carrying petitions. Their sergeant lowers his weapon and tells his superior that they will defend the streets, but will not treat these people as an enemy army.\n\nThe hesitation lasts only a moment, yet the whole street sees it. Punishing the men would reaffirm the force of command. Pardoning them would encourage others to believe that imperial arms need not always stand beside the throne."
 oe_bells.18.a: "Punish their disobedience."
 oe_bells.18.b: "Pardon them."
 oe_bells.19.t: "An Admonition from the Pulpit"
 oe_bells.19.d: "The priest did not call for rebellion. His sermon concerned the hungry, those denied redress, and a ruler’s duty to hear the humble. Afterwards, citizens asked him to carry these words to the palace. He offered to mediate and persuade both sides to set aside their anger.\n\nAccepting would require the emperor to make a visible concession. Rebuking the preacher might preserve the court’s dignity, but could turn a dispute about justice into the faithful’s disappointment with the throne."
 oe_bells.19.a: "Accept clerical mediation."
 oe_bells.19.b: "Rebuke the preacher."
 oe_bells.20.t: "A Disloyal Guild"
 oe_bells.20.d: "The guildhall’s lamps burn later than usual. The meetings began with taxes and wages; now political pamphlets lie on the tables, and the accounts include donations with obscure destinations. Informants report that several guild elders are providing money and meeting rooms to opponents of the court.\n\nClosing the hall would sever these immediate connections. Other guilds, however, would wonder whether their charters and property could also be taken away with a charge of disloyalty. Tolerating it would allow dissent to establish firmer roots among the shops and workshops."
 oe_bells.20.a: "Close the guildhall."
 oe_bells.20.b: "Leave it alone for now."
