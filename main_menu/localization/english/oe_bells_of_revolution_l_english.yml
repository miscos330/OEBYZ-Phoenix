 oe_bells.1.t: "Voices from the Hippodrome"
 oe_bells.1.d: "The tiers that once awaited the emperor’s gesture now teem with people demanding to be heard. Tax ledgers, marching orders and palace decrees have become a common grievance in Constantinople. A laurel-crowned speaker stands upon the old imperial balcony and declares that Rome’s glory does not belong to the purple alone.\n\nMerchants and envoys carry the news to our court. The phoenix shelters half the world beneath its wings; should those wings catch fire, no roof is entirely safe. Shall we nourish the voices in the streets, defend the throne’s order, or let the bells pass unanswered?"
 oe_bells.2.t: "A New Alignment"
 oe_bells.2.d: "The bells of Constantinople still ring, but the circumstances of our earlier choice have changed. New alliances, old grievances and our overlord’s position weigh upon the balance. We must declare where we now stand."
 oe_bells.rebel.option: "Let the people of Rome hear our support."
 oe_bells.royalist.option: "If the throne falls, order falls with it."
 oe_bells.neutral.option: "We shall remain outside this storm."
 oe_bells_agitate: "Agitate for Revolution in Byzantium"
 oe_bells_agitate_desc: "Spend #Y 25 political influence#! to raise clamor by #Y 1#!, or #Y 0.1#! for a landless country. Cooldown: #Y 4 years#!."
 oe_bells_suppress: "Help Byzantium Suppress Revolution"
 oe_bells_suppress_desc: "Spend #Y 25 political influence#! to reduce clamor by #Y 0.5#!, or #Y 0.1#! for a landless country. Cooldown: #Y 4 years#!."
 oe_bells_fund: "Fund Byzantine Revolutionaries"
 oe_bells_fund_desc: "Spend #Y one month of total income#!. Clamor rises by #Y 2#! for ranks 1–10, #Y 0.5#! for ranks 11–25, #Y 0.25#! for ranks 26–50, or #Y 0.1#! thereafter. Cooldown: #Y 5 years#!."
 oe_bells_hunt: "Help Hunt Byzantine Revolutionaries"
 oe_bells_hunt_desc: "Spend #Y one month of total income#!. Clamor falls by #Y 2#! for ranks 1–10, #Y 0.5#! for ranks 11–25, #Y 0.25#! for ranks 26–50, or #Y 0.1#! thereafter. Cooldown: #Y 5 years#!."
