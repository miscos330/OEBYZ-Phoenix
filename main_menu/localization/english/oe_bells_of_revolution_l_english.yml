 oe_bells_establish_press_desc: "Organize scattered presses into a lasting underground network. Revolutionary Clamor immediately falls by #G 3#!. Gain “Clandestine Press Network” for #Y 5 years#!, with decaying effects. Unavailable while that modifier is present. Cooldown: #Y 5 years#!."
 oe_bells_refuse_taxes: "Refuse to Pay Taxes"
 oe_bells_refuse_taxes_desc: "Express opposition to the court by withholding taxes. Eastern Rome gains “Tax Refusal” for #Y 5 years#! without decay: maximum estate tax #R −10%#!, monthly Revolutionary Clamor #R +0.1#! and tax efficiency #R −5%#!. No cost. Cooldown: #Y 5 years#!."
 oe_bells_army_propaganda: "Spread Propaganda in the Army"
 oe_bells_army_propaganda_desc: "Carry republican ideas and political pamphlets into the barracks. Revolutionary Clamor #R +3#!. No cost. Cooldown: #Y 2 years#!."
 oe_bells_salon_propaganda: "Spread Propaganda in Salons"
 oe_bells_salon_propaganda_desc: "Turn salon debates against the established order. Revolutionary Clamor #R +2#!; current Nobles Estate Satisfaction immediately #R −2.5%#!. Cooldown: #Y 2 years#!."
 oe_bells_court_clergy_sympathizers: "Win Sympathizers in the Church"
 oe_bells_court_clergy_sympathizers_desc: "Approach clergy sympathetic to popular grievances and bring demands for reform into their parishes. Revolutionary Clamor #R +2#!. Cooldown: #Y 2 years#!."
 oe_bells_tax_refusal: "Tax Refusal"
 oe_bells_tax_refusal_desc: "Organized tax refusal weakens revenue collection and fuels revolutionary demands. Lasts five years without decay."
