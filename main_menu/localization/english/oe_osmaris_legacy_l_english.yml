l_english:
 oe_byz_constantinople_manuel_academy: "Manuel Military Academy"
 oe_byz_constantinople_manuel_academy_desc: "The schoolrooms in the Walls district preserve Manuel's drill manuals. Officers study marching, encampment, and battlefield maneuvers, turning one man's experience into a shared body of military knowledge.\nEach level grants national Discipline #G +1%#!, up to #Y level 5#!. Each expansion costs #R 2,000#! treasury gold and has a base construction time of #Y 365 days#!.\n\n$OE_ACADEMY_ARMY_SCORE_100$"
 oe_city_manuel_academy_maintenance: "Manuel Military Academy"
 oe_byz_constantinople_osman_company: "Ottoman Company"
 oe_byz_constantinople_osman_company_desc: "A red banner bearing a golden crescent and star still hangs above this Golden Horn trading house. Its accounts unite the routes, vessels, and warehouses of the House of Osmaris.\nEach level grants Merchant Capacity #G +1#! and national Export Efficiency #G +1%#!. While Byzantium owns Constantinople, Osmaris gains #G +0.2#! monthly Influence per completed level. Maximum #Y 10 levels#!. Each expansion costs #R 1,000#! treasury gold and has a base construction time of #Y 365 days#!."
 oe_city_osman_company_maintenance: "Ottoman Company"
 oe_flavor_byz.1009.t: "Osmaris: Commands That Endure"
 oe_flavor_byz.1009.d: "(Original name: Murad I)\n\nManuel is dead, yet the training grounds still echo with the commands he taught. Veteran officers gather his papers and copy regulations preserved in scattered camps. Some remember his patience when correcting a recruit's grip on a spear; others still shake their heads at his uncompromising discipline. All agree that his knowledge should not be buried with him.\n\nA petition now proposes a military academy in Constantinople's Walls district. There, young officers would study formations, camp duties, and the responsibilities of command. A school bearing Manuel's name would honor his memory by entrusting his work to those who follow."
 oe_flavor_byz.1009.a: "Let his knowledge continue to defend the empire."
 oe_flavor_byz.1009.a.tt: "Unlock the #Y Manuel Military Academy#! in Constantinople's #Y Walls district#! and immediately complete #G level 1#! for free.\nEach level grants national Discipline #G +1%#!, to a maximum of #Y 5 levels#!. Each expansion costs #R 2,000#! gold and has a base construction time of #Y 365 days#!."
 oe_flavor_byz.1009.historical_info: "The historical Murad I was an Ottoman ruler who died during the Battle of Kosovo in 1389. His service as Manuel, an instructor in Eastern Rome, and the academy established in his memory are alternate-history elements of this mod."
 oe_osmaris_constantine_name: "Constantine"
 oe_osmaris_good: "the Good"
 oe_flavor_byz.1010.t: "Osmaris: Constantine the Good"
 oe_flavor_byz.1010.d: "(Original name: Mehmed I)\n\nBasil's thick account books were once the envy of his peers. Now they weigh heavily upon the House of Osmaris. Successive shipwrecks have swallowed cargoes and advances, while heirs dispute shares in vessels, warehouses, and outstanding debts. Distant agents hesitate to commit themselves. The commercial network that spanned the empire stands on the brink of bankruptcy and division.\n\nConstantine does not begin by assigning blame. He visits creditors, finds food for unpaid sailors, and persuades his relatives to postpone dividing the estate while he loads the ships still fit to sail. His robes follow Roman fashions, but the family's red banner with its golden crescent and star remains over the trading house. Beneath it, he insists that everyone must first survive the present hardship. Those he has helped have begun to call him the Good.\n\nKindness alone cannot close the deficit. He comes before the Emperor with a plan to restore the routes and asks the privy purse for working capital. If the warehouses, fleet, and credit can be preserved, the family enterprise may yet recover."
 oe_flavor_byz.1010.a: "We shall help the House of Osmaris."
 oe_flavor_byz.1010.a.tt: "Spend #R six months of privy-purse income#!: #R [SCOPE.GetValue('oe_osmaris_aid_cost')|2]#! gold.\nAuthority #G +2#!.\n$oe_osmaris_house_reward_50_tt$\nIn #Y five years#!, the Osmaris investment return event grants the privy purse #G twenty-four months of its income at that time#!."
 oe_flavor_byz.1010.b: "They must overcome this hardship themselves."
 oe_flavor_byz.1010.b.tt: "$oe_osmaris_house_reward_50_tt$"
 oe_flavor_byz.1010.lapsed: "This request can no longer proceed."
 oe_flavor_byz.1010.lapsed.tt: "The character or family no longer qualifies. No privy-purse funds are spent and no rewards are granted."
 oe_flavor_byz.1010.historical_info: "Mehmed I, son of Bayezid I, emerged victorious from the Ottoman succession struggles following the defeat at Ankara. He ruled the reunified Ottoman state from 1413 to 1421, working to restore order and dynastic authority. Constantine's reconstruction of the family business is an alternate-history interpretation of that role."
 oe_flavor_byz.1011.t: "The Return on the Osmaris Investment"
 oe_flavor_byz.1011.d: "The working capital entrusted to the House of Osmaris five years ago has borne fruit. New accounts show debts repaid, repaired vessels sailing again, and once-hesitant agents working under a common administration. Red banners bearing the golden crescent and star fly once more above laden holds.\n\nThe reorganization directed by Constantine has succeeded. Representatives of the company present the court's share of the return. Money once used to preserve credit has become new cargoes, voyages, and profits. The final page of the ledger awaits the Emperor's approval."
 oe_flavor_byz.1011.a: "Our trust was not misplaced."
 oe_flavor_byz.1011.a.tt: "The privy purse receives #G twenty-four months of income#!: #G [SCOPE.GetValue('oe_osmaris_return_amount')|2]#! gold."
 oe_flavor_byz.1011.historical_info: "The historical Mehmed I ended the Ottoman succession struggle and reunified the divided state. This event adapts the theme of restoring a family's fortunes into an alternate-history commercial recovery and investment return."
