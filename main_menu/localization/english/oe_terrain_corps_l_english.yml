 OE_TERRAIN_GASMOULOI_UNLOCK: "Complete the Expel the Foreigners imperial reform."
 oe_gasmouloi_1: "Gasmouloi"
 oe_gasmouloi_1_desc: "Raised among Roman and Latin communities in the ports, the Gasmouloi know oars, rigging and the close struggle across a ship's rail. With imperial authority restored along the coasts, sailors once hired by rival masters gather beneath one standard to defend the harbours and advance through shores and river mouths.\n\nCoastal combat #G +100%#!, river combat #G +50%#!, morale damage taken #G -10%#!.\n\nUnlock: Complete the Expel the Foreigners imperial reform."
