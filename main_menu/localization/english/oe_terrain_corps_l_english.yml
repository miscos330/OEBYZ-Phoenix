 OE_TERRAIN_ALMOGAVARS_UNLOCK: "Byzantium and its subjects at every level own every conquerable location in Catalonia."
 oe_almogavars_1: "Almogavars"
 oe_almogavars_1_desc: "The Almogavars once formed the striking core of the Catalan Company. Travelling light, they find paths and provisions in barren country and descend from rocky slopes before an enemy can turn to face them. With Catalonia under imperial rule, the edge of these Iberian warriors is directed against Rome's enemies.\n\nMountain combat #G +100%#!, hill combat #G +50%#!, movement speed #G +0.5#!, initiative #G +2#!.\n\nUnlock: Byzantium and its subjects at every level own every conquerable location in Catalonia."
