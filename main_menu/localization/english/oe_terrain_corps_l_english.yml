 OE_TERRAIN_ARMENIAN_CORPS_UNLOCK: "Byzantium and its subjects at every level own every conquerable location in the Armenian Highlands."
 oe_armenian_corps_1: "Armenian Warband"
 oe_armenian_corps_1_desc: "Armenian commanders and warriors once helped sustain the armies of the Macedonian dynasty. As the empire returns to Anatolia and the eastern highlands, that tradition of service is renewed. Armoured warbands accustomed to cold plateaus and rolling hills hold the ridgelines in close order and restore Roman arms to the rugged frontier.\n\nPlateau combat #G +100%#!, hill combat #G +75%#!, mountain combat #G +25%#!, strength damage taken #G -15%#!.\n\nUnlock: Byzantium and its subjects at every level own every conquerable location in the Armenian Highlands."
