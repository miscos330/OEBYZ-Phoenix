 OE_TERRAIN_ALBANIAN_PASS_UNLOCK: "Byzantium and its subjects at every level own every conquerable location in Albania."
 oe_albanian_pass_1: "Albanian Pass Regiment"
 oe_albanian_pass_1_desc: "The highlanders of Albania know the winds and loose stones of every pass. They hold steep ground, shelter their flanks against rock and force stronger enemies onto narrow paths. Their reputation rests on stubborn endurance, making the enemies of the empire pay for every step through the mountains.\n\nMountain combat #G +125%#!, hill combat #G +25%#!, morale damage taken #G -20%#!, strength damage taken #G -10%#!.\n\nUnlock: Byzantium and its subjects at every level own every conquerable location in Albania."
