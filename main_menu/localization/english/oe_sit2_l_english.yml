 oe_sit2.1.a: "Restore order to the realm."
 oe_sit2.1.d: "With turmoil checked yet unresolved, the court at Dadu enters a decisive era of restoration. Reformers and steppe conservatives vie for the dynasty's course while provinces and vassals look on."
 oe_sit2.1.t: "Restoration of the Great Yuan Begins"
 oe_sit2.2.a: "Record this turning point."
 oe_sit2.2.d: "After years of reform and struggle across China and the steppe, the Great Yuan's restoration era reaches its verdict."
 oe_sit2.2.t: "The Great Yuan's Course Decided"
 oe_sit2.21.a: "Steady loyal provinces and civil administration."
 oe_sit2.21.b: "Mobilize the Imperial Guard around Dadu."
 oe_sit2.21.d: "As the Red Turban Rebellions ignite across China, Dadu faces a defining test. How the court balances provincial order and imperial defense now will shape its road toward restoration."
 oe_sit2.21.t: "Situation Bridge: Red Turban Upheaval & Dadu's Response"
 oe_sit2.22.a: "Adapt to the shifting Eurasian tide."
 oe_sit2.22.d: "Timur's armies shake Transoxiana, Persia, and the steppe frontier. Constantinople senses a vital eastern reprieve, while Sarai and Dadu brace along their borders."
 oe_sit2.22.t: "Situation Bridge: The Rise of Timur Shakes Eurasia"
 oe_sit2.23.a: "Play the rival papal courts for diplomatic advantage."
 oe_sit2.23.b: "Stand firm in Orthodox autonomy."
 oe_sit2.23.d: "With rival popes contending in Rome and Avignon, Latin Christendom is divided. Constantinople may either leverage competing papal courts diplomatically or reinforce Orthodox independence."
 oe_sit2.23.t: "Situation Bridge: Byzantium & the Western Schism"
 oe_sit2.24.a: "Assert the imperial presence in Italy."
 oe_sit2.24.b: "Maintain vigilant Adriatic sea defenses."
 oe_sit2.24.d: "As great powers clash across the Italian peninsula, ancient Roman lands return to the center of European politics. The Empire may assert its Italian presence or guard the Adriatic approaches."
 oe_sit2.24.t: "Situation Bridge: The Empire & the Italian Wars"
 oe_sit2.3.a: "Convene the wings and hold the steppe."
 oe_sit2.3.d: "Sarai's grip falters as wing begs and rivals contest the throne. Unless the Khan rallies the ulus, the Kipchak steppe will fracture under internal ambition and frontier pressure."
 oe_sit2.3.t: "The Great Troubles Sweep the Steppe"
 oe_sit2.4.a: "The steppe enters a new era."
 oe_sit2.4.d: "The prolonged upheaval across the Golden Horde comes to a close, settling whether Sarai revives or yields to a fractured steppe."
 oe_sit2.4.t: "Verdict of the Great Troubles"
 oe_sit2.5.a: "Illuminate New Rome with learning."
 oe_sit2.5.d: "Libraries, academies, and workshops flourish once more in Constantinople. Scholarly exchanges with Orthodox realms and Italian republics place Greek letters at the heart of the Mediterranean revival."
 oe_sit2.5.t: "The Byzantine Renaissance Dawns"
 oe_sit2.6.a: "May the flame of learning endure."
 oe_sit2.6.d: "The humanist current bridging Constantinople and Italy has borne lasting fruit, shaping scholarship across the Mediterranean."
 oe_sit2.6.t: "Legacy of the Byzantine Renaissance"
 oe_sit2.7.a: "Prepare the eastern marches."
 oe_sit2.7.d: "With Rus' consolidation advancing, Poland-Lithuania and the steppe-Porte powers confront one another across the vast eastern plains. Border forts, Cossacks, and alliances will decide the coming century."
 oe_sit2.7.t: "Crossroads of Rus' & the Steppe Opens"
 oe_sit2.8.a: "A new eastern order stands."
 oe_sit2.8.d: "After generations of shifting alliances and hard-fought campaigns across the forests of Rus', the plains of Poland-Lithuania, and the open steppe, the great eastern contest has reached its decisive settlement. The victor now commands the vital rivers and frontier corridors, setting a durable new order over Eastern Europe."
 oe_sit2.8.t: "Settlement of the Eastern Crossroads"
