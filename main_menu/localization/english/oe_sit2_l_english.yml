 oe_sit2_yuan_tribute_op: "Supported Yuan Restoration"
 oe_sit_byz_renaissance: "Byzantine Renaissance"
 oe_sit_byz_renaissance_desc: "From the late 14th century onward, Constantinopolitan manuscripts, philosophical debates, and workshops reshape Mediterranean culture. Byzantium, Orthodox realms, and Italian city-states compete and collaborate over the fate of classical learning."
 oe_sit_byz_renaissance_outcome_beacon: "Constantinople Beacon"
 oe_sit_byz_renaissance_outcome_beacon_desc: "Constantinople's cultural radiance reaches 85, crowning the imperial city as the preeminent seat of classical learning."
 oe_sit_byz_renaissance_outcome_flight: "Flight of the Scholars"
 oe_sit_byz_renaissance_outcome_flight_desc: "With Byzantium fallen or radiance below 85 by 1530, Greek scholars carry the classical heritage westward to Italy."
 oe_sit_byz_renaissance_outcome_shared: "Shared Mediterranean Renaissance"
 oe_sit_byz_renaissance_outcome_shared_desc: "Exchange reaches 80 while Constantinople holds at least 45 radiance, forging a shared Greco-Italian renaissance."
 oe_sit_eastern_crossroads: "Crossroads of Rus' & the Steppe"
 oe_sit_eastern_crossroads_desc: "As the Tatar yoke loosens and Rus' consolidation matures, the Eastern European plain enters a three-way contest: Rus' ascendancy, the Polish-Lithuanian bloc, and the steppe-Porte frontier vie through border forts, Cossack pacts, and alliances."
 oe_sit_eastern_crossroads_outcome_balance: "Eurasian Equilibrium"
 oe_sit_eastern_crossroads_outcome_balance_desc: "By 1580 or if the steppe-Porte front reaches 80, the eastern triangle settles into a lasting armed equilibrium."
 oe_sit_eastern_crossroads_outcome_rus: "Rus' Hegemony of the Plain"
 oe_sit_eastern_crossroads_outcome_rus_desc: "Rus' ascendancy reaches 80, establishing mastery from the northern forests to the steppe frontier."
 oe_sit_eastern_crossroads_outcome_west: "Commonwealth Bulwark"
 oe_sit_eastern_crossroads_outcome_west_desc: "Commonwealth influence reaches 80, securing the Polish-Lithuanian bulwark across Eastern Europe."
 oe_sit_glh_troubles: "Great Troubles of the Golden Horde"
 oe_sit_glh_troubles_desc: "Dynastic turmoil shakes Sarai as rival khans and begs contend for supremacy. The five Jochid wings test the Khan's cohesion while Rus', Poland-Lithuania, and Constantinople gauge the balance of the steppe."
 oe_sit_glh_troubles_outcome_extinguished: "Golden Horde Extinguished"
 oe_sit_glh_troubles_outcome_extinguished_desc: "The Golden Horde is extinguished, ending Sarai's rule over the Kipchak steppe."
 oe_sit_glh_troubles_outcome_fractured: "Fractured Steppes"
 oe_sit_glh_troubles_outcome_fractured_desc: "Cohesion collapses to 10 in Phase 3 (or remains <= 20 by 1490), ushering in a fractured multi-khanate steppe."
 oe_sit_glh_troubles_outcome_revival: "Jochid Revival"
 oe_sit_glh_troubles_outcome_revival_desc: "The Golden Horde reaches Jochid Revival (Phase 4) or sustains cohesion at 85+ after 24 months."
 oe_sit_yuan_restoration: "Restoration of the Great Yuan"
 oe_sit_yuan_restoration_desc: "Testing the resilience of Dadu, the Great Yuan balances Han-law administrative reform against steppe custom. Linked with the Middle Kingdom panel's Zhizheng Reform Track, provinces, Chinggisid princes, and East Asian vassals watch whether the dynasty can consolidate its mandate."
 oe_sit_yuan_restoration_outcome_lost: "Mandate Lost"
 oe_sit_yuan_restoration_outcome_lost_desc: "The Great Yuan ceases to exist, closing the era of Chinggisid rule in East Asia."
 oe_sit_yuan_restoration_outcome_restored: "Great Yuan Restored"
 oe_sit_yuan_restoration_outcome_restored_desc: "Restoration progress reaches 80 or the Yuan Restoration chain completes, securing both China and the steppe."
 oe_sit_yuan_restoration_outcome_retreat: "Northern Retreat"
 oe_sit_yuan_restoration_outcome_retreat_desc: "Dadu is lost or restoration remains incomplete by 1415, pivoting the dynasty into a northern steppe court."
