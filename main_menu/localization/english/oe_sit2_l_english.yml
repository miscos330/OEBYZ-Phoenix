 STATIC_MODIFIER_DESC_oe_sit2_br_iw_italy_mod: "As war engulfs Italy, the Empire asserts its ancient presence across the peninsula."
 STATIC_MODIFIER_DESC_oe_sit2_br_iw_vigil_mod: "Watching the Italian wars unfold, the Empire fortifies its Adriatic and Ionian sea lanes."
 STATIC_MODIFIER_DESC_oe_sit2_br_rtr_guard_mod: "The imperial guard mobilizes to shield Dadu and key northern passes."
 STATIC_MODIFIER_DESC_oe_sit2_br_rtr_order_mod: "Emergency decrees steady loyal provinces during the Red Turban upheaval."
 STATIC_MODIFIER_DESC_oe_sit2_br_schism_diplo_mod: "Imperial envoys play rival papal courts against one another for aid and treaties."
 STATIC_MODIFIER_DESC_oe_sit2_br_schism_ortho_mod: "While Latin Christendom divides, the Empire rallies around Orthodox unity."
 STATIC_MODIFIER_DESC_oe_sit2_br_timur_byz_mod: "Timur's campaign in the East relieves pressure on Constantinople and opens diplomatic space."
 STATIC_MODIFIER_DESC_oe_sit2_br_timur_steppe_mod: "Timurid advances across Central Asia place steppe and silk-road borders on high alert."
 STATIC_MODIFIER_DESC_oe_sit2_ec_balance_mod: "Rival eastern powers settle into an armed balance along the steppe frontier."
 STATIC_MODIFIER_DESC_oe_sit2_ec_cossack_mod: "Pacts with frontier riders supply swift cavalry and bolster the borderland levies."
 STATIC_MODIFIER_DESC_oe_sit2_ec_envoy_mod: "Envoys weave alliances across Rus', the Commonwealth, and the Pontic steppe."
 STATIC_MODIFIER_DESC_oe_sit2_ec_garrison_mod: "Fortified border posts and disciplined garrisons secure the frontier plains."
 STATIC_MODIFIER_DESC_oe_sit2_ec_rus_triumph_mod: "Rus' emerges dominant from the eastern triangle, setting the order of forest and steppe."
 STATIC_MODIFIER_DESC_oe_sit2_ec_west_triumph_mod: "The Polish-Lithuanian bloc secures the Dnieper frontier and its eastern preeminence."
 STATIC_MODIFIER_DESC_oe_sit2_glh_autonomy_mod: "Regional begs expand their levies and fiscal autonomy while Sarai's grip weakens."
 STATIC_MODIFIER_DESC_oe_sit2_glh_fractured_mod: "With the wings pulling apart, the Great Horde adapts to a fragmented steppe order."
 STATIC_MODIFIER_DESC_oe_sit2_glh_frontier_mod: "Rus' and Black Sea realms fortify their marches while the steppe fractures."
 STATIC_MODIFIER_DESC_oe_sit2_glh_rally_mod: "The Khan convenes the wing lords to reassert Sarai's command and steady the horde."
 STATIC_MODIFIER_DESC_oe_sit2_glh_revived_mod: "The troubles end with Sarai once again commanding the loyalty of the Jochid wings."
 STATIC_MODIFIER_DESC_oe_sit2_ren_academy_mod: "Imperial patronage funds manuscript workshops and chairs of philosophy in Constantinople."
 STATIC_MODIFIER_DESC_oe_sit2_ren_beacon_mod: "Standing unbroken, Constantinople radiates classical scholarship across the Mediterranean."
 STATIC_MODIFIER_DESC_oe_sit2_ren_debate_mod: "Court debates bridge classical letters and Orthodox theology, raising literacy and prestige."
 STATIC_MODIFIER_DESC_oe_sit2_ren_flight_mod: "Exiled Greek scholars enrich western libraries and accelerate humanist learning."
 STATIC_MODIFIER_DESC_oe_sit2_ren_scholars_mod: "Visiting Greek masters and rare codices invigorate humanist study and institutional growth."
 STATIC_MODIFIER_DESC_oe_sit2_ren_shared_mod: "Constantinople and the Italian cities exchange codices and artisans in a shared revival."
 STATIC_MODIFIER_DESC_oe_sit2_yr_northern_mod: "Withdrawing northward, the court preserves the Chinggisid lineage and hardens its frontier hosts."
 STATIC_MODIFIER_DESC_oe_sit2_yr_reform_mod: "The Central Secretariat tightens fiscal and administrative order along classical governance lines."
 STATIC_MODIFIER_DESC_oe_sit2_yr_restored_mod: "Having weathered the crisis, the Great Yuan restores order across both the plains and the steppe."
 STATIC_MODIFIER_DESC_oe_sit2_yr_steppe_mod: "Imperial charters rally the Chinggisid princes and steppe banners behind the throne."
 STATIC_MODIFIER_DESC_oe_sit2_yr_tribute_mod: "Vassals and envoys affirm ties with Dadu, steadying tribute and regional trade."
