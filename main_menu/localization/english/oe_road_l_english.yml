# NEW 2026-11-22 v12.2 Worker 1: Imperial Road Office Auto-Builder (english). Generated by gen_v122_imperial_roads.py; edit the generator, not this file.
 oe_road_dec_open_console: "Imperial Road Office: Smart Auto-Road Console"
 oe_road_dec_open_console.title: "Imperial Road Office: Smart Auto-Road Console"
 oe_road_dec_open_console.desc: "Open the Imperial Road Office console to configure the auto-builder master switch, three routing modes (Imperial Proximity / Market & Manufactories / Culture 2.0 Assimilation Sprint), imperial road priority policy, treasury reserve floor, and monthly segment cap. All roads pay full cost and build time, and the office automatically yields if an external auto-road mod is active."
 oe_road_dec_open_console.a: "Summon the Road Commissioner"
 oe_road_dec_open_ledger: "Imperial Road Office: Live Road Ledger"
 oe_road_dec_open_ledger.title: "Imperial Road Office: Live Road Ledger"
 oe_road_dec_open_ledger.desc: "Inspect live auto-road status, highest unlocked road tier, safe treasury threshold, external auto-road mod yield status, and cumulative road segments queued."
 oe_road_dec_open_ledger.a: "Open Road Ledger"
 oe_road_human_only_tt: "Human player only; never enabled for AI countries to guarantee zero performance overhead"
 oe_road.1.t: "Imperial Road Office: Smart Auto-Road Console"
 oe_road.1.d: "#T Status#! Auto-Builder: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_road_rd_enabled')|0]#! (1=ON, 0=OFF) | External Auto-Road Yield: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_road_rd_ogas_yield')|0]#! (1=external auto-road mod detected; office yields to prevent double spending)\n#T Active Policy#! Routing Mode: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_road_rd_mode')|0]#! (1=Imperial Proximity, 2=Market & Manufactories, 3=Culture 2.0 Assimilation Sprint) | Tier Policy: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_road_rd_tier_policy')|0]#! (1=Best Imperial Road, 2=Economic Coverage)\n#T Treasury & Pacing#! Current Treasury: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_road_rd_gold')|0]#! ducats | Reserve Floor: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_road_floor_value')|0]#! ducats | Safe Threshold: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_road_safe_gold')|0]#! ducats | Cap: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_road_pacing_cap')|0]#! seg/month\n#T Highest Unlocked Road Tier Code#! #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_road_rd_best_tier_code')|0]#! (7=Railroad, 6=Siberian Trakt, 5=Modern, 4=Via Imperialis, 3=Yam Post, 2=Paved, 1=Gravel, 0=None)"
 oe_road.1.a: "Toggle Auto-Road Master Switch (ON / OFF)"
 oe_road.1.b: "Run One Road Inspection Pass Now & Open Ledger"
 oe_road.1.c: "Configure Smart Routing Mode & Road Tier Policy"
 oe_road.1.e: "Configure Treasury Reserve Floor & Monthly Cap"
 oe_road.1.f: "Open Read-Only Live Road Ledger"
 oe_road.1.z: "Save & Close Console"
 oe_road.10.t: "Imperial Road Office: Routing Mode & Tier Policy"
 oe_road.10.d: "#T Active Routing & Tier Settings#! Routing Mode: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_road_rd_mode')|0]#! | Tier Policy: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_road_rd_tier_policy')|0]#! | Best Unlocked Tier Code: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_road_rd_best_tier_code')|0]#!\n\n#T Three Routing Modes#!\n1. #Y Imperial Proximity Network (Default)#!: Prioritizes populous high-tax towns and cities, locations lacking a road to the capital, and overseas governor palaces to raise control rapidly.\n2. #Y Market & Manufactories Network#!: Prioritizes market centers, ports, the six imperial manufactories, colonial customs and recruitment bureaus, and low market-access producers.\n3. #Y Culture 2.0 Assimilation Sprint#!: Targets non-primary culture towns stuck below 0.50 / 0.65 local control, academy cities, unroaded friction provinces, and frontier colonies under the 10-year integration boost.\n\n#T Road Tier Policies#!\n1 = Best Unlocked Imperial Road (follows the 7-tier ladder, prioritizing unique imperial roads and upgrades) | 2 = Economic Basic Coverage (only builds missing roads: gravel for rural, paved or Tier-2 imperial roads for towns)."
 oe_road.10.a: "Set Mode 1: Imperial Proximity Network (Default)"
 oe_road.10.b: "Set Mode 2: Market, Port & Manufactory Network"
 oe_road.10.c: "Set Mode 3: Culture 2.0 Assimilation Sprint"
 oe_road.10.e: "Toggle Tier Policy (1=Best Imperial Road / 2=Economic)"
 oe_road.10.z: "Return to Master Console"
 oe_road.20.t: "Imperial Road Office: Treasury Floor & Monthly Pacing"
 oe_road.20.d: "#T Dual Treasury Safety & Pacing Settings#!\nCurrent Treasury: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_road_rd_gold')|0]#! ducats | Reserve Floor: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_road_floor_value')|0]#! ducats (Tiers: 300 / 800 / 1500 / 3000 / 5000)\nSafe Start Threshold: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_road_safe_gold')|0]#! ducats (Reserve Floor + per-segment road tier buffer, rechecked before every segment so the treasury never overdrafts)\nMonthly Pacing Cap: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_road_pacing_cap')|0]#! segments/month (Tiers: Conservative 2 / Standard 5 / Imperial Mega-Build 10)"
 oe_road.20.a: "Cycle Reserve Floor (300 / 800 / 1500 / 3000 / 5000)"
 oe_road.20.b: "Cycle Monthly Cap (2 / 5 / 10 Segments)"
 oe_road.20.z: "Return to Master Console"
 oe_road.90.t: "Imperial Road Office: Transparent Read-Only Ledger"
 oe_road.90.d: "#T Live Status#! Switch: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_road_rd_enabled')|0]#! | Mode: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_road_rd_mode')|0]#! | Tier Policy: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_road_rd_tier_policy')|0]#! | External Mod Yield: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_road_rd_ogas_yield')|0]#! | Best Tier Code: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_road_rd_best_tier_code')|0]#!\n#T Budget Parameters#! Treasury: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_road_rd_gold')|0]#! | Reserve Floor: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_road_floor_value')|0]#! | Safe Threshold: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_road_safe_gold')|0]#! | Monthly Cap: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_road_pacing_cap')|0]#! seg\n#T Construction Telemetry#! This Year Queued: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_road_rd_yr_segments')|0]#! seg | Lifetime Total: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_road_rd_life_segments')|0]#! seg | Non-Primary Culture Assimilation Segments: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_road_rd_cul2_segments')|0]#! seg"
 oe_road.90.a: "Close Road Ledger"
 oe_road.90.b: "Return to Master Console"
 oe_road.90.c: "Reset Cumulative Telemetry Counters"
