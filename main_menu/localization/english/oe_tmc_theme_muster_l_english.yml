 oe_tmc.1.desc: "Before a tenth-century emperor took the field, orders went out to the themes. Each theme's troops brought their own supplies and joined the imperial army at assembly camps such as Malagina, Dorylaion and Kaisareia; Constantine VII's rules for imperial expeditions list these camps from west to east. The Palaiologan standing army was small, about 3,000 horsemen in 1321, and a great war depended on the pronoia holders answering the summons.\n\nThe order for the campaign has reached the themes.\n\nAnswered with troops: #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_tmc_n_sent').GetValue|0]#! themes, #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_tmc_n_regs').GetValue|0]#! regiments in all\nHolding back: [GetCountry('BYZ').MakeScope.GetVariable('oe_tmc_n_late').GetValue|0] themes\nOpenly refusing: #R [GetCountry('BYZ').MakeScope.GetVariable('oe_tmc_n_refused').GetValue|0]#! themes; war pressure has already risen by [GetCountry('BYZ').MakeScope.GetVariable('oe_tmc_refuse_press').GetValue|0]\n\n(A Loyal theme sends 2 regiments, one infantry and one cavalry; a Steady theme sends 1, cavalry from a frontier theme and infantry from the others. A campaign raises at most 8 regiments; themes beyond that stay at home and still count as answering. Restless themes hold back; Disloyal themes refuse openly, each raising war pressure by 3, at most 15 in all. Only answering themes share in the rewards after the war.)"
 oe_tmc.1.a: "March with what we have"
 oe_tmc.1.a.tt: "The themes that hold back or refuse send nothing this time\nIf the campaign ends in victory, the refusers may be called to account"
 oe_tmc.1.b: "Pay the refusers to march"
 oe_tmc.1.b.tt: "−[GetCountry('BYZ').MakeScope.GetVariable('oe_tmc_pay_cost').GetValue|0] gold (60 for each refusing theme)\nThe refusing themes answer after all, 1 regiment each (cavalry from a frontier theme; at most 8 regiments in this campaign)\nWar pressure −[GetCountry('BYZ').MakeScope.GetVariable('oe_tmc_refuse_press').GetValue|0] (the pressure from the refusals is taken back)"
 oe_tmc.1.c: "Threaten them with military law"
 oe_tmc.1.c.tt: "Each refusing theme: loyalty −10, also added to its loyalty target for 5 years\nThe refusing themes answer after all, 1 regiment each (cavalry from a frontier theme; at most 8 regiments in this campaign)\nWar pressure −[GetCountry('BYZ').MakeScope.GetVariable('oe_tmc_refuse_press').GetValue|0] (the pressure from the refusals is taken back)"
 oe_tmc.2.t: "The Vanguard"
 oe_tmc.2.desc: "In March 979 Bardas Phokas rode out in person at Pankalia and fought the rebel Bardas Skleros in single combat. Skleros was gravely wounded and his army broke up. A general at the very front can decide a war in a day; if he falls, the whole army wavers with him.\n\n[SCOPE.sCharacter('oe_tmc_strat').GetName], strategos of [SCOPE.sCountry('oe_tmc_theme').GetName], asks to lead the vanguard in person: it is the honour the soldiers of [SCOPE.sCountry('oe_tmc_theme').GetName] have earned."
 oe_tmc.2.a: "Grant the request"
 oe_tmc.2.a.tt: "Current campaign progress +6\n[SCOPE.sCountry('oe_tmc_theme').GetName] loyalty +5, also added to its loyalty target for 5 years\n[SCOPE.sCharacter('oe_tmc_strat').GetName] wins the first honours: if the campaign ends in victory [SCOPE.sCharacter('oe_tmc_strat').GetSheHe] comes home too popular\n20%: a month from now [SCOPE.sCharacter('oe_tmc_strat').GetSheHe] falls with the vanguard"
 oe_tmc.2.b: "Give the vanguard to another"
 oe_tmc.2.b.tt: "Current campaign progress +3\n[SCOPE.sCountry('oe_tmc_theme').GetName] loyalty −3, also added to its loyalty target for 5 years"
 oe_tmc.3.t: "The Levy Is Late"
 oe_tmc.3.desc: "In the tenth century a soldier holding military land either served in person or paid for a soldier; by the eleventh, service had mostly been turned into money. In the Palaiologan age John Tarchaneiotes spent 1298 to 1300 reorganising the pronoiai of the Thracesian theme to turn the grants back into soldiers; once he left, the reform came to nothing.\n\n[SCOPE.sCharacter('oe_tmc_strat').GetName], strategos of [SCOPE.sCountry('oe_tmc_theme').GetName], writes that the local lords are still bringing in the harvest and the troops will set out later. He does not say how much later."
 oe_tmc.3.a: "Send a commissioner"
 oe_tmc.3.a.tt: "Imperial Authority −2\n[SCOPE.sCountry('oe_tmc_theme').GetName] loyalty −5, also added to its loyalty target for 5 years\n[SCOPE.sCountry('oe_tmc_theme').GetName] answers the summons with 1 regiment (cavalry from a frontier theme; at most 8 regiments in this campaign)"
 oe_tmc.3.b: "Accept money instead of men"
 oe_tmc.3.b.tt: "[SCOPE.sCountry('oe_tmc_theme').GetName] hands over up to 100 gold from its treasury\n[SCOPE.sCountry('oe_tmc_theme').GetName] loyalty +3, also added to its loyalty target for 5 years\n[SCOPE.sCountry('oe_tmc_theme').GetName] still does not count as answering"
 oe_tmc.3.c: "Let it be"
 oe_tmc.3.c.tt: "Current campaign war pressure +3\n[SCOPE.sCountry('oe_tmc_theme').GetName] still does not count as answering"
 oe_tmc.4.t: "A Quarrel over the Glory"
 oe_tmc.4.desc: "In 1040 George Maniakes won a victory in Sicily, but the enemy commander escaped by sea. Maniakes blamed Stephen, who commanded the fleet, and humiliated him in public. Stephen was the emperor's kinsman by marriage; one letter to the capital, and Maniakes was recalled and imprisoned. Sicily was lost again soon after.\n\n[SCOPE.sCharacter('oe_tmc_strat').GetName] of [SCOPE.sCountry('oe_tmc_theme').GetName] and [SCOPE.sCharacter('oe_tmc_strat2').GetName] of [SCOPE.sCountry('oe_tmc_theme2').GetName] are quarrelling over the glory in camp, each saying the other threw away the chance. Their men will no longer share a camp."
 oe_tmc.4.a: "Back [SCOPE.sCharacter('oe_tmc_strat').GetName]"
 oe_tmc.4.a.tt: "Current campaign progress +3\n[SCOPE.sCountry('oe_tmc_theme').GetName] loyalty +5, [SCOPE.sCountry('oe_tmc_theme2').GetName] loyalty −8, both also added to their loyalty targets for 5 years"
 oe_tmc.4.b: "Back [SCOPE.sCharacter('oe_tmc_strat2').GetName]"
 oe_tmc.4.b.tt: "Current campaign progress +3\n[SCOPE.sCountry('oe_tmc_theme2').GetName] loyalty +5, [SCOPE.sCountry('oe_tmc_theme').GetName] loyalty −8, both also added to their loyalty targets for 5 years"
 oe_tmc.4.c: "Make them both give way"
 oe_tmc.4.c.tt: "Imperial Authority −2\n[SCOPE.sCountry('oe_tmc_theme').GetName] and [SCOPE.sCountry('oe_tmc_theme2').GetName] loyalty +2 each, both also added to their loyalty targets for 5 years\nThe mediation costs time: current campaign war pressure +3"
 oe_tmc.5.t: "A Strategos Falls"
 oe_tmc.5.desc: "In the 990s Ashot, son of Gregory Taronites, doux of Thessalonica, led the vanguard after the Bulgarians and rode into Samuel's ambush. Gregory hurried to the rescue with the main force and was killed.\n\n[SCOPE.sCharacter('oe_tmc_fallen').GetName], strategos of [SCOPE.sCountry('oe_tmc_theme').GetName], has fallen at the front. As the theme's custom requires, the officers have taken command and a new strategos has been chosen. The whole army is watching how the court treats the dead."
 oe_tmc.5.a: "A state funeral and a pension for [SCOPE.sCharacter('oe_tmc_fallen').GetHerHis] family"
 oe_tmc.5.a.tt: "−100 gold\n[SCOPE.sCountry('oe_tmc_theme').GetName] loyalty +8, also added to its loyalty target for 5 years\nCurrent campaign war pressure −3"
 oe_tmc.5.b: "Bury [SCOPE.sCharacter('oe_tmc_fallen').GetHerHim] where [SCOPE.sCharacter('oe_tmc_fallen').GetSheHe] fell; the war comes first"
 oe_tmc.5.b.tt: "[SCOPE.sCountry('oe_tmc_theme').GetName] loyalty −3, also added to its loyalty target for 5 years\nCurrent campaign war pressure +3"
 oe_tmc.6.t: "The Themes and the Reckoning"
 oe_tmc.6.desc1: "By old custom, when the army comes home, the generals who served well receive titles and gifts from the court.\n\nThe campaign has ended in victory. The [GetCountry('BYZ').MakeScope.GetVariable('oe_tmc_n_rew').GetValue|0] themes that answered the summons are waiting for their reward."
 oe_tmc.6.desc2: "By old custom, when the army comes home, the generals who served well receive titles and gifts from the court.\n\nThe campaign has ended in a negotiated peace. The [GetCountry('BYZ').MakeScope.GetVariable('oe_tmc_n_rew').GetValue|0] themes that answered the summons did their part and expect the court to remember it."
 oe_tmc.6.desc: "At Manzikert in 1071 Andronikos Doukas, leading the reserve, ignored the emperor's order and marched straight back to camp, and the battle was lost. After a defeat someone must carry the blame.\n\nThe campaign has ended in retreat. The [GetCountry('BYZ').MakeScope.GetVariable('oe_tmc_n_rew').GetValue|0] themes that answered the summons lost men, and the frontier themes must face an emboldened enemy alone."
 oe_tmc.6.a: "Confer court dignities"
 oe_tmc.6.a.tt: "Imperial Authority −3\nEvery answering theme: loyalty +10, also added to its loyalty target for 5 years"
 oe_tmc.6.b: "Gifts of gold and silk"
 oe_tmc.6.b.tt: "−[GetCountry('BYZ').MakeScope.GetVariable('oe_tmc_gift_cost').GetValue|0] gold (40 for each answering theme, at most 400)\nEvery answering theme: loyalty +8, also added to its loyalty target for 5 years"
 oe_tmc.6.c: "The glory is the emperor's"
 oe_tmc.6.c.tt: "Prestige +10\nEvery answering theme: loyalty +5, also added to its loyalty target for 5 years"
 oe_tmc.6.d: "The emperor takes the blame"
 oe_tmc.6.d.tt: "Legitimacy −5\nEvery answering theme: loyalty −3; every frontier theme, answering or not, a further −3; all also added to the loyalty targets for 5 years"
 oe_tmc.6.e: "Blame the strategoi"
 oe_tmc.6.e.tt: "Every answering theme: loyalty −5; every frontier theme, answering or not, a further −5; all also added to the loyalty targets for 5 years"
 oe_tmc.6.f: "Pensions for the families of the fallen"
 oe_tmc.6.f.tt: "−150 gold\nEvery answering theme: loyalty −2; every frontier theme, answering or not, a further −5; all also added to the loyalty targets for 5 years"
 oe_tmc.7.t: "The Refusers Called to Account"
 oe_tmc.7.desc: "Leo VI's Taktika, written around 900, gives a whole chapter to military penalties: death, corporal punishment, restitution or fines, as the offence deserves.\n\nThe campaign has been won. The [GetCountry('BYZ').MakeScope.GetVariable('oe_tmc_n_pun').GetValue|0] themes that openly refused to march have now sent envoys to the capital with their congratulations. Some at court say this is the moment to settle accounts."
 oe_tmc.7.a: "Replace the strategoi who refused"
 oe_tmc.7.a.tt: "Imperial Authority +2\nEach refusing theme: 80%: its strategos steps down and a new one takes over; 20%: the strategos refuses to give up the command and rises next month"
 oe_tmc.7.b: "Fine their treasuries"
 oe_tmc.7.b.tt: "Each refusing theme hands over up to 100 gold from its treasury; loyalty −5, also added to its loyalty target for 5 years"
 oe_tmc.7.c: "Let bygones be bygones"
 oe_tmc.7.c.tt: "Imperial Authority −2\nEvery refusing theme: loyalty +5, also added to its loyalty target for 5 years"
 oe_tmc.8.t: "Too Popular a General"
 oe_tmc.8.desc1: "In 970 Bardas Skleros crushed the Rus at Arcadiopolis and won the army's heart. When the court took away his eastern command in 976, his soldiers followed him into revolt, and it took three years to put down.\n\n[SCOPE.sCharacter('oe_tmc_strat').GetName], strategos of [SCOPE.sCountry('oe_tmc_theme').GetName], has come home in triumph. The people of the capital shout [SCOPE.sCharacter('oe_tmc_strat').GetHerHis] name in the streets, and the veterans say they will follow no other banner. [SCOPE.sCountry('oe_tmc_theme').GetName]'s loyalty is already below 40 and its army is among the three largest; at court some already say [SCOPE.sCharacter('oe_tmc_strat').GetSheHe] has an eye on the throne."
 oe_tmc.8.desc: "In 970 Bardas Skleros crushed the Rus at Arcadiopolis and won the army's heart. When the court took away his eastern command in 976, his soldiers followed him into revolt, and it took three years to put down.\n\n[SCOPE.sCharacter('oe_tmc_strat').GetName], strategos of [SCOPE.sCountry('oe_tmc_theme').GetName], has come home in triumph. The people of the capital shout [SCOPE.sCharacter('oe_tmc_strat').GetHerHis] name in the streets, and the veterans say they will follow no other banner."
 oe_tmc.8.a: "Grant [SCOPE.sCharacter('oe_tmc_strat').GetHerHim] a triumph"
 oe_tmc.8.a.tt: "Prestige +5, legitimacy −5\n[SCOPE.sCountry('oe_tmc_theme').GetName] loyalty +10, also added to its loyalty target for 5 years\n[SCOPE.sCountry('oe_tmc_theme').GetName] military efficiency +10 (5 years)"
 oe_tmc.8.b: "Call [SCOPE.sCharacter('oe_tmc_strat').GetHerHim] to court with high office"
 oe_tmc.8.b.tt: "Imperial Authority −2\n[SCOPE.sCharacter('oe_tmc_strat').GetName] steps down and a new strategos takes over\n[SCOPE.sCountry('oe_tmc_theme').GetName] loyalty −5, also added to its loyalty target for 5 years"
 oe_tmc.8.c: "Take back [SCOPE.sCharacter('oe_tmc_strat').GetHerHis] command"
 oe_tmc.8.c.tt: "Imperial Authority −3\nHalf of [SCOPE.sCountry('oe_tmc_theme').GetName]'s armies (rounded up) pass to the empire\n[SCOPE.sCountry('oe_tmc_theme').GetName] current loyalty −10\n[SCOPE.sCountry('oe_tmc_theme').GetName] cannot be disarmed again for 10 years"
 oe_tmc.8.d: "Pay it no heed"
 oe_tmc.8.d.tt: "[SCOPE.sCountry('oe_tmc_theme').GetName] loyalty −10, also added to its loyalty target for 5 years\nIf [SCOPE.sCountry('oe_tmc_theme').GetName]'s loyalty falls below 40 while its army is among the three largest, [SCOPE.sCharacter('oe_tmc_strat').GetName] will eye the throne: when the court intrigue produces a coup, there is a 40% chance [SCOPE.sCharacter('oe_tmc_strat').GetSheHe] leads it"
