l_english:
 oe_tmc.1.t: "The Themes Are Summoned"
 oe_tmc.1.desc1: "Before a tenth-century emperor took the field, orders went out to the themes. Each theme's troops brought their own supplies and joined the imperial army at assembly camps such as Malagina, Dorylaion and Kaisareia; Constantine VII's rules for imperial expeditions list these camps from west to east. The Palaiologan standing army was small, about 3,000 horsemen in 1321, and a great war depended on the pronoia holders answering the summons.\n\nThe order for the campaign in Egypt has reached the themes.\n\nAnswered with troops: #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_tmc_n_sent').GetValue|0]#! themes, #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_tmc_n_regs').GetValue|0]#! regiments in all\nHolding back: [GetCountry('BYZ').MakeScope.GetVariable('oe_tmc_n_late').GetValue|0] themes\nOpenly refusing: #R [GetCountry('BYZ').MakeScope.GetVariable('oe_tmc_n_refused').GetValue|0]#! themes; war pressure has already risen by [GetCountry('BYZ').MakeScope.GetVariable('oe_tmc_refuse_press').GetValue|0]\n\n(A Loyal theme sends 2 regiments, one infantry and one cavalry; a Steady theme sends 1, cavalry from a frontier theme and infantry from the others. A campaign raises at most 8 regiments; themes beyond that stay at home and still count as answering. Restless themes hold back; Disloyal themes refuse openly, each raising war pressure by 3, at most 15 in all. Only answering themes share in the rewards after the war.)"
