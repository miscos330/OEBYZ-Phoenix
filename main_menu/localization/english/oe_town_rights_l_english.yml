l_english:
 city_of_hero: "City of Heroes"
 city_of_hero_desc: "When Asia Minor fell to the Turks, Philadelphia alone stood firm, a beacon in the storm sustaining our people's will to resist."
 oe_rights_heart_of_orthodox: "Heart of Orthodoxy"
 oe_rights_heart_of_orthodox_desc: "Constantinople is the heart of the Ecumenical Patriarchate and a holy city for all Orthodox Christians."
 oe_rights_thessaloniki_mint: "Thessaloniki Minting Center"
 oe_rights_thessaloniki_mint_desc: "The goldsmiths of Thessaloniki strike imperial coin and assay its weight and fineness under the authority of the crown. Thessaloniki may hold one copy of this right. Completing the Coinage Reform upgrades an existing grant to an Imperial Minting Center."
 oe_rights_imperial_mint: "Imperial Minting Center"
 oe_rights_imperial_mint_desc: "The reformed mint brings goldsmiths, assayers and imperial officials under a common ordinance, supplying the trade routes with trusted coin. Available in Thessaloniki, and in Genoa after imperial authorization. Each location may hold only one copy."
 oe_rights_book_of_eparch: "The Book of the Eparch"
 oe_rights_book_of_eparch_desc: "The Eparch reaffirms the rights and duties of the guilds of Constantinople. From silk workshops to street shops, common ordinances bind the livelihood of artisans to the orderly growth of the capital."
 oe_rights_imperial_charities: "Charitable Foundations"
 oe_rights_imperial_charities_desc: "Monasteries, almshouses and parish kitchens provide for the clergy and the poor of the capital. Imperial recognition gives these charitable foundations a lasting place in the distribution of food and alms.\n\nLocal Laborer Food Consumption -5%."
 oe_rights_imperial_academy: "Imperial Academic Center"
 oe_rights_imperial_academy_desc: "Scribes, teachers and students gather in Constantinople, carrying ancient learning between lecture halls and bookshops. Endowed chairs, libraries and apprenticeships preserve the scholarly tradition and welcome learned visitors from abroad."
 oe_mint_before_coinage_reform_tt: "The Coinage Reform has not been completed; after the reform, grant an Imperial Minting Center instead"
 oe_mint_coinage_reformed_tt: "Byzantium has completed the Coinage Reform"
 oe_imperial_mint_location_tt: "The location is Thessaloniki, or Genoa after authorization through its historical event"
 oe_genoa_imperial_mint_unlocked_tt: "Allows the #Y Imperial Minting Center#! town right to be granted in #Y Genoa#!"
 oe_mint_rights.1.t: "A New Imperial Die in Liguria"
 oe_mint_rights.1.d: "With the coinage reform proclaimed, the imperial assayers can turn their attention westward. The port of Genoa and the cities of Tuscany now lie under Roman protection. The precious metals brought by merchants, the skill of their guilds and their Mediterranean exchange networks await a common minting ordinance.\n\nThe merchants petition for an imperial minting center in Genoa, striking coin to the weight and fineness approved in Constantinople. Its charter would carry the emperor's credit through the markets of the west. Together, the furnaces of Thessaloniki and Liguria would sustain the currency of a restored empire."
 oe_mint_rights.1.a: "Let the imperial die serve both east and west."
