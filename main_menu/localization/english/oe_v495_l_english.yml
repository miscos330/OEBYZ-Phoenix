 # --- Everyday Dynasty, Festival & Grand Tour Flavor Events (24 x 3 Options) ---
 oe_v495_fl.1.title: "Exotic Maritime Tribute Menagerie"
 oe_v495_fl.1.desc: "A tall merchant carrack has anchored at our main port carrying an astonishing cargo of diplomatic gifts from distant shores: a stately spotted giraffe, twin white peacocks, and bright talking parrots trained to greet guests in courtly rhyme. Citizens line the avenues to glimpse the procession as ministers debate whether to house the beasts in a permanent royal pavilion, open a grand public fair, or present half the rarities to visiting foreign envoys."
 oe_v495_fl.1.a: "Build a permanent royal menagerie pavilion for court and envoys"
 oe_v495_fl.1.b: "Open the gardens to the townsfolk and host a week of street fairs"
 oe_v495_fl.1.c: "Auction the duplicate curiosities to wealthy guild patrons"
 oe_v495_fl.2.title: "Imperial Pavilion Poetry & Music Gala"
 oe_v495_fl.2.desc: "Under autumn lanterns beside the palace lotus pond, the realm's sharpest poets and virtuoso lute masters have challenged one another to an all-night verse duel. Crowds of scholars, nobles, and foreign travelers wager silk fans on the winning stanza while the court chamberlain asks how the crown wishes to crown the evening's laureate."
 oe_v495_fl.2.a: "Endow a laureate salon and publish the winning anthology"
 oe_v495_fl.2.b: "Invite rival estates to compose conciliatory verses together"
 oe_v495_fl.2.c: "Commission ballads celebrating our realm's traders and artisans"
 oe_v495_fl.3.title: "Defection of a Rival Marshal"
 oe_v495_fl.3.desc: "Following a bitter faction feud at a neighboring court, a celebrated veteran marshal has ridden across our frontier under a white truce pennant, carrying a locked leather folio of marching tables, siege sketches, and supply tables. Our generals respect the newcomer's keen eye for terrain, though suspicious courtiers whisper that every turncoat carries a hidden price."
 oe_v495_fl.3.a: "Commission the marshal to rewrite our officer drill manuals"
 oe_v495_fl.3.b: "Place the veteran in quiet intelligence service analyzing enemy ciphers"
 oe_v495_fl.3.c: "Grant an honorable estate pension and avoid provoking border rivals"
 oe_v495_fl.4.title: "Royal Wedding Procession & Civic Carnival"
 oe_v495_fl.4.desc: "Trumpets echo off freshly whitewashed boulevards as a celebrated dynastic marriage unites two illustrious houses of the realm. Flower garlands drape every balcony, guilds prepare gilded floats depicting ancient heroes, and the treasury stewards wait to learn whether this union shall be celebrated with legendary splendor or disciplined civic grace."
 oe_v495_fl.4.a: "Sponsor gilded floats, wine fountains, and three days of revelry"
 oe_v495_fl.4.b: "Invite neighboring ambassadors to cement lasting court friendships"
 oe_v495_fl.4.c: "Keep ceremony dignified and collect traditional celebratory guild dues"
 oe_v495_fl.5.title: "Century City World Fair"
 oe_v495_fl.5.desc: "Master craftsmen, glassblowers, silk dyers, and brass instrument makers from forty cities have converged upon our capital square to hold an unprecedented grand exposition. Timber pavilions gleam with banners representing every province and trading partner, offering a rare chance to showcase our realm's ingenuity to the known world."
 oe_v495_fl.5.a: "Grant royal fair charters and permanent trade exhibition halls"
 oe_v495_fl.5.b: "Award scholarly prizes for the finest mechanical and scientific inventions"
 oe_v495_fl.5.c: "Levy brisk booth customs on foreign merchants packing the fairgrounds"
 oe_v495_fl.6.title: "Wandering Cartographer's Secret Atlas"
 oe_v495_fl.6.desc: "A sun-bronzed navigator with salt-stiffened sleeves has arrived at the admiralty bearing a vellum atlas inked in vermilion and lapis lazuli. Its margins record hidden shoals, prevailing trade winds, and sheltered watering coves missing from every official chart. Rival brokers are already bidding outside the tavern door."
 oe_v495_fl.6.a: "Buy the atlas outright and copy it for our captains and merchants"
 oe_v495_fl.6.b: "Appoint the cartographer to instruct academy geographers"
 oe_v495_fl.6.c: "Publish woodblock editions for popular sale across port taverns"
 oe_v495_fl.7.title: "Imperial Observatory Eclipse Omen"
 oe_v495_fl.7.desc: "At high noon, the sun narrowed into a ring of blazing silver exactly on the minute foretold weeks earlier by our chief court astronomer. Market stalls hushed in awe as birds fell silent across the rooftops. While street preachers debate celestial warnings, scholars hail the triumph of exact planetary calculation."
 oe_v495_fl.7.a: "Publicly honor the astronomers and fund new brass astrolabes"
 oe_v495_fl.7.b: "Proclaim the eclipse an auspicious omen of sovereign renewal"
 oe_v495_fl.7.c: "Commission commemorative silver eclipse medallions for foreign courts"
 oe_v495_fl.8.title: "Grand Naval Review at the Capital Straits"
 oe_v495_fl.8.desc: "Clear spring winds fill hundreds of newly tarred sails as our admirals propose a grand naval pageant along the coastal approaches. Flagships painted in crimson and gold stand ready to stage mock boarding maneuvers and synchronized gun salutes before cheering crowds and watchful foreign attachés."
 oe_v495_fl.8.a: "Stage the full naval pageant and award shipyard prize banners"
 oe_v495_fl.8.b: "Turn the review into a joint convoy escort drill with merchant fleets"
 oe_v495_fl.8.c: "Keep patrols on routine station and spare the powder reserves"
 oe_v495_fl.9.title: "Court Alchemist vs. Royal Academy Debate"
 oe_v495_fl.9.desc: "A flamboyant foreign alchemist promising an elixir of boundless vigor and lead-to-gold transmutation has challenged the dean of our royal academy to a public crucible trial in the courtyard. Half the nobility leans forward in breathless wonder while empiricist metallurgists furiously adjust their balance scales."
 oe_v495_fl.9.a: "Back the empirical academy and turn the crucible to alloy metallurgy"
 oe_v495_fl.9.b: "Quietly fund the alchemist's glassmaking and pigment experiments"
 oe_v495_fl.9.c: "Expose the trickster with good humor and fine his gullible backers"
 oe_v495_fl.10.title: "Ancient Manuscript Discovery in the Archive Vault"
 oe_v495_fl.10.desc: "While repairing damp stone piers beneath the old palace chancery, masons broke into a sealed cedar chest packed with illuminated scrolls untouched for centuries. Paleographers have already identified forgotten treatises on civic hydraulics, diplomatic protocol, and ancient siegecraft."
 oe_v495_fl.10.a: "Translate and circulate the technical treatises across our workshops"
 oe_v495_fl.10.b: "Display the illuminated codices in the sovereign gallery"
 oe_v495_fl.10.c: "Send certified copies as prestige gifts to neighboring monarchs"
 oe_v495_fl.11.title: "Silk & Porcelain Envoy Gift"
 oe_v495_fl.11.desc: "A gleaming diplomatic caravan has entered the capital gates bearing lacquered chests of translucent blue-and-white porcelain, bolts of crimson damask silk, and sealed jade credentials from a distant sovereign. The ambassadors await our counter-gift and trade response before the autumn winds shift."
 oe_v495_fl.11.a: "Respond with lavish reciprocal gifts and open a permanent envoy quarter"
 oe_v495_fl.11.b: "Have our master artisans study the glazes and weaving looms"
 oe_v495_fl.11.c: "Accept the tribute graciously and fold the silk chests into treasury reserves"
 oe_v495_fl.12.title: "Border Fortress Duel of Champions"
 oe_v495_fl.12.desc: "Along a quiet mountain border pass, the garrison captain of our forward citadel and his famous counterpart across the valley have agreed to an honorable tournament of lances, sabers, and marksmanship before neutral heralds. Both garrisons cheer from the parapets, eager to see whose banner claims the silver laurel."
 oe_v495_fl.12.a: "Sponsor our champion with master-forged arms and garrison prizes"
 oe_v495_fl.12.b: "Invite officers from both forts to share a banquet after the bout"
 oe_v495_fl.12.c: "Use the distraction to survey the rival citadel's blind angles"
 oe_v495_fl.13.title: "Scion's Incognito Grand Tour"
 oe_v495_fl.13.desc: "A spirited young scion of our ruling house has petitioned to travel abroad under an assumed merchant name, visiting famous universities, drydocks, and royal operas across neighboring realms. Seasoned tutors insist the journey will broaden statecraft, while cautious guards fret over tavern brawls and royal dignity."
 oe_v495_fl.13.a: "Approve the tour with diplomatic introductions to foreign salons"
 oe_v495_fl.13.b: "Direct the traveler to inspect foreign shipyards and foundries"
 oe_v495_fl.13.c: "Keep the scion at home to master domestic finance and administration"
 oe_v495_fl.14.title: "Rival Noble Houses' Opera & Theater Feud"
 oe_v495_fl.14.desc: "Two rival patrician clans in the capital have turned the winter theater season into an extravagant battle of wits, each hiring celebrated playwrights and stage mechanics to outdo the other with flying chariots, thunder machines, and thinly veiled satirical comedies. The whole city buys tickets just to watch the next volley."
 oe_v495_fl.14.a: "Patronize both troupes and turn the rivalry into a royal festival"
 oe_v495_fl.14.b: "Tax the booming box offices and channel proceeds into public roads"
 oe_v495_fl.14.c: "Summon both clan heads to mediate a stately reconciliation"
 oe_v495_fl.15.title: "Master Clockmaker's Mechanical Automaton"
 oe_v495_fl.15.desc: "An ingenious horologist has unveiled an astonishing brass-and-enamel automaton in the audience chamber: on every hour, tiny enameled heralds sound silver trumpets while a golden songbird turns its head and sings in pure chimes. Visiting diplomats can scarce believe no hidden dwarf sits inside the pedestal."
 oe_v495_fl.15.a: "Install the automaton in the grand reception hall to awe envoys"
 oe_v495_fl.15.b: "Fund a precision clockwork workshop for navigation and industry"
 oe_v495_fl.15.c: "Present the marvel to an allied court to seal high-level goodwill"
 oe_v495_fl.16.title: "Autumn Imperial Hunt & Archery Contest"
 oe_v495_fl.16.desc: "Crisp crimson leaves blanket the royal hunting preserve as cavalry lords, frontier scouts, and provincial marksmen assemble for the traditional autumn chase and golden-quiver archery contest. The horns sound at dawn, promising both thrilling camaraderie among officers and a lively showcase of martial vigor."
 oe_v495_fl.16.a: "Turn the chase into a full cavalry maneuver and marksmanship trial"
 oe_v495_fl.16.b: "Distribute the harvest venison generously to nearby villages"
 oe_v495_fl.16.c: "Invite estate magnates to settle land disputes over the campfire"
 oe_v495_fl.17.title: "Spice Merchant Guild's Banquet of Five Seas"
 oe_v495_fl.17.desc: "Prosperous maritime syndicates have hosted an opulent banquet perfumed with cloves, saffron, cinnamon, and roasted coffee beans hauled across five seas. Between courses, the guildmasters quietly lay two petitions beside the crystal goblets: freer maritime convoy charters, or royal protection for overland warehouse courts."
 oe_v495_fl.17.a: "Charter a joint sea-trade consortium and expand port warehousing"
 oe_v495_fl.17.b: "Endorse domestic craft guilds to supply export wares for the caravans"
 oe_v495_fl.17.c: "Collect a handsome customs gratitude fee for renewing existing charters"
 oe_v495_fl.18.title: "Great Library Translation Circle"
 oe_v495_fl.18.desc: "Polyglot scribes, exiled savants, and merchant interpreters have formed a bustling translation circle inside our capital library, rendering foreign treatises on geometry, medicine, and agronomy into our court language. They ask only for steady ink, paper, and quiet chambers to multiply their output."
 oe_v495_fl.18.a: "Endow the translation circle as an official imperial institute"
 oe_v495_fl.18.b: "Recruit their sharpest linguists into our diplomatic chancellery"
 oe_v495_fl.18.c: "Focus their editions on agricultural manuals for provincial stewards"
 oe_v495_fl.19.title: "Winter Solstice Lantern & Fireworks Festival"
 oe_v495_fl.19.desc: "On the longest night of winter, thousands of oiled-paper lanterns drift down the capital river while master pyrotechnicians burst chrysanthemum sparks of gold and emerald against the frosty sky. Merchants, soldiers, and students dance across the bridges in high spirits, awaiting the sovereign's solstice decree."
 oe_v495_fl.19.a: "Sponsor the river pageant and distribute warm winter alms"
 oe_v495_fl.19.b: "Recruit the master pyrotechnicians to refine military signal rockets"
 oe_v495_fl.19.c: "Keep the evening joyful and license bustling night markets"
 oe_v495_fl.20.title: "Master Architect's Grand Bridge Proposal"
 oe_v495_fl.20.desc: "A visionary civil engineer has unrolled charcoal blueprints before the council showing a multi-arch vaulted stone bridge spanning our busiest commercial river crossing, complete with toll pavilions, flood breakwaters, and twin carriageway lanes. Ferrymen grumble, yet wagon trains cheer the bold design."
 oe_v495_fl.20.a: "Approve the grand vaulted stone bridge with royal masonry funds"
 oe_v495_fl.20.b: "Fortify the bridgeheads as defensible toll gatehouses"
 oe_v495_fl.20.c: "Let merchant syndicates finance the span in return for fair toll shares"
 oe_v495_fl.21.title: "Famous Chronicler Requests Court Patronage"
 oe_v495_fl.21.desc: "A celebrated historian whose vivid annals are read in taverns and palaces alike has arrived at court seeking access to our royal archives. Promising a sweeping multi-volume chronicle of our realm's trials and triumphs, the scholar awaits word on how freely the pen may move."
 oe_v495_fl.21.a: "Grant open archive access and endow an independent chronicle"
 oe_v495_fl.21.b: "Commission an official dynastic epic bolstering sovereign legitimacy"
 oe_v495_fl.21.c: "Task the scholar with cataloging military campaigns and treaties"
 oe_v495_fl.22.title: "Sunken Treasure Galleon Salvaged off the Shoals"
 oe_v495_fl.22.desc: "After a low spring tide exposed the oak ribs of a long-lost treasure ship wedged against coastal reefs, bold local divers hauled up encrusted iron chests brimming with stamped silver bars, brass dividers, and intact bronze swivel guns. Admiralty clerks and coastal fishers eagerly await the crown's ruling on salvage rights."
 oe_v495_fl.22.a: "Split the bullion fairly with the divers and invest our share in the treasury"
 oe_v495_fl.22.b: "Hand the salvaged brass instruments and bronze guns to the admiralty"
 oe_v495_fl.22.c: "Return marked merchant manifests to foreign owners to earn maritime trust"
 oe_v495_fl.23.title: "Rival Court's Secret Cipher Intercepted"
 oe_v495_fl.23.desc: "A sharp-eyed postmaster detained a nervous courier carrying silk-stitched dispatches written in an intricate numerical cipher. Overnight, our chancery clerks cracked the key—revealing candid assessments of foreign fortresses, trade rivals, and court intrigues. How shall we play this unexpected trump card?"
 oe_v495_fl.23.a: "Keep the breakthrough secret and establish a permanent cipher desk"
 oe_v495_fl.23.b: "Return the unopened pouch courteously to win an astonished neighbor's gratitude"
 oe_v495_fl.23.c: "Use the commercial tips quietly to outmaneuver rival grain buyers"
 oe_v495_fl.24.title: "Grand Botanical Garden of Foreign Flora"
 oe_v495_fl.24.desc: "Returning merchant ships and mountain herbalists have presented our palace gardeners with clay pots bursting with foreign wonders: striped tulips, fragrant tea saplings, hardy citrus grafts, and rare fever-bark seedlings. Physicians and agronomists alike urge the crown to expand glasshouses and trial orchards across the realm."
 oe_v495_fl.24.a: "Build royal glasshouses and distribute hardy seedlings to provinces"
 oe_v495_fl.24.b: "Publish an illustrated pharmacopoeia for physicians and academies"
 oe_v495_fl.24.c: "License luxury bulb and spice nurseries to ambitious garden merchants"
