# NEW 2026-11-21 v9.8 Worker 1: Religio Romana Renaming & Vanilla 1.4.9 Loc Bugfixes. Generated by gen_romp_pantheon.py.
 hellenism_religion:0 "Religio Romana"
 hellenism_religion_ADJ:0 "Roman Pagan"
 hellenism_religion_desc:0 "Religio Romana descends from the Capitoline Triad and the classical Olympian pantheon, anchoring the survival of the commonwealth upon Pax Deorum—the Peace of the Gods—upheld through pontifical law, augury, omens, and civic piety.\n\nFrom Augustus's restored sanctuaries, Aurelian's Unconquered Sun, and Emperor Julian's philosophical revival to Georgios Gemistos Plethon's Book of Laws at Mistra, the ancient state faith never truly perished. Through the syncretic breadth of Interpretatio Romana, it weaves Roman ritual, Greek philosophy, and the sacred traditions of the Mediterranean into a single imperial creed."
 game_concept_omen_desc:0 "$game_concept_omens$ are phenomena in the [ShowReligionAdjective('hellenism_religion')] [religion|e] associated with [gods|e]. They are summoned with [ShowGenericActionName('select_omen_god')] and [ShowGenericActionName('select_omen')]. Their power is increased by the [ability|e] of the [ruler|e]."
 game_concept_god_emperors_desc:0 "A God Emperor is a [character|e] that is recognized in the [ShowReligionAdjective('hellenism_religion')] [religion|e] by having an extraordinary degree of holiness through their deeds. The process to become a God Emperor is known as canonization."
 game_concept_heroes_desc:0 "A Hero is a [character|e] that is recognized in the [ShowReligionAdjective('hellenism_religion')] [religion|e] following the Heroic Cults aspect by having an extraordinary degree of holiness through their deeds. The process to become a Hero is known as canonization."
 game_concept_divine_emperors_desc:0 "A Divine Emperor is a [character|e] that is recognized in the [ShowReligionAdjective('hellenism_religion')] [religion|e] following the Imperial Cult aspect by having an extraordinary degree of holiness through their deeds. The process to become a Divine Emperor is known as canonization."
 hellenism_religion.31.title:0 "A New Omen for Our Country"
 hellenism_religion.28.desc:0 "In times of peace, ambition quiets and prudence rises, and the priests speak often of [ShowGodName('athena_god')]. They insist that wisdom is not merely a virtue, but a weapon, one best forged when the [ROOT.GetCountry.GetFlavorRank] is not distracted by war.\n\nA proposal is set before us, costly but sensible, and it promises order where there is waste, and clarity where there is doubt. If we refuse, we may keep our coin, but the [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] will not forget that we turned away from the counsel of a goddess."
