l_english:
 oe_byd_blockade: "The Blockade of the City"
 oe_byd_blockade_desc: "The sultan's army has closed around the capital. The walls can stop an assault, but not hunger and despair.\n\nMonths so far: #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_byd_m').GetValue|0]#!   Grain stores #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_byd_food').GetValue|0]#! / 100 (#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_byd_food_delta')|1]#! a month)   City morale #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_byd_morale').GetValue|0]#! / 100 (#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_byd_morale_delta')|1]#! a month)   Defences #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_byd_defense')|0]#!\n[GetCountry('BYZ').Custom('OeBydWest')]\n[GetCountry('BYZ').Custom('OeBydCrusade')]\n[GetCountry('BYZ').Custom('OeBydAssault')]\n\nGrain stores each month: #R −3#! base, #G +1#! smuggled in by sea; #G +0.5#! with the Propontis port at level #Y 3#! or more; #G +0.5#! per granary level; #G +1#! while Venice or Genoa is not hostile to the empire; #R −1#! while the Ottoman fleet is more than twice ours; #R −1#! under the sultan's wrath; #G +1#! from a Turkish quarter; #G +2#! while Timur is at war with the Ottomans; #R −3#! under a real siege. Below #Y 25#! the city goes hungry; at #Y 0#! it starves.\nCity morale each month: from #G +0.5#! to #R −3#! with the grain stores; #G +0.5#! with cisterns, the water palace and the aqueduct at #Y 3#! levels together, or a hospital; #G +0.5#! with a French garrison; #R −0.5#! while the emperor is away (not with western reinforcements); #G +1#! while Timur is at war with the Ottomans; #R −1#! under a real siege. Below #Y 25#! the city despairs, from #Y 75#! it stands firm; after #Y 3#! months at #Y 0#! the sultan offers terms.\nDefences = Theodosian Walls level x #Y 2#! + sea walls level x #Y 2#! + arsenal level, #Y 2#! more with a French garrison, adjusted by morale. Granaries, cisterns, a hospital and walls let the city hold out longer."
 OE_BYD_WEST_AWAY: "The emperor is in the West seeking help, #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_byd_west_m').GetValue|0]#! months away; [GetCountry('BYZ').MakeScope.GetVariable('oe_byd_regent').GetCharacter.GetName] holds the capital."
 OE_BYD_WEST_ENVOY: "The empire's envoys are making the rounds of the Western courts."
 OE_BYD_WEST_BACK: "The emperor has come back from the West."
 OE_BYD_WEST_LOST: "The emperor who went west never came back."
 OE_BYD_WEST_HOME: "The emperor is in the capital."
 OE_BYD_CR_WON: "The crusade won at Nicopolis."
 OE_BYD_CR_WRATH: "The crusade was crushed at Nicopolis, and the sultan takes it out on the empire: grain stores #R −1#! a month."
 OE_BYD_CR_LOST: "The crusade was crushed at Nicopolis."
 OE_BYD_CR_GOING: "A crusade is gathering on the Danube."
 OE_BYD_CR_NONE: "No crusade has come from the West yet."
 OE_BYD_AS_HELD: "The last assault was beaten off."
 OE_BYD_AS_LOST: "In the last assault the outworks were lost."
 OE_BYD_AS_NONE: "The sultan has not yet stormed the land walls."
 OE_BYD_SETTLE_HIGH: "The city has come through, and its spirits are high: [oe_tu_authority|e] #G +5#!, public opinion #G +5#!."
 OE_BYD_SETTLE_MID: "The city has come through: [oe_tu_authority|e] #G +2#!."
 OE_BYD_SETTLE_LOW: "The city was saved, but its spirit is broken: [oe_tu_authority|e] #R −3#!, public opinion #R −5#!."
 STATIC_MODIFIER_NAME_oe_byd_blockade_loc: "A City Under Blockade"
 STATIC_MODIFIER_NAME_oe_byd_blockade: "The Capital Blockaded"
 STATIC_MODIFIER_NAME_oe_byd_famine: "Famine in the City"
 STATIC_MODIFIER_NAME_oe_byd_starving: "The City Starving"
 STATIC_MODIFIER_NAME_oe_byd_despair: "Despair in the Capital"
 STATIC_MODIFIER_NAME_oe_byd_despair_loc: "Disheartened Defenders"
 STATIC_MODIFIER_NAME_oe_byd_resolve: "A City Resolved"
 STATIC_MODIFIER_NAME_oe_byd_french_garrison: "French Garrison"
 STATIC_MODIFIER_NAME_oe_byd_watch: "Strengthened Walls"
 STATIC_MODIFIER_NAME_oe_byd_emperor_abroad: "The Emperor Abroad"
 STATIC_MODIFIER_NAME_oe_byd_west_aid: "Western Reinforcements"
 STATIC_MODIFIER_NAME_oe_byd_grain_privilege: "The Grain Concession"
 STATIC_MODIFIER_NAME_oe_byd_exodus: "Exodus from the City"
 STATIC_MODIFIER_NAME_oe_byd_rebuild: "Rebuilding the Suburbs"
 STATIC_MODIFIER_NAME_oe_byd_nicopolis_tur: "Defeat at Nicopolis"
 oe_byd_host_king: "Took in our ruler after the defeat"
 oe_byd_shut_out: "Shut the gates on the beaten crusaders"
 oe_byd_quarter_op: "Granted a Turkish quarter in Constantinople"
 oe_byd_french_thanks: "Sent our relief force home with gifts"
 oe_byd_west_court: "Came to our court seeking help"
 oe_byd_grain_buyer: "Paid well for our grain"
 oe_byd.1.t: "The Summons to Serres"
 oe_byd.1.desc_tribute: "#F Around the turn of 1393 and 1394 Bayezid summoned the Christian vassals of the Balkans to Serres and came close to putting them all to death, relenting only at the last moment. Manuel II slipped back to the capital and never answered a summons again. In 1394 the sultan raised a fortress on the eastern shore of the Bosporus and began the blockade of Constantinople.#!\n\nNow Sultan [GetCountry('TUR').GetGovernment.GetRuler.GetName] has sent for the emperor again. Whoever goes may not come back; if no one goes, the sultan's army will close around the city. The empire pays tribute every year, but what the sultan wants now is more than money."
 oe_byd.1.desc_plain: "#F Around the turn of 1393 and 1394 Bayezid summoned the Christian vassals of the Balkans to Serres and came close to putting them all to death, relenting only at the last moment. Manuel II slipped back to the capital and never answered a summons again. In 1394 the sultan raised a fortress on the eastern shore of the Bosporus and began the blockade of Constantinople.#!\n\nNow Sultan [GetCountry('TUR').GetGovernment.GetRuler.GetName] has sent for the emperor again. Whoever goes may not come back; if no one goes, the sultan's army will close around the city."
 oe_byd.1.a: "Answer no more summonses"
 oe_byd.1.a.tt: "The situation #bold #color_yellow The Blockade of the City#!#! begins: grain stores start at #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_byd_food_start')|0]#! (#Y 60#!, plus #Y 8#! per granary level), city morale at #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_byd_morale_start')|0]#! (set by public opinion)\nAny buying-peace agreement with the Ottomans lapses, without counting as broken\n[oe_tu_authority|e] #G +3#!"
 oe_byd.1.b: "Go, and pay more tribute"
 oe_byd.1.b.tt: "Sign a #Y 5#!-year buying-peace agreement with the Ottomans: the first year is paid now (#Y 3#! months of total income), prestige #R −15#!, [oe_tu_authority|e] #R −5#!\nIf the summons has been answered before (#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_byd_rd_defers')|0]#! times so far): also [oe_tu_authority|e] #R −5#!, public opinion #R −5#!\nThe sultan sends no summons for #Y 3#! years"
 oe_byd.1.c: "Go, and pay more tribute"
 oe_byd.1.c.tt: "Pay the sultan #R 6#! months of trade and tax income at once; the agreement runs another #Y 5#! years\nIf the summons has been answered before (#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_byd_rd_defers')|0]#! times so far): also [oe_tu_authority|e] #R −5#!, public opinion #R −5#!\nThe sultan sends no summons for #Y 3#! years"
 oe_byd.1.d: "Send envoys and play for time"
 oe_byd.1.d.tt: "Costs #R 1#! month of trade and tax income\n#G 50%#! chance the sultan lets it go and summons again in #Y 12#! months\n#R 50%#! chance the sultan takes it as an insult: the situation begins anyway, city morale starting #R −10#!"
 oe_byd.2.t: "The Crusaders' Call"
 oe_byd.2.desc: "#F From 1395 King Sigismund of Hungary sought help across the West: the Duke of Burgundy paid, John, Count of Nevers, took command, and knights came east from far and wide. In 1396 a Venetian fleet carried the Knights Hospitaller into the Sea of Marmara, and the empire sent ten ships of its own.#!\n\nNow [GetCountry('HUN').GetGovernment.GetRuler.GetName] of Hungary has sent envoys: a crusade is gathering on the Danube to drive the Turks out of Europe, and the empire is asked for ships and money.\nChance of victory: #Y 15%#!, plus #Y 10%#! for each level of the crusade's strength, and another #Y 10%#! if Hungary is already at war with the Ottomans, #Y 5%#! more while a papal crusade is aimed at the Ottomans, and #Y 5%#! more if Wallachia held at Rovine and is not the sultan's subject, at most #Y 50%#!."
 oe_byd.2.a: "Send ships and money"
 oe_byd.2.a.tt: "Costs #R 3#! months of trade and tax income\nCrusade strength #Y 2#! (the most): a better chance, and worse wrath from the sultan if it fails\nNews of the battle comes in about #Y 5#! months"
 oe_byd.2.b: "Send money only"
 oe_byd.2.b.tt: "Costs #R 1#! month of trade and tax income\nCrusade strength #Y 1#!\nNews of the battle comes in about #Y 5#! months"
 oe_byd.2.c: "Stay out of it"
 oe_byd.2.c.tt: "City morale #R −5#!\nEven if the crusade fails, the sultan will not take it out on the empire\nNews of the battle comes in about #Y 5#! months"
 oe_byd.3.t: "Nicopolis"
 oe_byd.3.desc_won: "#F On 25 September 1396 the crusade was crushed before Nicopolis. The Count of Nevers and many other nobles were taken and ransomed the next year for 200,000 florins. Sigismund escaped by ship into the Black Sea and went home by sea by way of Constantinople.#!\n\nNow the news is of victory: the crusade has beaten the sultan's army on the Danube! The sultan's men are shaken, and the camps outside the walls have thinned.\nCity morale #G +15#!, grain stores #G +10#!; the Ottomans gain [ShowModifier('oe_byd_nicopolis_tur')] for #Y 5#! years."
 oe_byd.3.desc_lost2: "#F On 25 September 1396 the crusade was crushed before Nicopolis. The Count of Nevers and many other nobles were taken and ransomed the next year for 200,000 florins. Sigismund escaped by ship into the Black Sea and went home by sea by way of Constantinople.#!\n\nNow the news is of disaster: the crusade has been routed on the Danube. The ships of [GetCountry('HUN').GetGovernment.GetRuler.GetName] lie off the Golden Horn, asking to come in, and the sultan's army is back at the walls.\nCity morale #R −10#!; the empire gave the most, and the sultan takes it out on the empire: grain stores #R −1#! a month for #Y 18#! months."
 oe_byd.3.desc_lost1: "#F On 25 September 1396 the crusade was crushed before Nicopolis. The Count of Nevers and many other nobles were taken and ransomed the next year for 200,000 florins. Sigismund escaped by ship into the Black Sea and went home by sea by way of Constantinople.#!\n\nNow the news is of disaster: the crusade has been routed on the Danube. The ships of [GetCountry('HUN').GetGovernment.GetRuler.GetName] lie off the Golden Horn, asking to come in, and the sultan's army is back at the walls.\nCity morale #R −10#!; the empire paid towards it, and the sultan takes it out on the empire: grain stores #R −1#! a month for #Y 9#! months."
 oe_byd.3.desc_lost0: "#F On 25 September 1396 the crusade was crushed before Nicopolis. The Count of Nevers and many other nobles were taken and ransomed the next year for 200,000 florins. Sigismund escaped by ship into the Black Sea and went home by sea by way of Constantinople.#!\n\nNow the news is of disaster: the crusade has been routed on the Danube. The ships of [GetCountry('HUN').GetGovernment.GetRuler.GetName] lie off the Golden Horn, asking to come in, and the sultan's army is back at the walls.\nCity morale #R −10#!; the empire stayed out of it, and the sultan has no quarrel with the empire over it."
 oe_byd.3.a: "Receive the fleeing monarch"
 oe_byd.3.a.tt: "Costs #R 1#! month of trade and tax income\nHungary: opinion of the empire #G +20#! for #Y 10#! years\nIn about #Y 2#! months the sultan will send envoys"
 oe_byd.3.b: "Keep the gates shut"
 oe_byd.3.b.tt: "Hungary: opinion of the empire #R −10#! for #Y 5#! years\nThe sultan's wrath lasts half as long\nIn about #Y 2#! months the sultan will send envoys"
 oe_byd.3.c: "Ring the bells in thanks"
 oe_byd.3.c.tt: "[oe_tu_authority|e] #G +3#!"
 oe_byd.4.t: "The Sultan's Ultimatum"
 oe_byd.4.desc: "#F After Nicopolis Bayezid came back to the walls and demanded that the city surrender; before and after, the Turks stormed the land walls several times. It is recorded that a quarter of the city was set aside for Turkish residents, with their own judge and mosque.#!\n\nNow the sultan's envoys stand at the gate: hand over the city and the emperor's life will be spared; refuse, and the army will storm the walls. The city's defences stand at #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_byd_defense')|0]#!."
 oe_byd.4.a: "Hold the city to the last"
 oe_byd.4.a.tt: "City morale #G +10#! (with defences of #Y 7#! or more), otherwise #G +5#!\nThe sultan may storm the land walls at any time"
 oe_byd.4.b: "Grant the Turks a quarter"
 oe_byd.4.b.tt: "City morale #R −10#!\n[oe_tu_authority|e] #R −5#!\nA Turkish quarter is set up in the city; Ottoman opinion of the empire #G +25#! for #Y 10#! years\nGrain stores #G +1#! a month for #Y 24#! months"
 oe_byd.4.c: "Pay to put off the assault"
 oe_byd.4.c.tt: "Costs #R 4#! months of trade and tax income\nThe sultan will not storm the walls for #Y 24#! months"
 oe_byd.5.t: "The Marshal's Fleet"
 oe_byd.5.desc: "#F From 1397 the emperor sent envoy after envoy to France and England. In 1399 Charles VI of France sent Marshal Boucicaut with six ships and 1,200 men, a commander taken at Nicopolis three years before and ransomed home. The French and the garrison sallied out together and cleared Turkish posts along the coast.#!\n\nNow a French fleet has forced its way through the straits into the Golden Horn."
 oe_byd.5.a: "Sally out together"
 oe_byd.5.a.tt: "Costs #R 1#! month of trade and tax income\nGrain stores #G +15#!\nCity morale #G +10#!\n#R 25%#! chance the sally goes wrong: city morale #R −5#! instead\nIn about #Y 3#! months the court will debate whether the emperor should go west in person"
 oe_byd.5.b: "Ask the French to stay"
 oe_byd.5.b.tt: "Costs #R 2#! months of trade and tax income\nConstantinople gains [ShowModifier('oe_byd_french_garrison')] for #Y 36#! months\nCity morale #G +5#!\nIn about #Y 3#! months the court will debate whether the emperor should go west in person"
 oe_byd.5.c: "Send them home with gifts"
 oe_byd.5.c.tt: "France: opinion of the empire #G +10#! for #Y 10#! years\nIn about #Y 3#! months the court will debate whether the emperor should go west in person"
 oe_byd.6.t: "The Emperor Goes West"
 oe_byd.6.desc_rg: "#F On 10 December 1399 Manuel II sailed west with Boucicaut, leaving the imperial family in the Morea and the capital to a nephew, John VII. For three and a half years the emperor travelled through Venice, Padua, Milan, Paris and London.#!\n\nNow help comes more thinly each time. Some propose that the emperor should go to the courts of the West in person, leaving the capital to [SCOPE.sCharacter('oe_byd_rg').GetName]."
 oe_byd.6.desc_norg: "#F On 10 December 1399 Manuel II sailed west with Boucicaut, leaving the imperial family in the Morea and the capital to a nephew, John VII. For three and a half years the emperor travelled through Venice, Padua, Milan, Paris and London.#!\n\nNow help comes more thinly each time. Some propose that the emperor should go to the courts of the West in person, but there is no one at court to whom the capital could be entrusted."
 oe_byd.6.a: "Go west in person"
 oe_byd.6.a.tt: "[SCOPE.sCharacter('oe_byd_rg').GetName] holds the capital\nThe empire gains [ShowModifier('oe_byd_emperor_abroad')] until the emperor comes back\nCity morale #G +5#!\nThe emperor reaches Italy and Paris in about #Y 6#! months, and comes home #Y 8#! months after the blockade ends or after #Y 42#! months away"
 oe_byd.6.b: "Send envoys instead"
 oe_byd.6.b.tt: "Costs #R 1#! month of trade and tax income\nThe envoys reach Paris in about #Y 6#! months, and bring back less than the emperor would"
 oe_byd.6.c: "The emperor stays"
 oe_byd.6.c.tt: "City morale #G +5#!\nNo appeal to the West"
 oe_byd.7.t: "From Venice to Paris"
 oe_byd.7.desc_emp: "#F In April 1400 the emperor landed at Venice and travelled by way of Padua, Vicenza and Pavia to Milan. On 3 June Charles VI of France met the emperor at Charenton and received the imperial guest in Paris with great ceremony. The emperor stayed in Paris a long time, waiting for help from the West.#!\n\nNow the emperor has reached Paris. The rulers of the West are courteous and generous with promises, but no troops appear."
 oe_byd.7.desc_env: "#F In April 1400 the emperor landed at Venice and travelled by way of Padua, Vicenza and Pavia to Milan. On 3 June Charles VI of France met the emperor at Charenton and received the imperial guest in Paris with great ceremony. The emperor stayed in Paris a long time, waiting for help from the West.#!\n\nNow the empire's envoys have reached Paris. The rulers of the West are courteous and generous with promises, but no troops appear."
 oe_byd.7.a: "Take the pension and the promises"
 oe_byd.7.a.tt: "Gain #G 3#! months of trade and tax income (#G 2#! for envoys)\nFrance: opinion of the empire #G +10#! for #Y 10#! years\nCity morale #G +5#! (while the blockade lasts)"
 oe_byd.7.b: "Hold court in Paris"
 oe_byd.7.b.tt: "[oe_tu_authority|e] #G +2#!"
 oe_byd.7.c: "Press for troops at once"
 oe_byd.7.c.tt: "The empire gains [ShowModifier('oe_byd_west_aid')] for #Y 10#! years (a little prestige instead while [ShowModifier('oe_br_western_aid')] lasts)\nThat is only a #G 30%#! chance; with #R 70%#! there are only empty promises, and a little prestige is lost"
 oe_byd.8.t: "Winter in London"
 oe_byd.8.desc_paid: "#F In December 1400 Henry IV of England met the emperor at Blackheath, kept the imperial guest at Eltham Palace over Christmas and raised money for the empire. In February 1401 the emperor went back to Paris.#!\n\nNow the emperor has crossed to England. The English court holds a feast for the guest and promises to raise money for the empire. England has opened its purse for the empire once already, so it gives less this time."
 oe_byd.8.desc_plain: "#F In December 1400 Henry IV of England met the emperor at Blackheath, kept the imperial guest at Eltham Palace over Christmas and raised money for the empire. In February 1401 the emperor went back to Paris.#!\n\nNow the emperor has crossed to England. The English court holds a feast for the guest and promises to raise money for the empire."
 oe_byd.8.a: "Take the English money"
 oe_byd.8.a.tt: "Gain #G 4#! months of trade and tax income (#G 2#! if England has paid for an earlier journey west)\nEngland: opinion of the empire #G +10#! for #Y 10#! years"
 oe_byd.8.b: "Ask for English troops"
 oe_byd.8.b.tt: "The empire gains [ShowModifier('oe_byd_west_aid')] for #Y 10#! years (a little prestige instead while [ShowModifier('oe_br_western_aid')] lasts)\nThat is only a #G 25%#! chance; otherwise only a little prestige"
 oe_byd.10.t: "The Regent's Secret Talks"
 oe_byd.10.desc: "#F While the emperor was away, people kept slipping out of the city to make terms with Bayezid, and Patriarch Matthew I issued an encyclical threatening them with excommunication. One account says John VII promised to hand the city to the sultan if the sultan defeated Timur; the claim is disputed to this day.#!\n\nNow the city is short of food and restless. Some are quietly treating with the sultan's camp, and rumour says that [GetCountry('BYZ').MakeScope.GetVariable('oe_byd_regent').GetCharacter.GetName], who holds the capital, knows of it."
 oe_byd.10.a: "Let the talks go on"
 oe_byd.10.a.tt: "Grain stores #G +10#!\nCity morale #G +5#!\nThe sultan will not storm the walls for #Y 12#! months\nThis will be remembered"
 oe_byd.10.b: "Ask the patriarch for an encyclical"
 oe_byd.10.b.tt: "City morale #G +10#!\n[oe_tu_authority|e] #G +3#!\nGrain stores #R −5#!"
 oe_byd.10.c: "Watch them quietly"
 oe_byd.10.c.tt: "Costs #R 1#! month of trade and tax income\nThis will be remembered"
 oe_byd.9.t: "The Emperor Returns"
 oe_byd.9.desc_pact: "#F In November 1402 the emperor left France and in June of the next year reached the capital, took back the powers of John VII, overturned some of the terms John VII had made with the Turks, and sent John VII away to Lemnos.#!\n\nNow the emperor is back in the capital after #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_byd_west_m').GetValue|0]#! months away, and [GetCountry('BYZ').MakeScope.GetVariable('oe_byd_regent').GetCharacter.GetName] hands back the reins. [ShowModifier('oe_byd_emperor_abroad')] is removed. The whole city knows that while the emperor was away, some dealt with the sultan behind closed doors."
 oe_byd.9.desc_plain: "#F In November 1402 the emperor left France and in June of the next year reached the capital, took back the powers of John VII, overturned some of the terms John VII had made with the Turks, and sent John VII away to Lemnos.#!\n\nNow the emperor is back in the capital after #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_byd_west_m').GetValue|0]#! months away, and [GetCountry('BYZ').MakeScope.GetVariable('oe_byd_regent').GetCharacter.GetName] hands back the reins. [ShowModifier('oe_byd_emperor_abroad')] is removed."
 oe_byd.9.a: "Reward the regent"
 oe_byd.9.a.tt: "This will be remembered"
 oe_byd.9.b: "Call the secret talks to account"
 oe_byd.9.b.tt: "[oe_tu_authority|e] #G +3#!\nThis will be remembered"
 oe_byd.9.c: "Let bygones be bygones"
 oe_byd.9.c.tt: "The matter is dropped"
 oe_byd.11.t: "A Storm in the East"
 oe_byd.11.desc: "#F From 1400 Timur and Bayezid traded insulting letters, and Timur courted the Turkish emirs the Ottomans had swallowed up. In July 1402 the two armies met at Ankara.#!\n\nNow Timur's armies are bearing down on the Ottoman east, and the sultan has to send the besieging troops to Asia.\nCity morale #G +10#!; while the two are at war, grain stores #G +2#! and city morale #G +1#! a month."
 oe_byd.11.a: "Sally out for grain"
 oe_byd.11.a.tt: "Grain stores #G +15#!\nCity morale #G +5#!"
 oe_byd.11.b: "Strengthen the walls and wait"
 oe_byd.11.b.tt: "Constantinople gains [ShowModifier('oe_byd_watch')] for #Y 24#! months"
 oe_byd.13.t: "The Sultan's Terms"
 oe_byd.13.desc_w3: "#F Through the years of the blockade, voices in the city kept calling for terms with the sultan. In 1401 John VII went out to negotiate with Bayezid, and the blockade was lifted for a time.#!\n\nNow the city has lost heart: city morale has stood at #Y 0#! for #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_byd_zero_m').GetValue|0]#! months. The peace party says openly that without terms the gates will be opened from inside. The sultan's envoys set out the terms: tribute every year, and a quarter of the city."
 oe_byd.13.desc_w1: "#F Through the years of the blockade, voices in the city kept calling for terms with the sultan. In 1401 John VII went out to negotiate with Bayezid, and the blockade was lifted for a time.#!\n\nNow there is a new sultan, and [GetCountry('TUR').GetGovernment.GetRuler.GetName] has sent envoys: if the empire pays tribute every year, the camps outside the walls can be struck."
 oe_byd.13.desc_w2: "#F Through the years of the blockade, voices in the city kept calling for terms with the sultan. In 1401 John VII went out to negotiate with Bayezid, and the blockade was lifted for a time.#!\n\nNow the city has been under blockade for #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_byd_m').GetValue|0]#! months. The sultan, too, is tired of the endless siege and has sent envoys: if the empire pays tribute every year, the camps outside the walls can be struck."
 oe_byd.13.a: "Accept the terms"
 oe_byd.13.a.tt: "Without a buying-peace agreement with the Ottomans: sign one for #Y 5#! years, the first year paid now (#Y 3#! months of total income), prestige #R −15#!, [oe_tu_authority|e] #R −5#!\nWith one: pay the sultan #R 6#! months of trade and tax income at once, and it runs another #Y 5#! years\nThe situation #bold #color_yellow The Blockade of the City#!#! ends: terms and tribute"
 oe_byd.13.b: "Accept the terms"
 oe_byd.13.b.tt: "Without a buying-peace agreement with the Ottomans: sign one for #Y 5#! years, the first year paid now (#Y 3#! months of total income), prestige #R −15#!, [oe_tu_authority|e] #R −5#!\nWith one: pay the sultan #R 6#! months of trade and tax income at once, and it runs another #Y 5#! years\nA Turkish quarter is set up in the city; Ottoman opinion of the empire #G +25#! for #Y 10#! years\nThe situation #bold #color_yellow The Blockade of the City#!#! ends: terms and tribute"
 oe_byd.13.c: "Refuse"
 oe_byd.13.c.tt: "City morale #G +5#!\nIf the sultan has changed, the new sultan counts as the besieger from now on\nThe sultan may offer terms again in #Y 24#! months"
 oe_byd.13.d: "Refuse, and punish the peace party"
 oe_byd.13.d.tt: "[oe_tu_authority|e] #R −10#!\nCity morale #G +20#!\nThe sultan may offer terms again in #Y 24#! months"
 oe_byd.12.t: "The Siege Is Over"
 oe_byd.12.desc_c1cap: "#F In July 1402 Timur routed the Ottoman army at Ankara and took Bayezid prisoner. The Turkish troops around the city melted away, the Turkish quarter was pulled down, and the capital, shut in for eight years, opened its gates again.#!\n\nNow the sultan has been defeated and taken, the Ottomans have troubles of their own, and the blockade has fallen apart. The city was under blockade for #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_byd_m').GetValue|0]#! months.\n[GetCountry('BYZ').Custom('OeBydSettle')]\nPrestige #G +10#!; the Turkish quarter, if any, is pulled down."
 oe_byd.12.desc_c1: "#F In July 1402 Timur routed the Ottoman army at Ankara and took Bayezid prisoner. The Turkish troops around the city melted away, the Turkish quarter was pulled down, and the capital, shut in for eight years, opened its gates again.#!\n\nNow the house of Osman is at war with itself and has no time for the capital, and the blockade has fallen apart. The city was under blockade for #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_byd_m').GetValue|0]#! months.\n[GetCountry('BYZ').Custom('OeBydSettle')]\nPrestige #G +10#!; the Turkish quarter, if any, is pulled down."
 oe_byd.12.desc_c2: "#F In July 1402 Timur routed the Ottoman army at Ankara and took Bayezid prisoner. The Turkish troops around the city melted away, the Turkish quarter was pulled down, and the capital, shut in for eight years, opened its gates again.#!\n\nNow the sultan can no longer find the men to keep up the siege, and the camps have broken up of their own accord. The city was under blockade for #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_byd_m').GetValue|0]#! months.\n[GetCountry('BYZ').Custom('OeBydSettle')]\nPrestige #G +10#!; the Turkish quarter, if any, is pulled down."
 oe_byd.12.desc_c3: "#F In July 1402 Timur routed the Ottoman army at Ankara and took Bayezid prisoner. The Turkish troops around the city melted away, the Turkish quarter was pulled down, and the capital, shut in for eight years, opened its gates again.#!\n\nNow the empire and the sultan have agreed terms, and the camps outside the walls have been struck. The city was under blockade for #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_byd_m').GetValue|0]#! months.\n[GetCountry('BYZ').Custom('OeBydSettle')]"
 oe_byd.12.a: "A procession of thanksgiving"
 oe_byd.12.b: "Rebuild the villages outside the walls"
 oe_byd.12.b.tt: "Costs #R 2#! months of trade and tax income\nConstantinople gains [ShowModifier('oe_byd_rebuild')] for #Y 10#! years"
 oe_byd.14.t: "Famine in the City"
 oe_byd.14.desc: "#F In the later years of the blockade famine struck the capital again and again, worst of all early in 1400.#!\n\nNow grain stores are down to #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_byd_food').GetValue|0]#!, and bread costs more in the city every day."
 oe_byd.14.a: "Open the granaries"
 oe_byd.14.a.tt: "Grain stores #G +[GetCountry('BYZ').MakeScope.ScriptValue('oe_byd_granary_relief')|0]#! (#Y 10#!, plus #Y 3#! for each granary level above the first)\nCity morale #G +5#!"
 oe_byd.14.b: "Buy grain dear from Galata"
 oe_byd.14.b.tt: "Costs #R 2#! months of trade and tax income\nGrain stores #G +15#!"
 oe_byd.14.c: "Ration by household"
 oe_byd.14.c.tt: "Grain stores #G +5#!\nCity morale #R −10#!"
 oe_byd.15.t: "Over the Walls"
 oe_byd.15.desc: "#F In the famine early in 1400 many people climbed over the walls and went over to the Turks outside.#!\n\nNow city morale is down to #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_byd_morale').GetValue|0]#!. Every night someone is let down the walls on a rope and goes over to the sultan's camp."
 oe_byd.15.a: "Let them go"
 oe_byd.15.a.tt: "Grain stores #G +5#!\nCity morale #G +3#!\nConstantinople gains [ShowModifier('oe_byd_exodus')] for #Y 5#! years"
 oe_byd.15.b: "Bar the gates"
 oe_byd.15.b.tt: "City morale #R −5#!"
 oe_byd.15.c: "Pay them to stay"
 oe_byd.15.c.tt: "Costs #R 1#! month of trade and tax income\nCity morale #G +5#!"
 oe_byd.16.t: "Venetian Grain Ships"
 oe_byd.16.desc: "#F During the blockade the sea was never closed tight, and Venetian and Genoese merchantmen often ran grain into the city.#!\n\nNow a Venetian convoy loaded with grain lies off the Golden Horn. The masters name two prices: cash, or concessions in trade."
 oe_byd.16.a: "Pay their price"
 oe_byd.16.a.tt: "Costs #R 2#! months of trade and tax income\nGrain stores #G +15#!\nVenice: opinion of the empire #G +5#! for #Y 5#! years"
 oe_byd.16.b: "Trade privileges for grain"
 oe_byd.16.b.tt: "Grain stores #G +20#!\nThe empire gains [ShowModifier('oe_byd_grain_privilege')] for #Y 10#! years"
 oe_byd.16.c: "Decline"
 oe_byd.16.c.tt: "The convoy looks for other buyers"
 oe_byd.17.t: "Assault on the Land Walls"
 oe_byd.17.desc: "#F In the summer and autumn of 1395, and again from Nicopolis to the spring of 1397, the Turks stormed the land walls several times and were driven back each time.#!\n\nNow the sultan's army has come up to the land walls to storm them. The defences stand at #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_byd_defense')|0]#!; the chance of holding is about #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_byd_hold_chance')|0]%#!."
 oe_byd.17.a: "Everyone to the walls"
 oe_byd.17.a.tt: "If the walls hold (#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_byd_hold_chance')|0]%#! chance): city morale #G +10#!\nIf the outworks fall: city morale #R −10#!, grain stores #R −5#!"
 oe_byd.17.b: "Ask the Genoese of Galata for help"
 oe_byd.17.b.tt: "Costs #R 1#! month of trade and tax income\nThe chance of holding rises by #G 15%#!\nIf the walls hold (#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_byd_hold_chance_gen')|0]%#! chance): city morale #G +10#!\nIf the outworks fall: city morale #R −10#!, grain stores #R −5#!"
 oe_byd.90.t: "The Blockade of the City: worker"
