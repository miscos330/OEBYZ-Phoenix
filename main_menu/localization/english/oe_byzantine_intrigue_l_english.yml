l_english:
 oe_byzantine_intrigue: "Byzantine Intrigue"
 oe_byzantine_intrigue_desc: "The new sovereign has scarcely taken the throne before letters begin passing through the palace walls.\n\nDuring a #Y regency#! or the #Y first 5 years#! of a ruler's reign, a country that has not completed #Y Secure the Succession#! faces a #R 25%#! monthly chance of crisis if a non-allied noble house has #Y more than 300 Influence#!.\nEnds when every non-allied house has #Y less than 300 Influence#! and both Stability and Legitimacy are #Y above 30#!. This disaster can recur.\nWhile active: #R −2%#! Court Spending Efficiency and #R −20%#! Stability Investment Efficiency.\n\nUntil the capital is purged, a coup has a #R 20%#! monthly chance. If any house, including the political ally, has #Y more than 400 Influence#!, a noble civil war has an independent #R 10%#! monthly chance."
 oe_bi_purge_capital_action: "#bold #Y Purge Noble Influence from the Capital#!#!"
 oe_bi_purge_capital_action_desc: "Disperse the clients, informants and armed retainers of the great houses. Spend #R 2 Authority#! and #R 7 Stability#! to reduce every non-allied house's Influence by #G 50#!. Available once per disaster; prevents further coups during this crisis."
 oe_bi_bribe_supporters: "Bribe Noble Supporters"
 oe_bi_bribe_supporters_desc: "Choose a non-allied noble house. Spend #R 2 Authority#! and #R three months of Privy Purse income#! to reduce its Influence by #G 25#!. Requires sufficient funds. Nationwide cooldown: #Y 3 months#!."
 OE_BI_CHOOSE_HOUSE: "Choose a Non-Allied House Head"
 oe_byzantine_intrigue.1.t: "The Eastern Roman Succession Crisis"
 oe_byzantine_intrigue.1.d: "The new sovereign's name appears on every decree, but the court has not yet learned to obey it. Magnates test the throne in audiences and exchange promises over marriages and banquets. Letters to military camps travel more swiftly than orders to the provincial offices.\n\nSome invoke the late ruler's wishes; others claim the court has fallen into the hands of favorites. All profess loyalty while waiting for a sign of weakness. The rites of succession are over. The struggle for the Empire has only begun."
 oe_byzantine_intrigue.1.a: "Never has the crown weighed so heavily."
 oe_byzantine_intrigue.2.t: "Support from House [SCOPE.sDynasty('oe_bi_support_family').GetName]"
 oe_byzantine_intrigue.2.d: "Amid the rumors engulfing the palace, House [SCOPE.sDynasty('oe_bi_support_family').GetName] publicly renews its alliance with the throne. Its clients carry imperial orders, its relatives attend court, and private assurances become a visible commitment.\n\nThis support cannot silence every ambitious voice, but it makes one fact plain to those still watching: the sovereign does not stand alone."
 oe_byzantine_intrigue.2.a: "The Empire will remember this support."
 oe_byzantine_intrigue.3.t: "The Succession Crisis Subsides"
 oe_byzantine_intrigue.3.d: "Private gatherings disperse, garrisons cease waiting for rival commands, and courtiers once more sign the same decrees. The great houses that treated the succession as an opportunity have accepted that continued defiance costs too much.\n\nThe palace still holds secrets and the magnates still harbor ambitions. For now, however, the Empire once again answers to a single authority."
 oe_byzantine_intrigue.3.a: "Let imperial decrees carry weight again."
 oe_byzantine_intrigue.4.t: "Coup!"
 oe_byzantine_intrigue.4.d: "The palace gates open from within in the dead of night. Noble supporters have bribed the guards, silenced the messengers and used forged commands to draw away the last loyal soldiers.\n\nBlades seek the sovereign, the heir and the regent. By dawn, new proclamations are ready. Among the houses whose heads remain eligible for the crown, the strongest will place its leader on the throne. The others emerge with their clients scattered and their political strength shattered."
 oe_byzantine_intrigue.4.a: "The court has chosen for the Empire."
 oe_byzantine_intrigue.5.t: "Civil War!"
 oe_byzantine_intrigue.5.d: "Secret pledges have become open rebellion. Aristocratic estates provision armies, provincial offices refuse to surrender their tax rolls, and towns that once obeyed the emperor become rebel strongholds.\n\nThe most powerful houses take their relatives into the rebel government. They no longer seek a place at court. They intend to decide who may command Rome."
 oe_byzantine_intrigue.5.a: "Ambition tears the Empire apart once more."
 OE_BI_END_INFLUENCE_TT: "All non-allied noble houses lose #G 100 Influence#!."
 OE_BI_COUP_TT: "The current heir, ruler and regent #R die#!. The strongest eligible non-allied house head becomes ruler and that dynasty loses noble-house status. Houses whose heads are among the victims are skipped. All remaining houses lose #G 300 Influence#!."
 OE_BI_CIVIL_WAR_TT: "A noble civil war begins immediately. Rebels receive #R at least 50%#! of the locations directly owned by Byzantium before the revolt. Every house with #Y more than 300 Influence#!, including allies, loses its noble status; its living members previously resident in Byzantium move to the rebel country."
 OE_BI_REBEL_NAME: "Aristocratic Rebel Government"
 oe_bi_capital_purged: "Capital Purged in This Crisis"
 oe_bi_bribe_cooldown: "Bribe Noble Supporters Cooldown"
 oe_bi_coup_in_progress: "Coup Succession in Progress"
 oe_bi_bribe_price: "Privy Purse Cost of Bribing Supporters"
 OE_BI_ALLY_AUTHORITY_GAIN: "Gain #G 2 Authority#! (maximum 100)."
