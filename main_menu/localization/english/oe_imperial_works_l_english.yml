l_english:
 OE_WORKS_TAB: "Imperial Works"
 OE_WORKS_TAB_DESC: "Irrigation, cultivation, granaries and naval bases sustain imperial cities and secure the sea lanes."
 OE_WORKS_OPEN: "Click to view imperial works in Greece and western Anatolia"
 OE_WORKS_GRAIN_FLAVOR: "The fields of Thrace sustain the granaries of the capital. Restoring irrigation and land registers, and coordinating cultivation for its supply, will bring fuller harvests along the roads and across the sea to Constantinople."
 OE_WORKS_PROGRESS: "Thracian food projects: #Y [GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_works_thrace_food_projects_used')|0] / 5#!"
 OE_WORKS_FIVE_PROJECTS_TT: "Fewer than five Thracian food projects have been commissioned"
 OE_WORKS_FOOD_TARGET_TT: "An owned rural location in Thrace produces a food good and does not yet have Supply the Capital"
 oe_works_thrace_food: "Increase Food Production in Thrace"
 oe_works_thrace_food_desc: "Select an owned #Y rural food-producing location in Thrace#! and invest #Y 1000 gold#! to grant #Y Supply the Capital#! permanently: local peasant enfranchisement #R -10%#!, maximum RGO size #G +100%#! and local food production #G +33%#!.\n\nEach location may receive one investment. This action may be used #Y five times#! in total, without a cooldown."
 oe_works_thrace_food_choose: "Choose a rural food-producing location in Thrace"
 oe_works_thrace_food_none: "@trigger_no! No eligible owned rural food-producing location in Thrace remains without Supply the Capital."
 oe_supply_the_capital: "Supply the Capital"
 oe_supply_the_capital_desc: "This settlement supplies the capital. Officials coordinate cultivation, labor and irrigation through the land registers, expanding production and sending the harvest to Constantinople."
 oe_planned_production: "Planned Production"
 oe_planned_production_desc: "Imperial officials coordinate cultivation and irrigation through the land registers, binding rural labor and harvests to the continuing needs of the capital. Only available in locations with Supply the Capital."
 oe_works_thrace_food_projects: "Thracian Food Projects"
 OE_WORKS_MEDITERRANEAN_OPEN: "Click to view imperial works in the Mediterranean"
 OE_WORKS_MEDITERRANEAN_FLAVOR: "From the shipyards of Rhodes to the strait of Gibraltar, timber, rigging and sailors gather in the emperor’s harbors. Expel the Foreigners authorizes five naval bases; Our Sea adds five more projects and extends the network into the western Mediterranean."
 OE_WORKS_NAVAL_PROGRESS: "Naval base projects commissioned: #Y [GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_works_naval_bases_used')|0] / [GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_works_naval_bases_limit')|0]#!"
 OE_WORKS_NAVAL_SLOTS_TT: "A naval base project remains available: five initially, ten in total after Our Sea"
 OE_WORKS_NAVAL_TARGET_TT: "Byzantium directly owns an eligible listed location without an already commissioned naval base"
 oe_works_imperial_naval_base: "Build an Imperial Naval Base"
 oe_works_imperial_naval_base_desc: "Spend #Y 1000 gold#! and #Y 25 Political Influence#! to unlock and begin building one #Y Imperial Naval Base#! in a listed location directly owned by Byzantium. Each site can be commissioned once. Five projects are available initially; Our Sea raises the cumulative limit to ten.\n\nInitial sites: Rhodes, Candia, Athens, Kalamata, Acre, Alexandria, Tobruk, Limassol, Antioch, Smyrna, Corfu and Ragusa.\nAfter Our Sea: Naples, Genoa, Venice, Tunis, Cagliari, Ciutadella, Marseille, Barcelona, Cartagena, Ceuta, Gibraltar, Malta and Palermo."
 oe_works_imperial_naval_base_choose: "Choose a naval base site"
 oe_works_imperial_naval_base_none: "@trigger_no! No eligible, uncommissioned site is directly owned by Byzantium. Our Sea unlocks additional locations."
 oe_imperial_naval_base: "Imperial Naval Base"
 oe_imperial_naval_base_desc: "A permanent naval base commissioned through Imperial Works, employing 1000 soldiers to provide sailors, repairs and harbor services. On completion: local monthly sailors +30, ship repair speed +10%, harbor capacity +0.15, and national inland-sea proximity impact -2%. Limited to one level per site."
 oe_imperial_naval_base_maintenance: "Imperial Naval Base Maintenance"
 oe_works_naval_base_projects: "Naval Base Projects Commissioned"
 oe_works_naval_base_site: "Imperial Naval Base Site"
