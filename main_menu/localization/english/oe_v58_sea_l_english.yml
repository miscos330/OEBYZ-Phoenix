 hint_oe_sit_v58_sea_mandala_hegemony:0 "Mandala & Maritime Hegemony Guide"
 hint_oe_sit_v58_sea_mandala_hegemony_desc:0 "Use the six Situation Actions to raise #Y Mandala Glory#! (continental river-valley supremacy) or #Y Strait & Spice Dominion#! (archipelago spice & naval mastery). Reaching 80/100 on either gauge after 1450 unlocks a grand regional triumph."
 oe_sit_v58_sea_mandala_hegemony:0 "Southeast Asia: Mandala & Maritime Hegemony"
 oe_sit_v58_sea_mandala_hegemony_desc:0 "From Angkor's stone barays and the Irrawaddy's gilded stupas to Malacca's eighty-four-tongue strait and the volcanic clove isles of Maluku, Southeast Asian monarchies and maritime sultanates vie to forge an enduring mandala or monsoon thalassocracy."
 oe_v58_sea.1.a:0 "Dredge the West Baray and renew the royal canals."
 oe_v58_sea.1.b:0 "Divert the stonecutters to shore up frontier forts."
 oe_v58_sea.1.c:0 "Entrust local reservoirs to provincial temple abbots."
 oe_v58_sea.1.desc:0 "After generations of monsoon floods, silt chokes the sandstone intake channels of the West Baray. Khmer hydraulic engineers present palm-leaf surveys showing how clearing the embankments could restore triple-harvest rice fields around Yasodharapura, though provincial governors protest the dry-season corvee."
 oe_v58_sea.1.title:0 "The Great Baray Sluices of Angkor"
 oe_v58_sea.10.a:0 "Enforce the royal pepper monopoly across the Strait."
 oe_v58_sea.10.b:0 "Launch a flagship squadron of giant war-galleys."
 oe_v58_sea.10.c:0 "Reward loyal orang kaya merchant magnates with customs rebates."
 oe_v58_sea.10.desc:0 "Towering hundred-oar royal galleys bristling with bronze culverins ride at anchor off Bandar Aceh while pepper estates across northern Sumatra yield record harvests. Court poets celebrate a golden age uniting maritime power and literary splendor."
 oe_v58_sea.10.title:0 "Crown of the Pepper Seas & Iskandar Muda's Armada"
 oe_v58_sea.11.a:0 "Expand the Vijaya coastal war-galley squadrons."
 oe_v58_sea.11.b:0 "Fortify the mountain passes guarding Vijaya and Amaravati."
 oe_v58_sea.11.c:0 "Broker a maritime truce and collect coastal salvage dues."
 oe_v58_sea.11.desc:0 "Beneath the crimson brick kalan towers of Vijaya, Cham naval commanders fit sleek oared galleys for audacious coastal counterstrikes. From rocky coves along the South China Sea, Champa proves that maritime mastery can humble far larger overland empires."
 oe_v58_sea.11.title:0 "Che Bong Nga & Champa's Maritime Resistance"
 oe_v58_sea.12.a:0 "Charter the Go Sanh Ceramic & Eaglewood Guilds."
 oe_v58_sea.12.b:0 "Send fragrant eaglewood tribute to court maritime allies."
 oe_v58_sea.12.c:0 "Sell the season's entire royal agarwood reserve to visiting junks."
 oe_v58_sea.12.desc:0 "Highland foresters descend to Thi Nai harbor carrying bundles of priceless resinous eaglewood, while Go Sanh kilns fire sea-green stoneware bound for Java, Luzon, and Malacca. Cham shipmasters propose a permanent merchant guild linking mainland and archipelago."
 oe_v58_sea.12.title:0 "Eaglewood, Cham Ceramics & the Southern Sea Lanes"
 oe_v58_sea.13.a:0 "Enshrine the Phra Bang and unite the Mekong muangs."
 oe_v58_sea.13.b:0 "Expand the royal elephant kraals along the Nam Khan."
 oe_v58_sea.13.c:0 "Grant upland chieftains salt and benzoin trade exemptions."
 oe_v58_sea.13.desc:0 "Descending the forested gorges of the upper Mekong with war-elephants and Khmer scholars, Prince Fa Ngum rallies the scattered Lao muang valleys from Muang Sua to Vientiane. The golden Phra Bang Buddha arrives to sanctify a united highland mandala."
 oe_v58_sea.13.title:0 "Fa Ngum & the Kingdom of a Million Elephants"
 oe_v58_sea.14.a:0 "Raise Pha That Luang as the beacon of Mekong diplomacy."
 oe_v58_sea.14.b:0 "Fortify the Mekong crossing and drill mountain ambushers."
 oe_v58_sea.14.c:0 "Tax overland caravan trails carrying musk, silk, and lacquer."
 oe_v58_sea.14.desc:0 "As rival empires press from both the Irrawaddy and Chao Phraya, King Setthathirath fortifies Vientiane and raises the golden lotus stupa of Pha That Luang. Monks copy thousands of palm-leaf chronicles while envoys weave defensive alliances across the Mekong."
 oe_v58_sea.14.title:0 "King Setthathirath & the Golden Stupa of Pha That Luang"
 oe_v58_sea.15.a:0 "Promulgate the Sakdina rank tables across the realm."
 oe_v58_sea.15.b:0 "Expand the royal Phra Khlang maritime trading warehouse."
 oe_v58_sea.15.c:0 "Honor foreign merchant captains with court titles."
 oe_v58_sea.15.desc:0 "Surrounded by three rivers, the island metropolis of Ayodhya teems with Persian, Chinese, Ryukyuan, and Japanese quarters. Royal jurists propose codifying exact Sakdina rice-field ranks for every prince, minister, and freeman to centralize administration."
 oe_v58_sea.15.title:0 "The Sakdina Code & the Island Capital of Ayutthaya"
 oe_v58_sea.16.a:0 "Launch the Palapa Jong Ocean Fleet to bind the archipelago."
 oe_v58_sea.16.b:0 "Commission the Nagarakretagama royal chronicle and temple fairs."
 oe_v58_sea.16.c:0 "Collect annual Javanese rice-and-spice tribute in silver."
 oe_v58_sea.16.desc:0 "In the red-brick halls of Trowulan, court chroniclers recite the Nagarakretagama listing tributary islands from Sumatra to the Spice Sea. Shipwrights along the north Java coast launch towering multi-masted jongs built of ironwood without a single iron nail."
 oe_v58_sea.16.title:0 "The Palapa Oath & the Great Jong Armada of Nusantara"
 oe_v58_sea.17.a:0 "Establish regulated spice warehouses and fair grower compacts."
 oe_v58_sea.17.b:0 "Arm kora-kora war-outriggers to guard the clove reefs."
 oe_v58_sea.17.c:0 "Auction the harvest to the highest foreign silver bidder."
 oe_v58_sea.17.desc:0 "Nowhere else on earth do true cloves and nutmeg ripen as they do on the volcanic slopes of Ternate, Tidore, and Banda. Javanese rice junks, Malay sultans, and distant European fleets all bid fiercely for the aromatic harvest."
 oe_v58_sea.17.title:0 "Volcanic Isles of Clove and Nutmeg: Ternate & Banda"
 oe_v58_sea.18.a:0 "Found a royal translation hall for charts, metallurgy, and law."
 oe_v58_sea.18.b:0 "Expand coastal customs levies across every monsoon anchorage."
 oe_v58_sea.18.c:0 "Convene a regional congress of Southeast Asian envoys."
 oe_v58_sea.18.desc:0 "Every spring the southwest wind carries ships from Gujarat, Aden, and Kilwa; every autumn the northeast wind returns junks from Canton, Ryukyu, and Japan. In the bustling harbor markets of Southeast Asia, charts, firearms, calendars, and chronicles pass freely between civilizations."
 oe_v58_sea.18.title:0 "Crossroads of the Reversing Monsoons"
 oe_v58_sea.2.a:0 "Patronize the Theravada Sangha at Angkor Wat."
 oe_v58_sea.2.b:0 "Preserve the ancient Sanskrit court astrologers beside them."
 oe_v58_sea.2.c:0 "Levy a pilgrim toll along the sandstone causeway."
 oe_v58_sea.2.desc:0 "Robed Theravada elders chant Pali sutras across the lotus galleries where Vishnu once stood in state. Pilgrims arrive by oxcart from the Mekong and Chao Phraya alike, bearing gilded Buddha images and palm-leaf manuscripts for the central sanctuary."
 oe_v58_sea.2.title:0 "Consecration of Angkor Wat's Theravada Sanctuary"
 oe_v58_sea.3.a:0 "Charter the Four-River Customs Court at Chaktomuk."
 oe_v58_sea.3.b:0 "Fortify the ancient inland ramparts of Angkor."
 oe_v58_sea.3.c:0 "Auction seasonal river-ferry monopolies to merchant guilds."
 oe_v58_sea.3.desc:0 "Where the Tonle Sap meets the Mekong and Bassac channels, Chinese, Malay, and Cham merchant junks anchor beneath royal customs banners. Counselors debate whether to shift greater mercantile privileges downriver toward Chaktomuk and Longvek or keep all customs anchored inland."
 oe_v58_sea.3.title:0 "Chaktomuk & the Four-River Trade Crossroads"
 oe_v58_sea.4.a:0 "Weld matchlock corps and war-elephants into one royal army."
 oe_v58_sea.4.b:0 "Mount bronze swivel guns aboard Irrawaddy war-boats."
 oe_v58_sea.4.c:0 "Tax foreign gunsmiths while relying on traditional levies."
 oe_v58_sea.4.desc:0 "Portuguese adventurers and Malay gunsmiths arriving at Syriam and Martaban demonstrate volley-firing matchlocks capable of breaking stockade gates. Burmese captains propose pairing disciplined musketeer companies directly with armored royal war-elephants and Shan cavalry."
 oe_v58_sea.4.title:0 "Matchlocks and War-Elephants on the Irrawaddy"
 oe_v58_sea.5.a:0 "Promulgate the unified Dhammasattha and tributary compact."
 oe_v58_sea.5.b:0 "Prepare the white-elephant host for a fresh dry-season march."
 oe_v58_sea.5.c:0 "Exact a golden coronation tribute from coastal ports."
 oe_v58_sea.5.desc:0 "Tributary princes from the Shan hills, Lan Na, and the Mon coast gather beneath the Golden Pavilion. Following the vision of Bayinnaung, court jurists draft a unified Dhammasattha law code and standardized royal weights to turn fleeting conquests into a lasting mandala commonwealth."
 oe_v58_sea.5.title:0 "Bayinnaung's Ten-Direction Mandala Edict"
 oe_v58_sea.6.a:0 "Donate the monarch's weight in gold to the Shwedagon spire."
 oe_v58_sea.6.b:0 "Inscribe the Kalyani stone pillars to purify monastic discipline."
 oe_v58_sea.6.c:0 "Invite maritime guild donors to share the gilding honors."
 oe_v58_sea.6.desc:0 "Following the famed devotion of Queen Shin Sawbu and King Dhammazedi, goldsmiths hammer sheets of pure gold equal to the monarch's weight to sheathe the Shwedagon stupa at Dagon. Mon and Burman monks alike herald the ceremony as a sign of righteous rule."
 oe_v58_sea.6.title:0 "Gilding of the Shwedagon Golden Spire"
 oe_v58_sea.7.a:0 "Establish the Four Shahbandars and stone-vaulted godowns."
 oe_v58_sea.7.b:0 "Enlist Orang Laut fleets to guide every passing spice ship."
 oe_v58_sea.7.c:0 "Collect immediate anchorage fees from visiting monsoon fleets."
 oe_v58_sea.7.desc:0 "Legend tells of a white mouse-deer kicking a hunting hound beside the malaka tree, marking a sheltered estuary where the Indian Ocean meets the South China Sea. Merchants speaking eighty-four languages crowd the bridge stalls awaiting royal protection."
 oe_v58_sea.7.title:0 "Parameswara's Charter & the Entrepot of Eighty-Four Tongues"
 oe_v58_sea.8.a:0 "Sponsor Jawi chronicles, madrasas, and Sufi legal benches."
 oe_v58_sea.8.b:0 "Grant autonomous trading quarters to Gujarati and Ming envoys."
 oe_v58_sea.8.c:0 "Reinforce customary Malay adat privileges for inland chiefs."
 oe_v58_sea.8.desc:0 "From Pasai to Malacca and Aceh, Sufi jurists and sea captains compose the Undang-Undang Laut in graceful Jawi script. Every ship's nakhoda is likened to a sovereign at sea, governed by clear rules for salvage, spice cargo shares, and honest weights."
 oe_v58_sea.8.title:0 "Undang-Undang Laut & the Jawi Literary Court"
 oe_v58_sea.9.a:0 "Welcome the Ottoman artillery masters and expand royal foundries."
 oe_v58_sea.9.b:0 "Channel the Red Sea pepper trade directly into treasury reserves."
 oe_v58_sea.9.c:0 "Distribute swivel guns to allied Strait sultanates."
 oe_v58_sea.9.desc:0 "Laden with Sumatran black pepper, camphor, and golden letters, swift Aceh galleys brave the Indian Ocean toward Jeddah and Constantinople. Returning master gunners and bronze founders bring Rumeli siegecraft to answer European carracks in the Strait."
 oe_v58_sea.9.title:0 "Aceh's Pepper Embassy to the Sublime Porte"
 oe_v58_sea_act_baray_canal_corvee:0 "Dredge the Royal Baray & Paddy Canals"
 oe_v58_sea_act_baray_canal_corvee_desc:0 "Mobilize dry-season corvee engineers to clear sandstone sluices, laterite embankments, and triple-harvest irrigation tanks."
 oe_v58_sea_act_baray_canal_corvee_tt:0 "Raises #Y Mandala Glory#! by #G +8#! and grants the #Y Restored Baray Hydraulics#! modifier for 12 years."
 oe_v58_sea_act_clove_monopoly_charter:0 "Charter the Moluccan Clove & Nutmeg Guilds"
 oe_v58_sea_act_clove_monopoly_charter_desc:0 "Guarantee royal copper weights, Javanese rice convoys, and warehouse rights across Banda, Ternate, and Malacca."
 oe_v58_sea_act_clove_monopoly_charter_tt:0 "Raises #Y Strait & Spice Dominion#! by #G +10#! and grants the #Y Moluccan Clove Charter#! modifier for 12 years."
 oe_v58_sea_act_consecrate_devaraja:0 "Consecrate the Devaraja Mountain-Temple"
 oe_v58_sea_act_consecrate_devaraja_desc:0 "Summon Brahmin astrologers and Theravada elders to sanctify the sovereign as universal Chakravartin of the river valleys."
 oe_v58_sea_act_consecrate_devaraja_tt:0 "Raises #Y Mandala Glory#! by #G +10#! and grants the #Y Consecrated Devaraja Court#! modifier for 12 years."
 oe_v58_sea_act_elephant_vassal_muster:0 "Muster the White-Elephant Tributary Host"
 oe_v58_sea_act_elephant_vassal_muster_desc:0 "Call upon upland Shan, Lao, and frontier chieftains to supply armored war-elephants and matchlock retainers for the dry season."
 oe_v58_sea_act_elephant_vassal_muster_tt:0 "Raises #Y Mandala Glory#! by #G +9#! and grants the #Y Armored War-Elephant Muster#! modifier for 12 years."
 oe_v58_sea_act_monsoon_embassy_network:0 "Launch Indian Ocean & Celestial Embassies"
 oe_v58_sea_act_monsoon_embassy_network_desc:0 "Dispatch golden-leaf diplomatic letters aboard the reversing monsoons to Calicut, Constantinople, and the Ming court."
 oe_v58_sea_act_monsoon_embassy_network_tt:0 "Raises #Y Strait & Spice Dominion#! by #G +8#! and grants the #Y Monsoon Diplomatic Circuit#! modifier for 12 years."
 oe_v58_sea_act_strait_armada_patrol:0 "Dispatch Jong & Orang Laut Strait Patrols"
 oe_v58_sea_act_strait_armada_patrol_desc:0 "Bind Orang Laut sea-navigators and war-jongs to escort monsoon spice fleets through the narrows of Malacca and Sunda."
 oe_v58_sea_act_strait_armada_patrol_tt:0 "Raises #Y Strait & Spice Dominion#! by #G +10#! and grants the #Y Strait Patrol Armada#! modifier for 12 years."
 oe_v58_sea_bld_angkor_bayon_hydraulics:0 "Angkor Bayon Hydraulic Complex"
 oe_v58_sea_bld_angkor_bayon_hydraulics_desc:0 "Vast sandstone-lined baray reservoirs, laterite spillways, and radiating canals engineered around the Bayon turn the seasonal Mekong floods into an inexhaustible emerald granary."
 oe_v58_sea_bld_banda_clove_warehouse:0 "Banda Clove & Nutmeg Warehouse"
 oe_v58_sea_bld_banda_clove_warehouse_desc:0 "Fortified volcanic-stone spice depots on the Banda archipelago regulating the world's rarest aromatic harvests of nutmeg, mace, and Moluccan cloves."
 oe_v58_sea_bld_champa_cham_tower_port:0 "Champa Cham Tower Port of Thi Nai"
 oe_v58_sea_bld_champa_cham_tower_port_desc:0 "Carved red-brick kalan beacon towers overlooking Thi Nai bay guide Cham outrigger fleets, ceramic kilns, and eaglewood merchants along the South China Sea coast."
 oe_v58_sea_bld_luang_prabang_elephant_kraal:0 "Luang Prabang Royal Elephant Kraal"
 oe_v58_sea_bld_luang_prabang_elephant_kraal_desc:0 "Teak-palisaded royal training grounds at the confluence of the Nam Khan and Mekong where mahouts break and armor white and war elephants for the Kingdom of a Million Elephants."
 oe_v58_sea_bld_malacca_spice_customhouse:0 "Malacca Royal Spice Customhouse"
 oe_v58_sea_bld_malacca_spice_customhouse_desc:0 "Stone-vaulted godowns beside the Malacca bridge where the four Shahbandars weigh Moluccan cloves, Sumatran pepper, Indian cottons, and Ming porcelain between monsoon winds."
 oe_v58_sea_bld_shwedagon_golden_pagoda:0 "Shwedagon Golden Pagoda"
 oe_v58_sea_bld_shwedagon_golden_pagoda_desc:0 "Crowning Singuttara Hill in hammered gold leaf donated by Mon and Burman monarchs alike, the towering stupa anchors Theravada pilgrimage and royal legitimacy across Lower Burma."
 oe_v58_sea_dec_charter_aceh_gunpowder_foundry:0 "Charter the Royal Pepper & Bronze Cannon Foundry"
 oe_v58_sea_dec_charter_aceh_gunpowder_foundry.a:0 "Cast the Great Cannons of the Strait"
 oe_v58_sea_dec_charter_aceh_gunpowder_foundry.desc:0 "Recruit Ottoman, Gujarati, and Malay master founders to cast long bronze lila swivel guns and heavy siege culverins funded by Sumatran pepper."
 oe_v58_sea_dec_charter_aceh_gunpowder_foundry.title:0 "Charter the Royal Pepper & Bronze Cannon Foundry"
 oe_v58_sea_dec_charter_aceh_gunpowder_foundry_desc:0 "Recruit Ottoman, Gujarati, and Malay master founders to cast long bronze lila swivel guns and heavy siege culverins funded by Sumatran pepper."
 oe_v58_sea_dec_charter_aceh_gunpowder_foundry_eff_tt:0 "Grants the #Y Strait Bronze Cannon Foundry#! modifier for 25 years and +10 Naval Tradition."
 oe_v58_sea_dec_charter_aceh_gunpowder_foundry_req_tt:0 "Must be a Malacca Strait or Sumatran realm with ports during 1337-1837."
 oe_v58_sea_dec_codify_malacca_sea_law:0 "Codify the Undang-Undang Laut (Malacca Maritime Code)"
 oe_v58_sea_dec_codify_malacca_sea_law.a:0 "Seal the Maritime Statutes of the Strait"
 oe_v58_sea_dec_codify_malacca_sea_law.desc:0 "Promulgate uniform shipboard justice, Shahbandar tariff tables, and Orang Laut pilotage duties across the busiest spice strait in the world."
 oe_v58_sea_dec_codify_malacca_sea_law.title:0 "Codify the Undang-Undang Laut (Malacca Maritime Code)"
 oe_v58_sea_dec_codify_malacca_sea_law_desc:0 "Promulgate uniform shipboard justice, Shahbandar tariff tables, and Orang Laut pilotage duties across the busiest spice strait in the world."
 oe_v58_sea_dec_codify_malacca_sea_law_eff_tt:0 "Grants the #Y Undang-Undang Laut Maritime Code#! modifier for 25 years and enables the #Y Four-Shahbandar Council#! reform."
 oe_v58_sea_dec_codify_malacca_sea_law_req_tt:0 "Must be a Malacca Strait, Malay, or Sumatran realm with ports during 1337-1837."
 oe_v58_sea_dec_guard_spice_archipelago:0 "Proclaim the Archipelago Spice & Monsoon Compact"
 oe_v58_sea_dec_guard_spice_archipelago.a:0 "Bind the Monsoon Sea-Lanes"
 oe_v58_sea_dec_guard_spice_archipelago.desc:0 "Coordinate war-jongs, kora-kora outriggers, and Cham beacon ports to defend the clove, nutmeg, and porcelain lanes from foreign interlopers."
 oe_v58_sea_dec_guard_spice_archipelago.title:0 "Proclaim the Archipelago Spice & Monsoon Compact"
 oe_v58_sea_dec_guard_spice_archipelago_desc:0 "Coordinate war-jongs, kora-kora outriggers, and Cham beacon ports to defend the clove, nutmeg, and porcelain lanes from foreign interlopers."
 oe_v58_sea_dec_guard_spice_archipelago_eff_tt:0 "Grants the #Y Monsoon Spice Armada Compact#! modifier for 25 years, boosting naval power and sea trade."
 oe_v58_sea_dec_guard_spice_archipelago_req_tt:0 "Must be Champa, Siam, Java, or a Spice Islands realm with ports during 1337-1837."
 oe_v58_sea_dec_proclaim_chakravartin_burma:0 "Proclaim the Conqueror of the Ten Directions"
 oe_v58_sea_dec_proclaim_chakravartin_burma.a:0 "Raise the White Umbrella of Sovereignty"
 oe_v58_sea_dec_proclaim_chakravartin_burma.desc:0 "Unite Upper Irrawaddy granaries with the Mon deltas, standardize Ahmudan royal regiments, and summon neighboring mandalas to golden tribute."
 oe_v58_sea_dec_proclaim_chakravartin_burma.title:0 "Proclaim the Conqueror of the Ten Directions"
 oe_v58_sea_dec_proclaim_chakravartin_burma_desc:0 "Unite Upper Irrawaddy granaries with the Mon deltas, standardize Ahmudan royal regiments, and summon neighboring mandalas to golden tribute."
 oe_v58_sea_dec_proclaim_chakravartin_burma_eff_tt:0 "Grants the #Y Conqueror of the Ten Directions#! modifier for 25 years and enables the #Y Ahmudan Royal Service#! reform."
 oe_v58_sea_dec_proclaim_chakravartin_burma_req_tt:0 "Must be a Burmese realm in the Irrawaddy or Arakan during 1337-1837."
 oe_v58_sea_dec_restore_angkor_hydraulics:0 "Restore the Great Barays of Angkor"
 oe_v58_sea_dec_restore_angkor_hydraulics.a:0 "Open the Great Baray Sluices"
 oe_v58_sea_dec_restore_angkor_hydraulics.desc:0 "Survey silted Khmer reservoirs, rebuild laterite bridges along the royal highways, and rededicate Angkor's twin hydraulic and spiritual heart."
 oe_v58_sea_dec_restore_angkor_hydraulics.title:0 "Restore the Great Barays of Angkor"
 oe_v58_sea_dec_restore_angkor_hydraulics_desc:0 "Survey silted Khmer reservoirs, rebuild laterite bridges along the royal highways, and rededicate Angkor's twin hydraulic and spiritual heart."
 oe_v58_sea_dec_restore_angkor_hydraulics_eff_tt:0 "Grants the #Y Restored Angkor Hydraulics#! modifier for 25 years and unlocks the #Y Hydraulic Devaraja Temple-State#! reform."
 oe_v58_sea_dec_restore_angkor_hydraulics_req_tt:0 "Must be Khmer or hold Angkor during 1337-1837."
 oe_v58_sea_dec_unite_million_elephants:0 "Proclaim the Kingdom of a Million Elephants"
 oe_v58_sea_dec_unite_million_elephants.a:0 "Enshrine the Phra Bang Palladium"
 oe_v58_sea_dec_unite_million_elephants.desc:0 "Enshrine the golden Phra Bang image, bind the Mekong muang valleys from Muang Sua to Vientiane, and parade the royal white elephants."
 oe_v58_sea_dec_unite_million_elephants.title:0 "Proclaim the Kingdom of a Million Elephants"
 oe_v58_sea_dec_unite_million_elephants_desc:0 "Enshrine the golden Phra Bang image, bind the Mekong muang valleys from Muang Sua to Vientiane, and parade the royal white elephants."
 oe_v58_sea_dec_unite_million_elephants_eff_tt:0 "Grants the #Y Kingdom of a Million Elephants#! modifier for 25 years and enables the #Y Muang Federation#! reform."
 oe_v58_sea_dec_unite_million_elephants_req_tt:0 "Must be a Lao or Lan Na Mekong realm during 1337-1837."
