 oe_v58_sea_out_chakravartin_mandala:0 "Chakravartin Mandala Supremacy"
 oe_v58_sea_out_chakravartin_mandala_desc:0 "Riverine kingdoms from Angkor and the Irrawaddy to the Mekong bow before a consecrated Chakravartin court."
 oe_v58_sea_out_monsoon_equilibrium:0 "Equilibrium of the Monsoon Realms"
 oe_v58_sea_out_monsoon_equilibrium_desc:0 "No single throne monopolized every valley and strait; Southeast Asia enters the modern age as a resilient multipolar world."
 oe_v58_sea_out_strait_thalassocracy:0 "Golden Strait Spice Thalassocracy"
 oe_v58_sea_out_strait_thalassocracy_desc:0 "Malacca, Aceh, Majapahit, and the Spice Islands weld the monsoon narrows into an impregnable maritime league."
 oe_v58_sea_ref_angkor_hydraulic_devaraja:0 "Hydraulic Devaraja Temple-State"
 oe_v58_sea_ref_angkor_hydraulic_devaraja_desc:0 "Channel monsoon floods through colossal baray reservoirs overseen by royal temple stewards, sustaining dense rice granaries at the cost of curbing provincial magnate autonomy."
 oe_v58_sea_ref_lan_xang_muang_mandala:0 "Million-Elephants Muang Federation"
 oe_v58_sea_ref_lan_xang_muang_mandala_desc:0 "Bind autonomous highland muang principalities through shared Buddhist relics, sacred oaths, and defensive elephant levies, trading central tax extraction for resilient frontier loyalty."
 oe_v58_sea_ref_shahbandar_strait_council:0 "Four-Shahbandar Strait Entrepot Council"
 oe_v58_sea_ref_shahbandar_strait_council_desc:0 "Appoint four harbor masters for Gujarati, Bengali, Malay-Javanese, and Chinese merchants under codified maritime law, enriching customs houses while chafing landed inland chiefs."
 oe_v58_sea_ref_taungoo_ahmudan_service:0 "Ahmudan Royal Service & Elephant Corps"
 oe_v58_sea_ref_taungoo_ahmudan_service_desc:0 "Organize hereditary crown-service platoons uniting Burmese infantry, war-elephants, and foreign matchlock gunners under direct royal registers, demanding steep campaign treasuries."
