 oe_fin_customs_crackdown: "Customs Crackdown"
 oe_fin.1.t: "The Gold in the Hyperpyron"
 oe_fin.1.desc: "When Alexios I struck the first hyperpyron in 1092 it was 20.5 carats fine. Under Michael VIII it fell to 15 carats, and under Andronikos II to 12. John VI Kantakouzenos struck the last hyperpyra; after him the empire minted no gold at all. Now the treasury is short again, and the master of the mint has brought a new recipe: one carat less gold in every coin, and the same bullion makes a whole extra batch."
 oe_fin.1.desc.bank: "When Alexios I struck the first hyperpyron in 1092 it was 20.5 carats fine. Under Michael VIII it fell to 15 carats, and under Andronikos II to 12. John VI Kantakouzenos struck the last hyperpyra; after him the empire minted no gold at all. Now the treasury is short again, and the master of the mint has brought a new recipe: one carat less gold in every coin, and the same bullion makes a whole extra batch. The Thessaloniki mint, still striking copper coins with Saint Demetrios under Andronikos III, now belongs to the empire's chartered Thessaloniki Mint bank, and the bank has sent in a proposal of its own."
 oe_fin.1.a: "One carat less"
 oe_fin.1.b: "Hold the standard"
 oe_fin.1.c: "Let the Thessaloniki Mint bank recoin"
 oe_fin.1.c.tt: "The Thessaloniki Mint bank's treasury −300"
 oe_fin.2.t: "Bread and the Grain Ships"
 oe_fin.2.desc: "In the winter of 1306–1307 the Catalan Company held Thrace, and the Bulgarian tsar Svetoslav took Anchialos and Mesembria and cut off the grain bound for the capital. The Genoese of Pera stored Black Sea wheat and sold it in the city at high prices. Patriarch Athanasios blamed the Genoese and urged the emperor to take the grain trade back into his own hands. Now bread is dear in the capital again, and the queues at the bakers' doors grow longer."
 oe_fin.2.desc.bank: "In the winter of 1306–1307 the Catalan Company held Thrace, and the Bulgarian tsar Svetoslav took Anchialos and Mesembria and cut off the grain bound for the capital. The Genoese of Pera stored Black Sea wheat and sold it in the city at high prices. Patriarch Athanasios blamed the Genoese and urged the emperor to take the grain trade back into his own hands. Now bread is dear in the capital again, and the queues at the bakers' doors grow longer. The empire's Black Sea bank has ships and granaries in the Crimea."
 oe_fin.2.a: "Buy grain from the treasury"
 oe_fin.2.b: "Do as Athanasios urged: fix the price and search the granaries"
 oe_fin.2.c: "Let the price find its own level"
 oe_fin.2.d: "Let the Black Sea bank charter the grain ships"
 oe_fin.2.d.tt: "The Black Sea bank's treasury −200"
 oe_fin.3.t: "Money for the Churches"
 oe_fin.3.desc: "In 1346 part of the dome of Hagia Sophia fell in. Grand Prince Simeon of Moscow sent money for the repairs, and Kantakouzenos used it to pay his Turkish allies. Now the war is going hard and the treasury is empty. The Patriarch holds the money given for church repairs, and the great church's treasury holds the gold and silver plate that emperors have offered over the centuries."
 oe_fin.3.a: "Take the money and the plate"
 oe_fin.3.b: "Borrow from the Patriarch"
 oe_fin.3.c: "The Church's money is the Church's"
 oe_fin.4.t: "The Italian Bankers' Terms"
 oe_fin.4.desc: "In the 1340s the Florentine banks of the Peruzzi and the Bardi failed one after the other; the money they had lent Edward III of England for his wars was among the debts they never recovered. Since then Italian bankers want security before they lend to a prince. Now agents of several Italian houses have come to court. They will lend the empire a large sum, and their terms are already written out on parchment."
 oe_fin.4.desc.bank: "In the 1340s the Florentine banks of the Peruzzi and the Bardi failed one after the other; the money they had lent Edward III of England for his wars was among the debts they never recovered. Since then Italian bankers want security before they lend to a prince. Now agents of several Italian houses have come to court. They will lend the empire a large sum, and their terms are already written out on parchment. The empire's own chartered bank says it can lend to the treasury as well, and without interest."
 oe_fin.4.a: "Pledge the customs"
 oe_fin.4.b: "Borrow for the campaign"
 oe_fin.4.b.tt: "Current campaign progress +5, pressure −5"
 oe_fin.4.c: "Borrow from our own chartered bank"
 oe_fin.4.c.tt: "The richest of the empire's chartered banks lends half its treasury, at most 12 months of tax and trade income, without interest; its treasury pays the same sum\nImperial Authority +2"
 oe_fin.4.d: "Borrow nothing"
 oe_fin.5.t: "The Tax Farmers' Advance"
 oe_fin.5.desc: "The empire's taxes have long been gathered by the praktores. They bid at auction for the right to farm a province's revenue, pay the agreed sum, and keep whatever more they collect. After the middle of the eleventh century tax farming became ever more common. Now the tax farmers, led by those of [SCOPE.sCountry('oe_fin_theme').GetName], have petitioned together: extend their farms to ten years, and they will pay a large sum in advance."
 oe_fin.5.desc.tm: "The empire's taxes have long been gathered by the praktores. They bid at auction for the right to farm a province's revenue, pay the agreed sum, and keep whatever more they collect. After the middle of the eleventh century tax farming became ever more common. Now the tax farmers, led by those of [SCOPE.sCountry('oe_fin_theme').GetName], have petitioned together: extend their farms to ten years, and they will pay a large sum in advance. The Grand Tax Comptroller, [SCOPE.sCharacter('oe_fin_taxmaster').GetName], argues instead for salaried collectors."
 oe_fin.5.a: "Take the advance"
 oe_fin.5.a.tt: "Every tax-farmed theme: loyalty +5, also added to its loyalty target for 5 years"
 oe_fin.5.b: "End the farms and send salaried collectors"
 oe_fin.5.b.tt: "Every tax-farmed theme gets a salaried collector sent from the capital, paid monthly by the treasury; it cannot be changed for 2 years\nThose themes: loyalty −5, also added to their loyalty target for 5 years\nImperial Authority +3"
 oe_fin.5.c: "Leave things as they are"
 oe_fin.6.t: "The Collector's Purse"
 oe_fin.6.desc: "In 1329 Andronikos III set up the court of the four Universal Judges as the empire's highest court. In 1336–1337 three of the four judges were convicted of taking bribes. Salaried officials can reach into the till as well. Now the auditors have found that the collector sent to [SCOPE.sCountry('oe_fin_theme').GetName] has entered part of the taxes as 'arrears' and kept the money himself."
 oe_fin.6.a: "Try him in public"
 oe_fin.6.a.tt: "[SCOPE.sCountry('oe_fin_theme').GetName] finance efficiency +15 (5 years)\n[SCOPE.sCountry('oe_fin_theme').GetName] loyalty −5, also added to its loyalty target for 5 years\nImperial Authority +2"
 oe_fin.6.b: "Recover the money and replace him quietly"
 oe_fin.6.b.tt: "[SCOPE.sCountry('oe_fin_theme').GetName] finance efficiency +5 (5 years)"
 oe_fin.6.c: "Raise the collectors' pay"
 oe_fin.7.t: "The Tenth Part"
 oe_fin.7.desc: "The kommerkion takes a tenth of the value of the goods. From 1082 Venetian merchants paid none of it in the empire, and the treaty of 1268 confirmed it; the Treaty of Nymphaeum in 1261 gave the Genoese customs privileges too. The empire's own merchants still pay in full. Now the harbour officials report that more and more Greek merchants are entering their goods under the names of Latin partners."
 oe_fin.7.a: "Hunt down the false names"
 oe_fin.7.a.tt: "Venice's and Genoa's opinion of us −20 (fades by 2 a year)"
 oe_fin.7.b: "Lower the duty for our own merchants"
 oe_fin.7.c: "Look the other way"
 oe_fin.7.c.tt: "Imperial Authority −1"
 oe_fin.8.t: "San Giorgio's Proposal"
 oe_fin.8.desc: "In April 1407 Genoa gathered the debts of its wars into one and handed them to the newly founded Bank of Saint George. In 1453 the Republic gave Corsica and its Crimean colonies to the bank's officers to govern. Now the empire's San Giorgio bank in Genoa proposes the same: let it manage the empire's old debts as one, in return for a few fixed revenues."
 oe_fin.8.a: "Let San Giorgio consolidate the old debts"
 oe_fin.8.a.tt: "The San Giorgio bank's treasury +300"
 oe_fin.8.b: "Make the bank pay into the treasury first"
 oe_fin.8.b.tt: "The San Giorgio bank hands over half its treasury, at most 6 months of tax and trade income"
 oe_fin.8.c: "No need"
 oe_fin.9.t: "A Run on the Bank"
 oe_fin.9.desc: "Early in 1499 the Garzoni bank of Venice could not pay its depositors, and a crowd filled the Rialto; a few months later the Lippomano bank failed too. By 1500 three of the city's four great banks had fallen. Now a queue has formed outside the empire's Venetian Public bank, and every depositor wants his money back."
 oe_fin.9.a: "The treasury stands behind the deposits"
 oe_fin.9.a.tt: "The Venetian Public bank's treasury receives the same sum"
 oe_fin.9.b: "Call on the great merchants to share the burden"
 oe_fin.9.b.tt: "60%: the run stops, stability +2.5\n40%: the bank still gives way, and the Venetian Public bank's treasury is halved"
 oe_fin.9.c: "Let it fall"
 oe_fin.9.c.tt: "The Venetian Public bank's treasury is halved"
 oe_fin.10.t: "The Sultan's Pepper"
 oe_fin.10.desc: "In the 1420s the Mamluk sultan Barsbay ordered that spices be sold to the Italian merchants only through his officials. The Karimi merchants, who had traded on their own account, became the sultan's buying agents. Now the empire's Nile bank proposes the same: let the bank take over the pepper trade of Alexandria."
 oe_fin.10.a: "A monopoly, as Barsbay had"
 oe_fin.10.a.tt: "The Nile bank's treasury +300"
 oe_fin.10.b: "The bank lends; the merchants trade"
 oe_fin.10.c: "Auction this year's pepper in one lot"
 oe_fin.11.t: "The Wheat and Barley Tax"
 oe_fin.11.desc: "In 1307, to meet the cost of the Catalan wars and the loss of Asia Minor, Andronikos II imposed an extraordinary tax in kind, the sitokrithon: every holding that a pair of oxen could plough owed six modioi of wheat and four of barley. Such measures raised the state's income to a million hyperpyra, and they were more than the small and middling taxpayer could bear. Now the war has dragged on too long, and the officers of supply propose the same thing again."
 oe_fin.11.a: "Levy the sitokrithon"
 oe_fin.11.b: "Levy it on the great estates only"
 oe_fin.11.c: "No new tax"
 oe_fin.12.t: "The Moneychangers' Guild"
 oe_fin.12.desc: "In the tenth century the Book of the Eparch organised the capital's bankers into a guild, like the bullion dealers, the silk merchants and the bakers, with prices and profits set by the Eparch. For centuries changing copper for gold and keeping merchants' accounts was their trade. Now the empire's chartered banks take more of that business every year, and the heads of the moneychangers' guild have come to court to ask that their old privileges be kept."
 oe_fin.12.a: "Keep their privileges"
 oe_fin.12.b: "Fold the guild into the banks"
 oe_fin.12.c: "Let them compete"
 oe_fin.12.c.tt: "The richest of the empire's chartered banks: treasury +200"
 oe_fin.13.t: "Basil's Vaults"
 oe_fin.13.desc: "Psellos records that Basil II amassed two hundred thousand talents; the old vaults could not hold it, and he had spiral galleries dug underground to store it. Now the empire's treasury is full once more, and everyone at court has an idea of what to do with the money."
 oe_fin.13.a: "Lighten the taxes for two years"
 oe_fin.13.b: "Build public works"
 oe_fin.13.c: "Into the vaults"
 oe_fin.13.c.tt: "Imperial Authority +3"
