 oe_v430_ref_rhomanismos_hellenic_court:0 "Hellenic Court & Rhomanismos"
 oe_v430_ref_rhomanismos_hellenic_court_desc:0 "Enshrines Greek as the language of the Sacred Palace, imperial chancery, and Eastern liturgy, anchoring Roman cultural continuity and ecclesiastical unity at the cost of higher foreign diplomatic outlays."
 oe_v430_ref_latin_liturgical_rite:0 "Roman-Latin Liturgical Concord"
 oe_v430_ref_latin_liturgical_rite_desc:0 "Harmonizes sacred liturgy and civic law with the Latin imperial tongue across Catholic, Hellenic, or Western-oriented Orthodox rites, bolstering legislative clarity and confessional concord while testing clerical and domestic stability."
