# v9.6 Module 3: Civilization Regencies, Educations & Heir Reasons (oe_reg_).
 oe_reg_byz_porphyrogenitus_regency: "Porphyrogenitus Empress Regency"
 oe_reg_byz_porphyrogenitus_regency_desc: "When the Roman Emperor passes while the purple-born heir is still a child, the Empress Dowager assumes the regency in the tradition of Irene and Theodora, upholding dynastic legitimacy against ambitious magnates."
 oe_reg_byz_senate_regency: "Byzantine Senate Regency"
 oe_reg_byz_senate_regency_desc: "When no Empress Dowager can take the reins, the Senate of Constantinople and the Megas Logothetes convene a regency council, sustaining imperial legislation and cabinet administration through the interlude."
 oe_reg_yuan_empress_dowager_regency: "Dual-Palace Empress Dowager Regency"
 oe_reg_yuan_empress_dowager_regency_desc: "Following the Great Yuan precedent of imperial consorts holding court behind the curtain, the Empress Dowager mediates between the Central Secretariat and steppe princes to keep subjects loyal."
 oe_reg_yuan_kurultai_regency: "Great Kurultai Regency"
 oe_reg_yuan_kurultai_regency_desc: "When the throne lacks an adult sovereign or Empress regent, the princes and tumen commanders gather in a Great Kurultai to appoint a martial kinsman as regent, bolstering cavalry prowess at the price of decentralization."
 oe_reg_rus_boyar_duma_regency: "Boyar Duma Regency Council"
 oe_reg_rus_boyar_duma_regency_desc: "While the Grand Prince or Tsar remains in minority, the hereditary magnates of the Boyar Duma govern in council, expanding aristocratic influence while fortifying the realm's defenses."
 oe_edu_byz_porphyrogenitus: "Porphyrogenitus Imperial Tutelage"
 oe_edu_byz_porphyrogenitus_desc: "Tutored within the Purple Chamber of Constantinople by jurists, rhetoricians, and seasoned diplomats, the pupil masters imperial administration and court statecraft while Christian heirs are gently guided into the state confession."
 oe_edu_byz_strategikon: "Strategikon Martial Tutelage"
 oe_edu_byz_strategikon_desc: "Grounded in the Strategikon of Maurice and the Taktika of Leo VI, veteran theme commanders drill the pupil in siegecraft, combined-arms maneuvers, and battlefield command."
 oe_edu_yuan_donggong: "Eastern Palace Classics Tutelage"
 oe_edu_yuan_donggong_desc: "In the lecture halls of the Eastern Palace, Confucian masters and senior Secretariat officials instruct the heir in classical history, fiscal governance, and multi-ethnic imperial statecraft."
 oe_edu_rus_tsarevich: "Kremlin Tsarevich Tutelage"
 oe_edu_rus_tsarevich_desc: "Guided jointly by senior Orthodox prelates and veteran Kremlin boyars, the young prince combines ecclesiastical devotion with chancery administration and frontier warfare."
 oe_edu_steppe_ordu: "Steppe Ordu Keshig Tutelage"
 oe_edu_steppe_ordu_desc: "Raised among the imperial Keshig in great seasonal hunts, the pupil masters steppe horsemanship, the martial code of the Great Yassa, and diplomacy among nomadic clans."
