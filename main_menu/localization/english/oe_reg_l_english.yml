 STATIC_MODIFIER_NAME_oe_reg_porphyrogenitus_coronation: "Porphyrogenitus Imperial Coronation"
 STATIC_MODIFIER_DESC_oe_reg_porphyrogenitus_coronation: "With the regency concluded in orderly ceremony, the young sovereign receives imperial coronation and reaffirms dynastic prestige across the realm."
 STATIC_MODIFIER_NAME_oe_reg_senate_stewardship_legacy: "Legacy of Senatorial Stewardship"
 STATIC_MODIFIER_DESC_oe_reg_senate_stewardship_legacy: "Having preserved the fiscal registers and legal order through the minority, the Senate hands a well-disciplined chancellery back to the crown."
 STATIC_MODIFIER_NAME_oe_reg_yuan_majority_accession: "Imperial Majority After Dual-Palace Regency"
 STATIC_MODIFIER_DESC_oe_reg_yuan_majority_accession: "The Empress Dowager withdraws behind the ceremonial curtain as the young sovereign assumes personal rule with the loyalty of provinces and courts."
 STATIC_MODIFIER_NAME_oe_reg_purple_chamber_mandate: "Mandate of the Purple Chamber"
 STATIC_MODIFIER_DESC_oe_reg_purple_chamber_mandate: "Ruling in the name of the purple-born heir, the Empress Dowager anchors dynastic legitimacy and steadies the palace administration."
 STATIC_MODIFIER_NAME_oe_reg_senate_chancellery_order: "Senatorial Chancellery Order"
 STATIC_MODIFIER_DESC_oe_reg_senate_chancellery_order: "The Senate and Megas Logothetes govern by formal register and decree, keeping imperial revenues and provincial commands running smoothly."
 STATIC_MODIFIER_NAME_oe_reg_dual_palace_accord: "Dual-Palace Secretariat Accord"
 STATIC_MODIFIER_DESC_oe_reg_dual_palace_accord: "An accord between the Empress Dowager and the Central Secretariat balances court factions while reassuring princely appanages."
 STATIC_MODIFIER_NAME_oe_reg_kurultai_banner_oath: "Kurultai Banner Oath"
 STATIC_MODIFIER_DESC_oe_reg_kurultai_banner_oath: "Before the nine-tailed standard, the assembled princes swear to keep the cavalry tumens mobilized and disciplined throughout the regency."
 STATIC_MODIFIER_NAME_oe_reg_boyar_council_compact: "Boyar Duma Compact of Stewardship"
 STATIC_MODIFIER_DESC_oe_reg_boyar_council_compact: "The great boyar lineages pledge truce over private precedence disputes, pooling their retainers to guard the Kremlin and frontier lines."
 STATIC_MODIFIER_NAME_oe_reg_kurultai_acclamation: "White-Felt Kurultai Acclamation"
 STATIC_MODIFIER_DESC_oe_reg_kurultai_acclamation: "Raised upon the white felt by the princes and commanders of the Kurultai, the new ruler begins the reign with formidable acclaim."
 STATIC_MODIFIER_NAME_oe_reg_autocratic_majority: "Autocratic Majority Decree"
 STATIC_MODIFIER_DESC_oe_reg_autocratic_majority: "Coming of age, the ruler reclaims crown prerogatives ceded during the minority, strengthening central chancelleries over boyar clans."
 STATIC_MODIFIER_NAME_oe_reg_duma_reconciliation: "Boyar Duma Reconciliation"
 STATIC_MODIFIER_DESC_oe_reg_duma_reconciliation: "Pardoning the outgoing regency council, the sovereign confirms boyar service ranks in exchange for domestic calm and frontier solidarity."
 oe_reg.1.t: "Regency of the Purple Chamber"
 oe_reg.1.d: "With the late sovereign laid to rest and the young heir still in minority, the Empress Dowager takes custody of the imperial seal in accordance with Roman palace custom. Magnates and provincial commanders alike watch closely to see whether the Purple Chamber will rule by firm prerogative or careful conciliation."
 oe_reg.1.a: "Issue the Mandate of the Purple Chamber"
 oe_reg.1.a.tt: "Assert imperial prerogative over court factions, gaining Legitimacy and the 5-year #Y Mandate of the Purple Chamber#! modifier."
 oe_reg.1.b: "Conciliate the Palatine Magnates"
 oe_reg.1.b.tt: "Secure a quiet minority by extending court honors, raising Nobles satisfaction and national Stability."
 oe_reg.2.t: "The Byzantine Senate Convenes in Regency"
 oe_reg.2.d: "With no Empress Dowager available to assume the regency, the Senate of Constantinople invokes ancient Roman constitutional custom and entrusts the stewardship of the state to the Megas Logothetes. Scribes and fiscal officers assemble in the palace consistory to keep the empire steady."
 oe_reg.2.a: "Empower the Chancellery and Megas Logothetes"
 oe_reg.2.a.tt: "Rely on the standing bureaucracy to hold the realm steady, gaining Stability and the 5-year #Y Senatorial Chancellery Order#! modifier."
 oe_reg.2.b: "Bind the Senate by Oath to the Throne"
 oe_reg.2.b.tt: "Proclaim the Senate's formal oath of fealty before Hagia Sophia, increasing Legitimacy and Prestige."
 oe_reg.3.t: "Empress Dowager Regency of the Dual Palaces"
 oe_reg.3.d: "Upon the sovereign's passing, the Empress Dowager takes her seat behind the ceremonial curtain according to Great Yuan custom, summoning the Central Secretariat and Privy Council. From the southern grain canals to the northern summer pastures, provinces and princely appanages await the court's first decrees."
 oe_reg.3.a: "Govern in Accord with the Central Secretariat"
 oe_reg.3.a.tt: "Establish clear cooperation between the Empress Dowager and the Secretariat, gaining Legitimacy and the 5-year #Y Dual-Palace Secretariat Accord#! modifier."
 oe_reg.3.b: "Bestow Silks Upon the Steppe Princes"
 oe_reg.3.b.tt: "Follow steppe custom with generous princely gifts, improving Nobles satisfaction and Prestige."
 oe_reg.4.t: "The Great Kurultai Appoints a Regent"
 oe_reg.4.d: "Beneath the nine-tailed white standard, princes, royal sons-in-law, and tumen commanders convene a Great Kurultai. After tense deliberation, a battle-tested kinsman is acclaimed regent to safeguard the Ulus until a new sovereign can rule in full majesty."
 oe_reg.4.a: "Rally the Wings Under the Great Yassa"
 oe_reg.4.a.tt: "Unite the steppe wings through martial discipline, gaining Army Tradition and the 5-year #Y Kurultai Banner Oath#! modifier."
 oe_reg.4.b: "Confirm Princely Appanages Across the Ulus"
 oe_reg.4.b.tt: "Secure internal peace by confirming traditional princely shares, raising Nobles satisfaction and Stability."
 oe_reg.5.t: "The Boyar Duma Assumes Regency"
 oe_reg.5.d: "With the young sovereign not yet of age, the great lineages inside the Kremlin form a Boyar Duma Regency Council. Setting aside open feud to deter foreign rivals, the senior boyars take joint charge of decrees, frontier garrisons, and the realm's courts."
 oe_reg.5.a: "Confirm the Boyar Duma's Stewardship Charter"
 oe_reg.5.a.tt: "Recognize the Duma's collective stewardship during the minority, gaining Nobles satisfaction and the 5-year #Y Boyar Duma Compact of Stewardship#! modifier."
 oe_reg.5.b: "Lean on the Metropolitan and Chancery Clerks"
 oe_reg.5.b.tt: "Preserve royal autonomy through ecclesiastical and chancery support, gaining Stability and Legitimacy."
 oe_reg.6.t: "The Kurultai Acclaims the Sovereign"
 oe_reg.6.d: "The Kurultai regency draws to a close as princes and commanders lift the sovereign upon the white felt in solemn acclamation. Across steppe and settled lands alike, the realm waits to see whether the new ruler will assert supreme majesty or reward the loyal magnates first."
 oe_reg.6.a: "Raise the White Standard of Sovereign Majesty"
 oe_reg.6.a.tt: "Assert full sovereign majesty over the Ulus, gaining Legitimacy or Horde Unity and the 5-year #Y White-Felt Kurultai Acclamation#! modifier."
 oe_reg.6.b: "Reward the Loyal Princes of the Kurultai"
 oe_reg.6.b.tt: "Thank the outgoing princes with lavish banquet gifts, raising Nobles satisfaction and Prestige."
 oe_reg.7.t: "Majority of the Sovereign in the Kremlin"
 oe_reg.7.d: "The Boyar Duma's regency comes to an end as the ruler attains majority and steps forward in the Cathedral of the Dormition. During the minority, the boyar houses expanded both estates and influence; now the sovereign must decide whether to reclaim crown authority firmly or reconcile with the council."
 oe_reg.7.a: "Reclaim Crown Prerogatives from the Boyars"
 oe_reg.7.a.tt: "Reassert royal supremacy over the council, gaining Legitimacy and the 5-year #Y Autocratic Majority Decree#! modifier at the cost of some Nobles satisfaction."
 oe_reg.7.b: "Pardon the Duma and Confirm Service Harmony"
 oe_reg.7.b.tt: "Close the regency in concord, gaining Stability, Nobles satisfaction, and the 5-year #Y Boyar Duma Reconciliation#! modifier."
 oe_reg.10.title: "Imperial Charter of Heir Designation"
 oe_reg.10.desc: "Having weathered the trials of a regency, the court of [ROOT.GetCountry.GetName] recognizes that a clear succession is the surest bulwark against faction and civil strife. Ministers and prelates gather before the throne to record an imperial charter designating the next heir according to ancestral custom."
 oe_reg.10.a: "Crown [oe_reg_candidate.GetNameWithNoTooltip] as Porphyrogenitus Co-Emperor"
 oe_reg.10.a.tt: "Designate [oe_reg_candidate.GetNameWithNoTooltip] as heir under the #Y Porphyrogenitus Co-Emperor#! title and gain Legitimacy."
 oe_reg.10.b: "Invest [oe_reg_candidate.GetNameWithNoTooltip] as Despot of the Morea Heir"
 oe_reg.10.b.tt: "Designate [oe_reg_candidate.GetNameWithNoTooltip] as heir with the title #Y Despot of the Morea#! and gain Prestige."
 oe_reg.10.c: "Adopt [oe_reg_caesar_candidate.GetNameWithNoTooltip] as Imperial Caesar"
 oe_reg.10.c.tt: "Invoke classical Roman adoptive succession to name [oe_reg_caesar_candidate.GetNameWithNoTooltip] #Y Adopted Imperial Caesar#! and gain Stability."
 oe_reg.10.d: "Invest [oe_reg_candidate.GetNameWithNoTooltip] as Crown Prince & Secretariat Director"
 oe_reg.10.d.tt: "Designate [oe_reg_candidate.GetNameWithNoTooltip] as #Y Crown Prince & Director of the Central Secretariat#! and gain Legitimacy."
 oe_reg.10.e: "Acclaim [oe_reg_candidate.GetNameWithNoTooltip] Through the Great Kurultai"
 oe_reg.10.e.tt: "Designate [oe_reg_candidate.GetNameWithNoTooltip] as #Y Elected by the Great Kurultai#! and gain Army Tradition."
 oe_reg.10.f: "Name [oe_reg_candidate.GetNameWithNoTooltip] in the Grand Prince's Testament"
 oe_reg.10.f.tt: "Designate [oe_reg_candidate.GetNameWithNoTooltip] as #Y Named in the Grand Prince's Testament#! and gain Legitimacy."
 oe_reg.10.g: "Preserve the Existing Order of Succession"
 oe_reg.10.g.tt: "Leave the current succession unchanged, reassuring the court and gaining Stability."
