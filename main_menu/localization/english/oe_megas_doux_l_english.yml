l_english:
 oe_byz_megas_doux: "Megas Doux"
 oe_byz_megas_doux_desc: "The fleet must no longer depend on foreign shipyards or the promises of merchants. Under the Megas Doux, shipbuilding, naval pay and operations are brought under a single command, returning the straits and seas to the imperial standard.\n\nUnlocked by completing the imperial reform Expel the Foreigners."
