l_english:
 oe_m5_yes: " #G met#!"
 oe_m5_no: " #R not met#!"
 oe_m5_authority_tt: "$oe_pillars_authority_desc$\n\n#T Good government#!\nSettled in the first month of every quarter: each merit that holds gives #G +0.15#! Imperial Authority.\nLoyal themes: the themes' average loyalty is [GetCountry('BYZ').MakeScope.ScriptValue('oe_m5_theme_avg')|0]; it must be at least #Y 50#!.[GetCountry('BYZ').Custom('OeM5Themes')]\nA full treasury: a positive monthly balance and no debt for [GetCountry('BYZ').MakeScope.ScriptValue('oe_m5_surplus')|0] months in a row; #Y 12#! are needed.[GetCountry('BYZ').Custom('OeM5Treasury')]\nA full court: [GetCountry('BYZ').MakeScope.ScriptValue('oe_m5_court_n')|0] of the seven court offices are filled; at least #Y 6#! are needed.[GetCountry('BYZ').Custom('OeM5Court')]\nA willing senate: the last vote passed (a bill forced through does not count), no more than #Y 5#! years ago.[GetCountry('BYZ').Custom('OeM5Senate')]\nMerits at the last settlement: [GetCountry('BYZ').MakeScope.ScriptValue('oe_m5_last_n')|0]."
