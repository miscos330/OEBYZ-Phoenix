l_english:
 oe_zaporozhian_cossack: "Zaporozhian Cossack"
 oe_yaik_cossack: "Yaik Cossack"
 oe_terek_cossack: "Terek Cossack"
 oe_rp2_b_sophia_alliance: "Double-Headed Eagle Imperial Marriage"
 oe_rp2_b_sophia_refuge: "Refuge of the Purple"
 oe_rp2_b_cossack_compact: "Frontier Cossack Compact"
 STATIC_MODIFIER_NAME_oe_rp2_sophia_grand_alliance: "Double-Headed Eagle Grand Alliance"
 STATIC_MODIFIER_DESC_oe_rp2_sophia_grand_alliance: "An imperial marriage with a living Constantinople unites both courts in Orthodox diplomacy and courtly splendor."
 STATIC_MODIFIER_NAME_oe_rp2_sophia_sovereign_trade: "Black Sea-Northern Sovereign Compact"
 STATIC_MODIFIER_DESC_oe_rp2_sophia_sovereign_trade: "Honoring the imperial bride while preserving northern parity opens profitable fur and silk traffic to the Bosphorus."
 STATIC_MODIFIER_NAME_oe_rp2_sophia_purple_refuge: "Refuge of the Purple and Greek Scholars"
 STATIC_MODIFIER_DESC_oe_rp2_sophia_purple_refuge: "Sheltering exiled Palaiologan courtiers and Greek scholars enriches the northern court in ceremony and learning."
 STATIC_MODIFIER_NAME_oe_rp2_sophia_regalia_claim: "Dowry of the Imperial Regalia"
 STATIC_MODIFIER_DESC_oe_rp2_sophia_regalia_claim: "Receiving the exiled court's regalia and ceremonial charters anchors northern claims to imperial sovereignty."
 STATIC_MODIFIER_NAME_oe_rp2_sophia_palaiologos_mantle: "Mantle of the Palaiologoi & Kremlin Works"
 STATIC_MODIFIER_DESC_oe_rp2_sophia_palaiologos_mantle: "Italian architects and Greek manuscripts arriving with Zoe-Sophia rebuild the Kremlin beneath the Double-Headed Eagle."
 STATIC_MODIFIER_NAME_oe_rp2_sophia_rus_custom: "Native Rus' Custom with Exiled Scholars"
 STATIC_MODIFIER_DESC_oe_rp2_sophia_rus_custom: "Exiled craftsmen enrich the realm without upsetting native boyar custom or princely law."
 STATIC_MODIFIER_NAME_oe_rp2_p1_sudebnik_1497: "Sudebnik of 1497 and the Prikazy"
 STATIC_MODIFIER_DESC_oe_rp2_p1_sudebnik_1497: "A unified realm-wide law code and central chancelleries bind distant provinces firmly to the crown."
 STATIC_MODIFIER_NAME_oe_rp2_p1_boyar_duma_law: "Sudebnik with Boyar Duma Assent"
 STATIC_MODIFIER_DESC_oe_rp2_p1_boyar_duma_law: "Promulgating the code with Boyar Duma consent tempers centralization with lasting noble stability."
 STATIC_MODIFIER_NAME_oe_rp2_p1_tsar_sobor: "Tsar of All Rus' and the Zemsky Sobor"
 STATIC_MODIFIER_DESC_oe_rp2_p1_tsar_sobor: "Crowned Tsar with Monomakh's Cap, the sovereign convenes the Zemsky Sobor to unite estates behind imperial reform."
 STATIC_MODIFIER_NAME_oe_rp2_p1_tsar_streltsy: "Iron Crown of the Tsar and the Streltsy"
 STATIC_MODIFIER_DESC_oe_rp2_p1_tsar_streltsy: "Standing matchlock Streltsy regiments back the Tsar's unchallenged command on battlefield and siege line."
 STATIC_MODIFIER_NAME_oe_rp2_p1_oprichnina: "The Oprichnina Crown Domain"
 STATIC_MODIFIER_DESC_oe_rp2_p1_oprichnina: "A direct crown domain and black-clad guards crush princely autonomy at a harsh cost to noble trust."
 STATIC_MODIFIER_NAME_oe_rp2_p1_zemshchina_sobor: "Expanded Zemsky Sobor Governance"
 STATIC_MODIFIER_DESC_oe_rp2_p1_zemshchina_sobor: "Rejecting terror, the throne rules through an expanded Zemsky Sobor balancing crown, clergy, and service gentry."
 STATIC_MODIFIER_NAME_oe_rp2_p2_northern_diet: "Great Northern Diet & Hansa-Baltic Charter"
 STATIC_MODIFIER_DESC_oe_rp2_p2_northern_diet: "A Great Northern Mercantile Diet breaks Hanseatic monopolies and commands the Baltic-White Sea fur corridors."
 STATIC_MODIFIER_NAME_oe_rp2_p2_pomor_syndicate: "Pomor Arctic & Ural Fur Syndicates"
 STATIC_MODIFIER_DESC_oe_rp2_p2_pomor_syndicate: "Chartered Pomor fur syndicates push across the northern rivers and Urals, filling republican coffers."
 STATIC_MODIFIER_NAME_oe_rp2_p3_federal_hetmanate: "Federal Zemsky Sobor & Hetmanate Autonomy"
 STATIC_MODIFIER_DESC_oe_rp2_p3_federal_hetmanate: "Recognizing the Cossack Hetmanate as a self-governing federal pillar secures fierce steppe cavalry and willing loyalty."
 STATIC_MODIFIER_NAME_oe_rp2_p3_bicameral_sobor: "Bicameral East Slavic Federal Diet"
 STATIC_MODIFIER_DESC_oe_rp2_p3_bicameral_sobor: "Princely and civic chambers share war and fiscal authority across a broad East Slavic federation."
 STATIC_MODIFIER_NAME_oe_rp2_abatis_line: "The Steppe Abatis Line (Zasechnaya Cherta)"
 STATIC_MODIFIER_DESC_oe_rp2_abatis_line: "Felled timber barriers, watchtowers, and fortified towns shield the forest-steppe heartland from steppe raids."
 STATIC_MODIFIER_NAME_oe_rp2_volga_vanguard: "Volga River Frontier Vanguard"
 STATIC_MODIFIER_DESC_oe_rp2_volga_vanguard: "River flotillas and mobile regiments drive down the Volga toward Kazan, Astrakhan, and the Urals."
 STATIC_MODIFIER_NAME_oe_rp2_cossack_free_charter: "Free Charter of the Six Cossack Hosts"
 STATIC_MODIFIER_DESC_oe_rp2_cossack_free_charter: "Broad frontier liberties across the six Cossack hosts trade central crown grip for cheap, ferocious border cavalry."
 STATIC_MODIFIER_NAME_oe_rp2_cossack_crown_hosts: "Crown Voivode Cossack Regiments"
 STATIC_MODIFIER_DESC_oe_rp2_cossack_crown_hosts: "Salaried Cossack regiments under royal voivodes cost more gold but keep firm crown order on every march."
 STATIC_MODIFIER_NAME_oe_rp2_yermak_siberia: "Yermak's Push Across the Stone Belt"
 STATIC_MODIFIER_DESC_oe_rp2_yermak_siberia: "Backed by Stroganov silver, Cossack musketeers cross the Urals toward Chimgi-Tura, opening the Siberian frontier."
 STATIC_MODIFIER_NAME_oe_rp2_stroganov_patents: "Stroganov Ural Salt & Fur Patents"
 STATIC_MODIFIER_DESC_oe_rp2_stroganov_patents: "Frontier tax patents empower Stroganov forts and salt-works across the Kama and Urals to finance eastern growth."
 STATIC_MODIFIER_NAME_oe_rp2_smuta_compact: "Sobor Succession Compact: Guardrail Against Smuta"
 STATIC_MODIFIER_DESC_oe_rp2_smuta_compact: "Sworn estate oaths and standing Sobor procedures steer the realm safely past late-sixteenth-century succession turmoil."
 STATIC_MODIFIER_NAME_oe_rp2_smuta_iron_regency: "Iron Regency Through the Troubles"
 STATIC_MODIFIER_DESC_oe_rp2_smuta_iron_regency: "Stern regency tribunals crush pretenders and factional plots, holding the realm intact through perilous years."
 STATIC_MODIFIER_NAME_oe_rp2_cossack_stanitsa: "Cossack Frontier Stanitsa"
 STATIC_MODIFIER_DESC_oe_rp2_cossack_stanitsa: "An armed Cossack settlement guards the river crossings and steppe trails with sturdy levies."
 STATIC_MODIFIER_NAME_oe_rp2_abatis_line_loc: "Zasechnaya Cherta Fortified Line"
 STATIC_MODIFIER_DESC_oe_rp2_abatis_line_loc: "Interlocking timber barricades, earthworks, and watchtowers blunt raids from the southern steppe."
 oe_rp2_dec_charter_cossack_host.title: "Charter a Frontier Cossack Host"
 oe_rp2_dec_charter_cossack_host.desc: "Charter frontier Cossack stanitsas in sequence across Zaporizhia, the Don, Yaik, Terek, Siberia, and Kuban, balancing frontier autonomy against crown oversight."
 oe_rp2_dec_charter_cossack_host.a: "Grant Free Host Autonomy (strong cavalry & levies, slight crown trade-off)"
 oe_rp2_dec_charter_cossack_host.b: "Fund a Crown Voivode Host (treasury cost for firm control)"
 oe_rp2_dec_zasechnaya_cherta.title: "Construct the Steppe Abatis Line (Zasechnaya Cherta)"
 oe_rp2_dec_zasechnaya_cherta.desc: "Build interlocking timber barricades, watchtowers, and fortified towns across the forest-steppe frontier from Tula to Voronezh and Belgorod."
 oe_rp2_dec_zasechnaya_cherta.a: "Fund the timber barricades and frontier forts"
 oe_rp2_dec_stroganov_charter.title: "Grant the Stroganov Ural-Siberian Charter"
 oe_rp2_dec_stroganov_charter.desc: "Grant frontier tax and fort patents to the Stroganov magnates along the Kama and Urals, funding the push toward Siberia."
 oe_rp2_dec_stroganov_charter.a: "Seal the Stroganov patents and plant a Yaik outpost"
 oe_rp2_dec_sobor_guardrail.title: "Convene the Succession Zemsky Sobor"
 oe_rp2_dec_sobor_guardrail.desc: "Summon estates and clergy ahead of dynastic crisis to ratify a sworn succession compact and ward off a Time of Troubles."
 oe_rp2_dec_sobor_guardrail.a: "Ratify the sworn succession compact"
 oe_rp2.1.t: "Sophia Palaiologina: The Double-Headed Eagle Pact"
 oe_rp2.1.d: "The imperial purple still flies above Constantinople's walls. Envoys from the Roman Emperor arrive bearing an offer of marriage with Princess Zoe-Sophia Palaiologina, binding a living New Rome to the newly liberated Orthodox power of the north.\n\nBoyars and bishops debate whether to seal a grand Double-Headed Eagle alliance or wed the princess under a compact of sovereign equality and Black Sea commerce."
 oe_rp2.1.a: "Seal the Double-Headed Eagle Grand Alliance and welcome imperial ceremony"
 oe_rp2.1.a.tt: "Record Sophia's marriage as #bold #color_yellow Living Constantinople#!#!, Prestige #G +15#!, improve opinion with Byzantium/Rome; gain [ShowModifier('oe_rp2_sophia_grand_alliance')] for #Y 25 years#!."
 oe_rp2.1.b: "Wed the princess under sovereign equality and a Black Sea trade compact"
 oe_rp2.1.b.tt: "Record Sophia's marriage as #bold #color_yellow Living Constantinople#!#!, Legitimacy #G +10#!, improve opinion with Byzantium/Rome; gain [ShowModifier('oe_rp2_sophia_sovereign_trade')] for #Y 25 years#!."
 oe_rp2.2.t: "Sophia Palaiologina: Refuge of the Purple"
 oe_rp2.2.d: "Though Constantinople has been lost, the Palaiologan court still endures in exile. Its envoys journey north to offer Princess Zoe-Sophia's hand in marriage, seeking shelter for exiled kinsmen, Greek scholars, and rescued manuscripts.\n\nOur court may open its gates as the Refuge of the Purple, or claim the dowry of imperial regalia to elevate our northern crown."
 oe_rp2.2.a: "Open our court as the Refuge of the Purple and patronize Greek scholars"
 oe_rp2.2.a.tt: "Record Sophia's marriage as #bold #color_yellow Exiled Court#!#!, Prestige #G +12#!, improve opinion with exiled Byzantium/Rome; gain [ShowModifier('oe_rp2_sophia_purple_refuge')] for #Y 25 years#!."
 oe_rp2.2.b: "Accept the dowry of imperial regalia and anchor northern imperial legitimacy"
 oe_rp2.2.b.tt: "Record Sophia's marriage as #bold #color_yellow Exiled Court#!#!, Legitimacy #G +15#!, improve opinion with exiled Byzantium/Rome; gain [ShowModifier('oe_rp2_sophia_regalia_claim')] for #Y 25 years#!."
 oe_rp2.3.t: "Sophia Palaiologina: Mantle of the Palaiologoi"
 oe_rp2.3.d: "The Queen of Cities has fallen and the eastern Roman empire is no more. Zoe-Sophia Palaiologina, niece of the last emperor, arrives in our capital accompanied by Byzantine courtiers, ancient manuscripts, and Italian master builders versed in brick ramparts and grand cathedrals.\n\nShall we raise the Double-Headed Eagle and rebuild our Kremlin in imperial splendor, or welcome the exiles while guarding native Rus' custom?"
 oe_rp2.3.a: "Raise the Double-Headed Eagle and rebuild the Kremlin with imperial masters"
 oe_rp2.3.a.tt: "Record Sophia's marriage as #bold #color_yellow Fallen Constantinople#!#!, Prestige #G +20#!, Legitimacy #G +10#!; gain [ShowModifier('oe_rp2_sophia_palaiologos_mantle')] for #Y 25 years#!."
 oe_rp2.3.b: "Welcome the exiled scholars while preserving native Rus' princely custom"
 oe_rp2.3.b.tt: "Record Sophia's marriage as #bold #color_yellow Fallen Constantinople#!#!, Stability #G +8#!; gain [ShowModifier('oe_rp2_sophia_rus_custom')] for #Y 25 years#!."
 oe_rp2.4.t: "The Sudebnik of 1497 and the Prikazy"
 oe_rp2.4.d: "As gathered principalities merge under one crown, conflicting local courts and tax rolls hamper governance. Crown jurists present a unified realm-wide law code—the Sudebnik—paired with specialized central chancelleries (Prikazy) to oversee justice, war, and revenue.\n\nThe autocratic path now steps from princely domain into a centralized state."
 oe_rp2.4.a: "Promulgate the unified Sudebnik and establish central Prikazy"
 oe_rp2.4.a.tt: "Advance Phase 2 Reform to Stage #Y 1#!; gain [ShowModifier('oe_rp2_p1_sudebnik_1497')] for #Y 25 years#!."
 oe_rp2.4.b: "Issue the code with Boyar Duma assent to ease noble friction"
 oe_rp2.4.b.tt: "Advance Phase 2 Reform to Stage #Y 1#!, Stability #G +5#!; gain [ShowModifier('oe_rp2_p1_boyar_duma_law')] for #Y 25 years#!."
 oe_rp2.5.t: "Coronation in the Dormition Cathedral: Tsar of All Rus'"
 oe_rp2.5.d: "Great bells peal across the Kremlin square. In the Dormition Cathedral, the Metropolitan places Monomakh's Cap upon the sovereign's brow, anointing not merely a Grand Prince, but the Tsar and Autocrat of All Rus'.\n\nThe newly crowned Tsar may summon a Zemsky Sobor of the estates to broaden reform, or forge standing matchlock Streltsy regiments to enforce royal command."
 oe_rp2.5.a: "Crown the Tsar and convene the Zemsky Sobor to unite the realm"
 oe_rp2.5.a.tt: "Establish the #bold #color_yellow Tsar of All Rus#!#! title, Prestige #G +20#!, Legitimacy #G +15#!; gain [ShowModifier('oe_rp2_p1_tsar_sobor')] for #Y 25 years#!."
 oe_rp2.5.b: "Take the Iron Crown and muster standing Streltsy musketeers"
 oe_rp2.5.b.tt: "Establish the #bold #color_yellow Tsar of All Rus#!#! title, Army Tradition #G +10#!; gain [ShowModifier('oe_rp2_p1_tsar_streltsy')] for #Y 25 years#!."
 oe_rp2.6.t: "Oprichnina or the Great Sobor (1565)"
 oe_rp2.6.d: "Years of border war have bred suspicion between throne and hereditary boyars. Furious at whispers of treason, the Tsar contemplates splitting the realm to carve out the Oprichnina—a direct crown domain policed by black-clad guards sworn to sweep old noble power away.\n\nYet sober councilors warn that terror may hollow out the state, urging instead a broad Zemsky Sobor settlement."
 oe_rp2.6.a: "Reject terror and rule through an expanded Zemsky Sobor"
 oe_rp2.6.a.tt: "Advance Phase 2 Reform to Stage #Y 3#!, Stability #G +8#!; gain [ShowModifier('oe_rp2_p1_zemshchina_sobor')] for #Y 25 years#!."
 oe_rp2.6.b: "Proclaim the Oprichnina and crush hereditary boyar power"
 oe_rp2.6.b.tt: "Advance Phase 2 Reform to Stage #Y 3#!, Stability #R −8#!; gain [ShowModifier('oe_rp2_p1_oprichnina')] for #Y 20 years#!."
 oe_rp2.7.t: "Great Northern Mercantile Diet & Hansa-Baltic Charter"
 oe_rp2.7.d: "The Veche bell rings louder than ever across the sixteenth-century north. Free from autocratic conquest, our commercial republic commands the routes from the Neva to the White Sea. Guildmasters convene a Great Northern Mercantile Diet to rewrite the Baltic charter with the Hansa on equal footing—or charter Pomor fur syndicates bound for the Urals."
 oe_rp2.7.a: "Enact the Hansa-Baltic Charter and anchor our maritime league"
 oe_rp2.7.a.tt: "Advance Republic Phase 2 Reform to Stage #Y 2#!, Prestige #G +15#!; gain [ShowModifier('oe_rp2_p2_northern_diet')] for #Y 25 years#!."
 oe_rp2.7.b: "Charter Pomor fur syndicates across the White Sea and Urals"
 oe_rp2.7.b.tt: "Advance Republic Phase 2 Reform to Stage #Y 2#!, Treasury #G +120 gold#!; gain [ShowModifier('oe_rp2_p2_pomor_syndicate')] for #Y 25 years#!."
 oe_rp2.8.t: "Federal Zemsky Sobor & Cossack Hetmanate Autonomy"
 oe_rp2.8.d: "Stretching between Dnieper and Volga, our Old Rus' federation balances princely charters against constant steppe warfare. Free riders from the Dnieper rapids offer their sabers to the union if our Federal Zemsky Sobor recognizes the autonomy of a Cossack Hetmanate.\n\nShall we elevate the Zaporozhian Hetmanate as a federal pillar, or strengthen a bicameral diet of princes and towns?"
 oe_rp2.8.a: "Recognize Zaporozhian Hetmanate autonomy as a federal southern shield"
 oe_rp2.8.a.tt: "Advance Federal Phase 2 Reform to Stage #Y 2#!, settle #bold #color_yellow Zaporozhian Cossack#!#! frontier troops at Kichkas/frontier; gain [ShowModifier('oe_rp2_p3_federal_hetmanate')] for #Y 25 years#!."
 oe_rp2.8.b: "Codify a bicameral princely-civic diet to harmonize East Slavic lands"
 oe_rp2.8.b.tt: "Advance Federal Phase 2 Reform to Stage #Y 2#!, Stability #G +8#!; gain [ShowModifier('oe_rp2_p3_bicameral_sobor')] for #Y 25 years#!."
 oe_rp2.9.t: "The Steppe Abatis Line & Volga Advance"
 oe_rp2.9.d: "Even after the Great Horde's collapse, steppe raids from Crimea and the Volga still ravage southern farmlands. Royal commanders propose either building the Zasechnaya Cherta—an interlocking frontier of timber abatis, forts, and Don Cossack outposts from Tula to Voronezh and Belgorod—or launching an offensive vanguard down the Volga toward Kazan, Astrakhan, and the Terek."
 oe_rp2.9.a: "Construct the Steppe Abatis Line and settle Don Cossack outposts"
 oe_rp2.9.a.tt: "Fortify Tula/Voronezh/Belgorod with [ShowModifier('oe_rp2_abatis_line_loc')], settle #bold #color_yellow Don Cossack#!#! outposts; gain [ShowModifier('oe_rp2_abatis_line')] for #Y 25 years#!."
 oe_rp2.9.b: "Push down the Volga and plant Don and Terek Cossack vanguards"
 oe_rp2.9.b.tt: "Settle #bold #color_yellow Don Cossack#!#! and #bold #color_yellow Terek Cossack#!#! frontier stanitsas, Army Tradition #G +8#!; gain [ShowModifier('oe_rp2_volga_vanguard')] for #Y 25 years#!."
 oe_rp2.10.t: "Charter of the Six Cossack Frontier Hosts"
 oe_rp2.10.d: "From the Dnieper rapids and Don marshes to the Kuban, Terek, Yaik, and Siberian forests, frontier settlers and fugitive warriors have banded into self-governing Cossack stanitsas. Unmatched in steppe scouting and border raiding, they fiercely guard their liberties.\n\nShall the throne grant broad autonomous charters in exchange for fierce, low-cost levies, or pay royal voivodes to keep them under tighter discipline?"
 oe_rp2.10.a: "Grant the Free Cossack Charter: frontier autonomy for fierce border levies"
 oe_rp2.10.a.tt: "Settle #bold #color_yellow Zaporozhian#!#!, #bold #color_yellow Kuban#!#!, and #bold #color_yellow Terek Cossack#!#! stanitsas; gain [ShowModifier('oe_rp2_cossack_free_charter')] for #Y 25 years#! (trading slight crown power for cavalry & levies)."
 oe_rp2.10.b: "Bring the hosts under royal voivodes with steady pay and firm control"
 oe_rp2.10.b.tt: "Settle #bold #color_yellow Don#!#! and #bold #color_yellow Kuban Cossack#!#! stanitsas; gain [ShowModifier('oe_rp2_cossack_crown_hosts')] for #Y 25 years#!."
 oe_rp2.11.t: "Stroganov and Yermak: Across the Stone Belt into Siberia"
 oe_rp2.11.d: "Urgent dispatches arrive from the Stroganov salt magnates on the Kama: beyond the Stone Belt of the Urals, the Khanate of Sibir threatens eastern forts while ruling endless taiga rich in sable furs. The daring Cossack ataman Yermak offers to lead musketeers and river boats over the Urals toward Chimgi-Tura and Tobolsk.\n\nThe road across northern Eurasia now stands open."
 oe_rp2.11.a: "Back Yermak's Cossack expedition across the Urals into Siberia!"
 oe_rp2.11.a.tt: "Settle #bold #color_yellow Yaik Cossack#!#! and #bold #color_yellow Siberian Cossack#!#! frontier stanitsas, Prestige #G +15#!; gain [ShowModifier('oe_rp2_yermak_siberia')] for #Y 25 years#!."
 oe_rp2.11.b: "Expand Stroganov salt and fur patents for methodical Ural-Siberian growth"
 oe_rp2.11.b.tt: "Settle #bold #color_yellow Yaik Cossack#!#! frontier stanitsa, Treasury #G +150 gold#!; gain [ShowModifier('oe_rp2_stroganov_patents')] for #Y 25 years#!."
 oe_rp2.12.t: "Shadow of the Time of Troubles: Succession Guardrail"
 oe_rp2.12.d: "As the sixteenth century nears its close, poor harvests, long wars, and dynastic uncertainty cast the shadow of a Time of Troubles (Smuta). Without a firm guardrail, a vacant throne invites pretenders, boyar factions, and foreign invasion.\n\nDrawing upon the institutions forged across the past century, our court can lock in a succession compact and complete Phase 2."
 oe_rp2.12.a: "Bind estates and Church in a sworn Sobor succession compact"
 oe_rp2.12.a.tt: "Complete Playable Rus' Phase 2, Stability #G +10#!, Legitimacy #G +15#!; gain [ShowModifier('oe_rp2_smuta_compact')] for #Y 25 years#!."
 oe_rp2.12.b: "Establish an iron regency council backed by frontier garrisons"
 oe_rp2.12.b.tt: "Complete Playable Rus' Phase 2, Army Tradition #G +10#!; gain [ShowModifier('oe_rp2_smuta_iron_regency')] for #Y 25 years#!."
 oe_rp2.20.t: "Playable Rus' Phase 2: Choice Takes Effect"
 oe_rp2.90.t: "[TEST] Playable Rus' Phase 2: Readings"
 oe_rp2.90.d: "#T Phase 2 Core#!\nP1 path [ROOT.GetCountry.MakeScope.ScriptValue('oe_rp2_rd_path')|0]  P2 stage [ROOT.GetCountry.MakeScope.ScriptValue('oe_rp2_rd_stage')|0]  Sophia(1/2/3) [ROOT.GetCountry.MakeScope.ScriptValue('oe_rp2_rd_sophia')|0]  Tsar [ROOT.GetCountry.MakeScope.ScriptValue('oe_rp2_rd_tsar')|0]  P2 done [ROOT.GetCountry.MakeScope.ScriptValue('oe_rp2_rd_done')|0]\n#T Frontier & Cossacks#!\nHosts(0..6) [ROOT.GetCountry.MakeScope.ScriptValue('oe_rp2_rd_hosts')|0]  Abatis [ROOT.GetCountry.MakeScope.ScriptValue('oe_rp2_rd_abatis')|0]  Siberia [ROOT.GetCountry.MakeScope.ScriptValue('oe_rp2_rd_siberia')|0]\n#T Scheduler#!\nmonth [ROOT.GetCountry.MakeScope.ScriptValue('oe_rp2_rd_m')|0]  end [ROOT.GetCountry.MakeScope.ScriptValue('oe_rp2_rd_end')|0]  sent [ROOT.GetCountry.MakeScope.ScriptValue('oe_rp2_rd_cnt')|0]  Sophia done [ROOT.GetCountry.MakeScope.ScriptValue('oe_rp2_rd_sophia_done')|0]\n(end: 0 running, 1 Phase 2 done, 3 past 1605, 8 no human Rus')"
 oe_rp2.90.a: "Close"
 oe_rp2.90.b: "Refresh"
