 oe_lgr.20.a: "March into central Greece and take Athens as a client"
 oe_lgr.20.a.tt: "Costs #R 2#! months of trade and tax income\nCosts #R 2#! months of manpower\n[SCOPE.sCountry('oe_lgr_ath20').GetName] becomes a Roman client of the empire\nThe Ottomans: opinion of the empire #R −30#! for #Y 10#! years\nShould the stand at the Hexamilion later end in failure, the tie with Athens is undone the next month"
 oe_lgr.20.b: "Take a yearly tribute only"
 oe_lgr.20.b.tt: "Gain #G 2#! months of trade and tax income\n[SCOPE.sCountry('oe_lgr_ath20').GetName]: opinion of the empire #R −10#! for #Y 5#! years"
 oe_lgr.20.c: "Hold the Isthmus and stay behind the wall"
 oe_lgr.20.c.tt: "The empire does not [Concept('oe_tu_march','march')|e] into central Greece"
 oe_lgr.90.t: "Latin Greece: worker"
