 oe_lgr.3.a: "Buy Corinth"
 oe_lgr.3.a.tt: "Costs #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_lgr_cor_months')|0]#! months of trade and tax income (#Y 3#! if Nerio promised Corinth, #Y 5#! otherwise)\nCorinth passes to the empire\n[SCOPE.sCountry('oe_lgr_cor').GetName]: opinion of the empire #G +10#! for #Y 5#! years"
 oe_lgr.3.b: "Take the field for Corinth"
 oe_lgr.3.b.tt: "A casus belli against [SCOPE.sCountry('oe_lgr_cor').GetName] for #Y 5#! years\n[SCOPE.sCountry('oe_lgr_cor').GetName]: opinion of the empire #R −30#! for #Y 10#! years"
 oe_lgr.3.c: "Accept the will"
 oe_lgr.3.c.tt: "[SCOPE.sCountry('oe_lgr_cor').GetName]: opinion of the empire #G +15#! for #Y 10#! years"
 oe_lgr.11.t: "The Son-in-Law Rides West"
 oe_lgr.11.desc_0: "#F Nikephoros II was born at Arta, a son of the last despot of Epirus. When the rising in Epirus was put down in 1340, Nikephoros gave up the last castles and married Maria, a daughter of the future emperor John VI. John VI was crowned in 1347 and made the son-in-law a despot; from 1351 Nikephoros held Ainos and the towns along the Hellespont for the emperor. In December 1355 Stefan Dušan of Serbia died, and Preljub, who held Thessaly for Serbia, is said to have died about the same time.#!\n\nNow Nikephoros, hearing that Dušan is dead and that Arta is held by [SCOPE.sCountry('oe_lgr_arta_lord').GetName], asks the emperor's leave to ride west with a following and win back the father's lands."
 oe_lgr.11.a: "Let Nikephoros go"
 oe_lgr.11.a.tt: "Nikephoros rides west: Epirus rises again around Arta under this lord (the lands [SCOPE.sCountry('oe_lgr_arta_lord').GetName] holds there pass to Epirus)\nEpirus: opinion of the empire #G +25#! for #Y 10#! years"
 oe_lgr.11.b: "Give money and men for the venture"
 oe_lgr.11.b.tt: "Costs #R 2#! months of trade and tax income\nNikephoros rides west: Epirus rises again around Arta under this lord (the lands [SCOPE.sCountry('oe_lgr_arta_lord').GetName] holds there pass to Epirus)\nThe restored Epirus becomes a Roman client of the empire\nEpirus: opinion of the empire #G +25#! for #Y 10#! years\nThe chance that this lord later falls in battle drops from #Y 70%#! to #G 50%#!"
 oe_lgr.11.c: "Keep the despot at Ainos"
 oe_lgr.11.c.tt: "Nikephoros stays in the empire; Epirus will not rise again under this lord"
 oe_lgr.12.t: "The Caesar of Thessaly"
 oe_lgr.12.desc_c: "#F From 1359 Dušan's brother Simeon Uroš, under the style of emperor of the Serbs and the Greeks, ruled Thessaly from Trikala. Simeon died in 1370 and a son, John Uroš, followed; two or three years later John became a monk, and the caesar Alexios Angelos Philanthropenos took over Thessaly. From about 1382 the caesar acknowledged the prince who governed at Thessaloniki as overlord.#!\n\nNow envoys of [SCOPE.sCharacter('oe_lgr_ths_r').GetFirstNameWithNoTooltip], ruler of [SCOPE.sCountry('oe_lgr_ths_c').GetName], have come to the prince at Thessaloniki: their lord will take the empire as overlord, and asks the emperor for the dignity of caesar."
 oe_lgr.12.desc_x: "#F From 1359 Dušan's brother Simeon Uroš, under the style of emperor of the Serbs and the Greeks, ruled Thessaly from Trikala. Simeon died in 1370 and a son, John Uroš, followed; two or three years later John became a monk, and the caesar Alexios Angelos Philanthropenos took over Thessaly. From about 1382 the caesar acknowledged the prince who governed at Thessaloniki as overlord.#!\n\nNow envoys of [SCOPE.sCharacter('oe_lgr_ths_r').GetFirstNameWithNoTooltip], ruler of [SCOPE.sCountry('oe_lgr_ths_c').GetName], have come to the capital: their lord will take the empire as overlord, and asks the emperor for the dignity of caesar."
 oe_lgr.12.a: "Accept the homage and grant the dignity of caesar"
 oe_lgr.12.a.tt: "[SCOPE.sCharacter('oe_lgr_ths_r').GetFirstNameWithNoTooltip] receives the dignity of caesar by the rules of the empire's dignities (at the usual cost)\nThessaly: opinion of the empire #G +30#! for #Y 20#! years"
 oe_lgr.12.b: "Friendship, nothing more"
 oe_lgr.12.b.tt: "Thessaly: opinion of the empire #G +15#! for #Y 10#! years"
 oe_lgr.12.c: "Pay it no mind"
 oe_lgr.12.c.tt: "The empire sends no answer"
 oe_lgr.13.t: "The Countess of Salona"
 oe_lgr.13.desc_0t: "#F Salona was a county of the Catalan house of Fadrique. When Count Louis died in 1382, the widow Helena became regent for the young heiress Maria. The countess was a daughter of Matthew Kantakouzenos and a granddaughter of the Emperor John VI. In 1388 the King of Aragon even asked the countess to serve as castellan of Athens.#!\n\nThessaly has now fallen to the sultan, and Salona has become a border town. The sultan's army is closing on [SCOPE.sCountry('oe_lgr_sao').GetName]. It is said that the townsfolk have little love for the regent, and some already talk of opening the gates to the sultan. The countess has sent to the empire for help."
 oe_lgr.13.desc_0: "#F Salona was a county of the Catalan house of Fadrique. When Count Louis died in 1382, the widow Helena became regent for the young heiress Maria. The countess was a daughter of Matthew Kantakouzenos and a granddaughter of the Emperor John VI. In 1388 the King of Aragon even asked the countess to serve as castellan of Athens.#!\n\nNow the sultan's army is closing on [SCOPE.sCountry('oe_lgr_sao').GetName]. It is said that the townsfolk have little love for the regent, and some already talk of opening the gates to the sultan. The countess has sent to the empire for help."
 oe_lgr.13.a: "Send ships to bring the countess and the young heiress to the Morea"
 oe_lgr.13.a.tt: "Costs #R 1#! month of trade and tax income\nThe Ottomans: opinion of the empire #R −10#! for #Y 5#! years\nThe town itself can hardly be saved"
 oe_lgr.13.b: "Advise the countess to seek help from [SCOPE.sCountry('oe_lgr_ath13').GetName]"
 oe_lgr.13.b.tt: "[SCOPE.sCountry('oe_lgr_ath13').GetName]: opinion of the empire #G +10#! for #Y 5#! years\nThe town itself can hardly be saved"
 oe_lgr.13.c: "Leave Salona to its fate"
 oe_lgr.13.c.tt: "The empire sends no answer"
 oe_lgr.14.t: "Ioannina Opens Its Gates"
 oe_lgr.14.desc_1ct: "#F In the summer of 1429 Carlo I Tocco died, and a nephew, Carlo II, followed. Carlo I's natural sons would not accept it; led by Memnon, they called on Sultan Murad II for help, and the sultan's army marched into Epirus. In October 1430 the notables of Ioannina opened the gates to the sultan, on condition that they kept their privileges. At about the same time Thessaloniki too fell to the sultan.#!\n\nNow the gates of Ioannina stand open to the sultan. Some of the notables and clergy of the city will not stay under the sultan's rule, and are seeking a way to reach the empire. Arta is still held by [SCOPE.sCountry('oe_lgr_arta_c').GetName]."
