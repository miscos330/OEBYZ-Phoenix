 oe_lgr.2.t: "The Daughter of the Lord of Corinth"
 oe_lgr.2.desc_2s: "#F Nerio Acciaioli, a Florentine, was the adopted son of Niccolò, Grand Seneschal of the Kingdom of Naples. After Niccolò's death Corinth was pledged to Nerio; Philip of Taranto confirmed it in 1371, and the next year the pope wrote to Nerio as 'lord of the city of Corinth'. At the end of 1374 or early in 1375 Nerio took Megara as well. In 1385 the Despot of the Morea married Nerio's eldest daughter; the bride, it is said, was the most beautiful woman of the age. Before the wedding Nerio promised that after Nerio's own death Corinth would pass to this daughter. In the same year Nerio broke into the lower town of Athens. In May 1388 the Acropolis opened its gates too.#!\n\nNow Nerio is master of [SCOPE.sCountry('oe_lgr_ath').GetName] and has sent envoys with a proposal: the eldest daughter to be married into the Morea, and the two houses joined by marriage. The empire already has an understanding with this lord; a marriage would bind it tighter."
