 oe_lgr.14.a: "Take in the notables and clergy who leave"
 oe_lgr.14.a.tt: "Costs #R 1#! month of trade and tax income\n[Concept('oe_tu_patriarchate','patriarchal standing')|e] #G +2#!"
 oe_lgr.14.b: "Seek friendship with [SCOPE.sCountry('oe_lgr_arta_c').GetName]"
 oe_lgr.14.b.tt: "[SCOPE.sCountry('oe_lgr_arta_c').GetName]: opinion of the empire #G +15#! for #Y 10#! years\nThe empire's ties with the Tocco grow closer"
 oe_lgr.14.c: "Do nothing"
 oe_lgr.14.c.tt: "The empire makes no move"
 oe_lgr.4.t: "The Captive Vicar"
 oe_lgr.4.desc_0: "#F From 1386 the Navarrese Company was led by Pedro de San Superano; the next year the Company made a treaty with Venice, and the pope named Pedro vicar general of Achaea. At the end of 1394 or early in 1395 the sultan's frontier lord rode into the Morea, joined forces with the Company and took Akova.#!\n\nNow the Turks have gone home, and the Greeks of the Morea have fallen on the Company, beaten it and taken Pedro and Centurione, lord of Arcadia, prisoner; [GetCountry('ACH').GetName] has nobody left to give orders. Envoys from Venice offer fifty thousand hyperpyra to ransom Pedro."
 oe_lgr.4.a: "Take the Venetian ransom and let the captain go"
 oe_lgr.4.a.tt: "Gain #G 2#! months of trade and tax income\nVenice: opinion of the empire #G +10#! for #Y 5#! years"
 oe_lgr.4.b: "Trade the captain for a border place of Achaea"
 oe_lgr.4.b.tt: "A place of Achaea that borders the empire (not its capital) passes to the empire\nAchaea: opinion of the empire #R −25#! for #Y 10#! years\nVenice: opinion of the empire #R −10#! for #Y 5#! years"
 oe_lgr.4.c: "Let the captain go for nothing, as a friend of Achaea"
 oe_lgr.4.c.tt: "Achaea: opinion of the empire #G +30#! for #Y 20#! years\nThe friendship shows only as opinion; no real alliance is made"
 oe_lgr.20.t: "Thebes Submits"
 oe_lgr.20.desc_0dv: "#F In 1402 Nerio's natural son Antonio took back the lower town of Athens, and the Acropolis surrendered the next year; in 1405 Antonio made peace with Venice, and the Acciaioli were secure in Athens from then on. In 1430 the despots of the Morea took the heart of Achaea; soon after, Centurione, the last prince of Achaea, died.#!\n\nNow the sultan's armies are all in the north, and the land beyond the Isthmus lies open. The empire has already promised help to the crusade, and the peace with the sultan is a dead letter. The despot asks leave to [Concept('oe_tu_march','march')|e] into central Greece, take back Thebes and bring [SCOPE.sCountry('oe_lgr_ath20').GetName] to heel."
