 oe_lgr.1.t: "New Neighbours in the Morea"
 oe_lgr.1.desc_2da: "#F These Navarrese mercenaries were first gathered by the Duke of Durazzo, and in 1376 they won Durazzo back for the duke. When the duke died they looked for a new paymaster; in 1378 they came into the Morea in the pay of the Knights of Saint John, and the next year one of their bands stormed Thebes. In 1381 the titular Latin emperor took possession of Achaea; that lord died in 1383, and from then on Naples was overlord in name only, while the power lay with the captains of the Company. In 1387 the Company's captain made a treaty with Venice.#!\n\nNow the captains of the Company give the orders in [GetCountry('ACH').GetName], and the despot's border has neighbours who live by the sword. The new master of Corinth and Athens is wary of them too."
 oe_lgr.1.desc_2d: "#F These Navarrese mercenaries were first gathered by the Duke of Durazzo, and in 1376 they won Durazzo back for the duke. When the duke died they looked for a new paymaster; in 1378 they came into the Morea in the pay of the Knights of Saint John, and the next year one of their bands stormed Thebes. In 1381 the titular Latin emperor took possession of Achaea; that lord died in 1383, and from then on Naples was overlord in name only, while the power lay with the captains of the Company. In 1387 the Company's captain made a treaty with Venice.#!\n\nNow the captains of the Company give the orders in [GetCountry('ACH').GetName], and the despot's border has neighbours who live by the sword."
