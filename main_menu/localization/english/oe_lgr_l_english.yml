 oe_lgr.3.desc_1nk: "#F Corinth had been a fief of Niccolò Acciaioli, Grand Seneschal of the Kingdom of Naples. After Niccolò's death the city was pledged to Nerio, the seneschal's adopted son; Philip of Taranto confirmed it in 1371, and the next year the pope called Nerio 'lord of the city of Corinth'. In 1385 Nerio married the eldest daughter to the Despot of the Morea, and promised before the wedding that after Nerio's own death Corinth would pass to this daughter.#!\n\nNow the aged Nerio has made a will, and word of it has reached the Morea. It leaves Corinth to the younger daughter and the Count of Cephalonia; the elder daughter, married into the Morea, receives nothing but the cancelling of the loan. The promise made before the wedding has come to nothing. For the moment Corinth is held by [SCOPE.sCountry('oe_lgr_cor').GetName]. The officials in the Morea say that no one may be able to hold the city on the isthmus for long, and that gold might buy it."
