 oe_lgr.3.t: "Nerio's Will"
 oe_lgr.3.desc_3nk: "#F Early in 1394 the King of Naples made Nerio Acciaioli Duke of Athens; in the same year Nerio agreed to pay tribute to the sultan. On 17 September Nerio made a will at Corinth: the city of Athens to the church of Saint Mary on the Acropolis, Thebes to a natural son, the rest to the younger daughter, wife of the Count of Cephalonia; the elder daughter, married into the Morea, received only the cancelling of the debt the despot owed. Eight days later Nerio died. The despot marched on Corinth that same autumn and failed to take it; a year or two later the count, judging that the city could not be held, sold it to the despot.#!\n\nNow the aged Nerio has made a will, and word of it has reached the Morea. It leaves Corinth to the younger daughter and the Count of Cephalonia; the elder daughter, married into the Morea, receives nothing but the cancelling of the loan. The promise made before the wedding has come to nothing. For the moment Corinth is held by [SCOPE.sCountry('oe_lgr_cor').GetName]. The officials in the Morea say that no one may be able to hold the city on the isthmus for long, and that gold might buy it."
