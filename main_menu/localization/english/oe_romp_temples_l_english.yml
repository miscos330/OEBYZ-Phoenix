 # NEW 2026-11-21 v9.8 Religio Romana: 2 Core Holy Sites, 9 Rebuildable Grand Temples, O(1) Pax Deorum Auto-Modifiers & Ages 5-6 Advances (oe_romp_, 0 slots). Generated by gen_romp_temples.py; edit the generator, not this file.
 oe_romp_porphyry_column_site: "Porphyry Column of Sol Invictus"
 oe_romp_porphyry_column_site_desc: "Rising at the heart of the Forum of Constantine, this monumental porphyry shaft originally crowned with a radiant bronze statue of Apollo-Sol Invictus anchors the classical solar cult of New Rome."
 oe_romp_mystras_academy_site: "Neoplatonic Sanctuary of Mystras"
 oe_romp_mystras_academy_site_desc: "Perched along the slopes of Mount Taygetus above ancient Sparta, this philosophical sanctuary became the cradle of George Gemistos Plethon's Neoplatonic revival and the modern restoration of Religio Romana."
 oe_romp_temple_capitolium: "Temple of Jupiter Optimus Maximus"
 oe_romp_temple_capitolium_desc: "Rebuilt atop Rome's Capitoline Hill with gilded bronze roof tiles overlooking the Tiber, the supreme temple of the Capitoline Triad embodies senatorial majesty, triumphal vows, and Roman public law."
 oe_romp_temple_capitolium_maint: "Temple of Jupiter Optimus Maximus (Upkeep)"
 oe_romp_temple_parthenon: "Restored Parthenon of Athena"
 oe_romp_temple_parthenon_desc: "Restored in Pentelic marble atop the Acropolis of Athens, the Doric sanctuary of Athena-Minerva once again gathers philosophers, sculptors, and classical scholarship from across the Mediterranean."
 oe_romp_temple_parthenon_maint: "Restored Parthenon of Athena (Upkeep)"
 oe_romp_temple_delphi: "Sanctuary of the Delphic Oracle"
 oe_romp_temple_delphi_desc: "Beside the Castalian spring on the slopes of Mount Parnassus, the restored tripod of Apollo Phoebo delivers counsel and classical restraint, calming unrest and elevating sacred learning."
 oe_romp_temple_delphi_maint: "Sanctuary of the Delphic Oracle (Upkeep)"
 oe_romp_temple_olympia: "Grand Temple of Zeus at Olympia"
 oe_romp_temple_olympia_desc: "Rising once more within the sacred grove of the Altis along the Alpheios valley, the monumental sanctuary of Olympian Zeus draws pilgrims, athletes, and quadrennial truce embassies from every province."
 oe_romp_temple_olympia_maint: "Grand Temple of Zeus at Olympia (Upkeep)"
 oe_romp_temple_serapeum: "Grand Serapeum of Alexandria"
 oe_romp_temple_serapeum_desc: "Rebuilt atop the Rhakotis terrace of Alexandria with terraced colonnades and daughter archives, the Grand Serapeum unites Greco-Egyptian syncretism, classical scholarship, and maritime commerce."
 oe_romp_temple_serapeum_maint: "Grand Serapeum of Alexandria (Upkeep)"
 oe_romp_temple_artemision: "Rebuilt Artemision of Ephesus"
 oe_romp_temple_artemision_desc: "A forest of Ionic marble columns restores one of the Seven Wonders above the Ionian coast, serving as sacred asylum, medicinal precinct, and beacon of eastern Aegean prosperity."
 oe_romp_temple_artemision_maint: "Rebuilt Artemision of Ephesus (Upkeep)"
 oe_romp_temple_porphyry_sol: "Altar of the Porphyry Column of Sol"
 oe_romp_temple_porphyry_sol_desc: "Encircling Constantine's porphyry column with a marble solar rotunda and pontifical hall, this imperial altar honors Sol Invictus and binds New Rome's sovereignty to classical sacred law."
 oe_romp_temple_porphyry_sol_maint: "Altar of the Porphyry Column of Sol (Upkeep)"
 oe_romp_temple_delos: "Sacred Precinct of Delos"
 oe_romp_temple_delos_desc: "In the center of the Cyclades, the restored Terrace of the Lions and twin sanctuaries of Apollo and Artemis renew Delos as a sacred league harbor and tranquil pilgrimage hub."
 oe_romp_temple_delos_maint: "Sacred Precinct of Delos (Upkeep)"
 oe_romp_temple_mystras_academy: "Mystras Neoplatonic Sanctuary"
 oe_romp_temple_mystras_academy_desc: "Expanded from Plethon's Laconian lecture halls into a colonnaded sanctuary and library, Mystras trains a new generation of priests and scholars in Neoplatonic philosophy and Roman ritual law."
 oe_romp_temple_mystras_academy_maint: "Mystras Neoplatonic Sanctuary (Upkeep)"
 AUTO_MODIFIER_NAME_oe_romp_pax_deorum_tier1: "Pax Deorum: Rising Sanctuaries (3–4 Temples)"
 AUTO_MODIFIER_DESC_oe_romp_pax_deorum_tier1: "Directly holding and restoring three to four classical Grand Temples rekindles the sacred network of Religio Romana, strengthening Religious Influence, Omen potency, and imperial Prestige."
 AUTO_MODIFIER_NAME_oe_romp_pax_deorum_tier2: "Pax Deorum: Flourishing Network (5–6 Temples)"
 AUTO_MODIFIER_DESC_oe_romp_pax_deorum_tier2: "Directly holding and restoring five to six classical Grand Temples unites the Mediterranean sanctuaries in sacred harmony, amplifying Omen strength and duration while reinforcing imperial Legitimacy."
 AUTO_MODIFIER_NAME_oe_romp_pax_deorum_tier3: "Pax Deorum Restored (7+ Temples)"
 AUTO_MODIFIER_DESC_oe_romp_pax_deorum_tier3: "With seven or more restored Grand Temples shining from the Capitoline to Constantinople, true Pax Deorum returns to the world—granting an extra Omen choice, lasting prosperity, and universal imperial toleration."
 AUTO_MODIFIER_NAME_oe_romp_capitoline_triad_synergy: "Resonance of the Capitoline Triad"
 AUTO_MODIFIER_DESC_oe_romp_capitoline_triad_synergy: "With Jupiter, Juno, and Minerva seated together in the imperial pantheon and the restored Temple of Jupiter Optimus Maximus crowning Rome, the Capitoline Triad blesses crown sovereignty and legionary discipline."
 AUTO_MODIFIER_NAME_oe_romp_sol_invictus_synergy: "Imperial Radiance of Sol Invictus"
 AUTO_MODIFIER_DESC_oe_romp_sol_invictus_synergy: "Enthroned in the pantheon alongside the restored Altar of the Porphyry Column in Constantinople, Sol Invictus sheds radiant order across provincial control, scholarly inquiry, and religious influence."
 AUTO_MODIFIER_NAME_oe_romp_asclepius_sanctuary_synergy: "Asclepian Shield of Epidaurus and Pergamon"
 AUTO_MODIFIER_DESC_oe_romp_asclepius_sanctuary_synergy: "With Asclepius-Hygieia seated in the pantheon and the healing precincts of Epidaurus or Pergamon under imperial stewardship, Asclepian sanctuaries shield the realm against plague and lengthen human life."
 oe_romp_adv_heliocentric_theology: "Heliocentric Solar Theology"
 oe_romp_adv_heliocentric_theology_desc: "Imperial astronomers reconcile the heliocentric cosmos with Julian's solar metaphysics, turning observational science and classical solar theology into mutually reinforcing engines of discovery."
 oe_romp_adv_pax_deorum_jurisprudence: "Pax Deorum Jurisprudence"
 oe_romp_adv_pax_deorum_jurisprudence_desc: "Codifying Symmachan toleration, municipal sanitation statutes, and ius gentium into unified public law secures peaceful worship for diverse subjects while strengthening provincial governance and public health."
 oe_romp_adv_neoclassical_enlightenment: "Neoclassical Enlightenment Academies"
 oe_romp_adv_neoclassical_enlightenment_desc: "Public neoclassical academies across Constantinople, Rome, Athens, and Alexandria unite Stoic natural law, empirical inquiry, and classical letters to elevate literacy and cultural vitality."
 oe_romp_adv_secular_civic_imperium: "Charter of the Secular Civic Imperium"
 oe_romp_adv_secular_civic_imperium_desc: "Transforming ancient civic religion into the unifying bond of a modern constitutional imperium, the state safeguards public medicine, freedom of conscience, and dignified pontifical ritual."
