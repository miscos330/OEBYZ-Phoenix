 oe_tut_btn_finish: "Complete Guide"
 oe_tut_chain_roman_themes: "Byzantine Themes 2.0, Exarchates & Empire Pillars"
 oe_tut_lesson_roman_themes: "Byzantine Themes 2.0, Exarchates & Empire Pillars"
 oe_tut_step_roman_1: "Themes 2.0 & Provincial Administration"
 oe_tut_step_roman_1_desc: "Byzantine Themes 2.0 transforms provincial defense into an integrated military-fiscal network. Assign frontier, inland, Italian, and naval themes to balance local troop musters against central control.\n\nMonitor provincial autonomy and loyalty carefully through the Government and Subjects panels so your strategoi reinforce imperial campaigns without fracturing the heartland."
 oe_tut_step_roman_2: "Exarchates, Praetorian Prefectures & Subject Protection"
 oe_tut_step_roman_2_desc: "As your realm expands across the Mediterranean and distant seas, organize outer territories into Exarchates and Praetorian Prefectures to project proximity and curb Imperial Entropy.\n\nSpecial historical subjects—including imperial themes, chartered banks, and noble houses—are protected from accidental generic subject-type conversion, preserving their bespoke mechanics."
 oe_tut_step_roman_3: "The Four Imperial Pillars & Strong-Route Destiny"
 oe_tut_step_roman_3_desc: "Balance the Four Imperial Pillars—Senate, Army, Treasury, and Patriarchate—to unlock decisive reforms across every age. Era-locked military advances ensure standing professional regiments emerge organically alongside authentic technological progress.\n\nPursue the Byzantine Destiny mission tree across five strategic directions to reclaim Roman glory and record your triumph in the 1836 Definitive Chronicle."
 oe_tut_chain_celestial_mandate: "Celestial Mandate, Branch Secretariats & Duhu Protectorates"
 oe_tut_lesson_celestial_mandate: "Celestial Mandate, Branch Secretariats & Duhu Protectorates"
 oe_tut_step_celestial_1: "Great Yuan, Ming & Qing Celestial Mandate"
 oe_tut_step_celestial_1_desc: "East Asia's Middle Kingdom international organization anchors tribute, imperial prestige, and dynastic legitimacy from 1337 onward. Whether stabilizing Great Yuan through the Red Turban storm, forging Ming naval hegemony, or rising from Jurchen banners to Qing, Mandate management is central.\n\nUse native Civilization Parliaments (Yuan Kurultai and Six Ministries) to pass fiscal, military, and hydraulic reforms with estate backing."
 oe_tut_step_celestial_2: "Branch Secretariats & Frontier Subject Protection"
 oe_tut_step_celestial_2_desc: "Great Yuan opens with specialized Branch Secretariats—including Liaoyang, Lingbei, and Gansu frontier provinces—mirroring the historic administrative architecture of the Mongol-Chinese empire.\n\nDedicated subject protection preserves these frontier branch secretariats under their authentic subject category and ensures Karakorum remains safely linked if the court retreats north."
 oe_tut_step_celestial_3: "Grand Duhu Protectorates, Xuanweisi & Tributary Order"
 oe_tut_step_celestial_3_desc: "Project Celestial governance beyond the inner provinces through Grand Duhu Protectorates, Xuanweisi frontier commissions, and hereditary Tusi lordships.\n\nCombine Silk Road caravan arteries with maritime zaytun trade networks and Ever-Normal Granaries to weather the Little Ice Age and lead Asia into the industrial age."
 oe_tut_chain_steppe_nomads: "Steppe Khanates & 33 Army-Country Nomad Survival"
 oe_tut_lesson_steppe_nomads: "Steppe Khanates & 33 Army-Country Nomad Survival"
 oe_tut_step_steppe_1: "Ulus of Jochi, Chagatai & 33 Army-Country Hordes"
 oe_tut_step_steppe_1_desc: "Across the Eurasian Steppe from the Volga to Manchuria, 33 starting army-based nomad polities follow distinct martial and pastoral dynamics—led by the Ulus of Jochi, Chagatai, Oirat, and Ilkhanate successor hordes.\n\nManage Horde Cohesion across your wing khanates and kurultai assemblies to keep vassal uluses united behind your banner."
 oe_tut_step_steppe_2: "Winter Dzud Guardrails & Little Ice Age Resilience"
 oe_tut_step_steppe_2_desc: "Harsh steppe winters and the 17th-century Little Ice Age can devastate pastoral supply lines. Every active landed army-country benefits from seasonal winter herd guardrails preventing catastrophic AI self-collapse while preserving authentic attrition challenges.\n\nStockpile treasury reserves, secure fertile river pastures, and tap market granaries when extended winters freeze the northern plains."
 oe_tut_step_steppe_3: "Dual-Track Settlement: Eternal Steppe vs. Gunpowder Realm"
 oe_tut_step_steppe_3_desc: "From 1450 onward, major nomad empires face a historic crossroads. Choose the Eternal Steppe doctrine to double down on elite mobile cavalry, raiding logistics, and winter warfare.\n\nOr embrace Sedentarization—cleanly transitioning from an army-country into a landed monarchy equipped to field gunpowder artillery, manufactories, and modern imperial institutions."
 oe_tut_chain_economy_qol: "Strategic Goods, 5 Great Canals, 6 Map Modes & QoL"
 oe_tut_lesson_economy_qol: "Strategic Goods, 5 Great Canals, 6 Map Modes & QoL"
 oe_tut_step_econ_1: "Strategic Goods, Banking Estates & Pop Mobility"
 oe_tut_step_econ_1_desc: "Unlock late-game industrial momentum through strategic commodity breakthroughs, Columbian Exchange staple crops (potato, maize), and genuine banking estate loans backed by thriving building-based mercantile houses.\n\nUrban infrastructure and canal hubs promote rural peasants into burghers and industrial laborers, steadily expanding your tax base and literacy."
 oe_tut_step_econ_2: "Five Great Intercontinental Canals & Late-Game Bridges"
 oe_tut_step_econ_2_desc: "Master global choke points by financing the Five Great Canals: Suez, Panama, Kiel, Corinth, and the Grand Canal Imperial Renovation. Opened canals transform global maritime routing and bestow permanent strategic hubs.\n\nCross-Eurasian narrative bridges connect the Treaty of Tordesillas, Golden Age of Piracy, and Age of Revolutions to powers from Lisbon to Constantinople and Nanjing."
 oe_tut_step_econ_3: "6 Custom Map Modes, 15 Ledger Columns & Opt-In QoL"
 oe_tut_step_econ_3_desc: "Inspect empire health at a glance using 6 zero-override custom Map Modes (Imperial Entropy, Great Canals & Rail Corridors, Hegemony Spheres, Climate & Harvest, Destiny Progress, and Suzerain Networks) plus 15 dedicated Country Ledger attribute columns.\n\nToggle opt-in QoL Assistants—such as Royal Marriage, Road Paving, Granary Relief, and Garrison Maintenance—at your discretion with zero AI overhead."
 oe_tut_dec_open_phoenix_handbook.title: "Consult the Phoenix Definitive Compendium"
 oe_tut_dec_open_phoenix_handbook.desc: "Open the interactive Definitive Edition Handbook covering Byzantine Themes 2.0, the Celestial Mandate, 33 Steppe Nomad Hordes, Strategic Goods, Five Great Canals, 6 Map Modes, 15 Ledger Columns, and Opt-In QoL Assistants."
 oe_tut_dec_open_phoenix_handbook.a: "Open the Phoenix Guide Hub"
 oe_tut.1.t: "Compendium I: Byzantine Themes 2.0, Exarchates & Empire Pillars"
 oe_tut.1.desc: "Imperial archons have assembled a field manual on Roman provincial administration: balancing Frontier, Inland, Italian, and Naval Themes, establishing Exarchates and Praetorian Prefectures to contain Imperial Entropy, and harmonizing the Four Imperial Pillars across five centuries."
 oe_tut.1.a: "Launch the Interactive Roman Themes Guide"
 oe_tut.1.b: "Archive the Strategikon in the Imperial Library"
 oe_tut.2.t: "Compendium II: Celestial Mandate, Branch Secretariats & Duhu Protectorates"
 oe_tut.2.desc: "Chancery scholars present the grand treatise on East Asian statecraft: navigating Great Yuan, Ming, and Qing Mandate cycles, protecting Liaoyang, Lingbei, and Gansu frontier Branch Secretariats, convening native Civilization Parliaments, and governing Grand Duhu Protectorates and Tusi frontiers."
 oe_tut.2.a: "Launch the Interactive Celestial Mandate Guide"
 oe_tut.2.b: "Enshrine the Treatise in the Grand Secretariat"
 oe_tut.3.t: "Compendium III: Great Steppe Khanates & 33 Army-Country Nomads"
 oe_tut.3.desc: "Chroniclers of the Ulus of Jochi, Chagatai, Oirat, and Ilkhanate belts have compiled the riders' manual: preserving Horde Cohesion across wing khanates, surviving winter dzuds and the Little Ice Age with herd logistics guardrails, and choosing after 1450 between the Eternal Steppe and a Sedentary Gunpowder Realm."
 oe_tut.3.a: "Launch the Interactive Steppe Nomads Guide"
 oe_tut.3.b: "Proclaim the Steppe Manual to the Banners"
 oe_tut.4.t: "Compendium IV: Strategic Goods, 5 Great Canals, 6 Map Modes & QoL"
 oe_tut.4.desc: "Master cartographers and royal treasurers present the economic & interface atlas: leveraging banking estate loans and Columbian Exchange crops, cutting the Five Great Intercontinental Canals (Suez, Panama, Kiel, Corinth, and the Grand Canal), reading 6 custom Map Modes and 15 Ledger Columns, and configuring opt-in player QoL Assistants."
 oe_tut.4.a: "Launch the Interactive Economy & QoL Guide"
 oe_tut.4.b: "Distribute the Atlas to the Ministries"
 oe_tut.5.t: "1836: The Definitive Chronicle of Five Centuries"
 oe_tut.5.desc: "From the uncertain dawn of 1337 to the threshold of 1836, five turbulent centuries have passed beneath your banners. Dynasties rose and fell, canals severed continents, plagues and Little Ice Age winters tested every granary, and rival coalitions collided across Eurasia and the oceans.\n\nToday your chroniclers seal the final gilt volume of the Definitive Chronicle. How shall posterity remember the crowning legacy of [ROOT.GetCountry.GetName]?"
 oe_tut.5.a: "Remember Us by the Unbroken Crown of Five Centuries"
 oe_tut.5.b: "Remember Us by Scholarship, Canals & Global Commerce"
 oe_tut.6.t: "The Hall of Fifty-Five Destinies"
 oe_tut.6.desc: "Across fifty-five storied nations spanning the Roman Mediterranean, the Celestial East, the Eurasian Steppe, the Indian Ocean, Europe, Africa, and the Americas, only realms of rare resolve complete their historical destiny and endure the trials of the ages.\n\nMarble plaques in the Hall of Destinies now bear the emblem of [ROOT.GetCountry.GetName], honoring a civilization that reshaped the grand arc of world history."
 oe_tut.6.a: "Inscribe Our Sovereign Name in the Hall of Destinies"
 oe_tut.6.b: "Dispatch Envoys to Proclaim a Eurasian Concord"
 oe_tut.7.t: "The Phoenix Definitive Edition Guide Hub"
 oe_tut.7.desc: "Welcome to the Phoenix Definitive Edition Compendium. Select any of the four interactive tutorial chains below to inspect core mechanics and launch its multi-step encyclopedia guide at any time, with zero intrusive startup popups."
 oe_tut.7.a: "I. Byzantine Themes 2.0, Exarchates & Empire Pillars"
 oe_tut.7.b: "II. Celestial Mandate, Branch Secretariats & Duhu Protectorates"
 oe_tut.7.c: "III. Great Steppe Khanates & 33 Army-Country Nomads"
 oe_tut.7.d: "IV. Strategic Goods, 5 Great Canals, 6 Map Modes & QoL"
 oe_tut.7.e: "Close the Compendium for Now"
 oe_tut.90.t: "Definitive Edition Live Engine Diagnostic (9 Probes, CMDLOG=0)"
 oe_tut.90.desc: "#high Live Engine Probe Readout (0 = Not Run, 1+ = Pass, 2 = Skipped Precondition, 3 = Anomaly):#!\n\n#Y P1 Estate Private Regiments:#! [ROOT.GetCountry.MakeScope.GetVariable('oe_probe2_p1').GetValue|0]\n#Y P2 Banking Loans & HSA/PRZ/BRD/OBY Survival:#! [ROOT.GetCountry.MakeScope.GetVariable('oe_probe2_p2').GetValue|0]\n#Y P3 Extended Winter & Market Granary:#! [ROOT.GetCountry.MakeScope.GetVariable('oe_probe2_p3').GetValue|0]\n#Y P4 Dynasty Modifier & Pop Mobility:#! [ROOT.GetCountry.MakeScope.GetVariable('oe_probe2_p4').GetValue|0]\n#Y P5 Native IO Resolutions & Zero-Touch IOs:#! [ROOT.GetCountry.MakeScope.GetVariable('oe_probe2_p5').GetValue|0]\n#Y P6 Native UI / Map / Ledger / Flags / Tutorial Hooks:#! [ROOT.GetCountry.MakeScope.GetVariable('oe_probe2_p6').GetValue|0]\n#Y P7 Cross-Century Soundtrack & Bookmark Era:#! [ROOT.GetCountry.MakeScope.GetVariable('oe_probe2_p7').GetValue|0]\n#Y P8 500-Year Telemetry & Kernel Counters:#! [ROOT.GetCountry.MakeScope.GetVariable('oe_probe2_p8').GetValue|0] (Monthly Ticks: [ROOT.GetCountry.MakeScope.GetVariable('oe_probe2_gk_ticks').GetValue|0], Yearly Runs: [ROOT.GetCountry.MakeScope.GetVariable('oe_probe2_gk_years').GetValue|0])\n#Y P9 Era-Lock & Subject Protection (1=1337 Locked, 2=Age 3+ Unlocked):#! [ROOT.GetCountry.MakeScope.GetVariable('oe_probe2_p9').GetValue|0]"
 oe_tut.90.a: "Acknowledge Live Diagnostic Readout"
 oe_tut.90.b: "Re-Run All 9 Live Engine Probes (P1-P9)"
