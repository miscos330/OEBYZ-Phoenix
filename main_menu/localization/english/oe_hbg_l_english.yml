l_english:
# NEW 2026-11-23 v23.0 Module B4 Global Flavor Gems Hansa-Burgundy-Granada-BlackSea (oe_hbg_, gen_v230_hansa_burgundy_blacksea.py) — english localization (358 keys). Edit gen_v230_hansa_burgundy_blacksea.py, not this file.
 OHK1:0 "London Steelyard Kontor"
 OHK1_ADJ:0 "Steelyard Kontor"
 oe_hbg_name_tidemann_von_limberg:0 "Tidemann von Limberg"
 oe_hbg_kontor_seat_1:0 "London Steelyard Kontor Hall"
 oe_hbg_kontor_seat_1_desc:0 "Walled Hanseatic Kontor hall of the Steelyard on the Thames in London, organizing wool, broadcloth, and Baltic timber staples under Lubeck's charter without detaching English territory."
 OHK2:0 "Bruges Flanders Kontor"
 OHK2_ADJ:0 "Bruges Kontor"
 oe_hbg_name_johann_wittenborg:0 "Johann Wittenborg"
 oe_hbg_kontor_seat_2:0 "Bruges Flanders Kontor Hall"
 oe_hbg_kontor_seat_2_desc:0 "Great Hanseatic exchange hall of the Bruges Kontor linking Flemish luxury cloth and Italian spice convoys to Baltic cogs while Bruges stays fully under Flemish ownership."
 OHK3:0 "Bergen Bryggen Kontor"
 OHK3_ADJ:0 "Bryggen Kontor"
 oe_hbg_name_hermann_warendorp:0 "Hermann Warendorp"
 oe_hbg_kontor_seat_3:0 "Bergen Bryggen Kontor Wharf"
 oe_hbg_kontor_seat_3_desc:0 "Timber-wharf headquarters of the Hanseatic Bryggen Kontor at Bergen, exchanging Baltic grain and malt for Norwegian dried stockfish without detaching Norwegian territory."
 OHK4:0 "Novgorod Peterhof Kontor"
 OHK4_ADJ:0 "Peterhof Kontor"
 oe_hbg_name_hinrich_pleskow:0 "Hinrich Pleskow"
 oe_hbg_kontor_seat_4:0 "Novgorod Peterhof Kontor Court"
 oe_hbg_kontor_seat_4_desc:0 "Palisaded Hanseatic merchant court of St. Peter (Peterhof) in Novgorod, channeling Russian furs and beeswax westward in exchange for silver and woollens while Novgorod retains full sovereignty."
 oe_hbg_kontor:0 "Hanseatic Overseas Kontor"
 oe_hbg_kontor_desc:0 "A building-based Hanseatic Overseas Kontor chartered by Lubeck inside a major foreign port. It manages staple trade, guild justice, and naval provisioning from its walled hall without detaching any territorial land from the host realm."
 LEAD_oe_hbg_kontor:0 "$LIST$ is a [SUBJECT_TYPE.GetName]"
 AM_oe_hbg_kontor:0 "[SUBJECT_TYPE.GetName] of $LIST$."
 oe_hbg_kontor_call_tt:0 "Can be called into offensive wars when at the Compliant loyalty tier."
 oe_hbg_kontor_defend_tt:0 "Automatically joins defensive wars when at the Normal or Compliant loyalty tier."
 oe_hbg_kontor_reform:0 "Hanseatic Kontor Aldermanate"
 oe_hbg_kontor_reform_desc:0 "Building-based mercantile governance of a Hanseatic Kontor led by elected Aldermen (Aldermanner), coordinating overseas staple revenue, sailors, and convoy protection."
 STATIC_MODIFIER_NAME_oe_hbg_seat_prosperous_mod:0 "Thriving Hanseatic Kontor"
 STATIC_MODIFIER_DESC_oe_hbg_seat_prosperous_mod:0 "The local Hanseatic Kontor thrives under Lubeck's charter, drawing merchant cogs, expanding trade volume, and enriching city workshops."
 STATIC_MODIFIER_NAME_oe_hbg_seat_friction_mod:0 "Restive Hanseatic Kontor"
 STATIC_MODIFIER_DESC_oe_hbg_seat_friction_mod:0 "Disputes between Hanseatic aldermen and local guildmasters over customs exemptions stir mild commercial friction in port."
 STATIC_MODIFIER_NAME_oe_hbg_kontor_compliant_mod:0 "Compliant Hanseatic Kontor"
 STATIC_MODIFIER_DESC_oe_hbg_kontor_compliant_mod:0 "This overseas Kontor faithfully upholds Hansetag ordinances, remitting reliable dividends and supporting Hanseatic convoys."
 STATIC_MODIFIER_NAME_oe_hbg_kontor_restive_mod:0 "Restive Hanseatic Kontor"
 STATIC_MODIFIER_DESC_oe_hbg_kontor_restive_mod:0 "Disagreements over Hansetag tolls and shipping quotas have cooled coordination between this Kontor and Lubeck."
 STATIC_MODIFIER_NAME_oe_hbg_mod_dec_hanseatic_diet:0 "Hansetag & Kontor Dividend"
 STATIC_MODIFIER_DESC_oe_hbg_mod_dec_hanseatic_diet:0 "Harmonized tariffs, convoy schedules, and Kontor dividends ratified at the Hansetag swell maritime revenue and burgher confidence."
 STATIC_MODIFIER_NAME_oe_hbg_mod_dec_hansa_empire:0 "North-Baltic Hanseatic Federation"
 STATIC_MODIFIER_DESC_oe_hbg_mod_dec_hansa_empire:0 "Four great overseas Kontors and federated North-Baltic ports weld the League into a sovereign commercial federation commanding northern sea lanes."
 STATIC_MODIFIER_NAME_oe_hbg_mod_dec_golden_fleece:0 "Order of the Golden Fleece"
 STATIC_MODIFIER_DESC_oe_hbg_mod_dec_golden_fleece:0 "Europe's most illustrious chivalric order binds Burgundian, Flemish, and imperial magnates to our banner with unmatched courtly prestige and heavy cavalry vigor."
 STATIC_MODIFIER_NAME_oe_hbg_mod_dec_lotharingia:0 "Crown of Lotharingia & Middle Francia"
 STATIC_MODIFIER_DESC_oe_hbg_mod_dec_lotharingia:0 "Reclaiming Charlemagne's middle realm from Dijon to Bruges and Aachen restores Lotharingia as a sovereign power straddling France and the Empire."
 STATIC_MODIFIER_NAME_oe_hbg_mod_dec_alhambra_jihad:0 "Alhambra & Maghrebi Volunteers"
 STATIC_MODIFIER_DESC_oe_hbg_mod_dec_alhambra_jihad:0 "Andalusi mountain levies and Maghrebi volunteers crossing the Strait rally beneath the Alhambra's red towers with fierce defensive resolve."
 STATIC_MODIFIER_NAME_oe_hbg_mod_dec_cordoba_caliphate:0 "Restored Caliphate of Cordoba"
 STATIC_MODIFIER_DESC_oe_hbg_mod_dec_cordoba_caliphate:0 "Restoring the Umayyad Caliphate across Granada, Cordoba, and Seville reignites Andalusi scholarship, conversion zeal, and imperial discipline."
 STATIC_MODIFIER_NAME_oe_hbg_mod_dec_komnenos_claim:0 "Komnenian Imperial Restoration"
 STATIC_MODIFIER_DESC_oe_hbg_mod_dec_komnenos_claim:0 "The Grand Komnenoi unfurl the imperial eagle across the Euxine, rallying Greek armies and siege trains to reclaim the Queen of Cities."
 STATIC_MODIFIER_NAME_oe_hbg_mod_dec_greater_gothia:0 "Principality of Greater Gothia"
 STATIC_MODIFIER_DESC_oe_hbg_mod_dec_greater_gothia:0 "Expanding from the cliff-citadel of Mangup across Crimea, Greater Gothia marries mountain resilience with Black Sea maritime commerce."
 STATIC_MODIFIER_NAME_oe_hbg_mod_reunion_feo:0 "Gothic-Germanic Reunion (Gothia Charter)"
 STATIC_MODIFIER_DESC_oe_hbg_mod_reunion_feo:0 "Reunited after a millennium with Germanic knights on the Crimean shore, Theodoro shares military drill, diplomacy, and Baltic-Pontic trade with the Teutonic Order."
 STATIC_MODIFIER_NAME_oe_hbg_mod_reunion_teu:0 "Gothic-Germanic Reunion (Teutonic Charter)"
 STATIC_MODIFIER_DESC_oe_hbg_mod_reunion_teu:0 "Embracing their long-lost Crimean Gothic kin at Mangup anchors Teutonic Pontus-Krim with fortified allies and rich Black Sea trade."
 STATIC_MODIFIER_NAME_oe_hbg_mod_msn_four_kontors:0 "Network of the Four Great Kontors"
 STATIC_MODIFIER_DESC_oe_hbg_mod_msn_four_kontors:0 "Coordinated franchises in London, Bruges, Bergen, and Novgorod bind northern European commerce tightly to our Hanseatic ledgers."
 STATIC_MODIFIER_NAME_oe_hbg_mod_msn_stralsund_toll:0 "Stralsund Sound Toll Privileges"
 STATIC_MODIFIER_DESC_oe_hbg_mod_msn_stralsund_toll:0 "Secured free passage through the Danish Sound and Scanian herring fairs crowns Hanseatic naval and commercial ascendancy."
 STATIC_MODIFIER_NAME_oe_hbg_mod_msn_baltic_compact:0 "Teutonic-Hanseatic Baltic Compact"
 STATIC_MODIFIER_DESC_oe_hbg_mod_msn_baltic_compact:0 "Reciprocal amber, timber, and grain charters between Hanseatic ports and Marienburg turn the Baltic into a flourishing commercial lake."
 STATIC_MODIFIER_NAME_oe_hbg_mod_msn_hanseatic_coinage:0 "Wendish Silver Mark Standard"
 STATIC_MODIFIER_DESC_oe_hbg_mod_msn_hanseatic_coinage:0 "Standardized Wendish silver coinage circulates smoothly from London to Novgorod, elevating fiscal yield and mercantile trust."
 STATIC_MODIFIER_NAME_oe_hbg_mod_msn_hansa_empire:0 "North-Baltic Commercial Empire"
 STATIC_MODIFIER_DESC_oe_hbg_mod_msn_hansa_empire:0 "From the Thames to the Volkhov, the red-and-white Hanseatic pennant reigns supreme over northern shipping, banking, and maritime power."
 STATIC_MODIFIER_NAME_oe_hbg_mod_msn_flemish_looms:0 "Flemish Looms & Lowland Riches"
 STATIC_MODIFIER_DESC_oe_hbg_mod_msn_flemish_looms:0 "The cloth halls and bustling quays of Bruges, Ghent, and Antwerp pour unmatched commercial wealth into the Burgundian treasury."
 STATIC_MODIFIER_NAME_oe_hbg_mod_msn_burgundian_court:0 "Splendor of the Burgundian Court"
 STATIC_MODIFIER_DESC_oe_hbg_mod_msn_burgundian_court:0 "Flemish painters, solemn court ceremonial, and knightly pageantry make our court the envy of Western Christendom."
 STATIC_MODIFIER_NAME_oe_hbg_mod_msn_golden_fleece:0 "Lances of the Golden Fleece"
 STATIC_MODIFIER_DESC_oe_hbg_mod_msn_golden_fleece:0 "Knights of the Golden Fleece lead Burgundian heavy cavalry charges with dazzling discipline and martial renown."
 STATIC_MODIFIER_NAME_oe_hbg_mod_msn_ordonnance_companies:0 "Burgundian Compagnies d'Ordonnance"
 STATIC_MODIFIER_DESC_oe_hbg_mod_msn_ordonnance_companies:0 "Standing salaried Ordonnance companies combining heavy lancers, pikes, and bronze artillery forge a disciplined modern army."
 STATIC_MODIFIER_NAME_oe_hbg_mod_msn_lotharingia_crown:0 "Sovereign Realm of Lotharingia"
 STATIC_MODIFIER_DESC_oe_hbg_mod_msn_lotharingia_crown:0 "Uniting the Saone, Meuse, and Rhine under the royal crown of Lotharingia stabilizes crown authority and princely loyalty."
 STATIC_MODIFIER_NAME_oe_hbg_mod_msn_charlemagne_empire:0 "Western Empire of Charlemagne"
 STATIC_MODIFIER_DESC_oe_hbg_mod_msn_charlemagne_empire:0 "Crowned in Aachen's Palatine Chapel, our resurrected Western Empire fulfills Charlemagne's dream across the Rhine, Meuse, and Seine."
 STATIC_MODIFIER_NAME_oe_hbg_mod_msn_alhambra_bastion:0 "Sierra Nevada Bastion of Alhambra"
 STATIC_MODIFIER_DESC_oe_hbg_mod_msn_alhambra_bastion:0 "Mountain watchtowers and fortified red-stone citadels across the Sierra Nevada turn Granada into an impregnable southern stronghold."
 STATIC_MODIFIER_NAME_oe_hbg_mod_msn_strait_alliance:0 "Marinid Strait Sea-Bridge"
 STATIC_MODIFIER_DESC_oe_hbg_mod_msn_strait_alliance:0 "Joint shipping and naval patrols across Gibraltar and Ceuta secure steady Maghrebi commerce, sailors, and reinforcements."
 STATIC_MODIFIER_NAME_oe_hbg_mod_msn_andalusi_reconquest:0 "Tide of the Andalusi Revival"
 STATIC_MODIFIER_DESC_oe_hbg_mod_msn_andalusi_reconquest:0 "Surging northward from the Guadalquivir to Toledo, Andalusi hosts shatter rival fortresses and reverse centuries of retreat."
 STATIC_MODIFIER_NAME_oe_hbg_mod_msn_muttawia_hosts:0 "Muttawia & Zenata Vanguard"
 STATIC_MODIFIER_DESC_oe_hbg_mod_msn_muttawia_hosts:0 "Disciplined Andalusi horse and devoted Maghrebi volunteers replenish our ranks with fierce battlefield initiative."
 STATIC_MODIFIER_NAME_oe_hbg_mod_msn_andalusi_scholars:0 "Andalusi House of Wisdom"
 STATIC_MODIFIER_DESC_oe_hbg_mod_msn_andalusi_scholars:0 "Astronomers, physicians, hydraulic engineers, and libraries across Granada and Cordoba spark a dazzling new Andalusi renaissance."
 STATIC_MODIFIER_NAME_oe_hbg_mod_msn_umayyad_caliphate:0 "Authority of the Western Caliphate"
 STATIC_MODIFIER_DESC_oe_hbg_mod_msn_umayyad_caliphate:0 "The restored banner of the Western Caliphate unites Iberia and the Maghreb under radiant prestige, piety, and martial order."
 STATIC_MODIFIER_NAME_oe_hbg_mod_msn_tours_avenged:0 "Tours Avenged: Beyond the Pyrenees"
 STATIC_MODIFIER_DESC_oe_hbg_mod_msn_tours_avenged:0 "Carrying the green-and-white standard beyond the Pyrenees avenges 732 Tours and establishes an invincible Western Caliphate."
 STATIC_MODIFIER_NAME_oe_hbg_mod_msn_euxine_bastion:0 "Bastion of the Euxine Cliffs"
 STATIC_MODIFIER_DESC_oe_hbg_mod_msn_euxine_bastion:0 "Mountain ramparts in Pontus and cliffside citadels at Mangup harden our Black Sea heartland against every invader."
 STATIC_MODIFIER_NAME_oe_hbg_mod_msn_pontic_silk:0 "Pontic Silk-Road Emporium"
 STATIC_MODIFIER_DESC_oe_hbg_mod_msn_pontic_silk:0 "Tabriz silk caravans and Crimean shipping converge in our Euxine ports, enriching merchants and customs coffers alike."
 STATIC_MODIFIER_NAME_oe_hbg_mod_msn_euxine_hegemony:0 "Euxine Maritime Thalassocracy"
 STATIC_MODIFIER_DESC_oe_hbg_mod_msn_euxine_hegemony:0 "Our war galleys command every shipping lane from Trebizond to Kaffa and Calamita, turning the Black Sea into our commercial domain."
 STATIC_MODIFIER_NAME_oe_hbg_mod_msn_blacksea_crown:0 "Crown of Pontus & Crimea"
 STATIC_MODIFIER_DESC_oe_hbg_mod_msn_blacksea_crown:0 "Whether raising Komnenian eagles over the Bosporus or uniting Crimea under Mangup, our royal majesty resounds across the Black Sea."
 STATIC_MODIFIER_NAME_oe_hbg_mod_msn_pontic_bridge:0 "Pontic-Baltic Diplomatic Bridge"
 STATIC_MODIFIER_DESC_oe_hbg_mod_msn_pontic_bridge:0 "Strategic fellowship linking our Black Sea strongholds with northern allies opens overland commerce and mutual martial aid."
 STATIC_MODIFIER_NAME_oe_hbg_mod_msn_blacksea_empire:0 "Sovereign Empire of the Euxine & Straits"
 STATIC_MODIFIER_DESC_oe_hbg_mod_msn_blacksea_empire:0 "Commanding both shores of the Black Sea and the strategic straits crowns our survival epic with enduring imperial sovereignty."
 STATIC_MODIFIER_NAME_oe_hbg_mod_ev1_a:0 "Confirmed Four-Kontor Charters"
 STATIC_MODIFIER_DESC_oe_hbg_mod_ev1_a:0 "Reaffirming the liberties of London, Bruges, Bergen, and Novgorod deepens Kontor loyalty and northern maritime clout."
 STATIC_MODIFIER_NAME_oe_hbg_mod_ev1_b:0 "Hansetag Pfundzoll Levy"
 STATIC_MODIFIER_DESC_oe_hbg_mod_ev1_b:0 "A league-wide Pfundzoll customs levy bolsters our treasury and war-chest at a modest cost to burgher patience."
 STATIC_MODIFIER_NAME_oe_hbg_mod_ev1_c:0 "Lubeck Law Maritime Courts"
 STATIC_MODIFIER_DESC_oe_hbg_mod_ev1_c:0 "Uniform Lubeck Law admiralty courts smooth commercial disputes and raise diplomatic respect across northern ports."
 STATIC_MODIFIER_NAME_oe_hbg_mod_ev2_a:0 "Armed Wendish Cog Warfleet"
 STATIC_MODIFIER_DESC_oe_hbg_mod_ev2_a:0 "High-castle Hanseatic war cogs dominate narrow Baltic straits with fierce naval morale and blockade power."
 STATIC_MODIFIER_NAME_oe_hbg_mod_ev2_b:0 "Sound Free-Passage Accord"
 STATIC_MODIFIER_DESC_oe_hbg_mod_ev2_b:0 "Negotiated Sound exemptions and Scanian market rights keep northern herring and grain flowing peacefully."
 STATIC_MODIFIER_NAME_oe_hbg_mod_ev3_a:0 "Lubeck-Marienburg Baltic Compact"
 STATIC_MODIFIER_DESC_oe_hbg_mod_ev3_a:0 "A reciprocal commercial alliance between the Hansa and the Teutonic Order enriches Baltic shipping and diplomacy."
 STATIC_MODIFIER_NAME_oe_hbg_mod_ev3_teu:0 "Hanseatic Compact: Prussian Ports"
 STATIC_MODIFIER_DESC_oe_hbg_mod_ev3_teu:0 "Hanseatic shipping partnerships stimulate Prussian port revenue, shipbuilding, and Baltic commerce."
 STATIC_MODIFIER_NAME_oe_hbg_mod_ev3_b:0 "Neutral Hanseatic Grain Tariffs"
 STATIC_MODIFIER_DESC_oe_hbg_mod_ev3_b:0 "Preserving commercial neutrality lets our counting houses collect steady brokerage fees from every Baltic shore."
 STATIC_MODIFIER_NAME_oe_hbg_mod_ev4_a:0 "Flanders Dynastic Union Diplomacy"
 STATIC_MODIFIER_DESC_oe_hbg_mod_ev4_a:0 "Deft dynastic statecraft draws Flemish nobles and cloth cities closer into the Burgundian orbit."
 STATIC_MODIFIER_NAME_oe_hbg_mod_ev4_b:0 "Consolidated Treasury of Dijon"
 STATIC_MODIFIER_DESC_oe_hbg_mod_ev4_b:0 "Tightening ducal stewardship across Burgundy's vineyards and salt-works builds a rock-solid domestic treasury."
 STATIC_MODIFIER_NAME_oe_hbg_mod_ev5_a:0 "Grand Chapter of the Golden Fleece"
 STATIC_MODIFIER_DESC_oe_hbg_mod_ev5_a:0 "Inducting Flemish and imperial magnates into the Golden Fleece unites noble loyalty with formidable heavy cavalry."
 STATIC_MODIFIER_NAME_oe_hbg_mod_ev5_b:0 "Burgundian Courtly Patronage"
 STATIC_MODIFIER_DESC_oe_hbg_mod_ev5_b:0 "Lavish patronage of tapestry weavers, painters, and court music elevates domestic harmony and foreign esteem."
 STATIC_MODIFIER_NAME_oe_hbg_mod_ev6_a:0 "Carolingian Imperial Ambition"
 STATIC_MODIFIER_DESC_oe_hbg_mod_ev6_a:0 "Claiming Charlemagne's imperial heritage fires our armies with disciplined resolve and sweeping territorial ambition."
 STATIC_MODIFIER_NAME_oe_hbg_mod_ev6_b:0 "Sovereign Arbiter of West Europe"
 STATIC_MODIFIER_DESC_oe_hbg_mod_ev6_b:0 "Standing as the wealthy royal arbiter between France and the Empire yields diplomatic sway and flourishing commerce."
 STATIC_MODIFIER_NAME_oe_hbg_mod_ev7_a:0 "Oath of the Alhambra Garrison"
 STATIC_MODIFIER_DESC_oe_hbg_mod_ev7_a:0 "Nasrid guardsmen and mountain tribes swear to defend the Red Fortress to the last stone."
 STATIC_MODIFIER_NAME_oe_hbg_mod_ev7_b:0 "Malaga Silk & Strait Diplomacy"
 STATIC_MODIFIER_DESC_oe_hbg_mod_ev7_b:0 "Fine Andalusi silk exports and agile maritime diplomacy with Fez and Genoa buy precious gold and breathing room."
 STATIC_MODIFIER_NAME_oe_hbg_mod_ev8_a:0 "Triumph of Cordoba Reclaimed"
 STATIC_MODIFIER_DESC_oe_hbg_mod_ev8_a:0 "Reclaiming Cordoba and Seville electrifies Andalusi armies for the decisive march on Toledo."
 STATIC_MODIFIER_NAME_oe_hbg_mod_ev8_b:0 "Guadalquivir Irrigation & Craft Guilds"
 STATIC_MODIFIER_DESC_oe_hbg_mod_ev8_b:0 "Restored irrigation canals and tolerant urban craft guilds turn the Guadalquivir valley into an economic powerhouse."
 STATIC_MODIFIER_NAME_oe_hbg_mod_ev9_a:0 "Pyrenean Expedition: Avenging Tours"
 STATIC_MODIFIER_DESC_oe_hbg_mod_ev9_a:0 "Caliphal cavalry columns cross the Pyrenees with blazing discipline to rewrite the verdict of 732 Tours."
 STATIC_MODIFIER_NAME_oe_hbg_mod_ev9_b:0 "Beacon of Andalusi Learning & Trade"
 STATIC_MODIFIER_DESC_oe_hbg_mod_ev9_b:0 "Cordoba's grand academies and Andalusi shipwrights illuminate the Western Mediterranean with learning and maritime wealth."
 STATIC_MODIFIER_NAME_oe_hbg_mod_ev10_a:0 "Eagles of the Grand Komnenoi"
 STATIC_MODIFIER_DESC_oe_hbg_mod_ev10_a:0 "Unfurling the Grand Komnenian eagle steels Pontic soldiers and siege engineers for the return to Constantinople."
 STATIC_MODIFIER_NAME_oe_hbg_mod_ev10_b:0 "Trebizond Silk-Road Gateway"
 STATIC_MODIFIER_DESC_oe_hbg_mod_ev10_b:0 "Welcoming Persian silk caravans and Mediterranean merchants turns Trebizond into the wealthiest harbor on the Euxine."
 STATIC_MODIFIER_NAME_oe_hbg_mod_ev11_a:0 "Cliff-Citadel Oath of Mangup"
 STATIC_MODIFIER_DESC_oe_hbg_mod_ev11_a:0 "Fortifying Mangup's sheer limestone plateau and drilling Crimean Gothic defenders makes Theodoro nigh unconquerable."
 STATIC_MODIFIER_NAME_oe_hbg_mod_ev11_b:0 "Calamita Harbour Black Sea Trade"
 STATIC_MODIFIER_DESC_oe_hbg_mod_ev11_b:0 "Expanding Theodoro's port at Calamita draws Black Sea grain, silk, and steppe merchants into our coffers."
 STATIC_MODIFIER_NAME_oe_hbg_mod_ev12_a:0 "Millennial Gothic-Teutonic Brotherhood"
 STATIC_MODIFIER_DESC_oe_hbg_mod_ev12_a:0 "Crim-Goths and Teutonic knights pledge eternal fellowship at Mangup, blending steppe-hardened resilience with heavy-knight discipline."
 STATIC_MODIFIER_NAME_oe_hbg_mod_ev12_b:0 "Autonomy of Greek-Gothic Gothia"
 STATIC_MODIFIER_DESC_oe_hbg_mod_ev12_b:0 "Honoring ancient linguistic kinship while guarding Mangup's proud Greek-Gothic Orthodox independence wins widespread acclaim."
 oe_hbg_cd_hanseatic_diet_tt:0 "Has not summoned the Hansetag & Kontor Dividend within the last 10 years"
 oe_hbg_hansa_federation_req_tt:0 "Command at least 2 active Hanseatic Kontors OR control at least 8 Locations (directly or via subjects)"
 oe_hbg_lotharingia_pillars_tt:0 "Control at least 2 Lowland or Lotharingian pillar cities (Bruges, Ghent, Antwerp, Luxembourg, Nancy, Metz, or Aachen)"
 oe_hbg_cd_alhambra_jihad_tt:0 "Has not rallied Maghrebi & Andalusi Volunteers within the last 10 years"
 oe_hbg_gothia_reunion_req_tt:0 "Teutonic Pontus-Krim is established, OR we control Kaffa, Solkhat, or at least 4 Locations (directly or via subjects)"
 oe_hbg_dec_hanseatic_diet.title:0 "Summon the Hansetag & Kontor Dividend"
 oe_hbg_dec_hanseatic_diet.desc:0 "Convene envoys from the Wendish towns and our overseas Kontors in London, Bruges, Bergen, and Novgorod to settle staple tariffs, audit silver dividends, and renew league solidarity for the coming decade."
 oe_hbg_dec_hanseatic_diet.a:0 "Open the Hansetag Ledger"
 oe_hbg_dec_hanseatic_diet_tt:0 "Collects #G 100#! base gold plus #G +40#! gold per active overseas Kontor subject, raises Kontor loyalty by #G +10#!, and grants #Y Hansetag & Kontor Dividend#! for #Y 10 years#!."
 oe_hbg_dec_hansa_commercial_empire.title:0 "Proclaim the North-Baltic Hanseatic Federation"
 oe_hbg_dec_hansa_commercial_empire.desc:0 "Transform the loose coalition of Hanseatic ports and overseas Kontors into a permanent sovereign North-Baltic Commercial Federation backed by standardized currency, united war cogs, and royal diplomatic stature."
 oe_hbg_dec_hansa_commercial_empire.a:0 "Proclaim the Hanseatic Commercial Federation"
 oe_hbg_dec_hansa_commercial_empire_tt:0 "Elevates country rank to at least #Y Kingdom#!, grants #G +20#! prestige, boosts Kontor loyalty by #G +15#!, and bestows permanent #Y North-Baltic Hanseatic Federation#!."
 oe_hbg_dec_golden_fleece_order.title:0 "Institute the Order of the Golden Fleece"
 oe_hbg_dec_golden_fleece_order.desc:0 "Establish the supreme chivalric Order of the Golden Fleece at our ducal court, binding Burgundian, Flemish, and imperial magnates in gold-collared brotherhood beneath our banner."
 oe_hbg_dec_golden_fleece_order.a:0 "Bestow the Collars of the Golden Fleece"
 oe_hbg_dec_golden_fleece_order_tt:0 "Grants #G +15#! prestige, #G +8#! army tradition, permanent #Y Order of the Golden Fleece#!, and convenes the Grand Chapter ceremony."
 oe_hbg_dec_proclaim_lotharingia.title:0 "Proclaim the Kingdom of Lotharingia (Middle Francia)"
 oe_hbg_dec_proclaim_lotharingia.desc:0 "With Dijon united to the wealth of Flanders and the Rhine-Meuse heartland, claim the royal diadem of Lotharingia — restoring Charlemagne's Middle Francia as a sovereign kingdom between France and Germany."
 oe_hbg_dec_proclaim_lotharingia.a:0 "Assume the Royal Crown of Lotharingia"
 oe_hbg_dec_proclaim_lotharingia_tt:0 "Elevates country rank to at least #Y Kingdom#!, grants #G +25#! prestige, cores held Lotharingian capitals, grants permanent #Y Crown of Lotharingia & Middle Francia#!, and triggers the coronation event."
 oe_hbg_dec_alhambra_jihad.title:0 "Rally Maghrebi & Andalusi Volunteers"
 oe_hbg_dec_alhambra_jihad.desc:0 "Sound the call from the red towers of the Alhambra across the Strait of Gibraltar, summoning Andalusi mountain warriors and Maghrebi volunteer horsemen to defend Al-Andalus and strike back northward."
 oe_hbg_dec_alhambra_jihad.a:0 "Summon the Volunteers of the Strait"
 oe_hbg_dec_alhambra_jihad_tt:0 "Grants #G +0.85#! yearly manpower, #G +8#! army tradition, #Y Alhambra & Maghrebi Volunteers#! for #Y 10 years#!, and #G +60#! gold plus goodwill if Morocco is at peace with us."
 oe_hbg_dec_restore_cordoba_caliphate.title:0 "Proclaim the Caliphate of Cordoba & Al-Andalus"
 oe_hbg_dec_restore_cordoba_caliphate.desc:0 "Holding Granada, Cordoba, and Sevilla once more, rededicate the Great Mosque of Cordoba and proclaim the restored Umayyad Caliphate of Al-Andalus to lead Western Islam into a new imperial era."
 oe_hbg_dec_restore_cordoba_caliphate.a:0 "Proclaim the Caliphate of Cordoba"
 oe_hbg_dec_restore_cordoba_caliphate_tt:0 "Elevates country rank to #Y Empire#!, grants #G +30#! prestige and #G +8#! stability, cores key Andalusi cities, grants permanent #Y Restored Caliphate of Cordoba#!, and triggers the Caliphate proclamation event."
 oe_hbg_dec_komnenos_claim.title:0 "Proclaim the Komnenian Restoration of Constantinople"
 oe_hbg_dec_komnenos_claim.desc:0 "Invoke the bloodline of Alexios I Komnenos from the ramparts of Trebizond, asserting our imperial claim over Constantinople and rallying Pontic Greeks beneath the golden Komnenian eagle."
 oe_hbg_dec_komnenos_claim.a:0 "Unfurl the Grand Komnenian Eagle"
 oe_hbg_dec_komnenos_claim_tt:0 "Elevates rank to #Y Empire#! if holding Constantinople (else #Y Kingdom#! plus a conquest CB on Constantinople), grants #G +20#! prestige, and bestows permanent #Y Komnenian Imperial Restoration#!."
 oe_hbg_dec_gothia_teutonic_reunion.title:0 "Proclaim Greater Gothia & the Gothic-Germanic Reunion"
 oe_hbg_dec_gothia_teutonic_reunion.desc:0 "Elevate the cliff-principality of Mangup-Theodoro into the royal realm of Greater Gothia across Crimea — and if the Teutonic Order has established Pontus-Krim on the Black Sea, seal the epic Millennial Gothic-Germanic Reunion."
 oe_hbg_dec_gothia_teutonic_reunion.a:0 "Proclaim Greater Gothia on the Euxine"
 oe_hbg_dec_gothia_teutonic_reunion_tt:0 "Elevates rank to at least #Y Kingdom#!, grants #G +20#! prestige, cores held Crimean ports, grants permanent #Y Principality of Greater Gothia#!, and seals the mutual #Y Gothic-Germanic Reunion#! with the Teutonic Order if active in Pontus-Krim."
 oe_hbg.1.t:0 "The Hansetag & the Four Great Kontors"
 oe_hbg.1.d:0 "In Lubeck's brick Rathaus, aldermen arriving by cog from London's Steelyard, Bruges, Bergen's Bryggen, and Novgorod's Peterhof lay their silver ledgers before the Hansetag. Confirming their ancient charters will cement Kontor devotion, while hawkish burghers press for an emergency Pfundzoll levy or uniform Lubeck maritime courts."
 oe_hbg.1.a:0 "Confirm the Four Great Kontors' charters and staple liberties"
 oe_hbg.1.b:0 "Levy an emergency Hansetag Pfundzoll across all member ports"
 oe_hbg.1.c:0 "Codify uniform Lubeck Law maritime courts across the League"
 oe_hbg.2.t:0 "Sound Tolls & the Road to Stralsund"
 oe_hbg.2.d:0 "Royal bailiffs along the Oresund and Scanian herring shores have begun seizing Hanseatic cogs and hiking passage tolls to choke northern commerce. Outraged merchants across the Wendish ports demand decisive action — whether by arming a formidable war-cog coalition to force a new Peace of Stralsund or negotiating guaranteed free-passage privileges."
 oe_hbg.2.a:0 "Arm the Wendish war cogs and break Danish control of the Sound"
 oe_hbg.2.b:0 "Negotiate guaranteed free-passage rights and Scanian fair charters"
 oe_hbg.3.t:0 "The Teutonic-Hanseatic Baltic Compact"
 oe_hbg.3.d:0 "Envoys from the Grand Master at Marienburg have docked along the Trave bearing chests of Samland amber, Vistula grain samples, and oak ship-timber contracts. A formal Baltic Compact will bind Teutonic fortress ports with Hanseatic merchant fleets to the benefit of both realms, though cautious patricians prefer preserving strict commercial neutrality."
 oe_hbg.3.a:0 "Seal the Marienburg-Lubeck Baltic Compact with the Teutonic Order"
 oe_hbg.3.b:0 "Preserve strict Hanseatic neutrality and collect brokerage tariffs"
 oe_hbg.4.t:0 "Dijon & the Golden Prize of Flanders"
 oe_hbg.4.d:0 "Between the flourishing vineyards of Dijon and the teeming cloth halls of Bruges and Ghent lies the richest inheritance in Western Europe. Burgundian jurists and envoys debate whether to pour our prestige into winning the Flemish estates through dynastic marriage and diplomacy, or first consolidate the fiscal sinews of the Two Burgundies at home."
 oe_hbg.4.a:0 "Pursue dynastic union and courtly goodwill across Flanders"
 oe_hbg.4.b:0 "Consolidate Dijon's ducal treasury and domestic estates first"
 oe_hbg.5.t:0 "Grand Chapter of the Order of the Golden Fleece"
 oe_hbg.5.d:0 "Beneath crimson banners embroidered with flint, steel, and golden rams' fleeces, the noblest lords of Burgundy, Flanders, and the Rhineland gather for the Grand Chapter of our chivalric order. Honoring martial magnates will forge an unstoppable heavy-cavalry aristocracy, while elevating courtly arts and diplomacy will dazzle all Christendom."
 oe_hbg.5.a:0 "Induct martial magnates to forge an elite chivalric vanguard"
 oe_hbg.5.b:0 "Patronize Flemish masters, tapestries, and courtly diplomacy"
 oe_hbg.6.t:0 "Crown of Lotharingia & Charlemagne's Dream"
 oe_hbg.6.d:0 "From the Saone to the North Sea, our chroniclers trace an unbroken line from Emperor Lothair I and Charlemagne's throne at Aachen to the banners of Burgundy. Now that our realm rivals both Paris and the imperial electors, we must proclaim whether our Middle Kingdom seeks Charlemagne's Western Imperial diadem or prosperous mediation between France and Germany."
 oe_hbg.6.a:0 "Claim Charlemagne's imperial mantle across the Rhine and Seine"
 oe_hbg.6.b:0 "Rule as the wealthy sovereign arbiter between France and Germany"
 oe_hbg.7.t:0 "Last Pearl of Al-Andalus: The Alhambra Rally"
 oe_hbg.7.d:0 "Sunlight gilds the red towers of the Alhambra above Granada as Castilian banners muster north of the Sierra Nevada. Though only a single Andalusi emirate still stands in Iberia, our terraced mountain passes, renowned Malaga silk workshops, and kinship with Fez across the Strait offer two proven paths to defiance and survival."
 oe_hbg.7.a:0 "Fortify the mountain passes and rally Nasrid & Strait defenders"
 oe_hbg.7.b:0 "Deploy Malaga silk wealth and agile diplomacy with Fez and Genoa"
 oe_hbg.8.t:0 "Cordoba & Sevilla Reclaimed: The Tide Turns"
 oe_hbg.8.d:0 "Cheers echo beneath the striped arches of Cordoba's Great Mosque and the tower of Sevilla as Andalusi horsemen ride triumphant through the Guadalquivir valley. Centuries of retreat have been overturned in a single generation — now the emirate must decide whether to hurl its momentum straight toward Toledo or rebuild the legendary workshops and canals of Al-Andalus."
 oe_hbg.8.a:0 "Press the reconquest northward with relentless siege momentum"
 oe_hbg.8.b:0 "Restore Andalusi irrigation canals, crafts, and scholarly tolerance"
 oe_hbg.9.t:0 "Caliphate of Al-Andalus & the Pyrenees Horizon"
 oe_hbg.9.d:0 "Ambassadors from Fez, Tunis, Cairo, and Damascus salute the restored Umayyad Caliphate of Cordoba. As banners flutter toward the snowy passes of the Pyrenees, old chronicles recall the fateful autumn of 732 at Tours and Poitiers — challenging our Caliphate to either march north into Gaul or crown Cordoba the unrivaled beacon of Islamic science and ocean trade."
 oe_hbg.9.a:0 "Cross the Pyrenees and avenge the 732 Battle of Tours"
 oe_hbg.9.b:0 "Crown Cordoba the beacon of Western Islamic science and sea trade"
 oe_hbg.10.t:0 "Grand Komnenos Eagles of Trebizond"
 oe_hbg.10.d:0 "Between the misty Pontic Alps and the rolling waves of the Euxine, the palace of Trebizond gleams with imperial purple and gold. Heirs to Alexios I Komnenos, our court weighs its historic destiny: sharpen our banners for a daring Komnenian return to Constantinople, or harness the Persian silk caravans pouring down from Tabriz to build unmatched maritime riches."
 oe_hbg.10.a:0 "Reassert the Grand Komnenian claim to Constantinople"
 oe_hbg.10.b:0 "Expand Trebizond as the premier Silk-Road emporium of the Euxine"
 oe_hbg.11.t:0 "Last Goths of Mangup-Theodoro"
 oe_hbg.11.d:0 "High atop the sheer limestone tableland of Mangup, Byzantine double-headed eagles flutter beside ancient Crimean Gothic banners — the final surviving enclave of the East Germanic Goths, united in Orthodox faith with Pontic Greeks. Surrounded by Genoa's Kaffa and the Golden Horde's steppes, Theodoro must choose between hardening its cliff-citadel or expanding Calamita's thriving harbor."
 oe_hbg.11.a:0 "Carve impregnable defenses into Mangup and drill Gothic warriors"
 oe_hbg.11.b:0 "Develop Calamita harbour into a nimble Black Sea trade hub"
 oe_hbg.12.t:0 "Black Sea Gothic-Germanic Millennial Reunion"
 oe_hbg.12.d:0 "An astonishing encounter unfolds beneath the cliffs of Mangup: armored knights of the Teutonic Order — advancing from Prussia across the steppe toward Pontus-Krim — converse in halting, miraculously intelligible ancestral words with the elders of Crimean Gothia, parted since the Great Migration a thousand years ago! Both realms can seal an extraordinary Gothic-Teutonic brotherhood across the Black Sea, or cherish their shared heritage while keeping Mangup strictly autonomous."
 oe_hbg.12.a:0 "Seal the Millennial Gothic-Teutonic Brotherhood of the Black Sea"
 oe_hbg.12.b:0 "Honor our ancient kinship while guarding Mangup's proud autonomy"
 oe_msn_hansa_destiny:0 "Queen of the Hansa: Four Kontors & North-Baltic Empire"
 oe_msn_hansa_destiny_DESCRIPTION:0 "Lead Lubeck, Hamburg, or Bremen from a Wendish trading league into an unstoppable North-Baltic commercial empire: expand the Four Great Overseas Kontors, humble Danish Sound tolls at Stralsund, seal the Baltic Compact with the Teutonic Order, and unify northern shipping."
 oe_msn_hansa_destiny_CRITERIA_DESCRIPTION:0 "Play as Lubeck, Hamburg, or Bremen and control Lubeck, Hamburg, or Bremen."
 oe_msn_hansa_destiny_BUTTON_TOOLTIP:0 "Embark upon the Hanseatic Four Kontors and North-Baltic Commercial Empire mission tree."
 oe_msn_hansa_destiny_BUTTON_DETAILS:0 "8 cohesive tasks across 2 branches: Four Great Kontors & Peace of Stralsund, and Wendish Ports & Teutonic-Hanseatic Baltic Compact."
 oe_msn_hansa_01_queen_of_hansa:0 "Queen of the Hanseatic Ports"
 oe_msn_hansa_01_queen_of_hansa_desc:0 "Consolidate the counting houses, quays, and civic treasury of our Hanseatic metropolis so every northern guild looks to our council seal."
 oe_msn_hansa_01_queen_of_hansa_req_tt:0 "Control Lubeck, Hamburg, or Bremen with at least 5 Stability, and hold a Marketplace, Dock, Customs House, or at least 120 Gold."
 oe_msn_hansa_02_four_great_kontors:0 "Charter the Four Great Kontors"
 oe_msn_hansa_02_four_great_kontors_desc:0 "Synchronize our privileged trading courts in London, Bruges, Bergen, and Novgorod — or convene the Hansetag to assert league-wide commercial franchises."
 oe_msn_hansa_02_four_great_kontors_req_tt:0 "Hold at least 2 active Hanseatic Kontor subjects, OR enact Summon the Hansetag & Kontor Dividend, OR hold ports with 180 Gold and 8 Stability."
 oe_msn_hansa_03_wendish_cog_fleet:0 "Wendish War-Cog Armada"
 oe_msn_hansa_03_wendish_cog_fleet_desc:0 "Fit out tall-castled Hanseatic war cogs in our Baltic and North Sea shipyards to deter royal tolls and enforce freedom of the seas."
 oe_msn_hansa_03_wendish_cog_fleet_req_tt:0 "Possess ports and either field at least 14 Ships, hold 18 Naval Tradition, or maintain a Shipyard or Dry Dock."
 oe_msn_hansa_04_peace_of_stralsund:0 "Peace of Stralsund"
 oe_msn_hansa_04_peace_of_stralsund_desc:0 "Break Danish attempts to choke the Oresund and Scanian herring fairs, compelling Northern crowns to honor Hanseatic maritime liberty."
 oe_msn_hansa_04_peace_of_stralsund_req_tt:0 "Control Stralsund, Copenhagen, Malmo, Lund, or Visby (directly or via subject), OR resolve the Sound Tolls & Peace of Stralsund event with 20 Naval Tradition and 10 Stability."
 oe_msn_hansa_05_wendish_cities_compact:0 "Unite the Wendish & Elbe Ports"
 oe_msn_hansa_05_wendish_cities_compact_desc:0 "Bind the core Hanseatic ports of the Trave, Elbe, Weser, and Mecklenburg shore into an unbreakable commercial core."
 oe_msn_hansa_05_wendish_cities_compact_req_tt:0 "Hold at least 4 Locations (directly or via subjects), OR hold Lubeck alongside another Wendish/Elbe port, OR ally Lubeck or Hamburg."
 oe_msn_hansa_06_teutonic_baltic_compact:0 "Teutonic-Hanseatic Baltic Compact"
 oe_msn_hansa_06_teutonic_baltic_compact_desc:0 "Forge a lasting Baltic partnership with Marienburg's Grand Master over amber, timber, and grain — or directly secure Konigsberg, Riga, or Tallinn."
 oe_msn_hansa_06_teutonic_baltic_compact_req_tt:0 "Seal the Teutonic-Hanseatic Baltic Compact, ally or hold >= 40 opinion with the Teutonic Order, OR control Konigsberg, Riga, or Tallinn."
 oe_msn_hansa_07_north_sea_staple:0 "Wendish Mint & North Sea Staple"
 oe_msn_hansa_07_north_sea_staple_desc:0 "Standardize Hanseatic silver coinage across our overseas staples from the Thames to the Volkhov as the Renaissance dawns."
 oe_msn_hansa_07_north_sea_staple_req_tt:0 "Reach the Age of Renaissance or later with 10 Stability, and either hold 3+ active Kontors, 8+ Locations (directly or via subjects), or 400 Gold."
 oe_msn_hansa_08_commercial_empire:0 "North-Baltic Hanseatic Commercial Empire"
 oe_msn_hansa_08_commercial_empire_desc:0 "Crown two centuries of mercantile statecraft by proclaiming a sovereign North-Baltic Hanseatic Commercial Empire unrivaled across northern seas."
 oe_msn_hansa_08_commercial_empire_req_tt:0 "Reach the Age of Renaissance or later with 12 Stability, and either proclaim the North-Baltic Hanseatic Federation OR hold 12+ Locations and 25 Naval Tradition."
 oe_msn_bur_destiny:0 "House of Burgundy: Golden Fleece, Lotharingia & Middle Francia"
 oe_msn_bur_destiny_DESCRIPTION:0 "Rise from the Duchy of Dijon to unite both Burgundies, acquire the wealthy looms of Flanders and the Low Countries, institute the Order of the Golden Fleece, reclaim the royal Crown of Lotharingia, and fulfill Charlemagne's Western Empire."
 oe_msn_bur_destiny_CRITERIA_DESCRIPTION:0 "Play as Burgundy (or Lotharingia formed by Burgundy) and control Dijon, Bruges, or Aachen."
 oe_msn_bur_destiny_BUTTON_TOOLTIP:0 "Embark upon the Burgundy-Lotharingia and Charlemagne Western Empire mission tree."
 oe_msn_bur_destiny_BUTTON_DETAILS:0 "8 cohesive tasks across 2 branches: Two Burgundies & Low Countries Wealth, and Golden Fleece, Kingdom of Lotharingia & Charlemagne's Western Empire."
 oe_msn_bur_01_two_burgundies:0 "Unite the Two Burgundies"
 oe_msn_bur_01_two_burgundies_desc:0 "Bind the Duchy of Burgundy at Dijon with the Free County around Besancon and Dole, fusing both banks of the Saone under one ducal crown."
 oe_msn_bur_01_two_burgundies_req_tt:0 "Control Dijon with 5 Stability, and either control Besancon or Dole (directly or via subject) OR hold at least 15 Locations."
 oe_msn_bur_02_flanders_lowlands:0 "Acquire Flanders & the Low Countries"
 oe_msn_bur_02_flanders_lowlands_desc:0 "Secure the prosperous cloth cities of Flanders, Artois, and Brabant by marriage, vassalage, or sword."
 oe_msn_bur_02_flanders_lowlands_req_tt:0 "Control Bruges & Ghent, Antwerp & Brussels, or Lille & Arras (directly or via subject), OR ally or vassalize Flanders."
 oe_msn_bur_03_rhine_maas_corridor:0 "Bridge the Rhine-Meuse Corridor"
 oe_msn_bur_03_rhine_maas_corridor_desc:0 "Link our Burgundian heartland to our Lowland provinces across Luxembourg, Lorraine, Namur, Liege, or Holland."
 oe_msn_bur_03_rhine_maas_corridor_req_tt:0 "Control at least one key bridgehead (Luxembourg, Nancy, Metz, Liege, Namur, or Amsterdam) directly or via subject."
 oe_msn_bur_04_court_of_dijon:0 "Splendor of the Burgundian Court"
 oe_msn_bur_04_court_of_dijon_desc:0 "Make Dijon and Bruges the undisputed artistic, musical, and chivalric capital of Renaissance Western Europe."
 oe_msn_bur_04_court_of_dijon_req_tt:0 "Reach the Age of Renaissance or later with 30 Prestige, 10 Stability, and at least 20 Locations (directly or via subjects)."
 oe_msn_bur_05_order_golden_fleece:0 "Institute the Order of the Golden Fleece"
 oe_msn_bur_05_order_golden_fleece_desc:0 "Found the prestigious Order of the Golden Fleece to rally the highest nobility of Burgundy and the Low Countries around our throne."
 oe_msn_bur_05_order_golden_fleece_req_tt:0 "Enact Institute the Order of the Golden Fleece, OR hold at least 25 Prestige, 15 Army Tradition, and 8 Stability."
 oe_msn_bur_06_chivalric_ordonnance:0 "Compagnies d'Ordonnance"
 oe_msn_bur_06_chivalric_ordonnance_desc:0 "Replace unruly feudal levies with salaried Burgundian Ordonnance companies combining heavy lancers, pikemen, and bronze artillery."
 oe_msn_bur_06_chivalric_ordonnance_req_tt:0 "Have at least 8 Stability and either 20 Army Tradition or at least 18 Locations (directly or via subjects)."
 oe_msn_bur_07_kingdom_of_lotharingia:0 "Proclaim Kingdom of Lotharingia"
 oe_msn_bur_07_kingdom_of_lotharingia_desc:0 "Elevate our sprawling realm between France and Germany into the sovereign royal Kingdom of Lotharingia — Middle Francia reborn."
 oe_msn_bur_07_kingdom_of_lotharingia_req_tt:0 "Enact Proclaim the Kingdom of Lotharingia, form Lotharingia, OR hold Dijon, Aachen, and Nancy."
 oe_msn_bur_08_charlemagne_western_empire:0 "Charlemagne's Western Empire"
 oe_msn_bur_08_charlemagne_western_empire_desc:0 "Stand crowned inside Aachen's Palatine Chapel as Emperor of the West, reuniting the Carolingian heartlands across the Rhine, Meuse, and Seine."
 oe_msn_bur_08_charlemagne_western_empire_req_tt:0 "Reach Age of Renaissance+ with 15 Stability, 35+ Locations, control Dijon & Aachen plus Paris, Cologne, Strasbourg, or Reims."
 oe_msn_gra_destiny:0 "Alhambra Rising: Al-Andalus & the Caliphate of Cordoba"
 oe_msn_gra_destiny_DESCRIPTION:0 "Defend the last Nasrid pearl of Granada, forge the Marinid Strait alliance, reverse the Reconquista across Cordoba, Sevilla, and Toledo, restore the Umayyad Caliphate of Al-Andalus, and march over the Pyrenees to avenge 732 Tours."
 oe_msn_gra_destiny_CRITERIA_DESCRIPTION:0 "Play as Granada (or Al-Andalus formed from Granada) and control Granada, Cordoba, or Sevilla."
 oe_msn_gra_destiny_BUTTON_TOOLTIP:0 "Embark upon the Granada & Al-Andalus Umayyad Caliphate mission tree."
 oe_msn_gra_destiny_BUTTON_DETAILS:0 "8 cohesive tasks across 2 branches: Defend the Alhambra & Reclaim Cordoba-Sevilla-Toledo, and Ghazawat Volunteers, Andalusi Golden Age & Avenge 732 Tours."
 oe_msn_gra_01_defend_alhambra:0 "Defend the Red Fortress of Alhambra"
 oe_msn_gra_01_defend_alhambra_desc:0 "Fortify Granada, Malaga, and Almeria across the Sierra Nevada ridges so no Castilian siege can snuff out the last lantern of Al-Andalus."
 oe_msn_gra_01_defend_alhambra_req_tt:0 "Control Granada, Malaga, and Almeria with 5 Stability, and hold a Castle or at least 120 Gold."
 oe_msn_gra_02_marinid_strait_alliance:0 "Marinid Strait Alliance"
 oe_msn_gra_02_marinid_strait_alliance_desc:0 "Keep the Strait of Gibraltar open to Maghrebi fleets and Zenata horsemen by securing the Strait ports or cementing our alliance with Morocco."
 oe_msn_gra_02_marinid_strait_alliance_req_tt:0 "Control Gibraltar, Algeciras, or Ceuta (directly or via subject), OR ally / hold >= 40 opinion with Morocco."
 oe_msn_gra_03_reclaim_cordoba_sevilla:0 "Reclaim Cordoba & Sevilla"
 oe_msn_gra_03_reclaim_cordoba_sevilla_desc:0 "Sweep down the Guadalquivir valley to raise the Nasrid banner once more above the Great Mosque of Cordoba and the Giralda of Sevilla."
 oe_msn_gra_03_reclaim_cordoba_sevilla_req_tt:0 "Control both Cordoba and Sevilla (directly or via subject)."
 oe_msn_gra_04_toledo_heartland:0 "March to Toledo & the Tagus"
 oe_msn_gra_04_toledo_heartland_desc:0 "Break through the Castilian Meseta to reclaim historic Tulaytulah (Toledo) and secure the eastern or western marches of Iberia."
 oe_msn_gra_04_toledo_heartland_req_tt:0 "Control Toledo together with at least one of Jaen, Murcia, Valencia, Badajoz, or Cadiz (directly or via subject)."
 oe_msn_gra_05_ghazawat_volunteers:0 "Rally the Ghazawat Volunteers"
 oe_msn_gra_05_ghazawat_volunteers_desc:0 "Organize zealous Andalusi infantry and Maghrebi frontier cavalry into a disciplined striking host ready for offensive campaigns."
 oe_msn_gra_05_ghazawat_volunteers_req_tt:0 "Enact Rally Maghrebi & Andalusi Volunteers, OR hold at least 15 Army Tradition and 6 Stability."
 oe_msn_gra_06_andalusi_golden_age:0 "Andalusi Golden Age Reborn"
 oe_msn_gra_06_andalusi_golden_age_desc:0 "Revive the famed academies, observatories, and irrigation gardens of medieval Al-Andalus as the Renaissance illuminates the Mediterranean."
 oe_msn_gra_06_andalusi_golden_age_req_tt:0 "Reach Age of Renaissance+ with 10 Stability, and either hold 25 Prestige or maintain a Madrasa, University, or Library."
 oe_msn_gra_07_umayyad_caliphate:0 "Restore the Caliphate of Cordoba"
 oe_msn_gra_07_umayyad_caliphate_desc:0 "Re-establish the Umayyad Caliphate of Al-Andalus in full imperial splendor from the Alhambra to the banks of the Guadalquivir."
 oe_msn_gra_07_umayyad_caliphate_req_tt:0 "Enact Proclaim the Caliphate of Cordoba & Al-Andalus, form Al-Andalus, OR control Granada, Cordoba, and Sevilla."
 oe_msn_gra_08_avenge_tours_732:0 "Avenge 732 Tours Across the Pyrenees"
 oe_msn_gra_08_avenge_tours_732_desc:0 "Drive the banners of the restored Caliphate through the Upper March and over the Pyrenees into Septimania and Aquitaine, overturning 732 Tours."
 oe_msn_gra_08_avenge_tours_732_req_tt:0 "Reach Age of Renaissance+ with 12 Stability, 35+ Locations, control Cordoba & Toledo plus Zaragoza, Narbonne, Toulouse, Bordeaux, Poitiers, or Tours."
 oe_msn_blacksea_destiny:0 "Eagles of the Euxine: Komnenian Trebizond & Gothic Theodoro"
 oe_msn_blacksea_destiny_DESCRIPTION:0 "Rise from the mountain ramparts of Trebizond or the cliff-citadel of Mangup-Theodoro to master Pontic-Silk commerce, pursue either the Grand Komnenos Restoration at Constantinople or Greater Crimean Gothia, and seal the Millennial Gothic-Germanic Reunion with Teutonic Pontus-Krim."
 oe_msn_blacksea_destiny_CRITERIA_DESCRIPTION:0 "Play as Trebizond or Theodoro and control Trebizond, Theodoro, or Constantinople."
 oe_msn_blacksea_destiny_BUTTON_TOOLTIP:0 "Embark upon the Black Sea Komnenos & Crimean Gothia mission tree."
 oe_msn_blacksea_destiny_BUTTON_DETAILS:0 "8 cohesive tasks across 2 branches: Bastion of the Euxine & Pontic-Silk Thalassocracy, and Komnenos Restoration OR Greater Gothia & Teutonic Reunion."
 oe_msn_blk_01_bastion_of_euxine:0 "Bastion of the Black Sea"
 oe_msn_blk_01_bastion_of_euxine_desc:0 "Reinforce the steep mountain passes of Trebizond or the sheer limestone crags of Mangup-Theodoro so surrounding hordes and emirates shatter at our gates."
 oe_msn_blk_01_bastion_of_euxine_req_tt:0 "Control Trebizond or Theodoro with 5 Stability, and hold a Castle, Coastal Fort, or at least 100 Gold."
 oe_msn_blk_02_pontic_silk_emporium:0 "Pontic Silk & Crimean Emporium"
 oe_msn_blk_02_pontic_silk_emporium_desc:0 "Turn our Black Sea harbors into indispensable clearinghouses for Tabriz silk caravans, Italian galleys, and northern steppe furs."
 oe_msn_blk_02_pontic_silk_emporium_req_tt:0 "Hold ports and expand around Trebizond (with Giresun/Rize/Taman/Sinop) OR around Theodoro (with Kaffa/Solkhat/Taman or 160 Gold)."
 oe_msn_blk_03_komnenos_or_gothia_ascendant:0 "Komnenos Revival or Gothia Ascendant"
 oe_msn_blk_03_komnenos_or_gothia_ascendant_desc:0 "Break out of coastal isolation: reclaim Pontic coastal strongholds under Trebizond's eagles, or sweep across Crimea from Mangup-Theodoro."
 oe_msn_blk_03_komnenos_or_gothia_ascendant_req_tt:0 "As Trebizond control Sinop, Samsun, Amasra, Batumi, or Constantinople; OR as Theodoro control Kaffa, Solkhat, Qirq-Yer, Taman, or Tana."
 oe_msn_blk_04_euxine_thalassocracy:0 "Pontic-Silk Trade Hegemony"
 oe_msn_blk_04_euxine_thalassocracy_desc:0 "Dominate the shipping lanes connecting Trebizond, Kaffa, Varna, and the Bosporus with a seasoned Black Sea warfleet."
 oe_msn_blk_04_euxine_thalassocracy_req_tt:0 "Reach Age of Renaissance+ with 10 Stability, 10+ Locations (directly or via subjects), and 15 Naval Tradition or 12 Ships."
 oe_msn_blk_05_imperial_heritage_or_mangup:0 "Heirs of Pontus & Crimean Gothia"
 oe_msn_blk_05_imperial_heritage_or_mangup_desc:0 "Assert our ancient Christian sovereignty on the Black Sea — whether as rightful Grand Komnenoi or as proud Gothic-Greek princes of Mangup."
 oe_msn_blk_05_imperial_heritage_or_mangup_req_tt:0 "Be Christian with at least 15 Prestige and 6 Stability."
 oe_msn_blk_06_straits_or_crimean_crown:0 "Constantinople Restored or Crimea Unified"
 oe_msn_blk_06_straits_or_crimean_crown_desc:0 "Crown our regional resurgence by asserting the Komnenian claim upon Constantinople or forging Greater Gothia across the Crimean peninsula."
 oe_msn_blk_06_straits_or_crimean_crown_req_tt:0 "Control Constantinople, enact the Komnenian Restoration or Greater Gothia decision, OR control Theodoro, Kaffa, and Solkhat."
 oe_msn_blk_07_gothic_germanic_bridge:0 "Gothic-Germanic Reunion & Pontic Bridge"
 oe_msn_blk_07_gothic_germanic_bridge_desc:0 "Embrace the historic Crimean meeting with Teutonic Pontus-Krim — or stand as a mighty Renaissance Black Sea power bridging Mediterranean and northern routes."
 oe_msn_blk_07_gothic_germanic_bridge_req_tt:0 "Seal the Gothic-Germanic Reunion, stand at peace with Teutonic Pontus-Krim once established, OR hold 16+ Locations in the Age of Renaissance or later."
 oe_msn_blk_08_sovereign_of_pontus_and_bosphorus:0 "Sovereign of the Black Sea & Straits"
 oe_msn_blk_08_sovereign_of_pontus_and_bosphorus_desc:0 "Ascend to imperial rank over the Euxine shores, immortalizing either the Grand Komnenian Empire or the sovereign Crimean Gothic Empire."
 oe_msn_blk_08_sovereign_of_pontus_and_bosphorus_req_tt:0 "Reach Age of Renaissance+ with 15 Stability, 20+ Locations, and control Constantinople, seal the Gothic-Teutonic Reunion, OR hold Trebizond, Theodoro, and Kaffa."
