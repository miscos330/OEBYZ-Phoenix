l_english:
 OE_RW_ARABIA: "Arabia"
 OE_RW_ARABIA_DESC: "The sea roads of the Red Sea, the oases of Hail and the incense ports of the south await a new imperial settlement."
 OE_RW_ARABIA_OPEN: "Open Arabian Actions"
 OE_RW_ARABIA_ACTIONS: "The Arabian Campaign"
 OE_RW_ARABIA_HINT: "Click the map to plan the conquest and government of Arabia."
 OE_RW_MECCA: "Mecca"
 OE_RW_MECCA_OWNER: "The current ruler of Mecca"
 OE_HEG_ARABIA_ACTIONS_HINT: "After planning the Arabian invasion, choose an expedition target and determine the future of the Ghassanid Kingdom."
 oe_heg_plan_arabia: "Plan the Invasion of Arabia"
 oe_heg_plan_arabia_desc: "Spend #Y 2,000 ducats#! to bring the Arabian Peninsula into the Roman World. This one-time action is required for all subsequent actions in this panel."
 oe_heg_plan_arabia_effect: "Spend #Y 2,000 ducats#!, include the Arabian Peninsula in the Roman World and unlock the remaining Arabian actions."
 oe_heg_arabia_plan_done: "The Arabian invasion has been planned"
 oe_rw_arabia_included: "Arabia included in the Roman World"
 OE_HEG_ARABIA_PLAN_REQUIRED: "Completed “Plan the Invasion of Arabia”"
 oe_heg_invade_arabia: "Invade Arabia"
 oe_heg_invade_arabia_desc: "Spend #Y 200 ducats#! and select a country whose capital is in Arabia and which is outside the Byzantine subject hierarchy. Gain a casus belli to take its capital."
 oe_heg_invade_arabia_effect: "Spend #Y 200 ducats#! and gain a #Y Take Capital#! casus belli against the selected country."
 oe_heg_restore_ghassanids: "Restore the Ghassanid Kingdom"
 oe_heg_restore_ghassanids_desc: "Spend #Y 1,000 ducats#! and #Y 25 Political Influence#! to decide the lands and status of the Ghassanid Kingdom: support a united Arabia, or establish a March in Hail. This action may be completed once."
 oe_heg_restore_ghassanids_effect: "Spend #Y 1,000 ducats#! and #Y 25 Political Influence#! to choose the future of the Ghassanid Kingdom."
 oe_heg_ghassanids_restored: "The Ghassanid Kingdom has been restored"
 oe_heg_ghassanids_pending: "The Ghassanid settlement awaits a decision"
 OE_HEG_ARABIA_DIRECT_LAND_REQUIRED: "Byzantium directly owns at least one conquerable location in Arabia."
 OE_GHASSANID_HAIL_REQUIRED: "Byzantium directly owns at least one conquerable location in Hail."
 OE_GHASSANID_KINGDOM: "Ghassanids"
 OE_GHASSANID_KINGDOM_ADJ: "Ghassanid"
 oe_arabian_kingdom: "Arabian Subject Kingdom"
 oe_arabian_kingdom_desc: "An Arabian kingdom owing allegiance to the empire, joining the peninsula through churches, oases and caravan roads. Its autonomy and diplomatic obligations follow those of the Black Sea Kingdom."
 oe_unify_arabia: "Unite Arabia"
 oe_unify_arabia_desc: "With imperial support behind the Ghassanid crown, governors and soldiers unite the scattered oases and ports under a common order."
 oe_conquer_arabia: "Complete Conquest of Arabia"
 oe_conquer_arabia_desc: "The empire has chosen direct rule in Arabia, consolidating its hard-won conquests through its armies and laws."
 oe_ghassanid_restoration.1.t: "A Crown over the Desert"
 oe_ghassanid_restoration.1.d: "From the shores of the Red Sea to the inland oases, merchants bring the same question: after victory, who will keep order along the roads, wells and towns? The Ghassanid name has returned to imperial charters, giving an ancient alliance a new purpose.\n\nSome at court advocate an Orthodox Arabian kingdom, entrusted with the empire’s holdings across the peninsula. Others insist that Roman conquests must remain under Roman rule, with the Ghassanids confined to guarding the oases and caravan roads of Hail. The crown is ready; its weight remains ours to determine."
 oe_ghassanid_restoration.1.a: "We shall support a united Arabian kingdom under the Ghassanids."
 oe_ghassanid_restoration.1.b: "We must govern Arabia ourselves."
 OE_GHASSANID_UNIFIED_EFFECT: "Transfer all directly owned Byzantine locations in Arabia to the #Y Ghassanid Kingdom#!: Orthodox, Arabian culture of the Roman culture group, Kingdom rank, and an #Y Arabian Subject Kingdom#!. It gains the permanent #Y Unite Arabia#! modifier and begins the Arabian identity movement for #Y 30 years#!."
 OE_GHASSANID_FRONTIER_EFFECT: "Transfer only directly owned Byzantine locations in Hail to the #Y Ghassanid Kingdom#!: Orthodox, Arabian culture of the Roman culture group, Kingdom rank, and a #Y Roman March#!. Byzantium gains the permanent #Y Complete Conquest of Arabia#! modifier."
 oe_georgian_greek_culture: "Georgian"
 oe_arabian_greek_culture: "Arabian"
 OE_RW_ASSIM_GEORGIA_TITLE: "Begin Georgian Romanization"
 OE_RW_ASSIM_GEORGIA_ROW: "Georgian Culture"
 OE_RW_ASSIM_GEORGIA_FLAVOR: "The monasteries and fortresses of the Caucasus have long guarded their letters and faith. Now the mountain roads lead once more to imperial ports, noble sons serve together in the army, and schools and courts share a common law. Georgia’s memory will join Rome under its own name."
 OE_RW_ASSIM_GEORGIA_CONDITION: "Byzantium and its subjects at every level own at least 80% of conquerable locations in Georgia. Military occupation does not count."
 OE_RW_ASSIM_GEORGIA_NOT_STARTED: "Georgian Romanization has not successfully begun."
 OE_RW_ASSIM_GEORGIA_SOURCES: "Converts [ShowCultureName('georgian_culture')] population."
 OE_RW_ASSIM_GEORGIA_TARGET: "Gradually forms [ShowCultureName('oe_georgian_greek_culture')] in the Roman culture group. Spreads only among source-culture population in Byzantine or subject-owned locations.\n\n$OE_IDENTITY_FIXED_30Y_DESC$"
 OE_RW_ASSIM_GEORGIA_WAITING: "Not yet begun"
 OE_RW_ASSIM_GEORGIA_STARTED: "Begun: Georgian Romanization"
 OE_RW_ASSIM_GEORGIA_VALID_ORIGIN: "At least one Byzantine or subject-owned location in Georgia still has Georgian population."
 OE_RW_ASSIM_GEORGIA_PROGRESS: "Owned: [GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_rw_assim_georgia_owned')|0] / [GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_rw_assim_georgia_total')|0]; requires [GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_rw_assim_georgia_required')|0]."
 oe_georgia_identity_movement: "Georgian Identity Movement"
 oe_georgia_identity_movement_desc: "$OE_RW_ASSIM_GEORGIA_FLAVOR$\n\n$OE_IDENTITY_FIXED_30Y_DESC$"
 oe_arabia_identity_movement: "Arabian Identity Movement"
 oe_arabia_identity_movement_desc: "The Ghassanid crown joins oases, ports and caravan roads. Through common service, learning and worship, the peoples of the peninsula gradually form an Arabian identity within the Roman culture group. Converts all cultures in the Peninsular Arabian group and spreads only within Byzantium and its subjects.\n\n$OE_IDENTITY_FIXED_30Y_DESC$"
 oe_armenia_identity_starts: "Armenian identity movement starts used"
 oe_armenia_two_start_timer: "Armenian identity movement term"
 oe_eastern_mediterranean_hegemony: "Monopoly on Eastern Trade"
 oe_eastern_mediterranean_hegemony_desc: "A unified system of customs and harbor administration improves imports and exports, channeling the wealth of the East through imperial ports."
