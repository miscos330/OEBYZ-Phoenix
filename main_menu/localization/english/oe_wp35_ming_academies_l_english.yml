l_english:
 # Project Phoenix v31.0 WP35: 7 Famous Chinese Academies & Ancient Temples.
 oe_wp35_ming_yuelu_hall: "Yuelu Academy Imperial Pavilion"
 oe_wp35_ming_yuelu_hall_desc: "Perched at the foot of Mount Yuelu in Changsha, this storied Neo-Confucian lecture hall and imperial library draws scholars from across Huguang."
 oe_wp35_ming_bailudong_academy: "White Deer Grotto Academy"
 oe_wp35_ming_bailudong_academy_desc: "Revived by Zhu Xi beneath the Five Old Peaks of Mount Lushan in Xingzi, White Deer Grotto codified the classic rules of Neo-Confucian scholarship."
 oe_wp35_ming_songyang_academy: "Songyang Academy"
 oe_wp35_ming_songyang_academy_desc: "Shaded by ancient Han cypresses at the southern foot of Mount Song in Dengfeng, Songyang Academy nurtured the Cheng brothers and Central Plains classical learning."
 oe_wp35_ming_yingtianfu_academy: "Yingtianfu Academy"
 oe_wp35_ming_yingtianfu_academy_desc: "Located in Suiyang (Guide), where Fan Zhongyan taught and studied, Yingtianfu Academy pioneered state-sponsored prefectural examination academies."
 oe_wp35_ming_shaolin_temple: "Shaolin Temple of Mount Song"
 oe_wp35_ming_shaolin_temple_desc: "Cradled in the Shaoshi peaks of Dengfeng, the ancestral seat of Chan Buddhism is equally renowned for disciplined monastic martial guardians."
 oe_wp35_ming_baima_temple: "White Horse Temple of Luoyang"
 oe_wp35_ming_baima_temple_desc: "Founded in Luoyang during the Eastern Han dynasty, White Horse Temple stands as the earliest Buddhist monastery and sutra translation hall in China."
 oe_wp35_ming_qufu_kongmiao: "Qufu Temple of Confucius — Apricot Platform & Library"
 oe_wp35_ming_qufu_kongmiao_desc: "The sacred Apricot Platform and Kuiwen Imperial Library within the Qufu Confucian complex preserve imperial stelae and classical rites across generations."
 oe_wp35_ming_academies_patronage: "Imperial Charter of the Great Academies & Ancient Temples"
 oe_wp35_ming_academies_patronage.title: "Imperial Charter of the Great Academies & Ancient Temples"
 oe_wp35_ming_academies_patronage.desc: "Endow China's celebrated classical academies (Yuelu, White Deer Grotto, Songyang, Yingtianfu) and ancient temples (Shaolin, White Horse, Confucius Temple of Qufu) with imperial libraries and tax-exempt lands."
 oe_wp35_ming_academies_patronage.a: "Dispatch imperial envoys with plaques and classics"
 oe_wp35_ming.1.title: "Flourishing of the Four Great Academies & Ancient Temples"
 oe_wp35_ming.1.desc: "From the mist-wreathed lecture halls of White Deer Grotto beneath Mount Lushan and Yuelu Academy beside the Xiang River to the ancient cypresses of Songyang, the examination courts of Yingtianfu, and the revered sanctuaries of Shaolin, White Horse Temple, and Qufu's Apricot Platform, imperial plaques and classical libraries have kindled a sweeping renaissance. Scholars and abbots alike look to the throne to set the enduring tone of our cultural patronage."
 oe_wp35_ming.1.a: "Prioritize Neo-Confucian academies and examination letters"
 oe_wp35_ming.1.b: "Prioritize monastic sanctuaries and classical rites"
 oe_wp35_ming.1.c: "Summon the foremost academy rector to lead imperial scholarship"
 oe_wp35_ming.2.title: "Imperial Examination & Classical Commentary Harvest"
 oe_wp35_ming.2.desc: "Eight months after our imperial endowment reached the great academies and ancient temples, boatloads of newly printed classical commentaries, prefectural gazetteers, and brilliant examination candidates arrive in the capital. Examiners report a remarkable surge in administrative competence and literary brilliance, presenting the throne with fresh talent ready to elevate provincial governance."
 oe_wp35_ming.2.a: "Disseminate the new commentaries across every provincial school"
 oe_wp35_ming.2.b: "Celebrate scholarly harmony to fortify imperial legitimacy"
 oe_wp35_ming.2.c: "Appoint the top examination laureate directly to the palace court"
 STATIC_MODIFIER_NAME_oe_wp35_mod_ming_academies_patronage: "Imperial Academy Endowment"
 STATIC_MODIFIER_DESC_oe_wp35_mod_ming_academies_patronage: "Imperial libraries and stipends at China's four great academies accelerate scholarship and cabinet excellence."
 STATIC_MODIFIER_NAME_oe_wp35_mod_ming_monastic_sanctuary: "Patronage of the Ancient Temples"
 STATIC_MODIFIER_DESC_oe_wp35_mod_ming_monastic_sanctuary: "Revered Buddhist monasteries and Confucian shrines fortify spiritual harmony and provincial resilience."
