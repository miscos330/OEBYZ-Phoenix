# NEW 2026-11-22 v13.5 Worker 1: Master Artists, Works of Art, Epic Masterpieces & Zero-DLC World Heritage Linkage (oe_art_/oe_woa_/oe_mst_). Generated by gen_v135_masters_wonders.py; edit the generator, not this file.
 ARTIST_TYPE_NAME_oe_art_imperial_jurist: "Imperial Codifier"
 ARTIST_TYPE_DESC_oe_art_imperial_jurist: "A grand legal scholar steeped in Roman and imperial jurisprudence who sharpens legislative efficiency and sharply reduces policy change costs while retained at court."
 ARTIST_TYPE_NAME_oe_art_persian_miniaturist: "Persian Miniaturist"
 ARTIST_TYPE_DESC_oe_art_persian_miniaturist: "A master illuminator of the Herat, Tabriz, and Isfahan royal kitabhanes whose gilded manuscripts elevate national cultural tradition and monthly prestige."
 ARTIST_TYPE_NAME_oe_art_imperial_kilnmaster: "Imperial Kiln Superintendent"
 ARTIST_TYPE_DESC_oe_art_imperial_kilnmaster: "An imperial ceramic superintendent governing glaze chemistry and kiln firing at Fuliang and Jiangnan, boosting trade center power and the market value of works of art."
 ARTIST_TYPE_NAME_oe_art_literati_polymath: "Literati Polymath"
 ARTIST_TYPE_DESC_oe_art_literati_polymath: "A classical East Asian polymath uniting calligraphy, agronomy, and mathematical calendrics, steadily lifting national monthly literacy and research speed."
 ARTIST_TYPE_NAME_oe_art_mughal_atelier_master: "Imperial Atelier Naturalist"
 ARTIST_TYPE_DESC_oe_art_mughal_atelier_master: "A master naturalist and court painter blending Persian line with Indian color in royal ateliers, expanding cultural influence and accelerating institution growth."
 ARTIST_TYPE_NAME_oe_art_ukiyo_ink_master: "Suiboku and Fusuma Master"
 ARTIST_TYPE_DESC_oe_art_ukiyo_ink_master: "A master of Zen ink-wash landscapes and gilded castle screen murals whose ateliers fortify courtly honor and national cultural tradition."
 ARTIST_TYPE_NAME_oe_art_murano_horologist: "Murano Horologist and Optician"
 ARTIST_TYPE_DESC_oe_art_murano_horologist: "A master craftsman of crystal optical lenses and geared astronomical clockwork who accelerates national research speed and building construction efficiency."
 ARTIST_TYPE_NAME_oe_art_grand_cartographer: "Grand Cartographer and Master Builder"
 ARTIST_TYPE_DESC_oe_art_grand_cartographer: "A supreme cartographer and chief imperial architect uniting copperplate world atlases with monumental dome engineering, speeding construction and boosting maritime merchant power."
