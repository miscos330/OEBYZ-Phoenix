 oe_woa_imperial_porcelain: "Imperial Kiln Porcelain"
 oe_woa_imperial_porcelain_desc: "A peerless imperial porcelain vessel of translucent paste and jewel-like enamel, lifting local porcelain output, cultural influence, and royal prestige."
 oe_woa_imperial_porcelain_name_0: "The $ADJECTIVE|U$ Imperial Enamel Vase"
 oe_woa_imperial_porcelain_name_1: "Celadon Vessel of $FIRST_NOUN|U$"
