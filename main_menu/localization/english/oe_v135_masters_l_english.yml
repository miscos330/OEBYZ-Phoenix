 oe_woa_scientific_treatise: "Scientific and Agronomic Treatise"
 oe_woa_scientific_treatise_desc: "A foundational compendium of agronomy, calendrical mathematics, and empirical inquiry that raises local literacy, accelerates institution growth, and speeds national research."
 oe_woa_scientific_treatise_name_0: "Complete Treatise on $ADJECTIVE|U$ Science"
 oe_woa_scientific_treatise_name_1: "Empirical Inquiries into $FIRST_NOUN|U$"
 oe_woa_scientific_treatise_name_2: "The $ADJECTIVE|U$ Compendium of $FIRST_NOUN|U$"
 oe_woa_naturalist_album: "Imperial Naturalist Album"
 oe_woa_naturalist_album_desc: "A royal court album documenting exotic fauna, flora, and natural marvels with scientific precision, strengthening cultural influence and institution spread."
 oe_woa_naturalist_album_name_0: "The $ADJECTIVE|U$ Naturalist Album"
 oe_woa_naturalist_album_name_1: "Royal Flora and Fauna of $FIRST_NOUN|U$"
 oe_woa_naturalist_album_name_2: "The $ADJECTIVE|U$ Folio of $FIRST_NOUN|U$"
 oe_woa_painted_fusuma: "Gilded Fusuma and Ink Scroll"
 oe_woa_painted_fusuma_desc: "A monumental ink-wash scroll or gilded sliding-screen mural uniting meditative brushwork with castle splendor, calming local unrest while raising cultural tradition and honor."
 oe_woa_painted_fusuma_name_0: "The $ADJECTIVE|U$ Gilded Fusuma Screens"
 oe_woa_painted_fusuma_name_1: "Four Seasons Ink Scroll of $FIRST_NOUN|U$"
 oe_woa_painted_fusuma_name_2: "The $ADJECTIVE|U$ Mural of $FIRST_NOUN|U$"
 oe_woa_astronomical_clock: "Optical Instrument and Astronomical Clock"
 oe_woa_astronomical_clock_desc: "A precision ensemble of crystal optical lenses and geared astronomical clockwork that elevates local glass output, accelerates institution growth, and advances national research."
 oe_woa_astronomical_clock_name_0: "The $ADJECTIVE|U$ Astronomical Clock"
 oe_woa_astronomical_clock_name_1: "Crystal Orrery of $FIRST_NOUN|U$"
 oe_woa_astronomical_clock_name_2: "The $ADJECTIVE|U$ Horologium of $FIRST_NOUN|U$"
 oe_woa_world_atlas: "Grand World Atlas and Architectural Folio"
 oe_woa_world_atlas_desc: "A copperplate grand atlas of oceans, continents, and monumental engineering drawings that expands local book output, market access, and maritime merchant power."
 oe_woa_world_atlas_name_0: "The $ADJECTIVE|U$ Atlas Maior"
 oe_woa_world_atlas_name_1: "Grand Maritime Charts of $FIRST_NOUN|U$"
 oe_woa_world_atlas_name_2: "The $ADJECTIVE|U$ Cosmographia of $FIRST_NOUN|U$"
 oe_art_hexabiblos_1345: "Hexabiblos of Constantine Harmenopoulos"
 oe_art_hexabiblos_1345_desc: "The six-book compendium of Byzantine Roman civil law compiled in 1345 by Thessaloniki judge Constantine Harmenopoulos, preserving Justinianic jurisprudence for centuries."
 oe_art_theophanes_transfiguration: "Transfiguration Icons of Theophanes the Greek"
 oe_art_theophanes_transfiguration_desc: "Luminous Transfiguration icons and frescoes painted by Theophanes the Greek, bridging Constantinople, Novgorod, and Moscow with bold highlights and spiritual intensity."
 oe_art_panselinos_protaton: "Macedonian School Protaton Fresco Folio of Panselinos"
 oe_art_panselinos_protaton_desc: "Master fresco cartoons and sacred icon panels of Manuel Panselinos of the Macedonian School, setting the benchmark for Mount Athos and Balkan ecclesiastical art."
 oe_art_behzad_bustan: "Herat Bustan Miniatures of Kamal ud-Din Behzad"
 oe_art_behzad_bustan_desc: "The peerless illuminated manuscript of Saadi's Bustan directed by Kamal ud-Din Behzad, transforming Persian miniature painting with architectural depth and lifelike human expression."
 oe_art_reza_abbasi_album: "Isfahan Court Album of Reza Abbasi"
 oe_art_reza_abbasi_album_desc: "An exquisite folio of single-page court portraits and wandering scholars by Reza Abbasi of Isfahan, celebrated for sinuous calligraphic line and sumptuous jewel palettes."
 oe_art_tang_ying_taoye_tushuo: "Taoye Tushuo and Imperial Falangcai Porcelain of Tang Ying"
 oe_art_tang_ying_taoye_tushuo_desc: "The summit of imperial ceramic artistry at Fuliang Jingdezhen under Zang Yingxuan and Tang Ying, pairing twenty illustrated kiln treatises with a peerless falangcai porcelain vase."
 oe_art_xu_guangqi_nongzheng: "Nongzheng Quanshu of Xu Guangqi and Dong Qichang's Canon"
 oe_art_xu_guangqi_nongzheng_desc: "Twin landmarks of Jiangnan polymath scholarship: Xu Guangqi's encyclopedic agronomy and mathematical treatise alongside Dong Qichang's defining canon of literati painting and calligraphy."
 oe_art_hamzanama_mansur: "Hamzanama and Naturalist Album of Ustad Mansur"
 oe_art_hamzanama_mansur_desc: "The monumental illustrated cloth folios of the Hamzanama paired with Ustad Mansur's razor-sharp zoological and botanical studies from the imperial ateliers of Delhi and Agra."
 oe_art_sesshu_long_scroll: "Long Scroll of the Four Seasons by Sesshu Toyo"
 oe_art_sesshu_long_scroll_desc: "The sixteen-meter ink-wash masterpiece painted by Zen master Sesshu Toyo after his voyage to China, fusing bold angular brushwork with the four seasons of East Asia."
 oe_art_kano_eitoku_karajishi: "Chinese Lions Screen and Azuchi Gold Fusuma by Kano Eitoku"
 oe_art_kano_eitoku_karajishi_desc: "Monumental gold-leaf screens and castle murals by Kano Eitoku, bursting with fierce lions, cypress boughs, and the bold pageantry of Azuchi-Momoyama power."
 oe_art_murano_st_marks_clock: "Murano Crystal Optics and St. Mark's Astronomical Clockwork"
 oe_art_murano_st_marks_clock_desc: "Flawless Murano cristallo optical lenses paired with the geared zodiacal clockwork plans of St. Mark's Tower, heralding Europe's mastery of precision optics and horology."
 oe_art_blaeu_sinan_masterwork: "Blaeu's Atlas Maior and Sinan's Dome Engineering Folio"
 oe_art_blaeu_sinan_masterwork_desc: "A monumental folio uniting Dutch copperplate world cartography with Chief Architect Mimar Sinan's geometric dome blueprints, measuring both the seven seas and imperial vaults."
 STATIC_MODIFIER_NAME_oe_mst_restituted_pride_mod: "Pride of Restituted Masterpieces"
 STATIC_MODIFIER_DESC_oe_mst_restituted_pride_mod: "The triumphant return of storied national masterpieces kindles cultural pride across the realm, lifting cultural tradition and monthly prestige."
 STATIC_MODIFIER_NAME_oe_mst_patronage_cooldown_mod: "Royal Cross-Border Patronage Wave"
 STATIC_MODIFIER_DESC_oe_mst_patronage_cooldown_mod: "Generous royal stipends draw celebrated masters from foreign courts, lowering artist hiring costs while raising the skill and output of court ateliers."
 STATIC_MODIFIER_NAME_oe_mst_treasury_catalogued_mod: "Catalogued Imperial Art Treasury"
 STATIC_MODIFIER_DESC_oe_mst_treasury_catalogued_mod: "Systematic curation, restoration, and royal exhibition of court artworks lifts their renown, market value, cultural influence, and prestige."
 STATIC_MODIFIER_NAME_oe_mst_golden_atelier_mod: "Golden Atelier of the Realm"
 STATIC_MODIFIER_DESC_oe_mst_golden_atelier_mod: "Full royal sponsorship of a generational masterwork energizes workshops across the realm, cutting commission costs and raising cultural tradition and prestige."
 STATIC_MODIFIER_NAME_oe_mst_stolen_art_resolve_mod: "Vigilance for the Cultural Treasury"
 STATIC_MODIFIER_DESC_oe_mst_stolen_art_resolve_mod: "Strengthening royal vaults and proclaiming the provenance of cherished treasures fortifies cultural tradition, diplomatic reputation, and prestige."
 STATIC_MODIFIER_NAME_oe_mst_her_giza: "Guardianship of the Great Pyramids of Giza"
 STATIC_MODIFIER_DESC_oe_mst_her_giza: "Protects the ancient pyramids of Giza from quarrying and maintains Nile approach ways, enriching local cultural tradition and monthly prosperity."
 STATIC_MODIFIER_NAME_oe_mst_her_colosseum: "Preservation of the Roman Colosseum"
 STATIC_MODIFIER_DESC_oe_mst_her_colosseum: "Preserves the Flavian Amphitheatre from lime-kilns and stone looting, turning Rome's monumental arches into a beacon of cultural influence and artisan advancement."
 STATIC_MODIFIER_NAME_oe_mst_her_parthenon: "Guardianship of the Parthenon of Athens"
 STATIC_MODIFIER_DESC_oe_mst_her_parthenon: "Shields the Parthenon and Acropolis inscriptions from neglect, making Athens an Aegean beacon of literacy and rapid institution spread."
 STATIC_MODIFIER_NAME_oe_mst_her_samarra: "Restoration of the Great Mosque of Samarra"
 STATIC_MODIFIER_DESC_oe_mst_her_samarra: "Restores the spiral Malwiya minaret and Abbasid scholarly courts along the Tigris, revitalizing local literacy and cultural tradition."
 STATIC_MODIFIER_NAME_oe_mst_her_leshan: "Guardianship of the Leshan Giant Buddha"
 STATIC_MODIFIER_DESC_oe_mst_her_leshan: "Clears the hidden stone drainage channels and cliff galleries of the Giant Buddha at Leshan, calming river trade, raising prosperity, and pacifying local unrest."
 STATIC_MODIFIER_NAME_oe_mst_her_sanchi: "Custodianship of the Great Stupa at Sanchi"
 STATIC_MODIFIER_DESC_oe_mst_her_sanchi: "Protects the Ashokan Great Stupa and intricately carved torana gateways above Bhopal, boosting cultural tradition and attracting settlers and artisans."
 STATIC_MODIFIER_NAME_oe_mst_her_stonehenge: "Preservation and Survey of Stonehenge"
 STATIC_MODIFIER_DESC_oe_mst_her_stonehenge: "Protects the prehistoric trilithons near Amesbury from stone-taking while encouraging astronomical and antiquarian surveys that speed institution growth."
 STATIC_MODIFIER_NAME_oe_mst_her_teotihuacan: "Guardianship of the Sun Pyramid of Teotihuacan"
 STATIC_MODIFIER_DESC_oe_mst_her_teotihuacan: "Maintains the Avenue of the Dead and the towering Sun Pyramid of Teotihuacan, driving steady local development and commanding cultural influence."
 STATIC_MODIFIER_NAME_oe_mst_her_mecca: "Custodianship of the Sacred Kaaba of Mecca"
 STATIC_MODIFIER_DESC_oe_mst_her_mecca: "Upkeeps the Sacred Mosque, Kiswah weaving, and desert cisterns along the pilgrimage roads, magnifying Mecca's clerical stature and cultural influence."
 STATIC_MODIFIER_NAME_oe_mst_her_bodhgaya: "Guardianship of the Mahabodhi Temple of Bodh Gaya"
 STATIC_MODIFIER_DESC_oe_mst_her_bodhgaya: "Protects the Diamond Throne tower and Bodhi Tree at Gaya, drawing monastic scholars from across Asia to lift local literacy and serene civic peace."
 STATIC_MODIFIER_NAME_oe_mst_her_srirangam: "Patronage of the Ranganathaswamy Temple of Srirangam"
 STATIC_MODIFIER_DESC_oe_mst_her_srirangam: "Maintains the seven concentric enclosures and towering gopurams on the Kaveri river island, sustaining rich cultural tradition and bustling temple prosperity."
 STATIC_MODIFIER_NAME_oe_mst_her_qufu: "Imperial Reverence at the Temple of Confucius in Qufu"
 STATIC_MODIFIER_DESC_oe_mst_her_qufu: "Maintains the Hall of Great Perfection, Kuiwen Pavilion library, and classical academies of Qufu, raising both monthly literacy and the local literacy ceiling."
 STATIC_MODIFIER_NAME_oe_mst_her_jerusalem: "Guardianship of the Sacred Shrines of Jerusalem"
 STATIC_MODIFIER_DESC_oe_mst_her_jerusalem: "Fortifies Jerusalem's limestone ramparts while safeguarding its timeless sanctuaries and pilgrim quarters, strengthening both cultural influence and local defense."
 STATIC_MODIFIER_NAME_oe_mst_her_cholula: "Guardianship of the Great Pyramid of Cholollan"
 STATIC_MODIFIER_DESC_oe_mst_her_cholula: "Protects the vast terraced mountain-pyramid of Cholollan and its famed polychrome craft markets, deepening cultural tradition and monthly prosperity."
 STATIC_MODIFIER_NAME_oe_mst_her_enryakuji: "Guardianship of Enryaku-ji on Mount Hiei"
 STATIC_MODIFIER_DESC_oe_mst_her_enryakuji: "Protects the mountain library, scriptoria, and strategic ridges of Enryaku-ji overlooking Lake Biwa and Kyoto, raising local literacy and mountain defensiveness."
 STATIC_MODIFIER_NAME_oe_mst_her_stpeters: "Patronage of St. Peter's Basilica in Rome"
 STATIC_MODIFIER_DESC_oe_mst_her_stpeters: "Unites Catholic patronage behind the monumental dome and Apostolic Library of St. Peter's in Rome, lifting clerical stature and rapid institution spread."
 oe_mst_patronage_ready_tt: "Not currently within the fifteen-year cross-border master patronage cooldown."
 oe_mst_treasury_ready_tt: "Not currently within the ten-year royal art treasury curation cooldown."
 oe_mst_has_unconsecrated_heritage_tt: "Owns at least one world monument or sacred site whose twenty-five-year guardianship decree is not yet active."
 oe_mst_catalogue_treasury_tt: "Restores and polishes up to two works of art in the realm below peak quality (+4 quality each)."
 oe_mst_patronize_master.title: "Patronize a Master Artist Across Borders"
 oe_mst_patronize_master.desc: "Dispatch envoys with royal stipends to great cities, universities, and ateliers across Eurasia, inviting a high-skill master from three disciplines suited to your realm while kindling a fifteen-year patronage wave."
 oe_mst_patronize_master.a: "Dispatch Royal Stipends and Select a Master"
 oe_mst_catalogue_treasury.title: "Catalogue and Restore the Royal Art Treasury"
 oe_mst_catalogue_treasury.desc: "Instruct court curators and restorers to inventory the royal collection, publish a provenance catalogue, and restore up to two artworks to higher quality while lifting cultural influence and artwork value for ten years."
 oe_mst_catalogue_treasury.a: "Open the Vaults and Restore the Collection"
 oe_mst_consecrate_world_heritage.title: "Consecrate World Monuments and Sacred Sites"
 oe_mst_consecrate_world_heritage.desc: "Proclaim or renew twenty-five-year royal guardianship decrees over every world monument and sacred site currently held in peace, granting enduring local cultural, literacy, prosperity, or defensive blessings."
 oe_mst_consecrate_world_heritage.a: "Issue the Guardianship Decrees Across Owned Sites"
 oe_mst.1.t: "The Jurist of Thessaloniki: Harmenopoulos and the Hexabiblos"
 oe_mst.1.d: "Amid the scholarly flowering of the Palaiologan Renaissance, chief judge Constantine Harmenopoulos of Thessaloniki has distilled centuries of Roman statutes and the Basilika into a lucid six-book code, the Hexabiblos. Patronizing his chamber and enshrining an authoritative copy will anchor imperial justice for generations."
 oe_mst.1.a: "Retain the Grand Jurist and Promulgate the Hexabiblos"
 oe_mst.1.b: "Archive a Fair Copy in the Treasury Without Extra Expense"
 oe_mst.2.t: "Light of the Orthodox World: Theophanes the Greek"
 oe_mst.2.d: "The renowned Constantinopolitan master Theophanes the Greek is painting freehand upon the cathedral scaffolding, slashing bold flashes of white light across solemn icons of the Transfiguration that awe craftsmen from the Bosporus to the Russian forests. Shall the crown fund his royal icon workshop?"
 oe_mst.2.a: "Patronize Theophanes and Enshrine the Transfiguration Masterwork"
 oe_mst.2.b: "Endow the Cathedral Icon Alone"
 oe_mst.3.t: "Apex of the Macedonian School: Panselinos and the Protaton Cycle"
 oe_mst.3.d: "Between Thessaloniki and Mount Athos, disciples of Manuel Panselinos of the Macedonian School have gathered the grand cartoons and icon panels of the Protaton church. Their sculptural modeling and expressive faces mark the summit of the Palaiologan artistic revival."
 oe_mst.3.a: "Sponsor the Macedonian Atelier and Summon a Master Iconographer"
 oe_mst.3.b: "Receive the Fresco Folio into the Imperial Treasury"
 oe_mst.4.t: "Marvel of the Age: Kamal ud-Din Behzad and the Herat Bustan"
 oe_mst.4.d: "Within the royal kitabhane, master Kamal ud-Din Behzad has completed his luminous miniatures for Saadi's Bustan. Every glazed tile, folded robe, craftsman, and courtier breathes with vivid individuality, drawing admiration from Khorasan to Azerbaijan."
 oe_mst.4.a: "Appoint Behzad Chief of the Royal Kitabhane and Enshrine the Bustan"
 oe_mst.4.b: "Preserve the Bustan in the Royal Library with Modest Stipends"
 oe_mst.5.t: "Calligraphic Grace of Isfahan: Reza Abbasi's Court Album"
 oe_mst.5.d: "Near the grand square of Isfahan, Reza Abbasi has pioneered a daring new court aesthetic: flowing calligraphic contours depicting cupbearers, courtiers, and contemplative wanderers on single album leaves. Inviting him to the palace will secure his finest folios for the realm."
 oe_mst.5.a: "Summon Reza Abbasi to Court and Mount the Royal Album"
 oe_mst.5.b: "Acquire the Album Leaves for the Imperial Treasury"
 oe_mst.6.t: "Pinnacle of the Porcelain Capital: Tang Ying and the Imperial Kilns"
 oe_mst.6.d: "In Fuliang Jingdezhen, the glow of hundreds of dragon kilns lights the night sky. Building on Zang Yingxuan's revival, superintendent Tang Ying has lived beside the potters, perfecting brilliant falangcai enamels and compiling twenty illustrated plates of ceramic mastery, the Taoye Tushuo."
 oe_mst.6.a: "Honor the Imperial Kiln Superintendent and Enshrine the Porcelain"
 oe_mst.6.b: "Commend the Fuliang Kilns and Deposit the Treatise in the Palace"
 oe_mst.7.t: "Twin Pillars of Jiangnan Learning: Xu Guangqi and Dong Qichang"
 oe_mst.7.d: "Across Wuxian and Shangyuan, Jiangnan scholarship has reached a remarkable synthesis: statesman-scientist Xu Guangqi has completed his sixty-volume agricultural and hydraulic encyclopedia Nongzheng Quanshu, while connoisseur Dong Qichang has codified literati aesthetics in his Huachanshi Suibi."
 oe_mst.7.a: "Summon the Literati Polymath to Court and Print the Complete Canon"
 oe_mst.7.b: "Deposit Jiangnan Editions in the Imperial Archive"
 oe_mst.8.t: "Wonder of the Age: The Hamzanama and Ustad Mansur's Naturalist Album"
 oe_mst.8.d: "In the royal ateliers of Delhi and Agra, over a hundred Persian and Indian painters have produced the sweeping cotton-cloth epics of the Hamzanama, followed by Ustad Mansur's startlingly lifelike studies of falcons, cranes, and exotic blossoms that earn him the title Wonder of the Age."
 oe_mst.8.a: "Honor the Atelier Naturalist and Enshrine the Complete Folios"
 oe_mst.8.b: "Preserve the Naturalist Album in the Royal Vault"
 oe_mst.9.t: "Master of Zen Ink: Sesshu Toyo's Long Scroll of the Four Seasons"
 oe_mst.9.d: "Returned from his artistic pilgrimage across the East China Sea, the Zen monk-painter Sesshu Toyo has unrolled a breathtaking sixteen-meter ink landscape of the Four Seasons. Its chiseled mountain crags and rhythmic ink washes establish an independent Japanese ink tradition."
 oe_mst.9.a: "Patronize Sesshu's Ink Studio and Enshrine the Long Scroll"
 oe_mst.9.b: "Enshrine the Scroll in the Grand Temple Treasury"
 oe_mst.10.t: "Gold-Leaf Grandeur: Kano Eitoku and the Karajishi Screens"
 oe_mst.10.d: "Inside the soaring keeps of Kyoto and Osaka, Kano Eitoku has covered vast gold-leaf screens with striding lions and twisting cypress trees in mineral green and azure, dazzling visiting lords with the unmistakable majesty of a unifying realm."
 oe_mst.10.a: "Appoint the Kano Atelier as Court Painters and Commission the Screens"
 oe_mst.10.b: "Install the Karajishi Screens with Restrained Gold Outlay"
 oe_mst.11.t: "Precision of the Lagoon: Murano Optics and St. Mark's Clockwork"
 oe_mst.11.d: "Between the guarded glass furnaces of Murano and St. Mark's Square, master opticians and clockmakers have perfected crystal lenses alongside a towering zodiacal clock that tracks hours, lunar phases, and Adriatic tides with breathtaking accuracy."
 oe_mst.11.a: "Retain the Murano Horologist and Erect the Astronomical Masterpiece"
 oe_mst.11.b: "Grant Guild Honours and Archive the Clockwork Plans"
 oe_mst.12.t: "Measuring the Oceans and Vaulting the Heavens: The Grand Atlas & Dome Folio"
 oe_mst.12.d: "From the copperplate presses of Amsterdam and Antwerp where Willem Blaeu strikes his grand Atlas Maior to the imperial drafting halls of Constantinople where Chief Architect Mimar Sinan plots weightless domes, cartography and engineering have reached sublime maturity. Retaining this grand master will project your realm across sea and stone alike."
 oe_mst.12.a: "Appoint the Grand Cartographer and Publish the Imperial Folio"
 oe_mst.12.b: "Archive the Master Plates in the Imperial Registry"
 oe_mst.13.t: "Envoys Return: Selecting a Patronized Master"
 oe_mst.13.d: "Word of our royal stipends has spread through famed universities, royal kilns, and merchant guilds, drawing three celebrated masters willing to enter court service. Whom shall the crown summon first: a grand jurist or literati polymath, a master of court painting and imperial craft, or a horologist and grand cartographer?"
 oe_mst.13.a: "Summon a Scholar of Law and Statecraft (Imperial Codifier / Literati Polymath)"
 oe_mst.13.b: "Summon an Atelier Master (Suiboku / Imperial Kiln / Naturalist / Persian Miniaturist)"
 oe_mst.13.c: "Summon a Master of Precision and Space (Murano Horologist / Grand Cartographer)"
 oe_mst.14.t: "Masterpieces Restituted and Vigil for the Treasury"
 oe_mst.14.d: "Whether celebrating the diplomatic restitution of storied national treasures from foreign hands or redoubling vigilance after priceless works change hands in war, the realm recognizes that masterpieces embody the very soul and dignity of civilization. Shall we proclaim a decade of public cultural celebration or fortify the vaults and provenance registers?"
 oe_mst.14.a: "Exhibit the Restored Treasures and Celebrate Cultural Pride"
 oe_mst.14.b: "Fortify the Royal Vaults and Restore Our Finest Masterwork"
 oe_mst.15.t: "Custodians of Antiquity: The Great Pyramids of Giza"
 oe_mst.15.d: "Above the western edge of the Nile valley, the Great Pyramids of Giza have watched empires rise and fade for four millennia. With Giza secure in our hands, a formal decree against quarrying and a restored Nile landing will draw scholars and travelers from across the world."
 oe_mst.15.a: "Proclaim Royal Guardianship over Giza"
 oe_mst.15.b: "Fund Grand Nile Pavilions and Commemorative Stelae"
 oe_mst.16.t: "Stone Crown of the Eternal City: The Colosseum of Rome"
 oe_mst.16.d: "Standing proudly at the heart of Rome, the Flavian Amphitheatre endures despite earthquakes and centuries of scavenging. By halting lime-burning and consecrating its arches as an open monument of classical engineering, we restore the Eternal City's magnetic prestige."
 oe_mst.16.a: "Enact the Preservation Edict for the Colosseum"
 oe_mst.16.b: "Reinforce the Outer Arches and Sponsor Classical Studies"
 oe_mst.17.t: "Crown of the Acropolis: The Parthenon of Athens"
 oe_mst.17.d: "Crowning the rock of the Acropolis above the Aegean, the marble colonnades of the Parthenon remain the supreme emblem of classical proportion. Safeguarding its sanctuary from munitions and neglect turns Athens into a magnet for humanists and new institutions."
 oe_mst.17.a: "Proclaim Guardianship of the Acropolis and Parthenon"
 oe_mst.17.b: "Copy the Classical Inscriptions and Endow Acropolis Schools"
 oe_mst.18.t: "Spiral Beacon on the Tigris: The Great Mosque of Samarra"
 oe_mst.18.d: "Rising in a soaring clay-brick spiral above the Tigris, the Malwiya minaret recalls the scholarly glory of the Abbasid age. Restoring its ramp and adjacent study courts revives Samarra's enduring tradition of learning."
 oe_mst.18.a: "Issue the Guardianship Decree for Samarra"
 oe_mst.18.b: "Restore the Study Courts and Invite Tigris Scholars"
 oe_mst.19.t: "Mountain Carved into Compassion: The Leshan Giant Buddha"
 oe_mst.19.d: "Where the Min, Qingyi, and Dadu rivers converge, the towering Tang-era cliffside Buddha watches over treacherous rapids. Maintaining its concealed stone drainage galleries and cliff stairways safeguards Sichuan river traffic and calms the hearts of the people."
 oe_mst.19.a: "Proclaim Guardianship and Clear the Cliff Drainage"
 oe_mst.19.b: "Rebuild Lingyun Pavilion and Aid River Boatmen"
 oe_mst.20.t: "Stone Gates of Antiquity: The Great Stupa at Sanchi"
 oe_mst.20.d: "Crowning a quiet hilltop near Bhopal, the Great Stupa raised under Emperor Ashoka stands framed by four stone gateways alive with carved elephants, caravans, and lotus blossoms. Formal protection turns the hill into a flourishing hub of culture and settlement."
 oe_mst.20.a: "Proclaim Royal Protection of the Sanchi Stupa"
 oe_mst.20.b: "Restore the Hilltop Roads and Welcome Travelers"
 oe_mst.21.t: "Ring of the Solstice: Stonehenge of Amesbury"
 oe_mst.21.d: "Across the windswept chalk downs near Amesbury, towering sarsen trilithons align with the midsummer sunrise from an age older than Rome. Guarding the stones from demolition and welcoming astronomical surveys unites ancient heritage with empirical curiosity."
 oe_mst.21.a: "Forbid Stone-Taking and Protect Stonehenge"
 oe_mst.21.b: "Sponsor Astronomical and Antiquarian Surveys"
 oe_mst.22.t: "City Where the Gods Were Born: Teotihuacan"
 oe_mst.22.d: "Across the high valley of Mexico, the colossal Pyramid of the Sun and Avenue of the Dead stand revered as the birthplace of the cosmos. Clearing the terraces and proclaiming guardianship restores Teotihuacan as a magnet of growth and awe."
 oe_mst.22.a: "Proclaim Guardianship of Teotihuacan"
 oe_mst.22.b: "Restore the Causeway and Endow the Valley Market"
 oe_mst.23.t: "Axis of the Pilgrimage: Guardianship of the Kaaba"
 oe_mst.23.d: "Cradled in the Hejaz hills, the draped Kaaba draws pilgrims from Iberia, Mali, Anatolia, and the shores of the Indian Ocean. Maintaining the sanctuary aqueducts and safeguarding caravan roads confirms our realm's lofty cultural and spiritual standing."
 oe_mst.23.a: "Proclaim Custodianship of the Sacred Sanctuary"
 oe_mst.23.b: "Endow Cisterns, Caravans, and Ceremonial Brocades"
 oe_mst.24.t: "Shade of the Bodhi Tree: Mahabodhi Temple of Bodh Gaya"
 oe_mst.24.d: "Beside the Phalgu River in Gaya, the sculpted spire of the Mahabodhi Temple rises beside the sacred Bodhi Tree revered by pilgrims from China, Burma, Lanka, and Tibet. Protecting the shrine and its scriptoria nurtures literacy and calm across the province."
 oe_mst.24.a: "Proclaim Guardianship of the Mahabodhi Sanctuary"
 oe_mst.24.b: "Endow Monastic Scriptoria and Pilgrim Hostels"
 oe_mst.25.t: "Seven-Walled Island Sanctuary: Srirangam"
 oe_mst.25.d: "On a verdant island embraced by the Kaveri River, the Ranganathaswamy complex rises in seven concentric stone rings and soaring painted gopurams. Sustaining its pillared halls and sacred fairs fills Srirangam with enduring prosperity and tradition."
 oe_mst.25.a: "Proclaim Royal Guardianship of Srirangam"
 oe_mst.25.b: "Restore the Thousand-Pillar Hall and Temple Markets"
 oe_mst.26.t: "Hall of Great Perfection: The Temple of Confucius in Qufu"
 oe_mst.26.d: "Beneath ancient cypresses between the Zhu and Si streams, the Hall of Great Perfection and Apricot Pavilion of Qufu endure as the fountainhead of classical scholarship. Endowing its library and academies lifts literacy to new heights."
 oe_mst.26.a: "Offer Imperial Rites and Protect Qufu's Halls"
 oe_mst.26.b: "Endow Academy Stipends and Print Classical Texts"
 oe_mst.27.t: "City of Golden Stone: Guardianship of Jerusalem"
 oe_mst.27.d: "Upon the limestone heights of Judea, the domes and bells of Jerusalem command the devotion of three faiths across the Mediterranean and Near East. Securing its ramparts and guaranteeing order for pilgrims magnifies both its defense and cultural stature."
 oe_mst.27.a: "Proclaim Guardianship and Pilgrim Order in Jerusalem"
 oe_mst.27.b: "Strengthen the Ramparts, Aqueducts, and Pilgrim Hospices"
 oe_mst.28.t: "Sanctuary of the Great Mound: Cholollan"
 oe_mst.28.d: "Beneath snow-capped volcanoes, the colossal terraced pyramid of Cholollan rises like a man-made mountain surrounded by shrines and renowned pottery markets. Safeguarding the sacred precinct ensures enduring cultural vitality and trade."
 oe_mst.28.a: "Proclaim Guardianship of Cholollan's Great Sanctuary"
 oe_mst.28.b: "Endow Polychrome Artisan Guilds and Sacred Roads"
 oe_mst.29.t: "Undying Lamp Above Lake Biwa: Enryaku-ji of Mount Hiei"
 oe_mst.29.d: "High among the cedars of Mount Hiei in Kurita, the undying flame of Enryaku-ji overlooks both Lake Biwa and the northeastern approaches to Kyoto. Protecting its mountain libraries and ridge passes strengthens both scholarship and defense."
 oe_mst.29.a: "Proclaim Protection of Enryaku-ji and Its Mountain Archives"
 oe_mst.29.b: "Restore the Scriptoria and Fortify the Ridge Passes"
 oe_mst.30.t: "Dome Above the Tiber: St. Peter's Basilica in Rome"
 oe_mst.30.d: "Upon Vatican Hill west of the Tiber, St. Peter's Basilica draws the foremost architects, sculptors, and scholars of Latin Christendom. As Catholic custodians of Rome, chartering the basilica workshop and Apostolic Library places the Eternal City at the vanguard of new institutions."
 oe_mst.30.a: "Proclaim Guardianship of St. Peter's and the Apostolic Library"
 oe_mst.30.b: "Endow the Basilica Fabric and Summon Master Builders"
