 oe_yk.1.t: "An Embassy from Goryeo"
 oe_yk.1.desc_r1ln: "#F The kings of Goryeo were sons-in-law of the Yuan house, and a new king had to be invested by the court's decree. In the eleventh Zhizheng year (1351) the court deposed King Chungjeong and raised Wang Gi, long a guard at Dadu, who became King Gongmin (the common account).#!\n\nGoryeo's new king sends envoys with a memorial asking for investiture and the seal. Goryeo has long been compliant, and the envoys speak humbly. If the request is granted, Goryeo will send gifts of thanks worth about #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yk_kor3m_sv')|0]#! gold (three months of Goryeo's income)."
 oe_yk.1.desc_r1l: "#F The kings of Goryeo were sons-in-law of the Yuan house. A new king sent envoys to Dadu to ask for the court's decree of investiture and its seal; only then was the succession beyond question.#!\n\nGoryeo's new king sends envoys with a memorial asking for investiture and the seal. Goryeo has long been compliant, and the envoys speak humbly. If the request is granted, Goryeo will send gifts of thanks worth about #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yk_kor3m_sv')|0]#! gold (three months of Goryeo's income)."
 oe_yk.1.desc_r1on: "#F The kings of Goryeo were sons-in-law of the Yuan house, and a new king had to be invested by the court's decree. In the eleventh Zhizheng year (1351) the court deposed King Chungjeong and raised Wang Gi, long a guard at Dadu, who became King Gongmin (the common account).#!\n\nGoryeo's new king sends envoys asking for investiture. They are correct in every form, but one can hear that Goryeo's court has its own mind. If the request is granted, Goryeo will send gifts of thanks worth about #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yk_kor3m_sv')|0]#! gold (three months of Goryeo's income)."
 oe_yk.1.desc_r1o: "#F The kings of Goryeo were sons-in-law of the Yuan house. A new king sent envoys to Dadu to ask for the court's decree of investiture and its seal; only then was the succession beyond question.#!\n\nGoryeo's new king sends envoys asking for investiture. They are correct in every form, but one can hear that Goryeo's court has its own mind. If the request is granted, Goryeo will send gifts of thanks worth about #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yk_kor3m_sv')|0]#! gold (three months of Goryeo's income)."
 oe_yk.1.desc_r2ln: "#F Yuan princesses had long been given to the kings of Goryeo. In the ninth Zhizheng year (1349) Wang Gi, a guard at Dadu, married Budashiri, daughter of the Prince of Wei, later the Grand Princess of Lu (one account).#!\n\nGoryeo sends envoys asking for a bride: the king wishes to marry a lady of the Yuan house and renew the bond. The friends of the Yuan at Goryeo's court press hard for it."
 oe_yk.1.desc_r2l: "#F Since King Chungnyeol married a daughter of Khubilai, Yuan princesses had been given to the kings of Goryeo as a matter of course; Goryeo's son-in-law rule let its king marry only into the overlord's house.#!\n\nGoryeo sends envoys asking for a bride: the king wishes to marry a lady of the Yuan house and renew the bond. The friends of the Yuan at Goryeo's court press hard for it."
 oe_yk.1.desc_r2on: "#F Yuan princesses had long been given to the kings of Goryeo. In the ninth Zhizheng year (1349) Wang Gi, a guard at Dadu, married Budashiri, daughter of the Prince of Wei, later the Grand Princess of Lu (one account).#!\n\nGoryeo sends envoys asking for a bride: the king wishes to marry a lady of the Yuan house. The wish is mostly the king's own; Goryeo's court is not of one mind."
 oe_yk.1.desc_r2o: "#F Since King Chungnyeol married a daughter of Khubilai, Yuan princesses had been given to the kings of Goryeo as a matter of course; Goryeo's son-in-law rule let its king marry only into the overlord's house.#!\n\nGoryeo sends envoys asking for a bride: the king wishes to marry a lady of the Yuan house. The wish is mostly the king's own; Goryeo's court is not of one mind."
 oe_yk.1.desc_r3l: "#F The Yuan court demanded girls from Goryeo as tribute, and families with daughters married them off early so they would not be chosen. It is said that around the Yuantong years (1333–1335) Yi Gok of Goryeo petitioned against it, and that the court for a time agreed (one account).#!\n\nGoryeo's envoys bring a memorial asking that the yearly tribute of girls be ended: families marry their daughters off early to escape it, and the people complain. Goryeo has always been compliant, and the plea is earnest."
 oe_yk.1.desc_r3o: "#F The Yuan court demanded girls from Goryeo as tribute, and families with daughters married them off early so they would not be chosen. It is said that around the Yuantong years (1333–1335) Yi Gok of Goryeo petitioned against it, and that the court for a time agreed (one account).#!\n\nGoryeo's envoys bring a memorial asking that the yearly tribute of girls be ended: families marry their daughters off early to escape it, and the people complain. The words are respectful, the purpose firm."
 oe_yk.1.desc_r4l: "#F In hard times Goryeo looked to the Yuan court for help and gifts; and gifts had always been one way of keeping a dependent kingdom in hand.#!\n\nGoryeo's envoys describe hard times at home and ask the court for money and silk. Goryeo, they say, has always lived by the court's favour and can only turn to it now."
 oe_yk.1.desc_r4o: "#F In hard times Goryeo looked to the Yuan court for help and gifts; and gifts had always been one way of keeping a dependent kingdom in hand.#!\n\nGoryeo's envoys describe hard times at home and ask the court for money and silk. They speak politely, but what they want is money."
 oe_yk.1.desc_r5l: "#F The Yuan court created the title of Prince of Shen in Liaoyang for a collateral branch of the Wang house to govern Goryeo settlers in Liaodong. From Wang Go onward, the Princes of Shen married Mongol princesses and stayed close to Dadu; whenever Goryeo changed kings, the Shen house was quick to contest the throne at court.#!\n\nGoryeo's new king sends envoys to ask for investiture, yet the Prince of Shen's house petitions Dadu at the same moment, claiming the Goryeo throne should pass to Shen and asking the court to overturn the succession. Goryeo has been compliant, and the dispute now rests with the imperial court."
 oe_yk.1.desc_r5o: "#F The Yuan court created the title of Prince of Shen in Liaoyang for a collateral branch of the Wang house to govern Goryeo settlers in Liaodong. From Wang Go onward, the Princes of Shen married Mongol princesses and stayed close to Dadu; whenever Goryeo changed kings, the Shen house was quick to contest the throne at court.#!\n\nGoryeo's new king sends envoys to ask for investiture, while the Prince of Shen's house petitions Dadu at the same time, arguing that Goryeo's court is unruly and offering to oversee Goryeo as acting ruler. Both sides await word in the capital, leaving the throne in suspense."
 oe_yk.1.desc_x: "#F In hard times Goryeo looked to the Yuan court for help and gifts; and gifts had always been one way of keeping a dependent kingdom in hand.#!\n\nEnvoys from Goryeo arrive at court."
 oe_yk.1.a: "Grant investiture, with seal and patent"
 oe_yk.1.a.tt: "Costs #R 1#! month of trade and tax income\nGoryeo sends gifts of thanks worth about #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yk_kor3m_sv')|0]#! gold (as much as it has) to us\nGoryeo's new king is invested; Goryeo's legitimacy #G +5#!\nMongol influence (vanilla's count) #Y +1#!"
 oe_yk.1.b: "Grant investiture, and have the heir sent to court as a hostage"
 oe_yk.1.b.tt: "Investiture as above, without the gifts of thanks\nGoryeo's opinion of us #R −10#! (#bold #color_yellow A Hostage Prince at Court#!#!, #Y 60#! months)\nMongol influence (vanilla's count) #Y +2#!"
 oe_yk.1.c: "Refuse, and tell them to think again"
 oe_yk.1.c.tt: "Goryeo's legitimacy #R −10#!; the king stays uninvested and will ask again\nGoryeo's opinion of us #R −20#! (#bold #color_yellow Investiture Refused#!#!, #Y 60#! months)\nMongol influence (vanilla's count) #Y −2#!\nThe king is not deposed"
 oe_yk.1.d: "Give a lady of the imperial house in marriage"
 oe_yk.1.d.tt: "Costs #R 2#! months of trade and tax income\nA lady of the Borjigin house marries the King of Goryeo\nGoryeo's opinion of us #G +20#! (#bold #color_yellow Married to an Imperial Princess#!#!, #Y 120#! months)\nMongol influence (vanilla's count) #Y +2#!"
 oe_yk.1.e: "Promise to consider it later"
 oe_yk.1.e.tt: "Goryeo may ask again in #Y 48#! months"
 oe_yk.1.f: "Refuse"
 oe_yk.1.f.tt: "Goryeo's opinion of us #R −10#! (#bold #color_yellow A Bride Refused#!#!, #Y 60#! months)\nMongol influence (vanilla's count) #Y −1#!"
 oe_yk.1.g: "Grant the request"
 oe_yk.1.g.tt: "The Confucian officials praise the court's benevolence\nGoryeo's opinion of us #G +15#! (#bold #color_yellow Spared the Tribute Girls#!#!, #Y 60#! months)\nGoryeo's stability #G +2.5#!"
 oe_yk.1.h: "The girls are to be sent as before"
 oe_yk.1.h.tt: "Goryeo's opinion of us #R −15#! (#bold #color_yellow Tribute Girls Still Taken#!#!, #Y 60#! months)\nMongol influence (vanilla's count) #Y −1#!"
 oe_yk.1.i: "Give generously"
 oe_yk.1.i.tt: "We pay Goryeo about #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yk_gift_big')|0]#! gold (six months of Goryeo's income, at most three months of ours)\nGoryeo's opinion of us #G +20#! (#bold #color_yellow Rich Gifts#!#!, #Y 60#! months)\nMongol influence (vanilla's count) #Y +1#!"
 oe_yk.1.j: "Give a little"
 oe_yk.1.j.tt: "We pay Goryeo about #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yk_gift_small')|0]#! gold (two months of Goryeo's income)\nGoryeo's opinion of us #G +5#! (#bold #color_yellow Modest Gifts#!#!, #Y 60#! months)"
 oe_yk.1.k: "Give nothing"
 oe_yk.1.k.tt: "Goryeo's opinion of us #R −10#! (#bold #color_yellow Gifts Refused#!#!, #Y 60#! months)"
 oe_yk.1.l: "Confirm Goryeo's heir and reject the Prince of Shen's claim"
 oe_yk.1.l.tt: "Goryeo's new king is invested; Goryeo's legitimacy #G +5#!\nThe Prince of Shen's opinion of us #R −15#! (#bold #color_yellow Prince of Shen's Claim Rejected#!#!, #Y 60#! months)\nThe Prince of Shen's loyalty #R −5#!"
 oe_yk.1.m: "Appoint the Prince of Shen to oversee Goryeo's affairs"
 oe_yk.1.m.tt: "Goryeo's liberty desire #R +15#!\nGoryeo's opinion of us #R −20#! (#bold #color_yellow Prince of Shen Backed as Regent#!#!, #Y 60#! months)\nMongol influence (vanilla's count) #Y +2#!\nThe Prince of Shen's opinion of us #G +25#! (#bold #color_yellow Backed for the Goryeo Throne#!#!, #Y 60#! months)\nThe Prince of Shen's loyalty #G +10#!\nRecords imperial backing for the Prince of Shen (the King of Goryeo is not deposed)"
 oe_yk.1.n: "Keep both claims open and summon both sides to Dadu"
 oe_yk.1.n.tt: "Goryeo's opinion of us #R −5#! (#bold #color_yellow Summoned to Dadu to Confront Rival Claim#!#!, #Y 60#! months)\nThe Prince of Shen's opinion of us #R −5#! (#bold #color_yellow Summoned to Dadu to Confront Rival Claim#!#!, #Y 60#! months)\nGoryeo's succession request is delayed by #Y 12#! months"
 oe_yk.2.t: "An Embassy to the Yuan Court"
 oe_yk.2.desc_a1: "#F Between Goryeo and the Yuan court, investiture, marriages and tribute all went through envoys.#!\n\nThe king is newly enthroned, and by custom envoys should go to Dadu to ask the Yuan court for investiture. If it is granted, gifts of thanks worth about #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yk_kor3m_sv')|0]#! gold (three months of our income) are due; without investiture the court may say nothing, but at home some will question the king's standing."
 oe_yk.2.desc_a2: "#F Between Goryeo and the Yuan court, investiture, marriages and tribute all went through envoys.#!\n\nIt is time again to send envoys to the Yuan court. What shall they ask for this time, or shall no one go?"
 oe_yk.2.a: "Ask for investiture"
 oe_yk.2.a.tt: "The envoys reach Dadu next month, and the Yuan court decides\nGranted: the king is invested, legitimacy #G +5#!, and we send gifts worth about #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yk_kor3m_sv')|0]#! gold; or the heir goes to court as a hostage; or refused (legitimacy #R −10#!)"
 oe_yk.2.b: "Ask for a bride"
 oe_yk.2.b.tt: "The envoys reach Dadu next month, and the Yuan court decides\nGranted: a lady of the Borjigin house marries the king; or put off; or refused"
 oe_yk.2.c: "Ask for an end to the tribute girls"
 oe_yk.2.c.tt: "The envoys reach Dadu next month, and the Yuan court decides\nGranted: our stability #G +2.5#!; or the girls are sent as before"
 oe_yk.2.d: "Ask for gifts"
 oe_yk.2.d.tt: "The envoys reach Dadu next month, and the Yuan court decides\nRich gifts: about six months of our income; modest: about two months; or nothing"
 oe_yk.2.e: "Send no one this time"
 oe_yk.2.e.tt: "While the king is not invested, the matter comes back in #Y 12#! months (at most #Y 3#! times); otherwise in #Y 48#! months"
 oe_yk.3.t: "The Gi Clan Rises"
 oe_yk.3.desc_h: "#F Empress Gi came from Goryeo, sent to the Yuan court as a tribute girl. In the thirteenth Zhizheng year (1353) the empress's son Ayushiridara was made heir apparent (the common account, History of Yuan, 43).#!\n\nNow the empress's kin grow ever greater in Goryeo, and the Gi clan asks, through friends at court, for further honours. The King of Goryeo resents it and dares say nothing."
 oe_yk.3.desc_g: "#F Empress Gi came from Goryeo, sent to the Yuan court as a tribute girl. Once the empress was in favour, the Gi kin in Goryeo rose fast.#!\n\nNow the empress's kin grow ever greater in Goryeo, and the Gi clan asks, through friends at court, for further honours. The King of Goryeo resents it and dares say nothing."
 oe_yk.3.a: "Honour the Gi clan"
 oe_yk.3.a.tt: "Goryeo gets #bold #color_yellow The Gi Clan in the Ascendant#!#! for #Y 36#! months: loyalty to its overlord #G +5#!, nobles' power #Y +5%#!, legitimacy #Y −0.05#! a month\nMongol influence (vanilla's count) #Y +1#!\nShould Goryeo break with us, the Gi clan's power goes with it"
 oe_yk.3.b: "Keep the consort clan in check: silk and gold only"
 oe_yk.3.b.tt: "Costs #R 1#! month of trade and tax income\nNo further honours for the empress's kin in Goryeo"
 oe_yk.4.t: "Troops from Goryeo"
 oe_yk.4.desc_h: "#F When the Yuan went to war, it often called on Goryeo for troops. In the fourteenth Zhizheng year (1354) Goryeo sent troops south with Toqto'a against Gaoyou, Choe Yeong among them (the common account).#!\n\nNow the court is at war without pause, and some propose to call on Goryeo for troops. The chance that Goryeo agrees is about #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yk_p4_sv')|0]#!% (the deeper the Mongol influence, the likelier; less if Goryeo is at war or restless)."
 oe_yk.4.desc_g: "#F When the Yuan went to war, it often called on Goryeo for troops.#!\n\nNow the court is at war without pause, and some propose to call on Goryeo for troops. The chance that Goryeo agrees is about #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yk_p4_sv')|0]#!% (the deeper the Mongol influence, the likelier; less if Goryeo is at war or restless)."
 oe_yk.4.a: "Call on Goryeo to send troops"
 oe_yk.4.a.tt: "If a human plays Goryeo, Goryeo answers; otherwise a roll at the chance above\nIf Goryeo agrees: two regiments of Korean light cavalry join us near the fighting (Goryeo's manpower #Y −2#!); Goryeo's opinion of us #R −10#! (#bold #color_yellow Troops Levied#!#!, #Y 60#! months); Mongol influence (vanilla's count) #Y +1#!; the suppression's momentum #G +2#!.\nIf Goryeo refuses: Goryeo's liberty desire #R +5#!; Mongol influence (vanilla's count) #Y −1#!; Our opinion of Goryeo #R −15#! (#bold #color_yellow Refused to Send Troops#!#!, #Y 60#! months)."
 oe_yk.4.b: "Ask for nothing"
 oe_yk.4.b.tt: "Goryeo is left alone"
 oe_yk.5.t: "The Yuan Court Asks for Troops"
 oe_yk.5.desc_x: "#F When the Yuan went to war it often called on Goryeo for troops; whether to send them, and how many, was argued over at Goryeo's court each time.#!\n\nNow envoys from the Yuan court call on us to send troops against the rebels in the south."
 oe_yk.5.a: "Send two regiments"
 oe_yk.5.a.tt: "Two regiments of light cavalry go to the Yuan; our manpower #R −2#!\nOur opinion of the Yuan #Y −10#! (#bold #color_yellow Troops Levied#!#!)\nMongol influence (vanilla's count) #Y +1#!"
 oe_yk.5.b: "Send one regiment"
 oe_yk.5.b.tt: "One regiment of light cavalry goes to the Yuan; our manpower #R −1#!\nOur opinion of the Yuan #Y −5#! (#bold #color_yellow Troops Levied (One Regiment)#!#!)"
 oe_yk.5.c: "Decline"
 oe_yk.5.c.tt: "Our liberty desire #Y 5#!\nMongol influence (vanilla's count) #Y −1#!\nThe Yuan's opinion of us #R −15#! (#bold #color_yellow Refused to Send Troops#!#!)"
 oe_yk.6.t: "The Purge of the Gi Clan"
 oe_yk.6.desc_b1k1s1: "#F In the fifth month of the Bingshen year of Zhizheng, King Gongmin of Goryeo held a banquet at which Gi Cheol, Gwon Gyeom, No Chaek and their kin were slain, abolished the Judicial Office of the Zhengdong Branch Secretariat, dropped the Yuan era name and restored old offices; border commander In Dang also raided the eight post stations west of the Yalu (the raid is attested; the Yuan inquiry and In Dang's execution are from the common account).#!\n\nUrgent word reaches Dadu from Liaoyang: the King of Goryeo held a banquet to purge Gi Cheol and the pro-Yuan lords, abolished the Judicial Office of the Zhengdong Branch Secretariat, and border troops are said to have raided the eight post stations west of the Yalu. The Gi clan had held sway across Goryeo; their sudden ruin has enraged the inner palace. Worse still, the Ssangseong Commandery has already fallen into Goryeo's hands, shaking the northeastern frontier."
 oe_yk.6.desc_b1k1s0: "#F In the fifth month of the Bingshen year of Zhizheng, King Gongmin of Goryeo held a banquet at which Gi Cheol, Gwon Gyeom, No Chaek and their kin were slain, abolished the Judicial Office of the Zhengdong Branch Secretariat, dropped the Yuan era name and restored old offices; border commander In Dang also raided the eight post stations west of the Yalu (the raid is attested; the Yuan inquiry and In Dang's execution are from the common account).#!\n\nUrgent word reaches Dadu from Liaoyang: the King of Goryeo held a banquet to purge Gi Cheol and the pro-Yuan lords, abolished the Judicial Office of the Zhengdong Branch Secretariat, and border troops are said to have raided the eight post stations west of the Yalu. The Gi clan had held sway across Goryeo; their sudden ruin has enraged the inner palace. At least the Ssangseong Commandery still holds for the court, so the eastern road from Liaoyang is not wholly lost."
 oe_yk.6.desc_b1k0s1: "#F In the fifth month of the Bingshen year of Zhizheng, King Gongmin of Goryeo held a banquet at which Gi Cheol, Gwon Gyeom, No Chaek and their kin were slain, abolished the Judicial Office of the Zhengdong Branch Secretariat, dropped the Yuan era name and restored old offices; border commander In Dang also raided the eight post stations west of the Yalu (the raid is attested; the Yuan inquiry and In Dang's execution are from the common account).#!\n\nUrgent word reaches Dadu from Liaoyang: the King of Goryeo held a banquet to purge Gi Cheol and the pro-Yuan lords, abolished the Judicial Office of the Zhengdong Branch Secretariat, and border troops are said to have raided the eight post stations west of the Yalu. Pro-Yuan courtiers in Goryeo have been swept aside, and Dadu's ministers debate what must be done. Worse still, the Ssangseong Commandery has already fallen into Goryeo's hands, shaking the northeastern frontier."
 oe_yk.6.desc_b1k0s0: "#F In the fifth month of the Bingshen year of Zhizheng, King Gongmin of Goryeo held a banquet at which Gi Cheol, Gwon Gyeom, No Chaek and their kin were slain, abolished the Judicial Office of the Zhengdong Branch Secretariat, dropped the Yuan era name and restored old offices; border commander In Dang also raided the eight post stations west of the Yalu (the raid is attested; the Yuan inquiry and In Dang's execution are from the common account).#!\n\nUrgent word reaches Dadu from Liaoyang: the King of Goryeo held a banquet to purge Gi Cheol and the pro-Yuan lords, abolished the Judicial Office of the Zhengdong Branch Secretariat, and border troops are said to have raided the eight post stations west of the Yalu. Pro-Yuan courtiers in Goryeo have been swept aside, and Dadu's ministers debate what must be done. At least the Ssangseong Commandery still holds for the court, so the eastern road from Liaoyang is not wholly lost."
 oe_yk.6.desc_b2k1s1: "#F During the Zhizheng years, while trouble spread across the Central Plain, Goryeo moved to cast off Yuan institutions and the old son-in-law rule, no longer answering to Dadu in everything.#!\n\nUrgent word reaches Dadu from Liaoyang: Goryeo has cast aside the old son-in-law rule and Yuan institutions, openly drawing away from the court. The Gi clan had held sway across Goryeo; their sudden ruin has enraged the inner palace. Worse still, the Ssangseong Commandery has already fallen into Goryeo's hands, shaking the northeastern frontier."
 oe_yk.6.desc_b2k1s0: "#F During the Zhizheng years, while trouble spread across the Central Plain, Goryeo moved to cast off Yuan institutions and the old son-in-law rule, no longer answering to Dadu in everything.#!\n\nUrgent word reaches Dadu from Liaoyang: Goryeo has cast aside the old son-in-law rule and Yuan institutions, openly drawing away from the court. The Gi clan had held sway across Goryeo; their sudden ruin has enraged the inner palace. At least the Ssangseong Commandery still holds for the court, so the eastern road from Liaoyang is not wholly lost."
 oe_yk.6.desc_b2k0s1: "#F During the Zhizheng years, while trouble spread across the Central Plain, Goryeo moved to cast off Yuan institutions and the old son-in-law rule, no longer answering to Dadu in everything.#!\n\nUrgent word reaches Dadu from Liaoyang: Goryeo has cast aside the old son-in-law rule and Yuan institutions, openly drawing away from the court. Pro-Yuan courtiers in Goryeo have been swept aside, and Dadu's ministers debate what must be done. Worse still, the Ssangseong Commandery has already fallen into Goryeo's hands, shaking the northeastern frontier."
 oe_yk.6.desc_b2k0s0: "#F During the Zhizheng years, while trouble spread across the Central Plain, Goryeo moved to cast off Yuan institutions and the old son-in-law rule, no longer answering to Dadu in everything.#!\n\nUrgent word reaches Dadu from Liaoyang: Goryeo has cast aside the old son-in-law rule and Yuan institutions, openly drawing away from the court. Pro-Yuan courtiers in Goryeo have been swept aside, and Dadu's ministers debate what must be done. At least the Ssangseong Commandery still holds for the court, so the eastern road from Liaoyang is not wholly lost."
 oe_yk.6.a: "Send envoys to demand an accounting and the culprits"
 oe_yk.6.a.tt: "If a human plays Goryeo, Goryeo answers; otherwise a roll at the chances below\nIf Goryeo apologizes (#Y 70#!%): Goryeo blames border commanders, stability #Y −2.5#!; our prestige #G +5#!; Mongol influence (vanilla's count) #Y +1#!.\nIf Goryeo ignores the envoys (#Y 30#!%): a lasting grudge forms; Goryeo's liberty desire #R +5#!."
 oe_yk.6.b: "Swallow the affront and let it pass"
 oe_yk.6.b.tt: "The court holds back for now; if Empress Gi still lives, the empress's resentment lingers and deposition may yet be raised"
 oe_yk.6.c: "Issue a decree stripping the King of Goryeo of the royal title"
 oe_yk.6.c.tt: "Goryeo's legitimacy #R −10#!\nGoryeo's opinion of us #R −30#! (#bold #color_yellow Decree Stripping the Royal Title#!#!, #Y 120#! months)\nMongol influence (vanilla's count) #Y −2#!\nA deep grudge forms, bringing the proposal of deposition forward by one to three years"
 oe_yk.7.t: "Yuan Envoys Demand an Accounting"
 oe_yk.7.desc_x: "#F After the Bingshen purge, the common account says Yuan envoys demanded an accounting for the slaughter of the Gi clan and the raid on the eight Yalu stations, and Goryeo laid the blame on border commander In Dang to appease Dadu.#!\n\nEnvoys from Dadu have arrived in Kaesong, demanding an accounting for the purge and the border raids and ordering us to deliver the culprits and send a formal apology. The court is split between appeasement and defiance."
 oe_yk.7.a: "Send apologies and lay the blame on the border commanders"
 oe_yk.7.a.tt: "Our stability #R −2.5#!; the Yuan's prestige #Y 5#!\nMongol influence (vanilla's count) #Y +1#!\nCalms the Yuan court's anger for now"
 oe_yk.7.b: "Leave the demand unanswered"
 oe_yk.7.b.tt: "Our liberty desire #Y 5#!\nCreates a lasting grudge with Dadu; the Yuan court may later seek to depose our king"
 oe_yk.8.t: "Commending Goryeo's Loyalty"
 oe_yk.8.desc_y1: "#F In the late Zhizheng years, as warlords rose on every side, many dependencies wavered. A Goryeo that kept the Yuan era name and the old Zhengdong offices offered Dadu a rare steady eastern flank.#!\n\nThough voices at Goryeo's court pressed to abolish the Judicial Office and break with Dadu, the king overruled them and held fast to the Yuan calendar and the Zhengdong offices. The Central Secretariat urges a public mark of imperial favour."
 oe_yk.8.desc_def: "#F In the late Zhizheng years, as warlords rose on every side, many dependencies wavered. A Goryeo that kept the Yuan era name and the old Zhengdong offices offered Dadu a rare steady eastern flank.#!\n\nThrough all the turmoil in the Central Plain, Goryeo has stayed compliant, sending embassies as before and showing no disloyalty. The Central Secretariat proposes rewarding the kingdom's steadiness."
 oe_yk.8.a: "Confer further honours and a gold seal on the king"
 oe_yk.8.a.tt: "Costs #R 2#! months of trade and tax income\nGoryeo's opinion of us #G +15#! (#bold #color_yellow Further Royal Honours#!#!, #Y 120#! months)\nMongol influence (vanilla's count) #Y +1#!\nGoryeo's stability #G +2.5#!; the deposition crisis is skipped and the line enters its epilogue"
 oe_yk.8.b: "Send a decree of commendation"
 oe_yk.8.b.tt: "The deposition crisis is skipped and the line enters its epilogue"
 oe_yk.9.t: "Red Turbans Cross East"
 oe_yk.9.desc_c61: "#F Red Turban armies invaded Goryeo twice, in 1359 and again in 1361; in the second raid Kaesong itself fell and the Korean court fled south before retaking the capital early the next year.#!\n\nWord arrives from Liaoyang: Red Turban forces have pushed deep into Goryeo and seized the Korean capital! Though the raid draws rebels away from Liaodong, Goryeo is in grave danger. How should the court respond?"
 oe_yk.9.desc_w61: "#F Red Turban armies invaded Goryeo twice, in 1359 and again in 1361; in the second raid Kaesong itself fell and the Korean court fled south before retaking the capital early the next year.#!\n\nLiaoyang reports that strong Red Turban forces have crossed the Yalu into Goryeo, where heavy fighting rages. With rebel strength drawn east, should the court coordinate a pincer from Liaoyang or stand back?"
 oe_yk.9.desc_c59: "#F In the nineteenth Zhizheng year (1359), Red Turban forces crossed the Yalu into Goryeo, taking Seogyeong and briefly relieving rebel pressure on Liaoyang and Dadu.#!\n\nWord arrives from Liaoyang: Red Turban forces have pushed deep into Goryeo and seized the Korean capital! Though the raid draws rebels away from Liaodong, Goryeo is in grave danger. How should the court respond?"
 oe_yk.9.desc_w59: "#F In the nineteenth Zhizheng year (1359), Red Turban forces crossed the Yalu into Goryeo, taking Seogyeong and briefly relieving rebel pressure on Liaoyang and Dadu.#!\n\nLiaoyang reports that strong Red Turban forces have crossed the Yalu into Goryeo, where heavy fighting rages. With rebel strength drawn east, should the court coordinate a pincer from Liaoyang or stand back?"
 oe_yk.9.desc_cg: "#F Red Turban armies campaigning in Liaodong repeatedly crossed the Yalu into Goryeo, shaking the Korean north and drawing rebel strength away from Liaoyang and Dadu.#!\n\nWord arrives from Liaoyang: Red Turban forces have pushed deep into Goryeo and seized the Korean capital! Though the raid draws rebels away from Liaodong, Goryeo is in grave danger. How should the court respond?"
 oe_yk.9.desc_wg: "#F Red Turban armies campaigning in Liaodong repeatedly crossed the Yalu into Goryeo, shaking the Korean north and drawing rebel strength away from Liaoyang and Dadu.#!\n\nLiaoyang reports that strong Red Turban forces have crossed the Yalu into Goryeo, where heavy fighting rages. With rebel strength drawn east, should the court coordinate a pincer from Liaoyang or stand back?"
 oe_yk.9.a: "Order Liaoyang to coordinate with Goryeo against the rebels"
 oe_yk.9.a.tt: "Costs #R 2#! months of trade and tax income\nSuppression momentum #G +3#! (rebel strength split eastward)\nGoryeo's opinion of us #G +15#! (#bold #color_yellow Joint Campaign Against the Red Turbans#!#!, #Y 60#! months)\nIf Goryeo is not hostile, Mongol influence (vanilla's count) #Y +1#!"
 oe_yk.9.b: "Watch from afar as both sides bleed"
 oe_yk.9.b.tt: "Suppression momentum #G +1#!\nGoryeo's opinion of us #R −10#! (#bold #color_yellow Stood By Against the Red Turbans#!#!, #Y 60#! months)"
 oe_yk.9.c: "Press Goryeo for tribute while the kingdom is in peril"
 oe_yk.9.c.tt: "Takes about #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yk_kor3m_sv')|0]#! gold from Goryeo (three months of Goryeo's income, as much as it has) for us\nGoryeo's opinion of us #R −20#! (#bold #color_yellow Exacted Tribute in Hard Times#!#!, #Y 60#! months)\nMongol influence (vanilla's count) #Y −1#!"
 oe_yk.10.t: "The Proposal to Depose the King of Goryeo"
 oe_yk.10.desc_g1r1: "#F In the late Zhizheng years, Empress Gi nursed a grudge over the slaughter of the Gi clan, and Choe Yu of Goryeo urged the Yuan court to depose the King of Goryeo and enthrone Prince Deokheung, Wang Hye (Mongol name: Tash Temür). Wang Hye was a son of King Chungseon, the first Prince of Shen, and old Shen partisans in Liaoyang made common cause with the eastern palace.#!\n\nEmpress Gi has never forgiven the slaughter of the Gi clan and presses the court to depose the King of Goryeo, raise King Chungseon's son Wang Hye, Prince Deokheung, and escort the pretender across the Yalu with Liaoyang troops. Goryeo's capital was recently sacked by Red Turbans, leaving the kingdom battered—an opening the hawks call heaven-sent. (Estimated chance of success: about #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yk_p10_sv')|0]#!%, including +#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yk_syg_deokheung_bonus')|0]#!% from a loyal Prince of Shen; no formal war is declared between Yuan and Goryeo.)"
 oe_yk.10.desc_g1r0: "#F In the late Zhizheng years, Empress Gi nursed a grudge over the slaughter of the Gi clan, and Choe Yu of Goryeo urged the Yuan court to depose the King of Goryeo and enthrone Prince Deokheung, Wang Hye (Mongol name: Tash Temür). Wang Hye was a son of King Chungseon, the first Prince of Shen, and old Shen partisans in Liaoyang made common cause with the eastern palace.#!\n\nEmpress Gi has never forgiven the slaughter of the Gi clan and presses the court to depose the King of Goryeo, raise King Chungseon's son Wang Hye, Prince Deokheung, and escort the pretender across the Yalu with Liaoyang troops. Though strained by border fighting, Goryeo's strength is far from broken, and cautious voices warn against a costly expedition. (Estimated chance of success: about #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yk_p10_sv')|0]#!%, including +#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yk_syg_deokheung_bonus')|0]#!% from a loyal Prince of Shen; no formal war is declared between Yuan and Goryeo.)"
 oe_yk.10.desc_g0r1: "#F In the late Zhizheng years, Empress Gi nursed a grudge over the slaughter of the Gi clan, and Choe Yu of Goryeo urged the Yuan court to depose the King of Goryeo and enthrone Prince Deokheung, Wang Hye (Mongol name: Tash Temür). Wang Hye was a son of King Chungseon, the first Prince of Shen, and old Shen partisans in Liaoyang made common cause with the eastern palace.#!\n\nMinisters at court and old partisans of the Prince of Shen in Liaoyang urge a decree deposing the defiant King of Goryeo and raising King Chungseon's son Wang Hye, Prince Deokheung, escorted by troops from Liaoyang. Goryeo's capital was recently sacked by Red Turbans, leaving the kingdom battered—an opening the hawks call heaven-sent. (Estimated chance of success: about #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yk_p10_sv')|0]#!%, including +#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yk_syg_deokheung_bonus')|0]#!% from a loyal Prince of Shen; no formal war is declared between Yuan and Goryeo.)"
 oe_yk.10.desc_g0r0: "#F In the late Zhizheng years, Empress Gi nursed a grudge over the slaughter of the Gi clan, and Choe Yu of Goryeo urged the Yuan court to depose the King of Goryeo and enthrone Prince Deokheung, Wang Hye (Mongol name: Tash Temür). Wang Hye was a son of King Chungseon, the first Prince of Shen, and old Shen partisans in Liaoyang made common cause with the eastern palace.#!\n\nMinisters at court and old partisans of the Prince of Shen in Liaoyang urge a decree deposing the defiant King of Goryeo and raising King Chungseon's son Wang Hye, Prince Deokheung, escorted by troops from Liaoyang. Though strained by border fighting, Goryeo's strength is far from broken, and cautious voices warn against a costly expedition. (Estimated chance of success: about #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yk_p10_sv')|0]#!%, including +#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yk_syg_deokheung_bonus')|0]#!% from a loyal Prince of Shen; no formal war is declared between Yuan and Goryeo.)"
 oe_yk.10.a: "Raise Prince Deokheung and send ten thousand Liaoyang troops"
 oe_yk.10.a.tt: "Costs #R 6#! months of trade and tax income\nOur manpower #R −5#! (half of the ten thousand Liaoyang troops)\nNext month Prince Deokheung crosses the Yalu into Uiju province as a pretender rebel inside Goryeo (no direct war between Yuan and Goryeo), settled within six months at Dalcheon in Suju (Jeongju)\nIf the Prince of Shen stands as a loyal Yuan subject, settlement chance gains #G +5%#! (and stronger initial rebel backing if Shen was backed in phase 1)"
 oe_yk.10.b: "Issue the decree of deposition, but send no troops"
 oe_yk.10.b.tt: "Goryeo's legitimacy #R −10#!\nGoryeo's opinion of us #R −25#! (#bold #color_yellow Decree of Deposition#!#!, #Y 120#! months)\nMongol influence (vanilla's count) #Y −2#!\nNo troops are sent and no pretender rises; the line enters its epilogue"
 oe_yk.10.c: "Drop the scheme and confirm the King of Goryeo"
 oe_yk.10.c.tt: "Goryeo's opinion of us #G +20#! (#bold #color_yellow Royal Title Restored#!#!, #Y 120#! months)\nMongol influence (vanilla's count) #Y +1#!\nConfirms the reigning King of Goryeo and enters the epilogue"
 oe_yk.11.t: "Prince Deokheung Crosses the Border"
 oe_yk.11.desc_x: "#F From late in the twenty-third Zhizheng year into the first month of the next, ten thousand Liaoyang troops escorted Wang Hye, Prince Deokheung, across the Yalu through Uiju and Seonju to Dalcheon in Suju (Jeongju), where Choe Yeong and Yi Seong-gye defeated them and drove the pretender back across the border.#!\n\nThe Yuan court has decreed a deposition, and Liaoyang troops escort Wang Hye, Prince Deokheung, to the Yalu. If we resist, a pretender army will rise in Uiju province; if we send envoys to apologize, we must offer about #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yk_kor3m_sv')|0]#! gold (three months of our income) to ask for confirmation of the throne."
 oe_yk.11.a: "Send armies to meet the pretender at Dalcheon"
 oe_yk.11.a.tt: "Prince Deokheung's pretender army rises in Uiju province (15% initial progress), settled within six months at Dalcheon in Suju (Jeongju) (half settlement success chance while actively resisted)"
 oe_yk.11.b: "Send envoys to apologize and ask for confirmation of the throne"
 oe_yk.11.b.tt: "No rebel rises; we send about #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yk_kor3m_sv')|0]#! gold (as much as we have) to the Yuan, legitimacy #R −5#!\nMongol influence (vanilla's count) #Y +2#!\nNext month the Yuan court decides whether to restore our king's title"
 oe_yk.12.t: "News from Dalcheon"
 oe_yk.12.desc_f64: "#F In the first month of the twenty-fourth Zhizheng year (1364), the Liaoyang army escorting Prince Deokheung was defeated at Dalcheon in Suju (Jeongju) by Choe Yeong and Yi Seong-gye and retreated into Yuan territory. That year the court restored King Gongmin's title; when Goryeo asked for Prince Deokheung to be handed over, the emperor ordered a hundred and seven strokes of the rod before extradition, yet never sent the prince back.#!\n\nWord of defeat reaches Dadu: the force backing Prince Deokheung was routed at Dalcheon in Suju (Jeongju), and the pretender has fled back into Yuan territory. Should the court now restore the King of Goryeo's title or refuse?"
 oe_yk.12.desc_fg: "#F The Liaoyang force escorting Prince Deokheung marched south to Dalcheon in Suju (Jeongju), where Goryeo commanders Choe Yeong and Yi Seong-gye routed it back across the Yalu. Though Goryeo asked for Prince Deokheung to be turned over, the court spoke of a hundred and seven lashes yet never handed the prince back.#!\n\nWord of defeat reaches Dadu: the force backing Prince Deokheung was routed at Dalcheon in Suju (Jeongju), and the pretender has fled back into Yuan territory. Should the court now restore the King of Goryeo's title or refuse?"
 oe_yk.12.desc_w: "#F The Liaoyang army escorted Wang Hye, Prince Deokheung, across the Yalu, broke resistance at Dalcheon in Suju (Jeongju) and installed a new king in Kaesong. Raised by Yuan arms, the new court leans heavily on Dadu.#!\n\nWord of victory arrives: Prince Deokheung's army prevailed at Dalcheon in Suju (Jeongju) and a new king sits on Goryeo's throne! Envoys arrive to offer thanks—should the court bestow lavish honours or grant investiture alone?"
 oe_yk.12.desc_ap: "#F Before armies clashed at the border, Goryeo's king rushed envoys to Dadu with apologies and gifts, begging the court to withdraw the deposition and confirm the royal title.#!\n\nGoryeo's envoys kneel before the throne with a memorial of apology and tribute, begging the court to recall the decree of deposition and confirm the king's title."
 oe_yk.12.a: "Restore the King of Goryeo's title"
 oe_yk.12.a.tt: "Goryeo's opinion of us #G +20#! (#bold #color_yellow Royal Title Restored#!#!, #Y 120#! months)\nMongol influence (vanilla's count) #Y +1#!\nRecognizes the reigning King of Goryeo and averts a decade of open hostility"
 oe_yk.12.b: "Refuse to restore the title"
 oe_yk.12.b.tt: "Goryeo's stance turns hostile for ten years; Goryeo's liberty desire #R +10#!\nGoryeo's opinion of us #R −30#! (#bold #color_yellow Grudge Over the Attempted Deposition#!#!, #Y 120#! months)"
 oe_yk.12.c: "Invest the new king and bestow generous honours"
 oe_yk.12.c.tt: "Costs #R 2#! months of trade and tax income\nGoryeo gets #bold #color_yellow Yuan-Backed King#!#! for #Y 120#! months: loyalty to overlord #G +10#!, legitimacy #Y −0.05#! a month\nMongol influence (vanilla's count) #Y +3#!\nThe new King of Goryeo is invested"
 oe_yk.12.d: "Grant investiture alone"
 oe_yk.12.d.tt: "Mongol influence (vanilla's count) #Y +2#!\nThe new King of Goryeo is invested"
 oe_yk.12.e: "Accept the apology and confirm the king's title"
 oe_yk.12.e.tt: "Goryeo's opinion of us #G +20#! (#bold #color_yellow Royal Title Restored#!#!, #Y 120#! months)\nMongol influence (vanilla's count) #Y +1#!\nConfirms the King of Goryeo's title"
 oe_yk.12.f: "Still refuse to confirm the title"
 oe_yk.12.f.tt: "Goryeo's stance turns hostile for ten years; Goryeo's liberty desire #R +10#!\nGoryeo's opinion of us #R −30#! (#bold #color_yellow Grudge Over the Attempted Deposition#!#!, #Y 120#! months)"
 oe_yk.20.t: "The Yuan and Goryeo: the choice takes effect"
 oe_yk.90.t: "[TEST] The Yuan and Goryeo: readings"
