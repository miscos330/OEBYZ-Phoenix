 oe_l5.6.t: "Adrianoúpolis"
 oe_l5.6.desc_ymq: "#F Adrianoúpolis fell to the Ottomans around 1369 (an older account puts it as early as 1361). The city's metropolitan wrote a poem that shows it was still the empire's at Christmas 1366. Later Turkish histories say that Lala Şahin defeated the commander outside the walls; others say the raiders of the march took it on their own; yet another account has the townspeople open the gates in return for leave to stay. After the city fell most of its people were carried off, and the metropolitan died there.#!\n\nNow the Ottoman horsemen are under the walls of Adrianoúpolis. The city has sent to the capital to ask: hold, or treat? Didymóteichon is already the sultan's. Sultan Murad's envoy has come too, and says that those who open the gates may stay where they live."
