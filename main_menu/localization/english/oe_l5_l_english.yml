 oe_l5.5.b.tt: "Didymóteichon goes to the Ottomans\nA truce of #Y 10#! years with the Ottomans\nThe Ottomans: opinion of the empire #G +20#! for #Y 10#! years\nThe Ottomans' ransom: gains #G 1#! month of trade and tax income"
