 oe_l5.3.t: "The Road to Buda"
 oe_l5.3.desc_lrgt: "#F In the spring of 1366 the emperor went in person to Buda to see King Louis of Hungary and ask the king to march against the Ottomans. The king's terms were plain: first the emperor must return to the Roman Church, or at least have the patriarch acknowledge the pope's primacy; only then would there be talk of an army. It is said that the pope also wrote, urging the king not to help the 'schismatics'.#!\n\nNow the Ottomans have a firm foothold in Thrace. Some at court say the emperor should go to Buda in person. King Louis is willing to receive the emperor, but everyone knows what the king wants. The Green Count's ships are already in the straits. Letters are still going back and forth with Avignon."
