 oe_l5.7.t: "The Despot's Appeal"
 oe_l5.7.desc_yu: "#F In 1371 Jovan Uglješa, despot of Sérrai, meant to strike at Adrianoúpolis while Sultan Murad was away in Anatolia. The despot asked the empire and Bulgaria for help, and got none. That autumn the despot and an elder brother, Vukašin, fell on the Maritsa at Chernomen.#!\n\nNow envoys from [GetLocationByKey('serres').GetName] have come to the palace: they ask the empire for troops, or at least for money. The despot has not forgotten the welcome the empire once gave."
 oe_l5.7.desc_y: "#F In 1371 Jovan Uglješa, despot of Sérrai, meant to strike at Adrianoúpolis while Sultan Murad was away in Anatolia. The despot asked the empire and Bulgaria for help, and got none. That autumn the despot and an elder brother, Vukašin, fell on the Maritsa at Chernomen.#!\n\nNow envoys from [GetLocationByKey('serres').GetName] have come to the palace: they ask the empire for troops, or at least for money."
 oe_l5.7.desc_u: "#F The histories say that Jovan Uglješa, despot of Sérrai, meant to strike at Adrianoúpolis while Sultan Murad was away in Anatolia. The despot asked the empire and Bulgaria for help, and got none; soon after, the despot and an elder brother, Vukašin, fell on the Maritsa at Chernomen.#!\n\nNow envoys from [GetLocationByKey('serres').GetName] have come to the palace: they ask the empire for troops, or at least for money. The despot has not forgotten the welcome the empire once gave."
 oe_l5.7.desc_x: "#F The histories say that Jovan Uglješa, despot of Sérrai, meant to strike at Adrianoúpolis while Sultan Murad was away in Anatolia. The despot asked the empire and Bulgaria for help, and got none; soon after, the despot and an elder brother, Vukašin, fell on the Maritsa at Chernomen.#!\n\nNow envoys from [GetLocationByKey('serres').GetName] have come to the palace: they ask the empire for troops, or at least for money."
 oe_l5.7.a: "Send troops to help"
 oe_l5.7.a.tt: "Costs #R 2#! months of trade and tax income\nCosts #R 2#! months of manpower\nSerbia: opinion of the empire #G +30#! for #Y 10#! years\nThe Ottomans: opinion of the empire #R −30#! for #Y 10#! years\nNo war with the Ottomans comes of it; the battle on the Maritsa is still decided by Serbia's own troubles\nThe people of [GetLocationByKey('serres').GetName] will remember that the empire's soldiers came"
