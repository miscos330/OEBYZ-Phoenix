 oe_l5.5.t: "The Gates of Didymóteichon"
 oe_l5.5.desc_ya: "#F In 1360 or 1361 the Ottomans took Didymóteichon. The town is not far from Adrianoúpolis, and later the sultan's court stayed there for a time.#!\n\nNow there are more and more Turkish horsemen around the town. The town has sent to the capital to ask: hold, or treat? Serbia or Bulgaria is allied to the empire; help might be called on. An Ottoman envoy has come too, and says there is money for those who give the town up."
 oe_l5.5.desc_y: "#F In 1360 or 1361 the Ottomans took Didymóteichon. The town is not far from Adrianoúpolis, and later the sultan's court stayed there for a time.#!\n\nNow there are more and more Turkish horsemen around the town. The town has sent to the capital to ask: hold, or treat? An Ottoman envoy has come too, and says there is money for those who give the town up."
 oe_l5.5.desc_a: "#F Didymóteichon is a fortress of Thrace not far from Adrianoúpolis. The histories say that it later fell to the Ottomans, and that the sultan's court stayed there for a time.#!\n\nNow there are more and more Turkish horsemen around the town. The town has sent to the capital to ask: hold, or treat? Serbia or Bulgaria is allied to the empire; help might be called on. An Ottoman envoy has come too, and says there is money for those who give the town up."
 oe_l5.5.desc_x: "#F Didymóteichon is a fortress of Thrace not far from Adrianoúpolis. The histories say that it later fell to the Ottomans, and that the sultan's court stayed there for a time.#!\n\nNow there are more and more Turkish horsemen around the town. The town has sent to the capital to ask: hold, or treat? An Ottoman envoy has come too, and says there is money for those who give the town up."
 oe_l5.5.a: "Send troops and hold the town to the last"
 oe_l5.5.a.tt: "Costs #R 2#! months of trade and tax income\nCosts #R 2#! months of manpower\nChance to hold: #G [GetCountry('BYZ').MakeScope.ScriptValue('oe_l5_hold_chance')|0]%#!\nHeld: Didymóteichon gains [ShowModifier('oe_l5_held')] for #Y 20#! years; later, the chance to hold Adrianoúpolis #G +15%#!\nLost: Didymóteichon goes to the Ottomans, a truce of #Y 5#! years with the Ottomans, prestige #R −10#!"
