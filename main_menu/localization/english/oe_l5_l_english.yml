 oe_l5.7.b.tt: "Costs #R 1#! month of trade and tax income\nSerbia: opinion of the empire #G +10#! for #Y 5#! years"
 oe_l5.7.c: "Stay out of it"
 oe_l5.7.c.tt: "Serbia: opinion of the empire #R −15#! for #Y 5#! years"
 oe_l5.2.t: "The Empty Houses"
 oe_l5.2.desc_si: "#F After the plague many houses in the City stood empty, and the fields outside went untilled. It is said that two thirds of the people died; the figure is surely too high, but the streets were empty all the same.#!\n\nNow the ministers bring the emperor the rolls of empty houses and untilled fields: where are the people to come from? In the west, the Serbs have taken Epirus in the confusion. Envoys have already gone to ask the Italian merchants to settle in the City."
 oe_l5.2.desc_s: "#F After the plague many houses in the City stood empty, and the fields outside went untilled. It is said that two thirds of the people died; the figure is surely too high, but the streets were empty all the same.#!\n\nNow the ministers bring the emperor the rolls of empty houses and untilled fields: where are the people to come from? In the west, the Serbs have taken Epirus in the confusion. Some say Italian merchants should be asked to settle in the City; the emperor has not yet decided."
