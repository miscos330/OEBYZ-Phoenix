 oe_l5.2.a: "Bring in people from Thrace and the islands, with some years free of taxes"
 oe_l5.2.a.tt: "Costs #R 1#! month of trade and tax income\nFor #Y 10#! years resettlement costs half the gold, and the wait between two resettlements is #Y 12#! months instead of #Y 24#!"
 oe_l5.2.b: "Take the ownerless lands into the treasury"
 oe_l5.2.b.tt: "Gains #G 2#! months of trade and tax income"
 oe_l5.2.c: "Remit the City's taxes for a year"
 oe_l5.2.c.tt: "The empire gains [ShowModifier('oe_l5_remission')] for #Y 1#! years\nThe City gains [ShowModifier('oe_l5_remission_city')] for #Y 5#! years"
 oe_l5.8.t: "The Plague Returns"
 oe_l5.8.desc_yra: "#F After the Black Death the plague came back to Constantinople many times: the first return was in 1361, and there were about eleven in all.#!\n\nNow the plague is back. The old still remember what it was like the last time. Last time the empire shut the harbour and burned the houses of the sick."
 oe_l5.8.desc_yrb: "#F After the Black Death the plague came back to Constantinople many times: the first return was in 1361, and there were about eleven in all.#!\n\nNow the plague is back. The old still remember what it was like the last time. Last time the empire kept the gates open and let the grain ships in."
 oe_l5.8.desc_yrc: "#F After the Black Death the plague came back to Constantinople many times: the first return was in 1361, and there were about eleven in all.#!\n\nNow the plague is back. The old still remember what it was like the last time. Last time the emperor led the almsgiving and the monasteries took in the orphans."
 oe_l5.8.desc_yr: "#F After the Black Death the plague came back to Constantinople many times: the first return was in 1361, and there were about eleven in all.#!\n\nNow the plague is back. The old still remember what it was like the last time."
 oe_l5.8.desc_ya: "#F After the Black Death the plague came back to Constantinople many times: the first return was in 1361, and there were about eleven in all.#!\n\nNow the plague is back. It is not the first time, and the City knows what to do. Last time the empire shut the harbour and burned the houses of the sick."
