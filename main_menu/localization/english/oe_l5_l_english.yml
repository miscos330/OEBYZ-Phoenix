 oe_l5.91.t: "News from the Walls"
 oe_l5.91.desc_x611: "Held: the Ottoman horsemen have drawn off, and Adrianoúpolis is still the empire's. The city has strengthened its defences ([ShowModifier('oe_l5_held')], #Y 20#! years)."
 oe_l5.91.desc_x612: "Lost: the city has fallen, and Adrianoúpolis is the sultan's. The empire and the Ottomans have a truce of #Y 5#! years."
 oe_l5.91.desc_x613: "Lost; but the city is not in the empire's hands just now (under siege or occupied), so the handing over must wait."
 oe_l5.91.desc_x511: "Held: the relief arrived in time, and Didymóteichon is still the empire's. The town has strengthened its defences ([ShowModifier('oe_l5_held')], #Y 20#! years); later, the chance to hold Adrianoúpolis #G +15%#!."
 oe_l5.91.desc_x512: "Lost: Didymóteichon is the sultan's. The empire and the Ottomans have a truce of #Y 5#! years."
 oe_l5.91.desc_x513: "Lost; but Didymóteichon is not in the empire's hands just now (under siege or occupied), so the handing over must wait."
 oe_l5.91.desc_x: "The news has come back."
 oe_l5.91.a: "So be it"
 oe_l5.90.t: "The Plague and Thrace: the choice takes effect"
