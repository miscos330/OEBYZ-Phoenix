l_english:
 OE_L5_PL_1A: "The plague in the City: the empire shut the harbour and burned the houses of the sick. Andronikos, son of Kantakouzenos, died of the plague."
 OE_L5_PL_2A: "The plague in the City: the empire kept the gates open and let the grain ships in. Andronikos, son of Kantakouzenos, died of the plague."
 OE_L5_PL_3A: "The plague in the City: the emperor led the almsgiving and the monasteries took in the orphans. Andronikos, son of Kantakouzenos, died of the plague."
 OE_L5_PL_1: "The plague in the City: the empire shut the harbour and burned the houses of the sick."
 OE_L5_PL_2: "The plague in the City: the empire kept the gates open and let the grain ships in."
 OE_L5_PL_3: "The plague in the City: the emperor led the almsgiving and the monasteries took in the orphans."
 OE_L5_PL_S: "The plague in the City: the empire is still deciding what to do."
 OE_L5_PL_G: "The plague in the City: the City is no longer the empire's."
 OE_L5_PL_X: "The plague in the City: in these years the plague did not reach the City."
 OE_L5_PL_W: "The plague in the City: not yet (from the autumn of 1346)."
 OE_L5_BU_1: "Buda: the emperor went in person and promised to accept Rome's faith."
 OE_L5_BU_2: "Buda: the emperor went in person, spoke of soldiers, not faith, and came back empty-handed."
 OE_L5_BU_3: "Buda: the empire sent envoys; the emperor stayed in the capital."
 OE_L5_BU_4: "Buda: the empire did not go begging to the Latins."
 OE_L5_BU_X: "Buda: the emperor never made the journey to Hungary."
 OE_L5_BU_W: "Buda: not yet (from the summer of 1365)."
 OE_L5_AD_1: "Adrianoúpolis: the empire threw everything in and held the city."
 OE_L5_AD_2: "Adrianoúpolis: the empire threw everything in, and the city fell."
 OE_L5_AD_3: "Adrianoúpolis: the gates were opened and its people stayed."
 OE_L5_AD_4: "Adrianoúpolis: the Greeks moved to the capital and left the city empty."
 OE_L5_AD_G: "Adrianoúpolis: the city was no longer the empire's."
 OE_L5_AD_X: "Adrianoúpolis: in these years the Ottomans did not come for the city."
 OE_L5_AD_W: "Adrianoúpolis: not yet (from the summer of 1366)."
 OE_L5_EM_1: "The empty houses: the empire brought in people from Thrace and the islands."
 OE_L5_EM_2: "The empty houses: the ownerless lands went to the treasury."
 OE_L5_EM_3: "The empty houses: the City was spared a year's taxes."
 OE_L5_EM_G: "The empty houses: the plague never reached the City, or the City was no longer the empire's."
 OE_L5_EM_X: "The empty houses: in these years nobody saw to bringing the people back."
 OE_L5_EM_W: "The empty houses: not yet (after the plague)."
 OE_L5_DE_1: "Didymóteichon: the relief came in time and the town held."
 OE_L5_DE_2: "Didymóteichon: troops were sent, and the town fell."
 OE_L5_DE_3: "Didymóteichon: the town was given up for peace."
 OE_L5_DE_4: "Didymóteichon: the townspeople left with the army for the capital."
 OE_L5_DE_G: "Didymóteichon: the town was no longer the empire's."
 OE_L5_DE_X: "Didymóteichon: in these years the Ottomans did not come for the town."
 OE_L5_DE_W: "Didymóteichon: not yet (from the summer of 1359)."
 OE_L5_UG_1: "The despot's appeal: the empire sent troops."
 OE_L5_UG_2: "The despot's appeal: the empire sent only money."
 OE_L5_UG_3: "The despot's appeal: the empire stayed out of it."
 OE_L5_UG_G: "The despot's appeal: Serbia was no more."
 OE_L5_UG_X: "The despot's appeal: no appeal came."
 OE_L5_UG_W: "The despot's appeal: not yet (from the summer of 1370)."
 OE_L5_PH_1: "Philippópolis: it fell to the Ottomans."
 OE_L5_PH_3: "Philippópolis: held by the empire's side; the Ottomans did not take it."
 OE_L5_PH_4: "Philippópolis: it was the Ottomans' already."
 OE_L5_PH_X: "Philippópolis: in these years it did not change hands."
 OE_L5_PH_W: "Philippópolis: not yet (from the summer of 1362)."
 OE_L5_RE_4: "The plague came back to the City #Y 4#! times."
 OE_L5_RE_3: "The plague came back to the City #Y 3#! times."
 OE_L5_RE_2: "The plague came back to the City #Y 2#! times."
 OE_L5_RE_1: "The plague came back to the City #Y 1#! time."
 OE_L5_RE_0: "The plague has not come back to the City."
 STATIC_MODIFIER_NAME_oe_l5_burned: "After the Burning"
 STATIC_MODIFIER_NAME_oe_l5_open_gates: "The Gates Stay Open"
 STATIC_MODIFIER_NAME_oe_l5_port_shut: "The Harbour Shut"
 STATIC_MODIFIER_NAME_oe_l5_abroad: "The Emperor Abroad"
 STATIC_MODIFIER_NAME_oe_l5_held: "The City Held"
 STATIC_MODIFIER_NAME_oe_l5_remission: "A Year's Remission"
 STATIC_MODIFIER_NAME_oe_l5_remission_city: "Calling the People Home"
 STATIC_MODIFIER_NAME_oe_l5_burned_half: "After the Burning (Again)"
 STATIC_MODIFIER_NAME_oe_l5_port_shut_half: "The Harbour Shut (Again)"
 STATIC_MODIFIER_NAME_oe_l5_open_gates_half: "The Gates Stay Open (Again)"
 oe_l5_b_buda_pledge: "The emperor came to Buda and promised to accept Rome's faith"
 oe_l5_b_buda_pledge_pap: "The Byzantine emperor promised to accept Rome's faith"
 oe_l5_b_buda_cold: "The emperor came for soldiers but would not speak of the Church"
 oe_l5_b_buda_envoy: "Byzantium sent envoys to Buda for help"
 oe_l5_b_gift: "Opened the gates of a city to us"
 oe_l5_b_aid: "The empire sent troops to help us against the Ottomans"
 oe_l5_b_aid_tur: "The empire sent troops to help the Serbs"
 oe_l5_b_aid_coin: "The empire sent money for the war"
 oe_l5_b_refused: "The empire refused our appeal"
 oe_l5.1.t: "The Third Day"
 oe_l5.1.desc_awsy: "#F In 1347 the plague came into the City with the ships from the northern shore. It is said that on the third day of the sickness Kantakouzenos's youngest son, Andronikos, was dead. Kantakouzenos later wrote of it in the words Thucydides had used for the plague of Athens; Gregoras wrote that it spared neither men nor women, rich nor poor, old nor young, and that no one could save anyone.#!\n\nNow the dead are carried out of the City every day. Some burn the houses of the sick; others crowd into the churches to repent and give alms. The ministers ask the emperor: close the harbour, or keep the gates open? The new emperor entered the City only months ago, and the plague has followed. The ships came from Caffa; they were Genoese ships. In the palace they are already preparing Andronikos's funeral."
