l_english:
 oe_pillars_daily.1.t: "Encroaching Estates"
 oe_pillars_daily.1.d: "Farmers from [SCOPE.sLocation('oe_daily_location').GetName] have petitioned the throne with their old deeds. Stewards of the [SCOPE.sDynasty('oe_daily_family').GetName] house are redrawing the boundaries, claiming the neighbouring fields as ancestral property. The local magistrate has checked the registers but hesitates to rule. A letter from [SCOPE.sCharacter('oe_daily_head').GetName] invokes the family’s longstanding standing in the district. Both claims now await imperial judgement."
 oe_pillars_daily.1.a: "Uphold the registers and halt the encroachment."
 oe_pillars_daily.1.a.tt: "#R Authority −1#!; #R [SCOPE.sDynasty('oe_daily_family').GetName] Influence −10#!. Prevent this encroachment."
 oe_pillars_daily.1.b: "Settle the disputed deeds from the privy purse."
 oe_pillars_daily.1.b.tt: "#R Spend one month of privy-purse income ([SCOPE.GetValue('oe_daily_months_1')|2][gold_i])#!. Prevent this encroachment; sufficient funds required."
 oe_pillars_daily.1.c: "Recognize the new boundaries."
 oe_pillars_daily.1.c.tt: "#R Public Opinion −2#!. The [SCOPE.sDynasty('oe_daily_family').GetName] house gains #R control of [SCOPE.sLocation('oe_daily_location').GetName]#!."
 oe_pillars_daily.2.t: "Protests in the Capital"
 oe_pillars_daily.2.d: "A crowd has gathered outside the capital’s offices. Bread prices, unanswered petitions and petty fees are shouted at the guards. The neighbourhood delegates demand an official empowered to act. The magistrates fear that continued silence will turn grievances into violence."
 oe_pillars_daily.2.a: "Disperse the crowd."
 oe_pillars_daily.2.a.tt: "#R Public opinion -2#!."
 oe_pillars_daily.2.b: "Meet their demands."
 oe_pillars_daily.2.b.tt: "#R Spend 3 month(s) of income in the privy purse ([SCOPE.GetValue('oe_daily_months_3')|2][gold_i])#!.\nCost is fixed when the event opens. Requires sufficient privy-purse funds."
 oe_pillars_daily.2.c: "Break the [SCOPE.sDynasty('oe_daily_family').GetName] house’s hold on the capital’s industries."
 oe_pillars_daily.2.c.tt: "#R Authority −1#!. Remove the [SCOPE.sDynasty('oe_daily_family').GetName] house’s industrial control in the capital; other houses retain their holdings."
 oe_pillars_daily.3.t: "The Delayed Grain Ships"
 oe_pillars_daily.3.d: "The expected grain ships have not arrived. Millers bid for dwindling stocks, while queues outside the bakeries lengthen. The harbour officials report no ships lost, but cannot say when the grain will reach the warehouses. The throne must find another supply before the markets run dry."
 oe_pillars_daily.3.a: "Buy grain and sell it at a fair price."
 oe_pillars_daily.3.a.tt: "#R Spend 2 month(s) of income in the privy purse ([SCOPE.GetValue('oe_daily_months_2')|2][gold_i])#!.\n#G Public opinion +1#!.\nCost is fixed when the event opens. Requires sufficient privy-purse funds."
 oe_pillars_daily.3.b: "Accept the [SCOPE.sDynasty('oe_daily_family').GetName] house’s offer of fairly priced grain."
 oe_pillars_daily.3.b.tt: "#R [SCOPE.sDynasty('oe_daily_family').GetName] Influence −30#!. The house gains #R control of [SCOPE.sLocation('oe_daily_location').GetName]#!; #G Public Opinion +1#!. No privy-purse expense."
 oe_pillars_daily.3.c: "The ships will come, and the unrest will pass."
 oe_pillars_daily.3.c.tt: "#R Public opinion -2#!."
 oe_pillars_daily.4.t: "Veterans at the Palace Gates"
 oe_pillars_daily.4.d: "Several veterans wait at the palace gates with their service rolls and unpaid wage claims. Peace has returned, but they have neither fields nor savings to support their families. The clerks confirm their service. The court must decide whether to settle the arrears or find them another livelihood."
 oe_pillars_daily.4.a: "They shed their blood for Rome."
 oe_pillars_daily.4.a.tt: "#R Spend 2 month(s) of income in the privy purse ([SCOPE.GetValue('oe_daily_months_2')|2][gold_i])#!.\n#G Public opinion +1#!.\nCost is fixed when the event opens. Requires sufficient privy-purse funds."
 oe_pillars_daily.4.b: "Entrust their settlement to the [SCOPE.sDynasty('oe_daily_family').GetName] house."
 oe_pillars_daily.4.b.tt: "#G [SCOPE.sDynasty('oe_daily_family').GetName] Influence +50#!; #G Public Opinion +1#!. Settle the veterans on the house’s existing rural estates, with no privy-purse expense or additional territorial claim."
 oe_pillars_daily.4.c: "Their service has ended, and so has our obligation."
 oe_pillars_daily.4.c.tt: "#R Public opinion -2#!."
 oe_pillars_daily.5.t: "A Bountiful Harvest"
 oe_pillars_daily.5.d: "The harvest returns bring welcome news. Timely rain and full ears of grain have filled the threshing floors, making good the shortfalls of earlier years. Farmers hope to keep enough surplus to repair their homes, while estate stewards prepare their reports for the throne."
 oe_pillars_daily.5.a: "Let the farmers keep their surplus."
 oe_pillars_daily.5.a.tt: "#G Public opinion +2#!."
 oe_pillars_daily.5.b: "The estates may offer a modest gift to the throne."
 oe_pillars_daily.5.b.tt: "#G Gain 2 month(s) of income in the privy purse ([SCOPE.GetValue('oe_daily_months_2')|2][gold_i])#!."
 oe_pillars_daily.5.c: "Proclaim the harvest throughout the cities."
 oe_pillars_daily.5.c.tt: "#G Authority +1#!.\n#G Prestige +3#!."
 oe_pillars_daily.6.t: "The Guilds’ Celebration"
 oe_pillars_daily.6.d: "The city guilds are preparing a joint celebration, but the order of the procession has become a bitter dispute. Goldsmiths refuse to follow the weavers, while shipowners demand a place near the officials. The citizens await their holiday as the guild masters appeal to the court."
 oe_pillars_daily.6.a: "Settle the order at court and let the festivities proceed."
 oe_pillars_daily.6.a.tt: "#R Authority -1#!.\n#G Public opinion +2#!."
 oe_pillars_daily.6.b: "Provide enough funds to accommodate every guild."
 oe_pillars_daily.6.b.tt: "#R Spend 1 month(s) of income in the privy purse ([SCOPE.GetValue('oe_daily_months_1')|2][gold_i])#!.\n#G Public opinion +2#!.\nCost is fixed when the event opens. Requires sufficient privy-purse funds."
 oe_pillars_daily.6.c: "If none will yield, cancel the celebration."
 oe_pillars_daily.6.c.tt: "#R Public opinion -1#!."
 oe_pillars_daily.7.t: "Bread at the Monastery Gates"
 oe_pillars_daily.7.d: "The monks have set great pots before the monastery gates and are feeding the poor with donated grain. Unemployed craftsmen now join the widows and elderly in the queue. Some ask why the imperial authorities did not act first. With supplies dwindling, the abbot has appealed for help."
 oe_pillars_daily.7.a: "Send further relief in the emperor’s name."
 oe_pillars_daily.7.a.tt: "#R Spend 1 month(s) of income in the privy purse ([SCOPE.GetValue('oe_daily_months_1')|2][gold_i])#!.\n#G Public opinion +3#!.\nCost is fixed when the event opens. Requires sufficient privy-purse funds."
 oe_pillars_daily.7.b: "Let their good work receive public praise."
 oe_pillars_daily.7.b.tt: "#G Public opinion +1#!.\n#G Clergy estate satisfaction +3%#!."
 oe_pillars_daily.7.c: "The authorities must take responsibility for relief."
 oe_pillars_daily.7.c.tt: "#G Authority +1#!.\n#R Clergy estate satisfaction -3%#!."
 oe_pillars_daily.8.t: "A Discrepancy in the Accounts"
 oe_pillars_daily.8.d: "A clerk checking old accounts has discovered that the same delivery of timber was paid for twice. Further inquiries uncovered money concealed among false expenses. The officials responsible are under guard, and the recovered funds await a decision from the throne."
 oe_pillars_daily.8.a: "Return the money to the privy purse."
 oe_pillars_daily.8.a.tt: "#G Gain 2 month(s) of income in the privy purse ([SCOPE.GetValue('oe_daily_months_2')|2][gold_i])#!."
 oe_pillars_daily.8.b: "Pay the merchants and craftsmen still owed their due."
 oe_pillars_daily.8.b.tt: "#G Public opinion +2#!."
 oe_pillars_daily.8.c: "Reward the investigators and make the case public."
 oe_pillars_daily.8.c.tt: "#G Authority +1#!."
 oe_pillars_daily.9.t: "A Magnate’s Gift"
 oe_pillars_daily.9.d: "An envoy of the [SCOPE.sDynasty('oe_daily_family').GetName] house has brought several chests of gold. [SCOPE.sCharacter('oe_daily_head').GetName] writes of the court’s heavy expenses and the family’s duty to assist. An accompanying note lists properties recently examined by local officials. The envoy asks for nothing outright, merely that the throne remember this loyalty and accord the house greater standing."
 oe_pillars_daily.9.a: "Accept the gift and publicly commend their loyalty."
 oe_pillars_daily.9.a.tt: "#G Authority +1#!; #G gain three months of privy-purse income ([SCOPE.GetValue('oe_daily_months_3')|2][gold_i])#!; #G [SCOPE.sDynasty('oe_daily_family').GetName] Influence +50#!."
 oe_pillars_daily.9.b: "Keep the gift and set their expectations aside."
 oe_pillars_daily.9.b.tt: "#G Gain three months of privy-purse income ([SCOPE.GetValue('oe_daily_months_3')|2][gold_i])#!; #R Authority −1#!; #R Nobles estate satisfaction −3%#!."
 oe_pillars_daily.9.c: "Return the gift and uphold the inquiry."
 oe_pillars_daily.9.c.tt: "#G Authority +1#!; #R [SCOPE.sDynasty('oe_daily_family').GetName] Influence −15#!."
 oe_pillars_daily.10.t: "A Broken Watercourse"
 oe_pillars_daily.10.d: "A rural watercourse has broken during the night, damaging a road and cutting off water to the fields below. The neighboring estates deny responsibility for the neglected section. Craftsmen have assessed the repairs, but delay will only spread the damage."
 oe_pillars_daily.10.a: "Release the funds for immediate repairs."
 oe_pillars_daily.10.a.tt: "#R Spend 2 month(s) of income in the privy purse ([SCOPE.GetValue('oe_daily_months_2')|2][gold_i])#!.\n#G Public opinion +1#!.\nCost is fixed when the event opens. Requires sufficient privy-purse funds."
 oe_pillars_daily.10.b: "Make the neighboring estates share the cost."
 oe_pillars_daily.10.b.tt: "#R Authority -1#!."
 oe_pillars_daily.10.c: "Patch the breach and leave proper repairs for next year."
 oe_pillars_daily.10.c.tt: "#R Public opinion -2#!."
 oe_pillars_daily.11.t: "The Cost of Ceremony"
 oe_pillars_daily.11.d: "With foreign envoys approaching, the ceremonial officials have submitted requests for hangings, silverware and banquets. The accountants attach a sheaf of unpaid bills: imperial splendour must still be paid for in coin. The throne must choose between customary hospitality and a reception the visitors will long remember."
 oe_pillars_daily.11.a: "Let the envoys witness the splendor of Rome."
 oe_pillars_daily.11.a.tt: "#R Spend 2 month(s) of income in the privy purse ([SCOPE.GetValue('oe_daily_months_2')|2][gold_i])#!.\n#G Authority +1#!.\n#G Prestige +5#!.\nCost is fixed when the event opens. Requires sufficient privy-purse funds."
 oe_pillars_daily.11.b: "Follow established custom without further expense."
 oe_pillars_daily.11.b.tt: "#G Prestige +1#!."
 oe_pillars_daily.11.c: "Reduce the banquet and provide relief for the citizens."
 oe_pillars_daily.11.c.tt: "#R Authority -1#!.\n#G Public opinion +2#!."
 oe_pillars_daily.12.t: "Merchants Returned"
 oe_pillars_daily.12.d: "A party of merchants has returned safely with foreign goods and news of distant towns and ports. In thanks for their official travel papers, they offer the court a gift. They also report several way stations in need of repair, and have tales enough to entertain the visiting envoys."
 oe_pillars_daily.12.a: "Place the gift in the privy purse."
 oe_pillars_daily.12.a.tt: "#G Gain 2 month(s) of income in the privy purse ([SCOPE.GetValue('oe_daily_months_2')|2][gold_i])#!."
 oe_pillars_daily.12.b: "Repair the way stations along the trading routes."
 oe_pillars_daily.12.b.tt: "#G Public opinion +1#!.\n#G Burghers estate satisfaction +3%#!."
 oe_pillars_daily.12.c: "Invite them to share their travels with the envoys."
 oe_pillars_daily.12.c.tt: "#G Authority +1#!.\n#G Prestige +3#!."
 oe_pillars_daily.2.d.house: "A crowd has gathered outside the capital’s offices. Bread prices, unanswered petitions and petty fees are shouted at the guards. The neighbourhood delegates demand an official empowered to act. The magistrates fear that continued silence will turn grievances into violence. Several petitions name workshops and shops controlled by the [SCOPE.sDynasty('oe_daily_family').GetName] house. Clients of [SCOPE.sCharacter('oe_daily_head').GetName] insist that every claim rests on a lawful deed; the petitioners demand an end to the family’s control."
 oe_pillars_daily.3.d.house: "The expected grain ships have not arrived. Millers bid for dwindling stocks, while queues outside the bakeries lengthen. The harbour officials report no ships lost, but cannot say when the grain will reach the warehouses. The throne must find another supply before the markets run dry. The [SCOPE.sDynasty('oe_daily_family').GetName] house offers grain from its estates at a regulated price, in return for control of the fields at [SCOPE.sLocation('oe_daily_location').GetName]. [SCOPE.sCharacter('oe_daily_head').GetName] has submitted the proposed prices together with the deeds."
 oe_pillars_daily.4.d.house: "Several veterans wait at the palace gates with their service rolls and unpaid wage claims. Peace has returned, but they have neither fields nor savings to support their families. The clerks confirm their service. The court must decide whether to settle the arrears or find them another livelihood. The [SCOPE.sDynasty('oe_daily_family').GetName] house offers to settle them on its existing estates at [SCOPE.sLocation('oe_daily_location').GetName]. Stewards of [SCOPE.sCharacter('oe_daily_head').GetName] promise shelter, seed and tools, though the veterans will thereafter belong to the household’s circle of tenants and clients."
 oe_pillars_daily.11.d.house: "With foreign envoys approaching, the ceremonial officials have submitted requests for hangings, silverware and banquets. The accountants attach a sheaf of unpaid bills: imperial splendour must still be paid for in coin. The throne must choose between customary hospitality and a reception the visitors will long remember. The [SCOPE.sDynasty('oe_daily_family').GetName] house offers to meet the additional expense, asking only a prominent place for [SCOPE.sCharacter('oe_daily_head').GetName] at the feast so that the envoys may see who sustains the throne."
 oe_pillars_daily.11.d_option: "Accept sponsorship from the [SCOPE.sDynasty('oe_daily_family').GetName] house."
 oe_pillars_daily.11.d.tt: "#G Prestige +3#!; #G [SCOPE.sDynasty('oe_daily_family').GetName] Influence +10#!. No privy-purse expense."
