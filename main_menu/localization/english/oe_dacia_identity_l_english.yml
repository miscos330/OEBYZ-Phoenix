l_english:
 OE_RW_ASSIM_DACIA_TITLE: "Begin Dacian Identity Movement"
 OE_RW_ASSIM_DACIA_ROW: "Dacian Culture"
 OE_RW_ASSIM_DACIA_FLAVOR: "North of the Danube, shepherds cross the Carpathian passes, while markets and monasteries preserve echoes of an ancient tongue. As imperial law, schools and military service reach the mountains and plains, their peoples will embrace a shared Roman homeland under the name of Dacia."
 OE_RW_ASSIM_DACIA_CONDITION: "Byzantium and all levels of its subjects must own at least 65% of conquerable locations in Moldavia, Wallachia and Transylvania. Military occupation alone does not count."
 OE_RW_ASSIM_DACIA_NOT_STARTED: "The Dacian identity movement has not yet begun"
 OE_RW_ASSIM_DACIA_SOURCES: "Converts the entire Romanian culture group: [ShowCultureName('aromanian')], [ShowCultureName('istroromanian')], [ShowCultureName('moldovan')], [ShowCultureName('transylvanian')], [ShowCultureName('wallachian')]."
 OE_RW_ASSIM_DACIA_TARGET: "Gradually forms [ShowCultureName('oe_moldova_greek_culture')] culture.\n\n$OE_RW_ASSIM_SUBJECT_SPREAD$"
 OE_RW_ASSIM_DACIA_WAITING: "Not started"
 OE_RW_ASSIM_DACIA_STARTED: "Started: Dacia"
 oe_dacia_identity_movement: "Dacian Identity Movement"
 oe_dacia_identity_movement_desc: "North of the Danube, shepherds cross the Carpathian passes, while markets and monasteries preserve echoes of an ancient tongue. As imperial law, schools and military service reach the mountains and plains, their peoples will embrace a shared Roman homeland under the name of Dacia.\n\n$OE_IDENTITY_FIXED_30Y_DESC$"
 oe_rw_dacia_romanization_started: "Dacian Romanization begun"
 oe_cb_byz_vs_wal: "Homeland of the Vampire"
 oe_cb_byz_vs_wal_desc: "Across the Danube, tales travel faster than envoys through the forests and crags. Whatever titles the mountain lords may claim, the empire will restore order to this ancient frontier.\n\nOnly Byzantium may fabricate and use this justification against Wallachia. Attacker warscore costs for taking land, subjugation and releasing countries: #G −50%#!. Aggressive expansion (AE) from the peace deal: #G −50%#!."
 war_goal_oe_vampire_homeland: "Conquer Wallachia"
 war_goal_oe_vampire_homeland_desc: "Occupy Wallachian territory and compel its ruler to accept imperial terms."
 OE_RW_ASSIM_DACIA_PROGRESS: "Owned: [GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_rw_assim_dacia_owned')|0] / [GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_rw_assim_dacia_total')|0]; at least [GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_rw_assim_dacia_required')|0] required."
