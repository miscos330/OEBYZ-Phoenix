 STATIC_MODIFIER_NAME_oe_ydg_favorites: "Favorites at Court"
 STATIC_MODIFIER_DESC_oe_ydg_favorites: "Palace favorites meddle in affairs of state, weakening the throne's hold and the Secretariat's work."
 STATIC_MODIFIER_NAME_oe_ydg_two_palaces_rift: "Suspicion Between the Palaces"
 STATIC_MODIFIER_DESC_oe_ydg_two_palaces_rift: "With talk of abdication left unresolved, mistrust grows between the emperor and the Eastern Palace."
 STATIC_MODIFIER_NAME_oe_ydg_regency: "The Heir's Regency"
 STATIC_MODIFIER_DESC_oe_ydg_regency: "The heir apparent oversees military and civil administration as regent, uniting command for the time being."
 STATIC_MODIFIER_NAME_oe_ydg_chosgem: "Chosgem in Power"
 STATIC_MODIFIER_DESC_oe_ydg_chosgem: "Chosgem and the palace faction monopolize the Secretariat, bogging down administration."
 oe_ydg.1.t: "Hama's Plot for Abdication"
 oe_ydg.1.desc_x: "#F In the sixteenth Zhizheng year (1356), Left Chancellor Hama (of Qangli lineage) and the Censor-in-Chief Suisui conspired to have the emperor retire as Retired Emperor and enthrone the Crown Prince to secure court favor; word leaked out, provoking fury in the Daming Hall (History of Yuan, 205).#!\n\nNow the imperial guard units in Dadu (the Qipchaq, Asud, and Qangli guards, closed by custom to Han and Southerners) watch every move at court; the guards currently answer to #Y [GetCountry('CHI').Custom('oe_ydg_panel_guard')]#!, and Eastern Palace influence stands at #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_power')|0]#!. Secret reports warn that Hama and Suisui have sounded out attendants of the Eastern Palace on forcing an abdication."
 oe_ydg.1.a: "Execute Hama and Suisui"
 oe_ydg.1.a.tt: "Eastern Palace influence #Y −15#!; court opinion in the suppression improves (#G +6#!)."
 oe_ydg.1.b: "Dismiss Hama and Reprimand the Heir"
 oe_ydg.1.b.tt: "Eastern Palace influence #Y −25#!; deep resentment lingers in the Eastern Palace, raising pressure in later disputes."
 oe_ydg.1.c: "Look the Other Way"
 oe_ydg.1.c.tt: "Eastern Palace influence #Y +20#!; unless held by a strongman, the imperial guards shift to #bold #color_yellow the Eastern Palace#!#!."
 oe_ydg.2.t: "Talk of Abdication"
 oe_ydg.2.desc_res: "#F In the twentieth Zhizheng year (1360), the Empress and the Crown Prince sent the eunuch Bak Bulhwa to sound out Left Chancellor Taiping on persuading the emperor to abdicate; Taiping declined to act, deepening suspicion between the two palaces (History of Yuan, 140).#!\n\nResentment from the earlier reprimand still smolders. With Eastern Palace influence at #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_power')|0]#! and the guards answering to #Y [GetCountry('CHI').Custom('oe_ydg_panel_guard')]#!, the Empress and heir press Chancellor Taiping openly on abdication."
 oe_ydg.2.desc_x: "#F In the twentieth Zhizheng year (1360), the Empress and the Crown Prince sent the eunuch Bak Bulhwa to sound out Left Chancellor Taiping on persuading the emperor to abdicate; Taiping declined to act, deepening suspicion between the two palaces (History of Yuan, 140).#!\n\nEastern Palace influence has reached #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_power')|0]#!, with the imperial guards answering to #Y [GetCountry('CHI').Custom('oe_ydg_panel_guard')]#!. The Empress and the Crown Prince again cite the burdens of war and sound out Chancellor Taiping on an abdication in favor of the heir."
 oe_ydg.2.a: "Taiping Demurs and the Throne Lets It Rest"
 oe_ydg.2.a.tt: "Eastern Palace influence #Y +10#!; the rift widens and the Eastern Palace is likely to move against Taiping later."
 oe_ydg.2.b: "Reprimand the Heir and Reclaim the Guards"
 oe_ydg.2.b.tt: "Costs #R 1#! month of income and #R −5#! stability (halved if the imperial guards already answer to the Throne).\nEastern Palace influence #Y −30#!; the Qipchaq, Asud, and Qangli guards are firmly reclaimed by #bold #color_yellow the Throne#!#!."
 oe_ydg.2.c: "Yield the Regency to the Heir"
 oe_ydg.2.c.tt: "Eastern Palace influence set to #Y 85#!; imperial guards shift to #bold #color_yellow the Eastern Palace#!#!; suppression momentum #G +8#!.\nThe two palaces reach a settlement, avoiding the later internal strife over Taiping and the four-province levy."
 oe_ydg.3.t: "The Heir Ousts Taiping"
 oe_ydg.3.desc_x: "#F After Left Chancellor Taiping resigned in 1360, the Empress and Eastern Palace still nursed their grievance; Right Chancellor Chosgem and Bak Bulhwa pressed repeated impeachments, drawing court business into their faction's hands (History of Yuan, 140).#!\n\nEastern Palace influence stands at #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_power')|0]#! with the guards answering to #Y [GetCountry('CHI').Custom('oe_ydg_panel_guard')]#!. Chosgem and the heir's partisans submit joint memorials demanding Taiping's dismissal and Chosgem's sole direction of the Secretariat."
 oe_ydg.3.a: "Dismiss Taiping and Elevate Chosgem"
 oe_ydg.3.a.tt: "Eastern Palace influence #Y +10#!; court opinion in the suppression worsens (#R −8#!)."
 oe_ydg.3.b: "Stand by Taiping and Check the Heir"
 oe_ydg.3.b.tt: "Eastern Palace influence #Y −20#!; if the imperial guards answer to the Throne, gain #G +5#! prestige."
 oe_ydg.4.t: "The Heir Summons the Princes of Four Provinces"
 oe_ydg.4.desc_x: "#F In the twenty-fourth Zhizheng year (1364), when Bolod Temür marched into Dadu and seized power, the Crown Prince fled to Taiyuan and joined Köke Temür, issuing edicts to summon the princes of Lingbei, Gansu, Liaoyang, and Shaanxi against Bolod (History of Yuan, 46 & 141).#!\n\nBolod Temür now holds sway in Dadu while the guards answer to #Y [GetCountry('CHI').Custom('oe_ydg_panel_guard')]#! and Eastern Palace influence stands at #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_power')|0]#!. From Taiyuan the Crown Prince calls on the frontier princes and Köke Temür's armies, forcing a choice."
 oe_ydg.4.a: "Summon the Princes to March on the Capital"
 oe_ydg.4.a.tt: "Calls the princes' aid levy for manpower; compliant princes boost suppression momentum (#G +3#! to #G +8#!), while estranged princes lose an extra #R −5#! loyalty.\nEastern Palace influence #Y +15#!."
 oe_ydg.4.b: "Rely on Köke Temür Alone"
 oe_ydg.4.b.tt: "Leaves the princes' loyalty untouched; strengthens Köke Temür's faction (#G +15#! allegiance if holding the Henan domain) and adds #G +5#! suppression momentum."
 oe_ydg.4.c: "Recall the Heir to Parley"
 oe_ydg.4.c.tt: "If a strongman holds the imperial guards, parley has a 75% chance to fail (#R −5#! legitimacy; on success, Eastern Palace influence #Y −10#!); otherwise 70% success (#Y −15#! influence)."
 oe_ydg.20.t: "Two Palaces & Eastern Palace: choice takes effect"
 oe_ydg.90.t: "[TEST] Two Palaces & Imperial Guards: readings"
 oe_ydg.90.d: "#T Panel terms#! Eastern Palace [GetCountry('CHI').Custom('oe_ydg_panel_power')]  Guards [GetCountry('CHI').Custom('oe_ydg_panel_guard')]\n#T Line and core meters#!\nend [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_end')|0]  opened [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_opened')|0]  open month [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_openm')|0]  power [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_power')|0]  guard [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_guard')|0]  guard lock [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_glock')|0]\n#T External state and drift#!\nToghon rules [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_togon')|0]  Crown Prince alive [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_cp')|0]  flavor_chi.29 [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_gi29')|0]  ministers(B/T/Bo) [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_ministers')|0]  shi<40 [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_shilo')|0]  restore>=2 [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_yr2')|0]  compliant princes [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_loyp')|0]  mod bits [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_mods')|0]\n#T Events and choices#!\n.1 st/c [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_st1')|0]  c [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_c1')|0]  .2 st/c [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_st2')|0]  c [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_c2')|0]  .3 st/c [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_st3')|0]  c [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_c3')|0]  .4 st/c [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_st4')|0]  c [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_c4')|0]  parley ok [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_c4ok')|0]  resentment [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_resent')|0]\n#T Schedule#!\nmonth [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_m')|0]  ev guard [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_evm')|0]  wait [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_wait')|0]  last [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_last')|0]  sent [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_cnt')|0]\n(end: 1 heir enthroned 2 Yuan fell 3 another ruler 4 reached 1370 8 off; guard: 1 throne 2 strongman 3 heir; status: 0 pending 1 fired 2 lapsed; mods: 1 favorites 10 rift 100 regency 1000 Chosgem)"
 oe_ydg.90.a: "Close"
 oe_ydg.90.b: "Refresh"
