 oe_cel.90.a: "Close"
 oe_cel.90.b: "Refresh"
 STATIC_MODIFIER_NAME_oe_cel_frontier_princes_mod: "Princes on the Frontier"
 STATIC_MODIFIER_DESC_oe_cel_frontier_princes_mod: "The princes keep strong guards and hold the frontier for the court."
 STATIC_MODIFIER_NAME_oe_cel_guards_stripped_mod: "Stripped of His Guards"
 STATIC_MODIFIER_DESC_oe_cel_guards_stripped_mod: "The court has taken this prince's guards from him by degrees."
 STATIC_MODIFIER_NAME_oe_cel_fiefs_subdued_mod: "Awe After the Rebellion"
 STATIC_MODIFIER_DESC_oe_cel_fiefs_subdued_mod: "With the rebel prince put down, no one dares slight the court."
 STATIC_MODIFIER_NAME_oe_cel_fiefs_defiant_mod: "Shame of the Compromise"
 STATIC_MODIFIER_DESC_oe_cel_fiefs_defiant_mod: "The court failed to master its prince, and its standing has suffered."
 STATIC_MODIFIER_NAME_oe_cel_gtgl_resistance_mod: "Native Resistance"
 STATIC_MODIFIER_DESC_oe_cel_gtgl_resistance_mod: "Direct rule has stirred the native lords to resist."
 STATIC_MODIFIER_NAME_oe_cel_ideology_left_mod: "Way of Government: Order and Teaching"
 STATIC_MODIFIER_DESC_oe_cel_ideology_left_mod: "In the great debate the throne chose the party of central order and moral teaching."
 STATIC_MODIFIER_NAME_oe_cel_ideology_right_mod: "Way of Government: Change and Practice"
 STATIC_MODIFIER_DESC_oe_cel_ideology_right_mod: "In the great debate the throne chose the party of adaptation and practical affairs."
 STATIC_MODIFIER_NAME_oe_cel_twin_phoenix_mod: "Twin Phoenixes of the Silk Road"
 STATIC_MODIFIER_DESC_oe_cel_twin_phoenix_mod: "One ruler holds both the Roman and the celestial tradition."
 STATIC_MODIFIER_NAME_oe_cel_sun_never_sets_mod: "The Sun Never Sets"
 STATIC_MODIFIER_DESC_oe_cel_sun_never_sets_mod: "The throne's protectorates span six great regions."
