 oe_cel.1.title: "The Mandate Is Ours"
 oe_cel.1.desc: "The Mandate of Heaven rests with us. After the manner of our house, the [ROOT.GetCountry.Custom('GetCelestialCourtBureau')] oversees the subject realms and the throne commands by [ROOT.GetCountry.Custom('GetCelestialDecreeStyle')]. Princely fiefs, pacification commissions and protectorates across the seas each have their place."
 oe_cel.1.a: "We continue the rightful line"
 oe_cel.2.title: "A Touxia Prince Asks for a Great Ulus"
 oe_cel.2.desc: "A touxia prince petitions to have his appanage raised to a great ulus, above the other princes. If we consent he will serve gratefully; if we refuse he is bound to resent it."
 oe_cel.2.a: "Grant his request"
 oe_cel.2.b: "Refuse"
 oe_cel.3.title: "Princes Guard the Frontier"
 oe_cel.3.desc: "The first prince of the blood has gone to his fief. With his own guards he can shield the realm; but guards too strong may one day be turned against the court."
 oe_cel.3.a: "Give the princes strong guards"
 oe_cel.3.b: "Keep their forces small"
 oe_cel.4.title: "The Great Princes Enfeoffed"
 oe_cel.4.desc: "The founding generals and princes of the house have been made princes, each holding a region. Their armies put down disorder well; the court must see that enfeoffment does not become the beginning of separatism."
 oe_cel.4.a: "Rely on them as our shield"
 oe_cel.4.b: "Favour them now and curb them in time"
 oe_cel.5.title: "The Question of the Foreign Throne"
 oe_cel.5.desc: "We are not the old masters of the Central Plain, yet the Mandate is now ours. Court and country wait to see whether the new dynasty will take up the celestial institutions entirely or keep its own tradition. The choice can be made by decision."
 oe_cel.5.a: "We shall decide in due course"
 oe_cel.6.title: "[ROOT.GetCountry.Custom('GetCelestialCrisisName')]"
 oe_cel.6.desc: "The court has ordered a prince stripped of his title. He refuses the order and proclaims that evil ministers are dividing the imperial house. Shall we march against him, strip him of his guards by degrees, or withdraw the order?"
 oe_cel.6.a: "March against him"
 oe_cel.6.b: "Strip him of his guards by degrees"
 oe_cel.6.c: "Withdraw the order"
 oe_cel.7.title: "The Rebel Prince Is Put Down"
 oe_cel.7.desc: "The prince who defied the throne has been put down, and no one now dares slight the court's commands."
 oe_cel.7.a: "The realm is one"
 oe_cel.8.title: "A Compromise with the Princes"
 oe_cel.8.desc: "In the end the court could not master the prince and had to leave him be. The fief stands almost as an equal, and the court's standing has suffered."
 oe_cel.8.a: "We bear it for now"
 oe_cel.9.title: "A Prince Has Died"
 oe_cel.9.desc: "One of the princes has died. By custom his heir succeeds to the fief; the court may instead take this chance to withdraw the title and leave an ordinary vassal."
 oe_cel.9.a: "Let his heir succeed"
 oe_cel.9.b: "Withdraw the title"
 oe_cel.10.title: "A Prince Has Died at His Post"
 oe_cel.10.desc: "A prince of the house sent to reside abroad has died at his post. His coffin will be brought home for burial."
 oe_cel.10.a: "Give him a generous funeral"
 oe_cel.10.b: "Follow the usual rites"
 oe_cel.11.title: "A [ROOT.GetCountry.Custom('GetCelestialDuhuTitle')] Is Founded"
 oe_cel.11.desc: "The court has set up an office in a distant land and granted it a seal. Its commands now reach foreign parts, and what is explored there is shared with the throne."
 oe_cel.11.a: "Our virtue reaches afar"
 oe_cel.12.title: "Protectorates in Three Regions"
 oe_cel.12.desc: "The throne's protectorates now span three great regions. The outer peoples submit, and an order under heaven begins to take shape."
 oe_cel.12.a: "An order under heaven takes shape"
 oe_cel.13.title: "A Seal for the [ROOT.GetCountry.Custom('GetCelestialPacifierTitle')]"
 oe_cel.13.desc: "A local chief has received a seal and sworn fealty. He keeps his land by inheritance and sends tribute on schedule; the court leaves his customs alone as long as he keeps the peace."
 oe_cel.13.a: "Rule by their own custom"
 oe_cel.14.title: "Native Lords Resist"
 oe_cel.14.desc: "As word of direct rule spreads, hereditary lords and headmen gather their followers to resist, declaring that the land of their ancestors cannot be taken."
 oe_cel.14.a: "Send troops"
 oe_cel.14.b: "Win them over with gifts"
 oe_cel.15.title: "Direct Rule Established"
 oe_cel.15.desc: "A loose-rein territory now has appointed officials; its households are registered and taxed like any inner province."
 oe_cel.15.a: "One with the inner provinces"
 oe_cel.16.title: "Commanderies at One Stroke"
 oe_cel.16.desc: "The court has abolished native rule and set up commanderies at one stroke. The newly ruled lands are unsettled; they need garrisons, and they need relief."
 oe_cel.16.a: "Garrison the new commanderies"
 oe_cel.16.b: "Remit taxes and send grain"
 oe_cel.17.title: "Assembly of the [ROOT.GetCountry.Custom('GetCelestialCourtBureau')]"
 oe_cel.17.desc: "The heads of the commissions and native offices have gathered in assembly, renewed their bonds and received their gifts. The frontier is quiet for a time."
 oe_cel.17.a: "Favour and awe together"
 oe_cel.18.title: "The Great Debate on Government"
 oe_cel.18.desc: "The court is divided over how to govern: one party argues for [ROOT.GetCountry.Custom('GetCelestialIdeologyLeft')], the other for [ROOT.GetCountry.Custom('GetCelestialIdeologyRight')]. The throne's choice will set the tone for a generation."
 oe_cel.18.a: "Favour [ROOT.GetCountry.Custom('GetCelestialIdeologyLeft')]"
 oe_cel.18.b: "Favour [ROOT.GetCountry.Custom('GetCelestialIdeologyRight')]"
 oe_cel.19.title: "The Debate Is Settled"
 oe_cel.19.desc: "The argument has died down, and court and country accept the throne's ruling."
 oe_cel.19.a: "One voice prevails"
 oe_cel.20.title: "The Mandate Wanes"
 oe_cel.20.desc: "The Mandate wanes and portents multiply. Among the subject realms they ask in private whether the Son of Heaven still deserves his seat."
 oe_cel.20.a: "Sacrifice to Heaven and mend our ways"
 oe_cel.20.b: "Rumours are nothing to fear"
 oe_cel.21.title: "Treasure Fleets Sail the Four Seas"
 oe_cel.21.desc: "The court has turned to trade by treasure fleet. Great ships set sail for distant lands, and merchants of every nation gather at our ports."
 oe_cel.21.a: "Set sail"
 oe_cel.22.title: "Twin Phoenixes of the Silk Road"
 oe_cel.22.desc: "The emperor of the Romans has become the Son of Heaven. The two empires at either end of the Silk Road now own one lord, and envoys from Constantinople and the Central Plain meet each other on the way."
 oe_cel.22.a: "Lord of East and West"
 oe_cel.23.title: "Fusang Meets New Rome"
 oe_cel.23.desc: "Word comes from the protectorate of Fusang: Romans have founded a realm on the far shore and call it Nova Elysia. Two empires that crossed two oceans have met in the new world."
 oe_cel.23.a: "Send envoys in friendship"
 oe_cel.24.title: "The Sun Never Sets on the Four Seas"
 oe_cel.24.desc: "The throne's protectorates now span six great regions. Wherever the sun rises or sets, there are those who keep the calendar of the Son of Heaven."
 oe_cel.24.a: "All beneath sun and moon is the king's land"
 oe_cel.90.title: "[Readout] The Celestial Throne"
 oe_cel.90.desc_header: "v11.2 celestial readout (0 main-line slots):"
 oe_cel.90.desc_not_emperor: "\n· This country does not hold the Mandate; nothing below applies."
 oe_cel.90.desc_track: "\n· Track #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_cel_track_value')|0]#! (1 Yuan, 2 Ming and Han, 3 Qing and Manchu, 4 Sinosphere, 5 foreign); bureau #Y [ROOT.GetCountry.Custom('GetCelestialCourtBureau')]#!; crisis #Y [ROOT.GetCountry.Custom('GetCelestialCrisisName')]#!"
 oe_cel.90.desc_override_on: "\n· Track test override: #R on#!"
 oe_cel.90.desc_override_off: "\n· Track test override: off"
 oe_cel.90.desc_counts: "\n· Grand protectorates #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_cel_duhu_count_value')|0]#!, zones covered #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_cel_zone_count_value')|0]#!; revocation heat #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_cel_revocation_heat_value')|0]#!"
