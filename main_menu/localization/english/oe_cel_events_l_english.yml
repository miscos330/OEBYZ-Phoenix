# NEW 2026-11-22 v11.2 Worker 4 (oe_cel_). Generated by gen_v112_celestial_events.py; edit the generator, not this file.
 oe_cel.1.title: "The Mandate Is Ours"
 oe_cel.1.desc: "The Mandate of Heaven rests with us. After the manner of our house, the [ROOT.GetCountry.Custom('GetCelestialCourtBureau')] oversees the subject realms and the throne commands by [ROOT.GetCountry.Custom('GetCelestialDecreeStyle')]. Princely fiefs, pacification commissions and protectorates across the seas each have their place."
 oe_cel.1.a: "We continue the rightful line"
 oe_cel.2.title: "A Touxia Prince Asks for a Great Ulus"
 oe_cel.2.desc: "A touxia prince petitions to have his appanage raised to a great ulus, above the other princes. If we consent he will serve gratefully; if we refuse he is bound to resent it."
 oe_cel.2.a: "Grant his request"
 oe_cel.2.b: "Refuse"
 oe_cel.3.title: "Princes Guard the Frontier"
 oe_cel.3.desc: "The first prince of the blood has taken leave of the court and departed with his household banners to guard a vital frontier fief. Entrusted with troops and regional revenues, a strong princely seat can shield the realm against outside foes, yet an overmighty retinue may one day turn its blades against the throne itself."
 oe_cel.3.a: "Give the princes strong guards"
 oe_cel.3.b: "Keep their forces small"
 oe_cel.4.title: "The Great Princes Enfeoffed"
 oe_cel.4.desc: "The founding generals and princes of the house have been made princes, each holding a region. Their armies put down disorder well; the court must see that enfeoffment does not become the beginning of separatism."
 oe_cel.4.a: "Rely on them as our shield"
 oe_cel.4.b: "Favour them now and curb them in time"
 oe_cel.5.title: "The Question of the Foreign Throne"
 oe_cel.5.desc: "We are not the old masters of the Central Plain, yet the Mandate is now ours. Court and country wait to see whether the new dynasty will take up the celestial institutions entirely or keep its own tradition. The choice can be made by decision."
 oe_cel.5.a: "We shall decide in due course"
 oe_cel.6.title: "[ROOT.GetCountry.Custom('GetCelestialCrisisName')]"
 oe_cel.6.desc: "The court has ordered a prince stripped of his title. He refuses the order and proclaims that evil ministers are dividing the imperial house. Shall we march against him, strip him of his guards by degrees, or withdraw the order?"
 oe_cel.6.a: "March against him"
 oe_cel.6.b: "Strip him of his guards by degrees"
 oe_cel.6.c: "Withdraw the order"
 oe_cel.7.title: "The Rebel Prince Is Put Down"
 oe_cel.7.desc: "The defiant prince who raised his standard against the throne has been crushed by imperial arms, his fortresses reclaimed and his followers scattered. As tidings of the victory spread through every circuit and border march, vassals and courtiers alike are reminded that the edicts of the court cannot be slighted with impunity."
 oe_cel.7.a: "The realm is one"
 oe_cel.8.title: "A Compromise with the Princes"
 oe_cel.8.desc: "After a costly struggle, the court proved unable to subdue the rebellious prince and was forced to settle on terms that leave him largely master of his own domain. Standing almost as an equal to the throne, the unbroken fief emboldens watchful vassals across the realm and deals a stinging blow to imperial prestige."
 oe_cel.8.a: "We bear it for now"
 oe_cel.9.title: "A Prince Has Died"
 oe_cel.9.desc: "Couriers have arrived in the capital bearing word that one of the enfeoffed princes has passed away. By established dynastic custom his heir should inherit both title and domain, yet senior ministers urge the throne to seize this transition to withdraw the princely patent and reduce the fief to an ordinary vassalage."
 oe_cel.9.a: "Let his heir succeed"
 oe_cel.9.b: "Withdraw the title"
 oe_cel.10.title: "A Prince Has Died at His Post"
 oe_cel.10.desc: "A prince of the imperial house dispatched to oversee a distant post has died in service far from the capital. His retainers and local officials have prepared his coffin for the long journey home to the ancestral tombs, awaiting the court's decree on whether to grant a lavish state funeral or observe only the customary rites."
 oe_cel.10.a: "Give him a generous funeral"
 oe_cel.10.b: "Follow the usual rites"
 oe_cel.11.title: "A [ROOT.GetCountry.Custom('GetCelestialDuhuTitle')] Is Founded"
 oe_cel.11.desc: "The court has established a formal protectorate seat in a distant land, dispatching imperial seals, tallies, and officials to govern diplomacy and frontier affairs. Royal commands now carry across far horizons, and every chart, route, and discovery won beyond the border returns directly to enrich the throne."
 oe_cel.11.a: "Our virtue reaches afar"
 oe_cel.12.title: "Protectorates in Three Regions"
 oe_cel.12.desc: "Imperial protectorates now span three great theatres of the world, linked by tireless couriers and ocean-going fleets. From steppe confederations to distant maritime kingdoms, foreign envoys gather to offer tribute and acknowledge the throne, heralding the rise of a grand order under Heaven."
 oe_cel.12.a: "An order under heaven takes shape"
 oe_cel.13.title: "A Seal for the [ROOT.GetCountry.Custom('GetCelestialPacifierTitle')]"
 oe_cel.13.desc: "A frontier chieftain has bowed before imperial envoys to accept his seal and patent of office, swearing fealty, regular tribute, and faithful defence of the marches. Content to govern with a loose rein, the court leaves local laws and ancestral customs intact so long as the region remains peaceful and obedient."
 oe_cel.13.a: "Rule by their own custom"
 oe_cel.14.title: "Native Lords Resist"
 oe_cel.14.desc: "No sooner did word of direct imperial administration reach the highlands than hereditary native lords and village headmen rallied their clans to resist. Barricading the mountain passes and turning away magistrates, they swear never to surrender ancestral domains, forcing the court to choose between armed suppression and costly conciliation."
 oe_cel.14.a: "Send troops"
 oe_cel.14.b: "Win them over with gifts"
 oe_cel.15.title: "Direct Rule Established"
 oe_cel.15.desc: "After careful surveying and administrative transition, a former loose-rein frontier territory has been formally placed under appointed magistrates. Households are entered upon the regular census rolls, taxes and grain levies follow imperial standards, and the district now stands fully integrated with the inner provinces."
 oe_cel.15.a: "One with the inner provinces"
 oe_cel.16.title: "Commanderies at One Stroke"
 oe_cel.16.desc: "In a single decisive stroke, the court has abolished hereditary native lordships and erected regular commanderies across the frontier. Yet the newly incorporated districts remain uneasy and suspicious of unfamiliar officials; securing lasting order demands either firm garrisoning or generous tax remissions and grain relief."
 oe_cel.16.a: "Garrison the new commanderies"
 oe_cel.16.b: "Remit taxes and send grain"
 oe_cel.17.title: "Assembly of the [ROOT.GetCountry.Custom('GetCelestialCourtBureau')]"
 oe_cel.17.desc: "Chieftains of the pacification commissions and hereditary border offices have gathered in solemn assembly beneath imperial banners. Having renewed their oaths of allegiance, confirmed tribute schedules, and received ceremonial silks and silver from the court, the frontier lords depart content, securing quiet along the marches."
 oe_cel.17.a: "Favour and awe together"
 oe_cel.18.title: "The Great Debate on Government"
 oe_cel.18.desc: "The court is divided over how to govern: one party argues for [ROOT.GetCountry.Custom('GetCelestialIdeologyLeft')], the other for [ROOT.GetCountry.Custom('GetCelestialIdeologyRight')]. The throne's choice will set the tone for a generation."
 oe_cel.18.a: "Favour [ROOT.GetCountry.Custom('GetCelestialIdeologyLeft')]"
 oe_cel.18.b: "Favour [ROOT.GetCountry.Custom('GetCelestialIdeologyRight')]"
 oe_cel.19.title: "The Debate Is Settled"
 oe_cel.19.desc: "After days of impassioned memorials and fierce disputation in the audience hall, the great policy debate has finally subsided. With the sovereign's final verdict proclaimed across ministries and provinces alike, rival factions bow to a single imperial will, restoring calm and unity to the realm."
 oe_cel.19.a: "One voice prevails"
 oe_cel.20.title: "The Mandate Wanes"
 oe_cel.20.desc: "Floods, blights, and unsettling portents have struck in grim succession as imperial standing visibly falters. Behind closed doors, tributary rulers and watchful magnates whisper among themselves, questioning whether Heaven still favours the reigning dynasty and whether the Son of Heaven truly merits his seat."
 oe_cel.20.a: "Sacrifice to Heaven and mend our ways"
 oe_cel.20.b: "Rumours are nothing to fear"
 oe_cel.21.title: "Treasure Fleets Sail the Four Seas"
 oe_cel.21.desc: "Embracing the grand ocean-going course, the court has dispatched towering treasure fleets to trade across the Four Seas. Bearing fine silk, porcelain, and tea to distant kingdoms, the great ships draw merchants from every shore back toward imperial ports, turning coastal harbours into bustling hubs of world commerce."
 oe_cel.21.a: "Set sail"
 oe_cel.22.title: "Twin Phoenixes of the Silk Road"
 oe_cel.22.desc: "The emperor of the Romans has become the Son of Heaven. The two empires at either end of the Silk Road now own one lord, and envoys from Constantinople and the Central Plain meet each other on the way."
 oe_cel.22.a: "Lord of East and West"
 oe_cel.23.title: "Fusang Meets New Rome"
 oe_cel.23.desc: "Word comes from the protectorate of Fusang: Romans have founded a realm on the far shore and call it Nova Elysia. Two empires that crossed two oceans have met in the new world."
 oe_cel.23.a: "Send envoys in friendship"
 oe_cel.24.title: "The Sun Never Sets on the Four Seas"
 oe_cel.24.desc: "Imperial protectorates now span six great regions across the globe, linking distant archipelagos, caravan cities, and oceanic ports under one diplomatic canopy. Wherever the sun rises or sets, peoples far beyond the old frontier reckon their calendar by the Son of Heaven, proclaiming an empire without rival."
 oe_cel.24.a: "All beneath sun and moon is the king's land"
 oe_cel.25.title: "Five-Household Silk Stipends & Provincial Reform"
 oe_cel.25.desc: "The Secretariat submits two plans for the touxia appanages: keep the prince's touxia standing intact while branch secretariats collect taxes and issue commuted Five-Household Silk stipends, or buy out the appanage outright and convert it into an ordinary provincial vassal."
 oe_cel.25.a: "Commute the silk into branch stipends (keep touxia status)"
 oe_cel.25.b: "Abolish the appanage and absorb into ordinary vassalage"
 oe_cel.26.title: "Palembang Commission & the Enfeoffment of Malacca"
 oe_cel.26.desc: "Sails crowd the Nanyang straits. With Palembang and Malacca within the Celestial orbit, every ship bound between the South Seas and the Indian Ocean passes this choke point. The court may issue a royal charter to boost maritime trade, or fortify protectorate naval depots."
 oe_cel.26.a: "Charter the strait hub and open Nanyang maritime trade"
 oe_cel.26.b: "Fortify protectorate naval supply depots"
 oe_cel.27.title: "Treasure Fleets at Calicut & the Galle Trilingual Stele"
 oe_cel.27.desc: "Great treasure ships ride the monsoon into Calicut and Ceylon. Envoys raise a trilingual stele in Chinese, Tamil, and Persian, exchanging gifts with Indian Ocean courts and projecting Celestial prestige across the Western Ocean."
 oe_cel.27.a: "Raise the trilingual stele and open Indian Ocean trade"
 oe_cel.27.b: "Record the Western Ocean rutters and charts"
 oe_cel.28.title: "Hami Guard & the Western Regions Silk Road Relays"
 oe_cel.28.desc: "The oasis corridors of Hami, Turpan, and Kashgar reopen under the Celestial banner. Caravans of silk, jade, and horses cross the passes; the throne may endow permanent Silk Road relay guards or levy caravan customs for the treasury."
 oe_cel.28.a: "Endow the Hami Guard and Silk Road relay posts"
 oe_cel.28.b: "Collect oasis caravan customs for the treasury"
 oe_cel.29.title: "Nurgan Regional Commission & the Yongning Temple Stele"
 oe_cel.29.desc: "Imperial commissioners sail down the Sungari and Amur to Nurgan and Ningguta, erecting the Yongning Temple stele to pacify the northeastern tribes, secure frontier posts, and regulate fur and horse markets."
 oe_cel.29.a: "Inscribe the Yongning stele and patrol the Amur guards"
 oe_cel.29.b: "Expand the northeastern fur and horse markets"
 oe_cel.30.title: "A Prince Recalled to the Imperial Guard"
 oe_cel.30.desc: "The recalled prince lays aside his frontier command and attends audience at the Meridian Gate. Granted a capital mansion and a seat in the imperial guard, he bolsters central dignity while easing fears of provincial overreach."
 oe_cel.30.a: "Grant a capital mansion and imperial guard honors"
 oe_cel.30.b: "Bestow stipends to reassure the imperial clan"
