 STATIC_MODIFIER_DESC_oe_cel_twin_phoenix_mod: "One ruler holds both the Roman and the celestial tradition."
 STATIC_MODIFIER_NAME_oe_cel_sun_never_sets_mod: "The Sun Never Sets"
 STATIC_MODIFIER_DESC_oe_cel_sun_never_sets_mod: "The throne's protectorates span six great regions."
 STATIC_MODIFIER_NAME_oe_cel_nanyang_hub_mod: "Nanyang Strait Hub"
 STATIC_MODIFIER_DESC_oe_cel_nanyang_hub_mod: "With Palembang and Malacca chartered, Nanyang commerce flows through Celestial sea lanes."
 STATIC_MODIFIER_NAME_oe_cel_nanyang_fleet_depot_mod: "Nanyang Protectorate Naval Depots"
 STATIC_MODIFIER_DESC_oe_cel_nanyang_fleet_depot_mod: "Imperial naval depots along Malacca and Palembang extend fleet reach across the southern seas."
 STATIC_MODIFIER_NAME_oe_cel_indian_ocean_stele_mod: "Galle & Calicut Trilingual Stele"
 STATIC_MODIFIER_DESC_oe_cel_indian_ocean_stele_mod: "The trilingual stele raised by the treasure fleets wins trade and goodwill across the Indian Ocean."
 STATIC_MODIFIER_NAME_oe_cel_western_regions_relay_mod: "Hami Guard Silk Road Relays"
 STATIC_MODIFIER_DESC_oe_cel_western_regions_relay_mod: "The Hami Guard and oasis relay posts invigorate overland Silk Road trade and frontier control."
 STATIC_MODIFIER_NAME_oe_cel_nurgan_stele_mod: "Nurgan Yongning Patrols"
 STATIC_MODIFIER_DESC_oe_cel_nurgan_stele_mod: "The Nurgan commission and Yongning stele anchor northeastern defense and frontier manpower."
 STATIC_MODIFIER_NAME_oe_cel_nurgan_fur_market_mod: "Northeast Fur & Horse Markets"
 STATIC_MODIFIER_DESC_oe_cel_nurgan_fur_market_mod: "Thriving fur and horse fairs along the Sungari and Amur enrich the imperial treasury."
 STATIC_MODIFIER_NAME_oe_cel_court_guard_princes_mod: "Princes in the Imperial Guard"
 STATIC_MODIFIER_DESC_oe_cel_court_guard_princes_mod: "Recalled princes attending court in the capital strengthen imperial legitimacy and heavenly mandate."
