l_english:
# NEW 2026-11-23 v21.0 Module E2: Localization (english) (oe_dis2_, 0 mainline slots, 0 rules, 0 vanilla overrides). Generated by gen_v210_disasters_ai.py; edit the generator, not this file.
 oe_dis2_imperial_overextension: "Imperial Overextension & Sovereign Default"
 oe_dis2_imperial_overextension_desc: "Outrunning the fiscal reach of its ministries, a sprawling empire buckled under compounding war loans, frontier arrears, and collapsing tax farms. Only disciplined retrenchment, debt restructuring, and exchequer reform can avert systemic collapse."
 oe_dis2_military_transition_mutiny: "Praetorian & Gunpowder-Transition Mutiny"
 oe_dis2_military_transition_mutiny_desc: "As pike-and-shot formations, siege artillery, and salaried line regiments eclipse traditional guard corps, privileged barracks factions rise in armed defiance. The throne must decisively modernize its standing host or broker a lasting corps compact."
 oe_dis2_colonial_independence_wave: "Transoceanic Colonial Independence Wave"
 oe_dis2_colonial_independence_wave_desc: "Across distant oceans, maturing colonial assemblies and port merchants reject metropolitan tariffs, stamp duties, and distant governors. Without an imperial federation settlement or negotiated dominion charter, the overseas empire faces rupture."
 oe_dis2_court_regency_crisis: "Court Magnate & Regency Crisis"
 oe_dis2_court_regency_crisis_desc: "A weak throne or prolonged regency invites grandee cliques, court favorites, and chancery rivals to carve up royal seals and provincial patronage. Restoring legitimate authority requires curbing private retinues and sealing court concord."
 oe_dis2_industrial_labor_unrest: "Early Industrial Labor & Enclosure Unrest"
 oe_dis2_industrial_labor_unrest_desc: "Mechanized manufactories, rural enclosures, and volatile grain prices displace artisans and cottagers into overcrowded mill towns. Strikes, loom-breaking, and bread riots compel the crown to forge a durable industrial labor settlement."
 oe_dis2_confessional_schism_backlash: "Multi-Confessional Schism Backlash"
 oe_dis2_confessional_schism_backlash_desc: "In a sprawling realm spanning rival confessions, inflammatory pulpits, shrine disputes, and partisan leagues push provinces toward sectarian upheaval. Only an ecumenical toleration edict or disciplined confessional concordat can restore peace."
 STATIC_MODIFIER_NAME_oe_dis2_ai_gp_resilience_t1: "Great-Power Strategic Resilience I"
 STATIC_MODIFIER_DESC_oe_dis2_ai_gp_resilience_t1: "Confronted by a rapidly expanding hegemony, surviving great powers coordinate fiscal credit, war-exhaustion recovery, and counter-coalition diplomacy to sustain a multipolar balance."
 STATIC_MODIFIER_NAME_oe_dis2_ai_gp_resilience_t2: "Great-Power Counter-Hegemony Concert II"
 STATIC_MODIFIER_DESC_oe_dis2_ai_gp_resilience_t2: "As a transcontinental colossus threatens to eclipse all rivals, surviving great powers tighten treasury discipline, enlarge alliance capacity, and steel their standing forces."
 STATIC_MODIFIER_NAME_oe_dis2_mod_debt_commission: "Emergency Imperial Debt Commission"
 STATIC_MODIFIER_DESC_oe_dis2_mod_debt_commission: "Crown auditors curb palace stipends, renegotiate interest coupons, and enforce strict treasury retrenchment at the cost of broader estate grumbling."
 STATIC_MODIFIER_NAME_oe_dis2_mod_debt_restructuring: "Sovereign Debt Restructuring"
 STATIC_MODIFIER_DESC_oe_dis2_mod_debt_restructuring: "Compulsory debt consolidation and stretched maturities relieve immediate arrears while tempering commercial confidence among domestic financiers."
 STATIC_MODIFIER_NAME_oe_dis2_mod_crown_charter_sales: "Auctioned Crown Tax Charters"
 STATIC_MODIFIER_DESC_oe_dis2_mod_crown_charter_sales: "Selling provincial customs farms and municipal exemptions raises emergency silver while diluting central crown control across distant realms."
 STATIC_MODIFIER_NAME_oe_dis2_mod_exchequer_reform: "Permanent Imperial Exchequer"
 STATIC_MODIFIER_DESC_oe_dis2_mod_exchequer_reform: "Emerging from sovereign overextension with audited budgets and unified public debt, the exchequer anchors long-term fiscal resilience across vast provinces."
 STATIC_MODIFIER_NAME_oe_dis2_mod_provincial_budgets: "Decentralized Provincial Treasuries"
 STATIC_MODIFIER_DESC_oe_dis2_mod_provincial_budgets: "Granting regional assemblies fixed fiscal quotas eases administrative strain and calms frontier estates while moderating central crown leverage."
 STATIC_MODIFIER_NAME_oe_dis2_mod_modern_drilling_charter: "New-Model Gunpowder Drill Charter"
 STATIC_MODIFIER_DESC_oe_dis2_mod_modern_drilling_charter: "Standardized salvo drill, salaried artillery schools, and regular muster rolls curb mutinous guards at the price of elevated military outlay."
 STATIC_MODIFIER_NAME_oe_dis2_mod_praetorian_compromise: "Traditional Corps Compromise"
 STATIC_MODIFIER_DESC_oe_dis2_mod_praetorian_compromise: "Preserving ancestral guard stipends alongside modern line regiments avoids bloody barracks purges while slowing full tactical standardization."
 STATIC_MODIFIER_NAME_oe_dis2_mod_modern_corps_settlement: "Modernized Standing Imperial Army"
 STATIC_MODIFIER_DESC_oe_dis2_mod_modern_corps_settlement: "Having subordinated unruly palace guards to unified command and gunpowder doctrine, the empire fields a disciplined, loyal standing army."
 STATIC_MODIFIER_NAME_oe_dis2_mod_imperial_federation: "Transoceanic Imperial Federation"
 STATIC_MODIFIER_DESC_oe_dis2_mod_imperial_federation: "Extending representation and shared maritime governance to overseas realms binds transoceanic dominions in lasting loyalty and commercial union."
 STATIC_MODIFIER_NAME_oe_dis2_mod_mercantile_crackdown: "Mercantilist Navigation Enforcement"
 STATIC_MODIFIER_DESC_oe_dis2_mod_mercantile_crackdown: "Royal customs cruisers and admiralty courts enforce strict colonial staple laws, boosting imperial shipping revenue while straining overseas loyalty."
 STATIC_MODIFIER_NAME_oe_dis2_mod_dominion_compact: "Chartered Dominion Compact"
 STATIC_MODIFIER_DESC_oe_dis2_mod_dominion_compact: "Negotiated fiscal autonomy and local charters pacify restive colonial assemblies while preserving preferential maritime commerce."
 STATIC_MODIFIER_NAME_oe_dis2_mod_chancery_regency: "Bureaucratic Chancery Regency"
 STATIC_MODIFIER_DESC_oe_dis2_mod_chancery_regency: "Trained jurists and royal secretaries administer state seals during the regency, safeguarding crown authority while alienating excluded grandee houses."
 STATIC_MODIFIER_NAME_oe_dis2_mod_magnate_council: "High Magnate Regency Council"
 STATIC_MODIFIER_DESC_oe_dis2_mod_magnate_council: "Sharing regency patronage among leading aristocratic families averts civil war and calms provincial lords at the expense of crown leverage."
 STATIC_MODIFIER_NAME_oe_dis2_mod_crown_authority_restored: "Restored Sovereign Crown Authority"
 STATIC_MODIFIER_DESC_oe_dis2_mod_crown_authority_restored: "With regency intrigues decisively ended, the throne commands unified ministries, renewed dynastic legitimacy, and obedient provincial governors."
 STATIC_MODIFIER_NAME_oe_dis2_mod_constitutional_council: "Constitutional Peerage Charter"
 STATIC_MODIFIER_DESC_oe_dis2_mod_constitutional_council: "Codifying ministerial accountability and noble counsel ends palace coups, fostering broad estate harmony and steadier governance."
 STATIC_MODIFIER_NAME_oe_dis2_mod_factory_labor_compact: "Early Industrial Labor Compact"
 STATIC_MODIFIER_DESC_oe_dis2_mod_factory_labor_compact: "Regulated workshop hours, municipal relief boards, and guild arbitration stabilize factory towns and sustain skilled industrial productivity."
 STATIC_MODIFIER_NAME_oe_dis2_mod_enclosure_protection: "Manufactory & Enclosure Protection"
 STATIC_MODIFIER_DESC_oe_dis2_mod_enclosure_protection: "Protecting mechanized looms and commercial estates accelerates industrial output and merchant capital accumulation at the price of rural hardship."
 STATIC_MODIFIER_NAME_oe_dis2_mod_guild_enterprise_settlement: "Free-Enterprise Guild Settlement"
 STATIC_MODIFIER_DESC_oe_dis2_mod_guild_enterprise_settlement: "Harmonizing master artisans, steam-mill proprietors, and municipal courts unlocks dynamic workshop growth and commercial prosperity."
 STATIC_MODIFIER_NAME_oe_dis2_mod_ecumenical_toleration_edict: "Ecumenical Toleration Edict"
 STATIC_MODIFIER_DESC_oe_dis2_mod_ecumenical_toleration_edict: "Guaranteed liberty of conscience and protected minority parishes extinguish sectarian strife across multi-faith provinces while modestly checking clerical monopoly."
 STATIC_MODIFIER_NAME_oe_dis2_mod_confessional_uniformity: "Confessional State Uniformity"
 STATIC_MODIFIER_DESC_oe_dis2_mod_confessional_uniformity: "State-backed synods, seminaries, and parish inspections accelerate religious conversion and true-faith cohesion at the cost of harsher minority friction."
 STATIC_MODIFIER_NAME_oe_dis2_mod_imperial_conciliation: "Imperial Conciliation Edict"
 STATIC_MODIFIER_DESC_oe_dis2_mod_imperial_conciliation: "Special crown envoys arbitrate estate grievances, moderate local dues, and lower rebellious fervor across strained provinces."
 STATIC_MODIFIER_NAME_oe_dis2_mod_diplomatic_conciliation: "Great-Power Diplomatic Conciliation"
 STATIC_MODIFIER_DESC_oe_dis2_mod_diplomatic_conciliation: "Envoys, border guarantees, and reciprocal commercial treaties soften foreign antagonism against our expanding empire."
 STATIC_MODIFIER_NAME_oe_dis2_mod_grand_fleet_deterrence: "Grand Fleet & Armed Deterrence"
 STATIC_MODIFIER_DESC_oe_dis2_mod_grand_fleet_deterrence: "Naval reviews and frontier parade maneuvers project unmistakable imperial resolve to rival coalitions at a noticeable logistical cost."
 STATIC_MODIFIER_NAME_oe_dis2_mod_frontier_citadel_watch: "Fortified Imperial Frontier Watch"
 STATIC_MODIFIER_DESC_oe_dis2_mod_frontier_citadel_watch: "Star-fort bastions, signal beacons, and stocked magazines harden border marches against coordinated great-power invasions."
 STATIC_MODIFIER_NAME_oe_dis2_mod_contractor_audit: "War-Chest & Contractor Audit"
 STATIC_MODIFIER_DESC_oe_dis2_mod_contractor_audit: "Special quartermaster tribunals root out embezzlement in army depots and grain contracts, restoring logistical efficiency and fighting discipline."
 STATIC_MODIFIER_NAME_oe_dis2_mod_civic_press_reform: "Regulated Civic Assembly & Press"
 STATIC_MODIFIER_DESC_oe_dis2_mod_civic_press_reform: "Channeling urban petitions and print debates through chartered civic halls diffuses revolutionary rage while encouraging administrative innovation."
 oe_dis2_dec_debt_commission.title: "Convene Emergency Imperial Debt Commission"
 oe_dis2_dec_debt_commission.desc: "Appoint independent treasury auditors to consolidate high-interest war arrears, trim court sinecures, and advance resolution of Imperial Overextension & Sovereign Default."
 oe_dis2_dec_debt_commission.a: "Empower the Imperial Debt Commission"
 oe_dis2_dec_debt_commission_tt: "Advances Imperial Overextension stabilization by #G +1#! step, eases inflation and war exhaustion, and applies Emergency Imperial Debt Commission for 10 years (4-year cooldown)."
 oe_dis2_dec_military_modernization_charter.title: "Issue Military Modernization & Corps Charter"
 oe_dis2_dec_military_modernization_charter.desc: "Fund salaried artillery schools, standardized gunpowder drill, and officer commissions to break barracks factionalism and resolve the Praetorian & Gunpowder-Transition Mutiny."
 oe_dis2_dec_military_modernization_charter.a: "Promulgate the Gunpowder Drill Charter"
 oe_dis2_dec_military_modernization_charter_tt: "Spends 150 ducats to advance Mutiny stabilization by #G +1#! step, grants army tradition, and applies New-Model Gunpowder Drill Charter for 10 years (4-year cooldown)."
 oe_dis2_dec_imperial_conciliation_edict.title: "Proclaim Imperial Conciliation Edict"
 oe_dis2_dec_imperial_conciliation_edict.desc: "Dispatch imperial commissioners to arbitrate colonial assemblies, regency factions, industrial labor disputes, or confessional grievances, advancing crisis settlement."
 oe_dis2_dec_imperial_conciliation_edict.a: "Dispatch Imperial Conciliation Envoys"
 oe_dis2_dec_imperial_conciliation_edict_tt: "Spends 120 ducats to gain stability, advance active Colonial/Regency/Labor/Schism crisis resolution by #G +1#! step, and apply Imperial Conciliation Edict for 10 years (4-year cooldown)."
 oe_dis2_dec_toggle_ai_rivalry.title: "Toggle Competitive AI Great-Power Resilience"
 oe_dis2_dec_toggle_ai_rivalry.desc: "Enable or disable the non-cheating Great-Power Resilience guardrails that help surviving AI rivals avoid late-game collapse when a human empire snowballs. Turn OFF anytime for a pure casual sandbox campaign."
 oe_dis2_dec_toggle_ai_rivalry.a: "Switch AI Great-Power Resilience Mode"
 oe_dis2_dec_debt_cd_tt: "Have not convened the Emergency Debt Commission in the past 4 years"
 oe_dis2_dec_mil_cd_tt: "Have not issued the Military Modernization Charter in the past 4 years"
 oe_dis2_dec_concil_cd_tt: "Have not proclaimed an Imperial Conciliation Edict in the past 4 years"
 oe_dis2_ai_rivalry_disable_tt: "Disables #Y Competitive AI Great-Power Resilience#! (Casual Sandbox Mode) and immediately clears all active AI resilience modifiers."
 oe_dis2_ai_rivalry_re_enable_tt: "Re-enables #Y Competitive AI Great-Power Resilience#! for surviving AI Great Powers on the next yearly strategic check."
 oe_dis2.1.title: "The Weight of Empire: Treasury on the Brink"
 oe_dis2.1.desc: "Couriers from frontier garrisons and provincial tax offices deliver alarming ledgers: debt service and distant occupation outlays have outstripped imperial revenues. Creditors demand punitive spreads while border governors warn of unpaid troops."
 oe_dis2.1.a: "Impose strict fiscal austerity and slash palace expenditure"
 oe_dis2.1.b: "Restructure sovereign loans into longer-dated imperial bonds"
 oe_dis2.1.c: "Auction provincial customs charters to raise immediate silver"
 oe_dis2.2.title: "Provincial Tax-Farm Default & Arrears"
 oe_dis2.2.desc: "Three major provincial tax-farming syndicates have suspended silver remittances to the capital, citing war devastation and local resistance. Treasury clerks warn that unless the shortfall is bridged swiftly, provincial arrears will snowball into open mutiny."
 oe_dis2.2.a: "Seize syndicate collateral and dispatch imperial revenue auditors"
 oe_dis2.2.b: "Issue consolidated treasury bills guaranteed by merchant houses"
 oe_dis2.2.c: "Grant provincial councils local tax autonomy in exchange for peace"
 oe_dis2.3.title: "Imperial Solvency & Exchequer Order Restored"
 oe_dis2.3.desc: "Years of arduous fiscal retrenchment have borne fruit: arrears are cleared, bond yields have subsided, and provincial revenue ledgers balance once more. Senior ministers present two blueprints to institutionalize our hard-won fiscal stability."
 oe_dis2.3.a: "Establish a Permanent Imperial Exchequer under central audit"
 oe_dis2.3.b: "Codify decentralized provincial budgets to lighten imperial strain"
 oe_dis2.4.title: "Overturned Cauldrons: The Guard Corps Mutinies"
 oe_dis2.4.desc: "Outraged by new gunpowder drill manuals, salaried musketeer battalions, and regular muster inspections, officers of the traditional palace guard have barricaded their barracks and demanded the dismissal of military reformers."
 oe_dis2.4.a: "Stand firm behind the new-model gunpowder drill commission"
 oe_dis2.4.b: "Negotiate a dual-corps compromise preserving veteran ranks"
 oe_dis2.4.c: "Distribute an emergency silver donative to buy loyal garrisons"
 oe_dis2.5.title: "Arsenal Seizure & Garrison Ultimatum"
 oe_dis2.5.desc: "Mutinous veterans have occupied the capital bronze foundry and artillery park, threatening to spike our field cannon unless hereditary regimental stipends are confirmed in perpetuity. Loyal field regiments await your orders outside the walls."
 oe_dis2.5.a: "Storm the rebel barracks with loyal artillery and line infantry"
 oe_dis2.5.b: "Absorb cooperative guard officers into the new artillery corps"
 oe_dis2.5.c: "Confirm hereditary guard pensions to avoid bloodshed in the capital"
 oe_dis2.6.title: "The New-Model Imperial Army Consolidated"
 oe_dis2.6.desc: "Barracks sedition has been extinguished. Standardized flintlocks, coordinated field artillery, and unified officer commissions now anchor our military establishment. Choose the enduring doctrine that will define our armed forces for a generation."
 oe_dis2.6.a: "Codify a fully modernized professional standing army"
 oe_dis2.6.b: "Preserve a balanced dual-corps settlement honoring martial estates"
 oe_dis2.7.title: "Transoceanic Petitions & Colonial Defiance"
 oe_dis2.7.desc: "Delegates from our overseas ports and colonial assemblies have circulated a defiant declaration against metropolitan customs dues and unrepresented taxation. Merchant committees boycott imperial vessels while local militias drill openly on the quays."
 oe_dis2.7.a: "Propose an Imperial Federation Congress with overseas seats"
 oe_dis2.7.b: "Enforce strict mercantilist navigation acts with royal squadrons"
 oe_dis2.7.c: "Offer negotiated dominion charters and local tariff concessions"
 oe_dis2.8.title: "Harbor Tea & Stamp-Tax Boycott"
 oe_dis2.8.desc: "Masked crowds in a thriving overseas port have dumped taxed cargo into the harbor and driven customs inspectors back onto royal frigates. Both colonial moderates and metropolitan hawks await your immediate verdict."
 oe_dis2.8.a: "Repeal the hated stamp duties and seat colonial trade delegates"
 oe_dis2.8.b: "Blockade the defiant port until full restitution is paid"
 oe_dis2.8.c: "Charter a joint metropolitan-colonial maritime board"
 oe_dis2.9.title: "The Transoceanic Constitutional Settlement"
 oe_dis2.9.desc: "The tide of colonial insurgency has receded. Overseas governors, port merchants, and imperial ministers gather to ratify a durable constitutional framework governing our transoceanic realms for the modern age."
 oe_dis2.9.a: "Proclaim the Transoceanic Imperial Federation"
 oe_dis2.9.b: "Seal a flexible Chartered Dominion Commercial Compact"
 oe_dis2.10.title: "Rival Seals: The Court Regency Crisis Begins"
 oe_dis2.10.desc: "With royal authority weakened by regency or disputed legitimacy, rival magnate cliques and palace secretaries vie to control the great seal, treasury appointments, and provincial commanderies. Every council session threatens to spill into open faction war."
 oe_dis2.10.a: "Entrust the great seal to trained royal chancery jurists"
 oe_dis2.10.b: "Form a balanced High Magnate Regency Council"
 oe_dis2.10.c: "Invoke clerical and municipal arbiters to steady the court"
 oe_dis2.11.title: "Private Magnate Retinues at the Palace Gates"
 oe_dis2.11.desc: "Two rival grandees have marched armed retainers into the capital suburbs to intimidate the regency council over contested frontier governorships. Citizens bolt their shutters as rumors of a palace coup race through the markets."
 oe_dis2.11.a: "Outlaw private magnate retinues and arrest the ringleaders"
 oe_dis2.11.b: "Divide provincial honors in a sworn peerage compromise"
 oe_dis2.11.c: "Purge corrupt court favorites and audit regency accounts"
 oe_dis2.12.title: "Sovereign Authority & Court Concord Restored"
 oe_dis2.12.desc: "The regency factions have laid down their rivalries and bowed before unified royal governance. Now the crown may decide whether to consolidate direct central authority or enshrine a constitutional council charter preventing future palace crises."
 oe_dis2.12.a: "Reassert direct crown authority over ministries and seals"
 oe_dis2.12.b: "Seal a Constitutional Peerage & Ministerial Charter"
 oe_dis2.13.title: "Dark Mills & Enclosed Commons: Industrial Unrest"
 oe_dis2.13.desc: "Rapid expansion of water-powered looms, iron foundries, and commercial land enclosures has swelled our factory towns with landless laborers working grueling shifts. Petitions for wage standards clash fiercely with mill proprietors' demands."
 oe_dis2.13.a: "Draft an early factory inspection and wage arbitration charter"
 oe_dis2.13.b: "Back manufactory owners and enforce enclosure titles"
 oe_dis2.13.c: "Fund municipal poor-relief boards and grain granaries"
 oe_dis2.14.title: "Loom-Breakers & Urban Bread-Price Riots"
 oe_dis2.14.desc: "Displaced hand-weavers and hungry mill hands have smashed mechanical frames across two manufacturing districts while bread riots erupt outside municipal granaries. Magistrates urgently request instructions from the capital."
 oe_dis2.14.a: "Subsidize urban bread prices and open mixed labor-guild courts"
 oe_dis2.14.b: "Deploy royal garrisons to guard the ironworks and mills"
 oe_dis2.14.c: "Retrain displaced artisans in state shipyards and public works"
 oe_dis2.15.title: "Industrial Compact & Civic Order Restored"
 oe_dis2.15.desc: "The smoke of urban riots has cleared, replaced by the steady cadence of waterwheels, forges, and bustling markets. Mill proprietors, guild elders, and municipal officials gather to ratify the long-term industrial order of the realm."
 oe_dis2.15.a: "Ratify the statutory Early Industrial Labor Compact"
 oe_dis2.15.b: "Confirm the Free-Enterprise Guild & Manufactory Settlement"
 oe_dis2.16.title: "Confessional Schism & Rival Leagues"
 oe_dis2.16.desc: "Religious fragmentation across our far-flung provinces has erupted into open confessional hostility. Radical preachers denounce royal compromise while armed confessional leagues form in mixed cities. The throne must choose its religious course."
 oe_dis2.16.a: "Draft a provisional Charter of Conscience and mutual worship"
 oe_dis2.16.b: "Enforce inquisitorial uniformity and empower state prelates"
 oe_dis2.16.c: "Convene an imperial theological colloquy at the capital"
 oe_dis2.17.title: "Provincial Pulpit Polemics & Shrine Clashes"
 oe_dis2.17.desc: "Processions of rival confessions collided outside a venerated provincial shrine, leaving bells silenced and magistrates besieged by conflicting petitions from clergy and townsfolk alike."
 oe_dis2.17.a: "Place contested shrines under impartial royal protection"
 oe_dis2.17.b: "Award the shrine to the state church under garrison escort"
 oe_dis2.17.c: "Fine agitators on both sides and enforce civic peace"
 oe_dis2.18.title: "Religious Peace of the Empire"
 oe_dis2.18.desc: "Exhausted by sectarian strife, prelates, lay lords, and civic deputies converge to solemnize a permanent religious settlement. Seal either an ecumenical edict of toleration or a disciplined concordat of confessional uniformity."
 oe_dis2.18.a: "Proclaim the Permanent Ecumenical Toleration Edict"
 oe_dis2.18.b: "Ratify the Concordat of Confessional State Uniformity"
 oe_dis2.19.title: "Concert of Rival Great Powers Forms"
 oe_dis2.19.desc: "Dispatches from foreign chancelleries confirm that our sweeping territorial ascent has startled the remaining great powers. Rival courts are coordinating sovereign credit, easing internal feuds, and tightening alliances to preserve a strategic balance. (Tip: You may disable Competitive AI Great-Power Resilience anytime via the Imperial Governance decision.)"
 oe_dis2.19.a: "Dispatch peace envoys to conciliate wary rival courts"
 oe_dis2.19.b: "Stage a Grand Fleet & Standing Army review to deter rivals"
 oe_dis2.19.c: "Fortify our frontier citadels and border supply depots"
 oe_dis2.20.title: "Grand Counter-Hegemony Coalition Concert"
 oe_dis2.20.desc: "As our transcontinental empire dwarfs every single adversary, the surviving great powers have forged a deeper fiscal and military concert. Foreign ministries exchange intelligence, stabilize war finances, and steel their armies to contest universal hegemony."
 oe_dis2.20.a: "Propose a Grand Balance-of-Power Congress to divide spheres peacefully"
 oe_dis2.20.b: "Answer steel with steel and mobilize imperial war readiness"
 oe_dis2.20.c: "Deepen our border bastion ring and reserve manpower depots"
 oe_dis2.21.title: "Rival Great-Power Envoy & Strategic Detente"
 oe_dis2.21.desc: "An extraordinary delegation speaking for our rival great-power concert has arrived at court, testing our appetite for commercial detente, maritime treaties, or renewed arms competition along contested frontiers."
 oe_dis2.21.a: "Negotiate reciprocal maritime and commercial detente"
 oe_dis2.21.b: "Rebuff their terms and affirm unmistakable imperial primacy"
 oe_dis2.21.c: "Quietly reinforce border garrisons while stalling negotiations"
 oe_dis2.22.title: "War-Chest & Supply Contractor Scandal"
 oe_dis2.22.desc: "Auditors inspecting our frontier depots have uncovered spoiled biscuit barrels, phantom regiment rosters, and kickbacks linking army supply contractors to senior treasury clerks. Both fiscal solvency and military morale hang in the balance."
 oe_dis2.22.a: "Prosecute corrupt contractors and establish quartermaster audits"
 oe_dis2.22.b: "Pay soldiers' arrears directly in assayed silver coin"
 oe_dis2.22.c: "Transfer military provisioning contracts to vetted merchant guilds"
 oe_dis2.23.title: "Provincial Governors & Court Patronage Clash"
 oe_dis2.23.desc: "Distant viceroys and provincial assemblies accuse court appointees of auctioning offices and siphoning regional customs into private palaces. Unchecked patronage threatens to deepen both colonial alienation and court factionalism."
 oe_dis2.23.a: "Recall corrupt appointees and install merit-vetted commissioners"
 oe_dis2.23.b: "Charter local provincial assemblies to audit governor spending"
 oe_dis2.23.c: "Quietly settle the dispute behind palace doors to preserve unity"
 oe_dis2.24.title: "Pamphlet Presses & Civic Assembly Petition"
 oe_dis2.24.desc: "Clandestine printing shops across our urban quarters are circulating fiery tracts demanding fair workshop laws, confessional peace, and public accountability. Civic deputies ask the crown to channel this ferment into lawful assembly halls."
 oe_dis2.24.a: "Legalize chartered civic assemblies and regulated public presses"
 oe_dis2.24.b: "Confiscate seditious pamphlets and tighten censorial licensing"
 oe_dis2.24.c: "Endow municipal schools and artisan clinics to win urban goodwill"
