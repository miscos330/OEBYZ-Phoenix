 oe_v58_cas.14.c:0 "Distribute captured imperial treasuries to ensure unwavering loyalty"
 oe_v58_cas_ev_14_c_tt:0 "Boosts stability and army spirit immediately."
 oe_v58_cas.15.title:0 "Janibek, Kerey & the Birth of the Kazakh Steppe"
 oe_v58_cas.15.desc:0 "Breaking away from heavy-handed overlords along the lower Syr Darya, Sultans Janibek and Kerey lead two hundred thousand proud pastoralists eastward to the lush Chu and Talas pastures of Zhetysu—where free riders forge the Kazakh Khanate."
 oe_v58_cas.15.a:0 "Unite the free Zhetysu clans under unified steppe leadership"
 oe_v58_cas_ev_15_a_tt:0 "Boosts tribal cohesion and swift light-cavalry dominance."
 oe_v58_cas.15.b:0 "Secure the Syr Darya trading towns of Sighnaq and Turkestan"
 oe_v58_cas_ev_15_b_tt:0 "Connects nomadic herds to lucrative Transoxianan caravan markets."
 oe_v58_cas.15.c:0 "Preserve loose clan pastures and collect customary horse tithes"
 oe_v58_cas_ev_15_c_tt:0 "Sustains treasury calm and internal harmony."
 oe_v58_cas.16.title:0 "Muhammad Shaybani & the Bukhara Oasis Revival"
 oe_v58_cas.16.desc:0 "Sweeping southward from the Kipchak steppe into Samarkand and Bukhara, Uzbek Shaybanid horsemen marry steppe martial discipline to urban Islamic patronage—erecting the Mir-i Arab Madrasa opposite the Great Kalyan Minaret and defending the Oxus frontier."
 oe_v58_cas.16.a:0 "Weld steppe heavy cavalry to Bukharan oasis tax administration"
 oe_v58_cas_ev_16_a_tt:0 "Strengthens heavy cavalry shock and national tax efficiency."
 oe_v58_cas.16.b:0 "Endow Bukhara's madrasas and vaulted caravanserai domes"
 oe_v58_cas_ev_16_b_tt:0 "Stimulates overland Silk Road trade and urban prosperity."
 oe_v58_cas.16.c:0 "Keep clan warriors mounted on the northern steppe frontier"
 oe_v58_cas_ev_16_c_tt:0 "Sustains tribal cohesion and quick treasury reserves."
