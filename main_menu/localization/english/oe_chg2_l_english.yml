# NEW 2026-11-23 v17.5 Steppe Storm, Eurasian Plates & Reactive World — Module 17.5-B: Chagatai Playable Overhaul & Eurasian Governors 2.0 Localization (english) (oe_chg2_, 0 mainline slots, 0 rules, 0 vanilla overrides). Generated by gen_v175_chagatai_eurasia.py; edit the generator, not this file.
 oe_chg_amir:0 "Chagatai Amirate"
 oe_chg_amir_desc:0 "A landed Transoxianan or Tarim amirate sworn to the Chagatai Khan of Almaliq. It shares the khanate's map color and name, enjoys modest steppe winter resilience, pays vassal tribute, and cannot be annexed until Almaliq centralizes the uluses. When Chagatai Authority stands high it rides to the khan's offensive and defensive wars."
 LEAD_oe_chg_amir:0 "$LIST$ is a [SUBJECT_TYPE.GetName]"
 AM_oe_chg_amir:0 "[SUBJECT_TYPE.GetName] of $LIST$."
 oe_chg_amir_subject_opinion:0 "Khan of Almaliq"
 oe_chg_amir_overlord_opinion:0 "Chagatai Amirate"
 oe_chg2_amir_join_off_tt:0 "Chagatai Authority is at least #Y 55#!"
 oe_chg2_amir_call_off_tt:0 "Chagatai Authority is at least #Y 25#!"
 oe_chg2_amir_join_def_tt:0 "Chagatai Authority is at least #Y 25#!"
 oe_chg2_tian_shan_archers:0 "Chagatai Tian Shan Horse Archers"
 oe_chg2_tian_shan_archers_desc:0 "Sure-footed mountain-steppe horse archers bred along the Ili Valley and Tian Shan passes, excelling in swift envelopment, highland skirmishing, and relentless composite-bow volleys."
 oe_chg2_transoxiana_cataphracts:0 "Samarkand Silk-Road Cataphracts"
 oe_chg2_transoxiana_cataphracts_desc:0 "Lamellar-clad Turko-Persian heavy lancers forged in the armories of Samarkand and Bukhara, fusing Silk Road steelwork with steppe horsemanship to shatter fortified battle lines."
 oe_chg2_dec_almaliq_kurultai.title:0 "Convene the Almaliq Kurultai"
 oe_chg2_dec_almaliq_kurultai.desc:0 "Summon the amirs of Transoxiana, Badakhshan, and the Tarim Basin to Almaliq, raising Chagatai Authority by #G +12#!, calming amir liberty desire, and dispatching winter grain stipends to cash-strapped amirates once every #Y 5#! years."
 oe_chg2_dec_almaliq_kurultai.a:0 "Hold the Kurultai and distribute winter stipends"
 oe_chg2_dec_centralize_uluses.title:0 "Centralize the Chagatai Ulus"
 oe_chg2_dec_centralize_uluses.desc:0 "With Chagatai Authority at #Y 75#! or above and the Silk Road axis from Almaliq to Samarkand and Kashgar under our banner, enact permanent imperial centralization and reorganize remaining Chagatai Amirates into standard annexable vassals."
 oe_chg2_dec_centralize_uluses.a:0 "Proclaim the Centralized Chagatai Empire"
 oe_chg2_dec_eurasian_governor_audit.title:0 "Imperial Governor Cadastre"
 oe_chg2_dec_eurasian_governor_audit.desc:0 "Dispatch imperial treasury auditors to inspect provincial governor seats—Delhi's Iqta viceroyalties, Cairo's Syrian Niyabats, or Buda's Transylvanian Voivodeship and Croatian Banate—boosting subject loyalty and local fiscal yield once every #Y 6#! years."
 oe_chg2_dec_eurasian_governor_audit.a:0 "Conduct the imperial cadastre audit"
 STATIC_MODIFIER_NAME_oe_chg2_mod_auth_supreme:0 "Supreme Authority of Almaliq"
 STATIC_MODIFIER_DESC_oe_chg2_mod_auth_supreme:0 "The seal of the Chagatai Khan commands unquestioned respect across Zhetysu, Transoxiana, and the Tarim oases."
 STATIC_MODIFIER_NAME_oe_chg2_mod_auth_fractured:0 "Fractured Chagatai Authority"
 STATIC_MODIFIER_DESC_oe_chg2_mod_auth_fractured:0 "Overmighty amirs question Almaliq's writ, withholding caravan tolls and hesitating to answer offensive war summons."
 STATIC_MODIFIER_NAME_oe_chg2_mod_almaliq_kurultai:0 "Covenant of the Almaliq Kurultai"
 STATIC_MODIFIER_DESC_oe_chg2_mod_almaliq_kurultai:0 "Fresh gifts, winter grain relief, and solemn Yassa oaths keep the Chagatai amirates bound to the Great Ordu."
 STATIC_MODIFIER_NAME_oe_chg2_mod_centralized_ulus:0 "Centralized Chagatai Empire"
 STATIC_MODIFIER_DESC_oe_chg2_mod_centralized_ulus:0 "Almaliq has tamed centrifugal tribalism, transforming semi-autonomous amirates into an integrated Silk Road realm."
 STATIC_MODIFIER_NAME_oe_chg2_mod_dlh_cadastre:0 "Delhi Imperial Iqta Cadastre"
 STATIC_MODIFIER_DESC_oe_chg2_mod_dlh_cadastre:0 "Auditors from Delhi reconcile provincial revenue rolls across Deccan, Gujarat, and Gangetic iqta seats."
 STATIC_MODIFIER_NAME_oe_chg2_mod_mam_cadastre:0 "Cairo-Syria Niyabat Audit"
 STATIC_MODIFIER_DESC_oe_chg2_mod_mam_cadastre:0 "Direct treasury inspectors from Cairo tighten customs accounting across Damascus and Aleppo."
 STATIC_MODIFIER_NAME_oe_chg2_mod_hun_cadastre:0 "Royal Carpathian Governor Audit"
 STATIC_MODIFIER_DESC_oe_chg2_mod_hun_cadastre:0 "Crown chamberlains verify royal salt, gold, and garrison quotas across Transylvania and Croatia-Slavonia."
 STATIC_MODIFIER_NAME_oe_chg2_mod_loc_governor_cadastre:0 "Audited Imperial Governor Seat"
 STATIC_MODIFIER_DESC_oe_chg2_mod_loc_governor_cadastre:0 "Recent imperial cadastre inspections have curbed tax leakage and strengthened provincial administration here."
 STATIC_MODIFIER_NAME_oe_chg2_mod_dlh_iqta_harmony:0 "Harmonious Delhi Viceroyalties"
 STATIC_MODIFIER_DESC_oe_chg2_mod_dlh_iqta_harmony:0 "Loyal Iqta viceroyalties across Gulbarga, Khambat, and Jaunpur feed steady silver and levies to Delhi."
 STATIC_MODIFIER_NAME_oe_chg2_mod_mam_niyabat_harmony:0 "Cairo-Damascus-Aleppo Synergy"
 STATIC_MODIFIER_DESC_oe_chg2_mod_mam_niyabat_harmony:0 "With both Damascus and Aleppo loyal to Cairo, the Levant trade corridor and northern citadels stand rock-solid."
 STATIC_MODIFIER_NAME_oe_chg2_mod_hun_voivode_harmony:0 "Carpathian Voivode & Banate Concord"
 STATIC_MODIFIER_DESC_oe_chg2_mod_hun_voivode_harmony:0 "Loyal governance in Brasov and Zagreb unites Hungary's eastern mountain passes and southern river marches."
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev1_a:0 "Yassa Covenant of Almaliq"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev1_a:0 "Solemn oaths sworn at Almaliq keep the Transoxianan and Tarim amirates aligned with the Khan's banner."
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev1_b:0 "Almaliq Royal Kheshig"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev1_b:0 "Direct royal herds and disciplined steppe horse archers anchor Chagatai supremacy in Zhetysu."
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev2_a:0 "Tian Shan War-Steed Herds"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev2_a:0 "Hardy high-altitude mounts give Chagatai light cavalry unmatched endurance across steppe and mountain passes."
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev2_b:0 "Ili Valley Winter Granaries"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev2_b:0 "Reliable fodder and grain reserves insulate Zhetysu's population and garrisons against harsh continental winters."
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev3_a:0 "Samarkand Ortoq Silver Charter"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev3_a:0 "Unified silver coinage and imperial caravan passports draw merchants from Persia, India, and China through Transoxiana."
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev3_b:0 "Bukharan Silk Armory Levy"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev3_b:0 "Artisan guilds in Bukhara and Samarkand channel steady revenue and lamellar armor directly to the Khan's host."
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev4_a:0 "Yassa-Sharia Legal Concord"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev4_a:0 "Clear jurisdiction between urban qadis and steppe yarghuchi judges calms sectarian friction across the khanate."
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev4_b:0 "Silk Road Sanctuary of Almaliq"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev4_b:0 "Upholding Genghisid religious protection keeps Uyghur, Sogdian, Persian, and steppe merchants thriving side by side."
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev5_a:0 "Tarim Yam Toll Accord"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev5_a:0 "Predictable oasis customs split fairly with eastern amirs double caravan traffic between Kashgar and Turpan."
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev5_b:0 "Tian Shan Watchtower Chain"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev5_b:0 "Stone watchtowers and sheltered winter waystations secure the mountain passes against bandits and frostbite alike."
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev6_a:0 "Transoxianan Amir Council"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev6_a:0 "Institutionalized consultations cool aristocratic suspicion and bind the western tumens to Almaliq."
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev6_b:0 "Khan's Sole Investiture"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev6_b:0 "Uncompromising royal majesty steels the Khan's personal guard, though western amirs bristle behind closed doors."
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev7_a:0 "Iron Ride of Zhetysu"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev7_a:0 "Swift royal cavalry columns remind ambitious amirs that the throne of Chagatai still commands the steppe."
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev7_b:0 "East-West Kurultai Truce"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev7_b:0 "Carefully balanced honors between Dughlat begs and Transoxianan amirs avert immediate civil war."
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev8_a:0 "Tarim Jade & Silk Tribute"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev8_a:0 "Loyal oasis charters convert Kashgar, Yarkand, and Qocho into reliable pillars of the eastern treasury."
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev8_b:0 "Tarim Darughachi Inspectorate"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev8_b:0 "Imperial overseers audit oasis granaries, post horses, and border customs directly for Almaliq."
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev9_a:0 "Zhetysu Frontier Ramparts"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev9_a:0 "Interlocking pasture garrisons bleed invading columns across the freezing mountain steppe."
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev9_b:0 "Moghulistan Outrider Vanguard"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev9_b:0 "Battle-hardened outriders strike first in every alpine ambush and steppe skirmish."
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev10_a:0 "Dual-Wing Statute of Chagatai"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev10_a:0 "A landmark constitutional compact pairs Zhetysu cavalry command with Transoxianan fiscal administration under one throne."
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev10_b:0 "Chagatai Brotherhood of Banners"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev10_b:0 "Shared battle honors rally horsemen from Kashgar to Samarkand behind one undefeated standard."
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev11_a:0 "Barlas Imperial Marshalcy"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev11_a:0 "Channeling Barlas military genius under the Chagatai throne forged an elite corps of armored Transoxianan lancers."
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev11_b:0 "Balanced Amirate Guard"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev11_b:0 "No single warlord can eclipse the throne while disciplined royal garrisons hold every oasis citadel."
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev12_a:0 "Twin Capitals of Almaliq & Samarkand"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev12_a:0 "Seasonal court circuits weld steppe sovereignty and Persianate civic splendor into one seamless empire."
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev12_b:0 "Samarkand Cataphract Foundries"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev12_b:0 "Master armorers in Samarkand supply steel barding and lances for elite Silk-Road Cataphract squadrons."
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev13_a:0 "Imperial Tian Shan Caravanserais"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev13_a:0 "Fortified stone waystations slash travel risk and turn every pass between Transoxiana and Tarim into an artery of wealth."
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev13_b:0 "Chartered Silk Road Depots"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev13_b:0 "Merchant consortia maintain bustling caravan stations while remitting brisk customs dues to the treasury."
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev14_a:0 "Pamir-Turpan Karez Network"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev14_a:0 "Evaporation-proof subterranean canals green arid plains from Khujand to Turpan, fueling sustained demographic growth."
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev14_b:0 "Oasis Military Granary System"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev14_b:0 "Well-watered military depots allow large Chagatai hosts to campaign across arid marches with minimal attrition."
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev15_a:0 "Chagatai Renaissance Academies"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev15_a:0 "Star tables, medical treatises, and classical Chagatai poetry propel the khanate to the forefront of Eurasian learning."
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev15_b:0 "Polyglot Silk Road Chancery"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev15_b:0 "Refined scribes fluent in Chagatai, Persian, and Uyghur script streamline imperial decrees across every province."
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev16_a:0 "Samarkand Royal Cannon Foundry"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev16_a:0 "Heavy bronze siege trains and disciplined matchlock battalions shatter rival fortresses across Central Asia."
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev16_b:0 "Gunpowder-Cavalry Combined Arms"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev16_b:0 "Swivel-gun volleys tear gaps in enemy pike lines just before armored cataphracts deliver the decisive charge."
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev17_a:0 "Chagatai Silk Road Customs Union"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev17_a:0 "Single-seal overland transit tariffs outcompete distant sea lanes and enrich every Chagatai city."
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev17_b:0 "Shield of the Continental Silk Road"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev17_b:0 "Rapid-response gunpowder cavalry divisions deter every border incursion across the Eurasian interior."
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev18_a:0 "Eternal Decree of Chagatai"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev18_a:0 "Supreme sovereign authority, disciplined gunpowder armies, and Silk Road wealth crown Central Asia's enduring empire."
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev18_b:0 "Cosmopolitan Commonwealth of the Silk Road"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev18_b:0 "Harmonious self-rule, flourishing science, and tolerant cities unite every tongue and faith between the Oxus and Tarim."
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev19_a:0 "Deccan-Gujarat Imperial Cadastre"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev19_a:0 "Salaried royal accountants audit Gulbarga and Khambat directly, curbing provincial skimming and bolstering Delhi's treasury."
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev19_b:0 "Deccan Iqta Military Compact"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev19_b:0 "Guaranteed stipends soothe provincial amirs while binding regional cavalry levies reliably to Delhi's wars."
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev20_a:0 "Gangetic Muslin & River Customs"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev20_a:0 "Streamlined eastern customs houses channel Bengal and Jaunpur textile wealth smoothly up the Ganges."
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev20_b:0 "Eastern Gangetic March Garrisons"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev20_b:0 "Fortified river citadels anchor Delhi's eastern provinces against rebellion and coastal rivals alike."
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev21_a:0 "Cairo-Levant Karimi Ledger"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev21_a:0 "Unified customs accounting across Alexandria, Damascus, and Aleppo maximizes Mamluk spice and silk duties."
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev21_b:0 "Northern Syrian Citadel Shield"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev21_b:0 "Reinforced Mamluk garrisons in Aleppo and Damascus stand ready to blunt Anatolian and Mesopotamian invasions."
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev22_a:0 "Cairo Rotating Niyabat Statute"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev22_a:0 "Scheduled governor rotations prevent Syrian emirs from building rival dynasties outside Cairo's reach."
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev22_b:0 "Burji Furusiyya Cavalry Elite"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev22_b:0 "Intensive furusiyya tournament drills produce peerless Mamluk heavy horsemen loyal to the Burji banner."
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev23_a:0 "Transylvanian Three-Estate Bulwark"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev23_a:0 "Saxon fortress towns and Szekely border riders lock every Carpathian pass under the Voivode's command."
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev23_b:0 "Transylvanian Royal Salt & Gold Chamber"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev23_b:0 "Direct royal mining monopolies in the Carpathian basin pour glittering florins into Hungary's treasury."
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev24_a:0 "Codified Danubian Banderia"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev24_a:0 "Mandatory magnate cavalry banners and well-funded border castles anchor Hungary's Danubian frontier."
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev24_b:0 "Hungarian Royal Free-Town Compact"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev24_b:0 "Crown taxation of flourishing boroughs balances magnate oligarchy and strengthens Buda's sovereign hand."
 oe_chg2.1.title:0 "The Great Ordu of Almaliq"
 oe_chg2.1.desc:0 "In 1337, the Chagatai Khanate spans from the alpine meadows of the Ili Valley and the Taklamakan oases to the rich river cities of Samarkand, Bukhara, and Balkh. Fourteen proud tribal and oasis amirates swear fealty beneath Almaliq's white banner—yet holding steppe nomads and settled Transoxiana under one throne demands both generosity and iron will."
 oe_chg2.1.a:0 "Affirm the Great Yassa covenant with the fourteen amirs"
 oe_chg2.1.b:0 "Expand the Khan's royal pastures and kheshig guard"
 oe_chg2.2.title:0 "Pastures of the Ili Valley and Zhetysu"
 oe_chg2.2.desc:0 "Snowmelt pouring down from the Tian Shan turns the Ili Valley and Zhetysu into the finest horse-breeding heartland in Central Asia. Noyans urge the Khan to reserve the richest summer ranges for swift war-steeds, while valley elders seek irrigation channels and winter granaries to shield herds and towns from blizzards."
 oe_chg2.2.a:0 "Reserve imperial ranges for Tian Shan Horse Archers"
 oe_chg2.2.b:0 "Build winter granaries and valley irrigation sluices"
 oe_chg2.3.title:0 "Merchant Guilds of Samarkand and Bukhara"
 oe_chg2.3.desc:0 "Ortoq merchant syndicates from Samarkand and Bukhara arrive in Almaliq bearing bolts of brocade, lapis lazuli from Badakhshan, and silver ingots. They petition the Khan to guarantee standard silver dirham weights across all fourteen amirates in return for generous transit customs."
 oe_chg2.3.a:0 "Charter imperial ortoq passports and unified silver coins"
 oe_chg2.3.b:0 "Levy silk-workshop dues to outfit royal armories"
 oe_chg2.4.title:0 "Crossroads of Yassa and Sharia"
 oe_chg2.4.desc:0 "Between the mosques of Bukhara, the Buddhist and Nestorian communities of Qocho and Almaliq, and the ancestral steppe customs of the Borjigin noyans, legal disputes are growing sharper. Judges urge the court to settle where Islamic Sharia ends and the Great Yassa of Genghis Khan begins."
 oe_chg2.4.a:0 "Harmonize urban Sharia courts with steppe Yassa custom"
 oe_chg2.4.b:0 "Guarantee multi-faith Silk Road sanctuary under the Yassa"
 oe_chg2.5.title:0 "Silk Road Oasis Tolls from Kashgar to Turpan"
 oe_chg2.5.desc:0 "Rich caravans carrying Chinese silk, Khotan jade, and Indian spices thread the northern and southern rims of the Taklamakan through Dughlat and Qocho lands. Coordinating yam post stations and pass escorts can turn the Tarim Basin into a goldmine for Almaliq."
 oe_chg2.5.a:0 "Standardize yam relay tolls with Dughlat and Qocho"
 oe_chg2.5.b:0 "Fortify the Tian Shan passes with permanent patrol towers"
 oe_chg2.6.title:0 "The Amir Council of Transoxiana"
 oe_chg2.6.desc:0 "Alarmed by rumors of harsh centralization, the great amirs of Qara'unas, Barlas, Yasa'uri, and Suldus convene south of the Syr Darya. They pledge loyalty to the house of Chagatai only if Almaliq respects their ancestral pasture rights and grants them a formal voice in imperial campaigns."
 oe_chg2.6.a:0 "Grant formal consultative seats in the Almaliq Kurultai"
 oe_chg2.6.b:0 "Assert the Chagatai Khan's sole right of investiture"
 oe_chg2.7.title:0 "Qazaghan's Shadow and Tughlugh Timur's Banner"
 oe_chg2.7.desc:0 "Storm clouds gather across Central Asia. In the southwest, Qara'unas warlords under Amir Qazaghan challenge royal governors across the Oxus, while in the eastern steppes the Dughlat begs rally around Prince Tughlugh Timur. Only decisive leadership can keep the realm from fracturing into hostile eastern and western halves."
 oe_chg2.7.a:0 "Mobilize Zhetysu tumens to awe rebellious warlords"
 oe_chg2.7.b:0 "Broker a grand truce between eastern begs and western amirs"
 oe_chg2.8.title:0 "Autonomy of the Tarim Oasis Lords"
 oe_chg2.8.desc:0 "With western Transoxiana restive, the Dughlat lords of Kashgar and the ancient Idiqud court of Qocho-Turpan press for formal fiscal charters. Granting broad autonomy secures tranquil eastern caravans, whereas installing royal darughachi officials tightens imperial control."
 oe_chg2.8.a:0 "Confirm Tarim charters with mandatory jade and silk tribute"
 oe_chg2.8.b:0 "Station imperial darughachi commissioners in Kashgar and Turpan"
 oe_chg2.9.title:0 "Watch on the Moghulistan Frontier"
 oe_chg2.9.desc:0 "From the Chu River and Almaty to the Dzungarian Gate, nomadic raiders probe the northern pastures of Moghulistan every autumn. Reinforcing seasonal frontier watch-camps or raising fresh Tian Shan Horse Archer regiments will turn the northern steppe into an impenetrable shield."
 oe_chg2.9.a:0 "Expand fortified seasonal camps across Zhetysu"
 oe_chg2.9.b:0 "Induct veteran frontier scouts into the Tian Shan Horse Archers"
 oe_chg2.10.title:0 "Counter-Reformation: Keeping One Khanate"
 oe_chg2.10.desc:0 "Across Central Asia, chroniclers whisper that the house of Chagatai is fated to split forever between steppe Moghulistan and urban Transoxiana. Now the Khan possesses a rare opening to defy history—promulgating a Dual-Wing Imperial Statute that binds eastern nomads and western oasis cities beneath a single sovereign crown."
 oe_chg2.10.a:0 "Proclaim the Dual-Wing Imperial Statute from Almaliq"
 oe_chg2.10.b:0 "Forge a martial brotherhood of every loyal ulus"
 oe_chg2.11.title:0 "The Barlas Rising and Timur's Crossroads"
 oe_chg2.11.desc:0 "From the pastures of Kesh and the Qashqadarya Valley, the brilliant Barlas commander Timur has won unmatched prestige among Transoxianan cavalrymen. Should the court invest the Barlas house as Supreme Imperial Marshal under the Khan's seal—or counterbalance their ambition with loyal amirs and fortified cities?"
 oe_chg2.11.a:0 "Invest the Barlas house as Supreme Imperial Marshal"
 oe_chg2.11.b:0 "Counterbalance Barlas power with civic garrisons and loyal amirs"
 oe_chg2.12.title:0 "Twin Capitals: Almaliq and Samarkand"
 oe_chg2.12.desc:0 "To rule both steppe and oasis in lasting harmony, statesmen propose a dual-capital rhythm: holding summer kurultais in the cool meadows of Almaliq while wintering amid the tiled madrasas, workshops, and royal armories of Samarkand."
 oe_chg2.12.a:0 "Institutionalize seasonal royal circuits between both capitals"
 oe_chg2.12.b:0 "Expand Samarkand's Silk-Road Cataphract armories"
 oe_chg2.13.title:0 "The Tian Shan Caravanserai Network"
 oe_chg2.13.desc:0 "Envoys and merchants spanning the Silk Road marvel at the peace along the Chagatai highways. Builders present blueprints for vaulted stone caravanserais spaced a single day's march apart from Samarkand through Khujand and Kashgar to Turpan—complete with fresh remounts, cisterns, and imperial seals."
 oe_chg2.13.a:0 "Fund imperial stone caravanserais and royal courier escorts"
 oe_chg2.13.b:0 "Lease transit depots to merchant syndicates for immediate revenue"
 oe_chg2.14.title:0 "Pamir-Fergana Karez and Irrigation Works"
 oe_chg2.14.desc:0 "Hydraulic engineers from Turpan, Fergana, and Bukhara join forces to dig deep underground karez aqueducts and terraced mountain canals. Channeling Pamir and Tian Shan snowmelt beneath the desert crust promises lush orchards, cotton fields, and booming oasis towns."
 oe_chg2.14.a:0 "Construct royal karez aquifers across Fergana and Tarim"
 oe_chg2.14.b:0 "Focus waterworks on garrison granaries and cavalry remount stations"
 oe_chg2.15.title:0 "Scholars of Kashgar, Samarkand, and Turpan"
 oe_chg2.15.desc:0 "Astronomers calibrating giant marble sextants, Uyghur calligraphers, and Chagatai Turkic poets converge on our royal academies. A radiant Central Asian renaissance is blossoming—making the Chagatai tongue a prestige language of diplomacy, science, and verse from the Volga to the Ganges."
 oe_chg2.15.a:0 "Patronize the Chagatai Astronomical and Literary Academy"
 oe_chg2.15.b:0 "Train bilingual Chagatai-Persian chancery clerks"
 oe_chg2.16.title:0 "Transoxiana Gunpowder and Cannon Foundry"
 oe_chg2.16.desc:0 "Gunpowder empires are rising on every horizon—from Anatolia and Persia to India and Ming China. Drawing upon Fergana sulfur, Badakhshan copper, and skilled founders along the Silk Road, Samarkand's master smiths propose fusing modern field artillery and matchlocks with Chagatai cavalry doctrine."
 oe_chg2.16.a:0 "Establish royal cannon foundries and matchlock drill squares"
 oe_chg2.16.b:0 "Pair mobile camel-guns with armored Silk-Road Cataphracts"
 oe_chg2.17.title:0 "Restoring Silk Road Hegemony"
 oe_chg2.17.desc:0 "Although oceanic galleons now round the southern capes, the overland heart of Eurasia beats stronger than ever under Chagatai peace. Tea, rhubarb, silk, horses, jade, and fine metalwork flow uninterrupted between China, India, Persia, and Russia through our secure customs houses."
 oe_chg2.17.a:0 "Proclaim the Imperial Silk Road Customs Union"
 oe_chg2.17.b:0 "Guard continental trade with standing steppe-gunpowder divisions"
 oe_chg2.18.title:0 "The Eternal Decree of the Heir of Chagatai"
 oe_chg2.18.desc:0 "More than two centuries after the turbulent crossroads of 1337, the Chagatai realm stands neither shattered nor forgotten. From the glaciers of the Tian Shan to the turquoise domes of Samarkand and the oasis gardens of Turpan, ambassadors gather to witness the Eternal Decree crowning our Eurasian heartland empire."
 oe_chg2.18.a:0 "Enshrine the Great Sovereign Charter of Chagatai Eurasia"
 oe_chg2.18.b:0 "Crown a cosmopolitan federation of Oasis and Steppe"
 oe_chg2.19.title:0 "Deccan and Gujarat Iqta Revenue Cadastre"
 oe_chg2.19.desc:0 "Across the distant Deccan plateau and the bustling maritime ports of Gujarat, military iqtadars increasingly treat provincial tax-farms as private patrimonies. Delhi's treasury ministers propose separating civil revenue assessment from military command—a bold stroke that will fill the Sultan's coffers if the provincial amirs do not balk."
 oe_chg2.19.a:0 "Enforce imperial treasury cadastres over Deccan and Gujarat"
 oe_chg2.19.b:0 "Confirm loyal iqtadar stipends in exchange for fixed troop quotas"
 oe_chg2.20.title:0 "Bengal and Gangetic Provincial Governors' Settlement"
 oe_chg2.20.desc:0 "Downriver from Delhi through Jaunpur toward the fertile delta of Bengal, monsoon rice harvests and fine muslin looms generate immense wealth. Settling how eastern provincial governors balance river commerce with frontier garrison duties will shape North India's prosperity for generations."
 oe_chg2.20.a:0 "Charter royal Gangetic textile and river-port customs"
 oe_chg2.20.b:0 "Commission eastern march-governors with permanent garrisons"
 oe_chg2.21.title:0 "Damascus and Aleppo Na'ib Caravan Compact"
 oe_chg2.21.desc:0 "The Mamluk Sultanate's prosperity rests upon two great arteries: Red Sea spice convoys reaching Cairo and overland silk caravans crossing Syria under the Na'ibs of Damascus and Aleppo. Binding the Syrian viceroys directly into Cairo's Karimi merchant ledger promises immense customs revenue—while northern commanders also clamor for stronger fortress budgets."
 oe_chg2.21.a:0 "Bind the Syrian Na'ibs to Cairo's Karimi customs ledger"
 oe_chg2.21.b:0 "Fund Aleppo and Damascus frontier citadel garrisons"
 oe_chg2.22.title:0 "After the Burji Transition: Cairo and the Syrian Niyabats"
 oe_chg2.22.desc:0 "As Circassian Burji emirs consolidate power in the Citadel of Cairo after the 1382 transition, rival household factions eye the wealthy Syrian governorships of Damascus and Aleppo as launchpads for rebellion. Establishing fixed three-year rotations audited by Cairo's Diwan could curb provincial coups, whereas rewarding elite Burji cavalry households sharpens our sword."
 oe_chg2.22.a:0 "Enact three-year rotating commissions audited by Cairo"
 oe_chg2.22.b:0 "Grant elite Burji households hereditary Syrian cavalry fiefs"
 oe_chg2.23.title:0 "The Transylvanian Voivode and the Three Estates"
 oe_chg2.23.desc:0 "Behind the crescent wall of the Carpathians, the Voivode of Transylvania governs a unique frontier mosaic: fortified Saxon burgher towns at Brasov and Sibiu, free Szekely border horsemen, and Hungarian county nobles. Harmonizing their charters transforms Transylvania into an unbreakable eastern citadel for the Crown of Saint Stephen."
 oe_chg2.23.a:0 "Ratify the Transylvanian Frontier Charter of all three estates"
 oe_chg2.23.b:0 "Channel Transylvanian salt and gold mines into Buda's Royal Chamber"
 oe_chg2.24.title:0 "Magnate Estates, Banderia, and the Carpathian Shield"
 oe_chg2.24.desc:0 "Hungary's great magnate leagues and the Banate of Croatia-Slavonia command formidable private banderia armies. As Danubian threats intensify, the Crown Diet must decide whether to codify binding baronial border-defense quotas or ally with the royal free cities to fund a centralized royal treasury army."
 oe_chg2.24.a:0 "Codify binding banderia quotas and frontier fortress upkeep"
 oe_chg2.24.b:0 "Ally the Crown Diet with royal free towns to curb magnates"
