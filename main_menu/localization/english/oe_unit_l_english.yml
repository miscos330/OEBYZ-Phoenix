l_english:
 oe_byz_a_akritai_I: "Frontier Guard"
 oe_byz_a_akritai_I_desc: "Akritai, singular Akrites, means frontier guards. They constitute a system of border defense rather than a single regiment.\n\n#Y Era Upgrade Path:#! Next tier unlocks automatically via the vanilla military advance #Y Professional Armies#! (full chain: Professional Armies -> Pike and Shot -> Siege Artillery -> Military Revolution -> Levée en Masse); upgrade directly in the army panel once researched."
 oe_byz_pronia_infantry: "Pronoia Infantry"
 oe_byz_pronia_infantry_desc: "Infantry maintained through pronoia grants, with fairly modest equipment."
 oe_byz_pronia_cavalry: "Pronoia Cavalry"
 oe_byz_pronia_cavalry_desc: "Cavalry maintained through pronoia grants, with fairly modest equipment."
 oe_unit_tokobolo: "Tourkopouloi"
 oe_unit_kuman_alan: "Cuman-Alan Mercenaries"
 oe_unit_latin_knight: "Latin Knights"
 oe_byz_elite_training: "Military Academy Training"
 oe_byz_elite_training_desc: "Professional instructors trained at military academies teach recruits the skills they need, greatly improving the quality of our new soldiers."
 oe_byz_theme_subject_soldier_I: "Medieval Theme Infantry"
 oe_byz_theme_subject_soldier_I_desc: "Provincial regulars trained by the theme commander, chiefly equipped with mail, spears and short swords.\n\n#Y Era Upgrade Path:#! Next tier unlocks automatically via the vanilla military advance #Y Professional Armies#! (full chain: Professional Armies -> Pike and Shot -> Siege Artillery -> Military Revolution -> Levée en Masse); upgrade directly in the army panel once researched."
 oe_byz_theme_subject_soldier_II: "Renaissance Theme Infantry"
 oe_byz_theme_subject_soldier_II_desc: "Provincial regulars trained by the theme commander and equipped with halberds and basic plate armor.\n\n#Y Era Upgrade Path:#! Unlocked by #Y Professional Armies#!; next tier unlocks via #Y Pike and Shot#! (followed by Siege Artillery -> Military Revolution -> Levée en Masse) — upgrade directly in the army panel."
 oe_byz_theme_subject_soldier_III: "Theme Arquebusiers"
 oe_byz_theme_subject_soldier_III_desc: "Provincial regulars trained by the theme commander and armed with powerful matchlock arquebuses.\n\n#Y Era Upgrade Path:#! Unlocked by #Y Pike and Shot#!; next tier unlocks via #Y Siege Artillery#! (followed by Military Revolution -> Levée en Masse) — upgrade directly in the army panel."
 oe_byz_theme_subject_soldier_IV: "Theme Musketeers"
 oe_byz_theme_subject_soldier_IV_desc: "Provincial regulars trained by the theme commander and equipped with increasingly dependable muskets.\n\n#Y Era Upgrade Path:#! Unlocked by #Y Siege Artillery#!; next tier unlocks via #Y Military Revolution#! (followed by Levée en Masse) — upgrade directly in the army panel."
 oe_byz_theme_subject_soldier_V: "Theme Square Infantry"
 oe_byz_theme_subject_soldier_V_desc: "Provincial regulars trained by the theme commander to fight in square formation.\n\n#Y Era Upgrade Path:#! Unlocked by #Y Military Revolution#!; final tier unlocks via #Y Levée en Masse#! — upgrade directly in the army panel."
 oe_byz_theme_subject_soldier_VI: "Modern Theme Infantry"
 oe_byz_theme_subject_soldier_VI_desc: "Provincial regulars trained by the theme commander, dispensing with armor and carrying the latest muskets.\n\n#Y Era Upgrade Path:#! Final era tier, unlocked automatically by the vanilla military advance #Y Levée en Masse#!."
 oe_byz_defend_soldier_I: "Tagmata Mail Infantry"
 oe_byz_defend_soldier_I_desc: "The tagmata were military units of battalion or regimental size, especially the elite formations established by Emperor Constantine V. They formed the central army of the Eastern Roman Empire from the 8th to the 11th century."
