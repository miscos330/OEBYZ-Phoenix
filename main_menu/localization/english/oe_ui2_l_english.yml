 oe_chr_cel.90.title: "Celestial Four Seas Chronicle · Overview"
 oe_chr_cel.90.desc: "#T Read-Only Celestial Storyline Ledger (Zero State Mutation)#!\n- Active Dynasty Track: [ROOT.GetCountry.Custom('OeUi2CelTrackName')] (Track #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_cel_track_value')|0]#!)\n- Celestial Vassals: Princely Fiefs #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_cel_fanwang_count_value')|0]#! | Commissions #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_cel_xuanweisi_count_value')|0]#! | Grand Protectorates #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_cel_duhu_count_value')|0]#!\n- Four Seas Reach: Legacy Zones #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_cel_zone_count_value')|0]#! | Celestial 3.0 Chartered Protectorates #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ui2_cel3_active_zones')|0]#! / 10 | Myriad Tribute Cycles #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ui2_cel3_tribute_cycles')|0]#!\n- Revocation Tension: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_cel_revocation_heat_value')|0]#! / 5 (High heat risks feudatory crisis; cool via conciliations or dynasty decrees)\n- Core Storyline Nodes Completed: #G [ROOT.GetCountry.MakeScope.ScriptValue('oe_ui2_cel_done_count')|0]#! / 14\n\nSelect a volume below to inspect the Vassalage & Dynasty Track (7 nodes) or the Four Seas & Sun-Never-Sets Chain (7 nodes)."
 oe_chr_cel.90.a: "Open Volume I: Vassalage & Dynasty Chain (7 Nodes)"
 oe_chr_cel.90.b: "Open Volume II: Four Seas & Protectorates Chain (7 Nodes)"
 oe_chr_cel.90.c: "Close Chronicle"
 oe_chr_cel.91.title: "Celestial Four Seas Chronicle · Vol. I: Vassalage & Dynasty"
 oe_chr_cel.91.desc: "#T Vassalage & Dynasty Track Core Nodes (7 Entries · Read-Only)#!\n1. First Princely Fief & Vassal Code: [ROOT.GetCountry.Custom('OeUi2CelNode1')] — Triggered upon enfeoffing your first Prince via Celestial interactions.\n2. Great Court Debate on Government: [ROOT.GetCountry.Custom('OeUi2CelNode2')] (Stance: [ROOT.GetCountry.Custom('OeUi2CelDebateSide')]) — Fires via yearly pulse after holding the Mandate, followed by verdict.\n3. Yuan Touxia Commutation / Provincialization: [ROOT.GetCountry.Custom('OeUi2CelNode3')] (Commuted #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_cel_touxia_commuted_count_value')|0]#! / Provincialized #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_cel_touxia_provincialized_count_value')|0]#!) — Use the Touxia reform interaction on appanages.\n4. Dynasty Charter Decree: [ROOT.GetCountry.Custom('OeUi2CelNode4')] — Enact your track's Kurultai, Imperial Clan Court, Mongol Leagues, or Alternative Mandate decision.\n5. Feudatory Revocation Crisis: [ROOT.GetCountry.Custom('OeUi2CelNode5')] (Tension #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_cel_revocation_heat_value')|0]#! / 5) — Keep princely fiefs steady or weather revocation turmoil.\n6. Recall Princely Heirs to Court: [ROOT.GetCountry.Custom('OeUi2CelNode6')] (Recalled #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_cel_recalled_princes_count_value')|0]#!) — Use the character interaction to summon princely heirs to the capital.\n7. Gaituguiliu Integration: [ROOT.GetCountry.Custom('OeUi2CelNode7')] (Staged Targets #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ui2_cel_gtgl_pending')|0]#!) — Adopt a Gaituguiliu policy and integrate Tusi or Pacification Commissions."
 oe_chr_cel.91.a: "Back to Celestial Overview"
 oe_chr_cel.91.b: "Go to Volume II: Four Seas Chain"
 oe_chr_cel.91.c: "Close Chronicle"
 oe_chr_cel.92.title: "Celestial Four Seas Chronicle · Vol. II: Four Seas & Protectorates"
 oe_chr_cel.92.desc: "#T Four Seas & Sun-Never-Sets Core Nodes (7 Entries · Read-Only)#!\n8. Nanyang Palembang & Malacca Hub: [ROOT.GetCountry.Custom('OeUi2CelNode8')] — Control Palembang or Malacca directly or via subjects (fires from 1400).\n9. Indian Ocean Treasure Fleet: [ROOT.GetCountry.Custom('OeUi2CelNode9')] — Adopt the Treasure Fleet policy and reach Calicut and Ceylon.\n10. Western Regions Silk Road Hub: [ROOT.GetCountry.Custom('OeUi2CelNode10')] — Hold Hami, Turpan, or Kashgar directly or through subjects.\n11. Nurgan & Yongning Temple: [ROOT.GetCountry.Custom('OeUi2CelNode11')] — Control Nurgan or Ningguta on the Amur frontier.\n12. Three-Zone / Six-Zone Protectorate Milestones: [ROOT.GetCountry.Custom('OeUi2CelNode12')] (Legacy Zones #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_cel_zone_count_value')|0]#!) — Establish Grand Protectorates across multiple macro-regions.\n13. Celestial 3.0 Chartered Protectorates & Myriad Tribute: [ROOT.GetCountry.Custom('OeUi2CelNode13')] (Chartered Zones #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ui2_cel3_active_zones')|0]#! / 10 | Tribute Cycles #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ui2_cel3_tribute_cycles')|0]#!) — Hold 4+ non-capital locations in a zone to charter with one click; collect Myriad Tribute every 5 years.\n14. Twin Phoenix & Pacific Twin Suns Diplomacy: [ROOT.GetCountry.Custom('OeUi2CelNode14')] — Forge trans-oceanic accords with Rome or Nova Elysia."
 oe_chr_cel.92.a: "Back to Celestial Overview"
 oe_chr_cel.92.b: "Go to Volume I: Vassalage & Dynasty"
 oe_chr_cel.92.c: "Close Chronicle"
