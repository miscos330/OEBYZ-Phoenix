 oe_chr_ely.90.title: "Nova Elysia Chronicle · Overview"
 oe_chr_ely.90.desc: "#T Read-Only Fourth Odyssey Storyline Ledger (Zero State Mutation)#!\n- Settlement Status: [ROOT.GetCountry.Custom('OeUi2ElySettledLabel')]\n- Three Faiths Path: [ROOT.GetCountry.Custom('OeUi2ElyFaithPath')]\n- Native Policy: [ROOT.GetCountry.Custom('OeUi2ElyNativePath')]\n- Active Imperial Exarchates: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ui2_el2_exarchate_count')|0]#! Total (Americas #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ui2_el2_amer_exarch_count')|0]#! / 6 | Old World #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ui2_el2_old_exarch_count')|0]#! / 4)\n- Nostos Stage: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ui2_ely_nostos_stage_val')|0]#! / 4 (0 Idle / 1 Staging / 2 Mediterranean / 3 Constantinople / 4 Finale)\n- Epic Milestones Completed: #G [ROOT.GetCountry.MakeScope.ScriptValue('oe_ui2_ely_done_count')|0]#! / 16\n\nSelect a volume below to inspect Acts I & II (8 nodes) or Acts III & IV (8 nodes)."
 oe_chr_ely.90.a: "Open Volume I: Acts I & II — Crossing & Foundation (8 Nodes)"
 oe_chr_ely.90.b: "Open Volume II: Acts III & IV — Exarchates & Nostos (8 Nodes)"
 oe_chr_ely.90.c: "Close Chronicle"
 oe_chr_ely.91.title: "Nova Elysia Chronicle · Vol. I: Acts I & II"
 oe_chr_ely.91.desc: "#T Acts I & II — Western Crossing & Foundation (8 Nodes · Read-Only)#!\n1. Sacred Flame Departure & Ark Prep: [ROOT.GetCountry.Custom('OeUi2ElyNode1')] (Ark Tier #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ui2_ely_ark_tier_val')|0]#! / 3) — Launch the Western Crossing and outfit the refugee fleet.\n2. Azores Mid-Atlantic Beacon: [ROOT.GetCountry.Custom('OeUi2ElyNode2')] — Raise a waystation beacon on the Azores (grants an Act IV staging shortcut).\n3. Chesapeake Landfall & Capital: [ROOT.GetCountry.Custom('OeUi2ElyNode3')] — Make landfall on the Chesapeake Bay and found Nova Elysia.\n4. Senatus Novae Elysiae Convocation: [ROOT.GetCountry.Custom('OeUi2ElyNode4')] — Convene the Elysian Senate two years after landfall.\n5. Elysian Greek Ethnogenesis: [ROOT.GetCountry.Custom('OeUi2ElyNode5')] — Forge the distinct Elysian Greek culture after 25 years settled.\n6. Three Faiths Settlement: [ROOT.GetCountry.Custom('OeUi2ElyNode6')] (Path: [ROOT.GetCountry.Custom('OeUi2ElyFaithPath')]) — Establish the Western Patriarchate, Atlantic Pantheon, or Symmachan Toleration.\n7. Pyrophoroi & Copper-Clad Fleet: [ROOT.GetCountry.Custom('OeUi2ElyNode7')] — Commission both Pyrophoroi flamethrower infantry and copper-clad galleons.\n8. Elysian Silk & Greek Fire Dockyards: [ROOT.GetCountry.Custom('OeUi2ElyNode8')] — Unlock the Elysian Silk Ergasterion and Greek Fire Naval Arsenal manufactories."
 oe_chr_ely.91.a: "Back to Nova Elysia Overview"
 oe_chr_ely.91.b: "Go to Volume II: Acts III & IV"
 oe_chr_ely.91.c: "Close Chronicle"
 oe_chr_ely.92.title: "Nova Elysia Chronicle · Vol. II: Acts III & IV"
 oe_chr_ely.92.desc: "#T Acts III & IV — Exarchates, Great Reunion & Nostos (8 Nodes · Read-Only)#!\n9. Northern Vinland Encounter: [ROOT.GetCountry.Custom('OeUi2ElyNode9')] — Encounter Norse Vinland on Newfoundland from 1380 for the Varangian Pact or Borealis Exarchate.\n10. Yucatan Spartania Encounter: [ROOT.GetCountry.Custom('OeUi2ElyNode10')] — Meet the lost Laconian legion in Yucatan from 1440 to ally or charter a military exarchate.\n11. Six American Imperial Exarchates: [ROOT.GetCountry.Custom('OeUi2ElyNode11')] (Chartered #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ui2_el2_amer_exarch_count')|0]#! / 6) — Hold 3+ non-capital locations in each American zone to charter with one click.\n12. The Great Trans-Atlantic Reunion: [ROOT.GetCountry.Custom('OeUi2ElyNode12')] — Fires between 1490 and 1560, lifting Old World fog and revealing Constantinople's ruler.\n13. Great Pestilence & Silver Interceptions: [ROOT.GetCountry.Custom('OeUi2ElyNode13')] (Quarantine: [ROOT.GetCountry.Custom('OeUi2ElyQuarantineLabel')] | Silver Fleets Taken #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ui2_ely_silver_intercepts_val')|0]#!) — Manage epidemic quarantine and Atlantic treasure-fleet raids.\n14. Hesperides Eastern Springboard: [ROOT.GetCountry.Custom('OeUi2ElyNode14')] — Establish a forward naval base at the Azores, Madeira, Bermuda, or Gibraltar.\n15. Reclamation of Constantinople & Rome: [ROOT.GetCountry.Custom('OeUi2ElyNode15')] — Sail the Copper-Clad Fleet past the Pillars of Heracles to reclaim the Queen of Cities and Rome.\n16. Grand Finale & Old World Exarchates: [ROOT.GetCountry.Custom('OeUi2ElyNode16')] (Old World Exarchates #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ui2_el2_old_exarch_count')|0]#! / 4) — Proclaim the New World Era, Return of the Flame, or Imperium Bicephalum partition."
 oe_chr_ely.92.a: "Back to Nova Elysia Overview"
 oe_chr_ely.92.b: "Go to Volume I: Acts I & II"
 oe_chr_ely.92.c: "Close Chronicle"
