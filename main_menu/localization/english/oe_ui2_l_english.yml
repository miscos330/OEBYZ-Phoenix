 OE_UI2_SENATE_KPI_SEATS: "Senate Seats"
 OE_UI2_SENATE_KPI_SEATS_TT: "#T [oe_tu_senate|e] Seats & Voting Rules#!\n• Seat allocation: #Y 2#! per [oe_tu_charter|e], #Y 1#! per [oe_tu_exarchate|e] or despotate, #Y 1#! per registered noble house, and #Y 1#! per appointed court officer.\n• Four-Prefecture Delegation Cap: once Prefectures are active or raw provincial seats exceed #Y 12#!, each Prefecture sends at most #Y 4#! seats (max #Y 16#! provincial seats balancing #Y 11#! court seats).\n• Institutional distinction: the [oe_tu_senate|e] votes on extra levies, war levies, [oe_tu_provincialise|e], and Roman law—distinct from the #Y Pillars of the Empire#! governance hub and the domestic #Y East Roman Imperial Council#! parliament.\n• Hover [oe_tu_senate|e] for full scoring and override rules."
