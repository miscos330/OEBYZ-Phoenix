 oe_heg2_dec_proclaim_cul_apex.a: "Open the Imperial Universal Exposition"
 oe_heg2.1.title: "Military Hegemony Deepens: Legions of the Continent"
 oe_heg2.1.desc: "From imperial artillery parks to frontier fortresses, our standing armies have attained unmatched discipline and operational reach. Foreign military attaches warn their courts that the continental balance of arms now tilts decisively in our favor."
 oe_heg2.1.a: "Project continental supremacy and drill the vanguard"
 oe_heg2.1.b: "Consolidate garrison discipline and domestic order"
 oe_heg2.2.title: "Naval Hegemony Deepens: Mastery of the Oceans"
 oe_heg2.2.desc: "Heavy battle fleets and admiralty charts now bind the world's maritime chokepoints together. From inland seas to ocean passages, merchantmen look to our ensign as the arbiter of the waves."
 oe_heg2.2.a: "Expand blue-water patrols and enforce maritime dominance"
 oe_heg2.2.b: "Channel oceanic convoy dues into the imperial treasury"
 oe_heg2.3.title: "Economic Hegemony Deepens: Clearinghouse of Nations"
 oe_heg2.3.desc: "Bills of exchange and intercontinental cargo ledgers converge upon our clearing halls. Unrivaled trade revenue and cheap sovereign credit anchor our treasury while prompting envious rivals to weigh commercial retaliation."
 oe_heg2.3.a: "Harvest intercontinental clearing surpluses and market dominance"
 oe_heg2.3.b: "Reinvest fiscal surpluses into domestic stability and order"
 oe_heg2.4.title: "Cultural Hegemony Deepens: Beacon of Letters & Court"
 oe_heg2.4.desc: "Our court language, scholarship, and artistic canon now radiate across foreign palaces and academies. Princes and thinkers emulate our style, even as traditionalists abroad fret over cultural eclipse."
 oe_heg2.4.a: "Sponsor academies and salons abroad to widen cultural prestige"
 oe_heg2.4.b: "Channel foreign learning into domestic scientific advancement"
 oe_heg2.5.title: "Dual Hegemon Shakes the Great Powers"
 oe_heg2.5.desc: "Word sweeps through every chancellery: our realm now commands two global hegemonies at once! Envoys of rival great powers confer through the night, warning that unchecked dual supremacy could shatter the continental equilibrium."
 oe_heg2.5.a: "Accept their awe and assert imperial preeminence"
 oe_heg2.5.b: "Dispatch conciliatory envoys to temper foreign alarm"
 oe_heg2.6.title: "Shadow of Universal Monarchy: Continental Encirclement"
 oe_heg2.6.desc: "Three or more global hegemonies rest in one sovereign's grasp! Across Eurasia, the dread specter of Universal Monarchy awakens. Bitter historic rivals exchange urgent envoys and forge balance-of-power pacts to contain our rise."
 oe_heg2.6.a: "Defy the encircling coalition with imperial resolve"
 oe_heg2.6.b: "Spend treasury reserves on restraint guarantees to cool the storm"
 oe_heg2.7.title: "Secret Anti-Hegemon Communique: Old Rivals Reconcile"
 oe_heg2.7.desc: "Under the looming shadow of an overmighty hegemon, courts long divided by generational feuds send a sealed diplomatic note proposing a historic reconciliation and balance-of-power compact."
 oe_heg2.7.a: "Sign the balance-of-power compact and reconcile with fellow powers"
 oe_heg2.7.b: "Maintain cautious neutrality and fortify the realm first"
 oe_heg2.8.title: "Eclipse of Hegemony & Imperial Prestige Shock"
 oe_heg2.8.desc: "As a surging rival overtakes our lead, a prized global hegemony slips from our grasp. Murmurs ripple through court and parliament while foreign envoys test whether imperial resolve still holds."
 oe_heg2.8.a: "Endure the diplomatic eclipse and rebuild from within"
 oe_heg2.8.b: "Spend treasury funds on ceremonial recovery to steady the court"
 oe_heg2.9.title: "Continental Blockade vs Maritime Stranglehold"
 oe_heg2.9.desc: "Confronted by tightening anti-hegemon coalitions, the privy council proposes an audacious commercial weapon: enforcing sweeping blockades and embargoes to strangle rival treasuries before open war erupts."
 oe_heg2.9.a: "Enforce sweeping commercial blockades against rival powers"
 oe_heg2.9.b: "Keep trade lanes open to collect duties and ease global friction"
 oe_heg2.10.title: "Universal Court Language & Enlightenment Salons"
 oe_heg2.10.desc: "As Cultural Hegemon, our capital's academies and salons have become the grand stage where foreign envoys, philosophers, and dramatists debate the age. We may wield this prestige outward or channel its ferment into domestic enlightenment."
 oe_heg2.10.a: "Promote our court tongue and cultural canon across foreign capitals"
 oe_heg2.10.b: "Sponsor open scholarly inquiry to accelerate domestic research"
 oe_heg2.11.title: "Hegemonic Tension Critical: Eve of the Great War"
 oe_heg2.11.desc: "Global anti-hegemon tension has reached the breaking point! Foreign embassies burn cipher books as fleets and armies mass along contested frontiers. Every court senses that a Eurasian Great War is poised to ignite."
 oe_heg2.11.a: "Mobilize armies and fleets for the coming struggle for supremacy"
 oe_heg2.11.b: "Issue an urgent restraint manifesto to pull Eurasia back from the brink"
 oe_heg2.12.title: "Hegemonic Restraint & Equilibrium Accord"
 oe_heg2.12.desc: "Seeing international hostility climb steadily, seasoned statesmen urge strategic restraint: convene an ambassadorial accord affirming balanced limits rather than driving every rival into a desperate coalition."
 oe_heg2.12.a: "Ratify the Equilibrium Restraint Accord to cool global tension"
 oe_heg2.12.b: "Reject diplomatic concessions and rely on sheer imperial strength"
