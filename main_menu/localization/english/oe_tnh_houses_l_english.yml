 # NEW 2026-11-18 fourth round D2 (former royal houses). Generated by gen_round4_houses.py; edit the generator, not this file.
 STATIC_MODIFIER_NAME_oe_tnh_court_honours: "Court Dignities and Estates"
 STATIC_MODIFIER_DESC_oe_tnh_court_honours: "This former ruler is honoured at the court of Constantinople and holds an estate."
 oe_tnh_opt_roll: "Enter the House of [SCOPE.sCharacter('oe_tm_king').GetDynasty.GetName] in the Noble House Register"
 oe_tnh_opt_roll.tt: "[SCOPE.sCharacter('oe_tm_king').GetName] stays in Constantinople, and each province is governed by the official the court has named. The House of [SCOPE.sCharacter('oe_tm_king').GetDynasty.GetName] enters the Noble House Register and takes a free place."
 oe_tnh_roll_init1_tt: "One new province: the house starts with 60 influence."
 oe_tnh_roll_init2_tt: "Two new provinces: the house starts with 80 influence."
 oe_tnh_roll_init3_tt: "Three new provinces: the house starts with 100 influence."
 oe_tnh_roll_sure_tt: "The Noble House Register takes only houses with at least 6 living members residing in Eastern Rome. The House of [SCOPE.sCharacter('oe_tm_king').GetDynasty.GetName] has [SCOPE.sCharacter('oe_tm_king').MakeScope.ScriptValue('oe_tnh_kin_at_court')|0] now and qualifies."
 oe_tnh_roll_risk_tt: "The Noble House Register takes only houses with at least 6 living members residing in Eastern Rome. The House of [SCOPE.sCharacter('oe_tm_king').GetDynasty.GetName] has only [SCOPE.sCharacter('oe_tm_king').MakeScope.ScriptValue('oe_tnh_kin_at_court')|0] now. Kin who belong to no country will follow [SCOPE.sCharacter('oe_tm_king').GetName]; if there are still too few, the house cannot enter, and the court grants [SCOPE.sCharacter('oe_tm_king').GetName] court dignities and estates instead (as in the other choice)."
 oe_tnh_opt_honour: "Grant [SCOPE.sCharacter('oe_tm_king').GetName] court dignities and estates"
 oe_tnh_opt_honour.tt: "[SCOPE.sCharacter('oe_tm_king').GetName] stays in Constantinople, and each province is governed by the official the court has named. [SCOPE.sCharacter('oe_tm_king').GetName] holds Court Dignities and Estates for life: diplomacy +5, life expectancy +3 years. Prestige +5. Every new province: loyalty +5, also in its loyalty target for 5 years."
 oe_tnh.1.t: "A Former Royal House in Constantinople"
 oe_tnh.1.d: "In 1018, after the death of Ivan Vladislav, the last tsar of Bulgaria, his widow and children surrendered to Basil II. His eldest son Presian received the high title of magistros and later governed the Bucellarian theme; his brother Alusian was made a patrikios and later governed the theme of Theodosiopolis. In 1280 the Bulgarian tsar Ivan Asen III fled to Byzantine territory during the rising of Ivaylo. He later returned to his family estates in the Troad and died in 1303. His descendants, the Asanes, held offices at court and in the provinces until the end of the empire. His son Andronikos Asen governed the Morea from 1316 to 1322, and his granddaughter Irene married John Kantakouzenos."
 oe_tnh.1.d1: "\n\nNow [SCOPE.sCharacter('oe_tnh_rk').GetName] and [SCOPE.sCharacter('oe_tnh_rk').GetHerHis] family have settled in Constantinople. The House of [SCOPE.sCharacter('oe_tnh_rk').GetDynasty.GetName] has entered the Noble House Register with [GetCountry('BYZ').MakeScope.GetVariable('oe_tnh_rep_init').GetValue|0] influence."
 oe_tnh.1.d2: "\n\nNow [SCOPE.sCharacter('oe_tnh_rk').GetName] has settled in Constantinople, but only [GetCountry('BYZ').MakeScope.GetVariable('oe_tnh_rep_kin').GetValue|0] members of the house reside in Eastern Rome, fewer than the 6 the register requires, so the House of [SCOPE.sCharacter('oe_tnh_rk').GetDynasty.GetName] could not enter it. The court has granted [SCOPE.sCharacter('oe_tnh_rk').GetHerHim] court dignities and estates instead."
 oe_tnh.1.d3: "\n\nNow [SCOPE.sCharacter('oe_tnh_rk').GetName] has settled in Constantinople, but the Noble House Register has no free place, so the House of [SCOPE.sCharacter('oe_tnh_rk').GetDynasty.GetName] could not enter it. The court has granted [SCOPE.sCharacter('oe_tnh_rk').GetHerHim] court dignities and estates instead."
 oe_tnh.1.d4: "\n\nNow [SCOPE.sCharacter('oe_tnh_rk').GetName] has settled in Constantinople, but the House of [SCOPE.sCharacter('oe_tnh_rk').GetDynasty.GetName] could not enter the Noble House Register. The court has granted [SCOPE.sCharacter('oe_tnh_rk').GetHerHim] court dignities and estates instead."
 oe_tnh.1.d5: "\n\nNow [SCOPE.sCharacter('oe_tnh_rk').GetName] can no longer stay at the imperial court, and the House of [SCOPE.sCharacter('oe_tnh_rk').GetDynasty.GetName] could not enter the Noble House Register. The court has reassured the new provinces as custom requires."
 oe_tnh.1.a: "Treat them with honour"
 oe_tnh.1.a.tt_ok: "The House of [SCOPE.sCharacter('oe_tnh_rk').GetDynasty.GetName] is in the Noble House Register with [GetCountry('BYZ').MakeScope.GetVariable('oe_tnh_rep_init').GetValue|0] influence (already done). From now on its influence changes every month by the register's rules."
 oe_tnh.1.a.tt_alt: "[SCOPE.sCharacter('oe_tnh_rk').GetName] holds Court Dignities and Estates for life (if alive): diplomacy +5, life expectancy +3 years. Prestige +5. Every new province: loyalty +5, also in its loyalty target for 5 years. All of this is already done."
 oe_tnh.9.t: "Former royal house: register work"
