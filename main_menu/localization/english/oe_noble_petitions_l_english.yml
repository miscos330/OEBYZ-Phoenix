l_english:
 oe_noble_petitions.1.t: "A House Seeks a Place in the Inner Circle"
 oe_noble_petitions.1.d: "Retainers of the [SCOPE.sDynasty('oe_npet_family').GetName] family have delivered a carefully worded petition. Having recounted the service of their ancestors, they suggest that the highest court offices should not remain forever in other hands. They nominate [SCOPE.sCharacter('oe_npet_nominee').GetName] for the imperial court, offering to relinquish some of their political leverage in return."
 oe_noble_petitions.1.a: "Grant the appointment and issue the decree."
 oe_noble_petitions.1.a.tt: "[SCOPE.sCharacter('oe_npet_nominee').GetName] takes the selected court office. Its current holder, if any, is dismissed at #G no Legitimacy cost#!.\nInfluence of the [SCOPE.sDynasty('oe_npet_family').GetName] family: #G -75#!."
 oe_noble_petitions.2.t: "A House Demands a Cabinet Seat"
 oe_noble_petitions.2.d: "The petition of the [SCOPE.sDynasty('oe_npet_family').GetName] family concerns more than ceremonial honors. They want [SCOPE.sCharacter('oe_npet_nominee').GetName] to sit in the cabinet and take a direct hand in imperial affairs. A seat happens to be vacant, and the family is plainly unwilling to wait for another opportunity."
 oe_noble_petitions.2.d.occupied: "The petition of the [SCOPE.sDynasty('oe_npet_family').GetName] family concerns more than ceremonial honors. They want [SCOPE.sCharacter('oe_npet_nominee').GetName] to sit in the cabinet and take a direct hand in imperial affairs. Their envoy even has a seat in mind: asking [SCOPE.sCharacter('oe_npet_previous').GetName] to step aside would be a fitting gesture of imperial goodwill."
 oe_noble_petitions.2.a: "Give their nominee a voice in government."
 oe_noble_petitions.2.a.tt: "[SCOPE.sCharacter('oe_npet_nominee').GetName] takes the selected cabinet seat, replacing its current holder if occupied, at #G no Legitimacy cost#!.\nInfluence of the [SCOPE.sDynasty('oe_npet_family').GetName] family: #G -50#!."
 oe_noble_petitions.3.t: "A House Seeks Command of a Theme"
 oe_noble_petitions.3.d: "The [SCOPE.sDynasty('oe_npet_family').GetName] family commands considerable influence at court, yet none of its members governs a theme. They propose sending [SCOPE.sCharacter('oe_npet_nominee').GetName] to [SCOPE.sCountry('oe_npet_theme').GetName], promising disciplined troops and a lighter burden for the Emperor. A long list of guarantors accompanies the petition. The family is prepared to surrender several political claims in exchange for the seal of a strategos."
 oe_noble_petitions.3.a: "Entrust the seal and send the nominee to the theme."
 oe_noble_petitions.3.a.tt: "[SCOPE.sCharacter('oe_npet_nominee').GetName] moves to [SCOPE.sCountry('oe_npet_theme').GetName] and immediately replaces its strategos at #G no Legitimacy cost#!. The former governor is not killed.\nInfluence of the [SCOPE.sDynasty('oe_npet_family').GetName] family: #G -50#!."
 oe_noble_petitions.refuse: "Imperial appointments are not a birthright."
 oe_noble_petitions.refuse.tt: "Authority: #R -2#!."
 oe_noble_petitions.lapsed: "Circumstances have changed; set the petition aside."
 oe_noble_petitions.lapsed.tt: "The family, nominee or target no longer qualifies. No appointment changes and no Authority or Influence is lost."
 oe_noble_petitions.1.d.chancellor: "Retainers of the [SCOPE.sDynasty('oe_npet_family').GetName] family have delivered a carefully worded petition. Having recounted the service of their ancestors, they suggest that the highest court offices should not remain forever in other hands. They nominate [SCOPE.sCharacter('oe_npet_nominee').GetName] for the imperial court, offering to relinquish some of their political leverage in return.\n\nThe office they seek is #Y $oe_court_chancellor$#!."
