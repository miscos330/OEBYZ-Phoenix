 oe_emd.3.desc_b: "#F In 1386 Mircea became Prince of Wallachia. The Danube is all that lies between the principality and the Ottomans, and the princes north of the river have never been content to watch who rules its southern bank.#!\n\nNow the men and horses of [GetCountry('WAL').GetGovernment.GetRuler.GetFirstNameWithNoTooltip] are crossing the Danube to help [GetCountry('BYZ').MakeScope.GetVariable('oe_emd_pr').GetCharacter.GetFirstNameWithNoTooltip] win the throne, and [GetCountry('BYZ').MakeScope.GetVariable('oe_emd_pr').GetCharacter.GetFirstNameWithNoTooltip] has gained by it: strength #Y +10#!. The empire backs this very claimant, and now has a friend beyond the Danube."
 oe_emd.3.desc_x: "#F In 1386 Mircea became Prince of Wallachia. The Danube is all that lies between the principality and the Ottomans, and the princes north of the river have never been content to watch who rules its southern bank.#!\n\nNow the men and horses of [GetCountry('WAL').GetGovernment.GetRuler.GetFirstNameWithNoTooltip] are crossing the Danube to help [GetCountry('BYZ').MakeScope.GetVariable('oe_emd_pr').GetCharacter.GetFirstNameWithNoTooltip] win the throne, and [GetCountry('BYZ').MakeScope.GetVariable('oe_emd_pr').GetCharacter.GetFirstNameWithNoTooltip] has gained by it: strength #Y +10#!. The empire has not backed this claimant and must decide what to do."
 oe_emd.3.a: "Send envoys to talk the Wallachian prince out of it"
 oe_emd.3.a.tt: "Costs #R 1#! month of trade and tax income\n[GetCountry('BYZ').MakeScope.GetVariable('oe_emd_pr').GetCharacter.GetFirstNameWithNoTooltip]: strength #Y −10#!\nWallachia: opinion of the empire #G +5#! for #Y 5#! years"
 oe_emd.3.b: "Back the same claimant as Wallachia"
 oe_emd.3.b.tt: "Back [GetCountry('BYZ').MakeScope.GetVariable('oe_emd_pr').GetCharacter.GetFirstNameWithNoTooltip] instead: our commitment starts again from nothing and then stands at #Y 1#! (at most #Y 3#!)\n[GetCountry('BYZ').MakeScope.GetVariable('oe_emd_pr').GetCharacter.GetFirstNameWithNoTooltip]: strength #G +5#!\nWallachia: opinion of the empire #G +15#! for #Y 10#! years"
 oe_emd.3.c: "Let it be"
 oe_emd.3.c.tt: "The empire takes no side; the contest goes on"
 oe_emd.3.d: "Stand with the Wallachian prince"
 oe_emd.3.d.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_emd_pr').GetCharacter.GetFirstNameWithNoTooltip]: strength #G +5#!\nWallachia: opinion of the empire #G +15#! for #Y 10#! years"
 oe_emd.12.t: "Khirokitia"
 oe_emd.12.desc_n: "#F In September 1424 a Mamluk fleet landed on Cyprus for the first time and burned Limassol; in the summer of 1425 forty ships came again, the Genoese governor of Famagusta submitted to the sultan, and Larnaca and Limassol were plundered. In July 1426 more than a hundred ships came a third time; on 7 July the Cypriot army broke at Khirokitia, King Janus was taken prisoner and carried to Cairo, and Larnaca and Nicosia were sacked. It is said that the Greek peasants of the island rose in the confusion and hailed a man named Alexis as their king. The king was held in Cairo for about ten months and came home only after a ransom of two hundred thousand dinars and a promise of yearly tribute; it is said that Alexis was put to death on the day the king reached Paphos.#!\n\nNow the Mamluks have won a crushing victory on Cyprus, and the kingdom has bowed to Cairo: it must raise a great ransom and pay tribute every year after. The Greeks of the island look to Constantinople; the patriarchs of Alexandria, Antioch and Jerusalem all live under this same sultan, and Cairo will mark what the empire says."
