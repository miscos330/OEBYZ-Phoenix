 oe_emd.12.a: "Help Cyprus raise the king's ransom"
 oe_emd.12.a.tt: "Costs #R 2#! months of trade and tax income\nCyprus: opinion of the empire #G +25#! for #Y 20#! years\nCyprus will remember this"
 oe_emd.12.b: "Send envoys to Cairo to ask mercy for the island's Orthodox"
 oe_emd.12.b.tt: "Costs #R 1#! month of trade and tax income\nThe Mamluks: opinion of the empire #G +15#! for #Y 10#! years\n[Concept('oe_tu_patriarchate','patriarchal standing')|e] #G +2#!"
 oe_emd.12.c: "Send monks to the island to steady its Greeks"
 oe_emd.12.c.tt: "Cyprus: opinion of the empire #R −15#! for #Y 10#! years\nShares of the [Concept('oe_tu_church_parties','church parties')|e]: Hesychasts #Y +2#!\n[Concept('oe_tu_patriarchate','patriarchal standing')|e] #G +3#!"
 oe_emd.12.d: "Watch from across the water"
 oe_emd.12.d.tt: "The empire stays out of it"
 oe_emd.13.t: "A Bride from the Morea"
 oe_emd.13.desc_nt: "#F Since Khirokitia, Cyprus has paid tribute to Cairo every year. The Lusignan kings have always looked for their brides among the royal and noble houses of the Latins, though most of their subjects on the island are Greeks who keep the rite of the eastern Church. It is said that in the autumn of 1440 the first wife of King John II of Cyprus, a queen from the Palaiologos house of Montferrat, died, and the king had to marry again. In February 1442 Helena, daughter of Theodore II, Despot of the Morea, married the king in the cathedral of Saint Sophia at Nicosia; it is said Helena turned fourteen that very day.#!\n\nNow envoys of the court of Cyprus have come to the capital to ask for a princess of the imperial house as a bride for [GetCountry('BYZ').MakeScope.GetVariable('oe_emd_groom').GetCharacter.GetFirstNameWithNoTooltip]. The one of an age to marry is [GetCountry('BYZ').MakeScope.GetVariable('oe_emd_bride_c').GetCharacter.GetFirstNameWithNoTooltip], now #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_emd_bride_c').GetCharacter.GetAgeInYears]#! years old. The imperial house is thin: there is no other princess at court."
