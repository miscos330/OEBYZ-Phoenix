 oe_emd.1.b: "Take the gift and leave the house as it is"
 oe_emd.1.b.tt: "Wallachia: opinion of the empire #G +5#! for #Y 5#! years\n[Concept('oe_tu_patriarchate','patriarchal standing')|e] #G +1#!"
 oe_emd.1.c: "Ask the prince to give to the churches of the capital as well"
 oe_emd.1.c.tt: "Gain #G 1#! month of trade and tax income\nWallachia: opinion of the empire #R −10#! for #Y 5#! years"
 oe_emd.3.t: "The Father-in-Law beyond the Danube"
 oe_emd.3.desc_nb: "#F After Ankara, Prince Musa, taken prisoner with the sultan, was set free. Around 1409 Musa crossed the Black Sea into Rumelia and allied with Prince Mircea of Wallachia; it is said the prince also gave Musa a daughter in marriage. In 1411 Musa defeated the brother who held Rumelia, and then brought an army to the walls of Constantinople.#!\n\nNow the men and horses of [GetCountry('WAL').GetGovernment.GetRuler.GetFirstNameWithNoTooltip] are crossing the Danube to help [GetCountry('BYZ').MakeScope.GetVariable('oe_emd_pr').GetCharacter.GetFirstNameWithNoTooltip] win the throne, and [GetCountry('BYZ').MakeScope.GetVariable('oe_emd_pr').GetCharacter.GetFirstNameWithNoTooltip] has gained by it: strength #Y +10#!. The empire backs this very claimant, and now has a friend beyond the Danube."
 oe_emd.3.desc_n: "#F After Ankara, Prince Musa, taken prisoner with the sultan, was set free. Around 1409 Musa crossed the Black Sea into Rumelia and allied with Prince Mircea of Wallachia; it is said the prince also gave Musa a daughter in marriage. In 1411 Musa defeated the brother who held Rumelia, and then brought an army to the walls of Constantinople.#!\n\nNow the men and horses of [GetCountry('WAL').GetGovernment.GetRuler.GetFirstNameWithNoTooltip] are crossing the Danube to help [GetCountry('BYZ').MakeScope.GetVariable('oe_emd_pr').GetCharacter.GetFirstNameWithNoTooltip] win the throne, and [GetCountry('BYZ').MakeScope.GetVariable('oe_emd_pr').GetCharacter.GetFirstNameWithNoTooltip] has gained by it: strength #Y +10#!. The empire has not backed this claimant and must decide what to do."
