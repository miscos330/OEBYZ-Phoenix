 oe_emd.11.t: "The Reins at Famagusta"
 oe_emd.11.desc_lgp: "#F In the autumn of 1372 the new King of Cyprus was crowned King of Jerusalem at Famagusta, and the Genoese and the Venetians quarrelled over who should hold the right rein of the king's horse until the quarrel became a street fight. Then a Genoese fleet arrived; the gates, it is said, were opened for talks, and Famagusta fell into Genoese hands. The peace of the following year left Famagusta to Genoa; the king paid a huge indemnity, and the king's uncle James was taken to Genoa as a hostage. Less than ten years before, the King of Cyprus had sacked Alexandria, partly to draw the eastern trade to this very port.#!\n\nNow Famagusta belongs to Genoa. The richest port of the eastern Mediterranean is in the hands of the countrymen of the Genoese at Galata; Cyprus must pay an indemnity and give hostages, and the Venetians cannot stomach it. The Genoese at Galata are celebrating too. It is said the Genoese are secretly dealing with the emperor's son."
