 oe_emd.2.t: "News from Rovine"
 oe_emd.2.desc_lhc: "#F In 1386 Mircea became Prince of Wallachia, and in March 1395 the prince made an alliance with King Sigismund of Hungary at Brașov. Sultan Bayezid crossed the Danube against the prince, and the two armies met somewhere near the river Argeș, in the autumn of 1394 by one account and in May 1395 by another. Marko, the Serbian lord who rode with the sultan, fell; who won is told differently by different sources.#!\n\nNow word comes from north of the Danube: [GetCountry('WAL').GetGovernment.GetRuler.GetName] has stopped the sultan, and the Ottoman host has fallen back across the river. Wallachian envoys have come to the capital, and the sultan's men are watching what the empire will say. The capital is under blockade, and the people in the city have heard the news too."
 oe_emd.2.desc_lh: "#F In 1386 Mircea became Prince of Wallachia, and in March 1395 the prince made an alliance with King Sigismund of Hungary at Brașov. Sultan Bayezid crossed the Danube against the prince, and the two armies met somewhere near the river Argeș, in the autumn of 1394 by one account and in May 1395 by another. Marko, the Serbian lord who rode with the sultan, fell; who won is told differently by different sources.#!\n\nNow word comes from north of the Danube: [GetCountry('WAL').GetGovernment.GetRuler.GetName] has stopped the sultan, and the Ottoman host has fallen back across the river. Wallachian envoys have come to the capital, and the sultan's men are watching what the empire will say."
 oe_emd.2.desc_lc: "#F In 1386 Mircea became Prince of Wallachia, and in March 1395 the prince made an alliance with King Sigismund of Hungary at Brașov. Sultan Bayezid crossed the Danube against the prince, and the two armies met somewhere near the river Argeș, in the autumn of 1394 by one account and in May 1395 by another. Marko, the Serbian lord who rode with the sultan, fell; who won is told differently by different sources.#!\n\nNow word comes from north of the Danube: the Wallachians could not stop the sultan, and it is said the sultan has set up a more obliging prince there. Wallachians who escaped have come to the capital for help, and the sultan's men are watching what the empire will say. The capital is under blockade, and the people in the city have heard the news too."
