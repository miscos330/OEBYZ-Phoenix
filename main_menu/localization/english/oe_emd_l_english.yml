 oe_emd.1.t: "Wallachian Gold on the Holy Mountain"
 oe_emd.1.desc_las: "#F While Nicholas Alexander was Prince of Wallachia, the prince began to give generously to the monastery of Koutloumousiou on the Holy Mountain. The prince died in November 1364, and Abbot Chariton turned to the new prince, Vladislav, who set terms: to be named a founder beside the abbot, and to have Wallachian monks admitted to the house. In the autumn of 1369 another large gift came from Wallachia. It is said that the monk Nicodemus also went north from the Holy Mountain to build monasteries beyond the Danube with the prince's support.#!\n\nNow envoys of [GetCountry('WAL').GetGovernment.GetRuler.GetFirstNameWithNoTooltip] have come to the capital with gold: Wallachia will pay to enlarge the monastery on the Holy Mountain, and asks only that its own monks be admitted and that the prince be counted among the founders. The Holy Mountain is under the empire, and the matter needs the emperor's word. The Metropolitan of Ungrovlachia is consecrated by our patriarch, which makes the prince's request harder to refuse."
 oe_emd.1.desc_la: "#F While Nicholas Alexander was Prince of Wallachia, the prince began to give generously to the monastery of Koutloumousiou on the Holy Mountain. The prince died in November 1364, and Abbot Chariton turned to the new prince, Vladislav, who set terms: to be named a founder beside the abbot, and to have Wallachian monks admitted to the house. In the autumn of 1369 another large gift came from Wallachia. It is said that the monk Nicodemus also went north from the Holy Mountain to build monasteries beyond the Danube with the prince's support.#!\n\nNow envoys of [GetCountry('WAL').GetGovernment.GetRuler.GetFirstNameWithNoTooltip] have come to the capital with gold: Wallachia will pay to enlarge the monastery on the Holy Mountain, and asks only that its own monks be admitted and that the prince be counted among the founders. The Holy Mountain is under the empire, and the matter needs the emperor's word."
 oe_emd.1.desc_ls: "#F While Nicholas Alexander was Prince of Wallachia, the prince began to give generously to the monastery of Koutloumousiou on the Holy Mountain. The prince died in November 1364, and Abbot Chariton turned to the new prince, Vladislav, who set terms: to be named a founder beside the abbot, and to have Wallachian monks admitted to the house. In the autumn of 1369 another large gift came from Wallachia. It is said that the monk Nicodemus also went north from the Holy Mountain to build monasteries beyond the Danube with the prince's support.#!\n\nNow envoys of [GetCountry('WAL').GetGovernment.GetRuler.GetFirstNameWithNoTooltip] have come to the capital with gold: Wallachia will pay to enlarge the monastery on the Holy Mountain, and asks only that its own monks be admitted and that the prince be counted among the founders. The Holy Mountain is no longer in the empire's hands, but the patriarch still oversees its monasteries, and the matter still needs the capital's word. The Metropolitan of Ungrovlachia is consecrated by our patriarch, which makes the prince's request harder to refuse."
