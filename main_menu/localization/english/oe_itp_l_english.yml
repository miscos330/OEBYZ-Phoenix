 oe_itp_borrow: "Borrow from the Italians"
 oe_itp_borrow_desc: "Borrow from an Italian republic that has a treaty with the empire, repaid over #Y 60#! months; it counts as foreign debt. The sum and the interest follow their [Concept('oe_tu_privilege','privileges')|e]: trade treaty, #Y 4#! months of income at #Y 8%#!; exemption and residence, #Y 8#! months of income at #Y 6%#!; pledge and concession, #Y 12#! months of income at #Y 4%#!. After the ban on foreign banks each rate is #Y 1%#! higher.\nRequires: their opinion of us at least #Y 0#!, no war, no unpaid loan; one loan from the same republic every #Y 24#! months; none from Venice while its treaty has lapsed; our foreign debt below #Y 18#! months of income.\nNow: a month of income is about #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m1')|0]#! gold; foreign debt #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_fdebt')|0]#! gold, the limit #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m18')|0]#! gold.\nVenice: [GetCountry('BYZ').Custom('OeItpTierVen')]; can lend #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_borrow_amt_ven')|0]#! gold at #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_borrow_pct_ven')|0]%#!; #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_loan_left_ven')|0]#! gold unpaid\nGenoa: [GetCountry('BYZ').Custom('OeItpTierGen')]; can lend #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_borrow_amt_gen')|0]#! gold at #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_borrow_pct_gen')|0]%#!; #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_loan_left_gen')|0]#! gold unpaid\nPisa: [GetCountry('BYZ').Custom('OeItpTierPis')]; can lend #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_borrow_amt_pis')|0]#! gold at #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_borrow_pct_pis')|0]%#!; #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_loan_left_pis')|0]#! gold unpaid\nRagusa: [GetCountry('BYZ').Custom('OeItpTierRag')]; can lend #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_borrow_amt_rag')|0]#! gold at #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_borrow_pct_rag')|0]%#!; #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_loan_left_rag')|0]#! gold unpaid\nThe Venetian treaty: [GetCountry('BYZ').Custom('OeItpVenPact')]"
 oe_itp_borrow_card: "Borrow from an Italian republic; the sum and the interest follow its privileges."
 oe_itp_borrow_tt: "The chosen republic lends us money (sum and interest as described), repaid over #Y 60#! months."
 oe_itp_borrow_select: "Choose the lender"
 oe_itp_borrow_none: "@trigger_no!No Italian republic can lend to us."
 oe_itp_grant: "Grant a Privilege"
 oe_itp_grant_desc: "Raise an Italian republic's [Concept('oe_tu_privilege','privileges')|e] by one tier.\nTo exemption and residence: Pisa or Ragusa pays us #G [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m2')|0]#! gold (#Y 2#! months of income); they are exempted from the strait toll (Ragusa also gets fondaco rights) and we gain [ShowModifier('oe_itp_exempt_pis')] (tariff income #R −2%#!, trade advantage #G +2%#!) or [ShowModifier('oe_itp_exempt_rag')] (tariff income #R −2%#!, trade advantage #G +2%#!); their opinion #G +10#!. Venice or Genoa coming back from a trade treaty pays #G [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m3')|0]#! gold (#Y 3#! months of income), and our duties on them end.\nTo pledge and concession (Venice and Genoa only): they lend us #G [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m10')|0]#! gold, interest-free, repaid over #Y 120#! months; they get fleet basing rights for #Y 240#! months and we gain [ShowModifier('oe_itp_pledge_ven')] (tariff income #R −6%#!, trade advantage #R −5%#!, monthly food #R −5%#!) or [ShowModifier('oe_itp_pledge_gen')] (tariff income #R −8%#!, trade advantage #R −5%#!); their opinion #G +30#!, their rival's (Venice and Genoa) #R −10#!; prestige #R −5#!.\nHighest tiers: Venice and Genoa pledge and concession, only exemption and residence after the Expulsion of the Foreigners or once their quarter in the City is gone; Pisa and Ragusa exemption and residence, Ragusa only a trade treaty while it is a Venetian subject.\nPrivileges of the same republic can be granted or revoked once every #Y 60#! months. While the Galata dispute is under way, Genoa's stay as they are.\nVenice: [GetCountry('BYZ').Custom('OeItpTierVen')]\nGenoa: [GetCountry('BYZ').Custom('OeItpTierGen')]\nPisa: [GetCountry('BYZ').Custom('OeItpTierPis')]\nRagusa: [GetCountry('BYZ').Custom('OeItpTierRag')]\nThe Venetian treaty: [GetCountry('BYZ').Custom('OeItpVenPact')]"
 oe_itp_grant_card: "Raise an Italian republic's privileges for money or an interest-free loan."
 oe_itp_grant_tt: "The chosen republic's privileges rise one tier (gains and costs as described)."
 oe_itp_grant_select: "Choose the republic"
 oe_itp_grant_none: "@trigger_no!No Italian republic can be granted more privileges."
 oe_itp_revoke: "Revoke a Privilege"
 oe_itp_revoke_desc: "Lower an Italian republic's [Concept('oe_tu_privilege','privileges')|e] by one tier.\nFrom pledge and concession: redeem the pledge for #R 8#! months of income (#R 4#! with #Y 60#! months or less to run) and fall to exemption and residence; their opinion of us #R −10#! (#Y 5#! years).\nFrom exemption and residence or a trade treaty: costs #R 10#! [oe_tu_authority|e], one tier down; their opinion of us #R −40#! (#Y 20#! years). When Venice or Genoa falls from exemption to a trade treaty we levy duties on them (tariff income #G +6%#! or #G +5%#!, burghers' target satisfaction #G +3%#!); the strait toll exemption they have held since the start stays. When Pisa or Ragusa falls to a trade treaty, their exemption, toll exemption and fondaco rights go. A reprisal may follow in #Y 3#! to #Y 9#! months: Venice and Genoa #R 30%#! (#R 45%#! when their navy is larger than ours), Pisa and Ragusa #R 10%#!.\nPrivileges of the same republic can be granted or revoked once every #Y 60#! months. While the Galata dispute is under way, Genoa's stay as they are.\nVenice: [GetCountry('BYZ').Custom('OeItpTierVen')]\nGenoa: [GetCountry('BYZ').Custom('OeItpTierGen')]\nPisa: [GetCountry('BYZ').Custom('OeItpTierPis')]\nRagusa: [GetCountry('BYZ').Custom('OeItpTierRag')]\nThe Venetian treaty: [GetCountry('BYZ').Custom('OeItpVenPact')]\nRedeeming Venice's pledge costs #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_redeem_ven')|0]#! gold now; redeeming Genoa's pledge costs #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_redeem_gen')|0]#! gold now."
 oe_itp_revoke_card: "Take back a tier of an Italian republic's privileges; expect reprisals."
 oe_itp_revoke_tt: "The chosen republic's privileges fall one tier (costs as described)."
 oe_itp_revoke_select: "Choose the republic"
 oe_itp_revoke_none: "@trigger_no!No Italian republic's privileges can be revoked."
 game_concept_oe_tu_privilege: "Italian Privileges"
 game_concept_oe_tu_privilege_desc: "#F A chrysobull of Alexios I let the Venetians trade free of duty in the empire; the Treaty of Nymphaeum in 1261 gave the Genoese lower dues and a quarter at Pera; Pisa in 1111, and later Ragusa, had their own treaties.#!\n\nConstantinople's privileges for the Italian merchant republics come in four tiers:\nNo treaty (tier #Y 0#!): no loans.\nTrade treaty (tier #Y 1#!): small loans. When Venice or Genoa falls from exemption to a trade treaty, we levy duties on them.\nExemption and residence (tier #Y 2#!): they pay no strait toll and keep a quarter in the City. Venice and Genoa start here; its price is already in the Galata modifier, the toll exemptions and the foreign quarters of the start. When Pisa or Ragusa reaches it, our tariff income #R −2%#!, trade advantage #G +2%#!.\nPledge and concession (tier #Y 3#!): fleet basing rights as well, for #Y 240#! months. Venice: tariff income #R −6%#!, trade advantage #R −5%#!, monthly food #R −5%#!; Genoa: tariff income #R −8%#!, trade advantage #R −5%#!.\n\nHighest tiers: Venice and Genoa pledge and concession, only exemption and residence after the Expulsion of the Foreigners or once their quarter in the City is gone; Pisa and Ragusa exemption and residence, Ragusa only a trade treaty while it is a Venetian subject.\nAt the start: Venice and Genoa exemption and residence, Pisa and Ragusa a trade treaty.\nThe Venetian treaty falls due every #Y 60#! months: renew it, haggle, or let it lapse. The old claims Venice keeps (in thousands of ducats) are paid off in instalments at each renewal.\nRevoking a privilege invites reprisals. While the Galata dispute is under way, Genoa's privileges stay as they are.\nThe group 'Treaties and Privileges' in the Imperial Pillars' fiscal edicts borrows, grants and revokes."
 oe_itp.1.t: "The Venetian Treaty Expires"
 oe_itp.1.d1: "#F In 1268 Michael VIII made a treaty with Venice for five years: Venetian merchants again traded free of duty in the empire, and could buy grain for export while its price stayed low. The two states renewed their treaties again and again; the treaty of 1390 restated the old debts and spread the damages over five years.#!\n\nAfter the last treaty was let lapse, the Doge's envoys are at the palace gate again, ready to talk. The Venetians keep their [Concept('oe_tu_privilege','privileges')|e] in the City, but without a treaty no Venetian money comes our way.[GetCountry('BYZ').Custom('OeItpClaimsLine')][GetCountry('BYZ').Custom('OeItpJewelsLine')]"
 oe_itp.1.d2: "#F In 1268 Michael VIII made a treaty with Venice for five years: Venetian merchants again traded free of duty in the empire, and could buy grain for export while its price stayed low. The two states renewed their treaties again and again; the treaty of 1390 restated the old debts and spread the damages over five years.#!\n\nThe treaty with Venice has run out. The Doge's envoys wait at the palace gate: renew on the old terms and pay the next instalment of the old claims, or bargain afresh. The Venetians' [Concept('oe_tu_privilege','privileges')|e] in the City are on the table too.[GetCountry('BYZ').Custom('OeItpClaimsLine')][GetCountry('BYZ').Custom('OeItpJewelsLine')]"
 oe_itp.1.a: "Renew on the old terms"
 oe_itp.1.a.tt: "Pay #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_due')|0]#! gold, this instalment of the old claims\nVenetian claims #G −[GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_due_kd')|0]#! thousand ducats\nThe treaty runs for #Y 60#! more months; no longer without a treaty, if we were\nVenice: opinion of us #G +10#! (#Y 5#! years)"
 oe_itp.1.b: "Haggle"
 oe_itp.1.b.tt: "Chance of success: #G [GetCountry('BYZ').MakeScope.GetVariable('oe_itp_hgch').GetValue|0]%#! (higher if Venice is at war with Genoa or the Ottomans, or if our navy is at least half the size of the Venetian one; lower with large claims)\nSuccess: Venice's [Concept('oe_tu_privilege','privileges')|e] drop one tier (from exemption to a trade treaty we levy duties on the Venetians: tariff income #G +6%#!); the treaty runs #Y 60#! more months\nFailure: the treaty runs only #Y 24#! more months; claims #R +5#! thousand ducats\nEither way: Venice: opinion of us #R −15#! (#Y 5#! years)"
 oe_itp.1.c: "Let it lapse"
 oe_itp.1.c.tt: "We gain [ShowModifier('oe_itp_no_pact_ven')] (trade advantage #R −5%#!) until a treaty is made again\nNo loans from Venice\nThe Venetians come back in #Y 24#! months\nVenice: opinion of us #R −25#! (#Y 10#! years)\n#R 15%#! chance of a reprisal in #Y 3#! to #Y 9#! months"
 oe_itp.1.d: "Pledge to clear the old claims"
 oe_itp.1.d.tt: "Venice's [Concept('oe_tu_privilege','privileges')|e] rise to a pledge and concession for #Y 240#! months: [ShowModifier('oe_itp_pledge_ven')] (tariff income #R −6%#!, trade advantage #R −5%#!, monthly food #R −5%#!), and fleet basing rights for Venice\nThe Venetian claims are cleared\nVenice pays us #G [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m4')|0]#! gold besides\nThe treaty runs #Y 60#! more months\nVenice: opinion of us #G +30#!; Genoa #R −10#!"
 oe_itp.2.t: "An Italian Loan"
 oe_itp.2.desc: "#F In 1343 the Empress Anna pawned the crown jewels to Venice for 30,000 ducats; in 1352 Venice lent John V another 5,000.#!\n\nOur treasury is nearly empty, while the merchants of [SCOPE.sCountry('oe_itp_r').GetName] have money to spare. Their envoys offer a loan: at the usual interest, or interest-free in exchange for one more tier of [Concept('oe_tu_privilege','privileges')|e]."
 oe_itp.2.a: "Trade a privilege for the loan"
 oe_itp.2.a.tt: "[SCOPE.sCountry('oe_itp_r').GetName] lends us #G [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m10')|0]#! gold, interest-free, repaid over #Y 120#! months\n[SCOPE.sCountry('oe_itp_r').GetName]'s [Concept('oe_tu_privilege','privileges')|e] rise to a pledge and concession for #Y 240#! months: we gain the pledge modifier (Venice: tariff income #R −6%#!, trade advantage #R −5%#!, monthly food #R −5%#!; Genoa: tariff income #R −8%#!, trade advantage #R −5%#!), and they get fleet basing rights\n[SCOPE.sCountry('oe_itp_r').GetName]: opinion of us #G +30#!; their rival #R −10#!"
 oe_itp.2.b: "Trade a privilege for the loan"
 oe_itp.2.b.tt: "[SCOPE.sCountry('oe_itp_r').GetName] lends us #G [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m6')|0]#! gold, interest-free, repaid over #Y 60#! months\n[SCOPE.sCountry('oe_itp_r').GetName]'s [Concept('oe_tu_privilege','privileges')|e] return to exemption and residence: our duties on them end, if any"
 oe_itp.2.c: "Borrow on the usual terms"
 oe_itp.2.c.tt: "[SCOPE.sCountry('oe_itp_r').GetName] lends us #G [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m6')|0]#! gold at #R 6%#! a year (#R 7%#! after the ban on foreign banks), repaid over #Y 60#! months"
 oe_itp.2.d: "Decline"
 oe_itp.2.d.tt: "Nothing happens"
 oe_itp.4.t: "Reprisals"
 oe_itp.4.d1: "#F In 1348 John VI lowered the dues of the City to draw trade from Galata, and the Genoese crossed the Golden Horn to burn ships and attack the walls; in 1451 Constantine XI raised the duties on Venetian goods, and Venice made its own treaty with Mehmed II.#!\n\n[SCOPE.sCountry('oe_itp_r').GetName] has not forgotten. Their galleys caught one of our ships at sea and burnt it. [GetCountry('BYZ').Custom('OeItpWhyLine')]"
 oe_itp.4.d2: "#F In 1348 John VI lowered the dues of the City to draw trade from Galata, and the Genoese crossed the Golden Horn to burn ships and attack the walls; in 1451 Constantine XI raised the duties on Venetian goods, and Venice made its own treaty with Mehmed II.#!\n\n[SCOPE.sCountry('oe_itp_r').GetName] has not forgotten. They seized our merchants' goods and fined them about #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m1')|0]#! gold. [GetCountry('BYZ').Custom('OeItpWhyLine')]"
 oe_itp.4.a: "Pay them off"
 oe_itp.4.a.tt: "Pay #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m2')|0]#! gold\n[SCOPE.sCountry('oe_itp_r').GetName]'s grudge over the revoked privileges or the lapsed treaty is removed"
 oe_itp.4.b: "An eye for an eye"
 oe_itp.4.b.tt: "Seize their merchantmen: #G [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m1')|0]#! gold\n[SCOPE.sCountry('oe_itp_r').GetName]: opinion of us #R −20#! (#Y 10#! years)\n#R 20%#! chance of one more reprisal (once only)"
 oe_itp.4.c: "Restore their privileges"
 oe_itp.4.c.tt: "[SCOPE.sCountry('oe_itp_r').GetName]'s [Concept('oe_tu_privilege','privileges')|e] rise one tier\n[SCOPE.sCountry('oe_itp_r').GetName]'s grudge over the revoked privileges is removed"
 oe_itp.4.d: "Restore the treaty"
 oe_itp.4.d.tt: "The treaty with Venice is restored for #Y 60#! months; no longer without a treaty\nVenice's grudge over the lapsed treaty is removed"
 oe_itp.5.t: "After Galata"
 oe_itp.5.desc: "#F Around 1348 the empire collected only about thirteen per cent of the dues paid by ships passing the Bosporus; the rest went to Galata.#!\n\nGalata's privileges are abolished. Its customs come back to the empire, and the Genoese no longer trade free of duty in our other ports either. Genoa's [Concept('oe_tu_privilege','privileges')|e] fall to a trade treaty."
 oe_itp.5.a: "So noted"
 oe_itp.5.a.tt: "Genoa's privileges are now a trade treaty (the Galata settlement already counts in our customs; no further duties)"
 oe_itp.9.t: "The Foreigners Expelled"
 oe_itp.9.desc: "The foreign quarters of the City are gone. With them [SCOPE.sCountry('oe_itp_r').GetName]'s pledge and concession in the empire lapse: the pledge and the fleet basing rights are taken back, and [SCOPE.sCountry('oe_itp_r').GetName]'s [Concept('oe_tu_privilege','privileges')|e] fall to exemption and residence. Their people say we have broken the pledge."
 oe_itp.9.a: "Let them complain"
 oe_itp.9.a.tt: "[SCOPE.sCountry('oe_itp_r').GetName]'s privileges are now exemption and residence\n[SCOPE.sCountry('oe_itp_r').GetName]: opinion of us #R −30#! (#Y 10#! years)"
 oe_itp.13.t: "The Pledge Falls Due"
 oe_itp.13.desc: "#F In 1370 John V was held in Venice for debt and offered the island of Tenedos to settle it; the peace of 1352 had already pushed the bounds of Galata further out.#!\n\nThe pledge and concession we gave [SCOPE.sCountry('oe_itp_r').GetName] have fallen due. We can take them back, or pledge them for ten more years."
 oe_itp.13.a: "Take back the pledge"
 oe_itp.13.a.tt: "[SCOPE.sCountry('oe_itp_r').GetName]'s [Concept('oe_tu_privilege','privileges')|e] fall to exemption and residence: the pledge modifier goes, the fleet basing rights are taken back\n[SCOPE.sCountry('oe_itp_r').GetName]: opinion of us #R −10#! (#Y 5#! years)"
 oe_itp.13.b: "Pledge for ten more years"
 oe_itp.13.b.tt: "The pledge and concession run #Y 120#! more months\n[SCOPE.sCountry('oe_itp_r').GetName] pays us #G [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m5')|0]#! gold"
 oe_itp.13.c: "Renew to pay down the old claims"
 oe_itp.13.c.tt: "The pledge and concession run #Y 120#! more months\nVenetian claims #G −10#! thousand ducats"
