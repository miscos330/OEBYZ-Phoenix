 game_concept_oe_tu_privilege: "Italian Privileges"
 game_concept_oe_tu_privilege_desc: "#F A chrysobull of Alexios I let the Venetians trade free of duty in the empire; the Treaty of Nymphaeum in 1261 gave the Genoese lower dues and a quarter at Pera; Pisa in 1111, and later Ragusa, had their own treaties.#!\n\nConstantinople's privileges for the Italian merchant republics come in four tiers:\nNo treaty (tier #Y 0#!): no loans.\nTrade treaty (tier #Y 1#!): small loans. When Venice or Genoa falls from exemption to a trade treaty, we levy duties on them.\nExemption and residence (tier #Y 2#!): they pay no strait toll and keep a quarter in the City. Venice and Genoa start here; its price is already in the Galata modifier, the toll exemptions and the foreign quarters of the start. When Pisa or Ragusa reaches it, our tariff income #R −2%#!, trade advantage #G +2%#!.\nPledge and concession (tier #Y 3#!): fleet basing rights as well, for #Y 240#! months. Venice: tariff income #R −6%#!, trade advantage #R −5%#!, monthly food #R −5%#!; Genoa: tariff income #R −8%#!, trade advantage #R −5%#!.\n\nHighest tiers: Venice and Genoa pledge and concession, only exemption and residence after the Expulsion of the Foreigners or once their quarter in the City is gone; Pisa and Ragusa exemption and residence, Ragusa only a trade treaty while it is a Venetian subject.\nAt the start: Venice and Genoa exemption and residence, Pisa and Ragusa a trade treaty.\nThe Venetian treaty falls due every #Y 60#! months: renew it, haggle, or let it lapse. The old claims Venice keeps (in thousands of ducats) are paid off in instalments at each renewal.\nRevoking a privilege invites reprisals. While the Galata dispute is under way, Genoa's privileges stay as they are.\nVenice, Genoa and Ragusa sell us galleys once they hold exemption and residence or more: the ships are handed over at Constantinople and are the empire's to keep. When Venice and Genoa go to war, both will want the empire's answer.\nThe Black Sea grain road: much of Constantinople's grain comes from the Black Sea. The road is open, tight or cut, counted once a month. Tight: burghers' target satisfaction #R −5%#!, monthly food #R −5%#!; cut: burghers' target satisfaction #R −10%#!, monthly food #R −15%#!. Caffa besieged or at war, the embargo that followed the Latins' expulsion from Tana (unless our own ships kept sailing north), Genoa at war with us, open fighting in the Galata dispute, our siding with Venice in the republics' war, and a war with the Ottomans while they hold the shores of the straits each tighten it one step; a blockade of the City tightens it #Y 2#!. Chartered grain ships, a harbour of our own on the western shore (Anhialo, Burgas or Varna, with #Y 6#! warships or the decision to carry our own grain), Genoa holding a pledge and at peace with us, and #Y 2#! or more trading posts of the empire in the Black Sea grain ports each ease it one step.\nOnce Pisa is gone and its city belongs to Florence, Florence takes Pisa's place and tier, and will ask for the Pisans' old house. Once Ragusa is no longer a Venetian subject, it will ask for a chrysobull if the Venetian treaty is not what it was or the Venetians are cool towards us.\nThe group 'Treaties and Privileges' in the Imperial Pillars' fiscal edicts borrows, buys ships, charters grain ships, grants and revokes."
 oe_itp.1.t: "The Venetian Treaty Expires"
 oe_itp.1.d1: "#F In 1268 Michael VIII made a treaty with Venice for five years: Venetian merchants again traded free of duty in the empire, and could buy grain for export while its price stayed low. The two states renewed their treaties again and again; the treaty of 1390 restated the old debts and spread the damages over five years.#!\n\nAfter the last treaty was let lapse, the Doge's envoys are at the palace gate again, ready to talk. The Venetians keep their [Concept('oe_tu_privilege','privileges')|e] in the City, but without a treaty no Venetian money comes our way.[GetCountry('BYZ').Custom('OeItpClaimsLine')][GetCountry('BYZ').Custom('OeItpJewelsLine')]"
 oe_itp.1.d2: "#F In 1268 Michael VIII made a treaty with Venice for five years: Venetian merchants again traded free of duty in the empire, and could buy grain for export while its price stayed low. The two states renewed their treaties again and again; the treaty of 1390 restated the old debts and spread the damages over five years.#!\n\nThe treaty with Venice has run out. The Doge's envoys wait at the palace gate: renew on the old terms and pay the next instalment of the old claims, or bargain afresh. The Venetians' [Concept('oe_tu_privilege','privileges')|e] in the City are on the table too.[GetCountry('BYZ').Custom('OeItpClaimsLine')][GetCountry('BYZ').Custom('OeItpJewelsLine')]"
 oe_itp.1.a: "Renew on the old terms"
 oe_itp.1.a.tt: "Pay #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_due')|0]#! gold, this instalment of the old claims\nVenetian claims #G −[GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_due_kd')|0]#! thousand ducats\nThe treaty runs for #Y 60#! more months; no longer without a treaty, if we were\nVenice: opinion of us #G +10#! (#Y 5#! years)"
 oe_itp.1.b: "Haggle"
 oe_itp.1.b.tt: "Chance of success: #G [GetCountry('BYZ').MakeScope.GetVariable('oe_itp_hgch').GetValue|0]%#! (higher if Venice is at war with Genoa or the Ottomans, or if our navy is at least half the size of the Venetian one; lower with large claims)\nSuccess: Venice's [Concept('oe_tu_privilege','privileges')|e] drop one tier (from exemption to a trade treaty we levy duties on the Venetians: tariff income #G +6%#!); the treaty runs #Y 60#! more months\nFailure: the treaty runs only #Y 24#! more months; claims #R +5#! thousand ducats\nEither way: Venice: opinion of us #R −15#! (#Y 5#! years)"
 oe_itp.1.c: "Let it lapse"
 oe_itp.1.c.tt: "We gain [ShowModifier('oe_itp_no_pact_ven')] (trade advantage #R −5%#!) until a treaty is made again\nNo loans from Venice\nThe Venetians come back in #Y 24#! months\nVenice: opinion of us #R −25#! (#Y 10#! years)\n#R 15%#! chance of a reprisal in #Y 3#! to #Y 9#! months"
 oe_itp.1.d: "Pledge to clear the old claims"
 oe_itp.1.d.tt: "Venice's [Concept('oe_tu_privilege','privileges')|e] rise to a pledge and concession for #Y 240#! months: [ShowModifier('oe_itp_pledge_ven')] (tariff income #R −6%#!, trade advantage #R −5%#!, monthly food #R −5%#!), and fleet basing rights for Venice\nThe Venetian claims are cleared\nVenice pays us #G [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m4')|0]#! gold besides\nThe treaty runs #Y 60#! more months\nVenice: opinion of us #G +30#!; Genoa #R −10#!"
 oe_itp.2.t: "An Italian Loan"
 oe_itp.2.desc: "#F In 1343 the Empress Anna pawned the crown jewels to Venice for 30,000 ducats; in 1352 Venice lent John V another 5,000.#!\n\nOur treasury is nearly empty, while the merchants of [SCOPE.sCountry('oe_itp_r').GetName] have money to spare. Their envoys offer a loan: at the usual interest, or interest-free in exchange for one more tier of [Concept('oe_tu_privilege','privileges')|e]."
 oe_itp.2.a: "Trade a privilege for the loan"
 oe_itp.2.a.tt: "[SCOPE.sCountry('oe_itp_r').GetName] lends us #G [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m10')|0]#! gold, interest-free, repaid over #Y 120#! months\n[SCOPE.sCountry('oe_itp_r').GetName]'s [Concept('oe_tu_privilege','privileges')|e] rise to a pledge and concession for #Y 240#! months: we gain the pledge modifier (Venice: tariff income #R −6%#!, trade advantage #R −5%#!, monthly food #R −5%#!; Genoa: tariff income #R −8%#!, trade advantage #R −5%#!), and they get fleet basing rights\n[SCOPE.sCountry('oe_itp_r').GetName]: opinion of us #G +30#!; their rival #R −10#!"
 oe_itp.2.b: "Trade a privilege for the loan"
 oe_itp.2.b.tt: "[SCOPE.sCountry('oe_itp_r').GetName] lends us #G [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m6')|0]#! gold, interest-free, repaid over #Y 60#! months\n[SCOPE.sCountry('oe_itp_r').GetName]'s [Concept('oe_tu_privilege','privileges')|e] return to exemption and residence: our duties on them end, if any"
 oe_itp.2.c: "Borrow on the usual terms"
 oe_itp.2.c.tt: "[SCOPE.sCountry('oe_itp_r').GetName] lends us #G [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m6')|0]#! gold at #R 6%#! a year (#R 7%#! after the ban on foreign banks), repaid over #Y 60#! months"
 oe_itp.2.d: "Decline"
 oe_itp.2.d.tt: "Nothing happens"
 oe_itp.3.t: "The Italians' Fleet"
 oe_itp.3.desc: "#F Alexios I bought a Venetian fleet against the Normans with a chrysobull; by the Treaty of Nymphaeum in 1261 Genoa promised up to fifty ships in return for lower dues and a quarter at Pera.#!\n\nWe are hard pressed at sea and short of galleys of our own. The envoys of [SCOPE.sCountry('oe_itp_r').GetName] say a fleet lies ready in their arsenal: ours for one more tier of [Concept('oe_tu_privilege','privileges')|e], or for money. Once handed over, the ships are the empire's and need not be returned. Some at court would rather we built our own."
 oe_itp.3.a: "Trade a privilege for the fleet"
 oe_itp.3.a.tt: "[SCOPE.sCountry('oe_itp_r').GetName] hands over #Y 8#! galleys at Constantinople; they are ours to keep\n[SCOPE.sCountry('oe_itp_r').GetName]'s [Concept('oe_tu_privilege','privileges')|e] rise to a pledge and concession for #Y 240#! months: we gain the pledge modifier (Venice: tariff income #R −6%#!, trade advantage #R −5%#!, monthly food #R −5%#!; Genoa: tariff income #R −8%#!, trade advantage #R −5%#!), and they get fleet basing rights\n[SCOPE.sCountry('oe_itp_r').GetName]: opinion of us #G +30#!; their rival #R −10#!"
 oe_itp.3.b: "Buy the ships"
 oe_itp.3.b.tt: "Pay #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m5')|0]#! gold\n[SCOPE.sCountry('oe_itp_r').GetName] hands over #Y 6#! galleys at Constantinople; they are ours to keep\nTheir rival (Venice and Genoa are rivals): opinion of us #R −5#! (#Y 5#! years)"
 oe_itp.3.c: "Build our own"
 oe_itp.3.c.tt: "We gain [ShowModifier('oe_itp_own_fleet')] (galley build cost #G −20%#!) for #Y 10#! years\nPrestige #G +5#!"
 oe_itp.4.t: "Reprisals"
 oe_itp.4.d1: "#F In 1348 John VI lowered the dues of the City to draw trade from Galata, and the Genoese crossed the Golden Horn to burn ships and attack the walls; in 1451 Constantine XI raised the duties on Venetian goods, and Venice made its own treaty with Mehmed II.#!\n\n[SCOPE.sCountry('oe_itp_r').GetName] has not forgotten. Their galleys caught one of our ships at sea and burnt it. [GetCountry('BYZ').Custom('OeItpWhyLine')]"
 oe_itp.4.d2: "#F In 1348 John VI lowered the dues of the City to draw trade from Galata, and the Genoese crossed the Golden Horn to burn ships and attack the walls; in 1451 Constantine XI raised the duties on Venetian goods, and Venice made its own treaty with Mehmed II.#!\n\n[SCOPE.sCountry('oe_itp_r').GetName] has not forgotten. They seized our merchants' goods and fined them about #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m1')|0]#! gold. [GetCountry('BYZ').Custom('OeItpWhyLine')]"
 oe_itp.4.a: "Pay them off"
 oe_itp.4.a.tt: "Pay #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m2')|0]#! gold\n[SCOPE.sCountry('oe_itp_r').GetName]'s grudge over the revoked privileges, the lapsed treaty or our help to their enemy is removed"
 oe_itp.4.b: "An eye for an eye"
 oe_itp.4.b.tt: "Seize their merchantmen: #G [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m1')|0]#! gold\n[SCOPE.sCountry('oe_itp_r').GetName]: opinion of us #R −20#! (#Y 10#! years)\n#R 20%#! chance of one more reprisal (once only)"
 oe_itp.4.c: "Restore their privileges"
 oe_itp.4.c.tt: "[SCOPE.sCountry('oe_itp_r').GetName]'s [Concept('oe_tu_privilege','privileges')|e] rise one tier\n[SCOPE.sCountry('oe_itp_r').GetName]'s grudge over the revoked privileges is removed"
 oe_itp.4.d: "Restore the treaty"
 oe_itp.4.d.tt: "The treaty with Venice is restored for #Y 60#! months; no longer without a treaty\nVenice's grudge over the lapsed treaty is removed"
 oe_itp.5.t: "After Galata"
 oe_itp.5.desc: "#F Around 1348 the empire collected only about thirteen per cent of the dues paid by ships passing the Bosporus; the rest went to Galata.#!\n\nGalata's privileges are abolished. Its customs come back to the empire, and the Genoese no longer trade free of duty in our other ports either. Genoa's [Concept('oe_tu_privilege','privileges')|e] fall to a trade treaty."
 oe_itp.5.a: "So noted"
 oe_itp.5.a.tt: "Genoa's privileges are now a trade treaty (the Galata settlement already counts in our customs; no further duties)"
 oe_itp.6.t: "The Two Republics at War"
 oe_itp.6.desc: "#F In 1350 Venice and Genoa went to war over the trade of the Black Sea. In 1351 John VI allied with Venice; after the battle of the Bosporus in February 1352 the empire had to make its own peace with Genoa, and its ports were closed to the Venetians.#!\n\nVenice and Genoa are at war. Their envoys come to the palace one after the other, and each wants the empire's answer: whose ships may use our harbours, and with whom our grain will sail. Both hold [Concept('oe_tu_privilege','privileges')|e] in the City, and neither is safe to offend.[GetCountry('BYZ').Custom('OeItpFamLine')]"
 oe_itp.6.a: "Side with Venice"
 oe_itp.6.a.tt: "Venice pays us a subsidy of #G [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m4')|0]#! gold\nVenetian claims #G −10#! thousand ducats\nVenice: opinion of us #G +25#! (#Y 10#! years)\nGenoa: opinion of us #R −30#! (#Y 10#! years)\n#R 30%#! chance of a reprisal from Genoa in #Y 3#! to #Y 9#! months\nUntil the two make peace the Genoese grain ships stay away: the Black Sea grain road is #R one step tighter#!"
 oe_itp.6.b: "Side with Genoa"
 oe_itp.6.b.tt: "The Genoese carry our grain until the two make peace (at most #Y 36#! months): we gain [ShowModifier('oe_itp_grain_convoy')] (monthly food #G +5%#!)\nVenetian claims #R +5#! thousand ducats\nGenoa: opinion of us #G +25#! (#Y 10#! years)\nVenice: opinion of us #R −30#! (#Y 10#! years)\n#R 30%#! chance of a reprisal from Venice in #Y 3#! to #Y 9#! months\nWhile the ships sail, the Black Sea grain road is #G one step easier#! (from next month's count); nothing more if we already have chartered grain ships"
 oe_itp.6.c: "Stay neutral"
 oe_itp.6.c.tt: "Both sides use our harbours: we gain [ShowModifier('oe_itp_neutral_port')] (tariff income #G +10%#!) until the two make peace (at most #Y 36#! months)\nVenice and Genoa, each: opinion of us #R −5#! (#Y 5#! years)"
 oe_itp.7.t: "The City Short of Grain"
 oe_itp.7.desc: "#F In 1343 Jani Beg drove the Latins out of Tana; Venice and Genoa answered with a joint embargo, Caffa was besieged twice, and for years little grain left the northern shore of the Black Sea. Much of the wheat Constantinople ate was carried from that sea by Genoese merchants.#!\n\n[GetCountry('BYZ').Custom('OeItpGrainWhy')] The granaries of the City are nearly empty, and the price of wheat rises by the day. The grain merchants still have stocks, at a price. Some at court would fix the price and search for hoards; others would trade one more tier of [Concept('oe_tu_privilege','privileges')|e] for a grain treaty."
 oe_itp.7.a: "Buy grain from the Genoese at their price"
 oe_itp.7.a.tt: "Pay #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m3')|0]#! gold\nWe gain [ShowModifier('oe_itp_grain_convoy')] (monthly food #G +5%#!) for #Y 12#! months: the Black Sea grain road is #G one step easier#! (from next month's count)\nWhile the City is under blockade: grain stores #G +10#! besides\nGenoa: opinion of us #G +10#! (#Y 5#! years)"
 oe_itp.7.b: "Fix the price and search for hoards"
 oe_itp.7.b.tt: "Burghers' satisfaction #R −10%#!\nFor #Y 12#! months the Black Sea grain road counts as tight at worst, not cut (from next month's count)"
 oe_itp.7.c: "A grain treaty for a privilege: Genoa"
 oe_itp.7.c.tt: "Genoa's [Concept('oe_tu_privilege','privileges')|e] rise to a pledge and concession for #Y 240#! months: [ShowModifier('oe_itp_pledge_gen')] (tariff income #R −8%#!, trade advantage #R −5%#!), and fleet basing rights for Genoa\nWhile Genoa holds the pledge and is at peace with us, the Black Sea grain road is #G one step easier#! (from next month's count)\nGenoa: opinion of us #G +30#!; Venice #R −10#!"
 oe_itp.7.d: "A grain treaty for a privilege: Venice"
 oe_itp.7.d.tt: "Venice's [Concept('oe_tu_privilege','privileges')|e] rise to a pledge and concession for #Y 240#! months: [ShowModifier('oe_itp_pledge_ven')] (tariff income #R −6%#!, trade advantage #R −5%#!, monthly food #R −5%#!), and fleet basing rights for Venice\nThe Venetians carry our grain\nWe gain [ShowModifier('oe_itp_grain_convoy')] (monthly food #G +5%#!) for #Y 60#! months: the Black Sea grain road is #G one step easier#! (from next month's count)\nWhile the City is under blockade: grain stores #G +10#! besides\nVenice: opinion of us #G +30#!; Genoa #R −10#!"
 oe_itp.7.e: "Hold out"
 oe_itp.7.e.tt: "Stability #R −2.5#!"
 oe_itp.8.t: "The Black Sea Grain Treaty"
 oe_itp.8.desc: "#F In 1348 John VI lowered the dues of the City and borrowed from private citizens to build warships, hoping the empire would depend less on Galata for its grain and its shipping.#!\n\nThe Black Sea grain road has been tight for some time. The grain merchants of [SCOPE.sCountry('oe_itp_r').GetName] come with an offer: for a sum paid now, their ships will carry Black Sea wheat into the Golden Horn on schedule for #Y 60#! months. Some at court answer that while we still hold a harbour on the western shore of that sea, our own ships should carry our grain."
 oe_itp.8.a: "Sign the treaty"
 oe_itp.8.a.tt: "Pay #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m2')|0]#! gold\nWe gain [ShowModifier('oe_itp_grain_convoy')] (monthly food #G +5%#!) for #Y 60#! months: the Black Sea grain road is #G one step easier#! (from next month's count)\nWhile the City is under blockade: grain stores #G +10#! besides"
 oe_itp.8.b: "Carry it ourselves"
 oe_itp.8.b.tt: "We gain [ShowModifier('oe_itp_own_fleet')] (galley build cost #G −20%#!) for #Y 10#! years\nFrom now on, while we hold Anhialo, Burgas or Varna, the Black Sea grain road is #G one step easier#! (from next month's count)"
 oe_itp.8.c: "No need"
 oe_itp.8.c.tt: "Nothing happens"
 oe_itp.9.t: "The Foreigners Expelled"
 oe_itp.9.desc: "The foreign quarters of the City are gone. With them [SCOPE.sCountry('oe_itp_r').GetName]'s pledge and concession in the empire lapse: the pledge and the fleet basing rights are taken back, and [SCOPE.sCountry('oe_itp_r').GetName]'s [Concept('oe_tu_privilege','privileges')|e] fall to exemption and residence. Their people say we have broken the pledge."
 oe_itp.9.a: "Let them complain"
 oe_itp.9.a.tt: "[SCOPE.sCountry('oe_itp_r').GetName]'s privileges are now exemption and residence\n[SCOPE.sCountry('oe_itp_r').GetName]: opinion of us #R −30#! (#Y 10#! years)"
 oe_itp.10.t: "Ragusa's Chrysobull"
 oe_itp.10.desc: "#F In 1451 Constantine XI granted Ragusa a chrysobull: the Ragusans might build a church and keep a consul in the City, the consul would judge their merchants' disputes, and their dues were somewhat lowered. One purpose of the grant was to vex the Venetians.#!\n\nRagusa no longer answers to Venice. Its envoys come to the palace with rich gifts and ask for a chrysobull: to live and trade free of duty in the City, to keep a consul there and to open a fondaco. [GetCountry('BYZ').Custom('OeItpVenCool')]"
 oe_itp.10.a: "Grant the chrysobull"
 oe_itp.10.a.tt: "Ragusa's [Concept('oe_tu_privilege','privileges')|e] rise to exemption and residence: we gain [ShowModifier('oe_itp_exempt_rag')] (tariff income #R −2%#!, trade advantage #G +2%#!); Ragusa is exempted from the strait toll and gets fondaco rights\nRagusa: opinion of us #G +10#! (#Y 50#! years)\nVenice: opinion of us #R −10#! (#Y 5#! years)"
 oe_itp.10.b: "Allow a consul only"
 oe_itp.10.b.tt: "Ragusa may keep a consul in the City to judge its merchants' disputes; its privileges stay as they are\nRagusa: opinion of us #G +10#! (#Y 5#! years)\nRagusa does not ask again for #Y 10#! years"
 oe_itp.10.c: "Ignore them"
 oe_itp.10.c.tt: "Nothing happens\nRagusa does not ask again for #Y 10#! years"
 oe_itp.11.t: "The Old House of the Pisans"
 oe_itp.11.desc: "#F Pisa had its treaty and its quay from Alexios I as early as 1111. At the end of the council in 1439 John VIII granted Florence two chrysobulls: the Florentines gained the right to trade in Constantinople, the old house of the Pisans passed to them, and their dues were lowered.#!\n\nPisa now belongs to Florence. The Florentine envoys come to the palace and ask to take over the Pisans' house in the City and their [Concept('oe_tu_privilege','privileges')|e], and to pay lower dues as the Pisans once did. For now they keep Pisa's old terms: [GetCountry('BYZ').Custom('OeItpTierPis')].[GetCountry('BYZ').Custom('OeItpCouncilLine')]"
 oe_itp.11.a: "Grant their request"
 oe_itp.11.a.tt: "Florence's [Concept('oe_tu_privilege','privileges')|e] rise to exemption and residence (or stay there): we gain [ShowModifier('oe_itp_exempt_flo')] (tariff income #R −2%#!, trade advantage #G +2%#!); Florence is exempted from the strait toll\nFlorence: opinion of us #G +10#! (on the rise, #Y 50#! years) and #G +10#! (#Y 5#! years)"
 oe_itp.11.b: "Only Pisa's old treaty"
 oe_itp.11.b.tt: "Florence's [Concept('oe_tu_privilege','privileges')|e] are a trade treaty on Pisa's old terms (from exemption and residence, the exemption and the toll exemption are taken back)\nFlorence: opinion of us #G +10#! (#Y 5#! years)"
 oe_itp.11.c: "Refuse"
 oe_itp.11.c.tt: "Florence has no treaty in the City (Pisa's [Concept('oe_tu_privilege','privileges')|e] lapse)\nFlorence: opinion of us #R −10#! (#Y 5#! years)"
 oe_itp.12.t: "The Venetian Claims"
 oe_itp.12.desc: "#F In 1390 John VII made a treaty with Venice, and the old debts were written into it once more, among them more than 17,000 hyperpyra in damages, to be paid over five years.#!\n\n[GetCountry('BYZ').Custom('OeItpClaimWhy')] The Doge's envoys present a list: warehouses of Venetian merchants wrecked on imperial soil, ships held, goods taken, every item reckoned in ducats. They want the sum added to the old claims and paid off at the renewals. The Venetians now count #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_itp_ven_claims').GetValue|0]#! thousand ducats of old claims (about #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_kd')|0]#! gold a thousand)."
 oe_itp.12.a: "Admit them"
 oe_itp.12.a.tt: "Venetian claims #R +10#! thousand ducats\nVenice: opinion of us #G +10#! (#Y 5#! years)"
 oe_itp.12.b: "Admit half"
 oe_itp.12.b.tt: "Venetian claims #R +5#! thousand ducats\nVenice: opinion of us #R −15#! (#Y 5#! years)"
 oe_itp.12.c: "Admit nothing"
 oe_itp.12.c.tt: "Venice: opinion of us #R −25#! (#Y 10#! years)\nThe treaty with Venice falls due #Y 24#! months sooner"
 oe_itp.13.t: "The Pledge Falls Due"
 oe_itp.13.desc: "#F In 1370 John V was held in Venice for debt and offered the island of Tenedos to settle it; the peace of 1352 had already pushed the bounds of Galata further out.#!\n\nThe pledge and concession we gave [SCOPE.sCountry('oe_itp_r').GetName] have fallen due. We can take them back, or pledge them for ten more years."
 oe_itp.13.a: "Take back the pledge"
 oe_itp.13.a.tt: "[SCOPE.sCountry('oe_itp_r').GetName]'s [Concept('oe_tu_privilege','privileges')|e] fall to exemption and residence: the pledge modifier goes, the fleet basing rights are taken back\n[SCOPE.sCountry('oe_itp_r').GetName]: opinion of us #R −10#! (#Y 5#! years)"
 oe_itp.13.b: "Pledge for ten more years"
 oe_itp.13.b.tt: "The pledge and concession run #Y 120#! more months\n[SCOPE.sCountry('oe_itp_r').GetName] pays us #G [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m5')|0]#! gold"
 oe_itp.13.c: "Renew to pay down the old claims"
 oe_itp.13.c.tt: "The pledge and concession run #Y 120#! more months\nVenetian claims #G −10#! thousand ducats"
 oe_itp.14.t: "The Haggling Is Over"
 oe_itp.14.d1: "The Venetians have given way. Their envoys signed the new treaty: Venice's [Concept('oe_tu_privilege','privileges')|e] in the empire fall one tier, and the treaty runs for #Y 60#! more months. The Venetians will remember the haggling."
 oe_itp.14.d2: "The Venetians would not move. Their envoys agreed only to extend the old treaty by #Y 24#! months, and added the cost of the talks to the old claims: #R +5#! thousand ducats. Venice's [Concept('oe_tu_privilege','privileges')|e] in the empire stay as they were. The Venetians will remember the haggling."
 oe_itp.14.a: "Understood"
 oe_itp.14.a.tt: "The result has taken effect as told above; the tier, the treaty months and the claims show in the descriptions of the actions under 'Treaties and Privileges'"
