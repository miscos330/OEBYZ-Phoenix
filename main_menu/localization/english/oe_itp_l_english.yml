 OE_ITP_CLAIMS_LINE: "\n\nThe Venetians still count #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_itp_ven_claims').GetValue|0]#! thousand ducats of old claims (about #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_kd')|0]#! gold a thousand). A renewal means paying this instalment: #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_due')|0]#! gold."
