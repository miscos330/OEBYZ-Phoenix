 oe_itp_borrow: "Borrow from the Italians"
 oe_itp_borrow_desc: "Borrow from an Italian republic that has a treaty with the empire, repaid over #Y 60#! months; it counts as foreign debt. The sum and the interest follow their [Concept('oe_tu_privilege','privileges')|e]: trade treaty, #Y 4#! months of income at #Y 8%#!; exemption and residence, #Y 8#! months of income at #Y 6%#!; pledge and concession, #Y 12#! months of income at #Y 4%#!. After the ban on foreign banks each rate is #Y 1%#! higher.\nRequires: their opinion of us at least #Y 0#!, no war, no unpaid loan; one loan from the same republic every #Y 24#! months; none from Venice while its treaty has lapsed; our foreign debt below #Y 18#! months of income.\nNow: a month of income is about #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m1')|0]#! gold; foreign debt #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_fdebt')|0]#! gold, the limit #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m18')|0]#! gold.\nVenice: [GetCountry('BYZ').Custom('OeItpTierVen')]; can lend #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_borrow_amt_ven')|0]#! gold at #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_borrow_pct_ven')|0]%#!; #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_loan_left_ven')|0]#! gold unpaid\nGenoa: [GetCountry('BYZ').Custom('OeItpTierGen')]; can lend #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_borrow_amt_gen')|0]#! gold at #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_borrow_pct_gen')|0]%#!; #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_loan_left_gen')|0]#! gold unpaid\n[GetCountry('BYZ').Custom('OeItpSlot4')]: [GetCountry('BYZ').Custom('OeItpTierPis')]; can lend #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_borrow_amt_pis')|0]#! gold at #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_borrow_pct_pis')|0]%#!; #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_loan_left_pis')|0]#! gold unpaid\nRagusa: [GetCountry('BYZ').Custom('OeItpTierRag')]; can lend #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_borrow_amt_rag')|0]#! gold at #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_borrow_pct_rag')|0]%#!; #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_loan_left_rag')|0]#! gold unpaid\nThe Venetian treaty: [GetCountry('BYZ').Custom('OeItpVenPact')]"
 oe_itp_borrow_card: "Borrow from an Italian republic; the sum and the interest follow its privileges."
 oe_itp_borrow_tt: "The chosen republic lends us money (sum and interest as described), repaid over #Y 60#! months."
 oe_itp_borrow_select: "Choose the lender"
 oe_itp_borrow_none: "@trigger_no!No Italian republic can lend to us."
 oe_itp_grant: "Grant a Privilege"
 oe_itp_grant_desc: "Raise an Italian republic's [Concept('oe_tu_privilege','privileges')|e] by one tier.\nTo exemption and residence: Pisa or Ragusa pays us #G [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m2')|0]#! gold (#Y 2#! months of income); they are exempted from the strait toll (Ragusa also gets fondaco rights) and we gain [ShowModifier('oe_itp_exempt_pis')] (tariff income #R −2%#!, trade advantage #G +2%#!) or [ShowModifier('oe_itp_exempt_rag')] (tariff income #R −2%#!, trade advantage #G +2%#!); their opinion #G +10#!. Venice or Genoa coming back from a trade treaty pays #G [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m3')|0]#! gold (#Y 3#! months of income), and our duties on them end.\nTo pledge and concession (Venice and Genoa only): they lend us #G [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m10')|0]#! gold, interest-free, repaid over #Y 120#! months; they get fleet basing rights for #Y 240#! months and we gain [ShowModifier('oe_itp_pledge_ven')] (tariff income #R −6%#!, trade advantage #R −5%#!, monthly food #R −5%#!) or [ShowModifier('oe_itp_pledge_gen')] (tariff income #R −8%#!, trade advantage #R −5%#!); their opinion #G +30#!, their rival's (Venice and Genoa) #R −10#!; prestige #R −5#!.\nHighest tiers: Venice and Genoa pledge and concession, only exemption and residence after the Expulsion of the Foreigners or once their quarter in the City is gone; Pisa and Ragusa exemption and residence, Ragusa only a trade treaty while it is a Venetian subject.\nPrivileges of the same republic can be granted or revoked once every #Y 60#! months. While the Galata dispute is under way, Genoa's stay as they are.\nVenice: [GetCountry('BYZ').Custom('OeItpTierVen')]\nGenoa: [GetCountry('BYZ').Custom('OeItpTierGen')]\n[GetCountry('BYZ').Custom('OeItpSlot4')]: [GetCountry('BYZ').Custom('OeItpTierPis')]\nRagusa: [GetCountry('BYZ').Custom('OeItpTierRag')]\nThe Venetian treaty: [GetCountry('BYZ').Custom('OeItpVenPact')]"
 oe_itp_grant_card: "Raise an Italian republic's privileges for money or an interest-free loan."
 oe_itp_grant_tt: "The chosen republic's privileges rise one tier (gains and costs as described)."
 oe_itp_grant_select: "Choose the republic"
 oe_itp_grant_none: "@trigger_no!No Italian republic can be granted more privileges."
 oe_itp_revoke: "Revoke a Privilege"
 oe_itp_revoke_desc: "Lower an Italian republic's [Concept('oe_tu_privilege','privileges')|e] by one tier.\nFrom pledge and concession: redeem the pledge for #R 8#! months of income (#R 4#! with #Y 60#! months or less to run) and fall to exemption and residence; their opinion of us #R −10#! (#Y 5#! years).\nFrom exemption and residence or a trade treaty: costs #R 10#! [oe_tu_authority|e], one tier down; their opinion of us #R −40#! (#Y 20#! years). When Venice or Genoa falls from exemption to a trade treaty we levy duties on them (tariff income #G +6%#! or #G +5%#!, burghers' target satisfaction #G +3%#!); the strait toll exemption they have held since the start stays. When Pisa or Ragusa falls to a trade treaty, their exemption, toll exemption and fondaco rights go. A reprisal may follow in #Y 3#! to #Y 9#! months: Venice and Genoa #R 30%#! (#R 45%#! when their navy is larger than ours), Pisa and Ragusa #R 10%#!.\nPrivileges of the same republic can be granted or revoked once every #Y 60#! months. While the Galata dispute is under way, Genoa's stay as they are.\nVenice: [GetCountry('BYZ').Custom('OeItpTierVen')]\nGenoa: [GetCountry('BYZ').Custom('OeItpTierGen')]\n[GetCountry('BYZ').Custom('OeItpSlot4')]: [GetCountry('BYZ').Custom('OeItpTierPis')]\nRagusa: [GetCountry('BYZ').Custom('OeItpTierRag')]\nThe Venetian treaty: [GetCountry('BYZ').Custom('OeItpVenPact')]\nRedeeming Venice's pledge costs #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_redeem_ven')|0]#! gold now; redeeming Genoa's pledge costs #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_redeem_gen')|0]#! gold now."
 oe_itp_revoke_card: "Take back a tier of an Italian republic's privileges; expect reprisals."
 oe_itp_revoke_tt: "The chosen republic's privileges fall one tier (costs as described)."
 oe_itp_revoke_select: "Choose the republic"
 oe_itp_revoke_none: "@trigger_no!No Italian republic's privileges can be revoked."
 oe_itp_hire_fleet: "Buy Ships from the Italians"
 oe_itp_hire_fleet_desc: "Buy a fleet of galleys from an Italian republic for a single payment. The ships are handed over at Constantinople and are the empire's to keep; their upkeep is ours from then on.\nVenice or Genoa sells #Y 4#! galleys for #R 4#! months of income while its [Concept('oe_tu_privilege','privileges')|e] are exemption and residence, #Y 6#! for #R 3#! months of income at pledge and concession. Ragusa sells #Y 2#! for #R 2#! months of income at exemption and residence. Pisa sells none. When we buy from Venice or Genoa, the other resents it: their opinion of us #R −5#! (#Y 5#! years).\nRequires: no war with them; one purchase from the same republic every #Y 36#! months; none from Venice while its treaty has lapsed; none from Genoa while the Galata dispute is under way; gold for the price.\nVenice: [GetCountry('BYZ').Custom('OeItpTierVen')]; #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_fleet_n_ven')|0]#! galleys for #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_fleet_price_ven')|0]#! gold\nGenoa: [GetCountry('BYZ').Custom('OeItpTierGen')]; #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_fleet_n_gen')|0]#! galleys for #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_fleet_price_gen')|0]#! gold\nRagusa: [GetCountry('BYZ').Custom('OeItpTierRag')]; #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_fleet_n_rag')|0]#! galleys for #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_fleet_price_rag')|0]#! gold"
 oe_itp_hire_fleet_card: "Buy a fleet of galleys from an Italian republic; one payment, ours to keep."
 oe_itp_hire_fleet_tt: "The chosen republic hands over a fleet of galleys at Constantinople (number and price as described); we pay at once."
 oe_itp_hire_fleet_select: "Choose the seller"
 oe_itp_hire_fleet_none: "@trigger_no!No Italian republic can sell us ships."
 oe_itp_grain_ships: "Charter Grain Ships"
 oe_itp_grain_ships_desc: "Charter a grain fleet from Venice or Genoa to carry Black Sea wheat to the City: costs #R 2#! months of income, and we gain [ShowModifier('oe_itp_grain_convoy')] (monthly food #G +5%#!) for #Y 12#! months; while the ships sail, the Black Sea grain road is #G one step easier#! (from next month's count). While the City is under blockade the ships also add #G +10#! to its grain stores.\nRequires: the Black Sea grain road tight or cut; no chartered ships yet; the carrier's [Concept('oe_tu_privilege','privileges')|e] at least exemption and residence, and no war with us; not Venice while its treaty has lapsed; not Genoa while there is open fighting in the Galata dispute.\nThe Black Sea grain road now: [GetCountry('BYZ').Custom('OeItpGrain')]. A charter costs #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m2')|0]#! gold now."
