l_english:
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_venetian_muda: "Venetian Muda State Convoys"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_venetian_muda: "Scheduled state galley convoys sail from the Lagoon to Alexandria, Tana, and Flanders under Senate auction, pairing commerce with warship speed."
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_san_giorgio_bank: "Casa di San Giorgio Clearinghouse"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_san_giorgio_bank: "Public debt bonds, bills of exchange, and fortified Black Sea factories turn Genoa into a financial colossus across Mediterranean banking."
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_condottieri_banners: "Lombard Condottieri Contracts"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_condottieri_banners: "Retaining armored condottieri companies and Milanese plate armories fields peerless shock troops across Italy's fractured signorie."
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_naples_crown_fleet: "Castel Nuovo Mediterranean Chancery"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_naples_crown_fleet: "Patronizing humanist scholars, Angevin-Aragonese jurists, and Tyrrhenian war galleys projects Neapolitan influence across southern seas."
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_krakow_statutes: "Statutes of Casimir & Wawel Learning"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_krakow_statutes: "Uniform royal statutes, brick border castles, and Krakow's newly chartered university transform Poland from timber into stone."
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_krewo_union_pact: "Concord of the Union of Krewo"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_krewo_union_pact: "Binding the Polish Crown and the Grand Duchy of Lithuania in shared dynastic destiny creates Eastern Europe's mightiest defensive coalition."
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_winged_hussars: "Commonwealth Heavy Lancer Banners"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_winged_hussars: "Drilling aristocratic cavalry banners with lengthened lances and armored horses turns open plains into decisive shock victories."
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_sarai_silk_mint: "Sarai al-Jadid Silk-Steppe Mint"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_sarai_silk_mint: "Silver dang coinage, yam relay stations, and Volga customs houses channel Eurasian caravans cleanly through the Jochid Ulus."
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_steppe_kurultai_host: "Reunited Steppe Kurultai Banners"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_steppe_kurultai_host: "Reconciling rival begs under a renewed yarlyk charter restores the legendary operational reach of Pontic and Volga horsemen."
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_crimean_volga_gates: "Black Sea & Volga Caravan Gates"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_crimean_volga_gates: "Controlling Crimean ports and Volga river bend fortresses pairs nimble steppe raiders with lucrative Italian and Russian trade."
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_delhi_karkhana_canals: "Yamuna Canals & Royal Karkhanas"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_delhi_karkhana_canals: "State-built irrigation canals feeding the Doab plains and imperial craft workshops sustain Delhi's vast urban garrisons."
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_delhi_iqta_discipline: "Reformed Iqta Military Assignments"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_delhi_iqta_discipline: "Auditing horse musters and provincial tax assignments keeps Delhi's armored cavalry formidable while curbing rebellious amirs."
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_vijayanagara_hampi: "City of Victory Diamond & Pepper Markets"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_vijayanagara_hampi: "Granite aqueducts, temple guilds, and bustling diamond bazaars along the Tungabhadra draw Arab warhorses and Malabar spices to Hampi."
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_nayankara_captains: "Nayankara Fortress Captains"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_nayankara_captains: "Empowering regional Nayak commanders with hill fortresses and cavalry quotas anchors Vijayanagara's southern shield across the Deccan."
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_hwacha_firepower: "Hwacha Gunpowder Bureau & Anti-Pirate Fleet"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_hwacha_firepower: "Standardizing saltpeter refinement, rocket-arrow carts, and cannon-armed patrol vessels turns Korea's coasts into a wall of fire."
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_joseon_hall_worthies: "Jiphyeonjeon Scholarship & Hangul Script"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_joseon_hall_worthies: "Royal scholars in Hanyang craft a phonetic alphabet, rain gauges, and astronomical clocks that dramatically broaden literacy and statecraft."
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_joseon_dynastic_order: "Joseon Six-Ministry Dynastic Charter"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_joseon_dynastic_order: "Reorganizing royal land registers and meritocratic Neo-Confucian examinations anchors the new dynasty's authority from Kaesong to Hanyang."
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_fez_madrasas: "Marinid Madrasas of Fez"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_fez_madrasas: "Carved cedar ceilings, zellige courtyards, and endowed scholarly chairs at al-Qarawiyyin and Bou Inania make Fez a jewel of Maghrebi learning."
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_maghreb_gold_caravans: "Sijilmasa Gold & Strait Guard"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_maghreb_gold_caravans: "Protected desert camel trains from the Niger bend and fortified Strait anchorages bring West African gold straight to Maghrebi mints."
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_hafsid_tunis_souks: "Hafsid Tunis Souks & Corsair Escorts"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_hafsid_tunis_souks: "Thriving silk souks, Italian fondaco treaties, and swift Ifriqiyan galleys make Tunis a prosperous hinge between Sicily and the Sahara."
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_chinampa_harvest: "Chinampa Floating Gardens of Lake Texcoco"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_chinampa_harvest: "Interwoven willow-bound lake beds yield multiple maize and squash harvests per year, sustaining one of the world's greatest lake metropolises."
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_triple_alliance: "Excan Tlahtoloyan Triple Alliance"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_triple_alliance: "Binding Tenochtitlan, Texcoco, and Tlacopan in coordinated tribute rolls and eagle-jaguar warrior orders expands Mesoamerican empire."
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_qorikancha_sun: "Pachacuti's Cusco & Qorikancha Radiance"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_qorikancha_sun: "Interlocking ashlar stonework and gold-sheathed temple walls proclaim Tawantinsuyu's cosmic order across the Four Quarters of the Andes."
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_qhapaq_nan_quipu: "Qhapaq Ñan Roads & Quipu Storehouses"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_qhapaq_nan_quipu: "Chasqui relay runners, suspension bridges, knotted quipu ledgers, and terraced qullqa granaries knit towering mountain valleys into one state."
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_dec_italian_league: "Italian Maritime & Signoria Accord"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_dec_italian_league: "Standardized maritime insurance, guild courts, and balanced condotta treaties elevate Italian cities above rival powers."
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_dec_pl_commonwealth: "Jagellonian Royal Union Charter"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_dec_pl_commonwealth: "Joint royal diets, Baltic grain charters, and armored cavalry banners fortify the Polish-Lithuanian frontier from sea to sea."
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_dec_steppe_yarlyk: "Great Steppe Yarlyk Ordinance"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_dec_steppe_yarlyk: "Codifying caravan protection, mint purity, and clan mobilization rules steadies the successor khanates across Eurasia."
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_dec_delhi_prosperity: "Imperial Delhi Canal & Mint Ordinance"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_dec_delhi_prosperity: "Expanded Doab canals and audited provincial tax offices sustain Sultanate armies across Hindustan."
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_dec_vijayanagara_charter: "Karnata Nayankara & Pepper Charter"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_dec_vijayanagara_charter: "Harmonizing temple endowments, Nayak hill forts, and Arabian horse imports keeps Hampi supreme across southern India."
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_dec_joseon_reform: "Hanyang Hall of Worthies & Code"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_dec_joseon_reform: "Systematic statecraft treatises, movable metal type, and astronomical research propel Korea into a golden era of governance."
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_dec_maghreb_renaissance: "Maghrebi Madrasa & Caravan Charter"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_dec_maghreb_renaissance: "Uniting Fez and Tunis scholarly foundations with Saharan gold transit brings enduring wealth and prestige to North Africa."
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_dec_aztec_alliance: "Valley of Mexico Imperial Tribute Pact"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_dec_aztec_alliance: "Formalizing causeway granaries, obsidian armories, and pochteca merchant-scouts projects Tenochtitlan's hegemony across Mesoamerica."
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_dec_inca_network: "Tawantinsuyu Royal Road & Mit'a Charter"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_dec_inca_network: "Expanding stone highways, roadside tambos, and state redistribution granaries binds the Andes under Cusco's golden banner."
 oe_v58_1337_bld_venetian_arsenal_exp: "Venetian Arsenal Expansion"
 oe_v58_1337_bld_venetian_arsenal_exp_desc: "Expanded into the Arzanà Nuova with standardized timber frames, ropewalks, and assembly-line docks, the Venetian Arsenal outfits an entire war galley in a single day."
 oe_v58_1337_bld_hampi_royal_bazaar: "Vijayanagara Hampi Bazaar"
 oe_v58_1337_bld_hampi_royal_bazaar_desc: "Lined with carved granite pillared pavilions stretching before Virupaksha Temple, Hampi's royal bazaar trades Golconda diamonds, Malabar pepper, silk, and Ormuz warhorses."
 oe_v58_1337_bld_joseon_hall_worthies: "Joseon Hall of Worthies"
 oe_v58_1337_bld_joseon_hall_worthies_desc: "Housed within Gyeongbokgung Palace, the Jiphyeonjeon convenes Korea's brightest Neo-Confucian scholars, astronomers, and linguists to craft Hangul, calendars, and statecraft canons."
 oe_v58_1337_bld_krakow_wawel_academy: "Krakow Wawel Academy"
 oe_v58_1337_bld_krakow_wawel_academy_desc: "Chartered by Casimir the Great and endowed by Queen Jadwiga beside Wawel Hill, the Krakow Academy trains jurists, astronomers, and royal diplomats for Poland and Lithuania."
 oe_v58_1337_bld_tenochtitlan_chinampa: "Tenochtitlan Chinampa Network"
 oe_v58_1337_bld_tenochtitlan_chinampa_desc: "Engineered from reed mats, willow roots, and fertile lake silt separated by canoe canals, the chinampa gardens turn Lake Texcoco into an evergreen granary for the Mexica capital."
 oe_v58_1337_bld_cusco_qorikancha: "Cusco Qorikancha"
 oe_v58_1337_bld_cusco_qorikancha_desc: "Its precision-fitted dark stone walls clad in hammered gold sheets, the Qorikancha radiates sacred ceque lines outward from Cusco to unite every province of Tawantinsuyu."
 oe_v58_1337_ref_italian_condotta_signoria: "Italian Signoria & Condotta Maritime Guilds"
 oe_v58_1337_ref_italian_condotta_signoria_desc: "Blending banking houses, state convoy auctions, and audited condottieri contracts gives Italian courts unmatched commercial agility at the price of steep mercenary outlays."
 oe_v58_1337_ref_jagiellonian_sejm_union: "Jagiellonian Union & Szlachta Sejm"
 oe_v58_1337_ref_jagiellonian_sejm_union_desc: "Balancing multi-confessional tolerance, royal union charters, and armored noble banners forges a vast Eastern European realm whose king must constantly negotiate with the Sejm."
 oe_v58_1337_ref_ulugh_ulus_kurultai: "Ulugh Ulus Kurultai & Yam Relay"
 oe_v58_1337_ref_ulugh_ulus_kurultai_desc: "Uniting four great Karachi beg clans around imperial yarlyks and steppe postal relays sustains lethal horse-archer armies and Eurasian trade tolls."
 oe_v58_1337_ref_delhi_iqta_chancery: "Delhi Diwan-i-Arz & Iqta Chancery"
 oe_v58_1337_ref_delhi_iqta_chancery_desc: "Inspecting branded warhorses, provincial tax ledgers, and state craft workshops concentrates Hindustani wealth in Delhi while testing the patience of provincial amirs."
 oe_v58_1337_ref_vijayanagara_nayankara_court: "Karnata Nayankara & Temple Guild State"
 oe_v58_1337_ref_vijayanagara_nayankara_court_desc: "Delegating hill-fort districts to martial Nayaks while financing temple irrigation tanks creates a wealthy, resilient southern empire with strong regional lords."
 oe_v58_1337_ref_joseon_sarim_censorate: "Joseon Three-Office Censorate & Examinations"
 oe_v58_1337_ref_joseon_sarim_censorate_desc: "Empowering independent royal censors, state historians, and civil examinations produces disciplined administration and scholarship while scrutinizing every palace expense."
 oe_v58_1337_ref_maghreb_makhzen_guilds: "Maghrebi Makhzen & Madrasa Chancery"
 oe_v58_1337_ref_maghreb_makhzen_guilds_desc: "Linking urban artisan guilds, Saharan caravan protectors, and endowed colleges across Fez and Tunis balances Mediterranean diplomacy with tribal frontier alliances."
 oe_v58_1337_ref_meso_andean_tribute_state: "Altepetl Tribute & Tawantinsuyu Mit'a State"
 oe_v58_1337_ref_meso_andean_tribute_state_desc: "Organizing rotational public labor, chinampa and terraced granaries, and elite warrior lodges sustains towering highland and lake empires through strict communal duty."
 oe_v58_1337_dec_venetian_muda_convoys.title: "Charter the State Muda & Levant Convoy System"
 oe_v58_1337_dec_venetian_muda_convoys.desc: "Standardize seasonal state galley auctions linking Venice and Genoa with Alexandria, Constantinople, and Flanders under armed maritime escorts."
 oe_v58_1337_dec_venetian_muda_convoys.a: "Auction the seasonal armed galley convoys"
 oe_v58_1337_dec_venetian_muda_convoys_req_tt: "Available in 1337+ campaigns (current_year >= 1337)"
 oe_v58_1337_dec_venetian_muda_convoys_eff_tt: "Grants sea trade efficiency, galley combat strength, and naval tradition."
 oe_v58_1337_dec_italian_condotta_charter.title: "Ratify the Italian Signoria & Condotta Accord"
 oe_v58_1337_dec_italian_condotta_charter.desc: "Establish formal maritime insurance tribunals, Renaissance court academies, and disciplined condottieri contracts to project Italian statecraft across Europe."
 oe_v58_1337_dec_italian_condotta_charter.a: "Seal the Italian commercial and military charter"
 oe_v58_1337_dec_italian_condotta_charter_req_tt: "Available in 1337+ campaigns (current_year >= 1337)"
 oe_v58_1337_dec_italian_condotta_charter_eff_tt: "Boosts sea trade, diplomatic reputation, and military tradition."
 oe_v58_1337_dec_union_of_krewo_statute.title: "Proclaim the Jagiellonian Crown & Intermarium Statute"
 oe_v58_1337_dec_union_of_krewo_statute.desc: "Unite the royal statutes of Krakow with the grand-ducal chancellery of Vilnius, organizing armored noble lancers and Baltic grain trade from sea to sea."
 oe_v58_1337_dec_union_of_krewo_statute.a: "Ratify the Crown and Grand Duchy union charter"
 oe_v58_1337_dec_union_of_krewo_statute_req_tt: "Available in 1337+ campaigns (current_year >= 1337)"
 oe_v58_1337_dec_union_of_krewo_statute_eff_tt: "Strengthens heavy cavalry, subject loyalty, and eastern prestige."
 oe_v58_1337_dec_steppe_yarlyk_reform.title: "Issue the Golden Seal Yarlyk of the Steppe"
 oe_v58_1337_dec_steppe_yarlyk_reform.desc: "Renew imperial yarlyks governing the Volga and Crimean trade gates, silver dang coinage, and swift steppe cavalry musters across the Jochid successor realms."
 oe_v58_1337_dec_steppe_yarlyk_reform.a: "Stamp the Golden Seal Yarlyk for all begs"
 oe_v58_1337_dec_steppe_yarlyk_reform_req_tt: "Available in 1337+ campaigns (current_year >= 1337)"
 oe_v58_1337_dec_steppe_yarlyk_reform_eff_tt: "Boosts light cavalry power, overland silk trade, and army tradition."
 oe_v58_1337_dec_delhi_sultanate_canals.title: "Expand the Yamuna Canals & Imperial Karkhanas"
 oe_v58_1337_dec_delhi_sultanate_canals.desc: "Channel perennial Himalayan snowmelt across the fertile Doab plain while auditing provincial Iqta tax rolls and royal textile workshops in Delhi."
 oe_v58_1337_dec_delhi_sultanate_canals.a: "Commission the royal Doab canal network"
 oe_v58_1337_dec_delhi_sultanate_canals_req_tt: "Available in 1337+ campaigns (current_year >= 1337)"
 oe_v58_1337_dec_delhi_sultanate_canals_eff_tt: "Raises national production, tax efficiency, and domestic stability."
 oe_v58_1337_dec_vijayanagara_nayankara_charter.title: "Enact the Hampi Nayankara & Spice Trade Charter"
 oe_v58_1337_dec_vijayanagara_nayankara_charter.desc: "Formalize the military obligations of Vijayanagara's fortress captains while guaranteeing western coastal horse-and-pepper traders royal protection."
 oe_v58_1337_dec_vijayanagara_nayankara_charter.a: "Ratify the Karnata imperial fortress charter"
 oe_v58_1337_dec_vijayanagara_nayankara_charter_req_tt: "Available in 1337+ campaigns (current_year >= 1337)"
 oe_v58_1337_dec_vijayanagara_nayankara_charter_eff_tt: "Strengthens national defense, maritime trade, and military tradition."
 oe_v58_1337_dec_joseon_hall_of_worthies.title: "Charter the Hall of Worthies & Metal-Type Press"
 oe_v58_1337_dec_joseon_hall_of_worthies.desc: "Convene Korea's finest scholars to cast copper movable type, compile agricultural handbooks, and codify administrative law for a new dynastic age."
 oe_v58_1337_dec_joseon_hall_of_worthies.a: "Endow the royal scholars and metal-type foundry"
 oe_v58_1337_dec_joseon_hall_of_worthies_req_tt: "Available in 1337+ campaigns (current_year >= 1337)"
 oe_v58_1337_dec_joseon_hall_of_worthies_eff_tt: "Accelerates research speed, cabinet efficiency, and scholarship."
 oe_v58_1337_dec_maghreb_madrasa_caravans.title: "Endow the Maghrebi Madrasas & Saharan Caravans"
 oe_v58_1337_dec_maghreb_madrasa_caravans.desc: "From Fez's Bou Inania college to Tunis's Zaytuna mosques and Sijilmasa's oasis caravanserais, link Islamic scholarship with trans-Saharan gold wealth."
 oe_v58_1337_dec_maghreb_madrasa_caravans.a: "Fund colleges and desert caravan escorts"
 oe_v58_1337_dec_maghreb_madrasa_caravans_req_tt: "Available in 1337+ campaigns (current_year >= 1337)"
 oe_v58_1337_dec_maghreb_madrasa_caravans_eff_tt: "Boosts overland commerce, research speed, and royal prestige."
 oe_v58_1337_dec_aztec_triple_alliance_pact.title: "Proclaim the Valley of Mexico Triple Alliance"
 oe_v58_1337_dec_aztec_triple_alliance_pact.desc: "Unite the lakeside cities of the Valley of Mexico behind standardized chinampa granaries, obsidian warrior lodges, and tribute ledgers."
 oe_v58_1337_dec_aztec_triple_alliance_pact.a: "Seal the Excan Tlahtoloyan imperial compact"
 oe_v58_1337_dec_aztec_triple_alliance_pact_req_tt: "Available in 1337+ campaigns (current_year >= 1337)"
 oe_v58_1337_dec_aztec_triple_alliance_pact_eff_tt: "Increases food output, battlefield morale, and military tradition."
 oe_v58_1337_dec_inca_qhapaq_nan_network.title: "Commission the Qhapaq Ñan Royal Road & Qullqa Depots"
 oe_v58_1337_dec_inca_qhapaq_nan_network.desc: "Carve stone stairways, braided suspension bridges, chasqui relay stations, and highland storehouses to knit the Four Quarters of Tawantinsuyu together."
 oe_v58_1337_dec_inca_qhapaq_nan_network.a: "Mobilize the mit'a brigades to build the Royal Road"
 oe_v58_1337_dec_inca_qhapaq_nan_network_req_tt: "Available in 1337+ campaigns (current_year >= 1337)"
 oe_v58_1337_dec_inca_qhapaq_nan_network_eff_tt: "Accelerates army movement speed, provincial control, and stability."
 oe_v58_1337.1.title: "Assembly-Line Galleys of the Venetian Arsenal"
 oe_v58_1337.1.desc: "Inside the walled docks of the Arsenale, master shipwrights demonstrate a revolutionary method: pre-shaped oak ribs, standardized rigging, and floating assembly channels that outfit war galleys at breathtaking speed."
 oe_v58_1337.1.a: "Expand the Arsenale's Muda convoys and standardized slipways"
 oe_v58_1337.1.a.tt: "Elevates Venetian maritime commerce and galley supremacy."
 oe_v58_1337.1.b: "Sell surplus Arsenal hulls and cannons to Mediterranean allies"
 oe_v58_1337.1.b.tt: "Generates an immediate ducat windfall for the Serenissima."
 oe_v58_1337.1.c: "Grant Arsenalotti shipwrights special guild seats and calm labor"
 oe_v58_1337.1.c.tt: "Strengthens civic stability and skilled workforce loyalty."
 oe_v58_1337.2.title: "Casa di San Giorgio & the Black Sea Comptoirs"
 oe_v58_1337.2.desc: "From Caffa in Crimea and Pera across the Golden Horn to Chios and Seville, Genoese bankers propose consolidating state debts and colonial customs inside the formidable Casa di San Giorgio."
 oe_v58_1337.2.a: "Charter the Casa di San Giorgio as chief fiscal clearinghouse"
 oe_v58_1337.2.a.tt: "Expands merchant capacity and minting revenues across Europe."
 oe_v58_1337.2.b: "Reinforce the stone towers of Caffa and Aegean galley squadrons"
 oe_v58_1337.2.b.tt: "Builds naval strength and military renown across the Levant."
 oe_v58_1337.2.c: "Issue low-interest public bonds to calm rival patrician alberghi"
 oe_v58_1337.2.c.tt: "Heals aristocratic rivalries and strengthens stability."
 oe_v58_1337.3.title: "Visconti-Sforza Milan: Steel Plate & Condottieri Captains"
 oe_v58_1337.3.desc: "Milanese armorers hammer gleaming full-plate harnesses sought by kings from London to Buda, while famed condottieri captains offer their lances to whichever Lombard signore pays gold on time."
 oe_v58_1337.3.a: "Retain premier condottieri banners equipped in Milanese plate"
 oe_v58_1337.3.a.tt: "Unleashes devastating heavy-cavalry punch and battlefield morale."
 oe_v58_1337.3.b: "Export luxury Milanese armor and silk across Alpine passes"
 oe_v58_1337.3.b.tt: "Turns Lombard industry into rich treasury gold."
 oe_v58_1337.3.c: "Fund Lombard canals and the grand marble Duomo works"
 oe_v58_1337.3.c.tt: "Elevates prestige and internal civic harmony."
 oe_v58_1337.4.title: "Castel Nuovo & the Two Sicilies Mediterranean Crown"
 oe_v58_1337.4.desc: "Overlooking the Bay of Naples, royal courts inside Castel Nuovo gather jurists, humanist poets, and seasoned admirals—weighing naval dominion over Sicily and the Adriatic against princely patronage."
 oe_v58_1337.4.a: "Elevate Castel Nuovo's naval chancery and humanist court"
 oe_v58_1337.4.a.tt: "Boosts naval morale and European diplomatic reputation."
 oe_v58_1337.4.b: "Commission royal Neapolitan war-galleys in Gaeta and Salerno"
 oe_v58_1337.4.b.tt: "Rapidly builds maritime tradition and Mediterranean reach."
 oe_v58_1337.4.c: "Reform Apulian sheep-toll customs to stabilize royal finances"
 oe_v58_1337.4.c.tt: "Delivers steady silver and domestic calm."
 oe_v58_1337.5.title: "Casimir III's Krakow Statutes & the Stone Kingdom"
 oe_v58_1337.5.desc: "Reforming medieval provincial customs into written royal statutes while chartering Krakow University and Wieliczka salt revenues, Poland rises as a unified central-European power."
 oe_v58_1337.5.a: "Promulgate the Krakow Statutes and endow Wawel University"
 oe_v58_1337.5.a.tt: "Boosts cabinet administration and Polish scholarly progress."
 oe_v58_1337.5.b: "Channel Wieliczka rock-salt profits into brick border fortresses"
 oe_v58_1337.5.b.tt: "Strengthens treasury reserves and military readiness."
 oe_v58_1337.5.c: "Confirm town Magdeburg charters to spur Vistula urban growth"
 oe_v58_1337.5.c.tt: "Fosters stability and thriving urban estates."
 oe_v58_1337.6.title: "Union of Krewo: Binding Krakow and Vilnius"
 oe_v58_1337.6.desc: "Facing formidable armored knights along the Baltic and vast steppe realms to the east, statesmen of Poland and Lithuania propose an enduring dynastic union stretching from the Vistula to the Dnieper."
 oe_v58_1337.6.a: "Seal the Union of Krewo and harmonize royal chanceries"
 oe_v58_1337.6.a.tt: "Elevates subject loyalty and European diplomatic weight."
 oe_v58_1337.6.b: "Muster joint Polish-Lithuanian banners for a Baltic reckoning"
 oe_v58_1337.6.b.tt: "Forges elite battlefield readiness and martial tradition."
 oe_v58_1337.6.c: "Guarantee Ruthenian and Lithuanian noble liberties within the union"
 oe_v58_1337.6.c.tt: "Preserves religious harmony and internal stability."
 oe_v58_1337.7.title: "Winged Lancer Banners & the Royal Sejm"
 oe_v58_1337.7.desc: "Out on the wide Ruthenian steppes and Baltic plains, noble cavalry squadrons adopt lengthened hollow lances and curved sabers while deputies in the Sejm assert their famed Golden Liberty."
 oe_v58_1337.7.a: "Equip royal heavy lancer banners with finest armor and steeds"
 oe_v58_1337.7.a.tt: "Delivers unmatched heavy-cavalry shock and army morale."
 oe_v58_1337.7.b: "Charter Gdansk grain fleets to fund the Commonwealth army"
 oe_v58_1337.7.b.tt: "Fills royal coffers with Baltic export silver."
 oe_v58_1337.7.c: "Pass the Nihil Novi concord to unite king and noble estates"
 oe_v58_1337.7.c.tt: "Steadies domestic politics and royal legitimacy."
 oe_v58_1337.8.title: "Sarai al-Jadid: Silver Dangs & Pax Mongolica"
 oe_v58_1337.8.desc: "Travelers from Venice, Cairo, and Samarkand marvel at the tiled bathhouses, mosques, and bustling bazaars of New Sarai along the lower Volga—the thriving hub of the Jochid Ulus."
 oe_v58_1337.8.a: "Standardize Sarai silver coinage and Volga caravan customs"
 oe_v58_1337.8.a.tt: "Boosts overland silk commerce and minting income."
 oe_v58_1337.8.b: "Collect Russian tribute silver to drill elite tumen horsemen"
 oe_v58_1337.8.b.tt: "Enhances immediate war funds and steppe martial skill."
 oe_v58_1337.8.c: "Feast the four great Karachi beg houses at Sarai"
 oe_v58_1337.8.c.tt: "Secures tribal loyalty and khanate stability."
 oe_v58_1337.9.title: "Tokhtamysh, Edigu & the Great Steppe Reckoning"
 oe_v58_1337.9.desc: "Rival Chinggisid princes and ambitious begs clash from the Dnieper to the Ural steppes. A decisive khan must choose between summoning a grand Kurultai of horsemen or entrenching fortified river capitals."
 oe_v58_1337.9.a: "Summon a grand Kurultai to reunite the steppe tumens"
 oe_v58_1337.9.a.tt: "Supercharges light-cavalry combat power and campaign speed."
 oe_v58_1337.9.b: "Grant written yarlyks to secure urban artisans and merchants"
 oe_v58_1337.9.b.tt: "Steadies domestic order and keeps caravan gold flowing."
 oe_v58_1337.9.c: "Elevate trusted Sufi jurists and scholars at the khan's court"
 oe_v58_1337.9.c.tt: "Builds lasting legitimacy and diplomatic stature."
 oe_v58_1337.10.title: "Khanates of the Pontic Sea & Volga Bend"
 oe_v58_1337.10.desc: "As successor khanates carve distinct destinies from Bakhchisarai to Kazan and the Yaik steppes, shrewd khans combine lightning horse-archers with lucrative Black Sea and Volga trade gateways."
 oe_v58_1337.10.a: "Fortify the Black Sea and Volga trade gates with cavalry garrisons"
 oe_v58_1337.10.a.tt: "Boosts maritime trade links and national steppe manpower."
 oe_v58_1337.10.b: "Negotiate silver transit accords with Ottoman and Russian merchants"
 oe_v58_1337.10.b.tt: "Fills the khan's treasury quickly without risking war."
 oe_v58_1337.10.c: "Sponsor mosques, palaces, and gardens in the khanate capital"
 oe_v58_1337.10.c.tt: "Deepens dynastic legitimacy and domestic tranquility."
 oe_v58_1337.11.title: "Tughluq Ambitions: Token Coinage & Imperial Highways"
 oe_v58_1337.11.desc: "At the height of Delhi's territorial span from Punjab to Bengal, bold financial experiments with copper token currency and vast southern garrisons strain provincial amirs to the breaking point."
 oe_v58_1337.11.a: "Audit provincial Iqta horse-musters and restore silver discipline"
 oe_v58_1337.11.a.tt: "Strengthens Delhi's heavy cavalry and manpower levies."
 oe_v58_1337.11.b: "Recall the token copper at treasury expense to restore market trust"
 oe_v58_1337.11.b.tt: "Restores deep urban stability and sultanate prestige."
 oe_v58_1337.11.c: "Levy emergency tribute from Ganges river ports to fund the court"
 oe_v58_1337.11.c.tt: "Replenishes gold immediately at modest political cost."
 oe_v58_1337.12.title: "Firoz Shah's Yamuna Canals & Imperial Karkhanas"
 oe_v58_1337.12.desc: "Turning from relentless southern campaigns to great public works, engineers excavate perennial irrigation canals across the Doab while thirty-six royal karkhana workshops weave silk, forge steel, and bind manuscripts."
 oe_v58_1337.12.a: "Complete the Yamuna canal network and royal karkhana guildhalls"
 oe_v58_1337.12.a.tt: "Boosts national food surplus and craft production efficiency."
 oe_v58_1337.12.b: "Build new fortified garden cities and colleges across Hindustan"
 oe_v58_1337.12.b.tt: "Advances domestic scholarship and cultural renown."
 oe_v58_1337.12.c: "Lease water-rights to local zamindars for steady annual silver"
 oe_v58_1337.12.c.tt: "Generates quick gold with minimal administrative strain."
 oe_v58_1337.13.title: "Harihara & Bukka: Founding the City of Victory at Hampi"
 oe_v58_1337.13.desc: "Among the towering granite boulders of the Tungabhadra, brothers Harihara and Bukka raise concentric ramparts, pillared markets, and Virupaksha shrines—rallying southern India around the City of Victory."
 oe_v58_1337.13.a: "Expand Hampi's diamond bazaars and Ormuz horse-trade wharves"
 oe_v58_1337.13.a.tt: "Elevates maritime trade efficiency and urban prosperity."
 oe_v58_1337.13.b: "Sponsor Telugu, Kannada, and Sanskrit court poets and temple guilds"
 oe_v58_1337.13.b.tt: "Builds lasting royal legitimacy and southern cultural unity."
 oe_v58_1337.13.c: "Stockpile Arabian warhorses and bronze cannon for Deccan campaigns"
 oe_v58_1337.13.c.tt: "Sharpens Vijayanagara's immediate martial readiness."
 oe_v58_1337.14.title: "The Nayankara Captains & Malabar Pepper Emporia"
 oe_v58_1337.14.desc: "Warlike Nayak lords command granite hill-forts across the Deccan while Portuguese, Arab, and Chinese merchants bid fiercely for Malabar pepper and Coromandel calicoes along Vijayanagara's twin coasts."
 oe_v58_1337.14.a: "Organize Nayankara fortress districts into a coordinated southern shield"
 oe_v58_1337.14.a.tt: "Hardens national defense and expands military levies."
 oe_v58_1337.14.b: "Tax Malabar spice ports directly to finance the imperial palace"
 oe_v58_1337.14.b.tt: "Pours commercial silver into the Vijayanagara treasury."
 oe_v58_1337.14.c: "Endow grand granite irrigation tanks across Tamil and Telugu valleys"
 oe_v58_1337.14.c.tt: "Secures long-term rural prosperity and social calm."
 oe_v58_1337.15.title: "Choe Mu-seon's Gunpowder Bureau & Anti-Wokou Fleet"
 oe_v58_1337.15.desc: "Relentless Wokou pirate armadas burn coastal granaries from Jeju to the Han River. Inventor Choe Mu-seon petitions the court to fund a royal gunpowder bureau and arm patrol ships with cannons and rocket-arrows."
 oe_v58_1337.15.a: "Establish the Hwatong Dogam gunpowder foundry and cannon fleet"
 oe_v58_1337.15.a.tt: "Dramatically enhances Korean artillery and galley combat punch."
 oe_v58_1337.15.b: "Fortify southern coastal granaries and mountain refuge towns"
 oe_v58_1337.15.b.tt: "Protects stability and spares coastal villages from devastation."
 oe_v58_1337.15.c: "Offer merchant amnesty to lure maritime captains into royal service"
 oe_v58_1337.15.c.tt: "Saves gold while adding modest naval expertise."
 oe_v58_1337.16.title: "Wihwado Turnback: From Goryeo to the Joseon Dynasty"
 oe_v58_1337.16.desc: "Amid land-monopoly corruption and border crises along the Yalu, victorious General Yi Seong-gye and Neo-Confucian reformer Jeong Do-jeon stand at the gates of Kaesong—ready to inaugurate the Joseon dynasty and move the capital to Hanyang."
 oe_v58_1337.16.a: "Proclaim the Joseon Six-Ministry Charter and move the seat to Hanyang"
 oe_v58_1337.16.a.tt: "Elevates cabinet efficiency and dynastic legitimacy."
 oe_v58_1337.16.b: "Enforce sweeping Rank-Land redistribution to break corrupt magnates"
 oe_v58_1337.16.b.tt: "Replenishes fiscal revenues and strengthens royal control."
 oe_v58_1337.16.c: "Preserve old Kaesong aristocratic compromises for a gentle transition"
 oe_v58_1337.16.c.tt: "Maintains immediate calm and noble concord."
 oe_v58_1337.17.title: "King Sejong's Hall of Worthies & the Hunminjeongeum"
 oe_v58_1337.17.desc: "Inside Gyeongbokgung's Hall of Worthies, King Sejong and his scholars unveil a scientific phonetic script designed so every commoner can learn to read in days—alongside rain gauges, sundials, and star charts."
 oe_v58_1337.17.a: "Promulgate Hangul and endow the Hall of Worthies academies"
 oe_v58_1337.17.a.tt: "Dramatically lifts national literacy and research speed."
 oe_v58_1337.17.b: "Print agricultural manuals with copper type for every county"
 oe_v58_1337.17.b.tt: "Deepens rural stability and steady provincial growth."
 oe_v58_1337.17.c: "Focus court workshops on surveying northern Jurchen frontier passes"
 oe_v58_1337.17.c.tt: "Sharpens northern military readiness and defense."
 oe_v58_1337.18.title: "Al-Qarawiyyin & the Bou Inania Madrasas of Fez"
 oe_v58_1337.18.desc: "Under Marinid patronage, master carvers adorn Fez with cedar mashrabiyas, marble fountains, and brass water-clocks as scholars like Ibn Khaldun and Ibn Battuta pass through Morocco's vibrant courts."
 oe_v58_1337.18.a: "Endow Fez's royal madrasas and astronomical manuscript libraries"
 oe_v58_1337.18.a.tt: "Boosts research speed and Moroccan cultural prestige."
 oe_v58_1337.18.b: "Commission royal histories and diplomatic missions across Africa"
 oe_v58_1337.18.b.tt: "Elevates international prestige and peaceful standing."
 oe_v58_1337.18.c: "Tax Fez's leather tanneries and brass bazaars to bolster the fleet"
 oe_v58_1337.18.c.tt: "Fills the treasury and supports Strait warships."
 oe_v58_1337.19.title: "Sijilmasa Gold Caravans & Watch on the Strait"
 oe_v58_1337.19.desc: "Loaded with alluvial gold from Mali and salt blocks from the Sahara, vast camel caravans arrive at Sijilmasa just as Christian fleets contest Ceuta and the narrows of Gibraltar."
 oe_v58_1337.19.a: "Escort Saharan gold trains and fortify Strait naval anchorages"
 oe_v58_1337.19.a.tt: "Boosts overland commerce and Moroccan gold bullion output."
 oe_v58_1337.19.b: "Mint pure gold dinars straight from the arriving caravan bullion"
 oe_v58_1337.19.b.tt: "Delivers an immediate gold windfall for military needs."
 oe_v58_1337.19.c: "Form frontier alliances with Atlas mountain tribes against invasion"
 oe_v58_1337.19.c.tt: "Steadies internal harmony and defensive cohesion."
 oe_v58_1337.20.title: "Hafsid Tunis: Silk Souks, Zaytuna & Mediterranean Corsairs"
 oe_v58_1337.20.desc: "Positioned at the waist of the Mediterranean, Hafsid Tunis balances lucrative commercial treaties with Venice, Genoa, and Aragon alongside swift war-galleys safeguarding Ifriqiya's rich olive plains."
 oe_v58_1337.20.a: "Expand Tunis's guild souks and armored escort squadrons"
 oe_v58_1337.20.a.tt: "Boosts maritime trade efficiency and naval morale."
 oe_v58_1337.20.b: "Grant expanded fondaco charters to Italian and Catalan merchants"
 oe_v58_1337.20.b.tt: "Brings immediate silver revenue and diplomatic calm."
 oe_v58_1337.20.c: "Endow Al-Zaytuna Mosque scholars and Andalusi artisan refugees"
 oe_v58_1337.20.c.tt: "Enriches Tunisian stability, research, and urban craft."
 oe_v58_1337.21.title: "Chinampa Causeways & the Island Metropolis of Lake Texcoco"
 oe_v58_1337.21.desc: "Rising from marshy reeds on Lake Texcoco, Mexica engineers drive wooden stakes, build stone causeways with removable bridges, and lay out fertile chinampa gardens yielding abundant harvests of maize and amaranth."
 oe_v58_1337.21.a: "Expand the chinampa gardens and fresh-water stone aqueducts"
 oe_v58_1337.21.a.tt: "Delivers remarkable food surplus and rapid population growth."
 oe_v58_1337.21.b: "Fortify the lake causeways and canoe war-fleets of the basin"
 oe_v58_1337.21.b.tt: "Builds military readiness and lake defensive dominance."
 oe_v58_1337.21.c: "Open grand Tlatelolco canoe markets to tax basin commerce"
 oe_v58_1337.21.c.tt: "Generates instant gold from booming Valley of Mexico trade."
 oe_v58_1337.22.title: "Itzcoatl & Nezahualcoyotl: Forging the Triple Alliance"
 oe_v58_1337.22.desc: "Overthrowing old Tepanec overlordship, visionary statesmen Itzcoatl, Tlacaelel, and poet-engineer Nezahualcoyotl unite the valley's premier altepetl into the Excan Tlahtoloyan—commanding tribute from coast to coast."
 oe_v58_1337.22.a: "Ratify the Triple Alliance tribute rolls and Eagle-Jaguar lodges"
 oe_v58_1337.22.a.tt: "Elevates battlefield morale and vassal obedience across Mesoamerica."
 oe_v58_1337.22.b: "Patronize Nezahualcoyotl's legal codes, botanical gardens, and dikes"
 oe_v58_1337.22.b.tt: "Advances domestic science, stability, and imperial prestige."
 oe_v58_1337.22.c: "Dispatch pochteca long-distance merchants southward for cacao and jade"
 oe_v58_1337.22.c.tt: "Fills royal coffers while mapping distant kingdoms."
 oe_v58_1337.23.title: "Pachacuti's Cusco & the Golden Courtyard of Qorikancha"
 oe_v58_1337.23.desc: "Following desperate mountain victories, Sapa Inca Pachacuti—He Who Remakes the World—rebuilds Cusco in the sacred silhouette of a puma and sheaths the stone sanctuary of Qorikancha in gleaming hammered gold."
 oe_v58_1337.23.a: "Sheathe Qorikancha in gold and proclaim the Four Quarters of the Sun"
 oe_v58_1337.23.a.tt: "Boosts imperial legitimacy and Andean cultural radiance."
 oe_v58_1337.23.b: "Build Sacsayhuamán's cyclopean zigzag fortress above Cusco"
 oe_v58_1337.23.b.tt: "Strengthens military tradition and Andean imperial defense."
 oe_v58_1337.23.c: "Distribute chicha feasts and fine textiles to allied highland curacas"
 oe_v58_1337.23.c.tt: "Secures smooth noble loyalty and immediate stability."
 oe_v58_1337.24.title: "Qhapaq Ñan Royal Roads, Quipu Scribes & Qullqa Granaries"
 oe_v58_1337.24.desc: "Spanning snowbound passes and coastal deserts for thousands of leagues, stone-paved royal highways, chasqui runners, and knotted-cord quipu accountants let Cusco shift armies and freeze-dried chuño grain anywhere in weeks."
 oe_v58_1337.24.a: "Expand the Qhapaq Ñan highways, suspension bridges, and quipu bureaus"
 oe_v58_1337.24.a.tt: "Accelerates army movement speed and cabinet administration."
 oe_v58_1337.24.b: "Terrace steep Andean slopes and fill every provincial qullqa depot"
 oe_v58_1337.24.b.tt: "Fortifies national stability against mountain famine and war."
 oe_v58_1337.24.c: "Channel highland silver and alpaca cloth tribute to royal coffers"
 oe_v58_1337.24.c.tt: "Builds immediate treasury reserves for expansion."
