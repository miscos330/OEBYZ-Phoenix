l_english:
 OE_RW_HEGEMONY_TAB: "Roman Hegemony"
 OE_RW_HEGEMONY_DESC: "The struggles over the old imperial lands will one day end. Beyond the Balkans and Anatolia, Roman roads still lead to distant shores."
 OE_RW_END_CONTEST_HEADER: "A Settled Realm"
 oe_rw_end_contest: "End the Struggle"
 oe_rw_end_contest_desc: "The cities no longer answer to countless masters, and envoys crossing the straits increasingly make for the same court. Once we and our subjects hold most of the Balkans and Anatolia, we may declare the contest concluded.\n\nOur country and its direct and indirect subjects must own at least #Y 70%#! of all ownable locations in the two regions combined. Each location counts equally; military occupation does not count.\n\nPermanently closes the Roman World's #Y Contest of Warlords#! page and opens #Y Roman Hegemony#!. Costs no gold, Privy Purse funds, Authority or Public Opinion. Does not transfer organization leadership or Roman legitimacy.\n\n$OE_RW_END_CONTEST_REWARDS$"
 OE_RW_HEGEMONY_THRESHOLD: "Our country and its direct and indirect subjects own at least #Y 70%#! of all ownable locations in the Balkans and Anatolia"
 OE_RW_HEGEMONY_BEGINS: "The Roman World's #Y Contest of Warlords#! page closes permanently and #Y Roman Hegemony#! opens."
 OE_RW_HEGEMONY_PROGRESS: "Owned: #Y [GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_rw_hegemony_owned_locations')|0]#! / [GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_rw_hegemony_total_locations')|0] locations ([GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_rw_hegemony_owned_percent')|1]%)\nRequires at least #Y [GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_rw_hegemony_required_locations')|0]#! locations (70%)."
 OE_RW_HEGEMONY_COUNT_RULES: "Counts the entire #Y Balkan and Anatolian regions#!, independently of organization membership and territorial exclusions.\n\nEach location owned by us or any direct or indirect subject counts once. Seas, lakes and impassable locations are excluded. Occupied foreign territory does not count. The percentage is rounded for display; eligibility uses the required location count."
 OE_RW_EGYPT: "Egypt"
 OE_RW_EGYPT_DESC: "The Nile nourishes its fields year after year, while Alexandria welcomes ships from across the Mediterranean. The valley's grain, cities and sea routes have long drawn the attention of empires."
 OE_RW_EGYPT_OPEN: "View regional actions for Egypt"
 OE_RW_EGYPT_HINT: "Click the map to open Egypt's regional actions."
 OE_RW_ALEXANDRIA: "Alexandria"
 OE_RW_ALEXANDRIA_OWNER: "Owner of Alexandria: #Y [Country.GetName]#!"
 OE_RW_EGYPT_ACTIONS: "Egyptian Actions"
 OE_RW_EGYPT_EMPTY: "There are no regional actions available here yet."
 OE_RW_REGION_CLOSE: "Close"
