l_english:
 STATIC_MODIFIER_NAME_oe_tsn_war_levy: "War Levy"
 STATIC_MODIFIER_DESC_oe_tsn_war_levy: "The [Concept('oe_tu_senate','senate')|e] has granted extra men and supplies for the current campaign. Ends with the campaign, after #Y 5#! years at most."
 OE_TSN_RESULT_PASS: "Result: the bill #G passes#!."
 OE_TSN_RESULT_FAIL: "Result: the bill is #R rejected#!. The emperor may accept this, or force it through for #R 5#! [oe_tu_authority|e]."
 OE_TSN_DELEGATION_ON: "\n#T Four-Prefecture Delegation Cap active#!: each Prefecture sends at most #Y 4#! seats (max #Y 16#! provincial seats balancing #Y 11#! court seats)."
 oe_tsn_tally: "For: #G [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.GetVariable('oe_tsn_yes').GetValue|0]#! seats ([Concept('oe_tu_charter','chartered cities')|e] #Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.GetVariable('oe_tsn_yes_c').GetValue|0]#!, [Concept('oe_tu_exarchate','exarchates')|e] and despotates #Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.GetVariable('oe_tsn_yes_t').GetValue|0]#!, houses #Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.GetVariable('oe_tsn_yes_h').GetValue|0]#!, court officials #Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.GetVariable('oe_tsn_yes_o').GetValue|0]#!).\nAgainst: #R [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.GetVariable('oe_tsn_no').GetValue|0]#! seats (chartered cities #Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.GetVariable('oe_tsn_no_c').GetValue|0]#!, exarchates and despotates #Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.GetVariable('oe_tsn_no_t').GetValue|0]#!, houses #Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.GetVariable('oe_tsn_no_h').GetValue|0]#!, court officials #Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.GetVariable('oe_tsn_no_o').GetValue|0]#!).[GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.Custom('OeTsnDelegationNote')]\n\n[GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.Custom('OeTsnResult')]"
 oe_tsn_levy_request: "Ask the Senate for a Levy"
 oe_tsn_levy_request_desc: "Ask the senate to vote on a levy. If it passes, [Concept('oe_tu_exarchate','exarchates')|e], [Concept('oe_tu_charter','chartered cities')|e] and despotates pay an extra #G 5%#! of their monthly income in tribute for #Y 5#! years; a chartered city that voted against pays half of the extra.\n\nAsking costs #R 2#! [oe_tu_authority|e] and cannot be repeated for #Y 10#! years.\n\nThe [Concept('oe_tu_senate','senate')|e] has #Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_tsn_seats_value')|0]#! seats now (hover for the seats and the voting rules).[GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.Custom('OeTsnDelegationNote')]\n$oe_tsn_pv_1$"
 oe_tsn_levy_request.tt: "#R −2#! [oe_tu_authority|e]\nThe [Concept('oe_tu_senate','senate')|e] votes on the levy; it cannot be asked again for #Y 10#! years"
 oe_tsn_allow_auth: "[oe_tu_authority|e] is at least #Y 2#!"
 oe_tsn_allow_cd: "#Y 10#! years have passed since the last levy was asked for"
 oe_tsn_allow_active: "No extra levy is in force"
 oe_tsn_allow_idle: "No bill is waiting for the senate's vote"
 oe_tsn.1.d1: "The emperor asks the [Concept('oe_tu_senate','senate')|e] to vote on a #bold #color_yellow levy#!#!. If it passes, [Concept('oe_tu_exarchate','exarchates')|e], [Concept('oe_tu_charter','chartered cities')|e] and despotates pay an extra #G 5%#! of their monthly income in tribute for #Y 5#! years; a chartered city that voted against pays half of the extra.\n\n$oe_tsn_tally$"
 oe_tsn.1.d2: "The emperor asks the [Concept('oe_tu_senate','senate')|e] to vote on a [ShowModifier('oe_tsn_war_levy')]. A new campaign has begun, and the emperor wants the provinces to send more men and supplies for it. If it passes, for the length of the campaign (#Y 5#! years at most): land morale #G +5%#!, manpower #G +10%#!, monthly war exhaustion #G −0.05#!.\n\n$oe_tsn_tally$"
 oe_tsn.1.d3: "The emperor asks the [Concept('oe_tu_senate','senate')|e] to vote on [Concept('oe_tu_provincialise','provincialisation')|e]: the vassal [SCOPE.sCountry('oe_tsn_target').GetName] is to be annexed and made into provinces of the empire.\n\n$oe_tsn_tally$"
 oe_tsn.1.d4: "The emperor asks the [Concept('oe_tu_senate','senate')|e] to vote on #bold #color_yellow Roman law#!#! for [SCOPE.sCountry('oe_tsn_target').GetName]: it is to become a heartland province of the empire.\n\n$oe_tsn_tally$"
 oe_tsn.1.d: "To the hush of the chamber, palace heralds lay an imperial bill before the [Concept('oe_tu_senate','senate')|e] for formal deliberation and vote. Rising from their marble benches, senators and court dignitaries weigh imperial prerogative against their own interests as the chamber's tally is called.\n\n$oe_tsn_tally$"
 oe_tsn.1.t: "A Vote in the Senate"
 oe_tsn.1.a1: "Carry it out"
 oe_tsn.1.a1.tt: "Extra levy: [Concept('oe_tu_exarchate','exarchates')|e], [Concept('oe_tu_charter','chartered cities')|e] and despotates pay an extra #G 5%#! of their monthly income in tribute for #Y 5#! years; a chartered city that voted against pays half of the extra (chartered cities that voted against: #Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.GetVariable('oe_tsn_no_cn').GetValue|0]#!)"
 oe_tsn.1.b1: "Accept the senate's verdict"
 oe_tsn.1.b1.tt: "No levy. It cannot be asked again for #Y 10#! years"
 oe_tsn.1.c1: "Force it through"
 oe_tsn.1.c1.tt: "#R −5#! [oe_tu_authority|e]\nEvery province that voted against (#Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.GetVariable('oe_tsn_no_tn').GetValue|0]#! [Concept('oe_tu_exarchate','exarchates')|e] or despotates, #Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.GetVariable('oe_tsn_no_cn').GetValue|0]#! [Concept('oe_tu_charter','chartered cities')|e]): loyalty #R −10#! (also in the loyalty target for #Y 5#! years)\nEvery house that voted against (#Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.GetVariable('oe_tsn_no_h').GetValue|0]#!): influence #Y −25#!\nExtra levy: exarchates, chartered cities and despotates pay an extra #G 5%#! of their monthly income in tribute for #Y 5#! years; a chartered city that voted against pays half of the extra (chartered cities that voted against: #Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.GetVariable('oe_tsn_no_cn').GetValue|0]#!)"
 oe_tsn.1.a2: "Carry it out"
 oe_tsn.1.a2.tt: "[ShowModifier('oe_tsn_war_levy')] until this campaign ends (#Y 5#! years at most): land morale #G +5%#!, manpower #G +10%#!, monthly war exhaustion #G −0.05#!"
 oe_tsn.1.b2: "Accept the senate's verdict"
 oe_tsn.1.b2.tt: "The provinces grumble, but nothing else happens"
 oe_tsn.1.c2: "Force it through"
 oe_tsn.1.c2.tt: "#R −5#! [oe_tu_authority|e]\nEvery province that voted against (#Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.GetVariable('oe_tsn_no_tn').GetValue|0]#! [Concept('oe_tu_exarchate','exarchates')|e] or despotates, #Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.GetVariable('oe_tsn_no_cn').GetValue|0]#! [Concept('oe_tu_charter','chartered cities')|e]): loyalty #R −10#! (also in the loyalty target for #Y 5#! years)\nEvery house that voted against (#Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.GetVariable('oe_tsn_no_h').GetValue|0]#!): influence #Y −25#!\n[ShowModifier('oe_tsn_war_levy')] until this campaign ends (#Y 5#! years at most): land morale #G +5%#!, manpower #G +10%#!, monthly war exhaustion #G −0.05#!"
 oe_tsn.1.a3: "Carry it out"
 oe_tsn.1.a3.tt: "The [Concept('oe_tu_provincialise','provincialisation')|e] bill takes effect as the 'new province' action describes"
 oe_tsn.1.b3: "Accept the senate's verdict"
 oe_tsn.1.b3.tt: "The new-province bill is dropped"
 oe_tsn.1.c3: "Force it through"
 oe_tsn.1.c3.tt: "#R −5#! [oe_tu_authority|e]\nEvery province that voted against (#Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.GetVariable('oe_tsn_no_tn').GetValue|0]#! [Concept('oe_tu_exarchate','exarchates')|e] or despotates, #Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.GetVariable('oe_tsn_no_cn').GetValue|0]#! [Concept('oe_tu_charter','chartered cities')|e]): loyalty #R −10#! (also in the loyalty target for #Y 5#! years)\nEvery house that voted against (#Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.GetVariable('oe_tsn_no_h').GetValue|0]#!): influence #Y −25#!\nThe [Concept('oe_tu_provincialise','provincialisation')|e] bill takes effect as the 'new province' action describes"
 oe_tsn.1.a4: "Carry it out"
 oe_tsn.1.a4.tt: "The Roman-law bill takes effect as that action describes"
 oe_tsn.1.b4: "Accept the senate's verdict"
 oe_tsn.1.b4.tt: "The Roman-law bill is dropped"
 oe_tsn.1.c4: "Force it through"
 oe_tsn.1.c4.tt: "#R −5#! [oe_tu_authority|e]\nEvery province that voted against (#Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.GetVariable('oe_tsn_no_tn').GetValue|0]#! [Concept('oe_tu_exarchate','exarchates')|e] or despotates, #Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.GetVariable('oe_tsn_no_cn').GetValue|0]#! [Concept('oe_tu_charter','chartered cities')|e]): loyalty #R −10#! (also in the loyalty target for #Y 5#! years)\nEvery house that voted against (#Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.GetVariable('oe_tsn_no_h').GetValue|0]#!): influence #Y −25#!\nThe Roman-law bill takes effect as that action describes"
 oe_tsn.1.x: "Noted"
 oe_tsn.1.x.tt: "There is no bill to vote on; nothing happens."
 oe_tsn_pv_1: "If asked now: #G [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_tsn_pv1_yes')|0]#! seats for, #R [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_tsn_pv1_no')|0]#! against: [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.Custom('OeTsnPv1')].\nVotes against: [Concept('oe_tu_charter','chartered cities')|e] #Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_tsn_pv1_no_c')|0]#!, [Concept('oe_tu_exarchate','exarchates')|e] and despotates #Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_tsn_pv1_no_t')|0]#!, houses #Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_tsn_pv1_no_h')|0]#!, court officials #Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_tsn_pv1_no_o')|0]#!."
 oe_tsn_pv_2: "Once the campaign opens, the [Concept('oe_tu_senate','senate')|e] votes on a [ShowModifier('oe_tsn_war_levy')]. As things stand: #G [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_tsn_pv2_yes')|0]#! seats for, #R [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_tsn_pv2_no')|0]#! against: [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.Custom('OeTsnPv2')].\nVotes against: [Concept('oe_tu_charter','chartered cities')|e] #Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_tsn_pv2_no_c')|0]#!, [Concept('oe_tu_exarchate','exarchates')|e] and despotates #Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_tsn_pv2_no_t')|0]#!, houses #Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_tsn_pv2_no_h')|0]#!, court officials #Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_tsn_pv2_no_o')|0]#!.[GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.Custom('OeTsnPvQueue')]"
 oe_tsn_pv_3: "If submitted now: #G [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_tsn_pv3_yes')|0]#! seats for, #R [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_tsn_pv3_no')|0]#! against: [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.Custom('OeTsnPv3')].\nVotes against: [Concept('oe_tu_charter','chartered cities')|e] #Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_tsn_pv3_no_c')|0]#!, [Concept('oe_tu_exarchate','exarchates')|e] and despotates #Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_tsn_pv3_no_t')|0]#!, houses #Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_tsn_pv3_no_h')|0]#!, court officials #Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_tsn_pv3_no_o')|0]#!.\nThe subject itself has no seat in the [Concept('oe_tu_senate','senate')|e] and the count does not depend on which subject is put forward, so the forecast is the same for every subject.[GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.Custom('OeTsnPvQueue')]"
 oe_tsn_pv_4: "If submitted now: #G [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_tsn_pv4_yes')|0]#! seats for, #R [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_tsn_pv4_no')|0]#! against: [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.Custom('OeTsnPv4')].\nVotes against: [Concept('oe_tu_charter','chartered cities')|e] #Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_tsn_pv4_no_c')|0]#!, [Concept('oe_tu_exarchate','exarchates')|e] and despotates #Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_tsn_pv4_no_t')|0]#!, houses #Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_tsn_pv4_no_h')|0]#!, court officials #Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_tsn_pv4_no_o')|0]#!.\nEvery province that can be chosen has loyalty #Y 70#! or more, so it votes for whether or not it is the one chosen ([Concept('oe_tu_march','marches')|e] hold no seat): the forecast is the same whichever province is chosen.[GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.Custom('OeTsnPvQueue')]"
 OE_TSN_PV_PASS: "expected to #G pass#!"
 OE_TSN_PV_EMPTY: "the senate has no seats yet, so it #G passes#!"
 OE_TSN_PV_FAIL: "expected to be #R rejected#!"
 OE_TSN_PV_QUEUE: "\nAnother bill is before the senate: this one is voted on after it, and the result may differ by then."
