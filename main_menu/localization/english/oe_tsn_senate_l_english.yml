l_english:
 STATIC_MODIFIER_NAME_oe_tsn_war_levy: "War Levy"
 STATIC_MODIFIER_DESC_oe_tsn_war_levy: "The senate has granted extra men and supplies for the current campaign. Ends with the campaign, after 5 years at most."
 OE_TSN_RESULT_PASS: "Result: the bill passes."
 OE_TSN_RESULT_FAIL: "Result: the bill is rejected. The emperor may accept this, or force it through for 5 Imperial Authority."
 oe_tsn_hist: "The Byzantine senate (synkletos) lasted into the Palaiologan age, but by then it was a body of the highest dignitaries of the capital, not of delegates sent by the provinces. In this game chartered cities, exarchates and despotates hold seats in it. That is a game invention, modelled on the town councils of Roman municipia and the councils of the Italian city communes."
 oe_tsn_rules: "Seats: 2 for each chartered city, 1 for each exarchate and despotate, 1 for each house on the roll, 1 for each court official in office. Provinces vote by loyalty and status (chartered cities oppose levies), houses by influence and by whether they are the emperor's political ally, officials by their loyalty to the emperor and the satisfaction of their estate. A bill passes with more seats for than against. If it fails, the emperor may force it through for 5 Imperial Authority: every province that voted against loses 10 loyalty (also in the loyalty target for 5 years) and every house that voted against loses 25 influence."
 oe_tsn_tally: "For: [GetCountry('BYZ').MakeScope.GetVariable('oe_tsn_yes').GetValue|0] seats (chartered cities [GetCountry('BYZ').MakeScope.GetVariable('oe_tsn_yes_c').GetValue|0], exarchates and despotates [GetCountry('BYZ').MakeScope.GetVariable('oe_tsn_yes_t').GetValue|0], houses [GetCountry('BYZ').MakeScope.GetVariable('oe_tsn_yes_h').GetValue|0], court officials [GetCountry('BYZ').MakeScope.GetVariable('oe_tsn_yes_o').GetValue|0]).\nAgainst: [GetCountry('BYZ').MakeScope.GetVariable('oe_tsn_no').GetValue|0] seats (chartered cities [GetCountry('BYZ').MakeScope.GetVariable('oe_tsn_no_c').GetValue|0], exarchates and despotates [GetCountry('BYZ').MakeScope.GetVariable('oe_tsn_no_t').GetValue|0], houses [GetCountry('BYZ').MakeScope.GetVariable('oe_tsn_no_h').GetValue|0], court officials [GetCountry('BYZ').MakeScope.GetVariable('oe_tsn_no_o').GetValue|0]).\n\n[GetCountry('BYZ').Custom('OeTsnResult')]"
 oe_tsn_levy_request: "Ask the Senate for a Levy"
 oe_tsn_levy_request_desc: "Ask the senate to vote on a levy: if it passes, exarchates, chartered cities and despotates pay an extra 5% of their monthly income in tribute for 5 years; a chartered city that voted against pays half of the extra. Asking costs 2 Imperial Authority and cannot be repeated for 10 years.\n\nThe senate has [GetCountry('BYZ').MakeScope.GetVariable('oe_tsn_seats_now').GetValue|0] seats now. $oe_tsn_rules$\n\n$oe_tsn_hist$"
 oe_tsn_levy_request.tt: "−2 Imperial Authority\nThe senate votes on the levy; it cannot be asked again for 10 years"
 oe_tsn_allow_auth: "Imperial Authority is at least 2"
 oe_tsn_allow_cd: "10 years have passed since the last levy was asked for"
 oe_tsn_allow_active: "No extra levy is in force"
 oe_tsn_allow_idle: "No bill is waiting for the senate's vote"
 oe_tsn.1.d1: "$oe_tsn_hist$\n\nThe emperor asks the senate to vote on a levy. If it passes, exarchates, chartered cities and despotates pay an extra 5% of their monthly income in tribute for 5 years; a chartered city that voted against pays half of the extra.\n\n$oe_tsn_tally$"
 oe_tsn.1.d2: "$oe_tsn_hist$\n\nThe emperor asks the senate to vote on a war levy. A new campaign has begun, and the emperor wants the provinces to send more men and supplies for it. If it passes, for the length of the campaign (5 years at most): land morale +5%, manpower +10%, monthly war exhaustion −0.05.\n\n$oe_tsn_tally$"
 oe_tsn.1.d3: "$oe_tsn_hist$\n\nThe emperor asks the senate to vote on a new province: the vassal [SCOPE.sCountry('oe_tsn_target').GetName] is to be annexed and made into provinces of the empire.\n\n$oe_tsn_tally$"
 oe_tsn.1.d4: "$oe_tsn_hist$\n\nThe emperor asks the senate to vote on Roman law for [SCOPE.sCountry('oe_tsn_target').GetName]: it is to become a heartland province of the empire.\n\n$oe_tsn_tally$"
 oe_tsn.1.d: "$oe_tsn_hist$\n\nThe emperor puts a bill to the senate.\n\n$oe_tsn_tally$"
 oe_tsn.1.t: "A Vote in the Senate"
 oe_tsn.1.a1: "Carry it out"
 oe_tsn.1.a1.tt: "Extra levy: exarchates, chartered cities and despotates pay an extra 5% of their monthly income in tribute for 5 years; a chartered city that voted against pays half of the extra (chartered cities that voted against: [GetCountry('BYZ').MakeScope.GetVariable('oe_tsn_no_cn').GetValue|0])"
 oe_tsn.1.b1: "Accept the senate's verdict"
 oe_tsn.1.b1.tt: "No levy. It cannot be asked again for 10 years"
 oe_tsn.1.c1: "Force it through"
 oe_tsn.1.c1.tt: "−5 Imperial Authority\nEvery province that voted against ([GetCountry('BYZ').MakeScope.GetVariable('oe_tsn_no_tn').GetValue|0] exarchates or despotates, [GetCountry('BYZ').MakeScope.GetVariable('oe_tsn_no_cn').GetValue|0] chartered cities): loyalty −10 (also in the loyalty target for 5 years)\nEvery house that voted against ([GetCountry('BYZ').MakeScope.GetVariable('oe_tsn_no_h').GetValue|0]): influence −25\nExtra levy: exarchates, chartered cities and despotates pay an extra 5% of their monthly income in tribute for 5 years; a chartered city that voted against pays half of the extra (chartered cities that voted against: [GetCountry('BYZ').MakeScope.GetVariable('oe_tsn_no_cn').GetValue|0])"
 oe_tsn.1.a2: "Carry it out"
 oe_tsn.1.a2.tt: "'War Levy' until this campaign ends (5 years at most): land morale +5%, manpower +10%, monthly war exhaustion −0.05"
 oe_tsn.1.b2: "Accept the senate's verdict"
 oe_tsn.1.b2.tt: "The provinces grumble, but nothing else happens"
 oe_tsn.1.c2: "Force it through"
 oe_tsn.1.c2.tt: "−5 Imperial Authority\nEvery province that voted against ([GetCountry('BYZ').MakeScope.GetVariable('oe_tsn_no_tn').GetValue|0] exarchates or despotates, [GetCountry('BYZ').MakeScope.GetVariable('oe_tsn_no_cn').GetValue|0] chartered cities): loyalty −10 (also in the loyalty target for 5 years)\nEvery house that voted against ([GetCountry('BYZ').MakeScope.GetVariable('oe_tsn_no_h').GetValue|0]): influence −25\n'War Levy' until this campaign ends (5 years at most): land morale +5%, manpower +10%, monthly war exhaustion −0.05"
 oe_tsn.1.a3: "Carry it out"
 oe_tsn.1.a3.tt: "The new-province bill takes effect as the 'new province' action describes"
 oe_tsn.1.b3: "Accept the senate's verdict"
 oe_tsn.1.b3.tt: "The new-province bill is dropped"
 oe_tsn.1.c3: "Force it through"
 oe_tsn.1.c3.tt: "−5 Imperial Authority\nEvery province that voted against ([GetCountry('BYZ').MakeScope.GetVariable('oe_tsn_no_tn').GetValue|0] exarchates or despotates, [GetCountry('BYZ').MakeScope.GetVariable('oe_tsn_no_cn').GetValue|0] chartered cities): loyalty −10 (also in the loyalty target for 5 years)\nEvery house that voted against ([GetCountry('BYZ').MakeScope.GetVariable('oe_tsn_no_h').GetValue|0]): influence −25\nThe new-province bill takes effect as the 'new province' action describes"
 oe_tsn.1.a4: "Carry it out"
 oe_tsn.1.a4.tt: "The Roman-law bill takes effect as that action describes"
 oe_tsn.1.b4: "Accept the senate's verdict"
 oe_tsn.1.b4.tt: "The Roman-law bill is dropped"
 oe_tsn.1.c4: "Force it through"
 oe_tsn.1.c4.tt: "−5 Imperial Authority\nEvery province that voted against ([GetCountry('BYZ').MakeScope.GetVariable('oe_tsn_no_tn').GetValue|0] exarchates or despotates, [GetCountry('BYZ').MakeScope.GetVariable('oe_tsn_no_cn').GetValue|0] chartered cities): loyalty −10 (also in the loyalty target for 5 years)\nEvery house that voted against ([GetCountry('BYZ').MakeScope.GetVariable('oe_tsn_no_h').GetValue|0]): influence −25\nThe Roman-law bill takes effect as that action describes"
 oe_tsn.1.x: "Noted"
 oe_tsn.1.x.tt: "There is no bill to vote on; nothing happens."
