 STATIC_MODIFIER_NAME_oe_cne_mod_hre_reichskreis_levy:0 "Reichskreis Circle Defense Muster"
 STATIC_MODIFIER_DESC_oe_cne_mod_hre_reichskreis_levy:0 "Coordinated Imperial Circle contingents and shared war chests bolster imperial border defense and martial readiness."
 STATIC_MODIFIER_NAME_oe_cne_mod_hre_aulic_charter:0 "Imperial Aulic Judicial Charter"
 STATIC_MODIFIER_DESC_oe_cne_mod_hre_aulic_charter:0 "Imperial judicial commissioners enforce uniform charters across estates, elevating imperial authority and fiscal order."
 STATIC_MODIFIER_NAME_oe_cne_mod_catholic_trent_synod:0 "Tridentine Synodal Reform"
 STATIC_MODIFIER_DESC_oe_cne_mod_catholic_trent_synod:0 "Reformed diocesan seminaries and disciplined clergy deepen Catholic orthodoxy and civic cohesion."
 STATIC_MODIFIER_NAME_oe_cne_mod_catholic_holy_league:0 "Holy League Crusade Tithe"
 STATIC_MODIFIER_DESC_oe_cne_mod_catholic_holy_league:0 "Consecrated ecclesiastical subsidies steel Catholic fleets and frontier armies marching beneath the cross."
 STATIC_MODIFIER_NAME_oe_cne_mod_ortho_pentarchy:0 "Pentarchy Ecumenical Concord"
 STATIC_MODIFIER_DESC_oe_cne_mod_ortho_pentarchy:0 "Shared canonical diplomacy across the Autocephalous Patriarchate uplifts Orthodox legitimacy, cultural reach, and mutual solidarity."
 STATIC_MODIFIER_NAME_oe_cne_mod_ortho_hesychast:0 "Synodal Hesychast Endowment"
 STATIC_MODIFIER_DESC_oe_cne_mod_ortho_hesychast:0 "Monastic Hesychast scriptoria and charitable hospices nurture literacy, spiritual calm, and provincial prosperity."
 STATIC_MODIFIER_NAME_oe_cne_mod_tatar_yarlyk:0 "Grand Yarlyk Silver Tribute"
 STATIC_MODIFIER_DESC_oe_cne_mod_tatar_yarlyk:0 "Baskak assessors and steppe riders enforce the Khan's golden charter, filling the treasury and intimidating tributary princes."
 STATIC_MODIFIER_NAME_oe_cne_mod_tatar_stand_ugra:0 "Stand on the Ugra River"
 STATIC_MODIFIER_DESC_oe_cne_mod_tatar_stand_ugra:0 "Fortified river batteries and resolute infantry embolden the realm to confront steppe overlordship on equal terms."
 STATIC_MODIFIER_NAME_oe_cne_mod_marienburg_crusade:0 "Marienburg Ordensburg Crusade"
 STATIC_MODIFIER_DESC_oe_cne_mod_marienburg_crusade:0 "Fortified brick commanderies and seasoned western knightly volunteers anchor the Teutonic Order's Baltic frontier."
 STATIC_MODIFIER_NAME_oe_cne_mod_baltic_amber_monopoly:0 "Teutonic Amber & Grain Monopoly"
 STATIC_MODIFIER_DESC_oe_cne_mod_baltic_amber_monopoly:0 "State granaries and regulated Baltic amber exports fill the Grand Master's treasury without overstretching knightly levies."
 STATIC_MODIFIER_NAME_oe_cne_mod_grunwald_resilience:0 "Defense of Marienburg"
 STATIC_MODIFIER_DESC_oe_cne_mod_grunwald_resilience:0 "Stubborn citadel garrisons and hired Bohemian and German marksmen save the Ordensstaat from total collapse."
 STATIC_MODIFIER_NAME_oe_cne_mod_thorn_recovery:0 "Post-Thorn Fiscal Reconstruction"
 STATIC_MODIFIER_DESC_oe_cne_mod_thorn_recovery:0 "Measured indemnity agreements and emergency town taxes restore solvency and preserve the core Prussian domains."
 STATIC_MODIFIER_NAME_oe_cne_mod_ordensstaat_iron_hand:0 "Iron Hand of the Grand Master"
 STATIC_MODIFIER_DESC_oe_cne_mod_ordensstaat_iron_hand:0 "Relentless siege campaigns assert sovereign authority over defiant chartered cities at steep fiscal cost."
 STATIC_MODIFIER_NAME_oe_cne_mod_prussian_estates_pact:0 "Prussian Estates Charter Compact"
 STATIC_MODIFIER_DESC_oe_cne_mod_prussian_estates_pact:0 "Recognizing burgher trade privileges and provincial diets reconciles the Vistula ports with the Order's government."
 STATIC_MODIFIER_NAME_oe_cne_mod_secular_duchy_prussia:0 "Secular Duchy of Prussia"
 STATIC_MODIFIER_DESC_oe_cne_mod_secular_duchy_prussia:0 "Secularized monastic estates endow modern chanceries, provincial schools, and a loyal hereditary administration at Konigsberg."
 STATIC_MODIFIER_NAME_oe_cne_mod_reformed_teutonic_order:0 "Steadfast Teutonic Order"
 STATIC_MODIFIER_DESC_oe_cne_mod_reformed_teutonic_order:0 "Reaffirmed monastic vows and tightened commandery audits preserve the martial piety of the black cross."
 STATIC_MODIFIER_NAME_oe_cne_mod_brandenburg_prussia_union:0 "Brandenburg-Prussia Privy Union"
 STATIC_MODIFIER_DESC_oe_cne_mod_brandenburg_prussia_union:0 "Unified chancery governance bridges Berlin and Konigsberg into a single ambitious northern power."
 STATIC_MODIFIER_NAME_oe_cne_mod_elbe_baltic_corridor:0 "Elbe-Baltic Commercial Corridor"
 STATIC_MODIFIER_DESC_oe_cne_mod_elbe_baltic_corridor:0 "Customs harmonization and river canals stimulate burgher workshops from Brandenburg to Konigsberg."
 STATIC_MODIFIER_NAME_oe_cne_mod_great_elector_army:0 "Great Elector Standing Army"
 STATIC_MODIFIER_DESC_oe_cne_mod_great_elector_army:0 "Permanent regiments drilled to perfection and financed by the Generalkriegskommissariat transform Brandenburg-Prussia into a formidable military power."
 STATIC_MODIFIER_NAME_oe_cne_mod_edict_of_potsdam:0 "Edict of Potsdam Craftsmen"
 STATIC_MODIFIER_DESC_oe_cne_mod_edict_of_potsdam:0 "Skilled refugee weavers, engineers, and officers revitalize Berlin's manufactories and crown revenues."
 STATIC_MODIFIER_NAME_oe_cne_mod_konigsberg_coronation:0 "Royal Crown of Prussia"
 STATIC_MODIFIER_DESC_oe_cne_mod_konigsberg_coronation:0 "Sovereign royal status elevates Berlin's standing across every court of Europe and binds the nobility beneath the Black Eagle."
 STATIC_MODIFIER_NAME_oe_cne_mod_prussian_academy:0 "Royal Prussian Academy of Sciences"
 STATIC_MODIFIER_DESC_oe_cne_mod_prussian_academy:0 "Guided by leading philosophers and mathematicians, Berlin becomes a northern beacon of natural science and enlightened scholarship."
 STATIC_MODIFIER_NAME_oe_cne_mod_canton_system:0 "Prussian Canton System & Drill"
 STATIC_MODIFIER_DESC_oe_cne_mod_canton_system:0 "Universal regimental cantons, iron ramrod volley fire, and elite Potsdam Grenadiers forge the sharpest infantry machine in Europe."
 STATIC_MODIFIER_NAME_oe_cne_mod_general_directory:0 "Prussian General Directory Fisc"
 STATIC_MODIFIER_DESC_oe_cne_mod_general_directory:0 "Frugal crown auditors eliminate waste and amass an unmatched war chest inside the Berlin vaults."
 STATIC_MODIFIER_NAME_oe_cne_mod_oblique_order:0 "Frederician Oblique Order"
 STATIC_MODIFIER_DESC_oe_cne_mod_oblique_order:0 "Rapid flanking marches, disciplined platoon volleys, and mobile horse batteries outmaneuver coalition armies twice Prussia's size."
 STATIC_MODIFIER_NAME_oe_cne_mod_sanssouci_enlightenment:0 "Enlightenment of Sanssouci"
 STATIC_MODIFIER_DESC_oe_cne_mod_sanssouci_enlightenment:0 "Judicial reform, religious toleration, and royal patronage make Prussia a celebrated model of enlightened monarchy."
 STATIC_MODIFIER_NAME_oe_cne_mod_stein_hardenberg:0 "Stein-Hardenberg & General Staff"
 STATIC_MODIFIER_DESC_oe_cne_mod_stein_hardenberg:0 "Abolishing serfdom, granting municipal self-rule, and forging a professional General Staff unleash modern Prussian national vitality."
 STATIC_MODIFIER_NAME_oe_cne_mod_junker_corps:0 "Junker Officer Aristocracy"
 STATIC_MODIFIER_DESC_oe_cne_mod_junker_corps:0 "Unbroken aristocratic solidarity inside the cadet academies preserves austere command discipline across every regiment."
 STATIC_MODIFIER_NAME_oe_cne_mod_golden_bull_prague:0 "Golden Bull Electoral Primacy"
 STATIC_MODIFIER_DESC_oe_cne_mod_golden_bull_prague:0 "Bohemia stands first among the secular Imperial Electors, radiating legal legitimacy from the Vltava across the Empire."
 STATIC_MODIFIER_NAME_oe_cne_mod_charles_university:0 "Charles University of Prague"
 STATIC_MODIFIER_DESC_oe_cne_mod_charles_university:0 "Scholars, jurists, and Gothic master builders flock to Prague, elevating Bohemian literacy and artistic renown."
 STATIC_MODIFIER_NAME_oe_cne_mod_bethlehem_chapel:0 "Bethlehem Chapel Reformation"
 STATIC_MODIFIER_DESC_oe_cne_mod_bethlehem_chapel:0 "Vernacular Czech preaching and vernacular literacy ignite fierce civic pride and spiritual conviction."
 STATIC_MODIFIER_NAME_oe_cne_mod_prague_theological_truce:0 "Prague Ecclesiastical Mediation"
 STATIC_MODIFIER_DESC_oe_cne_mod_prague_theological_truce:0 "Royal arbitration dampens doctrinal clashes while keeping imperial neighbors from intervening in Bohemian affairs."
 STATIC_MODIFIER_NAME_oe_cne_mod_hussite_wagenburg:0 "Zizka's Hussite War Wagons"
 STATIC_MODIFIER_DESC_oe_cne_mod_hussite_wagenburg:0 "Chained war wagons bristling with pistala handguns and houfnice field pieces shatter armored feudal cavalry charges."
 STATIC_MODIFIER_NAME_oe_cne_mod_utraquist_militia:0 "Utraquist Civic Defense League"
 STATIC_MODIFIER_DESC_oe_cne_mod_utraquist_militia:0 "Coordinated town militias and moderate Bohemian nobles defend the kingdom's borders while keeping commerce alive."
 STATIC_MODIFIER_NAME_oe_cne_mod_compactata_basel:0 "Peace of the Compactata"
 STATIC_MODIFIER_DESC_oe_cne_mod_compactata_basel:0 "Recognized Utraquist worship ends Bohemia's isolation and welcomes German, Polish, and Italian merchants back to Prague."
 STATIC_MODIFIER_NAME_oe_cne_mod_bohemian_pass_watch:0 "Bohemian Border Pass Watch"
 STATIC_MODIFIER_DESC_oe_cne_mod_bohemian_pass_watch:0 "Veteran Hussite garrisons keep the mountain approaches heavily fortified against any renewed intervention."
 STATIC_MODIFIER_NAME_oe_cne_mod_podebrady_diplomacy:0 "Podebrady's Sovereign Diplomacy"
 STATIC_MODIFIER_DESC_oe_cne_mod_podebrady_diplomacy:0 "Bohemia's visionary diplomacy wins allies across Europe and fortifies royal legitimacy despite papal censure."
 STATIC_MODIFIER_NAME_oe_cne_mod_podebrady_demesne:0 "Bohemian Royal Demesne Revival"
 STATIC_MODIFIER_DESC_oe_cne_mod_podebrady_demesne:0 "Reclaimed crown castles and loyal Moravian and Bohemian banners anchor King George's domestic power."
 STATIC_MODIFIER_NAME_oe_cne_mod_kutna_hora_thaler:0 "Kutna Hora Silver Thaler"
 STATIC_MODIFIER_DESC_oe_cne_mod_kutna_hora_thaler:0 "Renowned Bohemian silver coinage sets the monetary benchmark of Central Europe and fills royal coffers."
 STATIC_MODIFIER_NAME_oe_cne_mod_bohemian_metallurgy:0 "Bohemian Crystal & Ironworks"
 STATIC_MODIFIER_DESC_oe_cne_mod_bohemian_metallurgy:0 "Silver profits finance famed crystal furnaces, paper mills, and cannon foundries across the crownlands."
 STATIC_MODIFIER_NAME_oe_cne_mod_bohemian_confederation:0 "Bohemian Estates Confederation"
 STATIC_MODIFIER_DESC_oe_cne_mod_bohemian_confederation:0 "United Bohemian, Moravian, and Silesian estates field disciplined pike-and-shot regiments to defend constitutional liberties."
 STATIC_MODIFIER_NAME_oe_cne_mod_prague_diplomatic_shield:0 "Prague Electoral Mediation"
 STATIC_MODIFIER_DESC_oe_cne_mod_prague_diplomatic_shield:0 "Deft embassies to Saxony, the Palatinate, and Vienna seek to contain the war and shield Bohemia from devastation."
 STATIC_MODIFIER_NAME_oe_cne_mod_bohemian_industrial_dawn:0 "Bohemian Industrial Manufactories"
 STATIC_MODIFIER_DESC_oe_cne_mod_bohemian_industrial_dawn:0 "Bohemia emerges as Central Europe's premier workshop for linen, glass, iron, and precision instruments."
 STATIC_MODIFIER_NAME_oe_cne_mod_bohemian_national_revival:0 "Bohemian Estates & Cultural Revival"
 STATIC_MODIFIER_DESC_oe_cne_mod_bohemian_national_revival:0 "Historians, dramatists, and provincial deputies revive the ancient tongue and dignity of the Crown of Saint Wenceslas."
 STATIC_MODIFIER_NAME_oe_cne_mod_privilegium_maius:0 "Archducal Privilegium Maius"
 STATIC_MODIFIER_DESC_oe_cne_mod_privilegium_maius:0 "Indivisible Habsburg succession and archducal prerogative elevate Vienna into a premier dynastic pillar of the Empire."
 STATIC_MODIFIER_NAME_oe_cne_mod_vienna_university:0 "Alma Mater Rudolphina of Vienna"
 STATIC_MODIFIER_DESC_oe_cne_mod_vienna_university:0 "Vienna's cathedral workshops and university faculties attract scholars and artisans from across the Alps and Danube."
 STATIC_MODIFIER_NAME_oe_cne_mod_tu_felix_austria:0 "Tu Felix Austria Nube"
 STATIC_MODIFIER_DESC_oe_cne_mod_tu_felix_austria:0 "Habsburg envoys and marriage treaties bind crowns from the Low Countries to the Danube in unmatched diplomatic reach."
 STATIC_MODIFIER_NAME_oe_cne_mod_maximilian_landsknechts:0 "Imperial Landsknecht Regiments"
 STATIC_MODIFIER_DESC_oe_cne_mod_maximilian_landsknechts:0 "Colorfully slashed German Landsknechte armed with eighteen-foot pikes and heavy arquebuses form the iron core of imperial field armies."
 STATIC_MODIFIER_NAME_oe_cne_mod_vienna_bastion_defense:0 "Bastion Shield of Vienna"
 STATIC_MODIFIER_DESC_oe_cne_mod_vienna_bastion_defense:0 "Heroic defense of the Carinthian Gate inspires the construction of deep star-shaped trace italienne ramparts across the Austrian heartland."
 STATIC_MODIFIER_NAME_oe_cne_mod_imperial_turkenhilfe:0 "Imperial Turkenhilfe Mobilization"
 STATIC_MODIFIER_DESC_oe_cne_mod_imperial_turkenhilfe:0 "Emergency Reichstag subsidies and volunteer contingents from across Germany pour down the Danube to relieve Vienna."
 STATIC_MODIFIER_NAME_oe_cne_mod_hofkriegsrat_council:0 "Aulic War Council (Hofkriegsrat)"
 STATIC_MODIFIER_DESC_oe_cne_mod_hofkriegsrat_council:0 "Centralized logistics, frontier engineering, and coordinated command turn the Habsburg military into a durable imperial institution."
 STATIC_MODIFIER_NAME_oe_cne_mod_habsburg_counter_reformation:0 "Habsburg Baroque Counter-Reformation"
 STATIC_MODIFIER_DESC_oe_cne_mod_habsburg_counter_reformation:0 "Reformed seminaries, Jesuit scholarship, and resplendent churches bind Austria's estates to the Catholic dynasty."
 STATIC_MODIFIER_NAME_oe_cne_mod_militargrenze_grenzers:0 "Danubian Militargrenze Grenzers"
 STATIC_MODIFIER_DESC_oe_cne_mod_militargrenze_grenzers:0 "Self-sustaining border garrisons and hardy Grenzer skirmishers form an unbroken living shield along the southern frontier."
 STATIC_MODIFIER_NAME_oe_cne_mod_danube_cordon:0 "Imperial Sanitary & Customs Cordon"
 STATIC_MODIFIER_DESC_oe_cne_mod_danube_cordon:0 "Regulated river crossings shield Central Europe from steppe epidemics while taxing overland Balkan caravans."
 STATIC_MODIFIER_NAME_oe_cne_mod_prince_eugene_campaigns:0 "Victories of Prince Eugene"
 STATIC_MODIFIER_DESC_oe_cne_mod_prince_eugene_campaigns:0 "Audacious river crossings and decisive cavalry shock actions crown Vienna's supremacy along the Middle Danube."
 STATIC_MODIFIER_NAME_oe_cne_mod_danube_resettlement:0 "Danubian Basin Resettlement"
 STATIC_MODIFIER_DESC_oe_cne_mod_danube_resettlement:0 "German, Magyar, and Slavic colonists replant war-torn river valleys into a breadbasket for the monarchy."
 STATIC_MODIFIER_NAME_oe_cne_mod_maria_theresa_reforms:0 "Theresian State & Army Reform"
 STATIC_MODIFIER_DESC_oe_cne_mod_maria_theresa_reforms:0 "Uniform decennial tax assessments, a modern officer academy, and compulsory primary schooling revitalize the Habsburg monarchy."
 STATIC_MODIFIER_NAME_oe_cne_mod_kaunitz_diplomacy:0 "Kaunitz Diplomatic Revolution"
 STATIC_MODIFIER_DESC_oe_cne_mod_kaunitz_diplomacy:0 "Masterful alliances neutralize continental rivals while estate goodwill steadies the composite monarchy."
 STATIC_MODIFIER_NAME_oe_cne_mod_josephinism_enlightenment:0 "Josephinist Enlightened Absolutism"
 STATIC_MODIFIER_DESC_oe_cne_mod_josephinism_enlightenment:0 "Religious toleration, peasant emancipation, and rationalized bureaucracy accelerate modernization across every crownland."
 STATIC_MODIFIER_NAME_oe_cne_mod_leopoldine_balance:0 "Measured Imperial Constitutionalism"
 STATIC_MODIFIER_DESC_oe_cne_mod_leopoldine_balance:0 "Preserving core legal reforms while respecting historic diets averts provincial revolts and sustains steady revenue."
 STATIC_MODIFIER_NAME_oe_cne_mod_sound_toll_mastery:0 "Mastery of the Sound Toll"
 STATIC_MODIFIER_DESC_oe_cne_mod_sound_toll_mastery:0 "Kronborg batteries and royal patrol squadrons turn the narrow Baltic gateway into a golden artery for the Nordic treasury."
 STATIC_MODIFIER_NAME_oe_cne_mod_kalmar_council_pact:0 "Concord of the Kalmar Union"
 STATIC_MODIFIER_DESC_oe_cne_mod_kalmar_council_pact:0 "Respecting regional laws and council representation secures loyal union governance from Iceland to Finland."
 STATIC_MODIFIER_NAME_oe_cne_mod_vasa_independence:0 "Vasa Sovereign Restoration"
 STATIC_MODIFIER_DESC_oe_cne_mod_vasa_independence:0 "Free Swedish peasantry, reformed crown estates, and confiscated church wealth forge a fierce independent Nordic monarchy."
 STATIC_MODIFIER_NAME_oe_cne_mod_nordic_hanseatic_credit:0 "Nordic Copper & Timber Credit"
 STATIC_MODIFIER_DESC_oe_cne_mod_nordic_hanseatic_credit:0 "Falun copper exports and Baltic timber contracts finance rapid naval construction and economic stabilization."
 STATIC_MODIFIER_NAME_oe_cne_mod_lion_of_the_north:0 "Military Revolution of the Lion of the North"
 STATIC_MODIFIER_DESC_oe_cne_mod_lion_of_the_north:0 "Mobile 3-pounder regimental guns, synchronized salvo fire, and aggressive Hakkapeliitta cavalry shock redefine European battlefields."
 STATIC_MODIFIER_NAME_oe_cne_mod_oxenstierna_colleges:0 "Oxenstierna Instrument of Government"
 STATIC_MODIFIER_DESC_oe_cne_mod_oxenstierna_colleges:0 "Five permanent royal administrative colleges sustain war mobilization across Sweden and Finland with clockwork precision."
 STATIC_MODIFIER_NAME_oe_cne_mod_dominium_maris_baltici:0 "Dominium Maris Baltici"
 STATIC_MODIFIER_DESC_oe_cne_mod_dominium_maris_baltici:0 "Toll stations along Pomeranian, Livonian, and Ingrian ports feed Stockholm's navy and Baltic commercial supremacy."
 STATIC_MODIFIER_NAME_oe_cne_mod_swedish_allotment:0 "Swedish Allotment System (Indelningsverket)"
 STATIC_MODIFIER_DESC_oe_cne_mod_swedish_allotment:0 "Provincial farmsteads permanently maintain trained regiments in peacetime, giving Sweden an affordable elite standing army."
 STATIC_MODIFIER_NAME_oe_cne_mod_kongeloven_absolutism:0 "Lex Regia (Kongeloven) Absolutism"
 STATIC_MODIFIER_DESC_oe_cne_mod_kongeloven_absolutism:0 "Curbing noble council vetoes unleashes decisive crown governance, modern admiralty shipyards, and unified Danish-Norwegian law."
 STATIC_MODIFIER_NAME_oe_cne_mod_danish_royal_companies:0 "Danish-Norwegian Oceanic Companies"
 STATIC_MODIFIER_DESC_oe_cne_mod_danish_royal_companies:0 "Chartered merchantmen connect Copenhagen and Bergen to Iceland, the West Indies, and Asian spice ports."
 STATIC_MODIFIER_NAME_oe_cne_mod_carolean_shock:0 "Carolean Shock Doctrine (Ga-Pa)"
 STATIC_MODIFIER_DESC_oe_cne_mod_carolean_shock:0 "Advancing silently through enemy volleys before firing at point-blank range and charging with steel breaks numerically superior coalitions."
 STATIC_MODIFIER_NAME_oe_cne_mod_nordic_archipelago_defense:0 "Nordic Archipelago & Coastal Shield"
 STATIC_MODIFIER_DESC_oe_cne_mod_nordic_archipelago_defense:0 "Shallow-draft archipelago gunboats and coastal fortresses deny enemy amphibious landings and preserve Nordic manpower."
 STATIC_MODIFIER_NAME_oe_cne_mod_hats_mercantilism:0 "Age of Liberty Enterprise & Science"
 STATIC_MODIFIER_DESC_oe_cne_mod_hats_mercantilism:0 "Gothenburg's East India ships, royal ironworks, and Linnaeus's Academy of Sciences usher in a brilliant cultural renaissance."
 STATIC_MODIFIER_NAME_oe_cne_mod_caps_constitutionalism:0 "Nordic Press & Fiscal Constitutionalism"
 STATIC_MODIFIER_DESC_oe_cne_mod_caps_constitutionalism:0 "Pioneering freedom of the press and austere parliamentary budgets restore public credit and agrarian prosperity."
 STATIC_MODIFIER_NAME_oe_cne_mod_armed_neutrality:0 "Nordic League of Armed Neutrality"
 STATIC_MODIFIER_DESC_oe_cne_mod_armed_neutrality:0 "Escorted neutral merchant fleets reap immense wartime carrying profits from Lisbon to Canton."
 STATIC_MODIFIER_NAME_oe_cne_mod_nordic_enlightenment:0 "Nordic Enlightenment Reforms"
 STATIC_MODIFIER_DESC_oe_cne_mod_nordic_enlightenment:0 "Abolishing rural bondage and funding public schools and opera houses crown a golden age of northern civilization."
 STATIC_MODIFIER_NAME_oe_cne_mod_angevin_golden_forint:0 "Angevin Golden Forint Prosperity"
 STATIC_MODIFIER_DESC_oe_cne_mod_angevin_golden_forint:0 "Pure Hungarian gold forints from Kremnica finance grand royal courts, chivalric tournaments, and Adriatic trade."
 STATIC_MODIFIER_NAME_oe_cne_mod_angevin_banderia:0 "Hungarian Royal Banderia"
 STATIC_MODIFIER_DESC_oe_cne_mod_angevin_banderia:0 "Uniform noble banderial quotas unite Magyar heavy horsemen and border barons under royal command."
 STATIC_MODIFIER_NAME_oe_cne_mod_belgrade_noon_bell:0 "Victors of Belgrade (1456)"
 STATIC_MODIFIER_DESC_oe_cne_mod_belgrade_noon_bell:0 "Belgrade's triumph buys Hungary seventy years of security and crowns the kingdom as the renowned Shield of Christendom."
 STATIC_MODIFIER_NAME_oe_cne_mod_hunyadi_long_campaign:0 "Hunyadi's Danubian Tactics"
 STATIC_MODIFIER_DESC_oe_cne_mod_hunyadi_long_campaign:0 "Combining agile Magyar light horse with Hussite wagon forts lets Hungarian columns strike deep across the Balkans."
 STATIC_MODIFIER_NAME_oe_cne_mod_corvinus_black_army:0 "The Black Army of Matthias Corvinus"
 STATIC_MODIFIER_DESC_oe_cne_mod_corvinus_black_army:0 "Professional heavy cavalry, arquebusiers, and armored war wagons loyal solely to the king's purse awe every neighbor from Vienna to Wallachia."
 STATIC_MODIFIER_NAME_oe_cne_mod_bibliotheca_corviniana:0 "Bibliotheca Corviniana of Buda"
 STATIC_MODIFIER_DESC_oe_cne_mod_bibliotheca_corviniana:0 "Italian sculptors, astronomers, and thousands of gilded codices make Buda the foremost Renaissance court north of the Alps."
 STATIC_MODIFIER_NAME_oe_cne_mod_hungarian_rural_conciliation:0 "Danubian Rural Conciliation"
 STATIC_MODIFIER_DESC_oe_cne_mod_hungarian_rural_conciliation:0 "Rejecting harsh perpetual serfdom preserves rural productivity and ensures loyal peasant levies when foreign invasions strike."
 STATIC_MODIFIER_NAME_oe_cne_mod_tripartitum_nobility:0 "Tripartitum Noble Ascendancy"
 STATIC_MODIFIER_DESC_oe_cne_mod_tripartitum_nobility:0 "Codifying Hungarian customary noble law pacifies the great magnates and mobilizes county hussar levies at the cost of rural tension."
 STATIC_MODIFIER_NAME_oe_cne_mod_mohacs_tactical_reform:0 "Post-Mohacs Military Reformation"
 STATIC_MODIFIER_DESC_oe_cne_mod_mohacs_tactical_reform:0 "Abandoning reckless feudal cavalry charges in favor of disciplined pike-and-shot squares and field cannon rescues the Danubian realm."
 STATIC_MODIFIER_NAME_oe_cne_mod_saint_stephen_shield:0 "Emergency Bulwark of Saint Stephen"
 STATIC_MODIFIER_DESC_oe_cne_mod_saint_stephen_shield:0 "Urgent embassies and county-wide mobilization pour reinforcements into Buda, Esztergom, and Pressburg."
 STATIC_MODIFIER_NAME_oe_cne_mod_rakoczi_kuruc_hussars:0 "Kuruc Hussar Liberty Banner"
 STATIC_MODIFIER_DESC_oe_cne_mod_rakoczi_kuruc_hussars:0 "Lightning Hungarian hussar raids become the envy of every army in Europe, inspiring light cavalry tactics across the continent."
 STATIC_MODIFIER_NAME_oe_cne_mod_hungarian_diet_revival:0 "Revival of the Hungarian Diet"
 STATIC_MODIFIER_DESC_oe_cne_mod_hungarian_diet_revival:0 "Guaranteed county autonomy, religious liberty, and revitalized Magyar letters usher in an era of domestic reconstruction."
 STATIC_MODIFIER_NAME_oe_cne_mod_return_to_rome:0 "Restoration of the Roman See"
 STATIC_MODIFIER_DESC_oe_cne_mod_return_to_rome:0 "Rome once again reigns as the undisputed spiritual capital of Latin Christendom, drawing pilgrims and envoys from every kingdom."
 STATIC_MODIFIER_NAME_oe_cne_mod_curial_patrimony:0 "Reformed Patrimony of Saint Peter"
 STATIC_MODIFIER_DESC_oe_cne_mod_curial_patrimony:0 "Disciplined apostolic treasurers restore ruined aqueducts, bridges, and provincial castles across Lazio and Umbria."
 STATIC_MODIFIER_NAME_oe_cne_mod_platonic_academy:0 "Florentine Platonic Renaissance"
 STATIC_MODIFIER_DESC_oe_cne_mod_platonic_academy:0 "Classical Greek manuscripts, perspective painting, and humanist academies radiate Italian cultural supremacy across all Europe."
 STATIC_MODIFIER_NAME_oe_cne_mod_medici_banking:0 "Medici Continental Banking House"
 STATIC_MODIFIER_DESC_oe_cne_mod_medici_banking:0 "Branch banks in Bruges, Lyon, Venice, and Rome channel European capital directly into Italian workshops and treasuries."
 STATIC_MODIFIER_NAME_oe_cne_mod_peace_of_lodi:0 "Peace of Lodi Resident Diplomacy"
 STATIC_MODIFIER_DESC_oe_cne_mod_peace_of_lodi:0 "Forty years of diplomatic equilibrium shield Italian cities from foreign invasion while nurturing unmatched urban wealth."
 STATIC_MODIFIER_NAME_oe_cne_mod_condottieri_trace_italienne:0 "Reformed Condottieri & Bastions"
 STATIC_MODIFIER_DESC_oe_cne_mod_condottieri_trace_italienne:0 "Tightly audited condottieri captains and angled star-fortress designs prepare Italy's cities for the gunpowder age."
 STATIC_MODIFIER_NAME_oe_cne_mod_warrior_pope_swiss_guard:0 "Pontifical Swiss Guard & Warrior Pope"
 STATIC_MODIFIER_DESC_oe_cne_mod_warrior_pope_swiss_guard:0 "Fiercely loyal Swiss halberdiers and bold papal field diplomacy turn Rome into a formidable temporal power in Italy."
 STATIC_MODIFIER_NAME_oe_cne_mod_julian_vatican_arts:0 "High Renaissance Vatican Patronage"
 STATIC_MODIFIER_DESC_oe_cne_mod_julian_vatican_arts:0 "Masterworks in fresco and marble elevate papal Rome into the aesthetic marvel of the Renaissance world."
 STATIC_MODIFIER_NAME_oe_cne_mod_council_of_trent:0 "Decrees of the Council of Trent"
 STATIC_MODIFIER_DESC_oe_cne_mod_council_of_trent:0 "Reformed bishoprics, disciplined religious orders, and catechism schools revitalize Catholicism from Europe to the Indies."
 STATIC_MODIFIER_NAME_oe_cne_mod_st_peters_basilica:0 "Majesty of St. Peter's Basilica"
 STATIC_MODIFIER_DESC_oe_cne_mod_st_peters_basilica:0 "The colossal dome crowning Vatican Hill stands as an eternal monument of architectural genius and papal majesty."
 STATIC_MODIFIER_NAME_oe_cne_mod_alpine_gatekeepers:0 "Alpine Gatekeepers of Savoy"
 STATIC_MODIFIER_DESC_oe_cne_mod_alpine_gatekeepers:0 "Interlocking mountain citadels and trained Piedmontese militias make invading Italy across the Western Alps ruinously costly."
 STATIC_MODIFIER_NAME_oe_cne_mod_savoyard_diplomacy:0 "Savoyard Balance-of-Power Diplomacy"
 STATIC_MODIFIER_DESC_oe_cne_mod_savoyard_diplomacy:0 "Savoyard statesmen skillfully play rival crowns off one another to extract subsidies, titles, and trade tolls."
 STATIC_MODIFIER_NAME_oe_cne_mod_piedmont_modern_army:0 "Piedmontese Royal Army Modernization"
 STATIC_MODIFIER_DESC_oe_cne_mod_piedmont_modern_army:0 "Rigorous ballistic academies and disciplined blue-coated infantry earn Italian royal regiments respect across Europe."
 STATIC_MODIFIER_NAME_oe_cne_mod_italian_cadastre_ports:0 "Enlightened Italian Cadastre & Ports"
 STATIC_MODIFIER_DESC_oe_cne_mod_italian_cadastre_ports:0 "Equitable land surveys and revitalized Tyrrhenian ports boost crown tax receipts and maritime commerce."
 STATIC_MODIFIER_NAME_oe_cne_mod_risorgimento_dawn:0 "Spirit of the Risorgimento"
 STATIC_MODIFIER_DESC_oe_cne_mod_risorgimento_dawn:0 "Patriotic volunteers, constitutional charters, and vibrant national journalism rally the peninsula toward sovereign unity."
 STATIC_MODIFIER_NAME_oe_cne_mod_italian_customs_league:0 "Italian Customs & Federal Compact"
 STATIC_MODIFIER_DESC_oe_cne_mod_italian_customs_league:0 "Dismantling internal river tolls and harmonizing railways, coinage, and trade laws knits the peninsula peacefully together."
 oe_cne.1.title:0 "Marienburg Ordensburg & the Northern Crusade"
 oe_cne.1.desc:0 "Red brick bastions rise above the Nogat at Marienburg as crusading knights from across Latin Christendom gather for seasonal Reisen along the Baltic marches."
 oe_cne.1.a:0 "Expand the Marienburg Commandery & Reisen"
 oe_cne.1.b:0 "Charter Amber Guilds & Vistula River Ports"
 oe_cne.2.title:0 "Aftermath of the Battle of Grunwald"
 oe_cne.2.desc:0 "Broken lances and tattered white-and-black mantles return from the fields of Grunwald as the Polish-Lithuanian host presses toward Marienburg and ransom debts mount."
 oe_cne.2.a:0 "Hold Marienburg & Drill Mercenary Crossbowmen"
 oe_cne.2.b:0 "Negotiate the Peace of Thorn & Rebuild Credit"
 oe_cne.3.title:0 "The Prussian Confederation Crisis"
 oe_cne.3.desc:0 "Wealthy burghers of Danzig and Thorn unite with landed knights in the Prussian Confederation, protesting war levies and appealing for royal protection beyond the Vistula."
 oe_cne.3.a:0 "Crush the Confederation by Force of Arms"
 oe_cne.3.b:0 "Grant Municipal Charters & Estate Consultation"
 oe_cne.4.title:0 "Secularization of the Teutonic Order (1525)"
 oe_cne.4.desc:0 "Reformation preaching sweeps Konigsberg while feudal obligations weigh on the ancient military order; councilors debate transforming the monastic state into a hereditary Duchy of Prussia."
 oe_cne.4.a:0 "Embrace Secular Ducal Administration"
 oe_cne.4.b:0 "Preserve the Reformed Military Order"
 oe_cne.5.title:0 "The Brandenburg-Prussia Personal Union"
 oe_cne.5.desc:0 "Hohenzollern inheritance unites the Electoral March of Brandenburg on the Elbe with the Baltic Duchy of Prussia at Konigsberg, forging a dual realm spanning northern Germany."
 oe_cne.5.a:0 "Centralize the Privy Council Across Both Realms"
 oe_cne.5.b:0 "Link Baltic Timber & Elbe River Trade Corridors"
 oe_cne.6.title:0 "The Great Elector's Standing Army"
 oe_cne.6.desc:0 "Scorched by decades of foreign armies marching unopposed across the Mark, Elector Frederick William resolves to forge a permanent standing army funded by the Excise and the General War Commissariat."
 oe_cne.6.a:0 "Establish the General War Commissariat"
 oe_cne.6.b:0 "Welcome Huguenot Artisans via the Edict of Potsdam"
 oe_cne.7.title:0 "Royal Coronation in Konigsberg (1701)"
 oe_cne.7.desc:0 "In the freezing winter of January 1701, Elector Frederick places the royal crown upon his own head inside Konigsberg Castle, proclaiming the sovereign Kingdom in Prussia beyond imperial jurisdiction."
 oe_cne.7.a:0 "Proclaim the Kingdom & Order of the Black Eagle"
 oe_cne.7.b:0 "Found the Royal Prussian Academy of Sciences"
 oe_cne.8.title:0 "The Soldier King's Canton System & Potsdam Giants"
 oe_cne.8.desc:0 "King Frederick William I strips away court extravagance, pours every thaler into the treasury and iron ramrods, divides the realm into regimental recruitment cantons, and drills the towering Potsdam Grenadiers."
 oe_cne.8.a:0 "Enact the Canton System & Muster the Potsdam Grenadiers"
 oe_cne.8.b:0 "Prioritize the General Directory & Crown Domains"
 oe_cne.9.title:0 "Frederick the Great: Silesian Wars & Sanssouci"
 oe_cne.9.desc:0 "Striking swiftly down the Oder with oblique-order columns while exchanging letters with European philosophers at Sanssouci, King Frederick II transforms Prussia into a first-rank Great Power."
 oe_cne.9.a:0 "Perfect the Oblique Order & Horse Artillery"
 oe_cne.9.b:0 "Patronize Sanssouci Philosophy & Legal Codification"
 oe_cne.10.title:0 "Junker Military State & Stein-Hardenberg Reforms"
 oe_cne.10.desc:0 "Revolutionary mass warfare shakes the old Frederician order, confronting Berlin with a historic choice: emancipate the peasantry and build a General Staff, or tighten traditional Junker officer command."
 oe_cne.10.a:0 "Enact the Stein-Hardenberg & General Staff Reforms"
 oe_cne.10.b:0 "Reinforce the Hereditary Junker Officer Corps"
 oe_cne.11.title:0 "Charles IV's Golden Bull & Prague University"
 oe_cne.11.desc:0 "From Hradcany Hill, King Charles IV crowns Prague as the stone jewel of Central Europe, securing Bohemia's premier electoral seat through the Golden Bull and opening Central Europe's first university."
 oe_cne.11.a:0 "Enshrine the Golden Bull & Electoral Primacy"
 oe_cne.11.b:0 "Endow Charles University & Stone Bridge Guilds"
 oe_cne.12.title:0 "Jan Hus & the Bethlehem Chapel"
 oe_cne.12.desc:0 "Thousands pack Prague's Bethlehem Chapel to hear Master Jan Hus preach in the Czech tongue against simony and indulgences, electrifying artisans, scholars, and knights across the crownlands."
 oe_cne.12.a:0 "Protect Vernacular Preaching & University Reform"
 oe_cne.12.b:0 "Mediate Between the Archbishop & Reform Masters"
 oe_cne.13.title:0 "First Defenestration of Prague & Hussite War Wagons"
 oe_cne.13.desc:0 "After angry citizens hurl royal councilors from New Town Hall windows, imperial crusades converge on Bohemia—yet one-eyed captain Jan Zizka turns armored farm wagons and hand cannons into mobile fortresses."
 oe_cne.13.a:0 "Adopt Zizka's Wagenburg & Hand-Cannon Doctrine"
 oe_cne.13.b:0 "Rally the Moderate Utraquist Lords & Town Militias"
 oe_cne.14.title:0 "The Compactata of Basel"
 oe_cne.14.desc:0 "Exhausted by years of crusades and counter-raids, representatives of the Bohemian Estates and the General Council at Basel sign the Compactata recognizing communion in both kinds across the realm."
 oe_cne.14.a:0 "Ratify the Compactata & Reopen Imperial Trade"
 oe_cne.14.b:0 "Maintain Strict Armed Vigilance Along the Passes"
 oe_cne.15.title:0 "George of Podebrady, the Hussite King"
 oe_cne.15.desc:0 "Elected by the Bohemian Diet from among native lords, King George of Podebrady strives to unite Catholic and Utraquist subjects alike while proposing an unprecedented league of Christian princes for European peace."
 oe_cne.15.a:0 "Champion the Pan-European Peace League"
 oe_cne.15.b:0 "Strengthen the Native Bohemian Royal Demesne"
 oe_cne.16.title:0 "The Kutna Hora Silver Boom & Joachimsthaler"
 oe_cne.16.desc:0 "Deep drainage galleries in Kutna Hora and the Ore Mountains tap rich new silver veins, pouring pure Prague groschen and Joachimsthalers into royal mints and European banking houses."
 oe_cne.16.a:0 "Standardize the Royal Silver Thaler Mint"
 oe_cne.16.b:0 "Invest Mining Wealth in Glassworks & Metallurgy"
 oe_cne.17.title:0 "Second Defenestration & the Thirty Years' War Spark"
 oe_cne.17.desc:0 "At Prague Castle, Protestant estates confront imperial regents over the Letter of Majesty, hurling them from the chancellery window and igniting a continental struggle across Central Europe."
 oe_cne.17.a:0 "Mobilize the Bohemian Estates Army & Confederation"
 oe_cne.17.b:0 "Seek Diplomatic Arbitration Among Imperial Electors"
 oe_cne.18.title:0 "Revival of the Bohemian Estates & Industrial Dawn"
 oe_cne.18.desc:0 "Eighteenth-century textile mills, porcelain kilns, and a Czech scholarly renaissance awaken new pride among the Bohemian Estates, blending ancient constitutional rights with modern enterprise."
 oe_cne.18.a:0 "Sponsor Bohemian Manufactories & Trade Guilds"
 oe_cne.18.b:0 "Restore the Historic Diet & Czech Literary Academy"
 oe_cne.19.title:0 "The Privilegium Maius & Archducal Dignity"
 oe_cne.19.desc:0 "Duke Rudolf IV unveils the bold charters of the Privilegium Maius in Vienna, claiming archducal rank equal to the Electors and founding Vienna's university to rival Prague."
 oe_cne.19.a:0 "Proclaim the Archduchy & Sovereign Dynastic Law"
 oe_cne.19.b:0 "Endow the University of Vienna & St. Stephen's Guilds"
 oe_cne.20.title:0 "Maximilian I: Tu Felix Austria Nube"
 oe_cne.20.desc:0 "While rival monarchs bleed their treasuries in endless wars, Maximilian of Habsburg weaves royal marriages with Burgundy, Castile, Aragon, Bohemia, and Hungary—turning diplomacy into an empire."
 oe_cne.20.a:0 "Weave the Grand Habsburg Marriage Network"
 oe_cne.20.b:0 "Raise Maximilian's Landsknecht Pike Regiments"
 oe_cne.21.title:0 "The First Siege of Vienna (1529)"
 oe_cne.21.desc:0 "Autumn rains hammer the Danubian plain as Ottoman siege columns ring Vienna's medieval walls; Count Niklas Salm rallies Spanish arquebusiers, German pikemen, and Vienna burghers to hold the Carinthian Gate."
 oe_cne.21.a:0 "Hold the Breaches & Rebuild Bastion Fortifications"
 oe_cne.21.b:0 "Rally Imperial Circle Relief Taxes & Volunteers"
 oe_cne.22.title:0 "Counter-Reformation & the Hofkriegsrat"
 oe_cne.22.desc:0 "To coordinate permanent wars on the Danube while restoring Catholic unity across the Hereditary Lands, Vienna establishes the Aulic War Council (Hofkriegsrat) alongside Jesuit colleges."
 oe_cne.22.a:0 "Empower the Hofkriegsrat Permanent War Council"
 oe_cne.22.b:0 "Sponsor Jesuit Colleges & Catholic Baroque Revival"
 oe_cne.23.title:0 "The Military Frontier (Militargrenze) on the Danube"
 oe_cne.23.desc:0 "Stretching from the Adriatic crags to the Banat marshes, Vienna charters free soldier-settler Grenzer regiments exempt from noble serfdom in exchange for lifelong border defense."
 oe_cne.23.a:0 "Charter Free Grenzer Soldier-Settler Regiments"
 oe_cne.23.b:0 "Build Watchtower Chains & Sanitary Quarantine Stations"
 oe_cne.24.title:0 "Prince Eugene of Savoy & the Liberation of Hungary"
 oe_cne.24.desc:0 "Dashing across the Tisza at Zenta and storming Belgrade, Prince Eugene of Savoy leads Habsburg cuirassiers and grenadiers to sweep the Danubian basin and reshape the map of Central Europe."
 oe_cne.24.a:0 "Unleash Prince Eugene's Cuirassier & Siege Offensive"
 oe_cne.24.b:0 "Resettlement Charter for the Danubian Plains"
 oe_cne.25.title:0 "Pragmatic Sanction & Maria Theresa's Reforms"
 oe_cne.25.desc:0 "With Europe's powers testing the Pragmatic Sanction, Empress Maria Theresa rallies the Hungarian Diet, establishes the Theresian Military Academy, and overhauls taxation across the Hereditary Lands."
 oe_cne.25.a:0 "Enact the Haugwitz Fiscal & Military Reforms"
 oe_cne.25.b:0 "Honor Provincial Estates & the Diplomatic Revolution"
 oe_cne.26.title:0 "Joseph II & Enlightened Absolutism"
 oe_cne.26.desc:0 "Restless and uncompromising, Emperor Joseph II issues the Patent of Toleration, curbs feudal serfdom, and opens Vienna's theaters and universities to merit—thrilling reformers while alarming traditional estates."
 oe_cne.26.a:0 "Press Forward with Josephinist Enlightened Edicts"
 oe_cne.26.b:0 "Pace Reforms with Constitutional Estate Consensus"
 oe_cne.27.title:0 "The Kalmar Union & Sound Toll Mastery"
 oe_cne.27.desc:0 "Representatives of Denmark, Norway, and Sweden assemble at Kalmar Castle to forge a united Nordic crown while Helsingor's cannon batteries assert royal customs over every keel entering the Baltic."
 oe_cne.27.a:0 "Enforce the Sound Dues & Nordic Royal Fleet"
 oe_cne.27.b:0 "Harmonize the Three Nordic Councils of the Realm"
 oe_cne.28.title:0 "Stockholm Bloodbath & Gustav Vasa's Independence"
 oe_cne.28.desc:0 "Blood stains Stortorget in Stockholm as unionist executions shock the North; in Dalarna's snows, Gustav Eriksson Vasa rallies miners and yeomen beneath a sovereign Swedish banner."
 oe_cne.28.a:0 "Rally Free Yeomen & Assert Sovereign Monarchy"
 oe_cne.28.b:0 "Negotiate Hanseatic Credit & Maritime Truce"
 oe_cne.29.title:0 "Gustavus Adolphus: Lion of the North & Military Revolution"
 oe_cne.29.desc:0 "Landing on the Pomeranian coast with disciplined blue-and-yellow brigades, lightweight leather-and-bronze regimental guns, and shock cavalry, King Gustavus Adolphus unveils combined-arms modern warfare."
 oe_cne.29.a:0 "Perfect Combined-Arms Salvo & Regimental Artillery"
 oe_cne.29.b:0 "Empower Oxenstierna's Administrative Colleges"
 oe_cne.30.title:0 "Swedish Baltic Dominium Maris Baltici"
 oe_cne.30.desc:0 "With river mouths from Stettin and Wismar to Riga and Narva flying the blue cross, Stockholm stands master of the Baltic Sea and arbiter of Northern Europe."
 oe_cne.30.a:0 "Lock the Baltic River Mouths & Naval Dockyards"
 oe_cne.30.b:0 "Enact the Great Reduction & Allotment System"
 oe_cne.31.title:0 "Danish Absolute Monarchy: The Kongeloven (1665)"
 oe_cne.31.desc:0 "Backed by Copenhagen's heroic burghers and the Lutheran clergy after the siege of the capital, King Frederick III promulgates the Lex Regia (Kongeloven), Europe's clearest written constitution of absolute monarchy."
 oe_cne.31.a:0 "Promulgate the Kongeloven & Central Admiralty"
 oe_cne.31.b:0 "Expand Copenhagen & Bergen Royal Trade Companies"
 oe_cne.32.title:0 "The Great Northern War: Caroleans & Poltava"
 oe_cne.32.desc:0 "A ring of Baltic rivals strikes simultaneously at the turn of the century, thrusting Sweden's fierce bayonet-charging Caroleans and Denmark's North Sea squadrons into a twenty-year struggle for the North."
 oe_cne.32.a:0 "Unleash Carolean Shock Tactics & Relentless Offensives"
 oe_cne.32.b:0 "Fortify Nordic Home Waters & Coastal Skargardsflottan"
 oe_cne.33.title:0 "The Age of Liberty Parliament (Frihetstiden)"
 oe_cne.33.desc:0 "After the exhaustion of royal autocracy, the Four Estates of the Riksdag assume sovereign authority in Stockholm; rival Hats and Caps parties debate mercantilist manufactories, press freedom, and scientific academies."
 oe_cne.33.a:0 "Support the Hats: Ironworks, East India Trade & Science"
 oe_cne.33.b:0 "Support the Caps: Agrarian Thrift & Press Liberty"
 oe_cne.34.title:0 "Nordic Enlightenment & the League of Armed Neutrality"
 oe_cne.34.desc:0 "While great maritime empires clash across the Atlantic, Nordic courts champion agricultural enclosure, peasant emancipation, scientific academies, and armed naval convoys defending neutral shipping."
 oe_cne.34.a:0 "Commission the League of Armed Neutrality Convoys"
 oe_cne.34.b:0 "Enact Agrarian Emancipation & Royal Academies"
 oe_cne.35.title:0 "Louis the Great & the Angevin Golden Age"
 oe_cne.35.desc:0 "Under the chivalric banner of the Angevin lilies and Arpad stripes, King Louis the Great commands Europe's richest gold mines in Upper Hungary, charters Pecs University, and projects royal authority from the Adriatic to the Carpathians."
 oe_cne.35.a:0 "Mint the Golden Forint & Expand Carpathian Mines"
 oe_cne.35.b:0 "Codify the Entailment Law & Noble Banderial Hosts"
 oe_cne.36.title:0 "John Hunyadi's Long Campaign & Siege of Belgrade (1456)"
 oe_cne.36.desc:0 "As Ottoman siege cannons shatter Belgrade's outer bastions, Regent John Hunyadi breaks the Danube river blockade with armored boats and leads a blazing counter-assault that rings the noon church bells across all Christendom."
 oe_cne.36.a:0 "Hold the Danubian Fortress Line & River Flotilla"
 oe_cne.36.b:0 "Integrate Frontier Hussars & Wagon-Fort Tactics"
 oe_cne.37.title:0 "Matthias Corvinus: The Black Army & Bibliotheca Corviniana"
 oe_cne.37.desc:0 "King Matthias Corvinus taxes every hearth fairly to pay the first permanent standing mercenary host in Central Europe—the fearsome Black Army—while turning Buda Palace into a dazzling Renaissance sanctuary of illuminated manuscripts."
 oe_cne.37.a:0 "Forge the Standing Black Army (Fekete Sereg)"
 oe_cne.37.b:0 "Endow the Bibliotheca Corviniana & Buda Humanists"
 oe_cne.38.title:0 "The Peasants' Crusade of Gyorgy Dozsa"
 oe_cne.38.desc:0 "Gathered on the plains of Pest for a papal crusade, tens of thousands of impoverished serfs led by Szekely captain Gyorgy Dozsa turn their scythes and muskets against oppressive magnate estates."
 oe_cne.38.a:0 "Curb Magnate Abuses & Charter Free Royal Towns"
 oe_cne.38.b:0 "Enact Werboczy's Tripartitum & Noble Militia Law"
 oe_cne.39.title:0 "The Battle of Mohacs Crisis (1526)"
 oe_cne.39.desc:0 "On the marshy plain beside Mohacs, a vastly outnumbered Hungarian knightly host faces massed Ottoman janissaries and chained field artillery—threatening the very survival of the medieval Crown of Saint Stephen."
 oe_cne.39.a:0 "Wait for Transylvanian Reinforcements & Dig In"
 oe_cne.39.b:0 "Rally the Great Christian Coalition & Border Castles"
 oe_cne.40.title:0 "Rakoczi's Independence & the Hungarian Diet Revival"
 oe_cne.40.desc:0 "Under banners stitched with 'Pro Patria et Libertate', Prince Francis II Rakoczi unites Kuruc light horse, frontier counties, and the Hungarian Diet to champion constitutional liberty and Magyar national revival."
 oe_cne.40.a:0 "Unleash the Kuruc Hussars & Pro Patria et Libertate"
 oe_cne.40.b:0 "Affirm the Hungarian Diet & Constitutional Compromise"
 oe_cne.41.title:0 "Return from Avignon & Healing the Western Schism"
 oe_cne.41.desc:0 "After seven decades beside the Rhone, papal galleys anchor at Ostia and the Pontiff enters Rome in triumph—yet rival claimants threaten Christendom unless the Curia heals the Western Schism."
 oe_cne.41.a:0 "Restore the Roman See & Convene the Unifying Council"
 oe_cne.41.b:0 "Audit Curial Annates & Rebuild the Roman Patrimony"
 oe_cne.42.title:0 "Medici Banking & the Florentine Platonic Academy"
 oe_cne.42.desc:0 "Bills of exchange drawn on Florence's gold florin finance princes from London to Rome, while Cosimo and Lorenzo de' Medici gather Greek refugees, painters, and philosophers to ignite the Italian Renaissance."
 oe_cne.42.a:0 "Patronize the Platonic Academy & Renaissance Masters"
 oe_cne.42.b:0 "Expand the Medici Continental Banking Network"
 oe_cne.43.title:0 "The Peace of Lodi & Italian Balance of Power"
 oe_cne.43.desc:0 "Wearied by decades of condottieri wars, Milan, Venice, Florence, Naples, and the Papacy sign the Peace of Lodi, pioneering resident embassies and the European balance-of-power system."
 oe_cne.43.a:0 "Establish Permanent Resident Embassies & the Italic League"
 oe_cne.43.b:0 "Reform Condottieri Contracts & Citadel Artillery"
 oe_cne.44.title:0 "Borgia Intrigue & Julius II, the Warrior Pope"
 oe_cne.44.desc:0 "As French and Spanish armies march across Italy, the Papacy casts aside timidity—consolidating Romagna, founding the Pontifical Swiss Guard, and donning armor at the siege of Mirandola to preserve Italian independence."
 oe_cne.44.a:0 "Raise the Pontifical Swiss Guard & Lead the Holy League"
 oe_cne.44.b:0 "Commission the Sistine Ceiling & Vatican Museums"
 oe_cne.45.title:0 "St. Peter's Basilica & the Council of Trent"
 oe_cne.45.desc:0 "Beneath Michelangelo's rising dome in Rome and within the solemn halls of Trent, the Catholic Church answers the Reformation with clear doctrine, reformed seminaries, global Jesuit missions, and architectural splendor."
 oe_cne.45.a:0 "Promulgate the Tridentine Decrees & Global Missions"
 oe_cne.45.b:0 "Complete St. Peter's Dome & Baroque Roman Urbanism"
 oe_cne.46.title:0 "Savoyard Alpine Gatekeepers of Turin"
 oe_cne.46.desc:0 "Moving his court across the mountains from Chambery to Turin, Duke Emmanuel Philibert fortifies the Alpine passes, builds a modern citadel, and transforms Savoy-Piedmont into the iron hinge between France and Italy."
 oe_cne.46.a:0 "Fortify the Alpine Passes & Turin Citadel"
 oe_cne.46.b:0 "Leverage Alpine Tolls & Franco-Imperial Diplomacy"
 oe_cne.47.title:0 "Piedmontese Military Modernization & Royal Crowns"
 oe_cne.47.desc:0 "Emerging from the War of the Spanish Succession with a royal crown and expanded Italian territories, Turin and Naples reorganize their royal regiments, artillery schools, and administrative cadastres on cutting-edge European models."
 oe_cne.47.a:0 "Establish Royal Artillery Schools & Elite Grenadiers"
 oe_cne.47.b:0 "Conduct the Royal Cadastre & Mediterranean Port Reform"
 oe_cne.48.title:0 "Dawn of the Risorgimento"
 oe_cne.48.desc:0 "Across Milan, Turin, Florence, Rome, and Naples, newspapers, opera houses, and civic militias awaken a soaring dream: uniting the fractured states of the peninsula into a single sovereign Italian nation."
 oe_cne.48.a:0 "Embrace Constitutional Unification & Civic Volunteers"
 oe_cne.48.b:0 "Forge an Italian Customs Union & Diplomatic Confederation"
