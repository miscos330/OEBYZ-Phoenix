l_english:
# NEW 2026-11-21 v10.5 Worker 3: Nova Elysia Faith, Western Pantheon & Military (oe_eln_). Generated by gen_elysia_faith_military.py.
 oe_eln_sol_hesperius_god:0 "Helios-Sol Hesperius"
 oe_eln_sol_hesperius_god.latin_language:0 "Sol Invictus Hesperius"
 oe_eln_sol_hesperius_god_desc:0 "[ShowGodNameWithNoTooltip('oe_eln_sol_hesperius_god')] is the unconquered sun of the western horizon, enshrined by the Romans of Nova Elysia beyond the Atlantic. Carrying the radiance of Constantine's Porphyry Column across the ocean, he illuminates frontier governance, pioneering voyages, and classical learning across Hesperia."
 oe_eln_sol_hesperius_god_omen:0 "Crimson sunset gold pours over the waters of the Chesapeake and the marble colonnades of Nea Konstantinoupolis as bronze tripods send incense skyward. [ShowGodName('oe_eln_sol_hesperius_god')] casts his unconquered western light across Nova Elysia..."
 oe_eln_omen_sol_hesperius_western_horizon:0 "Writs of the Western Horizon"
 oe_eln_omen_sol_hesperius_western_horizon_desc:0 "The setting sun's radiance pierces river valley and woodland alike, carrying imperial writs and civic order to every frontier settlement."
 oe_eln_omen_sol_hesperius_new_world_frontier:0 "Hesperian Frontier Dawn"
 oe_eln_omen_sol_hesperius_new_world_frontier_desc:0 "Following the westward track of the sun, Elysian charters and settlers press ever further along the shores and river valleys of the New World."
 oe_eln_omen_sol_hesperius_atlantic_academy:0 "Illumination of the Atlantic Academy"
 oe_eln_omen_sol_hesperius_atlantic_academy_desc:0 "Classical manuscripts rescued from the Queen of Cities flourish beneath solar colonnades, accelerating research and lifting civic literacy across Nova Elysia."
 oe_eln_omen_sol_hesperius_golden_maize:0 "Harvest of Golden Maize"
 oe_eln_omen_sol_hesperius_golden_maize_desc:0 "Bountiful western sunlight ripens broad fields of golden maize and hardy rye, filling imperial granaries and swelling colonial growth."
 oe_eln_omen_sol_hesperius_purple_zenith:0 "Zenith of the Purple Diadem"
 oe_eln_omen_sol_hesperius_purple_zenith_desc:0 "Though an ocean separates New Rome from the Bosporus, Sol Invictus confirms the lawful majesty of the purple throne above every estate."
 oe_eln_oceanus_neptune_god:0 "Oceanus-Poseidon"
 oe_eln_oceanus_neptune_god.latin_language:0 "Neptune-Oceanus"
 oe_eln_oceanus_neptune_god_desc:0 "[ShowGodNameWithNoTooltip('oe_eln_oceanus_neptune_god')] unites primeval Oceanus, lord of the world-encircling stream, with trident-bearing Roman Neptune. By his favor the exiled fleet survived the Sargasso tempest to reach Nova Elysia, and under his gaze copper-clad galleons command the Atlantic."
 oe_eln_oceanus_neptune_god_omen:0 "Rolling swells break against the bronze-capped breakwater of Chrysokeras Hesperias as dolphins crest through sea mist and copper-hulled galleons sound their horns. [ShowGodName('oe_eln_oceanus_neptune_god')] calms the ocean lanes for the fleets of Nova Elysia..."
 oe_eln_omen_oceanus_gulf_stream:0 "Currents of the Gulf Stream"
 oe_eln_omen_oceanus_gulf_stream_desc:0 "Oceanus reveals the warm currents and trade winds of the Atlantic, stretching naval reach and easing maritime governance across open sea."
 oe_eln_omen_oceanus_trident_broadside:0 "Broadside of the Trident"
 oe_eln_omen_oceanus_trident_broadside_desc:0 "Copper-clad ships of the line surge forward beneath Neptune's trident, redoubling heavy broadside power and fleet morale."
 oe_eln_omen_oceanus_atlantic_emporium:0 "Emporium of the Atlantic"
 oe_eln_omen_oceanus_atlantic_emporium_desc:0 "Merchant fleets link Chesapeake harbors with Caribbean and mid-Atlantic lanes, raising sea trade efficiency and commercial clout."
 oe_eln_omen_oceanus_corsair_escort:0 "Escort & Capture of the Deep"
 oe_eln_omen_oceanus_corsair_escort_desc:0 "Elysian squadrons versed in every shoal and strait tighten naval blockades and seize rival vessels intact upon the high seas."
 oe_eln_omen_oceanus_thalassic_accord:0 "Thalassic Accord"
 oe_eln_omen_oceanus_thalassic_accord_desc:0 "Envoys sailing under Neptune's standard project steady maritime authority and command diplomatic respect on both sides of the ocean."
 oe_eln_interpretatio_hesperia_aspect:0 "Interpretatio Hesperia"
 oe_eln_interpretatio_hesperia_aspect_desc:0 "Extending classical Interpretatio Romana across the Atlantic, this syncretic doctrine honors indigenous Great Spirit and woodland deities alongside the Olympians, easing religious friction, widening cultural capacity, and quickening peaceful integration."
 oe_eln_thalassocracy_neptune_aspect:0 "Thalassocracy of Neptune"
 oe_eln_thalassocracy_neptune_aspect_desc:0 "Consecrating Nea Konstantinoupolis and Chrysokeras Hesperias as sacred fleet basins of Neptune-Oceanus, this maritime rite strengthens heavy warships, sea trade, colonial reach, and oceanic presence across the Atlantic."
 oe_eln_temple_atlantic_pantheon:0 "Atlantic Pantheon of Hesperia"
 oe_eln_temple_atlantic_pantheon_desc:0 "A domed colonnaded sanctuary rising in the capital of Nova Elysia, consecrating the classical Roman gods alongside Sol Invictus Hesperius and Neptune-Oceanus. It anchors pontifical learning, civic authority, and classical culture across the Atlantic."
 oe_eln_temple_atlantic_pantheon_maint:0 "Atlantic Pantheon of Hesperia (Upkeep)"
 oe_eln_chalybopolis_arsenal:0 "Chalybopolis Pyrophoroi Arsenal"
 oe_eln_chalybopolis_arsenal_desc:0 "An imperial foundry complex raised beside the Chesapeake iron beds by exiled Constantinopolitan artificers, fusing Greek Fire ignition compounds with New World gunpowder and rifled barrels to equip Pyrophoroi regiments and fortify local muster capacity."
 oe_eln_chalybopolis_arsenal_maint:0 "Chalybopolis Pyrophoroi Arsenal (Upkeep)"
 oe_eln_chesapeake_breakwater:0 "Chesapeake Golden Horn Breakwater & Copper Drydock"
 oe_eln_chesapeake_breakwater_desc:0 "A massive stone breakwater and copper-sheathing drydock modeled on Constantinople's Golden Horn. It transforms Chesapeake marshlands into a sheltered deep-water naval basin while accelerating sailor recruitment and copper-clad warship construction."
 oe_eln_chesapeake_breakwater_maint:0 "Chesapeake Breakwater & Copper Drydock (Upkeep)"
 oe_eln_foederati_rangers:0 "Hesperian Foederati Rangers"
 oe_eln_foederati_rangers_desc:0 "Light frontier skirmishers raised jointly from exiled Greek scouts and Chesapeake-Powhatan Foederati hunters. Swift, lightly supplied, and deadly in forest, woods, and wetlands across the North American marches."
 oe_eln_pyrophoroi_musketeers:0 "Pyrophoroi Musketeers"
 oe_eln_pyrophoroi_musketeers_desc:0 "Masterwork of the Chalybopolis Arsenal: heavy Reformation-era musketeers coupling ancient Greek Fire ignition tubes and incendiary charges with New World saltpeter volleys to shatter enemy morale."
 oe_eln_imperial_pyrophoroi:0 "Imperial Pyrophoroi Guards"
 oe_eln_imperial_pyrophoroi_desc:0 "Standing Absolutism-era guards of Nova Elysia arrayed in purple-and-gold facings with standardized incendiary flintlocks and bayonets, uniting classical Roman steadiness with devastating volley fire."
 oe_eln_hesperian_carrack:0 "Hesperian Carrack"
 oe_eln_hesperian_carrack_desc:0 "A high-freeboard oceanic carrack engineered from hard-won Atlantic crossing experience, built with sturdy Chesapeake oak timbers for superior speed, hull endurance, and broadside weight."
 oe_eln_copper_galleon:0 "Chesapeake Copper-Clad Galleon"
 oe_eln_copper_galleon_desc:0 "Flagship of the Elysian Admiralty: framed in Chesapeake white oak, sheathed below the waterline in corrosion-resistant copper plates, and armed with bow Greek Fire siphons alongside heavy broadside batteries."
 oe_eln_adv_foederati_rangers:0 "Hesperian Foederati Ranger Doctrine"
 oe_eln_adv_foederati_rangers_desc:0 "Integrates Chesapeake and Powhatan woodland tracking with matchlock skirmish tactics, unlocking elite Hesperian Foederati Rangers."
 oe_eln_adv_hesperian_carrack:0 "Hesperian Oceanic Carrack Design"
 oe_eln_adv_hesperian_carrack_desc:0 "Pairs Byzantine hydrography with sturdy Chesapeake timber framing to build Hesperian Carracks tailored for open-Atlantic endurance."
 oe_eln_adv_pyrophoroi:0 "Chalybopolis Pyrophoroi Firearms"
 oe_eln_adv_pyrophoroi_desc:0 "Merges rescued Greek Fire alchemy with Chalybopolis gunsmithing to field fearsome Pyrophoroi Musketeer regiments."
 oe_eln_adv_copper_galleon:0 "Chesapeake Copper-Clad Galleon Architecture"
 oe_eln_adv_copper_galleon_desc:0 "Standardizes copper-plate hull sheathing and bow siphon projectors across Chesapeake shipyards, unlocking Copper-Clad Galleons."
 oe_eln_adv_imperial_pyrophoroi:0 "Imperial Pyrophoroi Line Regulations"
 oe_eln_adv_imperial_pyrophoroi_desc:0 "Codifies standardized flintlock incendiary cartridges and linear volley drill for the elite Imperial Pyrophoroi Guards of Nova Elysia."
 STATIC_MODIFIER_NAME_oe_eln_mod_orthodox_foundation:0 "Western Orthodox Foundation"
 STATIC_MODIFIER_DESC_oe_eln_mod_orthodox_foundation:0 "Nea Konstantinoupolis upholds the ancient Orthodox liturgy across the ocean, strengthening true-faith harmony and conversion zeal."
 STATIC_MODIFIER_NAME_oe_eln_western_patriarchate_mod:0 "Western Ecumenical Patriarchate"
 STATIC_MODIFIER_DESC_oe_eln_western_patriarchate_mod:0 "The Western Ecumenical See of Nea Konstantinoupolis anchors Atlantic Orthodox monasteries, public literacy, and imperial cohesion."
 STATIC_MODIFIER_NAME_oe_eln_missionary_frontier_loc_mod:0 "Chesapeake Missionary Skete"
 STATIC_MODIFIER_DESC_oe_eln_missionary_frontier_loc_mod:0 "A frontier Orthodox monastery and scriptorium on the Chesapeake, quickening local conversion, clerical learning, and civic prosperity."
 STATIC_MODIFIER_NAME_oe_eln_pure_greek_liturgy_mod:0 "Pure Greek Liturgical Canon"
 STATIC_MODIFIER_DESC_oe_eln_pure_greek_liturgy_mod:0 "Upholding the classical Greek canon and iconography of Constantinople strengthens dynastic legitimacy, stability, and cultural tradition."
 STATIC_MODIFIER_NAME_oe_eln_bilingual_liturgy_mod:0 "Greek-Algonquian Bilingual Liturgy"
 STATIC_MODIFIER_DESC_oe_eln_bilingual_liturgy_mod:0 "Following the precedent of Saints Cyril and Methodius, translating liturgy into Algonquian tongues accelerates New World conversion and cultural integration."
 STATIC_MODIFIER_NAME_oe_eln_mod_hesperian_revival:0 "Hesperian Classical Revival"
 STATIC_MODIFIER_DESC_oe_eln_mod_hesperian_revival:0 "Exiled philosophers and priests renew classical Roman rites beyond the Atlantic, sharpening omens and scholarly inquiry."
 STATIC_MODIFIER_NAME_oe_eln_mod_oceanus_consecration:0 "Consecration of Neptune-Oceanus"
 STATIC_MODIFIER_DESC_oe_eln_mod_oceanus_consecration:0 "The consecration of Neptune-Oceanus into the Western Pantheon empowers Elysian heavy warships, naval range, and oceanic presence."
 STATIC_MODIFIER_NAME_oe_eln_mod_sol_hesperius_radiance:0 "Radiance of Sol Hesperius"
 STATIC_MODIFIER_DESC_oe_eln_mod_sol_hesperius_radiance:0 "Enthroned in the administrative pillar, Sol Invictus Hesperius steadies provincial control, colonial reach, and imperial scholarship."
 STATIC_MODIFIER_NAME_oe_eln_atlantic_sanctuary_loc_mod:0 "Precinct of the Atlantic Pantheon"
 STATIC_MODIFIER_DESC_oe_eln_atlantic_sanctuary_loc_mod:0 "Marble altars and philosophical porticoes surrounding the Atlantic Pantheon elevate local cultural tradition, literacy, and prosperity."
 STATIC_MODIFIER_NAME_oe_eln_mod_interpretatio_hesperia:0 "Charter of Interpretatio Hesperia"
 STATIC_MODIFIER_DESC_oe_eln_mod_interpretatio_hesperia:0 "Recognizing indigenous spirits and Olympian deities as kin under Interpretatio Romana fosters deep tolerance, steady harvests, and cultural fusion."
 STATIC_MODIFIER_NAME_oe_eln_mod_western_orthopraxy:0 "Western Capitoline Orthopraxy"
 STATIC_MODIFIER_DESC_oe_eln_mod_western_orthopraxy:0 "Enforcing strict Capitoline ritual law in the West magnifies omen potency, religious influence, conversion speed, and legionary discipline."
 STATIC_MODIFIER_NAME_oe_eln_mod_symmachus_charter:0 "Atlantic Charter of Symmachus"
 STATIC_MODIFIER_DESC_oe_eln_mod_symmachus_charter:0 "'Not by one path alone can so great a mystery be reached'—Nova Elysia welcomes diverse creeds, drawing overseas migrants and scholarly talent."
 STATIC_MODIFIER_NAME_oe_eln_mod_atlantic_sanctuary:0 "Atlantic Free Sanctuary Ports"
 STATIC_MODIFIER_DESC_oe_eln_mod_atlantic_sanctuary:0 "Sanctuary harbors protected by the Edict of Symmachus attract persecuted scholars, printers, and artisans from across Europe, lifting literacy and research."
 STATIC_MODIFIER_NAME_oe_eln_mod_civic_conscience:0 "Civic Conscience & Maritime Peace"
 STATIC_MODIFIER_DESC_oe_eln_mod_civic_conscience:0 "A balanced covenant of public law and conscience taxation preserves religious peace while enriching Elysian maritime commerce and prosperity."
 STATIC_MODIFIER_NAME_oe_eln_mod_pyrophoroi_doctrine:0 "Chalybopolis Pyrophoroi Doctrine"
 STATIC_MODIFIER_DESC_oe_eln_mod_pyrophoroi_doctrine:0 "Mass-producing Greek Fire ignition muskets and incendiary charges elevates heavy infantry prowess, morale, and siegecraft at steeper army upkeep."
 STATIC_MODIFIER_NAME_oe_eln_mod_pyrophoroi_elite_guard:0 "Secret Imperial Pyrophoroi Charter"
 STATIC_MODIFIER_DESC_oe_eln_mod_pyrophoroi_elite_guard:0 "Guarding the Greek Fire formula for select imperial regiments strengthens discipline, morale, and ongoing ordnance research without straining upkeep."
 STATIC_MODIFIER_NAME_oe_eln_chalybopolis_foundry_loc_mod:0 "Chalybopolis Royal Gun-Foundry"
 STATIC_MODIFIER_DESC_oe_eln_chalybopolis_foundry_loc_mod:0 "Blazing iron furnaces and alchemical workshops turn the district into Nova Elysia's premier arsenal, lifting local production and manpower."
 STATIC_MODIFIER_NAME_oe_eln_mod_copper_admiralty:0 "Chesapeake Copper-Keel Admiralty"
 STATIC_MODIFIER_DESC_oe_eln_mod_copper_admiralty:0 "Centering the navy on copper-sheathed galleons magnifies heavy ship firepower, naval morale, and Atlantic range at higher fleet upkeep."
 STATIC_MODIFIER_NAME_oe_eln_mod_atlantic_convoy_doctrine:0 "Atlantic Armed Convoy Doctrine"
 STATIC_MODIFIER_DESC_oe_eln_mod_atlantic_convoy_doctrine:0 "Deploying fast copper-bottomed escorts along transatlantic trade lanes accelerates shipbuilding while boosting sea trade and maritime presence."
 STATIC_MODIFIER_NAME_oe_eln_copper_shipyard_loc_mod:0 "Chesapeake Copper-Sheathing Yards"
 STATIC_MODIFIER_DESC_oe_eln_copper_shipyard_loc_mod:0 "Imperial slipways dedicated to white-oak framing and copper hull plating dramatically accelerate shipbuilding and sailor musters."
 STATIC_MODIFIER_NAME_oe_eln_pyrophoroi_fleet_readiness_mod:0 "Elysian Joint Pyrophoroi & Fleet Trials"
 STATIC_MODIFIER_DESC_oe_eln_pyrophoroi_fleet_readiness_mod:0 "Joint live-fire exercises combining Pyrophoroi volleys and Copper-Clad Galleon broadsides hone discipline, naval morale, and military readiness."
 oe_eln_human_only_tt:0 "Available only to a player-controlled Nova Elysia"
 oe_eln_drills_cd_tt:0 "At least 10 years have elapsed since the last joint Pyrophoroi and fleet trials"
 oe_eln_dec_choose_faith_path.title:0 "Convoke the Council of Three Faiths in Nova Elysia"
 oe_eln_dec_choose_faith_path.desc:0 "Having raised Nea Konstantinoupolis upon the Chesapeake, Senate and clergy debate the spiritual destiny of Nova Elysia: Western Ecumenical Orthodoxy, the Atlantic Pantheon of Religio Romana, or the tolerant Atlantic Edict of Symmachus."
 oe_eln_dec_choose_faith_path.a:0 "Preside over the Elysian Faith Council"
 oe_eln_dec_choose_faith_path_tt:0 "Immediately triggers the Three Paths of Faith choice for Nova Elysia (Western Ecumenical Orthodoxy, Nova Elysia Religio Romana, or the Atlantic Edict of Symmachus)."
 oe_eln_dec_western_pantheon.title:0 "Convene the Western Pantheon Consecration Hall"
 oe_eln_dec_western_pantheon.desc:0 "Seat or unseat Nova Elysia's New World deities—Sol Invictus Hesperius (ADM) and Neptune-Oceanus (DIP)—while strictly preserving the 6-god Hexapantheon cap (2 ADM + 2 DIP + 2 MIL) and seamless harmony with the Capitoline Hexapantheon."
 oe_eln_dec_western_pantheon.a:0 "Enter the Atlantic Pantheon Hall"
 oe_eln_dec_western_pantheon_tt:0 "Opens the Western Pantheon seat-swapper to consecrate or withdraw New World deities while strictly maintaining at most 6 active gods."
 oe_eln_dec_join_atlantic_pontificate.title:0 "Link the Atlantic Sanctuaries to the Collegium Pontificum"
 oe_eln_dec_join_atlantic_pontificate.desc:0 "Establish or join the Collegium Pontificum from Nea Konstantinoupolis, uniting the sanctuaries of Nova Elysia under the classical pontifical order."
 oe_eln_dec_join_atlantic_pontificate.a:0 "Consecrate the Western Pontifical Seat"
 oe_eln_dec_join_atlantic_pontificate_tt:0 "Creates or joins the Collegium Pontificum international organization and grants religious influence."
 oe_eln_dec_pyrophoroi_drills.title:0 "Hold Chalybopolis Pyrophoroi & Copper-Clad Fleet Trials"
 oe_eln_dec_pyrophoroi_drills.desc:0 "Assemble Pyrophoroi regiments and Chesapeake Copper-Clad Galleons off the anchorage for live-fire joint maneuvers, honing Nova Elysia's land and naval edge."
 oe_eln_dec_pyrophoroi_drills.a:0 "Fund the Atlantic Joint Maneuvers"
 oe_eln_dec_pyrophoroi_drills_tt:0 "Spends treasury gold to hold joint live-fire maneuvers, granting 8 years of enhanced discipline, morale, and heavy ship power alongside army and navy tradition."
 oe_eln.3.title:0 "Altars of the New World: Three Paths of Faith"
 oe_eln.3.desc:0 "Stone walls now guard Nea Konstantinoupolis above the Chesapeake, yet the exiled empire must still decide what spirit will animate New Rome across the ocean. Bishops rescued from Constantinople urge the consecration of a Western Ecumenical Patriarchate; classical scholars carrying manuscripts from Mistra call for reviving Religio Romana and enshrining the gods of sun and ocean who saw the fleet safely ashore; and pragmatic senators invoke Symmachus, pleading for an Atlantic charter of religious toleration."
 oe_eln.3.a:0 "Western Ecumenical Orthodoxy: Raise the New Patriarchate"
 oe_eln.3.a.tt:0 "Locks Path A (Western Ecumenical Orthodoxy), upholding Orthodox Christianity and unlocking the Western Patriarchate and Bilingual Liturgy event chain."
 oe_eln.3.b:0 "Nova Elysia Religio Romana: Raise the Atlantic Pantheon"
 oe_eln.3.b.tt:0 "Locks Path B (Nova Elysia Religio Romana), converting to Religio Romana, joining the Collegium Pontificum while strictly keeping 6 active gods, and unlocking the Western Pantheon deities and aspects."
 oe_eln.3.c:0 "Atlantic Edict of Symmachus: A Realm of Broad Toleration"
 oe_eln.3.c.tt:0 "Locks Path C (Atlantic Edict of Symmachus), keeping your current faith while proclaiming broad religious toleration and unlocking the Atlantic Sanctuary Ports chain."
 oe_eln.4.title:0 "Enthronement of the Patriarch of Nea Konstantinoupolis"
 oe_eln.4.desc:0 "Beneath timber arches of Chesapeake white oak in the new Cathedral of Holy Wisdom, bells ring across the morning tide as exiled bishops chant 'Axios!' and enthrone the first Patriarch of Nea Konstantinoupolis and All Hesperia. With the Western Ecumenical See established, the Orthodox Church stands ready to anchor Elysian society and send missions inland."
 oe_eln.4.a:0 "Establish the Western Patriarchate as Supreme See"
 oe_eln.4.a.tt:0 "Grants the permanent Western Ecumenical Patriarchate modifier, enhancing true-faith tolerance, conversion speed, literacy ceiling, and stability efficiency."
 oe_eln.4.b:0 "Dispatch Frontier Missionary Monasteries Inland"
 oe_eln.4.b.tt:0 "Establishes the Western Ecumenical Patriarchate while founding a missionary skete in the capital and pleasing the clergy estate."
 oe_eln.5.title:0 "Atlantic Icons and Bilingual Liturgy"
 oe_eln.5.desc:0 "As daily contact deepens with neighboring Chesapeake and woodland peoples, the synod of Nea Konstantinoupolis divides over liturgical form. Traditionalists insist that preserving pure Greek liturgy alone will guard Roman heritage far from home; frontier monks cite Saints Cyril and Methodius, urging Greek-Algonquian bilingual services to draw native communities peacefully into the fold."
 oe_eln.5.a:0 "Uphold the Pure Greek Liturgical Canon"
 oe_eln.5.a.tt:0 "Grants the permanent Pure Greek Liturgical Canon modifier, raising legitimacy, stability efficiency, true-faith tolerance, and cultural tradition."
 oe_eln.5.b:0 "Adopt Greek-Algonquian Bilingual Liturgy"
 oe_eln.5.b.tt:0 "Grants the permanent Greek-Algonquian Bilingual Liturgy modifier, boosting conversion, assimilation, heathen tolerance, and cultural capacity while tolerating Nansemond culture."
 oe_eln.6.title:0 "Pantheon of Hesperia: Consecration of Neptune-Oceanus"
 oe_eln.6.desc:0 "Priests and admirals gather along the jetty of Chrysokeras Hesperias to pour libations into the Atlantic tide. They proclaim that the exiled ark survived the Sargasso tempest by the favor of Neptune-Oceanus, sovereign of the world-encircling sea. Today the Collegium enrolls Oceanus-Neptune among the New World deities and opens the Thalassocracy of Neptune aspect."
 oe_eln.6.a:0 "Seat Neptune-Oceanus in the DIP Pillar Now"
 oe_eln.6.a.tt:0 "Unlocks and immediately seats Neptune-Oceanus into the DIP pillar (strictly preserving the 6-god cap) and grants a 20-year maritime blessing."
 oe_eln.6.b:0 "Enroll Neptune-Oceanus for Future Seating"
 oe_eln.6.b.tt:0 "Unlocks Neptune-Oceanus and the Thalassocracy of Neptune aspect without changing your current 6 seated gods, granting navy tradition and prestige."
 oe_eln.7.title:0 "Sol Invictus of the Western Horizon"
 oe_eln.7.desc:0 "At each summer solstice, molten sunset pours across the Appalachian ridges onto the Chesapeake, recalling Constantine's Porphyry Column in distant New Rome. Senate and Collegium resolve to raise the grand Atlantic Pantheon of Hesperia in the capital and consecrate Sol Invictus Hesperius as patron of western governance, pioneering, and enlightenment."
 oe_eln.7.a:0 "Seat Sol Invictus Hesperius in the ADM Pillar"
 oe_eln.7.a.tt:0 "Unlocks the Atlantic Pantheon building, safely seats Sol Invictus Hesperius in the ADM pillar (strictly keeping 6 active gods), and grants a 20-year solar blessing."
 oe_eln.7.b:0 "Preserve Current ADM Pillar & Dedicate the Precinct"
 oe_eln.7.b.tt:0 "Unlocks Sol Invictus Hesperius and the Atlantic Pantheon building without altering your current 6 gods, granting a 25-year sanctuary modifier to the capital."
 oe_eln.8.title:0 "Interpretatio Romana: The Great Spirit and the Olympians"
 oe_eln.8.desc:0 "Elysian philosophers visiting Powhatan and Chesapeake councils return with striking reports: native reverence for the Great Spirit and the guardians of river, forest, and harvest echoes ancient Roman numina and Interpretatio Romana. The Collegium debates whether to weave Hesperian spirits into a syncretic Western Pantheon or uphold strict classical Capitoline orthopraxy."
 oe_eln.8.a:0 "Proclaim Interpretatio Hesperia Syncretism"
 oe_eln.8.a.tt:0 "Unlocks the Interpretatio Hesperia aspect, grants permanent heathen tolerance, assimilation, and food production bonuses, and tolerates Nansemond culture."
 oe_eln.8.b:0 "Enforce Strict Western Capitoline Orthopraxy"
 oe_eln.8.b.tt:0 "Unlocks the Interpretatio Hesperia aspect while enacting permanent Western Capitoline Orthopraxy, boosting omen strength, conversion speed, religious influence, and discipline."
 oe_eln.9.title:0 "The Atlantic Edict of Symmachus"
 oe_eln.9.desc:0 "'We look upon the same stars, the sky is common to us all; not by one path alone can so great a mystery be reached.' Engraved in bronze above the harbor of Nea Konstantinoupolis, the Atlantic Edict of Symmachus echoes across sea lanes, drawing displaced Greek artisans, printers, and scholars eager to rebuild their lives beneath Elysian protection."
 oe_eln.9.a:0 "Open Free Sanctuary Ports to Scholars & Artisans"
 oe_eln.9.a.tt:0 "Grants the permanent Atlantic Free Sanctuary Ports modifier—raising tolerance, research, literacy, and migration attraction—and settles refugee burghers and scholars in the capital."
 oe_eln.9.b:0 "Institute a Taxed Charter of Civic Conscience"
 oe_eln.9.b.tt:0 "Grants the permanent Civic Conscience & Maritime Peace modifier, adds treasury gold, and settles new merchant burghers in the capital."
 oe_eln.10.title:0 "The Chalybopolis Arsenal: Greek Fire Meets the Arquebus"
 oe_eln.10.desc:0 "Beside the iron furnaces of Chalybopolis, artificers who rescued imperial ordnance scrolls from Constantinople achieve a historic breakthrough: fusing liquid Greek Fire ignition compounds with New World saltpeter gunpowder and heavy arquebus barrels. Across the proving ground, sheets of clinging flame erupt with thunderous force—the Pyrophoroi Musketeers are born!"
 oe_eln.10.a:0 "Fund Full Production at Chalybopolis Arsenal"
 oe_eln.10.a.tt:0 "Unlocks the Chalybopolis Pyrophoroi Arsenal building, Pyrophoroi advances, and both Pyrophoroi regiments, while granting permanent firepower doctrine and a local foundry bonus."
 oe_eln.10.b:0 "Reserve the Formula as an Imperial Guard Secret"
 oe_eln.10.b.tt:0 "Unlocks the arsenal building and both Pyrophoroi regiments while granting the permanent low-upkeep Secret Imperial Pyrophoroi Charter and research progress."
 oe_eln.11.title:0 "Launch of the Chesapeake Copper-Clad Galleon"
 oe_eln.11.desc:0 "Amid roaring cheers along Chrysokeras Hesperias, Nova Elysia's flagship slips down the ways into the Chesapeake. Abandoning fragile Mediterranean galleys, imperial shipwrights framed her double keel in towering white oak, sheathed her hull below the waterline in corrosion-proof copper plates, and mounted pressurized Greek Fire siphons beside heavy bow chasers. The Chesapeake Copper-Clad Galleon is ready to contest the Atlantic."
 oe_eln.11.a:0 "Commission the Chesapeake Copper-Keel Admiralty"
 oe_eln.11.a.tt:0 "Unlocks the Chesapeake Copper-Clad Galleon advance and heavy warship, granting the permanent Copper-Keel Admiralty doctrine and a 25-year shipyard boost."
 oe_eln.11.b:0 "Prioritize Fast Armed Atlantic Convoy Escorts"
 oe_eln.11.b.tt:0 "Unlocks the Chesapeake Copper-Clad Galleon advance and heavy warship while adopting the permanent Atlantic Armed Convoy Doctrine for faster shipbuilding and stronger sea trade."
 oe_eln_pantheon.1.title:0 "Western Pantheon of Hesperia: Seat Consecration"
 oe_eln_pantheon.1.desc:0 "Six marble columns stand in solemn order within the Atlantic Pantheon—two for Administration, two for Diplomacy, and two for Military—strictly honoring the classical six-god Hexapantheon limit. Here the Collegium awaits your decree to seat or withdraw Sol Invictus Hesperius and Neptune-Oceanus, or clear the Western seats before entering the Capitoline Hexapantheon hall."
 oe_eln_pantheon.1.a:0 "ADM Pillar: Seat Sol Invictus Hesperius"
 oe_eln_pantheon.1.a.tt:0 "Cleanly displaces one active ADM deity and seats Sol Invictus Hesperius (strictly maintaining <= 6 active gods)."
 oe_eln_pantheon.1.b:0 "ADM Pillar: Withdraw Sol Invictus Hesperius"
 oe_eln_pantheon.1.b.tt:0 "Removes Sol Invictus Hesperius and restores a classical ADM deity, keeping strictly 2 ADM gods."
 oe_eln_pantheon.1.c:0 "DIP Pillar: Seat Neptune-Oceanus"
 oe_eln_pantheon.1.c.tt:0 "Cleanly displaces one active DIP deity and seats Neptune-Oceanus (strictly maintaining <= 6 active gods)."
 oe_eln_pantheon.1.d:0 "DIP Pillar: Withdraw Neptune-Oceanus"
 oe_eln_pantheon.1.d.tt:0 "Removes Neptune-Oceanus and restores a classical DIP deity, keeping strictly 2 DIP gods."
 oe_eln_pantheon.1.e:0 "Dual Seating: Seat Both Western Deities"
 oe_eln_pantheon.1.e.tt:0 "Safely replaces one ADM god and one DIP god to seat both Sol Invictus Hesperius and Neptune-Oceanus while maintaining exactly 6 active gods."
 oe_eln_pantheon.1.f:0 "Clear Western Seats & Open Capitoline Hexapantheon"
 oe_eln_pantheon.1.f.tt:0 "Cleanly withdraws both Western deities back to classical defaults and opens the Capitoline Hexapantheon swapper for Old World deities."
 oe_eln_pantheon.1.z:0 "Maintain Current Hexapantheon & Adjourn"
 oe_eln_pantheon.1.z.tt:0 "Closes the Western Pantheon Consecration Hall without altering any seated gods."
