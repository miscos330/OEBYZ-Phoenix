l_english:
 # NEW 2026-11-17 theme-rework stage 2 (generated by gen_theme_admin.py)
 oe_theme_set_focus: "Set Theme Course"
 oe_theme_set_focus_desc: "Set a theme's course: army (military +15), navy (military +10, finance +5, coastal seat needed) or civil (civil administration +10, justice +5, finance +5, loyalty target +5; not for a frontier march). The theme's type, government reform and seat buildings change with it. Costs 5 imperial authority; once per theme every 5 years. Latin exarchates and chartered cities cannot change course."
 oe_theme_set_focus_select: "Choose a theme"
 oe_theme_set_officials: "Set Theme Officials"
 oe_theme_set_officials_desc: "Decide whether the theme's judge and fiscal officer are appointed by the capital or left to the strategos, or farm out the taxes; under a pronoia law the empire can also pay in land grants. Each centrally appointed official costs 0.2 gold per jurisdiction location per month. Once per theme every 2 years."
 oe_theme_set_officials_select: "Choose a theme"
 oe_theme_admin.1.t: "Theme Course"
 oe_theme_admin.1.d: "The themes were never all alike. Anatolian themes held the passes; the Kibyrrhaiot theme of the Aegean gave ships and crews. By the Komnenian age many districts were governed as provinces by a civilian kephale, with the general left only the troops.\n\nThe throne decides which way this theme goes. A new course replaces the theme's type, government reform and seat buildings.\n\nTheme: [GetCountry('BYZ').MakeScope.GetVariable('oe_theme_admin_target').GetCountry.GetName]"
 oe_theme_admin.1.army: "Army theme: troops first"
 oe_theme_admin.1.navy: "Naval theme: the fleet first"
 oe_theme_admin.1.civil: "Province: hand it to civil governors"
 oe_theme_admin.1.army.tt: "The theme takes the army course: military efficiency +15. Its type, government reform and seat buildings change. Costs 5 imperial authority; no further change for 5 years."
 oe_theme_admin.1.navy.tt: "The theme takes the naval course: military efficiency +10, finance efficiency +5, and 10 galleys of the current age at its seat. Its type, government reform and seat buildings change. Costs 5 imperial authority; no further change for 5 years."
 oe_theme_admin.1.civil.tt: "The theme becomes a province: civil administration +10, justice +5, finance +5, loyalty target +5; a province does not march to the emperor's wars. Its type, government reform and seat buildings change. Costs 5 imperial authority; no further change for 5 years."
 oe_theme_admin.2.t: "Theme Officials"
 oe_theme_admin.2.d: "A judge (krites) and a fiscal officer (protonotarios) sent from the capital take justice and money out of the strategos' hands. Leaving both to the strategos is cheaper, but makes the strategos master of the province.\n\nLand grants (pronoia) appear once the empire has adopted the vanilla pronoia law (or the Komnenian, Palaiologan or reformed pronoia that follow it).\n\nTheme: [GetCountry('BYZ').MakeScope.GetVariable('oe_theme_admin_target').GetCountry.GetName]"
 oe_theme_admin.2.judge_central: "Appoint a judge from the capital"
 oe_theme_admin.2.judge_local: "Leave justice to the strategos"
 oe_theme_admin.2.fiscal_central: "Appoint a fiscal officer from the capital"
 oe_theme_admin.2.fiscal_local: "Leave finance to the strategos"
 oe_theme_admin.2.fiscal_farm: "Farm out the taxes"
 oe_theme_admin.2.fiscal_pronoia: "Pay in land grants (pronoia)"
 oe_theme_admin.2.fiscal_pronoia.tt: "The theme pays in pronoia grants: loyalty target +5, military efficiency +10, finance efficiency −5; no fiscal officer's salary."
 oe_theme_admin.2.judge_central.tt: "The judge is sent from the capital: justice efficiency +15 (+5 when left to the strategos), loyalty target +5. The treasury pays 0.2 gold a month for each location of the jurisdiction. No further change to the officials for 2 years."
 oe_theme_admin.2.judge_local.tt: "The strategos acts as judge: justice efficiency +5; the loyalty target loses the central judge's +5. The treasury stops paying the salary. No further change to the officials for 2 years."
 oe_theme_admin.2.fiscal_central.tt: "The fiscal officer is sent from the capital: finance efficiency +15, loyalty target +5. The treasury pays 0.2 gold a month for each location of the jurisdiction. No further change to the officials for 2 years."
 oe_theme_admin.2.fiscal_local.tt: "The strategos runs the finances: finance efficiency +5; the treasury stops paying the salary. No further change to the officials for 2 years."
 oe_theme_admin.2.fiscal_farm.tt: "The taxes are farmed out: finance efficiency +10, justice efficiency −10, loyalty target −5. The theme gains 0.5 gold a month for each location of the jurisdiction; every location gets Theme Tax Farming and its development slowly falls. No further change to the officials for 2 years."
 oe_theme_admin.2.pronoia_revoke.tt: "The current pronoia grants are taken back. If they have become hereditary: loyalty −15 (−20 under the Palaiologan hereditary law, −10 under the reformed pronoia), also in the loyalty target for 5 years."
 oe_theme_admin.cancel: "Leave it as it is"
