l_english:
 oe_byz_plan_subject_governor: "Plan a Subject Governorate"
 oe_byz_plan_subject_governor_desc: "Choose a direct subject and one of its locations. Remove an existing Local Governor there, or order the subject to begin construction if the location meets the native requirements and the subject has capacity. Governors under construction count toward the cap; construction and maintenance follow native rules."
 oe_byz_choose_governor_location: "Choose a location to build or remove a governorate"
 oe_byz_no_governor_location: "@trigger_no! There is no existing Local Governor to remove, or no location meeting the construction requirements and the subject capacity limit."
 oe_byz_grant_subject_political_influence: "Grant Political Influence to a Subject"
 oe_byz_grant_subject_political_influence_desc: "Choose a direct subject. Byzantium spends 20 Political Influence and the subject gains 20 Political Influence."
 oe_byz_suppress_subject_rebellion: "Suppress Subject Rebellions"
 oe_byz_suppress_subject_rebellion_desc: "Choose a direct subject. Byzantium pays gold equal to one year of that subject's income, reducing all of its rebel progress by 40 percentage points, to a minimum of zero. Each subject has a separate fifteen-year cooldown."
 oe_byz_subject_rebellion_suppression_cooldown: "Suppress Subject Rebellions"
 oe_byz_plan_subject_naval_governor: "Plan a Subject Naval Governorate"
 oe_byz_plan_subject_naval_governor_desc: "Choose a direct subject and one of its locations. Remove an existing Naval Governor there, or order construction in a city or metropolis port meeting the native requirements while the subject has naval governor capacity. The location must not be connected to the capital through its realm or be overseas, a capital, a historical capital, or already have a proximity source building. Naval Governors under construction count toward the cap; construction and maintenance follow native rules."
 oe_byz_choose_naval_governor_location: "Choose a location to build or remove a naval governorate"
 oe_byz_no_naval_governor_location: "@trigger_no! There is no existing Naval Governor to remove, or no location meeting the native port requirements and the subject naval governor capacity limit."
