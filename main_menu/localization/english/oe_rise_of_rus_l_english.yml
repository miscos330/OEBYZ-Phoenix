l_english:
 oe_rise_of_rus: "The Rise of the Rus"
 oe_rise_of_rus_desc: "As the Golden Horde declines, the princes of the Rus contest leadership of the eastern plains. Rankings update monthly. The situation ends when Russia forms or the Age of Absolutism begins."
 oe_rus_outcome_russia: "The Unification of the Rus"
 oe_rus_outcome_russia_desc: "Russia has formed, ending the contest between the principalities."
 oe_rus_outcome_age: "The Age of Princes Ends"
 oe_rus_outcome_age_desc: "The Age of Absolutism opens a new chapter in the history of the Rus."
 oe_rus_ambition: "Ambition of the Rus"
 oe_rus_ambition_desc: "The three leading Rus powers seek unity through arms and diplomacy. This modifier is lost upon leaving the top three."
 oe_rus_orthodox_resurgence: "Resurgence of the Orthodox Princes"
 oe_rus_generous_gifts: "Generous Imperial Gifts"
 oe_rus_courteous_gifts: "Courteous Imperial Gifts"
 oe_rus_refused_gifts: "Gifts Refused"
 oe_rus_rivalry: "Rivalry for the Rus"
 oe_rus_generous_return: "Generous Return Gifts"
 oe_rus_courteous_return: "Courteous Return Gifts"
 oe_rus_spurned_tribute: "Tribute Spurned"
 oe_rus_yoke_dissolved: "Collapse of the Golden Horde’s Rule"
 oe_rus_yoke_rewards_tt: "With the Golden Horde gone, the Tatar Yoke has dissolved. Every former member has received 5 Stability."
 oe_rus_map_top_tt: "One of the three leading Rus powers; rankings are recalculated monthly."
 oe_rus_scoring_explanation: "Monthly score: 1 per Tax Base; 1 per 1,000 available land levies; 10 per 1,000 established regular soldiers; 0.5 per 1,000 Manpower; 1 per 10,000 Population; 10 per City or Metropolis. Subject and union-member scores go to their ultimate overlord or union leader, counted only once."
 oe_rus_rank_first: "First Power · [Country.GetName]"
 oe_rus_rank_second: "Second Power · [Country.GetName]"
 oe_rus_rank_third: "Third Power · [Country.GetName]"
 oe_rus_score_card: "Total score: [Country.MakeScope.GetVariable('oe_rus_score').GetValue|2]\nOwn score: [Country.MakeScope.GetVariable('oe_rus_personal_score').GetValue|2]\nEnjoys Ambition of the Rus and a fixed −200 mutual opinion with the other leading powers."
 oe_rus_tribute: "Pay Tribute to the Roman Empire"
 oe_rus_tribute_desc: "Spend six months of national income to offer fur, livestock and beer, each equal to our tax base. Gold returns are 5, 3 or 1 times the sender's tax base. All four responses accumulate in one shared opinion modifier, changing it by +50, +10, −50 or −100, with a maximum of +50 and a minimum of −100. It decays toward zero by 10 each year. Generous gifts give the Roman Empire +0.5 Diplomatic Reputation for five years; refusal retains −0.5 for one year. Cooldown: five years."
 oe_rus_purchase: "Purchase a Rus Principality"
 oe_rus_purchase_desc: "Pay three years of the target’s income and 25 Political Influence to make an adjacent independent Rus principality our vassal. It must have lower Tax Base, opinion above 50, and belong to neither the top three nor a union. Human targets receive a refusal event (five-year immunity on refusal). One-year cooldown."
 oe_rus_contest: "Contest the Rus"
 oe_rus_contest_desc: "Spend 10 Political Influence to gain a conquest casus belli on a neighboring province of a Rus country. Subjects, overlords, union partners, allies, countries with a truce with us, and countries against which we already have any casus belli are excluded. Cooldown: two years."
 oe_rus_integrate_union: "Integrate a Union Partner"
 oe_rus_integrate_union_desc: "The union leader spends 50 Political Influence and pays a nonleading member one year of its income to turn it into a Fiefdom. Membership must exceed 25 years. Five-year cooldown."
 oe_rus_build_kremlin: "Build a Kremlin"
 oe_rus_build_kremlin_desc: "Spend three months of national income and 25 Political Influence to commission a Kremlin in an owned non-capital city or megalopolis in the Rus’ regions. A country may retain up to five, keeping the earliest commissioned when over the limit. Kremlins in national capitals or owned by non-East-Slavic countries are removed. Cooldown: five years."
 oe_rus_kremlin: "Kremlin"
 oe_rus_kremlin_desc: "A fortified heart of local administration. Each East Slavic country may retain up to five. It cannot be built in a national capital and is removed if its location becomes one."
 oe_rus_kremlin_maintenance: "Kremlin Garrison Maintenance"
 oe_rise_of_rus.1.t: "The Rise of the Rus"
 oe_rise_of_rus.1.d: "The Golden Horde can no longer sustain the authority that once brought the princes of eastern Europe to their knees. Its tribute collectors inspire less fear, and decrees from the distant khan’s court carry less weight.\n\nBetween the forests and rivers, Rus towns raise new timber walls. Princes muster troops, arrange marriages and gather lands long divided. Freedom from the Tatar yoke is only the beginning: a new power is slowly taking shape on the eastern plains."
 oe_rise_of_rus.1.a: "Watch the north carefully."
 oe_rise_of_rus.1.b: "Once more, Orthodox rulers have cast off barbarian rule."
 oe_rise_of_rus.2.t: "Collapse of the Golden Horde’s Rule"
 oe_rise_of_rus.2.d: "The Grand Prince of Vladimir once collected tribute from the Rus in the khan’s name. Now the Horde lacks the strength to uphold that authority, and the old system collapses.\n\nBells announce the end of the yoke. Wealth once carried into the steppe will restore local farms, markets and defenses. Freedom brings relief—and an opportunity for every prince who dreams of leading the Rus."
 oe_rise_of_rus.2.a: "The Rus shall no longer bow to the khan."
 oe_rise_of_rus.3.t: "Tribute from the Rus"
 oe_rise_of_rus.3.d: "Envoys from [SCOPE.sCountry('oe_rus_sender').GetName] have reached Constantinople with northern furs, livestock and barrels of beer. Their cargo has been sold in the capital.\n\nThe envoys salute the emperor and await his response. A return gift will attest both to the friendship between our countries and to Rome’s standing in the Orthodox world."
 oe_rise_of_rus.3.a: "A generous return gift."
 oe_rise_of_rus.3.b: "A courteous return gift."
 oe_rise_of_rus.3.c: "A modest return gift."
 oe_rise_of_rus.3.d_option: "Send no return gift."
 oe_rus_tribute_cooldown: "Pay Tribute to the Roman Empire"
 oe_rus_purchase_cooldown: "Purchase a Rus Principality"
 oe_rus_contest_cooldown: "Contest the Rus"
 oe_rus_integrate_union_cooldown: "Integrate a Union Partner"
 oe_rus_build_kremlin_cooldown: "Build a Kremlin"

 oe_rus_integrate_kyiv: "Integrate Kyiv"
 oe_rus_integrate_kyiv_desc: "As senior partner, Lithuania may spend 50 Political Influence to demand the annexation of Kyiv once both countries have belonged to the same personal union for at least 50 years. A human-controlled Kyiv receives a refusal and autonomy event."
 oe_rus_grant_metropolitan: "Authorize an Autonomous Rus’ Metropolitanate"
 oe_rus_grant_metropolitan_desc: "Spend 50 Religious Influence to grant an autonomous metropolitanate to an independent East Slavic country in the Byzantine-led Ecumenical Patriarchate, with its capital in Russia, Ruthenia or the Steppes. Junior union partners are ineligible. The recipient gains +50 opinion of Byzantium and permanently receives +25% Clergy Tax Cap, +0.1 Monthly Religious Influence and +10% Cultural Influence. Each country can receive this grant once. Cooldown: one year."
 oe_rus_support_through_church: "Support a Rus’ State through the Church"
 oe_rus_support_through_church_desc: "Spend 50 Religious Influence to support an East Slavic country in the Byzantine-led Ecumenical Patriarchate, with its capital in Russia, Ruthenia or the Steppes. For three years it gains +10% Levy Size, +1 Tolerance of the True Faith and +5% Clergy Satisfaction. Countries already receiving this support cannot be selected again. Cooldown: three months."
 oe_rus_provide_mercenaries: "Provide Mercenaries to a Rus’ State"
 oe_rus_provide_mercenaries_desc: "Spend 1,600 Manpower and three months of our national income to raise two currently available light-infantry units and three light-cavalry units in the capital of an East Slavic country in Russia, Ruthenia or the Steppes. The recipient hires the company at 10% of normal cost. Failed deliveries refund the manpower and the gold actually paid, and remove the cooldown. Cooldown: three years."
 oe_rus_autonomous_metropolitan: "Autonomous Rus’ Metropolitanate"
 oe_rus_autonomous_metropolitan_desc: "Imperial and patriarchal recognition gives the local metropolitan authority to administer church revenues, cultivate learning and strengthen the standing of his realm among the Rus’ principalities."
 oe_rus_catholic_orthodox_support: "Support of the Orthodox Catholic Church"
 oe_rus_catholic_orthodox_support_desc: "Support from Constantinople rallies bishops and local clergy behind the prince, lending the Church’s authority to the defense of his realm."
 oe_rus_metropolitan_recognition: "Imperial Recognition of Our Metropolitanate"
 oe_rus_roman_mercenary_company: "Imperial Mercenaries for the Rus’"
 oe_rus_grant_metropolitan_cooldown: "Authorize an Autonomous Rus’ Metropolitanate"
 oe_rus_support_through_church_cooldown: "Support a Rus’ State through the Church"
 oe_rus_provide_mercenaries_cooldown: "Provide Mercenaries to a Rus’ State"

 oe_rus_tribute_sales_receipt_tt: "#T Tribute Sales Already Received#!\nSending country's Tax Base: #Y [SCOPE.GetValue('oe_rus_tribute_tax_base')|2]#!\nFur ([SCOPE.GetValue('oe_rus_tribute_tax_base')|2] units): #G [SCOPE.GetValue('oe_rus_tribute_fur_income')|2]#![gold_i]\nLivestock ([SCOPE.GetValue('oe_rus_tribute_tax_base')|2] units): #G [SCOPE.GetValue('oe_rus_tribute_livestock_income')|2]#![gold_i]\nBeer ([SCOPE.GetValue('oe_rus_tribute_tax_base')|2] units): #G [SCOPE.GetValue('oe_rus_tribute_beer_income')|2]#![gold_i]\nTotal: #G [SCOPE.GetValue('oe_rus_tribute_total_income')|2]#![gold_i]\nThese proceeds were received when this event opened. Choosing a return gift does not sell the goods again.\n\nGenerous gift: #Y [SCOPE.GetValue('oe_rus_return_large')|2]#![gold_i]; courteous gift: #Y [SCOPE.GetValue('oe_rus_return_medium')|2]#![gold_i]; modest gift: #Y [SCOPE.GetValue('oe_rus_return_small')|2]#![gold_i]."
