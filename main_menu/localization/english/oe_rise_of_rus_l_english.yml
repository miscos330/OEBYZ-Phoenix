 oe_rus_tribute_livestock_income: "Livestock sale proceeds"
 oe_rus_tribute_beer_income: "Beer sale proceeds"
 oe_rus_tribute_total_income: "Total tribute sale proceeds"
 oe_rus_tribute_before_sale: "Treasury before the sale"
 oe_ural_cossack: "Ural Cossack"
 oe_siberian_cossack: "Siberian Cossack"
 oe_don_cossack: "Don Cossack"
 oe_transbaikal_cossack: "Transbaikal Cossack"
 oe_kuban_cossack: "Kuban Cossack"
 oe_volga_cossack: "Volga Cossack"
 oe_rus_tribute_tax_base: "Sending Country's Tax Base"
 oe_rus_unify_russia: "Unify Russia"
 oe_rus_unify_russia_desc: "Available to the highest-scoring Rus principality. No East Slavic country with its capital in the Russia region may remain outside our own country and subject hierarchy. Annex all our direct and indirect subjects with capitals in the Russia region, then gain cores on every conquerable location in that region. This action may be executed only once in the entire situation, with no additional cost."
 oe_rus_first_power: "Highest-Scoring Rus Principality"
 oe_rus_unification_allowed: "No Outside East Slavic State Has Its Capital in Russia, and Unification Has Not Been Used"
 oe_rus_unification_completed: "Unification of Russia Completed"
 oe_rus_unify_russia_effect: "Unite the Russia Region"
 oe_rus_purchase_refused_cooldown: "Refused Principality Purchase"
 oe_rus_kyiv_refused_cooldown: "Refused Lithuanian Integration of Kyiv"
 oe_rise_of_rus.7.t: "An Offer to Buy Our Principality"
 oe_rise_of_rus.7.d: "Envoys from [SCOPE.sCountry('oe_rus_buyer').GetName] have arrived bearing a purse equal to three years of our revenue, proposing that our realm submit as their vassal. We may reject their gold and guard our independence, or accept their purse and swear fealty."
 oe_rise_of_rus.7.a: "A Rus’ principality is not for sale!"
 oe_rise_of_rus.7.b: "Accept the gold and swear fealty as a vassal."
 oe_rise_of_rus.8.t: "Vilnius Demands the Integration of Kyiv"
 oe_rise_of_rus.8.d: "After fifty years in personal union, the Grand Duke of Lithuania demands that Kyiv’s separate princely charter be dissolved and its lands absorbed directly into Vilnius. The boyars and the clergy of St. Sophia await our answer."
 oe_rise_of_rus.8.a: "Refuse! Break the union and proclaim Kyiv’s Rurikid independence."
 oe_rise_of_rus.8.b: "Invoke our ancient charters to preserve Kyiv’s autonomous status within the union."
