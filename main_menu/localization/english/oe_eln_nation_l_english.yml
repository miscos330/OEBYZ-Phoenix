l_english:
# NEW 2026-11-21 v10.5 Worker 2: Act II Foundation of Nova Elysia (oe_eln_). Generated by gen_elysia_nation.py.
 oe_elysian_greek:0 "Elysian Greek"
 oe_eln_ref_senatus_novae_elysiae:0 "Senatus Novae Elysiae"
 oe_eln_ref_senatus_novae_elysiae_desc:0 "Reconstitutes the imperial Senate at Nea Konstantinoupolis as the constitutional heart of Nova Elysia, balancing exiled patricians, maritime guilds, and frontier colonists."
 oe_eln_ref_basileus_hesperiae:0 "Basileus Hesperiae"
 oe_eln_ref_basileus_hesperiae_desc:0 "Vests supreme hereditary authority in the Basileus of the Western Ocean, overriding factional stalemate with tightened crown power, martial discipline, and fleet resolve."
 oe_eln_ref_res_publica_elysia:0 "Res Publica Elysia"
 oe_eln_ref_res_publica_elysia_desc:0 "Revives classical senatorial and consular governance across the Atlantic frontier, empowering maritime guilds, academies, and patrician houses to drive commerce and scholarship."
 oe_eln_frontier_citizenship_law:0 "Elysian Frontier Citizenship Law"
 oe_eln_frontier_citizenship_law_desc:0 "Defines citizenship, indigenous Foederati status, garrison colonization, and transatlantic asylum across the frontiers of Nova Elysia."
 oe_eln_atlantic_admiralty_law:0 "Atlantic Admiralty Law"
 oe_eln_atlantic_admiralty_law_desc:0 "Sets the naval doctrine of Nea Konstantinoupolis and the Chesapeake shipyards between copper-clad battle fleets, Atlantic privateering, and armed merchant convoys."
 oe_eln_pol_foederati_civitas:0 "Lex Foederatorum Civitas"
 oe_eln_pol_foederati_civitas_desc:0 "Extends classical Roman Foederati citizenship to allied Powhatan, Nansemond, and Potomac nations, lowering separatism while securing maize harvests and frontier peace."
 oe_eln_pol_colonial_limes:0 "Lex Limitis Coloniarum"
 oe_eln_pol_colonial_limes_desc:0 "Establishes fortified military-farmer marches from the Potomac to the Blue Ridge, boosting manpower, fortress defense, crown authority, and rapid cultural assimilation."
 oe_eln_pol_open_asylum:0 "Atlantic Asylum Charter"
 oe_eln_pol_open_asylum_desc:0 "Opens Elysian harbors to Greek artisans, Mediterranean mariners, and European exiles fleeing Old World wars, accelerating migration, literacy, and institution growth."
 oe_eln_pol_senatorial_patriciate:0 "Lex Patriciorum Exulum"
 oe_eln_pol_senatorial_patriciate_desc:0 "Preserves the lineage and estates of exiled imperial houses through hereditary senatorial seats, strengthening domestic stability, prestige, and Hellenic cultural tradition."
 oe_eln_pol_copper_fleet:0 "Copper-Clad Battle Fleet"
 oe_eln_pol_copper_fleet_desc:0 "Channels Chesapeake oak and iron into copper-sheathed heavy warships capable of contesting Old World armadas across the open Atlantic."
 oe_eln_pol_corsair_letters:0 "Atlantic Letters of Marque"
 oe_eln_pol_corsair_letters_desc:0 "Issues imperial letters of marque to Bermuda and Outer Banks captains, sharpening blockade efficiency, privateer endurance, and naval tradition along the western sea lanes."
 oe_eln_pol_merchant_convoys:0 "Armed Atlantic Convoys"
 oe_eln_pol_merchant_convoys_desc:0 "Organizes regularly escorted merchant convoys linking Nea Konstantinoupolis to northern and Caribbean ports, expanding maritime presence, trade range, and sea-lane returns."
 oe_eln_priv_exiled_senators:0 "Exiled Senatorial Houses"
 oe_eln_priv_exiled_senators_desc:0 "Confirms hereditary senatorial seats and colonial estates for the exiled Constantinopolitan houses who braved the Atlantic crossing, bolstering stability and diplomatic standing at the cost of crown power."
 oe_eln_priv_maritime_guilds:0 "Nea Konstantinoupolis Maritime Guilds"
 oe_eln_priv_maritime_guilds_desc:0 "Grants shipyard monopolies and maritime tariff charters to the Greek shipwrights and sea merchants of Nea Konstantinoupolis, boosting naval construction and sea trade in exchange for lower direct tax efficiency."
 oe_eln_priv_frontier_freeholders:0 "Frontier Militia Freeholders"
 oe_eln_priv_frontier_freeholders_desc:0 "Revives the Byzantine stratiotai tenure on the American frontier, granting tax-exempt freeholds to colonist families in return for militia manpower, grain surplus, and steady frontier settlement."
 STATIC_MODIFIER_NAME_oe_eln_mod_parl_breakwater:0 "Nea Konstantinoupolis Breakwater Works"
 STATIC_MODIFIER_DESC_oe_eln_mod_parl_breakwater:0 "Senate-funded stone breakwaters and harbor beacons at the Chesapeake anchor Nova Elysia's maritime presence, sea-lane trade, and coastal security."
 STATIC_MODIFIER_NAME_oe_eln_mod_parl_pyrophoroi:0 "Pyrophoroi Arsenal Funding"
 STATIC_MODIFIER_DESC_oe_eln_mod_parl_pyrophoroi:0 "Special senatorial appropriations finance saltpeter refining and arquebus drills at Chalybopolis, sharpening army discipline and siege firepower."
 STATIC_MODIFIER_NAME_oe_eln_mod_parl_grain_pact:0 "Powhatan Maize & Grain Compact"
 STATIC_MODIFIER_DESC_oe_eln_mod_parl_grain_pact:0 "Standing grain exchanges with Chesapeake nations fill imperial granaries with New World maize, easing frontier unrest and sustaining rapid population growth."
 STATIC_MODIFIER_NAME_oe_eln_mod_parl_copper_keel:0 "Copper-Keel Fleet Act"
 STATIC_MODIFIER_DESC_oe_eln_mod_parl_copper_keel:0 "Parliamentary timber and copper allocations accelerate heavy warship construction in Chesapeake yards and strengthen the Atlantic battle line."
 STATIC_MODIFIER_NAME_oe_eln_mod_parl_asylum:0 "Atlantic Artisan & Scholar Asylum"
 STATIC_MODIFIER_DESC_oe_eln_mod_parl_asylum:0 "Senatorial guarantees of tax-free settlement draw skilled European artisans and exiled scholars to Elysian ports, accelerating literacy and institution diffusion."
 STATIC_MODIFIER_NAME_oe_eln_mod_parl_nostos_bonds:0 "Nostos Eastern Expedition Bonds"
 STATIC_MODIFIER_DESC_oe_eln_mod_parl_nostos_bonds:0 "War bonds underwritten by the Elysian Senate mobilize manpower, fleet morale, and oceanic supply lines for the grand return across the Atlantic."
 STATIC_MODIFIER_NAME_oe_eln_mod_polybian_balance:0 "Polybian Mixed Constitution"
 STATIC_MODIFIER_DESC_oe_eln_mod_polybian_balance:0 "Blending monarchic command, senatorial deliberation, and civic guild representation gives the fledgling Nova Elysia enduring constitutional harmony."
 STATIC_MODIFIER_NAME_oe_eln_mod_foederati_compact:0 "Hesperian Lex Foederatorum"
 STATIC_MODIFIER_DESC_oe_eln_mod_foederati_compact:0 "A solemn Foederati compact with Chesapeake Algonquian nations exchanges Roman steel and protection for maize supplies, woodland guides, and peaceful frontier coexistence."
 STATIC_MODIFIER_NAME_oe_eln_mod_appalachian_limes:0 "Potomac-Blue Ridge Limes Edict"
 STATIC_MODIFIER_DESC_oe_eln_mod_appalachian_limes:0 "Enforces a fortified Roman limes from the Potomac to the Blue Ridge, accelerating frontier militarization, fortress defense, and cultural assimilation."
 STATIC_MODIFIER_NAME_oe_eln_mod_elysian_ethnogenesis:0 "Elysian Greek Ethnogenesis"
 STATIC_MODIFIER_DESC_oe_eln_mod_elysian_ethnogenesis:0 "Forged on the western shore of the Atlantic, the Elysian Greek identity fuses Byzantine heritage with New World vitality, igniting a golden age of culture and learning."
 STATIC_MODIFIER_NAME_oe_eln_mod_hellenic_orthodoxy_culture:0 "Unbroken Constantinopolitan Hellenism"
 STATIC_MODIFIER_DESC_oe_eln_mod_hellenic_orthodoxy_culture:0 "The Senate upholds unbroken Constantinopolitan Greek speech and classical protocol, reinforcing imperial legitimacy and ancestral cultural prestige across the Atlantic."
 STATIC_MODIFIER_NAME_oe_eln_mod_maritime_charter_ascendant:0 "Maritime Guilds Ascendant"
 STATIC_MODIFIER_DESC_oe_eln_mod_maritime_charter_ascendant:0 "Senatorial rulings favor the maritime guilds in tariff and port governance, spurring Atlantic commerce, naval construction, and merchant initiative."
 STATIC_MODIFIER_NAME_oe_eln_mod_dynatoi_land_tenure:0 "Exiled Dynatoi Land Tenures"
 STATIC_MODIFIER_DESC_oe_eln_mod_dynatoi_land_tenure:0 "Confirmed patrician estates across the Chesapeake valleys cement aristocratic loyalty, garrison order, and rural fiscal stability."
 STATIC_MODIFIER_NAME_oe_eln_mod_senatorial_compromise:0 "Bicameral Land & Tariff Compromise"
 STATIC_MODIFIER_DESC_oe_eln_mod_senatorial_compromise:0 "A negotiated senatorial settlement balances maritime tariff rights against patrician land charters, preserving domestic harmony across both estates."
 STATIC_MODIFIER_NAME_oe_eln_mod_bilingual_civitates:0 "Bilingual Civitates of the Potomac"
 STATIC_MODIFIER_DESC_oe_eln_mod_bilingual_civitates:0 "Bilingual Greco-Algonquian civitates along the Potomac and James rivers extinguish frontier separatism and foster enduring demographic vitality."
 STATIC_MODIFIER_NAME_oe_eln_mod_federated_magistrates:0 "Federated Frontier Magistrates"
 STATIC_MODIFIER_DESC_oe_eln_mod_federated_magistrates:0 "Joint councils of imperial magistrates and tribal elders uphold frontier order while preserving cultural harmony and steady civic control."
 STATIC_MODIFIER_NAME_oe_eln_mod_blue_ridge_bastions:0 "Blue Ridge Star-Fort Limes"
 STATIC_MODIFIER_DESC_oe_eln_mod_blue_ridge_bastions:0 "Stone bastions and signal towers along the Blue Ridge passes form an iron western barrier, hardening Elysian garrisons against interior raids."
 STATIC_MODIFIER_NAME_oe_eln_mod_frontier_watch_truce:0 "Appalachian Demarcation Compact"
 STATIC_MODIFIER_DESC_oe_eln_mod_frontier_watch_truce:0 "Marked mountain boundaries and regulated fur exchanges purchase years of western quiet, allowing Nova Elysia to consolidate its coastal heartland."
 STATIC_MODIFIER_NAME_oe_eln_mod_imperial_monopoly:0 "Imperial Golden Leaf Monopoly"
 STATIC_MODIFIER_DESC_oe_eln_mod_imperial_monopoly:0 "Crown monopolies over Anacostian tobacco and Pamunkey maize channel abundant revenues directly into the imperial treasury."
 STATIC_MODIFIER_NAME_oe_eln_mod_purple_caravans:0 "Purple Caravans & Free Sea Trade"
 STATIC_MODIFIER_DESC_oe_eln_mod_purple_caravans:0 "Deregulated tobacco, maize, and fur caravans link interior plantations to coastal entrepots, lifting export efficiency and national prosperity."
 STATIC_MODIFIER_NAME_oe_eln_mod_nova_elysia_ascendant:0 "Nova Elysia Ascendant"
 STATIC_MODIFIER_DESC_oe_eln_mod_nova_elysia_ascendant:0 "Tempered by constitutional reform, ethnogenesis, and frontier mastery, Nova Elysia stands as a sovereign New Rome on the western Atlantic."
 STATIC_MODIFIER_NAME_oe_eln_mod_atlantic_vanguard:0 "Atlantic Vanguard of the Flame"
 STATIC_MODIFIER_DESC_oe_eln_mod_atlantic_vanguard:0 "Nova Elysia turns New World abundance into battle fleets and disciplined legions, poised to carry the imperial flame back across the Atlantic."
 STATIC_MODIFIER_NAME_oe_eln_foederati_loc_mod:0 "Foederati Trade & Corn Canton"
 STATIC_MODIFIER_DESC_oe_eln_foederati_loc_mod:0 "A Greco-Algonquian Foederati district enjoying shared maize granaries, peaceful trade, and steady local manpower."
 STATIC_MODIFIER_NAME_oe_eln_limes_march_loc_mod:0 "Elysian Limes March"
 STATIC_MODIFIER_DESC_oe_eln_limes_march_loc_mod:0 "A fortified Roman-style frontier march strengthening local defenses, garrison recovery, and cultural assimilation."
 STATIC_MODIFIER_NAME_oe_eln_cash_crop_hub_loc_mod:0 "Golden Leaf & Maize Entrepot"
 STATIC_MODIFIER_DESC_oe_eln_cash_crop_hub_loc_mod:0 "A thriving plantation and caravan depot for New World tobacco and maize, accelerating local development and prosperity."
 STATIC_MODIFIER_NAME_oe_eln_nea_athenai_port_loc_mod:0 "Nea Athenai Hudson Entrepot"
 STATIC_MODIFIER_DESC_oe_eln_nea_athenai_port_loc_mod:0 "Anchored at the natural deepwater harbor of the Hudson, Nea Athenai thrives as Nova Elysia's northern metropolis of fur trade, shipping, and letters."
 STATIC_MODIFIER_NAME_oe_eln_northern_fleet_base_loc_mod:0 "Hudson Northern Fleet Base"
 STATIC_MODIFIER_DESC_oe_eln_northern_fleet_base_loc_mod:0 "Fortified slipways and coastal batteries guarding the Hudson mouth anchor the northern naval flank of Nova Elysia."
 STATIC_MODIFIER_NAME_oe_eln_outer_banks_beacons_loc_mod:0 "Nea Mystras Outer Banks Beacons"
 STATIC_MODIFIER_DESC_oe_eln_outer_banks_beacons_loc_mod:0 "Bronze-mirrored storm beacons and sheltered anchorages along the Outer Banks guide Elysian vessels safely past the shoals and draw coastal settlers."
 STATIC_MODIFIER_NAME_oe_eln_southern_patrol_loc_mod:0 "Roanoke Southern Patrol Haven"
 STATIC_MODIFIER_DESC_oe_eln_southern_patrol_loc_mod:0 "A sheltered cruiser and privateer station behind the Outer Banks, poised to contest Caribbean and southern sea approaches."
 oe_eln_parl_chesapeake_breakwater:0 "Nea Konstantinoupolis Breakwater Act"
 oe_eln_parl_chesapeake_breakwater_desc:0 "Appropriate senatorial funds to build stone breakwaters and harbor lights on the Chesapeake, turning Nea Konstantinoupolis into a Western Golden Horn."
 oe_eln_parl_pyrophoroi_funding:0 "Pyrophoroi Arsenal Appropriation"
 oe_eln_parl_pyrophoroi_funding_desc:0 "Approve dedicated appropriations for the Chalybopolis arsenal, funding saltpeter stockpiles, bronze casting, and Pyrophoroi firearm drills."
 oe_eln_parl_foederati_grain_pact:0 "Powhatan Maize & Foederati Grain Pact"
 oe_eln_parl_foederati_grain_pact_desc:0 "Ratify standing iron-for-maize grain exchanges with the Powhatan and Nansemond peoples, securing food reserves and frontier peace."
 oe_eln_parl_copper_keel_act:0 "Copper-Keel Fleet Construction Act"
 oe_eln_parl_copper_keel_act_desc:0 "Coordinate Virginia oak timber and copper sheathing quotas to expand Chesapeake shipyards and speed the launch of ocean-going heavy warships."
 oe_eln_parl_atlantic_asylum_charter:0 "Atlantic Artisan & Scholar Asylum Charter"
 oe_eln_parl_atlantic_asylum_charter_desc:0 "Proclaim tax-free settlement charters for displaced Mediterranean shipwrights, printers, and scholars while organizing frontier migration from the Chesapeake."
 oe_eln_parl_nostos_war_bonds:0 "Nostos War Bonds & Eastern Levy"
 oe_eln_parl_nostos_war_bonds_desc:0 "Once Nova Elysia has come of age, float senatorial war bonds to fill the war chest and mobilize fleets and levies for the eventual return to Constantinople."
 oe_eln.1.title:0 "First Convocation of the Senatus Novae Elysiae"
 oe_eln.1.desc:0 "Within the timber-and-stone curia newly raised above the Chesapeake, purple-bordered exiles, shipyard masters, and frontier centurions assemble at Nea Konstantinoupolis. With the Old World an ocean behind them, Nova Elysia must choose its constitutional form: hereditary command under a Western Basileus, a classical senatorial republic, or a balanced Polybian charter."
 oe_eln.1.a:0 "Crown the Hereditary Basileus Hesperiae"
 oe_eln.1.a.tt:0 "Shifts the Senate axis strongly toward imperial authority (-35), enacts #Y Senatus Novae Elysiae#! and #Y Basileus Hesperiae#!, and raises legitimacy."
 oe_eln.1.b:0 "Proclaim the Consular Res Publica Elysia"
 oe_eln.1.b.tt:0 "Shifts the Senate axis toward senatorial governance (+35), enacts #Y Senatus Novae Elysiae#! and #Y Res Publica Elysia#!, and raises stability and burgher satisfaction."
 oe_eln.1.c:0 "Adopt a Polybian Mixed Constitution"
 oe_eln.1.c.tt:0 "Steadies the constitutional balance (+5), enacts #Y Senatus Novae Elysiae#!, grants #Y Polybian Mixed Constitution#! for 20 years, and raises cultural tradition."
 oe_eln.2.title:0 "Wahunsonacock's Forebears & the Lex Foederatorum"
 oe_eln.2.desc:0 "As the smoke of Nea Konstantinoupolis rises along the James and Potomac valleys, envoys of the Powhatan confederacy and neighboring Chesapeake nations come to take the measure of the Purple banners. The Senate divides sharply: shall we invoke ancient imperial precedent with a Lex Foederatorum of mutual treaties and maize compacts, or proclaim an iron Potomac-Blue Ridge Limes of fortified garrisons?"
 oe_eln.2.a:0 "Enact the Lex Foederatorum with the Chesapeake Nations"
 oe_eln.2.a.tt:0 "Locks the Act II native track to #G Foederati#!: signs 15-year truces and improves relations with living Chesapeake nations, tolerates Nansemond and Powhatan cultures, and unlocks the Bilingual Civitates path."
 oe_eln.2.b:0 "Proclaim the Potomac-Blue Ridge Limes Edict"
 oe_eln.2.b.tt:0 "Locks the Act II native track to #R Limes#!: fortifies Chesapeake holdings, boosts army tradition and assimilation, angers neighboring nations, and unlocks the Appalachian Limes frontier path."
 oe_eln.12.title:0 "Birth of the Elysian Greeks"
 oe_eln.12.desc:0 "A quarter century has passed since the Purple banners first rose over the Chesapeake. A new generation born at Nea Konstantinoupolis still reads Homer and imperial law, yet speaks with Atlantic sea-lore, New World husbandry, and frontier candor. Scholars proclaim that a distinct Elysian Greek people has come into being."
 oe_eln.12.a:0 "Embrace the Elysian Greek Ethnogenesis"
 oe_eln.12.a.tt:0 "Shifts primary culture to #Y Elysian Greek#! (retaining #Y Greek#! as accepted), converts American Greek pops to Elysian Greek, boosts cultural tradition and influence, and grants a 30-year ethnogenesis modifier."
 oe_eln.12.b:0 "Preserve Unbroken Constantinopolitan Hellenism"
 oe_eln.12.b.tt:0 "Retains the existing primary culture while raising cultural tradition, prestige, and legitimacy alongside a 25-year #Y Unbroken Constantinopolitan Hellenism#! modifier."
 oe_eln.13.title:0 "Maritime Guilds vs. Exiled Dynatoi"
 oe_eln.13.desc:0 "Fifteen years after landfall, Nova Elysia's sharpest quarrel erupts beneath the Senate portico. The Chesapeake maritime guilds demand lower port duties and expanded shipyard charters, while the exiled Dynatoi holding upstream river estates denounce mercantile presumption and insist that landed houses govern taxation and frontier levies."
 oe_eln.13.a:0 "Back the Chesapeake Maritime Guilds"
 oe_eln.13.a.tt:0 "Shifts the Senate axis toward maritime commerce (+25), raises burgher satisfaction and naval tradition, and grants #Y Maritime Guilds Ascendant#! for 20 years at the cost of noble satisfaction."
 oe_eln.13.b:0 "Uphold the Exiled Dynatoi Tenures"
 oe_eln.13.b.tt:0 "Shifts the Senate axis toward landed hierarchy (-25), raises noble satisfaction and stability, and grants #Y Exiled Dynatoi Land Tenures#! for 20 years while displeasing burghers."
 oe_eln.13.c:0 "Arbitrate a Bicameral Land & Tariff Compromise"
 oe_eln.13.c.tt:0 "Spends modest treasury funds to broker a compromise, improving both noble and burgher satisfaction and granting #Y Bicameral Land & Tariff Compromise#! for 15 years."
 oe_eln.14.title:0 "Bilingual Civitates of the Potomac"
 oe_eln.14.desc:0 "Years after the Lex Foederatorum, trading settlements along the Potomac and York rivers have blossomed into thriving bilingual towns where Greek magistrates intermarry with Powhatan and Nansemond leading families. A historic bill now lies before the Senate: shall these allied peoples be raised to full accepted status within Nova Elysia?"
 oe_eln.14.a:0 "Grant Full Civitas to Powhatan & Nansemond"
 oe_eln.14.a.tt:0 "Adds #Y Powhatan#! and #Y Nansemond#! as accepted cultures, launches a frontier migration wave, deepens ties with living Chesapeake nations, and grants #Y Bilingual Civitates of the Potomac#! for 30 years."
 oe_eln.14.b:0 "Preserve Federated Bilingual Magistrates"
 oe_eln.14.b.tt:0 "Adds #Y Nansemond#! as an accepted culture, raises stability and cultural influence, and grants #Y Federated Frontier Magistrates#! for 25 years."
 oe_eln.15.title:0 "The Appalachian Limes and the Haudenosaunee Shadow"
 oe_eln.15.desc:0 "The advance of fortified marches toward the Blue Ridge has alarmed the inland Haudenosaunee peoples beyond the mountain crest. Scouts report war canoes along the upper rivers and watch-fires on the ridges. Frontier commanders press Nea Konstantinoupolis to either fortify the passes in stone or purchase a demarcated truce."
 oe_eln.15.a:0 "Erect the Blue Ridge Star-Fort Limes"
 oe_eln.15.a.tt:0 "Funds stone frontier fortifications, increments the Limes fortification ledger, grants #Y Blue Ridge Star-Fort Limes#! for 25 years, and hardens tensions with inland Haudenosaunee nations (IRO/STD/OSG)."
 oe_eln.15.b:0 "Negotiate an Appalachian Demarcation Truce"
 oe_eln.15.b.tt:0 "Dispatches diplomatic gifts to secure a 10-year truce with living interior nations (IRO/STD/OSG) and grants #Y Appalachian Demarcation Compact#! for 15 years."
 oe_eln.16.title:0 "Golden Leaf and Purple Caravans"
 oe_eln.16.desc:0 "Rich bottomlands at Anacostia yield golden tobacco leaf while Pamunkey granaries overflow with maize. As the first purple-bannered overland caravans reach the quays of Nea Konstantinoupolis, treasury officials and free sea merchants submit rival plans to harness New World cash-crop wealth."
 oe_eln.16.a:0 "Establish the Imperial Golden Leaf Monopoly"
 oe_eln.16.a.tt:0 "Delivers immediate treasury revenue and grants #Y Imperial Golden Leaf Monopoly#! for 20 years at the cost of burgher satisfaction."
 oe_eln.16.b:0 "Charter Free Purple Caravans & Sea Merchants"
 oe_eln.16.b.tt:0 "Raises burgher satisfaction, grants #Y Purple Caravans & Free Sea Trade#! for 25 years, and applies #Y Golden Leaf & Maize Entrepot#! to owned Anacostia and Pamunkey."
 oe_eln.17.title:0 "Nea Athenai at the Mouth of the Hudson"
 oe_eln.17.desc:0 "Elysian squadrons have raised the Purple banner over Manhattan's magnificent natural deepwater harbor. Commanding the mouth of the Hudson and the northern fur routes, the island can shelter an entire Atlantic battle fleet. The Senate proposes christening the port Nea Athenai, debating whether to build a civic metropolis or an austere naval citadel."
 oe_eln.17.a:0 "Found Nea Athenai as a Northern Metropolis"
 oe_eln.17.a.tt:0 "Renames Manhattan to #Y Nea Athenai#!, promotes it to city rank if below city, settles burgher artisans with a 30-year entrepot modifier, and extends trade goodwill to living Munsee (MNS)."
 oe_eln.17.b:0 "Fortify Nea Athenai as the Northern Fleet Citadel"
 oe_eln.17.b.tt:0 "Renames Manhattan to #Y Nea Athenai#!, raises naval tradition, and grants #Y Hudson Northern Fleet Base#! for 25 years."
 oe_eln.18.title:0 "Nea Mystras and the Outer Banks Beacons"
 oe_eln.18.desc:0 "South of the Chesapeake, the shifting shoals and tempestuous straits of Roanoke guard the maritime approach toward the Caribbean Gulf Stream. Now that Elysian patrols hold the Outer Banks, engineers propose christening Roanoke as Nea Mystras—either raising bronze storm beacons for peaceful settlers or turning the sound into a southern cruiser haven."
 oe_eln.18.a:0 "Found Nea Mystras & Raise the Outer Banks Beacons"
 oe_eln.18.a.tt:0 "Renames Roanoke to #Y Nea Mystras#!, applies #Y Nea Mystras Outer Banks Beacons#! for 30 years, launches a frontier migration wave, and extends goodwill to living Croatan (CAA)."
 oe_eln.18.b:0 "Turn Nea Mystras into a Southern Patrol Haven"
 oe_eln.18.b.tt:0 "Renames Roanoke to #Y Nea Mystras#!, raises naval tradition, and grants #Y Roanoke Southern Patrol Haven#! for 25 years."
 oe_eln.19.title:0 "Coming of Age of Nova Elysia"
 oe_eln.19.desc:0 "From three timber stockades on the Chesapeake, Nova Elysia now commands more than fifteen American towns and districts. Its Senate sits in majesty, its frontier order is forged, and its shipyards ring with hammer blows beneath the Double-Headed Eagle. The age of exile survival is over: New Rome has come of age, ready for Atlantic hegemony and the road back to the Queen of Cities."
 oe_eln.19.a:0 "Proclaim the Sovereign Empire of the Western Ocean"
 oe_eln.19.a.tt:0 "Sets the Act II consolidation milestone (unlocking Nostos War Bonds and Act III/IV), boosts prestige, stability, cultural tradition and influence, grants #Y Nova Elysia Ascendant#! for 30 years, and launches a frontier migration wave."
 oe_eln.19.b:0 "Dedicate the Realm to Reclaiming the Eastern Flame"
 oe_eln.19.b.tt:0 "Sets the Act II consolidation milestone (unlocking Nostos War Bonds and Act III/IV), boosts prestige, naval and army tradition, and grants #Y Atlantic Vanguard of the Flame#! for 30 years."
 oe_eln.20.title:0 "Audit: Nova Elysia Act II State Telemetry"
 oe_eln.20.desc:0 "#T Act II: Nova Elysia Read-Only Telemetry (Slot 73 oe_eln_)#!\nMonths Settled: #Y [ROOT.GetCountry.MakeScope.GetVariable('oe_eln_months_settled').GetValue|0]#!  |  American Locations: #Y [ROOT.GetCountry.MakeScope.GetVariable('oe_eln_american_locs').GetValue|0]#!\nSenate Axis (-100 Basileus .. +100 Res Publica): #Y [ROOT.GetCountry.MakeScope.GetVariable('oe_eln_senate_axis').GetValue|0]#!\nNative Track (0=None 1=Foederati 2=Limes): #Y [ROOT.GetCountry.MakeScope.GetVariable('oe_eln_native_path').GetValue|0]#!\nFaith Track (0=None 1=Orthodox 2=Religio Romana 3=Symmachus): #Y [ROOT.GetCountry.MakeScope.GetVariable('oe_eln_faith_path').GetValue|0]#!\nElysian Greek Ethnogenesis (0/1): #Y [ROOT.GetCountry.MakeScope.GetVariable('oe_eln_ethnogenesis_done').GetValue|0]#!  |  Consolidation Done (0/1): #Y [ROOT.GetCountry.MakeScope.GetVariable('oe_eln_consolidation_done').GetValue|0]#!\nFoederati Pacts: #Y [ROOT.GetCountry.MakeScope.GetVariable('oe_eln_foederati_pacts').GetValue|0]#!  |  Limes Fortifications: #Y [ROOT.GetCountry.MakeScope.GetVariable('oe_eln_limes_forts').GetValue|0]#!  |  Migration Waves: #Y [ROOT.GetCountry.MakeScope.GetVariable('oe_eln_migration_waves').GetValue|0]#!"
 oe_eln.20.a:0 "Close Telemetry Readout"
 oe_eln.20.b:0 "Refresh Telemetry Readout"
