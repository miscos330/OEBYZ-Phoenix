l_english:
 oe_ru2_pomor_arctic_demand: "Pomor White Sea Arctic Trade Demand"
 oe_ru2_hanseatic_wax_fur_demand: "Peterhof Fur and Beeswax Charter Demand"
 oe_ru2_dec_hanseatic_renegotiate: "Renegotiate the Peterhof Kontor Charter"
 oe_ru2_dec_hanseatic_renegotiate.title: "Renegotiate the Peterhof Kontor Charter"
 oe_ru2_dec_hanseatic_renegotiate_desc: "Reopen talks with Lübeck over fur and beeswax privileges at Novgorod's Peterhof Kontor: either seize direct trade monopoly or sign the Ivan Hundred Equal-Trade Compact. 10-year cooldown."
 oe_ru2_dec_hanseatic_renegotiate.desc: "Reopen talks with Lübeck over fur and beeswax privileges at Novgorod's Peterhof Kontor: either seize direct trade monopoly or sign the Ivan Hundred Equal-Trade Compact. 10-year cooldown."
 oe_ru2_dec_hanseatic_renegotiate.a: "Assert Direct Fur and Beeswax Monopoly"
 oe_ru2_dec_hanseatic_renegotiate.a.tt: "Triggers 5 years of fur and beeswax market demand in Novgorod and boosts merchant power for 10 years, angering Lübeck."
 oe_ru2_dec_hanseatic_renegotiate.b: "Ratify the Ivan Hundred Equal-Trade Compact"
 oe_ru2_dec_hanseatic_renegotiate.b.tt: "Triggers 5 years of fur and beeswax demand in Novgorod while lifting trade income, burgher satisfaction, and Lübeck ties."
 oe_ru2_dec_pomor_arctic_charter: "Issue the Pomor White Sea Arctic Charter"
 oe_ru2_dec_pomor_arctic_charter.title: "Issue the Pomor White Sea Arctic Charter"
 oe_ru2_dec_pomor_arctic_charter_desc: "Charter the White Sea to Mangazeya Arctic fur and walrus-ivory route via Kholmogory and Arkhangelsk, triggering Novgorod market demand and empowering Pomor sea guilds. 12-year cooldown."
 oe_ru2_dec_pomor_arctic_charter.desc: "Charter the White Sea to Mangazeya Arctic fur and walrus-ivory route via Kholmogory and Arkhangelsk, triggering Novgorod market demand and empowering Pomor sea guilds. 12-year cooldown."
 oe_ru2_dec_pomor_arctic_charter.a: "Grant the Pomor Arctic Navigation Charter"
 oe_ru2_dec_pomor_arctic_charter.tt: "Grants the Pomor Sea Guild for 12 years, upgrades White Sea ports, and adds 5 years of Arctic fur and naval demand to Novgorod's market."
 oe_ru2_dec_cossack_campaign: "Mobilize Frontier Cossack Hosts"
 oe_ru2_dec_cossack_campaign.title: "Mobilize Frontier Cossack Hosts"
 oe_ru2_dec_cossack_campaign_desc: "Dispatch gunpowder, lead, and grain stipends to chartered frontier Cossack Hosts during wartime, unleashing fast vanguard raids and siege pressure. 5-year cooldown."
 oe_ru2_dec_cossack_campaign.desc: "Dispatch gunpowder, lead, and grain stipends to chartered frontier Cossack Hosts during wartime, unleashing fast vanguard raids and siege pressure. 5-year cooldown."
 oe_ru2_dec_cossack_campaign.a: "Issue Powder and Grain for the Campaign"
 oe_ru2_dec_cossack_campaign.tt: "Provides immediate manpower and 3 years of stronger land morale, siege ability, and hostile attrition."
 oe_ru2_dec_siberian_charter: "Enact the Siberian Fur and Ostrog Charter"
 oe_ru2_dec_siberian_charter.title: "Enact the Siberian Fur and Ostrog Charter"
 oe_ru2_dec_siberian_charter_desc: "Once Tobolsk or Qashliq is secured, promulgate a permanent Siberian fur yasak and ostrog charter accelerating frontier population growth, raw output, and state control."
 oe_ru2_dec_siberian_charter.desc: "Once Tobolsk or Qashliq is secured, promulgate a permanent Siberian fur yasak and ostrog charter accelerating frontier population growth, raw output, and state control."
 oe_ru2_dec_siberian_charter.a: "Establish the Permanent Siberian Charter"
 oe_ru2_dec_siberian_charter.tt: "Grants permanent Siberian growth, output, and control bonuses nationwide and in Tobolsk/Qashliq, settling the Siberian Cossack Host."
 oe_ru2_dec_oprich_throttle: "Adjust Oprichnina Throttle & Release Valve"
 oe_ru2_dec_oprich_throttle.title: "Adjust Oprichnina Throttle & Release Valve"
 oe_ru2_dec_oprich_throttle_desc: "Actively throttle the Oprichnina between Strict Purge, Balanced Inspectorate, and the Zemshchina Reconciliation Release Valve to balance crown centralization against realm prosperity. 3-year cooldown."
 oe_ru2_dec_oprich_throttle.desc: "Actively throttle the Oprichnina between Strict Purge, Balanced Inspectorate, and the Zemshchina Reconciliation Release Valve to balance crown centralization against realm prosperity. 3-year cooldown."
 oe_ru2_dec_oprich_throttle.a: "Convene Council on Oprichnina Enforcement"
 oe_ru2_dec_oprich_throttle.tt: "Opens the Oprichnina Throttle council to switch immediately among the three enforcement tiers."
 oe_ru2.1.t: "Peterhof Kontor & Lübeck Monopoly Dispute"
 oe_ru2.1.d: "Inside the walled Peterhof Kontor on the Volkhov's eastern bank, Hanseatic elders enforce Lübeck's strict bylaws against credit and direct retail, depressing fur and beeswax prices. Merchants of the Ivan Hundred have thronged the Veche square demanding redress."
 oe_ru2.1.a: "Strip Kontor Monopolies and Seize Direct Trade"
 oe_ru2.1.a.tt: "Sharply boosts merchant power and trade income for 15 years at the cost of Lübeck's anger."
 oe_ru2.1.b: "Sign the Ivan Hundred Equal-Trade Compact"
 oe_ru2.1.b.tt: "Balances Baltic goodwill, burgher satisfaction, and active fur-wax market demand."
 oe_ru2.1.c: "Invite Dutch and English Factors to Bypass the Hansa"
 oe_ru2.1.c.tt: "Broadens trade range, merchant reach, and literacy for 15 years while alienating Lübeck."
 oe_ru2.2.t: "Baltic Embargo & the Ivan Hundred Counter-Measure"
 oe_ru2.2.d: "Over disputes in weights and customs, the Hanseatic Diet has halted broadcloth and silver shipments to Novgorod to force the Veche to yield. Hardline guilds urge a retaliatory blockade on the Neva, while moderates advocate a pragmatic transit pact through Riga."
 oe_ru2.2.a: "Blockade the Neva and Arm Merchant Convoys"
 oe_ru2.2.a.tt: "Trades modest short-term trade friction for strong merchant power and naval tradition."
 oe_ru2.2.b: "Broker a Pragmatic Baltic Transit Accord via Riga"
 oe_ru2.2.b.tt: "Swiftly restores Baltic commerce, diplomatic warmth, and Novgorod market demand."
 oe_ru2.3.t: "Kholmogory & the Pomor White Sea Route"
 oe_ru2.3.d: "Pomor mariners at the Northern Dvina estuary have perfected ice-resistant koch vessels sailing from Kholmogory across the White Sea, bringing Arctic sable pelts, whale oil, and walrus ivory south to Novgorod. The Veche debates subsidizing Pomor shipyards or taxing northern caravans."
 oe_ru2.3.a: "Subsidize Kholmogory Shipyards and Pomor Guilds"
 oe_ru2.3.a.tt: "Upgrades White Sea ports, empowers Pomor shipbuilders, and adds Arctic demand to Novgorod's market."
 oe_ru2.3.b: "Impose Direct Arctic Customs Duties"
 oe_ru2.3.b.tt: "Delivers immediate treasury funds and 15 years of stronger tax efficiency."
 oe_ru2.4.t: "Mangazeya Sable Fur & Arctic Walrus Ivory"
 oe_ru2.4.d: "Pomor voyages along the polar coast have unlocked Mangazeya's legendary wealth in black sable and walrus ivory, drawing silver-laden foreign ships to the White Sea. Novgorod's commercial houses propose a joint-stock Arctic syndicate to harness the boom."
 oe_ru2.4.a: "Charter the Mangazeya Arctic Joint-Stock Syndicate"
 oe_ru2.4.a.tt: "Grants 20 years of booming trade and raw output while energizing Novgorod's market."
 oe_ru2.4.b: "Reserve Arctic Fur Revenues for the State Treasury"
 oe_ru2.4.b.tt: "Fills the treasury immediately and boosts tax efficiency and state authority for 15 years."
 oe_ru2.5.t: "Volkhov Bridge Riot & the Veche Bell"
 oe_ru2.5.d: "The great Veche bell has tolled across the Volkhov! Oligarchic posadniks and tysiatskii magistrates face off on the wooden bridge against enraged commoner craft guilds from the Commercial Side. Without decisive constitutional settlement, faction violence could paralyze the republic."
 oe_ru2.5.a: "Enact the New Veche Assembly Charter"
 oe_ru2.5.a.tt: "Strengthens republican tradition, literacy, and burgher satisfaction for 15 years."
 oe_ru2.5.b: "Establish an Archbishop-Brokered Standing Magistracy"
 oe_ru2.5.b.tt: "Trades some republican tradition for 15 years of tighter state control and army upkeep efficiency."
 oe_ru2.6.t: "Codification of the Great Veche Commercial Commonwealth"
 oe_ru2.6.d: "Having weathered Baltic embargoes, Arctic voyages, and Volkhov bridge crises, Novgorod's commonwealth stands at a constitutional crossroads. Delegates from every borough assemble before Saint Sophia to codify the republic's enduring charter."
 oe_ru2.6.a: "Proclaim the Great Veche Commercial Charter"
 oe_ru2.6.a.tt: "Grants 30 years of thriving republican tradition, trade income, merchant power, and literacy."
 oe_ru2.6.b: "Institute the Standing Syndic Defense Directorate"
 oe_ru2.6.b.tt: "Grants 30 years of stronger state power, taxation, land morale, and diplomatic prestige."
 oe_ru2.7.t: "Don Cossack Host Petition on the Sea of Azov"
 oe_ru2.7.d: "Atamans of the Don Cossack Host have ridden north asking for gunpowder, lead, and frontier stanitsa charters to strike the Sea of Azov at Tana and sever steppe slave-raiding routes, even at the risk of provoking Crimean retaliation."
 oe_ru2.7.a: "Fund the Don Cossack Host and Sanction Azov Raids"
 oe_ru2.7.a.tt: "Settles the Don Cossack Host, adds manpower, and grants 15 years of frontier morale and maritime presence."
 oe_ru2.7.b: "Restrain Don Raids to Preserve Black Sea Diplomacy"
 oe_ru2.7.b.tt: "Avoids frontier escalation while modestly raising prestige and stability."
 oe_ru2.8.t: "Zaporozhian Rada & the Dnieper Rapids Sich"
 oe_ru2.8.d: "Envoys from the Zaporozhian Rada beyond the Dnieper rapids offer to shield the southwestern frontier from Crimean and Lithuanian incursions in return for explicit Sich autonomy, while army clerks urge enrolling them as salaried Registered Cossacks."
 oe_ru2.8.a: "Confirm Zaporozhian Sich Frontier Autonomy"
 oe_ru2.8.a.tt: "Settles the Zaporozhian Cossack Host and boosts national defense and manpower for 18 years."
 oe_ru2.8.b: "Enroll Crown-Paid Registered Cossack Regiments"
 oe_ru2.8.b.tt: "Settles the Zaporozhian Host while boosting discipline, reinforcement, and crown authority for 18 years."
 oe_ru2.9.t: "Yaik Host Petition for Caspian Salt & Fisheries"
 oe_ru2.9.d: "The Yaik Cossack Host guarding the Ural River petitions for tax-free fishing and salt-pan charters along the northern Caspian shore to finance their border patrols against steppe raids."
 oe_ru2.9.a: "Grant Caspian Fishing and Salt Charters to the Yaik Host"
 oe_ru2.9.a.tt: "Settles the Yaik Cossack Host and grants 18 years of food output, trade income, and hostile attrition."
 oe_ru2.9.b: "Keep Caspian Salt Pans Under Crown Customs"
 oe_ru2.9.b.tt: "Brings immediate fiscal receipts and modest stability."
 oe_ru2.10.t: "Terek Host Garrison of the North Caucasus Passes"
 oe_ru2.10.d: "Terek Cossack outposts along the northern Caucasus foothills report that royal funds for stone watchtowers and matchlocks will seal the mountain passes and open a secure Orthodox corridor toward Georgia."
 oe_ru2.10.a: "Fund Terek Mountain Watchtowers and the Orthodox Corridor"
 oe_ru2.10.a.tt: "Settles the Terek Cossack Host and boosts army tradition, fort upkeep, defense, and diplomacy for 18 years."
 oe_ru2.10.b: "Maintain Light Patrols and Fold Recruits into Field Armies"
 oe_ru2.10.b.tt: "Saves treasury gold and provides an immediate manpower reserve."
 oe_ru2.11.t: "Kuban Host Settlement & Circassian Horse Compact"
 oe_ru2.11.d: "Kuban Cossack riders near the Taman Peninsula propose expanding frontier cavalry stanitsas along the eastern Black Sea and signing a horse-trading compact with Circassian clans to supply remounts across Russia."
 oe_ru2.11.a: "Charter Kuban Stanitsas and the Circassian Horse Pact"
 oe_ru2.11.a.tt: "Settles the Kuban Cossack Host and grants 18 years of faster reinforcement, lower army upkeep, and morale."
 oe_ru2.11.b: "Lease Kuban Pastures as Crown Remount Estates"
 oe_ru2.11.b.tt: "Yields immediate gold revenue and a modest army tradition gain."
 oe_ru2.12.t: "Yermak & the Siberian Cossack Crossing"
 oe_ru2.12.d: "Ataman Yermak's matchlock-armed Siberian Cossack Host has crossed the Urals toward Qashliq and Tobolsk along the Irtysh basin. Messengers request royal powder, banners, and a formal fur-yasak commission to claim Siberia for Rus'."
 oe_ru2.12.a: "Commission Yermak's Expedition and Fur Yasak Charter"
 oe_ru2.12.a.tt: "Settles the Siberian Cossack Host and grants 20 years of siege power, raw output, and long-distance control."
 oe_ru2.12.b: "Consolidate Fortified Depots Along the Ural Ridge"
 oe_ru2.12.b.tt: "Safely boosts stability and frontier manpower reserves."
 oe_ru2.13.t: "Setting the Oprichnina Enforcement Throttle"
 oe_ru2.13.d: "Black-clad Oprichniki await the sovereign's directive. Crushing boyar autonomy to its roots lifts crown power to the summit at steep cost to rural prosperity and manpower, whereas balanced inspection or a Zemshchina release valve preserves the realm's vitality."
 oe_ru2.13.a: "Tier I: Strict Purge (Maximum Crown Power, Heavy Toll)"
 oe_ru2.13.a.tt: "Maximizes crown power and control while crushing boyars, at heavy cost to prosperity, manpower, and noble flight risk."
 oe_ru2.13.b: "Tier II: Balanced Inspectorate (Steady Centralization)"
 oe_ru2.13.b.tt: "Moderately raises crown power and tax efficiency with manageable boyar friction."
 oe_ru2.13.c: "Tier III: Zemshchina Release Valve (Recovery & Conciliation)"
 oe_ru2.13.c.tt: "Restores prosperity, manpower, and noble goodwill while opening the path to abolish or reform the Oprichnina."
 oe_ru2.14.t: "Boyar Flight & Rural Depopulation Under Strict Oprichnina"
 oe_ru2.14.d: "Relentless purges have driven noble houses to flee across the Lithuanian frontier, leaving confiscated estates unplowed and peasants streaming south toward the Cossack steppe. Bold counselors ask whether to press confiscations or step down to a Balanced Inspectorate."
 oe_ru2.14.a: "Show No Mercy and Confiscate Fleeing Boyar Estates"
 oe_ru2.14.a.tt: "Seizes large estates for treasury gold while hurting stability, boyar satisfaction, and Lithuanian ties."
 oe_ru2.14.b: "De-escalate Immediately to the Balanced Inspectorate"
 oe_ru2.14.b.tt: "Ends strict purge penalties, switches to Balanced Inspectorate, and restores stability."
 oe_ru2.15.t: "Post-Molodi Zemshchina Reconciliation & Oprichnina Abolition"
 oe_ru2.15.d: "The release valve has calmed the realm, reuniting boyar levies and crown troops in common defense. Standing at the historic crossroads after Molodi, you may peacefully abolish the Oprichnina in a Zemshchina reconciliation or reorganize its disciplined cadres into a modern Royal Guard."
 oe_ru2.15.a: "Abolish the Oprichnina and Convene the Zemshchina Assembly"
 oe_ru2.15.a.tt: "Peacefully removes the Oprichnina reform for major stability and 25 years of broad recovery."
 oe_ru2.15.b: "Reorganize Oprichnina Cadres into a Modern Royal Guard"
 oe_ru2.15.b.tt: "Removes the Oprichnina reform while forging 25 years of disciplined Royal Guard strength and crown power."
 oe_ru2.15.c: "Defer Abolition and Keep the Release Valve Active"
 oe_ru2.15.c.tt: "Retains the Oprichnina reform and current release-valve relief for future use."
