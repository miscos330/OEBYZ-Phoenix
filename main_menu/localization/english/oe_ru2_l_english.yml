 STATIC_MODIFIER_NAME_oe_ru2_riga_transit_accord: "Riga Baltic Transit Accord"
 STATIC_MODIFIER_DESC_oe_ru2_riga_transit_accord: "Riga transit treaties steady Baltic customs revenues and soothe diplomatic friction."
 STATIC_MODIFIER_NAME_oe_ru2_pomor_sea_guild: "Pomor Arctic Sea Guild"
 STATIC_MODIFIER_DESC_oe_ru2_pomor_sea_guild: "Ice-hardened Pomor koch fleets expand Arctic shipbuilding, sailors, and trade reach."
 STATIC_MODIFIER_NAME_oe_ru2_pomor_port_loc: "White Sea Pomor Entrepot Hub"
 STATIC_MODIFIER_DESC_oe_ru2_pomor_port_loc: "Fur warehouses and polar shipyards at the Northern Dvina lift local output and growth."
 STATIC_MODIFIER_NAME_oe_ru2_mangazeya_syndicate: "Mangazeya Arctic Fur Syndicate"
 STATIC_MODIFIER_DESC_oe_ru2_mangazeya_syndicate: "Joint-stock Arctic voyages channel Siberian sable and ivory into European trade."
 STATIC_MODIFIER_NAME_oe_ru2_arctic_crown_customs: "Arctic State Customs Monopoly"
 STATIC_MODIFIER_DESC_oe_ru2_arctic_crown_customs: "Direct state customs along the White Sea bolster tax efficiency and central authority."
 STATIC_MODIFIER_NAME_oe_ru2_new_veche_charter: "New Veche Assembly Charter"
 STATIC_MODIFIER_DESC_oe_ru2_new_veche_charter: "Balanced civic representation fortifies republican tradition, literacy, and burgher loyalty."
 STATIC_MODIFIER_NAME_oe_ru2_archbishop_magistracy: "Archbishop's Standing Magistracy"
 STATIC_MODIFIER_DESC_oe_ru2_archbishop_magistracy: "A standing executive council tightens administrative control and army efficiency."
 STATIC_MODIFIER_NAME_oe_ru2_great_veche_charter: "Great Veche Commonwealth Charter"
 STATIC_MODIFIER_DESC_oe_ru2_great_veche_charter: "A codified commercial republic anchors enduring trade wealth, literacy, and civic pride."
 STATIC_MODIFIER_NAME_oe_ru2_veche_syndic_directorate: "Standing Syndic Defense Directorate"
 STATIC_MODIFIER_DESC_oe_ru2_veche_syndic_directorate: "A centralized defense directorate pairs republican wealth with formidable military resolve."
 STATIC_MODIFIER_NAME_oe_ru2_cossack_vanguard: "Cossack Host Frontier Vanguard"
 STATIC_MODIFIER_DESC_oe_ru2_cossack_vanguard: "Well-supplied Cossack Hosts spearhead sieges and inflict fierce attrition on invaders."
 STATIC_MODIFIER_NAME_oe_ru2_siberian_charter_mod: "Siberian Fur & Ostrog Charter"
 STATIC_MODIFIER_DESC_oe_ru2_siberian_charter_mod: "Permanent ostrog networks and yasak charters accelerate Siberian settlement and raw output."
 STATIC_MODIFIER_NAME_oe_ru2_siberian_ostrog_loc: "Siberian Ostrog & Yasak Hub"
 STATIC_MODIFIER_DESC_oe_ru2_siberian_ostrog_loc: "Fortified Siberian ostrogs secure fur revenues, local defense, and steady settler growth."
 STATIC_MODIFIER_NAME_oe_ru2_don_azov_corsairs: "Don-Azov Cossack Raiders"
 STATIC_MODIFIER_DESC_oe_ru2_don_azov_corsairs: "Don Cossack flotillas and riders project striking power across the Azov frontier."
 STATIC_MODIFIER_NAME_oe_ru2_zaporozhian_sich_pact: "Zaporozhian Sich Frontier Pact"
 STATIC_MODIFIER_DESC_oe_ru2_zaporozhian_sich_pact: "Sich autonomy delivers resilient southwestern fortifications and abundant frontier manpower."
 STATIC_MODIFIER_NAME_oe_ru2_registered_cossacks: "Crown Registered Cossacks"
 STATIC_MODIFIER_DESC_oe_ru2_registered_cossacks: "Salaried Registered Cossacks combine frontier ferocity with regular discipline."
 STATIC_MODIFIER_NAME_oe_ru2_yaik_caspian_charter: "Yaik Caspian Fishery Charter"
 STATIC_MODIFIER_DESC_oe_ru2_yaik_caspian_charter: "Caspian fisheries and Ural River patrols bolster food supply, trade, and frontier attrition."
 STATIC_MODIFIER_NAME_oe_ru2_terek_caucasus_watch: "Terek North Caucasus Watch"
 STATIC_MODIFIER_DESC_oe_ru2_terek_caucasus_watch: "Mountain watchtowers along the Terek cut fort upkeep and fortify southern diplomacy."
 STATIC_MODIFIER_NAME_oe_ru2_kuban_remount_pact: "Kuban Stanitsa & Remount Pact"
 STATIC_MODIFIER_DESC_oe_ru2_kuban_remount_pact: "Circassian horse compacts and Kuban stanitsas speed reinforcement and lower army upkeep."
 STATIC_MODIFIER_NAME_oe_ru2_yermak_siberian_push: "Yermak's Trans-Ural Expedition"
 STATIC_MODIFIER_DESC_oe_ru2_yermak_siberian_push: "Matchlock-armed Siberian Cossacks accelerate frontier sieges, fur output, and state reach."
 STATIC_MODIFIER_NAME_oe_ru2_oprich_harsh: "Oprichnina Tier I: Strict Purge"
 STATIC_MODIFIER_DESC_oe_ru2_oprich_harsh: "Unrestrained Oprichnina purges maximize crown authority at severe cost to prosperity and manpower."
 STATIC_MODIFIER_NAME_oe_ru2_oprich_balanced: "Oprichnina Tier II: Balanced Inspectorate"
 STATIC_MODIFIER_DESC_oe_ru2_oprich_balanced: "Measured royal inspections restrain boyar factions and lift tax efficiency with manageable strain."
 STATIC_MODIFIER_NAME_oe_ru2_oprich_release: "Oprichnina Tier III: Zemshchina Release Valve"
 STATIC_MODIFIER_DESC_oe_ru2_oprich_release: "Suspending purges restores rural prosperity, manpower reserves, and boyar cooperation."
 STATIC_MODIFIER_NAME_oe_ru2_zemshchina_reconciled: "Post-Molodi Zemshchina Recovery"
 STATIC_MODIFIER_DESC_oe_ru2_zemshchina_reconciled: "Peaceful abolition of the Oprichnina heals internal rifts and revives prosperity and manpower."
 STATIC_MODIFIER_NAME_oe_ru2_royal_guard_reformed: "Reformed Standing Royal Guard"
 STATIC_MODIFIER_DESC_oe_ru2_royal_guard_reformed: "Reforging Oprichnina cadres into a regular Royal Guard sustains discipline and crown power."
 oe_ru2_b_hanseatic_dispute: "Peterhof Kontor Trade Dispute"
 oe_ru2_b_hanseatic_accord: "Ivan Hundred Commercial Accord"
 oe_ru2_b_cossack_border_clash: "Cossack Frontier Raids"
 oe_ru2_b_boyar_flight_shelter: "Sheltered Fleeing Boyars"
