 oe_nav2_negotiate_strait_charter_reject_effect_text_past: "[SCOPE.sCountry('recipient').GetName] refused the Strait Passage Charter request."
 oe_nav2_b_letters_of_marque: "Issued Letters of Marque Against Us"
 oe_nav2_b_joint_convoy: "Joint Anti-Piracy Convoy Pact"
 oe_nav2_b_strait_charter: "Strait Passage & Factory Charter"
 oe_nav2_b_maritime_goodwill: "Grand Maritime & Silk Road Envoy Goodwill"
 STATIC_MODIFIER_NAME_oe_nav2_letters_of_marque_active: "Active Letters of Marque"
 STATIC_MODIFIER_DESC_oe_nav2_letters_of_marque_active: "State-licensed privateers stalk rival merchant shipping, strengthening privateering durability and sea trade at the expense of diplomatic reputation."
 STATIC_MODIFIER_NAME_oe_nav2_marque_harassed: "Harassed by Privateers"
 STATIC_MODIFIER_DESC_oe_nav2_marque_harassed: "Foreign-commissioned privateers raid our sea lanes, depressing trade income and accelerating maritime presence decay."
 STATIC_MODIFIER_NAME_oe_nav2_antipiracy_convoy_mod: "Joint Anti-Piracy Convoy"
 STATIC_MODIFIER_DESC_oe_nav2_antipiracy_convoy_mod: "Allied escort squadrons patrol key sea lanes, suppressing pirate raids and boosting maritime trade efficiency at a modest upkeep cost."
 STATIC_MODIFIER_NAME_oe_nav2_strait_free_passage: "Strait Free-Passage Charter"
 STATIC_MODIFIER_DESC_oe_nav2_strait_free_passage: "Treaty-backed toll exemption and factory rights at a major world strait boost maritime trade efficiency, merchant power, and naval reach."
 STATIC_MODIFIER_NAME_oe_nav2_strait_charter_toll: "Strait Charter Toll Revenue"
 STATIC_MODIFIER_DESC_oe_nav2_strait_charter_toll: "Steady charter dues and bustling customs revenues collected from friendly maritime powers passing through our strait."
 STATIC_MODIFIER_NAME_oe_nav2_factory_extraterritorial_mod: "Overseas Factory Extraterritoriality"
 STATIC_MODIFIER_DESC_oe_nav2_factory_extraterritorial_mod: "Recognized legal safeguards for overseas merchant factories and expatriate communities bolster trade power and diplomatic standing."
 STATIC_MODIFIER_NAME_oe_nav2_maritime_patrol_alert: "Maritime Patrol Readiness"
 STATIC_MODIFIER_DESC_oe_nav2_maritime_patrol_alert: "Coastal shipyards and patrol squadrons stand at heightened readiness, accelerating ship construction and stiffening naval morale."
 STATIC_MODIFIER_NAME_oe_nav2_arctic_route_charted: "Northeast Arctic Passage Charted"
 STATIC_MODIFIER_DESC_oe_nav2_arctic_route_charted: "Detailed rutters from Bergen and Kola through Arkhangelsk to Mangazeya unlock far-northern fur markets and extend naval reach."
 STATIC_MODIFIER_NAME_oe_nav2_indian_ocean_prestige: "Indian Ocean Treasure Fleet Prestige"
 STATIC_MODIFIER_DESC_oe_nav2_indian_ocean_prestige: "Grand treasure-fleet diplomacy across the South China Sea, Malacca, Malabar, Hormuz, and the Swahili Coast elevates diplomatic prestige and maritime mastery."
 STATIC_MODIFIER_NAME_oe_nav2_sankore_scholarship: "Sankore Manuscript Scholarship"
 STATIC_MODIFIER_DESC_oe_nav2_sankore_scholarship: "Astronomical, mathematical, and legal manuscripts copied at Timbuktu's Sankore academy spread literacy and scholarly rigor across our realm."
 STATIC_MODIFIER_NAME_oe_nav2_silk_road_compact: "Silk Road Transcontinental Compact"
 STATIC_MODIFIER_DESC_oe_nav2_silk_road_compact: "An overland embassy linking Samarkand, Dunhuang, Jingzhao, and the great Eurasian capitals accelerates institution spread and caravan trade."
 STATIC_MODIFIER_NAME_oe_nav2_royal_academy_laurels: "Royal Academy Enlightenment Laurels"
 STATIC_MODIFIER_DESC_oe_nav2_royal_academy_laurels: "Landmark triumphs in classical epigraphy and meridian geodesy propel national research, literacy, institution spread, and cultural prestige."
 oe_nav2_exp_arctic_northeast: "Northeast Arctic & Mangazeya Passage"
 oe_nav2_exp_arctic_northeast_desc: "Dispatch an ice-hardened expedition northward via Bergen, Vardo, Kola, and Arkhangelsk, engaging Pomor pilots to push past the Kanin Peninsula and Pustozersk to the fabled Siberian sable emporium of Mangazeya."
 oe_nav2_exp_arctic_northeast_outcome_overview: "$BULLET$A successful return grants #Y Northeast Arctic Passage Charted#! for 25 years, expanding naval range, merchant power, and sea trade while delivering rich fur supplies to your capital market.\n$BULLET$Triggers interactive drift-ice, Pomor pilot, and Mangazeya sable-market dilemmas en route."
 oe_nav2_exp_indian_ocean_treasure: "Indian Ocean Treasure Fleet Mission"
 oe_nav2_exp_indian_ocean_treasure_desc: "Commission a grand maritime diplomatic armada sailing a bidirectional chain of deep-water ports across Malacca, Calicut, Goa, Hormuz, Aden, and Zanzibar or Quanzhou, trading royal gifts for spices, bullion, and oceanic renown."
 oe_nav2_exp_indian_ocean_treasure_outcome_overview: "$BULLET$Returning home supplies your capital market with pepper, cloves, and porcelain while granting #Y Indian Ocean Treasure Fleet Prestige#! for 15 years.\n$BULLET$Triggers diplomatic trade accords and exotic tribute events at Malacca, Calicut, and the voyage terminus."
 oe_nav2_exp_saharan_scholar_caravan: "Trans-Saharan Gold & Sankore Caravan"
 oe_nav2_exp_saharan_scholar_caravan_desc: "Assemble a desert merchant-scholar caravan from North or West Africa along the western route through Sijilmasa, Tindouf, and the Taghaza salt mines to Timbuktu's Sankore University, Djenne, Gao, and Kano."
 oe_nav2_exp_saharan_scholar_caravan_outcome_overview: "$BULLET$Successful return raises cultural tradition, supplies gold to your capital market, and grants #Y Sankore Manuscript Scholarship#! for 10 years.\n$BULLET$Triggers salt-for-gold trading at Taghaza and manuscript commissioning at Timbuktu."
 oe_nav2_exp_silk_road_embassy: "Silk Road Overland Diplomatic Mission"
 oe_nav2_exp_silk_road_embassy_desc: "Dispatch a transcontinental overland diplomatic embassy across Tabriz, Samarkand, Kashgar, Turpan, Dunhuang, Lanzhou, Jingzhao, and Dadu or Constantinople to exchange imperial letters and revive Silk Road ties."
 oe_nav2_exp_silk_road_embassy_outcome_overview: "$BULLET$Returns with silk supplies for your capital market, diplomatic goodwill along the route, and #Y Silk Road Transcontinental Compact#! for 12 years.\n$BULLET$Triggers interactive observatory and Dunhuang manuscript events at Samarkand and Shazhou."
 oe_nav2_exp_enlightenment_survey: "Enlightenment Scientific & Classical Survey"
 oe_nav2_exp_enlightenment_survey_desc: "Sponsor a Royal Academy Enlightenment expedition. At departure choose between a Classical Mediterranean-Near Eastern archaeological survey or a global equatorial meridian and Transit of Venus voyage via the Cape of Good Hope to Quito."
 oe_nav2_exp_enlightenment_survey_outcome_overview: "$BULLET$Choose at launch between the #Y Classical Archaeological Survey#! or the #Y Global Equatorial Meridian Voyage#!.\n$BULLET$Completing the survey delivers major research progress, cultural tradition, and #Y Royal Academy Enlightenment Laurels#! for 20 years."
 oe_nav2.1.t: "Enemy Issues Letters of Marque"
 oe_nav2.1.d: "Dispatches from our coastal guilds bring grim news: foreign authorities have issued formal Letters of Marque commissioning privateers to prey upon our merchantmen. Maritime law now grants us a Suppress Privateers Casus Belli, yet our admiralty must respond at once."
 oe_nav2.1.a: "Raise Coastal Patrols and Prepare Naval Reprisal"
 oe_nav2.1.a.tt: "Gains #G +5#! Navy Tradition and [ShowModifier('oe_nav2_maritime_patrol_alert')] (#Y 5 years#!): boosts ship construction and naval morale."
 oe_nav2.1.b: "Underwrite Merchant Losses to Calm the Ports"
 oe_nav2.1.b.tt: "Pays #R -30#! gold to compensate raided merchants and restores #G +5#! Prestige."
 oe_nav2.2.t: "Joint Convoy Smashes Corsair Lair"
 oe_nav2.2.d: "In a coordinated dawn sweep, our joint anti-piracy convoy intercepted a pack of raiding corsairs and burned their hidden anchorage. Freed merchant vessels are returning to harbor and maritime confidence is surging."
 oe_nav2.2.a: "Divide the Prizes and Decorate the Escort Crews"
 oe_nav2.2.a.tt: "Gains #G +40#! gold, #G +6#! Navy Tradition, and #G +8#! Prestige."
 oe_nav2.2.b: "Reinvest Captured Timber into Patrol Dockyards"
 oe_nav2.2.b.tt: "Gains [ShowModifier('oe_nav2_maritime_patrol_alert')] (#Y 5 years#!): accelerates shipbuilding and strengthens sailor reserves."
 oe_nav2.3.t: "Strait Passage Charter Refused"
 oe_nav2.3.d: "Our envoys sent to negotiate a Strait Passage Charter have been rebuffed. The strait sovereign insists on retaining punitive transit dues, prompting our merchant guilds to demand decisive naval action."
 oe_nav2.3.a: "Proclaim Freedom of the Straits"
 oe_nav2.3.a.tt: "Gains #G +5#! Prestige and an immediate #Y 5-year#! #Y Strait Toll Dispute#! Casus Belli against the strait holder."
 oe_nav2.3.b: "Stand Down and Reclaim Unspent Charter Funds"
 oe_nav2.3.b.tt: "Recovers #G +25#! gold in unspent diplomatic funds and avoids immediate escalation."
 oe_nav2.4.t: "Diplomatic Note on Overseas Factories"
 oe_nav2.4.d: "Our overseas consuls and merchant factors petition the crown regarding legal protections for our coreligionist communities abroad. The council weighs enforcing formal extraterritorial charters against a quieter commercial settlement."
 oe_nav2.4.a: "Enforce Extraterritorial Factory Charters"
 oe_nav2.4.a.tt: "Gains #G +10#! Prestige and [ShowModifier('oe_nav2_factory_extraterritorial_mod')] (#Y 10 years#!): strengthens sea trade, merchant power, and diplomatic standing."
 oe_nav2.4.b: "Accept a Commercial Settlement into the Treasury"
 oe_nav2.4.b.tt: "Immediately receives #G +60#! gold in commercial compensation."
 oe_nav2.5.t: "Drift-Ice Blockade off the Kola Coast"
 oe_nav2.5.d: "Rounding Vardo toward the Kola coast, our arctic squadron encounters grinding pack ice driven south by polar gales. The expedition leader must choose between funding oak ice-sheathing and fresh stores at Kola or threading a narrow coastal lead."
 oe_nav2.5.a: "Reinforce Hulls and Resupply at Kola"
 oe_nav2.5.a.tt: "Pays #R -30#! gold to refit #G +1#! ice-ready ship and restore #G +20#! Provisions at Kola, then resumes the voyage."
 oe_nav2.5.b: "Push Through the Coastal Lead and Barter Pelts"
 oe_nav2.5.b.tt: "Loses #R -1#! Ship while loading #G +10#! Cargo, then resumes the voyage."
 oe_nav2.6.t: "Pomor Ice-Pilots of Arkhangelsk"
 oe_nav2.6.d: "At Arkhangelsk on the White Sea, veteran Pomor mariners offer their services. Skilled in sailing egg-hulled koch boats designed to ride up over crushing pack ice, they know every passage toward the Kanin Peninsula and the Ob estuary."
 oe_nav2.6.a: "Hire Pomor Pilots and Ice-Koch Boats"
 oe_nav2.6.a.tt: "Pays #R -40#! gold to gain #G +1#! ice-koch Ship, #G +25#! Provisions, and #G +10#! Cargo, then resumes toward Mangazeya."
 oe_nav2.6.b: "Trade for Dried Fish and Copy Local Rutters"
 oe_nav2.6.b.tt: "Restores #G +15#! Arctic Provisions and adds #G +5#! Sable Pelts & Charts, then resumes the voyage."
 oe_nav2.7.t: "The Golden Sable Market of Mangazeya"
 oe_nav2.7.d: "Crossing the subarctic portages beyond the Ob, our expedition reaches the legendary timber town of Mangazeya. Its market overflows with glossy Siberian sable pelts and walrus ivory, eager to be bartered for European wares."
 oe_nav2.7.a: "Load Prime Siberian Sable Pelts for the Return"
 oe_nav2.7.a.tt: "Gains #G +10#! Prestige and #G +25#! Sable Pelts & Charts, then begins the return journey."
 oe_nav2.7.b: "Chart the Ob-Taz River Portages and Magnetic Declination"
 oe_nav2.7.b.tt: "Gains #G +8#! Navy Tradition, research progress, and #G +15#! Sable Pelts & Charts, then begins the return journey."
 oe_nav2.8.t: "Treasure Fleet Accord at Malacca"
 oe_nav2.8.d: "Our towering treasure ships drop anchor off Malacca before crowds of merchants from every quarter of Asia. The strait court dispatches ceremonial barges inviting our envoys to exchange state gifts and seal a harbor transit compact."
 oe_nav2.8.a: "Bestow Lavish Porcelain and Silk Gifts"
 oe_nav2.8.a.tt: "Spends #R -25#! Imperial Gift Cargo for #G +8#! Prestige, #G +30#! Armada Prestige, and #G +20#! Tribute Bullion, then resumes sailing."
 oe_nav2.8.b: "Strike a Pragmatic Harbor Customs Pact"
 oe_nav2.8.b.tt: "Spends #R -10#! Imperial Gift Cargo for #G +40#! gold and #G +25#! Tribute Bullion, then resumes sailing."
 oe_nav2.9.t: "Malabar Pepper and the Zamorin's Gifts at Calicut"
 oe_nav2.9.d: "Monsoon winds carry our fleet into Calicut, jewel of the Malabar spice coast. The Zamorin hosts our envoys in his seaside palace while warehouses of freshly harvested black pepper and cardamom await our supercargoes."
 oe_nav2.9.a: "Exchange State Gifts for Malabar Pepper"
 oe_nav2.9.a.tt: "Spends #R -25#! Imperial Gift Cargo for #G +30#! Tribute Bullion and #G +20#! Armada Prestige, then resumes sailing."
 oe_nav2.9.b: "Stage a Grand Fleet Review off Calicut"
 oe_nav2.9.b.tt: "Spends #R -15#! Imperial Gift Cargo for #G +5#! Navy Tradition and #G +30#! Armada Prestige, then resumes sailing."
 oe_nav2.10.t: "Auspicious Tribute at the Ocean Terminus"
 oe_nav2.10.d: "Across thousands of leagues of monsoon seas, our treasure armada reaches its farthest great emporium! Overawed by the scale of our fleet, local princes present rare exotic beasts, spice chests, and gold tribute to escort back to our capital."
 oe_nav2.10.a: "Receive the Auspicious Tribute and Foreign Envoys"
 oe_nav2.10.a.tt: "Gains #G +12#! Prestige, #G +35#! Armada Prestige, and #G +30#! Tribute Bullion, then sails homeward."
 oe_nav2.10.b: "Trade for Gold Bullion and Celestial Star Charts"
 oe_nav2.10.b.tt: "Gains #G +60#! gold, #G +8#! Navy Tradition, and #G +45#! Tribute Bullion, then sails homeward."
 oe_nav2.11.t: "Taghaza Salt Mines: Bartering Salt for Gold"
 oe_nav2.11.d: "Our caravan reaches the blazing salt flats of Taghaza, where even the dwellings are built of translucent rock-salt blocks. South across the dunes in the Niger valley, slabs of Taghaza salt trade weight-for-weight for pure Wangara gold dust."
 oe_nav2.11.a: "Purchase Rock-Salt Slabs and Refill Waterskins"
 oe_nav2.11.a.tt: "Pays #R -35#! gold to restore #G +25#! Caravan Water and gain #G +20#! Wangara Gold Dust, then resumes south toward Timbuktu."
 oe_nav2.11.b: "Press Rapidly Toward the Niger Bend"
 oe_nav2.11.b.tt: "Spends #R -10#! Caravan Water and gains #G +10#! Wangara Gold Dust, then resumes southward."
 oe_nav2.12.t: "The Sankore Libraries of Timbuktu"
 oe_nav2.12.d: "Our camel bells ring through the gates of Timbuktu. Within the famed Sankore academy and its private libraries, exquisitely bound manuscripts on astronomy, jurisprudence, and medicine command higher prices than gold itself."
 oe_nav2.12.a: "Commission Astronomical and Legal Manuscripts"
 oe_nav2.12.a.tt: "Pays #R -40#! gold for research progress, #G +25#! Sankore Manuscripts, #G +15#! Gold Dust, and #G +20#! Caravan Water, then resumes travel."
 oe_nav2.12.b: "Prioritize High-Purity Wangara Gold Dust"
 oe_nav2.12.b.tt: "Gains #G +55#! gold, #G +30#! Gold Dust, and #G +10#! Sankore Manuscripts, then resumes travel."
 oe_nav2.13.t: "Samarkand Observatory and Silk Mart"
 oe_nav2.13.d: "Our overland embassy enters Samarkand, crossroads of Transoxiana. Around its grand bazaar, silk caravans from Persia, India, and China converge beneath the shadow of great astronomical observatories guarding precision star tables."
 oe_nav2.13.a: "Sponsor Astronomical Tables and Brocade Trade"
 oe_nav2.13.a.tt: "Pays #R -35#! gold for research progress, #G +35#! Diplomatic Scrolls & Maps, and #G +15#! Embassy Morale, then resumes the journey."
 oe_nav2.13.b: "Hold a Formal State Audience"
 oe_nav2.13.b.tt: "Gains #G +8#! Prestige, #G +25#! Diplomatic Scrolls & Maps, and #G +10#! Embassy Morale, then resumes the journey."
 oe_nav2.14.t: "Dunhuang Grotto Scrolls and Hexi Dispatches"
 oe_nav2.14.d: "Emerging from the Tarim sands, our embassy halts at Shazhou-Dunhuang. Beneath the painted cliff grottos, custodians and postmasters share multilingual scrolls, oasis water charts, and imperial relay passes leading into the Hexi Corridor."
 oe_nav2.14.a: "Copy Multilingual Grotto Scrolls and Oasis Maps"
 oe_nav2.14.a.tt: "Grants your culture #G +4#! Cultural Tradition, #G +40#! Diplomatic Scrolls & Maps, and #G +15#! Embassy Morale, then resumes travel."
 oe_nav2.14.b: "Exchange Imperial Waybills and Caravan Profits"
 oe_nav2.14.b.tt: "Gains #G +50#! gold and #G +30#! Diplomatic Scrolls & Maps, then resumes travel."
 oe_nav2.15.t: "Royal Academy Mandate: Choose Survey Route"
 oe_nav2.15.d: "Equipped with precision quadrants, chronometers, and draughtsmen, our Royal Academy expedition awaits its final charter: either a grand Mediterranean-Near Eastern archaeological survey from Rome and Athens to Babylon and Persepolis, or a global equatorial meridian voyage via the Cape of Good Hope to Quito."
 oe_nav2.15.a: "Branch A: Classical Mediterranean & Near Eastern Survey"
 oe_nav2.15.a.tt: "Charts the classical route through #Y Rome, Naples, Athens, Corinth, Mystras, Smyrna, Bergama, Alexandria, Qena, Aswan, Tadmur, Hillah, and Istakhr#! before returning home, and departs immediately!"
 oe_nav2.15.b: "Branch B: Global Equatorial Meridian & Transit of Venus"
 oe_nav2.15.b.tt: "Charts the oceanic meridian route via #Y Good Hope Cape, Guayaquil, Quito, Alexandria, and Athens#! before returning home, and departs immediately!"
 oe_nav2.16.t: "Enlightenment Breakthrough: Epigraphs & Meridian Arc"
 oe_nav2.16.d: "Electrifying dispatches arrive from our scholars! Whether deciphering multilingual temple inscriptions or triangulating the true curvature of the Earth's meridian, the expedition stands on the brink of an epochal scientific breakthrough."
 oe_nav2.16.a: "Verify Geodetic Triangulation and Multilingual Inscriptions"
 oe_nav2.16.a.tt: "Gains research progress, #G +40#! Specimens & Epigraphs, and #G +10#! Instrument Precision, then resumes travel."
 oe_nav2.16.b: "Gather Rare Specimens and Antiquities for the Royal Museum"
 oe_nav2.16.b.tt: "Gains #G +12#! Prestige and #G +50#! Specimens & Epigraphs, then resumes travel."
 oe_nav2.17.t: "Expedition Lost — Salvaged Logs & Charts"
 oe_nav2.17.d: "Sobering tidings reach the court: harsh elements, dwindling supplies, or the loss of its commander has forced our expedition to abort. Surviving hands have nonetheless rescued fragments of its logs and field charts."
 oe_nav2.17.a: "Archive the Salvaged Logs in the Admiralty"
 oe_nav2.17.a.tt: "Draws hard-won lessons from the loss, gaining #G +4#! Navy Tradition."
 oe_nav2.17.b: "Honor the Fallen Explorers with State Rites"
 oe_nav2.17.b.tt: "Honors the fallen and upholds royal dignity, gaining #G +4#! Prestige."
 oe_nav2.18.t: "v12.5 W2 Audit: Maritime Warfare, Strait CBs & 5 Expeditions"
 oe_nav2.18.d: "Live audit readout for v12.5 Track W2 (prefix oe_nav2_, 0 mainline slots, 0 vanilla overrides) on [ROOT.GetCountry.GetName].\n\nInstalled systems:\n- 3 Casus Belli: Strait Toll Dispute (6 great straits), Suppress Privateers & Escort Trade, Protect Coreligionists & Overseas Factories.\n- 3 Maritime Country Interactions: Issue Letters of Marque, Form Joint Anti-Piracy Convoy, Negotiate Strait Passage & Factory Charter.\n- 5 Verified Historical Expeditions: Northeast Arctic & Mangazeya Passage, Indian Ocean Treasure Fleet (17 ports bidirectional), Trans-Saharan Gold & Sankore Caravan, Silk Road Overland Embassy (bidirectional), and Enlightenment Scientific & Classical Survey (dual-branch)."
 oe_nav2.18.a: "Acknowledge Audit Readout"
 oe_nav2.18.a.tt: "Closes the Track W2 live audit readout without altering game state."
