 oe_nav2_negotiate_strait_charter: "Negotiate Strait Passage & Factory Charter"
 oe_nav2_negotiate_strait_charter_desc: "Pay a charter fee to a sovereign controlling one of the six great world straits in exchange for ten years of toll-free passage, factory privileges, and extended naval reach, while granting them steady charter revenue. Refusal risks sparking a Strait Toll Dispute."
 oe_nav2_negotiate_strait_charter_act: "Negotiate a Strait Passage & Factory Charter with [SCOPE.sCountry('recipient').GetName]."
 oe_nav2_negotiate_strait_charter_effect_text: "[SCOPE.sCountry('actor').GetName] will purchase a Strait Passage & Factory Charter from [SCOPE.sCountry('recipient').GetName]."
