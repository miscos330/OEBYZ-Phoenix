 oe_nav2_cb_suppress_piracy: "Suppress Privateers & Escort Trade"
 oe_nav2_cb_suppress_piracy_PROV: "Naval expedition to suppress privateers and corsairs"
 oe_nav2_cb_suppress_piracy_desc: "Their letters of marque and corsair squadrons prey upon our merchant shipping. Our navy will sweep their privateers from the sea lanes and restore maritime security."
 oe_nav2_cb_protect_coreligionists: "Protect Coreligionists & Overseas Factories"
 oe_nav2_cb_protect_coreligionists_PROV: "Intervention to protect coreligionists and overseas merchant factories"
 oe_nav2_cb_protect_coreligionists_desc: "Substantial communities of our coreligionists and overseas merchant factories dwell beneath their rule without adequate safeguard. As a great protector, we shall compel guarantees of toleration and factory rights."
