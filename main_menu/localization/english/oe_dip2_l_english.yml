 oe_dip2.1.title: "Cipher Intercept Exposed"
 oe_dip2.1.desc: "Our agents intercepting a foreign embassy's courier pouch were surprised mid-copy by rival guards. Though most transcripts were burned in time, wax seals and cipher keys fell into enemy hands, and outraged envoys now demand an explanation."
 oe_dip2.1.a: "Issue a flat public denial and weather the storm"
 oe_dip2.1.a.tt: "Endure two years of #Y Cipher Intercept Scandal#! (lower diplomatic reputation and spy network construction) while protecting our treasury and senior agents."
 oe_dip2.1.b: "Sacrifice a scapegoat courier and pay hush money"
 oe_dip2.1.b.tt: "Lose #R 15#! prestige and #R 35#! gold to contain the scandal quickly without a lasting diplomatic reputation penalty."
 oe_dip2.2.title: "Enemy Field Codebook Broken"
 oe_dip2.2.desc: "Lamps burned until dawn inside the cipher chamber as our clerks finally cracked the enemy high command's field substitution tables. Supply convoy timetables, relief column routes, and fortress passwords now lie decoded upon our war table."
 oe_dip2.2.a: "Rush the decoded routes to our field marshals"
 oe_dip2.2.a.tt: "Gain two years of #Y Enemy Field Codebook Broken#! (siege ability and military tactics) plus #G +5#! army tradition."
 oe_dip2.2.b: "Keep the break secret as diplomatic and covert leverage"
 oe_dip2.2.b.tt: "Gain #G +10#! prestige, plus #G +15#! spy network if the target court remains in scope."
 oe_dip2.3.title: "Foreign Court Funds Exiled Claimant"
 oe_dip2.3.desc: "Border wardens confirm that a hostile power is lavishing gold upon an exiled pretender to our throne. Forged charters and manifestos promising vast estates are circulating among discontented nobles across our provinces."
 oe_dip2.3.a: "Dispatch covert assassins to dismantle the exile ring"
 oe_dip2.3.a.tt: "Pay a steep covert bounty to immediately clear #Y Shadow of the Exiled Claimant#!."
 oe_dip2.3.b: "Appease wavering great nobles to shore up legitimacy"
 oe_dip2.3.b.tt: "Concede #R 10#! prestige to rally the peerage, gaining #G +5#! legitimacy and #G +3#! stability."
 oe_dip2.3.c: "Tighten internal counter-espionage and outlast the rumors"
 oe_dip2.3.c.tt: "Gain three years of #Y Court Factions Quieted#! (lower rebel growth and stability cost) at no treasury expense."
 oe_dip2.4.title: "Exiled Puppet Sparks Defections"
 oe_dip2.4.desc: "The exiled claimant backed by our gold has rallied disaffected knights and garrison officers along our rival's frontier. Even without toppling their throne, fear of treason has gripped the rival court and prompted quiet overtures to our agents."
 oe_dip2.4.a: "Amplify the manifesto campaign across their realm"
 oe_dip2.4.a.tt: "Gain three years of #Y Exile Claimant Momentum#! (spy network construction and monthly prestige) plus #G +10#! prestige."
 oe_dip2.4.b: "Debrief defecting officers for military intelligence"
 oe_dip2.4.b.tt: "Gain #G +4#! army tradition and #G +15#! spy network against the targeted court."
 oe_dip2.5.title: "Foreign Gold Poaches Court Master"
 oe_dip2.5.desc: "A furious chancellor reports that one of our ablest court minds slipped across the frontier overnight with personal notebooks in hand, surfacing at a foreign monarch's reception. Inquiries reveal rival agents had dangled a princely retainer for months."
 oe_dip2.5.a: "Lodge a formal protest and turn their embassy contacts"
 oe_dip2.5.a.tt: "Recover #G +5#! prestige and plant #G +15#! spy network inside the poaching realm."
 oe_dip2.5.b: "Fund court retention stipends and counter-espionage"
 oe_dip2.5.b.tt: "Spend #R 60#! gold to gain five years of #Y Court Talent Retention Reform#! (research speed and counter-espionage)."
 oe_dip2.6.title: "Guest Master Presents Statecraft Treatise"
 oe_dip2.6.desc: "The renowned foreign master recently lured into our service has spent months observing our academies and garrisons. At court audience, they present a richly annotated treatise blending foreign technique with our realm's traditions."
 oe_dip2.6.a: "Publish the treatise across our academies and chanceries"
 oe_dip2.6.a.tt: "Adds #G +5#! cultural tradition to our primary culture and grants #G +8#! prestige."
 oe_dip2.6.b: "Adapt the master's doctrine for our officers and captains"
 oe_dip2.6.b.tt: "Immediately grants #G +6#! army tradition and #G +4#! navy tradition."
 oe_dip2.7.title: "Dynastic Succession Ultimatum"
 oe_dip2.7.desc: "A stern parchment citing old marriage treaties and genealogical charters has arrived from a neighboring monarch. Seizing upon our unsettled succession, they demand public acknowledgment of their house's precedence in our line of inheritance."
 oe_dip2.7.a: "Acknowledge their dynastic precedence for peace and order"
 oe_dip2.7.a.tt: "Gain #G +3#! stability and improve bilateral relations, while the claimant power gains ten years of #Y Dynastic Succession Guarantor#!."
 oe_dip2.7.b: "Pay a princely marriage indemnity to extinguish the claim"
 oe_dip2.7.b.tt: "Pay a heavy sum of gold to settle the dynastic dispute peacefully without compromising our crown."
 oe_dip2.7.c: "Reject their pretension and prepare to defend the throne"
 oe_dip2.7.c.tt: "Gain #G +10#! prestige, suffer five years of #Y Public Dynastic Rift#!, and grant the claimant power a five-year #Y Claim Throne#! casus belli."
 oe_dip2.8.title: "Disposition of the Royal Hostage"
 oe_dip2.8.desc: "Envoys have arrived to inquire after the foreign royal kinsman residing at our court as a peace surety. Whether we escort the hostage home with regal generosity to win renown or demand a handsome ransom before release now rests with the crown."
 oe_dip2.8.a: "Escort the royal hostage home with full ceremonial honors"
 oe_dip2.8.a.tt: "Repatriate the royal hostage, gaining #G +15#! prestige, five years of #Y Honorable Hostage Repatriation#!, and a major opinion boost with their homeland."
 oe_dip2.8.b: "Demand a royal ransom before granting safe conduct"
 oe_dip2.8.b.tt: "Return the royal hostage in exchange for a substantial gold ransom, at the cost of diplomatic resentment from their homeland."
 oe_dip2.8.c: "Defer the release and keep the hostage at court for now"
 oe_dip2.8.c.tt: "Retain the royal hostage for now at a minor cost of #R 2#! prestige; you may revisit this decision later."
 oe_dip2.9.title: "Secret Dossier from the Court Whisperer"
 oe_dip2.9.desc: "After midnight, our chief court whisperer places a wax-sealed ledger upon the royal desk: ironclad proof of magnates colluding with smugglers and foreign brokers to evade customs and sell court gossip. We may quietly squeeze them for coin or make a public example."
 oe_dip2.9.a: "Quietly extort the compromised cabal for the treasury"
 oe_dip2.9.a.tt: "Collect a substantial quiet fine into the treasury at the minor cost of #R 5#! prestige."
 oe_dip2.9.b: "Expose and purge the conspiracy in open council"
 oe_dip2.9.b.tt: "Gain #G +4#! stability and five years of #Y Court Factions Quieted#!, curbing rebel growth."
 oe_dip2.10.title: "W1 Espionage, Court & Cabinet Audit Readout"
 oe_dip2.10.desc: "#T v12.5 W1 (oe_dip2_) Read-Only Telemetry#!\n- Country: [ROOT.GetCountry.GetName]\n- Cumulative W1 Ops Count: #Y [ROOT.GetCountry.MakeScope.GetVariable('oe_dip2_rd_ops').GetValue|0]#!\n- Royal Cipher Bureau (0/1): #Y [ROOT.GetCountry.MakeScope.GetVariable('oe_dip2_rd_bureau').GetValue|0]#!  |  Court Whisperer Network (0/1): #Y [ROOT.GetCountry.MakeScope.GetVariable('oe_dip2_rd_whisper').GetValue|0]#!  |  Cipher Advantage (0/1): #Y [ROOT.GetCountry.MakeScope.GetVariable('oe_dip2_rd_cipher').GetValue|0]#!\n- W4 Cross-Worker Soft Flags — Ever-Normal Granary (oe_dip2_granary_active_flag): #Y [ROOT.GetCountry.MakeScope.GetVariable('oe_dip2_rd_granary').GetValue|0]#!  |  Coinage Anti-Debasement (oe_dip2_coinage_active_flag): #Y [ROOT.GetCountry.MakeScope.GetVariable('oe_dip2_rd_coinage').GetValue|0]#!\n- Living Royal Hostages at Court: #Y [ROOT.GetCountry.MakeScope.GetVariable('oe_dip2_rd_hostages').GetValue|0]#!"
 oe_dip2.10.a: "Close the W1 audit ledger"
 oe_dip2.10.a.tt: "This read-only telemetry event makes no gameplay changes."
