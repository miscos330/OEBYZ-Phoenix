 OE_THEME_UI_LOYALTY_TT: "Loyalty [Country.MakeScope.GetVariable('oe_theme_loyalty').GetValue|0], moving towards [Country.MakeScope.GetVariable('oe_theme_loyalty_target').GetValue|0].\nIt moves 1 point a month. Below 20, with a strategos three years in office, the theme may revolt each year."
