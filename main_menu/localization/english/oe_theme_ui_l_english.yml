 oe_theme_setup.1.t: "Founding the Themes"
 oe_theme_setup.1.d: "Most provinces of the empire lack anyone in charge. Following the old jurisdictions, themes can be founded and strategoi appointed everywhere at once, or the matter can be left to be weighed one theme at a time.\n\nRegions that can found a theme now: [ROOT.GetCountry.MakeScope.ScriptValue('oe_theme_setup_creatable_count')|0]"
 oe_theme_setup.1.a: "Found every theme along the historical regions"
 oe_theme_setup.1.a.tt: "Founds a theme in every historical region that qualifies, at no Authority cost."
 oe_theme_setup.1.b: "I will found them myself"
 oe_theme_setup.1.b.tt: "They can be founded later from the Themes tab of the Pillars of the Empire or the edicts, #Y 5#! Authority each."
 oe_theme_setup.2.t: "The Themes Are Founded"
 oe_theme_setup.2.d: "The decree is issued. [ROOT.GetCountry.MakeScope.GetVariable('oe_theme_found_all_count').GetValue|0] new themes have been founded and their strategoi have taken office."
 oe_theme_setup.2.a: "Good"
 oe_theme_found_all_action: "Found All Themes"
 oe_theme_found_all_action_desc: "Found a theme in every historical region that qualifies now, #R 5#! Authority each, stopping when Authority runs out."
 oe_theme_found_all_tt: "Founds a theme in every historical region that qualifies now, #Y 5#! Authority each."
 oe_theme_found_all_none_tt: "At least one historical region can found a theme"
 oe_theme_move_seat_action: "Move Theme Seat"
 oe_theme_move_seat_action_desc: "Move a theme's seat to another town or city in its own region. Costs #R 5#! Authority; cannot move again for #Y 10#! years."
 oe_theme_move_seat_select: "Choose a theme"
 oe_theme_move_seat_none: "@trigger_no!No other town or city in this region to move to"
 oe_theme_move_seat_tt: "The new seat is built first, then the old one removed; the seat modifier moves with it. Cannot move again for ten years."
 oe_te_eng_charter: "\nAlso: as a chartered city it pays the crown vanilla subject tribute at a price of #Y 15%#!, settled by the engine; the ledger cannot read it and it is not in 'remit'."
 oe_te_eng_civil: "\nAlso: as a theme on the civil course it pays the crown vanilla subject tribute at a price of #Y 10%#!, settled by the engine; the ledger cannot read it and it is not in 'remit'."
 oe_te_eng_none: ""
 OE_TE_CARD_LINE: "Crown/month: pay [Country.MakeScope.ScriptValue('oe_te_pay')|+=1] | staff [Country.MakeScope.ScriptValue('oe_te_off')|+=1] | remit [Country.MakeScope.ScriptValue('oe_te_trib')|+=1] | theme's tax base [Country.MakeScope.ScriptValue('oe_te_taxbase')|1] | [Country.MakeScope.ScriptValue('oe_theme_jurisdiction_size')|0] places no levy"
 OE_TE_CARD_TT: "#T The crown's account with this theme this month (read only)#!\nPay [Country.MakeScope.ScriptValue('oe_te_pay')|+=1]: the army pay of the Pillars, #Y 1#! gold a month (no inflation) x the pay slider [Country.MakeScope.ScriptValue('oe_te_slider_pct')|0]% x the force [Country.MakeScope.ScriptValue('oe_te_size')|1] (army size; ships for a naval theme). The crown pays this, and the sum is shared out by the same count, so this is also what the theme receives. The civil course and [Concept('oe_tu_charter','chartered cities')|e] draw no pay.\nStaff [Country.MakeScope.ScriptValue('oe_te_off')|+=1]: a judge and a fiscal officer sent from the capital cost the treasury #Y 0.8#! gold a month each for every location of the jurisdiction.\nRemit [Country.MakeScope.ScriptValue('oe_te_trib')|+=1]: #Y 10%#! of the theme's monthly income for an [Concept('oe_tu_exarchate','exarchate')|e], #Y 5%#! for a despotate, plus the [Concept('oe_tu_senate','senate')|e]'s levy; moved to the treasury this month if the theme can pay it in full, otherwise nothing.[Country.Custom('OeTeEngTrib')]\nTheme's tax-base take [Country.MakeScope.ScriptValue('oe_te_taxbase')|1]: all of the seat location's tax base [Country.MakeScope.ScriptValue('oe_te_seat_tb')|1] plus #Y 30%#! of the post locations' tax base [Country.MakeScope.ScriptValue('oe_te_post_tb')|1]. This is the theme's income; whether it comes out of the crown's taxes there has not been measured in the game yet, so it is not counted as the crown's loss. The seat also gives the theme a fixed #Y 10#! gold a month, not included here.\nNo levies: the theme buildings on the [Country.MakeScope.ScriptValue('oe_theme_jurisdiction_size')|0] locations of the jurisdiction put the local levy at #Y −300%#!, that is nothing.\n\nThis is only an account: worked out when the tab is open, it changes no number."
 OE_TE_SUM_LINE: "All themes, crown/month: pay [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_te_sum_pay')|+=1] | staff [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_te_sum_off')|+=1] | remit [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_te_sum_trib')|+=1] | net [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_te_sum_net')|+=1] | theme treasuries [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_te_sum_gold')|0]"
 OE_TE_SUM_TT: "#T The account of all themes this month (read only)#!\nPay [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_te_sum_pay')|+=1], staff [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_te_sum_off')|+=1], remit [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_te_sum_trib')|+=1], net [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_te_sum_net')|+=1] (tax base and levies not included).\nThe themes hold [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_te_sum_gold')|0] gold in their own treasuries, not in the crown's.\nThemes' tax-base take in all [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_te_sum_tb')|1]: the themes' income; whether it comes out of the crown's taxes has not been measured yet.\nJurisdiction locations in all: [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_te_sum_juris')|0]; they raise no levies.\n\nHow each item is worked out: see the tooltip of the 'Crown/month' line on each theme card. This is only an account: worked out when the tab is open, it changes no number."
