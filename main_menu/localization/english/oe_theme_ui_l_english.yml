 OE_THEME_UI_TENURE: "[Country.MakeScope.GetVariable('oe_theme_tenure').GetValue|0] months[Country.Custom('OeTgHouseMark')]"
 OE_THEME_UI_LOYALTY_TT: "Loyalty [Country.MakeScope.GetVariable('oe_theme_loyalty').GetValue|0], moving towards [Country.MakeScope.GetVariable('oe_theme_loyalty_target').GetValue|0].\nIt moves #Y 1#! point a month. Below #Y 20#!, with a strategos three years in office, the theme may revolt each year.\n\nThe target starts at #Y 50#! and adds the following (kept between #Y 0#! and #Y 100#!):\nArmy size [Country.MakeScope.ScriptValue('oe_tl_c_army')|+=0]\nStrategos's ability [Country.MakeScope.ScriptValue('oe_tl_c_skill')|+=1]\nStrategos's standing [Country.MakeScope.ScriptValue('oe_tl_c_kin')|+=0]\nTenure [Country.MakeScope.ScriptValue('oe_tl_c_tenure')|+=0]\nDistance from the capital [Country.MakeScope.ScriptValue('oe_tl_c_dist')|+=0]\nPolicy and status [Country.MakeScope.ScriptValue('oe_tl_c_course')|+=0]\nOfficials [Country.MakeScope.ScriptValue('oe_tl_c_staff')|+=0]\nPay [Country.MakeScope.ScriptValue('oe_tl_c_pay')|+=0]\nEmperor's legitimacy [Country.MakeScope.ScriptValue('oe_tl_c_legit')|+=1]\nEmperor's military skill [Country.MakeScope.ScriptValue('oe_tl_c_mil')|+=0]\nCourt intrigue [Country.MakeScope.ScriptValue('oe_tl_c_intrigue')|+=0]\nDeterrence [Country.MakeScope.ScriptValue('oe_tl_c_deter')|+=0]\nGreat house [Country.MakeScope.ScriptValue('oe_tl_c_house')|+=0]\nKatholikos kephale [Country.MakeScope.ScriptValue('oe_tl_c_region')|+=0]\nRecent events [Country.MakeScope.ScriptValue('oe_tl_c_recent')|+=0]"
 OE_THEME_UI_TIERS_TT: "Office tiers: military, civil, justice, finance, works.\nDisorder / Fair / Good / Excellent, setting the modifiers across the theme."
 OE_THEME_UI_PROJ_TT: "Works in progress: [Country.MakeScope.GetVariable('oe_theme_proj_months').GetValue|0] months left (#Y 0#! when none)."
 OE_THEME_UI_FOCUS_LABEL: "Course"
 OE_THEME_UI_BTN_FOCUS: "Course"
 OE_THEME_UI_BTN_OFFICIALS: "Staff"
 OE_THEME_UI_BTN_WORKS: "Works"
 OE_THEME_UI_BTN_FOCUS_DESC: "Set this theme's [oe_tu_course|e]: army, navy or civil (#Y 5#! Authority; cannot change again for five years). When the button is off, it is one of these: the last change was less than five years ago; [Concept('oe_tu_authority','imperial authority')|e] is under #Y 5#!; Latin [Concept('oe_tu_exarchate','exarchates')|e] and [Concept('oe_tu_charter','chartered cities')|e] cannot change course; no course is open (a [Concept('oe_tu_march','march')|e] cannot turn civil, a naval course needs a coastal seat)."
 OE_THEME_UI_BTN_OFFICIALS_DESC: "Decide whether judges and fiscal officers are sent from the capital or left to the strategos, or farm the taxes or pay in land grants ([oe_tu_pronoia|e]). Land grants need one of $pronoia_system$, $komnenian_formalization$, $palaeologan_hereditary_transition$ or $reformed_pronoia_system$ in the law '$administrative_system$'; until then the officials menu shows them as not yet available."
 OE_THEME_UI_BTN_WORKS_DESC: "Have the theme pay for a public work in its jurisdiction."
 OE_THEME_UI_BTN_FOUND_ALL: "Found all themes"
 OE_THEME_UI_BTN_FOUND_ALL_DESC: "Found a theme in every historical region that qualifies now, #Y 5#! Authority each, stopping when Authority runs out."
 oe_theme_setup.1.t: "Founding the Themes"
 oe_theme_setup.1.d: "Most provinces of the empire lack anyone in charge. Following the old jurisdictions, themes can be founded and strategoi appointed everywhere at once, or the matter can be left to be weighed one theme at a time.\n\nRegions that can found a theme now: [ROOT.GetCountry.MakeScope.ScriptValue('oe_theme_ui_creatable_count')|0]"
 oe_theme_setup.1.a: "Found every theme along the historical regions"
 oe_theme_setup.1.a.tt: "Founds a theme in every historical region that qualifies, at no Authority cost."
 oe_theme_setup.1.b: "I will found them myself"
 oe_theme_setup.1.b.tt: "They can be founded later from the Themes tab of the Pillars of the Empire or the edicts, #Y 5#! Authority each."
 oe_theme_setup.2.t: "The Themes Are Founded"
 oe_theme_setup.2.d: "The decree is issued. [ROOT.GetCountry.MakeScope.GetVariable('oe_theme_found_all_count').GetValue|0] new themes have been founded and their strategoi have taken office."
 oe_theme_setup.2.a: "Good"
 oe_theme_found_all_action: "Found All Themes"
 oe_theme_found_all_action_desc: "Found a theme in every historical region that qualifies now, #R 5#! Authority each, stopping when Authority runs out."
 oe_theme_found_all_tt: "Founds a theme in every historical region that qualifies now, #Y 5#! Authority each."
 oe_theme_found_all_none_tt: "At least one historical region can found a theme"
 oe_theme_move_seat_action: "Move Theme Seat"
 oe_theme_move_seat_action_desc: "Move a theme's seat to another town or city in its own region. Costs #R 5#! Authority; cannot move again for #Y 10#! years."
 oe_theme_move_seat_select: "Choose a theme"
 oe_theme_move_seat_none: "@trigger_no!No other town or city in this region to move to"
 oe_theme_move_seat_tt: "The new seat is built first, then the old one removed; the seat modifier moves with it. Cannot move again for ten years."
