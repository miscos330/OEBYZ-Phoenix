 STATIC_MODIFIER_NAME_oe_aud2_mod_east_asian_ensemble:0 "Imperial Bureau of Ritual Music"
 STATIC_MODIFIER_DESC_oe_aud2_mod_east_asian_ensemble:0 "Standardized chimes, guqin masters, and silk-and-bamboo ensembles harmonize court rites, academy learning, and diplomatic receptions."
