 oe_aud2_player_only_tt:0 "Only a player-controlled realm may patronize the Imperial Court Ensemble or toggle regional symphony suites"
 oe_aud2_dec_imperial_kapellmeister.title:0 "Imperial Court Kapellmeister & Symphony Suite"
 oe_aud2_dec_imperial_kapellmeister.desc:0 "Endow an Imperial Court Ensemble to honor the five Eurasian musical traditions (Byzantine Choir, East Asian Guqin & Pipa, Persian Santur & Steppe Fiddle, Indian Raga, and European Concert Symphony), granting a modest prestige and cultural bonus, or cycle your active regional suite mood (1-5)."
 oe_aud2_dec_imperial_kapellmeister.a:0 "Patronize the Imperial Court Ensemble"
 oe_aud2_dec_imperial_kapellmeister.b:0 "Cycle Regional Symphony Suite Mood (1-5)"
 oe_aud2_dec_patronize_tt:0 "Appoints an Imperial Court Kapellmeister for 10 years, grants +5 prestige (once per 10 years), and convenes the inaugural Imperial Choir assembly."
 oe_aud2_dec_cycle_suite_tt:0 "Cycles the realm's active regional symphony suite variable through all five Eurasian musical traditions (1 = Byzantine, 2 = East Asia, 3 = Persia & Steppe, 4 = India, 5 = Europe) before returning to automatic regional detection."
 oe_aud2.1.title:0 "Choir of Hagia Sophia & Imperial Brass"
 oe_aud2.1.desc:0 "Master cantors and palace trumpeters have assembled beneath our cathedral vaults, blending antiphonal Byzantine chant with resonant imperial brass. Scholars urge the throne to codify these vespers and coronation fanfares as an enduring charter of our court's majesty."
 oe_aud2.1.a:0 "Endow the Grand Liturgical Choir & Imperial Brass"
 oe_aud2.1.b:0 "Commission Secular Palace Fanfares for State Audiences"
 oe_aud2.2.title:0 "Court Conservatory of Guqin, Pipa & Palace Drums"
 oe_aud2.2.desc:0 "From Dadu's marble avenues to the canal pavilions of Jiangnan, renowned guqin scholars, pipa virtuosos, and ritual drummers seek royal patronage. Establishing a unified conservatory would harmonize court ceremony and spread refined letters across every province."
 oe_aud2.2.a:0 "Charter the Imperial Bureau of Ritual Music"
 oe_aud2.2.b:0 "Sponsor Silk-and-Bamboo Guilds Across the Realm"
 oe_aud2.3.title:0 "Assembly of Santur Masters, Steppe Bards & Raga Virtuosos"
 oe_aud2.3.desc:0 "Caravan roads linking Isfahan, Samarkand, the Orkhon steppe, and the Deccan have brought celebrated santur players, horsehead-fiddle epic singers, and morning-raga virtuosos to our capital. Patronizing their assembly will showcase the cosmopolitan splendor of our court."
 oe_aud2.3.a:0 "Convene the Grand Assembly of Maqam & Steppe Bards"
 oe_aud2.3.b:0 "Fund Caravan Conservatories Along the Imperial Routes"
 oe_aud2.4.title:0 "The Grand Concert Hall & Symphony of 1836"
 oe_aud2.4.desc:0 "Baroque pipe-organ traditions, chamber minuets, and full orchestral strings have converged in our capital's grand hall. Conductors propose commissioning a monumental Eurasian symphony celebrating five centuries of statecraft, maritime discovery, and scholarly triumph."
 oe_aud2.4.a:0 "Commission the Grand Symphony of 1836"
 oe_aud2.4.b:0 "Publish Printed Chamber Scores for Academies & Salons"
