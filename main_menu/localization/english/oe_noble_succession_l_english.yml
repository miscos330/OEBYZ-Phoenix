l_english:
 oe_nf_succession.title: "A House Without a Head"
 oe_nf_succession.desc: "The seal of the House of [SCOPE.sDynasty('oe_nf_succession_family').GetName] rests in the palace. No living relative within the Empire or its subject realms can assume its leadership. Yet old retainers have submitted a collateral genealogy: a distant kinsman is willing to return to the capital with his wife and son. The Emperor may recognize this branch and preserve the house, or close its register and remove its standing among the great families."
 oe_nf_succession.a: "Seek a distant kinsman to continue the house."
 oe_nf_succession.a.tt: "An #Y Orthodox#! kinsman arrives in Byzantium with his wife and son. He and his son belong to this dynasty; he becomes its head. The house retains its current Influence and holdings."
 oe_nf_succession.b: "Let this house pass into history."
 oe_nf_succession.b.tt: "Remove this dynasty from the great houses and clear its house-control modifiers from all holdings. The house limit remains unchanged, leaving a place for another family."
 oe_nf_succession.lapsed: "The matter has already been settled."
