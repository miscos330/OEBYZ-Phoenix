 OE_RW_FRANCE_DESC: "The old roads of Gaul cross vineyards and river valleys, linking towns that have changed banners many times. The imperial court is once again measuring the route from the Alpine passes to the western sea."
 oe_heg_plan_france_desc: "Scribes copy the rivers, passes and harbors of Gaul onto fresh charts. Before the imperial writ can cross the mountains, the army must have pack animals, provisions and pay."
 oe_heg_invade_france_desc: "Carry the imperial summons across the mountain passes to rulers who still hold Gallic land. Their capitals will provide the answer to the claims recorded in our ancient archives."
 oe_heg_mass_invade_france_desc: "Messengers leave by every road with the same decree. The campaign will strike the rulers whose courts stand in France; imperial officials will follow the legions to receive the gates and tax rolls of conquered towns."
 OE_RW_BRITAIN_DESC: "Across the Channel, old stone roads still cross the fields and legionary walls emerge through the rain. From the southwestern peninsula to the northern frontier, the former province returns to the imperial charts."
 oe_heg_plan_britain_desc: "Pilots report the winds and tides while quartermasters count the ships needed for the crossing. This return to Britain will encompass West Country, Home Counties, East Anglia, Midlands, Wales and Northumbria."
 oe_heg_invade_britain_desc: "An envoy crosses the Channel with a sealed imperial writ. Every ruler holding land within the planned theater may be called to answer it in their own capital."
 oe_heg_mass_invade_britain_desc: "Warships raise their sails, followed by transports and supply vessels. Every court within the planned theater will receive the declaration; conquered towns will enter the imperial rolls, while royal capitals await the settlement of the war."
