 OE_RW_FRANCE: "France"
 OE_RW_FRANCE_OPEN: "View France actions"
 OE_RW_FRANCE_ACTIONS: "France Actions"
 OE_RW_FRANCE_HINT: "Click the map to open its action panel here."
 OE_RW_PARIS: "Paris"
 OE_RW_PARIS_OWNER: "Current owner of Paris"
 OE_HEG_FRANCE_ACTIONS_HINT: "Prepare the campaign, then acquire an invasion claim or launch a mass invasion. Ordinary invasions have a three-month cooldown. All qualifying mass-invasion captures, including subject occupations, pass to Byzantium."
 OE_HEG_FRANCE_PLAN_REQUIRED: "Completed Plan the Invasion of France"
 OE_HEG_FRANCE_NO_ACTIVE_CAMPAIGN: "All designated opponents have ended their registered France campaign wars against Byzantium"
 oe_heg_plan_france: "Plan the Invasion of France"
 oe_heg_plan_france_effect: "Spend 1000 treasury gold to add the France region to the Roman World and unlock further actions. Once only."
 oe_heg_plan_france_done: "Completed: Plan the Invasion of France"
 oe_heg_invade_france: "Invade France"
 oe_heg_invade_france_effect: "Spend 100 treasury gold. Choose an external country owning land in the France region, excluding Byzantium and its subjects. Gain a fifteen-year casus belli to take its capital. Does not declare war. Repeatable with a three-month cooldown."
 oe_heg_mass_invade_france: "Mass Invasion of France"
 oe_heg_mass_invade_france_effect: "Spend 1000 treasury gold to declare war on all external countries with their capitals in the France region, excluding Byzantium and all levels of its subjects. Already hostile targets join the campaign. In the registered wars, qualifying noncapital locations in this territory owned by designated targets and occupied by Byzantium or its participating subjects immediately pass to Byzantium in ownership and control. Current capitals, outside land and other war participants are excluded. Each target loses eligibility immediately upon leaving its registered wars; later ordinary wars do not restore it. Repeatable after this campaign ends. Refund the cost if no eligible war is entered.\n\n$OE_HEG_MASS_INVASION_BONUS_TT$"
