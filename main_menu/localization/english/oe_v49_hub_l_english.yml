 oe_v49_hub.1.t: "Project Phoenix: Campaign Rules Hub"
 oe_v49_hub.1.d: "Welcome to #T Project Phoenix#!. Your five Lobby Game Rules have been synchronized seamlessly across all eras and expansion modules:\n\n#Y 1. Alt-History Scale#! — Balanced (default), Strict Historical, or Romantic AI Unleashed.\n#Y 2. Historical Easter Eggs#! — Player Choice (default), All Active, or Pure Historical Off.\n#Y 3. Endgame Crisis & Boss#! — Standard Balance Off (default), Fourth Rome Armada (1620+), or Global Coalition.\n#Y 4. World Megaprojects & Great Persons#! — 26 Three-Tier Wonders, Mercenaries & Great Persons Active (default) or Muted.\n#Y 5. Dynastic Ruler Portraits#! — 12-Era Dynastic Overhaul (default) or Vanilla Weights.\n\nConfirm to begin immediately, pick a one-click preset below, or open detailed toggles. You may revisit this hub anytime via the #Y Campaign Rules Hub#! decision."
 oe_v49_hub.1.a: "Confirm Current Settings & Begin"
 oe_v49_hub.1.b: "Enable Romantic Alt-History & All Easter Eggs"
 oe_v49_hub.1.c: "Enable Endgame Boss Crisis (1620+)"
 oe_v49_hub.1.e: "Open Detailed Sandbox Toggles"
 oe_v49_hub.2.t: "Rules Hub: Alt-History Scale"
 oe_v49_hub.2.d: "#T Alt-History Scale Configuration#!\nChoose how freely alternate-history miracles unfold across Eurasia and the oceans:\n\n- #Y Balanced#!: Players enjoy full freedom to unlock miracles while AI realms remain historically grounded.\n- #Y Strict Historical#!: Keeps campaigns strictly on historical rails.\n- #G Romantic Unleashed#!: Encourages AI empires to pursue Zheng He's Pacific voyages, Charlemagne-Irene diplomacy, a Varna crusade victory, and Qianlong's steam innovations."
 oe_v49_hub.2.a: "Set Balanced (Player Free / Historical AI)"
 oe_v49_hub.2.b: "Set Strict Historical (Historical Tracks Only)"
 oe_v49_hub.2.c: "Set Romantic Unleashed (AI Miracles Active)"
 oe_v49_hub.2.e: "Next: Historical Easter Eggs Toggles"
 oe_v49_hub.2.f: "Jump to: Endgame Boss, Wonders & Portraits"
 oe_v49_hub.2.z: "Return to Main Rules Hub"
 oe_v49_hub.3.t: "Rules Hub: Historical Easter Eggs"
 oe_v49_hub.3.d: "#T Historical Easter Eggs Configuration#!\nControl optional commemorative and legendary event chains across Project Phoenix:\n\n- #Y Player Choice#!: Hesperian Olympics active; St. Helena Return and Platonopolis remain player opt-in.\n- #G All Easter Eggs Active#!: Enables the Hesperian Olympics, St. Helena Return, and Platonopolis together.\n- #R Pure Historical (Off)#!: Disables every easter-egg chain for maximum historical austerity."
 oe_v49_hub.3.a: "Set Player Choice (Olympics On / Opt-In Chains)"
 oe_v49_hub.3.b: "Set All Easter Eggs Active"
 oe_v49_hub.3.c: "Set Pure Historical (Disable All Easter Eggs)"
 oe_v49_hub.3.e: "Next: Endgame Boss, Wonders & Portraits"
 oe_v49_hub.3.z: "Return to Main Rules Hub"
 oe_v49_hub.4.t: "Rules Hub: Endgame Crisis, Wonders & Portraits"
 oe_v49_hub.4.d: "#T Sandbox Expansion & Visual Toggles#!\nFine-tune late-game challenge, global sandbox systems, and dynastic ruler attire at any point in your campaign:\n\n- #Y Endgame Boss Crisis (1620+)#!: Activates or deactivates the Old-World Armada Expedition & late-game rival challenge.\n- #Y World Megaprojects & Great Persons#!: Enables or mutes the 26 three-tier Wonders, Mercenary/Privateer contracts, and Dynamic Great Persons.\n- #Y Dynastic Ruler Portraits#!: Switches between 12-era dynastic attire and base-game portrait weights."
 oe_v49_hub.4.a: "Toggle Endgame Boss Crisis (OFF / ON 1620+)"
 oe_v49_hub.4.b: "Toggle World Megaprojects & Great Persons (Active / Muted)"
 oe_v49_hub.4.c: "Toggle Ruler Portraits (Dynastic Overhaul / Vanilla Weights)"
