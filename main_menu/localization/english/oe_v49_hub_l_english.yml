 oe_v49_hub_open_console.title: "Project Phoenix: Campaign Rules Hub"
 oe_v49_hub_open_console.desc: "Open the Project Phoenix Campaign Rules Hub at any time to adjust Alt-History AI freedom, Historical Easter Eggs, Endgame Boss Crises, World Megaprojects & Great Persons, and Dynastic Ruler Portraits without restarting your campaign."
