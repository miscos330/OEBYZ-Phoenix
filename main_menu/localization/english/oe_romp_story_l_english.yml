 # NEW 2026-11-21 v9.8 Worker 4: Religio Romana Storyline, Hexapantheon Swapper, Decisions & O(1) Pulse (oe_romp_, 0 slots, 0 rules, 0 GUI, 0 vanilla overrides). Generated by gen_romp_story.py; edit the generator, not this file.
 oe_romp_dec_proclaim_religio_romana:0 "Proclaim Religio Romana"
 oe_romp_dec_proclaim_religio_romana.title:0 "Proclaim Religio Romana"
 oe_romp_dec_proclaim_religio_romana_desc:0 "From the lecture halls of Mystras to the marble terraces of the Capitoline, the ancient altars have never truly gone cold. The Emperor may formally restore Religio Romana and renew the Pax Deorum of Augustus and Julian."
 oe_romp_dec_proclaim_religio_romana.desc:0 "From the lecture halls of Mystras to the marble terraces of the Capitoline, the ancient altars have never truly gone cold. The Emperor may formally restore Religio Romana and renew the Pax Deorum of Augustus and Julian."
 oe_romp_dec_proclaim_religio_romana.a:0 "Rekindle the Imperial Altars and Proclaim Religio Romana"
 oe_romp_dec_proclaim_religio_romana_tt:0 "Activates #Y Religio Romana#! and its Omen system, converts the state and imperial house, raises a classical revival movement in the capital, and convenes the Pontifex Maximus coronation."
 oe_romp_human_only_tt:0 "Available to human players only"
 oe_romp_neo_leading_tt:0 "Neoplatonism leads the Empire's intellectual schools"
 oe_romp_dec_found_collegium_pontificum:0 "Establish the Collegium Pontificum"
 oe_romp_dec_found_collegium_pontificum.title:0 "Establish the Collegium Pontificum"
 oe_romp_dec_found_collegium_pontificum_desc:0 "Reconstitute the Collegium Pontificum under the Emperor as Pontifex Maximus to oversee the sacred calendar, augury, and temple rites across all realms of Religio Romana."
 oe_romp_dec_found_collegium_pontificum.desc:0 "Reconstitute the Collegium Pontificum under the Emperor as Pontifex Maximus to oversee the sacred calendar, augury, and temple rites across all realms of Religio Romana."
 oe_romp_dec_found_collegium_pontificum.a:0 "Promulgate the Charter of the Collegium Pontificum"
 oe_romp_dec_found_collegium_pontificum_tt:0 "Creates or joins the #Y Collegium Pontificum#! international organization, establishing imperial liturgical primacy across the Religio Romana world."
 oe_romp_dec_restore_temple_guide:0 "Grand Temples Restoration Ledger"
 oe_romp_dec_restore_temple_guide.title:0 "Grand Temples Restoration Ledger"
 oe_romp_dec_restore_temple_guide_desc:0 "Inspect the Pontifical Works Ledger detailing the nine restorable Grand Temples—Capitolium, Parthenon, Delphi, Olympia, Serapeum, Ephesus, Porphyry Column, Delos, and Mystras—and your Pax Deorum tier progress."
 oe_romp_dec_restore_temple_guide.desc:0 "Inspect the Pontifical Works Ledger detailing the nine restorable Grand Temples—Capitolium, Parthenon, Delphi, Olympia, Serapeum, Ephesus, Porphyry Column, Delos, and Mystras—and your Pax Deorum tier progress."
 oe_romp_dec_restore_temple_guide.a:0 "Consult the Nine Temples Ledger"
 oe_romp_dec_restore_temple_guide_tt:0 "Opens the #Y Nine Grand Temples Ledger#! window with a direct link to the Hexapantheon Seat Consecrator."
 oe_romp_dec_style_toggle:0 "Toggle Liturgical Style: Roman / Greco-Roman"
 oe_romp_dec_style_toggle.title:0 "Toggle Liturgical Style: Roman / Greco-Roman"
 oe_romp_dec_style_toggle_desc:0 "Switch imperial edicts, pontifical decrees, and ceremonial styling between classical 'Religio Romana' and 'Greco-Roman Polytheism' without affecting mechanics."
 oe_romp_dec_style_toggle.desc:0 "Switch imperial edicts, pontifical decrees, and ceremonial styling between classical 'Religio Romana' and 'Greco-Roman Polytheism' without affecting mechanics."
 oe_romp_dec_style_toggle.a:0 "Switch Imperial Liturgical Title Style"
 oe_romp_dec_style_toggle_tt:0 "Switches ceremonial styling between #Y Religio Romana#! and #Y Greco-Roman Polytheism#! (1-year cooldown)."
 oe_romp_style_cd_tt:0 "Liturgical style toggle is not on cooldown"
 oe_romp_art_sibylline_codex:0 "The Recompiled Sibylline Codex"
 oe_romp_art_sibylline_codex_desc:0 "A gilded ivory codex compiled by the Collegium Pontificum from Greek hexameter oracle fragments of Cumae, Ephesus, and Alexandria for state divination."
 oe_romp_art_logos_and_dao:0 "Treatise on Logos and the Dao"
 oe_romp_art_logos_and_dao_desc:0 "A cross-Eurasian philosophical treatise recording dialogues between pontifical envoys and Eastern sages, harmonizing Stoic Logos and Pax Deorum with Heaven and the Dao."
 oe_romp_art_grand_encyclopedia:0 "Grand Greco-Latin Encyclopedia of Nature"
 oe_romp_art_grand_encyclopedia_desc:0 "A monumental printed encyclopedia compiled by three hundred scholars of Constantinople, Rome, and Athens, uniting classical letters, Roman law, astronomy, and empirical science."
 oe_romp_art_symposium_dialogues:0 "Dialogues of the Mystras Neoplatonic Symposium"
 oe_romp_art_symposium_dialogues_desc:0 "Collected dialogues from the imperial Neoplatonic symposium debating the One, Logos, and civic virtue, prized across academies and pontifical libraries."
 oe_romp.1.title:0 "The Fragmentary Scroll of Julian"
 oe_romp.1.desc:0 "While cataloguing sealed purple-bound chests deep in the Great Palace archives, imperial scribes uncovered an unexpurgated late-fourth-century parchment of Emperor Julian's Hymn to King Helios, complete with marginalia on the ancient pontifical calendar. Word has already reached the Patriarchate, whose envoys demand that the pagan relic be consigned to the flames."
 oe_romp.1.a:0 "Seal it in the Imperial Study for Quiet Scholarship"
 oe_romp.1.a.tt:0 "Preserves Julian's manuscript, sowing the seeds of classical revival and keeping the Religio Romana storyline open."
 oe_romp.1.b:0 "Burn the Scroll Publicly to Reassure the Church"
 oe_romp.1.b.tt:0 "Permanently closes the Mystras pagan prelude chain (the Eternal City decision remains available if Rome is reclaimed)."
 oe_romp.2.title:0 "Plethon and the Book of Laws"
 oe_romp.2.desc:0 "In the hillside citadel of Mystras, the philosopher Gemistos Plethon has gathered a devoted circle around his clandestine Book of Laws—a sweeping blueprint uniting Platonic philosophy with the civic rites of Olympus and the Capitoline. In a bold memorandum to the throne, he argues that only by restoring the ancestral Roman sacred order can the Empire break its cycle of decline."
 oe_romp.2.a:0 "Quietly Patronize Plethon's Circle at Mystras"
 oe_romp.2.a.tt:0 "Enables #Y Religio Romana#! and its Omen system, fulfilling the Mystras prerequisite for the #Y Proclaim Religio Romana#! decision."
 oe_romp.2.b:0 "Suppress the Book of Laws and Disperse the Circle"
 oe_romp.2.b.tt:0 "Ends the Mystras classical prelude chain and appeases the clergy estate."
 oe_romp.3.title:0 "Wrath of Mount Athos and the Patriarchal Rebuke"
 oe_romp.3.desc:0 "Hesychast elders from Mount Athos have joined the Patriarch of Constantinople in a formal remonstrance against the court's protection of Mystras's Neoplatonic circles. Monastery bells toll across the Golden Horn and crowds gather before Hagia Sophia demanding an answer. The hour of ambiguity is passing: shall the throne bow to the synod, stall beneath scholarly cover, or kindle the altar of Sol Invictus?"
 oe_romp.3.a:0 "Condemn the Heresy and Uphold Orthodoxy"
 oe_romp.3.a.tt:0 "Exits the Religio Romana prelude storyline, restoring clerical trust and domestic stability."
 oe_romp.3.b:0 "Deflect the Synod Under the Cloak of Philosophy"
 oe_romp.3.b.tt:0 "Remains Christian for now while keeping the #Y Proclaim Religio Romana#! decision open whenever you choose."
 oe_romp.3.c:0 "Kindle the Altar of Sol Invictus — Restore Religio Romana!"
 oe_romp.3.c.tt:0 "Immediately converts the Empire and imperial dynasty to #Y Religio Romana#!, raises a revival movement in the capital, and fires the Pontifex Maximus coronation."
 oe_romp.4.title:0 "The Purple-Clad Pontifex Maximus"
 oe_romp.4.desc:0 "Beneath Constantine's Porphyry Column in the imperial forum, the Emperor assumes the laurel and staff of Pontifex Maximus, reviving the sacred office held by Augustus. Senators, legionary officers, and Hellenic scholars chant twin Latin and Greek invocations as the Collegium Pontificum is reconstituted—and the radiant throne of #Y Helios-Sol Invictus#! is unlocked for the Imperial Hexapantheon."
 oe_romp.4.a:0 "Follow Symmachus in Toleration: Pax Deorum for All"
 oe_romp.4.a.tt:0 "Establishes the #Y Collegium Pontificum#! and unlocks #Y Sol Invictus#! (seat via #Y Consecrate Pantheon Seat#! in the Religion panel), anchoring the restoration in humanist toleration."
 oe_romp.4.b:0 "Raise Aurelian's Solar Standard: Imperial Majesty Renewed"
 oe_romp.4.b.tt:0 "Establishes the #Y Collegium Pontificum#! and unlocks #Y Sol Invictus#! (seat via #Y Consecrate Pantheon Seat#! in the Religion panel), leading with legitimacy and classical prestige."
 oe_romp.5.title:0 "Recompilation of the Sibylline Books"
 oe_romp.5.desc:0 "By imperial mandate, the Collegium Pontificum has assembled ancient Greek hexameter fragments from Cumae, Ephesus, Alexandria, and Constantinople, restoring the Quindecimviri Sacris Faciundis. Bound in gilded ivory, the Recompiled Sibylline Codex now rests within the inner sanctum, ready to guide the state in war, plague, and peace."
 oe_romp.5.a:0 "Enshrine the Codex in the Pontifical Vault"
 oe_romp.5.a.tt:0 "Creates the masterpiece treatise #Y The Recompiled Sibylline Codex#! in the capital and grants religious influence."
 oe_romp.5.b:0 "Circulate Copies Across the Imperial Academies"
 oe_romp.5.b.tt:0 "Channels classical philology into research progress and cultural tradition."
 oe_romp.6.title:0 "The Fate of Hagia Sophia"
 oe_romp.6.desc:0 "Crowning the promontory of Constantinople, the soaring dome of Hagia Sophia has defined New Rome for a millennium. With Religio Romana restored, every province and foreign court watches its fate: shall it remain a protected Christian cathedral under a charter of toleration, be reconsecrated as the Grand Pantheon of Divine Wisdom and Sol Invictus, or stand open as a dual-rite sanctuary of universal wisdom?"
 oe_romp.6.a:0 "Protect It as an Imperial Christian Cathedral"
 oe_romp.6.a.tt:0 "Grants the permanent modifier #Y Hagia Sophia Preserved#!, greatly easing Christian subject unrest and foreign hostility."
 oe_romp.6.b:0 "Reconsecrate as the Grand Pantheon of Wisdom and Sol"
 oe_romp.6.b.tt:0 "Grants the permanent modifier #Y Hagia Sophia Grand Pantheon#!, boosting religious influence and prestige at the cost of clerical shock."
 oe_romp.6.c:0 "Establish a Dual-Rite Sanctuary of Eternal Wisdom"
 oe_romp.6.c.tt:0 "Grants the permanent modifier #Y Hagia Sophia Dual Sanctuary#!, balancing sacred authority and religious toleration."
 oe_romp.7.title:0 "Crusade Horns and the New Edict of Symmachus"
 oe_romp.7.desc:0 "News of the classical restoration in New Rome has sent shockwaves across Christendom. Western prelates and northern monarchs issue fiery denunciations warning of a 'pagan Caesar.' Before the Senate lie two competing edicts: one echoes fourth-century Senator Symmachus—'Not by one path alone can so great a mystery be reached'—guaranteeing Christian worship across the Empire; the other proclaims the uncompromising supremacy of the ancient gods."
 oe_romp.7.a:0 "Promulgate the New Edict of Symmachus"
 oe_romp.7.a.tt:0 "Grants #Y New Edict of Symmachus#! for 25 years, strengthening religious toleration and diplomatic standing."
 oe_romp.7.b:0 "Proclaim Classical Supremacy: Meet the World Under the Eagles"
 oe_romp.7.b.tt:0 "Grants #Y Classical Supremacy#! for 25 years, accelerating conversion and bolstering imperial martial ardor."
 oe_romp.8.title:0 "Return to the Parthenon of Athens"
 oe_romp.8.desc:0 "Imperial banners ascend the Sacred Way onto the Acropolis of Athens. Bathed in Aegean sunlight, the marble colonnade of the Parthenon endures across the centuries. Pontifical architects and sculptors await your decree to clear medieval encroachments, restore the Grand Temple of Athena Parthenos, and reopen the Attic academies."
 oe_romp.8.a:0 "Decree the Restoration of the Parthenon of Athena"
 oe_romp.8.a.tt:0 "If the #Y Restored Parthenon of Athena#! is not yet built in Athens, begins construction free of charge while boosting cultural tradition and research."
 oe_romp.8.b:0 "Hold an Acropolis Sacrifice and Strengthen the Priesthood"
 oe_romp.8.b.tt:0 "Grants immediate prestige and religious influence while leaving the Grand Temple to be built at your leisure."
 oe_romp.9.title:0 "Eagles on the Capitoline"
 oe_romp.9.desc:0 "The golden eagles fly once more above the Seven Hills of the Tiber! Marching up the Via Sacra to the Capitoline crest, the triumphal procession offers white bulls and laurel crowns upon the ancient altars of the Eternal City. With Rome reclaimed, four foundational Roman deities—#Y Juno Regina#!, #Y Vesta#!, #Y Janus Bifrons#!, and #Y Mars Ultor Quirinus#!—are unlocked for the Imperial Hexapantheon!"
 oe_romp.9.a:0 "Renew the Sacred Oath of the Capitoline Triad"
 oe_romp.9.a.tt:0 "Permanently unlocks #Y Juno#!, #Y Vesta#!, #Y Janus#!, and #Y Mars Ultor Quirinus#! (seat via #Y Consecrate Pantheon Seat#!; seating Juno alongside Jupiter and Minerva with the Capitoline Temple activates the Capitoline Triad synergy)."
 oe_romp.9.b:0 "Award Triumphal Laurels on the Campus Martius"
 oe_romp.9.b.tt:0 "Unlocks the same four foundational Roman deities while awarding army tradition and prestige."
 oe_romp.10.title:0 "The Gates of Janus"
 oe_romp.10.desc:0 "By ancestral Roman law descending from King Numa and Augustus, the twin bronze doors of the Temple of Janus may be closed only when peace reigns over land and sea. With every frontier momentarily quiet, the Pontifex Maximus and Senate solemnly seal the bronze gates, proclaiming a renewed Pax Romana across the Mediterranean."
 oe_romp.10.a:0 "Close the Bronze Doors and Proclaim Pax Romana"
 oe_romp.10.a.tt:0 "Grants #Y Closed Gates of Janus#! for 15 years, lifting prosperity, trade, and diplomatic harmony."
 oe_romp.10.b:0 "Keep the Gates Ajar and the Legions Watchful"
 oe_romp.10.b.tt:0 "Foregoes peacetime ease in favor of prestige and army tradition."
 oe_romp.11.title:0 "The Hearth Rekindled: The Vestal Virgins"
 oe_romp.11.desc:0 "Within the white marble rotunda, the Pontifex Maximus kindles pure solar fire with a bronze mirror and entrusts it to the newly consecrated Vestal Virgins. Ancestral Rome held that so long as Vesta's hearth burns undimmed, the commonwealth shall endure. With the flame rekindled, #Y Vesta#! is permanently unlocked for the Imperial Hexapantheon."
 oe_romp.11.a:0 "Swear the Oath of the Eternal Hearth"
 oe_romp.11.a.tt:0 "Ensures #Y Vesta#! (ADM pillar) is unlocked and grants stability and religious influence."
 oe_romp.11.b:0 "Enforce Vestal Civic Discipline in the Capital"
 oe_romp.11.b.tt:0 "Ensures #Y Vesta#! is unlocked while boosting legitimacy and cultural tradition."
 oe_romp.12.title:0 "Echoes of Olympia and Delphi"
 oe_romp.12.desc:0 "The Castalian Spring beneath Mount Parnassus murmurs once more, and envoys, poets, and athletes gather again along the ancient course of Olympia. Priests restore the Delphic tripod and Delian altars, formally unlocking #Y Apollo Phoebus#!—lord of light, music, prophecy, and reason—for the Imperial Hexapantheon."
 oe_romp.12.a:0 "Reopen the Delphic Oracle and Festival of the Muses"
 oe_romp.12.a.tt:0 "Permanently unlocks #Y Apollo Phoebus#! (DIP pillar) and grants cultural tradition and religious influence."
 oe_romp.12.b:0 "Dedicate Apollo's Precincts to Art and Learning"
 oe_romp.12.b.tt:0 "Permanently unlocks #Y Apollo Phoebus#! (DIP pillar) while advancing research and prestige."
 oe_romp.13.title:0 "The Serapeum of the Nile"
 oe_romp.13.desc:0 "The beacon of Alexandria shines once more upon imperial sails. Since the age of the Ptolemies and Hadrian, this great port of learning and grain fused Isis Pelagia—star of mariners and giver of the Nile flood—with Serapis into the classical pantheon through Interpretatio Romana. The Collegium now petitions to issue the Alexandrian Syncretism Edict, unlocking #Y Isis-Serapis#!."
 oe_romp.13.a:0 "Issue the Alexandrian Syncretism Edict and Restore the Serapeum"
 oe_romp.13.a.tt:0 "Permanently unlocks syncretic deity #Y Isis-Serapis#! (DIP pillar); begins construction of the #Y Grand Serapeum of Alexandria#! free of charge if not yet built."
 oe_romp.13.b:0 "Enact Syncretism and Invest in Alexandrian Scholarship"
 oe_romp.13.b.tt:0 "Permanently unlocks #Y Isis-Serapis#! (DIP pillar) and grants research progress and cultural tradition."
 oe_romp.14.title:0 "The Mithraic Covenant of Anatolia and Persia"
 oe_romp.14.desc:0 "Along the ancient military highways stretching from the Anatolian plateau toward Persia, imperial cataphracts and eastern cavalrymen have revived the subterranean brotherhoods once beloved by Rome's frontier legions. Beneath torchlit vaults painted with constellations, officers swear oaths of fidelity to the lord of light and covenants, petitioning to enroll #Y Mithras Invictus#! in the Hexapantheon."
 oe_romp.14.a:0 "Consecrate Mithras Invictus as Patron of the Cavalry"
 oe_romp.14.a.tt:0 "Permanently unlocks syncretic deity #Y Mithras Invictus#! (MIL pillar), granting army tradition and religious influence."
 oe_romp.14.b:0 "Integrate the Mithraic Mysteries Under Pontifical Supervision"
 oe_romp.14.b.tt:0 "Permanently unlocks #Y Mithras Invictus#! (MIL pillar) while boosting prestige and stability."
 oe_romp.15.title:0 "The Black Stone of Pessinus: Magna Mater Cybele"
 oe_romp.15.desc:0 "In 204 BC, when Hannibal threatened Rome's survival, the Senate obeyed the Sibylline Books and bore the sacred black meteorite of Magna Mater Cybele from Phrygia to the Palatine Hill. Now that imperial banners again command western Anatolia, priests present the mural-crowned Mother of the Gods to guard our ramparts and harvests, unlocking #Y Cybele Magna Mater#!."
 oe_romp.15.a:0 "Receive Magna Mater with Ancient Pomp"
 oe_romp.15.a.tt:0 "Permanently unlocks syncretic deity #Y Cybele Magna Mater#! (MIL pillar), granting stability and religious influence."
 oe_romp.15.b:0 "Send Her Priests to Bless the Frontier Garrisons"
 oe_romp.15.b.tt:0 "Permanently unlocks #Y Cybele Magna Mater#! (MIL pillar) while raising army tradition and prestige."
 oe_romp.16.title:0 "The Sacred Serpent of Epidaurus and Pergamon"
 oe_romp.16.desc:0 "Among the pine-shaded amphitheatre of Epidaurus and the colonnaded Asclepieion of Pergamon, physicians and priests have restored ancient aqueducts, healing porticoes, and Galenic herbals. Facing recurrent Eurasian pestilence, the Collegium proposes an imperial network of Asclepian sanctuaries and unlocks #Y Asclepius-Hygieia#! for the Hexapantheon."
 oe_romp.16.a:0 "Charter an Imperial Network of Asclepian Sanctuaries"
 oe_romp.16.a.tt:0 "Permanently unlocks #Y Asclepius-Hygieia#! (ADM pillar), advancing research, stability, and religious influence."
 oe_romp.16.b:0 "Compile and Distribute Classical Medical Treatises"
 oe_romp.16.b.tt:0 "Permanently unlocks #Y Asclepius-Hygieia#! (ADM pillar) and boosts cultural tradition and prestige."
 oe_romp.17.title:0 "Dharma Wheel of Gandhara: The Indo-Greek Dialogue"
 oe_romp.17.desc:0 "Along the ancient caravan routes once trod by Alexander and King Menander of Bactria, imperial Stoic and Neoplatonic scholars have met learned Indian sages in the ports and cities of Hindustan. Recalling the timeless dialogue of the Milinda Panha, both sides recognize a profound kinship between Rome's Pax Deorum and Eastern Dharma."
 oe_romp.17.a:0 "Seal the Indo-Greek Philosophical Concord"
 oe_romp.17.a.tt:0 "Grants the permanent modifier #Y Indo-Greek Philosophical Dialogue#!, enhancing toleration, research speed, and eastern trade influence."
 oe_romp.17.b:0 "Celebrate the Encounter with Art and Trade"
 oe_romp.17.b.tt:0 "Grants immediate prestige and cultural tradition across the Mediterranean-Indian horizon."
 oe_romp.18.title:0 "Stoa and Dao: Logos and the Mandate of Heaven"
 oe_romp.18.desc:0 "Envoys of the Collegium Pontificum travelling the Silk Roads to the Far East have held months of philosophical discourse with Confucian scholars and Daoist sages. When the Romans expound the Stoic Logos ordering the cosmos and the civic harmony of Pax Deorum, Eastern thinkers answer with the Dao and the Mandate of Heaven—recognizing two ancient empires united in reverence for cosmic order and civic virtue."
 oe_romp.18.a:0 "Compile the Treatise on Logos and the Dao"
 oe_romp.18.a.tt:0 "Grants the permanent modifier #Y Logos and Dao Dialogue#! and creates the masterpiece treatise #Y Treatise on Logos and the Dao#! in the capital."
 oe_romp.18.b:0 "Exchange Classical Scrolls and Diplomatic Honors"
 oe_romp.18.b.tt:0 "Grants cultural tradition and prestige celebrating Silk Road scholarship."
 oe_romp.19.title:0 "Sol Invictus and Heliocentrism"
 oe_romp.19.desc:0 "While foreign seminaries erupt in bitter censorship over the new astronomy, observatories across Constantinople, Rome, and Alexandria erupt in celebration! Turning to Julian's Hymn to King Helios and Pythagorean commentaries, imperial astronomers hail the heliocentric cosmos—with the Sun enthroned at the center of the spheres—as the grandest vindication of Sol Invictus. Here, science and ancient faith walk hand in hand."
 oe_romp.19.a:0 "Sanction the Solar Astronomy and Embrace Scientific Dawn"
 oe_romp.19.a.tt:0 "Grants #Y Heliocentric Dawn#! for 25 years, accelerating research and solar inspiration."
 oe_romp.19.b:0 "Erect Sundials and Armillary Spheres in the Temples"
 oe_romp.19.b.tt:0 "Grants religious influence and prestige celebrating sacred astronomy."
 oe_romp.20.title:0 "Neoclassical Rationalism vs. Sacred Tradition"
 oe_romp.20.desc:0 "As the age of Enlightenment dawns, two mighty currents contend within Religio Romana. The Solar Rationalists of the academies and printing houses envision a civic pantheon dedicated to natural reason, literacy, and constitutional toleration; the Sacred Traditionalists of the priesthood and mystery cults defend the living power of augury, sacred omens, and martial piety. Your decree shall define the Empire's modern soul."
 oe_romp.20.a:0 "Lead the Solar Enlightenment: Toward a Civic Pantheon"
 oe_romp.20.a.tt:0 "Grants the permanent endgame modifier #Y Solar Enlightenment#!, dramatically lifting research speed and maximum literacy."
 oe_romp.20.b:0 "Uphold Sacred Tradition: Exalt the Mysteries and Omens"
 oe_romp.20.b.tt:0 "Grants the permanent endgame modifier #Y Sacred Tradition#!, greatly strengthening omen power and imperial discipline."
 oe_romp.21.title:0 "The Greco-Latin Grand Encyclopedia"
 oe_romp.21.desc:0 "Three hundred scholars, jurists, and naturalists from Constantinople, Rome, and Athens have spent twenty years compiling the monumental Grand Greco-Latin Encyclopedia of Nature. Spanning Homeric letters, Roman jurisprudence, agronomy, hydraulics, astronomy, and modern experimental science, its printed volumes stand as an enduring bridge between antiquity and the Enlightenment."
 oe_romp.21.a:0 "Publish the Grand Encyclopedia with Imperial Preface"
 oe_romp.21.a.tt:0 "Grants the permanent modifier #Y Classical Encyclopedia#! and creates the masterpiece treatise #Y Grand Greco-Latin Encyclopedia of Nature#! in the capital."
 oe_romp.21.b:0 "Transform the Editorial Board into a Permanent Academy"
 oe_romp.21.b.tt:0 "Boosts cultural tradition and advances imperial research."
 oe_romp.22.title:0 "Civic Religion in the Age of Revolutions"
 oe_romp.22.desc:0 "Revolutionary tempests batter the thrones of the old continent. Yet across the lands of Religio Romana, the Senate, municipal assemblies, and the civic heritage of SPQR already command deep reverence. The Collegium proposes uniting the public festivals of the Pantheon with a constitutional civic charter, channeling revolutionary fervor into ordered Roman citizenship."
 oe_romp.22.a:0 "Enact the Civic Imperium Charter to Channel the Tide"
 oe_romp.22.a.tt:0 "Grants #Y Civic Imperium Charter#! for 25 years, stabilizing the realm and reinforcing civic cohesion."
 oe_romp.22.b:0 "Reaffirm Augustan Principate Legitimacy"
 oe_romp.22.b.tt:0 "Boosts legitimacy and prestige to weather the Age of Revolutions."
 oe_romp.23.title:0 "New Secular Games of the Pantheon City"
 oe_romp.23.desc:0 "With both Rome and Constantinople shining in twin splendor and the great classical temples restored across the Mediterranean, the Pontifex Maximus proclaims an unprecedented New Secular Games—Ludi Saeculares. By day, choirs sing Horace's Carmen Saeculare before the Capitoline and the Porphyry Column; by night, myriad torches illuminate the Tiber and the Bosphorus as envoys from afar celebrate a new Golden Age."
 oe_romp.23.a:0 "Sing the Carmen Saeculare — Hail the New Saeculum!"
 oe_romp.23.a.tt:0 "Grants the potent 25-year modifier #Y New Saeculum Golden Age#! alongside major prestige and cultural tradition."
 oe_romp.24.title:0 "Roma Aeterna: From Plethon to the Age of Enlightenment"
 oe_romp.24.desc:0 "Five centuries of history unfurl behind you: from Plethon's lonely lamp in Mystras and Julian's rediscovered scroll in the Great Palace, to the solar altar beneath the Porphyry Column, the returning eagles on the Capitoline, the Eurasian dialogues of gods and sages, and the dawn of neoclassical enlightenment. Religio Romana did not fade into antiquity—it forged a second millennium. Upon bronze tablets the chroniclers inscribe: Pax Deorum endures, and Roma Aeterna stands immortal!"
 oe_romp.24.a:0 "Inscribe the Bronze Tablets: Roma Aeterna, Pax Deorum!"
 oe_romp.24.a.tt:0 "Grants the permanent finale legacy modifier #Y Roma Aeterna Legacy#!, crowning five centuries of classical renaissance."
 oe_romp_ritual.1.title:0 "Consultation of the Sibylline Books"
 oe_romp_ritual.1.desc:0 "After solemn purification and incense, the Quindecimviri unseal the Sibylline Books within the inner sanctum. Three ancient Greek hexameter oracles illuminate the Empire's path: a martial oracle of Mars and Mithras for the legions, a healing oracle of Asclepius and Vesta against pestilence, and a civic oracle of Janus and Juno for prosperity. Which decree shall the Pontifex Maximus proclaim?"
 oe_romp_ritual.1.a:0 "Proclaim the Martial Oracle: Steel for the Legions"
 oe_romp_ritual.1.a.tt:0 "Grants #Y Sibylline Martial Oracle#! for 10 years; grants bonus army tradition if the #Y Augury & Sibylline Books#! aspect is active."
 oe_romp_ritual.1.b:0 "Proclaim the Healing Oracle: Shield the Realm from Plague"
 oe_romp_ritual.1.b.tt:0 "Grants #Y Sibylline Healing Oracle#! for 10 years; grants bonus stability if the #Y Augury & Sibylline Books#! aspect is active."
 oe_romp_ritual.1.c:0 "Proclaim the Civic Oracle: Prosperity and Peace"
 oe_romp_ritual.1.c.tt:0 "Grants #Y Sibylline Civic Oracle#! for 10 years; grants bonus religious influence if the #Y Augury & Sibylline Books#! aspect is active."
 oe_romp_ritual.2.title:0 "The Neoplatonic Symposium"
 oe_romp_ritual.2.desc:0 "Philosophers, astronomers, and rhetoricians gather beneath the marble colonnades in the tradition of Plato's Symposium and Plethon's Mystras circle to debate the One, the Logos, and just governance. A gifted philosopher offers to enter imperial service, while scholars across the provinces await your patronage."
 oe_romp_ritual.2.a:0 "Recruit the Philosopher to Court and Fund Research"
 oe_romp_ritual.2.a.tt:0 "Recruits a skilled #Y Philosopher#! artist, advances research, and grants #Y Neoplatonic Symposium Patronage#! for 12 years; creates a treatise artwork if #Y Plethon's Mistra Academy#! or #Y Monism#! is active."
 oe_romp_ritual.2.b:0 "Spread Patronage Across Provincial Academies"
 oe_romp_ritual.2.b.tt:0 "Grants #Y Neoplatonic Symposium Patronage#! for 12 years along with immediate cultural tradition and prestige."
 oe_romp_ritual.3.title:0 "Solar Boon: Radiance of Sol Invictus and Apollo"
 oe_romp_ritual.3.desc:0 "Following the autumn equinox, a luminous solar halo crowns the Porphyry Column and Apollo's altars beneath a cloudless sky. Priests and astronomers hail the sign as a direct blessing from your seated deities of light, foretelling lucid governance and flourishing arts."
 oe_romp_ritual.3.a:0 "Receive the Solar Radiance for Law and Learning"
 oe_romp_ritual.3.a.tt:0 "Grants legitimacy, research progress, and religious influence."
 oe_romp_ritual.3.b:0 "Hold a Festival of Light to Exalt Imperial Majesty"
 oe_romp_ritual.3.b.tt:0 "Grants prestige and cultural tradition."
 oe_romp_ritual.4.title:0 "Capitoline Blessing: Concord of Juno, Vesta, and Janus"
 oe_romp_ritual.4.desc:0 "Vesta's sacred flame burns clear and smokeless, Juno's peacocks display before the temple steps, and merchants throng the colonnades of Janus. Senators and provincial delegates gather in thanksgiving for civic harmony across the Empire."
 oe_romp_ritual.4.a:0 "Share the Blessing with the Commonwealth"
 oe_romp_ritual.4.a.tt:0 "Grants stability and religious influence."
 oe_romp_ritual.4.b:0 "Record the Auspices in the Pontifical Annals"
 oe_romp_ritual.4.b.tt:0 "Grants legitimacy and prestige."
 oe_romp_ritual.5.title:0 "Sign of the Sacred Serpent: Grace of Asclepius"
 oe_romp_ritual.5.desc:0 "Asclepian sanctuaries across the provinces report an auspicious season: healing springs run pure, medicinal herbs abound, and early outbreaks in the ports were swiftly quelled by temple physicians. Grateful citizens hang votive plaques praising Asclepius-Hygieia."
 oe_romp_ritual.5.a:0 "Reward the Healing Priesthood and Expand Sanitation"
 oe_romp_ritual.5.a.tt:0 "Grants stability and research progress."
 oe_romp_ritual.5.b:0 "Convene a Thanksgiving Rite to Asclepius"
 oe_romp_ritual.5.b.tt:0 "Grants religious influence and cultural tradition."
 oe_romp_ritual.6.title:0 "Banners of the Syncretic Pantheon"
 oe_romp_ritual.6.desc:0 "From Alexandrian merchant fleets sailing beneath Isis's star to frontier cataphracts and bastion garrisons invoking Mars Ultor, Mithras, and Cybele, your seated martial and syncretic deities inspire devotion across every province."
 oe_romp_ritual.6.a:0 "Review the Legions and Bestow Votive Standards"
 oe_romp_ritual.6.a.tt:0 "Grants army tradition and prestige."
 oe_romp_ritual.6.b:0 "Hold a Syncretic Thanksgiving for Imperial Unity"
 oe_romp_ritual.6.b.tt:0 "Grants religious influence and stability."
 oe_romp_ritual.10.title:0 "The Imperial Hexapantheon — Consecrate Pantheon Seats"
 oe_romp_ritual.10.desc:0 "The six marble niches of the Imperial Temple strictly follow the ancient Hexapantheon order—always housing exactly #Y 2 ADM, 2 DIP, and 2 MIL (6 active deities total)#!. As you reclaim Rome, restore sanctuaries, and enact Interpretatio Romana, up to ten new deities unlock for consecration. Choose which pillar to rearrange, or restore all six ancestral seats."
 oe_romp_ritual.10.a:0 "Consecrate ADM Pillar (Jupiter-Zeus / Venus-Aphrodite / Helios-Sol / Juno-Hera / Vesta-Hestia / Asclepius)"
 oe_romp_ritual.10.a.tt:0 "Opens the #Y ADM Pillar#! seat consecrator, strictly maintaining 2 active ADM deities."
 oe_romp_ritual.10.b:0 "Consecrate DIP Pillar (Neptune-Poseidon / Mercury-Hermes / Janus / Apollo / Isis-Serapis)"
 oe_romp_ritual.10.b.tt:0 "Opens the #Y DIP Pillar#! seat consecrator, strictly maintaining 2 active DIP deities."
 oe_romp_ritual.10.c:0 "Consecrate MIL Pillar (Mars-Ares / Minerva-Athena / Mars Ultor / Mithras / Cybele)"
 oe_romp_ritual.10.c.tt:0 "Opens the #Y MIL Pillar#! seat consecrator, strictly maintaining 2 active MIL deities."
 oe_romp_ritual.10.d:0 "Restore All Six Ancestral Seats (Jupiter-Zeus, Venus-Aphrodite, Neptune-Poseidon, Mercury-Hermes, Mars-Ares, Minerva-Athena)"
 oe_romp_ritual.10.d.tt:0 "Safely vacates all custom seats and restores the original 6 classical deities."
 oe_romp_ritual.10.e:0 "Leave the Hexapantheon Unchanged"
 oe_romp_ritual.10.e.tt:0 "Closes the consecration council without changes."
 oe_romp_ritual.11.title:0 "Ledger of the Nine Restorable Grand Temples"
 oe_romp_ritual.11.desc:0 "The Pontifical Works Office presents the nine fixed-location Grand Temples:\n• #Y Rome#! — Temple of Jupiter Optimus Maximus (with seated Juno-Hera + Jupiter-Zeus & Minerva-Athena triggers Capitoline Triad synergy)\n• #Y Athens#! — Restored Parthenon of Athena\n• #Y Salona (Delphi)#! — Sanctuary of the Delphic Oracle\n• #Y Pontikokastro (Olympia)#! — Grand Temple of Zeus at Olympia\n• #Y Alexandria#! — Grand Serapeum of Alexandria\n• #Y Ayasuluk (Ephesus)#! — Rebuilt Artemision of Ephesus\n• #Y Constantinople#! — Altar of the Porphyry Column of Sol (with seated Helios-Sol Invictus triggers Imperial Solar Radiance)\n• #Y Mykonos (Delos)#! — Sacred Precinct of Delos\n• #Y Mystras#! — Mystras Neoplatonic Sanctuary\n\n#Y Pax Deorum Automatic Tiers#!: Owning and restoring #G 3–4 temples#! activates Tier I, #G 5–6 temples#! unlocks Tier II, and #G 7 or more temples#! crowns the realm with Pax Deorum Restored!"
 oe_romp_ritual.11.a:0 "Close the Works Ledger"
 oe_romp_ritual.11.a.tt:0 "Return to imperial affairs."
 oe_romp_ritual.11.b:0 "Proceed to the Hexapantheon Seat Consecrator"
 oe_romp_ritual.11.b.tt:0 "Opens the #Y Hexapantheon Seat Consecrator#! to inspect or rearrange active deities."
 oe_romp_ritual.12.title:0 "ADM Pillar Seat Consecration"
 oe_romp_ritual.12.desc:0 "The ADM Pillar holds two niches: #Y Seat I (ancestral Jupiter-Zeus)#! and #Y Seat II (ancestral Venus-Aphrodite)#!. Tip: keeping Jupiter (Zeus) in Seat I while seating Juno (Hera) in Seat II (with Minerva-Athena seated in MIL) unlocks the #Y Capitoline Triad Synergy#! once the Capitoline Temple stands in Rome. Only unlocked deities not currently seated are shown."
 oe_romp_ritual.12.a:0 "Seat II: Consecrate Helios-Sol Invictus"
 oe_romp_ritual.12.a.tt:0 "Replaces the current ADM Seat II deity with #Y Helios-Sol Invictus#! (5 solar omens; synergizes with the Porphyry Column)."
 oe_romp_ritual.12.b:0 "Seat II: Consecrate Juno Regina (Hera)"
 oe_romp_ritual.12.b.tt:0 "Replaces the current ADM Seat II deity with #Y Juno Regina (Hera)#! (preserves Jupiter-Zeus & Minerva-Athena for the Capitoline Triad)."
 oe_romp_ritual.12.c:0 "Seat II: Consecrate Vesta (Hestia)"
 oe_romp_ritual.12.c.tt:0 "Replaces the current ADM Seat II deity with #Y Vesta (Hestia)#! (stability, prosperity, and hearth blessings)."
 oe_romp_ritual.12.d:0 "Seat II: Consecrate Asclepius-Hygieia"
 oe_romp_ritual.12.d.tt:0 "Replaces the current ADM Seat II deity with #Y Asclepius-Hygieia#! (disease resistance, plague shield, and growth)."
 oe_romp_ritual.12.e:0 "Seat II: Restore Venus (Aphrodite)"
 oe_romp_ritual.12.e.tt:0 "Vacates ADM Seat II and restores ancestral #Y Venus (Aphrodite)#!."
 oe_romp_ritual.12.f:0 "Seat I: Consecrate Helios-Sol Invictus (Jupiter-Zeus's Seat)"
 oe_romp_ritual.12.f.tt:0 "Replaces the current ADM Seat I deity with #Y Helios-Sol Invictus#!, allowing two new ADM deities at once."
 oe_romp_ritual.12.g:0 "Seat I: Consecrate Juno Regina (Hera) (Seat I)"
 oe_romp_ritual.12.g.tt:0 "Replaces the current ADM Seat I deity with #Y Juno Regina (Hera)#!."
 oe_romp_ritual.12.h:0 "Seat I: Consecrate Vesta (Hestia) (Seat I)"
 oe_romp_ritual.12.h.tt:0 "Replaces the current ADM Seat I deity with #Y Vesta (Hestia)#!."
 oe_romp_ritual.12.i:0 "Seat I: Consecrate Asclepius-Hygieia (Seat I)"
 oe_romp_ritual.12.i.tt:0 "Replaces the current ADM Seat I deity with #Y Asclepius-Hygieia#!."
 oe_romp_ritual.12.j:0 "Seat I: Restore Jupiter (Zeus)"
 oe_romp_ritual.12.j.tt:0 "Vacates ADM Seat I and restores ancestral #Y Jupiter (Zeus)#!."
 oe_romp_ritual.12.z:0 "Return to the Hexapantheon Council"
 oe_romp_ritual.13.title:0 "DIP Pillar Seat Consecration"
 oe_romp_ritual.13.desc:0 "The DIP Pillar holds two niches: #Y Seat I (ancestral Neptune-Poseidon)#! and #Y Seat II (ancestral Mercury-Hermes)#!. Consecrate unlocked Janus, Apollo, or Isis-Serapis while strictly preserving 2 active DIP deities."
 oe_romp_ritual.13.a:0 "Seat II: Consecrate Janus Bifrons"
 oe_romp_ritual.13.a.tt:0 "Replaces the current DIP Seat II deity with #Y Janus Bifrons#! (peacetime prosperity, trade, and counter-espionage)."
 oe_romp_ritual.13.b:0 "Seat II: Consecrate Apollo Phoebus"
 oe_romp_ritual.13.b.tt:0 "Replaces the current DIP Seat II deity with #Y Apollo Phoebus#! (artists, literacy, research, and culture)."
 oe_romp_ritual.13.c:0 "Seat II: Consecrate Isis-Serapis"
 oe_romp_ritual.13.c.tt:0 "Replaces the current DIP Seat II deity with #Y Isis-Serapis#! (toleration, maritime presence, and grain)."
 oe_romp_ritual.13.d:0 "Seat II: Restore Mercury (Hermes)"
 oe_romp_ritual.13.d.tt:0 "Vacates DIP Seat II and restores ancestral #Y Mercury (Hermes)#!."
 oe_romp_ritual.13.e:0 "Seat I: Consecrate Janus Bifrons (Seat I)"
 oe_romp_ritual.13.e.tt:0 "Replaces the current DIP Seat I deity with #Y Janus Bifrons#!."
 oe_romp_ritual.13.f:0 "Seat I: Consecrate Apollo Phoebus (Neptune-Poseidon's Seat)"
 oe_romp_ritual.13.f.tt:0 "Replaces the current DIP Seat I deity with #Y Apollo Phoebus#!."
 oe_romp_ritual.13.g:0 "Seat I: Consecrate Isis-Serapis (Seat I)"
 oe_romp_ritual.13.g.tt:0 "Replaces the current DIP Seat I deity with #Y Isis-Serapis#!."
 oe_romp_ritual.13.h:0 "Seat I: Restore Neptune (Poseidon)"
 oe_romp_ritual.13.h.tt:0 "Vacates DIP Seat I and restores ancestral #Y Neptune (Poseidon)#!."
 oe_romp_ritual.13.z:0 "Return to the Hexapantheon Council"
 oe_romp_ritual.14.title:0 "MIL Pillar Seat Consecration"
 oe_romp_ritual.14.desc:0 "The MIL Pillar holds two niches: #Y Seat I (ancestral Mars-Ares)#! and #Y Seat II (ancestral Minerva-Athena)#!. Replacing Seat I by default preserves Minerva (Athena) for the Capitoline Triad synergy, while Seat II lets you field two new martial deities at once—strictly maintaining 2 active MIL deities."
 oe_romp_ritual.14.a:0 "Seat I: Consecrate Mars Ultor & Romulus (Quirinus)"
 oe_romp_ritual.14.a.tt:0 "Replaces the current MIL Seat I deity with #Y Mars Ultor & Romulus (Quirinus)#! (heavy infantry, discipline, and siege power)."
 oe_romp_ritual.14.b:0 "Seat I: Consecrate Mithras Invictus"
 oe_romp_ritual.14.b.tt:0 "Replaces the current MIL Seat I deity with #Y Mithras Invictus#! (heavy cavalry, morale, and campaign logistics)."
 oe_romp_ritual.14.c:0 "Seat I: Consecrate Cybele Magna Mater"
 oe_romp_ritual.14.c.tt:0 "Replaces the current MIL Seat I deity with #Y Cybele Magna Mater#! (fort defense, garrisons, and hostile attrition)."
 oe_romp_ritual.14.d:0 "Seat I: Restore Mars (Ares)"
 oe_romp_ritual.14.d.tt:0 "Vacates MIL Seat I and restores ancestral #Y Mars (Ares)#!."
 oe_romp_ritual.14.e:0 "Seat II: Consecrate Mars Ultor & Romulus (Minerva-Athena's Seat)"
 oe_romp_ritual.14.e.tt:0 "Replaces the current MIL Seat II deity with #Y Mars Ultor & Romulus (Quirinus)#!."
 oe_romp_ritual.14.f:0 "Seat II: Consecrate Mithras Invictus (Minerva-Athena's Seat)"
 oe_romp_ritual.14.f.tt:0 "Replaces the current MIL Seat II deity with #Y Mithras Invictus#!."
 oe_romp_ritual.14.g:0 "Seat II: Consecrate Cybele Magna Mater (Minerva-Athena's Seat)"
 oe_romp_ritual.14.g.tt:0 "Replaces the current MIL Seat II deity with #Y Cybele Magna Mater#!."
 oe_romp_ritual.14.h:0 "Seat II: Restore Minerva (Athena)"
 oe_romp_ritual.14.h.tt:0 "Vacates MIL Seat II and restores ancestral #Y Minerva (Athena)#!."
 oe_romp_ritual.14.z:0 "Return to the Hexapantheon Council"
