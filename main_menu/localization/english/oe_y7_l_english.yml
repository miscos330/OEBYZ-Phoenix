 oe_y7.32.e.tt: "This line's part in Dadu's story ends here: Dadu's modifiers and the title of Regent come off. What follows (Dadu changing hands in a peace, the court moving, the Northern Yuan) is left to the game's own events."
 oe_y7.33.t: "Mandate of the Prince of Zhennan at Yangzhou"
 oe_y7.33.d: "#F The Prince of Zhennan's household held Yangzhou, guarding the Huai canal arteries and the lower Yangzi crossing (History of Yuan, 108).#!\n\nNow Bolod Buqa, the Prince of Zhennan, oversees defense around Yangzhou. The court debates whether to grant full bureau powers, recall the household to Dadu, or grant a frontier charter."
 oe_y7.33.a: "Grant full powers as a Princely Military Bureau"
 oe_y7.33.a.tt: "The Yangzhou circuit gains [ShowModifier('oe_y7_prince_shumiyuan_seat')] for 10 years and raises 2 guard cavalry regiments from manpower.\nCourt opinion #R −3#!."
 oe_y7.33.b: "Recall the prince to strengthen Dadu's guard"
 oe_y7.33.b.tt: "Ends the local garrison seat at Yangzhou and grants [ShowModifier('oe_y7_prince_capital_guard')] for 15 years."
 oe_y7.33.c: "Enfeoff as a frontier and maritime march prince"
 oe_y7.33.c.tt: "Gains [ShowModifier('oe_y7_prince_overseas_marque')] for 20 years to project frontier and maritime prestige.\nTarget of the momentum of suppression #G +5#! (this part fades by #Y 1#! a month)."
 oe_y7.34.t: "Mandate of the Prince of Weishun at Wuchang"
 oe_y7.34.d: "#F The Prince of Weishun held Wuchang at the junction of the middle Yangzi and the Han River; amidst rebellion, the office's mandate requires imperial direction (History of Yuan, 117).#!\n\nNow Könchek Buqa, the Prince of Weishun, oversees defense around Wuchang. The court debates whether to grant full bureau powers, recall the household to Dadu, or grant a frontier charter."
 oe_y7.34.a: "Grant full powers as a Princely Military Bureau"
 oe_y7.34.a.tt: "The Wuchang circuit gains [ShowModifier('oe_y7_prince_shumiyuan_seat')] for 10 years and raises 2 guard cavalry regiments from manpower.\nCourt opinion #R −3#!."
 oe_y7.34.b: "Recall the prince to strengthen Dadu's guard"
 oe_y7.34.b.tt: "Ends the local garrison seat at Wuchang and grants [ShowModifier('oe_y7_prince_capital_guard')] for 15 years."
 oe_y7.34.c: "Enfeoff as a frontier and maritime march prince"
 oe_y7.34.c.tt: "Gains [ShowModifier('oe_y7_prince_overseas_marque')] for 20 years to project frontier and maritime prestige.\nTarget of the momentum of suppression #G +5#! (this part fades by #Y 1#! a month)."
 oe_y7.35.t: "Mandate of the Prince of Xuanrang at Luzhou"
 oe_y7.35.d: "#F The Prince of Xuanrang held Luzhou at the gateway of Huai-West; the court must decide whether to grant full bureau powers or recall the prince to guard Dadu (History of Yuan, 108 and 117).#!\n\nNow Temür Buqa, the Prince of Xuanrang, oversees defense around Luzhou. The court debates whether to grant full bureau powers, recall the household to Dadu, or grant a frontier charter."
 oe_y7.35.a: "Grant full powers as a Princely Military Bureau"
 oe_y7.35.a.tt: "The Luzhou circuit gains [ShowModifier('oe_y7_prince_shumiyuan_seat')] for 10 years and raises 2 guard cavalry regiments from manpower.\nCourt opinion #R −3#!."
 oe_y7.35.b: "Recall the prince to strengthen Dadu's guard"
 oe_y7.35.b.tt: "Ends the local garrison seat at Luzhou and grants [ShowModifier('oe_y7_prince_capital_guard')] for 15 years."
 oe_y7.35.c: "Enfeoff as a frontier and maritime march prince"
 oe_y7.35.c.tt: "Gains [ShowModifier('oe_y7_prince_overseas_marque')] for 20 years to project frontier and maritime prestige.\nTarget of the momentum of suppression #G +5#! (this part fades by #Y 1#! a month)."
