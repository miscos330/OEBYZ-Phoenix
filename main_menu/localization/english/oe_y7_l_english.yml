l_english:
 # NEW 2026-11-19 Yuan track Y7 (oe_y7_ the late-Yuan suppression). Generated by gen_yuan_y7.py; edit the generator, not this file.
 STATIC_MODIFIER_NAME_oe_y7_court_command: "Command from the Court"
 STATIC_MODIFIER_DESC_oe_y7_court_command: "A great minister of the court commands the armies of every circuit, making up for part of the levies lost to the Red Turbans and the Mongol-Han strife. More shares give a larger bonus."
 STATIC_MODIFIER_NAME_oe_y7_militia: "Militia Myriarchies"
 STATIC_MODIFIER_DESC_oe_y7_militia: "The court gives local magnates offices and lets them raise men against the rebels."
 STATIC_MODIFIER_NAME_oe_y7_warlord_army: "Generals Hold the Armies"
 STATIC_MODIFIER_DESC_oe_y7_warlord_army: "After the great army scattered, the militia generals keep their own men, and the court's orders carry less weight in the camps."
 STATIC_MODIFIER_NAME_oe_y7_general_sway: "The Generals Grow Mighty"
 STATIC_MODIFIER_DESC_oe_y7_general_sway: "The generals each hold great armies and act at their own discretion; their standing now outweighs the court's orders."
 STATIC_MODIFIER_NAME_oe_y7_tammachi_hold: "Mongol Garrisons Hold"
 STATIC_MODIFIER_DESC_oe_y7_tammachi_hold: "The Mongol and Tammachi troops of Henan and Shandong stay in their posts and hold the cities."
 STATIC_MODIFIER_NAME_oe_y7_garrison_thin: "Thin Garrisons"
 STATIC_MODIFIER_DESC_oe_y7_garrison_thin: "The Mongol troops of Henan and Shandong have all gone to war; the cities are thinly held."
 STATIC_MODIFIER_NAME_oe_y7_touxia_levy: "The Five Touxia March"
 STATIC_MODIFIER_DESC_oe_y7_touxia_levy: "The Prince of Lu leads the men of the Five Touxia, the Khongirad and their kin, to the war."
 STATIC_MODIFIER_NAME_oe_y7_scattered: "The Great Army Scattered"
 STATIC_MODIFIER_DESC_oe_y7_scattered: "The edict against the chancellor reached the camp, and the army of a reputed million scattered in a day; many went over to the rebels."
 STATIC_MODIFIER_NAME_oe_y7_court_rift: "A Divided Court"
 STATIC_MODIFIER_DESC_oe_y7_court_rift: "The emperor kept the chancellor against every voice, and the accusers are bitter."
 STATIC_MODIFIER_NAME_oe_y7_restoration: "The Zhizheng Restoration"
 STATIC_MODIFIER_DESC_oe_y7_restoration: "Gaoyou has fallen and the chancellor stays; court and country hope for a restoration."
 STATIC_MODIFIER_NAME_oe_y7_despair: "Hearts Turn Away"
 STATIC_MODIFIER_DESC_oe_y7_despair: "The court's armies keep losing, and the people no longer believe it can end the rising."
 STATIC_MODIFIER_NAME_oe_y7_seat_guard: "A Prince's Seat"
 STATIC_MODIFIER_DESC_oe_y7_seat_guard: "A prince's household and guard are posted here."
 STATIC_MODIFIER_NAME_oe_y7_garrison: "Huai and Yangzi Garrison"
 STATIC_MODIFIER_DESC_oe_y7_garrison: "Since the conquest, Han troops and the Newly Submitted Army have garrisoned the great cities south of the Huai and the Yangzi."
 STATIC_MODIFIER_NAME_oe_y7_title_zhennan: "Prince of Zhennan"
 STATIC_MODIFIER_DESC_oe_y7_title_zhennan: "The Prince of Zhennan named in the History of Yuan, holding Yangzhou."
 STATIC_MODIFIER_NAME_oe_y7_title_weishun: "Prince of Weishun"
 STATIC_MODIFIER_DESC_oe_y7_title_weishun: "The Prince of Weishun named in the History of Yuan, holding Wuchang."
 STATIC_MODIFIER_NAME_oe_y7_title_xuanrang: "Prince of Xuanrang"
 STATIC_MODIFIER_DESC_oe_y7_title_xuanrang: "The Prince of Xuanrang named in the History of Yuan, holding Luzhou."
 STATIC_MODIFIER_NAME_oe_y7_title_chaghan: "Militia Leader"
 STATIC_MODIFIER_DESC_oe_y7_title_chaghan: "A Naiman whose family lived at Shenqiu in Yingzhou; raised a loyalist militia against the rebels in 1352."
 STATIC_MODIFIER_NAME_oe_y7_bolod_regime: "Bolod Temür Rules the Court"
 STATIC_MODIFIER_DESC_oe_y7_bolod_regime: "Bolod Temür entered the capital as chancellor, put the emperor's favourites to death, stopped needless building in the palaces, purged the eunuchs and cut spending; yet court and country alike see an overbearing general."
 STATIC_MODIFIER_NAME_oe_y7_bolod_command: "Commander of All the Realm's Armies"
 STATIC_MODIFIER_DESC_oe_y7_bolod_command: "The emperor leans on Bolod Temür against the crown prince's party and gives Bolod Temür command of all the realm's armies."
 STATIC_MODIFIER_NAME_oe_y7_two_courts: "The Two Courts at Odds"
 STATIC_MODIFIER_DESC_oe_y7_two_courts: "The emperor will not act against Bolod Temür; the crown prince's party is bitter, and the court splits in two."
 STATIC_MODIFIER_NAME_oe_y7_title_bolod: "Grand Commandant"
 STATIC_MODIFIER_DESC_oe_y7_title_bolod: "A son of Dashi Badur; made Grand Commandant in the third month of the twenty-second Zhizheng year (1362) and posted with an army at Datong (History of Yuan, 46 and 207)."
 STATIC_MODIFIER_NAME_oe_y7_heir_command: "The Crown Prince Commands"
 STATIC_MODIFIER_DESC_oe_y7_heir_command: "The crown prince commands the armies in person: the troops are keener, but orders now come from two places."
 STATIC_MODIFIER_NAME_oe_y7_title_henan: "Prince of Henan"
 STATIC_MODIFIER_DESC_oe_y7_title_henan: "Made Prince of Henan in the intercalary tenth month of the twenty-fifth Zhizheng year (1365), to take the field in the crown prince's place with command of every army of Guanzhong, Shanxi, Hebei, Shandong and the lands to the south (History of Yuan, 46 and 141)."
 STATIC_MODIFIER_NAME_oe_y7_title_huai: "Prince of Huai"
 STATIC_MODIFIER_DESC_oe_y7_title_huai: "Temür Buqa, the Prince of Xuanrang, was raised to Prince of Huai in the eighth month of the twenty-seventh Zhizheng year (1367) (History of Yuan, 47 and 117)."
 STATIC_MODIFIER_NAME_oe_y7_title_regent: "Regent of the Capital"
 STATIC_MODIFIER_DESC_oe_y7_title_regent: "Left behind by the emperor going north, with orders to hold the capital and see to the affairs of state (History of Yuan, 47)."
 STATIC_MODIFIER_NAME_oe_y7_dadu_stand: "The Capital Held"
 STATIC_MODIFIER_DESC_oe_y7_dadu_stand: "The emperor will not go north, and the guards of the palace man the walls."
 STATIC_MODIFIER_NAME_oe_y7_dadu_left: "The Emperor Gone North"
 STATIC_MODIFIER_DESC_oe_y7_dadu_left: "The emperor left by the Jiande gate in the night and went north; only the princes and ministers left behind hold the capital."
 STATIC_MODIFIER_NAME_oe_y7_rtr_yuan_crisis: "Red Turban Upheaval"
 STATIC_MODIFIER_DESC_oe_y7_rtr_yuan_crisis: "Uprisings erupt across the realm, straining court administration, levies, and rebel containment while keeping mobilization viable."
 STATIC_MODIFIER_NAME_oe_y7_strife_levy_floor: "Wartime Mobilization Floor"
 STATIC_MODIFIER_DESC_oe_y7_strife_levy_floor: "Emergency mobilization measures offset factional strife so the dynasty retains a baseline levy and upkeep floor."
 STATIC_MODIFIER_NAME_oe_y7_ai_factional_decay: "Factional Court Decay"
 STATIC_MODIFIER_DESC_oe_y7_ai_factional_decay: "Relentless factional infighting erodes imperial administration, shrinking levies, tax income, garrison readiness, and army morale."
 STATIC_MODIFIER_NAME_oe_y7_ai_gaoyou_collapse: "Post-Gaoyou Command Collapse"
 STATIC_MODIFIER_DESC_oe_y7_ai_gaoyou_collapse: "After the sudden dismissal at Gaoyou, central command collapses, leaving levies, morale, and garrisons weakened for years."
 STATIC_MODIFIER_NAME_oe_y7_rtr_support_of_the_people: "Support of the People"
 STATIC_MODIFIER_DESC_oe_y7_rtr_support_of_the_people: "Popular backing steadies rebel morale, discipline, and levy effectiveness within balanced bounds."
 STATIC_MODIFIER_NAME_oe_y7_mng_zhu_command: "Command of the Huai-West Host"
 STATIC_MODIFIER_DESC_oe_y7_mng_zhu_command: "Disciplined leadership rallies the Huai-West armies and accelerates provincial integration."
 STATIC_MODIFIER_NAME_oe_y7_mng_mandate_surge: "Mandate of the Huai-West Banner"
 STATIC_MODIFIER_DESC_oe_y7_mng_mandate_surge: "Rallied beneath the Ming banner at Jinling, loyal followers surge forward with faster levy recovery, sharper sieges, and higher morale."
 STATIC_MODIFIER_NAME_oe_y7_prince_shumiyuan_seat: "Princely Branch Military Bureau"
 STATIC_MODIFIER_DESC_oe_y7_prince_shumiyuan_seat: "An empowered garrison prince operates a regional military bureau, bolstering local levies, defenses, and order."
 STATIC_MODIFIER_NAME_oe_y7_prince_capital_guard: "Princely Capital Guard"
 STATIC_MODIFIER_DESC_oe_y7_prince_capital_guard: "Recalled garrison princes reinforce the imperial guard at Dadu, lifting defense and army morale."
 STATIC_MODIFIER_NAME_oe_y7_prince_overseas_marque: "Frontier and Maritime Princely Charter"
 STATIC_MODIFIER_DESC_oe_y7_prince_overseas_marque: "Reassigned to frontier and maritime marches after pacification, the princes extend imperial reach and prestige."
 STATIC_MODIFIER_NAME_oe_y7_act_marshal_mod: "Grand Marshal Command"
 STATIC_MODIFIER_DESC_oe_y7_act_marshal_mod: "A newly commissioned supreme marshal rallies field armies and improves military upkeep."
 STATIC_MODIFIER_NAME_oe_y7_act_mediate_mod: "Reconciled Field Commanders"
 STATIC_MODIFIER_DESC_oe_y7_act_mediate_mod: "Imperial mediation eases rivalries among frontier generals, restoring cabinet efficiency and morale."
 STATIC_MODIFIER_NAME_oe_y7_rtr_branch_shumiyuan_loc: "Branch Secretariat Wartime Mandate"
 STATIC_MODIFIER_DESC_oe_y7_rtr_branch_shumiyuan_loc: "Wartime plenary powers raise local control, levies, and pacification across the branch secretariat."
 STATIC_MODIFIER_NAME_oe_y7_act_white_lotus_mod: "White Lotus Gathering"
 STATIC_MODIFIER_DESC_oe_y7_act_white_lotus_mod: "Displaced peasants flock to the rebel banners, accelerating levy recovery and mobilization."
 STATIC_MODIFIER_NAME_oe_y7_act_tuntian_mod: "High Walls and Full Granaries"
 STATIC_MODIFIER_DESC_oe_y7_act_tuntian_mod: "Fortified towns and military farm colonies deepen rebel defensive and food resilience."
 STATIC_MODIFIER_NAME_oe_y7_act_north_expedition_mod: "Northern Expedition Proclamation"
 STATIC_MODIFIER_DESC_oe_y7_act_north_expedition_mod: "A grand northern expedition proclamation sharpens rebel siegecraft and battlefield morale."
 oe_y7_bias_awe: "Awed by the Yuan's Arms"
 oe_y7_bias_amnesty: "Holds the Court's Titles"
 oe_y7_bias_terror: "The Massacre at Xuzhou"
 oe_y7_bias_submit: "Pardoned after Gaoyou"
 oe_y7_bias_estranged: "Estranged from the Court"
 oe_y7_bias_trusted: "Trusted by the Court"
 oe_y7_bias_feud: "Feud in Guanzhong"
 oe_y7_bias_prince_summon: "Summoned to Defend the Throne"
 oe_y7.1.t: "The Red Turbans Rise at Yingzhou"
 oe_y7.1.d1: "#F In the fifth month of the eleventh Zhizheng year (1351) Liu Futong rose at Yingzhou under the sign of the red turban and took the city; in the same month the court sent Tuchi of the Bureau of Military Affairs against the rebels (History of Yuan, 42). The Princes of Xuanrang and Weishun had been demoted by Bayan and were restored once Toqto'a held power (History of Yuan, 117).#!\n\nNow the red turbans are everywhere, and Chancellor Toqto'a asks to command all the realm's armies.\nThe Princes of Zhennan (Yangzhou), Weishun (Wuchang) and Xuanrang (Luzhou) have mustered at their seats: a prince whose seat the Yuan still holds takes the guard into the field, and the seat's circuit gets [ShowModifier('oe_y7_seat_guard')]; of Yangzhou, Huai'an, Luzhou, Jiqing, Hangzhou, Wuchang, Longxing, Xiangyang and Anqing, every city the Yuan still holds gets [ShowModifier('oe_y7_garrison')] (gone with the city; all of it ends from 1360).\nHan Shantong slipped out of prison in the confusion.\nNote: the #bold #color_yellow momentum of suppression#!#! (#Y 0#!–#Y 100#!) moves at most #Y 3#! points a month toward its target, set by the Yuan's land in China, the number of Red Turban states, the war and events; #bold #color_yellow court opinion#!#! matters only while Toqto'a is in charge and bears on whether Toqto'a will later be dismissed."
 oe_y7.1.d2: "#F In the fifth month of the eleventh Zhizheng year (1351) Liu Futong rose at Yingzhou under the sign of the red turban and took the city; in the same month the court sent Tuchi of the Bureau of Military Affairs against the rebels (History of Yuan, 42). The Princes of Xuanrang and Weishun had been demoted by Bayan and were restored once Toqto'a held power (History of Yuan, 117).#!\n\nNow the red turbans are everywhere, and Chancellor Toqto'a asks to command all the realm's armies.\nThe Princes of Zhennan (Yangzhou), Weishun (Wuchang) and Xuanrang (Luzhou) have mustered at their seats: a prince whose seat the Yuan still holds takes the guard into the field, and the seat's circuit gets [ShowModifier('oe_y7_seat_guard')]; of Yangzhou, Huai'an, Luzhou, Jiqing, Hangzhou, Wuchang, Longxing, Xiangyang and Anqing, every city the Yuan still holds gets [ShowModifier('oe_y7_garrison')] (gone with the city; all of it ends from 1360).\nNote: the #bold #color_yellow momentum of suppression#!#! (#Y 0#!–#Y 100#!) moves at most #Y 3#! points a month toward its target, set by the Yuan's land in China, the number of Red Turban states, the war and events; #bold #color_yellow court opinion#!#! matters only while Toqto'a is in charge and bears on whether Toqto'a will later be dismissed."
 oe_y7.1.d3: "#F In the fifth month of the eleventh Zhizheng year (1351) Liu Futong rose at Yingzhou under the sign of the red turban and took the city; in the same month the court sent Tuchi of the Bureau of Military Affairs against the rebels (History of Yuan, 42). The Princes of Xuanrang and Weishun had been demoted by Bayan and were restored once Toqto'a held power (History of Yuan, 117).#!\n\nNow the red turbans are everywhere, and no great minister at court holds the armies together.\nThe Princes of Zhennan (Yangzhou), Weishun (Wuchang) and Xuanrang (Luzhou) have mustered at their seats: a prince whose seat the Yuan still holds takes the guard into the field, and the seat's circuit gets [ShowModifier('oe_y7_seat_guard')]; of Yangzhou, Huai'an, Luzhou, Jiqing, Hangzhou, Wuchang, Longxing, Xiangyang and Anqing, every city the Yuan still holds gets [ShowModifier('oe_y7_garrison')] (gone with the city; all of it ends from 1360).\nHan Shantong slipped out of prison in the confusion.\nNote: the #bold #color_yellow momentum of suppression#!#! (#Y 0#!–#Y 100#!) moves at most #Y 3#! points a month toward its target, set by the Yuan's land in China, the number of Red Turban states, the war and events; #bold #color_yellow court opinion#!#! matters only while Toqto'a is in charge and bears on whether Toqto'a will later be dismissed."
 oe_y7.1.d: "#F In the fifth month of the eleventh Zhizheng year (1351) Liu Futong rose at Yingzhou under the sign of the red turban and took the city; in the same month the court sent Tuchi of the Bureau of Military Affairs against the rebels (History of Yuan, 42). The Princes of Xuanrang and Weishun had been demoted by Bayan and were restored once Toqto'a held power (History of Yuan, 117).#!\n\nNow the red turbans are everywhere, and no great minister at court holds the armies together.\nThe Princes of Zhennan (Yangzhou), Weishun (Wuchang) and Xuanrang (Luzhou) have mustered at their seats: a prince whose seat the Yuan still holds takes the guard into the field, and the seat's circuit gets [ShowModifier('oe_y7_seat_guard')]; of Yangzhou, Huai'an, Luzhou, Jiqing, Hangzhou, Wuchang, Longxing, Xiangyang and Anqing, every city the Yuan still holds gets [ShowModifier('oe_y7_garrison')] (gone with the city; all of it ends from 1360).\nNote: the #bold #color_yellow momentum of suppression#!#! (#Y 0#!–#Y 100#!) moves at most #Y 3#! points a month toward its target, set by the Yuan's land in China, the number of Red Turban states, the war and events; #bold #color_yellow court opinion#!#! matters only while Toqto'a is in charge and bears on whether Toqto'a will later be dismissed."
 oe_y7.1.a: "Give Chancellor Toqto'a command of all the realm's armies"
 oe_y7.1.a.tt: "Gain [ShowModifier('oe_y7_court_command')]: #Y 2#! shares, until the Gaoyou campaign is decided.\nCourt opinion is set to #Y 60#!, the momentum of suppression to #Y 50#!."
 oe_y7.1.b: "Let the princes and the branch secretariats hunt the rebels themselves"
 oe_y7.1.b.tt: "Gain [ShowModifier('oe_y7_court_command')]: #Y 1#! share, until the Gaoyou campaign is decided.\nCourt opinion is set to #Y 50#!, the momentum of suppression to #Y 45#!.\nThe princes' [ShowModifier('oe_y7_seat_guard')] counts #Y 2#! times."
 oe_y7.1.c: "Give the Bureau of Military Affairs the command; the princes and the branch secretariats hunt the rebels"
 oe_y7.1.c.tt: "Gain [ShowModifier('oe_y7_court_command')]: #Y 1#! share, until the Gaoyou campaign is decided.\nCourt opinion is set to #Y 50#!, the momentum of suppression to #Y 40#!.\nThe princes' [ShowModifier('oe_y7_seat_guard')] counts #Y 2#! times."
 oe_y7.2.t: "The Tammachi and the Five Touxia"
 oe_y7.2.d: "#F The Treatise on the Army in the History of Yuan says that while the princes guarded the frontiers, Henan and Shandong, the heart of the realm, were held by Mongol and Tammachi troops in great camps, and the land south of the Huai and the Yangzi by Han troops and the Newly Submitted Army. In the eighth month of the twelfth Zhizheng year (1352) the court sent Kuoqie, a Hanlin academician, to keep order among the people of the Five Touxia (History of Yuan, 42).#!\n\nNow the Mongol and Tammachi troops of Henan and Shandong are still at their posts, and the people of the Five Touxia, the Khongirad and their kin, can be called up."
 oe_y7.2.a: "Send every Mongol soldier of Henan and Shandong to the war"
 oe_y7.2.a.tt: "#Y 2#! regiments (#Y 1#! light horse, #Y 1#! heavy horse) appear at the Yuan's location nearest Bianliang, under a newly appointed Mongol myriarch.\nGain [ShowModifier('oe_y7_garrison_thin')] for #Y 5#! years.\nTarget of the momentum of suppression #G +5#! (this part fades by #Y 1#! a month)."
 oe_y7.2.b: "Keep them at their posts to hold the cities"
 oe_y7.2.b.tt: "Gain [ShowModifier('oe_y7_tammachi_hold')] until the Gaoyou campaign is decided.\nTarget of the momentum of suppression #G +2#! (this part fades by #Y 1#! a month)."
 oe_y7.2.c: "Call on the Prince of Lu to lead the Five Touxia"
 oe_y7.2.c.tt: "#Y 2#! regiments (#Y 2#! heavy horse) appear at the Yuan's location nearest Bianliang, raised from the Prince of Lu's land.\nGain [ShowModifier('oe_y7_touxia_levy')] for #Y 3#! years.\nThe Prince of Lu's loyalty #R −5#!.\nTarget of the momentum of suppression #G +4#! (this part fades by #Y 1#! a month)."
 oe_y7.3.t: "Panic at Shahe"
 oe_y7.3.d: "#F In the intercalary third month of the twelfth Zhizheng year (1352) Esen Temür of the Bureau of Military Affairs camped at Shahe; a panic broke out in the night and the army fled, falling back to Zhuxian and leaving all its stores and weapons behind (History of Yuan, 42 and 138). Esen Temür was Chancellor Toqto'a's younger brother.#!\n\nNow a camp at the front has broken up in a single night, and every army has lost heart.\nEvery Yuan army has lost #R 15%#! of its morale; target of the momentum of suppression #R −8#! (this part fades by #Y 1#! a month)."
 oe_y7.3.a: "Take Esen Temür's command away"
 oe_y7.3.a.tt: "Court opinion #R −5#!.\nTarget of the momentum of suppression #G +3#! (this part fades by #Y 1#! a month)."
 oe_y7.3.b: "Let the chancellor shield the chancellor's brother"
 oe_y7.3.b.tt: "When the court later weighs the chancellor's faults, dismissal is more likely (weight +5)."
 oe_y7.4.t: "Loyalist Militias Rise"
 oe_y7.4.d: "#F In the twelfth Zhizheng year (1352) Chaghan Temür of Shenqiu and Li Siqi of Luoshan raised loyalist militias against the rebels; they began with a few hundred men and soon had ten thousand (History of Yuan, 141). In 1353 and 1354 the court set up militia chiliarchies and myriarchies in Jiangxi, Henan, Huainan and elsewhere (History of Yuan, 43).#!\n\nNow the local magnates of Henan ask the court for offices and for leave to raise men against the rebels."
 oe_y7.4.a: "Grant them offices and set up militia myriarchies"
 oe_y7.4.a.tt: "Gain [ShowModifier('oe_y7_militia')]; after the Gaoyou campaign it becomes [ShowModifier('oe_y7_warlord_army')].\n#Y 2#! regiments (#Y 1#! light foot, #Y 1#! light horse) appear at the Yuan's location nearest Shenqiu, under Chaghan Temür.\nLoyalty of the Henan Jiangbei branch secretariat #G +3#!.\nTarget of the momentum of suppression #G +6#! (this part fades by #Y 1#! a month)."
 oe_y7.4.b: "Forbid private musters and trust the regular army"
 oe_y7.4.b.tt: "Court opinion #G +5#!.\nTarget of the momentum of suppression #R −4#! (this part fades by #Y 1#! a month)."
 oe_y7.5.t: "The Xuzhou Campaign"
 oe_y7.5.d1: "#F In the eighth month of the eleventh Zhizheng year (1351) Sesame Li and others took Xuzhou. In the eighth month of the next year Toqto'a, as Chancellor of the Right, took a branch of the Secretariat into the field to direct all the armies against Xuzhou (History of Yuan, 42).#!\n\nNow Xuzhou is in the hands of [SCOPE.sCountry('oe_y7_o').GetName], and the Grand Canal is cut.\nCampaign: the Yuan wins if it controls Xuzhou within #Y 6#! months."
 oe_y7.5.d: "#F In the eighth month of the eleventh Zhizheng year (1351) Sesame Li and others took Xuzhou. In the eighth month of the next year Toqto'a, as Chancellor of the Right, took a branch of the Secretariat into the field to direct all the armies against Xuzhou (History of Yuan, 42).#!\n\nNow Xuzhou is out of the Yuan's hands, and the Grand Canal is cut.\nCampaign: the Yuan wins if it controls Xuzhou within #Y 6#! months."
 oe_y7.5.a: "The chancellor takes the field"
 oe_y7.5.a.tt: "#Y 3#! regiments (#Y 1#! light foot, #Y 1#! heavy foot, #Y 1#! light horse) appear at the Yuan's location nearest Xuzhou.\nCourt opinion #R −3#!."
 oe_y7.5.b: "Send generals"
 oe_y7.5.b.tt: "#Y 2#! regiments (#Y 1#! light foot, #Y 1#! light horse) appear at the Yuan's location nearest Xuzhou."
 oe_y7.6.t: "The Xuzhou Campaign: the Outcome"
 oe_y7.6.d1: "#F In the ninth month of the twelfth Zhizheng year (1352) Toqto'a retook Xuzhou and put the city to the sword; Sesame Li fled, and Toqto'a was made Grand Preceptor in the camp (History of Yuan, 42 and 138).#!\n\nNow the court's armies are inside Xuzhou."
 oe_y7.6.d: "#F In the ninth month of the twelfth Zhizheng year (1352) Toqto'a retook Xuzhou and put the city to the sword; Sesame Li fled, and Toqto'a was made Grand Preceptor in the camp (History of Yuan, 42 and 138).#!\n\nNow the time is up, and the court's armies still do not hold Xuzhou."
 oe_y7.6.a: "Make an example of the city"
 oe_y7.6.a.tt: "Xuzhou's population #R −20%#!; every warlord's opinion of the Yuan #R −25#! for #Y 10#! years (#bold #color_yellow The Massacre at Xuzhou#!#!).\nTarget of the momentum of suppression #G +12#! (this part fades by #Y 1#! a month).\nCourt opinion #G +8#!.\nIn the war with Xuzhou's defender, the Yuan's war score #G +15#!.\nLoyalty of the Henan Jiangbei branch secretariat #G +5#!."
 oe_y7.6.b: "Pardon those who were forced to follow"
 oe_y7.6.b.tt: "Target of the momentum of suppression #G +8#! (this part fades by #Y 1#! a month).\nCourt opinion #G +5#!.\nIn the war with Xuzhou's defender, the Yuan's war score #G +15#!.\nLoyalty of the Henan Jiangbei branch secretariat #G +5#!."
 oe_y7.6.c: "Fall back to hold the land north of the Huai"
 oe_y7.6.c.tt: "Target of the momentum of suppression #R −10#! (this part fades by #Y 1#! a month).\nCourt opinion #R −8#!."
 oe_y7.7.t: "A Prince Loses the Seat"
 oe_y7.7.d1: "#F The line of the Prince of Zhennan had held Yangzhou since Toghon; Bolod Buqa succeeded in the second Tianli year (1329) (History of Yuan, 108).#!\n\nNow Yangzhou is out of the Yuan's hands, and Bolod Buqa, the Prince of Zhennan, has fallen back with the army.\nThe [ShowModifier('oe_y7_seat_guard')] of Yangzhou is gone; target of the momentum of suppression #R −6#! (this part fades by #Y 1#! a month); loyalty of the Henan Jiangbei branch secretariat #R −5#!."
 oe_y7.7.d2: "#F In the first month of the twelfth Zhizheng year (1352) Zou Pusheng took Wuchang; Könchek Buqa, the Prince of Weishun, and the Manager of Governmental Affairs Heshang abandoned the city, and the court took back the prince's seal (History of Yuan, 42 and 117).#!\n\nNow Wuchang is out of the Yuan's hands, and Könchek Buqa, the Prince of Weishun, has fallen back with the army.\nThe [ShowModifier('oe_y7_seat_guard')] of Wuchang is gone; target of the momentum of suppression #R −6#! (this part fades by #Y 1#! a month); loyalty of the Huguang branch secretariat #R −5#!."
 oe_y7.7.d: "#F Temür Buqa, once Prince of Zhennan, was made Prince of Xuanrang in the second Tianli year (1329) and moved to Luzhou; in the sixth month of the twelfth Zhizheng year (1352) the prince was rewarded for clearing Luzhou of rebels (History of Yuan, 108 and 42).#!\n\nNow Luzhou is out of the Yuan's hands, and Temür Buqa, the Prince of Xuanrang, has fallen back with the army.\nThe [ShowModifier('oe_y7_seat_guard')] of Luzhou is gone; target of the momentum of suppression #R −6#! (this part fades by #Y 1#! a month); loyalty of the Henan Jiangbei branch secretariat #R −5#!."
 oe_y7.7.a: "Take back the prince's seal"
 oe_y7.7.a.tt: "The prince no longer commands an army.\nCourt opinion #G +3#!.\nEvery member prince's loyalty #R −2#! (the house is uneasy to see a prince lose the seal)."
 oe_y7.7.b: "Order the prince to atone in the field"
 oe_y7.7.b.tt: "The prince keeps the command.\nCourt opinion #R −2#!."
 oe_y7.8.t: "A Prince Returns to the Seat"
 oe_y7.8.d1: "#F In the twelfth month of the fourteenth Zhizheng year (1354) the Prince of Weishun was ordered back to Huguang (History of Yuan, 43).#!\n\nNow Yangzhou is the Yuan's again, and Bolod Buqa, the Prince of Zhennan, asks to return to the seat."
 oe_y7.8.d2: "#F In the twelfth month of the fourteenth Zhizheng year (1354) the Prince of Weishun was ordered back to Huguang (History of Yuan, 43).#!\n\nNow Wuchang is the Yuan's again, and Könchek Buqa, the Prince of Weishun, asks to return to the seat."
 oe_y7.8.d: "#F In the twelfth month of the fourteenth Zhizheng year (1354) the Prince of Weishun was ordered back to Huguang (History of Yuan, 43).#!\n\nNow Luzhou is the Yuan's again, and Temür Buqa, the Prince of Xuanrang, asks to return to the seat."
 oe_y7.8.a: "Return the prince to the seat and the seal"
 oe_y7.8.a.tt: "The seat's circuit gets [ShowModifier('oe_y7_seat_guard')] again; a Yuan army at the seat without a commander gets the prince.\nTarget of the momentum of suppression #G +4#! (this part fades by #Y 1#! a month)."
 oe_y7.8.b: "Leave it to the branch secretariat's officials"
 oe_y7.8.b.tt: "The prince does not return to the seat.\nCourt opinion #G +3#!."
 oe_y7.9.t: "Amnesty"
 oe_y7.9.d: "#F Fang Guozhen submitted and rose again more than once. In the fourth month of the fifteenth Zhizheng year (1355) the court sent envoys to win Zhang Shicheng over and told Bolod Buqa, the Prince of Zhennan, to confer with the Huainan branch secretariat (History of Yuan, 44).#!\n\nNow [SCOPE.sCountry('oe_y7_o').GetName] is losing the war and sends envoys offering to accept the court's titles."
 oe_y7.9.a: "Grant titles and accept the submission"
 oe_y7.9.a.tt: "Their allegiance #G +60#!; their opinion of the Yuan #G +100#! for #Y 24#! months (#bold #color_yellow Holds the Court’s Titles#!#!); white peace between the two.\nCourt opinion #R −3#!.\nOnce the goodwill runs out, allegiance falls month by month again. That is why they submit and rise again.\nIf they hold the grain lands of the south, grain can be asked of them each spring and shipped north."
 oe_y7.9.b: "Refuse; they must be destroyed"
 oe_y7.9.b.tt: "Target of the momentum of suppression #G +3#! (this part fades by #Y 1#! a month)."
 oe_y7.10.t: "Hama's Slander"
 oe_y7.10.d1: "#F In the first month of the thirteenth Zhizheng year (1353) Hama became Manager of Governmental Affairs in the Secretariat; that year Hama and others secretly brought Tibetan monks to the emperor (History of Yuan, 43).#!\n\nNow Hama comes and goes in the palace and keeps telling Empress Ki and the crown prince of the chancellor's faults.\nEmpress Ki and Hama work together: dismissal later becomes more likely (weight +5)."
 oe_y7.10.d: "#F In the first month of the thirteenth Zhizheng year (1353) Hama became Manager of Governmental Affairs in the Secretariat; that year Hama and others secretly brought Tibetan monks to the emperor (History of Yuan, 43).#!\n\nNow Hama comes and goes in the palace and keeps telling the emperor of the chancellor's faults."
 oe_y7.10.a: "Rely on Toqto'a and keep Hama away"
 oe_y7.10.a.tt: "Court opinion #G +8#!. From now on court opinion falls by #R 1#! every #Y 4#! months."
 oe_y7.10.b: "Favour Hama"
 oe_y7.10.b.tt: "Court opinion #R −5#!. From now on court opinion falls by #R 1#! every #Y 2#! months."
 oe_y7.11.t: "Gaoyou: All the Princes' and Provinces' Armies"
 oe_y7.11.d1: "#F In the fifth month of the thirteenth Zhizheng year (1353) Zhang Shicheng rose at Taizhou, took Gaoyou and named the state Great Zhou. In the ninth month of the fourteenth year Toqto'a was ordered to command the princes' retinues and the wings of every province against Gaoyou, and troops came from the Western Regions and Tibet as well (History of Yuan, 43 and 138).#!\n\nNow [SCOPE.sCountry('oe_y7_o').GetName] holds Gaoyou.\nCampaign: the Yuan wins if within #Y 6#! months it controls the target, or the enemy is gone or has come over."
 oe_y7.11.d2: "#F In the fifth month of the thirteenth Zhizheng year (1353) Zhang Shicheng rose at Taizhou, took Gaoyou and named the state Great Zhou. In the ninth month of the fourteenth year Toqto'a was ordered to command the princes' retinues and the wings of every province against Gaoyou, and troops came from the Western Regions and Tibet as well (History of Yuan, 43 and 138).#!\n\nNow the Red Turbans follow [SCOPE.sCountry('oe_y7_o').GetName], whose capital is [SCOPE.sLocation('oe_y7_l').GetName].\nCampaign: the Yuan wins if within #Y 6#! months it controls the target, or the enemy is gone or has come over."
 oe_y7.11.d: "#F In the fifth month of the thirteenth Zhizheng year (1353) Zhang Shicheng rose at Taizhou, took Gaoyou and named the state Great Zhou. In the ninth month of the fourteenth year Toqto'a was ordered to command the princes' retinues and the wings of every province against Gaoyou, and troops came from the Western Regions and Tibet as well (History of Yuan, 43 and 138).#!\n\nNow the bandits are quiet for a while, and there is no target worth a great campaign."
 oe_y7.11.a: "March in force"
 oe_y7.11.a.tt: "#Y 4#! regiments (#Y 1#! light foot, #Y 1#! heavy foot, #Y 1#! light horse, #Y 1#! heavy horse) appear at the Yuan's location nearest the target.\nWhile Goryeo is still under the Zhengdong marker, #Y 1#! regiment of Korean light horse joins.\nThe member AI princes send manpower by their standing, and their loyalty falls.\nCourt opinion #R −5#!.\nIn #Y 3#! months the court will weigh the chancellor's faults."
 oe_y7.11.c: "Give the princes the command"
 oe_y7.11.c.tt: "#Y 4#! regiments (#Y 1#! light foot, #Y 1#! heavy foot, #Y 1#! light horse, #Y 1#! heavy horse) appear at the Yuan's location nearest the target.\nWhile Goryeo is still under the Zhengdong marker, #Y 1#! regiment of Korean light horse joins.\nWhen the campaign ends, the generals divide the armies among themselves."
 oe_y7.11.b: "Hold back and secure the Huai and the Yangzi first"
 oe_y7.11.b.tt: "[ShowModifier('oe_y7_court_command')] drops to #Y 1#! share.\nTarget of the momentum of suppression #R −5#! (this part fades by #Y 1#! a month).\nCourt opinion #G +5#!.\nThe chancellor's faults will still be weighed when the time for Gaoyou runs out, and dismissal is more likely (weight +10)."
 oe_y7.11.e: "Hold back and secure the Huai and the Yangzi first"
 oe_y7.11.e.tt: "Target of the momentum of suppression #R −5#! (this part fades by #Y 1#! a month)."
 oe_y7.12.t: "The Edict against the Chancellor"
 oe_y7.12.d: "#F In the twelfth month of the fourteenth Zhizheng year (1354) an edict stripped Toqto'a of office and rank for wearing out the army and wasting money for more than three months, and sent Toqto'a to Huai'an; Esen Temür was sent to Ningxia, and Taibuqa, Yuekuochar and Xuexue took the command. Hama had already slandered Toqto'a before the crown prince and Empress Ki (History of Yuan, 43 and 138).#!\n\nNow the charges against the chancellor are piled high on the imperial desk. Dismiss or keep: it is decided now.\nAn AI court issues the edict with a chance of #Y [ROOT.GetCountry.MakeScope.GetVariable('oe_y7_dw').GetValue|0]#!% (between #Y 25#! and #Y 75#!)."
 oe_y7.12.a: "Strip Toqto'a of office and rank"
 oe_y7.12.a.tt: "Toqto'a leaves office and may never sit in the cabinet again; the Yuan loses [ShowModifier('yua_dictator_powers')].\nLose [ShowModifier('oe_y7_court_command')]; gain [ShowModifier('oe_y7_scattered')] for #Y 12#! months; militia already raised become [ShowModifier('oe_y7_warlord_army')].\nEvery Yuan army loses #R 20%#! of its morale.\nThe momentum of suppression is at most #Y 40#!; loyalty of the Henan Jiangbei and Jiangzhe branch secretariats #R −5#! each.\nThe age of the generals begins."
 oe_y7.12.b: "Overrule them all and let Toqto'a finish the work"
 oe_y7.12.b.tt: "Gain [ShowModifier('oe_y7_court_rift')] for #Y 60#! months.\nCourt opinion is set to #Y 55#! and no longer falls by itself.\nThe Gaoyou campaign gets #Y 4#! more months; with no campaign the chancellor simply stays, without [ShowModifier('oe_y7_restoration')]."
 oe_y7.13.t: "Gaoyou: the Outcome"
 oe_y7.13.d1: "#F In the eleventh month of the fourteenth Zhizheng year (1354) Toqto'a reached Gaoyou and won battle after battle (History of Yuan, 43).#!\n\nNow [SCOPE.sCountry('oe_y7_o').GetName] can fight no longer."
 oe_y7.13.d2: "#F In the eleventh month of the fourteenth Zhizheng year (1354) Toqto'a reached Gaoyou and won battle after battle (History of Yuan, 43).#!\n\nNow the enemy at Gaoyou can fight no longer."
 oe_y7.13.d: "#F In the eleventh month of the fourteenth Zhizheng year (1354) Toqto'a reached Gaoyou and won battle after battle (History of Yuan, 43).#!\n\nNow the extra time is over and Gaoyou has not fallen; the old charge of wearing out the army and wasting money is heard again.\nThe debate is settled by a roll (for players and AI alike): the edict comes with a chance of #Y [ROOT.GetCountry.MakeScope.GetVariable('oe_y7_dw').GetValue|0]#!%."
 oe_y7.13.a: "Accept the surrender and take the land"
 oe_y7.13.a.tt: "An enemy with #Y 15#! locations or fewer is annexed; otherwise the Yuan gains #G +40#! war score in the war and the enemy's allegiance #G +50#!.\nThe restoration begins: gain [ShowModifier('oe_y7_restoration')] (until Toqto'a dies or leaves office, or 1362); [ShowModifier('oe_y7_court_command')] becomes #Y 1#! share.\nTarget of the momentum of suppression #G +15#! (this part fades by #Y 1#! a month).\nCourt opinion #G +10#!.\nLoyalty of the Henan Jiangbei branch secretariat #G +8#!."
 oe_y7.13.b: "Grant titles and win them over"
 oe_y7.13.b.tt: "The enemy's allegiance #G +100#! and white peace; its opinion of the Yuan #G +100#! for #Y 36#! months (#bold #color_yellow Pardoned after Gaoyou#!#!).\nThe restoration begins: gain [ShowModifier('oe_y7_restoration')] (until Toqto'a dies or leaves office, or 1362); [ShowModifier('oe_y7_court_command')] becomes #Y 1#! share.\nTarget of the momentum of suppression #G +15#! (this part fades by #Y 1#! a month).\nCourt opinion #G +10#!.\nLoyalty of the Henan Jiangbei branch secretariat #G +8#!."
 oe_y7.13.c: "Debate it again"
 oe_y7.13.c.tt: "A roll with the chance above: dismissal works as the edict; otherwise the restoration begins, without [ShowModifier('oe_y7_restoration')]."
 oe_y7.14.t: "A Million Men Scattered in a Day"
 oe_y7.14.d: "#F The edict reached the camp, and the great army scattered; many went over to the rebels (History of Yuan, 138).#!\n\nNow the armies of every circuit drift away, and each general keeps the men who stay.\nThe dismissal has taken effect: [ShowModifier('oe_y7_scattered')] (#Y 12#! months); raised militia have become [ShowModifier('oe_y7_warlord_army')]."
 oe_y7.14.a: "What is done is done"
 oe_y7.15.t: "The Death of Toqto'a"
 oe_y7.15.d: "#F In the third month of the fifteenth Zhizheng year (1355) Toqto'a was banished to Zhenxi in Yunnan; in the twelfth month Hama forged an edict and sent an envoy to poison Toqto'a, who was forty-two (History of Yuan, 138).#!\n\nNow word reaches Dadu that Toqto'a has died in exile."
 oe_y7.15.a: "Ask no questions"
 oe_y7.15.b: "Find who forged the edict"
 oe_y7.15.b.tt: "This will be remembered."
 oe_y7.16.t: "The Bianliang Campaign"
 oe_y7.16.d1: "#F In the fifth month of the eighteenth Zhizheng year (1358) Liu Futong attacked Bianliang; the commander Zhu Zhen abandoned the city, and Liu Futong brought Han Lin'er, the lord of the rebels, from Anfeng and made Bianliang the capital. In the fifth month of the nineteenth year Chaghan Temür called up the armies of Shaanxi and Shanxi and laid siege to the city (History of Yuan, 45 and 141).#!\n\nNow Bianliang is in the hands of [SCOPE.sCountry('oe_y7_o').GetName], and Chaghan Temür asks leave to lead the armies against it.\nCampaign: the Yuan wins if within #Y 8#! months it, or a warlord that has come over to it, controls Bianliang (Kaifeng on the map)."
 oe_y7.16.d: "#F In the fifth month of the eighteenth Zhizheng year (1358) Liu Futong attacked Bianliang; the commander Zhu Zhen abandoned the city, and Liu Futong brought Han Lin'er, the lord of the rebels, from Anfeng and made Bianliang the capital. In the fifth month of the nineteenth year Chaghan Temür called up the armies of Shaanxi and Shanxi and laid siege to the city (History of Yuan, 45 and 141).#!\n\nNow Bianliang is out of the Yuan's hands, and Chaghan Temür asks leave to lead the armies against it.\nCampaign: the Yuan wins if within #Y 8#! months it, or a warlord that has come over to it, controls Bianliang (Kaifeng on the map)."
 oe_y7.16.a: "Grant it: Chaghan Temür leads the armies against Bianliang"
 oe_y7.16.a.tt: "#Y 2#! regiments (#Y 1#! light foot, #Y 1#! light horse) appear at the Yuan's location nearest Bianliang, under Chaghan Temür."
 oe_y7.16.b: "Order the general to hold Guanzhong and Shaanxi"
 oe_y7.16.b.tt: "Target of the momentum of suppression #R −3#! (this part fades by #Y 1#! a month)."
 oe_y7.17.t: "The Bianliang Campaign: the Outcome"
 oe_y7.17.d1: "#F In the eighth month of the nineteenth Zhizheng year (1359) Chaghan Temür and the generals stormed Bianliang; Liu Futong fled with Han Lin'er and fell back to Anfeng. The court made Chaghan Temür Manager of Governmental Affairs of the Henan branch secretariat, with a seat in the Henan branch Bureau of Military Affairs and in the Shaanxi branch Censorate, free as before to act at discretion (History of Yuan, 45).#!\n\nNow Bianliang is back on the court's side."
 oe_y7.17.d: "#F In the eighth month of the nineteenth Zhizheng year (1359) Chaghan Temür and the generals stormed Bianliang; Liu Futong fled with Han Lin'er and fell back to Anfeng. The court made Chaghan Temür Manager of Governmental Affairs of the Henan branch secretariat, with a seat in the Henan branch Bureau of Military Affairs and in the Shaanxi branch Censorate, free as before to act at discretion (History of Yuan, 45).#!\n\nNow the time is up, and Bianliang is still in enemy hands."
 oe_y7.17.a: "Make Chaghan Temür manager of the Henan branch secretariat"
 oe_y7.17.a.tt: "Target of the momentum of suppression #G +10#! (this part fades by #Y 1#! a month).\nIf the Yuan has [ShowModifier('oe_y7_warlord_army')], it also gains [ShowModifier('oe_y7_general_sway')]."
 oe_y7.17.b: "Reward the armies"
 oe_y7.17.b.tt: "Target of the momentum of suppression #G +10#! (this part fades by #Y 1#! a month)."
 oe_y7.17.c: "Fall back"
 oe_y7.17.c.tt: "Target of the momentum of suppression #R −6#! (this part fades by #Y 1#! a month)."
 oe_y7.18.t: "The Murder at Yidu"
 oe_y7.18.d1: "#F In the eighth month of the twenty-first Zhizheng year (1361) Chaghan Temür swept into Shandong; Tian Feng and Wang Shicheng both submitted, and Yidu was besieged. In the sixth month of the next year the two rose again, murdered Chaghan Temür and fled into Yidu; the generals chose Köke Temür as commander and renewed the siege. Köke Temür was a sister's son of Chaghan Temür, raised from childhood as a son. The court named the dead general Prince of Zhongxiang, later Prince of Yingchuan; in the eleventh month Köke Temür took Yidu and offered the hearts of Tian Feng and Wang Shicheng in sacrifice (History of Yuan, 46 and 141).#!\n\nNow Chaghan Temür has been murdered in camp, and Köke Temür takes over the whole command."
 oe_y7.18.d: "#F In the eighth month of the twenty-first Zhizheng year (1361) Chaghan Temür swept into Shandong; Tian Feng and Wang Shicheng both submitted, and Yidu was besieged. In the sixth month of the next year the two rose again, murdered Chaghan Temür and fled into Yidu; the generals chose Köke Temür as commander and renewed the siege. Köke Temür was a sister's son of Chaghan Temür, raised from childhood as a son. The court named the dead general Prince of Zhongxiang, later Prince of Yingchuan; in the eleventh month Köke Temür took Yidu and offered the hearts of Tian Feng and Wang Shicheng in sacrifice (History of Yuan, 46 and 141).#!\n\nNow Chaghan Temür has been murdered in camp, and the adopted son leads the men who remain."
 oe_y7.18.a: "Bury the general with honour and grant a princely title"
 oe_y7.25.t: "The Debate on Bolod Temür's Command"
 oe_y7.25.d1: "#F In the twenty-third Zhizheng year (1363) the Censor-in-chief Laodesha and Tujian Temür of the Bureau of Military Affairs fell foul of the crown prince and fled to Datong, where Bolod Temür hid the two in camp. Laodesha was the emperor's maternal uncle, and the emperor set the matter aside more than once; the chancellor Chuosijian and the eunuch Pu Buhua, who sided with the crown prince, accused Bolod Temür and Laodesha of plotting treason. In the third month of the twenty-fourth year an edict took away Bolod Temür's command, offices and rank, and Bolod Temür refused it (History of Yuan, 46, 141, 204, 205 and 207).#!\n\nNow Bolod Temür holds Datong in arms and has fought Köke Temür, who holds Taiyuan, year after year; Empress Ki and the crown prince lean on Köke Temür, and the charges against Bolod Temür keep coming."
 oe_y7.25.d2: "#F In the twenty-third Zhizheng year (1363) the Censor-in-chief Laodesha and Tujian Temür of the Bureau of Military Affairs fell foul of the crown prince and fled to Datong, where Bolod Temür hid the two in camp. Laodesha was the emperor's maternal uncle, and the emperor set the matter aside more than once; the chancellor Chuosijian and the eunuch Pu Buhua, who sided with the crown prince, accused Bolod Temür and Laodesha of plotting treason. In the third month of the twenty-fourth year an edict took away Bolod Temür's command, offices and rank, and Bolod Temür refused it (History of Yuan, 46, 141, 204, 205 and 207).#!\n\nNow Bolod Temür holds Datong in arms and has fought Köke Temür, who holds Taiyuan, year after year; the crown prince leans on Köke Temür, and the charges against Bolod Temür keep coming."
 oe_y7.25.d3: "#F In the twenty-third Zhizheng year (1363) the Censor-in-chief Laodesha and Tujian Temür of the Bureau of Military Affairs fell foul of the crown prince and fled to Datong, where Bolod Temür hid the two in camp. Laodesha was the emperor's maternal uncle, and the emperor set the matter aside more than once; the chancellor Chuosijian and the eunuch Pu Buhua, who sided with the crown prince, accused Bolod Temür and Laodesha of plotting treason. In the third month of the twenty-fourth year an edict took away Bolod Temür's command, offices and rank, and Bolod Temür refused it (History of Yuan, 46, 141, 204, 205 and 207).#!\n\nNow Bolod Temür holds Datong in arms and ignores the court's orders; the party of Empress Ki and the crown prince keeps sending up charges against Bolod Temür."
 oe_y7.25.d: "#F In the twenty-third Zhizheng year (1363) the Censor-in-chief Laodesha and Tujian Temür of the Bureau of Military Affairs fell foul of the crown prince and fled to Datong, where Bolod Temür hid the two in camp. Laodesha was the emperor's maternal uncle, and the emperor set the matter aside more than once; the chancellor Chuosijian and the eunuch Pu Buhua, who sided with the crown prince, accused Bolod Temür and Laodesha of plotting treason. In the third month of the twenty-fourth year an edict took away Bolod Temür's command, offices and rank, and Bolod Temür refused it (History of Yuan, 46, 141, 204, 205 and 207).#!\n\nNow Bolod Temür holds Datong in arms and ignores the court's orders; the crown prince's party keeps sending up charges against Bolod Temür."
 oe_y7.25.a: "Issue the edict: take away the command, the offices and the rank"
 oe_y7.25.a.tt: "Bolod Temür will refuse, and march on the capital in #Y 2#! months.\nTarget of the momentum of suppression #R −2#! (this part fades by #Y 1#! a month).\nWhile Köke Temür rules a warlord state not at war with the Yuan: its #bold #color_yellow allegiance#!#! #G +10#!."
 oe_y7.25.b: "Let the matter rest"
 oe_y7.25.b.tt: "Gain [ShowModifier('oe_y7_two_courts')] for #Y 24#! months.\nWhile Köke Temür rules a warlord state not at war with the Yuan: its #bold #color_yellow allegiance#!#! #R −10#!.\nBolod Temür stays at Datong; after #Y 24#! months the matter is closed."
 oe_y7.26.t: "Bolod Temür Marches on the Capital"
 oe_y7.26.d: "#F In the fourth month of the twenty-fourth Zhizheng year (1364) Tujian Temür led troops through the Juyong pass and camped at Qinghe, and would not withdraw without Chuosijian and Pu Buhua; the emperor handed the two over, and both were killed. In the seventh month Bolod Temür marched on the capital in person; Yesu's army at Changping had no stomach for a fight, and the crown prince fled to Jining. Bolod Temür came before the emperor in the Xuanwen hall to plead innocence, and all wept, the emperor too. In the eighth month Bolod Temür was made Chancellor of the Right with command of all the realm's armies (History of Yuan, 46, 142 and 207).#!\n\nNow Bolod Temür has refused the edict, and the army of Datong is on its way to the Juyong pass.\nIf the gates are shut, the chance of turning Bolod Temür back to Datong is #Y [ROOT.GetCountry.MakeScope.GetVariable('oe_y7_win26').GetValue|0]#!% (set by the #bold #color_yellow momentum of suppression#!#!; higher while Köke Temür is alive and not at war with the Yuan; between #Y 15#! and #Y 70#!)."
 oe_y7.26.a: "Let Bolod Temür in as Chancellor of the Right"
 oe_y7.26.a.tt: "Bolod Temür gives up the field command and heads the cabinet (the old head steps down); the Yuan gains [ShowModifier('yua_dictator_powers')] and [ShowModifier('oe_y7_bolod_regime')] until Bolod Temür dies or leaves office.\nStability #R −7#!, legitimacy #R −10#!.\nTarget of the momentum of suppression #R −6#! (this part fades by #Y 1#! a month).\n[ShowModifier('oe_y7_general_sway')] gains a share (at most #Y 3#!; each share #R −5%#! crown power).\nWhile Köke Temür rules a warlord state not at war with the Yuan: its #bold #color_yellow allegiance#!#! #R −25#!, and its opinion of the Yuan #R −75#! for #Y 24#! months (Estranged from the Court).\nEvery member prince's loyalty #R −2#! (the crown prince calls up the princes' troops).\nIn #Y 12#! months Bolod Temür's fate is decided."
 oe_y7.26.b: "Shut the gates and send the army out"
 oe_y7.26.b.tt: "One roll with the chance above.\nTurned back: Bolod Temür falls back to Datong; target of the momentum of suppression #G +4#! (this part fades by #Y 1#! a month); in #Y 9#! months Bolod Temür's fate is decided.\nIf turned back: While Köke Temür rules a warlord state not at war with the Yuan: its #bold #color_yellow allegiance#!#! #G +15#!.\nNot held: Bolod Temür enters all the same, with every effect of letting Bolod Temür in, plus stability #R −7#! and #R 30%#! of every Yuan army's morale lost."
 oe_y7.27.t: "The Fate of Bolod Temür"
 oe_y7.27.d1: "#F In the twenty-fifth Zhizheng year (1365) Bolod Temür held Empress Ki shut away for a hundred days; the crown prince, at Jining, called up the armies of the circuits, and Yesu took troops back to Yongping and beat Bolod Temür's officer Yao Bayan Buqa. Bolod Temür feasted with Laodesha day after day, drank and killed. On the day yiyou of the seventh month Heshang, a son of the Prince of Weishun, acting on the emperor's secret order with Bayandar and other strong men, stabbed Bolod Temür to death under a plum tree by the Yanchun hall (History of Yuan, 46, 114, 117 and 207).#!\n\nNow Bolod Temür has ruled the court for almost a year; complaints rise inside the capital and out, and the emperor quietly sends for trusted men."
 oe_y7.27.d2: "#F In the fifth month of the twenty-fourth Zhizheng year (1364) Köke Temür camped at Jining and struck at Datong along three roads; on the day yimao of the fourth month of the next year Guanbao entered Datong (History of Yuan, 46).#!\n\nNow Bolod Temür has fallen back to Datong beaten, the troops are melting away, and the court must decide the general's fate."
 oe_y7.27.d: "#F In the twenty-fifth Zhizheng year (1365) Bolod Temür held Empress Ki shut away for a hundred days; the crown prince, at Jining, called up the armies of the circuits, and Yesu took troops back to Yongping and beat Bolod Temür's officer Yao Bayan Buqa. Bolod Temür feasted with Laodesha day after day, drank and killed. On the day yiyou of the seventh month Heshang, a son of the Prince of Weishun, acting on the emperor's secret order with Bayandar and other strong men, stabbed Bolod Temür to death under a plum tree by the Yanchun hall (History of Yuan, 46, 114, 117 and 207).#!\n\nNow Bolod Temür is no longer at court, and there is nothing left to decide."
 oe_y7.27.a: "Have Bolod Temür killed on a secret order"
 oe_y7.27.a.tt: "Bolod Temür dies; the Yuan loses [ShowModifier('yua_dictator_powers')] and [ShowModifier('oe_y7_bolod_regime')].\n[ShowModifier('oe_y7_general_sway')] loses a share.\nTarget of the momentum of suppression #G +4#! (this part fades by #Y 1#! a month).\nWhile Köke Temür rules a warlord state not at war with the Yuan: its #bold #color_yellow allegiance#!#! #G +30#!, and its opinion of the Yuan #G +75#! for #Y 36#! months (Trusted by the Court).\nEvery member prince's loyalty #G +2#!."
 oe_y7.27.b: "Lean on Bolod Temür against the crown prince's party"
 oe_y7.27.b.tt: "Gain [ShowModifier('oe_y7_bolod_command')] until Bolod Temür dies or leaves office, or this line ends.\n[ShowModifier('oe_y7_general_sway')] gains a share (at most #Y 3#!; each share #R −5%#! crown power).\nTarget of the momentum of suppression #R −4#! (this part fades by #Y 1#! a month).\nWhile Köke Temür rules a warlord state not at war with the Yuan: its #bold #color_yellow allegiance#!#! #R −40#!, and its opinion of the Yuan #R −75#! for #Y 24#! months (Estranged from the Court).\nKöke Temür and the court part ways for good: this line gives Köke Temür no princely title and no supreme command."
 oe_y7.27.c: "Spare Bolod Temür but take away the army"
 oe_y7.27.c.tt: "Bolod Temür commands no army and may never sit in the cabinet.\nWhile Köke Temür rules a warlord state not at war with the Yuan: its #bold #color_yellow allegiance#!#! #G +10#!."
 oe_y7.27.f: "Put Bolod Temür to death"
 oe_y7.27.f.tt: "Bolod Temür dies.\nWhile Köke Temür rules a warlord state not at war with the Yuan: its #bold #color_yellow allegiance#!#! #G +20#!."
 oe_y7.27.e: "What is done is done"
 oe_y7.28.t: "The Prince of Henan"
 oe_y7.28.d1: "#F In the ninth month of the twenty-fifth Zhizheng year (1365) Köke Temür escorted the crown prince back to the capital and became chancellor beside Bosali; two months later Köke Temür asked to go south again to the armies. The crown prince asked more than once to lead the armies in person, and the emperor could not decide. On the day xinwei of the intercalary tenth month Köke Temür was made Prince of Henan, to take the field in the crown prince's place with command of every army of Guanzhong, Shanxi, Hebei, Shandong and the lands to the south. Before this Empress Ki had sent word that Köke Temür should bring the crown prince into the city at the head of a great army; Köke Temür dismissed the troops thirty li from the capital, and the crown prince bore a grudge ever after (History of Yuan, 46, 114 and 141).#!\n\nNow Köke Temür holds Henan and Shanxi with a strong army and keeps asking to march south against the rebels; the crown prince keeps asking to lead the armies in person."
 oe_y7.28.d: "#F In the ninth month of the twenty-fifth Zhizheng year (1365) Köke Temür escorted the crown prince back to the capital and became chancellor beside Bosali; two months later Köke Temür asked to go south again to the armies. The crown prince asked more than once to lead the armies in person, and the emperor could not decide. On the day xinwei of the intercalary tenth month Köke Temür was made Prince of Henan, to take the field in the crown prince's place with command of every army of Guanzhong, Shanxi, Hebei, Shandong and the lands to the south. Before this Empress Ki had sent word that Köke Temür should bring the crown prince into the city at the head of a great army; Köke Temür dismissed the troops thirty li from the capital, and the crown prince bore a grudge ever after (History of Yuan, 46, 114 and 141).#!\n\nNow Köke Temür leads the old army of Chaghan Temür and keeps asking to march south against the rebels; the crown prince keeps asking to lead the armies in person."
 oe_y7.28.a: "Make Köke Temür Prince of Henan, commanding every army in the crown prince's place"
 oe_y7.28.a.tt: "[ShowModifier('oe_y7_general_sway')] gains a share (at most #Y 3#!; each share #R −5%#! crown power).\nTarget of the momentum of suppression #G +8#! (this part fades by #Y 1#! a month).\nWhile Köke Temür rules a warlord state not at war with the Yuan: its #bold #color_yellow allegiance#!#! #G +40#!, and its opinion of the Yuan #G +75#! for #Y 36#! months (Trusted by the Court).\nWhile Köke Temür is at the Yuan court: the title of Prince of Henan, and command of a Yuan army without a commander at the Yuan's location nearest Bianliang (if there is one).\nIn #Y 5#! months the Guanzhong generals show where they stand."
 oe_y7.28.b: "Let the crown prince lead the armies in person"
 oe_y7.28.b.tt: "Gain [ShowModifier('oe_y7_heir_command')] until this line ends.\nTarget of the momentum of suppression #G +3#! (this part fades by #Y 1#! a month).\nWhile Köke Temür rules a warlord state not at war with the Yuan: its #bold #color_yellow allegiance#!#! #R −15#!.\nKöke Temür keeps the old office: this line gives Köke Temür no Guanzhong quarrel and no Regency Office."
 oe_y7.28.c: "Leave Köke Temür in the old office"
 oe_y7.28.c.tt: "While Köke Temür rules a warlord state not at war with the Yuan: its #bold #color_yellow allegiance#!#! #R −10#!.\nKöke Temür keeps the old office: this line gives Köke Temür no Guanzhong quarrel and no Regency Office."
 oe_y7.29.t: "Guanzhong Refuses"
 oe_y7.29.d1: "#F Li Siqi had raised a militia together with Chaghan Temür, was Chaghan Temür's equal in age and standing, and would not serve under Köke Temür; Zhang Liangbi refused orders first, and Kong Xing and Tuliebo each asked for an army of their own. In the third month of the twenty-sixth Zhizheng year (1366) Köke Temür sent Guanbao and Hulinchi west against Zhang Liangbi at Lutai, and Li Siqi's troops joined Zhang Liangbi. In the first month of the next year the generals met on the ruins of the Hanyuan hall, chose Li Siqi as their leader and stood together against Köke Temür, who had been ordered south but stayed at Zhangde and made war only on Shaanxi. That year an edict gave the land west of Tongguan to Li Siqi and the land east of it to Köke Temür, and told both to stand down (History of Yuan, 47 and 141).#!\n\nNow Li Siqi, Zhang Liangbi and the other Guanzhong generals will not take Köke Temür's orders, and Köke Temür asks leave to turn the army west against them."
 oe_y7.29.d: "#F Li Siqi had raised a militia together with Chaghan Temür, was Chaghan Temür's equal in age and standing, and would not serve under Köke Temür; Zhang Liangbi refused orders first, and Kong Xing and Tuliebo each asked for an army of their own. In the third month of the twenty-sixth Zhizheng year (1366) Köke Temür sent Guanbao and Hulinchi west against Zhang Liangbi at Lutai, and Li Siqi's troops joined Zhang Liangbi. In the first month of the next year the generals met on the ruins of the Hanyuan hall, chose Li Siqi as their leader and stood together against Köke Temür, who had been ordered south but stayed at Zhangde and made war only on Shaanxi. That year an edict gave the land west of Tongguan to Li Siqi and the land east of it to Köke Temür, and told both to stand down (History of Yuan, 47 and 141).#!\n\nNow the Guanzhong generals will not take Köke Temür's orders, and Köke Temür asks leave to turn the army west against them."
 oe_y7.29.a: "Let Köke Temür march west"
 oe_y7.29.a.tt: "Target of the momentum of suppression #R −6#! (this part fades by #Y 1#! a month).\nWhile Köke Temür rules a warlord state not at war with the Yuan: its #bold #color_yellow allegiance#!#! #G +5#!.\nWhile Li Siqi rules a warlord state not at war with the Yuan: its #bold #color_yellow allegiance#!#! #R −25#!.\nWhile Köke Temür and Li Siqi each rule a state, both run by the AI, neither a subject and not at war with each other: their opinion of each other #R −100#! for #Y 60#! months (Feud in Guanzhong). No war comes of it by itself.\nLoyalty of the Shaanxi branch secretariat #R −5#!.\nIn #Y 8#! months the court will debate Köke Temür's command."
 oe_y7.29.b: "Order peace: Tongguan the border, each to hold their own side"
 oe_y7.29.b.tt: "Target of the momentum of suppression #R −2#! (this part fades by #Y 1#! a month).\nWhile Köke Temür rules a warlord state not at war with the Yuan: its #bold #color_yellow allegiance#!#! #R −10#!.\nWhile Li Siqi rules a warlord state not at war with the Yuan: its #bold #color_yellow allegiance#!#! #G +10#!.\nLoyalty of the Shaanxi branch secretariat #G +3#!.\nIn #Y 8#! months the court will debate Köke Temür's command."
 oe_y7.29.c: "Give Li Siqi the armies of Guanzhong and Shaanxi"
 oe_y7.29.c.tt: "Target of the momentum of suppression #R −4#! (this part fades by #Y 1#! a month).\nWhile Köke Temür rules a warlord state not at war with the Yuan: its #bold #color_yellow allegiance#!#! #R −30#!.\nWhile Li Siqi rules a warlord state not at war with the Yuan: its #bold #color_yellow allegiance#!#! #G +30#!, and its opinion of the Yuan #G +75#! for #Y 36#! months (Trusted by the Court).\nIn #Y 8#! months the court will debate Köke Temür's command."
 oe_y7.30.t: "The Grand Regency Office"
 oe_y7.30.d: "#F On the day bingwu of the eighth month of the twenty-seventh Zhizheng year (1367) the crown prince was given command of all the realm's armies. Mo Gao wrote that the commander Köke Temür fought the court's own troops year after year, and asked for an edict choosing another great minister to command; a Grand Regency Office was set up for the crown prince, its purpose to guard against Köke Temür. On the day renzi of the tenth month Köke Temür lost the offices of Grand Tutor and Chancellor of the Left and every other post, remained Prince of Henan, and saw the troops divided among the generals (History of Yuan, 47 and 141).#!\n\nNow Köke Temür commands in the field and fights the Guanzhong generals without end; memorials ask for another great minister, and the crown prince's party asks for a Regency Office to split the command."
 oe_y7.30.a: "Strip Köke Temür of office and divide the troops"
 oe_y7.30.a.tt: "Gain [ShowModifier('oe_y7_heir_command')] until this line ends.\n[ShowModifier('oe_y7_general_sway')] loses a share.\nTarget of the momentum of suppression #R −8#! (this part fades by #Y 1#! a month).\nWhile Köke Temür rules a warlord state not at war with the Yuan: its #bold #color_yellow allegiance#!#! falls to at most #Y 10#! (no change if already lower), and its opinion of the Yuan #R −75#! for #Y 24#! months (Estranged from the Court).\nWhile Köke Temür is at the Yuan court: no more field command; the title of Prince of Henan stays."
 oe_y7.30.b: "Drop the Regency Office and keep Köke Temür in command"
 oe_y7.30.b.tt: "[ShowModifier('oe_y7_general_sway')] gains a share (at most #Y 3#!; each share #R −5%#! crown power).\nTarget of the momentum of suppression #G +3#! (this part fades by #Y 1#! a month).\nWhile Köke Temür rules a warlord state not at war with the Yuan: its #bold #color_yellow allegiance#!#! #G +15#!."
 oe_y7.19.t: "Toqto'a's Honours Restored"
 oe_y7.19.d: "#F On the day renshen of the eleventh month of the twenty-third Zhizheng year (1363) the Censorate wrote that the late chancellor Toqto'a had pacified Xuzhou and taken Liuhe, and was on the edge of a great victory when slander undid the work; Toqto'a obeyed the edict, gave up the army and died in banishment. The Censorate asked that Toqto'a's patents of office be restored, and the emperor agreed (History of Yuan, 46).#!\n\nNow the Censorate speaks for Toqto'a and asks that the patents of office be restored."
 oe_y7.19.a: "Restore the patents"
 oe_y7.31.t: "The Debate on Going North"
 oe_y7.31.d1: "#F In the second month of the twenty-eighth Zhizheng year (1368) an edict took away Köke Temür's rank and fief and sent the armies against Köke Temür; the Ming reached Henan, and Li Siqi and Zhang Liangbi drew back to the west. In the intercalary seventh month Köke Temür seized Mo Gao and Guanbao; the court abolished the Grand Regency Office and restored Köke Temür as Prince of Henan, Grand Tutor and Chancellor of the Left. In the same month the Ming army reached Tongzhou. On the day yichou Temür Buqa, the Prince of Huai, was named regent, with Qingtong as Chancellor of the Left, to hold the capital together. On the day bingyin the emperor debated going north in the Qingning hall; the eunuch Bayan Buqa wept and pleaded that the realm was Khubilai's, to be held to the death. The emperor would not listen, and at midnight left by the Jiande gate for the north (History of Yuan, 47, 117, 141 and 142).#!\n\nNow the enemy closes on the capital, and places around it have already fallen. Temür Buqa, the Prince of Huai, asks to stay behind and hold the city; the court is divided, some for going north, some for holding to the death. Köke Temür has just been given back rank and offices, but is far away and cannot save the capital in time.\nNote: this decides only where the court goes; the capital does not move. If Dadu is lost, vanilla's own events (the flight to Shangdu and what follows) come as usual."
 oe_y7.31.d2: "#F In the second month of the twenty-eighth Zhizheng year (1368) an edict took away Köke Temür's rank and fief and sent the armies against Köke Temür; the Ming reached Henan, and Li Siqi and Zhang Liangbi drew back to the west. In the intercalary seventh month Köke Temür seized Mo Gao and Guanbao; the court abolished the Grand Regency Office and restored Köke Temür as Prince of Henan, Grand Tutor and Chancellor of the Left. In the same month the Ming army reached Tongzhou. On the day yichou Temür Buqa, the Prince of Huai, was named regent, with Qingtong as Chancellor of the Left, to hold the capital together. On the day bingyin the emperor debated going north in the Qingning hall; the eunuch Bayan Buqa wept and pleaded that the realm was Khubilai's, to be held to the death. The emperor would not listen, and at midnight left by the Jiande gate for the north (History of Yuan, 47, 117, 141 and 142).#!\n\nNow the enemy closes on the capital, and places around it have already fallen. Temür Buqa, the Prince of Xuanrang, asks to stay behind and hold the city; the court is divided, some for going north, some for holding to the death. Köke Temür has just been given back rank and offices, but is far away and cannot save the capital in time.\nNote: this decides only where the court goes; the capital does not move. If Dadu is lost, vanilla's own events (the flight to Shangdu and what follows) come as usual."
 oe_y7.31.d3: "#F In the second month of the twenty-eighth Zhizheng year (1368) an edict took away Köke Temür's rank and fief and sent the armies against Köke Temür; the Ming reached Henan, and Li Siqi and Zhang Liangbi drew back to the west. In the intercalary seventh month Köke Temür seized Mo Gao and Guanbao; the court abolished the Grand Regency Office and restored Köke Temür as Prince of Henan, Grand Tutor and Chancellor of the Left. In the same month the Ming army reached Tongzhou. On the day yichou Temür Buqa, the Prince of Huai, was named regent, with Qingtong as Chancellor of the Left, to hold the capital together. On the day bingyin the emperor debated going north in the Qingning hall; the eunuch Bayan Buqa wept and pleaded that the realm was Khubilai's, to be held to the death. The emperor would not listen, and at midnight left by the Jiande gate for the north (History of Yuan, 47, 117, 141 and 142).#!\n\nNow the enemy closes on the capital, and places around it have already fallen. The court is divided: some would go north and leave princes and ministers to hold the city, some would hold it to the death. Köke Temür has just been given back rank and offices, but is far away and cannot save the capital in time.\nNote: this decides only where the court goes; the capital does not move. If Dadu is lost, vanilla's own events (the flight to Shangdu and what follows) come as usual."
 oe_y7.31.d4: "#F In the second month of the twenty-eighth Zhizheng year (1368) an edict took away Köke Temür's rank and fief and sent the armies against Köke Temür; the Ming reached Henan, and Li Siqi and Zhang Liangbi drew back to the west. In the intercalary seventh month Köke Temür seized Mo Gao and Guanbao; the court abolished the Grand Regency Office and restored Köke Temür as Prince of Henan, Grand Tutor and Chancellor of the Left. In the same month the Ming army reached Tongzhou. On the day yichou Temür Buqa, the Prince of Huai, was named regent, with Qingtong as Chancellor of the Left, to hold the capital together. On the day bingyin the emperor debated going north in the Qingning hall; the eunuch Bayan Buqa wept and pleaded that the realm was Khubilai's, to be held to the death. The emperor would not listen, and at midnight left by the Jiande gate for the north (History of Yuan, 47, 117, 141 and 142).#!\n\nNow the enemy closes on the capital, and places around it have already fallen. Temür Buqa, the Prince of Huai, asks to stay behind and hold the city; the court is divided, some for going north, some for holding to the death.\nNote: this decides only where the court goes; the capital does not move. If Dadu is lost, vanilla's own events (the flight to Shangdu and what follows) come as usual."
