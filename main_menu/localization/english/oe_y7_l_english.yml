 oe_y7.31.d: "#F In the second month of the twenty-eighth Zhizheng year (1368) an edict took away Köke Temür's rank and fief and sent the armies against Köke Temür; the Ming reached Henan, and Li Siqi and Zhang Liangbi drew back to the west. In the intercalary seventh month Köke Temür seized Mo Gao and Guanbao; the court abolished the Grand Regency Office and restored Köke Temür as Prince of Henan, Grand Tutor and Chancellor of the Left. In the same month the Ming army reached Tongzhou. On the day yichou Temür Buqa, the Prince of Huai, was named regent, with Qingtong as Chancellor of the Left, to hold the capital together. On the day bingyin the emperor debated going north in the Qingning hall; the eunuch Bayan Buqa wept and pleaded that the realm was Khubilai's, to be held to the death. The emperor would not listen, and at midnight left by the Jiande gate for the north (History of Yuan, 47, 117, 141 and 142).#!\n\nNow the enemy closes on the capital, and places around it have already fallen. The court is divided: some would go north and leave princes and ministers to hold the city, some would hold it to the death.\nNote: this decides only where the court goes; the capital does not move. If Dadu is lost, vanilla's own events (the flight to Shangdu and what follows) come as usual."
 oe_y7.31.a: "Go north and leave a prince as regent"
 oe_y7.31.a.tt: "Dadu gets [ShowModifier('oe_y7_dadu_left')] for #Y 12#! months or until the city falls.\nWhile Temür Buqa, the Prince of Huai (or of Xuanrang), is at the Yuan court: the title of Regent of the Capital, and command of a Yuan army at Dadu that has no commander (if there is one).\nIf Dadu then falls, the Yuan loses only prestige; if the capital is no longer pressed for #Y 6#! months in a row, it counts as relieved and nothing more comes of it."
 oe_y7.31.b: "Hold the capital"
 oe_y7.31.b.tt: "#Y 2#! regiments (#Y 1#! heavy foot, #Y 1#! heavy horse) appear at the Yuan's location Dadu (the palace guards).\nDadu gets [ShowModifier('oe_y7_dadu_stand')] for #Y 12#! months.\nCampaign 'Hold Dadu': held if after #Y 8#! months the Yuan still controls Dadu and the capital is no longer pressed; while it is still pressed, #Y 3#! months more each time. If the city falls: legitimacy #R −20#!, stability #R −12#!, and every Yuan army loses #R 50%#! of its morale."
 oe_y7.32.t: "The Fate of Dadu"
 oe_y7.32.d1: "#F At midnight on the day bingyin of the intercalary seventh month of the twenty-eighth Zhizheng year (1368) the emperor left by the Jiande gate for the north. On the day gengwu of the eighth month the Ming army entered the capital; Temür Buqa, the Prince of Huai, and Qingtong, Chancellor of the Left, went out by the Qihua gate, and both were killed. The prince was eighty-three (History of Yuan, 47, 117 and 142).#!\n\nNow Dadu has fallen. The emperor went north long ago; Temür Buqa, the prince left as regent, has died in the city."
 oe_y7.32.d2: "#F At midnight on the day bingyin of the intercalary seventh month of the twenty-eighth Zhizheng year (1368) the emperor left by the Jiande gate for the north. On the day gengwu of the eighth month the Ming army entered the capital; Temür Buqa, the Prince of Huai, and Qingtong, Chancellor of the Left, went out by the Qihua gate, and both were killed. The prince was eighty-three (History of Yuan, 47, 117 and 142).#!\n\nNow Dadu has fallen. The emperor went north long ago, and the princes and ministers left behind are dead or scattered."
 oe_y7.32.d3: "#F At midnight on the day bingyin of the intercalary seventh month of the twenty-eighth Zhizheng year (1368) the emperor left by the Jiande gate for the north. On the day gengwu of the eighth month the Ming army entered the capital; Temür Buqa, the Prince of Huai, and Qingtong, Chancellor of the Left, went out by the Qihua gate, and both were killed. The prince was eighty-three (History of Yuan, 47, 117 and 142).#!\n\nNow Dadu has fallen. The emperor would not leave and must now flee the city in haste; the whole realm is shaken."
 oe_y7.32.d4: "#F At midnight on the day bingyin of the intercalary seventh month of the twenty-eighth Zhizheng year (1368) the emperor left by the Jiande gate for the north. On the day gengwu of the eighth month the Ming army entered the capital; Temür Buqa, the Prince of Huai, and Qingtong, Chancellor of the Left, went out by the Qihua gate, and both were killed. The prince was eighty-three (History of Yuan, 47, 117 and 142).#!\n\nNow the besiegers have drawn off, and the capital is safe."
 oe_y7.32.d: "#F At midnight on the day bingyin of the intercalary seventh month of the twenty-eighth Zhizheng year (1368) the emperor left by the Jiande gate for the north. On the day gengwu of the eighth month the Ming army entered the capital; Temür Buqa, the Prince of Huai, and Qingtong, Chancellor of the Left, went out by the Qihua gate, and both were killed. The prince was eighty-three (History of Yuan, 47, 117 and 142).#!\n\nNow things at Dadu have changed again, and there is nothing left to decide."
 oe_y7.32.a: "The capital is lost"
 oe_y7.32.a.tt: "This line's part in Dadu's story ends here: Dadu's modifiers and the title of Regent come off. What follows (Dadu changing hands in a peace, the court moving, the Northern Yuan) is left to the game's own events."
 oe_y7.32.b: "The day the city fell"
 oe_y7.32.b.tt: "Every Yuan army loses #R 50%#! of its morale.\nThis line's part in Dadu's story ends here: Dadu's modifiers and the title of Regent come off. What follows (Dadu changing hands in a peace, the court moving, the Northern Yuan) is left to the game's own events."
 oe_y7.32.c: "The capital stands"
 oe_y7.32.c.tt: "This line's part in Dadu's story ends here: Dadu's modifiers and the title of Regent come off. What follows (Dadu changing hands in a peace, the court moving, the Northern Yuan) is left to the game's own events."
