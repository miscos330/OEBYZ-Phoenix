 oe_rise_of_rus.6.t: "The Mercenaries Could Not Be Delivered"
 oe_rise_of_rus.6.d: "The mercenary company did not form an available army for its intended recipient. The 1,600 Manpower and any gold paid for this mission have been refunded, and the action cooldown removed."
 oe_rise_of_rus.6.a: "Reorganize the mission."
