 oe_all_rus_council: "All-Rus’ Church Council"
 oe_all_rus_council_desc: "Send a cleric from your court to convene the Rus’ dioceses. Choose among up to three randomly selected eligible venues and optionally visit up to three capitals for 60 days each. The council lasts 200 days, with debates on days 60, 120 and 180. Disagreement determines the outcome. Five-year cooldown; no additional departure fee."
