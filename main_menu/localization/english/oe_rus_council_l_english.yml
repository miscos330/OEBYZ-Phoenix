 oe_rus_council.1.cancel: "Cancel this journey."
 oe_rus_council.1.t: "Choosing the Council’s Seat"
 oe_rus_council.1.d: "Messengers carry the invitation north. Bishops and abbots hope the imperial envoy can settle their disputes; princes hope to host an assembly that will honor their cities. Choose the council’s seat, then decide which dioceses to visit along the way."
 oe_rus_council.2.direct: "Proceed directly to the council."
 oe_rus_council.2.1: "Visit the capital of [SCOPE.sCountry('oe_rsc_stop_1').GetName]."
 oe_rus_council.2.2: "Visit the capital of [SCOPE.sCountry('oe_rsc_stop_2').GetName]."
 oe_rus_council.2.3: "Visit the capital of [SCOPE.sCountry('oe_rsc_stop_3').GetName]."
 oe_rus_council.2.other: "Consider other possible hosts."
 oe_rus_council.2.t: "The Delegation’s Itinerary"
 oe_rus_council.2.d: "The delegation may travel directly to the council or visit the capitals of the Rus’ first. Each sixty-day stay is spent hearing clerical petitions and reviewing diocesan records. Local offerings will be sent back to the Empire. At most three different countries may be visited."
 oe_rus_council.3.a: "Accept the offerings and continue."
 oe_rus_council.3.t: "Sixty Days among the Dioceses"
 oe_rus_council.3.d: "The sixty-day visit is complete. Bishops have presented their accounts and petitions, and the clergy have prepared offerings worth three months of their estate’s income. Common worship and consultation have renewed the bond between the Empire and the northern churches."
 oe_rus_council.4.a: "May our words serve concord."
 oe_rus_council.4.t: "The All-Rus’ Church Council Opens"
 oe_rus_council.4.d: "Bells ring over the city. Bishops, abbots and distant envoys take their seats before the icons while the imperial delegate reads the opening prayer. Two hundred days of deliberation begin: questions of worship, ecclesiastical property and secular authority await answers."
 oe_rus_council.11.a: "Hear both sides and mediate."
 oe_rus_council.11.b: "Fund copyists to compare the texts."
 oe_rus_council.11.t: "A Theological Dispute"
 oe_rus_council.11.d: "A phrase concerning divine grace divides the scholars. One party insists on an old translation; the other demands the Greek text. The envoy must help them hear each other’s meaning, not merely the volume of their voices.\n\n$oe_rsc_debate_status$"
 oe_rus_council.12.a: "Rule on the surviving charters."
 oe_rus_council.12.b: "Pay for a survey and authenticated boundaries."
 oe_rus_council.12.t: "A Dispute over Diocesan Boundaries"
 oe_rus_council.12.d: "Two bishops claim the same riverside villages. Old charters leave the boundary unclear, and villagers have already paid offerings twice. The dispute concerns revenue as much as jurisdiction.\n\n$oe_rsc_debate_status$"
 oe_rus_council.13.a: "Ask them to reaffirm the Creed."
 oe_rus_council.13.b: "Send teachers before holding common worship."
 oe_rus_council.13.t: "Suspicions of Heresy"
 oe_rus_council.13.d: "Several village priests are accused of spreading unauthorized teachings. They say they merely repeat their ancestors’ prayers. A harsh ruling might silence the accusation, or leave an entire diocese in suspicion.\n\n$oe_rsc_debate_status$"
 oe_rus_council.14.a: "Urge the envoy to compromise in private."
 oe_rus_council.14.b: "Offer imperial guarantees for a settlement."
 oe_rus_council.14.t: "Secular Interference in the Church"
 oe_rus_council.14.d: "A prince’s envoy demands confirmation of a favored bishop and reminds the assembly that his guard keeps order in the city. The clergy look to the imperial delegate to defend canon law without alienating the host.\n\n$oe_rsc_debate_status$"
 oe_rus_council.15.a: "Ask the dioceses to organize a collection."
 oe_rus_council.15.b: "Fund a public kitchen from the imperial purse."
 oe_rus_council.15.t: "Relief for the Poor"
 oe_rus_council.15.d: "Petitioners crowd the courtyard while the clergy debate the cost of ceremonial meals. Some propose cutting the feasts and distributing bread; others fear a loss of dignity for the assembly.\n\n$oe_rsc_debate_status$"
 oe_rus_council.16.a: "Hear the witnesses present and vote."
 oe_rus_council.16.b: "Fund an inquiry and a carefully examined Life."
 oe_rus_council.16.t: "The Cause of a Revered Believer"
 oe_rus_council.16.d: "A deceased monk is revered throughout the north for his charity and reported miracles. Supporters seek immediate canonization; cautious bishops ask for testimony, lest devotion become a contest for local prestige.\n\n$oe_rsc_debate_status$"
 oe_rus_council.17.a: "Write letters for the volunteers."
 oe_rus_council.17.b: "Pay their passage and agree a term of study."
 oe_rus_council.17.t: "Sending Clergy to Mount Athos"
 oe_rus_council.17.d: "Young clerics ask to study on Mount Athos. Their bishops welcome the aspiration but fear losing able assistants. The imperial envoy may write letters of introduction, or arrange passage and hospitality with a firmer prospect of return.\n\n$oe_rsc_debate_status$"
 oe_rus_council.21.a: "Seal the record and dismiss the delegation."
 oe_rus_council.21.t: "A Council Divided"
 oe_rus_council.21.d: "The allotted days have passed, yet the delegates remain divided. Unresolved disputes undermine the imperial mission, and the final record contains little but contradictory statements."
 oe_rus_council.22.a: "Seal the record and dismiss the delegation."
 oe_rus_council.22.t: "A Council in Concord"
 oe_rus_council.22.d: "Two hundred days of deliberation have yielded a common resolution. Bishops embrace before the icons, and the imperial signature stands beside the seals of the Rus’ churches. Debate has clarified their shared faith without dividing them."
 oe_rus_council.23.a: "Seal the record and dismiss the delegation."
 oe_rus_council.23.t: "The Council Concludes"
 oe_rus_council.23.d: "After the final prayer the delegates depart. Some questions remain open, but common worship and patient listening have not been in vain. The delegation returns with signed resolutions and a better understanding of the northern churches."
 oe_rus_council.99.t: "The Delegation’s Journey Ends"
 oe_rus_council.99.d: "The delegation can no longer continue. Unfinished visits and debates yield no further effects. The five-year preparation interval still runs from the departure date."
 oe_rus_council.99.a: "Bring the remaining delegates home safely."
