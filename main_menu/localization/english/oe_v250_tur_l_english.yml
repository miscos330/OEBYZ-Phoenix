l_english:
# NEW 2026-11-24 v25.0 Phase 4A: 1337-1460 Deep Flavor & Mechanic Packs (TUR/FRA/ENG) (oe_v250_tur_, 0 mainline slots, 0 rules, 0 vanilla overrides) — english localization for Ottoman Beylik (1337-1460) (149 keys). Edit gen_v250_1337_tur_fra_eng.py, not this file.
 oe_v250_tur_reform_ghazi_uc_beys:0 "Ghazi Uc-Bey Frontier March"
 oe_v250_tur_reform_ghazi_uc_beys_desc:0 "Entrusts the Rumelian and Anatolian borderlands to autonomous Ghazi march-lords who muster swift horsemen and relentless frontier zeal, at the price of softer crown control and higher internal friction."
 oe_v250_tur_reform_timar_defterhane:0 "Imperial Defterhane Timar Registry"
 oe_v250_tur_reform_timar_defterhane_desc:0 "Binds provincial revenues to central Tahrir cadastral registers audited in Bursa and Edirne, sharpening taxation, cabinet competence, and royal control while chafing old tribal nobles and trimming feudal levy pools."
 oe_v250_tur_priv_timar_sipahis:0 "Hereditary Sipahi Timar Tenures"
 oe_v250_tur_priv_timar_sipahis_desc:0 "Confirms loyal provincial Sipahis in renewable cavalry prebends, boosting heavy horsemen and manpower reserves while expanding noble political weight and narrowing direct crown taxation."
 oe_v250_tur_priv_ahi_silk_guilds:0 "Ahi Brotherhood & Bursa Silk Caravanserais"
 oe_v250_tur_priv_ahi_silk_guilds_desc:0 "Protects the urban Ahi artisan brotherhoods and Anatolian silk hans from arbitrary tolls, lifting craft output and overland commerce at the expense of stronger merchant autonomy and irritated landed beys."
 oe_v250_tur_cab_tahrir_survey:0 "Tahrir Defteri Provincial Cadastre"
 oe_v250_tur_cab_tahrir_survey_desc:0 "Dispatches an imperial Defterdar clerk to register hearths, orchards, and timar yields in a target province, raising local control, development, and tax collection at the cost of rural resentment and administrative strain."
 oe_v250_tur_cab_tahrir_survey_action:0 "Tahrir Defteri Provincial Cadastre: [SCOPE.sProvince('target').GetNameWithNoTooltip]"
 oe_v250_tur_cab_tahrir_survey_active:0 "Tahrir Defteri Provincial Cadastre in [SCOPE.sProvince('target').GetNameWithHighlightOnly]"
 oe_v250_tur_cab_tahrir_survey_action_progress:0 "[SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_tur_cab_tahrir_survey_action_progress_wordier:0 "Tahrir Defteri Provincial Cadastre ([SCOPE.sProvince('target').GetNameWithNoTooltip]): [SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_tur_cab_tahrir_survey_action_progress_tooltip:0 "Dispatches an imperial Defterdar clerk to register hearths, orchards, and timar yields in a target province, raising local control, development, and tax collection at the cost of rural resentment and administrative strain."
 oe_v250_tur_cab_tahrir_survey_select_province:0 "Select a Province for Tahrir Defteri Cadastral Survey"
 oe_v250_tur_cab_tahrir_survey_no_provinces:0 "@trigger_no! No eligible provinces available for Tahrir Defteri Survey."
 oe_v250_tur_cab_rumeli_akinji:0 "Rumelian Akinji Frontier Scouting"
 oe_v250_tur_cab_rumeli_akinji_desc:0 "Coordinates irregular Akinji raiders along the Balkan river crossings to screen marches, hasten sieges, and hone martial tradition, though constant border raids alarm neighboring courts and strain military budgets."
 oe_v250_tur_cab_rumeli_akinji_action:0 "Rumelian Akinji Frontier Scouting"
 oe_v250_tur_cab_rumeli_akinji_active:0 "Active: Rumelian Akinji Frontier Scouting"
 oe_v250_tur_cab_rumeli_akinji_action_progress:0 "Active"
 oe_v250_tur_cab_rumeli_akinji_action_progress_wordier:0 "Rumelian Akinji Frontier Scouting (Active)"
 oe_v250_tur_cab_rumeli_akinji_action_progress_tooltip:0 "Coordinates irregular Akinji raiders along the Balkan river crossings to screen marches, hasten sieges, and hone martial tradition, though constant border raids alarm neighboring courts and strain military budgets."
 oe_v250_tur_dec_iznik_madrasah.title:0 "Endow the Orhaniye Madrasah of Iznik"
 oe_v250_tur_dec_iznik_madrasah.desc:0 "Grant permanent vakif endowments to the pioneer Ottoman academy in Iznik, training qadis and jurists for Bursa's growing state. Costs 90 gold; lifts research and clergy literacy for 25 years while raising clerical influence and slightly lowering direct tax yield."
 oe_v250_tur_dec_iznik_madrasah.a:0 "Endow the Madrasah and Summon Jurists"
 oe_v250_tur_dec_gelibolu_arsenal.title:0 "Establish the Gallipoli Imperial Dockyard"
 oe_v250_tur_dec_gelibolu_arsenal.desc:0 "Fortify the slipways of Gallipoli into the Ottoman Beylik's first permanent naval base on the Hellespont. Costs 120 gold; boosts galley combat, sailor pools, and maritime presence for 25 years at the cost of higher naval and military maintenance."
 oe_v250_tur_dec_gelibolu_arsenal.a:0 "Lay Down the Hellespont Galley Slips"
 oe_v250_tur_dec_edirne_seat.title:0 "Proclaim Edirne the Rumelian Seat"
 oe_v250_tur_dec_edirne_seat.desc:0 "Elevate conquered Adrianople into the palace seat of Rumelia, anchoring Ottoman command across Thrace and the Balkans. Costs 110 gold; enhances control, manpower, and subject loyalty for 25 years while alarming Christian neighbors and raising stability costs."
 oe_v250_tur_dec_edirne_seat.a:0 "Raise the Sultan's Pavilions at Edirne"
 oe_v250_tur_dec_tophane_foundry.title:0 "Charter the Ottoman Bronze Bombard Foundry"
 oe_v250_tur_dec_tophane_foundry.desc:0 "Recruit master gunfounders from the Balkans and Anatolia to cast heavy bronze siege bombards in dedicated imperial furnaces. Available from 1425; costs 150 gold and grants 25 years of superior siegecraft and artillery power at heavy fiscal and army upkeep."
 oe_v250_tur_dec_tophane_foundry.a:0 "Kindle the Imperial Bombard Furnaces"
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_dec_iznik_madrasah:0 "Orhaniye Madrasah of Iznik"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_dec_iznik_madrasah:0 "Jurists trained at Iznik staff Ottoman qadi courts and chanceries, advancing statecraft and scholarship while strengthening clerical estates and diverting vakif rents."
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_dec_gelibolu_arsenal:0 "Gallipoli Imperial Dockyard"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_dec_gelibolu_arsenal:0 "Permanent Ottoman slipways on the Dardanelles turn the straits into a fortified naval corridor, raising fleet readiness at steep dockyard upkeep."
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_dec_edirne_seat:0 "Rumelian Seat of Edirne"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_dec_edirne_seat:0 "Ruling from Edirne projects Ottoman administration deep into the Balkans and binds Danubian vassals, though rapid European expansion strains court diplomacy and cohesion."
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_dec_tophane_foundry:0 "Imperial Bronze Bombard Foundry"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_dec_tophane_foundry:0 "State-cast bronze siege artillery cracks medieval curtains across Thrace and the Danube, demanding relentless copper purchases and high standing upkeep."
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_ev1_aegean_dockyards:0 "Karasi Aegean Shipyards"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_ev1_aegean_dockyards:0 "Veteran Karasi shipwrights and corsair captains forge the Beylik's first Dardanelles flotilla, boosting naval reach while taxing fleet upkeep and inland levies."
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_ev1_bursa_focus:0 "Bursa Land & Silk Priority"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_ev1_bursa_focus:0 "Channeling funds into Bursa's hans and cavalry pastures strengthens overland trade and horsemen while deferring maritime ambitions."
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_ev1_karasi_autonomy:0 "Karasi Notable Conciliation"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_ev1_karasi_autonomy:0 "Honoring local Karasi charters calms neighboring Turkish emirates and eases stability costs, at the price of looser royal control and higher noble clout."
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_ev2_gallipoli_bridgehead:0 "Gallipoli European Bridgehead"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_ev2_gallipoli_bridgehead:0 "Ferrying Turkish colonists and cavalry across the Hellespont accelerates Thracian raids and siege momentum while straining diplomacy and border upkeep."
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_ev2_mercenary_transit:0 "Strait Mercenary Tolls"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_ev2_mercenary_transit:0 "Taking Byzantine subsidies for armed transit enriches the Bursa treasury and smooths foreign ties, though eager Ghazi warriors grumble at the restraint."
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_ev2_strait_watch:0 "Anatolian Strait Defenses"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_ev2_strait_watch:0 "Hardening Asian shore forts shields Bithynia from Latin and Greek raids while temporarily curbing offensive campaign tempo."
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_ev3_rumeli_beylerbey:0 "Rumelian Beylerbeylik Command"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_ev3_rumeli_beylerbey:0 "A unified Rumelian command tightens provincial governance and disciplined coordination across the Balkans, at the cost of higher administration expenses and restless frontier lords."
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_ev3_ucbey_autonomy:0 "Autonomous Rumelian Uc-Beys"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_ev3_ucbey_autonomy:0 "Empowering hereditary frontier clans unleashes aggressive cavalry sweeps and swift recruitment while diluting sultanic control and treasury collection."
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_ev4_pencik_corps:0 "Pencik Kapikulu Standing Infantry"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_ev4_pencik_corps:0 "Salaried sultanic foot soldiers elevate battlefield discipline, heavy infantry staying power, and crown leverage while straining army wages and alienating tribal aristocrats."
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_ev4_ghazi_primacy:0 "Ghazi Tribal Warrior Primacy"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_ev4_ghazi_primacy:0 "Honoring freeborn Turkish horsemen keeps noble morale high and field upkeep modest, yet forfeits central infantry discipline and strengthens aristocratic factions."
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_ev4_garrison_pencik:0 "Fortress Pencik Garrisons"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_ev4_garrison_pencik:0 "Assigning royal captives strictly to border castles bolsters fortress defense and garrison growth while raising fort upkeep and slowing field mobilization."
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_ev5_sipahi_timars:0 "Tahrir Sipahi Timar Estates"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_ev5_sipahi_timars:0 "Tying agricultural dues directly to cavalry service enlarges manpower and armored horsemen at the expense of cash tax revenues and central treasury elasticity."
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_ev5_crown_cash_tax:0 "Hass-i Humayun Crown Cash Farms"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_ev5_crown_cash_tax:0 "Direct silver tax collection swells the Bursa treasury and crown authority, but leaves fewer Timar prebends for provincial horsemen and burdens rural taxpayers."
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_ev6_beylik_purchase:0 "Anatolian Dowry & Purchase Treaties"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_ev6_beylik_purchase:0 "Lawful dynastic dowries and silver treaties raise diplomatic standing and ease integration across Anatolia, while draining short-term fiscal reserves."
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_ev6_beylik_force:0 "Armed Anatolian Hegemony"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_ev6_beylik_force:0 "Uncompromising military pressure steels martial morale and war leverage against rival emirates, at the cost of hostile neighbors and uneasy vassals."
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_ev7_balkan_vassals:0 "Balkan Tributary Vassal Network"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_ev7_balkan_vassals:0 "Christian vassal princes supply steady diplomatic reach, subject obedience, and auxiliary cavalry, though indirect rule limits direct crown taxation and religious conversion."
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_ev7_direct_sanjaks:0 "Direct Balkan Sanjak Administration"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_ev7_direct_sanjaks:0 "Installing Turkish sanjak-beys across conquered valleys boosts provincial control and manpower levies while provoking local resistance and lowering subject trust."
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_ev8_kapikulu_divan:0 "Kapikulu Centralized Divan"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_ev8_kapikulu_divan:0 "Palace-trained viziers sharpen cabinet administration and sovereign crown power, yet deepen noble hostility and incur heavier administrative outlays."
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_ev8_candarli_viziers:0 "Candarli Aristocratic Grand Vizierate"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_ev8_candarli_viziers:0 "Keeping seasoned Turkish statesmen at the helm bolsters legitimacy, stability, and noble harmony while tempering royal centralization."
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_ev9_conciliate_beys:0 "Anatolian Bey Conciliation"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_ev9_conciliate_beys:0 "Easing pressure on Turkmen emirates averts mass defections and stiffens castle defense, at the cost of dimmed sultanic prestige and softer crown authority."
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_ev9_defy_timur:0 "Defiance of the Thunderbolt"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_ev9_defy_timur:0 "Iron-willed defiance rallies elite discipline and combat morale for an all-or-nothing clash, yet inflames war exhaustion, estate resentment, and vassal unrest."
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_ev10_ulema_orthodoxy:0 "Orthodox Ulema Restoration"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_ev10_ulema_orthodoxy:0 "Decisive repression restores central obedience, religious unity, and clerical loyalty, while alienating rural peasants and dampening non-Muslim tolerance."
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_ev10_agrarian_relief:0 "Post-Crisis Agrarian Relief"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_ev10_agrarian_relief:0 "Lowering rural arrears revives village prosperity and multi-confessional calm, though direct tax yield dips and orthodox jurists chafe at crown leniency."
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_ev11_bronze_bombards:0 "Varna-Era Bronze Bombards"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_ev11_bronze_bombards:0 "Massive cast-bronze ordnance revolutionizes Ottoman siege warfare, imposing steep upkeep and reducing reliance on swift light cavalry."
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_ev11_danube_horsemen:0 "Swift Danube Cavalry & Forts"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_ev11_danube_horsemen:0 "Mobile horse archers and strengthened Balkan castles counter crusader incursions efficiently, yet leave heavy stone sieges slower to crack."
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_ev12_fratricide_law:0 "Kanunname of Undivided Sovereignty"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_ev12_fratricide_law:0 "Eliminating rival claimants cements supreme crown authority, control, and discipline, yet horrifies foreign courts and casts a shadow over dynastic legitimacy."
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_ev12_divan_succession:0 "Imperial Divan Succession Charter"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_ev12_divan_succession:0 "Consultative succession honors Islamic jurisprudence, lifts legitimacy, and improves foreign diplomacy, while granting senior estates greater leverage over the throne."
 oe_v250_tur.1.t:0 "Annexation of Karasi & the Aegean Shipyards"
 oe_v250_tur.1.d:0 "Dynastic strife inside the neighboring Beylik of Karasi has thrown Balikesir, Bergama, and the eastern Dardanelles littoral into Orhan's reach—along with veteran naval captains such as Evrenos and Haci Ilbeyi. Investing in Karasi's coastal slipways will open the path across the straits to Europe, yet conservative elders in Bursa warn that pouring silver into galleys starves our Anatolian horsemen and silk markets."
 oe_v250_tur.1.a:0 "Absorb Karasi's captains and expand the Aegean galley yards"
 oe_v250_tur.1.b:0 "Prioritize Bursa's silk caravans and Anatolian cavalry"
 oe_v250_tur.1.c:0 "Leave Karasi nobles broad local autonomy to calm Anatolia"
 oe_v250_tur.2.t:0 "The Tzympe & Gallipoli Crossing"
 oe_v250_tur.2.d:0 "Byzantine civil wars and a devastating Thracian earthquake have fractured the Greek garrisons along the Dardanelles. Prince Suleyman Pasha holds a precarious foothold at Tzympe and eyes the shattered ramparts of Gallipoli: ferrying Turkish settlers and horsemen across the strait will plant the Ottoman crescent permanently in Europe, but risks provoking a united Greek and Balkan backlash before our Anatolian rear is secure."
 oe_v250_tur.2.a:0 "Ferry Ghazi settlers across and fortify the Gallipoli bridgehead"
 oe_v250_tur.2.b:0 "Extract Byzantine gold and mercenary transit rights instead"
 oe_v250_tur.2.c:0 "Consolidate Anatolian coastal forts before expanding westward"
 oe_v250_tur.3.t:0 "Lala Sahin & the Rumelian Beylerbeylik"
 oe_v250_tur.3.d:0 "Rapid advances up the Maritsa valley have outpaced direct supervision from Bursa. Murad's veteran tutor Lala Sahin Pasha proposes creating a unified Beylerbeylik of Rumelia centered at Edirne to coordinate Balkan campaigns, garrison roads, and enforce sultanic justice—whereas frontier Evrenosid and Mihaloglu march-lords insist that split Uc-Bey commands preserve faster raiding initiative."
 oe_v250_tur.3.a:0 "Invest Lala Sahin as Beylerbey of Rumelia under Edirne"
 oe_v250_tur.3.b:0 "Preserve autonomous Uc-Bey march-lords along the frontier"
 oe_v250_tur.4.t:0 "Founding the Pencik & Kapikulu Corps"
 oe_v250_tur.4.d:0 "Vizier Candarli Kara Halil and Molla Rustem present a bold ordinance: claim one-fifth of war captives (the Pencik) and train them as salaried Kapikulu foot soldiers—the Yeni Ceri—answerable solely to the Sultan. A standing royal household infantry will counterbalance unruly Turkish begs, yet paying year-round wages and curtailing Ghazi spoils will deeply anger our traditional tribal horsemen."
 oe_v250_tur.4.a:0 "Enact the Pencik levy and raise the salaried Kapikulu corps"
 oe_v250_tur.4.b:0 "Reject slave infantry and uphold Ghazi tribal warrior primacy"
 oe_v250_tur.4.c:0 "Limit the Pencik to fortress guards while keeping levy balance"
 oe_v250_tur.5.t:0 "The Tahrir Defteri Timar Land Survey"
 oe_v250_tur.5.d:0 "Imperial surveyors have tallied every peasant hearth, mill, and vineyard across our newly won sancaks. The Divan now faces a foundational fiscal question: parcel out surveyed villages as Timar fiefs to support thousands of armored Sipahi cavalrymen without touching silver coin, or keep the richest river plains as Hass-i Humayun crown estates taxed directly in cash."
 oe_v250_tur.5.a:0 "Parcel surveyed lands into Sipahi Timar cavalry estates"
 oe_v250_tur.5.b:0 "Reserve prime plains as Hass-i Humayun crown cash estates"
 oe_v250_tur.6.t:0 "Anatolian Beylik Diplomacy: Germiyan & Hamid"
 oe_v250_tur.6.d:0 "With Ottoman banners advancing across Rumelia, the Turkish beyliks of Germiyan and Hamid fear Karamanid aggression and offer peaceful alignment: Germiyan proposes a royal wedding dowry bringing Kutahya's districts, while Hamid's bey hints he would sell key highland towns around Isparta for gold. Yet hawkish commanders urge taking Anatolia by the sword rather than emptying our treasury."
 oe_v250_tur.6.a:0 "Seal the marriage dowry and silver purchase peacefully"
 oe_v250_tur.6.b:0 "Reject silver bargains and assert Ottoman hegemony by arms"
 oe_v250_tur.7.t:0 "The Field of Kosovo & Balkan Vassalage"
 oe_v250_tur.7.d:0 "Clashes with Serbian, Bosnian, and Bulgarian lords across the central Balkan passes confront the Porte with the burden of imperial overstretch. Binding defeated Christian princes as tributary vassals who furnish silver and heavy auxiliary lances will spare Ottoman garrisons for Anatolian wars—whereas abolishing local dynasties in favor of direct sanjaks promises tighter control at the cost of relentless insurgency."
 oe_v250_tur.7.a:0 "Bind Balkan princes as tributary vassals furnishing auxiliary lances"
 oe_v250_tur.7.b:0 "Abolish local courts and impose direct Ottoman sanjaks"
 oe_v250_tur.8.t:0 "Centralizing the Divan-i Humayun"
 oe_v250_tur.8.d:0 "As our state grows from frontier emirate into a transcontinental empire, a quiet struggle divides the Imperial Council (Divan-i Humayun). Palace-educated Kapikulu administrators urge placing every seal and fiscal ledger under servants completely dependent on the Sultan, while the illustrious Candarli dynasty of Turkish jurists argues that noble Ottoman counselors safeguard legitimacy and moderate reckless autocracy."
 oe_v250_tur.8.a:0 "Elevate Kapikulu palace bureaucrats to dominate the Divan"
 oe_v250_tur.8.b:0 "Confirm the Candarli Turkish aristocracy as hereditary Viziers"
 oe_v250_tur.9.t:0 "Shadow of Timur & the Interregnum Warning"
 oe_v250_tur.9.d:0 "Envoys bearing arrogant letters from Samarkand demand that the Ottoman Sultan restore deposed Anatolian beys and acknowledge Timurid suzerainty. Across central Anatolia, newly subjugated Turkmen tribes waver in their allegiance, and court chroniclers whisper that a single battlefield catastrophe near Ankara could tear our house into rival princely factions."
 oe_v250_tur.9.a:0 "Conciliate Anatolian beys and harden defensive garrisons"
 oe_v250_tur.9.b:0 "Defy Samarkand with all-out centralization and emergency war levies"
 oe_v250_tur.10.t:0 "Restoring Order: The Sheikh Bedreddin Crisis"
 oe_v250_tur.10.d:0 "Exhausted by civil war and heavy war requisitions, impoverished peasants, dispossessed timariots, and heterodox dervishes from Aydin to Dobruja rally behind jurist-mystic Sheikh Bedreddin, preaching shared wealth and fellowship across faiths. Suppressing the uprising alongside orthodox Sunni ulema will swiftly restore hierarchy, while easing rural taxes could calm the villages at the cost of clerical outrage."
 oe_v250_tur.10.a:0 "Enforce orthodox Sunni ulema discipline and crush dervish sedition"
 oe_v250_tur.10.b:0 "Grant agrarian tax relief and frontier syncretic leniency"
 oe_v250_tur.11.t:0 "The Varna Frontier & Siege Artillery Foundries"
 oe_v250_tur.11.d:0 "Hungarian war-wagons and papal crusade fleets threaten the lower Danube and Black Sea coast around Varna, even as triple stone walls across Thrace defy traditional escalade. Murad II's master gunners plead for copper, tin, and skilled founders to forge monster bronze bombards capable of shattering any fortress—while traditional cavalry commanders insist our survival depends on agile horsemen and fortified Danube passes."
 oe_v250_tur.11.a:0 "Invest heavily in bronze siege bombards and master gunners"
 oe_v250_tur.11.b:0 "Prioritize swift Rumelian horsemen and Danube river forts"
 oe_v250_tur.12.t:0 "The Law of Fratricide vs Imperial Council Succession"
 oe_v250_tur.12.d:0 "Memory of the bitter post-Ankara succession wars still haunts the Ottoman palace. As the realm prepares for its imperial zenith, legal scholars debate whether to codify a stark Kanunname authorizing a new Sultan to execute rival brothers 'for the order of the world' (Nizam-i Alem), or to entrust succession arbitration to a senior Imperial Council of viziers and judges."
 oe_v250_tur.12.a:0 "Codify the stark Law of Fratricide for undivided imperial order"
 oe_v250_tur.12.b:0 "Entrust succession arbitration to the Imperial Divan Council"
