l_english:
 STATIC_MODIFIER_NAME_oe_rpl_yoke_tribute_peace: "Tribute Peace with Sarai"
 STATIC_MODIFIER_DESC_oe_rpl_yoke_tribute_peace: "Timely tribute keeps the steppe horsemen at bay, buying quiet years to rebuild."
 STATIC_MODIFIER_NAME_oe_rpl_yoke_defiance_stance: "Defiance Against the Baskaks"
 STATIC_MODIFIER_DESC_oe_rpl_yoke_defiance_stance: "Quiet defiance of the khan's tax collectors stiffens the resolve of princes and townsmen alike."
 STATIC_MODIFIER_NAME_oe_rpl_steppe_mobilization: "Mobilization for the Steppe Troubles"
 STATIC_MODIFIER_DESC_oe_rpl_steppe_mobilization: "Taking advantage of turmoil on the steppe, the realm sharpens its arms for a decisive reckoning."
 STATIC_MODIFIER_NAME_oe_rpl_steppe_trade_compact: "Volga River Trade Compact"
 STATIC_MODIFIER_DESC_oe_rpl_steppe_trade_compact: "Deals with rival steppe contenders keep river commerce flowing even amid the Great Troubles."
 STATIC_MODIFIER_NAME_oe_rpl_kulikovo_victory: "Glory of Kulikovo Field"
 STATIC_MODIFIER_DESC_oe_rpl_kulikovo_victory: "Victory on the Don has shattered the myth of steppe invincibility and rallied the Rus' lands."
 STATIC_MODIFIER_NAME_oe_rpl_kulikovo_fortress: "Fortified River Defenses"
 STATIC_MODIFIER_DESC_oe_rpl_kulikovo_fortress: "Fortified crossings and timber stockades blunt steppe raids while sparing the countryside."
 STATIC_MODIFIER_NAME_oe_rpl_stone_kremlins: "Stone Kremlins and Early Firearms"
 STATIC_MODIFIER_DESC_oe_rpl_stone_kremlins: "Lessons from Tokhtamysh's raid spur the building of stone kremlins and early gunpowder defenses."
 STATIC_MODIFIER_NAME_oe_rpl_unbroken_spirit: "Unbroken Defiance"
 STATIC_MODIFIER_DESC_oe_rpl_unbroken_spirit: "Refusing to kneel even amid burning towns hardens the realm's resolve."
 STATIC_MODIFIER_NAME_oe_rpl_primogeniture_law: "Primogeniture and Central Crown"
 STATIC_MODIFIER_DESC_oe_rpl_primogeniture_law: "Direct filial succession ends the cycle of fratricidal appanage wars and strengthens central rule."
 STATIC_MODIFIER_NAME_oe_rpl_boyar_compact: "Compact of Princes and Boyars"
 STATIC_MODIFIER_DESC_oe_rpl_boyar_compact: "A constitutional compromise with the hereditary boyars secures domestic peace and noble support."
 STATIC_MODIFIER_NAME_oe_rpl_yoke_shattered: "The Tatar Yoke Shattered"
 STATIC_MODIFIER_DESC_oe_rpl_yoke_shattered: "The khan's charter lies torn by the frozen Ugra; two centuries of steppe overlordship are over."
 STATIC_MODIFIER_NAME_oe_rpl_steppe_armistice: "Armed Frontier Armistice"
 STATIC_MODIFIER_DESC_oe_rpl_steppe_armistice: "An armed frontier settlement ends tribute without prolonged steppe devastation."
 STATIC_MODIFIER_NAME_oe_rpl_p1_kalita_purse: "Kalita's Treasury Order"
 STATIC_MODIFIER_DESC_oe_rpl_p1_kalita_purse: "Disciplined treasury management lays the financial bedrock for gathering the Rus' lands."
 STATIC_MODIFIER_NAME_oe_rpl_p1_gathering_lands: "Gathering of the Rus' Lands"
 STATIC_MODIFIER_DESC_oe_rpl_p1_gathering_lands: "Appanage buyouts and unified tax rolls steadily draw neighboring principalities into central rule."
 STATIC_MODIFIER_NAME_oe_rpl_p1_service_gentry: "Princely Service Gentry"
 STATIC_MODIFIER_DESC_oe_rpl_p1_service_gentry: "Loyal service gentry provide a mounted retinue bound directly to the Grand Prince."
 STATIC_MODIFIER_NAME_oe_rpl_p1_white_stone: "The White-Stone Kremlin"
 STATIC_MODIFIER_DESC_oe_rpl_p1_white_stone: "Gleaming white-stone ramparts anchor the authority and defense of northeastern Rus'."
 STATIC_MODIFIER_NAME_oe_rpl_p1_yam_network: "The Grand Prince's Yam Network"
 STATIC_MODIFIER_DESC_oe_rpl_p1_yam_network: "Relay stations across the forests speed dispatches, troops, and administrative integration."
 STATIC_MODIFIER_NAME_oe_rpl_p1_sudebnik_precursor: "Precursor of the Sudebnik"
 STATIC_MODIFIER_DESC_oe_rpl_p1_sudebnik_precursor: "Standardized royal courts and treasury scribes prepare the way for a unified all-Rus' law code."
 STATIC_MODIFIER_NAME_oe_rpl_p1_pomestye_system: "Pomestye Service Estates"
 STATIC_MODIFIER_DESC_oe_rpl_p1_pomestye_system: "Conditional service estates sustain a standing cavalry force directly obligated to the throne."
 STATIC_MODIFIER_NAME_oe_rpl_p2_veche_charter: "Charter of the Great Veche"
 STATIC_MODIFIER_DESC_oe_rpl_p2_veche_charter: "The great Veche bell guards civic self-rule and the liberties of the northern merchant guilds."
 STATIC_MODIFIER_NAME_oe_rpl_p2_guild_veche: "Reform of Ivan's Hundred"
 STATIC_MODIFIER_DESC_oe_rpl_p2_guild_veche: "Expanded guild representation invigorates northern commerce and keeps oligarchs in check."
 STATIC_MODIFIER_NAME_oe_rpl_p2_executive_veche: "Posadnik and Tysyatsky Executive"
 STATIC_MODIFIER_DESC_oe_rpl_p2_executive_veche: "A streamlined republican executive mobilizes civic militias and patrols swiftly in crisis."
 STATIC_MODIFIER_NAME_oe_rpl_p2_baltic_league: "Baltic Commercial League"
 STATIC_MODIFIER_DESC_oe_rpl_p2_baltic_league: "Equal treaties at Peterhof turn the Volkhov-Baltic axis into a fountain of silver and furs."
 STATIC_MODIFIER_NAME_oe_rpl_p2_neva_fleet: "Neva-Ladoga Maritime Fleet"
 STATIC_MODIFIER_DESC_oe_rpl_p2_neva_fleet: "Home-built shipyards on the Neva secure Baltic sea lanes and break foreign trade monopolies."
 STATIC_MODIFIER_NAME_oe_rpl_p2_free_league: "League of Free Northern Cities"
 STATIC_MODIFIER_DESC_oe_rpl_p2_free_league: "Allied northern towns pool silver, mercenaries, and stone walls to defy autocratic conquest."
 STATIC_MODIFIER_NAME_oe_rpl_p2_pomor_frontier: "Pomor White Sea and Ural Expeditions"
 STATIC_MODIFIER_DESC_oe_rpl_p2_pomor_frontier: "Hardy Pomor mariners push along the White Sea and northern rivers toward the Urals' fur wealth."
 STATIC_MODIFIER_NAME_oe_rpl_p3_princely_league: "Compact of the Old Rus' Princes"
 STATIC_MODIFIER_DESC_oe_rpl_p3_princely_league: "Sworn princely compacts and shared councils offer an alternative to Muscovite autocracy."
 STATIC_MODIFIER_NAME_oe_rpl_p3_federal_compact: "Equal Princely Federal Charter"
 STATIC_MODIFIER_DESC_oe_rpl_p3_federal_compact: "Respect for ancestral princely rights wins willing allies and loyal federal partners."
 STATIC_MODIFIER_NAME_oe_rpl_p3_old_rus_heritage: "Heritage of Old Rus'"
 STATIC_MODIFIER_DESC_oe_rpl_p3_old_rus_heritage: "Revived chronicles and ancient law assert the unbroken prestige of Yaroslav's Rus'."
 STATIC_MODIFIER_NAME_oe_rpl_p3_sophia_revival: "Revival of St. Sophia and the Council"
 STATIC_MODIFIER_DESC_oe_rpl_p3_sophia_revival: "All-Rus' synods in communion with Constantinople elevate the realm as Orthodoxy's northern beacon."
 STATIC_MODIFIER_NAME_oe_rpl_p3_ruthenian_synod: "Autonomous Ruthenian Synod"
 STATIC_MODIFIER_DESC_oe_rpl_p3_ruthenian_synod: "A united local synod steadies Orthodox governance across Ruthenia and the Rus' heartlands."
 STATIC_MODIFIER_NAME_oe_rpl_p3_grand_diet: "Grand Diet of the Rus' Princes"
 STATIC_MODIFIER_DESC_oe_rpl_p3_grand_diet: "A standing princely diet harmonizes defense, tribute, and integration across a federal Rus'."
 STATIC_MODIFIER_NAME_oe_rpl_p3_frontier_riders: "Dnieper-Volga Frontier Riders"
 STATIC_MODIFIER_DESC_oe_rpl_p3_frontier_riders: "Free frontier horsemen patrol the steppe borderlands, foreshadowing the great Cossack hosts."
 STATIC_MODIFIER_NAME_oe_rpl_autocephalous_see: "Autocephalous Metropolitanate of Rus'"
 STATIC_MODIFIER_DESC_oe_rpl_autocephalous_see: "Consecrating its own Metropolitan launches the Rus' Church into a new era of autocephaly."
 STATIC_MODIFIER_NAME_oe_rpl_ecumenical_bond: "Communion with the Ecumenical See"
 STATIC_MODIFIER_DESC_oe_rpl_ecumenical_bond: "Faithful communion with Constantinople secures canonical prestige across the Orthodox world."
 STATIC_MODIFIER_NAME_oe_rpl_kiev_shield: "Kyivan Autonomy under the Lithuanian Shield"
 STATIC_MODIFIER_DESC_oe_rpl_kiev_shield: "Lithuanian arms shield the Dnieper while Kyiv guards its ancient charters and Orthodox see."
 STATIC_MODIFIER_NAME_oe_rpl_kiev_independent: "Rurikid Independence Restored in Kyiv"
 STATIC_MODIFIER_DESC_oe_rpl_kiev_independent: "Breaking free from foreign union rallies the Dnieper lands beneath Kyiv's ancient banner."
 oe_rpl.1.t: "The Three Roads of Rus'"
 oe_rpl.1.d: "The hoofbeats of the steppe still echo along the southern frontier, yet the East Slavic lands between forest and river stand at a historic crossroads. Moscow champions princely autocracy, fiscal centralization, and the gathering of lands; Novgorod and Pskov guard the Veche assembly and Baltic commercial liberty; Tver, Kyiv, and Smolensk recall the older princely federation and the great church councils of Old Rus'.\n\nAs our court charts its course, we must choose the institutional road that will shape Rus' for generations."
 oe_rpl.1.a: "Path of Muscovite Autocracy (Historical: Grand Princely centralization)"
 oe_rpl.1.a.tt: "Select Path 1 (#bold #color_yellow Muscovite Autocracy#!#!), gaining [ShowModifier('oe_rpl_p1_kalita_purse')] for #Y 15 years#! and unlocking the Gathering of Lands, White-Stone Kremlin, and Sudebnik precursor events."
 oe_rpl.1.b: "Path of the Novgorod Veche & Baltic League (Alt-History)"
 oe_rpl.1.b.tt: "Select Path 2 (#bold #color_yellow Novgorod Veche Republic#!#!), gaining [ShowModifier('oe_rpl_p2_veche_charter')] for #Y 15 years#! and unlocking the Veche Reform, Baltic League, and Pomor Frontier events."
 oe_rpl.1.c: "Path of the Tver-Kyiv Old Rus' Federation (Alt-History: unlocks All-Rus' Council)"
 oe_rpl.1.c.tt: "Select Path 3 (#bold #color_yellow Old Rus Federation#!#!), gaining [ShowModifier('oe_rpl_p3_princely_league')] for #Y 15 years#!, immediately unlocking the All-Rus' Council expedition and the Grand Diet event chain."
 oe_rpl.2.t: "Envoys of Sarai and the Yarlyk of Vladimir"
 oe_rpl.2.d: "Tax collectors and steppe riders from Sarai have entered the city gates, pressing the khan's demands for tribute and brandishing the Yarlyk of Vladimir. The execution of Prince Alexander of Tver at Sarai in 1339 stands as a grim warning, yet endless silver flowing southward drains every town.\n\nShall our court bow for now to buy time, or quietly begin testing the Horde's grip?"
 oe_rpl.2.a: "Pay the tribute in full and buy quiet years to grow"
 oe_rpl.2.a.tt: "Yoke Defiance #R −10#!; gain [ShowModifier('oe_rpl_yoke_tribute_peace')] for #Y 10 years#!."
 oe_rpl.2.b: "Stall the baskaks and rally defiance among the Rus'"
 oe_rpl.2.b.tt: "Yoke Defiance #G +15#!, Prestige #G +5#!; gain [ShowModifier('oe_rpl_yoke_defiance_stance')] for #Y 10 years#!."
 oe_rpl.3.t: "The Great Troubles of the Steppe"
 oe_rpl.3.d: "Startling word arrives from Sarai: rival Chinggisid princes and emirs are tearing the Golden Horde apart in relentless succession wars. Scouts and merchants report that the khan's envoys can no longer enforce their writ across the north—a rare opening for the Rus' to break the habits of submission."
 oe_rpl.3.a: "Suspend tribute and drill the host for a reckoning on the steppe"
 oe_rpl.3.a.tt: "Yoke Defiance #G +20#!; gain [ShowModifier('oe_rpl_steppe_mobilization')] for #Y 10 years#!."
 oe_rpl.3.b: "Play the rival steppe factions against one another to secure river trade"
 oe_rpl.3.b.tt: "Yoke Defiance #G +10#!; gain [ShowModifier('oe_rpl_steppe_trade_compact')] for #Y 10 years#!."
 oe_rpl.4.t: "The Oath on the Don: Kulikovo Field"
 oe_rpl.4.d: "The steppe warlord Mamai marches north with a great host, vowing to break the insolent Rus' towns and restore old tribute by fire and sword. With the blessing of the Trinity Monastery, banners gather along the crossings of the Don. This hour will decide whether the Rus' can finally meet and defeat the steppe in open battle."
 oe_rpl.4.a: "Cross the Don and meet the steppe host on Kulikovo Field!"
 oe_rpl.4.a.tt: "Yoke Defiance #G +25#!, advance to the Kulikovo Era, Prestige #G +15#!, Army Tradition #G +10#!; gain [ShowModifier('oe_rpl_kulikovo_victory')] for #Y 10 years#!."
 oe_rpl.4.b: "Hold the fortified river crossings and wear down the steppe riders"
 oe_rpl.4.b.tt: "Yoke Defiance #G +15#!, advance to the Kulikovo Era, Stability #G +5#!; gain [ShowModifier('oe_rpl_kulikovo_fortress')] for #Y 10 years#!."
 oe_rpl.5.t: "Tokhtamysh's Raid and the Stone Walls"
 oe_rpl.5.d: "Hardly have the bells of victory fallen silent when Tokhtamysh, having reunited the Horde, sweeps north in a swift punitive raid. Timber palisades burn beneath steppe arrows, teaching a bitter truth: one triumph on the field does not erase two centuries of danger. Only stone walls and new gunpowder arms can guard the towns for good."
 oe_rpl.5.a: "Pay a token tribute while raising stone kremlins and early cannon"
 oe_rpl.5.a.tt: "Yoke Defiance #R −5#!; gain [ShowModifier('oe_rpl_stone_kremlins')] for #Y 10 years#!."
 oe_rpl.5.b: "Defy the khan even amid the ashes—never kneel to Sarai again!"
 oe_rpl.5.b.tt: "Yoke Defiance #G +10#!, Stability #R −5#!, Army Tradition #G +5#!; gain [ShowModifier('oe_rpl_unbroken_spirit')] for #Y 10 years#!."
 oe_rpl.6.t: "Brother Against Son: The Succession Crisis"
 oe_rpl.6.d: "In the second quarter of the fifteenth century, the ancient Rurikid custom of collateral seniority collides head-on with direct father-to-son succession. Appanage princes and proud boyars eye the throne, threatening decades of feudal civil war. Will the court crush rival claims to forge a centralized crown, or strike a constitutional pact with the nobility?"
 oe_rpl.6.a: "Enforce direct primogeniture and break appanage separatism"
 oe_rpl.6.a.tt: "Advance to the Consolidation Era, Stability #R −8#!, Legitimacy #G +15#!; gain [ShowModifier('oe_rpl_primogeniture_law')] for #Y 15 years#!."
 oe_rpl.6.b: "Strike a formal compact with the princes and boyars to preserve peace"
 oe_rpl.6.b.tt: "Advance to the Consolidation Era, Stability #G +5#!; gain [ShowModifier('oe_rpl_boyar_compact')] for #Y 15 years#!."
 oe_rpl.7.t: "The Great Stand on the Ugra: End of the Yoke"
 oe_rpl.7.d: "Autumn ice creeps across the Ugra River as the Great Horde deploys along the southern bank, demanding overdue tribute and renewed submission. Yet times have changed: disciplined Rus' regiments backed by firearms hold the northern shore until winter frost and steppe rivalries force the khan to withdraw without a battle. Two centuries of the Tatar Yoke have ended—opening the road to sovereignty, the Tsar's crown, and the eastern frontier."
 oe_rpl.7.a: "Tear up the khan's charter—the Tatar Yoke is broken forever! (Completes Phase 1)"
 oe_rpl.7.a.tt: "Mark #bold #color_yellow Tatar Yoke Broken#!#! and Phase 1 complete (ready for post-1480 Sophia, Tsar, and Siberia content), leave the Tatar Yoke if still a member, Prestige #G +25#!, Stability #G +10#!; gain [ShowModifier('oe_rpl_yoke_shattered')] for #Y 15 years#!."
 oe_rpl.7.b: "Close the era with an armed frontier trade armistice (Completes Phase 1)"
 oe_rpl.7.b.tt: "Mark #bold #color_yellow Tatar Yoke Broken#!#! and Phase 1 complete, leave the Tatar Yoke if still a member, Prestige #G +15#!; gain [ShowModifier('oe_rpl_steppe_armistice')] for #Y 15 years#!."
 oe_rpl.11.t: "The Purse of Kalita: Gathering the Rus' Lands"
 oe_rpl.11.d: "Following Ivan Kalita's famed maxim, our court gathers the fractured Rus' lands not by the sword alone, but through treasury discipline, buyouts of appanage rights, and unified tax rolls. With coffers filling, the Grand Prince must decide whether to invest first in peaceful legal absorption or in a mounted service retinue bound directly to the throne."
 oe_rpl.11.a: "Buy out appanage charters and unify the tax registers"
 oe_rpl.11.a.tt: "Advance Autocracy Reform to Tier #Y 1#!, Yoke Defiance #G +10#!; gain [ShowModifier('oe_rpl_p1_gathering_lands')] for #Y 15 years#!."
 oe_rpl.11.b: "Enfeoff loyal service gentry to build a princely cavalry host"
 oe_rpl.11.b.tt: "Advance Autocracy Reform to Tier #Y 1#!, Yoke Defiance #G +10#!; gain [ShowModifier('oe_rpl_p1_service_gentry')] for #Y 15 years#!."
 oe_rpl.12.t: "The White-Stone Kremlin and the Oath of Princes"
 oe_rpl.12.d: "Fire and raiders have proven timber walls too fragile for a rising grand principality. Wagons of pale limestone now roll into the capital to raise the first great white-stone Kremlin in northeastern Rus', while royal scribes propose a permanent yam relay network to carry decrees and riders swiftly through the forests."
 oe_rpl.12.a: "Raise the white-stone Kremlin as the unassailable heart of Rus'"
 oe_rpl.12.a.tt: "Advance Autocracy Reform to Tier #Y 2#!, Yoke Defiance #G +15#!; gain [ShowModifier('oe_rpl_p1_white_stone')] for #Y 15 years#!."
 oe_rpl.12.b: "Establish the Grand Prince's yam relay roads across the realm"
 oe_rpl.12.b.tt: "Advance Autocracy Reform to Tier #Y 2#!, Yoke Defiance #G +15#!; gain [ShowModifier('oe_rpl_p1_yam_network')] for #Y 15 years#!."
 oe_rpl.13.t: "Sovereign of All Rus' and the Sudebnik Precursor"
 oe_rpl.13.d: "With civil strife mastered and rival principalities bowing to one sovereign, court jurists begin drafting a unified law code for all Rus'—the forerunner of the great Sudebnik—while military clerks propose granting newly acquired estates on conditional pomestye service tenure to sustain a standing army loyal solely to the throne."
 oe_rpl.13.a: "Promulgate the Grand Prince's unified legal precursor and central courts"
 oe_rpl.13.a.tt: "Advance Autocracy Reform to Tier #Y 3#!, Yoke Defiance #G +15#!; gain [ShowModifier('oe_rpl_p1_sudebnik_precursor')] for #Y 20 years#!."
 oe_rpl.13.b: "Institute the pomestye service-estate system to arm the crown"
 oe_rpl.13.b.tt: "Advance Autocracy Reform to Tier #Y 3#!, Yoke Defiance #G +15#!; gain [ShowModifier('oe_rpl_p1_pomestye_system')] for #Y 20 years#!."
 oe_rpl.14.t: "The Veche Bell and the Reform of the Posadniks"
 oe_rpl.14.d: "The great Veche bell rings across the Volkhov, yet a handful of boyar clans have monopolized the office of Posadnik, stirring anger among the Ivan's Hundred merchant guilds and urban districts. If the commercial republic is to survive between autocratic princes and Baltic rivals, the assembly itself must be reformed."
 oe_rpl.14.a: "Expand representation for Ivan's Hundred and the merchant guilds"
 oe_rpl.14.a.tt: "Advance Veche Reform to Tier #Y 1#!, Yoke Defiance #G +10#!; gain [ShowModifier('oe_rpl_p2_guild_veche')] for #Y 15 years#!."
 oe_rpl.14.b: "Strengthen the Posadnik and Tysyatsky executive council for defense"
 oe_rpl.14.b.tt: "Advance Veche Reform to Tier #Y 1#!, Yoke Defiance #G +10#!; gain [ShowModifier('oe_rpl_p2_executive_veche')] for #Y 15 years#!."
 oe_rpl.15.t: "Peterhof and the Baltic Commercial League"
 oe_rpl.15.d: "At the walled Peterhof Kontor, Hanseatic traders from Lubeck, Gotland, and Riga exchange chests of western silver for northern sables, beeswax, and flax. Two bold proposals come before the Veche: sign an equal commercial league with the Baltic towns, or build our own Neva shipyards and armed merchantmen to command the sea lanes directly."
 oe_rpl.15.a: "Strike an equal Baltic commercial charter centered on Peterhof"
 oe_rpl.15.a.tt: "Advance Veche Reform to Tier #Y 2#!, Yoke Defiance #G +15#!; gain [ShowModifier('oe_rpl_p2_baltic_league')] for #Y 15 years#!."
 oe_rpl.15.b: "Build a Neva-Ladoga merchant and patrol fleet to break foreign monopoly"
 oe_rpl.15.b.tt: "Advance Veche Reform to Tier #Y 2#!, Yoke Defiance #G +15#!; gain [ShowModifier('oe_rpl_p2_neva_fleet')] for #Y 15 years#!."
 oe_rpl.16.t: "The Free Northern League and Pomor Frontier"
 oe_rpl.16.d: "Autocratic princes to the south cast covetous eyes on the Veche bell, longing to reduce the free northern towns to royal provinces. The assembly debates how to secure the republic's future: forge a mutual-defense league of free northern cities backed by mercenary silver, or charter daring Pomor voyagers across the White Sea toward the Urals and Siberia."
 oe_rpl.16.a: "Forge the League of Free Northern Cities to defend the Veche"
 oe_rpl.16.a.tt: "Advance Veche Reform to Tier #Y 3#!, Yoke Defiance #G +15#!; gain [ShowModifier('oe_rpl_p2_free_league')] for #Y 20 years#!."
 oe_rpl.16.b: "Charter Pomor White Sea and Ural fur expeditions toward Siberia"
 oe_rpl.16.b.tt: "Advance Veche Reform to Tier #Y 3#!, Yoke Defiance #G +15#!; gain [ShowModifier('oe_rpl_p2_pomor_frontier')] for #Y 20 years#!."
 oe_rpl.17.t: "The Compact of Old Rus': A Federal Alternative"
 oe_rpl.17.d: "In the courts of Tver, Kyiv, and Smolensk, princes and chroniclers remember an older Rus' bound by princely congresses and shared Rurikid dignity rather than centralized submission. Offering a federal compact that respects ancestral rights can rally East Slavic realms wary of Muscovite absorption."
 oe_rpl.17.a: "Sign the Equal Princely Compact to unite the Rus' by alliance"
 oe_rpl.17.a.tt: "Advance Federal Reform to Tier #Y 1#!, Yoke Defiance #G +15#!; gain [ShowModifier('oe_rpl_p3_federal_compact')] for #Y 15 years#!."
 oe_rpl.17.b: "Revive the Old Rus' chronicles and legal heritage of Yaroslav"
 oe_rpl.17.b.tt: "Advance Federal Reform to Tier #Y 1#!, Yoke Defiance #G +15#!; gain [ShowModifier('oe_rpl_p3_old_rus_heritage')] for #Y 15 years#!."
 oe_rpl.18.t: "Bells of St. Sophia: The All-Rus' Council"
 oe_rpl.18.d: "Control of the Metropolitanate of All Rus' shapes the soul of eastern Orthodoxy. With the All-Rus' Church Council now open to our court, bishops from both the Dnieper and the Volga can assemble before our icons, breaking any single principality's monopoly over ecclesiastical legitimacy."
 oe_rpl.18.a: "Convene the All-Rus' Council in canonical communion with Constantinople"
 oe_rpl.18.a.tt: "Advance Federal Reform to Tier #Y 2#!, Yoke Defiance #G +15#!, Religious Influence #G +20#!, All-Rus' Councils +1; gain [ShowModifier('oe_rpl_p3_sophia_revival')] for #Y 15 years#!."
 oe_rpl.18.b: "Empower a local Ruthenian synod centered on Kyiv's heritage"
 oe_rpl.18.b.tt: "Advance Federal Reform to Tier #Y 2#!, Yoke Defiance #G +15#!, Stability #G +5#!; gain [ShowModifier('oe_rpl_p3_ruthenian_synod')] for #Y 15 years#!."
 oe_rpl.19.t: "The Grand Diet of Princes and Frontier Riders"
 oe_rpl.19.d: "Between Poland-Lithuania to the west, fractured steppe khanates to the south, and centralized rivals in the northeast, our princely federation must become a lasting institution. Delegates debate founding a standing Grand Diet of all Rus' or raising free horsemen along the Dnieper-Volga steppes to guard the southern marches."
 oe_rpl.19.a: "Establish the standing Grand Diet of Rus' to harmonize the federation"
 oe_rpl.19.a.tt: "Advance Federal Reform to Tier #Y 3#!, Yoke Defiance #G +15#!; gain [ShowModifier('oe_rpl_p3_grand_diet')] for #Y 20 years#!."
 oe_rpl.19.b: "Raise Dnieper-Volga frontier riders to shield the steppe marches"
 oe_rpl.19.b.tt: "Advance Federal Reform to Tier #Y 3#!, Yoke Defiance #G +15#!, Army Tradition #G +8#!; gain [ShowModifier('oe_rpl_p3_frontier_riders')] for #Y 20 years#!."
 oe_rpl.30.t: "The See of All Rus': Autocephaly or Constantinople"
 oe_rpl.30.d: "Mid-fifteenth-century debates over church union with Rome—and the turbulent legation of Metropolitan Isidore—have shaken the northern dioceses. The bishops of Rus' assemble to ask the sovereign's verdict: shall our synod reject Latin concessions and consecrate its own Metropolitan in 1448 fashion, or preserve ancient canonical communion with Constantinople?"
 oe_rpl.30.a: "Consecrate our own Metropolitan and inaugurate Rus' church autocephaly"
 oe_rpl.30.a.tt: "Set church stance to #bold #color_yellow Autocephalous See#!#!, Religious Influence #G +25#!, Prestige #G +10#!; gain [ShowModifier('oe_rpl_autocephalous_see')] for #Y 20 years#!."
 oe_rpl.30.b: "Preserve canonical communion with the Ecumenical Patriarchate in Constantinople"
 oe_rpl.30.b.tt: "Set church stance to #bold #color_yellow Constantinople Communion#!#!; gain [ShowModifier('oe_rpl_ecumenical_bond')] for #Y 20 years#!."
 oe_rpl.31.t: "Between Vilnius and the Steppe: Kyiv's Choice"
 oe_rpl.31.d: "At the opening of 1337, Lithuanian protection shields Kyiv from direct Horde levies, yet places the Mother of Rus' Cities as a junior partner under Vilnius's crown. Beneath the domes of St. Sophia, boyars and burghers debate whether to use Lithuania's shield while rebuilding, or immediately dissolve the personal union and reclaim Rurikid independence."
 oe_rpl.31.a: "Keep the Lithuanian shield for now while guarding Kyiv's autonomy"
 oe_rpl.31.a.tt: "Remain under the union's shield, Stability #G +5#!; gain [ShowModifier('oe_rpl_kiev_shield')] for #Y 15 years#!."
 oe_rpl.31.b: "Break the Lithuanian union and proclaim Rurikid independence!"
 oe_rpl.31.b.tt: "Leave Lithuania's personal union immediately, Yoke Defiance #G +10#!, Prestige #G +10#!; gain [ShowModifier('oe_rpl_kiev_independent')] for #Y 15 years#!."
 oe_rpl.20.t: "Playable Rus': Choice Takes Effect"
