l_english:
 # Project Phoenix v42.0: Alt-Era Byzantine Instant Constitutional Reforms
 oe_v420_byz_1444_palaiologan_despotates:0 "Palaiologan Despotates & Mesazon"
 oe_v420_byz_1444_palaiologan_despotates_desc:0 "Coordinates the surviving imperial appanages of Morea, Selymbria, and Constantinople through the office of the Mesazon, preserving cabinet continuity and dynastic diplomacy at the price of divided crown authority."
 oe_v420_byz_1444_theodosian_garrison:0 "Theodosian & Hexamilion Garrisons"
 oe_v420_byz_1444_theodosian_garrison_desc:0 "Maintains the triple land walls of Constantinople and the Isthmus of Corinth defenses as a permanent fortress network, straining the diminished imperial treasury to hold the gateways of Greece."
 oe_v420_byz_1444_mistral_renaissance_court:0 "Mistra Neo-Hellenic Academy"
 oe_v420_byz_1444_mistral_renaissance_court_desc:0 "Sustains the philosophical circles of Gemistos Plethon and Bessarion between Mistra and the Blachernae court, cultivating classical scholarship and literacy despite tension with monastic conservatives."
 oe_v420_byz_1204_nicaean_exile_court:0 "Laskarid Court of Nicaea"
 oe_v420_byz_1204_nicaean_exile_court_desc:0 "Reconstitutes the Roman imperial chancery and Ecumenical Patriarchate in exile at Nicaea, anchoring legitimacy and administrative discipline while bearing the cost of a displaced imperial household."
 oe_v420_byz_1204_akritai_border_themes:0 "Anatolian Akritai Themes"
 oe_v420_byz_1204_akritai_border_themes_desc:0 "Organizes tax-exempt frontier smallholders and highland border guards along the Sangarios and Meander valleys, securing Nicaea against Latin and Seljuk raids while subordinating urban guild privileges."
