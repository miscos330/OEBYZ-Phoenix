l_english:
 oe_great_revolution: "The Great Eastern Roman Revolution"
 oe_great_revolution_desc: "The bells once summoned subjects to pray for their emperor. Now they summon citizens to decide the Empire's fate. The old order is not yet dead, and the new republic has scarcely learned to stand."
 oe_gr_radicalism: "Radicalism"
 oe_gr_radicalism_tooltip: "#bold Monthly Radicalism#!\nTotal: [DisasterView.GetDisaster.GetOwner.MakeScope.ScriptValue('oe_gr_radicalism_delta')|-=3]\nNatural growth: [DisasterView.GetDisaster.GetOwner.MakeScope.ScriptValue('oe_gr_radicalism_natural')|-=3]\nCountry modifiers: [DisasterView.GetDisaster.GetOwner.MakeScope.ScriptValue('oe_gr_radicalism_other')|-=3]\n\nNatural growth equals current radicalism × 0.005: zero at 0, and +0.5 per month at 100. Radicalism is bounded between 0 and 100."
 oe_gr_overview: "The old order has broken against the barricades, but its successor is yet to be born. Radicalism feeds upon itself while displaced nobles, clergy and discontented commoners await their chance to strike back."
 oe_gr_reactionary_muster: "Reactionary Mobilization"
 oe_gr_people_pool: "Opponents of the Revolution"
 oe_gr_soldier_pool: "Reactionary Soldiers"
 oe_gr_people_monthly: "Monthly: [DisasterView.GetDisaster.GetOwner.MakeScope.ScriptValue('oe_gr_people_delta')|+=2] people"
 oe_gr_soldiers_monthly: "Monthly: [DisasterView.GetDisaster.GetOwner.MakeScope.ScriptValue('oe_gr_soldiers_delta')|+=2] soldiers"
 oe_gr_muster_progress: "Mobilization Progress"
 oe_gr_muster_summary: "Monthly progress: [DisasterView.GetDisaster.GetOwner.MakeScope.ScriptValue('oe_gr_muster_delta')|-=3]"
 oe_gr_muster_tooltip: "#bold Monthly Reactionary Mobilization#!\nActual change: [DisasterView.GetDisaster.GetOwner.MakeScope.ScriptValue('oe_gr_muster_delta')|-=3]\nPeople pool / national population: [DisasterView.GetDisaster.GetOwner.MakeScope.ScriptValue('oe_gr_people_pressure')|3]\nSoldier pool / army manpower: [DisasterView.GetDisaster.GetOwner.MakeScope.ScriptValue('oe_gr_soldier_pressure')|3]\nImperial status: [DisasterView.GetDisaster.GetOwner.MakeScope.ScriptValue('oe_gr_emperor_muster_delta')|-=3]\n\nAdd both population ratios and the imperial-status modifier directly: a ratio of 0.2 contributes 0.2 progress. Imperial house arrest contributes −0.1 monthly; extinction of the direct imperial line replaces it with −0.2. These reductions do not stack. An army of zero uses a one-person denominator.\nChanges use opening monthly balances. Mobilization and replenishment pause during civil wars. Progress is bounded between 0 and 100."
 oe_gr_muster_rules: "Each month, the people pool gains #Y 0.05%#! of national population, and the soldier pool gains #Y 0.01%#! of the people pool. At #R 100#! progress, reactionaries rise in a random province, receive randomly selected locations comprising #R at least 80%#! of the country, Age of Absolutism light infantry equal to their soldier pool, and gold equal to their people pool. #Y Constantinople stays with the republic, and existing cores are retained.#!\nBoth pools and progress reset after an uprising and resume accumulating after the civil war. If too few locations remain, retaining Constantinople takes precedence."
 oe_gr_revolutionaries: "Eastern Roman Revolutionaries"
 oe_gr_reactionaries: "Eastern Roman Reactionaries"
 oe_gr_escape_tt: "The revolutionaries will hold #R Constantinople#! and randomly selected locations comprising #R more than half#! of Eastern Rome. Existing Eastern Roman cores are retained. Existing formations totaling approximately #R 80% of army manpower#! will join them; the final whole formation may exceed that threshold.\nOnce at peace, spend #Y 50 Political Influence#! to restore order, gain Reactionary Fervor and end this disaster."
 oe_gr_republic_tt: "#Y Eastern Rome becomes a republic.#! The emperor is placed under house arrest and a provisional president takes office. The republic will no longer trigger old-dynasty restoration rebellions.\nThe detained emperor cannot serve in the cabinet or command armies or fleets. Monthly reactionary mobilization: #G −0.1#!. Three days later, the three largest eligible armies at home will refuse allegiance in succession; if fewer exist, only those formations are affected.\n#bold This choice unlocks the full Great Revolution content that follows.#!"
 oe_gr_radicalism_plus_30_tt: "#bold Radicalism#!　#R +30#!"
 oe_gr_uprising_happened_tt: "The reactionaries have begun a civil war. Constantinople and Eastern Rome's existing cores have been retained."
 oe_gr_restore_order: "Restore Imperial Order"
 oe_gr_restore_order.title: "$oe_gr_restore_order$"
 oe_gr_restore_order.desc: "$oe_gr_restore_order_desc$"
 oe_gr_restore_order_desc: "With the smoke of civil war finally clearing, the emperor summons those still loyal to the throne. Counterrevolution shall become the Empire's new creed."
 oe_gr_restore_order.a: "Restore order in the emperor's name."
 oe_gr_restore_order_tt: "End the Great Eastern Roman Revolution disaster."
 oe_gr_end_condition_tt: "After the emperor escapes, end the disaster through Restore Imperial Order. The republican branch ends through future events."
 oe_great_revolution.1.t: "Riots in the Capital!"
 oe_great_revolution.1.d: "The first shot rang out along the Mese. Soon the bells of the entire city had lost their rhythm. Dockworkers dragged carts across the streets, students nailed declarations to the tax offices, and guards lowered their bayonets—or turned them upon their former comrades.\n\nThe court still awaited a report it could seal. The streets had already reached their verdict. Purple banners fell from the Hippodrome's imperial balcony, and the cry of 'citizen' echoed from the steps of Hagia Sophia. A side gate of Blachernae remains open. If the emperor escapes now, provinces and armies may yet fight in his name. If it closes, the Romans will greet the morning with a captive emperor and a republic whose future no one can foresee."
 oe_great_revolution.1.a: "The emperor escapes to Blachernae Palace."
 oe_great_revolution.1.b: "The revolutionaries seize the capital and imprison the emperor!"
 oe_great_revolution.2.t: "The Old Order Strikes Back"
 oe_great_revolution.2.d: "Morning prayers had barely ended when the old standards rose over a provincial square. Dispossessed families sent chests of silver; village priests carried secret pledges; scattered officers assembled the discontented into a single army. They did not all long for the same emperor, but they hated the revolution that had swept away their former lives.\n\nDispatches pour into Constantinople. The capital remains ours, while the Empire's provinces become the reactionaries' battlefield. The republic must now prove that it can defend the new world it proclaimed."
 oe_great_revolution.2.a: "Hold the capital. Defend the republic!"
 STATIC_MODIFIER_NAME_oe_gr_reactionary_fervor: "Reactionary Fervor"
 STATIC_MODIFIER_DESC_oe_gr_reactionary_fervor: "The throne turns the wounds of revolution into a call to rebuild absolutist order."
 STATIC_MODIFIER_NAME_oe_gr_political_instability: "Political Instability"
 STATIC_MODIFIER_DESC_oe_gr_political_instability: "Old loyalties have broken before the new government's authority can reach the imperial frontiers. This modifier stacks."
 STATIC_MODIFIER_NAME_oe_gr_unstable_credit: "Unstable Government Credit"
 STATIC_MODIFIER_DESC_oe_gr_unstable_credit: "An uncertain government inspires little confidence in either its coinage or its bonds."
 STATIC_MODIFIER_NAME_oe_gr_imprisoned_emperor: "Under House Arrest"
 STATIC_MODIFIER_DESC_oe_gr_imprisoned_emperor: "The emperor is confined by the revolutionary government and cannot serve in the cabinet or command armies or fleets. While alive and under house arrest, the emperor reduces monthly reactionary mobilization by 0.1."
 MODIFIER_TYPE_NAME_oe_gr_monthly_radicalism: "Monthly Radicalism"
 MODIFIER_TYPE_DESC_oe_gr_monthly_radicalism: "Monthly radicalism change during the Great Eastern Roman Revolution."
 oe_gr_emperor_identity: "Eastern Roman Emperor: [DisasterView.GetDisaster.GetOwner.MakeScope.GetVariable('oe_gr_emperor').GetCharacter.GetName]"
 oe_gr_emperor_age: "Age: [DisasterView.GetDisaster.GetOwner.MakeScope.GetVariable('oe_gr_emperor').GetCharacter.GetAge]"
 oe_gr_emperor_detained_status: "Status: #Y Under House Arrest#!\nCannot serve in the cabinet or command armies or fleets. Monthly reactionary mobilization: #G −0.1#!."
 oe_gr_emperor_free_status: "Status: #Y Not Under House Arrest#!\nThe emperor remains a symbol of the old order. On death, the oldest living direct descendant inherits the imperial title."
 oe_gr_emperor_pending_status: "#Y The emperor has died; succession is pending.#!\nThe surviving direct descendants are being identified."
 oe_gr_emperor_extinct_status: "#bold The Imperial Line Is Extinct#!\nNo one succeeds to the imperial title. Monthly reactionary mobilization: #G −0.2#!."
 oe_gr_emperor_unassigned_status: "There is currently no Eastern Roman emperor to display."
 oe_gr_succession_tt: "The oldest living direct descendant inherits the imperial title, regardless of sex. In the republican branch, the successor inherits the title and house arrest only; #Y the republic and its president remain in place#!."
 oe_gr_extinction_tt: "No one succeeds to the imperial title.\nReactionary mobilization: #G −10#! (minimum 0). Monthly mobilization thereafter: #G −0.2#!, replacing the −0.1 from imperial house arrest."
 oe_gr_disbanded_soldiers_tt: "Destroy this army and add #R [ROOT.GetCountry.MakeScope.GetVariable('oe_gr_refusal_people').GetValue|0]#! people to the reactionary soldier pool: twice the formation's manpower when this event opened."
 oe_great_revolution.3.t: "Heir to the Purple"
 oe_great_revolution.3.d: "[SCOPE.sCharacter('oe_gr_late_emperor').GetName] has died. The court may change the emblems above its gates, and governments may alter the headings of their decrees, but those who remember the old order still guard the imperial genealogies.\n\nAttendants and relatives have examined the records and submitted the name of [SCOPE.sCharacter('oe_gr_emperor_successor').GetName], the oldest surviving direct descendant. The purple may no longer command the Empire, yet its inheritance still gives many people a reason to await the next trumpet call."
 oe_great_revolution.3.a: "Let [SCOPE.sCharacter('oe_gr_emperor_successor').GetName] inherit the imperial title."
 oe_great_revolution.4.t: "The Imperial Line of House [SCOPE.sCharacter('oe_gr_late_emperor').GetDynasty.GetName] Is Extinct"
 oe_great_revolution.4.t_fallback: "The Imperial Line Is Extinct"
 oe_great_revolution.4.d: "No one spoke when the final genealogy was laid upon the table. [SCOPE.sCharacter('oe_gr_late_emperor').GetName] is dead, and neither the emperor's children nor their descendants include a living heir.\n\nOnce, loyalists could place their hopes in a young prince or an infant yet to grow. That direct line has now ended. The old standards remain, and secret letters will continue to circulate, but those who wished to rally in the imperial family's name have lost the one name most capable of uniting them."
 oe_great_revolution.4.a: "The imperial title shall remain vacant."
 oe_great_revolution.5.t: "An Army Refuses Allegiance"
 oe_great_revolution.5.d: "[SCOPE.sUnit('oe_gr_refusing_army').GetName] has returned the government's new oath. Its officers declare that they swore allegiance to the emperor and cannot surrender a lifetime's loyalty upon receipt of a decree from the capital.\n\nNo rebel flag flies above the camp, but neither does the republic's banner. Soldiers still assemble for their pay, and the guns remain in position. The officers demand assurances that they will not be ordered away. We may dissolve the formation and send embittered soldiers into the countryside, or pay to tolerate a silent, dangerous garrison."
 oe_great_revolution.5.a: "We have no need of their allegiance!"
 oe_great_revolution.5.b: "We only need them to remain in their quarters."
 STATIC_MODIFIER_NAME_oe_gr_confined_army: "Defiant Garrison"
 STATIC_MODIFIER_DESC_oe_gr_confined_army: "This army accepts continued pay only on condition that it remains in its quarters. Movement speed is reduced by 1000% for 1000 days, without decay."
 MODIFIER_TYPE_NAME_oe_gr_emperor_monthly_muster: "Monthly Reactionary Mobilization"
 MODIFIER_TYPE_DESC_oe_gr_emperor_monthly_muster: "Affects monthly reactionary mobilization while this character is the living emperor tracked by the disaster. Pauses during civil wars under the mobilization rules."
 oe_gr_keep_army_tt: "The army gains Defiant Garrison: #R −1000%#! movement speed for #Y 1000 days#!, without decay.\nLegitimacy: #R −10#!. Pay #R [ROOT.GetCountry.MakeScope.GetVariable('oe_gr_refusal_gold').GetValue|2]#! gold, equal to one month's income when this event opened."
