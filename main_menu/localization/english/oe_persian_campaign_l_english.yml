l_english:
 oe_cb_confront_timur: "Confront Timur"
 oe_cb_confront_timur_desc: "Byzantium may fabricate and use this casus belli against the Timurids only while the historical Timur lives. Reduces aggressive expansion and conquest cost by 50% and unlocks the 100-score End the Scourge of Central Asia treaty."
 oe_cb_caucasus_vassal: "Caucasian Vassalage"
 oe_cb_caucasus_vassal_desc: "Byzantium may fabricate this casus belli against Georgia or Armenia. Aggressive expansion and conquest cost are reduced by 50%. Unlocks the 50-score Caucasian Vassalage treaty; against Georgia, also unlocks the 50-score Rule the Caucasus treaty to cede its realm's Caucasian lands without Byzantine cores."
 oe_confront_timur: "Confront Timur"
 oe_caucasus_vassal: "Caucasian Vassalage"
 pe_oe_end_timur: "End the Scourge of Central Asia"
 pe_oe_end_timur_desc: "Available only while Timur lives. Cedes all Timurid locations in Persia, the Caucasus and the Fertile Crescent to Byzantium as conquered land without Byzantine cores."
 OE_END_TIMUR_EFFECT: "All Timurid locations in Persia, the Caucasus and the Fertile Crescent are ceded to Byzantium without Byzantine cores, at conquered integration level."
 pe_oe_caucasus_vassal: "Caucasian Vassalage"
 pe_oe_caucasus_vassal_desc: "The original war target becomes a Roman Ally of Byzantium."
 OE_RW_PERSIA: "Persia"
 OE_RW_PERSIA_DESC: "Beyond the Euphrates, ancient royal roads lead to the Iranian plateau. The Roman eagle and the sacred fires of Persia herald a new order among mountain passes, silk roads and royal cities."
 OE_RW_PERSIA_OPEN: "Click the map to open Persian campaign actions"
 OE_RW_PERSIA_ACTIONS: "Persian Campaign"
 OE_RW_PERSIA_HINT: "Click the map to view actions; close it to return to the map."
 OE_HEG_PERSIA_ACTIONS_HINT: "Bring the Caucasus and the Fertile Crescent into the Roman World, cross the Zagros and restore a Zoroastrian Persian Empire."
 OE_RW_ISFAHAN: "Isfahan"
 OE_RW_ISFAHAN_OWNER: "Owner of Isfahan"
 OE_HEG_PERSIA_LEVANT_REQUIRED: "Byzantium and its subjects at every level own all conquerable locations in the Levant; occupation alone does not count"
 OE_HEG_PERSIA_LAND_REQUIRED: "Byzantium or its subjects at any level own at least one conquerable location in Persia"
 oe_heg_plan_persia: "Persian Strategy"
 oe_heg_plan_persia_desc: "Requires Byzantine or subject ownership of every conquerable location in the Levant. Spend 1,000 Gold to bring the Caucasus and the Fertile Crescent into the Roman World."
 oe_heg_plan_persia_effect: "Spend #R 1,000#! Gold to add the Caucasus and the Fertile Crescent to the Roman World."
 oe_heg_persia_plan_done: "Completed: Persian Strategy"
 oe_heg_invade_persia: "Invade Persia"
 oe_heg_invade_persia_desc: "Spend 200 Gold, 20 Political Influence and 3 Stability to gain a capital-seizure casus belli against a foreign country whose capital lies in the Fertile Crescent, Persia or the Caucasus."
 oe_heg_invade_persia_effect: "Spend #R 200#! Gold, #R 20#! Political Influence and #R 3#! Stability to gain the Imperial Expedition casus belli against the selected country for 15 years."
 oe_heg_restore_persia: "Restore the Persian Empire"
 oe_heg_restore_persia_desc: "Grant all locations held by Byzantium and its subjects in Persia to a restored Persian Empire: an empire-rank, Persian-culture Zoroastrian state under Roman protection as the distinct Persian Empire subject type."
 oe_heg_restore_persia_effect: "Restore the Persian Empire from eligible Persian holdings, grant the Persian Restoration reform and begin a 30-year Sacred Fire Revival that gradually converts Sunni and Shia population in Persia to Zoroastrianism."
 oe_heg_persia_restored: "Completed: Persian Restoration"
 OE_RESTORED_PERSIAN_EMPIRE: "Persian Empire"
 OE_RESTORED_PERSIAN_EMPIRE_ADJ: "Persian"
 oe_restored_persian_empire: "Restored Persian Empire"
 oe_persian_restoration: "Persian Restoration"
 oe_persian_restoration_desc: "Under Roman protection, the Persian court restores the royal roads and trading towns and orders the duties of its provincial nobility. Sacred fires illuminate a new crown as the ancient silk routes bind the cities together."
 oe_persian_religious_revival: "Persian Sacred Fire Revival"
 oe_persian_religious_revival_desc: "As the Persian court is restored, priests rekindle sacred fires and rebuild sanctuaries and schools. Sunni and Shia communities in Persia gradually embrace Zoroastrianism. The movement does not spread beyond Persia.\n\n$OE_IDENTITY_FIXED_30Y_DESC$"
 oe_cb_confront_timur_PROV: "Confront Timur"
 oe_cb_caucasus_vassal_PROV: "Caucasian Vassalage"
 pe_oe_end_timur_entry: "End the Scourge of Central Asia"
 pe_oe_end_timur_entry_short: "End the Scourge of Central Asia"
 pe_oe_caucasus_vassal_entry: "Caucasian Vassalage"
 pe_oe_caucasus_vassal_entry_short: "Caucasian Vassalage"
 oe_confront_timur_desc: "Byzantium may fabricate and use this casus belli against the Timurids only while the historical Timur lives. Reduces aggressive expansion and conquest cost by 50% and unlocks the 100-score End the Scourge of Central Asia treaty."
 oe_caucasus_vassal_desc: "Byzantium may fabricate this casus belli against Georgia or Armenia. Aggressive expansion and conquest cost are reduced by 50%. Unlocks the 50-score Caucasian Vassalage treaty; against Georgia, also unlocks the 50-score Rule the Caucasus treaty to cede its realm's Caucasian lands without Byzantine cores."
 pe_oe_rule_caucasus: "Rule the Caucasus"
 pe_oe_rule_caucasus_desc: "Available when Byzantium attacks Georgia with the Caucasian Vassalage casus belli. Costs 50 war score and cedes all Georgian and Georgian subject locations in the Caucasus region to Byzantium without Byzantine cores."
 pe_oe_rule_caucasus_entry: "Rule the Caucasus"
 pe_oe_rule_caucasus_entry_short: "Rule the Caucasus"
 OE_RULE_CAUCASUS_EFFECT: "All locations in the #Y Caucasus region#! owned by Georgia and its subjects at every level are ceded to Byzantium without Byzantine cores, at conquered integration level. Land outside the region is unaffected."
 oe_persian_empire: "Persian Empire"
 oe_persian_empire_desc: "A Persian Empire restored under Roman protection, guarding the highland fortresses and the roads between East and West. It preserves its sacred fires and joins its overlord in war."
 oe_silk_road_trade: "Control the Silk Road Trade"
 oe_silk_road_trade_desc: "This government reform is disabled."
 oe_islamic_conversion_reform: "Conversion of Islam"
 oe_islamic_conversion_reform_desc: "New dioceses, schools and charitable foundations bind the coasts of the Maghreb to the Persian highlands. Patient instruction and shared worship draw newly submitted communities into the Orthodox faith."
 oe_islamic_conversion_policy: "Conversion of Islam"
 oe_islamic_conversion_policy_desc: "The holy cities and their pilgrimage roads enter a new imperial order. Respect for local cultures accompanies the work of parishes, schools and charitable institutions."
 oe_religious_victory_geography: "The Maghreb, Egypt, Arabia, Fertile Crescent, Persia and Anatolia"
 oe_declare_victory_over_islam: "Proclaim Victory over Islam"
 oe_declare_victory_over_islam_desc: "From the African coast to the Iranian plateau, the empire and its subjects hold the lands once contested by rival sultans. With the holy cities and great markets secured, the emperor summons clergy and envoys to proclaim a new religious settlement.\n\nRequires the Spread Orthodoxy imperial reform, at least 80% of all conquerable locations across the six regions combined, and the nine named cities. Subject holdings count. Available once, with no additional cost."
 oe_declare_victory_over_islam.title: "Proclaim Victory over Islam"
 oe_declare_victory_over_islam.desc: "From the African coast to the Iranian plateau, the empire and its subjects hold the lands once contested by rival sultans. With the holy cities and great markets secured, the emperor summons clergy and envoys to proclaim a new religious settlement.\n\nRequires the Spread Orthodoxy imperial reform, at least 80% of all conquerable locations across the six regions combined, and the nine named cities. Subject holdings count. Available once, with no additional cost."
 oe_declare_victory_over_islam.a: "Let the bells of Orthodoxy sound across the provinces."
 oe_victory_over_islam_done: "Victory over Islam Proclaimed"
 OE_RELIGIOUS_VICTORY_FAITH_REQUIRED: "Completed the Spread Orthodoxy imperial reform"
 OE_RELIGIOUS_VICTORY_CITIES_REQUIRED: "Byzantium and its subjects at every level own Mecca, Medina, Tunis, Cairo, Jerusalem, Alexandria, Antioch, Baghdad and Ankara"
 OE_RELIGIOUS_VICTORY_TERRITORY_REQUIRED: "Byzantium and its subjects at every level own at least 80% of all conquerable locations in the Maghreb, Egypt, Arabia, Fertile Crescent, Persia and Anatolia combined; military occupation does not count"
 OE_RELIGIOUS_VICTORY_EFFECT: "Begin the #Y Conversion of Islam movement#!, gradually converting Sunni and Shia population within Byzantium and its subjects to Orthodoxy. The movement is destroyed after #Y 30 years#!.\nUnlock the #Y Conversion of Islam#! government reform and the policy of the same name under the Mecca Pilgrimage Law, for voluntary adoption."
 oe_islamic_conversion_movement: "Conversion of Islam Movement"
 oe_islamic_conversion_movement_desc: "New parishes and schools gradually bring Sunni and Shia communities into the Orthodox faith. Spreads only within Byzantium and its subjects at every level, in locations with eligible population.\n\n$OE_IDENTITY_FIXED_30Y_DESC$"
