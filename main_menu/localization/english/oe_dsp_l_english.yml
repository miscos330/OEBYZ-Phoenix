l_english:
 oe_dsp_hosted: "Feasted at Constantinople"
 oe_dsp_delayed: "The emperor put off renewing a dignity"
 oe_dsp_snub: "The emperor refused to renew a dignity"
 oe_dsp_thanked: "The emperor declined our gift graciously"
 STATIC_MODIFIER_NAME_oe_dsp_walls_inscription: "The Sea Wall Inscription"
 STATIC_MODIFIER_DESC_oe_dsp_walls_inscription: "A despot of the empire paid for repairs to the sea walls, and the name is carved on a tower."
 oe_dsp.1.t: "The Guest from Ankara"
 oe_dsp.1.desc_vassal_west: "#F After the battle of Ankara in July 1402, Stefan Lazarević of Serbia went home by way of Constantinople. In August John VII, ruling the city while Manuel II was away in the West, made Stefan a despot. Three years later Stefan married a sister of John VII's empress.#!\n\n[SCOPE.sCharacter('oe_dsp_tr').GetName], ruler of [SCOPE.sCountry('oe_dsp_tc').GetName], has escaped from the wreck of the Ottoman army and is staying in Constantinople. The emperor is still away in the West, and the regent receives the guest. The Ottoman princes are fighting over the throne, and this ruler wants a standing that weighs more than any title at home. In the [oe_tu_family|e] this ruler ranks as a son and may receive a [Concept('oe_tu_dignity','court dignity')|e].\n\nDignities we cannot confer or cannot afford are not offered."
 oe_dsp.1.desc_other_west: "#F After the battle of Ankara in July 1402, Stefan Lazarević of Serbia went home by way of Constantinople. In August John VII, ruling the city while Manuel II was away in the West, made Stefan a despot. Three years later Stefan married a sister of John VII's empress.#!\n\n[SCOPE.sCharacter('oe_dsp_tr').GetName], ruler of [SCOPE.sCountry('oe_dsp_tc').GetName], has come to Constantinople while the Ottomans are at war among themselves. The emperor is still away in the West, and the regent receives the guest. The Ottoman princes are fighting over the throne, and this ruler wants a standing that weighs more than any title at home. In the [oe_tu_family|e] this ruler ranks as a son and may receive a [Concept('oe_tu_dignity','court dignity')|e].\n\nDignities we cannot confer or cannot afford are not offered."
 oe_dsp.1.desc_vassal: "#F After the battle of Ankara in July 1402, Stefan Lazarević of Serbia went home by way of Constantinople. In August John VII, ruling the city while Manuel II was away in the West, made Stefan a despot. Three years later Stefan married a sister of John VII's empress.#!\n\n[SCOPE.sCharacter('oe_dsp_tr').GetName], ruler of [SCOPE.sCountry('oe_dsp_tc').GetName], has escaped from the wreck of the Ottoman army and is staying in Constantinople. The Ottoman princes are fighting over the throne, and this ruler wants a standing that weighs more than any title at home. In the [oe_tu_family|e] this ruler ranks as a son and may receive a [Concept('oe_tu_dignity','court dignity')|e].\n\nDignities we cannot confer or cannot afford are not offered."
 oe_dsp.1.desc_other: "#F After the battle of Ankara in July 1402, Stefan Lazarević of Serbia went home by way of Constantinople. In August John VII, ruling the city while Manuel II was away in the West, made Stefan a despot. Three years later Stefan married a sister of John VII's empress.#!\n\n[SCOPE.sCharacter('oe_dsp_tr').GetName], ruler of [SCOPE.sCountry('oe_dsp_tc').GetName], has come to Constantinople while the Ottomans are at war among themselves. The Ottoman princes are fighting over the throne, and this ruler wants a standing that weighs more than any title at home. In the [oe_tu_family|e] this ruler ranks as a son and may receive a [Concept('oe_tu_dignity','court dignity')|e].\n\nDignities we cannot confer or cannot afford are not offered."
 oe_dsp.1.a: "Make them a despot at the Blachernae"
 oe_dsp.1.a.tt: "Prestige #R −20#!, [oe_tu_authority|e] #R −8#! (the price of a dignity)\nA grand ceremony: prestige #G +5#!\n[SCOPE.sCharacter('oe_dsp_tr').GetName] holds the title of #bold #color_yellow despot#!#! for life (a lower dignity is taken back); the country's opinion of us #G +40#! (fading #Y 2#! a year), #G +10#! more while this ruler reigns\nIf the country is a subject of the empire: loyalty to the overlord #G +15#!\nFor #Y 20#! years the country has #bold #color_yellow a bond with Constantinople#!#!: while its ruler is a despot of the empire, it is the first asked for money when the empire is in danger"
 oe_dsp.1.b: "Make them a sebastokrator"
 oe_dsp.1.b.tt: "Prestige #R −15#!, [oe_tu_authority|e] #R −6#! (the price of a dignity)\nA grand ceremony: prestige #G +5#!\n[SCOPE.sCharacter('oe_dsp_tr').GetName] holds the title of #bold #color_yellow sebastokrator#!#! for life (a lower dignity is taken back); the country's opinion of us #G +30#! (fading #Y 2#! a year), #G +10#! more while this ruler reigns\nIf the country is a subject of the empire: loyalty to the overlord #G +12#!\nFor #Y 20#! years the country has #bold #color_yellow a bond with Constantinople#!#!: while its ruler is a despot of the empire, it is the first asked for money when the empire is in danger"
 oe_dsp.1.c: "Feast the guest, but confer nothing"
 oe_dsp.1.c.tt: "Costs #R 1#! month of trade and tax income\nPrestige #G +2#!\nThe country's opinion of us #G +20#! (fading #Y 2#! a year)"
 oe_dsp.2.t: "Envoys from Ioannina"
 oe_dsp.2.desc_son: "#F In 1382 the new archbishop sent from Constantinople conferred the title of despot on Thomas Preljubović of Ioannina in the name of John V. In 1386 an imperial embassy performed the same ceremony for Thomas's successor, the Florentine Esau de' Buondelmonti. In 1415 Manuel II gave the same title to Carlo Tocco.#!\n\n[SCOPE.sCharacter('oe_dsp_tr').GetName], ruler of [SCOPE.sCountry('oe_dsp_tc').GetName], holds Ioannina and has sent envoys asking the emperor for formal recognition. Rank in the [oe_tu_family|e]: [SCOPE.sCountry('oe_dsp_tc').Custom('OeTwRank')].\n\nDignities we cannot confer or cannot afford are not offered."
 oe_dsp.2.desc_other: "#F In 1382 the new archbishop sent from Constantinople conferred the title of despot on Thomas Preljubović of Ioannina in the name of John V. In 1386 an imperial embassy performed the same ceremony for Thomas's successor, the Florentine Esau de' Buondelmonti. In 1415 Manuel II gave the same title to Carlo Tocco.#!\n\n[SCOPE.sCharacter('oe_dsp_tr').GetName], ruler of [SCOPE.sCountry('oe_dsp_tc').GetName], holds Ioannina and has sent envoys asking the emperor for formal recognition. Rank in the [oe_tu_family|e]: [SCOPE.sCountry('oe_dsp_tc').Custom('OeTwRank')]. This ruler is not a son, and by custom cannot be made a despot. An exception would cost more [oe_tu_authority|e]; the envoys offer a gift of #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_dsp_fee_v').GetValue|0]#! gold for it.\n\nDignities we cannot confer or cannot afford are not offered."
 oe_dsp.2.a: "Send an archbishop with a chrysobull: make them a despot"
 oe_dsp.2.a.tt: "Prestige #R −20#!, [oe_tu_authority|e] #R −8#! (the price of a dignity)\n[SCOPE.sCharacter('oe_dsp_tr').GetName] holds the title of #bold #color_yellow despot#!#! for life (a lower dignity is taken back); the country's opinion of us #G +40#! (fading #Y 2#! a year), #G +10#! more while this ruler reigns\nIf the country is a subject of the empire: loyalty to the overlord #G +15#!\nFor #Y 20#! years the country has #bold #color_yellow a bond with Constantinople#!#!: while its ruler is a despot of the empire, it is the first asked for money when the empire is in danger"
 oe_dsp.2.b: "Make an exception and accept the gift"
 oe_dsp.2.b.tt: "Prestige #R −20#!, [oe_tu_authority|e] #R −12#! (the price of a dignity, #Y 4#! more for the exception)\nThe gift: gold #G +[GetCountry('BYZ').MakeScope.GetVariable('oe_dsp_fee_v').GetValue|0]#!\n[SCOPE.sCharacter('oe_dsp_tr').GetName] holds the title of #bold #color_yellow despot#!#! for life (a lower dignity is taken back); the country's opinion of us #G +40#! (fading #Y 2#! a year), #G +10#! more while this ruler reigns\nIf the country is a subject of the empire: loyalty to the overlord #G +15#!\nThe country is marked as #bold #color_yellow an exception#!#!: its next ruler may also ask for the title again\nFor #Y 20#! years the country has #bold #color_yellow a bond with Constantinople#!#!: while its ruler is a despot of the empire, it is the first asked for money when the empire is in danger"
 oe_dsp.2.c: "Make them a protosebastos"
 oe_dsp.2.c.tt: "Prestige #R −10#!, [oe_tu_authority|e] #R −4#! (the price of a dignity)\n[SCOPE.sCharacter('oe_dsp_tr').GetName] holds the title of #bold #color_yellow protosebastos#!#! for life (a lower dignity is taken back); the country's opinion of us #G +25#! (fading #Y 2#! a year), #G +10#! more while this ruler reigns\nIf the country is a subject of the empire: loyalty to the overlord #G +8#!"
 oe_dsp.2.d: "Pay them no heed"
 oe_dsp.3.t: "A Crown for the New Ruler"
 oe_dsp.3.desc_named: "#F Stefan Lazarević died in 1427 and was succeeded by a nephew, Đurađ Branković. In 1429 (1435 by another account) John VIII sent George Philanthropenos to Serbia with the despot's insignia. In 1446 Đurađ's son Lazar married Helena, daughter of Thomas Palaiologos, and was crowned despot as well.#!\n\nThe previous ruler of [SCOPE.sCountry('oe_dsp_tc').GetName], [SCOPE.sCharacter('oe_dsp_pv').GetName], held the title of despot. A [Concept('oe_tu_dignity','court dignity')|e] is held for life and does not pass to a successor. The new ruler, [SCOPE.sCharacter('oe_dsp_tr').GetName], has sent envoys asking the emperor to confer it again.\n\nDignities we cannot confer or cannot afford are not offered."
 oe_dsp.3.desc_other: "#F Stefan Lazarević died in 1427 and was succeeded by a nephew, Đurađ Branković. In 1429 (1435 by another account) John VIII sent George Philanthropenos to Serbia with the despot's insignia. In 1446 Đurađ's son Lazar married Helena, daughter of Thomas Palaiologos, and was crowned despot as well.#!\n\nThe previous ruler of [SCOPE.sCountry('oe_dsp_tc').GetName] held the title of despot. A [Concept('oe_tu_dignity','court dignity')|e] is held for life and does not pass to a successor. The new ruler, [SCOPE.sCharacter('oe_dsp_tr').GetName], has sent envoys asking the emperor to confer it again.\n\nDignities we cannot confer or cannot afford are not offered."
 oe_dsp.3.a: "Send the crown"
 oe_dsp.3.a.tt: "Prestige #R −20#!, [oe_tu_authority|e] #R −8#! (the price of a dignity)\nA renewal costs half: prestige #G +10#! and [oe_tu_authority|e] #G +4#! come back (only the prestige for a country that had the exception)\n[SCOPE.sCharacter('oe_dsp_tr').GetName] holds the title of #bold #color_yellow despot#!#! for life (a lower dignity is taken back); the country's opinion of us #G +40#! (fading #Y 2#! a year), #G +10#! more while this ruler reigns\nIf the country is a subject of the empire: loyalty to the overlord #G +15#!\nFor #Y 20#! years the country has #bold #color_yellow a bond with Constantinople#!#!: while its ruler is a despot of the empire, it is the first asked for money when the empire is in danger"
 oe_dsp.3.b: "First see whether the new ruler can be trusted"
 oe_dsp.3.b.tt: "The country's opinion of us #R −10#! (fading #Y 2#! a year)\nThey may ask again in #Y 2#! years; this can be put off only once"
 oe_dsp.3.c: "Confer it no more"
 oe_dsp.3.c.tt: "The country's opinion of us #R −25#! (fading #Y 1#! a year)\nThe country will not ask for the title again"
 oe_dsp.4.t: "An Inscription on the Sea Walls"
 oe_dsp.4.desc: "#F On a tower of the sea walls of Constantinople, between Yenikapı and Kumkapı, an inscription of 1448 records the name of George (Đurađ) Branković, Despot of Serbia. The stone is now in the Istanbul Archaeological Museums.#!\n\nThe empire is in danger. [SCOPE.sCharacter('oe_dsp_tr').GetName], ruler of [SCOPE.sCountry('oe_dsp_tc').GetName] and a despot of our making, has sent #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_dsp_gift_v').GetValue|0]#! gold for the walls of Constantinople."
 oe_dsp.4.a: "Accept, and carve the name in stone"
 oe_dsp.4.a.tt: "Gold #G +[GetCountry('BYZ').MakeScope.GetVariable('oe_dsp_gift_v').GetValue|0]#!\nConstantinople gains [ShowModifier('oe_dsp_walls_inscription')] for #Y 20#! years"
 oe_dsp.4.b: "Decline politely and owe nothing"
 oe_dsp.4.b.tt: "Prestige #G +3#!\nThe country's opinion of us #G +10#! (fading #Y 1#! a year)"
