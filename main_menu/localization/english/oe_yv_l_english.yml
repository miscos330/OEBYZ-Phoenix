 # NEW 2026-11-18 Yuan track Y4 (oe_yv_ events). Generated by gen_yuan_y4.py; edit the generator, not this file.
 STATIC_MODIFIER_NAME_oe_yv_grand_chancellor: "The Grand Chancellor's Sway"
 STATIC_MODIFIER_DESC_oe_yv_grand_chancellor: "Bayan, now Grand Chancellor, holds the whole government in hand; princes and ministers alike watch the chancellor's mood. It ends when Bayan leaves the court."
 STATIC_MODIFIER_NAME_oe_yv_yellow_river_breach: "Yellow River Breach"
 STATIC_MODIFIER_DESC_oe_yv_yellow_river_breach: "The Yellow River has burst its dikes; the fields of the river counties lie under water and the people have scattered."
 oe_yv_tib_situ: "Granted the Title of Tai Situ"
 oe_yv_tib_rebuked: "Rebuked for Deposing the Sakya"
 oe_yv.1.t: "The Risings of 1337: Guangzhou and Runing"
 oe_yv.1.d: "In the first month of the third Zhiyuan year (1337), Zhu Guangqing of Zengcheng county near Guangzhou rose in revolt; the followers Shi Kunshan and Zhong Daming joined with their men. The rebels proclaimed a 'Great Jin' and a new era named Chifu. The court sent the commander Gouzhali and Shadi, Assistant Grand Councillor of Jiangxi, against them. In the second month Banghu rose at Xinyang in Runing, and the court ordered Qingtong, Assistant Grand Councillor of Henan, to lead troops against the rising; Runing later sent to the capital the Maitreya image, small banners, forged edicts and the purple-gold seal taken from the rebels.\n\nNow neither rising has been put down: Zhu Guangqing gathers men under a dynastic title in the far south, Banghu under the banner of Maitreya in Henan. The court must decide how to deal with them."
 oe_yv.1.a: "Send troops against them"
 oe_yv.1.a.tt: "Branch secretariat loyalty: Jiangxi #R −3#!, Henan Jiangbei #R −3#!."
 oe_yv.1.b: "Leave it to the local officials"
 oe_yv.1.b.tt: "Branch secretariat loyalty: Jiangxi #R −8#!, Henan Jiangbei #R −8#!."
 oe_yv.1.c: "Pardon those who were forced to follow"
 oe_yv.1.c.tt: "Branch secretariat loyalty: Jiangxi #R −2#!, Henan Jiangbei #R −2#!."
 oe_yv.2.t: "No Arms for Han and Southerners"
 oe_yv.2.d: "In the fourth month of the third Zhiyuan year (May 1337) the court decreed that Han, Southerners and Koreans might not bear arms, and that every horse they owned was to be taken into official keeping; the same month Han and Southerners were forbidden to study the Mongol and Semu scripts. The day after the decree, Bayan was given command of the Xuanzhen Guards, with three thousand ingots of paper money and an office of their own. In the eighth month the court eased the ban for Koreans and let them ride again.\n\nNow the decree is drafted and waits to be sent out. It is Bayan's policy.\nNote: the strength of Factional Strife sets the size of the Red Turban Rebellions modifier when that situation begins."
 oe_yv.2.a: "Enforce the decree in full"
 oe_yv.2.b: "Ban the weapons, leave the horses"
 oe_yv.2.c: "Withdraw the decree"
 oe_yv.3.t: "The Risings of 1337: Huizhou and Hezhou"
 oe_yv.3.d: "In the fourth month of the third Zhiyuan year (May 1337), Han Fashi of Dazu county in Hezhou rose and called himself 'Prince of Zhao of the Southern Court'. The same month Nie Xiuqing, Tan Jingshan and others of Guishan county in Huizhou made weapons, worshipped Dai Jia as the Buddha Dingguang and joined Zhu Guangqing's revolt; the court ordered Shadi, Assistant Grand Councillor of Jiangxi, to hunt them down. In the fifth month Juli, Assistant Political Councillor of Sichuan, and others were ordered to take Han Fashi.\n\nNow more men gather followers under Buddhas' and princes' names, in the far south and in Sichuan. If these risings join the earlier ones, the provinces may not hold."
 oe_yv.3.a: "Order Shadi and Juli to hunt them down"
 oe_yv.3.a.tt: "Branch secretariat loyalty: Jiangxi #R −3#!, Sichuan #R −3#!."
 oe_yv.3.b: "Use the risings to search homes for weapons"
 oe_yv.3.b.tt: "Branch secretariat loyalty: Jiangxi #R −6#!, Sichuan #R −6#!."
 oe_yv.3.c: "Punish the leaders, pardon the rest"
 oe_yv.3.c.tt: "Branch secretariat loyalty: Jiangxi #R −2#!, Sichuan #R −2#!."
 oe_yv.4.t: "Naimantai Becomes Guowang"
 oe_yv.4.d: "The descendants of Muqali of the Jalayir held the hereditary title of Guowang, 'Prince of the State'. Dorji succeeded to it in the second Tianli year (1329) and was sent by edict to take up the fief at Liaoyang. In the third year of the later Zhiyuan era (1337) an edict gave the title to Naimantai with a gold seal; Naimantai had headed the Branch Bureau of Military Affairs of Lingbei since 1330. (Dorji's biography puts the change a year later than Naimantai's.)\n\nNow the edict has gone out, and Naimantai holds the gold seal of the Guowang."
 oe_yv.4.a: "Confirm the succession"
 oe_yv.5.t: "Dorji Goes to Liaoyang"
 oe_yv.5.d: "In the third month of the fourth Zhiyuan year (April 1338) the court made the Guowang Dorji Left Grand Councillor of the Liaoyang Branch Secretariat. Dorji had held the Jalayir title of Guowang until it passed to Naimantai the year before.\n\nNow Dorji is on the road to Liaoyang, and the affairs of the northeast pass into the hands of the old Guowang."
 oe_yv.5.a: "Bid Dorji govern with care"
 oe_yv.5.a.tt: "Dorji becomes governor of the Liaoyang Branch Secretariat and the former governor returns to court (if Dorji is alive and Liaoyang is still a frontier branch secretariat of the Yuan)."
 oe_yv.6.t: "Bayan, Grand Chancellor"
 oe_yv.6.d: "In the tenth month of the fifth Zhiyuan year (November 1339) an edict made Bayan Grand Chancellor, with the honorific of Meritorious Minister of the First Rank and a jewelled tablet of office. The same year Bayan put the Prince of Tan, Chechetu, to death on Bayan's own authority and had the Princes Xuanrang and Weishun degraded.\n\nNow Bayan asks for the title of Grand Chancellor, and the edict waits for the emperor's seal."
 oe_yv.6.a: "Make Bayan Grand Chancellor"
 oe_yv.6.a.tt: "The Grand Chancellor's Sway ends as soon as Bayan leaves power (dismissed, dead or out of the cabinet)."
 oe_yv.6.b: "Refuse the request"
 oe_yv.7.t: "Toqto'a Brings Bayan Down"
 oe_yv.7.d: "In the second month of the sixth Zhiyuan year (March 1340), while Bayan was out hunting, the nephew Toqto'a removed Bayan by the emperor's order; Bayan was sent down to Henan as Left Grand Councillor, then in the third month banished to Yangchun in Nan'enzhou, and died at a post station in Longxing on the way. In the tenth month Toqto'a became Right Grand Councillor; Toqto'a's father Majartai had held the post in between.\n\nNow Bayan still holds the government. The emperor and Toqto'a have laid their plan and wait only for Bayan to leave the capital."
 oe_yv.7.a: "Carry out the plan"
 oe_yv.7.a.tt: "Bayan is put out of the cabinet for good and banished to the south, to die on the road before long."
 oe_yv.7.b: "Expose Toqto'a's plot"
 oe_yv.7.c: "Dismiss Bayan and raise no new strongman"
 oe_yv.7.c.tt: "Bayan is put out of the cabinet for good and banished to the south, to die on the road before long."
 oe_yv.8.t: "New Governors in 1340"
 oe_yv.8.d1: "In the sixth Zhiyuan year (1340) Dorji moved from Liaoyang to Henan as Left Grand Councillor and, the history says, governed there as at Liaoyang; Naimantai became Left Grand Councillor of Lingbei, keeping the title of Guowang and the Branch Bureau of Military Affairs.\n\nNow Bayan has fallen, Toqto'a leads the government, and the governors are changing."
 oe_yv.8.d: "In the sixth Zhiyuan year (1340) Dorji moved from Liaoyang to Henan as Left Grand Councillor and, the history says, governed there as at Liaoyang; Naimantai became Left Grand Councillor of Lingbei, keeping the title of Guowang and the Branch Bureau of Military Affairs.\n\nNow the court has new governors for two branch secretariats."
 oe_yv.8.a: "So approved"
 oe_yv.8.a.tt: "Dorji becomes governor of Henan Jiangbei and the former governor returns to court; if Dorji still governs Liaoyang, Liaoyang gets a new governor.\nNaimantai becomes governor of Lingbei and the former governor returns to court.\n(Each only if the person is alive and the branch secretariat is still the Yuan's.)\nBranch secretariat loyalty: Henan Jiangbei #G +5#!."
 oe_yv.9.t: "The Yellow River Breaks the Baimao Dike"
 oe_yv.9.d: "In the fifth month of the fourth Zhizheng year (summer 1344) it rained for more than twenty days; the Yellow River rose until the water stood two zhang deep on the plain and broke north through the Baimao dike. Along the river Jining, Shanzhou, Yucheng, Dangshan, Jinxiang, Yutai, Feng, Pei, Dingtao, Chuqiu, Wucheng, and on to Caozhou, Dongming, Juye, Yuncheng, Jiaxiang, Wenshang and Rencheng were all flooded.\n\nNow the river country of Henan Jiangbei and the Central Secretariat lies under water, and its people wander homeless. The court must decide on relief."
 oe_yv.9.a: "Open the granaries"
 oe_yv.9.a.tt: "Our lands along the river (#Y 8#! provinces around the places the history names) get Yellow River Breach (#Y 5#! years): local food output #R −15%#!, local population growth #R −0.3%#!, pop rebel threshold #R −3%#!.\nBranch secretariat loyalty: Henan Jiangbei #R −3#!."
 oe_yv.9.b: "Let the local officials see to relief"
 oe_yv.9.b.tt: "Our lands along the river (#Y 8#! provinces around the places the history names) get Yellow River Breach (#Y 8#! years): local food output #R −15%#!, local population growth #R −0.3%#!, pop rebel threshold #R −3%#!.\nBranch secretariat loyalty: Henan Jiangbei #R −8#!."
 oe_yv.10.t: "Jia Lu and the Yellow River"
 oe_yv.10.d1: "In the fourth month of the eleventh Zhizheng year (May 1351) the court made Jia Lu, Minister of Works, Commissioner-General of River Control, and raised 150,000 labourers from thirteen circuits including Bianliang and Daming and 20,000 garrison soldiers from Luzhou and elsewhere. Work began on the twenty-second day of the fourth month; the new channel was cut in the seventh month, the river turned back into its old bed in the eighth, boats passed in the ninth, and every dike was finished in the eleventh.\n\nNow the order for the river works has gone out and the labourers are gathering on the river. The court must decide how to use them.\nNote: after 1350 the Red Turban Rebellions can begin whenever our stability is below 95, legitimacy below 50, or enough estates (commoners count twice) are below 75% satisfaction; when it begins, the strength of Factional Strife sets the size of the Red Turban Rebellions modifier."
 oe_yv.10.d: "In the fourth month of the eleventh Zhizheng year (May 1351) the court made Jia Lu, Minister of Works, Commissioner-General of River Control, and raised 150,000 labourers from thirteen circuits including Bianliang and Daming and 20,000 garrison soldiers from Luzhou and elsewhere. Work began on the twenty-second day of the fourth month; the new channel was cut in the seventh month, the river turned back into its old bed in the eighth, boats passed in the ninth, and every dike was finished in the eleventh.\n\nNow the river has run outside its bed for years. The court must decide whether to undertake the great works.\nNote: after 1350 the Red Turban Rebellions can begin whenever our stability is below 95, legitimacy below 50, or enough estates (commoners count twice) are below 75% satisfaction; when it begins, the strength of Factional Strife sets the size of the Red Turban Rebellions modifier."
 oe_yv.10.a: "Dredge and dam at once, on a strict schedule"
 oe_yv.10.a.tt: "Branch secretariat loyalty: Henan Jiangbei #R −5#!.\n(If not begun yet) The river works begin at once (vanilla Yellow River Works and its follow-up events)."
 oe_yv.10.b: "Pay the labourers and allow more time"
 oe_yv.10.b.tt: "Branch secretariat loyalty: Henan Jiangbei #R −2#!.\n(If not begun yet) The river works begin at once (vanilla Yellow River Works and its follow-up events)."
 oe_yv.10.c: "Leave the old bed; only mend the northern dikes"
 oe_yv.10.c.tt: "River provinces that still have Yellow River Breach keep it for #Y 6#! more years from now.\nBranch secretariat loyalty: Henan Jiangbei #R −5#!."
 oe_yv_name_changchub_gyaltsen: "Changchub Gyaltsen"
 oe_yv.11.t: "The Phagmodrupa Take Central Tibet"
 oe_yv.11.d: "Changchub Gyaltsen, born in 1302 and a monk from the age of nine, became myriarch of Phagmodru in 1322 with the seat at Nedong. Sakya officials twice held Changchub Gyaltsen captive, in 1336 and in 1346. By 1349 most of U, Lhasa included, belonged to the Phagmodrupa; in 1354 their troops marched on Sakya, and most of Tsang came under Changchub Gyaltsen as well.\n\nNow the Phagmodru troops stand before Sakya. Whether the Sakya throne can be held will be decided now."
 oe_yv.11.a: "The Phagmodrupa take power"
 oe_yv.11.b: "The Sakya hold the throne"
 oe_yv.11.b.tt: "Changchub Gyaltsen stays in the country as head of the Phagmodrupa."
 oe_yv.12.t: "The Bureau Weighs the Phagmodrupa"
 oe_yv.12.d: "From 1354 Changchub Gyaltsen of the Phagmodrupa replaced the Sakya as master of most of Central Tibet. In 1357 Changchub Gyaltsen accepted the title of Tai Situ from the Yuan emperor.\n\nNow Tibet has a new master. The Bureau of Buddhist and Tibetan Affairs asks: recognise the Phagmodrupa, or rebuke them for deposing the Sakya?"
 oe_yv.12.a: "Grant Changchub Gyaltsen the title of Tai Situ"
 oe_yv.12.b: "Rebuke them for deposing the Sakya"
