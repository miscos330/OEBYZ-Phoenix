l_english:
 opinion_oe_parl_theme_charter: "Enacted Theme Service Charter"
 opinion_oe_parl_yam_postal: "Expanded Yam Postal Network"
 STATIC_MODIFIER_NAME_oe_parl_mod_novellae_tax: "Novellae Imperial Tax Code"
 STATIC_MODIFIER_DESC_oe_parl_mod_novellae_tax: "The Senate-approved imperial tax code raises crown tax efficiency and central authority across the provinces."
 oe_parl_byz_novellae_tax_code: "Novellae Imperial Tax Code"
 oe_parl_byz_novellae_tax_code_desc: "Codify provincial land and trade taxes after Justinian's Novellae, drawing concealed aristocratic estates back onto the imperial registers to bolster the fisc at the price of noble resentment."
 STATIC_MODIFIER_NAME_oe_parl_mod_theme_charter: "Theme Military Service Charter"
 STATIC_MODIFIER_DESC_oe_parl_mod_theme_charter: "Guaranteed stratiotai tenures bolster imperial manpower reserves and levy effectiveness."
 oe_parl_byz_theme_service_charter: "Theme Military Service Charter"
 oe_parl_byz_theme_service_charter_desc: "Clarify hereditary stratiotai land tenures and frontier muster obligations, securing stipends for provincial soldiery while strengthening manpower, levy combat effectiveness, and theme loyalty."
 STATIC_MODIFIER_NAME_oe_parl_mod_pronoia_audit: "Pronoia Cadastre Audit"
 STATIC_MODIFIER_DESC_oe_parl_mod_pronoia_audit: "Senate-backed land audits curb aristocratic tax evasion and steadily raise provincial control."
 oe_parl_byz_pronoia_audit_act: "Pronoia Cadastre & Audit Act"
 oe_parl_byz_pronoia_audit_act_desc: "Dispatch imperial cadastre inspectors to audit aristocratic pronoia grants, reclaiming concealed revenues for the treasury and restoring provincial control at the cost of sharp noble displeasure."
 STATIC_MODIFIER_NAME_oe_parl_mod_golden_bull: "Chrysobull Shipping Charter"
 STATIC_MODIFIER_DESC_oe_parl_mod_golden_bull: "Imperial shipping privileges invigorate domestic merchant fleets, maritime presence, and export efficiency."
 oe_parl_byz_golden_bull_shipping: "Constantinople Chrysobull Shipping Charter"
 oe_parl_byz_golden_bull_shipping_desc: "Issue an imperial chrysobull empowering domestic merchant fleets and Golden Horn shipping guilds, expanding maritime presence and export returns while elevating the burgher estate."
 STATIC_MODIFIER_NAME_oe_parl_mod_antoniniana_ii: "Second Constitutio Antoniniana"
 STATIC_MODIFIER_DESC_oe_parl_mod_antoniniana_ii: "Extended Roman citizenship widens cultural capacity and accelerates integration across imperial provinces."
 oe_parl_byz_constitutio_antoniniana_ii: "Second Constitutio Antoniniana"
 oe_parl_byz_constitutio_antoniniana_ii_desc: "Renew the universal Roman citizenship grant across loyal provinces and exarchates, expanding accepted-culture capacity, accelerating assimilation, and calming subject liberty desire."
 STATIC_MODIFIER_NAME_oe_parl_mod_ecumenical_synod: "Ecumenical Synod Protection"
 STATIC_MODIFIER_DESC_oe_parl_mod_ecumenical_synod: "Imperial patronage of the Synod enhances religious icon potency and provincial conversion speed."
 oe_parl_byz_ecumenical_synod_act: "Ecumenical Synod Protection Act"
 oe_parl_byz_ecumenical_synod_act_desc: "Affirm imperial backing for the Ecumenical Synod and sacred liturgical traditions, strengthening religious icon power, missionary conversion speed, and clergy satisfaction."
 STATIC_MODIFIER_NAME_oe_parl_mod_greek_fire_arsenal: "Imperial Arsenal & Dockyard Program"
 STATIC_MODIFIER_DESC_oe_parl_mod_greek_fire_arsenal: "Expanded imperial dockyards and arsenals cut naval upkeep and bolster military discipline."
 oe_parl_byz_greek_fire_arsenal_bill: "Imperial Arsenal & Greek-Fire Dockyard Bill"
 oe_parl_byz_greek_fire_arsenal_bill_desc: "Appropriate half a year's revenue to expand the imperial dockyards and incendiary arsenals, reducing fleet upkeep and sharpening troop discipline for a decade."
 STATIC_MODIFIER_NAME_oe_parl_mod_pandidakterion: "Pandidakterion Endowment"
 STATIC_MODIFIER_DESC_oe_parl_mod_pandidakterion: "Imperial university funding accelerates scholarship, research speed, and institution spread."
 oe_parl_byz_pandidakterion_grant: "Pandidakterion & Manuscript Preservation Grant"
 oe_parl_byz_pandidakterion_grant_desc: "Endow the Imperial University of Constantinople to gather scholars and preserve classical manuscripts, raising Constantinople's development while accelerating research and institution growth."
 STATIC_MODIFIER_NAME_oe_parl_mod_grain_annona: "Imperial Annona Grain Supply"
 STATIC_MODIFIER_DESC_oe_parl_mod_grain_annona: "State-regulated grain convoys boost national food supply and lower stability upkeep."
 oe_parl_byz_grain_annona_bill: "Egypt & Black Sea Annona Grain Act"
 oe_parl_byz_grain_annona_bill_desc: "Revive the imperial annona grain convoy system linking Egypt and the Black Sea to stabilize urban food supplies, easing famine risk while lifting stability and peasant satisfaction."
 STATIC_MODIFIER_NAME_oe_parl_mod_senate_compact: "Senate-Prefecture Fiscal Compact"
 STATIC_MODIFIER_DESC_oe_parl_mod_senate_compact: "Streamlined fiscal compacts with the Praetorian Prefectures raise subject income, cabinet efficiency, and diplomatic capacity."
 oe_parl_byz_senate_prefecture_compact: "Senate & Praetorian Prefecture Fiscal Compact"
 oe_parl_byz_senate_prefecture_compact_desc: "Harmonize fiscal shares and administrative duties between the Senate and the Praetorian Prefectures, raising subject revenue and diplomatic capacity while easing Imperial Entropy."
 STATIC_MODIFIER_NAME_oe_parl_mod_yuan_shibo: "Maritime Shibo Trade Edict"
 STATIC_MODIFIER_DESC_oe_parl_mod_yuan_shibo: "Active Shibo customs offices expand maritime presence and overseas export earnings."
 oe_parl_yuan_shibo_maritime_act: "Maritime Shibo Trade Edict"
 oe_parl_yuan_shibo_maritime_act_desc: "Authorize the Zhongshusheng to expand the coastal Shibo maritime customs offices, protecting merchant fleets from Zaytun and Hangzhou to surge export efficiency, maritime presence, and port prosperity."
 STATIC_MODIFIER_NAME_oe_parl_mod_yuan_silver_chao: "Jiaochao Silver Reserve Standard"
 STATIC_MODIFIER_DESC_oe_parl_mod_yuan_silver_chao: "Bullion-backed Jiaochao reserves curb inflation, lower borrowing costs, and raise tax efficiency."
 oe_parl_yuan_silver_chao_act: "Silver Reserve & Jiaochao Stabilization Act"
 oe_parl_yuan_silver_chao_act_desc: "Establish provincial bullion reserve boards backing paper Jiaochao with silver and copper reserves, curbing inflation, lowering interest rates, and restoring fiscal confidence."
 STATIC_MODIFIER_NAME_oe_parl_mod_yuan_keju: "Multi-Ethnic Examination Meritocracy"
 STATIC_MODIFIER_DESC_oe_parl_mod_yuan_keju: "Broadened civil examinations expand accepted-culture capacity and accelerate scholarly research."
 oe_parl_yuan_keju_merit_bill: "Imperial Examinations & Multi-Ethnic Merit Act"
 oe_parl_yuan_keju_merit_bill_desc: "Expand the imperial civil examinations across Mongol, Semu, and Han scholars alike, widening cultural capacity and boosting research speed despite mild aristocratic resistance."
 STATIC_MODIFIER_NAME_oe_parl_mod_yuan_grand_canal: "Grand Canal & Grain Transport Works"
 STATIC_MODIFIER_DESC_oe_parl_mod_yuan_grand_canal: "Dredged canals and revitalized grain fleets accelerate national construction and reinforce provincial control."
 oe_parl_yuan_grand_canal_corvee: "Grand Canal Dredging & Grain Transport Bill"
 oe_parl_yuan_grand_canal_corvee_desc: "Fund comprehensive dredging of the Grand Canal locks and coastal grain fleets, demanding treasury outlay and labor in exchange for a decade of faster construction and stronger central control."
 STATIC_MODIFIER_NAME_oe_parl_mod_yuan_touxia: "Touxia Appanage Audit"
 STATIC_MODIFIER_DESC_oe_parl_mod_yuan_touxia: "Verified appanage rolls curb private tax leakage and boost both crown taxes and subject income."
 oe_parl_yuan_touxia_audit_bill: "Appanage Touxia Census Audit Bill"
 oe_parl_yuan_touxia_audit_bill_desc: "Audit princely appanage households across the circuits and curb unauthorized private levies, accepting aristocratic dissatisfaction to lift both direct tax efficiency and subject tribute."
 STATIC_MODIFIER_NAME_oe_parl_mod_yuan_xiyu_yam: "Expanded Yam Relay Network"
 STATIC_MODIFIER_DESC_oe_parl_mod_yuan_xiyu_yam: "Expanded Yam postal relays increase diplomatic capacity and speed institution spread across the realm."
 oe_parl_yuan_xiyu_yam_postal_act: "Western Regions Yam Postal Expansion Act"
 oe_parl_yuan_xiyu_yam_postal_act_desc: "Expand the Yam relay stations along the Silk Road and northern steppes, strengthening diplomatic reach, speeding institution spread, and bolstering subject loyalty."
 STATIC_MODIFIER_NAME_oe_parl_mod_yuan_shenjiying: "Shenjiying Foundry Program"
 STATIC_MODIFIER_DESC_oe_parl_mod_yuan_shenjiying: "Standardized Shenjiying ordnance and drills markedly strengthen army discipline and morale."
 oe_parl_yuan_shenjiying_foundry_bill: "Shenjiying Firearms Foundry Appropriation"
 oe_parl_yuan_shenjiying_foundry_bill_desc: "Fund the imperial Shenjiying firearms foundries to standardize arquebuses, ordnance, and powder mills, trading a substantial treasury outlay for superior discipline and army morale."
 STATIC_MODIFIER_NAME_oe_parl_mod_rus_table_ranks: "Table of Ranks"
 STATIC_MODIFIER_DESC_oe_parl_mod_rus_table_ranks: "Merit-based civil and military grades strengthen crown authority, research speed, and army discipline."
 oe_parl_rus_table_of_ranks_act: "Table of Ranks Reform Act"
 oe_parl_rus_table_of_ranks_act_desc: "Replace hereditary boyar precedence with a merit-based fourteen-grade Table of Ranks, enduring entrenched aristocratic anger to propel crown power, research speed, and military discipline forward."
 STATIC_MODIFIER_NAME_oe_parl_mod_rus_sudebnik: "Sudebnik Legal Code"
 STATIC_MODIFIER_DESC_oe_parl_mod_rus_sudebnik: "Uniform imperial jurisprudence boosts tax efficiency and steadily lifts provincial control."
 oe_parl_rus_sudebnik_code: "All-Russian Sudebnik Legal Code"
 oe_parl_rus_sudebnik_code_desc: "Unify fragmented princely statutes under a single Sudebnik legal code, strengthening central judicial oversight, provincial control, and fiscal collection across Russia."
 STATIC_MODIFIER_NAME_oe_parl_mod_rus_cossack_charter: "Cossack Frontier Charter"
 STATIC_MODIFIER_DESC_oe_parl_mod_rus_cossack_charter: "Chartered Cossack frontier hosts expand national manpower and fortify border garrisons."
 oe_parl_rus_cossack_frontier_charter: "Cossack Host Frontier Charter"
 oe_parl_rus_cossack_frontier_charter_desc: "Grant formal frontier settlement charters to the Cossack Host in return for permanent border garrison service, expanding manpower, garrison strength, and peasant goodwill."
 STATIC_MODIFIER_NAME_oe_parl_mod_rus_baltic_admiralty: "Baltic & White Sea Admiralty"
 STATIC_MODIFIER_DESC_oe_parl_mod_rus_baltic_admiralty: "Centralized northern admiralty logistics cut naval maintenance costs and expand maritime exports."
 oe_parl_rus_baltic_admiralty_act: "Baltic & White Sea Admiralty Act"
 oe_parl_rus_baltic_admiralty_act_desc: "Establish a permanent Admiralty overseeing northern shipyards and convoy routes across the Baltic and White Seas, lowering naval upkeep while boosting maritime export efficiency."
 STATIC_MODIFIER_NAME_oe_parl_mod_rus_third_rome_synod: "All-Russian Patriarchate Endowment"
 STATIC_MODIFIER_DESC_oe_parl_mod_rus_third_rome_synod: "Patriarchal patronage bolsters royal legitimacy and accelerates provincial religious conversion."
 oe_parl_rus_third_rome_synod_act: "All-Russian Patriarchate & Cathedral Act"
 oe_parl_rus_third_rome_synod_act_desc: "Endow the All-Russian Patriarchate and provincial cathedrals, elevating royal legitimacy, speeding frontier religious conversion, and strengthening clergy support."
 STATIC_MODIFIER_NAME_oe_parl_mod_gen_toleration: "Act of Universal Toleration"
 STATIC_MODIFIER_DESC_oe_parl_mod_gen_toleration: "Statutory religious toleration eases sectarian tension and lifts baseline estate satisfaction."
 oe_parl_gen_religious_toleration_act: "Act of Universal Religious Toleration"
 oe_parl_gen_religious_toleration_act_desc: "Enact statutory protections for minority faiths across a diverse empire, enduring fierce clergy backlash to gain lasting tolerance and broader estate harmony."
 STATIC_MODIFIER_NAME_oe_parl_mod_gen_overseas_cit: "Overseas Domains Citizenship"
 STATIC_MODIFIER_DESC_oe_parl_mod_gen_overseas_cit: "Shared imperial standing strengthens subject loyalty, expands cultural capacity, and boosts exports."
 oe_parl_gen_overseas_citizenship_act: "Overseas Domains Citizenship Act"
 oe_parl_gen_overseas_citizenship_act_desc: "Extend imperial legal standing and trade access to elites in overseas domains and subjects, lifting subject loyalty, accepted-culture capacity, and export efficiency."
 STATIC_MODIFIER_NAME_oe_parl_mod_gen_central_bank: "Imperial Public Credit Charter"
 STATIC_MODIFIER_DESC_oe_parl_mod_gen_central_bank: "Institutional public credit lowers interest rates, curbs inflation, and improves tax efficiency."
 oe_parl_gen_imperial_central_bank_act: "Imperial Public Credit & Mint Integrity Act"
 oe_parl_gen_imperial_central_bank_act_desc: "Charter a parliament-backed public credit board and mint inspectorate, cutting loan interest, curbing inflation, and raising tax efficiency."
 STATIC_MODIFIER_NAME_oe_parl_mod_gen_artillery: "Standing Artillery & Fortifications"
 STATIC_MODIFIER_DESC_oe_parl_mod_gen_artillery: "Standardized ordnance and fortifications raise fort defense, cut upkeep, and build army tradition."
 oe_parl_gen_standing_artillery_act: "Standing Artillery & Fortification Ordinance"
 oe_parl_gen_standing_artillery_act_desc: "Fund standardized bastion fortresses and standing artillery parks, strengthening fort defense, cutting fortification upkeep, and cultivating steady army tradition."
 STATIC_MODIFIER_NAME_oe_parl_mod_gen_royal_academy: "Royal Academy & Press Charter"
 STATIC_MODIFIER_DESC_oe_parl_mod_gen_royal_academy: "Royal academic patronage boosts literacy, institution adoption, and research speed."
 oe_parl_gen_royal_academy_charter: "Royal Academy & Printing Charter"
 oe_parl_gen_royal_academy_charter_desc: "Charter a Royal Academy and licensed scholarly presses to circulate scientific treatises across the realm, accelerating literacy, institution growth, and research speed."
 STATIC_MODIFIER_NAME_oe_parl_mod_gen_post_roads: "Imperial Post Roads Program"
 STATIC_MODIFIER_DESC_oe_parl_mod_gen_post_roads: "Upgraded imperial trunk roads and waystations speed construction and strengthen provincial control."
 oe_parl_gen_imperial_post_roads_act: "Imperial Post Roads & Waystations Bill"
 oe_parl_gen_imperial_post_roads_act_desc: "Approve dedicated treasury funding for imperial trunk roads, bridges, and relay waystations, markedly accelerating construction speed and provincial control across large realms."
 STATIC_MODIFIER_NAME_oe_parl_pa_mod_frontier_estates: "Frontier Noble Tax Exemption"
 STATIC_MODIFIER_DESC_oe_parl_pa_mod_frontier_estates: "Temporary tax exemptions granted to frontier noble estates in exchange for parliamentary support."
 oe_parl_pa_nobles_frontier_estates: "Exempt Frontier Noble Estates"
 oe_parl_pa_nobles_frontier_estates_simple: "Frontier Estate Tax Exemption"
 oe_parl_pa_nobles_frontier_estates_desc: "The nobility demands five-year tax exemptions for their frontier estates in return for decisive backing in parliament, lowering crown tax efficiency for strong legislative support."
 STATIC_MODIFIER_NAME_oe_parl_pa_mod_honorary_comm: "Hereditary Noble Commissions"
 STATIC_MODIFIER_DESC_oe_parl_pa_mod_honorary_comm: "Preserved honorary commissions placate the nobility at a modest cost to army tradition."
 oe_parl_pa_nobles_honorary_commissions: "Preserve Hereditary Noble Commissions"
 oe_parl_pa_nobles_honorary_commissions_simple: "Hereditary Officer Commissions"
 oe_parl_pa_nobles_honorary_commissions_desc: "Aristocratic houses ask to retain hereditary honorary officer commissions, slightly slowing army tradition growth for five years in return for noble votes."
 STATIC_MODIFIER_NAME_oe_parl_pa_mod_monastery_endow: "Monastery & Sanctuary Endowment"
 STATIC_MODIFIER_DESC_oe_parl_pa_mod_monastery_endow: "Treasury endowments for religious houses boost clergy satisfaction and religious influence."
 oe_parl_pa_clergy_monastery_endowment: "Endow Monasteries & Sanctuaries"
 oe_parl_pa_clergy_monastery_endowment_simple: "Monastery Repair Endowment"
 oe_parl_pa_clergy_monastery_endowment_desc: "The clergy petitions for a treasury grant equal to roughly a quarter-year's income to restore monasteries and sanctuaries in exchange for vigorous parliamentary backing."
 STATIC_MODIFIER_NAME_oe_parl_pa_mod_censorship: "Print Censorship Edict"
 STATIC_MODIFIER_DESC_oe_parl_pa_mod_censorship: "Clerical oversight of printed tracts slightly slows institution growth while raising religious influence."
 oe_parl_pa_clergy_censorship_edict: "Enact Heterodox Print Censorship"
 oe_parl_pa_clergy_censorship_edict_simple: "Heterodox Print Censorship"
 oe_parl_pa_clergy_censorship_edict_desc: "The clergy asks for five years of oversight over heterodox pamphlets and books, modestly slowing institution spread while raising religious influence and securing clerical votes."
 STATIC_MODIFIER_NAME_oe_parl_pa_mod_customs_rebate: "Port Customs Rebate"
 STATIC_MODIFIER_DESC_oe_parl_pa_mod_customs_rebate: "Customs rebates for merchant guilds modestly reduce tax efficiency while lifting export efficiency."
 oe_parl_pa_burghers_customs_rebate: "Grant Port Customs Rebates"
 oe_parl_pa_burghers_customs_rebate_simple: "Port Customs Rebate"
 oe_parl_pa_burghers_customs_rebate_desc: "Merchant guilds seek a five-year customs rebate at major ports in return for strong parliamentary support, trimming crown tax efficiency while modestly boosting export efficiency."
 STATIC_MODIFIER_NAME_oe_parl_pa_mod_guild_monopoly: "Guild Monopoly Patents"
 STATIC_MODIFIER_DESC_oe_parl_pa_mod_guild_monopoly: "Guild monopoly privileges satisfy the burghers at the price of mild inflationary pressure."
 oe_parl_pa_burghers_guild_monopoly: "Confirm Guild Monopoly Patents"
 oe_parl_pa_burghers_guild_monopoly_simple: "Guild Monopoly Protection"
 oe_parl_pa_burghers_guild_monopoly_desc: "Urban guilds request five-year monopoly patents on select wares, introducing mild inflationary pressure in exchange for reliable burgher support in parliament."
 STATIC_MODIFIER_NAME_oe_parl_pa_mod_corvee_relief: "Corvee Labor Relief"
 STATIC_MODIFIER_DESC_oe_parl_pa_mod_corvee_relief: "Reduced corvee obligations ease unrest and improve stability upkeep at the cost of slower construction."
 oe_parl_pa_peasants_corvee_relief: "Grant Corvee Labor Relief"
 oe_parl_pa_peasants_corvee_relief_simple: "Corvee Labor Relief"
 oe_parl_pa_peasants_corvee_relief_desc: "Peasant representatives ask to ease public corvee obligations for five years, slowing construction speed by 10% while boosting stability and winning strong parliamentary support."
 STATIC_MODIFIER_NAME_oe_parl_pa_mod_grain_subsidy: "Public Grain Subsidy"
 STATIC_MODIFIER_DESC_oe_parl_pa_mod_grain_subsidy: "Subsidized public grain improves national food supply and peasant satisfaction."
 oe_parl_pa_peasants_grain_subsidy: "Open Granaries & Subsidize Grain"
 oe_parl_pa_peasants_grain_subsidy_simple: "Public Grain Subsidy"
 oe_parl_pa_peasants_grain_subsidy_desc: "The peasantry asks for a treasury grain subsidy worth roughly one-fifth of annual income to stabilize rural food prices, trading gold for food supply, peasant satisfaction, and votes."
