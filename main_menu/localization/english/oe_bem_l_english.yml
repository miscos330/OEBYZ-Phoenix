l_english:
 oe_bem_b_tubingen_dialogue: "Tubingen-Constantinople Scholarly Dialogue"
 oe_bem_b_tubingen_rebuke: "Patriarchal Refutation of Protestantism"
 oe_bem_b_pan_orthodox_league: "Pan-Orthodox Synod Solidarity"
 oe_bem_b_catholic_friction: "Orthodox Resistance to Trent"
 oe_bem_b_prot_covert_aid: "Covert Imperial Aid to the Protestant Union"
 oe_bem_b_war_rel_hostile: "Eastern Roman Meddling in the War of Religions"
 oe_bem_b_monarchist_horror: "Monarchist Horror at the Second Roman Republic"
 oe_bem_b_constit_accord: "Constitutional Accord with New Rome"
 STATIC_MODIFIER_NAME_oe_bem_tubingen_correspondence: "Tubingen-Constantinople Correspondence Channel"
 STATIC_MODIFIER_DESC_oe_bem_tubingen_correspondence: "Patriarch Jeremias II refutes Lutheran dogma while keeping scholarly and printing links open to Germany, aiding research while unsettling Orthodox clergy."
 STATIC_MODIFIER_NAME_oe_bem_orthodox_bulwark: "Bulwark of Ancient Orthodoxy"
 STATIC_MODIFIER_DESC_oe_bem_orthodox_bulwark: "Severing ties with Western Protestants rallies Orthodox clergy and true-faith unity at the cost of slower institution spread and western chill."
 STATIC_MODIFIER_NAME_oe_bem_wittenberg_colloquy: "Constantinople-Wittenberg Theological Colloquy"
 STATIC_MODIFIER_DESC_oe_bem_wittenberg_colloquy: "Hosting a bold Graeco-German theological colloquy boosts research, institution spread, and diplomacy while provoking fierce Orthodox clerical unrest."
 STATIC_MODIFIER_NAME_oe_bem_pan_orthodox_mod: "Charter of the Pan-Orthodox Great Synod"
 STATIC_MODIFIER_DESC_oe_bem_pan_orthodox_mod: "Rallying Orthodox patriarchates against Counter-Reformation pressure strengthens conversion and true-faith cohesion while sharpening confessional hostility."
 STATIC_MODIFIER_NAME_oe_bem_polemical_chair: "Imperial Academy Chair of Polemical Theology"
 STATIC_MODIFIER_DESC_oe_bem_polemical_chair: "Endowing an Academy chair in counter-polemical theology lifts literacy and legitimacy while drawing on tax revenues and clerical patience."
 STATIC_MODIFIER_NAME_oe_bem_war_rel_protestant_aid: "Thirty Years' Storm: Covert Protestant Trade Pact"
 STATIC_MODIFIER_DESC_oe_bem_war_rel_protestant_aid: "Covert subsidies to the Protestant Union open German trade and military intelligence at the price of Catholic hostility and clerical grumbling."
 STATIC_MODIFIER_NAME_oe_bem_war_rel_neutral_freight: "Neutral War-Freight & Grain Convoys"
 STATIC_MODIFIER_DESC_oe_bem_war_rel_neutral_freight: "Hauling grain, saltpeter, and supplies to warring confessional blocs swells trade revenues while tarnishing imperial prestige and diplomacy."
 STATIC_MODIFIER_NAME_oe_bem_war_rel_danube_push: "Danube & Adriatic War Mobilization"
 STATIC_MODIFIER_DESC_oe_bem_war_rel_danube_push: "Mobilizing along the Danube and Adriatic while Europe burns lifts morale and siegecraft at heavier upkeep and noble resentment."
 STATIC_MODIFIER_NAME_oe_bem_confessional_fortress: "Post-Westphalian Orthodox Confessional State"
 STATIC_MODIFIER_DESC_oe_bem_confessional_fortress: "Anchoring the realm as an Orthodox confessional fortress cements stability and clerical loyalty while slowing outside intellectual currents."
 STATIC_MODIFIER_NAME_oe_bem_imperial_toleration_edict: "Post-Westphalian Imperial Charter of Toleration"
 STATIC_MODIFIER_DESC_oe_bem_imperial_toleration_edict: "Issuing an imperial toleration charter draws skilled confessional exiles and accelerates commerce and institutions at the cost of clerical discontent."
 STATIC_MODIFIER_NAME_oe_bem_line_theme_standing: "Imperial Line-Theme Standing Army"
 STATIC_MODIFIER_DESC_oe_bem_line_theme_standing: "Abolishing hereditary pronoia for drilled musket line regiments transforms imperial discipline and morale while straining upkeep and inflaming magnate wrath."
 STATIC_MODIFIER_NAME_oe_bem_gradual_theme_battalions: "Gradual Line-Theme Infantry Battalions"
 STATIC_MODIFIER_DESC_oe_bem_gradual_theme_battalions: "Phasing in musket battalions while preserving noble officer privileges improves manpower and drill at the price of tax exemptions and upkeep."
 STATIC_MODIFIER_NAME_oe_bem_magnate_purge_aftermath: "Aftermath of the Magnate Purge"
 STATIC_MODIFIER_DESC_oe_bem_magnate_purge_aftermath: "Crushing magnate defiance in Thrace and Anatolia restores crown control at the short-term price of battered prosperity and disrupted tax rolls."
 STATIC_MODIFIER_NAME_oe_bem_crown_demesne_secured: "Crown Demesne & Standing Cadre Secured"
 STATIC_MODIFIER_DESC_oe_bem_crown_demesne_secured: "Confiscating rebellious magnate estates cements crown control and taxation across the provinces, though surviving aristocrats remain sullen."
 STATIC_MODIFIER_NAME_oe_bem_compromised_army_mod: "Compromised Mixed-Privilege Army"
 STATIC_MODIFIER_DESC_oe_bem_compromised_army_mod: "Conceding tax exemptions to rebellious magnates leaves the line-army reform half-built: muted discipline alongside persistent fiscal leakage."
 STATIC_MODIFIER_NAME_oe_bem_golden_horn_manuf: "Golden Horn Imperial Manufactories"
 STATIC_MODIFIER_DESC_oe_bem_golden_horn_manuf: "State silk, foundry, and shipyard manufactories on the Golden Horn raise production, taxation, and development at the cost of peasant strain and inflation."
 STATIC_MODIFIER_NAME_oe_bem_imperial_academy_sci: "Imperial Academy of Sciences of Constantinople"
 STATIC_MODIFIER_DESC_oe_bem_imperial_academy_sci: "Reorganizing Constantinople's university into an Imperial Academy of Sciences surges research and literacy while taxing coffers and clerical goodwill."
 STATIC_MODIFIER_NAME_oe_bem_basilicae_absolutist: "Novae Basilicae: Absolutist Recension"
 STATIC_MODIFIER_DESC_oe_bem_basilicae_absolutist: "Unifying Roman law under the crown elevates cabinet efficiency, control, and legitimacy while chafing burghers and raising stability costs."
 STATIC_MODIFIER_NAME_oe_bem_basilicae_estates: "Novae Basilicae: Senatorial Estates Charter"
 STATIC_MODIFIER_DESC_oe_bem_basilicae_estates: "Codifying balanced prerogatives for crown, Senate, and prefectural assemblies raises estate satisfaction and diplomacy while trimming direct tax control."
 STATIC_MODIFIER_NAME_oe_bem_diafotismos_patronage: "Purple Enlightenment: Diafotismos Patronage"
 STATIC_MODIFIER_DESC_oe_bem_diafotismos_patronage: "Patronizing enlightened presses and legal salons across Constantinople, Thessaloniki, and Athens accelerates research and institutions while straining clerical order."
 STATIC_MODIFIER_NAME_oe_bem_imperial_censorship: "Imperial Press Censorship Bureau"
 STATIC_MODIFIER_DESC_oe_bem_imperial_censorship: "Suppressing radical presses stabilizes crown control and clerical backing at the long-term price of lagging research and alienated burghers."
 STATIC_MODIFIER_NAME_oe_bem_revolutionary_ferment: "Revolutionary Ferment at the Theodosian Walls"
 STATIC_MODIFIER_DESC_oe_bem_revolutionary_ferment: "Calls for citizenship, constitution, and popular sovereignty sweep imperial ports, quickening new ideas while rocking stability and noble loyalty."
 STATIC_MODIFIER_NAME_oe_bem_second_roman_republic: "Second Roman Republic: Res Publica Restituta"
 STATIC_MODIFIER_DESC_oe_bem_second_roman_republic: "The Senate and Roman People reclaim sovereignty! Citizen morale, manpower, research, and burghers surge while nobles, clergy, and monarchist Europe recoil."
 STATIC_MODIFIER_NAME_oe_bem_republic_conservative_charter: "Moderate Senatorial Roman Republic"
 STATIC_MODIFIER_DESC_oe_bem_republic_conservative_charter: "A moderate republic steered by the Senate and propertied citizens tempers revolutionary shocks while still straining taxes, nobles, and clergy."
 STATIC_MODIFIER_NAME_oe_bem_constitutional_basileia: "Constitutional Basileia: Bicameral Charter"
 STATIC_MODIFIER_DESC_oe_bem_constitutional_basileia: "The Basileus reigns under written law alongside Senate and Assembly: cabinet, trade, estates, and institutions flourish while personal crown control is curtailed."
 STATIC_MODIFIER_NAME_oe_bem_constitutional_constrained: "Hasty Constitutional Compromise"
 STATIC_MODIFIER_DESC_oe_bem_constitutional_constrained: "A rushed charter enacted without prior constitutional roots averts upheaval but leaves lingering drags on legitimacy, crown control, and stability."
 STATIC_MODIFIER_NAME_oe_bem_autocrat_assimilated: "Sacred Autocracy: Romanized Imperial Unity"
 STATIC_MODIFIER_DESC_oe_bem_autocrat_assimilated: "Backed by deep prior Romanization across the provinces, iron autocracy sustains discipline, control, and legitimacy with muted separatism, though research and burghers suffer."
 STATIC_MODIFIER_NAME_oe_bem_autocrat_unrest: "Sacred Autocracy: Nationalist Backlash"
 STATIC_MODIFIER_DESC_oe_bem_autocrat_unrest: "Refusing constitutional reform without deep Romanization ignites severe provincial separatism, dragging prosperity, research, and burghers even as crown armies hold the line."
 STATIC_MODIFIER_NAME_oe_bem_millennium_steam_empire: "1836 Steam Empire: Industrial Millennium Crown"
 STATIC_MODIFIER_DESC_oe_bem_millennium_steam_empire: "Steam engines, foundries, and early rails roar from the Bosporus to Thessaly, crowning production, trade, and prestige alongside industrial labor strain and inflation."
 STATIC_MODIFIER_NAME_oe_bem_millennium_balanced_crown: "1836 Five-Century Order of New Rome"
 STATIC_MODIFIER_DESC_oe_bem_millennium_balanced_crown: "Standing unbroken from 1337 to 1836, New Rome enters the modern age with steady governance and civic prestige while bearing heavy standing defense costs."
 STATIC_MODIFIER_NAME_oe_bem_dec_drills_mod: "Line-Theme Live-Fire Drills"
 STATIC_MODIFIER_DESC_oe_bem_dec_drills_mod: "Large-scale line-volley and artillery coordination drills sharpen discipline and morale at higher army maintenance."
 STATIC_MODIFIER_NAME_oe_bem_dec_magnate_concession_mod: "Magnate Estate Reconciliation Charter"
 STATIC_MODIFIER_DESC_oe_bem_dec_magnate_concession_mod: "Temporary tax concessions and court honors soothe old pronoia magnates during army modernization at a modest drop in tax efficiency."
 STATIC_MODIFIER_NAME_oe_bem_dec_printing_bureau_mod: "Imperial Gazette & Law-Code Press"
 STATIC_MODIFIER_DESC_oe_bem_dec_printing_bureau_mod: "An official printing bureau in Constantinople spreads statutes, translations, and institutions while irritating traditionalists and adding administrative friction."
 STATIC_MODIFIER_NAME_oe_bem_dec_steam_charter_mod: "Golden Horn Steam-Works Charter"
 STATIC_MODIFIER_DESC_oe_bem_dec_steam_charter_mod: "Chartering coal and steam works along the Golden Horn expands industrial production and tax revenue alongside inflation and labor unrest."
 oe_bem_dec_line_theme_drills.title: "Hold Line-Theme Live-Fire Drills"
 oe_bem_dec_line_theme_drills.desc: "Muster line infantry regiments and field artillery for live-fire volley drills, boosting discipline and morale and restoring the reformed army flag if previously compromised (cost: gold and army upkeep)."
 oe_bem_dec_line_theme_drills.a: "Order the Line-Theme Volley Drills"
 oe_bem_dec_pacify_magnates.title: "Reconcile Old Pronoia Magnates"
 oe_bem_dec_pacify_magnates.desc: "Ease surging magnate backlash during army modernization through targeted stipends and court honors, reducing Aristocrat Wrath by 20 at the cost of gold, prestige, and temporary tax concessions."
 oe_bem_dec_pacify_magnates.a: "Grant Reconciliation Charters to the Magnates"
 oe_bem_dec_imperial_printing_press.title: "Charter the Imperial Gazette & Law-Code Press"
 oe_bem_dec_imperial_printing_press.desc: "Establish a crown-run Gazette and Law-Code Press in Constantinople to publish statutes, translations, and official journals, boosting institution spread and literacy at clerical and administrative cost."
 oe_bem_dec_imperial_printing_press.a: "Charter the Imperial Printing Bureau"
 oe_bem_dec_industrial_charter.title: "Issue the Golden Horn Steam-Works Charter"
 oe_bem_dec_industrial_charter.desc: "Grant a royal charter for coal and steam-powered manufactories along Constantinople's Golden Horn, accelerating industrialization and expanding tax capacity at the price of capital, inflation, and labor friction."
 oe_bem_dec_industrial_charter.a: "Sign the Golden Horn Steam-Works Charter"
 oe_bem.1.t: "Patriarch Jeremias II and the Tubingen Letters"
 oe_bem.1.d: "As the Reformation reshapes Latin Christendom, Lutheran divines at Tubingen send a Greek translation of the Augsburg Confession to the Ecumenical Patriarch in Constantinople, seeking Eastern sanction against Rome. Their letters stir both the Great Church and the imperial palace.\n\nShall New Rome refute Protestant doctrine while preserving German printing and scholarly channels, sever all contact to guard ancient Orthodoxy, or risk a joint colloquy?"
 oe_bem.1.a: "Refute Their Dogma Yet Keep Printing & Scholarly Channels Open"
 oe_bem.1.a.tt: "Gold #R −80#!, slight clergy dissatisfaction; advances #bold #color_yellow Printing Press#!#! and #bold #color_yellow Confessionalism#!#!; gain [ShowModifier('oe_bem_tubingen_correspondence')] for #Y 30 years#!; warms ties with Protestant German courts."
 oe_bem.1.b: "Stand by Ancient Orthodoxy and Sever Protestant Ties"
 oe_bem.1.b.tt: "Religious Influence #G +15#!; gain [ShowModifier('oe_bem_orthodox_bulwark')] for #Y 30 years#! (extra Stability #G +4#! if Hesychast school prevailed); cools Protestant relations."
 oe_bem.1.c: "[IF] Convene a Constantinople-Wittenberg Theological Colloquy"
 oe_bem.1.c.tt: "Requires Humanist legacy or active IF rule: Gold #R −120#!, Stability #R −5#!, sharp synod tension; surges #bold #color_yellow Confessionalism#!#! and #bold #color_yellow Printing Press#!#!; gain [ShowModifier('oe_bem_wittenberg_colloquy')] for #Y 30 years#!."
 oe_bem.2.t: "Counter-Reformation at Trent & the Pan-Orthodox Synod"
 oe_bem.2.d: "Energized by the Council of Trent, Catholic Counter-Reformation orders push into Dalmatia, the Eastern Mediterranean, and Orthodox borderlands, seeking Uniate submissions to Rome. Envoys from Alexandria, Antioch, Jerusalem, and the Rus' churches urge Constantinople to answer.\n\nShall the empire summon a Pan-Orthodox Great Synod to rally the Eastern churches, or endow a Counter-Polemical Chair at the Imperial Academy?"
 oe_bem.2.a: "Summon a Pan-Orthodox Great Synod Across the East"
 oe_bem.2.a.tt: "Gold #R −180#!, Religious Influence #G +20#!; gain [ShowModifier('oe_bem_pan_orthodox_mod')] for #Y 35 years#! (extra Prestige #G +12#! under Twin-Eagle Concord); pleases Rus' while straining Catholic courts."
 oe_bem.2.b: "Endow a Counter-Polemical Chair at the Imperial Academy"
 oe_bem.2.b.tt: "Gold #R −130#! (reduced to #Y 80#! with high Imperial Academy tier), mild clerical friction; advances #bold #color_yellow Confessionalism#!#!; gain [ShowModifier('oe_bem_polemical_chair')] for #Y 35 years#!."
 oe_bem.3.t: "The Purple Empire Amid the War of Religions"
 oe_bem.3.d: "Confessional rivalries across Germany and Central Europe erupt into a continent-wide War of Religions. Catholic and Protestant leagues bleed each other white from the Rhine to the upper Danube as grain, saltpeter, and mercenary prices soar.\n\nShall Eastern Rome covertly subsidize the Protestant Union to weaken Habsburg imperial power, profit from neutral war-freight, or mobilize along the Danube and Adriatic?"
 oe_bem.3.a: "Covertly Subsidize the Protestant Union Against the HRE"
 oe_bem.3.a.tt: "Gold #R −200#!, clergy displeasure; advances #bold #color_yellow Artillery#!#!; gain [ShowModifier('oe_bem_war_rel_protestant_aid')] for #Y 25 years#!; warms Protestant courts while sharply angering Catholic powers."
 oe_bem.3.b: "Hold Armed Neutrality and Profit From War-Freight"
 oe_bem.3.b.tt: "Gold #G +150#!, Prestige #R −10#!; advances #bold #color_yellow Global Trade#!#!; gain [ShowModifier('oe_bem_war_rel_neutral_freight')] for #Y 25 years#!."
 oe_bem.3.c: "Mobilize Along the Danube and Adriatic While Europe Burns"
 oe_bem.3.c.tt: "Gold #R −120#!, noble dissatisfaction; advances #bold #color_yellow Artillery#!#!; gain [ShowModifier('oe_bem_war_rel_danube_push')] for #Y 25 years#!."
 oe_bem.4.t: "New Rome in the Post-Westphalian Order"
 oe_bem.4.d: "Exhausted by a century of confessional bloodshed, Europe settles into an order of sovereign states and balance-of-power diplomacy. Crusading passions fade, leaving Constantinople to define the religious foundation of its vast multi-confessional empire.\n\nAs the Confessional Era closes, shall New Rome harden into an Orthodox confessional fortress or issue a Charter of Toleration to attract Western artisans and merchants?"
 oe_bem.4.a: "Anchor the Empire as an Orthodox Confessional Fortress"
 oe_bem.4.a.tt: "Stability #G +5#!, eases synod tension; concludes Act 1 and grants [ShowModifier('oe_bem_confessional_fortress')] for #Y 40 years#!."
 oe_bem.4.b: "Promulgate an Imperial Charter of Religious Toleration"
 oe_bem.4.b.tt: "Gold #R −100#!, clergy displeasure, slight revolutionary pressure; advances #bold #color_yellow Global Trade#!#!; concludes Act 1 and grants [ShowModifier('oe_bem_imperial_toleration_edict')] for #Y 40 years#!."
 oe_bem.5.t: "Line-Theme Reform: Standing Regiments vs. Old Pronoia Houses"
 oe_bem.5.d: "In the Age of Absolutism, European battlefields belong to flintlock volley fire, bayonet lines, and standardized field artillery. The traditional theme levies and hereditary pronoia magnates who once saved the empire now look slow, fragmented, and jealously protective of their tax exemptions.\n\nShall the crown abolish old pronoia tenures to forge a salaried Imperial Line-Theme Standing Army—knowing magnate wrath will surge toward rebellion—or phase in line battalions while sparing noble privileges?"
 oe_bem.5.a: "Abolish Old Pronoia and Forge an Imperial Line-Theme Standing Army"
 oe_bem.5.a.tt: "Sets the #bold #color_yellow Line-Theme Army Reformed#!#! flag, scaled gold outlay (up to #R −200#!), severe noble backlash, Magnate Wrath #R +65#! (risks revolt crisis!); advances #bold #color_yellow Military Revolution#!#!; gain [ShowModifier('oe_bem_line_theme_standing')] for #Y 45 years#!."
 oe_bem.5.b: "Phase In Line-Theme Battalions While Keeping Noble Commissions"
 oe_bem.5.b.tt: "Sets the #bold #color_yellow Line-Theme Army Reformed#!#! flag, scaled gold outlay (up to #R −120#!), Magnate Wrath #R +35#!; advances #bold #color_yellow Military Revolution#!#!; gain [ShowModifier('oe_bem_gradual_theme_battalions')] for #Y 45 years#!."
 oe_bem.5.c: "Strained Treasury: Phase In Line Battalions via Political Concessions (No Gold)"
 oe_bem.5.c.tt: "Sets the #bold #color_yellow Line-Theme Army Reformed#!#! flag with no gold cost at the price of Stability #R −4#!, Prestige #R −12#!, noble friction, and Magnate Wrath #R +45#!; advances #bold #color_yellow Military Revolution#!#! and grants [ShowModifier('oe_bem_gradual_theme_battalions')] for #Y 45 years#!."
 oe_bem.6.t: "Magnate Defiance in Thrace and Anatolia"
 oe_bem.6.d: "Centuries of vested privilege strike back! Old pronoia magnates across Thrace, Bithynia, and inland Anatolia unite in open tax strike, detaining imperial surveyors and threatening to rally provincial retainers unless their ancient exemptions are restored.\n\nThis is the acid test of absolutist reform: spend blood, gold, and stability to crush the magnates and confiscate rebel estates, or yield and watch the standing army reform degrade into a hollow compromise?"
 oe_bem.6.a: "Crush the Defiance and Confiscate Rebel Pronoias"
 oe_bem.6.a.tt: "Gold #R −250#!, Stability #R −8#!, severe noble anger; endure [ShowModifier('oe_bem_magnate_purge_aftermath')] (#Y 5 years#!), then reset magnate wrath, reinforce army reform, and gain [ShowModifier('oe_bem_crown_demesne_secured')] (#Y 30 years#!)."
 oe_bem.6.b: "Yield and Restore Noble Tax Exemptions (Degrades Army Reform)"
 oe_bem.6.b.tt: "Prestige #R −15#!; standing-army reform degrades into [ShowModifier('oe_bem_compromised_army_mod')] (#Y 35 years#!) and clears the army-reformed flag until rebuilt."
 oe_bem.7.t: "Golden Horn Manufactories & the Imperial Academy of Sciences"
 oe_bem.7.d: "Across the late seventeenth and early eighteenth centuries, large-scale manufactories and the Scientific Revolution transform state power. Guild workshops along the Golden Horn face organized production, while the venerable academy of Constantinople stands poised to embrace modern mathematics and natural science.\n\nShall the treasury charter state silk, cannon, and shipyard manufactories, or reorganize the university into an Imperial Academy of Sciences?"
 oe_bem.7.a: "Charter Golden Horn Silk, Foundry & Shipyard Manufactories"
 oe_bem.7.a.tt: "Gold #R −300#!, peasant strain; advances #bold #color_yellow Manufactories#!#!; gain [ShowModifier('oe_bem_golden_horn_manuf')] for #Y 35 years#!."
 oe_bem.7.b: "Transform Constantinople University Into an Imperial Academy of Sciences"
 oe_bem.7.b.tt: "Gold #R −220#! (reduced to #Y 160#! with Neo-Platonist/Humanist legacy), clerical friction, slight revolutionary pressure; advances #bold #color_yellow Scientific Revolution#!#!; gain [ShowModifier('oe_bem_imperial_academy_sci')] for #Y 35 years#!."
 oe_bem.8.t: "Codification of the Novae Basilicae"
 oe_bem.8.d: "From Justinian's Corpus Juris Civilis to Leo VI's Basilica, written law has bound the Roman world together. Yet centuries of reconquest, restored praetorian prefectures, and modern commerce have piled contradictory customs atop imperial statutes.\n\nImperial jurists present two drafts of the Novae Basilicae: a centralized absolutist code vesting supreme authority in the cabinet, or an Estates Charter formally recognizing the Senate and prefectural assemblies—laying lasting constitutional roots."
 oe_bem.8.a: "Promulgate the Centralized Absolutist Novae Basilicae"
 oe_bem.8.a.tt: "Gold #R −180#!, raises revolutionary pressure; eases restoration strain, closes Act 2, and grants [ShowModifier('oe_bem_basilicae_absolutist')] (#Y 40 years#!; extra Prestige #G +15#! if all 4 prefectures active or Unus Imperator)."
 oe_bem.8.b: "Enact the Senatorial & Prefectural Estates Code"
 oe_bem.8.b.tt: "Gold #R −150#!; establishes #bold #color_yellow Constitutional Roots#!#! (halves Act 3 Constitutional Basileia cost!), eases restoration strain, closes Act 2, and grants [ShowModifier('oe_bem_basilicae_estates')] (#Y 40 years#!)."
 oe_bem.9.t: "The Purple Enlightenment: Diafotismos in New Rome"
 oe_bem.9.d: "With the Age of Revolutions, the Enlightenment sweeps the Old World. The modern Greek Enlightenment—Diafotismos—now erupts directly inside living Constantinople, Thessaloniki, Athens, and Alexandria, as newspapers, classical republican treatises, and secular jurisprudence fill coffeehouses and salons.\n\nShall the crown patronize enlightened presses and legal salons—accelerating modernization while stoking revolutionary pressure—or impose strict imperial censorship?"
 oe_bem.9.a: "Patronize Enlightened Presses and Legal Salons"
 oe_bem.9.a.tt: "Gold #R −150#!, clergy dissatisfaction, Revolutionary Pressure #R +25#!; advances #bold #color_yellow Enlightenment#!#!; gain [ShowModifier('oe_bem_diafotismos_patronage')] for #Y 30 years#!."
 oe_bem.9.b: "Establish an Imperial Censorship Bureau Against Radical Pamphlets"
 oe_bem.9.b.tt: "Gold #R −80#!, burgher anger, Revolutionary Pressure #G −15#!; gain [ShowModifier('oe_bem_imperial_censorship')] for #Y 30 years#!."
 oe_bem.10.t: "Storm of the Old World: Revolution at the Theodosian Walls"
 oe_bem.10.d: "The Old Order cracks across Europe! Revolutionary slogans, tricolor cockades, and manifestos of popular sovereignty roll across the Mediterranean to beat against the millennial Theodosian Walls. Crowds pack Constantinople demanding a constitution while the Senate debates through the night.\n\nNew Rome must give its ultimate constitutional answer: proclaim the Second Roman Republic, forge a Constitutional Basileia, or defend Sacred Autocracy against the storm?"
 oe_bem.10.a: "Path I: Summon the Citizens' Assembly — Proclaim the Second Roman Republic!"
 oe_bem.10.a.tt: "Endure [ShowModifier('oe_bem_revolutionary_ferment')] and immediately enter the #bold #color_yellow Second Roman Republic#!#! endgame (.11)."
 oe_bem.10.b: "Path II: Convene Senate & Assembly — Forge a Constitutional Basileia"
 oe_bem.10.b.tt: "Endure [ShowModifier('oe_bem_revolutionary_ferment')] and immediately enter the #bold #color_yellow Constitutional Basileia#!#! endgame (.12; half cost with Constitutional Roots)."
 oe_bem.10.c: "Path III: Refuse Compromise — Enforce Sacred Autocracy & Imperial Reckoning"
 oe_bem.10.c.tt: "Endure [ShowModifier('oe_bem_revolutionary_ferment')] and immediately enter the #bold #color_yellow Sacred Autocracy#!#! endgame (.13; scales with Romanization progress)."
 oe_bem.11.t: "The Second Roman Republic (Res Publica Restituta)"
 oe_bem.11.d: "'Senatus Populusque Romanus!' After two millennia of autocracy, consuls and a National Assembly raise the republican eagle over Constantinople. Mass citizen conscription and modern industry surge forward, yet European monarchs recoil in fury and domestic nobles and clergy seethe.\n\nShall the reborn Second Roman Republic adopt a radical Citizen Charter or a moderate Senatorial Republic?"
 oe_bem.11.a: "Enact the Radical Citizen Republic & Levee en Masse"
 oe_bem.11.a.tt: "Switches to #bold #color_yellow Republic#!#!, Stability #R −10#!, severe noble/clergy backlash, European monarchist hostility; surges #bold #color_yellow Levee en Masse#!#! & #bold #color_yellow Industrialization#!#!; gain [ShowModifier('oe_bem_second_roman_republic')] (#Y 60 years#!)."
 oe_bem.11.b: "Establish a Moderate Senatorial Republic"
 oe_bem.11.b.tt: "Switches to #bold #color_yellow Republic#!#!, Stability #R −6#!, noble friction; advances #bold #color_yellow Levee en Masse#!#!; gain [ShowModifier('oe_bem_republic_conservative_charter')] (#Y 60 years#!)."
 oe_bem.12.t: "Constitutional Basileia"
 oe_bem.12.d: "In Hagia Sophia and the Senate hall, the purple-born Basileus swears fidelity to the Imperial Charter: the Emperor reigns beneath the law alongside Senate and Citizens' Assembly. Rather than shattering in revolutionary fire, the ancient crown channels Enlightenment jurisprudence and early industrialization into ordered reform.\n\nPrior constitutional roots from the Novae Basilicae halve the transition cost; without them, a full bicameral charter demands steep fiscal and political sacrifice."
 oe_bem.12.a: "Enact the Full Bicameral Charter of the Constitutional Basileia"
 oe_bem.12.a.tt: "With Constitutional Roots: scaled gold (up to #R −120#!), Stability #R −3#! (otherwise scaled gold up to #R −260#!, Stability #R −8#!); advances #bold #color_yellow Enlightenment#!#! & #bold #color_yellow Industrialization#!#!; gain [ShowModifier('oe_bem_constitutional_basileia')] (#Y 60 years#!)."
 oe_bem.12.b: "Issue a Cautious Compromised Charter (Constrained; Political Cost if Short of Gold)"
 oe_bem.12.b.tt: "Pays Gold #R −100#! and Stability #R −4#! if treasury permits (if short of gold, waives gold for Stability #R −6#! and Prestige #R −12#!); advances #bold #color_yellow Enlightenment#!#!; gain constrained variant [ShowModifier('oe_bem_constitutional_constrained')] (#Y 60 years#!)."
 oe_bem.13.t: "Sacred Autocracy & the Imperial Nationalist Reckoning"
 oe_bem.13.d: "The Emperor flatly rejects constitutional fetters, declaring the purple crown answerable only to Heaven and Roman law. Imperial line regiments clear the squares and launch an iron reckoning against revolutionary and nationalist agitation across the provinces.\n\nYet nineteenth-century nationalism spares no half-integrated empire: where centuries of Romanization took deep root, unity holds; where assimilation remains thin, fierce provincial separatism erupts."
 oe_bem.13.a: "Enforce Iron Imperial Autocracy Across the Provinces"
 oe_bem.13.a.tt: "Gold #R −150#!, burgher anger; with >= #Y 3#! Romanization campaigns gain muted [ShowModifier('oe_bem_autocrat_assimilated')], otherwise Stability #R −6#! and severe separatism [ShowModifier('oe_bem_autocrat_unrest')] (#Y 60 years#!)."
 oe_bem.13.b: "Proclaim Martial Law & Provincial Garrison Conscription"
 oe_bem.13.b.tt: "Gold #R −220#!, Stability #R −4#!; advances #bold #color_yellow Levee en Masse#!#! and grants [ShowModifier('oe_bem_autocrat_assimilated')] or [ShowModifier('oe_bem_autocrat_unrest')] based on Romanization progress (#Y 60 years#!)."
 oe_bem.14.t: "Steam of Empire & the Millennium Crown: New Rome in 1836"
 oe_bem.14.d: "In the dawn of the nineteenth century, steam engines and iron foundries roar along the Golden Horn, Thessaloniki, and Thessaly as early rails and steamships knit the Bosporus to the Mediterranean. Looking back across five centuries since 1337—civil wars, plague, Renaissance, restored prefectures, confessional storms, line-army reform, and revolution—New Rome has not merely survived; it has remade the early modern world.\n\nAt the threshold of 1836, what crowning legacy shall seal five hundred years of Roman continuity?"
 oe_bem.14.a: "Embrace Steam, Coal & Rail to Forge an Industrial New Rome"
 oe_bem.14.a.tt: "Gold #R −300#!, Prestige #G +25#!, labor strain; advances #bold #color_yellow Industrialization#!#!; completes the 3-act arc and grants [ShowModifier('oe_bem_millennium_steam_empire')] (#Y 40 years#!)."
 oe_bem.14.b: "Crown Five Centuries of Roman Law and Civic Balance"
 oe_bem.14.b.tt: "Gold #R −150#!, Stability #G +8#!, Prestige #G +15#!; completes the 3-act arc and grants [ShowModifier('oe_bem_millennium_balanced_crown')] (#Y 40 years#!)."
