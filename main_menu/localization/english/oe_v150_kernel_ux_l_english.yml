l_english:
 oe_yuan_kurultai: "Great Yuan Kurultai and Zhongshu"
 oe_yuan_kurultai_desc: "Unites the steppe assembly of Mongol princes with the Secretariat of the Central Plains, balancing noble horse-lords, clergy, and commercial treasuries in imperial deliberation."
 oe_ming_six_ministries: "Imperial Six Ministries Court"
 oe_ming_six_ministries_desc: "The Six Ministries and Grand Secretariat deliberate imperial policy, fiscal audits, and civil appointments before the throne with structured clerical and burgher counsel."
 oe_ottoman_divan: "Ottoman Imperial Divan"
 oe_ottoman_divan_desc: "Presided over by the Grand Vizier beneath the Imperial Dome, the Divan coordinates military judges, treasurers, and provincial commanders under firm sovereign authority."
 oe_rus_zemsky_sobor: "Russian Zemsky Sobor"
 oe_rus_zemsky_sobor_desc: "A realm-wide assembly of Boyars, Orthodox prelates, urban burghers, and free communes forging estate consensus and broad manpower mobilization across All Rus'."
 oe_mamluk_majlis: "Mamluk Sultanic Majlis"
 oe_mamluk_majlis_desc: "Convened in the Cairo Citadel, the Sultan's Majlis brings senior Emirs, chief Qadis, and Karimi merchants together to balance heavy cavalry discipline and Nile fiscal revenues."
 oe_theme_found_expansion_all_action: "Found All Expansion Themes (Italy / East / Austria / Switzerland)"
 oe_theme_found_expansion_all_action_desc: "Tier-2 Expansion Batch Founding: founds a theme in every unoccupied imperial area across your unlocked expansion zones (Italy, Eastern, Austrian, and Swiss — distinct from Tier-1's 38 Historical Themes). Costs #R 5#! Authority each and stops cleanly when Authority runs out."
 oe_theme_found_expansion_all_action_card: "Tier-2: batch-found themes across unlocked Italy/East/Austria/Switzerland zones, #R 5#! Authority each."
 oe_theme_found_expansion_all_tt: "Founds a theme in every unoccupied area across your unlocked Tier-2 expansion zones (Italy, Eastern, Austrian, Swiss) for #Y 5#! Authority each, stopping cleanly when Authority runs out (distinct from Tier-1 Historical Themes)."
 oe_theme_found_expansion_all_none_tt: "At least one unlocked expansion zone (Italy/East/Austria/Switzerland) has an unoccupied area ready to found a theme"
 oe_v150_preset.2.t: "Tier-2 Expansion Themes Founded"
 oe_v150_preset.2.d: "Imperial charters have reached the unlocked frontier zones. A total of #Y [ROOT.GetCountry.MakeScope.GetVariable('oe_theme_found_exp_count').GetValue|0]#! new Tier-2 expansion themes have been established across your eligible Italian, Eastern, Austrian, and Swiss provinces with seats, posts, and garrisons ready. Tier-1 Historical Themes (38 core regions) remain managed separately by Found All Themes."
 oe_v150_preset.2.a: "Charge the frontier strategoi with their duty"
 oe_v150_choose_challenge_preset: "1337 Campaign Challenge Presets"
 oe_v150_choose_challenge_preset.title: "1337 Campaign Challenge Presets"
 oe_v150_choose_challenge_preset.desc: "Choose an optional campaign challenge track at the 1337 start (zero extra Game Rules, free, one-click dismissible): select Standard Historical Phoenix, Multipolar High-Tension Eurasia, Hardcore Entropy and Crisis Gauntlet, or 1337 Accelerated Nova Elysia Prep."
 oe_v150_choose_challenge_preset_desc: "Select an optional 1337 campaign challenge preset (zero extra Game Rules, free, one-click dismissible)."
 oe_v150_choose_challenge_preset.a: "Review 1337 Challenge Presets"
 oe_v150_preset.1.t: "1337 Eurasia: Choose Campaign Challenge Preset"
 oe_v150_preset.1.desc: "In 1337, Byzantium endures on the Bosphorus while Great Yuan still spans the steppe and rivals stir across Eurasia. You may optionally select a replayability challenge preset for this run without adding any Game Rules, or choose the standard historical track to dismiss cleanly."
 oe_v150_preset.1.a: "Standard Historical Phoenix (No Modifiers, Dismiss)"
 oe_v150_preset.1.a.tt: "Applies no extra modifiers, preserves the standard historical experience, and dismisses this prompt cleanly."
 oe_v150_preset.1.b: "Multipolar High-Tension Eurasia"
 oe_v150_preset.1.b.tt: "Grants the player and all independent Great Powers the Multipolar High-Tension Eurasia modifier (boosted prestige, diplomatic reputation, manpower, and discipline), refreshed quarterly by the Global Kernel."
 oe_v150_preset.1.c: "Hardcore Entropy and Crisis Gauntlet"
 oe_v150_preset.1.c.tt: "Activates the Global Kernel yearly Hardcore Gauntlet hook: major realms face tighter control and war exhaustion pressure (with modest discipline and prestige), plus an extra #R +2#! yearly Empire Entropy and Hegemony Tension nudge."
 oe_v150_preset.1.d: "1337 Accelerated Nova Elysia Prep (Byzantium)"
 oe_v150_preset.1.d.tt: "Grants Byzantium a 50-year Accelerated Nova Elysia Prep modifier (faster exploration, longer colonial range, larger migration, sailors, and shipbuilding) to reach the Fourth Odyssey decades earlier."
 STATIC_MODIFIER_NAME_oe_v150_preset_multipolar_mod: "Multipolar High-Tension Eurasia"
 STATIC_MODIFIER_DESC_oe_v150_preset_multipolar_mod: "Intensified multipolar rivalry across Eurasia spurs great courts to sharpen armies and diplomatic reach."
 STATIC_MODIFIER_NAME_oe_v150_preset_hardcore_mod: "Hardcore Entropy and Crisis Gauntlet"
 STATIC_MODIFIER_DESC_oe_v150_preset_hardcore_mod: "Sprawling realms endure harsher administrative drag and war weariness, demanding disciplined governance to survive."
 STATIC_MODIFIER_NAME_oe_v150_preset_elysia_fast: "1337 Accelerated Nova Elysia Prep"
 STATIC_MODIFIER_DESC_oe_v150_preset_elysia_fast: "Imperial shipyards and ocean pilots expand early, accelerating exploration range, shipbuilding, and crews for the western crossing to Nova Elysia."
 oe_v150_preset.90.t: "v15.0 Unified Global Kernel and Native UX Diagnostics"
 oe_v150_preset.90.d: "#T Unified Global Kernel (oe_global_kernel)#!\nMonthly Ticks: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_gk_rd_ticks')|0]#!  Quarterly Ticks: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_gk_rd_q_ticks')|0]#!  Yearly Ticks: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_gk_rd_y_ticks')|0]#!\nLast Month Serial: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_gk_rd_ran_m')|0]#!  Consolidated Fallback Hooks: #G [ROOT.GetCountry.MakeScope.ScriptValue('oe_gk_consolidated_hooks')|0]#!\n\n#T 1337 Challenge Presets#!\nActive Preset Code: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_gk_rd_preset')|0]#! (0=Unset, 1=Standard, 2=Multipolar, 3=Hardcore, 4=Elysia Prep)\n\n#T Native UX and Theme 2.0#!\nCivilization Parliaments: 5 (Yuan/Ming/Ottoman/Rus/Mamluk) | Trigger Localizations: 40 (80 pos/neg keys) | Top-Bar Alerts: 10 O(1) flags | Theme 2.0: <=15 locs, max 3 absorbed regions, <=45 combined cap, Naval Themes protected, plus Tier-2 Expansion Batch Founding."
 oe_v150_preset.90.a: "Close Diagnostic Readout"
