 oe_aip_imperial_restorer: "Imperial Restorer"
 oe_aip_imperial_restorer_desc: "This realm is driven to reclaim historic imperial heartlands, reinforcing central control and standing manpower while advancing along core corridors whenever its treasury and realm remain steady."
 oe_aip_thalassocracy_hegemon: "Thalassocracy Hegemon"
 oe_aip_thalassocracy_hegemon_desc: "This maritime power focuses on oceanic trade, coastal entrepots, colonial sea lanes, and lucrative peace terms while steering clear of costly wars deep inside landlocked interiors."
 oe_aip_celestial_suzerain: "Celestial Suzerain"
 oe_aip_celestial_suzerain_desc: "The holder of the Mandate of Heaven governs through domestic stability, tributary diplomacy, and frontier protectorates, preferring vassalage and formal justification over reckless direct annexation."
 oe_aip_gunpowder_conqueror: "Gunpowder Conqueror"
 oe_aip_gunpowder_conqueror_desc: "Riding the wave of gunpowder warfare, this assertive power curtails estate privileges, marshals deep manpower, and campaigns boldly to break regional stalemates."
 oe_aip_enlightened_reformer: "Enlightened Reformer"
 oe_aip_enlightened_reformer_desc: "An early modern court steeped in reform prioritizes new institutions, societal modernization, scholarship, and commerce over needless wars of conquest."
 oe_aip_concert_balancer: "Concert Balancer"
 oe_aip_concert_balancer_desc: "A statesman power of the Eurasian Concert relies on multilateral diplomacy, collective defense, and measured peace settlements to preserve the balance of power and contain would-be hegemons."
