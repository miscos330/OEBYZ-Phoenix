 STATIC_MODIFIER_NAME_oe_srk_twin_legations: "Twin Phoenix Imperial Legations"
 STATIC_MODIFIER_DESC_oe_srk_twin_legations: "Permanent legations linking Constantinople and Dadu boost diplomacy and overland trade while slightly loosening central control."
 STATIC_MODIFIER_NAME_oe_srk_factor_ties: "Chartered Silk Road Factors"
 STATIC_MODIFIER_DESC_oe_srk_factor_ties: "Confining eastern-western ties to commercial factors raises trade income while trimming diplomatic stature."
 STATIC_MODIFIER_NAME_oe_srk_overland_charter: "Grand Overland Caravan Charter"
 STATIC_MODIFIER_DESC_oe_srk_overland_charter: "Joint escort stations across Trebizond, Tabriz, Samarkand, and Kashgar lift overland trade and merchant capacity at heavy light-cavalry upkeep."
 STATIC_MODIFIER_NAME_oe_srk_syndicate_tolls: "Steppe & Oasis Syndicate Tolls"
 STATIC_MODIFIER_DESC_oe_srk_syndicate_tolls: "Farming caravan tolls to steppe and oasis syndicates boosts trade revenue and burgher satisfaction at the expense of crown control."
 STATIC_MODIFIER_NAME_oe_srk_maritime_link: "Zaytun-Alexandria Maritime Link"
 STATIC_MODIFIER_DESC_oe_srk_maritime_link: "Chartered convoys tying Zaytun, Alexandria, and Constantinople expand sea trade and naval reach while raising light-ship upkeep and pirate pressure."
 STATIC_MODIFIER_NAME_oe_srk_broker_maritime: "Indian Ocean Relay Brokers"
 STATIC_MODIFIER_DESC_oe_srk_broker_maritime: "Relying on Indian Ocean middlemen steadies sea commerce and curbs piracy while displeasing domestic merchant burghers."
 STATIC_MODIFIER_NAME_oe_srk_scholar_exchange: "Twin Phoenix Observatory & Translation Bureau"
 STATIC_MODIFIER_DESC_oe_srk_scholar_exchange: "Exchanging Greek astronomy and medicine with Yuan calendars and printing accelerates research, institution growth, and literacy while unsettling conservative clergy."
 STATIC_MODIFIER_NAME_oe_srk_cartography_maps: "Practical Cartography & Agronomy"
 STATIC_MODIFIER_DESC_oe_srk_cartography_maps: "Focusing strictly on maps and sericulture steadies the realm and spreads institutions at slightly slower scholarly innovation."
 STATIC_MODIFIER_NAME_oe_srk_gunpowder_guilds: "Gunpowder, Foundry & Porcelain Guilds"
 STATIC_MODIFIER_DESC_oe_srk_gunpowder_guilds: "Sharing gunpowder formulas, bronze casting, and kiln masters boosts siege ability and production at steeper artillery upkeep and lighter crown control."
 STATIC_MODIFIER_NAME_oe_srk_luxury_guilds: "Imperial Silk & Porcelain Guilds"
 STATIC_MODIFIER_DESC_oe_srk_luxury_guilds: "Guarding military secrets while trading fine porcelain and imperial silk boosts production and trade at slower siege innovation."
 STATIC_MODIFIER_NAME_oe_srk_ecumenical_chapels: "Silk Road Orthodox & Nestorian Chapels"
 STATIC_MODIFIER_DESC_oe_srk_ecumenical_chapels: "Sponsoring Orthodox and Church of the East chapels along the caravan road raises tolerance and diplomacy while provoking domestic clerical grumbling."
 STATIC_MODIFIER_NAME_oe_srk_secular_embassy: "Strictly Secular Commercial Missions"
 STATIC_MODIFIER_DESC_oe_srk_secular_embassy: "Keeping embassies purely secular reassures domestic clergy and true-faith unity while narrowing diplomatic warmth abroad."
 STATIC_MODIFIER_NAME_oe_srk_route_escorts: "Armed Overland & Sea Route Escorts"
 STATIC_MODIFIER_DESC_oe_srk_route_escorts: "Joint cavalry and light-ship escorts beat back steppe raiders and sea pirates, protecting commerce at twin military upkeep costs."
 STATIC_MODIFIER_NAME_oe_srk_tariff_squeeze: "Retaliatory Tariffs & Route Contraction"
 STATIC_MODIFIER_DESC_oe_srk_tariff_squeeze: "Hiking retaliatory customs raises short-term tax efficiency while choking overland and maritime commerce and alienating burghers."
 STATIC_MODIFIER_NAME_oe_srk_twin_concordat: "The Twin Phoenix Concordat"
 STATIC_MODIFIER_DESC_oe_srk_twin_concordat: "The grand Eurasian Concordat unites Constantinople and Dadu across land and sea, driving trade, diplomacy, and research alongside standing escort upkeep and control strain."
 STATIC_MODIFIER_NAME_oe_srk_silver_silk_treaty: "Balanced Silver & Silk Treaty"
 STATIC_MODIFIER_DESC_oe_srk_silver_silk_treaty: "Linking Roman bullion with Yuan silk and porcelain lifts trade revenue, merchant capacity, and stability while introducing mild inflationary pressure."
 STATIC_MODIFIER_NAME_oe_srk_caravan_hub: "Twin Phoenix Caravan Hub"
 STATIC_MODIFIER_DESC_oe_srk_caravan_hub: "Trans-Eurasian caravans swell local merchant and market power alongside mild urban unrest."
 STATIC_MODIFIER_NAME_oe_srk_porcelain_port: "Silk Road Porcelain & Spice Entrepot"
 STATIC_MODIFIER_DESC_oe_srk_porcelain_port: "Oceanic convoys carrying porcelain and spices boost merchant power and maritime presence while adding mild port unrest."
