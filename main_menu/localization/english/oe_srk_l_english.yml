 oe_srk_dec_overland_caravan.title: "Sponsor Grand Overland Caravan (Constantinople-Dadu)"
 oe_srk_dec_overland_caravan.desc: "Dispatch a heavily escorted imperial caravan along the Constantinople-Trebizond-Tabriz-Samarkand-Kashgar-Dadu trunk, boosting overland trade at steep cavalry upkeep."
 oe_srk_dec_overland_caravan.a: "Fund the Grand Overland Caravan"
 oe_srk_dec_maritime_voyage.title: "Dispatch Zaytun-Alexandria Porcelain Fleet"
 oe_srk_dec_maritime_voyage.desc: "Send a chartered porcelain and spice fleet linking Zaytun, Alexandria, and Constantinople to boost maritime trade alongside higher light-ship upkeep and pirate exposure."
 oe_srk_dec_maritime_voyage.a: "Launch the Porcelain & Spice Fleet"
 oe_srk_dec_scholar_mission.title: "Host the Twin Phoenix Academy Symposium"
 oe_srk_dec_scholar_mission.desc: "Convene Byzantine astronomers and Yuan calendar and printing masters for a grand symposium, boosting research and institution growth while testing clerical patience."
 oe_srk_dec_scholar_mission.a: "Convene the Twin Phoenix Symposium"
 oe_srk.1.t: "Envoys Across the World: Twin Phoenix Recognition"
 oe_srk.1.desc_dual: "#F From Maria Palaiologina's marriage into the Ilkhanate and Rabban Bar Sauma's 1287 audience in Constantinople to Marignolli's 1339-1342 embassy to Dadu, the two ends of Eurasia remembered each other across steppe and sea.#!\n\nBoth restored Constantinople and restored Dadu stand tall at opposite ends of Eurasia! Imperial envoys bearing Greek and Mongol letters meet to inaugurate the Twin Phoenix bond: establish permanent imperial legations, or rely on commercial factors?"
 oe_srk.1.desc_west: "#F From Maria Palaiologina's marriage into the Ilkhanate and Rabban Bar Sauma's 1287 audience in Constantinople to Marignolli's 1339-1342 embassy to Dadu, the two ends of Eurasia remembered each other across steppe and sea.#!\n\nWith New Rome resurgent across the Aegean and Black Sea, envoys look east along Marignolli's old road to revive Eurasian ties. Should the court sponsor permanent eastern legations, or rely on chartered commercial factors?"
 oe_srk.1.desc_east: "#F From Maria Palaiologina's marriage into the Ilkhanate and Rabban Bar Sauma's 1287 audience in Constantinople to Marignolli's 1339-1342 embassy to Dadu, the two ends of Eurasia remembered each other across steppe and sea.#!\n\nWith Great Yuan restored in Dadu, Greek-speaking envoys and letters from the Roman West arrive along the caravan road. Should the Secretariat open a permanent Fulin Legation at court, or confine ties to commercial factors?"
 oe_srk.1.a: "Confine Contacts to Chartered Commercial Factors"
 oe_srk.1.a.tt: "Gain [ShowModifier('oe_srk_factor_ties')] (#Y 180#! months: higher trade income at mild diplomatic cost); mutual opinion #G +20#! if both empires stand."
 oe_srk.1.b: "Establish Permanent Imperial Legations (Fulin & Cathay Halls)"
 oe_srk.1.b.tt: "Gain bilateral [ShowModifier('oe_srk_twin_legations')] (#Y 180#! months: diplomatic reputation and overland trade at slight control strain); mutual opinion #G +50#! in Dual Mode."
 oe_srk.2.t: "Overland Caravan Charter"
 oe_srk.2.desc_open: "#F The grand overland silk trunk stretched from Constantinople via Trebizond, Tabriz, Samarkand, and Kashgar across the Tian Shan to Dadu, its survival hinging on escort stations and oasis peace.#!\n\nWith the Transoxian corridor open, caravans stream between Trebizond, Tabriz, Samarkand, and Dadu. Should the imperial treasury fund joint caravan stations and cavalry escorts, or farm tolls to local steppe syndicates?"
 oe_srk.2.desc_tense: "#F The grand overland silk trunk stretched from Constantinople via Trebizond, Tabriz, Samarkand, and Kashgar across the Tian Shan to Dadu, its survival hinging on escort stations and oasis peace.#!\n\nRegional friction along the Trebizond-Tabriz-Samarkand-Kashgar corridor makes long-distance caravans hazardous. Should the crown fund armed imperial caravanserais, or delegate protection to local steppe syndicates?"
 oe_srk.2.a: "Farm Caravan Tolls to Steppe and Oasis Syndicates"
 oe_srk.2.a.tt: "Gain [ShowModifier('oe_srk_syndicate_tolls')] (#Y 180#! months: higher trade revenue and burgher satisfaction at crown control cost)."
 oe_srk.2.b: "Fund Joint Caravanserais and Cavalry Escorts"
 oe_srk.2.b.tt: "Gain bilateral [ShowModifier('oe_srk_overland_charter')] (#Y 180#! months: #G +10%#! overland trade and merchant capacity at #R +15%#! cavalry upkeep); Constantinople, Trebizond, Samarkand, and Dadu gain [ShowModifier('oe_srk_caravan_hub')]."
 oe_srk.3.t: "Maritime Spice & Porcelain Link"
 oe_srk.3.desc_open: "#F Alongside the steppe caravans, the maritime silk artery from Zaytun (Quanzhou) across the Indian Ocean to Alexandria and Constantinople carried the richest cargoes of porcelain, silk, and spice.#!\n\nWith Zaytun's Maritime Customs open to oceanic shipping, imperial vessels can link Quanzhou directly to Alexandria and the Golden Horn! Should we charter direct porcelain convoys, or rely on Indian Ocean relay brokers?"
 oe_srk.3.desc_relay: "#F Alongside the steppe caravans, the maritime silk artery from Zaytun (Quanzhou) across the Indian Ocean to Alexandria and Constantinople carried the richest cargoes of porcelain, silk, and spice.#!\n\nEven where coastal controls remain tight, Zaytun porcelain and southern spices reach Alexandria and Constantinople through busy Indian Ocean ports. Should we invest in chartered maritime convoys, or lean on relay brokers?"
 oe_srk.3.a: "Rely on Indian Ocean & Alexandrian Relay Brokers"
 oe_srk.3.a.tt: "Gain [ShowModifier('oe_srk_broker_maritime')] (#Y 180#! months: modest sea trade and lower piracy at burgher satisfaction cost)."
 oe_srk.3.b: "Charter Direct Maritime Convoys Between Zaytun & Constantinople"
 oe_srk.3.b.tt: "Gain bilateral [ShowModifier('oe_srk_maritime_link')] (#Y 180#! months: #G +10%#! sea trade and #G +20%#! naval range at #R +15%#! light-ship upkeep and mild pirate risk); Jinjiang, Alexandria, and Constantinople gain [ShowModifier('oe_srk_porcelain_port')]."
 oe_srk.4.t: "Exchange of Scholars & Cartographers"
 oe_srk.4.desc_ren: "#F When Constantinople's Ptolemaic astronomy, Galenic medicine, and Greek scriptoria met Dadu's observatories, the Shoushi Calendar, woodblock printing, and sericulture manuals, a rare trans-Eurasian intellectual bridge took shape.#!\n\nWith intellectual debate flourishing on the Bosphorus, scholars from East and West clamor to translate star tables and treatises together. Should the court endow joint observatories and translation bureaus despite clerical unease, or stick to practical maps?"
 oe_srk.4.desc_gen: "#F When Constantinople's Ptolemaic astronomy, Galenic medicine, and Greek scriptoria met Dadu's observatories, the Shoushi Calendar, woodblock printing, and sericulture manuals, a rare trans-Eurasian intellectual bridge took shape.#!\n\nAstronomers and cartographers accompanying the embassies offer astrolabes, calendars, and printed manuals. Should we endow joint translation bureaus and observatories, or limit exchanges to practical cartography and agronomy?"
 oe_srk.4.a: "Restrict Exchanges to Practical Cartography & Agronomy"
 oe_srk.4.a.tt: "Gain [ShowModifier('oe_srk_cartography_maps')] (#Y 180#! months: steady institution growth and stability at slightly slower research)."
 oe_srk.4.b: "Endow Joint Translation Bureaus & Observatories"
 oe_srk.4.b.tt: "Gain bilateral [ShowModifier('oe_srk_scholar_exchange')] (#Y 180#! months: #G +6%#! research, #G +10%#! institution growth, and literacy at clergy satisfaction cost)."
 oe_srk.5.t: "Gunpowder, Metallurgy & Porcelain Guilds"
 oe_srk.5.desc_x: "#F Eastern gunpowder formulas, bronze hand-cannons, and cobalt porcelain met Roman siege foundries, naval ordnance, and imperial silk weaving. Sharing master artisans promised leapfrogging craft alongside real security risks.#!\n\nImperial arsenals and craft guilds propose an exchange of master founders and kiln artisans. Should we share gunpowder and bronze-casting workshops despite steeper artillery upkeep and secrecy risks, or trade only luxury porcelain and silk?"
 oe_srk.5.a: "Guard Military Secrets and Trade Only Luxury Porcelain & Silk"
 oe_srk.5.a.tt: "Gain [ShowModifier('oe_srk_luxury_guilds')] (#Y 180#! months: higher production and trade income at slower siege innovation); boosts Yuan paper money trust by #G +4#! if active."
 oe_srk.5.b: "Exchange Arsenal Founders and Master Artisans"
 oe_srk.5.b.tt: "Gain bilateral [ShowModifier('oe_srk_gunpowder_guilds')] (#Y 180#! months: #G +8%#! siege ability and #G +6%#! production at #R +15%#! artillery upkeep and slight control cost)."
 oe_srk.6.t: "Nestorian & Orthodox Envoys in Khanbaliq"
 oe_srk.6.desc_x: "#F The Alan guards of Khanbaliq professed Eastern Orthodoxy alongside Nestorian communities across the steppe, while Constantinople still treasured the Church of St. Mary of the Mongols built by Maria Palaiologina.#!\n\nOrthodox and Church of the East clergy petition to maintain chapels and hospices along the caravan stations. Should the court sponsor ecumenical toleration along the route, or keep missions strictly secular to satisfy domestic clergy?"
 oe_srk.6.a: "Keep Strictly Secular Missions to Satisfy Domestic Clergy"
 oe_srk.6.a.tt: "Gain [ShowModifier('oe_srk_secular_embassy')] (#Y 180#! months: higher clergy satisfaction and true-faith tolerance at lower diplomatic reputation)."
 oe_srk.6.b: "Sponsor Ecumenical Chapels Along the Caravan Route"
 oe_srk.6.b.tt: "Gain bilateral [ShowModifier('oe_srk_ecumenical_chapels')] (#Y 180#! months: heretic/heathen tolerance and diplomacy at clergy satisfaction cost); mutual opinion #G +25#!."
 oe_srk.7.t: "Crisis on the Steppe & Sea Route"
 oe_srk.7.desc_x: "#F No transcontinental trade artery runs without enemies: steppe raiders ambushed caravans between Tabriz and Samarkand, rival maritime republics raised tariff walls, and Indian Ocean pirates stalked porcelain convoys.#!\n\nBad news strikes both routes at once: raiders hit the steppe caravans, pirates harass sea convoys, and rival ports impose punitive tolls! Should we fund emergency cavalry and naval escorts, or levy retaliatory tariffs and absorb the contraction?"
 oe_srk.7.a: "Impose Retaliatory Tariffs and Absorb the Contraction"
 oe_srk.7.a.tt: "Gain [ShowModifier('oe_srk_tariff_squeeze')] (#Y 72#! months: mild tax gain while overland and sea trade drop #R −8%#! each and burghers grow unhappy)."
 oe_srk.7.b: "Fund Emergency Cavalry & Naval Escorts to Keep Routes Open"
 oe_srk.7.b.tt: "Gain bilateral [ShowModifier('oe_srk_route_escorts')] (#Y 120#! months: #G +15%#! trade protection and overland trade at #R +15%#! cavalry and light-ship upkeep)."
 oe_srk.8.t: "The Twin Phoenix Concordat"
 oe_srk.8.desc_dual: "#F After decades of embassies, caravan charters, scholarly exchanges, and hard-won resilience against raiders and tariffs, the great Eurasian silk network stands ready for its crowning monument.#!\n\nConstantinople and Dadu now anchor Eurasia's two poles in unprecedented splendor! Shall both empires ratify the Grand Twin Phoenix Concordat uniting land, sea, and learning, or codify a Balanced Silver & Silk Treaty?"
 oe_srk.8.desc_solo: "#F After decades of embassies, caravan charters, scholarly exchanges, and hard-won resilience against raiders and tariffs, the great Eurasian silk network stands ready for its crowning monument.#!\n\nStanding tall as the chief guardian of the Eurasian silk arteries, our empire prepares a lasting settlement: invest deeply in the Grand Silk Phoenix Concordat across land and sea, or codify a steady Silver & Silk Commercial Treaty?"
 oe_srk.8.a: "Codify a Balanced Silver & Silk Commercial Treaty"
 oe_srk.8.a.tt: "Gain 40-year [ShowModifier('oe_srk_silver_silk_treaty')] (trade revenue, merchant capacity, and stability with mild monthly inflation); boosts Yuan paper money trust by #G +6#! if active. Completes this line."
 oe_srk.8.b: "Ratify the Grand Twin Phoenix Concordat"
 oe_srk.8.b.tt: "Gain 40-year bilateral [ShowModifier('oe_srk_twin_concordat')] (#G +10%#! overland and sea trade, diplomacy, and research with control strain and #R +10%#! cavalry/light-ship upkeep); mutual opinion #G +50#!. Completes this line."
 oe_srk.20.t: "Silk Road Twin Phoenix: Choice Takes Effect"
