l_english:
 OE_CW2_ST_REBELS: "#R The rebels#!"
 OE_CW2_ST_CROWN: "#G The crown#!"
 OE_CW2_ST_FOREIGN: "Foreign"
 OE_CW2_SIDE_1: "We are the Kantakouzenos side: at #Y 0#! we win; at #Y 100#!, or if the rebels hold Constantinople for #Y 3#! months, John V wins."
 OE_CW2_SIDE_2: "We are John V's side: at #Y 100#! we win; at #Y 0#!, or if the rebels hold Constantinople for #Y 3#! months, Matthew wins."
 STATIC_MODIFIER_NAME_oe_cw2_tzympe: "Ottoman Garrison at Tzympe"
 STATIC_MODIFIER_NAME_oe_cw2_gattilusio_fief: "Fief of the Gattilusi"
 STATIC_MODIFIER_NAME_oe_cw2_concord: "An Uneasy Concord"
 STATIC_MODIFIER_NAME_oe_cw2_divided: "A Divided Empire"
 OE_CW2_REBELS_PAL: "The Palaiologan Party"
 OE_CW2_REBELS_PAL_country: "The Palaiologan Party"
 OE_CW2_REBELS_PAL_country_adjective: "Palaiologan Party"
 OE_CW2_REBELS_KAN: "Matthew's Party"
 OE_CW2_REBELS_KAN_country: "Matthew's Party"
 OE_CW2_REBELS_KAN_country_adjective: "Matthew's"
 oe_cw2_war: "The Second Civil War"
 oe_cw2_war_desc: "John V and the Kantakouzenoi are at war again: on one side Venetian money, Dušan's horse and a Genoese adventurer's galleys, on the other Ottoman troops.\n\n[GetCountry('BYZ').Custom('OeCw2Side')]\nTide: #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cw2_tide').GetValue|0]#! / #Y 100#! (#Y 100#! = the Palaiologan side wins, #Y 0#! = the Kantakouzenoi win)   Months of war: #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cw2_wm').GetValue|0]#!\nEach month the tide moves with who controls these eight cities (weights in brackets), and with foreign help:\nConstantinople (#Y 4#!): [GetCountry('BYZ').Custom('OeCw2City_constantinople')]\nAdrianople (#Y 3#!): [GetCountry('BYZ').Custom('OeCw2City_edirne')]\nDidymoteicho (#Y 2#!): [GetCountry('BYZ').Custom('OeCw2City_demotica')]\nKomotini (#Y 1#!): [GetCountry('BYZ').Custom('OeCw2City_komotini')]\nTraianopolis (#Y 1#!): [GetCountry('BYZ').Custom('OeCw2City_traianopolis')]\nSelymbria (#Y 1#!): [GetCountry('BYZ').Custom('OeCw2City_silivri')]\nSaranta Ekklesiai (#Y 1#!): [GetCountry('BYZ').Custom('OeCw2City_kirklareli')]\nBizye (#Y 1#!): [GetCountry('BYZ').Custom('OeCw2City_vize')]\n\nAfter #Y 4#! years the two sides divide the empire between them."
 oe_cw2.1.t: "Matthew's Grievance"
 oe_cw2.1.desc: "Your eldest son #color_yellow;bold Matthew#! had assumed that once his father took the throne it would one day be his. But the settlement that ended the war is plain: John V is the heir. Matthew has stormed out of the palace, and the old Kantakouzenist captains are taking his part."
 oe_cw2.1.a: "Give him eastern Thrace"
 oe_cw2.1.a.tt: "#R Rift +10#! (#Y 60#! means war)\nMatthew receives an appanage around Adrianople, which also guards the Serbian border; the Palaiologan party takes note"
 oe_cw2.1.b: "Tell him to be patient"
 oe_cw2.1.b.tt: "#G Rift −5#! (#Y 60#! means war)"
 oe_cw2.2.t: "John V's Lands"
 oe_cw2.2.desc: "John V is #Y [SCOPE.sCharacter('oe_cw2_j5').GetAgeInYears]#! now and married to the emperor's daughter, yet he still lives in the palace like a hostage. The old servants of the Palaiologoi urge him to leave the capital for western Thrace, with lands and men of his own."
 oe_cw2.2.a: "Let him go to western Thrace"
 oe_cw2.2.a.tt: "#G Rift −10#! (#Y 60#! means war)\nJohn V receives lands on the lower Evros; if it comes to war, they will be his base"
 oe_cw2.2.b: "Keep him in the capital"
 oe_cw2.2.b.tt: "#R Rift +10#! (#Y 60#! means war)"
 oe_cw2.3.t: "The Venetian Loan"
 oe_cw2.3.desc: "The bankers of Venice have seen the crack in the empire. They will lend John V a large sum against the island of #color_yellow;bold Tenedos#!, which guards the mouth of the Dardanelles. With that money anyone can raise an army."
 oe_cw2.3.a: "Let it pass"
 oe_cw2.3.a.tt: "#R Rift +15#! (#Y 60#! means war)\nJohn V has a war chest of his own; in a war, #R tide +0.5#! a month"
 oe_cw2.3.b: "Forbid it"
 oe_cw2.3.b.tt: "#G Rift −5#! (#Y 60#! means war)"
 oe_cw2.3.c: "Take the loan"
 oe_cw2.3.c.tt: "#R Rift +10#! (#Y 60#! means war)\nThe Kantakouzenoi are sure the emperor is raising troops; in a war, #G tide +0.5#! a month"
 oe_cw2.3.d: "Decline"
 oe_cw2.3.d.tt: "#G Rift −5#! (#Y 60#! means war)"
 oe_cw2.4.t: "Two Emperors"
 oe_cw2.4.desc: "The empire has two emperors, and only one crown can be handed on. John V is growing up, and the crowds have begun to cheer him in the streets; Matthew's men ask why the Kantakouzenoi should hand the empire they won to the Palaiologoi. The emperor must decide."
 oe_cw2.4.a: "Abdicate and leave the empire to John V"
 oe_cw2.4.a.tt: "John VI abdicates and takes the cowl as Joasaph; John V becomes sole emperor; there is no civil war"
 oe_cw2.4.b: "Crown Matthew co-emperor"
 oe_cw2.4.b.tt: "#R Rift +25#! (#Y 60#! means war)\nMatthew becomes co-emperor and the Kantakouzenos succession has a title to stand on"
 oe_cw2.4.c: "Shower John V with honours"
 oe_cw2.4.c.tt: "#G Rift −15#! (#Y 60#! means war)"
 oe_cw2.5.t: "The Kantakouzenoi Still Rule"
 oe_cw2.5.desc: "John V is #Y [SCOPE.sCharacter('oe_cw2_j5').GetAgeInYears]#! and long since of age, yet the great offices are still held by the #color_yellow;bold Kantakouzenoi#!. The old regent no longer attends council, but people call at his house every day for instructions. The emperor's old servants urge him to take the power back."
 oe_cw2.5.a: "Take the power back"
 oe_cw2.5.a.tt: "#R Rift +15#! (#Y 60#! means war)\nKantakouzenos family influence #G −100#!"
 oe_cw2.5.b: "Let them keep it"
 oe_cw2.5.b.tt: "#G Rift −10#! (#Y 60#! means war)\n#R [oe_tu_authority|e] −3#!"
 oe_cw2.6.t: "Matthew Asks for Land"
 oe_cw2.6.desc: "Kantakouzenos's eldest son #color_yellow;bold Matthew#! wants an appanage of his own: eastern Thrace around Adrianople, in name to guard the Serbian border for the empire. Everyone can see that with land he will have an army."
 oe_cw2.6.a: "Grant it"
 oe_cw2.6.a.tt: "#G Rift −10#! (#Y 60#! means war)\nMatthew receives an appanage around Adrianople; #R if it comes to war, it will be his base#!"
 oe_cw2.6.b: "Refuse"
 oe_cw2.6.b.tt: "#R Rift +15#! (#Y 60#! means war)"
 oe_cw2.7.t: "John V Takes Up Arms"
 oe_cw2.7.desc: "John V has raised the Palaiologan standard in western Thrace. Venetian money, Dušan's promises and the growing resentment of the Kantakouzenoi in the capital are all on his side. The second civil war has begun."
 oe_cw2.7.a: "Civil war again"
 oe_cw2.7.a.tt: "John V rises with western Thrace; the situation 'The Second Civil War' begins"
 oe_cw2.8.t: "Matthew Proclaimed"
 oe_cw2.8.desc: "Matthew has been proclaimed emperor by his men at Adrianople, and his father in the capital says nothing. The Kantakouzenoi will not give up what they won; the second civil war has begun."
 oe_cw2.8.a: "Civil war again"
 oe_cw2.8.a.tt: "Matthew rises with eastern Thrace; the situation 'The Second Civil War' begins"
 oe_cw2.9.t: "An Uneasy Concord"
 oe_cw2.9.desc: "The rift has not torn open after all. The two houses agree in the palace to keep to their places, and the empire is spared a second civil war for now. Everyone knows the peace rests on mutual suspicion."
 oe_cw2.9.a: "May it last"
 oe_cw2.9.a.tt: "Gain [ShowModifier('oe_cw2_concord')] for #Y 10#! years"
 oe_cw2.10.t: "Süleyman Crosses the Straits"
 oe_cw2.10.desc: "Orhan's son #color_yellow;bold Süleyman#! has crossed the straits with ten thousand Ottoman troops to help the Kantakouzenoi. They retake the towns of Thrace for them, and plunder them while they are about it. Süleyman's price is the castle of #color_yellow;bold Tzympe#! on the Gallipoli peninsula."
 oe_cw2.10.a: "Give him Tzympe"
 oe_cw2.10.a.tt: "#G Tide −15#! (in favour of the Kantakouzenoi)\nOttoman troops fight for us (#G tide −1.5#! a month)\nGallipoli gains [ShowModifier('oe_cw2_tzympe')]: the Ottomans now have a foothold in Europe"
 oe_cw2.10.b: "Pay in gold only"
 oe_cw2.10.b.tt: "#G Tide −8#! (in favour of the Kantakouzenoi)\nOttoman troops help for one year (#G tide −0.5#! a month)"
 oe_cw2.10.c: "Pay Orhan to recall them"
 oe_cw2.10.c.tt: "The Ottomans stay out of this war"
 oe_cw2.10.d: "We cannot stop it"
 oe_cw2.10.d.tt: "#R Tide −15#! (in favour of the Kantakouzenoi)\nOttoman troops fight for the Kantakouzenoi (#R tide −1.5#! a month)\nGallipoli gains [ShowModifier('oe_cw2_tzympe')]: the Ottomans now have a foothold in Europe"
 oe_cw2.11.t: "Dušan's Horsemen"
 oe_cw2.11.desc: "Stefan Dušan has sent four thousand Serbian horsemen to help John V. As Dušan sees it, the longer the empire fights itself, the easier Macedonia will fall into his hands."
 oe_cw2.11.a: "We cannot stop it"
 oe_cw2.11.a.tt: "#R Tide +10#! (in favour of the Palaiologan side)\nSerbian horse fight for John V (#R tide +0.5#! a month)"
 oe_cw2.11.b: "Buy Dušan off with a border town"
 oe_cw2.11.b.tt: "#R Serbia takes up to 1 place on the Macedonian border#! and stays out"
 oe_cw2.11.c: "Accept the help"
 oe_cw2.11.c.tt: "#G Tide +10#! (in favour of the Palaiologan side)\nSerbian horse fight for us (#G tide +0.5#! a month)"
 oe_cw2.11.d: "Decline: better not let the wolf in"
 oe_cw2.12.t: "The Battle of Didymoteicho"
 oe_cw2.12.desc: "Süleyman's Ottomans meet the Serbian horse on the plain outside #color_yellow;bold Didymoteicho#!. The Turks outnumber them two to one, and the Serbs are all but wiped out. It is the Ottomans' first victory in Europe, and the people of Thrace have seen it."
 oe_cw2.12.a: "The Ottomans win their first battle in Europe"
 oe_cw2.12.a.tt: "#G Tide −15#! (in favour of the Kantakouzenoi)\nThe Serbian horse are gone"
 oe_cw2.12.b: "The Ottomans win their first battle in Europe"
 oe_cw2.12.b.tt: "#R Tide −15#! (in favour of the Kantakouzenoi)\nThe Serbian horse are gone"
 oe_cw2.13.t: "Gattilusio's Galleys"
 oe_cw2.13.desc: "John V's cause is losing ground. Now a Genoese adventurer appears, #color_yellow;bold Francesco Gattilusio#!, with a few galleys and a few hundred desperate men. He offers to break into the capital for John V, on condition that he marries John V's sister Maria."
 oe_cw2.13.a: "Buy Gattilusio off"
 oe_cw2.13.a.tt: "#G Tide −5#! (in favour of the Kantakouzenoi)"
 oe_cw2.13.b: "We cannot stop it"
 oe_cw2.13.b.tt: "#R Tide +20#! (in favour of the Palaiologan side)\nGattilusio's men work for John V inside the capital (#R tide +1#! a month)"
 oe_cw2.13.c: "Agree to the match"
 oe_cw2.13.c.tt: "#G Tide +20#! (in favour of the Palaiologan side)\nGattilusio fights for us (#G tide +1#! a month); after the war Lesbos is to be his dowry"
 oe_cw2.13.d: "Refuse"
 oe_cw2.14.t: "Gallipoli"
 oe_cw2.14.desc: "The earthquake brought down the walls of #color_yellow;bold Gallipoli#!; Süleyman's men moved in, rebuilt them and will not leave. In the capital everyone is cursing the Kantakouzenoi for bringing the Turks into Europe."
 oe_cw2.14.a: "Send to Orhan to demand it back"
 oe_cw2.14.a.tt: "#R Tide +5#! (in favour of the Palaiologan side)"
 oe_cw2.14.b: "Nothing to be done"
 oe_cw2.14.b.tt: "#R Tide +10#! (in favour of the Palaiologan side)"
 oe_cw2.14.c: "Make the most of it"
 oe_cw2.14.c.tt: "#G Tide +10#! (in favour of the Palaiologan side)"
 oe_cw2.15.t: "Heavy Taxes"
 oe_cw2.15.desc: "To pay the debts and the soldiers the emperor must raise new taxes. Merchants and townsmen are loud in complaint, and even the old Kantakouzenist captains urge him to go easy."
 oe_cw2.15.a: "Collect them anyway"
 oe_cw2.15.a.tt: "#R Tide +10#! (in favour of the Palaiologan side)"
 oe_cw2.15.b: "Drop the new taxes"
 oe_cw2.15.b.tt: "#G Tide −5#! (in favour of the Kantakouzenoi)"
 oe_cw2.16.t: "The Monk Joasaph"
 oe_cw2.16.desc: "The elder Kantakouzenos has taken the tonsure in a monastery under the name #color_yellow;bold Joasaph#!. John V is the sole master of the empire. Matthew's men may still be in Thrace, but the Kantakouzenoi have lost."
 oe_cw2.16.a: "The empire belongs to John V"
 oe_cw2.16.a.tt: "John V is sole emperor; Kantakouzenos takes the cowl and his family's influence #Y −200#!; #G legitimacy rises#!"
 oe_cw2.17.t: "The Kantakouzenos Crown"
 oe_cw2.17.desc: "The Palaiologan standard has fallen. The Kantakouzenoi keep the crown, and Matthew will sit on his father's throne. The empire has a new dynasty, but two civil wars have emptied Thrace."
 oe_cw2.17.a: "A new dynasty"
 oe_cw2.17.a.tt: "Matthew becomes heir; John V is kept under guard in the palace; #G stability rises#!"
 oe_cw2.17.b: "A new dynasty"
 oe_cw2.17.b.tt: "Matthew becomes emperor; John V is deposed and kept in the palace; #G stability rises#!"
 oe_cw2.18.t: "A Divided Empire"
 oe_cw2.18.desc: "Four years of war, and neither side can swallow the other. A line is drawn across Thrace: Matthew holds Adrianople as co-emperor, John V holds the capital. The empire is still one in name, but in fact it is split in two."
 oe_cw2.18.a: "At least the fighting has stopped"
 oe_cw2.18.a.tt: "The rebels' towns return to the empire; gain [ShowModifier('oe_cw2_divided')] for #Y 10#! years"
 oe_cw2.19.t: "Matthew's Fate"
 oe_cw2.19.desc: "Matthew led five thousand Turks against the Serbs at Serres and was captured outside the city by Vojihna, lord of Drama. The Serbs have named a ransom. If the emperor outbids everyone, Matthew is his."
 oe_cw2.19.a: "Ransom him and make him renounce the title"
 oe_cw2.19.a.tt: "Matthew renounces the imperial title; he may later go to the Morea"
 oe_cw2.19.b: "Leave him with the Serbs"
 oe_cw2.19.b.tt: "Matthew dies in Serbian captivity"
 oe_cw2.20.t: "A Dowry of Lesbos"
 oe_cw2.20.desc: "Gattilusio has married the emperor's sister Maria, and the bargain was the island of #color_yellow;bold Lesbos#! as her dowry. He would rule it as the empire's vassal, with the emperor's cross still struck on his coins."
 oe_cw2.20.a: "Make him Lord of Lesbos"
 oe_cw2.20.a.tt: "Mytilene and Molyvos gain [ShowModifier('oe_cw2_gattilusio_fief')]"
 oe_cw2.20.b: "Break the promise"
 oe_cw2.21.t: "The Themes Choose Again"
 oe_cw2.21.desc: "Another civil war, and the strategoi are watching again. Those loyal to the emperor have sent troops; the disaffected are writing to the rebels."
 oe_cw2.21.a: "Pardon the waverers and keep them"
 oe_cw2.21.a.tt: "#R [oe_tu_authority|e] −5#!\nEstranged themes: loyalty #G +15#! (also in their targets for #Y 5#! years), they stay\n#R Treasonous themes rise next month and join the rebels#!\nEach loyal theme brings the empire #G 2#! months of manpower"
 oe_cw2.21.b: "Let them go where they will"
 oe_cw2.21.b.tt: "#R Estranged and treasonous themes rise next month and join the rebels#!\nEach loyal theme brings the empire #G 2#! months of manpower"
