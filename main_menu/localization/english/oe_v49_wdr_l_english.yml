l_english:
 oe_sit_v49_wonders_race:0 "Grand World Megaprojects Race"
 oe_sit_v49_wonders_race_desc:0 "Across every continent, ambitious sovereigns pour overflowing treasuries into 26 iconic three-tier megaprojects — canals, domes, observatories, exchanges, shipyards, and sacred sanctuaries — vying to raise Tier I Foundations into Tier II Monumental landmarks and Tier III Eternal Wonders."
 oe_v49_wdr_end_eternal_age:0 "Golden Age of Eternal Wonders"
 oe_v49_wdr_end_eternal_age_desc:0 "Monumental engineering has reshaped the globe: Tier III Eternal Wonders crown the continents and leave a permanent inheritance of prestige, science, and trade."
 oe_v49_wdr_end_grand_monuments:0 "Age of Grand Monuments"
 oe_v49_wdr_end_grand_monuments_desc:0 "Over half of the world's iconic megaprojects now stand completed, binding overland and oceanic commerce through landmark infrastructure."
 oe_v49_wdr_end_modern_horizon:0 "Dawn of Modern Civil Engineering"
 oe_v49_wdr_end_modern_horizon_desc:0 "Centuries of monumental drafts give way to standardized modern engineering, while every megaproject site remains open for continued construction."
 oe_v49_wdr_map_tier3_tt:0 "Tier III Eternal Wonder completed at this location."
 oe_v49_wdr_map_tier2_tt:0 "Tier II Monumental Megaproject completed at this location."
 oe_v49_wdr_map_tier1_tt:0 "Tier I Foundation Megaproject established at this location."
 oe_v49_wdr_map_site_tt:0 "Historic World Megaproject site available for construction."
 oe_v49_wdr_legend_tier3:0 "Tier III Eternal Wonder"
 oe_v49_wdr_legend_tier2:0 "Tier II Monumental Megaproject"
 oe_v49_wdr_legend_tier1:0 "Tier I Foundation Megaproject"
 oe_v49_wdr_legend_site:0 "Available Megaproject Site"
 OE_V49_WDR_GUI_HDR_PLAYER:0 "Your Completed Megaprojects"
 OE_V49_WDR_GUI_HDR_GLOBAL:0 "Global Wonders Completed"
 OE_V49_WDR_GUI_CARD_TITLE:0 "26 Three-Tier World Megaprojects"
 OE_V49_WDR_GUI_CARD_BODY:0 "Construct iconic megaprojects in their historic sites (or raise the New Hagia Sophia in any Christian or Hellenic American capital) and upgrade each from Tier I Foundation -> Tier II Monumental -> Tier III Eternal Wonder to invest late-game treasuries into lasting prestige and local mastery."
 OE_V49_WDR_GUI_PLAYER_TIERS_LBL:0 "Your Total Upgrade Tiers"
 OE_V49_WDR_GUI_GLOBAL_TIER3_LBL:0 "Global Tier III Eternal Wonders"
 OE_V49_WDR_GUI_GAUGE_LABEL:0 "Global Architectural Splendor"
 OE_V49_WDR_GUI_FOOTNOTE:0 "Use the situation actions below to fund national construction, directly expedite Tier II & Tier III upgrades, host World Expositions, or proclaim an Architectural Golden Age."
 oe_v49_wdr_suez_canal:0 "Great Suez Maritime Canal"
 oe_v49_wdr_suez_canal_desc:0 "An engineered sea-level channel severing the Isthmus of Suez to join the Mediterranean and Red Sea basins. Upgradeable through three monumental tiers from Foundation Lockworks to an Eternal Maritime Wonder."
 oe_v49_wdr_suez_canal_maint:0 "Great Suez Maritime Canal Upkeep"
 oe_v49_wdr_panama_canal:0 "Panama Isthmus Interoceanic Canal"
 oe_v49_wdr_panama_canal_desc:0 "Stepped stone locks and cut-rock channels spanning the Darien ridge to unite the Atlantic and Pacific oceans. Upgradeable across three monumental tiers."
 oe_v49_wdr_panama_canal_maint:0 "Panama Isthmus Interoceanic Canal Upkeep"
 oe_v49_wdr_corinth_canal:0 "Corinth Isthmus Maritime Cut"
 oe_v49_wdr_corinth_canal_desc:0 "A sheer limestone trench reviving the ancient dream of Periander and Nero, sparing Aegean and Adriatic shipping the perilous Peloponnesian capes. Upgradeable across three tiers."
 oe_v49_wdr_corinth_canal_maint:0 "Corinth Isthmus Maritime Cut Upkeep"
 oe_v49_wdr_grand_canal:0 "Grand Canal Imperial Lockworks"
 oe_v49_wdr_grand_canal_desc:0 "Monumental stone double-locks, hydraulic reservoirs, and imperial grain depots orchestrating inland river transport across the heartland. Upgradeable across three tiers."
 oe_v49_wdr_grand_canal_maint:0 "Grand Canal Imperial Lockworks Upkeep"
 oe_v49_wdr_nova_hagia_sophia:0 "New Hagia Sophia Dome of the New World"
 oe_v49_wdr_nova_hagia_sophia_desc:0 "A soaring pendentive dome and gold-mosaic basilica erected in an American capital, crowning the transatlantic rebirth of classical Christian and Hellenic civilization. Upgradeable across three tiers."
 oe_v49_wdr_nova_hagia_sophia_maint:0 "New Hagia Sophia Dome of the New World Upkeep"
 oe_v49_wdr_trans_siberian_road:0 "Trans-Siberian Imperial Post Road"
 oe_v49_wdr_trans_siberian_road_desc:0 "A fortified network of timber plankways, river ferries, fur depots, and horse-relay stations binding the Urals to the Pacific frontier from Tobolsk. Upgradeable across three tiers."
 oe_v49_wdr_trans_siberian_road_maint:0 "Trans-Siberian Imperial Post Road Upkeep"
 oe_v49_wdr_crystal_pavilion:0 "Grand Crystal Exhibition Pavilion"
 oe_v49_wdr_crystal_pavilion_desc:0 "A breathtaking vault of cast iron and plate glass built to showcase precision machinery, global crafts, and scientific triumphs to visitors from every continent. Upgradeable across three tiers."
 oe_v49_wdr_crystal_pavilion_maint:0 "Grand Crystal Exhibition Pavilion Upkeep"
 oe_v49_wdr_silk_road_caravanserai:0 "Grand Baghdad–Silk Road Caravanserai"
 oe_v49_wdr_silk_road_caravanserai_desc:0 "A fortified walled commercial metropolis of vaulted bazaars, water-cooled arcades, assay offices, and camel courtyards linking the Persian Gulf to Levantine and Eurasian caravans. Upgradeable across three tiers."
 oe_v49_wdr_silk_road_caravanserai_maint:0 "Grand Baghdad–Silk Road Caravanserai Upkeep"
 oe_v49_wdr_sun_plaza_tenochtitlan:0 "Great Sun Plaza of Tenochtitlan"
 oe_v49_wdr_sun_plaza_tenochtitlan_desc:0 "A monumental lakeside ceremonial plaza framed by stepped volcanic-stone pyramids, astronomical causeways, and irrigated chinampa gardens. Upgradeable across three tiers."
 oe_v49_wdr_sun_plaza_tenochtitlan_maint:0 "Great Sun Plaza of Tenochtitlan Upkeep"
 oe_v49_wdr_samarkand_observatory:0 "Grand Observatory of Samarkand"
 oe_v49_wdr_samarkand_observatory_desc:0 "A colossal subterranean marble sextant paired with turquoise-tiled madrasas where astronomers compile star tables of unmatched accuracy. Upgradeable across three tiers."
 oe_v49_wdr_samarkand_observatory_maint:0 "Grand Observatory of Samarkand Upkeep"
 oe_v49_wdr_jingdezhen_kilns:0 "Imperial Porcelain Kilns of Jingdezhen"
 oe_v49_wdr_jingdezhen_kilns_desc:0 "A sprawling complex of dragon kilns, kaolin clay mills, and cobalt-glaze ateliers turning out flawless white-and-blue porcelain coveted across the globe. Upgradeable across three tiers."
 oe_v49_wdr_jingdezhen_kilns_maint:0 "Imperial Porcelain Kilns of Jingdezhen Upkeep"
 oe_v49_wdr_canton_oceanic_yards:0 "Canton Oceanic Shipyards & Hongs"
 oe_v49_wdr_canton_oceanic_yards_desc:0 "Deep-water drydocks, teakwood hull slipways, and cosmopolitan merchant factories anchoring the South China Sea and trans-Pacific maritime trade. Upgradeable across three tiers."
 oe_v49_wdr_canton_oceanic_yards_maint:0 "Canton Oceanic Shipyards & Hongs Upkeep"
 oe_v49_wdr_andean_royal_highway:0 "Andean Royal Highway Nexus"
 oe_v49_wdr_andean_royal_highway_desc:0 "Stone-paved mountain causeways, braided suspension bridges, and cliffside storehouses knitting the high Andes together through Quito. Upgradeable across three tiers."
 oe_v49_wdr_andean_royal_highway_maint:0 "Andean Royal Highway Nexus Upkeep"
 oe_v49_wdr_alexandria_pharos:0 "Restored Pharos Lighthouse of Alexandria"
 oe_v49_wdr_alexandria_pharos_desc:0 "A towering three-tiered limestone lighthouse crowned with polished bronze mirrors guiding Mediterranean fleets safely into the Great Harbor by day and night. Upgradeable across three tiers."
 oe_v49_wdr_alexandria_pharos_maint:0 "Restored Pharos Lighthouse of Alexandria Upkeep"
 oe_v49_wdr_versailles_palace:0 "Grand Gardens & Palace of Versailles"
 oe_v49_wdr_versailles_palace_desc:0 "An opulent baroque palace of mirrored galleries, geometric parterre gardens, and hydraulic fountains radiating courtly prestige across every chancery. Upgradeable across three tiers."
 oe_v49_wdr_versailles_palace_maint:0 "Grand Gardens & Palace of Versailles Upkeep"
 oe_v49_wdr_vienna_academy:0 "Imperial Opera & Academy of Vienna"
 oe_v49_wdr_vienna_academy_desc:0 "A grand limestone opera house and natural-philosophy academy along the Danube drawing composers, jurists, and diplomats from every European realm. Upgradeable across three tiers."
 oe_v49_wdr_vienna_academy_maint:0 "Imperial Opera & Academy of Vienna Upkeep"
 oe_v49_wdr_amsterdam_bourse:0 "Grand World Exchange of Amsterdam"
 oe_v49_wdr_amsterdam_bourse_desc:0 "A colonnaded brick-and-stone financial courtyard where joint-stock shares, maritime insurance, and commodity futures are priced daily for global trade. Upgradeable across three tiers."
 oe_v49_wdr_amsterdam_bourse_maint:0 "Grand World Exchange of Amsterdam Upkeep"
 oe_v49_wdr_venice_arsenal:0 "Grand Slipways of the Venetian Arsenal"
 oe_v49_wdr_venice_arsenal_desc:0 "A walled complex of covered drydocks, ropewalks, cannon foundries, and standardized assembly basins capable of fitting out an entire fleet at breathtaking speed. Upgradeable across three tiers."
 oe_v49_wdr_venice_arsenal_maint:0 "Grand Slipways of the Venetian Arsenal Upkeep"
 oe_v49_wdr_lisbon_casa_india:0 "Casa da India Grand Navigation Hall"
 oe_v49_wdr_lisbon_casa_india_desc:0 "An Atlantic palace of master rutters, astrolabe workshops, spice customs vaults, and royal chartrooms directing intercontinental sea routes from the Tagus estuary. Upgradeable across three tiers."
 oe_v49_wdr_lisbon_casa_india_maint:0 "Casa da India Grand Navigation Hall Upkeep"
 oe_v49_wdr_neva_admiralty:0 "Imperial Admiralty Spire of the Neva"
 oe_v49_wdr_neva_admiralty_desc:0 "A monumental neoclassical naval headquarters and gilded needle-spire shipyard anchoring northern sea power where the Neva meets the Gulf of Finland. Upgradeable across three tiers."
 oe_v49_wdr_neva_admiralty_maint:0 "Imperial Admiralty Spire of the Neva Upkeep"
 oe_v49_wdr_delhi_red_fort:0 "Imperial Diwan of the Red Fort"
 oe_v49_wdr_delhi_red_fort_desc:0 "An immense red-sandstone citadel enclosing white marble audience halls, inlaid jeweled pavilions, and lush paradise gardens overlooking the Yamuna plains. Upgradeable across three tiers."
 oe_v49_wdr_delhi_red_fort_maint:0 "Imperial Diwan of the Red Fort Upkeep"
 oe_v49_wdr_kyoto_golden_pavilion:0 "Golden Pavilion Garden of Kyoto"
 oe_v49_wdr_kyoto_golden_pavilion_desc:0 "A serene three-story gold-leafed pavilion mirrored in a lotus pond and framed by sculpted pine gardens, epitomizing classical courtly and aesthetic harmony. Upgradeable across three tiers."
 oe_v49_wdr_kyoto_golden_pavilion_maint:0 "Golden Pavilion Garden of Kyoto Upkeep"
 oe_v49_wdr_cairo_al_azhar:0 "Grand Library of Al-Azhar"
 oe_v49_wdr_cairo_al_azhar_desc:0 "A storied complex of marble courtyards, scriptoria, and vaulted manuscript galleries preserving centuries of jurisprudence, medicine, and philosophy beside the Nile. Upgradeable across three tiers."
 oe_v49_wdr_cairo_al_azhar_maint:0 "Grand Library of Al-Azhar Upkeep"
 oe_v49_wdr_timbuktu_sankore:0 "Grand University of Sankore"
 oe_v49_wdr_timbuktu_sankore_desc:0 "A monumental earthen-architecture university quarter of pyramidal minarets, manuscript vaults, and desert caravan halls standing at the crossroads of the Niger and Sahara. Upgradeable across three tiers."
 oe_v49_wdr_timbuktu_sankore_maint:0 "Grand University of Sankore Upkeep"
 oe_v49_wdr_aksum_rock_sanctuary:0 "Monolithic Sanctuary of Aksum"
 oe_v49_wdr_aksum_rock_sanctuary_desc:0 "A breathtaking sanctuary of carved granite obelisks, rock-hewn basilicas, and highland pilgrimage terraces honoring the timeless heritage of the Horn of Africa. Upgradeable across three tiers."
 oe_v49_wdr_aksum_rock_sanctuary_maint:0 "Monolithic Sanctuary of Aksum Upkeep"
 oe_v49_wdr_cape_beacon:0 "Oceanic Beacon of the Cape of Good Hope"
 oe_v49_wdr_cape_beacon_desc:0 "A mighty stone breakwater, stormproof lighthouse, and victualling shipyard guarding the meeting of the Atlantic and Indian oceans around Africa's southern tip. Upgradeable across three tiers."
 oe_v49_wdr_cape_beacon_maint:0 "Oceanic Beacon of the Cape of Good Hope Upkeep"
 oe_v49_wdr_act_charter_fund:0 "Charter Imperial Megaproject Fund"
 oe_v49_wdr_act_charter_fund_desc:0 "Allocate dedicated treasury bullion to accelerate nationwide monumental construction and quarry supply chains."
 oe_v49_wdr_act_charter_fund_tt:0 "Accelerates national building construction and advances the Global Wonders Race."
 oe_v49_wdr_act_expedite_tier2:0 "Expedite Tier II Monumental Expansion"
 oe_v49_wdr_act_expedite_tier2_desc:0 "Invest treasury surplus directly into one of our Tier I Foundation Megaprojects, elevating it immediately to Tier II Monumental stature."
 oe_v49_wdr_act_expedite_tier2_tt:0 "Upgrades one owned Tier I Megaproject directly to Tier II Monumental status (+1 building level, local prosperity & development)."
 oe_v49_wdr_act_crown_tier3:0 "Crown Tier III Eternal Wonder"
 oe_v49_wdr_act_crown_tier3_desc:0 "Lavish imperial bullion, marble, and master artisans upon a Tier II Monumental Megaproject to crown it a Tier III Eternal Wonder for the ages."
 oe_v49_wdr_act_crown_tier3_tt:0 "Upgrades one owned Tier II Megaproject directly to Tier III Eternal Wonder (+1 building level, +15 Prestige, Eternal Wonder acclaim)."
 oe_v49_wdr_act_world_exposition:0 "Host World Exposition at Wonder"
 oe_v49_wdr_act_world_exposition_desc:0 "Invite ambassadors, merchant guilds, and inventors from across the world to showcase crafts and trade beneath our completed megaproject."
 oe_v49_wdr_act_world_exposition_tt:0 "Boosts maritime and overland trade, cultural influence, and launches the Grand World Exposition celebration."
 oe_v49_wdr_act_foreign_architects:0 "Recruit Foreign Master Architects"
 oe_v49_wdr_act_foreign_architects_desc:0 "Summon renowned dome engineers, surveyors, and hydraulic theorists from abroad to elevate domestic science and architectural practice."
 oe_v49_wdr_act_foreign_architects_tt:0 "Improves research speed, construction efficiency, and cultural tradition across the realm."
 oe_v49_wdr_act_canal_surplus:0 "Redirect Treasury Surplus to Canal Works"
 oe_v49_wdr_act_canal_surplus_desc:0 "Channel late-game fiscal surpluses into canal locks, harbor dredging, and feeder waterways, revitalizing prosperity in our capital and commercial hubs."
 oe_v49_wdr_act_canal_surplus_tt:0 "Boosts maritime trade, national production, monthly prosperity, and improves capital prosperity."
 oe_v49_wdr_act_masonry_guilds:0 "Standardize Imperial Masonry Guilds"
 oe_v49_wdr_act_masonry_guilds_desc:0 "Enact uniform imperial gauges for cut stone, brick, mortar, and structural timber to streamline workshops and public works nationwide."
 oe_v49_wdr_act_masonry_guilds_tt:0 "Improves national production efficiency, raw material output, and construction efficiency."
 oe_v49_wdr_act_architectural_golden_age:0 "Proclaim Architectural Golden Age"
 oe_v49_wdr_act_architectural_golden_age_desc:0 "Having completed multiple iconic megaprojects or crowned a Tier III Eternal Wonder, proclaim an Architectural Golden Age hailed by every court on earth."
 oe_v49_wdr_act_architectural_golden_age_tt:0 "Requires owning >= 2 Megaprojects or >= 1 Tier III Eternal Wonder. Proclaims an Architectural Golden Age."
 STATIC_MODIFIER_NAME_oe_v49_wdr_mod_imperial_fund:0 "Imperial Megaproject Charter Fund"
 STATIC_MODIFIER_DESC_oe_v49_wdr_mod_imperial_fund:0 "Ring-fenced treasury appropriations mobilize quarries, timber yards, and master masons for monumental construction, temporarily straining routine fiscal receipts."
 STATIC_MODIFIER_NAME_oe_v49_wdr_mod_tier2_expansion:0 "Tier II Monumental Expansion Works"
 STATIC_MODIFIER_DESC_oe_v49_wdr_mod_tier2_expansion:0 "State engineers double down on vaulting, hydraulic locks, and colonnades to elevate foundation projects into regional landmarks while drawing labor from ordinary estates."
 STATIC_MODIFIER_NAME_oe_v49_wdr_mod_eternal_wonder_crown:0 "Laureate of an Eternal Wonder"
 STATIC_MODIFIER_DESC_oe_v49_wdr_mod_eternal_wonder_crown:0 "Crowning a Tier III Eternal Wonder places the realm among history's premier builders, captivating foreign courts even as monumental upkeep weighs on the exchequer."
 STATIC_MODIFIER_NAME_oe_v49_wdr_mod_world_exposition:0 "Host of the Grand World Exposition"
 STATIC_MODIFIER_DESC_oe_v49_wdr_mod_world_exposition:0 "Merchants, envoys, and artisans flocking to the realm's completed wonders stimulate overland and maritime trade while gently heating urban prices."
 STATIC_MODIFIER_NAME_oe_v49_wdr_mod_foreign_architects:0 "Foreign Master Architects Guild"
 STATIC_MODIFIER_DESC_oe_v49_wdr_mod_foreign_architects:0 "Invited geometricians, dome builders, and hydraulic masters inject fresh engineering methods across the realm, stirring mild resentment among traditional noble patrons."
 STATIC_MODIFIER_NAME_oe_v49_wdr_mod_canal_surplus:0 "Canal & Hydraulic Surplus Works"
 STATIC_MODIFIER_DESC_oe_v49_wdr_mod_canal_surplus:0 "Channeling fiscal surpluses into lockworks, quays, and feeder waterways lifts maritime logistics and workshop output while empowering urban syndicates over the crown."
 STATIC_MODIFIER_NAME_oe_v49_wdr_mod_masonry_guilds:0 "Standardized Imperial Masonry Guilds"
 STATIC_MODIFIER_DESC_oe_v49_wdr_mod_masonry_guilds:0 "Uniform ashlar gauges, timber tolerances, and apprentice charters streamline state workshops while curbing private municipal guild monopolies."
 STATIC_MODIFIER_NAME_oe_v49_wdr_mod_architectural_golden_age:0 "Proclaimed Architectural Golden Age"
 STATIC_MODIFIER_DESC_oe_v49_wdr_mod_architectural_golden_age:0 "An empire adorned with multiple grand wonders stands at the summit of global prestige and scholarly renown, sustained by lavish state patronage."
 STATIC_MODIFIER_NAME_oe_v49_wdr_mod_maritime_wonder_boom:0 "Megaproject Commercial Corridor"
 STATIC_MODIFIER_DESC_oe_v49_wdr_mod_maritime_wonder_boom:0 "New canals, beacons, and shipyards slash transit times and swell maritime merchant capacity while requiring vigilant naval escort upkeep."
 STATIC_MODIFIER_NAME_oe_v49_wdr_mod_scholarly_wonder_beacon:0 "Wonder-Era Scientific & Artisanal Beacon"
 STATIC_MODIFIER_DESC_oe_v49_wdr_mod_scholarly_wonder_beacon:0 "Observatories, libraries, and master craft halls attached to great megaprojects accelerate scholarship and precision crafts while straining clerical and court stipends."
 STATIC_MODIFIER_NAME_oe_v49_wdr_mod_imperial_wonder_splendor:0 "Monumental Imperial Splendor"
 STATIC_MODIFIER_DESC_oe_v49_wdr_mod_imperial_wonder_splendor:0 "Soaring domes, palaces, and ceremonial plazas project unmistakable grandeur abroad while tempting courtly extravagance."
 STATIC_MODIFIER_NAME_oe_v49_wdr_mod_eternal_wonders_legacy:0 "Legacy of the Eternal Wonders Race"
 STATIC_MODIFIER_DESC_oe_v49_wdr_mod_eternal_wonders_legacy:0 "Generations of monumental masonry, canals, and halls leave a permanent engineering and cultural inheritance across the realm, demanding steady upkeep."
 STATIC_MODIFIER_NAME_oe_v49_wdr_mod_grand_monuments_legacy:0 "Age of Grand Monuments"
 STATIC_MODIFIER_DESC_oe_v49_wdr_mod_grand_monuments_legacy:0 "Completed landmarks across the continents bind regional markets and proud civic traditions together at modest ongoing maintenance expense."
 STATIC_MODIFIER_NAME_oe_v49_wdr_mod_modern_engineering_legacy:0 "Dawn of Modern Civil Engineering"
 STATIC_MODIFIER_DESC_oe_v49_wdr_mod_modern_engineering_legacy:0 "Centuries of ambitious megaproject drafts mature into disciplined industrial surveying and public works, even as old artisanal guilds lose ground."
 oe_v49_wdr.1.title:0 "Waters Joined at the Isthmus of Suez"
 oe_v49_wdr.1.desc:0 "At dawn the final earthen cofferdam breaks beneath bronze sluice gates, and the azure tides of the Mediterranean surge south to meet the warm currents of the Red Sea. Merchant captains from Alexandria to Calicut hail the shortening of the Old World sea lanes by half a continent, while royal engineers present plans for masonry quays and customs fortresses."
 oe_v49_wdr.1.a:0 "Charter an Open International Tollway"
 oe_v49_wdr.1.b:0 "Fortify the Lockworks as an Imperial Chokepoint"
 oe_v49_wdr.1.c:0 "Reinvest Canal Surpluses into Desert Oasis Towns"
 oe_v49_wdr.2.title:0 "The Two Oceans Embrace at Panama"
 oe_v49_wdr.2.desc:0 "Through fever-haunted jungle ridges and basalt cliffs, thousands of surveyors and stonecutters have carved a terraced staircase of water linking the Caribbean to the South Sea. As the first treasure galleon glides through the upper lock chamber, maritime merchants celebrate the birth of a direct highway between Europe, Peru, and the Far East."
 oe_v49_wdr.2.a:0 "Establish the Interoceanic Clearing House"
 oe_v49_wdr.2.b:0 "Build Drainage Hospitals & Quarantine Quays"
 oe_v49_wdr.2.c:0 "Reserve Priority Convoy Rights for Royal Fleets"
 oe_v49_wdr.3.title:0 "The Ancient Cut of Corinth Completed"
 oe_v49_wdr.3.desc:0 "Where tyrants of antiquity and Roman emperors broke ground only to be halted by rock and war, sheer honey-gold limestone walls now tower above a calm turquoise waterway. Galleys and grain brigs pass in a single afternoon between the Corinthian and Saronic gulfs, reviving the classical crossroads of Hellas."
 oe_v49_wdr.3.a:0 "Revive the Isthmian Commercial Fair"
 oe_v49_wdr.3.b:0 "Inscribe Imperial Triumphal Stele Along the Cliffs"
 oe_v49_wdr.3.c:0 "Expand Twin Arsenal Slipways at Both Entrances"
 oe_v49_wdr.4.title:0 "The Ten-Thousand-Boat Lockworks of Yangzhou"
 oe_v49_wdr.4.desc:0 "Tiered granite pound-locks and silt-diversion sluices now regulate the confluence of river and canal at Yangzhou with clockwork precision. Endless convoys of tribute grain barges, salt junks, and silk boats glide northward without portage, turning the riverine hub into a marvel of hydraulic statecraft."
 oe_v49_wdr.4.a:0 "Expand Ever-Normal Tribute Granaries"
 oe_v49_wdr.4.b:0 "Lease Side-Locks to Salt & Silk Guilds"
 oe_v49_wdr.4.c:0 "Publish an Illustrated Treatise on Hydraulic Locks"
 oe_v49_wdr.5.title:0 "The Golden Dome Rises Over the New World"
 oe_v49_wdr.5.desc:0 "Forty clerestory windows encircle the floating pendentive dome like a ring of fire, showering golden light across porphyry columns quarried on a new continent. As choirs chant beneath freshly set mosaics, chroniclers proclaim that the architectural majesty of the ancient Bosporus has found an eternal western seat."
 oe_v49_wdr.5.a:0 "Consecrate the Basilica with an Ecumenical Synod"
 oe_v49_wdr.5.b:0 "Endow a Transatlantic Mosaic & Architecture School"
 oe_v49_wdr.5.c:0 "Open the Forecourt Hospices to New-World Pilgrims"
 oe_v49_wdr.6.title:0 "The Great Post Road Spans the Taiga"
 oe_v49_wdr.6.desc:0 "Through frozen marshland and silver birch forests, corduroy roads, timber bridges, and heated relay inns now radiate outward from Tobolsk's stone kremlin. Imperial couriers ride in weeks what once required entire seasons, while fur caravans, iron ingots, and tea chests flow steadily across the roof of Eurasia."
 oe_v49_wdr.6.a:0 "Guarantee Armed Escorts for Fur & Tea Caravans"
 oe_v49_wdr.6.b:0 "Settle Frontier Engineers & Foundry Villages"
 oe_v49_wdr.6.c:0 "Standardize Relay Couriers Across All Governorates"
 oe_v49_wdr.7.title:0 "Sunlight Through the Grand Crystal Vaults"
 oe_v49_wdr.7.desc:0 "Enclosing mature elms beneath soaring iron ribs and thousands of gleaming panes, the Grand Crystal Pavilion dazzles envoys and inventors alike. Steam models, celestial globes, and fine textiles stand side by side as crowds marvel at the dawn of an engineered age."
 oe_v49_wdr.7.a:0 "Award Royal Prizes for Mechanical Innovation"
 oe_v49_wdr.7.b:0 "Sell Pavilion Charters to Merchant Syndicates"
 oe_v49_wdr.7.c:0 "Host a Grand Diplomatic Gala Under the Glass Nave"
 oe_v49_wdr.8.title:0 "Caravans Converge on the Great Bazaar of Baghdad"
 oe_v49_wdr.8.desc:0 "Beneath tiled iwans and shaded brick cupolas beside the Tigris, merchants speaking Persian, Arabic, Greek, Venetian, and Chinese weigh saffron, silk, and silver bills of exchange. The Grand Caravanserai restores Baghdad's legendary radiance as the beating heart of overland Eurasian commerce."
 oe_v49_wdr.8.a:0 "Guarantee Safe-Conduct & Unified Bills of Credit"
 oe_v49_wdr.8.b:0 "Revive the Translators' Wing Beside the Caravanserai"
 oe_v49_wdr.8.c:0 "Reconstruct Tigris Irrigation Canals Around the Hub"
 oe_v49_wdr.9.title:0 "Dawn Strikes the Great Sun Plaza of Tenochtitlan"
 oe_v49_wdr.9.desc:0 "On the equinox, the rising sun aligns directly along the stone causeway into the heart of the Great Sun Plaza, illuminating carved basalt friezes and floating chinampa gardens across Lake Texcoco. Envoys from highland and coastal realms alike stand awestruck by the valley's civic splendor."
 oe_v49_wdr.9.a:0 "Expand the Lake Causeways & Chinampa Gardens"
 oe_v49_wdr.9.b:0 "Proclaim the Solar Calendar Festival of All Provinces"
 oe_v49_wdr.9.c:0 "Open the Great Plaza Market to Obsidian & Gold Guilds"
 oe_v49_wdr.10.title:0 "The Star Tables of Samarkand Unveiled"
 oe_v49_wdr.10.desc:0 "Along the forty-meter marble meridian arc sunk deep into Kuhak Hill, astronomers measure solar altitude to fractions of an arc-minute. Their newly copied zij star tables spread swiftly to courts in Cairo, Constantinople, Delhi, and Beijing, cementing Samarkand as a beacon of mathematical precision."
 oe_v49_wdr.10.a:0 "Commission Master Copies for Every Provincial Academy"
 oe_v49_wdr.10.b:0 "Endow Celestial Navigation Charts for Royal Fleets"
 oe_v49_wdr.10.c:0 "Beautify the Registan Plaza with Azure Tilework"
 oe_v49_wdr.11.title:0 "Smoke of Ten Thousand Kilns Rises Over Jingdezhen"
 oe_v49_wdr.11.desc:0 "Night turns luminous along the Chang River as hundreds of terraced dragon kilns glow white-hot with cobalt-painted porcelain. Foreign ambassadors vie for imperial presentation vases while merchant guilds pack crates destined for Nagasaki, Lisbon, Amsterdam, and Istanbul."
 oe_v49_wdr.11.a:0 "Charter Global Export Porcelain Guilds"
 oe_v49_wdr.11.b:0 "Reserve Finest Cobalt Porcelains for Diplomatic Gifts"
 oe_v49_wdr.11.c:0 "Invest in Kaolin Refining & Kiln Heat Engineering"
 oe_v49_wdr.12.title:0 "Forest of Masts Along the Pearl River"
 oe_v49_wdr.12.desc:0 "Huge teakwood keels take shape inside the stone drydocks of Guangzhou even as tea chests, raw silk, and silver reales change hands along the riverside Hong warehouses. Navigating between monsoon winds and ocean currents, Canton's yards launch fleets admired from Malacca to Europe."
 oe_v49_wdr.12.a:0 "Expand the Thirteen Hongs Maritime Credit Guilds"
 oe_v49_wdr.12.b:0 "Commission Watertight-Bulkhead Oceanic Warships"
 oe_v49_wdr.12.c:0 "Dredge the Pearl River Bars & Build Customs Forts"
 oe_v49_wdr.13.title:0 "The Cloud-Piercing Highway of the Andes"
 oe_v49_wdr.13.desc:0 "Carved straight into volcanic slopes above the clouds, stone stairways and vaulted suspension spans now unite Quito with highland mines and coastal harbors. Runners, pack trains, and tax magistrates traverse gorges once deemed impassable in a fraction of the old season."
 oe_v49_wdr.13.a:0 "Stock Mountain Waystations as Highland Relief Depots"
 oe_v49_wdr.13.b:0 "Direct Silver & Copper Convoys Along the Paved Trunk"
 oe_v49_wdr.13.c:0 "Erect Equatorial Astronomical Markers at Quito"
 oe_v49_wdr.14.title:0 "The Flame of Pharos Shines Once More"
 oe_v49_wdr.14.desc:0 "For the first time in centuries, mariners thirty miles out on the Mediterranean spot the blazing parabolic mirror atop the restored Pharos of Alexandria. Cheers echo from harbor moles as ancient wonder and modern maritime optics unite atop the white limestone tower."
 oe_v49_wdr.14.a:0 "Establish the Alexandria Maritime Pilotage Guild"
 oe_v49_wdr.14.b:0 "Found an Optics & Cartography Hall in the Tower Base"
 oe_v49_wdr.14.c:0 "Reinforce the Harbor Breakwaters & Sea Bastions"
 oe_v49_wdr.15.title:0 "The Hall of Mirrors Dazzles All Envoys"
 oe_v49_wdr.15.desc:0 "Three hundred Venetian-cut mirrors reflect gilded chandeliers and terraced canal fountains stretching to the western horizon. Foreign ministers and provincial magnates alike are drawn into the court's radiant ceremonial orbit, setting the benchmark of royal taste across the continent."
 oe_v49_wdr.15.a:0 "Bind High Nobility to Permanent Court Etiquette"
 oe_v49_wdr.15.b:0 "Patronize Royal Tapestry, Mirror & Porcelain Guilds"
 oe_v49_wdr.15.c:0 "Open the Royal Academy of Architecture & Sciences"
 oe_v49_wdr.16.title:0 "Opening Overture at the Imperial Opera of Vienna"
 oe_v49_wdr.16.desc:0 "As a full symphony swells through the gilded acoustic dome, crowned heads, philosophers, and conservatory masters rise in applause. Side by side with the opera stands the new Imperial Academy, hosting debates on jurisprudence, medicine, and astronomy that echo across Central Europe."
 oe_v49_wdr.16.a:0 "Endow Permanent Symphony & Conservatory Chairs"
 oe_v49_wdr.16.b:0 "Fund Natural Philosophy & Medical Research Fellows"
 oe_v49_wdr.16.c:0 "Invite Foreign Courts to an Annual Diplomatic Season"
 oe_v49_wdr.17.title:0 "The Bell Rings Over the Amsterdam World Exchange"
 oe_v49_wdr.17.desc:0 "At noon the brass exchange bell sounds across the arcaded courtyard above the Amstel canals, and brokers trade shares in spice voyages, Baltic grain convoys, and sovereign annuities. Printed price currents carry Amsterdam's quotations within days to every bourse in Europe."
 oe_v49_wdr.17.a:0 "Charter Maritime Insurance & Joint-Stock Clearing"
 oe_v49_wdr.17.b:0 "Enforce Strict Assay Reserves & Anti-Bubble Audits"
 oe_v49_wdr.17.c:0 "Expand Canal Warehouses & Printing Presses"
 oe_v49_wdr.18.title:0 "Standardized Hulls Glide Down the Arsenal Basins"
 oe_v49_wdr.18.desc:0 "Through the lion-guarded water gates of the Arsenal, hulls move steadily from timber ribs to rigging lofts and bronze cannon foundries in an unbroken rhythm. Visiting admirals marvel at an industrial shipworks able to arm and launch an entire squadron between sunrise and vespers."
 oe_v49_wdr.18.a:0 "Expand Standardized Merchant Galley & Carrack Lines"
 oe_v49_wdr.18.b:0 "Dedicate the Great Slipways to Heavy Warships"
 oe_v49_wdr.18.c:0 "Establish a School of Naval Architecture & Hydrodynamics"
 oe_v49_wdr.19.title:0 "The Master Charts of the Casa da India"
 oe_v49_wdr.19.desc:0 "Overlooking the Tagus anchorage where caravels and Indiamen unload cloves, pepper, and cinnamon, the grand limestone halls of the Casa da India house the realm's secret Padrão Real master world map. Pilots, cartographers, and customs factors chart the currents of every ocean."
 oe_v49_wdr.19.a:0 "Monopolize Spice Auctions Along the Tagus Quays"
 oe_v49_wdr.19.b:0 "Train Oceanic Pilots in Celestial Astrolabe Navigation"
 oe_v49_wdr.19.c:0 "Fortify the Estuary Approach & Quay Warehouses"
 oe_v49_wdr.20.title:0 "The Golden Spire Rises Over the Neva"
 oe_v49_wdr.20.desc:0 "Crowned by a gleaming golden weathervane ship visible across the entire delta, the Imperial Admiralty anchors wide granite embankments and sheltered winter slipways. Northern timber, hemp, and cannons converge here to forge a fleet worthy of the open Baltic."
 oe_v49_wdr.20.a:0 "Expand the Baltic Fleet & Ice-Harbor Slipways"
 oe_v49_wdr.20.b:0 "Found the Imperial Naval Cadet & Hydrography Corps"
 oe_v49_wdr.20.c:0 "Drain Marshland Isles into Granite Urban Districts"
 oe_v49_wdr.21.title:0 "The Red Sandstone Citadel of Delhi Opens Its Gates"
 oe_v49_wdr.21.desc:0 "Behind soaring octagonal red-sandstone ramparts, water channels of cool marble wind through the Hall of Private Audience inlaid with carnelian, lapis, and jade. Provincial governors and foreign envoys enter through the Lahore Gate to behold the supreme seat of South Asian imperial majesty."
 oe_v49_wdr.21.a:0 "Hold an Imperial Durbar of All Tributary Princes"
 oe_v49_wdr.21.b:0 "Charter Imperial Textile & Jewel Karkhanas Inside the Walls"
 oe_v49_wdr.21.c:0 "Reinforce the Outer Bastions & Imperial Armory"
 oe_v49_wdr.22.title:0 "Gold Leaf Shimmers Across the Mirror Pond of Kyoto"
 oe_v49_wdr.22.desc:0 "Gilded cypress eaves blaze softly against crimson maples and still emerald waters as tea masters, poets, and lacquer artisans gather in the pavilion's upper veranda. Word of Kyoto's architectural serenity spreads across the seas, elevating the realm's cultural refinement."
 oe_v49_wdr.22.a:0 "Patronize Poetry, Tea & Lacquercraft Guilds"
 oe_v49_wdr.22.b:0 "Open Monastic Woodblock Presses & Archives"
 oe_v49_wdr.22.c:0 "Host Peace Assemblies for Rival Regional Lords"
 oe_v49_wdr.23.title:0 "Ten Thousand Scrolls Shelved at Al-Azhar"
 oe_v49_wdr.23.desc:0 "Beneath carved stone arcades cooled by Nile breezes, master calligraphers index tens of thousands of treatises on law, optics, astronomy, and healing. Scholars journey from Andalusia, Timbuktu, Anatolia, and the Deccan to study in Cairo's luminous halls."
 oe_v49_wdr.23.a:0 "Fund Stipends for Visiting Scholars from Three Continents"
 oe_v49_wdr.23.b:0 "Establish a Nile Paper & Bookbinding Quarter"
 oe_v49_wdr.23.c:0 "Codify Provincial Jurisprudence Through the Academy"
 oe_v49_wdr.24.title:0 "Gold Trades for Manuscripts at Sankore"
 oe_v49_wdr.24.desc:0 "Across the bustling courtyards of Timbuktu, salt slabs and gold dust from trans-Saharan caravans fetch no higher price than finely copied books of astronomy, poetry, and law. The newly enlarged Sankore University draws thousands of students from across West and North Africa."
 oe_v49_wdr.24.a:0 "Expand the Royal Manuscript Scriptoria & Archives"
 oe_v49_wdr.24.b:0 "Link Saharan Salt-Gold Caravans to University Markets"
 oe_v49_wdr.24.c:0 "Restore Niger River Granaries & Flood Canals"
 oe_v49_wdr.25.title:0 "Granite Monoliths Crown the Highlands of Aksum"
 oe_v49_wdr.25.desc:0 "Hewn directly from living highland basalt and flanked by towering carved granite stelae, the restored Sanctuary of Aksum stands like a mountain shaped by human devotion. Processions of pilgrims bearing frankincense ascend the terraced stone avenues in solemn celebration."
 oe_v49_wdr.25.a:0 "Consecrate the Highland Coronation Terraces"
 oe_v49_wdr.25.b:0 "Develop the Red Sea Frankincense & Coffee Caravan Route"
 oe_v49_wdr.25.c:0 "Carve Mountain Cisterns & Fortified Pilgrim Shelters"
 oe_v49_wdr.26.title:0 "The Storm-Proof Beacon Guides Fleets Round the Cape"
 oe_v49_wdr.26.desc:0 "Where roaring southern gales once dashed Indiamen onto hidden reefs, a massive granite sea-wall and cliffside lantern now welcome weary crews into calm anchorage. Fresh water, orchards, and careening slipways turn the Cape of Storms into the indispensable pivot of global sea lanes."
 oe_v49_wdr.26.a:0 "Turn the Cape into a Free Victualling & Refit Hub"
 oe_v49_wdr.26.b:0 "Plant Citrus & Grain Estates Behind Table Mountain"
 oe_v49_wdr.26.c:0 "Station a Permanent Southern Ocean Squadron"
 oe_v49_wdr.27.title:0 "Rivalry of Stone and Gold: The Global Wonders Race"
 oe_v49_wdr.27.desc:0 "Envoys returning from rival capitals bring copperplate engravings of rising domes, deep-water canals, and royal academies meant to eclipse our own monuments. Across salons, dockyards, and ministries, statesmen debate whether to outspend our rivals in stone, lure away their finest master builders, or turn our architectural prestige into enduring diplomatic treaties."
 oe_v49_wdr.27.a:0 "Double Appropriations for Our Flagship Megaprojects"
 oe_v49_wdr.27.b:0 "Poach Rival Master Surveyors & Hydraulic Theorists"
 oe_v49_wdr.27.c:0 "Levy Luxury Monument Tariffs & Strengthen the Treasury"
 oe_v49_wdr.28.title:0 "The Grand World Exposition Beneath Our Wonders"
 oe_v49_wdr.28.desc:0 "Delegations from every inhabited continent disembark at our ports bearing astronomical instruments, fine porcelain, steam pumps, silks, and architectural models for the Grand World Exposition. Under the shadow of our completed megaprojects, rival monarchs and merchant syndicates alike acknowledge the realm as a beacon of human ingenuity."
 oe_v49_wdr.28.a:0 "Open Permanent International Trade Pavilions"
 oe_v49_wdr.28.b:0 "Found an International Academy of Arts & Engineering"
 oe_v49_wdr.28.c:0 "Celebrate with Civic Banquets & Capital Renewal"
