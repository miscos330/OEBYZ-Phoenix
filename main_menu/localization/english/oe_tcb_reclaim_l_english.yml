 # NEW 2026-11-18 round 3 N2 casus belli (oe_tcb_). Generated by gen_round3_cb.py; edit the generator, not this file.
 oe_tcb.1.t: "The Orthodox Courts Understand"
 oe_tcb.1.d: "In the Treaty of Devol of 1108, Bohemond accepted that he held Antioch as the emperor's vassal, and that the city would return to the empire at his death.\n\nWe have won a war to reclaim our provinces, and [GetCountry('BYZ').MakeScope.GetVariable('oe_tcb_last_n').GetValue|0] locations are in the empire's hands again. The Orthodox courts see this as the empire taking back its own, not as conquest. [GetCountry('BYZ').MakeScope.GetVariable('oe_tcb_last_c').GetValue|0] Orthodox countries that stayed out of the war feel less antagonism towards us: up to [GetCountry('BYZ').MakeScope.GetVariable('oe_tcb_last_r').GetValue|0] each, never more than they felt, fading by #Y 3#! a year. The regained locations go through the yearly 'A Lost Province Returns' check as usual."
 oe_tcb.1.a: "We took back only what was ours"
 oe_tcb.1.a.tt: "(Already in effect; this choice has no further effect)"
 oe_tcb_reclaim: "Reclaim the Lost Provinces"
 oe_tcb_reclaim_PROV: "Reclaim [PROVINCE.GetName]"
 oe_tcb_reclaim_desc: "The empire lost land, but not its claim to it. After Syracuse fell in 878 and Taormina in 902, the strategos of Sicily moved to Rhegion in Calabria. His theme was reduced to Calabria, yet it kept the name of Sicily until the middle of the tenth century. In 1097 Alexios I made the leaders of the First Crusade swear to hand back to the empire any of its former lands they took. In the Treaty of Devol of 1108, Bohemond agreed to hold Antioch as the emperor's vassal, with the title doux of Antioch, and the city was to return to the empire at his death.\n\nToday the empire still counts the lands that left with rebel themes as its own former provinces. We may declare war on any country that holds them, unless it is the Roman Empire or one of its subjects.\n\nOnly former provinces can be taken in this war: [war_score|e] cost #G −50%#!, [antagonism|e] from the peace #G −50%#!. After a victory, Orthodox countries that stayed out of the war feel less [antagonism|e] towards us: #Y −1#! for each former-province location regained, at most #Y −8#! and never more than the antagonism that country feels, fading by #Y 3#! a year. Regained land goes through the yearly 'A Lost Province Returns' check as usual (fervour counts while the Roman Reconquest runs)."
 war_goal_oe_tcb_reclaim_goal: "Reclaim [PROVINCE.GetNameWithNoTooltip]"
 war_goal_oe_tcb_reclaim_goal_desc: "[war_goal|e] is to reclaim [PROVINCE.GetNameWithNoTooltip]. Only former imperial provinces can be taken: [war_score|e] cost #G −50%#!, [antagonism|e] from the peace #G −50%#!. We will receive a ticking [war_score|e] from occupying and holding every [location|e] in the province."
 oe_tcb_war_name: "The $NUM$$ORDER$ War to Reclaim the Provinces from $SECONDNAME$"
 oe_tcb_target_tt: "[target.GetName] holds former imperial provinces and is neither the Roman Empire nor one of its subjects"
 oe_tcb_goal_loc_tt: "Only former imperial provinces (locations that left the empire with a rebel theme) can be taken"
 oe_tcb_goal_taker_tt: "Only the Roman Empire or its subjects can take former provinces"
 oe_tcb_ai_many: "They hold at least #Y 3#! former-province locations"
 oe_tcb_ortho_relief: "Reclaimed Provinces: Orthodox Understanding"
