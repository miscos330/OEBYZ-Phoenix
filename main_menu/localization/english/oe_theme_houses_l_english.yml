l_english:
 OE_TG_MARK_HOUSE: " · house-born"
 OE_TG_MARK_NONE: ""
 oe_tg.1.t: "A Son of a Great House"
 oe_tg.1.d: "The seal of [SCOPE.sCountry('oe_tg_theme_s').GetName] could go to a member of a great house. A house-born strategos has the family's wealth and clients behind them and holds the post more firmly; but the stronger the house, the more the strategos answers to it as well as to the emperor."
 oe_tg.1.h1: "Appoint a member of the [SCOPE.sDynasty('oe_tg_h1').GetName] family"
 oe_tg.1.h1.tt: "Costs #R 3#! [oe_tu_authority|e]. The family's best soldier among its grown members in the empire takes over [SCOPE.sCountry('oe_tg_theme_s').GetName]; the old strategos is recalled to court.\nA house-born strategos: theme loyalty target #G +5#!, #G +5#! more if the house is the emperor's political ally; #Y −5#! instead once the house's influence reaches #Y 500#!."
 oe_tg.1.h2: "Appoint a member of the [SCOPE.sDynasty('oe_tg_h2').GetName] family"
 oe_tg.1.h2.tt: "Costs #R 3#! [oe_tu_authority|e]. The family's best soldier among its grown members in the empire takes over [SCOPE.sCountry('oe_tg_theme_s').GetName]; the old strategos is recalled to court.\nA house-born strategos: theme loyalty target #G +5#!, #G +5#! more if the house is the emperor's political ally; #Y −5#! instead once the house's influence reaches #Y 500#!."
 oe_tg.1.h3: "Appoint a member of the [SCOPE.sDynasty('oe_tg_h3').GetName] family"
 oe_tg.1.h3.tt: "Costs #R 3#! [oe_tu_authority|e]. The family's best soldier among its grown members in the empire takes over [SCOPE.sCountry('oe_tg_theme_s').GetName]; the old strategos is recalled to court.\nA house-born strategos: theme loyalty target #G +5#!, #G +5#! more if the house is the emperor's political ally; #Y −5#! instead once the house's influence reaches #Y 500#!."
 oe_tg.1.h4: "Appoint a member of the [SCOPE.sDynasty('oe_tg_h4').GetName] family"
 oe_tg.1.h4.tt: "Costs #R 3#! [oe_tu_authority|e]. The family's best soldier among its grown members in the empire takes over [SCOPE.sCountry('oe_tg_theme_s').GetName]; the old strategos is recalled to court.\nA house-born strategos: theme loyalty target #G +5#!, #G +5#! more if the house is the emperor's political ally; #Y −5#! instead once the house's influence reaches #Y 500#!."
 oe_tg.1.e: "Not now"
 oe_tg.1.e.tt: "Nothing changes."
 oe_tg.2.t: "The Patron Falls"
 oe_tg.2.d: "By cold decree of the throne, a once-mighty aristocratic house has been struck from the imperial roll of pillars, its patronage network shattering overnight. Strategoi born to that lineage or raised through its favour suddenly find themselves exposed without a protector at court, quietly weighing where their loyalties and survival now lie."
 oe_tg.2.a: "The court has decided"
 oe_tg.2.a.tt: "Themes led by members of that house: loyalty #R −10#!, counted in the loyalty target for #Y 5#! years (already applied)."
 oe_tg.3.t: "The Deposed Dynasty"
 oe_tg.3.d: "A new emperor reigns, but the old dynasty has not vanished. Its members still live in the capital, with clients, estates and old followers. Now they stand on the roll as a great house, and people remember where they once sat."
 oe_tg.3.a: "Let them keep to their place"
 oe_tg.3.a.tt: "The old dynasty is on the house roll with #Y 300#! influence (already applied)."
 oe_tg.4.t: "A House Humbled"
 oe_tg.4.d: "The court has just pressed the [SCOPE.sDynasty('oe_tg_family').GetName] family. The strategoi of that house have written to the capital, politely, and their meaning is plain."
 oe_tg.4.a: "Send an envoy with gifts"
 oe_tg.4.a.tt: "#R −150#! gold\nThemes led by members of that house: loyalty #R −5#!, counted in the loyalty target for #Y 5#! years"
 oe_tg.4.b: "Ignore them"
 oe_tg.4.b.tt: "Themes led by members of that house: loyalty #R −10#!, counted in the loyalty target for #Y 5#! years"
 oe_tg.10.t: "A Marriage Proposed"
 oe_tg.10.d: "[SCOPE.sCharacter('oe_tg_head').GetName] has sent to propose a match: the [SCOPE.sDynasty('oe_tg_family').GetName] family has a daughter to marry into the imperial house. In 1347 Helena Kantakouzene married John V in just this way, and her father became the emperor's father-in-law."
 oe_tg.10.a: "Accept the match"
 oe_tg.10.a.tt: "The family's influence #Y +75#!\n[oe_tu_authority|e] #G +2#!"
 oe_tg.10.b: "Decline politely"
 oe_tg.10.b.tt: "The family's influence #Y −10#!"
 oe_tg.11.t: "Two Houses, One Command"
 oe_tg.11.d: "The strategos of [SCOPE.sCountry('oe_tg_theme_s').GetName] has lost the troops' trust, and both the [SCOPE.sDynasty('oe_tg_family').GetName] and the [SCOPE.sDynasty('oe_tg_family2').GetName] families want their own candidate in the post. They quarrelled openly before the court, and neither will give way."
 oe_tg.11.a: "Back the [SCOPE.sDynasty('oe_tg_family').GetName]"
 oe_tg.11.a.tt: "The [SCOPE.sDynasty('oe_tg_family').GetName] #Y +50#! influence\nThe [SCOPE.sDynasty('oe_tg_family2').GetName] #Y −50#! influence; themes led by its men lose #Y 5#! loyalty"
 oe_tg.11.b: "Back the [SCOPE.sDynasty('oe_tg_family2').GetName]"
 oe_tg.11.b.tt: "The [SCOPE.sDynasty('oe_tg_family2').GetName] #Y +50#! influence\nThe [SCOPE.sDynasty('oe_tg_family').GetName] #Y −50#! influence; themes led by its men lose #Y 5#! loyalty"
 oe_tg.11.c: "Neither"
 oe_tg.11.c.tt: "[oe_tu_authority|e] #R −2#!\nBoth families #Y −10#! influence"
 oe_tg.12.t: "A Young Son Goes to the Frontier"
 oe_tg.12.d: "A young son of the [SCOPE.sDynasty('oe_tg_family').GetName] family asks to serve with the frontier troops of [SCOPE.sCountry('oe_tg_theme_s').GetName]. His family hopes he will win a name there and one day command a theme of his own."
 oe_tg.12.a: "Send him to the frontier"
 oe_tg.12.a.tt: "The family #Y +25#! influence\n[SCOPE.sCountry('oe_tg_theme_s').GetName]: military office #G +10#! (#Y 5#! years)"
 oe_tg.12.b: "Keep him in the capital"
 oe_tg.12.b.tt: "The family #Y −10#! influence"
 oe_tg.13.t: "The House Retainers"
 oe_tg.13.d: "A theme is in revolt, and [SCOPE.sCharacter('oe_tg_head').GetName] offers the [SCOPE.sDynasty('oe_tg_family').GetName] family's retainers to put it down. The family asks one thing in return: that the court remember the favour."
 oe_tg.13.a: "Accept the retainers"
 oe_tg.13.a.tt: "#Y 3#! regiments (#Y 2#! infantry, #Y 1#! cavalry) appear at the capital under the empire\nThe family #Y +75#! influence"
 oe_tg.13.b: "The court has its own troops"
 oe_tg.13.b.tt: "The family #Y −10#! influence"
 oe_tg.14.t: "A House Pays for the War"
 oe_tg.14.d: "The [SCOPE.sDynasty('oe_tg_family').GetName] family offers money for the campaign now under way, hoping for estates in the conquered land afterwards."
 oe_tg.14.a: "Take the money"
 oe_tg.14.a.tt: "#G +400#! gold\nCurrent campaign progress #G +3#!\nThe family #Y +50#! influence"
 oe_tg.14.b: "War is the emperor's business"
 oe_tg.14.b.tt: "[oe_tu_authority|e] #G +1#!"
 oe_tg.15.t: "A Minister Falls"
 oe_tg.15.d: "[SCOPE.sCharacter('oe_tg_head').GetName] has grown too powerful, and the charges against [SCOPE.sCharacter('oe_tg_head').GetHerHim] pile up. In 1328 Theodore Metochites fell with Andronikos II: his property was taken, he was exiled to Didymoteichon, and only two years later was he allowed back to end his days at the Chora monastery."
 oe_tg.15.a: "Confiscate [SCOPE.sCharacter('oe_tg_head').GetHerHis] property"
 oe_tg.15.a.tt: "#G +500#! gold\nThe family #Y −150#! influence; themes led by its men lose #Y 10#! loyalty"
 oe_tg.15.b: "Exile [SCOPE.sCharacter('oe_tg_head').GetHerHim] to Didymoteichon"
 oe_tg.15.b.tt: "The family #Y −75#! influence\n[oe_tu_authority|e] #G +3#!"
 oe_tg.15.c: "Let [SCOPE.sCharacter('oe_tg_head').GetHerHim] retire to a monastery"
 oe_tg.15.c.tt: "The family #Y −25#! influence\nPrestige rises"
 oe_tg.16.t: "The Old General Returns"
 oe_tg.16.d: "[SCOPE.sCountry('oe_tg_theme_s').GetName] is restless. The [SCOPE.sDynasty('oe_tg_family').GetName] family has an old general, long out of favour, living quietly at home. Around 1323 Andronikos II pardoned Alexios Philanthropenos, blinded for his revolt years before, and sent him to relieve Philadelphia; it is said the Turks withdrew at the mere news of his coming."
 oe_tg.16.a: "Call [SCOPE.sCharacter('oe_tg_veteran').GetHerHim] back"
 oe_tg.16.a.tt: "[SCOPE.sCountry('oe_tg_theme_s').GetName]: loyalty #G +15#!, military office #G +10#! (#Y 5#! years)\nIf eligible, the veteran becomes the theme's strategos\nThe family #Y +50#! influence"
 oe_tg.16.b: "Let [SCOPE.sCharacter('oe_tg_veteran').GetHerHim] rest"
 oe_tg.16.b.tt: "Nothing changes."
 oe_tg.17.t: "A New Man"
 oe_tg.17.d: "A man of humble birth is rising at court by wit and nerve. According to Gregoras, Alexios Apokaukos, who became grand duke of the fleet in 1341, began just so. The great houses despise him and have begun to fear him."
 oe_tg.17.a: "Promote him"
 oe_tg.17.a.tt: "[oe_tu_authority|e] #G +5#!\nEvery house on the roll #Y −15#! influence"
 oe_tg.17.b: "The court rests on the great houses"
 oe_tg.17.b.tt: "The [SCOPE.sDynasty('oe_tg_family').GetName] family #Y +25#! influence"
 oe_tg.18.t: "A Family Convent"
 oe_tg.18.d: "The [SCOPE.sDynasty('oe_tg_family').GetName] family wants to build a convent in the capital and asks the emperor for land and freedom from tax. Early in the fourteenth century Theodora Synadene founded the convent of Bebaia Elpis after her husband's death, wrote its rule herself, and had portraits of her family painted into the manuscript."
 oe_tg.18.a: "Grant land and exemption"
 oe_tg.18.a.tt: "#R −150#! gold\nThe family #Y +50#! influence\nLegitimacy rises"
 oe_tg.18.b: "Let them pay for it"
 oe_tg.18.b.tt: "The family #Y −10#! influence"
 oe_tg.19.t: "A Family History"
 oe_tg.19.d: "[SCOPE.sCharacter('oe_tg_head').GetName] has engaged a scholar to write a history of the [SCOPE.sDynasty('oe_tg_family').GetName] family and set its ancestors' deeds in the empire's story. John VI, after his abdication, wrote a history of his own to defend his life."
 oe_tg.19.a: "Fund the book"
 oe_tg.19.a.tt: "#R −100#! gold\nPrestige rises\nThe family #Y +25#! influence"
 oe_tg.19.b: "Strike out what slights the crown"
 oe_tg.19.b.tt: "[oe_tu_authority|e] #G +2#!\nThe family #Y −25#! influence"
 oe_tg.20.t: "An Heiress"
 oe_tg.20.d: "A rich widow has left an only daughter and wide estates. Both the [SCOPE.sDynasty('oe_tg_family').GetName] and the [SCOPE.sDynasty('oe_tg_family2').GetName] families seek her hand; whoever marries her takes the land."
 oe_tg.20.a: "Give her to the [SCOPE.sDynasty('oe_tg_family').GetName]"
 oe_tg.20.a.tt: "The [SCOPE.sDynasty('oe_tg_family').GetName] #Y +75#! influence\nThe [SCOPE.sDynasty('oe_tg_family2').GetName] #Y −25#! influence"
 oe_tg.20.b: "Give her to the [SCOPE.sDynasty('oe_tg_family2').GetName]"
 oe_tg.20.b.tt: "The [SCOPE.sDynasty('oe_tg_family2').GetName] #Y +75#! influence\nThe [SCOPE.sDynasty('oe_tg_family').GetName] #Y −25#! influence"
 oe_tg.20.c: "Marry her into the imperial family"
 oe_tg.20.c.tt: "Legitimacy rises\nBoth families #Y −25#! influence"
 oe_tg.21.t: "A Strategos Asks to Be Caesar"
 oe_tg.21.d: "The strategos of [SCOPE.sCountry('oe_tg_theme_s').GetName], [SCOPE.sCharacter('oe_tg_strat').GetName], comes from the [SCOPE.sDynasty('oe_tg_family').GetName] family, now at the height of its power, and asks for the dignity of Caesar, as befits what the strategos and the family have done for the empire."
 oe_tg.21.a: "Grant the title"
 oe_tg.21.a.tt: "The strategos of [SCOPE.sCountry('oe_tg_theme_s').GetName] becomes Caesar (theme loyalty target #G +15#!)\nThe family #Y +50#! influence"
 oe_tg.21.b: "That dignity is for the imperial kin"
 oe_tg.21.b.tt: "[SCOPE.sCountry('oe_tg_theme_s').GetName]: loyalty #R −10#!, counted in the loyalty target for #Y 5#! years\nThe family #Y −25#! influence"
 oe_tg.22.t: "Two Houses Join"
 oe_tg.22.d: "The [SCOPE.sDynasty('oe_tg_family').GetName] and [SCOPE.sDynasty('oe_tg_family2').GetName] families have agreed a marriage and joined their fortunes. Some at court fear that together no one will be able to hold them in check."
 oe_tg.22.a: "Break the match"
 oe_tg.22.a.tt: "[oe_tu_authority|e] #R −3#!\nBoth families #Y −25#! influence"
 oe_tg.22.b: "Send a wedding gift"
 oe_tg.22.b.tt: "#R −100#! gold\nBoth families #Y +25#! influence\nThemes led by their men gain #Y 5#! loyalty"
 oe_tg.23.t: "Brothers Divide the Inheritance"
 oe_tg.23.d: "The brothers of the [SCOPE.sDynasty('oe_tg_family').GetName] family have brought their quarrel over the inheritance before the throne. The eldest wants the estate kept whole; the younger wants half."
 oe_tg.23.a: "Back the eldest"
 oe_tg.23.a.tt: "The family's influence is unchanged\nPrestige rises"
 oe_tg.23.b: "Divide the estate"
 oe_tg.23.b.tt: "The family #Y −100#! influence\n[oe_tu_authority|e] #G +2#!"
 oe_tg.24.t: "The Estates Will Not Pay"
 oe_tg.24.d: "The [SCOPE.sDynasty('oe_tg_family').GetName] family holds wide estates in [SCOPE.sCountry('oe_tg_theme_s').GetName], and its stewards have shut the gate on the treasury's officer, saying the family's land has only ever paid the emperor himself."
 oe_tg.24.a: "Back the officer"
 oe_tg.24.a.tt: "[SCOPE.sCountry('oe_tg_theme_s').GetName]: finance office #G +10#! (#Y 5#! years)\nThe family #Y −50#! influence"
 oe_tg.24.b: "Exempt the estates"
 oe_tg.24.b.tt: "[SCOPE.sCountry('oe_tg_theme_s').GetName]: finance office #R −10#! (#Y 5#! years)\nThe family #Y +25#! influence"
 oe_tg.25.t: "A Command for the Family"
 oe_tg.25.d: "The strategos of [SCOPE.sCountry('oe_tg_theme_s').GetName], [SCOPE.sCharacter('oe_tg_strat').GetName], is of the [SCOPE.sDynasty('oe_tg_family').GetName] family and asks that [SCOPE.sCharacter('oe_tg_strat').GetHerHis] son be allowed to succeed, so that the [SCOPE.sDynasty('oe_tg_family').GetName] may hold the province from one generation to the next. It is exactly what the theme system was built to prevent."
 oe_tg.25.a: "Grant it"
 oe_tg.25.a.tt: "[SCOPE.sCountry('oe_tg_theme_s').GetName] becomes a hereditary command (loyalty target #G +5#!, permanent)\n[SCOPE.sCountry('oe_tg_theme_s').GetName]: loyalty #G +10#!, counted in the loyalty target for #Y 5#! years\nThe family #Y +100#! influence"
 oe_tg.25.b: "A theme is not a family estate"
 oe_tg.25.b.tt: "[SCOPE.sCountry('oe_tg_theme_s').GetName]: loyalty #R −10#!, counted in the loyalty target for #Y 5#! years\nThe family #Y −25#! influence"
 oe_theme_admin.2.house: "Give the command to a scion of a great house"
