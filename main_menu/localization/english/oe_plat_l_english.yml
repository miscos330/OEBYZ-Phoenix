l_english:
# NEW 2026-11-22 v10.0 Worker 2 (Slot 78): Playable Venice & Genoa Maritime Republics (oe_plat_). Generated by gen_playable_latin_rep.py.
 oe_plat_player_only_tt:0 "Controlled by a human player leading the Venice or Genoa Maritime Republic track."
 oe_plat_b_chioggia_vendetta:0 "Blood Feud of the War of Chioggia"
 oe_plat_b_suez_timber_pact:0 "Secret Suez Timber & Spice Accord"
 oe_plat_b_diu_portuguese_wrath:0 "Resentment Over Clandestine Diu Timber Aid"
 oe_plat_b_asientos_creditor:0 "Piacenza Asientos Sovereign Credit Bond"
 oe_plat_ref_serenissima_stato_mar:0 "Serenissima Stato da Màr"
 oe_plat_ref_serenissima_stato_mar_desc:0 "Organizes the republic around the Arsenale assembly line, the Council of Ten, and a fortified chain of Adriatic and Aegean harbors—slashing overseas distance costs while empowering galley fleets and shipbuilding."
 oe_plat_ref_casa_san_giorgio_bank:0 "Casa di San Giorgio Financial Sovereignty"
 oe_plat_ref_casa_san_giorgio_bank_desc:0 "Entrusts colonial customs, maritime tax farms, and continental bill-of-exchange clearing to the Casa di San Giorgio, commanding Europe's lowest borrowing rates, vast credit lines, and sea-trade mastery."
 oe_plat_maritime_charter_law:0 "Maritime Republic Commercial Charter Law"
 oe_plat_maritime_charter_law_desc:0 "Sets the grand commercial doctrine of Venice and Genoa between armed Stato da Màr convoys, Piacenza sovereign silver clearing, and Italian Terraferma landed security."
 oe_plat_pol_stato_mar_convoys:0 "Stato da Màr Armed Convoy System (Mude)"
 oe_plat_pol_stato_mar_convoys_desc:0 "Dispatches state-auctioned armed galley convoys (Mude) on seasonal schedules to Alexandria, Crete, the Black Sea, and Flanders, uniting maritime presence with sea-lane profits."
 oe_plat_pol_piacenza_asientos:0 "Piacenza Clearing Fairs & Sovereign Asientos"
 oe_plat_pol_piacenza_asientos_desc:0 "Operates offshore bill-of-exchange clearing fairs to direct transatlantic silver and royal loans, cutting interest costs while multiplying credit capacity and commercial income."
 oe_plat_pol_terraferma_balance:0 "Stato di Terraferma Mainland Balance"
 oe_plat_pol_terraferma_balance_desc:0 "Cultivates Venetian and Ligurian mainland estates and Alpine passes, securing domestic grain, manpower, and fortress depth alongside maritime fleets."
 oe_plat_arsenale_slipway:0 "Arsenale Assembly Slipway & San Giorgio Countinghouse"
 oe_plat_arsenale_slipway_desc:0 "Unites the Venetian canal assembly line with the Genoese Casa di San Giorgio maritime countinghouse. Stockpiling standardized keels, rigging, and naval ordnance, it expands local merchant capacity, maritime presence, shipbuilding, and civic construction efficiency."
 oe_plat_arsenale_slipway_maint:0 "Arsenale Slipway & San Giorgio (Upkeep)"
 oe_plat_venetian_galleass:0 "Venetian Heavy War Galleass"
 oe_plat_venetian_galleass_desc:0 "A floating artillery fortress forged on the Arsenale slipways. Combining oar-driven independence from wind with towering gun decks and heavy broadsides, six Venetian galeazze shattered entire galley lines at Lepanto."
 oe_plat_genoese_pavise_crossbow:0 "Genoese Pavise Crossbow & Arquebus Guard"
 oe_plat_genoese_pavise_crossbow_desc:0 "Renowned across Europe from Crecy to the Black Sea, Genoese civic crossbowmen and early arquebusiers fight behind full-body pavise shields—combining exceptional defensive durability with disciplined missile volleys."
 oe_plat_adv_galleass_line:0 "Arsenale Galleass Assembly & Pavise Guard"
 oe_plat_adv_galleass_line_desc:0 "Unites standardized Arsenale shipbuilding with Genoese pavise infantry discipline, unlocking Venetian Heavy War Galleasses and Genoese Pavise Guards while strengthening galley combat power and shipyards."
 STATIC_MODIFIER_NAME_oe_plat_golden_horn_customs_mod:0 "Golden Horn Customs Exemption"
 STATIC_MODIFIER_DESC_oe_plat_golden_horn_customs_mod:0 "Leveraging naval reach along the Bosporus secures lucrative customs exemptions and Aegean merchant capacity."
 STATIC_MODIFIER_NAME_oe_plat_chioggia_total_war_mod:0 "War of Chioggia Total Mobilization"
 STATIC_MODIFIER_DESC_oe_plat_chioggia_total_war_mod:0 "With the fate of Adriatic and Black Sea trade at stake at Chioggia, republic shipyards and galley crews fight with ferocious resolve."
 STATIC_MODIFIER_NAME_oe_plat_peace_of_turin_mod:0 "Peace of Turin Commercial Recovery"
 STATIC_MODIFIER_DESC_oe_plat_peace_of_turin_mod:0 "Mediated peace at Turin relieves war exhaustion and lets surviving merchant convoys rebuild Mediterranean trade."
 STATIC_MODIFIER_NAME_oe_plat_council_of_ten_mod:0 "Tribunal of the Council of Ten"
 STATIC_MODIFIER_DESC_oe_plat_council_of_ten_mod:0 "Venice's secretive Council of Ten crushes aristocratic conspiracies before they strike, anchoring unrivaled domestic control and stability."
 STATIC_MODIFIER_NAME_oe_plat_great_council_balance_mod:0 "Maggior Consiglio Civic Balance"
 STATIC_MODIFIER_DESC_oe_plat_great_council_balance_mod:0 "Preserving the broad deliberations of the Great Council nurtures republican tradition and burgher confidence."
 STATIC_MODIFIER_NAME_oe_plat_san_giorgio_charter_mod:0 "Charter of Casa di San Giorgio (1407)"
 STATIC_MODIFIER_DESC_oe_plat_san_giorgio_charter_mod:0 "Consolidating sovereign debt and colonial revenues under Casa di San Giorgio transforms fiscal crisis into Europe's mightiest credit machine."
 STATIC_MODIFIER_NAME_oe_plat_arsenale_assembly_mod:0 "Venetian Arsenale Moving Assembly Line"
 STATIC_MODIFIER_DESC_oe_plat_arsenale_assembly_mod:0 "Standardized hull frames and ordnance stations along the Arsenale canal launch fully fitted war galleys at astonishing speed."
 STATIC_MODIFIER_NAME_oe_plat_terraferma_expansion_mod:0 "Stato di Terraferma Mainland Drive"
 STATIC_MODIFIER_DESC_oe_plat_terraferma_expansion_mod:0 "Expanding across Padova, Verona, and the Po plains secures food independence, manpower, and mainland strategic depth."
 STATIC_MODIFIER_NAME_oe_plat_gazaria_grain_mod:0 "Gazaria Black Sea Grain Lifeline"
 STATIC_MODIFIER_DESC_oe_plat_gazaria_grain_mod:0 "Anchored on Kaffa, Genoese Gazaria funnels Pontic grain and eastern silk back across the straits into Italian ports."
 STATIC_MODIFIER_NAME_oe_plat_kaffa_bastion_loc_mod:0 "San Giorgio Sea Citadel of Kaffa"
 STATIC_MODIFIER_DESC_oe_plat_kaffa_bastion_loc_mod:0 "Double stone curtains and vaulted warehouses financed by Casa di San Giorgio turn Kaffa into an impregnable Pontic emporium."
 STATIC_MODIFIER_NAME_oe_plat_lazzaretto_mod:0 "Twin-Island Quarantine System (Lazzaretto)"
 STATIC_MODIFIER_DESC_oe_plat_lazzaretto_mod:0 "Pioneering forty-day maritime quarantine (quarantena) and cargo fumigation safeguards harbor prosperity and public order."
 STATIC_MODIFIER_NAME_oe_plat_lazzaretto_loc_mod:0 "Venetian Twin-Island Lazaretto"
 STATIC_MODIFIER_DESC_oe_plat_lazzaretto_loc_mod:0 "The world's first permanent maritime quarantine station sustains exceptional harbor prosperity and civic health."
 STATIC_MODIFIER_NAME_oe_plat_levant_plantations_mod:0 "Cretan-Cypriot Sugar, Wine & Cotton Network"
 STATIC_MODIFIER_DESC_oe_plat_levant_plantations_mod:0 "Integrates Cretan Malmsey vineyards and Cypriot sugar-cotton estates into a high-yield Levantine export empire."
 STATIC_MODIFIER_NAME_oe_plat_levant_spice_lifeline_mod:0 "Suez-Alexandria Spice Lifeline Preserved"
 STATIC_MODIFIER_DESC_oe_plat_levant_spice_lifeline_mod:0 "Sustained by clandestine Dalmatian oak and Venetian master shipwrights at Suez, the Levantine spice trade endures against Cape blockades."
 STATIC_MODIFIER_NAME_oe_plat_century_of_genoese_mod:0 "Century of the Genoese: Piacenza Silver Hegemony"
 STATIC_MODIFIER_DESC_oe_plat_century_of_genoese_mod:0 "Through Iberian royal Asientos and the offshore clearing fairs of Piacenza, Genoese bankers orchestrate Europe's silver flows and sovereign credit."
 STATIC_MODIFIER_NAME_oe_plat_lepanto_galleass_mod:0 "Lepanto Heavy Galleass Armada"
 STATIC_MODIFIER_DESC_oe_plat_lepanto_galleass_mod:0 "Multi-gun heavy galeazze anchor the battle line, dominating Mediterranean fleet engagements and coastal blockades."
 STATIC_MODIFIER_NAME_oe_plat_candia_bastion_mod:0 "Unbroken Bastion of Candia"
 STATIC_MODIFIER_DESC_oe_plat_candia_bastion_mod:0 "Decades of relentless island siege defense steel garrison endurance, fort logistics, and naval fighting spirit."
 STATIC_MODIFIER_NAME_oe_plat_atlantic_breakout_mod:0 "Italian Commercial League Atlantic Breakout"
 STATIC_MODIFIER_DESC_oe_plat_atlantic_breakout_mod:0 "Breaking past Gibraltar, Italian maritime syndicates project trade range, oceanic reach, and merchant houses into the Atlantic."
 STATIC_MODIFIER_NAME_oe_plat_open_libro_mod:0 "Opened Libro d'Oro Civic Renewal"
 STATIC_MODIFIER_DESC_oe_plat_open_libro_mod:0 "Opening the Golden Book to mainland merchants and bank shareholders revitalizes republican institutions, tax vigor, and inquiry."
 STATIC_MODIFIER_NAME_oe_plat_enlightened_free_port_mod:0 "Aldine Presses, Murano Glass & Enlightened Free Port"
 STATIC_MODIFIER_DESC_oe_plat_enlightened_free_port_mod:0 "World-renowned printing houses, Murano glassworks, and free-port charters ignite production, institutional progress, and scholarly acclaim."
 STATIC_MODIFIER_NAME_oe_plat_maritime_federation_mod:0 "Mediterranean Maritime Federal Constitution"
 STATIC_MODIFIER_DESC_oe_plat_maritime_federation_mod:0 "Defying the fate of Campo Formio, a modernized Maritime Federal Constitution unites constitutional law, naval fire, and sovereign finance."
 STATIC_MODIFIER_NAME_oe_plat_creditor_leverage_mod:0 "Sovereign Creditor Arbitration Leverage"
 STATIC_MODIFIER_DESC_oe_plat_creditor_leverage_mod:0 "Coordinated syndicate sanctions compel delinquent courts to yield customs pledges and maritime concessions."
 oe_plat_dec_charter_san_giorgio.title:0 "Expand Casa di San Giorgio & Piacenza Fairs"
 oe_plat_dec_charter_san_giorgio.desc:0 "Expand the mandate of Casa di San Giorgio and offshore bill-of-exchange clearing fairs, raising Arsenal/Banking tier (up to 4) while cutting interest rates and expanding sovereign credit."
 oe_plat_dec_charter_san_giorgio.a:0 "Issue New San Giorgio Banking Charters"
 oe_plat_dec_charter_san_giorgio_tt:0 "Raises Arsenal/Banking tier by #G +1#! (max 4), shifts oligarchy axis #Y +10#!, and grants #Y 25 years#! of Charter of Casa di San Giorgio."
 oe_plat_dec_expand_arsenale_line.title:0 "Expand the Arsenale Moving Canal Slipways"
 oe_plat_dec_expand_arsenale_line.desc:0 "Add standardized keel depots, roperies, and cannon foundries along the Arsenale canal, raising Arsenal/Banking tier (up to 4) and accelerating warship production across the republic."
 oe_plat_dec_expand_arsenale_line.a:0 "Commission New Arsenale Assembly Slipways"
 oe_plat_dec_expand_arsenale_line_tt:0 "Raises Arsenal/Banking tier by #G +1#! (max 4), adds #G +10#! Navy Tradition, and grants #Y 25 years#! of Venetian Arsenale Moving Assembly Line."
 oe_plat_dec_open_libro_doro.title:0 "Open the Libro d'Oro to New-Citizen Constitutionalism"
 oe_plat_dec_open_libro_doro.desc:0 "Break centuries of patrician exclusivity by admitting Terraferma merchants, overseas governors, and bank shareholders into the Golden Book, revitalizing republican governance and inquiry."
 oe_plat_dec_open_libro_doro.a:0 "Open the Golden Book to New Citizens"
 oe_plat_dec_open_libro_doro_tt:0 "Opens the Libro d'Oro, shifts the oligarchy axis by #G -20#!, boosts republican tradition, and grants #Y 40 years#! of Opened Libro d'Oro Civic Renewal."
 oe_plat.1.t:0 "Golden Horn Privileges and the Bosporus Customs War"
 oe_plat.1.d:0 "Across the Golden Horn, Venetian quarters and Genoese Galata lock eyes over Bosporus tolls and the strategic island of Tenedos. With Constantinople's treasury strained, our Senate debates whether to press ruthlessly for duty-free transit or extend republic credit for enduring maritime concessions."
 oe_plat.1.a:0 "Press Constantinople with War Galleys for Duty-Free Privileges"
 oe_plat.1.a.tt:0 "Grants #Y 25 years#! of Golden Horn Customs Exemption and #G +10#! Navy Tradition."
 oe_plat.1.b:0 "Extend Republic Credit to Secure Friendly Long-Term Concessions"
 oe_plat.1.b.tt:0 "Spends #R -80#! gold, shifts oligarchy axis #Y +10#!, and wins #G +12#! Prestige and cordial relations."
 oe_plat.2.t:0 "1378-1381: The War of Chioggia and Carlo Zeno"
 oe_plat.2.d:0 "A century of Venetian-Genoese rivalry erupts into mortal combat at Chioggia! As Ligurian galleys storm the southern gate of the Venetian lagoon and Venetian hulls sink across the channels awaiting Carlo Zeno's relief squadron, the victor will dictate Mediterranean sea power for generations."
 oe_plat.2.a:0 "Fight to the Finish at Chioggia for Undisputed Maritime Mastery!"
 oe_plat.2.a.tt:0 "Grants #Y 20 years#! of War of Chioggia Total Mobilization and #G +15#! Navy Tradition."
 oe_plat.2.b:0 "Accept Mediation at the Peace of Turin (1381) to Rebuild Commerce"
 oe_plat.2.b.tt:0 "Grants #Y 20 years#! of Peace of Turin Commercial Recovery."
 oe_plat.3.t:0 "The Council of Ten (Consiglio dei Dieci) and the Faliero Plot"
 oe_plat.3.d:0 "Whispers of treason shake the Doge's Palace as informants expose Doge Marino Faliero's plot to overthrow the patrician republic. Having swiftly crushed the conspiracy, the Senate debates whether to grant permanent security supremacy to the secretive Council of Ten or restore broader checks in the Great Council."
 oe_plat.3.a:0 "Empower the Council of Ten's State-Security Network"
 oe_plat.3.a.tt:0 "Shifts oligarchy axis by #Y +25#! and grants #Y 35 years#! of Tribunal of the Council of Ten."
 oe_plat.3.b:0 "Check the Secret Tribunal and Uphold the Great Council"
 oe_plat.3.b.tt:0 "Shifts oligarchy axis by #G -15#!, boosts republican tradition, and grants #Y 30 years#! of Maggior Consiglio Civic Balance."
 oe_plat.4.t:0 "1407: Foundation of the Casa di San Giorgio"
 oe_plat.4.d:0 "Exhausted by maritime wars, Genoa's public debt threatens fiscal collapse. Leading creditors propose a revolutionary institution: consolidate every state loan into tradable shares under the Casa di San Giorgio, entrusting customs and overseas colonies at Kaffa and Chios to a sovereign banking corporation."
 oe_plat.4.a:0 "Charter Casa di San Giorgio as Sovereign Fiscal Trustee!"
 oe_plat.4.a.tt:0 "Enacts Casa di San Giorgio Financial Sovereignty reform, raises Banking tier #G +1#!, and grants #Y 40 years#! of Charter of Casa di San Giorgio!"
 oe_plat.4.b:0 "Keep Sovereign Taxes Under Civic Council Control"
 oe_plat.4.b.tt:0 "Shifts oligarchy axis #G -10#!, adds republican tradition, and grants #Y 25 years#! of Civic Balance."
 oe_plat.5.t:0 "The Venetian Arsenale Assembly Line and Stato di Terraferma"
 oe_plat.5.d:0 "Inside the walled Arsenale, hereditary shipwrights (Arsenalotti) pioneer Europe's first moving industrial assembly line—towing standardized galley hulls down a canal past depots of masts, oars, rigging, and cannon. Meanwhile, Milanese pressure on the mainland poses a strategic crossroads: double down on oceanic sea power or forge a Stato di Terraferma."
 oe_plat.5.a:0 "Perfect the Arsenale Assembly Line for Maritime Supremacy!"
 oe_plat.5.a.tt:0 "Enacts Serenissima Stato da Màr reform, raises Arsenal tier #G +1#!, and grants #Y 40 years#! of Venetian Arsenale Moving Assembly Line!"
 oe_plat.5.b:0 "Forge the Stato di Terraferma Across Padova and Lombardy"
 oe_plat.5.b.tt:0 "Grants #Y 35 years#! of Stato di Terraferma Mainland Drive (manpower, food & morale) and #G +10#! Army Tradition."
 oe_plat.6.t:0 "Holding Gazaria: Defense of Kaffa and the Pontic Grain Lanes"
 oe_plat.6.d:0 "Far across the Black Sea, Kaffa crowns Genoese Gazaria—funneling Pontic wheat and steppe silk back to Liguria. With rising powers tightening around the straits, Casa di San Giorgio must decide whether to fortify Kaffa's citadels and lock in Black Sea grain charters or redeploy capital westward."
 oe_plat.6.a:0 "Fortify Kaffa and Sign Long-Term Pontic Grain Charters"
 oe_plat.6.a.tt:0 "Sets the Gazaria grain flag, grants #Y 35 years#! of Gazaria Black Sea Grain Lifeline, and fortifies Kaffa if owned."
 oe_plat.6.b:0 "Pivot Ligurian Capital to Western Mediterranean Wool and Alum"
 oe_plat.6.b.tt:0 "Adds #G +200#! gold and #Y 25 years#! of enhanced sea-trade capacity."
 oe_plat.7.t:0 "Twin-Island Quarantine Harbors: Lazzaretto Vecchio & Nuovo"
 oe_plat.7.d:0 "Recurrent waves of pestilence stalk Mediterranean shipping lanes. Venetian magistrates pioneer a world-first public health shield: Lazzaretto Vecchio (1423) to treat afflicted mariners and Lazzaretto Nuovo (1468) to hold incoming vessels and cargo for forty days of fumigation—giving birth to modern quarantine (quarantena)."
 oe_plat.7.a:0 "Build the Twin-Island Lazarettos and Codify Forty-Day Quarantine"
 oe_plat.7.a.tt:0 "Costs #R -100#! gold, sets the Lazaretto quarantine flag, and grants #Y 40 years#! of Twin-Island Quarantine System plus Venice harbor prosperity!"
 oe_plat.7.b:0 "Enforce Minimal Cargo Checks to Maximize Short-Term Turnover"
 oe_plat.7.b.tt:0 "Gains #G +150#! gold and short-term trade velocity without permanent quarantine infrastructure."
 oe_plat.8.t:0 "Cyprus and Crete: Mediterranean Sugar, Malmsey and Cotton Empire"
 oe_plat.8.d:0 "Crete (Candia) and Cyprus (Nicosia and Famagusta) stand like twin jewels across the Levantine sea lanes, prized alike for their Malmsey vineyards, cane sugar, and fine cotton and for their commanding naval harbors."
 oe_plat.8.a:0 "Develop Cane Sugar, Malmsey Wine and Cotton Plantations"
 oe_plat.8.a.tt:0 "Gains #G +180#! gold and #Y 30 years#! of Cretan-Cypriot Sugar, Wine & Cotton Network."
 oe_plat.8.b:0 "Fortify Crete and Cyprus as Forward Naval Patrol Bases"
 oe_plat.8.b.tt:0 "Gains #G +12#! Navy Tradition and #Y 30 years#! of forward naval readiness."
 oe_plat.9.t:0 "Clandestine Timber to Suez: The Venice-Mamluk Anti-Portuguese Accord"
 oe_plat.9.d:0 "Shock ripples across the Rialto: Portuguese squadrons have rounded the Cape of Good Hope, choking off Indian Ocean pepper before it reaches Alexandria! Secret envoys from Cairo arrive with an audacious bargain—smuggle Dalmatian oak, cast bronze cannon, and Arsenale shipwrights overland to Suez so the Mamluk Red Sea armada can challenge Portugal at Diu!"
 oe_plat.9.a:0 "Smuggle Dalmatian Oak & Shipwrights to Suez: Back Cairo Against Portugal!"
 oe_plat.9.a.tt:0 "Costs #R -120#! gold, sets the Venice-Mamluk Diu timber bridge (linking Slot 76 Mamluks), and grants #Y 40 years#! of Suez-Alexandria Spice Lifeline Preserved!"
 oe_plat.9.b:0 "Observe Christian Neutrality and Pivot to European Manufactures"
 oe_plat.9.b.tt:0 "Avoids Lisbon's wrath and grants #G +10#! Prestige plus #Y 25 years#! of domestic commercial adjustment."
 oe_plat.10.t:0 "The Century of the Genoese: 1557 Asientos & Piacenza Clearing Fairs"
 oe_plat.10.d:0 "As Iberian royal debt restructurings eclipse older German bankers, Ligurian financiers step forward to inaugurate El Siglo de los Genoveses! By underwriting royal Asientos and launching the offshore Piacenza (Bisenzone) Clearing Fairs—settling continental silver purely via bills of exchange—Genoa becomes the financial heartbeat of Europe's silver tide."
 oe_plat.10.a:0 "Underwrite Royal Asientos and Launch the Piacenza Silver Clearing Fairs!"
 oe_plat.10.a.tt:0 "Raises Banking tier #G +1#!, sets the Piacenza clearing flag (bridging Eurasian Economy 2.0), and grants #Y 45 years#! of Century of the Genoese!"
 oe_plat.10.b:0 "Diversify Credit Across Free Cities to Hedge Sovereign Default"
 oe_plat.10.b.tt:0 "Shifts oligarchy axis #G -5#!, adds #G +150#! gold, and grants #Y 30 years#! of steady banking growth."
 oe_plat.11.t:0 "Roar of the Lepanto Heavy War Galleass (Galeazza)"
 oe_plat.11.d:0 "Master shipwrights unveil a terrifying hybrid of merchant carrack and war galley—the heavy Galeazza. Bristling with bronze cannon on towering decks yet propelled by oars even in dead calm, a vanguard of six galeazze can shred entire rival fleets before boarding ever begins."
 oe_plat.11.a:0 "Commission Heavy Galleass Flagships to Dominate the Sea!"
 oe_plat.11.a.tt:0 "Grants #G +15#! Navy Tradition and #Y 35 years#! of Lepanto Heavy Galleass Armada (+20% galley power, morale & blockade)."
 oe_plat.11.b:0 "Mass-Produce Fast Escort Galleys for Total Sea-Lane Patrols"
 oe_plat.11.b.tt:0 "Grants #Y 35 years#! of accelerated shipyard output and maritime presence."
 oe_plat.12.t:0 "The Twenty-Year Siege of Candia and the Atlantic Breakout"
 oe_plat.12.d:0 "Seventeenth-century rivalry squeezes the republic from both ends of the sea: eastern island fortresses endure relentless sieges while Atlantic empires siphon away global bullion. The Senate must choose—hold Crete's star forts with iron tenacity, or rally an Italian Commercial League to break past Gibraltar into the Atlantic."
 oe_plat.12.a:0 "Break Past Gibraltar: Launch the Italian Atlantic Commercial League!"
 oe_plat.12.a.tt:0 "Grants #Y 40 years#! of Italian Commercial League Atlantic Breakout (+30% naval & trade range, sea trade & merchant capacity)!"
 oe_plat.12.b:0 "Defend Candia and Every Aegean Bastion to the Last Cannon!"
 oe_plat.12.b.tt:0 "Grants #G +20#! Prestige and #Y 35 years#! of Unbroken Bastion of Candia (+20% fort defense, upkeep & naval morale)."
 oe_plat.13.t:0 "Reform of the Golden Book (Libro d'Oro)"
 oe_plat.13.d:0 "Centuries after the closing of the Golden Book (Libro d'Oro), the ancient patrician houses have grown insular and sparse while prosperous mainland merchants and bank shareholders remain barred from high office. Reformers warn that only opening the civic rolls can renew the republic."
 oe_plat.13.a:0 "Open the Libro d'Oro to Mainland Merchants and Bank Shareholders!"
 oe_plat.13.a.tt:0 "Opens the Libro d'Oro, shifts oligarchy #G -20#!, adds republican tradition, and grants #Y 40 years#! of Civic Renewal."
 oe_plat.13.b:0 "Preserve Ancient Patrician Exclusivity in the Golden Book"
 oe_plat.13.b.tt:0 "Shifts oligarchy #Y +15#!, adding #G +15#! Prestige and noble satisfaction."
 oe_plat.14.t:0 "Aldine Printing Presses, Murano Glass and the Enlightened Free Port"
 oe_plat.14.d:0 "Even as global sea routes widen, Italian workshops dazzle Europe: Aldine printing houses publish half the continent's classical editions, Murano furnaces shape matchless crystal glass, and Ligurian silk looms set courtly fashion. Paired with free-port liberties, cultural brilliance becomes economic power."
 oe_plat.14.a:0 "Charter an Enlightened Free Port and Patronize Presses & Glassworks"
 oe_plat.14.a.tt:0 "Grants #G +10#! Cultural Tradition, research progress, and #Y 35 years#! of Enlightened Free Port."
 oe_plat.14.b:0 "Guard Guild Trade Secrets Under Strict Mercantilist Tariffs"
 oe_plat.14.b.tt:0 "Adds #G +220#! gold and #Y 30 years#! of lucrative luxury production."
 oe_plat.15.t:0 "Defying Campo Formio: The Maritime Federal Constitution"
 oe_plat.15.d:0 "As late-eighteenth-century revolutions and continental ambitions close in on Italy's ancient maritime republics, history remembers the humiliation of Campo Formio (1797). Under our hand, however, Senate and new citizens proclaim a modernized Maritime Federal Constitution—arming the republic with constitutional vigor, modern naval gunfire, and unassailable sovereign credit."
 oe_plat.15.a:0 "Proclaim the Mediterranean Maritime Federal Constitution!"
 oe_plat.15.a.tt:0 "Grants the permanent Mediterranean Maritime Federal Constitution modifier (republican tradition, legislation, galleys, trade, interest & discipline)!"
 oe_plat.15.b:0 "Establish an Armed-Neutrality Commercial Directorate"
 oe_plat.15.b.tt:0 "Grants #Y 40 years#! of fortress deterrence and sovereign financial resilience."
 oe_plat.16.t:0 "Sovereign Debt Default and Harbor Collateral Arbitration"
 oe_plat.16.d:0 "A major foreign court burdened by continental wars abruptly suspends interest payments on our syndicates' sovereign bonds! The creditors' board convenes in emergency session: seize pledged customs and assert a formal Debt-Recovery Casus Belli, or restructure the bonds for sweeping commercial concessions."
 oe_plat.16.a:0 "Seize Pledged Customs and Assert Sovereign Debt-Recovery Rights!"
 oe_plat.16.a.tt:0 "Recovers #G +200#! gold, grants #Y 25 years#! of Sovereign Creditor Arbitration Leverage, and grants Debt-Recovery CB against major debtor rivals."
 oe_plat.16.b:0 "Restructure Sovereign Bonds into Long-Term Maritime Concessions"
 oe_plat.16.b.tt:0 "Grants #Y 30 years#! of Sovereign Creditor Leverage and #Y 25 years#! of enhanced sea-trade concessions."
 oe_plat.90.t:0 "Maritime Republics of Venice & Genoa: Status Ledger"
