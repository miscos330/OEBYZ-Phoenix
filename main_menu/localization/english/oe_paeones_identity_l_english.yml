l_english:
 oe_paeones_culture: "Paeonian"
 OE_RW_ASSIM_PAEONES_TITLE: "Begin Paeonian Identity Movement"
 OE_RW_ASSIM_PAEONES_ROW: "Paeonian Culture"
 OE_RW_ASSIM_PAEONES_FLAVOR: "The Danube crossings, Carpathian passes and market towns of the Hungarian plain now share the laws of the empire. The descendants of horsemen enter its armies, local clerks learn Greek letters, and monasteries and schools draw distant communities together. Keeping the memory of their homeland, they will take their place in the Roman world as the Paeones."
 OE_RW_ASSIM_PAEONES_CONDITION: "The first start requires Byzantium and all levels of its subjects to own at least 80% of conquerable locations in Carpathia, excluding Wallachia and Moldavia. Occupation alone does not count. An existing legacy movement may be restarted once."
 OE_RW_ASSIM_PAEONES_NOT_STARTED: "The corrected Paeonian identity movement has not begun; a legacy movement may be restarted once"
 OE_RW_ASSIM_PAEONES_SOURCES: "Assimilates [ShowCultureName('hungarian')] culture."
 OE_RW_ASSIM_PAEONES_TARGET: "Gradually converts [ShowCultureName('hungarian')] population in Byzantium and all levels of its subjects to [ShowCultureName('oe_paeones_culture')] culture. Locations without Hungarian population or outside the empire do not spread the movement further.\n\nIn an older save, use the start button once to rebuild the movement and clear its excessive spread. Population already assimilated is retained.\n\n$OE_IDENTITY_FIXED_30Y_DESC$"
 OE_RW_ASSIM_PAEONES_WAITING: "Not started / legacy restart available"
 OE_RW_ASSIM_PAEONES_STARTED: "Started: Paeones"
 oe_paeones_identity_movement: "Paeonian Identity Movement"
 oe_paeones_identity_movement_desc: "The Danube crossings, Carpathian passes and market towns of the Hungarian plain now share the laws of the empire. The descendants of horsemen enter its armies, local clerks learn Greek letters, and monasteries and schools draw distant communities together. Keeping the memory of their homeland, they will take their place in the Roman world as the Paeones.\n\n$OE_IDENTITY_FIXED_30Y_DESC$"
 oe_rw_paeones_romanization_started: "Paeonian Romanization begun"
 OE_RW_END_CONTEST_REWARDS: "Gain #G 50#! Imperial Authority and #G 20#! Stability."
 OE_RW_ASSIM_PAEONES_PROGRESS: "Owned: [GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_rw_assim_paeones_owned')|0] / [GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_rw_assim_paeones_total')|0]; at least [GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_rw_assim_paeones_required')|0] required."
 OE_RW_ASSIM_PAEONES_VALID_ORIGIN: "At least one location in Carpathia, excluding Wallachia and Moldavia, is owned by Byzantium or any level of its subjects and still has Hungarian population."
