 oe_hegemony_triumphs.5.t: "Eagles on the Western Shore"
 oe_hegemony_triumphs.5.d: "The trumpets sound for those who crossed the mountains of Iberia. Infantry and cavalry lead the standards: they searched dry riverbeds for water, waited for dawn beneath stone fortresses and hauled baggage up steep roads. The returning ships carry tired, proud people. The capital's acclaim gathers their scattered hardships into a victory remembered by the whole Empire.\n\nImperial horizons now reach the western ocean, and ports and trade routes will connect what were once distant borderlands. Peoples of different faiths will also bring their laws, lands and promises before the throne. A triumph can proclaim conquest, but it cannot govern. Garrisons, local officials and merchants must together keep open the road to the western shore."
 oe_hegemony_triumphs.5.a: "Let the Empire remember their deeds."
