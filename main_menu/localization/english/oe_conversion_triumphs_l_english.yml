 oe_hegemony_triumphs.3.t: "The Ancient Road, the Living Army"
 oe_hegemony_triumphs.3.d: "The standards of the Italian campaign rise above the capital, and military music drowns the harbour's noise. Veterans remember cold passes, fighting at the gates and hunger on long sea crossings. They march before the throne with returning commanders and clerks who recorded the campaign. The crowd cries the name of Rome, as roads known only from books have again felt the tread of imperial soldiers.\n\nThe return to Italy concerns more than ancient frontiers. It will reshape Adriatic shipping, the alliances of cities and the regard of western princes for the throne. The sea that divided East and West is becoming a road between them. Today the army's deeds enter the rolls; tomorrow fair law and dependable garrisons must show the towns what Rome's return will mean."
 oe_hegemony_triumphs.3.a: "Let the Empire remember their deeds."
