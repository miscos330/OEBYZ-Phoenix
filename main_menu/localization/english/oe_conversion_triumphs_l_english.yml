 oe_hegemony_triumphs.6.t: "Triumph Beyond the Mist"
 oe_hegemony_triumphs.6.d: "The soldiers returned from across the Channel pass through the Golden Gate, their shields still marked by northern rain and mist. They landed amid unfamiliar tides, advanced along surviving ancient roads and fought for a foothold between muddy fields and strong walls. Roads once trodden by the legions again carry imperial standards. The capital cheers for the returning troops and stands silent for those lost overseas.\n\nEngland's harbours and fields carry the throne's reach beyond the western Channel. The new voyage also brings long supply lines and loyalties harder to sustain. Ancient walls cannot guard towns for today's officials, nor can an old title provision an army. The triumph witnesses Rome's return to Britain; whether that return takes root will depend on the life the Empire builds with its inhabitants."
 oe_hegemony_triumphs.6.a: "Let the Empire remember their deeds."
