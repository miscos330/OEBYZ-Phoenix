l_english:
 oe_byz_demand_orthodox_conversion: "Demand Conversion"
 oe_byz_demand_orthodox_conversion_desc_specific: "In the name of the throne, require a non-Orthodox character of the Crown or Nobility estate within our country to embrace Orthodoxy. Costs #R 1#! Imperial Authority and converts the selected character immediately."
 oe_byz_demand_orthodox_conversion_concept: "#bold #color_yellow Religious Conformity#!#!"
 oe_byz_demand_orthodox_conversion_act_past: "Has embraced the Orthodox faith."
 OE_CONVERSION_CHOOSE_CHARACTER: "Choose a Character to Convert"
 OE_CONVERSION_NO_CANDIDATE: "No eligible character: the character must be alive, belong to the Crown or Nobility estate in the Eastern Roman Empire, and follow a faith other than Orthodoxy."
 OE_CONVERSION_AUTHORITY_REQUIRED: "The Pillars of the Empire must have at least #Y 1#! Authority."
 OE_CONVERSION_AUTHORITY_COST: "Spend #R 1#! Imperial Authority."
 oe_heg_stabilize_africa: "Stabilize North Africa"
 oe_heg_stabilize_africa_desc: "The gates taken by the expedition must pass into the keeping of officials who can hold them for years to come. The throne will recognize the provincial administration of a North African subject, bringing tax rolls, garrisons and towns under settled government."
 oe_heg_stabilize_africa_effect: "Select a direct subject with its capital in the Maghreb region, make the $oe_roman_province$ government reform available, and add it. Its government type, ruler, faith and subject type are preserved. Countries already possessing this reform are excluded."
 OE_HEG_CHOOSE_AFRICA_SUBJECT: "Choose a North African Subject"
 OE_HEG_NO_AFRICA_SUBJECT: "No eligible direct subject: its capital must be in the Maghreb region and it must not already possess the $oe_roman_province$ government reform."
 OE_HEG_TRIUMPH_LAND_REQUIRED: "The Eastern Roman Empire or one of its subjects at any level must own at least one ownable location within the area covered by this triumph."
 OE_HEG_TRIUMPH_ARMY_AWARD: "Army Reform Score #G +$VALUE|0$#!."
 OE_HEG_TRIUMPH_AUTHORITY_AWARD: "Imperial Authority #G +$VALUE|1$#!."
 OE_HEG_TRIUMPH_OPINION_AWARD: "Public Opinion #G +5#!, up to a maximum of 100."
 oe_heg_triumph_africa: "Hold a Triumph"
 oe_heg_triumph_africa_desc: "Celebrate the soldiers who fought in North Africa. The throne will read the names of the distinguished and the fallen, so the capital remembers the hardships behind the standards and the new lands hear Rome's promise. Once per region."
 oe_heg_triumph_africa_effect: "Triggers the triumph event for North Africa. When the event opens, each ownable location owned by the Eastern Roman Empire or any of its subjects at any level in the Maghreb region grants #G +1#! Army Reform Score and #G +0.1#! Imperial Authority. Also grants #G +10#! Stability, #G +10#! Legitimacy and #G +5#! Public Opinion. Ownership only: military occupation and independent allies do not count. Each location counts once. Once per region."
 oe_heg_triumph_africa_done: "Celebrated: Triumph of North Africa"
 oe_hegemony_triumphs.1.t: "Eagles Returned from the Desert"
 oe_hegemony_triumphs.1.d: "Dust-stained standards pass through the Golden Gate, and the drums carry from the walls to the Hippodrome. Salt has eaten into the soldiers' armour. Veterans raise battered shields before the crowd: some held wells in a foreign land, others escorted grain through burning mountain passes, and some never boarded the ships home. The Emperor orders the names of the fallen and the distinguished read aloud, leaving a place in the celebration for those who cannot return.\n\nNorth Africa's harbours and caravan routes now enter imperial plans, and the western Mediterranean is no longer merely a frontier drawn by enemies. Yet conquest leaves tax rolls to settle, roads to repair and towns to reassure. The lessons of this campaign will pass through the camps; whether the eagle remains abroad will depend on the government that follows it."
 oe_hegemony_triumphs.1.a: "Let the Empire remember their deeds."
