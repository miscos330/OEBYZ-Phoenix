 oe_hegemony_triumphs.4.t: "Triumph Beyond the Mountains"
 oe_hegemony_triumphs.4.d: "Standards from Gaul, marked by rain and smoke, are carried high into the capital. The soldiers crossed narrow passes, fought for bridges and endured long sieges outside towns whose language they did not know. Shields, saddles and packs bear the weight of journeys no dispatch can fully describe. Clerks read the soldiers' names before the throne, and the distant battlefield at last finds an echo the capital can hear.\n\nGaul's valleys, fields and trade routes bring the Empire into direct contact with the old order of the western kingdoms. Noble agreements, civic liberties and local customs cannot be erased by a single decree. Today the army has proved its courage. Tomorrow the throne must prove that Roman law can accommodate the lands newly brought under its authority."
 oe_hegemony_triumphs.4.a: "Let the Empire remember their deeds."
