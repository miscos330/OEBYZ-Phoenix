 oe_heg_triumph_africa_pending: "North Africa Triumph Pending"
 oe_heg_triumph_africa_rewarded: "North Africa Triumph Rewards Granted"
 oe_heg_triumph_egypt: "Hold a Triumph"
 oe_heg_triumph_egypt_desc: "Celebrate the soldiers who fought in Egypt. The throne will read the names of the distinguished and the fallen, so the capital remembers the hardships behind the standards and the new lands hear Rome's promise. Once per region."
