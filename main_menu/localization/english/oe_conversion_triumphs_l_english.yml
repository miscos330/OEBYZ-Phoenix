 oe_hegemony_triumphs.2.t: "Triumph of the Nile and the Holy Land"
 oe_hegemony_triumphs.2.d: "The procession enters the capital bearing the dust of the Nile and the scars of Levantine mountain roads. The troops bridged canals, endured arrows beneath city walls and kept weary supply trains moving through dry country. Sailors, infantry and horsemen now pass the stands together as flowers fall from the crowd. Before the throne, a campaign map is unfolded and the towns won at such cost are named aloud.\n\nAlexandria's sea lanes, the fields of the Nile and the roads to the Holy Land promise grain, commerce and renown. The Church hopes for safe pilgrims and merchants for returning fleets, while officials reckon the cost of canals, taxes and garrisons. The triumph shows that Rome can return to the East; the throne must now make victory endure as orderly government."
 oe_hegemony_triumphs.2.a: "Let the Empire remember their deeds."
