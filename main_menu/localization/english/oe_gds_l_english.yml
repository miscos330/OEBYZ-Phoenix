# NEW 2026-11-23 v19.0 Module 19.0-A: Strategic Trade Goods, Great Intercontinental Canals, Pop Social Mobility & Late-Game Situations Bridges (oe_gds_, 0 mainline slots, 0 rules, 0 vanilla overrides). Generated by gen_v190_goods_canals.py; edit the generator, not this file.
 oe_refined_steel: "Crucible & Bessemer Steel"
 oe_refined_steel_desc: "Homogeneous, low-slag high-carbon steel refined in sealed clay crucibles and air-blast converters. Essential for precision ordnance, railway rails, marine chronometer springs, and industrial machinery."
 oe_porcelain_tea_chests: "Export Porcelain & Tea Chests"
 oe_porcelain_tea_chests_desc: "Fine blue-and-white export porcelain packed as watertight ballast beneath lead-lined chests of cured East Asian leaf tea — the supreme luxury staple of intercontinental maritime commerce."
 oe_industrial_chemicals: "Soda Ash, Dyes & Industrial Chemicals"
 oe_industrial_chemicals_desc: "Manufactured soda ash, lead-chamber vitriol, bleaching reagents, and colorfast chemical dyes that fuel industrial textile mills, glassworks, and high-volume porcelain glazing."
 oe_chronometers: "Marine Chronometers & Precision Instruments"
 oe_chronometers_desc: "Gimballed brass marine chronometers, optical sextants, and temperature-compensated timepieces that solve longitude at sea and anchor Enlightenment astronomy and global navigation."
 oe_gds_steel_works: "Crucible & Bessemer Steel Works"
 oe_gds_steel_works_desc: "An advanced metallurgical manufactory available from 1620 onward that refines iron, coal, and steel into Crucible & Bessemer Steel while raising local steel output and urban construction speed."
 oe_gds_porcelain_export_kiln: "Imperial Export Porcelain & Tea Kiln"
 oe_gds_porcelain_export_kiln_desc: "A maritime export manufactory available from 1560 onward that pairs fine porcelain with cured leaf tea in waterproof Export Porcelain & Tea Chests, expanding local merchant capacity and trade power."
 oe_gds_chemical_manufactory: "Soda Ash & Chemical Manufactory"
 oe_gds_chemical_manufactory_desc: "An Enlightenment-era chemical plant available from 1680 onward that processes salt, alum, dyes, and coal into Industrial Chemicals, boosting dye and alum output alongside local production efficiency."
 oe_gds_chronometer_guild: "Marine Chronometer & Instrument Guild"
 oe_gds_chronometer_guild_desc: "A precision horological and optical workshop available from 1710 onward that crafts Marine Chronometers & Precision Instruments, accelerating local shipbuilding, maritime presence, and institution growth."
 oe_gds_pm_crucible_refined_steel: "Clay-Crucible Homogeneous Steel"
 oe_gds_pm_crucible_refined_steel_desc: "Melts blister steel and wrought iron in sealed refractory clay crucibles over coke hearths to cast homogeneous high-carbon ingots."
 oe_gds_pm_bessemer_converter_steel: "Air-Blast Converter Refined Steel"
 oe_gds_pm_bessemer_converter_steel_desc: "Forces heated air blasts through tilting converters to decarburize molten pig iron rapidly into tonnage-grade structural and ordnance steel."
 oe_gds_pm_canton_tea_porcelain_chests: "Lead-Lined Maritime Tea & Porcelain Chests"
 oe_gds_pm_canton_tea_porcelain_chests_desc: "Packs fine blue-and-white export porcelain beneath lead-sealed tea caddies inside seasoned timber crates built to survive monsoon voyages."
 oe_gds_pm_cobalt_chemical_export_chests: "Refined Cobalt-Enamel Imperial Export Chests"
 oe_gds_pm_cobalt_chemical_export_chests_desc: "Uses refined chemical glazes, cobalt oxides, and wax-paper linings to ship premium enameled porcelain and high-grade leaf tea at peak ocean volume."
 oe_gds_pm_leblanc_soda_vitriol: "Lead-Chamber Vitriol & Soda Ash"
 oe_gds_pm_leblanc_soda_vitriol_desc: "Roasts sea salt, alum, and saltpeter over coal furnaces in lead-lined chambers to produce industrial soda ash, mineral acids, and bleaching salts."
 oe_gds_pm_industrial_dye_reagents: "Distilled Mordants & Fast Chemical Dyes"
 oe_gds_pm_industrial_dye_reagents_desc: "Refines concentrated mordants, glass-retort acids, and standardized dye cakes that feed textile mills, porcelain kilns, and glassworks alike."
 oe_gds_pm_brass_marine_chronometers: "Gimballed Brass Marine Chronometers"
 oe_gds_pm_brass_marine_chronometers_desc: "Hand-cuts brass escapements, crystal lenses, and gilt balance wheels mounted in gimbals so ocean navigators can determine longitude at sea."
 oe_gds_pm_precision_bimetallic_chronometers: "Temperature-Compensated Bimetallic Chronometers"
 oe_gds_pm_precision_bimetallic_chronometers_desc: "Pairs crucible-steel hairsprings, chemically etched silver dials, and optical sextant prisms to mass-produce fleet-grade precision instruments."
 oe_gds_realm_urban_mobility_tt: "Up to #Y 2#! of our most developed towns or cities promote #G Peasant#! pops into urban #G Laborers#! and #G Burghers#!."
 oe_gds_dec_suez_canal.title: "Excavate the Suez Isthmus Canal"
 oe_gds_dec_suez_canal.desc: "Cut a deep-water intercontinental channel across the Isthmus of Suez linking Tinnis on the Mediterranean with Suez on the Red Sea. Physically opens the Suez Canal waterway on the world map, elevates Suez and Tinnis into permanent maritime hubs with urban burgher promotion, and grants the #G Custodian of the Suez Canal#! modifier. Costs #Y 3000#! gold."
 oe_gds_dec_suez_canal.a: "Open the Twin-Sea Suez Waterway"
 oe_gds_dec_panama_canal.title: "Cut the Panama Interoceanic Canal"
 oe_gds_dec_panama_canal.desc: "Carve terraced masonry locks across the Isthmus of Panama between Chuchures and Panama City. Physically opens the Panama Canal waterway on the world map, transforms both isthmian ports into booming interoceanic trade centers with urban burgher promotion, and grants the #G Custodian of the Panama Canal#! modifier. Costs #Y 3500#! gold."
 oe_gds_dec_panama_canal.a: "Join the Atlantic and Pacific Oceans"
 oe_gds_dec_kiel_canal.title: "Excavate the Kiel Baltic–North Sea Canal"
 oe_gds_dec_kiel_canal.desc: "Link Kiel Fjord and Rendsburg across Holstein with fortified sea locks, letting Baltic merchantmen and battle fleets bypass the Jutland peninsula. Upgrades Kiel and Rendsburg into permanent naval-trade basins with urban burgher promotion and grants #G Custodian of the Kiel Canal#!. Costs #Y 2200#! gold."
 oe_gds_dec_kiel_canal.a: "Cut the Holstein Sea-Lock Channel"
 oe_gds_dec_volga_don_canal.title: "Dig the Volga–Don Steppe Portage Canal"
 oe_gds_dec_volga_don_canal.desc: "Replace the ancient steppe portage between Beljamen on the Volga and Ilovlya on the Don with permanent sluice locks, uniting the Caspian and Black Sea trade basins. Elevates both river towns with urban burgher promotion and grants #G Custodian of the Volga–Don Canal#!. Costs #Y 2000#! gold."
 oe_gds_dec_volga_don_canal.a: "Unite the Volga and Don Basins"
 oe_gds_dec_grand_canal_dredge.title: "Commission the Imperial Grand Canal Grand Dredging"
 oe_gds_dec_grand_canal_dredge.desc: "Mobilize hydraulic engineers to dredge silted locks, rebuild stone dikes, and expand grain-and-porcelain barge capacity from Hangzhou through Jiangdu (Yangzhou) and Linqing to Dadu. Permanently empowers the canal hubs with urban burgher promotion and grants #G Grand Steward of the Imperial Grand Canal#!. Costs #Y 2400#! gold."
 oe_gds_dec_grand_canal_dredge.a: "Dredge the Grand Canal from Hangzhou to Dadu"
 STATIC_MODIFIER_NAME_oe_gds_loc_suez_canal_hub: "Suez Intercontinental Canal Locks"
 STATIC_MODIFIER_DESC_oe_gds_loc_suez_canal_hub: "Dredged salt-water locks and granite quays turn the Suez Isthmus into the busiest maritime chokepoint between the Mediterranean and the Indian Ocean."
 STATIC_MODIFIER_NAME_oe_gds_loc_panama_canal_hub: "Panama Interoceanic Canal Locks"
 STATIC_MODIFIER_DESC_oe_gds_loc_panama_canal_hub: "Terraced masonry locks lift ocean-going galleons and steam packets across the Continental Divide between the Atlantic and Pacific."
 STATIC_MODIFIER_NAME_oe_gds_loc_kiel_canal_hub: "Kiel Baltic–North Sea Canal Basin"
 STATIC_MODIFIER_DESC_oe_gds_loc_kiel_canal_hub: "Fortified sluice gates and wide towpaths allow grain, timber, and warships to transit Holstein directly without rounding Jutland."
 STATIC_MODIFIER_NAME_oe_gds_loc_volga_don_canal_hub: "Volga–Don Steppe Portage Canal"
 STATIC_MODIFIER_DESC_oe_gds_loc_volga_don_canal_hub: "Steppe lock-chambers join the lower Volga to the Don river basin, opening an unbroken inland sea lane from the Caspian to the Black Sea."
 STATIC_MODIFIER_NAME_oe_gds_loc_grand_canal_hub: "Dredged Imperial Grand Canal Lock Station"
 STATIC_MODIFIER_DESC_oe_gds_loc_grand_canal_hub: "Rebuilt stone embankments, hydraulic spillways, and dredged channels carry ten thousand grain, silk, and porcelain barges between Jiangnan and the northern capital."
 STATIC_MODIFIER_NAME_oe_gds_mod_suez_canal_dominion: "Custodian of the Suez Canal"
 STATIC_MODIFIER_DESC_oe_gds_mod_suez_canal_dominion: "Control of the Suez waterway halves the voyage between Europe and Asia, pouring customs dues and strategic maritime reach into imperial coffers."
 STATIC_MODIFIER_NAME_oe_gds_mod_panama_canal_dominion: "Custodian of the Panama Canal"
 STATIC_MODIFIER_DESC_oe_gds_mod_panama_canal_dominion: "Commanding the Panama locks links Atlantic and Pacific trade networks directly, sparing merchant and battle fleets the treacherous Cape Horn passage."
 STATIC_MODIFIER_NAME_oe_gds_mod_kiel_canal_dominion: "Custodian of the Kiel Canal"
 STATIC_MODIFIER_DESC_oe_gds_mod_kiel_canal_dominion: "Direct canal transit across Holstein bypasses the Danish Sound, knitting Baltic grain and naval stores seamlessly into North Sea commerce."
 STATIC_MODIFIER_NAME_oe_gds_mod_volga_don_canal_dominion: "Custodian of the Volga–Don Canal"
 STATIC_MODIFIER_DESC_oe_gds_mod_volga_don_canal_dominion: "Linking the Caspian basin to the Sea of Azov turns the Eurasian steppe rivers into a unified trade, grain, and strategic logistics corridor."
 STATIC_MODIFIER_NAME_oe_gds_mod_grand_canal_dominion: "Grand Steward of the Imperial Grand Canal"
 STATIC_MODIFIER_DESC_oe_gds_mod_grand_canal_dominion: "A fully dredged and hydraulically regulated Grand Canal secures northern granaries, binds southern manufactories to imperial authority, and steadies state revenue."
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_crucible_steel_crown: "Crown Crucible Steel Foundries"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_crucible_steel_crown: "Imperial metallurgical commissioners standardize crucible clays and blast-converter steel grades across arsenals, dockyards, and rail works."
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_steel_guild_patents: "Open Metallurgical Guild Patents"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_steel_guild_patents: "Independent steelmasters license crucible and converter designs across provincial cities, drawing rural hands into skilled urban workshops."
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_export_kiln_monopoly: "Imperial Porcelain & Tea Packing Monopoly"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_export_kiln_monopoly: "Official customs hallmarks guarantee unblemished blue-and-white wares and dry cured leaf chests, commanding premium silver prices in foreign harbors."
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_export_tea_consortia: "Free Maritime Porcelain & Tea Consortia"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_export_tea_consortia: "Licensed merchant syndicates from Quanzhou to Constantinople pool venture capital to dispatch swift clippers loaded with tea and porcelain chests."
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_chemical_state_works: "State Soda Ash & Chemical Laboratories"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_chemical_state_works: "Crown-funded lead chambers and chemical retorts supply pure soda ash, vitriol, and colorfast dyes to textile, glass, and gunpowder industries."
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_chemical_municipal_guilds: "Municipal Apothecary & Bleaching Guilds"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_chemical_municipal_guilds: "Urban dyers, apothecaries, and glassmakers form licensed guilds that spread chemical craft while elevating skilled town artisans."
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_admiralty_chronometers: "Standardized Admiralty Marine Chronometers"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_admiralty_chronometers: "Every flagship and chartered East Indiaman carries gimballed precision chronometers, slashing shipwrecks and opening direct blue-water crossings."
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_horological_academies: "Royal Horological & Instrument Academies"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_horological_academies: "Master clockmakers and opticians train generations of precision engineers, seeding optical glasswork, surveying, and mechanical science."
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_suez_open_toll: "International Suez Toll Convention"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_suez_open_toll: "Equal transit schedules for merchant ships of every flag turn Suez into a fountain of customs revenue and international diplomatic prestige."
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_suez_fortress_gate: "Fortified Suez Admiralty Gate"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_suez_fortress_gate: "Coastal batteries and armored lock-forts ensure that only fleets bearing our sovereign pass may cross between the Red Sea and the Mediterranean."
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_panama_free_port: "Trans-Isthmian Free Port Company"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_panama_free_port: "Bonded warehouses at both ocean mouths make the Panama Canal the indispensable transshipment hinge of the Atlantic and Pacific economies."
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_panama_admiralty: "Two-Ocean Panama Admiralty Station"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_panama_admiralty: "Drydocks and fortified coaling yards let a single imperial battle fleet swing rapidly from the Caribbean to the Pacific Rim."
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_kiel_free_channel: "Kiel Baltic Free-Transit Channel"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_kiel_free_channel: "Merchant convoys desert the stormy Skagerrak for sheltered Holstein locks, enriching Hanseatic and North Sea counting houses alike."
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_kiel_naval_basin: "Kiel Twin-Sea Naval Transit Basin"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_kiel_naval_basin: "Deepened naval docks at Kiel and Rendsburg allow squadrons to redeploy overnight between Baltic and North Sea battlegrounds."
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_volga_don_trade_artery: "Caspian–Black Sea River Trade Artery"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_volga_don_trade_artery: "Persian silk, Astrakhan salt, and steppe grain glide smoothly across the Volga–Don locks to Mediterranean and Pontic markets."
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_volga_don_flotilla: "Imperial Steppe River Flotillas"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_volga_don_flotilla: "Armored river gunboats and barge supply trains project rapid imperial authority across the Pontic-Caspian steppe frontier."
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_grand_canal_tribute_fleets: "Imperial Grand Canal Tribute Grain Fleets"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_grand_canal_tribute_fleets: "Expanded state grain barges and sluice-keepers keep metropolitan granaries brimming through flood and drought alike."
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_grand_canal_merchant_locks: "Chartered Grand Canal Merchant Lock-Houses"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_grand_canal_merchant_locks: "Opening surplus sluice schedules to private porcelain, silk, and cotton barges turns every canal lock from Hangzhou to Linqing into a booming commercial town."
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_tordesillas_mare_liberum: "Eurasian Doctrine of Mare Liberum"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_tordesillas_mare_liberum: "Rejecting any two-crown partition of the globe, our jurists and admirals proclaim the open oceans common to all sovereign flags."
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_tordesillas_eurasian_accord: "Parallel Eurasian Maritime Spheres"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_tordesillas_eurasian_accord: "Counter-charters signed across Mediterranean, Indian Ocean, and East Asian courts guarantee reciprocal sea-lane access outside Iberian claims."
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_antimeridian_convoys: "Eastern Spice & Silver Galleon Convoys"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_antimeridian_convoys: "Armed merchantmen ply the anti-meridian routes linking Malacca, Manila, Nagasaki, and Hormuz, capturing the global silver-for-porcelain trade."
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_antimeridian_straits: "Fortified Straits Maritime Jurisdiction"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_antimeridian_straits: "Patrol squadrons and customs citadels assert undisputed sovereign tolls over the straits where Atlantic claims collide with Asian empires."
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_piracy_escort_syndicate: "Trans-Eurasian Anti-Piracy Escort Syndicate"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_piracy_escort_syndicate: "Joint frigate patrols sweep buccaneers, Barbary rovers, and Malacca sea-raiders from key trade chokepoints, restoring safe maritime passage."
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_piracy_privateer_charters: "Imperial Letters of Marque & Privateers"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_piracy_privateer_charters: "Licensed sea-captains redirect the golden age of piracy against rival bullion fleets, turning lawless rovers into instruments of statecraft."
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_piracy_marine_insurance: "Chartered Maritime Underwriting Houses"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_piracy_marine_insurance: "Coffeehouse and harbor underwriting syndicates pool maritime risk across hundreds of voyages, keeping credit cheap even in pirate-haunted seas."
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_piracy_corsair_amnesty: "Royal Corsair Amnesty & Pilot Corps"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_piracy_corsair_amnesty: "Pardoned corsairs and smugglers enter royal service as coastal pilots, reef-charting navigators, and fast-cruiser commanders."
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_rev_constitutional_charter: "Imperial Constitutional Charter Assembly"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_rev_constitutional_charter: "Granting an orderly constitutional charter absorbs revolutionary fervor into lawful representation, expanding civic literacy and urban enterprise."
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_rev_legitimist_concert: "Legitimist Concert & Imperial Censorship"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_rev_legitimist_concert: "Vigilant chancelleries and loyal garrisons quarantine subversive broadsheets, fortifying crown authority across every province."
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_rev_civil_code: "Unified Civil Code & Meritocratic Bureaucracy"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_rev_civil_code: "Equal commercial courts, standardized weights, and careers open to talent unleash the full energy of an ascending Eurasian bourgeoisie."
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_rev_traditional_estates: "Preserved Provincial Estates & Ancient Liberties"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_rev_traditional_estates: "Reaffirming chartered noble, clerical, and provincial liberties steadies rural loyalty and spares the realm from abrupt legal rupture."
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_rev_constitutional_compact: "Trans-Eurasian Constitutional Compact"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_rev_constitutional_compact: "Reformed empires and constitutional states across Europe and Asia codify open commerce, scholarly exchange, and lawful diplomacy."
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_rev_congress_of_crowns: "Grand Eurasian Congress of Crowns"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_rev_congress_of_crowns: "Sovereign courts from Constantinople and Vienna to Moscow and Beijing uphold an iron concert of borders, armies, and dynastic order."
 oe_gds.1.title: "The Crucible & Converter Steel Breakthrough"
 oe_gds.1.desc: "Master ironfounders have perfected sealed refractory crucibles and high-blast steel hearths capable of turning brittle pig iron into spotless, elastic Refined Steel. Cannon founders, spring-makers, and shipwrights clamor for this wonder metal, while rural folk pour into foundry towns to become skilled laborers and burghers."
 oe_gds.1.a: "Charter Crown Crucible Steel Foundries"
 oe_gds.1.b: "Grant Open Metallurgical Guild Patents"
 oe_gds.2.title: "Blue-and-White Kilns & Ocean Tea Chests"
 oe_gds.2.desc: "Across maritime counting houses from Canton and Quanzhou to Alexandria and Amsterdam, merchants have found a lucrative pairing: packing dense crates of translucent export porcelain beneath lead-lined chests of cured tea as waterproof ballast. Demand is surging across every court in Eurasia, transforming port artisans into prosperous burghers."
 oe_gds.2.a: "Establish an Imperial Porcelain & Tea Packing Monopoly"
 oe_gds.2.b: "Charter Free Maritime Tea & Porcelain Consortia"
 oe_gds.3.title: "Lead Chambers, Soda Ash & Industrial Chemicals"
 oe_gds.3.desc: "No longer content with scarce wood-ash potash and fickle plant dyes, chemical savants have erected lead-lined chambers and glass retorts that synthesize soda ash, vitriol, bleaches, and colorfast mordants straight from sea salt, alum, and coal. Textile mills, glassworks, and export kilns stand ready for a vast leap in output."
 oe_gds.3.a: "Build State Chemical & Mordant Works"
 oe_gds.3.b: "License Municipal Apothecary & Bleaching Guilds"
 oe_gds.4.title: "The Longitude Prize & Marine Chronometers"
 oe_gds.4.desc: "For centuries, fleets sailing out of sight of land guessed their longitude by dead reckoning and lost whole squadrons on uncharted reefs. Now a master horologist has unveiled a gimballed brass marine chronometer with a temperature-compensated balance wheel that keeps exact meridian time through tropic heat and gale swells."
 oe_gds.4.a: "Equip the Fleet with Standard Admiralty Chronometers"
 oe_gds.4.b: "Found Royal Horological & Instrument Academies"
 oe_gds.5.title: "The Suez Canal Opens: Twin Seas United"
 oe_gds.5.desc: "Cannon salutes thunder across the desert dunes as the final earthen dike collapses and emerald waters of the Mediterranean rush to mingle with the Red Sea. Dressed in flags from mast to yardarm, the inaugural imperial flotilla glides smoothly past granite lock-houses, cutting the sea route between Europe and the Indies in half."
 oe_gds.5.a: "Proclaim an Open International Suez Toll Convention"
 oe_gds.5.b: "Fortify the Suez Admiralty Lock Gate"
 oe_gds.6.title: "The Panama Cut: Two Oceans Linked"
 oe_gds.6.desc: "After years of carving through basalt ridges and malaria-haunted jungle, colossal timber-and-iron lock gates swing wide across the Isthmus of Panama. For the first time in human history, a merchant vessel lifts cleanly over the Continental Divide and descends from the Atlantic into the vast Pacific without ever sighting Cape Horn."
 oe_gds.6.a: "Charter the Trans-Isthmian Free Port Company"
 oe_gds.6.b: "Establish the Two-Ocean Panama Admiralty Station"
 oe_gds.7.title: "The Kiel Canal: Bypassing the Sound"
 oe_gds.7.desc: "With masonry locks sealed from Kiel Fjord through Rendsburg to the North Sea estuaries, grain hulks and heavy ships of the line now slip swiftly across Holstein in calm water. Merchants rejoice at escaping the stormy Skagerrak and foreign Sound Dues, while admirals admire a strategic shortcut between two northern seas."
 oe_gds.7.a: "Open a Competitive Baltic Free-Transit Channel"
 oe_gds.7.b: "Fortify the Twin-Sea Naval Transit Basin"
 oe_gds.8.title: "The Volga–Don Canal: Steppe Seas Conjoined"
 oe_gds.8.desc: "Where nomadic horsemen and river haulers once dragged timber skiffs over dry steppe clay, engineered lock-basins between Beljamen and Ilovlya now float deep-draft barges effortlessly from the Volga into the Don. Silk caravans from Persia and grain convoys from the Russian heartland now enjoy an unbroken river highway to the Black Sea."
 oe_gds.8.a: "Charter the Caspian–Black Sea River Trade Artery"
 oe_gds.8.b: "Deploy Imperial Steppe River Flotillas"
 oe_gds.9.title: "The Imperial Grand Canal Reborn"
 oe_gds.9.desc: "From the silk looms of Hangzhou across the roaring Yangtze at Jiangdu and the customs locks of Linqing to the granaries of Dadu, newly dredged channels and granite sluice gates hum with the oars of ten thousand barges. River towns swell with merchants and artisans as the spine of the Celestial economy beats with renewed strength."
 oe_gds.9.a: "Expand the Imperial Tribute Grain Barge Fleets"
 oe_gds.9.b: "Open Chartered Merchant Lock-Houses Along the Canal"
 oe_gds.10.title: "The Meridian of Tordesillas Challenged"
 oe_gds.10.desc: "Cartographers lay a gilded globe before our council: Iberian chancelleries have drawn a meridian from pole to pole, presuming to partition the newly charted oceans and western continents between two crowns alone. Across Constantinople, Beijing, Cairo, and the free maritime states, envoys ask how we shall answer this audacious monopoly over the seas."
 oe_gds.10.a: "Proclaim Mare Liberum and Contest the Meridian"
 oe_gds.10.b: "Negotiate Parallel Eurasian Maritime Spheres"
 oe_gds.11.title: "The Antipodal Meridian: Malacca & the Spice Ocean"
 oe_gds.11.desc: "When the Tordesillas line is projected around the far side of the globe, it slices straight across the Spice Islands, Malacca, and the China Seas. Atlantic caravels loaded with American silver now meet Eastern junks, dhows, and galleys head-on — turning the Indian Ocean and Pacific rim into a single interconnected arena of wealth and rivalry."
 oe_gds.11.a: "Charter Eastern Spice & Silver Galleon Convoys"
 oe_gds.11.b: "Fortify the Straits and Assert Maritime Jurisdiction"
 oe_gds.12.title: "Golden Age of Piracy: Caribbean, Barbary & Malacca"
 oe_gds.12.desc: "The maritime chaos unleashed by the Golden Age of Piracy has spilled far beyond the West Indies. Veteran buccaneers, Barbary corsairs, and South China Sea rovers exchange charts and black-market gunpowder across continents, preying on silver convoys and tea clippers from Algiers to the Straits of Malacca."
 oe_gds.12.a: "Lead a Trans-Eurasian Anti-Piracy Escort Syndicate"
 oe_gds.12.b: "Issue Imperial Letters of Marque to Privateers"
 oe_gds.13.title: "Pirate Havens, Marine Insurance & Corsair Amnesty"
 oe_gds.13.desc: "Years of convoy warfare have forced harbor merchants and admiralties alike to adapt. Wealthy counting houses propose pooling voyage risks into chartered maritime insurance syndicates, while naval commanders argue that a timely royal pardon could turn notorious pirate captains into priceless reef-pilots and cruiser skippers."
 oe_gds.13.a: "Charter Maritime Underwriting & Convoy Insurance Houses"
 oe_gds.13.b: "Proclaim a Royal Corsair Amnesty and Pilot Corps"
 oe_gds.14.title: "Echoes of the Revolution Across Eurasia"
 oe_gds.14.desc: "The revolutionary tempest shaking the West respects neither mountains nor dynastic frontiers. Translated pamphlets proclaiming popular sovereignty, constitutional charters, and equal citizenship circulate briskly in the coffeehouses of Constantinople, the academies of Beijing and Moscow, and the bazaars of Istanbul. Our council must choose its answer before the streets choose for us."
 oe_gds.14.a: "Convene an Imperial Constitutional Charter Assembly"
 oe_gds.14.b: "Join the Legitimist Concert and Enforce Censorship"
 oe_gds.15.title: "The Citizens' Code & the Eurasian Bourgeoisie"
 oe_gds.15.desc: "Whether sparked by revolutionary fervor or top-down imperial modernization, the old patchwork of feudal tolls, guild monopolies, and hereditary court offices is giving way. Jurists present a clear, uniform civil code promising property rights, meritocratic promotion, and swift upward mobility from peasant villages into thriving urban trades."
 oe_gds.15.a: "Promulgate a Unified Civil Code & Meritocratic Bureaucracy"
 oe_gds.15.b: "Uphold Traditional Estates and Provincial Liberties"
 oe_gds.16.title: "The Trans-Eurasian Settlement: Concert or Constitution"
 oe_gds.16.desc: "As the smoke of revolutionary wars settles across continents, envoys from the great capitals of Europe and Asia convene to define the diplomatic order of the nineteenth century. Industrial steel, intercontinental canals, and awakened urban publics ensure that whatever settlement is signed today will govern a truly global age."
 oe_gds.16.a: "Champion a Trans-Eurasian Constitutional Compact"
 oe_gds.16.b: "Anchor the Grand Eurasian Congress of Crowns"
