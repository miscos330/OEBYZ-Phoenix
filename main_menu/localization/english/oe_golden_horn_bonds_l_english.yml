l_english:
 oe_giustinia_dynasty: "Giustinia"
 oe_golden_horn_bank.1.t: "The Golden Horn Bank's Proposal"
 oe_golden_horn_bank.1.d: "Giustinia arrived in Constantinople as a Genoese newcomer with little more than his accounts and his credit. Under Andronikos II, he rose from modest exchange and lending to business that reached the palace, the trading houses and the docks. When the Emperor came to depend upon his financing, the self-made banker secured a compromise: an imperial charter for the Golden Horn Bank, a private institution with official backing. He subsequently embraced Orthodoxy and entered the world of imperial officials. The Giustinia family's good relations with the Palaiologan court have sustained the bank's standing ever since.\n\nNow the imperial treasury is in difficulty once more. The bank proposes issuing tradable bonds, backed jointly by the government's credit and that of its chartered bank, to raise funds from merchants and wealthy investors. Money obtained on today's promises must eventually be repaid from tomorrow's revenues—but the soldiers and the creditors need not wait until then."
 oe_golden_horn_bank.1.a: "Approve the plan."
 oe_golden_horn_bank.1.b: "Nothing but clever trickery."
 STATIC_MODIFIER_NAME_oe_golden_horn_bond_charter: "Golden Horn Bond Charter"
 STATIC_MODIFIER_DESC_oe_golden_horn_bond_charter: "The government and the Golden Horn Bank jointly underwrite imperial credit, allowing the treasury to raise funds by issuing bonds and increasing the bond limit by #G +1#!."
 oe_golden_horn_bond_decision: "Golden Horn bond proposal decided"
