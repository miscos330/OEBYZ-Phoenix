l_english:
 oe_heg_mass_invasion: "Mass Invasion"
 oe_heg_mass_invasion_desc: "The legions advance under a single imperial order, with supplies given priority along the roads. No peace may be concluded until the throne orders the campaign to end."
 OE_HEG_MASS_INVASION_BONUS_TT: "Once the invasion begins successfully, Byzantium gains #Y Mass Invasion#!: #G +10%#! Army Movement Speed and #R Blocked From Peace#!. This modifier does not stack or expire automatically. Remove it with End Mass Invasion."
 oe_heg_end_mass_invasion: "End Mass Invasion"
 oe_heg_end_mass_invasion_desc: "Order the commanders to stand down and dispatch envoys to every enemy still at war with the Empire.\n\nSpend #Y 25#! Political Influence, remove Mass Invasion, and conclude white peace in #Y every current war#! involving Byzantium, including wars in other theaters. This action does not return land whose ownership has already been transferred. There is no cooldown or lifetime limit; it can be used again after gaining the modifier again."
 OE_HEG_END_MASS_INVASION_EFFECT: "Spend 25 Political Influence, remove Mass Invasion and its peace prohibition, and conclude white peace with all current enemies."
