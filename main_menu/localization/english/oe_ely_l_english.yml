 oe_ely_dec_launch_odyssey.title: "Launch the Fourth Odyssey: Commission the Oceanic Ark"
 oe_ely_dec_launch_odyssey.desc: "Reconvene the secret Hesperian Council, gather surviving ships, artisans, and codices, and formally launch Project Ark and the Fourth Odyssey situation."
 oe_ely_dec_launch_odyssey.a: "Hoist the purple sails toward the setting sun!"
 oe_ely_dec_reprovision_fleet.title: "Emergency Fleet Reprovisioning"
 oe_ely_dec_reprovision_fleet.desc: "Draw upon the shipboard treasury to secure fresh water, salted rations, pitch, and canvas, restoring fleet provisions and crew morale against Atlantic tempests."
 oe_ely_dec_reprovision_fleet.a: "Issue fresh rations and double sailing pay."
