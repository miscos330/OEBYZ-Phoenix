 STATIC_MODIFIER_NAME_oe_ely_exodus_fleet_mod: "Oceanic Ark Exodus Fleet"
 STATIC_MODIFIER_DESC_oe_ely_exodus_fleet_mod: "The imperial ark convoy crosses the Atlantic under strict seamanship, reduced attrition, and extended naval reach."
 STATIC_MODIFIER_NAME_oe_ely_nova_elysia_founded_mod: "Founding Era of Nova Elysia"
 STATIC_MODIFIER_DESC_oe_ely_nova_elysia_founded_mod: "The flame of Nea Konstantinoupolis blazes across the Chesapeake: ark treasury subsidies, rapid colonial migration, accelerated cultural assimilation and conversion, and lowered upkeep sustain New Rome through its first 35 founding years."
 STATIC_MODIFIER_NAME_oe_ely_instant_embrace_mod: "Ark Codices Institution Charter"
 STATIC_MODIFIER_DESC_oe_ely_instant_embrace_mod: "Imperial scholars and codices carried aboard the Ark allow Nova Elysia to embrace all copied Old World institutions immediately at zero cost."
 STATIC_MODIFIER_NAME_oe_ely_breakwater_mod: "New Golden Horn Breakwater"
 STATIC_MODIFIER_DESC_oe_ely_breakwater_mod: "Imperial engineers reinforce the sandy Chesapeake spit with masonry breakwaters and sea chains, transforming it into a fortified imperial port."
 STATIC_MODIFIER_NAME_oe_ely_natural_anchorage_mod: "Chrysokeras Natural Deep Anchorage"
 STATIC_MODIFIER_DESC_oe_ely_natural_anchorage_mod: "Built upon the supreme natural anchorage of Nansemond, imperial docks and trade wharves anchor Nova Elysia's maritime power."
 STATIC_MODIFIER_NAME_oe_ely_bermuda_beacon_mod: "Beacon of Cape Agios Nikolaos"
 STATIC_MODIFIER_DESC_oe_ely_bermuda_beacon_mod: "A Roman lighthouse and careening station standing watch over the reefs of Bermuda along the Atlantic crossing."
 STATIC_MODIFIER_NAME_oe_ely_maize_adaptation_mod: "Chesapeake Maize Adaptation"
 STATIC_MODIFIER_DESC_oe_ely_maize_adaptation_mod: "Combining indigenous maize cultivation with Mediterranean graincraft secures abundant harvests for the young realm."
 STATIC_MODIFIER_NAME_oe_ely_winter_rationing_mod: "First-Winter Fleet Rationing"
 STATIC_MODIFIER_DESC_oe_ely_winter_rationing_mod: "Strict winter rationing and treasury purchases avert famine at the cost of burgher discontent."
 STATIC_MODIFIER_NAME_oe_ely_relic_golden_legacy_mod: "Unbroken Imperial Archive & Relics"
 STATIC_MODIFIER_DESC_oe_ely_relic_golden_legacy_mod: "Nearly intact imperial libraries, legal codices, and arsenal treatises elevate Nova Elysia's scholarship, literacy, and prestige."
 STATIC_MODIFIER_NAME_oe_ely_relic_preserved_legacy_mod: "Preserved Exiled Archives"
 STATIC_MODIFIER_DESC_oe_ely_relic_preserved_legacy_mod: "Salvaged scrolls and craftsmen's manuals carried aboard the ark sustain Roman learning and civic prestige in the New World."
 STATIC_MODIFIER_NAME_oe_ely_relic_humble_start_mod: "Resilient Pioneer Foundation"
 STATIC_MODIFIER_DESC_oe_ely_relic_humble_start_mod: "Though much treasure was lost to the Atlantic, the surviving settlers forge a pragmatic and resilient commonwealth."
 oe_ely.1.title: "The Fourth Odyssey: Sail Toward the Setting Sun"
 oe_ely.1.desc: "Smoke over the Bosporus marks the collapse of the old empire's last bulwarks as rival banners close in across Thrace and the Aegean. In this darkest hour, imperial navigators unroll an ancient chart speaking of a fertile western shore far beyond the Pillars of Heracles. Shall we gather our remaining ships, people, and relics to forge a New Rome across the ocean, or stand fast amid the ruins of the Old World?"
 oe_ely.1.a: "Launch Project Ark — the Roman flame shall not die in the East!"
 oe_ely.1.a.tt: "Activates The Fourth Odyssey situation and begins fleet preparations for the Atlantic crossing."
 oe_ely.1.b: "We will never forsake our homeland; we stand in the Old World."
 oe_ely.1.b.tt: "Declines the Atlantic exodus without affecting Old World or oe_l7 storylines (can still be reconsidered later via decision)."
 oe_ely.2.title: "The Timaeus Chart and the Hesperian Council"
 oe_ely.2.desc: "Inside the secluded chambers of Blachernae, astronomers and pilots from Alexandria, Genoa, and Trebizond compare fragments of Plato's Timaeus with Phoenician periploi and Atlantic wind charts. Beyond the Pillars of Heracles, they swear, lies a vast untouched continent. If the empire commits its fleet now, the two-headed eagle could claim a New World more than a century before Western rivals."
 oe_ely.2.a: "Build the Oceanic Ark and begin the Fourth Odyssey a century early!"
 oe_ely.2.a.tt: "Immediately activates The Fourth Odyssey situation and enters Stage 1 fleet preparation."
 oe_ely.2.b: "Fascinating charts, yet our duty remains in the Mediterranean for now."
 oe_ely.2.b.tt: "Postpones the exodus (can still be launched manually via decision before 1360)."
 oe_ely.3.title: "Stripping the Blachernae & Summoning the Varangians"
 oe_ely.3.desc: "The shipyards blaze through the night as timber, pitch, and bronze spikes pile along the quays. The Megas Doux presents three embarkation plans: pack every hull with Greek artisans and families to maximize our New World population; prioritize veteran Varangian guards and marine escorts; or sail light and swift with overflowing water casks and rations."
 oe_ely.3.a: "Embark every artisan and family — carry a living city across the sea!"
 oe_ely.3.a.tt: "Sets Ark Tier to #G 3 (~30k 6-estate Greek settlers & 700 starting Gold on landfall)#!, at the cost of #R -10#! Provisions and #G +5#! Morale."
 oe_ely.3.b: "Strike a balance with Varangian veterans and heavy escorts."
 oe_ely.3.b.tt: "Sets Ark Tier to #Y 2 (~20k 6-estate Greek settlers & 500 starting Gold on landfall)#!, granting #G +15#! Morale and Navy Tradition."
 oe_ely.3.c: "Travel light and pack every hold with water, rations, and spare rigging."
 oe_ely.3.c.tt: "Sets Ark Tier to #Y 1 (~12k 6-estate Greek settlers & 350 starting Gold on landfall)#!, granting #G +15#! Provisions and #G +5#! Morale."
 oe_ely.4.title: "Relics of Hagia Sophia & the Siphon Formulas"
 oe_ely.4.desc: "Space inside the flagship's dry holds is strictly limited. Before weighing anchor, the crown must decide which imperial treasure receives priority aboard the ark: the sacred icons and Patriarchal rolls of Hagia Sophia; the Platonic and classical Roman codices championed by Plethon's circle; or the bronze siphons and secret formulas of Greek Fire from the Imperial Arsenal."
 oe_ely.4.a: "Save the relics of Hagia Sophia and Patriarchal rolls to light the West."
 oe_ely.4.a.tt: "Records Relic Focus as #G Western Orthodoxy (Act II religious hook)#!, grants #G +2#! Relic Score and #G +8#! Morale."
 oe_ely.4.b: "Rescue Plethon's manuscripts and the classical Roman codices."
 oe_ely.4.b.tt: "Records Relic Focus as #G Classical Revival (Act II Roman Paganism hook)#!, grants #G +2#! Relic Score and Cultural Tradition."
 oe_ely.4.c: "Strip the Imperial Arsenal of Greek Fire siphons and alchemical manuals."
 oe_ely.4.c.tt: "Records Relic Focus as #G Imperial Arsenal (Greek Fire & military hook)#!, grants #G +2#! Relic Score and Navy Tradition."
 oe_ely.5.title: "Farewell to the Queen of Cities"
 oe_ely.5.desc: "Pre-dawn mist cloaks the Sea of Marmara as the imperial convoy slips past the sea walls. Elders along the railings take one last look at the dome of Hagia Sophia before turning their eyes west. On the navigator's table, charts of the Western Mediterranean and Macaronesia lie pinned beneath brass dividers: from this hour, Rome's destiny rides the Atlantic trade winds."
 oe_ely.5.a: "Sail west in disciplined imperial formation."
 oe_ely.5.a.tt: "Reveals Western Mediterranean and Macaronesian sea lanes, grants the Oceanic Ark Exodus Fleet modifier, and advances to Stage 2."
 oe_ely.5.b: "Burn the harbor registries and impress coastal grain ships for extra stores."
 oe_ely.5.b.tt: "Reveals the sea lanes, advances to Stage 2, and grants #G +12#! Provisions at a slight Prestige cost."
 oe_ely.6.title: "Pillars of Heracles: Running the Strait"
 oe_ely.6.desc: "Iberian and Maghrebi patrol galleys choke the narrow throat of Gibraltar as signal fires flare along both shores. Trapped in the strait, the overloaded ark fleet would fall prey to rival squadrons. Beneath the shadow of the Pillars of Heracles, the admiral must force passage into the open Atlantic."
 oe_ely.6.a: "Ignite the Greek Fire siphons at midnight and punch straight through!"
 oe_ely.6.a.tt: "Costs #R -12#! Provisions, grants #G +12#! Morale and #G +1#! Relic Score, and advances to Stage 3."
 oe_ely.6.b: "Dispatch a cutter with imperial bullion to buy quiet passage."
 oe_ely.6.b.tt: "Spends 50 Gold to keep provisions and relics intact, grants #G +5#! Morale, and advances to Stage 3."
 oe_ely.6.c: "Strike the purple banners, disguise as Genoese merchants, and slip through."
 oe_ely.6.c.tt: "Costs #R -5#! Provisions and #R -1#! Relic Score for a low-risk passage to Stage 3."
 oe_ely.7.title: "Isles of the Hesperides: Azores & Madeira"
 oe_ely.7.desc: "Beyond the strait, verdant volcanic peaks rise from the blue Atlantic — the fabled Isles of the Hesperides. Barnacles foul every keel and the water casks run low. This is the fleet's final chance to refit before plunging into the open western ocean."
 oe_ely.7.a: "Shelter at Angra in the Azores and carve a Roman navigation beacon."
 oe_ely.7.a.tt: "Restores #G +15#! Provisions and #G +10#! Morale, reveals the Mid-Atlantic, marks the #G Azores Beacon for Act IV#!, and advances to Stage 4."
 oe_ely.7.b: "Fell timber at Madeira's Funchal and load timber, sugar, and provisions."
 oe_ely.7.b.tt: "Restores #G +20#! Provisions, adds 35 Gold in salvaged stores, reveals the Mid-Atlantic, and advances to Stage 4."
 oe_ely.7.c: "Call at Teguise in the Canaries and trade peacefully with the Guanche for water."
 oe_ely.7.c.tt: "Restores #G +12#! Provisions, improves Guanche opinion, records #G peaceful native goodwill#!, reveals the Mid-Atlantic, and advances to Stage 4."
 oe_ely.8.title: "The Sargasso Calm and the Atlantic Tempest"
 oe_ely.8.desc: "Two stifling weeks adrift amid golden mats of sargassum weed give way to a towering black wall of hurricane squalls. Breakers smash across stern castles while mainmasts groan under the gale. Captains shout for orders: cast heavy cargo overboard to ride lighter, or seal the hatches and force every Roman treasure through the storm?"
 oe_ely.8.a: "Jettison heavy ordnance and crates to save every soul aboard!"
 oe_ely.8.a.tt: "Saves #G +15#! Provisions at the cost of #R -1#! Relic Score."
 oe_ely.8.b: "Batten down every hatch — not one imperial treasure goes to the abyss!"
 oe_ely.8.b.tt: "Preserves all relics and colonists, at the cost of #R -15#! Morale and #R -8#! Provisions."
 oe_ely.8.c: "Hold solemn litanies or classical auguries on deck to steady the crews."
 oe_ely.8.c.tt: "Grants #G +8#! Morale at #R -10#! Provisions, plus Legitimacy or Cultural Tradition matching our preserved codices."
 oe_ely.9.title: "Mutiny on the Quarterdeck"
 oe_ely.9.desc: "Relentless tempests, foul water, and an empty western horizon have finally snapped the nerves of the exhausted crews. By lantern light, mutinous boatswains crowd the flagship's quarterdeck with drawn blades, shouting that the ocean has no shore and demanding an immediate turn back toward the Mediterranean."
 oe_ely.9.a: "Unleash the Varangian Guard to restore iron discipline!"
 oe_ely.9.a.tt: "Restores #G +15#! Morale at a cost to Stability."
 oe_ely.9.b: "Swear the Charta Senatus Novae Elysiae before the crews, pledging shared governance and land!"
 oe_ely.9.b.tt: "Records the #G Elysian Senate Charter Oath (Act II constitutional hook)#!, granting #G +25#! Morale and #G +5#! Provisions."
 oe_ely.9.c: "Heaven forbids this crossing — bring the fleet about for the Old World."
 oe_ely.9.c.tt: "Immediate 1337 mode only: safely aborts the Fourth Odyssey and clears voyage state."
 oe_ely.10.title: "Devil's Shoals and Cape Agios Nikolaos"
 oe_ely.10.desc: "The cry of seabirds shatters the Atlantic silence! Ahead rises a ring of turquoise coral reefs framing uninhabited cedar isles — Bermuda. Though gale winds howl like phantoms across the shoals, fresh rainwater, sea turtles, and stout timber offer salvation. The Greek sailors christen the headland Cape Agios Nikolaos."
 oe_ely.10.a: "Leave a naval watch and raise an Atlantic lighthouse at Cape Agios Nikolaos."
 oe_ely.10.a.tt: "Claims uninhabited Bermuda as #G Agios Nikolaos#! with Greek watchmen and a permanent lighthouse modifier; #R -5#! Provisions, #G +5#! Morale, advances to Stage 5."
 oe_ely.10.b: "Take on fresh water and ride the Gulf Stream straight for the western continent!"
 oe_ely.10.b.tt: "Grants #G +5#! Provisions and #G +8#! Morale, reveals the Gulf Stream, and advances to Stage 5."
 oe_ely.11.title: "Elysia Sighted! Purple Banners over the Chesapeake"
 oe_ely.11.desc: "'Land! Western land!' The cry from the crow's nest rings across every deck. Before the prows opens no barren rock, but a vast, sheltered bay rimmed with towering forests, teeming fisheries, and river valleys — the Chesapeake. Wisp-thin cooking fires curl above the shoreline. Across a thousand leagues of storm, Rome's two-headed eagle has reached Elysia."
 oe_ely.11.a: "Sound the trumpets and drop anchor off the shores of New Rome!"
 oe_ely.11.a.tt: "Reveals the Chesapeake and North American East Coast charts, granting #G +15#! Morale and Prestige."
 oe_ely.12.title: "First Contact on the Shore: Canoes of the Nansemond"
 oe_ely.12.desc: "No sooner do the longboats enter the shoals than dozens of swift dugout canoes glide from the reeds. Nansemond hunters clad in deerskin gaze in astonishment at towering purple sails and armored Roman marines. This first meeting will set the tone between Nova Elysia and the peoples of the Chesapeake for generations to come."
 oe_ely.12.a: "Offer Tyrian purple cloth, iron axes, and salt in the spirit of Roman Foederati."
 oe_ely.12.a.tt: "Spends 25 Gold for #G +10#! Provisions and higher Nansemond opinion, unlocking indigenous First Winter aid and priming the #G Act II Foederati path#!."
 oe_ely.12.b: "Fire a thunderous Greek Fire salvo across the shallows to awe the shore!"
 oe_ely.12.b.tt: "Grants Prestige and #G +10#! Morale while antagonizing the Nansemond, priming the #G Act II Limes path#!."
 oe_ely.13.title: "Foundation of Nea Konstantinoupolis"
 oe_ely.13.desc: "Three landing columns secure the contiguous Chesapeake bridgehead: the outer spit of Chesapeake, the peerless natural deep-water anchorage of Nansemond, and the iron-bearing heights of Kiskiack. Tracing the sacred pomerium with a bronze plow, the Emperor proclaims a clean break from the Old World's doomed remnants and raises the banner of Nova Elysia. One solemn choice remains: where shall the new imperial throne stand?"
 oe_ely.13.a: "Crown Nea Konstantinoupolis at Chesapeake and build the Golden Horn Breakwater!"
 oe_ely.13.a.tt: "Refounds the realm as the #G Empire of Nova Elysia#! upon the Chesapeake with Old World fog completely cleared away and the Eastern Seaboard & Bermuda revealed, #G crowns Nea Konstantinoupolis (with Golden Horn Breakwater, +15 local food, 6 starter buildings & 500 province food reserve)#!, carries over the imperial dynasty, all researched advances and institution progress, seeds 6-estate Greek settlers & starting treasury, raises a 5-ship Founding Fleet & 2 Guard regiments, grants the #G 35-year Founding Era colonization/food/economy buff#!, and cleanly leaves the Old World behind!"
 oe_ely.13.b: "Crown Chrysokeras Hesperias at Nansemond upon the 1.00 natural deep harbor!"
 oe_ely.13.b.tt: "Refounds the realm as the #G Empire of Nova Elysia#! upon the Chesapeake with Old World fog completely cleared away and the Eastern Seaboard & Bermuda revealed, #G crowns Chrysokeras Hesperias (with Deep Anchorage, +15 local food, 6 starter buildings & 500 province food reserve)#!, carries over the imperial dynasty, all researched advances and institution progress, seeds 6-estate Greek settlers & starting treasury, raises a 5-ship Founding Fleet & 2 Guard regiments, grants the #G 35-year Founding Era colonization/food/economy buff#!, and cleanly leaves the Old World behind!"
 oe_ely.14.title: "First Winter in Elysia: Maize and Rye"
 oe_ely.14.desc: "The first winter on the Chesapeake bites far sharper than any Aegean frost. Before Mediterranean rye can ripen, icy gales rattle the timber cabins and the ships' flour barrels scrape bottom. Nova Elysia's survival through this first frost hangs in the balance."
 oe_ely.14.a: "Accept maize seed and winter counsel from our Nansemond and Powhatan friends!"
 oe_ely.14.a.tt: "Grants the 25-year Chesapeake Maize Adaptation modifier and strengthens relations with the Powhatan."
 oe_ely.14.b: "Enforce strict fleet rationing and draw on imperial bullion to endure the frost."
 oe_ely.14.b.tt: "Spends 45 Gold and grants the 10-year First-Winter Fleet Rationing modifier (steady rations at a mild Burgher satisfaction cost)."
 oe_ely.15.title: "Proclamation of the Elysian Charter"
 oe_ely.15.desc: "One full year after landfall, timber-and-stone ramparts rise around the capital, shipwrights' mallets ring along the docks, and the imperial flame burns steady in the western breeze. Together, the Emperor and exiled Senate cast the Elysian Charter in bronze: Act I of the Fourth Odyssey closes in triumph as the epic of Nova Elysia's nation-building begins."
 oe_ely.15.a: "Raise the bronze stele — long live Nova Elysia!"
 oe_ely.15.a.tt: "Grants Prestige, Cultural Tradition, and a permanent milestone modifier scaled to Act I's Relic Score, handing off cleanly to Act II."
 oe_ely.16.title: "Fourth Odyssey Telemetry Readout"
 oe_ely.16.desc: "Fourth Odyssey (Act I · oe_ely_) read-only telemetry:\n· Mode (0 Exile-Only / 1 Immediate 1337 / 2 Off): [ROOT.GetCountry.MakeScope.ScriptValue('oe_ely_rd_mode')|0]\n· Voyage Stage (0 Idle / 1-5 Crossing / 6 Settled): [ROOT.GetCountry.MakeScope.ScriptValue('oe_ely_rd_stage')|0] (Situation months: [ROOT.GetCountry.MakeScope.ScriptValue('oe_ely_rd_voyage_months')|0])\n· Fleet Morale: [ROOT.GetCountry.MakeScope.ScriptValue('oe_ely_rd_morale')|0] / 100 | Provisions: [ROOT.GetCountry.MakeScope.ScriptValue('oe_ely_rd_provisions')|0] / 100\n· Preserved Relics: [ROOT.GetCountry.MakeScope.ScriptValue('oe_ely_rd_relics')|0] / 5 (Focus 1 Orthodox / 2 Classical / 3 Arsenal: [ROOT.GetCountry.MakeScope.ScriptValue('oe_ely_rd_relic_focus')|0])\n· Ark Tier (1-3): [ROOT.GetCountry.MakeScope.ScriptValue('oe_ely_rd_ark_tier')|0] | First Contact (1 Foederati / 2 Limes): [ROOT.GetCountry.MakeScope.ScriptValue('oe_ely_rd_contact')|0]\n· Navigation Beacons (Azores / Bermuda): [ROOT.GetCountry.MakeScope.ScriptValue('oe_ely_rd_azores_beacon')|0] / [ROOT.GetCountry.MakeScope.ScriptValue('oe_ely_rd_bermuda_beacon')|0]\n· Settled (0/1): [ROOT.GetCountry.MakeScope.ScriptValue('oe_ely_rd_settled')|0] | Capital Choice (1 Chesapeake / 2 Nansemond): [ROOT.GetCountry.MakeScope.ScriptValue('oe_ely_rd_cap_choice')|0]\n· Old World Detachment Code (1 Clean Cede / 2 Fallback Abandon / 3 Partial): [ROOT.GetCountry.MakeScope.ScriptValue('oe_ely_rd_old_world_code')|0] (Ceded locations: [ROOT.GetCountry.MakeScope.ScriptValue('oe_ely_rd_ceded_n')|0])"
 oe_ely.16.a: "Close the telemetry ledger."
