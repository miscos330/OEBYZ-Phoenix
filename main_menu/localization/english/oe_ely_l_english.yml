 oe_sit_fourth_odyssey: "The Fourth Odyssey: The Western Crossing"
 oe_sit_fourth_odyssey_desc: "Driven by Old World crisis or the lure of ancient sea charts, the empire's surviving fleet, senators, artisans, and relics sail west beyond the Pillars of Heracles. Across Macaronesia and the Sargasso tempests, the two-headed eagle seeks to rekindle the Roman flame upon the Chesapeake."
 oe_sit_fourth_odyssey_landfall: "Landfall on the Chesapeake"
 oe_sit_fourth_odyssey_landfall_desc: "The exodus fleet reaches the North American coast, founds the Chesapeake bridgehead, cleanly detaches from the Old World, and proclaims Nova Elysia."
 oe_sit_fourth_odyssey_aborted: "Voyage Abandoned"
 oe_sit_fourth_odyssey_aborted_desc: "The western fleet turned back mid-voyage or failed to complete landfall within seventy-two months, closing the Fourth Odyssey."
