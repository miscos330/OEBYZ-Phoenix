l_english:
 pe_byz_hungarian_dominion: "Establish the Hungarian Dominion"
 pe_byz_hungarian_dominion_entry_short: "Establish the Hungarian Dominion"
 pe_byz_hungarian_dominion_entry: "Establish a new Hungarian Dominion from Hungary's directly owned Carpathian lands and transfer its southern lands and subjects."
 pe_byz_hungarian_dominion_desc: "Create a new Hungarian Dominion from the locations directly owned by Hungary in Carpathia, excluding Wallachia and Moldavia. The new country becomes a Byzantine subject. The original Hungary is not subjugated and retains any remaining lands. The existing transfer rules for the Balkans, Wallachia and Moldavia still apply."
 oe_hungarian_dominion_retains_land_tt: "Hungary owns at least one location outside the Balkans, Wallachia and Moldavia, allowing the dominion to survive the transfer."
 oe_hungarian_dominion_handover_tt: "Transfer the lands held by Hungary and its direct or indirect subjects in the Balkans, Wallachia and Moldavia to Byzantium. Subjects with capitals in these regions transfer intact to Byzantium, retaining their subject types and lands. Other subjects transfer only their lands within these regions. No cores are granted."
 oe_hungarian_dominion: "Hungarian Dominion"
 oe_hungarian_dominion_desc: "A dominion established only through the Crown of Saint Stephen peace settlement, with the military obligations of a Roman Ally, but no monthly tribute to its overlord. The overlord receives #G +10%#! Light Cavalry Combat Ability. The dominion receives #G +5%#! Discipline, #G +20%#! Army Morale, #G +50#! Loyalty to Overlord, #G +50%#! Army Maintenance Efficiency and #R −300%#! Cultural Assimilation Speed. It can be annexed at #G 8#! progress per month."
 oe_cb_recover_imperial_lands: "Recover Imperial Lands"
 oe_cb_recover_imperial_lands_desc: "The lands of the Roman World must not remain in foreign hands. Byzantium may fabricate this casus belli against foreign countries owning locations within the Roman World. The attacker receives #G −10%#! conquest, subjugation and country-release war score costs and #G −25%#! Aggressive Expansion."
 oe_recover_imperial_lands: "Recover Imperial Lands"
 oe_recover_imperial_lands_desc: "Defeat the country holding lands within the Roman World and reclaim the imperial inheritance."
 oe_roman_recovery_cb_target: "The target owns Roman World locations and is neither Byzantium nor its subject"
 oe_hungarian_handover_location: "Located in the Balkans, Wallachia or Moldavia"

 oe_hungarian_dominion_foundation_land_tt: "Hungary directly owns at least one location in Carpathia outside Wallachia and Moldavia."

 oe_hungarian_dominion_foundation_tt: "Create a new #Y Hungarian Dominion#! from all locations directly owned by Hungary in Carpathia, excluding Wallachia and Moldavia. It becomes a Byzantine subject of the Hungarian Dominion type, inheriting Hungary's state culture and religion. Its capital is Buda if available, otherwise Pest, otherwise the most populous eligible location. Leave the original Hungary's remaining lands and diplomatic status unchanged."

 OE_HUNGARIAN_DOMINION_COUNTRY: "Hungarian Dominion"

 OE_HUNGARIAN_DOMINION_ADJ: "Hungarian Dominion"

 oe_hungarian_dominion_location: "In Carpathia, excluding Wallachia and Moldavia"
