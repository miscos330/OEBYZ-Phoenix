 oe_sci_dec_muteferrika_ferman.title: "Issue the Muteferrika Imperial Press Ferman"
 oe_sci_dec_muteferrika_ferman.desc: "Issue an imperial ferman and clerical fetva on the 1727 model permitting Arabic movable-type presses for secular history, geography, lexicons, and military science. Raises the Muteferrika Press free of construction cost, strikes a landmark first edition, and registers this milestone in the global Enlightenment ledger."
 oe_sci_dec_muteferrika_ferman.a: "Proclaim the Ferman and Open the Secular Press"
 oe_sci_dec_charter_royal_society.title: "Charter the Royal Scientific Society"
 oe_sci_dec_charter_royal_society.desc: "Grant a royal charter to natural philosophers and instrument makers under the motto Nullius in verba. Raises the Royal Scientific Society landmark free of cost, publishes the inaugural Philosophical Transactions, and records this milestone globally."
 oe_sci_dec_charter_royal_society.a: "Grant the Royal Charter for Empirical Inquiry"
 oe_sci_dec_publish_encyclopedie.title: "Publish the Grand Encyclopedie"
 oe_sci_dec_publish_encyclopedie.desc: "Unite Enlightenment editors and master copperplate engravers to publish a grand dictionary of sciences, arts, and crafts. Establishes the capital Encyclopedia Scriptorium free of cost, creates the landmark Encyclopedie, and announces the milestone across the Republic of Letters."
 oe_sci_dec_publish_encyclopedie.a: "Send the Volumes to Press and Map Human Knowledge"
 oe_sci_dec_siku_qintianjian.title: "Commission the Siku Quanshu and Qintianjian Calendar"
 oe_sci_dec_siku_qintianjian.desc: "Summon court compilers and imperial astronomers in Dadu, Shangyuan, Wuxian, or Jianyang to raise the Siku Archive and Qintianjian Observatory, uniting grand bibliography with harmonized star tables. Gains an additional calendar-synthesis research bonus if the Jesuit Asia mission is active."
 oe_sci_dec_siku_qintianjian.a: "Open the Imperial Archive and Harmonize the Calendar"
 oe_sci_dec_aldine_jiangnan_boom.title: "Sponsor the Aldine Octavo and Jiangnan Print Boom"
 oe_sci_dec_aldine_jiangnan_boom.desc: "Lighten paper and ink dues across commercial print centers in Venice, Mainz, Amsterdam, Wuxian, or Jianyang, fueling affordable octavo classics and woodblock editions while creating a landmark print canon and boosting literacy."
 oe_sci_dec_aldine_jiangnan_boom.a: "Ease Paper Dues and Spread Affordable Editions"
