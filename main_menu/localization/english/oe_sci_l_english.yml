 oe_sci_adv_encyclopedic_synthesis: "Encyclopedic Synthesis of Reason"
 oe_sci_adv_encyclopedic_synthesis_desc: "Unites empirical science, workshop engineering, and constitutional jurisprudence into a comprehensive Enlightenment canon, granting major gains to research speed, literacy ceilings, and legislative efficiency."
 oe_sci_press_charter_law: "Printing and Learned Charter Law"
 oe_sci_press_charter_law_desc: "Defines the realm's legal framework for presses, imperial archives, and learned journals, balancing secular clerical compromise, crown-guided canonical compilation, and open peer-reviewed inquiry."
 oe_sci_pol_muteferrika_secular_ferman: "Secular Science Ferman"
 oe_sci_pol_muteferrika_secular_ferman_desc: "Follows the 1727 Ottoman compromise: safeguarding sacred calligraphy for clerical copyists while chartering movable-type presses for history, cartography, lexicons, and natural science."
 oe_sci_pol_imperial_compendium_censor: "Imperial Compendium and Censorate"
 oe_sci_pol_imperial_compendium_censor_desc: "Places grand compilation and book licensing under crown scholars and imperial censors, reinforcing royal sway, legitimacy, stability, and cultural tradition at the cost of a traditionalist lean."
 oe_sci_pol_nullius_in_verba_open: "Open Peer-Review Charter"
 oe_sci_pol_nullius_in_verba_open_desc: "Enshrines empirical debate and open scientific journals under Nullius in verba, propelling literacy, institution growth, innovation, and research speed while irritating conservative clergy."
