 oe_sci.1.t: "The 1727 Ferman: Opening the Muteferrika Imperial Press"
 oe_sci.1.d: "Morning light from the Golden Horn falls across freshly cast Arabic movable type as Ibrahim Muteferrika unrolls the Sultan's gilded ferman. The Grand Mufti's fetva draws a careful boundary: sacred scripture remains the preserve of traditional calligraphers, while history, world geography, lexicons, astronomy, and military treatises may be printed at scale. The court awaits your directive on how boldly the presses should run."
 oe_sci.1.a: "Honor the Secular Fetva and Print Histories and Lexicons"
 oe_sci.1.b: "Expand Scientific and Military Print Runs Boldly"
 oe_sci.2.t: "Petition of the Calligraphers Guild"
 oe_sci.2.d: "Hundreds of master calligraphers bearing reed pens and inkcases gather in solemn petition, fearing that movable type will ruin generations of manuscript artisans. Court ministers propose state stipends reserving illuminated sacred volumes for the guild, while the imperial printers urge firm backing for rapid expansion."
 oe_sci.2.a: "Subsidize Master Calligraphers Alongside Secular Presses"
 oe_sci.2.b: "Back Full Press Expansion Despite Guild Friction"
 oe_sci.3.t: "Nullius in Verba: Founding the Royal Scientific Society"
 oe_sci.3.d: "Beneath an oak-beamed hall, air pumps, glass prisms, and brass telescopes crowd the demonstration table. Newly chartered natural philosophers proclaim their motto—Nullius in verba—declaring that authority yields to repeatable experiment. The fellows ask whether the crown will endow an instrument laboratory to accelerate international correspondence."
 oe_sci.3.a: "Honor Empirical Inquiry with Steady Royal Patronage"
 oe_sci.3.b: "Endow Precision Instruments to Accelerate Scientific Advance"
 oe_sci.4.t: "Philosophical Transactions and the Birth of Peer Review"
 oe_sci.4.d: "The inaugural issue of Philosophical Transactions rolls off the press, instituting formal peer scrutiny of experimental reports, astronomical observations, and instrument blueprints. Henceforth, scholars across distant realms need not rely on guarded notebooks, but can test and build upon shared findings openly."
 oe_sci.4.a: "Codify Strict Peer Review as the Benchmark of Science"
 oe_sci.4.b: "Circulate Affordable Offprints Widely Among Burghers"
 oe_sci.5.t: "1751: The Encyclopedie and the Tree of Human Knowledge"
 oe_sci.5.d: "By candlelight in salons and copperplate pressrooms, folio volumes of the Encyclopedie of Sciences, Arts, and Crafts reach subscribers. Editors pair rational essays with detailed workshop engravings of foundries, looms, chronometers, and optics, elevating practical engineering beside classical philosophy."
 oe_sci.5.a: "Disseminate the Full Folio Plates Across the Realm"
 oe_sci.5.b: "Grant Royal Honors While Balancing Tradition and Stability"
 oe_sci.6.t: "The Censorship Crisis and Clandestine Presses"
 oe_sci.6.d: "As encyclopedic essays and reform pamphlets sweep coffeehouses and bookshops, conservative prelates and magistrates petition to seize type plates and shutter bold presses. Reform-minded ministers warn that harsh bans will merely drive printers abroad and starve the realm of talent."
 oe_sci.6.a: "Shield Open Scientific Publishing from Sweeping Bans"
 oe_sci.6.b: "Establish a Royal Board of Censorship for Order and Stability"
 oe_sci.7.t: "The Siku Quanshu and Qintianjian Calendar Synthesis"
 oe_sci.7.d: "Row upon row of silk-bound volumes fill the imperial archive halls as court scholars collate classical literature, history, philosophy, and technical treatises. Nearby on the observatory terrace, bronze equatorial armillaries stand beside telescopes as imperial astronomers harmonize ancient records with precision eclipse calculations."
 oe_sci.7.a: "Prioritize Practical Astronomy and Mathematical Compilation"
 oe_sci.7.b: "Exalt Classical Prestige, Legitimacy, and Scholarly Tradition"
 oe_sci.8.t: "The Calendar Controversy at the Imperial Observatory"
 oe_sci.8.d: "Ahead of a predicted solar eclipse, traditional calendrical officers and astronomers using trigonometric ephemerides submit conflicting forecasts to the throne. The court looks to the observatory terrace to decide whether a public empirical test shall settle the dispute."
 oe_sci.8.a: "Hold a Public Eclipse Test and Adopt Empirical Precision"
 oe_sci.8.b: "Form a Balanced Dual Commission to Preserve Court Harmony"
 oe_sci.9.t: "The Aldine Octavo and Jiangnan Woodblock Wave"
 oe_sci.9.d: "From italic movable-type workshops along Venetian canals to fine woodblock guilds in Wuxian and bustling print markets in Jianyang, portable affordable editions are transforming everyday reading. Agronomic manuals, mathematical guides, and ancient histories once locked in palace vaults now pass freely among merchants and students."
 oe_sci.9.a: "Champion Commercial Print Runs and Urban Literacy"
 oe_sci.9.b: "Sponsor Critical Scholarly Editions to Build Classical Prestige"
 oe_sci.10.t: "Rescuing Classical Manuscripts into Print"
 oe_sci.10.d: "Priceless manuscripts of ancient Greek philosophy, astronomy, and medicine have surfaced in bookstalls after decades of upheaval. Humanist editors and master printers jointly petition the crown to purchase and print critical editions so millennia of learning can never again be lost to fire or war."
 oe_sci.10.a: "Fund Full Critical Printing of the Rescued Manuscripts"
 oe_sci.10.b: "Acquire Select Volumes to Elevate Imperial Prestige"
 oe_sci.11.t: "Jianyang Chapbooks and Wuxian Fine Editions"
 oe_sci.11.d: "Jianyang workshops flood market towns with affordable encyclopedic almanacs, herbals, and arithmetic guides, while Wuxian master carvers set the gold standard for multicolor scholarly editions. Together they spark a surge in urban literacy and buoyant paper commerce."
 oe_sci.11.a: "Keep Paper and Book Duties Light to Sustain the Literacy Surge"
 oe_sci.11.b: "Standardize Book-Market Dues to Enrich Treasury and Burghers"
 oe_sci.12.t: "Triumph of the Equatorial Meridian Survey"
 oe_sci.12.d: "The equatorial meridian survey expedition returns in triumph with quadrant sightings and pendulum measurements that decisively confirm the oblate figure of the Earth! News sweeps royal academies and observatories alike as the newly compiled Equatorial Meridian Star Atlas propels our realm into the golden age of Enlightenment inquiry."
 oe_sci.12.a: "Publish the Meridian Star Atlas and Propel the Enlightenment"
 oe_sci.12.b: "Celebrate the Expedition Scholars and Proclaim Imperial Renown"
 oe_sci.90.t: "Ledger: v13.0 Enlightenment Science, Printing Press & Royal Academies"
