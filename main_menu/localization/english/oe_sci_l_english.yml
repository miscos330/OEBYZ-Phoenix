 oe_sci_adv_empirical_transactions: "Empirical Method and Learned Transactions"
 oe_sci_adv_empirical_transactions_desc: "Codifies reproducible experiment and peer-reviewed scientific publishing, unlocking the Royal Scientific Society landmark and accelerating research and institution growth."
 oe_sci_adv_secular_imperial_press: "Secular Imperial Press and Grand Compendia"
