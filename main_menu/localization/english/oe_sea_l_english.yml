l_english:
 oe_sea_b_malabar_charter: "Calicut Malabar Spice Charter"
 oe_sea_b_bengal_silk: "Sonargaon Silk & Muslin Compact"
 oe_sea_b_daiviet_tribute: "Thang Long Maritime Tribute Accord"
 oe_sea_b_indochina_rivalry: "Indochina Frontier & Maritime Friction"
 oe_sea_b_malacca_envoy: "Malacca Strait Mercantile Envoys"
 oe_sea_b_monsoon_league: "Indian Ocean & Nanyang Monsoon League"
 STATIC_MODIFIER_NAME_oe_sea_deccan_equilibrium: "Post-Delhi Deccan Equilibrium"
 STATIC_MODIFIER_DESC_oe_sea_deccan_equilibrium: "Stabilizing Deccan forts and frontier passes amid Delhi's fracture bolsters morale and defense at higher standing army upkeep."
 STATIC_MODIFIER_NAME_oe_sea_gujarat_ports_accord: "Gujarat Ports Customs Accord"
 STATIC_MODIFIER_DESC_oe_sea_gujarat_ports_accord: "Linking Khambat and Surat to Arabian Sea caravans lifts trade income and merchant power while conceding modest crown leverage."
 STATIC_MODIFIER_NAME_oe_sea_deccan_gunpowder: "Deccan Warhorse & Early Gunpowder Reform"
 STATIC_MODIFIER_DESC_oe_sea_deccan_gunpowder: "Importing Persian warhorses and early matchlocks through Goa sharpens discipline and artillery while raising army upkeep and annoying old nobles."
 STATIC_MODIFIER_NAME_oe_sea_war_elephant_corps: "Raichur Armored War Elephant Corps"
 STATIC_MODIFIER_DESC_oe_sea_war_elephant_corps: "Armored war elephants and hill citadels stiffen morale and defense across the Deccan while slowing siege artillery and fiscal extraction."
 STATIC_MODIFIER_NAME_oe_sea_malabar_monopoly: "Crown Malabar Pepper Monopoly"
 STATIC_MODIFIER_DESC_oe_sea_malabar_monopoly: "State-controlled pepper exports from Kozhikode and Goa swell treasury and trade receipts while alienating burghers and foreign envoys."
 STATIC_MODIFIER_NAME_oe_sea_calicut_charter_mod: "Calicut Spice Charter"
 STATIC_MODIFIER_DESC_oe_sea_calicut_charter_mod: "Reciprocal customs and factoria rights with the Roman Company or Yuan Shibosi lift trade, merchant power, and institutions at shared tax and naval upkeep cost."
 STATIC_MODIFIER_NAME_oe_sea_local_pepper_brokers: "Zamorin Local Pepper Brokers"
 STATIC_MODIFIER_DESC_oe_sea_local_pepper_brokers: "Relying on traditional Malabar brokerage keeps taxes steady and calm while trimming direct maritime projection."
 STATIC_MODIFIER_NAME_oe_sea_sonargaon_compact: "Sonargaon Silk & Muslin Compact"
 STATIC_MODIFIER_DESC_oe_sea_sonargaon_compact: "Integrating Bengal muslin and silk into Indian Ocean convoys lifts trade, production, and institutions while slightly easing central control."
 STATIC_MODIFIER_NAME_oe_sea_bengal_royal_looms: "Gaur & Bengal Royal Looms"
 STATIC_MODIFIER_DESC_oe_sea_bengal_royal_looms: "State-run textile workshops in Gaur and Sonargaon lift domestic production and taxation while limiting external merchant reach."
 STATIC_MODIFIER_NAME_oe_sea_timurid_southward_push: "Timurid Southward Drive on the Indus"
 STATIC_MODIFIER_DESC_oe_sea_timurid_southward_push: "Central Asian and Iranian pressures drive Timurid horsemen toward the Indus and Delhi, surging cavalry and discipline at steep stability and army upkeep cost."
 STATIC_MODIFIER_NAME_oe_sea_iron_resistance_india: "Subcontinental Iron Resistance"
 STATIC_MODIFIER_DESC_oe_sea_iron_resistance_india: "Mobilizing north Indian and Deccan hosts to bar the northwestern passes lifts defense and morale while squeezing trade and taxes."
 STATIC_MODIFIER_NAME_oe_sea_panipat_gunpowder_mod: "Panipat Gunpowder Modernization"
 STATIC_MODIFIER_DESC_oe_sea_panipat_gunpowder_mod: "Mastering chained wagon laagers, matchlocks, and field brass cannon propels discipline and artillery forward at steep upkeep and noble resentment."
 STATIC_MODIFIER_NAME_oe_sea_panipat_iron_bulwark: "Iron Bulwark: Native Infantry & Hill Forts"
 STATIC_MODIFIER_DESC_oe_sea_panipat_iron_bulwark: "Relying on native heavy infantry, war elephants, and hill forts hardens defense and morale while lagging in artillery and institutional spread."
 STATIC_MODIFIER_NAME_oe_sea_daiviet_tribute_trade: "Thang Long Maritime Tribute Trade"
 STATIC_MODIFIER_DESC_oe_sea_daiviet_tribute_trade: "Licensed tribute-trade voyages linking Thang Long with southern Chinese ports boost commerce and diplomacy at a modest prestige concession."
 STATIC_MODIFIER_NAME_oe_sea_daiviet_nam_tien: "Dai Viet Nam Tien & Autonomy"
 STATIC_MODIFIER_DESC_oe_sea_daiviet_nam_tien: "Pursuing sovereign southern expansion along the coastal plain lifts morale and integration while stirring regional diplomatic friction."
 STATIC_MODIFIER_NAME_oe_sea_malacca_free_strait: "Malacca Free Strait Emporium"
 STATIC_MODIFIER_DESC_oe_sea_malacca_free_strait: "Low customs, clear maritime codes, and multi-ethnic harbourmasters turn Malacca into an oceanic hub, lifting trade and institutions alongside patrol upkeep."
 STATIC_MODIFIER_NAME_oe_sea_malacca_toll_fleet: "Malacca Armed Escorts & Strait Tolls"
 STATIC_MODIFIER_DESC_oe_sea_malacca_toll_fleet: "Heavy patrol fleets and stiff strait duties enrich the treasury and stiffen naval morale while alienating visiting merchants and neighbors."
 STATIC_MODIFIER_NAME_oe_sea_nusantara_spice_charter: "Nusantara Spice Entrepot Charter"
 STATIC_MODIFIER_DESC_oe_sea_nusantara_spice_charter: "Opening Trowulan and Palembang spice factorias to Quanzhou and Indian Ocean convoys lifts trade, maritime presence, and institutions at lighter outer-island control."
 STATIC_MODIFIER_NAME_oe_sea_java_inland_focus: "Java Inland Agrarian Consolidation"
 STATIC_MODIFIER_DESC_oe_sea_java_inland_focus: "Refocusing on Javanese rice irrigation and court orthodoxy steadies taxes and stability while curtailing distant maritime presence."
 STATIC_MODIFIER_NAME_oe_sea_siam_royal_junks: "Ayutthaya Royal Junk Fleet"
 STATIC_MODIFIER_DESC_oe_sea_siam_royal_junks: "Royal crown junks sailing between the Gulf of Siam, Malacca, and Bengal lift trade and maritime presence while raising naval upkeep."
 STATIC_MODIFIER_NAME_oe_sea_siam_river_hegemony: "Chao Phraya Valley Hegemony"
 STATIC_MODIFIER_DESC_oe_sea_siam_river_hegemony: "Anchoring power in Chao Phraya rice taxes and overland vassals strengthens taxes and land morale while tempering maritime merchant reach."
 STATIC_MODIFIER_NAME_oe_sea_monsoon_league_mod: "Indian Ocean & Nanyang Monsoon Compact"
 STATIC_MODIFIER_DESC_oe_sea_monsoon_league_mod: "Coordinated monsoon sailings, escort duties, and tariff reciprocity propel trade, maritime presence, and institutions alongside naval upkeep."
 STATIC_MODIFIER_NAME_oe_sea_exclusive_harbors_mod: "Exclusive Harbor Customs Regime"
 STATIC_MODIFIER_DESC_oe_sea_exclusive_harbors_mod: "Preserving exclusionary port duties lifts taxation and crown power while slowing institutional diffusion and diplomatic warmth."
 STATIC_MODIFIER_NAME_oe_sea_grand_maritime_charter: "Grand Charter of the Maritime Silk Road"
 STATIC_MODIFIER_DESC_oe_sea_grand_maritime_charter: "An unbroken sea corridor from Zaytun through Malacca and Kozhikode to Aden and Trajan's Canal crowns oceanic commerce and institutional exchange alongside standing naval upkeep and lighter crown control."
 STATIC_MODIFIER_NAME_oe_sea_armed_monsoon_order: "Armed Monsoon Thalassocracy"
 STATIC_MODIFIER_DESC_oe_sea_armed_monsoon_order: "Heavy ocean squadrons guard the monsoon chokepoints, surging naval morale, trade protection, and trade income at steep naval upkeep and diplomatic chill."
 STATIC_MODIFIER_NAME_oe_sea_monsoon_convoy_mod: "Chartered Monsoon Silk Road Convoy"
 STATIC_MODIFIER_DESC_oe_sea_monsoon_convoy_mod: "Seasonal convoys riding the monsoons between Zaytun, Malacca, Malabar, and the Red Sea lift trade and institution spread at steady escort upkeep."
 STATIC_MODIFIER_NAME_oe_sea_corridor_tier_1: "Maritime Silk Road Corridor (Tier I)"
 STATIC_MODIFIER_DESC_oe_sea_corridor_tier_1: "One major node of the Maritime Silk Road is open, granting signatories modest trade and institution gains alongside light naval escort costs."
 STATIC_MODIFIER_NAME_oe_sea_corridor_tier_2: "Maritime Silk Road Corridor (Tier II)"
 STATIC_MODIFIER_DESC_oe_sea_corridor_tier_2: "Two major nodes of the Maritime Silk Road are linked, accelerating trade, maritime presence, and institution growth with higher naval patrol costs."
 STATIC_MODIFIER_NAME_oe_sea_corridor_tier_3: "Maritime Silk Road Corridor (Tier III: Full Chain)"
 STATIC_MODIFIER_DESC_oe_sea_corridor_tier_3: "East (Zaytun), Hub (Malacca & Kozhikode), and West (Aden & Trajan's Canal) are all open! Signatories enjoy full trans-oceanic trade and institutional surges while bearing ocean-wide escort upkeep."
 STATIC_MODIFIER_NAME_oe_sea_malabar_spice_port: "Malabar Chartered Spice Port"
 STATIC_MODIFIER_DESC_oe_sea_malabar_spice_port: "Pepper warehouses and foreign factorias turn the Malabar coast into a major oceanic mart alongside mild waterfront unrest."
 STATIC_MODIFIER_NAME_oe_sea_sonargaon_loom_hub: "Sonargaon Muslin & Silk Hub"
 STATIC_MODIFIER_DESC_oe_sea_sonargaon_loom_hub: "Riverine looms and ocean-going dhows elevate Sonargaon's trade weight and prosperity with minor urban growing pains."
 STATIC_MODIFIER_NAME_oe_sea_thang_long_emporium: "Thang Long Maritime Emporium"
 STATIC_MODIFIER_DESC_oe_sea_thang_long_emporium: "Maritime envoys and southern junks boost Thang Long's trade power and growth alongside light civic policing needs."
 STATIC_MODIFIER_NAME_oe_sea_malacca_strait_hub: "Malacca Monsoon Crossroads"
 STATIC_MODIFIER_DESC_oe_sea_malacca_strait_hub: "Where the monsoons meet, ships from Zaytun, Java, India, and Aden crowd Malacca's quays, surging trade and harbor capacity."
 STATIC_MODIFIER_NAME_oe_sea_java_spice_entrepot: "Java & Palembang Spice Entrepot"
 STATIC_MODIFIER_DESC_oe_sea_java_spice_entrepot: "Cloves, nutmeg, and pepper flow through Javanese and Sumatran quays, boosting local trade power and maritime presence."
 STATIC_MODIFIER_NAME_oe_sea_ayodhya_royal_port: "Ayutthaya Royal River Emporium"
 STATIC_MODIFIER_DESC_oe_sea_ayodhya_royal_port: "Royal junk shipyards and foreign factorias elevate Ayutthaya's trade weight and shipbuilding alongside modest port friction."
 oe_sea_dec_calicut_charter.title: "Seal the Calicut Spice Charter"
 oe_sea_dec_calicut_charter.desc: "Commit factoria capital and reciprocal tariff shares to lock Kozhikode and Goa into the full Maritime Silk Road corridor."
 oe_sea_dec_calicut_charter.a: "Seal the Calicut Spice Charter"
 oe_sea_dec_sonargaon_compact.title: "Ratify the Sonargaon Silk & Muslin Compact"
 oe_sea_dec_sonargaon_compact.desc: "Sign long-term textile contracts across the Ganges delta, channeling Sonargaon muslin and silk into Indian Ocean convoys."
 oe_sea_dec_sonargaon_compact.a: "Ratify the Sonargaon Compact"
 oe_sea_dec_malacca_entrepot.title: "Charter the Malacca Strait Emporium"
 oe_sea_dec_malacca_entrepot.desc: "Fund warehouses and low-toll maritime codes at Malacca to connect Quanzhou, Java's spice ports, and Malabar."
 oe_sea_dec_malacca_entrepot.a: "Charter the Malacca Free Entrepot"
 oe_sea_dec_monsoon_fleet.title: "Dispatch a Monsoon Silk Road Convoy"
 oe_sea_dec_monsoon_fleet.desc: "Send a chartered seasonal convoy across the monsoon lanes, updating the Maritime Silk Road corridor cache and granting fifteen-year trade and institutional gains."
 oe_sea_dec_monsoon_fleet.a: "Fund and dispatch the Monsoon Convoy"
 oe_sea.1.t: "Post-Delhi Balance of the Deccan & Gujarat Ports"
 oe_sea.1.d: "As Delhi's grip over the south falters, power across the Deccan and western India is rapidly remade. Vijayanagar anchors the south, Muslim princes around Gulbarga assert regional rule, and the Gujarati ports of Khambat and Surat hum as golden gateways toward the Arabian Sea and Red Sea.\n\nShould we fortify our Deccan frontier to hold the balance of power, or strike customs accords across Gujarat's commercial ports?"
 oe_sea.1.a: "Fortify the Deccan frontier and secure the regional balance"
 oe_sea.1.a.tt: "Costs #R 120 gold#!, Army Tradition #G +8#!; gain [ShowModifier('oe_sea_deccan_equilibrium')] for #Y 25 years#!."
 oe_sea.1.b: "Strike customs accords with Khambat and Surat for Arabian Sea trade"
 oe_sea.1.b.tt: "Costs #R 90 gold#!, improves relations with Gujarat port holders; gain [ShowModifier('oe_sea_gujarat_ports_accord')] for #Y 25 years#!."
 oe_sea.2.t: "Deccan Gunpowder & War Elephants: Raichur and Goa"
 oe_sea.2.d: "Vijayanagar and the northern Deccan sultanates clash relentlessly over the Raichur Doab and the western ports of Goa and Kozhikode. Control of these harbors secures Arabian and Persian warhorses as well as gunners skilled in early matchlocks and siege bombards.\n\nOur commanders debate whether to fund costly warhorse and gunpowder reforms or double down on armored war elephants and hill forts."
 oe_sea.2.a: "Import Persian warhorses and adopt early Deccan gunpowder arms"
 oe_sea.2.a.tt: "Costs #R 180 gold#!, Stability #R −2#!, Army Tradition #G +10#!; gain [ShowModifier('oe_sea_deccan_gunpowder')] for #Y 30 years#!."
 oe_sea.2.b: "Rely on armored war elephants and hill citadels across the Doab"
 oe_sea.2.b.tt: "Costs #R 110 gold#!, Prestige #G +8#!; gain [ShowModifier('oe_sea_war_elephant_corps')] for #Y 30 years#!."
 oe_sea.3.t: "Malabar Pepper Gate: The Calicut Spice Charter"
 oe_sea.3.d: "Kozhikode (Calicut) and Goa overflow with black pepper, cardamom, and cinnamon, forming the Indian Ocean's vital hinge between Aden and Malacca. As monsoon fleets converge on the Malabar coast, local brokers and distant envoys vie for trading rights.\n\nIf the Roman Company or Great Yuan's Maritime Trade Bureau (Shibosi) is active, we may seal the Calicut Spice Charter—trading customs shares for full corridor integration—or enforce a royal monopoly."
 oe_sea.3.a: "Enforce a crown pepper monopoly at Kozhikode and Goa"
 oe_sea.3.a.tt: "Costs #R 150 gold#!, becomes a #bold #color_yellow Maritime Silk Road Signatory#!#!, upgrades Malabar port; gain [ShowModifier('oe_sea_malabar_monopoly')] for #Y 30 years#!."
 oe_sea.3.b: "Seal the Calicut Spice Charter with the Roman Company or Yuan Shibosi"
 oe_sea.3.b.tt: "Costs #R 180 gold#!, Prestige #R −8#! (diplomatic & tariff share); becomes a #bold #color_yellow Maritime Silk Road Signatory#!#!, upgrades Kozhikode, grants bilateral opinion and [ShowModifier('oe_sea_calicut_charter_mod')] for #Y 35 years#!."
 oe_sea.3.c: "Keep traditional Zamorin local brokerage without distant charters"
 oe_sea.3.c.tt: "Stability #G +3#!; gain [ShowModifier('oe_sea_local_pepper_brokers')] for #Y 25 years#!."
 oe_sea.4.t: "The Bengal Delta: Sonargaon Silk & Muslin Compact"
 oe_sea.4.d: "At the confluence of the Ganges delta, Sonargaon and Gaur weave fine muslin and silk prized from Constantinople to Quanzhou. Each monsoon season brings silver-laden ships into the Bay of Bengal seeking long-term textile compacts.\n\nWe may ratify the Sonargaon Silk & Muslin Compact to join the oceanic corridor, or concentrate production in royal delta looms."
 oe_sea.4.a: "Ratify the Sonargaon Silk & Muslin Compact with oceanic merchants"
 oe_sea.4.a.tt: "Costs #R 160 gold#!, Prestige #R −5#!, becomes a #bold #color_yellow Maritime Silk Road Signatory#!#!, upgrades Sonargaon, grants bilateral opinion and [ShowModifier('oe_sea_sonargaon_compact')] for #Y 30 years#!."
 oe_sea.4.b: "Expand royal textile looms at Gaur and Sonargaon under strict state oversight"
 oe_sea.4.b.tt: "Costs #R 120 gold#!, upgrades Sonargaon; gain [ShowModifier('oe_sea_bengal_royal_looms')] for #Y 30 years#!."
 oe_sea.5.t: "Timurid Heirs Turn South: Shadow Over the Indus & Delhi"
 oe_sea.5.d: "Entering the sixteenth century, rising Iranian power on the plateau and fortified eastern frontiers deflect Timurid heirs and Transoxian horsemen away from Central Asia. Bearing field artillery and steppe cavalry traditions, a new wave presses through the Khyber Pass toward the Indus and Delhi.\n\nShall we harness this Timurid-Mughal military surge for supremacy in Hindustan, or rally Indian realms for iron resistance?"
 oe_sea.5.a: "Harness the Timurid-Mughal surge to contest the Indus and Delhi"
 oe_sea.5.a.tt: "Costs #R 200 gold#!, Stability #R −4#!, Army Tradition #G +12#! (also empowers Mughals if formed); gain [ShowModifier('oe_sea_timurid_southward_push')] for #Y 30 years#!."
 oe_sea.5.b: "Iron resistance! Rally Indian hosts to bar the northwestern passes"
 oe_sea.5.b.tt: "Costs #R 180 gold#!, Manpower #R −2#!, Prestige #G +10#!; gain [ShowModifier('oe_sea_iron_resistance_india')] for #Y 30 years#!."
 oe_sea.6.t: "Panipat Gunpowder Revolution: Wagon Laagers & Field Cannon"
 oe_sea.6.d: "Gunsmoke over the plains of Panipat transforms warfare across South Asia: chained wagon laagers, volleying matchlockmen, and massed brass field cannon shatter traditional elephant and cavalry charges. Whether Delhi, Vijayanagar, or a rising Mughal power, every realm faces a decisive military reckoning.\n\nFull gunpowder modernization costs heavy gold and angers entrenched warrior elites, whereas an iron defensive bulwark preserves domestic calm at the price of lagging ordnance."
 oe_sea.6.a: "Embrace full Panipat gunpowder modernization and brass field artillery"
 oe_sea.6.a.tt: "Costs #R 260 gold#!, Stability #R −4#!, Nobles lose satisfaction, Army Tradition #G +12#!; gain [ShowModifier('oe_sea_panipat_gunpowder_mod')] for #Y 35 years#!."
 oe_sea.6.b: "Iron bulwark: rely on native heavy infantry, war elephants, and hill forts"
 oe_sea.6.b.tt: "Costs #R 160 gold#!, Manpower #R −1.5#!, Stability #G +3#!; gain [ShowModifier('oe_sea_panipat_iron_bulwark')] for #Y 35 years#!."
 oe_sea.7.t: "Thang Long Looks South: Dai Viet Tribute Trade or Autonomy"
 oe_sea.7.d: "Thang Long in the Red River Delta bridges southern China and the South China Sea porcelain and agarwood lanes. As Yuan or Chinese maritime order reshapes coastal commerce, Dai Viet stands at a strategic crossroads.\n\nShall we dispatch tribute-trade embassies to tap the Maritime Silk Road, or press an independent Nam Tien advance along the southern coast?"
 oe_sea.7.a: "Establish maritime tribute-trade accords linking Thang Long to Quanzhou and Nanyang"
 oe_sea.7.a.tt: "Costs #R 110 gold#!, Prestige #R −5#!, becomes a #bold #color_yellow Maritime Silk Road Signatory#!#!, upgrades Thang Long, improves opinion with China/Yuan; gain [ShowModifier('oe_sea_daiviet_tribute_trade')] for #Y 30 years#!."
 oe_sea.7.b: "Pursue sovereign Nam Tien expansion along the Indochinese coast"
 oe_sea.7.b.tt: "Costs #R 140 gold#!, Stability #R −2#!, Army Tradition #G +8#!, stirs frontier friction; gain [ShowModifier('oe_sea_daiviet_nam_tien')] for #Y 30 years#!."
 oe_sea.8.t: "Rise of the Malacca Strait: Parameswara's Emporium"
 oe_sea.8.d: "Prince Parameswara's new harbor on the Malay coast rapidly transforms Malacca into the indispensable hinge between the South China Sea and the Indian Ocean. Northeast monsoons carry Quanzhou silk and porcelain; southwest winds bring Gujarati textiles and Malabar pepper.\n\nWorking smoothly with whoever holds the strait—including a formed Malacca Sultanate—we must decide whether to charter a low-toll free entrepot or levy armed strait duties."
 oe_sea.8.a: "Charter Malacca as a low-toll free entrepot anchoring the central corridor"
 oe_sea.8.a.tt: "Costs #R 160 gold#!, becomes a #bold #color_yellow Maritime Silk Road Signatory#!#!, upgrades Malacca, improves diplomatic ties; gain [ShowModifier('oe_sea_malacca_free_strait')] for #Y 35 years#!."
 oe_sea.8.b: "Raise armed strait patrol fleets and enforce steep transit tolls"
 oe_sea.8.b.tt: "Costs #R 190 gold#!, Navy Tradition #G +10#!, upgrades Malacca; gain [ShowModifier('oe_sea_malacca_toll_fleet')] for #Y 35 years#!."
 oe_sea.9.t: "After the Palapa Oath: Majapahit & Java Spice Ports"
 oe_sea.9.d: "After the golden age of Gajah Mada's Palapa Oath and King Hayam Wuruk, Majapahit faces a turning point across Trowulan and Palembang. Cloves and nutmeg from the Spice Islands pass through Javanese harbors, drawing eager merchants from Quanzhou and the Indian Ocean.\n\nGranting spice factoria charters weaves Java into the grand maritime corridor, whereas turning inward secures rice revenues at the cost of oceanic reach."
 oe_sea.9.a: "Open Trowulan and Palembang spice factoria charters to oceanic convoys"
 oe_sea.9.a.tt: "Costs #R 140 gold#!, Prestige #R −5#!, becomes a #bold #color_yellow Maritime Silk Road Signatory#!#!, upgrades Java/Palembang; gain [ShowModifier('oe_sea_nusantara_spice_charter')] for #Y 30 years#!."
 oe_sea.9.b: "Retrench overseas claims to consolidate Javanese rice estates and court order"
 oe_sea.9.b.tt: "Costs #R 80 gold#!, Stability #G +4#!; gain [ShowModifier('oe_sea_java_inland_focus')] for #Y 30 years#!."
 oe_sea.10.t: "Sails of the Chao Phraya: Siam's Maritime Rivalry"
 oe_sea.10.d: "Along the lower Chao Phraya, Ayutthaya gathers rice, sappanwood, ivory, and tin into a vibrant nexus between the Gulf of Siam and the Bay of Bengal. Amid fierce competition from Malacca and northern fleets, Siamese rulers weigh their grand strategy.\n\nShall we build royal crown junks to contest Nanyang and Indian Ocean carrying trade, or anchor hegemony in Chao Phraya valley taxes and overland vassals?"
 oe_sea.10.a: "Launch Ayutthaya royal junk fleets into the Nanyang and Bengal trade"
 oe_sea.10.a.tt: "Costs #R 160 gold#!, Navy Tradition #G +8#!, becomes a #bold #color_yellow Maritime Silk Road Signatory#!#!, upgrades Ayutthaya; gain [ShowModifier('oe_sea_siam_royal_junks')] for #Y 30 years#!."
 oe_sea.10.b: "Focus on Chao Phraya agrarian taxation and overland Indochinese hegemony"
 oe_sea.10.b.tt: "Costs #R 100 gold#!, Army Tradition #G +8#!; gain [ShowModifier('oe_sea_siam_river_hegemony')] for #Y 30 years#!."
 oe_sea.11.t: "Monsoon Convergence: Quanzhou–Malacca–Aden Maritime Congress"
 oe_sea.11.d: "With Zaytun in the east, Malacca and Kozhikode at the hub, and Aden in the west stirring in concert, monsoon shipping has forged an unprecedented trans-oceanic relay. Harbor masters, chartered company envoys, and trade commissioners convene to draft a shared Monsoon Compact.\n\nJoining the league spreads trade wealth and institutions at the cost of joint escort upkeep; clinging to exclusionary tolls protects short-term customs at the risk of isolation."
 oe_sea.11.a: "Sign the Monsoon Compact for shared escorts and reciprocal corridor tariffs"
 oe_sea.11.a.tt: "Costs #R 240 gold#!, Stability #R −2#!, becomes a #bold #color_yellow Maritime Silk Road Signatory#!#!, grants bilateral ties, refreshes corridor cache, and gives [ShowModifier('oe_sea_monsoon_league_mod')] for #Y 35 years#!."
 oe_sea.11.b: "Reject trans-oceanic tariff cuts and preserve exclusive port customs"
 oe_sea.11.b.tt: "Costs #R 100 gold#!, Prestige #G +10#!; gain [ShowModifier('oe_sea_exclusive_harbors_mod')] for #Y 30 years#!."
 oe_sea.12.t: "The Full Maritime Silk Road: From Zaytun to Constantinople"
 oe_sea.12.d: "From Zaytun (Quanzhou) through Thang Long, Java, and the Malacca Strait, across the Bay of Bengal and Malabar's pepper gates to Aden, Trajan's Canal, and Constantinople—the entire Maritime Silk Road has locked into a single trans-oceanic circuit!\n\nSpices, blue-and-white porcelain, fine muslin, silk, and new ideas ride the monsoons across Eurasia. Where the Silk Road Twin Phoenix arc is active, this full-chain triumph also bolsters its maritime score."
 oe_sea.12.a: "Proclaim the Grand Charter of the Maritime Silk Road for open oceanic commerce"
 oe_sea.12.a.tt: "Costs #R 300 gold#!, Prestige #G +20#!, completes the arc, feeds #bold #color_yellow Silk Road Twin Phoenix maritime score#!#! (if active), syncs corridor tier, and grants [ShowModifier('oe_sea_grand_maritime_charter')] for #Y 45 years#!."
 oe_sea.12.b: "Forge an Armed Monsoon Thalassocracy backed by heavy escort squadrons"
 oe_sea.12.b.tt: "Costs #R 260 gold#!, Navy Tradition #G +15#!, completes the arc, feeds #bold #color_yellow Silk Road Twin Phoenix maritime score#!#! (if active), syncs corridor tier, and grants [ShowModifier('oe_sea_armed_monsoon_order')] for #Y 45 years#!."
 oe_sea.20.t: "South & SE Asia Maritime Silk Road: Choice Takes Effect"
 oe_sea.90.t: "Maritime Silk Road of South & SE Asia: Ledger"
