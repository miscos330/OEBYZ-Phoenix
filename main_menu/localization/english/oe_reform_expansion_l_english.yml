l_english:
 oe_ir_coinage: "Reform the Coinage"
 oe_ir_coinage_desc: "Restore confidence in imperial money through consistent weight, purity and minting. Costs #R 50 Authority#! and can be completed once.\n\nWith the highest tier of the Hyperpyron privilege, unlock and enact #Y Hyperpyron Coinage#!. Otherwise, gain #Y Abolition of the Hyperpyron#!, reducing minting income by #R 100%#! for #Y 24 months#!, and unlock and enact #Y Stavraton Coinage#!."
 oe_hyperpyron_coinage: "Hyperpyron Coinage"
 oe_hyperpyron_coinage_desc: "Restore trusted imperial money in gold, silver and copper for exchange across towns and countryside."
 oe_state_guild_mining: "State Guild Control"
 oe_state_guild_mining_desc: "Imperially supervised guilds register mines, organize extraction and secure supplies for the prosperity of the realm."
 OE_PURPLE_MINES_UNLOCK: "Unlocks the #Y Mines of the Purple Chamber#! town right."
 oe_purple_mines: "Mines of the Purple Chamber"
 oe_purple_mines_desc: "Mines registered under imperial authority draw workers, merchants and smelters. Available only where iron, copper, tin, lead, coal, alum or saltpeter is the raw material."
 oe_precious_metals_control: "Gold and Silver Control Act"
 oe_precious_metals_control_desc: "Precious metals must first serve imperial mints and domestic exchange, rather than leave the realm in foreign cargoes."
 oe_rhodian_maritime_law: "Rhodian Sea Law"
 oe_rhodian_maritime_law_desc: "The maritime traditions of Rhodes provide a common standard for cargo, shared losses and disputes in every imperial harbor."
 oe_rhodian_antipiracy_law: "Rhodian Sea Law"
 oe_rhodian_antipiracy_law_desc: "Imperial fleets protect the sea lanes and bring those who plunder shipping or harbor pirates to account."
 oe_professional_army_tradition: "Professional Army Tradition"
 oe_professional_army_tradition_desc: "Standing rolls, sustained training and dependable supply form the foundation of imperial arms; levies serve only as a supplement."
 oe_higher_academies: "Higher Academies"
 oe_higher_academies_desc: "Institutions devoted to classical learning, law and government cultivate the scholars and officials of the empire."
 oe_honorary_nobility: "Honorary Nobility"
 oe_honorary_nobility_desc: "Noble distinction rests on imperial honors and public service, while local authority answers to a common law."
 oe_roman_bureaucracy: "East Roman Bureaucracy"
 oe_roman_bureaucracy_desc: "Officials trained in law and records connect the capital to the provinces through dependable administration."
 oe_revised_book_of_eparch: "Revised Book of the Eparch"
 oe_revised_book_of_eparch_desc: "Renewed ordinances govern guilds, workshops and markets, clarifying duties from production to sale."
 oe_pax_romana: "Pax Romana"
 oe_pax_romana_desc: "Common citizenship and law allow the peoples of the empire to retain their languages and customs in peace."
 oe_logothetes_cabinet: "The Logothetes"
 oe_logothetes_cabinet_desc: "The logothetes oversee finance, military rolls, the post and imperial correspondence under clearly defined responsibilities.\n\nEnacting this policy unlocks the cabinet actions Promote Population Growth, Imperial Healthcare, and Directorate of Trade."
 oe_imperial_council: "East Roman Imperial Council"
 oe_imperial_council_desc: "The East Roman Imperial Council summons clerical and burgher representatives before the throne in the domestic parliamentary framework, operating alongside the #Y Pillars of the Empire#! imperial governance hub.\n\n#Y Distinction#!: This domestic council handles estate deliberations and is separate from the Roman legislative [Concept('oe_tu_senate','Imperial Senate')|e] inside Pillars of the Empire, which holds seats for court officers, noble houses, and chartered/exarchate provinces to vote on levies, [Concept('oe_tu_provincialise','provincialisation')|e], and Roman law."
 STATIC_MODIFIER_NAME_oe_abolish_hyperpyron: "Abolition of the Hyperpyron"
 STATIC_MODIFIER_DESC_oe_abolish_hyperpyron: "Old coins are being recalled while new money enters circulation, imposing a temporary cost on imperial minting."
 oe_armenian_identity_movement: "Armenian Identity Movement"
 oe_armenian_identity_movement_desc: "The fortresses, monasteries and trade routes of the highlands are once more joined by imperial law. Through service, learning and exchange, Armenians bring their traditions into the Roman revival.\n\n$OE_IDENTITY_FIXED_30Y_DESC$"
 OE_RW_ASSIM_ARMENIA_TITLE: "Begin Armenian Romanization"
 OE_RW_ASSIM_ARMENIA_ROW: "Armenian Culture"
 OE_RW_ASSIM_ARMENIA_FLAVOR: "Unite the peoples of the highlands and plains in a shared Roman homeland."
 OE_RW_ASSIM_ARMENIA_SOURCES: "Converts [ShowCultureName('armenian_culture')] population."
 OE_RW_ASSIM_ARMENIA_TARGET: "Gradually forms [ShowCultureName('oe_armenian_greek_culture')] in the Roman culture group, spreading only among Armenian population within Byzantium and its subjects.\n\n$OE_IDENTITY_FIXED_30Y_DESC$"
 OE_RW_ASSIM_ARMENIA_CONDITION: "Byzantium and its subjects must own at least 65% of conquerable locations in the Armenian Highlands and Armenia areas."
 OE_RW_ASSIM_ARMENIA_NOT_STARTED: "The Armenian identity movement is not active or on cooldown."
 OE_RW_ASSIM_ARMENIA_WAITING: "Not yet begun"
 OE_RW_ASSIM_ARMENIA_STARTED: "Active or cooling down: Armenian"
 OE_RW_ASSIM_ARMENIA_PROGRESS: "Owned: [GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_rw_assim_armenia_owned')|0] / [GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_rw_assim_armenia_total')|0]; required: [GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_rw_assim_armenia_required')|0]."
