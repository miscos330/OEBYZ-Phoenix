 oe_cel_grand_duhu: "Grand Protectorate"
 oe_cel_grand_duhu_desc: "A grand protectorate in a distant land or across the sea. It shares exploration with the Son of Heaven, sends part of its merchant power to the overlord, and lets the overlord build, recruit and launch ships on its soil. Its name follows its region and the throne's tradition."
