 oe_cel_fanwang: "Celestial Princely Fief"
 oe_cel_fanwang_desc: "A fief held by a prince of the imperial house or a great servant of the throne. It follows its overlord to war and returns to the throne if its prince dies without an heir. The stronger the prince, the harder it is to curb him."
