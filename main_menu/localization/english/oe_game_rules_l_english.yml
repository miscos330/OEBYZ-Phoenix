l_english:
 # Generated by tools_20261117/gen_game_rules.py (SYS-1, Decision 309); edit the generator, not this file.
 rule_oe_rule_if_frequency: "Project Phoenix: Historical & Alt-History Pace"
 setting_oe_rule_if_frequency_historical: "Historical Recommended"
 setting_oe_rule_if_frequency_historical_desc: "Uses the recommended balanced pacing: historical mainlines progress cohesively while plausible alternate-history branches remain reachable when conditions align."
 setting_oe_rule_if_frequency_active: "Active Alt-History"
 setting_oe_rule_if_frequency_active_desc: "Raises AI weights toward alternate-history branches and pivotal forks so major Eurasian powers diverge from history more frequently."
 setting_oe_rule_if_frequency_strict: "Strictly Historical"
 setting_oe_rule_if_frequency_strict_desc: "Heavily steers AI choices toward historical outcomes at major turning points while leaving player decisions unrestricted."

 rule_oe_rule_glh_fragmentation: "Project Phoenix: Golden Horde Fragmentation"
 setting_oe_rule_glh_fragmentation_standard: "Standard Three-Stage"
 setting_oe_rule_glh_fragmentation_standard_desc: "The Golden Horde follows the recommended three-stage arc from court strife and beglerbeg ascendancy to ulus fragmentation."
 setting_oe_rule_glh_fragmentation_intense: "Intense Collapse"
 setting_oe_rule_glh_fragmentation_intense_desc: "Accelerates steppe authority decay and lowers ulus breakaway thresholds, causing an earlier and sharper breakup of the Golden Horde."
 setting_oe_rule_glh_fragmentation_mild: "Mild Fragmentation"
 setting_oe_rule_glh_fragmentation_mild_desc: "Slows steppe authority loss and raises fragmentation thresholds, allowing the Golden Horde to preserve its hegemony longer."

 rule_oe_rule_yuan_ai_assist: "Project Phoenix: AI Great Yuan Restoration Assist"
 setting_oe_rule_yuan_ai_assist_balanced: "Balanced"
 setting_oe_rule_yuan_ai_assist_balanced_desc: "AI Great Yuan handles currency, grain transport, and rebellions with standard tuning, capable of either restoration or northern retreat."
 setting_oe_rule_yuan_ai_assist_boosted: "Strengthened Yuan"
 setting_oe_rule_yuan_ai_assist_boosted_desc: "Grants AI-controlled Great Yuan steadier fiscal and pacification support, making a restored Yuan in East Asia significantly more likely (AI only)."
 setting_oe_rule_yuan_ai_assist_off: "Off"
 setting_oe_rule_yuan_ai_assist_off_desc: "Disables extra AI restoration assistance for Great Yuan, leaving it to face late-Zhizheng turmoil under full baseline pressure."

 rule_oe_rule_rus_balance: "Project Phoenix: Rus' Player & AI Balance"
 setting_oe_rule_rus_balance_standard: "Standard Playable"
 setting_oe_rule_rus_balance_standard_desc: "Recommended balance tuning playable starts for Moscow, Novgorod, and Tver alongside competitive mid-game unification."
 setting_oe_rule_rus_balance_challenge: "Challenge Mode"
 setting_oe_rule_rus_balance_challenge_desc: "Intensifies Tatar Yoke pressure and princely rivalry for experienced players seeking a tougher path to Russian unification."
 setting_oe_rule_rus_balance_vanilla_aggro: "Vanilla Aggressive"
 setting_oe_rule_rus_balance_vanilla_aggro_desc: "Uses a more aggressive, vanilla-leaning expansion pace in which Rus' principalities and neighbors wage annexation wars more readily."

 rule_oe_rule_silk_phoenix: "Project Phoenix: Silk Road Twin Phoenix Linkage"
 setting_oe_rule_silk_phoenix_dual_or_solo: "Dual + Solo Fallback"
 setting_oe_rule_silk_phoenix_dual_or_solo_desc: "Fires the full Twin Phoenix embassy and Silk Road chain when both Byzantium and Great Yuan thrive, with a solo fallback if only one survives."
 setting_oe_rule_silk_phoenix_dual_only: "Dual Empires Only"
 setting_oe_rule_silk_phoenix_dual_only_desc: "Triggers the Twin Phoenix cross-Eurasian chain strictly when both Byzantium and Great Yuan endure and meet restoration thresholds."
 setting_oe_rule_silk_phoenix_off: "Off"
 setting_oe_rule_silk_phoenix_off_desc: "Disables the cross-Eurasian Twin Phoenix linkage chain between Byzantium and Great Yuan; each realm follows its own regional arc."

 rule_oe_rule_roman_prefectures: "Project Phoenix: Classical Roman Praetorian Prefectures"
 setting_oe_rule_roman_prefectures_gradual_3: "Gradual 3-Prefecture Unlock"
 setting_oe_rule_roman_prefectures_gradual_3_desc: "Recommended pacing: progressively unlocks classical Praetorian Prefectures across core theaters as imperial reconquest advances."
 setting_oe_rule_roman_prefectures_endgame_10: "Endgame 10-Region Unlock"
 setting_oe_rule_roman_prefectures_endgame_10_desc: "Reserves the classical Praetorian Prefecture overhaul as an endgame imperial reward unlocked upon restoring all ten Roman theaters."

 rule_oe_rule_byz_theme_econ: "Project Phoenix: Theme Fiscal Depth"
 setting_oe_rule_byz_theme_econ_standard: "Standard"
 setting_oe_rule_byz_theme_econ_standard_desc: "Uses recommended balance ratios for Byzantine Theme upkeep, tax quotas, and reinforcement costs."
 setting_oe_rule_byz_theme_econ_strict: "Strict Fiscal"
 setting_oe_rule_byz_theme_econ_strict_desc: "Tightens Theme fiscal margins and increases upkeep pressure from over-extended Themes for players seeking stricter economic management."

 rule_oe_rule_quick_hud: "Project Phoenix: Quick Navigation Bar Default"
 setting_oe_rule_quick_hud_on: "Enabled"
 setting_oe_rule_quick_hud_on_desc: "Shows the realm quick navigation bar by default for one-click access to Chronicle, Empire Pillars, Yuan Dashboard, or Rus' views (collapsible in-game)."
 setting_oe_rule_quick_hud_off: "Disabled"
 setting_oe_rule_quick_hud_off_desc: "Hides the quick navigation bar by default for a cleaner HUD; all mod panels remain accessible via standard organization and situation menus."

 rule_oe_rule_empire_entropy: "Project Phoenix: Imperial Entropy Anti-Snowball Engine"
 setting_oe_rule_empire_entropy_standard: "Standard Recommended"
 setting_oe_rule_empire_entropy_standard_desc: "Recommended balanced mode: enables transparent five-dimensional imperial entropy for Byzantium/Rome (150+ locations, merged seamlessly with The Burden of Rome and Praetorian Prefectures with zero double penalty), Great Yuan, Russia, and any empire of 200+ locations, complete with active counter-measure decisions and the Pax Imperialis crown milestone."
 setting_oe_rule_empire_entropy_hardcore: "Hardcore Imperial Governance"
 setting_oe_rule_empire_entropy_hardcore_desc: "Hardcore challenge mode: increases monthly five-dimensional entropy accumulation rate by 35%, sharpening late-game fiscal inflation, frontier satrapy, and multi-front war pressures for veteran players."
 setting_oe_rule_empire_entropy_lite: "Lite (Post-Restoration Only)"
 setting_oe_rule_empire_entropy_lite_desc: "Relaxed mode: disables the universal five-dimensional Imperial Entropy engine while preserving Byzantium/Rome's original post-Restoration Burden of Rome situation untouched."

 rule_oe_rule_hegemon_ai: "Project Phoenix: 12-Major Dynamic Anti-Hegemon AI"
 setting_oe_rule_hegemon_ai_standard: "Standard Counter-Balancing"
 setting_oe_rule_hegemon_ai_standard_desc: "Recommended ecology: when a runaway hegemon rises, threatened powers among the 12 Eurasian majors curtail infighting, coordinate defensive alliances, and counter-strike when the hegemon suffers high entropy or multi-front wars (AI only)."
 setting_oe_rule_hegemon_ai_high: "High-Intensity Coalition AI"
 setting_oe_rule_hegemon_ai_high_desc: "High-pressure balancing: lowers hegemon detection thresholds and strengthens cross-confessional coalition coordination among the 12 Eurasian major powers against runaway empires (AI only)."
 setting_oe_rule_hegemon_ai_off: "Off"
 setting_oe_rule_hegemon_ai_off_desc: "Disables dynamic anti-hegemon coalition balancing; the 12 Eurasian major powers pursue their own regional strategic goals independently."

 rule_oe_rule_alliance_expire_guarantee: "Project Phoenix: Alliance Expiry Guarantee Downgrade"
 setting_oe_rule_aeg_vanilla: "Vanilla (Auto-Downgrade)"
 setting_oe_rule_aeg_vanilla_desc: "Preserves vanilla EU5 diplomacy: when an alliance expires between unequal-rank realms, the higher-rank realm automatically downgrades it into a unilateral guarantee."
 setting_oe_rule_aeg_no_downgrade: "No Auto-Downgrade"
 setting_oe_rule_aeg_no_downgrade_desc: "Expired alliances end cleanly without automatically converting into unilateral guarantees; normal player and AI diplomatic guarantee actions remain completely unaffected."

 rule_oe_rule_dynamic_institutions: "Project Phoenix: Dynamic Institution Origins & Eurasian Catalysis"
 setting_oe_rule_dynamic_institutions_off: "Off (Vanilla Default)"
 setting_oe_rule_dynamic_institutions_off_desc: "Preserves vanilla EU5 and existing rules with zero v9.5 institution origin overrides or Eurasian hub catalysis; recommended when using external institution mods."
 setting_oe_rule_dynamic_institutions_eurasian_hubs: "Eurasian Multipolar Hubs"
 setting_oe_rule_dynamic_institutions_eurasian_hubs_desc: "Dual-layer mode: opens Constantinople, Dadu, Hangzhou, Cairo, Samarkand, Delhi, and Moscow to compete as plausible vanilla institution origins once literacy, academy, and burgher thresholds are met, plus annual April catalysis."
 setting_oe_rule_dynamic_institutions_global_merit: "Global Meritocracy"
 setting_oe_rule_dynamic_institutions_global_merit_desc: "Dual-layer mode: lifts hard European geographic locks on plausible institution spawns so any qualifying high-literacy metropolis worldwide with academies and strong burghers can spawn institutions, alongside stronger hub catalysis."

 rule_oe_rule_elysia_exodus: "Project Phoenix: The Fourth Odyssey — Nova Elysia"
 setting_oe_rule_elysia_exodus_exile_only: "Exile Survival (Recommended Default)"
 setting_oe_rule_elysia_exodus_exile_only_desc: "Balanced historical-alt mode: preserves the normal 1337 Eurasian opening; unlocks The Fourth Odyssey western voyage to Chesapeake Bay and Nova Elysia when the player's Roman heir (Byzantium, Trebizond, or Theodoro) faces Old World collapse or activates the exodus decision."
 setting_oe_rule_elysia_exodus_immediate_1337: "Immediate 1337 Departure (Alt-History)"
 setting_oe_rule_elysia_exodus_immediate_1337_desc: "Instant-play mode: a human Byzantium receives the Secret Western Charter as early as June 1337 and can launch The Fourth Odyssey immediately to experience all four acts of Nova Elysia, triple-faith synergy (including v9.8 Religio Romana), Atlantic hegemony, and Nostos."
 setting_oe_rule_elysia_exodus_off: "Off (Zero-Overhead Sleep)"
 setting_oe_rule_elysia_exodus_off_desc: "Completely disables The Fourth Odyssey — Nova Elysia situation, events, and decisions with O(1) pulse sleep and zero runtime overhead."

 rule_oe_rule_historic_crises: "Project Phoenix: Historic Crises (Little Ice Age & Silver Tide)"
 setting_oe_rule_historic_crises_historic: "Historic Intensity (Recommended Default)"
 setting_oe_rule_historic_crises_historic_desc: "Enables full-intensity 1570-1715 Little Ice Age and 1540-1660 Silver Price Revolution disasters (zero-conflict complement to the vanilla Little Ice Age situation, linked with Yuan Chao, Market Bridges, and Ever-Normal Granary)."
 setting_oe_rule_historic_crises_mild: "Mild Mode (Reduced Impact)"
 setting_oe_rule_historic_crises_mild_desc: "Preserves both historic crisis disasters and narratives while automatically applying a ~50% penalty buffer, higher trigger thresholds, and lower relief/reform costs."
 setting_oe_rule_historic_crises_off: "Off (Crises Disabled, Core Systems Active)"
 setting_oe_rule_historic_crises_off_desc: "Disables both Little Ice Age and Silver Price Revolution disasters with O(1) sleep while keeping espionage, 6 cabinet actions, privateering/5 expeditions, Condottieri, 12 parliament agendas, and 6 rebel demands fully active."

 rule_oe_rule_dynamic_epidemic: "Project Phoenix: Early Modern Epidemics (Levantine Plague & Camp Fever)"
 setting_oe_rule_dynamic_epidemic_historic: "Historic Intensity (Recommended Default)"
 setting_oe_rule_dynamic_epidemic_historic_desc: "Enables two early modern diseases after the Black Death, from 1460 to 1750: the recurring Levantine plague and camp fever, with double-island lazarettos, land cordon stations, the forty-day quarantine and the Wenyi Lun as responses. Spread is handled by the vanilla disease system."
 setting_oe_rule_dynamic_epidemic_mild: "Mild Mode (Reduced Impact)"
 setting_oe_rule_dynamic_epidemic_mild_desc: "Both early modern diseases still appear, but break out less often, and a country they reach gets a buffer of about 5 years that roughly halves losses and the financial shock."
 setting_oe_rule_dynamic_epidemic_off: "Off (Zero-Overhead Sleep)"
 setting_oe_rule_dynamic_epidemic_off_desc: "The two early modern diseases never appear and their quarterly checks sleep at the entry; vanilla diseases are unaffected, and the quarantine buildings and decisions stay available."

 rule_oe_rule_obs_telemetry: "Project Phoenix: Observer Yearly Data Export (Testing)"
 setting_oe_rule_obs_telemetry_off: "Off (Default)"
 setting_oe_rule_obs_telemetry_off_desc: "Exports nothing; the checks sleep at the entry. Keep this off for normal play."
 setting_oe_rule_obs_telemetry_on: "On (Balance Testing)"
 setting_oe_rule_obs_telemetry_on_desc: "Every January writes a snapshot of 22 major countries (29 in century years) to debug.log for the offline balance analysis script. It only writes the log and does not affect the game."

 rule_oe_rule_global_arcs_depth: "Project Phoenix: Four New Theatres (Persia, India, Japan and Korea, Western Europe)"
 setting_oe_rule_global_arcs_standard: "Standard (Recommended Default)"
 setting_oe_rule_global_arcs_standard_desc: "Players can use everything in the four new theatres; computer-controlled countries of those theatres also meet the events and may adopt the new laws, reforms, privileges and schools on their own. No expansion is required."
 setting_oe_rule_global_arcs_player_only: "Players Only"
 setting_oe_rule_global_arcs_player_only_desc: "Only player-controlled countries meet the events and quarterly checks of the four new theatres; computer-controlled countries are skipped at the entry, which costs the least late in the game."
 setting_oe_rule_global_arcs_full_ai: "Stronger Computer Rivals"
 setting_oe_rule_global_arcs_full_ai_desc: "As Standard, and in addition the computer-controlled countries of those theatres receive a military and trade bonus every ten years, making them stronger rivals."
