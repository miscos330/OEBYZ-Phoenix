 oe_hc_blacksea: "Campaign in the Black Sea"
 oe_hc_blacksea_desc: "Imperial legions are fighting in the Black Sea.\n\nProgress: #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_hc_blacksea_progress').GetValue|0]#!  War pressure: #R [GetCountry('BYZ').MakeScope.GetVariable('oe_hc_blacksea_pressure').GetValue|0]#!  Months: [GetCountry('BYZ').MakeScope.GetVariable('oe_hc_blacksea_months').GetValue|0]\n\nProgress #Y 80#! is a victory; from #Y 40#! the campaign may end in a negotiated peace; pressure #Y 100#! is a defeat; after #Y 10#! years it is settled on current progress.\n\nThe work of restoration: [GetCountry('BYZ').Custom('OeSrHcGoal')]."
