 oe_hc_egypt_declare: "Proclaim the Egypt Campaign"
 oe_hc_egypt_declare_desc: "Spend #R 1000#! gold (#R 1500#! while reconquest fervour is Dispirited) and #Y 10#! [oe_tu_authority|e] to declare war on every country with its capital in Egypt outside the imperial bloc, and open the Egypt campaign. While it runs, non-capital towns taken by the imperial side pass to the empire at once. Only one campaign at a time.\n\n$oe_tsn_pv_2$"
 oe_hc_egypt_pay: "Pay the Egypt Army"
 oe_hc_egypt_pay_desc: "Spend #R 300#! gold: war pressure #G −15#!. #Y 6#!-month cooldown."
 oe_hc_egypt_peace: "Negotiate Peace in Egypt"
 oe_hc_egypt_peace_desc: "Available from progress #Y 40#!. Ends every campaign war; gained land is kept; smaller rewards than a victory."
