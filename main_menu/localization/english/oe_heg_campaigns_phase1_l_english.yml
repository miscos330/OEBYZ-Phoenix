l_english:
 oe_hc_egypt: "Campaign in Egypt"
 oe_hc_egypt_desc: "Imperial legions are fighting in Egypt.\n\nProgress: #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_hc_egypt_progress').GetValue|0]#!  War pressure: #R [GetCountry('BYZ').MakeScope.GetVariable('oe_hc_egypt_pressure').GetValue|0]#!  Months: [GetCountry('BYZ').MakeScope.GetVariable('oe_hc_egypt_months').GetValue|0]\n\nProgress #Y 80#! is a victory; from #Y 40#! the campaign may end in a negotiated peace; pressure #Y 100#! is a defeat; after #Y 10#! years it is settled on current progress.\n\nThe work of restoration: [GetCountry('BYZ').Custom('OeSrHcGoal')]."
 oe_hc_africa: "Campaign in North Africa"
 oe_hc_africa_desc: "Imperial legions are fighting in North Africa.\n\nProgress: #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_hc_africa_progress').GetValue|0]#!  War pressure: #R [GetCountry('BYZ').MakeScope.GetVariable('oe_hc_africa_pressure').GetValue|0]#!  Months: [GetCountry('BYZ').MakeScope.GetVariable('oe_hc_africa_months').GetValue|0]\n\nProgress #Y 80#! is a victory; from #Y 40#! the campaign may end in a negotiated peace; pressure #Y 100#! is a defeat; after #Y 10#! years it is settled on current progress."
