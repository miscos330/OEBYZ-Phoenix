 oe_hc_pay_tt: "War pressure #G −15#!"
 oe_hc_peace_tt: "Ends this campaign in a negotiated peace"
 OE_HC_PLAN_REQUIRED: "The region has been planned"
 OE_HC_ONE_AT_A_TIME: "No other campaign is running"
 OE_HC_COOLDOWN: "The region is not in its post-defeat cooldown"
 OE_HC_AUTHORITY_10: "At least #Y 10#! Imperial Authority"
 OE_HC_NO_TARGETS: "A country in the region can still be attacked"
 OE_HC_PAY_COOLDOWN: "The pay cooldown has ended"
 OE_HC_IN_CAMPAIGN_WAR: "At war with the empire in a war registered by this campaign"
 OE_HC_PEACE_REQUIRES: "Campaign progress at least #Y 40#!"
 STATIC_MODIFIER_NAME_oe_hc_grain_ships: "Grain Ships Return"
 STATIC_MODIFIER_NAME_oe_hc_romanization: "Romanisation"
 STATIC_MODIFIER_NAME_oe_hc_coptic_conversion: "Forced Conversion"
 STATIC_MODIFIER_NAME_oe_hc_apulian_greeks: "Greeks of Apulia"
 oe_hc.1.a: "Send craftsmen and engines (#Y 200#! gold, progress #G +5#!)"
 oe_hc.1.b: "Keep up the siege (pressure #R +5#!)"
 oe_hc.1.t: "A Stalled Siege"
 oe_hc.1.d: "Dispatches from the front report that the enemy citadel's masonry and outer ditches are far more formidable than our engineers first estimated. Weeks of bombardment have yielded scant breach, rain floods the siege trenches, and sullen grumbling spreads through the camp as the protracted investment drags on."
 oe_hc.2.a: "Quarantine the camp (manpower #R −2#!, pressure #G −5#!)"
 oe_hc.2.b: "March on regardless (pressure #R +10#!)"
 oe_hc.2.t: "Sickness in the Camp"
 oe_hc.2.d: "Stagnant water and crowded quarters have unleashed a virulent camp fever that races from tent to tent, felling seasoned soldiers faster than enemy steel. Army physicians urgently plead for the afflicted quarter to be sealed off in strict quarantine before sickness breaks the back of the entire expedition."
 oe_hc.3.a: "Pay for neutrality (#Y 300#! gold)"
 oe_hc.3.b: "Refuse (pressure #R +10#!; #Y 30%#! that the power joins the enemy)"
 oe_hc.3.t: "Foreign Intervention"
 oe_hc.3.d: "An envoy of a foreign power arrives, voicing his master's concern and hinting at neutrality for the right price."
 oe_hc.4.a: "Pay from the treasury (#Y 200#! gold, pressure #G −10#!)"
 oe_hc.4.b: "Promise spoils after the war (pressure #R +5#!, prestige −minor)"
 oe_hc.4.t: "Arrears of Pay"
 oe_hc.4.d: "With supply convoys delayed and war chests strained, pay at the front has fallen three full months into arrears. Boots are worn to rags, rations grow lean, and field officers have drafted a joint petition warning the throne that even iron discipline cannot keep unpaid ranks steady much longer."
 oe_hc.11.a: "Constantinople will not go hungry (food modifier for #Y 10#! years, pressure #G −10#!)"
 oe_hc.11.t: "The Grain Ships Return"
 oe_hc.11.d: "Once more the imperial standard snaps in the salt breeze above the docks and breakwaters of Alexandria. For the first time in three centuries, deep-bellied grain ships packed with rich Egyptian wheat catch the northbound winds for the Golden Horn, promising that Constantinople will not go hungry again."
 oe_hc.12.a: "Tolerate the Coptic Church (progress #G +5#!, pressure #G −5#!)"
 oe_hc.12.b: "Impose Orthodoxy (faster conversion in gained land for #Y 20#! years, pressure #R +10#!)"
 oe_hc.12.t: "The Copts"
 oe_hc.12.d: "The Coptic Church has endured centuries of foreign rule. Its people wait to see whether the Romans will tolerate them or force conversion once more."
 oe_hc.13.a: "Wait for the water to fall (pressure #R +5#!)"
 oe_hc.13.b: "Risk the crossing (half chance: progress #G +8#!, otherwise pressure #R +10#!)"
 oe_hc.13.t: "The Level of the Nile"
 oe_hc.13.d: "Local river guides warn that the Nile's annual inundation is rising weeks ahead of its usual season, rapidly turning shallow fords into treacherous brown torrents. Halted along the muddy banks, our commanders must choose between waiting out the flood in camp or staking the campaign on a daring crossing right now."
 oe_hc.21.a: "Ally with the tribes (#Y 300#! gold, pressure #G −10#!)"
 oe_hc.21.b: "March against the tribes (progress #G +5#!, pressure #R +10#!)"
 oe_hc.21.t: "The Berber Tribes"
 oe_hc.21.d: "Envoys from the interior Berber confederations have ridden into the imperial camp under banners of truce. Intimate with every hidden oasis, mountain track, and desert well, they offer to guide the legions and furnish baggage camels and water—provided Roman gold is counted out into their hands first."
 oe_hc.22.a: "Build watering stations (#Y 200#! gold, pressure #G −5#!)"
 oe_hc.22.b: "Force the march (progress #G +5#!, manpower #R −2#!)"
 oe_hc.22.t: "The Desert Supply Line"
 oe_hc.22.d: "Every march deeper into the arid interior stretches our supply trains thinner from the coastal depots along the Mediterranean. Pack animals founder beneath the scorching sun, dust chokes the dry wadis, and each skin of fresh water has grown more precious than coin as the vanguard slows."
 oe_hc.23.a: "Raise a memorial at the old harbour (prestige, pressure #G −10#!)"
 oe_hc.23.t: "The Old Harbour of Carthage"
 oe_hc.23.d: "Beyond the walls of Tunis, imperial banners flutter once again over the storied anchorage where Belisarius brought Justinian's fleet ashore. Gazing across the weathered moles and ancient basins of Carthage's old harbour, veterans feel the living weight of Roman memory return to the African coast."
 oe_hc.31.a: "Reconcile with the Pope and enter as protector (legitimacy, progress #G +5#!)"
 oe_hc.31.b: "Enter by right as Roman Emperor (great prestige, pressure #G −10#!, stability #R −1#!)"
 oe_hc.31.t: "The Keys of Rome"
 oe_hc.31.d: "After centuries of estrangement, the ancient gates of Rome swing open before the advancing imperial standards. Papal legates hasten out to meet the host, solemnly asking in what capacity the Emperor means to enter the Eternal City—as the reconciled protector of the Church, or by sovereign right as Roman Emperor."
 oe_hc.32.a: "Pay Venice #Y 500#! gold for neutrality"
 oe_hc.32.b: "Refuse; Venice blockades our supply (pressure #R +15#!)"
 oe_hc.32.t: "The Venetian Fleet"
 oe_hc.32.d: "War galleys flying the Winged Lion of St Mark patrol the narrow waters of the Adriatic, shadowing every imperial transport along the Italian shore. Smooth-tongued envoys from the Republic offer to guarantee the safety of our sea lanes—once a handsome sum of Roman gold has been paid into Venetian coffers."
 oe_hc.33.a: "Rebuild Byzantine Italy (progress #G +5#!, faster assimilation in Apulia for #Y 20#! years)"
 oe_hc.33.t: "The Greeks of the South"
 oe_hc.33.d: "At the approach of the imperial host, the Greek-speaking towns of Bari and Apulia swing open their gates without waiting for siege lines to be dug. Local notables and Orthodox priests walk forth bearing icons to greet the legions, welcoming Rome back to the old Byzantine south of Italy."
 oe_hc.41.a: "Meet them with a wall of spears (progress #G +5#!, pressure #R +5#!)"
 oe_hc.41.b: "Avoid the charge and hold the camp (pressure #G −5#!, progress #R −3#!)"
 oe_hc.41.t: "The Frankish Knights"
 oe_hc.41.d: "Across the field, the chivalry of France dresses its ranks in dense, armoured squadrons, lances couched above barded destriers. This thunderous close-order charge has been the pride of Frankish arms for centuries, and our vanguard commanders await orders on whether to meet it with a hedge of spears or hold fast behind entrenchments."
 oe_hc.42.a: "Accept mediation (pressure #G −10#!, progress #R −5#!)"
 oe_hc.42.b: "Refuse: the empire needs no Latin Pope's ruling (progress #G +5#!, pressure #R +5#!)"
 oe_hc.42.t: "Papal Mediation"
 oe_hc.42.d: "From Avignon, the Pope has dispatched a cardinal legate to the imperial camp, offering to mediate a truce between the empire and the embattled French princes. Accepting his good offices would ease the growing strain on our host, yet refusing would make plain that Rome answers to no Latin prelate."
 oe_hc.43.a: "Hold a thanksgiving on the Île de la Cité (prestige, pressure #G −10#!)"
 oe_hc.43.t: "Lutetia"
 oe_hc.43.d: "To the roll of imperial drums, the gates of Paris swing open and Roman troops march onto the bridges of the Seine. When emperors last governed this northern crossing, the town was marked on provincial itineraries as Lutetia; after centuries of separation, imperial banners fly above the heart of Gaul once more."
 oe_hc.51.a: "Accept (progress #G +5#!, pressure #G −5#!, prestige −minor)"
 oe_hc.51.b: "Refuse: the infidel is an enemy too (pressure #R +5#!)"
 oe_hc.51.t: "Envoys from the Marinids"
 oe_hc.51.d: "The Marinid sultan at Fez sends envoys: if the empire recognises his interests on both shores of the Strait, he will cross the sea and keep Castile busy from the south."
 oe_hc.52.a: "Build depots along the river valleys (#Y 200#! gold, pressure #G −5#!)"
 oe_hc.52.b: "Live off the land (progress #G +5#!, pressure #R +5#!)"
 oe_hc.52.t: "The Meseta"
 oe_hc.52.d: "Advancing across the high Castilian Meseta, the legions confront the unforgiving extremes of the Iberian interior—blistering, parched summers and biting highland winters. Every league marched inland stretches our baggage trains thinner across barren tablelands, forcing a choice between costly river depots and harsh requisitioning."
 oe_hc.53.a: "Finish what Justinian began (prestige, progress #G +5#!)"
 oe_hc.53.t: "The Visigothic Capital"
 oe_hc.53.d: "High above the gorge of the Tagus, Toledo has finally lowered its banners and opened its gates to imperial arms. Once the proud capital of the Visigothic kings, this fortress lay beyond the reach even of Justinian's western expeditions; at last the empire completes the reconquest begun centuries ago."
 oe_hc.61.a: "Force the line with heavy cavalry (progress #G +5#!, manpower #R −2#!)"
 oe_hc.61.b: "Advance slowly and entrench (pressure #R +5#!)"
 oe_hc.61.t: "The Longbowmen"
 oe_hc.61.d: "Dark clouds of arrows hiss from the ridges ahead as English longbowmen loose volley after punishing volley from behind sharpened stakes. Their yew bows have bloodied our vanguard and slowed the advance, leaving the generals in heated debate over whether to smash the archers with heavy cavalry or entrench and grind forward."
 oe_hc.62.a: "Hire merchantmen at a premium (#Y 200#! gold, pressure #G −5#!)"
 oe_hc.62.b: "Wait for the wind to drop (pressure #R +10#!)"
 oe_hc.62.t: "Storms in the Channel"
 oe_hc.62.d: "A fierce gale has swept through the Channel, scattering our troop transports and driving supply convoys back into continental harbours. With winds howling across the narrows and vital cargoes of grain, fodder, and munitions stranded on the far shore, the expedition must either charter extra merchantmen at steep rates or wait out the storm."
 oe_hc.63.a: "Rome has returned (great prestige, pressure #G −10#!)"
 oe_hc.63.t: "Londinium"
 oe_hc.63.d: "Along the tidal banks of the Thames, London has fallen into imperial hands and Roman standards rise above its walls. More than nine centuries have passed since the last legions departed Britain; the ancient provincial hub once known as Londinium belongs to the empire once again."
 oe_hc.71.a: "Follow Heraclius and strike deep (progress #G +8#!, pressure #R +10#!)"
 oe_hc.71.b: "Advance steadily (pressure #G −5#!)"
 oe_hc.71.t: "The Precedent of Heraclius"
 oe_hc.71.d: "Studying the eastern campaign maps, veteran commanders recall the daring precedent of Emperor Heraclius, who in 627 crossed the snowbound Zagros into the heart of Persia and shattered his foe in a single decisive stroke. The war council now weighs whether to emulate that bold thrust deep inland or advance with methodical caution."
 oe_hc.72.a: "Accept (#Y 200#! gold, progress #G +5#!, pressure #G −5#!)"
 oe_hc.72.b: "Decline politely"
 oe_hc.72.t: "The Armenians"
 oe_hc.72.d: "Envoys from the noble houses of Armenia have arrived at headquarters offering mountain guides and hardy highland cavalry to aid the eastern campaign. In return for opening the passes and riding beneath imperial standards, the princes ask for a subsidy and a solemn pledge that their ancestral domains will be confirmed after the war."
 oe_hc.73.a: "Review the legions before the ruins of Ctesiphon (great prestige, progress #G +5#!)"
 oe_hc.73.t: "Near Old Ctesiphon"
 oe_hc.73.d: "Baghdad now rests firmly in imperial hands, its gates manned by Roman garrisons along the Tigris. Only a short ride to the south rises the great ruined arch of Ctesiphon, hollow monument to the ancient Sasanian capital; marching before those legendary stones stirs deep pride across every legion."
 oe_hc.81.a: "Hire the Genoese ships (#Y 300#! gold, pressure #G −10#!)"
 oe_hc.81.b: "Requisition their stores (gold #G +200#!, pressure #R +5#!)"
 oe_hc.81.t: "The Genoese Factors"
 oe_hc.81.d: "Factors from the Genoese colony at Caffa have approached our quartermasters, offering their nimble Black Sea merchantmen to haul grain and salted provisions for the army. True to their reputation, the Genoese demand a steep fee, forcing a sharp choice between paying for reliable convoys or simply requisitioning their crowded warehouses."
 oe_hc.82.a: "Send icons and gold (#Y 200#! gold, progress #G +5#!)"
 oe_hc.82.b: "We need not rely on them (pressure #R +5#!)"
 oe_hc.82.t: "The Princes of Rus"
 oe_hc.82.d: "Though vast steppes divide Constantinople from the forests of the north, the Metropolitan of Kiev is still appointed from the Queen of Cities, keeping ancient Orthodox bonds alive. Seeing imperial banners push onto the Pontic plains, several Rus princes quietly offer to coordinate raids and ride alongside Roman troops against our steppe foes."
 oe_hc.83.a: "Reopen the steppe road (prestige, pressure #G −10#!)"
 oe_hc.83.t: "Tanais"
 oe_hc.83.d: "Tana, sentinel port at the mouth of the Don, has yielded to imperial arms. Centuries ago Greek mariners knew this settlement as Tanais, the farthest outpost where Mediterranean galleys met the caravan tracks of the Eurasian steppe; with its wharves secured, the northern trade road lies open once more."
 oe_hc.91.a: "Hire the guides (#Y 300#! gold, pressure #G −10#!)"
 oe_hc.91.b: "Find our own way (progress #G +5#!, manpower #R −2#!)"
 oe_hc.91.t: "Bedouin Guides"
 oe_hc.91.d: "Riders from several Bedouin clans have come to the perimeter of the imperial camp beneath banners of parley. Knowing every hidden well, cistern, and safe track across the burning sands, they offer to guide the legions through the desert for Roman gold—leaving us to pay for safe passage or brave the dunes alone."
 oe_hc.92.a: "Charter ships for the Red Sea (#Y 300#! gold, pressure #G −10#!)"
 oe_hc.92.b: "Keep to the land route (pressure #R +5#!)"
 oe_hc.92.t: "The Red Sea Route"
 oe_hc.92.d: "Confronted by the waterless expanse of the Arabian interior, staff officers and Egyptian port masters urge an amphibious bypass. Rather than bleeding men and horses on exhausting desert marches, they propose chartering Red Sea vessels in Egypt to ferry troops and rations swiftly down the coast."
 oe_hc.93.a: "Protect the city and forbid plunder (stability #G +1#!, progress #G +5#!)"
 oe_hc.93.b: "Enter as conquerors (great prestige, pressure #R +10#!)"
 oe_hc.93.t: "The Holy City"
 oe_hc.93.d: "Imperial columns have broken through the passes of the Hejaz, and the sacred city of Mecca now lies in Roman hands. From the Maghreb to the Indian Ocean, the entire Islamic world watches in breathless tension to see whether the Emperor enforces strict protection over the sanctuary or enters with the fierce pomp of a conqueror."
 oe_hc.100.a: "May God protect Rome"
 oe_hc.100.t: "The Campaign Begins"
 oe_hc.100.d: "The imperial decree has been proclaimed before cheering crowds, trumpets have sounded, and the legions are on the march into contested lands. Throughout this grand campaign, regional progress, strategic gains, and mounting war pressure may be monitored closely within the corresponding theatre of the Roman World panel."
 oe_hc.101.a: "Victory belongs to Rome (great prestige, Imperial Authority #G +15#!, stability #G +1#!)"
 oe_hc.101.t: "A Great Victory"
 oe_hc.101.d: "Shattered across hard-fought fields, the enemy host has collapsed in disorder and fortress after fortress lowers its banners in submission. Imperial eagles stand unchallenged across the contested theatre, sealing an indisputable triumph that echoes through every court from the Atlantic to the Euphrates."
 oe_hc.102.a: "Keep what was won (prestige, Imperial Authority #G +5#!)"
 oe_hc.102.t: "A Negotiated Peace"
 oe_hc.102.d: "After exhausting months of marches, sieges, and skirmishes, both empires have reached the limits of endurance. Envoys have sealed a pragmatic peace in the field: the empire retains the provinces and strongpoints already won by Roman steel, while the weary legions turn homeward to recover."
 oe_hc.103.a: "There will be another day (prestige loss, stability #R −1#!)"
 oe_hc.103.t: "The Campaign Fails"
 oe_hc.103.d: "The army can endure no more and the generals order a retreat. Land already taken stays in imperial hands, but no campaign can be launched here for ten years."
 oe_hc.110.t: "Governing the New Lands"
 oe_hc.110.d: "As the smoke of campaign clears, the newly conquered lands await a lasting framework of imperial rule. Counsellors place distinct paths before the throne: erect a new frontier theme, press forward with direct Romanization, or entrust administration to allies within the Roman league."
 oe_hc.110.a: "Found a theme (#Y 5#! Imperial Authority)"
 oe_hc.110.a.tt: "Founds a theme seated in the largest gained city; every other gained location becomes part of its jurisdiction. Its distance band comes from the distance to Constantinople. The new theme has [Concept('oe_tu_exarchate','exarchate')|e] status and sends a tenth of its monthly income to the treasury."
 oe_hc.110.b: "Romanise (stability #R −1#!)"
 oe_hc.110.b.tt: "Gained locations assimilate and convert faster for #Y 20#! years."
 oe_hc.110.c: "Hand over to the Roman alliance (prestige)"
 oe_hc.110.c.tt: "Creates a Roman-alliance subject with the largest gained city as capital and hands it every other gained location."
 oe_hc.110.e: "There is no gained land to settle"
