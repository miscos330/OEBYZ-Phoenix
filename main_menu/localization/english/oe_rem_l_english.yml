l_english:
 oe_rem_b_bosphorus_accord: "Bosphorus Twin Eagles Straits Accord"
 oe_rem_b_black_sea_rupture: "Black Sea Warm-Water Rupture"
 oe_rem_b_baltic_alarm: "Alarmed by the Neva Baltic Window"
 oe_rem_b_kyakhta_yuan_treaty: "Treaty of Kyakhta: Yuan-Russian Accord"
 oe_rem_b_kyakhta_border_pact: "Kyakhta Far Eastern Trade Compact"
 oe_rem_b_raskol_greek_bond: "Greek Liturgical Revision Bond"
 STATIC_MODIFIER_NAME_oe_rem_romanov_autocracy: "1613 All-Rus' Settlement: Tsarist Autocracy"
 STATIC_MODIFIER_DESC_oe_rem_romanov_autocracy: "The Zemsky Sobor crowns a new autocratic dynasty with firm central control, at the price of tighter civic liberties and steeper stability burdens."
 STATIC_MODIFIER_NAME_oe_rem_novgorod_mercantile_charter: "Novgorod Baltic Grand Mercantile Charter"
 STATIC_MODIFIER_DESC_oe_rem_novgorod_mercantile_charter: "A mercantile charter anchors Baltic-White Sea commerce and republican tenure while loosening central control and levy mobilization."
 STATIC_MODIFIER_NAME_oe_rem_kyiv_federal_compact: "Kyiv-Ruthenia Tripartite Federal Compact"
 STATIC_MODIFIER_DESC_oe_rem_kyiv_federal_compact: "Princes and Cossack hosts ratify a tripartite East Slavic federation, lifting loyalty and diplomacy at the cost of diffuse administration and taxation."
 STATIC_MODIFIER_NAME_oe_rem_sobornoe_serfdom: "Sobornoye Ulozheniye (1649): Enserfment"
 STATIC_MODIFIER_DESC_oe_rem_sobornoe_serfdom: "Binding peasants permanently to service estates secures noble loyalty and deep manpower at the harsh price of lagging institutions and rural misery."
 STATIC_MODIFIER_NAME_oe_rem_free_homesteaders: "Sobornoye Ulozheniye (1649): Free Homesteaders"
 STATIC_MODIFIER_DESC_oe_rem_free_homesteaders: "Curbing enserfment and safeguarding frontier homesteaders strengthens taxation and prosperity while infuriating the service nobility."
 STATIC_MODIFIER_NAME_oe_rem_raskol_nikon_unity: "Patriarch Nikon's Uniform Liturgy"
 STATIC_MODIFIER_DESC_oe_rem_raskol_nikon_unity: "Enforcing Greek-aligned liturgical uniformity bolsters central ecclesiastical authority while sparking Old Believer flight and frontier unrest."
 STATIC_MODIFIER_NAME_oe_rem_raskol_greek_mediation: "Twin Eagles Liturgical Revision"
 STATIC_MODIFIER_DESC_oe_rem_raskol_greek_mediation: "Joint revision by Constantinopolitan Greek scholars and Rus' bishops softens the Raskol and aids scholarship, though die-hard clergy still grumble."
 STATIC_MODIFIER_NAME_oe_rem_raskol_old_believer_frontier: "Old Believer Frontier Toleration"
 STATIC_MODIFIER_DESC_oe_rem_raskol_old_believer_frontier: "Tolerating Old Believer settlements across the Volga and Siberia spurs frontier industry and colonization while weakening central Church authority."
 STATIC_MODIFIER_NAME_oe_rem_petrine_westernization: "Petrine Grand Westernization"
 STATIC_MODIFIER_DESC_oe_rem_petrine_westernization: "Wholesale military, naval, and bureaucratic westernization propels discipline, research, and institutions forward at fierce clerical, noble, and fiscal cost."
 STATIC_MODIFIER_NAME_oe_rem_moderate_modernization: "Measured Westernization & New-Order Regiments"
 STATIC_MODIFIER_DESC_oe_rem_moderate_modernization: "Selective adoption of European gunnery and shipbuilding avoids domestic upheaval at the cost of modest fiscal drag and slower modernization."
 STATIC_MODIFIER_NAME_oe_rem_streltsy_crushed: "Streltsy Mutiny Crushed"
 STATIC_MODIFIER_DESC_oe_rem_streltsy_crushed: "New-order guards crush the mutinous Streltsy and break conservative resistance, cementing crown power while scarring manpower and domestic prosperity."
 STATIC_MODIFIER_NAME_oe_rem_streltsy_compromise: "Streltsy Compromise: Westernization Checked"
 STATIC_MODIFIER_DESC_oe_rem_streltsy_compromise: "Conceding to the Streltsy and traditional estates restores domestic calm at the heavy price of stalled westernization, lower discipline, and sluggish research."
 STATIC_MODIFIER_NAME_oe_rem_neva_baltic_window: "Window on Europe: The Neva Estuary"
 STATIC_MODIFIER_DESC_oe_rem_neva_baltic_window: "Building a grand Baltic port and shipyard on the Neva surges trade and maritime presence while inflating naval upkeep and alarming northern rivals."
 STATIC_MODIFIER_NAME_oe_rem_baltic_admiralty_push: "Northern Imperial Admiralty Program"
 STATIC_MODIFIER_DESC_oe_rem_baltic_admiralty_push: "Channeling timber, hemp, and silver into a permanent northern fleet boosts naval morale and shipbuilding at steep maintenance and fiscal expense."
 STATIC_MODIFIER_NAME_oe_rem_bosphorus_accord_mod: "Bosphorus Twin Eagles Straits Concord"
 STATIC_MODIFIER_DESC_oe_rem_bosphorus_accord_mod: "A bilateral straits compact with a living New Rome opens Mediterranean trade and boosts naval standing, trading imperial prestige for lasting peace."
 STATIC_MODIFIER_NAME_oe_rem_black_sea_rupture_mod: "Southern Imperial Manifesto: Black Sea Rivalry"
 STATIC_MODIFIER_DESC_oe_rem_black_sea_rupture_mod: "Challenging New Rome for Black Sea warm-water mastery fires imperial prestige, naval zeal, and siegecraft while straining fleet budgets and diplomacy."
 STATIC_MODIFIER_NAME_oe_rem_southern_liberation_mod: "Liberation of the Black Sea Steppe"
 STATIC_MODIFIER_DESC_oe_rem_southern_liberation_mod: "Marching south toward Tana and Kaffa lifts land morale, naval resolve, and siegecraft at the cost of heavier army upkeep and war weariness."
 STATIC_MODIFIER_NAME_oe_rem_pacific_yasak_push: "Okhotsk & Kamchatka Fur Push"
 STATIC_MODIFIER_DESC_oe_rem_pacific_yasak_push: "Pushing past the Lena to the Okhotsk coast and Kamchatka extends colonial reach and fur exports while stretching central control and fiscal overhead."
 STATIC_MODIFIER_NAME_oe_rem_kyakhta_yuan_trade: "Kyakhta Yuan-Russian Caravan Trade"
 STATIC_MODIFIER_DESC_oe_rem_kyakhta_yuan_trade: "Equal-status caravan charters with a restored Mongol Yuan trade Siberian sables for Chinese tea and silk, lifting commerce and diplomacy with mild frontier upkeep."
 STATIC_MODIFIER_NAME_oe_rem_kyakhta_eastern_trade: "Kyakhta Far Eastern Trade Port"
 STATIC_MODIFIER_DESC_oe_rem_kyakhta_eastern_trade: "Channeling Far Eastern caravans through Kyakhta expands trade revenue and merchant capacity while adding remote administrative drag."
 STATIC_MODIFIER_NAME_oe_rem_kyakhta_yuan_partner: "Kyakhta Northern Frontier Accord"
 STATIC_MODIFIER_DESC_oe_rem_kyakhta_yuan_partner: "Demarcating the northern frontier with Russia at Kyakhta secures border defenses and caravan revenue at modest cabinet overhead."
 STATIC_MODIFIER_NAME_oe_rem_russian_american_co: "Russian-American Pacific Fur Company"
 STATIC_MODIFIER_DESC_oe_rem_russian_american_co: "A chartered Pacific fur company spans Bering Island toward Alaska, expanding trade range and colonization at heavy naval upkeep and treasury subsidies."
 STATIC_MODIFIER_NAME_oe_rem_eurasian_consolidation: "Eurasian Heartland Consolidation"
 STATIC_MODIFIER_DESC_oe_rem_eurasian_consolidation: "Halting costly trans-Pacific ventures channels resources into domestic taxation, control, and stability at the expense of overseas reach."
 STATIC_MODIFIER_NAME_oe_rem_table_of_ranks_mod: "The Table of Ranks"
 STATIC_MODIFIER_DESC_oe_rem_table_of_ranks_mod: "Replacing aristocratic birthright with a fourteen-grade merit hierarchy boosts cabinet efficiency, discipline, and literacy while alienating hereditary nobles."
 STATIC_MODIFIER_NAME_oe_rem_holy_synod_mod: "The Most Holy Governing Synod"
 STATIC_MODIFIER_DESC_oe_rem_holy_synod_mod: "Subordinating Church administration to a crown-appointed Synod raises crown power, taxes, and learning while provoking clerical resentment."
 STATIC_MODIFIER_NAME_oe_rem_pacific_charter_mod: "Pacific Fur & Seal Charter"
 STATIC_MODIFIER_DESC_oe_rem_pacific_charter_mod: "Chartered vessels harvest sea otter and sable pelts across Okhotsk and Bering waters, raising trade power and reach while straining fleet upkeep."
 STATIC_MODIFIER_NAME_oe_rem_neva_admiralty_loc: "Neva Imperial Admiralty & New Port"
 STATIC_MODIFIER_DESC_oe_rem_neva_admiralty_loc: "Drydocks, bastions, and customs quays on the Neva anchor Russia's maritime gateway to the Baltic and Europe."
 STATIC_MODIFIER_NAME_oe_rem_black_sea_fleet_loc: "Black Sea Warm-Water Naval Base"
 STATIC_MODIFIER_DESC_oe_rem_black_sea_fleet_loc: "Modern drydocks and coastal batteries on the northern Black Sea speed fleet construction and fortify warm-water harbors."
 STATIC_MODIFIER_NAME_oe_rem_kyakhta_emporium_loc: "Kyakhta Caravan Emporium"
 STATIC_MODIFIER_DESC_oe_rem_kyakhta_emporium_loc: "Designated border customs and caravan depots south of Lake Baikal turn Kyakhta into a thriving Eurasian mart."
 STATIC_MODIFIER_NAME_oe_rem_pacific_port_loc: "North Pacific Expedition Harbor"
 STATIC_MODIFIER_DESC_oe_rem_pacific_port_loc: "A rugged timber shipyard and fur depot on the icy Pacific rim supplies voyages toward Bering Island and Alaska."
 oe_rem_dec_table_of_ranks.title: "Promulgate the Table of Ranks"
 oe_rem_dec_table_of_ranks.desc: "Replace hereditary aristocratic precedence with a fourteen-grade merit hierarchy across military and civil service, boosting state efficiency at the cost of noble resentment."
 oe_rem_dec_table_of_ranks.a: "Enact the Table of Ranks by merit"
 oe_rem_dec_holy_synod.title: "Establish the Most Holy Governing Synod"
 oe_rem_dec_holy_synod.desc: "Place Church administration under a crown-appointed Governing Synod, bolstering crown power and tax receipts while provoking sharp clerical anger."
 oe_rem_dec_holy_synod.a: "Charter the Holy Synod under crown oversight"
 oe_rem_dec_neva_admiralty.title: "Found the Neva Admiralty & Baltic Fleet"
 oe_rem_dec_neva_admiralty.desc: "Raise drydocks, coastal batteries, and naval barracks at the Neva estuary to forge a permanent Baltic Fleet."
 oe_rem_dec_neva_admiralty.a: "Fund the Neva Admiralty and Baltic shipyards"
 oe_rem_dec_pacific_charter.title: "Charter the Pacific Fur Syndicate"
 oe_rem_dec_pacific_charter.desc: "Finance Siberian and Far Eastern fur fleets operating across Okhotsk, Kamchatka, and Bering Island to extend North Pacific commerce."
 oe_rem_dec_pacific_charter.a: "Seal a fifteen-year Pacific fur charter"
 oe_rem.1.t: "The 1613 Settlement of All Rus'"
 oe_rem.1.d: "As the shadows of late-sixteenth-century turmoil lift, All Rus' stands ready to settle its early modern constitution. Delegates of the Zemsky Sobor in Moscow, mercantile syndicates from Novgorod, and princely-Cossack envoys from Kyiv and Smolensk each press their vision for the coming century.\n\nBuilding on our realm's historic path, we must anchor the new era in Tsarist autocracy, a Baltic-White Sea mercantile charter, or a tripartite East Slavic federation."
 oe_rem.1.a: "Crown a new dynasty via the Zemsky Sobor under Tsarist autocracy"
 oe_rem.1.a.tt: "Costs #R 100 gold#!, Legitimacy #G +12#! (extra Stability #G +4#! if Rus' Phase 2 is complete); gain [ShowModifier('oe_rem_romanov_autocracy')] for #Y 30 years#!."
 oe_rem.1.b: "Enact the Novgorod Baltic Grand Mercantile Charter"
 oe_rem.1.b.tt: "Costs #R 100 gold#!, Prestige #G +10#! (extra Stability #G +4#! if Rus' Phase 2 is complete); gain [ShowModifier('oe_rem_novgorod_mercantile_charter')] for #Y 30 years#!."
 oe_rem.1.c: "Ratify the Kyiv-Ruthenia Tripartite Federal Compact"
 oe_rem.1.c.tt: "Costs #R 100 gold#!, Stability #G +5#! (extra Stability #G +4#! if Rus' Phase 2 is complete); gain [ShowModifier('oe_rem_kyiv_federal_compact')] for #Y 30 years#!."
 oe_rem.2.t: "Sobornoye Ulozheniye (1649): Serfdom or Free Settlers"
 oe_rem.2.d: "Following tax riots and border wars, jurists present the comprehensive Sobornoye Ulozheniye law code. Service nobles demand abolishing all time limits on recovering runaway peasants—locking the countryside into hereditary serfdom to guarantee army levies—while town guilds and frontier officials warn that full enserfment will choke commerce and eastern settlement."
 oe_rem.2.a: "Enforce hereditary serfdom to secure noble loyalty and deep manpower"
 oe_rem.2.a.tt: "Stability #R −3#!, Nobles gain satisfaction while Peasants lose sharply; gain [ShowModifier('oe_rem_sobornoe_serfdom')] for #Y 35 years#!."
 oe_rem.2.b: "Curb enserfment and protect free frontier homesteaders"
 oe_rem.2.b.tt: "Costs #R 120 gold#!, Nobles lose satisfaction while Peasants gain slightly; gain [ShowModifier('oe_rem_free_homesteaders')] for #Y 35 years#!."
 oe_rem.3.t: "Patriarch Nikon's Reforms and the Great Raskol"
 oe_rem.3.d: "Patriarch Nikon decrees that all Rus' liturgical books and rites be corrected against Greek originals—mandating three fingers rather than two for the sign of the cross. Archpriest Avvakum and countless Old Believers denounce the reforms as heresy, igniting resistance from the Volga forests to White Sea monasteries.\n\nThe crown must weigh uniform ecclesiastical authority against frontier peace—or, if Constantinople still stands in Twin Eagles communion, invite Greek scholars to mediate the revision."
 oe_rem.3.a: "Back Patriarch Nikon's strict liturgical uniformity"
 oe_rem.3.a.tt: "Stability #R −4#!, Religious Influence #G +15#!, Traditionalist Unrest #R +30#!; gain [ShowModifier('oe_rem_raskol_nikon_unity')] for #Y 30 years#!."
 oe_rem.3.b: "Quietly tolerate Old Believer settlements on the Volga and Siberian frontier"
 oe_rem.3.b.tt: "Religious Influence #R −15#!, Traditionalist Unrest #R +10#!; gain [ShowModifier('oe_rem_raskol_old_believer_frontier')] for #Y 30 years#!."
 oe_rem.3.c: "Invite Greek scholars from Constantinople for a joint Twin Eagles revision"
 oe_rem.3.c.tt: "Costs #R 120 gold#!, Religious Influence #G +10#!, Traditionalist Unrest only #R +15#!, improves opinion with New Rome; gain [ShowModifier('oe_rem_raskol_greek_mediation')] for #Y 30 years#!."
 oe_rem.4.t: "The Grand Embassy and Petrine Westernization"
 oe_rem.4.d: "In the Age of Absolutism, Western line infantry, ships of the line, artillery foundries, and academies outclass traditional levies and matchlock Streltsy. Returning from a Grand Embassy with Dutch shipwrights, German gunners, and modern treatises, the throne confronts a decisive transformation.\n\nWholesale Petrine westernization demands heavy gold and provokes fierce clerical and noble backlash—risking a Streltsy mutiny—while cautious reform spares stability at a lower ceiling."
 oe_rem.4.a: "Unleash full Petrine Westernization across army, fleet, and court!"
 oe_rem.4.a.tt: "Costs #R 350 gold#!, Stability #R −6#!, steep Clergy & Nobles anger, Traditionalist Unrest #R +45#! (risks Streltsy mutiny!); sets #bold #color_yellow Petrine Westernization flag#!#! and grants [ShowModifier('oe_rem_petrine_westernization')] for #Y 35 years#!."
 oe_rem.4.b: "Adopt European gunnery and shipyards gradually without breaking custom"
 oe_rem.4.b.tt: "Costs #R 180 gold#!, Stability #R −2#!, Traditionalist Unrest #R +15#!; gain [ShowModifier('oe_rem_moderate_modernization')] for #Y 30 years#! (does not set full Petrine flag)."
 oe_rem.5.t: "Fires on Red Square: The Streltsy Mutiny"
 oe_rem.5.d: "Relentless westernizing decrees, foreign officers, and curbs on traditional privilege have ignited a storm. Hereditary Streltsy regiments rally with aggrieved boyars and conservative monks outside the Kremlin, raising ancient banners to demand the expulsion of foreign advisors and the restoration of old custom.\n\nWill we send the new-order guards to crush the mutiny in blood and preserve full westernization, or compromise and roll back the reforms?"
 oe_rem.5.a: "Send the new-order guards to crush the Streltsy and disband them forever"
 oe_rem.5.a.tt: "Costs #R 200 gold#!, Stability #R −6#!, Manpower #R −3#!, preserves the #bold #color_yellow Petrine Westernization flag#!#!; gain [ShowModifier('oe_rem_streltsy_crushed')] for #Y 20 years#!."
 oe_rem.5.b: "Compromise with the Streltsy and traditionalists, halting radical reform"
 oe_rem.5.b.tt: "Stability #G +6#!, Nobles & Clergy placated, but revokes [ShowModifier('oe_rem_petrine_westernization')] and the full Petrine flag; suffer [ShowModifier('oe_rem_streltsy_compromise')] for #Y 25 years#!."
 oe_rem.6.t: "Window on Europe: The Neva Estuary"
 oe_rem.6.d: "Cold Baltic tides wash the shores of the Neva estuary, Oreshek, Narva, and Riga. Long confined to icebound Arkhangelsk on the White Sea, our realm now looks straight into the maritime heart of Europe.\n\nRaising an Admiralty and shipyard on the Baltic coast demands vast gold and manpower and will alarm Sweden and Poland-Lithuania—and if we directly hold the Neva estuary, we may even proclaim a brand-new imperial capital upon the sea."
 oe_rem.6.a: "Build the Baltic Imperial Admiralty and open our Window on Europe"
 oe_rem.6.a.tt: "Costs #R 300 gold#!, Manpower #R −2#!, Navy Tradition #G +10#!, upgrades Neva/Baltic port and alarms Sweden/Poland-Lithuania (#R −40#! opinion); gain [ShowModifier('oe_rem_neva_baltic_window')] for #Y 35 years#!."
 oe_rem.6.b: "Move the capital to the Neva Estuary and raise a Baltic imperial city!"
 oe_rem.6.b.tt: "Moves capital to #bold #color_yellow Neva#!#!, costs #R 350 gold#!, Stability #R −5#!, Manpower #R −3#!, Prestige #G +20#!; builds [ShowModifier('oe_rem_neva_admiralty_loc')] and grants [ShowModifier('oe_rem_neva_baltic_window')] for #Y 40 years#!."
 oe_rem.6.c: "Fortify Arkhangelsk and expand our northern fleet with restraint"
 oe_rem.6.c.tt: "Costs #R 120 gold#!, Navy Tradition #G +8#!; gain [ShowModifier('oe_rem_baltic_admiralty_push')] for #Y 25 years#!."
 oe_rem.7.t: "The Black Sea Question: Twin Eagles Accord or Warm-Water Rivalry"
 oe_rem.7.d: "Tana at the Don's mouth, Kaffa in Crimea, and the distant Bosphorus have long beckoned Russia toward warm southern seas. Yet if a living New Rome still holds Constantinople and the Black Sea, seizing warm-water ports by force will shatter the brotherhood of the Twin Eagles—unless both empires sign a Bosphorus Straits Accord.\n\nShould New Rome have fallen, however, marching south to liberate the Black Sea shore and build a southern fleet stands unchallenged."
 oe_rem.7.a: "Push south for Black Sea warm-water mastery (rupturing with New Rome if it holds the Straits!)"
 oe_rem.7.a.tt: "If #bold #color_yellow New Rome#!#! holds the Black Sea/Straits: costs #R 250 gold#!, #R −80#! bilateral rupture, grants [ShowModifier('oe_rem_black_sea_rupture_mod')]; otherwise launches Black Sea liberation (#R 220 gold#!, [ShowModifier('oe_rem_southern_liberation_mod')]), each for #Y 35 years#!."
 oe_rem.7.b: "Sign the Bosphorus Twin Eagles Straits Accord with New Rome"
 oe_rem.7.b.tt: "Costs #R 150 gold#!, Prestige #R −10#!, bilateral #G +55#! opinion with New Rome (extra Stability #G +5#! under Twin Eagles legacy); both gain [ShowModifier('oe_rem_bosphorus_accord_mod')] for #Y 35 years#!."
 oe_rem.7.c: "Consolidate Astrakhan and the Volga-Caspian network, deferring a Black Sea clash"
 oe_rem.7.c.tt: "Costs #R 100 gold#!, Stability #G +4#!, fortifies southern dockyards; gain [ShowModifier('oe_rem_baltic_admiralty_push')] for #Y 20 years#!."
 oe_rem.8.t: "Beyond the Lena: Okhotsk Coast and Kamchatka"
 oe_rem.8.d: "From Tobolsk and Tomsk to Irkutsk beside Lake Baikal, Cossack explorers and fur trappers have pushed steadily across frozen rivers. Dispatches now reach the capital: advance parties have crossed the Lena divide to sight the Okhotsk coast (Okam) and the volcanoes of Kamchatka.\n\nThe Pacific rim lies within reach, though supplying outposts across an entire continent will test imperial control and coffers."
 oe_rem.8.a: "Establish Yasak fur tribute and North Pacific ports at Okam and Kamchatka!"
 oe_rem.8.a.tt: "Costs #R 200 gold#! (extra Prestige #G +8#! if Phase 2 Siberia push was taken), builds [ShowModifier('oe_rem_pacific_port_loc')]; gain [ShowModifier('oe_rem_pacific_yasak_push')] for #Y 35 years#!."
 oe_rem.8.b: "Consolidate river roads from Tobolsk to Irkutsk before pushing farther east"
 oe_rem.8.b.tt: "Costs #R 120 gold#!, Stability #G +4#!; gain [ShowModifier('oe_rem_kyakhta_eastern_trade')] for #Y 25 years#!."
 oe_rem.9.t: "The Treaty of Kyakhta: Demarcating the Far East"
 oe_rem.9.d: "On the steppe south of Lake Baikal at Kyakhta, Russian envoys face the border commissioners of the Middle Kingdom. Should the restored Mongol Yuan still hold Dadu, history completes an astonishing circle: the realm that once threw off the Golden Horde now negotiates as an equal empire with Genghis Khan's heirs.\n\nWhether facing a restored Yuan, Ming, or Manchu throne, demarcating the frontier and opening Kyakhta's tea-and-fur caravans will reshape northern Eurasia."
 oe_rem.9.a: "Open the Kyakhta Far Eastern caravan emporium and settle the border"
 oe_rem.9.a.tt: "Costs #R 140 gold#!, improves relations with the Eastern empire (#G +35#! opinion), builds [ShowModifier('oe_rem_kyakhta_emporium_loc')]; gain [ShowModifier('oe_rem_kyakhta_eastern_trade')] for #Y 35 years#!."
 oe_rem.9.b: "Sign the Treaty of Kyakhta with the Restored Mongol Yuan as equal empires!"
 oe_rem.9.b.tt: "Costs #R 150 gold#!, Prestige #G +10#!, bilateral #G +45#! opinion with Restored Yuan (boosting its border defense & Chao trust), builds [ShowModifier('oe_rem_kyakhta_emporium_loc')]; gain [ShowModifier('oe_rem_kyakhta_yuan_trade')] for #Y 35 years#!."
 oe_rem.9.c: "Reinforce Baikal and Irkutsk Cossack garrisons without territorial concessions"
 oe_rem.9.c.tt: "Costs #R 120 gold#!, Army Tradition #G +10#!; gain [ShowModifier('oe_rem_eurasian_consolidation')] for #Y 25 years#!."
 oe_rem.10.t: "Bering Strait and the Russian-American Company"
 oe_rem.10.d: "Sailing from Kamchatka past fog-shrouded Bering Island toward the Aleutians, imperial explorers confirm that only a narrow strait separates Eurasia from North America. Drawn by rich sea-otter pelts, Siberian merchant houses petition for a royal charter to establish the Russian-American Company across Alaska.\n\nAt the climax of our early modern saga, shall we charter a trans-Pacific fur empire, or turn our silver inward to consolidate the Eurasian heartland?"
 oe_rem.10.a: "Charter the Russian-American Company across Bering Island to Alaska!"
 oe_rem.10.a.tt: "Completes the Russian Early Modern line, costs #R 250 gold#!, Prestige #G +15#!, upgrades Pacific harbor; gain [ShowModifier('oe_rem_russian_american_co')] for #Y 40 years#!."
 oe_rem.10.b: "Halt at Kamchatka and redirect maritime subsidies into Eurasian consolidation"
 oe_rem.10.b.tt: "Completes the Russian Early Modern line, costs #R 100 gold#!, Stability #G +6#!; gain [ShowModifier('oe_rem_eurasian_consolidation')] for #Y 40 years#!."
 oe_rem.20.t: "Russian Empire Early Modern: Choice Takes Effect"
 oe_rem.90.t: "Early Modern Russian Empire: Status Ledger"
 oe_rem.90.d: "#T Dynasty & Church#!\nP1 path [ROOT.GetCountry.MakeScope.ScriptValue('oe_rem_rd_p1_path')|0]  1613 path [ROOT.GetCountry.MakeScope.ScriptValue('oe_rem_rd_dyn')|0]  1649 law [ROOT.GetCountry.MakeScope.ScriptValue('oe_rem_rd_serf')|0]  Raskol [ROOT.GetCountry.MakeScope.ScriptValue('oe_rem_rd_raskol')|0]\n#T Westernization & Seas#!\nPeter flag [ROOT.GetCountry.MakeScope.ScriptValue('oe_rem_rd_peter')|0]  Trad unrest [ROOT.GetCountry.MakeScope.ScriptValue('oe_rem_rd_unrest')|0]  Streltsy [ROOT.GetCountry.MakeScope.ScriptValue('oe_rem_rd_streltsy')|0]  Baltic [ROOT.GetCountry.MakeScope.ScriptValue('oe_rem_rd_baltic')|0]  Black Sea [ROOT.GetCountry.MakeScope.ScriptValue('oe_rem_rd_blacksea')|0]\n#T Far East & Slot 60#!\nPacific [ROOT.GetCountry.MakeScope.ScriptValue('oe_rem_rd_pacific')|0]  Kyakhta [ROOT.GetCountry.MakeScope.ScriptValue('oe_rem_rd_kyakhta')|0]  Done [ROOT.GetCountry.MakeScope.ScriptValue('oe_rem_rd_done')|0]  month [ROOT.GetCountry.MakeScope.ScriptValue('oe_rem_rd_m')|0]  end [ROOT.GetCountry.MakeScope.ScriptValue('oe_rem_rd_end')|0]  sent [ROOT.GetCountry.MakeScope.ScriptValue('oe_rem_rd_cnt')|0]\n(end: 0 running, 1 line complete, 3 past 1805, 8 no eligible Rus' host)"
 oe_rem.90.a: "Close"
 oe_rem.90.b: "Refresh"
