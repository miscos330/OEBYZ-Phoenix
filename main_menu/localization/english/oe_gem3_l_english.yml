# NEW 2026-11-23 v19.5 Renaissance Republics & Alpine Bastions — Module 19.5-C: Florence & Old Swiss Confederacy Localization (english) (oe_gem3_, 0 mainline slots, 0 rules, 0 vanilla overrides). Generated by gen_v195_flo_swi.py; edit the generator, not this file.
 oe_gem3_flo_black_bands:0 "Florentine Black Bands"
 oe_gem3_flo_black_bands_desc:0 "Disciplined Tuscan pike-and-shot heavy infantry forged in the mold of Giovanni dalle Bande Nere, blending civic artillery drill, steel breastplates, and fierce battlefield cohesion across Italian hills and river crossings."
 oe_gem3_swi_reislaufer_pikemen:0 "Swiss Reislaufer Pike Square"
 oe_gem3_swi_reislaufer_pikemen_desc:0 "Formidable Alpine heavy infantry squares armed with ash-wood pikes and steel halberds, trained from youth in cantonal musters to smash feudal cavalry charges and turn every mountain pass into an impenetrable fortress."
 oe_gem3_dec_medici_bank_charter.title:0 "Grant the Medici Bank Charter"
 oe_gem3_dec_medici_bank_charter.desc:0 "Charter a network of double-entry Florentine banking houses with papal clearing privileges and continental bills of exchange—available once Banking reaches Florence or from #Y 1397#! onward."
 oe_gem3_dec_medici_bank_charter.a:0 "Seal the Medici Bank Charter in the Signoria"
 oe_gem3_dec_tagsatzung_neutrality.title:0 "Proclaim Tagsatzung Armed Neutrality"
 oe_gem3_dec_tagsatzung_neutrality.desc:0 "Following the hard lessons of Alpine wars, bind the cantonal estates in the Tagsatzung to perpetual armed neutrality: abstain from foreign dynastic entanglements while turning every mountain valley into an unassailable fortress (available from #Y 1515#! onward)."
 oe_gem3_dec_tagsatzung_neutrality.a:0 "Ratify the Perpetual Armed Neutrality Compact"
 STATIC_MODIFIER_NAME_oe_gem3_mod_medici_bank_charter:0 "Medici Bank Charter"
 STATIC_MODIFIER_DESC_oe_gem3_mod_medici_bank_charter:0 "Double-entry ledgers, papal clearing privileges, and continental branch networks anchor Florence at the apex of European finance."
 STATIC_MODIFIER_NAME_oe_gem3_mod_tagsatzung_neutrality:0 "Tagsatzung Armed Neutrality Compact"
 STATIC_MODIFIER_DESC_oe_gem3_mod_tagsatzung_neutrality:0 "Perpetual armed neutrality deters foreign invasions across fortified Alpine passes while earning diplomatic respect throughout Europe."
 STATIC_MODIFIER_NAME_oe_gem3_msn_flo_m1:0 "Medici Continental Banking Network"
 STATIC_MODIFIER_DESC_oe_gem3_msn_flo_m1:0 "Florentine branches in Rome, Venice, Lyon, and Bruges channel credit and bullion back to the Arno."
 STATIC_MODIFIER_NAME_oe_gem3_msn_flo_m2:0 "Machiavellian Ordinance & Black Bands"
 STATIC_MODIFIER_DESC_oe_gem3_msn_flo_m2:0 "A loyal Tuscan citizen levy paired with elite Black Band pike-and-shot companies replaces fickle condottieri."
 STATIC_MODIFIER_NAME_oe_gem3_msn_flo_m3:0 "Florentine Council of Humanists"
 STATIC_MODIFIER_DESC_oe_gem3_msn_flo_m3:0 "Byzantine scholars, Greek manuscripts, and Tuscan academies make Florence the intellectual beacon of Christendom."
 STATIC_MODIFIER_NAME_oe_gem3_msn_flo_m4:0 "Cradle of the Renaissance"
 STATIC_MODIFIER_DESC_oe_gem3_msn_flo_m4:0 "Master of Tuscany, Europe's premier clearinghouse, and patron of immortal art, Florence shines across the centuries."
 STATIC_MODIFIER_NAME_oe_gem3_msn_swi_m1:0 "Reislaufer Cantonal Discipline"
 STATIC_MODIFIER_DESC_oe_gem3_msn_swi_m1:0 "Feared from Burgundy to Lombardy, Confederate pike squares combine lethal shock with iron cantonal solidarity."
 STATIC_MODIFIER_NAME_oe_gem3_msn_swi_m2:0 "Transalpine Confederate Passes"
 STATIC_MODIFIER_DESC_oe_gem3_msn_swi_m2:0 "Holding both northern and southern Alpine approaches secures Confederate trade corridors and strategic depth."
 STATIC_MODIFIER_NAME_oe_gem3_msn_swi_m3:0 "Alpine Reformation Sanctuary"
 STATIC_MODIFIER_DESC_oe_gem3_msn_swi_m3:0 "Cantonal confessional peace and flourishing presses draw Europe's finest scholars, printers, and watchmakers to Switzerland."
 STATIC_MODIFIER_NAME_oe_gem3_msn_swi_m4:0 "Fortress Alps & Eternal Neutrality"
 STATIC_MODIFIER_DESC_oe_gem3_msn_swi_m4:0 "Impregnable mountain redoubts, disciplined citizen armies, and trusted financial vaults make the Swiss Confederacy inviolable."
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev1_a:0 "Ciompi Artisan Guild Accord"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev1_a:0 "Recognizing wool-carder guilds boosts urban output and calms Florentine workshop unrest."
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev1_b:0 "Signoria Major-Guild Settlement"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev1_b:0 "Restoring the primacy of Florence's seven major guilds safeguards patrician credit and fiscal discipline."
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev2_a:0 "Medici Continental Clearing"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev2_a:0 "Bills of exchange drawn on Florence circulate from Rome to Bruges at unmatched credit terms."
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev2_b:0 "Medici Industrial Patronage"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev2_b:0 "Florentine banking surpluses finance high-value silk looms and Tuscan commercial workshops."
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev3_a:0 "Florentine Consuls of the Sea"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev3_a:0 "State-chartered Tuscan galleys carry fine cloth directly across the Mediterranean without paying Genoese tolls."
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev3_b:0 "Arno-Tyrrhenian Customs Hub"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev3_b:0 "Lowered freight charges along the Arno bind inland artisans directly to maritime markets."
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev4_a:0 "Brunelleschi's Cupola Engineering"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev4_a:0 "Innovative hoists, brick geometry, and civic pride make Florence the engineering marvel of Christendom."
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev4_b:0 "Florentine Perspective Workshops"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev4_b:0 "Linear perspective and mathematical drafting transform painting, sculpture, and military surveying alike."
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev5_a:0 "Hellenic Humanist Revival"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev5_a:0 "Greek scholars and newly translated classical treatises ignite a scholarly golden age in Florence."
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev5_b:0 "Prestige of the Florentine Council"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev5_b:0 "Hosting East and West beneath the Duomo elevates Florence's standing in every royal chancery."
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev6_a:0 "Laurentian Golden Age"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev6_a:0 "Masterpieces of Renaissance painting, sculpture, and Neoplatonic letters radiate Florentine prestige across Europe."
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev6_b:0 "Medici Balance of Italy"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev6_b:0 "Deft Florentine envoys restrain rival Italian leagues and preserve peace along the Arno."
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev7_a:0 "Defense of the Florentine Arts"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev7_a:0 "Protecting workshops and scholars against iconoclasm keeps the Renaissance flame burning bright."
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev7_b:0 "Great Council Civic Austerity"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev7_b:0 "Broadening the Consiglio Grande reins in corruption and steels public morale during turbulent years."
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev8_a:0 "Florentine Black Band Drill"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev8_a:0 "Citizens and veterans armed with pikes and arquebuses defend Tuscany with fierce modern discipline."
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev8_b:0 "Tuscan Trace Italienne Bastions"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev8_b:0 "Low angled brick ramparts designed by Florentine engineers blunt invading siege artillery."
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev9_a:0 "Spirit of Sempach"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev9_a:0 "Fearless Confederate columns charge straight through noble lances with unwavering resolve."
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev9_b:0 "Sempacherbrief Field Articles"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev9_b:0 "Sworn articles forbid plundering before victory and bind every canton to hold ranks to the end."
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev10_a:0 "Gotthard Pass Customs Charter"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev10_a:0 "Predictable transit tolls and safe alpine hospices enrich the Confederate treasury year-round."
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev10_b:0 "Gotthard Granite Gateways"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev10_b:0 "Garrisoned stone bridges and avalanche-swept defiles trap any foreign column attempting the pass."
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev11_a:0 "Confederate Common Bailiwicks"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev11_a:0 "Rotating cantonal bailiffs collect steady revenues while tying the Eight Cantons into shared governance."
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev11_b:0 "Mittelland Civic Charters"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev11_b:0 "Honoring municipal liberties turns newly secured plateau towns into staunch defenders of the Confederacy."
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev12_a:0 "Victors of Grandson & Murten"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev12_a:0 "Captured Burgundian artillery and invincible pike wedges announce Switzerland as Europe's supreme infantry power."
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev12_b:0 "Burgundian Booty Treasury"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev12_b:0 "Tapestries, gold plate, and ransoms fund new town halls, arsenals, and granaries across the cantons."
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev13_a:0 "Cantonal Reislaufer Pensions"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev13_a:0 "Foreign military subsidies flow straight into cantonal treasuries while veterans return with unmatched experience."
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev13_b:0 "Home-Guard Pike Regiments"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev13_b:0 "Restricting foreign enlistment preserves a formidable standing core of seasoned mountain pikemen."
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev14_a:0 "Confederate Confessional Concord"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev14_a:0 "Allowing each canton to govern its own parish keeps the federal bond unbroken through Europe's wars of religion."
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev14_b:0 "Alpine Printing & Scholarship Haven"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev14_b:0 "Basel, Zurich, and Geneva flourish as vibrant presses of theology, medicine, and natural philosophy."
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev15_a:0 "Tagsatzung Defensionale Compact"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev15_a:0 "Coordinated cantonal warning beacons and mountain garrisons deter every great-power incursion."
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev15_b:0 "Honest Broker of the Alps"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev15_b:0 "Rival sovereigns respect Swiss neutrality, entrusting envoys and treaties to Confederate cities."
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev16_a:0 "Swiss Precision Horology"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev16_a:0 "Masterpiece timepieces and optical instruments fetch extraordinary prices from London to Constantinople."
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev16_b:0 "Alpine Vaults of Trust"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev16_b:0 "European merchants and princes alike shelter bullion behind neutral Swiss walls and ironclad credit."
 oe_msn_flo_destiny:0 "#bold #color_yellow Republic of Florence: Cradle of the Renaissance#!#!"
 oe_msn_flo_destiny_DESCRIPTION:0 "From the Arte della Lana Guilds and Medici Banking Network to Tuscan Unification, Brunelleschi's Duomo, and the Cradle of the Renaissance"
 oe_msn_flo_destiny_CRITERIA_DESCRIPTION:0 "Anchor the Signoria and Gold Florin, chart the Medici banking empire, unite Pisa and Siena under citizen arms, and crown Florence with Renaissance scholarship and art."
 oe_msn_flo_destiny_BUTTON_TOOLTIP:0 "Embark on the Republic of Florence Destiny"
 oe_msn_flo_destiny_BUTTON_DETAILS:0 "A twelve-task three-pillar destiny for Florence and Tuscany: build the Gold Florin standard and Medici continental clearinghouse; secure Pisa, Livorno, Siena, and Machiavelli's Black Bands; and erect Brunelleschi's Duomo, the Council of Florence, and the Platonic Academy."
 oe_msn_swi_destiny:0 "#bold #color_yellow Old Swiss Confederacy: Fortress of the Alps#!#!"
 oe_msn_swi_destiny_DESCRIPTION:0 "From the Eternal Pact of the Forest Cantons and Gotthard Tollways to Sempach Halberds, Reislaufer Discipline, and Armed Neutrality"
 oe_msn_swi_destiny_CRITERIA_DESCRIPTION:0 "Unite the Forest Cantons with Bern and Zurich, command the Gotthard and Alpine passes, hone Reislaufer pike discipline, and forge an inviolable neutral sanctuary."
 oe_msn_swi_destiny_BUTTON_TOOLTIP:0 "Embark on the Old Swiss Confederacy Destiny"
 oe_msn_swi_destiny_BUTTON_DETAILS:0 "A twelve-task three-pillar destiny for Switzerland and its 1337 founding cantons: defy Habsburg knights at Sempach and forge Reislaufer pike squares; control the Gotthard Pass, Mittelland, Rhine Bend, and Ticino; and institutionalize the Tagsatzung, Alpine Reformation concord, clockmakers, and Fortress Alps neutrality."
 oe_msn_flo_01_signoria_wool_guilds:0 "Signoria & Arte della Lana Guilds"
 oe_msn_flo_01_signoria_wool_guilds_desc:0 "Inside the Palazzo Vecchio, priors drawn from the Arte della Lana and Calimala guilds turned raw English fleece into Europe's most coveted scarlet broadcloth. Supporting guild [buildings|e] strengthens civic [stability|e], enriches the [capital|e], and lifts urban [development|e]."
 oe_msn_flo_01_signoria_wool_guilds_req_tt:0 "Hold Florence (or via subjects), Stability >= 5, Cloth Guild or Fine Cloth Guild, and Burghers Satisfaction >= 50%."
 oe_msn_flo_02_gold_florin_standard:0 "The Gold Florin Standard"
 oe_msn_flo_02_gold_florin_standard_desc:0 "Struck in pure twenty-four-carat gold bearing the Florentine lily and St. John, the fiorino d'oro became the trusted reserve currency of kings and popes. Guarding monetary [inflation|e] expands regional [trade|e], multiplies [gold|e] reserves, and bolsters [prestige|e]."
 oe_msn_flo_02_gold_florin_standard_req_tt:0 "Hold Florence (or via subjects), Gold >= 160, Marketplace or Guild Hall, and Trade/Tax Income >= 20."
 oe_msn_flo_03_medici_banking_network:0 "Medici Banking Network"
 oe_msn_flo_03_medici_banking_network_desc:0 "Through double-entry ledgers and holding branches in Rome, Bruges, Lyon, and London, Florentine merchant banks financed papal tithes and royal campaigns alike. Embracing financial [institutions|e] turns credit into [diplomacy|e], deepens [market|e] reach, and wins [estate_satisfaction|e]."
 oe_msn_flo_03_medici_banking_network_req_tt:0 "Age of Renaissance+, hold Florence, Gold >= 240, Counting House, and Medici Bank Charter, Banking, or year >= 1420."
 oe_msn_flo_04_european_clearinghouse:0 "Clearinghouse of Christendom"
 oe_msn_flo_04_european_clearinghouse_desc:0 "Bills of exchange drafted on the Ponte Vecchio now settle sovereign loans from Antwerp to Naples without moving a single chest of bullion. Ruling continental [trade|e] elevates Tuscan [prosperity|e], guards low [inflation|e], and magnifies Florentine [diplomatic_reputation|e]."
 oe_msn_flo_04_european_clearinghouse_req_tt:0 "Age of Discovery+, hold Florence, Stability >= 12, Trading Hub or Merchants' Quarters, Trade/Tax Income >= 55, and Capital Development >= 24."
 oe_msn_flo_05_port_of_pisa:0 "Port of Pisa & Tuscan Coast"
 oe_msn_flo_05_port_of_pisa_desc:0 "For centuries landlocked Florence depended on jealous Pisan customs to reach the sea, until capturing the Arno mouth unlocked direct state galleys to Alexandria and Flanders. Making Pisa and Livorno a loyal [core|e] builds [maritime_presence|e], trains [sailors|e], and lowers [trade|e] tolls."
 oe_msn_flo_05_port_of_pisa_req_tt:0 "Hold Pisa and Livorno (or via subjects), and possess at least one port."
 oe_msn_flo_06_siena_tuscan_unification:0 "Siena & Tuscan Unification"
 oe_msn_flo_06_siena_tuscan_unification_desc:0 "Ending the ancient Guelph-Ghibelline rivalry with Siena, Arezzo, and Lucca heals Tuscany's bloody hilltop feuds into a single regional state. Integrating sister communes into our [core|e] strengthens Tuscan [control|e], pools civic [manpower|e], and raises regional [prosperity|e]."
 oe_msn_flo_06_siena_tuscan_unification_req_tt:0 "Hold Siena and Arezzo or Lucca (or via subjects), and Nobles Satisfaction >= 50%."
 oe_msn_flo_07_machiavellian_militia:0 "Machiavellian Civic Militia & Black Bands"
 oe_msn_flo_07_machiavellian_militia_desc:0 "Niccolo Machiavelli warned that fickle condottieri ruin republics, and Giovanni delle Bande Nere proved native Tuscan infantry could stand against imperial veterans. Drilling citizen [regulars|e] with modern [advances|e] toughens our [army|e] and cements durable [army_tradition|e]."
 oe_msn_flo_07_machiavellian_militia_req_tt:0 "Age of Discovery+, control Tuscany core, Stability >= 12, Training Fields or Armory, and Army Tradition >= 18 or Pike and Shot."
 oe_msn_flo_08_tyrrhenian_porto_franco:0 "Livorno Porto Franco & Tuscan Sea Lanes"
 oe_msn_flo_08_tyrrhenian_porto_franco_desc:0 "Under the Livornina charter, Livorno welcomed Sephardic, Armenian, Greek, and Dutch factors into a duty-free Tyrrhenian emporium guarded by the Knights of St. Stephen. Growing our port [market|e] strengthens the [navy|e], lifts [navy_tradition|e], and spurs coastal [development|e]."
 oe_msn_flo_08_tyrrhenian_porto_franco_req_tt:0 "Hold Livorno and Piombino (or via subjects), 16+ locations owned or by subjects, 3+ ports, and own a Wharf or Marketplace."
 oe_msn_flo_09_brunelleschi_duomo:0 "Brunelleschi's Duomo & Florentine School"
 oe_msn_flo_09_brunelleschi_duomo_desc:0 "Filippo Brunelleschi spanned Santa Maria del Fiore with an octagonal herringbone dome without timber centering, crowning a city alive with Donatello and Botticelli. Embracing artistic [institutions|e] and civic [buildings|e] elevates [prestige|e] and immortalizes [cultural_tradition|e]."
 oe_msn_flo_09_brunelleschi_duomo_req_tt:0 "Age of Renaissance+, hold Florence, Gold >= 200, embrace Renaissance, and own a Cathedral or Art School."
 oe_msn_flo_10_council_greek_scholars:0 "Council of Florence & Greek Scholars"
 oe_msn_flo_10_council_greek_scholars_desc:0 "Hosting the 1439 Ecumenical Council brought Byzantine philosophers like Gemistos Plethon and Bessarion to the Arno, igniting Europe's rediscovery of Plato. Blending high [diplomacy|e] with Greek manuscripts lifts [literacy|e], speeds [advances|e], and deepens [religious_influence|e]."
 oe_msn_flo_10_council_greek_scholars_req_tt:0 "Age of Renaissance+, hold Florence, Stability >= 10, Library or University, and Clergy Satisfaction >= 50%."
 oe_msn_flo_11_platonic_academy:0 "Platonic Academy & Uffizi Galleries"
 oe_msn_flo_11_platonic_academy_desc:0 "From Marsilio Ficino's villa at Careggi to Vasari's Uffizi galleries and Galileo's lenses, Florence turned patronage into a statecraft of genius. Raising civic [development|e] and scholarly [literacy|e] refines [cabinet|e] counsel and crowns Tuscan [cultural_tradition|e]."
 oe_msn_flo_11_platonic_academy_req_tt:0 "Age of Reformation+, hold Florence, Stability >= 15, Arts Academy or Printing Press Shop, and Capital Development >= 28."
 oe_msn_flo_12_cradle_of_renaissance:0 "Grand Duchy & Cradle of the Renaissance"
 oe_msn_flo_12_cradle_of_renaissance_desc:0 "Banker to kings, tutor to artists, and sovereign over every hill and harbor of Tuscany, Florence has proven that intellect and wealth can rival empires. Crowned by supreme [capital|e] [prosperity|e] and civic [legitimacy|e], the Lily ascends as a radiant European [great_power|e]."
 oe_msn_flo_12_cradle_of_renaissance_req_tt:0 "Age of Absolutism+, control Tuscany core, Stability >= 18, Capital Development >= 32, and Great Power or Trade/Tax Income >= 110."
 oe_msn_swi_01_eternal_pact:0 "Eternal Pact of the Forest Cantons"
 oe_msn_swi_01_eternal_pact_desc:0 "Sworn by Uri, Schwyz, and Unterwalden in the alpine meadow of Rutli, the Eternal Pact refused foreign bailiffs and bound free valleys in common defense. Honoring rural [estates|e] and [estate_satisfaction|e] secures confederal [stability|e] and nurtures mountain [development|e]."
 oe_msn_swi_01_eternal_pact_req_tt:0 "Hold Schwyz, Altdorf, Lucerne, Bern, or Zurich (or via subjects), Stability >= 5, and Peasants Satisfaction >= 50%."
 oe_msn_swi_02_sempach_stand:0 "Defiance of Habsburg & Sempach Stand"
 oe_msn_swi_02_sempach_stand_desc:0 "At Morgarten and Sempach, halberdiers and peasant levies broke the flower of Habsburg chivalry beneath steep alpine slopes. Arming cantonal [manpower|e] through local [buildings|e] forges fearless [army_tradition|e] and commands grudging imperial [prestige|e]."
 oe_msn_swi_02_sempach_stand_req_tt:0 "Hold Lucerne, Schwyz, or Bern (or via subjects), Stability >= 8, Castle or Weapon Guild, and Army Tradition >= 12."
 oe_msn_swi_03_reislaufer_contracts:0 "Reislaufer Mercenary Contracts & Discipline"
 oe_msn_swi_03_reislaufer_contracts_desc:0 "Drilled into dense eighteen-foot pike squares marching to fife and drum, Swiss Reislaufer became the most sought-after infantry in Renaissance Europe. Regulating foreign contracts brings [gold|e] into cantonal chests while modern [advances|e] turn our [regulars|e] into a feared [army|e]."
 oe_msn_swi_03_reislaufer_contracts_req_tt:0 "Age of Renaissance+, Gold >= 160, Stability >= 10, Armory or Cannon Maker, and Army Tradition >= 22 or Professional Armies."
 oe_msn_swi_04_alpine_redoubt_bastions:0 "Alpine Redoubt & Fortress Passes"
 oe_msn_swi_04_alpine_redoubt_bastions_desc:0 "Even after arquebus and field cannon reshaped open battlefields, narrow glacier defiles guarded by interlocking stone citadels remained deadly to invaders. Pairing every alpine [fort|e] with disciplined [advances|e] entrenches mountain [control|e] and defends cantonal [prosperity|e]."
 oe_msn_swi_04_alpine_redoubt_bastions_req_tt:0 "Age of Discovery+, hold Altdorf and Bern, Training Fields or Castle, and unlock Pike and Shot."
 oe_msn_swi_05_gotthard_pass_tolls:0 "Gotthard Pass & Alpine Tollways"
 oe_msn_swi_05_gotthard_pass_tolls_desc:0 "Bridging the roaring Schollenen gorge turned the St. Gotthard Pass into the shortest mule road linking Milan's silk looms with Rhineland fairs. Securing Uri and Schwyz as a firm [core|e] taxes transalpine [trade|e], fills cantonal [gold|e] vaults, and enlivens valley [market|e] towns."
 oe_msn_swi_05_gotthard_pass_tolls_req_tt:0 "Hold Altdorf and Schwyz (or via subjects), and own a Marketplace or Granary."
 oe_msn_swi_06_bern_zurich_guilds:0 "Bernese Mittelland & Zurich Guilds"
 oe_msn_swi_06_bern_zurich_guilds_desc:0 "Joining rural forest cantons with the patrician republic of Bern and Zurich's thriving textile guilds gave the Confederacy both rich farmland and urban capital. Making both cities our [core|e] expands craft [buildings|e], lifts [development|e], and raises [estate_satisfaction|e]."
 oe_msn_swi_06_bern_zurich_guilds_req_tt:0 "Hold Bern and Zurich (or via subjects), Guild Hall or Cloth Guild, and Burghers Satisfaction >= 50%."
 oe_msn_swi_07_aargau_vaud_rhine:0 "Rhine Bend & Lake Geneva Gateways"
 oe_msn_swi_07_aargau_vaud_rhine_desc:0 "Extending the confederal banner to the Rhine knee at Basel and the vineyards of Lake Geneva secures both river shipping and Savoyard passes. Absorbing these free cities into our [core|e] widens northern [control|e], boosts frontier [trade|e], and enhances federal [prestige|e]."
 oe_msn_swi_07_aargau_vaud_rhine_req_tt:0 "Hold Lucerne and Basel, Geneva, or Lausanne (or via subjects), and Trade/Tax Income >= 18."
 oe_msn_swi_08_transalpine_confederacy:0 "Transalpine Gates: Ticino & Graubunden"
 oe_msn_swi_08_transalpine_confederacy_desc:0 "Holding the three castles of Bellinzona and the Three Leagues of Graubunden places both slopes of the Alps under Swiss stewardship. Linking Italian valleys with northern [market|e] routes deepens our [control|e], enriches transalpine [trade|e], and secures loyal [subjects|e]."
 oe_msn_swi_08_transalpine_confederacy_req_tt:0 "Age of Discovery+, control Alpine core, hold Bellinzona or Chur, and own a Trading Hub or Merchants' Quarters."
 oe_msn_swi_09_tagsatzung_diet:0 "Tagsatzung Federal Diet"
 oe_msn_swi_09_tagsatzung_diet_desc:0 "Envoys from every urban and forest canton met regularly in the Tagsatzung at Baden to arbitrate disputes, coordinate alliances, and administer shared bailiwicks. Institutionalizing federal [parliament|e] deepens [stability|e], sharpens [cabinet|e] work, and raises [diplomatic_reputation|e]."
 oe_msn_swi_09_tagsatzung_diet_req_tt:0 "Age of Renaissance+, Stability >= 10, Gold >= 160, Capital Development >= 16, and Peasants Satisfaction >= 55%."
 oe_msn_swi_10_alpine_reformation:0 "Alpine Reformation & Confessional Concord"
 oe_msn_swi_10_alpine_reformation_desc:0 "From Zwingli's sermons in Zurich to Calvin's academy in Geneva and the Kappel peaces protecting Catholic cantons, Switzerland survived religious upheaval without splintering. Embracing civic [institutions|e] and printing raises [literacy|e], deepens [religious_influence|e], and enriches [cultural_tradition|e]."
 oe_msn_swi_10_alpine_reformation_req_tt:0 "Age of Reformation+, hold Zurich or Geneva, Stability >= 12, embrace Confessionalism, and own a Printing Press Shop or University."
 oe_msn_swi_11_clockmakers_vaults:0 "Alpine Clockmakers & Cantonal Vaults"
 oe_msn_swi_11_clockmakers_vaults_desc:0 "Huguenot watchmakers settling in Geneva and prudent bankers in Basel and Zurich turned alpine precision and discreet vaults into Europe's safest haven for capital. Mastering low [inflation|e] draws foreign [gold|e], expands artisan [buildings|e], and lifts federal [prosperity|e]."
 oe_msn_swi_11_clockmakers_vaults_req_tt:0 "Age of Reformation+, Gold >= 300, Stability >= 15, Customs House or Counting House, Trade/Tax Income >= 70, and Capital Development >= 24."
 oe_msn_swi_12_fortress_alps_neutrality:0 "Armed Neutrality & Fortress Alps"
 oe_msn_swi_12_fortress_alps_neutrality_desc:0 "Recognized as sovereign by every crowned court yet defended by citizen rifles behind impregnable mountain walls, the Confederacy stands unconquered at Europe's roof. Anchored by iron [fort|e] rings, peaceful [diplomacy|e], and enduring [prosperity|e], Switzerland ranks as a unique [great_power|e]."
 oe_msn_swi_12_fortress_alps_neutrality_req_tt:0 "Age of Absolutism+, control Alpine core, Stability >= 18, Star Fort or Bastion, Capital Development >= 28, and Great Power or Trade/Tax Income >= 100."
 oe_gem3.1.title:0 "The Ciompi Wool Revolt"
 oe_gem3.1.desc:0 "Unrepresented wool-carders and dyers of the Arte della Lana have seized the Palazzo della Signoria, demanding minor guild seats, debt relief, and relief from punitive wool taxes."
 oe_gem3.1.a:0 "Grant guild representation to the wool-carders"
 oe_gem3.1.b:0 "Back the major merchant guilds and restore order"
 oe_gem3.2.title:0 "Founding of the Medici Bank"
 oe_gem3.2.desc:0 "Giovanni di Bicci de' Medici has moved his banking headquarters to Florence, pioneering decentralized branch partnerships, double-entry books, and papal deposit accounts across Europe."
 oe_gem3.2.a:0 "Charter Medici continental clearing branches"
 oe_gem3.2.b:0 "Channel Medici capital into civic wool and silk workshops"
 oe_gem3.3.title:0 "Conquest of Pisa & Access to the Sea"
 oe_gem3.3.desc:0 "With the Arno estuary and the port of Pisa opening before Florentine merchants, the republic can at last launch its own state galley convoys to Flanders, Alexandria, and the Levant."
 oe_gem3.3.a:0 "Commission the Florentine Sea Consuls and galley fleet"
 oe_gem3.3.b:0 "Turn Pisa's customs wharf into a Tuscan warehouse hub"
 oe_gem3.4.title:0 "Brunelleschi's Dome over Santa Maria del Fiore"
 oe_gem3.4.desc:0 "Master architect Filippo Brunelleschi proposes an audacious double-shelled herringbone-brick cupola built without wooden centering, accompanied by ingenious hoist engines never seen since antiquity."
 oe_gem3.4.a:0 "Fund Brunelleschi's engineering miracle in full"
 oe_gem3.4.b:0 "Adopt his perspective and drafting methods across civic guilds"
 oe_gem3.5.title:0 "Council of Florence & Byzantine Scholars"
 oe_gem3.5.desc:0 "Emperor, Patriarch, and foremost Greek philosophers including Plethon and Bessarion have arrived in Florence for the Ecumenical Council, bringing chests of rare Platonic and scientific manuscripts."
 oe_gem3.5.a:0 "Sponsor Greek chairs and manuscript translation halls"
 oe_gem3.5.b:0 "Leverage the Council to expand papal and Eastern diplomacy"
 oe_gem3.6.title:0 "Laurentian Golden Age & the Platonic Academy"
 oe_gem3.6.desc:0 "Under Lorenzo il Magnifico's patronage, Marsilio Ficino, Pico della Mirandola, Botticelli, and young Michelangelo gather between Villa Careggi and San Marco, making Florence the cultural capital of Europe."
 oe_gem3.6.a:0 "Endow the Platonic Academy and Sculpture Garden"
 oe_gem3.6.b:0 "Weave Lorenzo's Italian Balance-of-Power diplomacy"
 oe_gem3.7.title:0 "Savonarola's Bonfire vs the Signoria"
 oe_gem3.7.desc:0 "Fiery Dominican preacher Girolamo Savonarola denounces princely luxury from San Marco, rallying austere citizens to burn paintings and silks in Piazza della Signoria while the magistrates fear papal interdict."
 oe_gem3.7.a:0 "Curb the zealots and uphold humanist civic liberties"
 oe_gem3.7.b:0 "Channel austere moral reform into the Great Council"
 oe_gem3.8.title:0 "Machiavelli's Citizen Militia & the Black Bands"
 oe_gem3.8.desc:0 "Chancery secretary Niccolo Machiavelli urges the Signoria to abandon treacherous mercenaries and raise a drilled Tuscan citizen ordinance—soon sharpened into the famed pike-and-shot Black Bands."
 oe_gem3.8.a:0 "Enact Machiavelli's Ordinanza and Black Band drill"
 oe_gem3.8.b:0 "Fortify the Tuscan contado with modern bastion ramparts"
 oe_gem3.9.title:0 "Battle of Sempach & Arnold von Winkelried"
 oe_gem3.9.desc:0 "When Habsburg armored knights locked lances into an iron hedge outside Sempach, legend tells of Arnold von Winkelried sweeping enemy spears into his own chest to tear open a path for the Confederate halberds."
 oe_gem3.9.a:0 "Immortalize the Sempach spirit in cantonal infantry drill"
 oe_gem3.9.b:0 "Codify the Sempacherbrief Covenant of military order"
 oe_gem3.10.title:0 "Gotthard Pass Charter & Alpine Tollways"
 oe_gem3.10.desc:0 "Stone causeways, hospice shelters, and winter snow-clearers along the Saint Gotthard pass have turned the central Alps into the shortest merchant artery linking Milan to Basel and Strasbourg."
 oe_gem3.10.a:0 "Charter cantonal mule guilds and pass customs houses"
 oe_gem3.10.b:0 "Fortify the bridges and narrow gorges along the pass"
 oe_gem3.11.title:0 "Eight-Canton Expansion into the Aargau"
 oe_gem3.11.desc:0 "Seizing the moment of imperial crisis, the Eight Old Cantons have marched into the Habsburg heartlands of Aargau, establishing jointly governed common bailiwicks overseen by the Tagsatzung."
 oe_gem3.11.a:0 "Administer the conquered lands as joint Confederate bailiwicks"
 oe_gem3.11.b:0 "Confirm local town charters to rally loyal Alpine militias"
 oe_gem3.12.title:0 "Burgundian Wars: Grandson & Murten"
 oe_gem3.12.desc:0 "Charles the Bold's glittering Burgundian army and prized field artillery have been shattered by charging Swiss pike wedges at Grandson and Murten, stunning every royal court in Europe."
 oe_gem3.12.a:0 "Seize the Burgundian cannon train and drill pike-halberd squares"
 oe_gem3.12.b:0 "Distribute the Grandson war-booty across every canton"
 oe_gem3.13.title:0 "Fame of the Reislaufer Pike Square"
 oe_gem3.13.desc:0 "After routing imperial Landsknechts in the Swabian War, monarchs from Paris to Rome compete fiercely with gold pensions to hire Swiss Reislaufer regiments and the Pontifical Guard."
 oe_gem3.13.a:0 "License official cantonal Reislaufer capitulations"
 oe_gem3.13.b:0 "Keep our finest pike veterans at home for Alpine defense"
 oe_gem3.14.title:0 "The Zurich & Geneva Reformations"
 oe_gem3.14.desc:0 "Huldrych Zwingli in Zurich and later John Calvin in Geneva have ignited a sweeping Reformed movement, even as the rural Forest Cantons stand steadfastly by the old Catholic liturgy."
 oe_gem3.14.a:0 "Broker the Kappel Confessional Peace between cantons"
 oe_gem3.14.b:0 "Welcome exiled printers, scholars, and artisans into our cities"
 oe_gem3.15.title:0 "Armed Neutrality of the Tagsatzung"
 oe_gem3.15.desc:0 "As great dynastic blocs mobilize across Germany, France, and Italy, the Tagsatzung resolves to guard Confederate sovereignty through armed neutrality: no foreign marches through Alpine passes without Swiss consent."
 oe_gem3.15.a:0 "Establish the Defensionale joint border militia command"
 oe_gem3.15.b:0 "Offer Swiss mediation and safe diplomatic passage across Europe"
 oe_gem3.16.title:0 "Alpine Clockmakers & Cantonal Vaults"
 oe_gem3.16.desc:0 "Master watchmakers in Geneva and the Jura valleys pair intricate brass escapements with cautious Basel and Zurich merchant bankers, building an economy prized across Europe for precision and discretion."
 oe_gem3.16.a:0 "Charter the Geneva-Jura precision watchmakers' guilds"
 oe_gem3.16.b:0 "Establish rock-solid Alpine bullion vaults and credit houses"
