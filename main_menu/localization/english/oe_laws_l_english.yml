l_english: 
 oe_byz_feudal_de_jure: "Byzantine Jurisprudence"
 oe_byz_feudal_de_jure_desc: "Byzantine law held great authority in the Middle Ages. Not only the subjects of the Byzantine Empire itself, but also the subjects of neighboring countries and merchants engaged in Mediterranean and Far Eastern trade readily accepted it. Many of its provisions were, and still are, considered very rigorous and forward-looking, a testament to Byzantium's long-standing legal scholarship and tradition."
 oe_byz_bad_patriarchate_law: "Church Welfare System"
 oe_byz_bad_patriarchate_law_desc: "With the collapse of our centralized system, the Church increasingly took on responsibilities such as disaster relief, education, and healthcare—tasks that should have been handled by our government. We must thank the Church for sustaining the last social safety net during these turbulent times."
 oe_byz_good_patriarchate_law: "Eastern Orthodox Church"
 oe_byz_good_patriarchate_law_desc: "We have successfully stabilized society; the Church no longer needs to bear the brunt of providing grassroots welfare."
 oe_byz_better_patriarchate_law: "Imperial and Ecclesiastical Power"
 oe_byz_better_patriarchate_law_desc: "The Council of Nicaea decreed that imperial power is above ecclesiastical power, and that ecclesiastical power serves imperial power. Now, Eastern Roman bureaucrats loyal to the crown firmly control the clergy. Ecclesiastical power will forever be subservient to imperial power, becoming a servant of politics."
 oe_byz_best_patriarchate_law: "Enlightened Church"
 oe_byz_best_patriarchate_law_desc: "With the continuous flourishing of our economy, culture, and arts, we are determined to reform the Patriarchate, discarding concepts of ignorance and decay, and standing with the tide of the times."
 byz_rebuild_patriarchateI_tt: "Unlocked after completely eliminating all [ShowBuildingTypeName('oe_byz_bad_thief_greek')] and completing #G Continue Restoring Imperial Authority#!."
 byz_rebuild_patriarchateII_tt: "Content to be developed, please stay tuned."
 byz_rebuild_patriarchateIII_tt: "Content to be developed, please stay tuned."
 oe_byz_cultural_tradition: "Ancient Western Civilization"
 oe_byz_cultural_tradition_desc: "We are descendants of Greeks and Romans, an ancient civilization spanning millennia. Our profound cultural traditions will surely lead us, time and again, like the purple phoenix, to rise from the ashes and overcome all difficulties."
 oe_byz_administrative_system_II: "Byzantine Bureaucracy"
 oe_byz_administrative_system_II_desc: "The vast class of professional bureaucrats was a hallmark of Byzantine society. Although this traditional bureaucratic structure was severely damaged after the disaster of 1204, the most difficult times have passed. Loyal and efficient civil servants will govern society in an orderly fashion on behalf of the Emperor."
 oe_byz_administrative_system_I: "Local Feudalization"
 oe_byz_administrative_system_I_desc: "In the later period of the Byzantine Empire, land annexation became increasingly severe, and the small-scale peasant economy collapsed. The government issued edicts forbidding land annexation, but these were met with joint resistance from regional military and civil officials and local large landowners."
 unlocked_oe_byz_administrative_system_II_law: "Revive Bureaucratic Administration"
 oe_byz_court_customs: "Byzantine-Style Court"
 oe_byz_court_customs_desc: "The ritual culture of our royal court was once at its peak. On one hand, it inherited the basic forms and content of Roman imperial court rituals; on the other, it showcased Byzantine culture's fusion of East and West, its all-encompassing nature. However, our country is also renowned for its court intrigues. Frequent palace coups and internal strife have earned our court the 'reputation' of 'Byzantine-style court intrigue'."
 oe_byz_administrative_system_II_tt: "Choose to Rebuild Bureaucratic Administration in #G The Fate of the Pronoia#!."
 oe_byz_medieval_levy: "Pronoia Levies"
 oe_byz_medieval_levy_desc: "The small pronoia nobles, who gained land through the pronoia system, are our steadfast supporters. They will fight faithfully for the country, upholding their honor."
 oe_byz_distribution_of_power_law: "Nominal Senate"
 oe_byz_distribution_of_power_law_desc: "The Senate was once Rome's pivotal supreme authority, but its current members are mainly hereditary nobles, high-ranking bureaucrats, wealthy merchants, and renowned scholars from the capital, Constantinople. It has become a closed 'aristocratic club' representing the vested interests of the capital. Its titles are purely honorary and symbolic of social status, can be bought, sold, or granted, and have no connection to specific functions."
 oe_lose_precious_metal_distribution_law: "Discredited Precious Metals Control"
 oe_lose_precious_metal_distribution_law_desc: "Although imperial law explicitly prohibits the export of gold and silver, privileged Italian merchants and the empire's essential imports have continuously eroded our gold and silver reserves. To reverse this situation, we must establish a sound economy and end the privileges of the Italians."
 oe_good_precious_metal_distribution_law: "Precious Metals Control Act"
 oe_good_precious_metal_distribution_law_desc: "We have successfully restored the Precious Metals Control Act, which once became a dead letter. Now, gold and silver will continuously flow and concentrate within the empire, becoming the cornerstone of our financial stability."
 oe_bad_mining_law: "Disloyal Contractors"
 oe_bad_mining_law_desc: "As central control weakened, churches, monasteries, local magnates, and private contractors became key participants in local mine operations. Italian merchants (especially the Genoese), through loans or treaties, also obtained mining rights or revenue shares in some areas."
 oe_good_mining_law: "State Mining Commission"
 oe_good_mining_law_desc: "We have systematically purged the pernicious influences in mine operations, making the local powers recognize the majesty of imperial authority. The Basileus has decreed that all mines in the country are nationalized, and a State Mining Commission will be established, responsible for exploration, statistics, tendering, and supervision of all mines."
 oe_byz_bad_censorship: "Patriarchal Censorship"
 oe_byz_bad_censorship_desc: "Although the imperial power had the right to intervene, most heretical works were solely censored by the presiding Patriarch. In the devout Byzantine society, the church firmly controlled religious discourse, and people turned a blind eye to any heretical voices."
 oe_byz_good_censorship: "Joint Bureaucratic Censorship"
 oe_byz_good_censorship_desc: "The Patriarch's sole censorship of heresy led to countless injustices. The Emperor intervened at the right time and implemented appropriate reforms. Now, a joint censorship committee composed of bureaucrats will exercise supervisory power over the Patriarchs on behalf of the Emperor. Any religious trial must be reviewed by this committee, greatly reducing the occurrence of miscarriages of justice and curbing the abuse of power by the clergy."
 oe_byz_maritime_bad: "Italian Maritime Hegemony"
 oe_byz_maritime_bad_desc: "The Venetians and Genoese define the commercial order of the Aegean Sea. Our weakened navy cannot yet compete with them, and our merchants often have to submit to the maritime laws defined by the Italians."
 oe_byz_maritime_good: "Byzantine Maritime Law"
 oe_byz_maritime_good_desc: "Byzantine law once again prevails over the blue skies and seas of 'Mare Nostrum' ('Our Sea'). Our detailed and rigorous legal code encompasses almost all matters and potential disputes in maritime activities. Our seas and ports, under our rule, will become orderly."
 oe_byz_administrative_system_III_tt: "Choose to Amend the Pronoia System in #G The Fate of the Pronoia#!."
 oe_byz_medieval_levy_tt: "Did not choose to Abolish the Pronoia System in #G The Fate of the Pronoia#!."
