 oe_policy_org_law_what_burch: "Scope of Official Selection"
 oe_policy_org_law_what_burch_desc: "Who is eligible to become a bureaucrat?"
 oe_policy_org_law_what_burch_I: "Only Christian Romans"
 oe_policy_org_law_what_burch_I_desc: "Only those who are Christian and Roman are eligible to become bureaucrats."
 oe_policy_org_law_what_burch_II: "Only Christians"
 oe_policy_org_law_what_burch_II_desc: "Only those who are Christian are eligible to become bureaucrats."
 oe_policy_org_law_what_burch_III: "Equal for All"
 oe_policy_org_law_what_burch_III_desc: "Anyone has the opportunity to become a bureaucrat."
 oe_policy_org_law_burch_say: "Administrative Language"
 oe_policy_org_law_burch_say_desc: "Determines the language used by our country's administrative institutions."
 oe_policy_org_law_burch_say_I: "Greek"
 oe_policy_org_law_burch_say_desc: "Greek is the language that all our administrative institutions must master and use proficiently."
 oe_policy_org_law_burch_say_II: "Adapt to Local Conditions"
 oe_policy_org_law_burch_say_II_desc: "In addition to Greek, other languages used by administrative institutions can be flexibly determined based on the local lingua franca."

