 oe_administrative_rome_system: "The Roman System"
 oe_administrative_rome_system_desc: "Like the Ship of Theseus, the Roman system has changed almost beyond recognition over its long history. Yet whatever measures we adopt to govern Rome, the adaptability and resilience of its administration endure."
 OE_BYZ_ROMAN_WORLD_LAWS: "Ordinances"
