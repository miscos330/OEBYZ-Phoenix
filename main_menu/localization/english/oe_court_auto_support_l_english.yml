l_english:
 OE_COURT_AUTO_TT: "#bold #Y Automatic Court Appointments#!#!\nClick the native automation cog in the lower-right corner to toggle. A green check mark means automation is enabled.\nWhen enabled, fill vacancies immediately and replace officeholders who die, enter the cabinet, leave the country or cease to qualify. A monthly review catches other vacancies.\nAdministrative offices select the highest Administrative ability, diplomatic offices the highest Diplomatic ability, and military offices the highest Military ability. Candidates must be living adults in Eastern Rome, belong to the clergy, nobles or crown estate, remain outside the cabinet and hold no other court office.\nOnly vacant seats are filled. Incumbents are retained; seats remain empty if nobody qualifies. Automatic appointments cost no resources."
 oe_court_auto_enabled: "Automatic Court Appointments"
 oe_court_deceased: "Deceased Court Officeholder"
 oe_nf_request_support: "Request Political Support"
 oe_nf_request_support_desc: "To borrow a great house’s standing is to acknowledge its weight at court. Its head calls upon clients and dependants to speak for the imperial decree, strengthening the throne’s authority while securing a political concession for the family.\n\nSpend #R 3 Legitimacy#! to gain #G 2 Authority#!. The house gains #G 3 Influence#!. All houses share a #Y 12-month#! cooldown."
 OE_NF_SUPPORT_LEGITIMACY: "Have at least #Y 3 Legitimacy#!."
 OE_NF_SUPPORT_COOLDOWN: "Political support has not been requested from any house in the past #Y 12 months#!."
 OE_NF_SUPPORT_SELECT: "Select the head of the house offering support"
 OE_NF_SUPPORT_NONE: "@trigger_no! No living noble house can provide political support."
 oe_nf_support_cooldown: "Political Support: Country-wide Cooldown"
 OE_NF_INTERACTION_RULE: "Each #Y 1 Authority#! spent on a house interaction grants that family an additional #G 2 Influence#!."
