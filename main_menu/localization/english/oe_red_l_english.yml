l_english:
 oe_red_b_holy_accord: "Holy Land Pilgrimage & Eastern Sees Accord"
 oe_red_b_holy_friction: "Jerusalem & Alexandria Ecclesiastical Friction"
 oe_red_b_solomonic_compact: "Solomonic-Roman Red Sea Compact"
 oe_red_b_red_sea_charter: "Massawa & Aden Red Sea Trade Charter"
 STATIC_MODIFIER_NAME_oe_red_pilgrim_charter: "Eastern Sees & Pilgrimage Charter"
 STATIC_MODIFIER_DESC_oe_red_pilgrim_charter: "Steady endowments and Cairo diplomacy keep Jerusalem, Alexandria, and Sinai open to pilgrims, lifting prestige and faith at a modest fiscal cost."
 STATIC_MODIFIER_NAME_oe_red_levant_defiance: "Defiant Guardianship of the Holy Land"
 STATIC_MODIFIER_DESC_oe_red_levant_defiance: "Refusing concessions to Cairo rallies clergy and fighting spirit behind imperial guardianship while stiffening diplomatic relations."
 STATIC_MODIFIER_NAME_oe_red_solomonic_bridge: "Solomonic-Roman Ecclesiastical Bridge"
 STATIC_MODIFIER_DESC_oe_red_solomonic_bridge: "Envoys from Axum, Gonder, and Lalibela bridge Miaphysite and Orthodox divides with artisans and letters, stirring conservative clerical unease."
 STATIC_MODIFIER_NAME_oe_red_alexandrian_brokers: "Alexandrian Brokerage Channels"
 STATIC_MODIFIER_DESC_oe_red_alexandrian_brokers: "Setting aside highland theology to tax Alexandrian middlemen bolsters customs revenue while narrowing distant diplomatic reach."
 STATIC_MODIFIER_NAME_oe_red_spice_charter: "Massawa-Aden Spice Factoria Charter"
 STATIC_MODIFIER_DESC_oe_red_spice_charter: "Chartered factorias at Massawa and Aden open Indian Ocean spice flows and maritime presence while raising distant garrison costs."
 STATIC_MODIFIER_NAME_oe_red_barsbay_monopoly: "Crown Red Sea Spice Monopoly"
 STATIC_MODIFIER_DESC_oe_red_barsbay_monopoly: "State-enforced pepper monopolies and heavy escort duties swell treasury receipts and naval readiness while alienating burghers and foreign courts."
 STATIC_MODIFIER_NAME_oe_red_canal_survey: "Hydraulic Survey of Trajan's Canal"
 STATIC_MODIFIER_DESC_oe_red_canal_survey: "Imperial surveyors chart Wadi Tumilat and Red Sea tides, sharpening state engineering and gradual prosperity at steady fiscal outlay."
 STATIC_MODIFIER_NAME_oe_red_suez_survey_camp: "Suez Hydraulic Survey Camp"
 STATIC_MODIFIER_DESC_oe_red_suez_survey_camp: "Survey camps and sounding boats spur local construction at Suez while impressing guides and supplies causes minor local friction."
 STATIC_MODIFIER_NAME_oe_red_overland_caravans: "Suez-Cairo Overland Caravan Portage"
 STATIC_MODIFIER_DESC_oe_red_overland_caravans: "Relying on fortified caravanserais instead of grand excavation keeps portage orderly and calm while foregoing monumental prestige."
 STATIC_MODIFIER_NAME_oe_red_canal_fiscal_strain: "Grand Canal Excavation Fiscal Strain"
 STATIC_MODIFIER_DESC_oe_red_canal_fiscal_strain: "Full-scale dredging from the Nile to Suez severely strains taxes and rural estates, sustained only by sheer imperial ambition."
 STATIC_MODIFIER_NAME_oe_red_suez_corvee_unrest: "Suez Corvee Labor Unrest"
 STATIC_MODIFIER_DESC_oe_red_suez_corvee_unrest: "Harsh heat, fever, and forced corvee along the Suez trench spark desertion, falling control, and acute unrest."
 STATIC_MODIFIER_NAME_oe_red_canal_guild_debt: "Canal Guild Contracting Debt"
 STATIC_MODIFIER_DESC_oe_red_canal_guild_debt: "Hiring free hydraulic guilds spares the peasantry harsh corvee at the cost of heavy treasury debt and prolonged outlays."
 STATIC_MODIFIER_NAME_oe_red_suez_guild_works: "Suez Contracted Hydraulic Works"
 STATIC_MODIFIER_DESC_oe_red_suez_guild_works: "Paid masons and dredgers advance lock-basin development at Suez with only mild local disruption."
 STATIC_MODIFIER_NAME_oe_red_canal_retrenchment: "Canal Retrenchment & Treasury Repair"
 STATIC_MODIFIER_DESC_oe_red_canal_retrenchment: "Halting the isthmus excavation relieves the treasury in the short term while tarnishing imperial prestige."
 STATIC_MODIFIER_NAME_oe_red_trajan_canal_open: "Roman Trajan's Red Sea Canal Hub"
 STATIC_MODIFIER_DESC_oe_red_trajan_canal_open: "The reopened Canal of the Pharaohs and Trajan transforms Suez into a permanent maritime, trade, and shipbuilding gateway between the Mediterranean and the Indian Ocean."
 STATIC_MODIFIER_NAME_oe_red_trajan_canal_fortified: "Fortified Imperial Lock-Harbor of Suez"
 STATIC_MODIFIER_DESC_oe_red_trajan_canal_fortified: "Heavy fortresses and imperial customs locks turn Suez into a formidable naval hub and choke point, though strict policing stirs local chafing."
 STATIC_MODIFIER_NAME_oe_red_free_canal_charter: "Low-Toll Charter of Trajan's Canal"
 STATIC_MODIFIER_DESC_oe_red_free_canal_charter: "Modest canal dues draw ships from Venice to Calicut, surging trade income and shipbuilding while empowering chartered merchants at slight crown expense."
 STATIC_MODIFIER_NAME_oe_red_imperial_canal_tolls: "Imperial Red Sea Strait Tolls"
 STATIC_MODIFIER_DESC_oe_red_imperial_canal_tolls: "Steep imperial tolls and patrol squadrons fill state coffers and sharpen naval morale while provoking merchant and diplomatic resentment."
 STATIC_MODIFIER_NAME_oe_red_erythraean_compact: "Ethiopian-Roman Erythraean Naval Compact"
 STATIC_MODIFIER_DESC_oe_red_erythraean_compact: "Joint patrols from Suez to Massawa safeguard Red Sea lanes against rival fleets, lifting naval tradition and trade protection at a sustained fiscal cost."
 STATIC_MODIFIER_NAME_oe_red_chokepoint_garrisons: "Independent Red Sea Chokepoint Garrisons"
 STATIC_MODIFIER_DESC_oe_red_chokepoint_garrisons: "Self-reliant fortresses at Suez, Massawa, and Aden harden coastal defense and maritime reach while increasing garrison upkeep and diplomatic chill."
 STATIC_MODIFIER_NAME_oe_red_erythraean_hegemony: "Thalassocracy of the Erythraean Sea"
 STATIC_MODIFIER_DESC_oe_red_erythraean_hegemony: "Unbroken sea lanes from Alexandria through Suez to Aden crown a true Erythraean thalassocracy, demanding costly stability and fortress upkeep."
 STATIC_MODIFIER_NAME_oe_red_red_sea_commonwealth: "Red Sea & Holy Land Commonwealth"
 STATIC_MODIFIER_DESC_oe_red_red_sea_commonwealth: "Toleration, pilgrimage charters, and shared customs unite Cairo, Jerusalem, and Axum in prosperous concord while tempering central crown dominance."
 STATIC_MODIFIER_NAME_oe_red_sinai_endowment: "Endowment of St. Catherine & Jerusalem"
 STATIC_MODIFIER_DESC_oe_red_sinai_endowment: "Regular grants to Mount Sinai and Jerusalem uphold clerical loyalty and religious prestige at a modest cost to state revenue."
 oe_red_dec_sinai_pilgrimage.title: "Endow Jerusalem & St. Catherine's Monastery"
 oe_red_dec_sinai_pilgrimage.desc: "Commit treasury funds to maintain the Holy Sepulchre and Mount Sinai, lifting religious influence and regional goodwill at a steady tax trade-off."
 oe_red_dec_sinai_pilgrimage.a: "Seal the Sinai & Jerusalem Endowment"
 oe_red_dec_solomonic_embassy.title: "Dispatch the Solomonic Highland Embassy"
 oe_red_dec_solomonic_embassy.desc: "Send artisans, escort troops, and envoys across the Red Sea to the Solomonic court, forging a lasting highland-maritime bridge."
 oe_red_dec_solomonic_embassy.a: "Dispatch the Highland Embassy"
 oe_red_dec_trajan_canal_charter.title: "Complete and Charter Trajan's Canal at Suez"
 oe_red_dec_trajan_canal_charter.desc: "Commit heavy gold, manpower, and civic effort to finish the locks at Suez, bestowing a permanent trade and naval canal hub modifier."
 oe_red_dec_trajan_canal_charter.a: "Commission Trajan's Red Sea Canal"
 oe_red.1.t: "Pilgrims and Patriarchs of Jerusalem"
 oe_red.1.d: "In the uneasy aftermath of Levantine raids, clergy from Jerusalem, Alexandria, and Mount Sinai send urgent letters. Cairo still treats the imperial court as the natural spokesman for Eastern Christians: shall we fund a diplomatic protectorate or assert unyielding guardianship over the Holy Land?"
 oe_red.1.a: "Dispatch Cairo envoys and endow the Eastern Sees"
 oe_red.1.a.tt: "Costs #R 80#! gold; grants #G +5#! prestige, #G +10#! religious influence, [ShowModifier('oe_red_pilgrim_charter')] (#Y 25#! years, with a tax efficiency trade-off), and improves Roman-Mamluk relations."
 oe_red.1.b: "Assert defiant imperial guardianship over the Holy Land"
 oe_red.1.b.tt: "Costs #R 50#! gold and #R 4#! stability; grants #G +12#! prestige and [ShowModifier('oe_red_levant_defiance')] (#Y 25#! years, lowering diplomatic reputation), straining ties with Cairo."
 oe_red.2.t: "Envoys from the Solomonic Throne"
 oe_red.2.d: "Ethiopian monks from Axum, Gonder, and Lalibela arrive bearing letters from the Solomonic Negusa Nagast. Where westerners dream of Prester John, these envoys seek concrete ties—artisans, sacred books, and a Red Sea bridge between Miaphysite and Orthodox Christendom."
 oe_red.2.a: "Send artisans and books to forge a Solomonic-Roman bridge"
 oe_red.2.a.tt: "Costs #R 75#! gold and #R 2#! stability; grants #G +12#! religious influence, [ShowModifier('oe_red_solomonic_bridge')] (#Y 25#! years, slight clergy friction), and deepens ties with Ethiopia."
 oe_red.2.b: "Keep doctrinal distance and trade through Alexandria"
 oe_red.2.b.tt: "Costs #R 6#! prestige; grants [ShowModifier('oe_red_alexandrian_brokers')] (#Y 20#! years, with lower diplomatic reputation)."
 oe_red.3.t: "Spice Gate of the Red Sea"
 oe_red.3.d: "Pepper dhows from Malabar pass through Aden and Massawa toward the Egyptian ports. As Cairo tightens state monopolies and coastal lords contest the transit duties, securing access to the Erythraean spice gate demands a costly strategic choice."
 oe_red.3.a: "Charter Red Sea factorias at Massawa and Aden"
 oe_red.3.a.tt: "Costs #R 120#! gold and #R 1#! manpower; grants [ShowModifier('oe_red_spice_charter')] (#Y 25#! years, higher fort upkeep) and improves ties with Yemen and Red Sea coastal powers."
 oe_red.3.b: "Enforce a crown spice monopoly and heavy escort tariffs"
 oe_red.3.b.tt: "Costs #R 60#! gold and #R 4#! stability; grants [ShowModifier('oe_red_barsbay_monopoly')] (#Y 25#! years, lowering burgher satisfaction and diplomatic reputation)."
 oe_red.4.t: "Survey of the Ancient Canal of Trajan"
 oe_red.4.d: "Ancient chronicles and Egyptian engineers trace the silted bed of the Canal of the Pharaohs and Trajan linking the Nile to Suez. Reopening it would join the Mediterranean to the Indian Ocean, yet shifting dunes and tidal hazards make even the feasibility survey a costly gamble."
 oe_red.4.a: "Commission the full hydraulic survey of Wadi Tumilat and Suez"
 oe_red.4.a.tt: "Costs #R 150#! gold and #R 1.5#! manpower (#R 100#! gold and #R 1#! manpower if Egyptian works are already planned); advances canal stage to #Y 1#!, grants [ShowModifier('oe_red_canal_survey')] (#Y 15#! years), and establishes [ShowModifier('oe_red_suez_survey_camp')] in Suez if owned."
 oe_red.4.b: "Rely on overland camel caravans and port warehouses"
 oe_red.4.b.tt: "Costs #R 60#! gold; keeps overland portage and grants [ShowModifier('oe_red_overland_caravans')] (#Y 20#! years, slight prestige penalty)."
 oe_red.5.t: "Excavating the Canal of the Pharaohs and Trajan"
 oe_red.5.d: "With survey charts laid before the court, the excavation across the Suez isthmus begins in earnest. Nile floods, scorching sands, and fever threaten to devour both treasury and manpower: shall we press corvee labor, pay free hydraulic guilds, or halt the project?"
 oe_red.5.a: "Press the grand excavation with mass corvee levies"
 oe_red.5.a.tt: "Costs #R 350#! gold, #R 4#! manpower, and #R 6#! stability; advances canal to Stage #Y 2#! with [ShowModifier('oe_red_canal_fiscal_strain')] (#Y 12#! years) and [ShowModifier('oe_red_suez_corvee_unrest')] in Suez if owned."
 oe_red.5.b: "Hire free hydraulic guilds and phase the works gradually"
 oe_red.5.b.tt: "Costs #R 480#! gold, #R 1.5#! manpower, and #R 2#! stability; advances canal to Stage #Y 2#! with [ShowModifier('oe_red_canal_guild_debt')] (#Y 12#! years) and lighter [ShowModifier('oe_red_suez_guild_works')] in Suez."
 oe_red.5.c: "Suspend excavation to preserve the treasury"
 oe_red.5.c.tt: "Costs #R 12#! prestige and #R 2#! stability; shelves construction (recoverable later via Suez decision) and grants [ShowModifier('oe_red_canal_retrenchment')] (#Y 10#! years)."
 oe_red.6.t: "Opening of the Roman Red Sea Canal"
 oe_red.6.d: "As the final stone sluice gates swing wide, Nile waters mingle with the Red Sea tide at Suez. Reborn after a millennium, the canal now demands a permanent strategic regime: low tolls to draw the commerce of two oceans, or fortified imperial tolls and naval lock control?"
 oe_red.6.a: "Open the canal under a low-toll maritime charter"
 oe_red.6.a.tt: "Pays final lock costs (#R 150#! gold and #R 2#! stability if already excavated; #R 250#! gold, #R 2#! manpower, #R 3#! stability otherwise); grants #G +20#! prestige, clears work unrest, adds permanent [ShowModifier('oe_red_trajan_canal_open')] to Suez if owned, and grants [ShowModifier('oe_red_free_canal_charter')] (#Y 35#! years)."
 oe_red.6.b: "Impose imperial strait tolls and naval fortress control"
 oe_red.6.b.tt: "Costs #R 120#! gold, #R 1.5#! manpower, and #R 2#! stability; grants #G +15#! prestige, clears work unrest, adds permanent [ShowModifier('oe_red_trajan_canal_fortified')] to Suez if owned, and grants [ShowModifier('oe_red_imperial_canal_tolls')] (#Y 35#! years)."
 oe_red.7.t: "Ethiopian-Roman Red Sea Compact"
 oe_red.7.d: "Ocean-going gunships rounding the Cape and rival eastern empires converge on the Bab el-Mandeb. The Solomonic court proposes a joint Red Sea maritime compact to secure Massawa and the spice lanes, while imperial hawks demand unilateral garrisons at every chokepoint."
 oe_red.7.a: "Ratify the joint Erythraean naval and highland compact"
 oe_red.7.a.tt: "Costs #R 140#! gold and #R 2#! manpower; grants #G +10#! navy tradition, [ShowModifier('oe_red_erythraean_compact')] (#Y 30#! years, slight tax trade-off), and strengthens Ethiopian ties."
 oe_red.7.b: "Fortify independent chokepoints at Suez, Massawa, and Aden"
 oe_red.7.b.tt: "Costs #R 120#! gold and #R 3#! stability; grants #G +8#! army tradition and [ShowModifier('oe_red_chokepoint_garrisons')] (#Y 30#! years, raising fort upkeep and cooling diplomacy)."
 oe_red.8.t: "Gateways of the Erythraean Sea"
 oe_red.8.d: "From Jerusalem's pilgrim roads to the locks of Suez, and from Alexandria's quays to Massawa, Aden, and the Ethiopian highlands, generations of statecraft have bound two seas together. Now the realm seals the enduring order of the Erythraean corridor."
 oe_red.8.a: "Crown the Erythraean thalassocracy across two seas"
 oe_red.8.a.tt: "Completes the Red Sea line; costs #R 200#! gold and #R 4#! stability; grants #G +20#! prestige and [ShowModifier('oe_red_erythraean_hegemony')] (#Y 50#! years, with higher stability and fort upkeep)."
 oe_red.8.b: "Establish a balanced Red Sea and Holy Land commonwealth"
 oe_red.8.b.tt: "Completes the Red Sea line; costs #R 150#! gold and #R 8#! prestige; grants #G +6#! stability and [ShowModifier('oe_red_red_sea_commonwealth')] (#Y 50#! years, slightly reducing crown power)."
 oe_red.20.t: "Red Sea & Trajan's Canal: Choice Takes Effect"
 oe_red.90.t: "[TEST] Red Sea & Trajan's Canal Line: Readings"
 oe_red.90.d: "#T Red Sea & Holy Land#!\nstage(0..8) [ROOT.GetCountry.MakeScope.ScriptValue('oe_red_rd_stage')|0]  holy(1Acc/2Def) [ROOT.GetCountry.MakeScope.ScriptValue('oe_red_rd_holy')|0]  eth(1Br/2Dist) [ROOT.GetCountry.MakeScope.ScriptValue('oe_red_rd_eth')|0]\n#T Trajan's Canal#!\ncanal(0..3/9Halt) [ROOT.GetCountry.MakeScope.ScriptValue('oe_red_rd_canal')|0]  tariff(1Low/2Fort) [ROOT.GetCountry.MakeScope.ScriptValue('oe_red_rd_tariff')|0]\n#T Scheduler#!\nsent [ROOT.GetCountry.MakeScope.ScriptValue('oe_red_rd_cnt')|0]  ran month [ROOT.GetCountry.MakeScope.ScriptValue('oe_red_rd_m')|0]"
 oe_red.90.a: "Close"
 oe_red.90.b: "Refresh"
