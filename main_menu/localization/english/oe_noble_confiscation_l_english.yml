l_english:
 oe_nf_integrate_title: "Assist Provincial Integration"
 oe_nf_integrate_desc: "Enlist a great house’s clients and local connections to bring newly acquired lands under imperial administration.\n\nChoose a province with an unintegrated location. This house receives control of all imperial locations in the province, and their integration progress increases by #G 25 percentage points#!. Rural exclusivity, Mount Athos and permanent provincial protections still apply. No additional cost or cooldown."
 oe_nf_confiscate_house: "#R Confiscate a Great House#!"
 oe_nf_confiscate_house_desc: "Seal the household by imperial decree, seize its property and condemn its kin.\n\n#Y Influence below 300:#! kill all family members resident in Eastern Rome when the order is issued. The privy purse gains #G 5#! gold per point of pre-confiscation Influence; Stability and Legitimacy each fall by #R 0.5#! per point.\n#R Influence of 300 or more:#! immediately start a noble-estate civil war, revoke the house’s status and move all initially resident family members to the rebel country. This outcome requires no ongoing civil war and a populated non-capital location for the rebels."
 OE_NF_CHOOSE_CONFISCATE: "Choose a House to Confiscate"
 OE_NF_ARISTOCRATIC_REBELLION: "Aristocratic House Rebellion"
 oe_nf_integrate_1: "$oe_nf_integrate_title$"
 oe_nf_integrate_1_desc: "$oe_nf_integrate_desc$"
 oe_nf_integrate_2: "$oe_nf_integrate_title$"
 oe_nf_integrate_2_desc: "$oe_nf_integrate_desc$"
 oe_nf_integrate_3: "$oe_nf_integrate_title$"
 oe_nf_integrate_3_desc: "$oe_nf_integrate_desc$"
 OE_PILLARS_AUTHORITY_COURT_BREAKDOWN: "Chief Minister: [GuiScope.SetRoot(InternationalOrganizationsView.GetInternationalOrganization.MakeScope).ScriptValue('oe_court_chancellor_bonus')|+=3] per month. Already included in the displayed monthly change."
 OE_PILLARS_OPINION_COURT_BREAKDOWN: "Universal Judge: [GuiScope.SetRoot(InternationalOrganizationsView.GetInternationalOrganization.MakeScope).ScriptValue('oe_court_judge_bonus')|+=3] per month. Already included in the displayed monthly change."
 oe_nf_integrate_4: "$oe_nf_integrate_title$"
 oe_nf_integrate_4_desc: "$oe_nf_integrate_desc$"
