 STATIC_MODIFIER_NAME_oe_cri2_lia_resilient_agriculture: "Cold-Resilient Agronomy & Granaries"
 STATIC_MODIFIER_DESC_oe_cri2_lia_resilient_agriculture: "Having weathered the Little Ice Age through irrigation works, hardy winter crops, and permanent state granaries, the realm enters a resilient agricultural era."
 STATIC_MODIFIER_NAME_oe_cri2_lia_hardy_crops: "Hardy Winter Crop Diffusion"
 STATIC_MODIFIER_DESC_oe_cri2_lia_hardy_crops: "State-backed adoption of cold-hardy grains, crop rotation, and winter drainage protects harvests through prolonged frosts."
 STATIC_MODIFIER_NAME_oe_cri2_lia_steppe_fortified: "Fortified Frontier Against Steppe Frost"
 STATIC_MODIFIER_DESC_oe_cri2_lia_steppe_fortified: "Frontier ramparts and winter garrisons check nomadic incursions driven south by steppe blizzards, sharpening martial vigilance at the cost of tribal friction."
 STATIC_MODIFIER_NAME_oe_cri2_lia_steppe_trade_peace: "Frontier Tea-and-Grain Horse Markets"
 STATIC_MODIFIER_DESC_oe_cri2_lia_steppe_trade_peace: "Opening state-supervised frontier markets to barter tea and grain for steppe horses calms blizzard-driven raids at a modest fiscal cost."
 STATIC_MODIFIER_NAME_oe_cri2_silver_standard_reformed: "Reformed Silver Standard & Sound Coinage"
 STATIC_MODIFIER_DESC_oe_cri2_silver_standard_reformed: "By unifying bullion assay, commuting levies to assayed silver, and stabilizing sovereign credit, the realm masters the sixteenth-century silver tide."
 STATIC_MODIFIER_NAME_oe_cri2_silver_mint_discipline: "Royal Mint Assay Discipline"
 STATIC_MODIFIER_DESC_oe_cri2_silver_mint_discipline: "Strict assay audits and recall of clipped coins curtail short-term seigniorage while restoring monetary discipline and easing credit costs."
 STATIC_MODIFIER_NAME_oe_cri2_pam_noble_war_pay: "Noble War Indemnities & Fief Guarantees"
 STATIC_MODIFIER_DESC_oe_cri2_pam_noble_war_pay: "Parliament grants war indemnities and estate tax floors to martial nobles, lifting morale and manpower reserves at the expense of crown revenue."
 STATIC_MODIFIER_NAME_oe_cri2_pam_noble_seats: "Hereditary Chancellery & Bench Seats"
 STATIC_MODIFIER_DESC_oe_cri2_pam_noble_seats: "Reserving chancellery and judicial seats for great houses appeases the aristocracy while trimming crown estate power and cabinet efficiency."
 STATIC_MODIFIER_NAME_oe_cri2_pam_silver_exchange: "Silver Tax Commutation & Free Bills"
 STATIC_MODIFIER_DESC_oe_cri2_pam_silver_exchange: "Permitting merchants to clear dues in assayed silver and bills of exchange boosts trade income and cools inflation while trimming direct tax take."
 STATIC_MODIFIER_NAME_oe_cri2_pam_convoy_insurance: "Maritime Convoy Insurance & Port Rebates"
 STATIC_MODIFIER_DESC_oe_cri2_pam_convoy_insurance: "Co-sponsored naval convoys and port rebates boost maritime commerce and deter piracy while adding to fleet upkeep costs."
 STATIC_MODIFIER_NAME_oe_cri2_pam_municipal_mint: "Municipal Mint & Weights Autonomy"
 STATIC_MODIFIER_DESC_oe_cri2_pam_municipal_mint: "Granting chartered towns autonomy over petty coinage and standard weights lifts workshop production and burgher loyalty while trimming royal seigniorage."
 STATIC_MODIFIER_NAME_oe_cri2_pam_clergy_charity: "Parish Famine Charity & Almonries"
 STATIC_MODIFIER_DESC_oe_cri2_pam_clergy_charity: "Endowing parish almonries and monastic relief kitchens expands food storage, calms peasant distress, and curbs rebel growth."
 STATIC_MODIFIER_NAME_oe_cri2_pam_seminary: "Seminary & Scriptorium Patronage"
 STATIC_MODIFIER_DESC_oe_cri2_pam_seminary: "Funding seminaries and scriptoria raises literacy and true-faith cohesion while scholastic conservatism slightly tempers secular research speed."
 STATIC_MODIFIER_NAME_oe_cri2_pam_open_granary: "Open Ever-Normal Granaries at Par"
 STATIC_MODIFIER_DESC_oe_cri2_pam_open_granary: "Opening state granaries at fixed prices boosts national food availability and purchasing power at the cost of reduced fiscal returns."
 STATIC_MODIFIER_NAME_oe_cri2_pam_corvee_cap: "Statutory Corvee Cap & Levy Ban"
 STATIC_MODIFIER_DESC_oe_cri2_pam_corvee_cap: "Capping unpaid corvee labor raises rural raw material output and peasant satisfaction while slowing state construction projects."
 STATIC_MODIFIER_NAME_oe_cri2_pam_cossack_register: "Expanded Free Cossack Register"
 STATIC_MODIFIER_DESC_oe_cri2_pam_cossack_register: "Enlarging the tax-exempt registered Cossack host swells manpower and deepens hostile attrition across the marches at a modest tax cost."
 STATIC_MODIFIER_NAME_oe_cri2_pam_pasture_rights: "Confirmed Frontier Pasture & Caravan Rights"
 STATIC_MODIFIER_DESC_oe_cri2_pam_pasture_rights: "Recognizing traditional pasture bounds and caravan tolls extends military logistics and satisfies tribal chiefs while softening central control."
 STATIC_MODIFIER_NAME_oe_cri2_pam_millet_autonomy: "Chartered Merchant & Millet Autonomy"
 STATIC_MODIFIER_DESC_oe_cri2_pam_millet_autonomy: "Codifying autonomous community charters strengthens heathen tolerance and commercial revenues while slightly irritating orthodox clergy."
 STATIC_MODIFIER_NAME_oe_cri2_charter_peasant_relief: "Charter of Peasant Land Relief"
 STATIC_MODIFIER_DESC_oe_cri2_charter_peasant_relief: "Forced by rural uprising to enact land-and-tax relief, the crown trims fiscal extraction and improves food security while curbing noble dues."
 STATIC_MODIFIER_NAME_oe_cri2_charter_free_cities: "Charter of Free Cities & Capped Tariffs"
 STATIC_MODIFIER_DESC_oe_cri2_charter_free_cities: "Urban communes secure municipal charters capping commercial tolls: trade and merchant power flourish at the expense of royal control and crown estate weight."
 STATIC_MODIFIER_NAME_oe_cri2_charter_noble_magna_carta: "Aristocratic Great Charter"
 STATIC_MODIFIER_DESC_oe_cri2_charter_noble_magna_carta: "Baronial leagues compel a Great Charter curtailing royal absolutism: parliament and feudal levies grow stronger while crown estate power and centralization retreat."
 STATIC_MODIFIER_NAME_oe_cri2_charter_religious_toleration: "Edict of Conscience & Toleration"
 STATIC_MODIFIER_DESC_oe_cri2_charter_religious_toleration: "In the spirit of the Edict of Nantes and the Warsaw Confederation, royal decree guarantees freedom of worship, angering rigid clerics while calming sectarian rebellion."
 STATIC_MODIFIER_NAME_oe_cri2_charter_cossack_hetmanate: "Charter of the Free Cossack Hetmanate"
 STATIC_MODIFIER_DESC_oe_cri2_charter_cossack_hetmanate: "Frontier Cossacks secure registered autonomy and self-governing hosts, reinforcing imperial manpower while trading away maximum central control and tax yield."
 STATIC_MODIFIER_NAME_oe_cri2_charter_steppe_autonomy: "Steppe & Frontier Tribal Compact"
 STATIC_MODIFIER_DESC_oe_cri2_charter_steppe_autonomy: "A negotiated frontier compact affirms tribal self-rule in exchange for steppe logistics and pastoral output, trading central control for border stability."
