 oe_cri2_lia_famine_relief_demand: "Little Ice Age Granary Relief Demand"
 oe_cri2_lia_famine_relief_demand_desc: "During harsh Little Ice Age winters, state granaries procure emergency wheat, salt, and timber reserves to calm famine prices and shelter stricken provinces."
 STATIC_MODIFIER_NAME_oe_cri2_mild_crisis_buffer: "Mild Historic Crisis Buffer"
