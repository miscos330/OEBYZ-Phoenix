 oe_cri2.1.title: "Bitter Frost: The Little Ice Age Descends"
 oe_cri2.1.desc: "Unseasonable frosts and frozen waterways have ruined harvests across the northern marches. Provincial dispatches warn of soaring grain prices and gathering refugees; the court must set an immediate crisis strategy."
 oe_cri2.1.a: "Mobilize emergency funds to feed markets and starving provinces"
 oe_cri2.1.b: "Order local magistrates to cope while preserving the treasury"
 oe_cri2.2.title: "Frozen Waterways & Soaring Grain"
 oe_cri2.2.desc: "Bitter gales have locked rivers and canals beneath solid ice, halting grain barges and driving urban food prices sky-high. Crowds gather outside state storehouses demanding relief."
 oe_cri2.2.a: "Open state granaries at par (halved cost & double relief with Ever-Normal Granary!)"
 oe_cri2.2.b: "Impose emergency price ceilings and punish hoarders"
 oe_cri2.2.c: "Allow merchants to clear shortages at market prices"
 oe_cri2.3.title: "Imperial Grain Convoys: Nile Ships & Southern Sea-Transport"
 oe_cri2.3.desc: "While frost grips the northern heartland, distant breadbaskets and maritime grain lanes remain open. Naval and treasury officials propose dispatching emergency grain convoys."
 oe_cri2.3.a: "Dispatch Alexandria Nile grain ships directly to stricken markets"
 oe_cri2.3.b: "Run twin Grand Canal and maritime Haiyun grain convoys northward"
 oe_cri2.3.c: "Charter coastal merchant barges to move surplus grain"
 oe_cri2.4.title: "Dzud on the Steppe: Nomadic Pressure"
 oe_cri2.4.desc: "A catastrophic winter blizzard has decimated herds across the northern steppes. Desperate nomadic clans press toward the settled frontier, seeking grain barter or plunder."
 oe_cri2.4.a: "Open frontier tea-and-grain horse markets to pacify the tribes"
 oe_cri2.4.b: "Reinforce frontier ramparts and winter garrisons against raids"
 oe_cri2.5.title: "Hardy Crops & Deep-Winter Agronomy"
 oe_cri2.5.desc: "Agronomists report that cold-hardy grains, deep ploughing, and improved drainage have spared model estates from frost damage. Treasury sponsorship could scale these methods nationwide."
 oe_cri2.5.a: "Sponsor cold-hardy crops and winter irrigation across the realm"
 oe_cri2.5.b: "Leave adoption to private estates without treasury spending"
 oe_cri2.6.title: "Famine Refugees & Rural Petitions"
 oe_cri2.6.desc: "Displaced families from frost-stricken districts crowd the outskirts of major cities, presenting rural petitions for tax remission. Mishandled, hunger could ignite widespread revolt."
 oe_cri2.6.a: "Grant emergency tax remission and shelter to calm the refugees"
 oe_cri2.6.b: "Disperse the crowds by force and insist on full tax collection"
 oe_cri2.7.title: "The Silver Tide: Price Revolution Begins"
 oe_cri2.7.desc: "Treasure ships laden with Andean and Japanese silver flood Eurasian clearinghouses. Prices climb year after year while fixed tax yields erode, plunging treasury and guilds alike into a monetary storm."
 oe_cri2.7.a: "Enforce strict mint assay discipline and curb seigniorage"
 oe_cri2.7.b: "Coin the bullion windfall now and postpone structural reform"
 oe_cri2.8.title: "Andean & Iwami Bullion Floods Eurasian Ports"
 oe_cri2.8.desc: "Chests of silver bullion bid up silk, porcelain, and pepper across Eurasian entrepots. Customs officers favor taxing transit bullion to guide capital, while urban guilds fear runaway living costs."
 oe_cri2.8.a: "Levy standardized assay duties on transit bullion for reform reserves"
 oe_cri2.8.b: "Grant commercial rebates to stabilize guild workshops"
 oe_cri2.9.title: "Single Whip Tax & Silver-Backed Chao"
 oe_cri2.9.desc: "Confronting the surging silver tide, treasury ministers propose consolidating tangled levies and corvee into a unified silver-assessed Single Whip tax—or anchoring paper Chao notes directly to assayed silver."
 oe_cri2.9.a: "Enact Single Whip & Silver-Anchored Chao to master the Price Revolution!"
 oe_cri2.9.b: "Demonetize failing notes and rebuild on hard silver"
 oe_cri2.9.c: "Pilot silver tax commutation across core provinces"
 oe_cri2.10.title: "Debased Coinage & Garrison Unrest"
 oe_cri2.10.desc: "Runaway prices have gutted fixed garrison stipends, and elite regiments protest being paid in clipped, debased silver coin. Restoring full-weight coin is costly, yet ignoring the barracks risks mutiny."
 oe_cri2.10.a: "Restrike full-weight silver coinage for garrison pay"
 oe_cri2.10.b: "Force debased silver coin onto the payroll to save cash"
 oe_cri2.11.title: "Sovereign Credit Strain & Shadow of Default"
 oe_cri2.11.desc: "Alarmed by persistent inflation, major banking houses hike sovereign loan rates and tighten credit lines. Without a disciplined rescheduling pact, the crown risks a damaging default."
 oe_cri2.11.a: "Negotiate an orderly banking moratorium and fiscal restraint"
 oe_cri2.11.b: "Unilaterally suspend crown debt coupons for immediate cash"
 oe_cri2.12.title: "Restructuring Sovereign Bonds in Silver"
 oe_cri2.12.desc: "Clearinghouses in Constantinople, Venice, and Genoa warn that bullion shifts have distorted outstanding imperial sovereign bonds. How the crown settles coupons will define sovereign credit for decades."
 oe_cri2.12.a: "Honor sovereign bonds in assayed silver to cement imperial credit"
 oe_cri2.12.b: "Offset part of the bond coupons with commercial concessions"
 oe_cri2.13.title: "Sound Coinage & Silver Standard Triumphant"
 oe_cri2.13.desc: "With full-weight coinage circulating smoothly, silver-assessed taxation established, and inflation tamed, the sixteenth-century Silver Price Revolution draws to a triumphant close."
 oe_cri2.13.a: "Celebrate sound coinage and enter a new commercial age"
 oe_cri2.14.title: "Bullion Volatility & Merchant Runs"
 oe_cri2.14.desc: "Delayed bullion convoys trigger a sharp liquidity squeeze and runs on merchant bills of exchange. Should the treasury backstop clearinghouses or let speculative houses fail?"
 oe_cri2.14.a: "Deploy treasury reserves to steady the clearinghouses"
 oe_cri2.14.b: "Let speculative merchant houses absorb their own losses"
 oe_cri2.15.title: "The Frost Recedes: Little Ice Age Overcome"
 oe_cri2.15.desc: "Frozen rivers thaw into spring currents, state granaries stand full, and hardy crops paired with winter irrigation have turned scarcity into endurance. The realm emerges hardened and renewed."
 oe_cri2.15.a: "Reward agrarian officials and enshrine the granary system"
