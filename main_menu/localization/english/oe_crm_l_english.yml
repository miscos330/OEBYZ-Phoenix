 oe_crm.1.desc_x: "#F In 1365, while the Golden Horde was in turmoil, the Genoese of Caffa seized Sougdaia, which the Italians call Soldaia. It is one of the oldest Greek cities of the northern shore of the Black Sea, and its metropolitan has always been consecrated at Constantinople.#!\n\nNow the banner of Saint George flies over the walls, and the Greeks of the city and their churches answer to a Latin consul. The news has reached the capital, and the patriarch's clergy ask whether the emperor will take the matter up."
 oe_crm.1.a: "Write to the consul of Caffa for a guarantee for the metropolitan and the Greeks of the city"
 oe_crm.1.a.tt: "Costs #R 1#! month of trade and tax income\n[Concept('oe_tu_patriarchate','patriarchal standing')|e] #G +1#!\nCaffa: opinion of the empire #G +5#! for #Y 5#! years"
 oe_crm.1.b: "Use the moment to open ties with the Greeks of the northern shore"
 oe_crm.1.b.tt: "Theodoro: opinion of the empire #G +10#! for #Y 10#! years\nGothia will remember this\nCaffa: opinion of the empire #R −5#! for #Y 5#! years"
 oe_crm.1.c: "The northern shore is beyond the empire's reach"
 oe_crm.1.c.tt: "The empire lets the matter rest"
 oe_crm.2.t: "The Suit of the Three Metropolitans"
 oe_crm.2.desc_luw: "#F In 1380 and 1381 the khan's governor twice made terms with Caffa and ceded the coast from Cembalo to Soldaia to the Genoese. Two dioceses of the southern shore had belonged to the Metropolitans of Gothia and of Sougdaia; once the coast changed hands the Metropolitan of Cherson laid claim to them, with the new masters of Caffa behind the claim. The suit dragged on at the patriarchate for eight years and left five documents behind.#!\n\nNow the envoys of all three metropolitans are in the capital, each with a different story, waiting for the emperor and the patriarch to decide. The one who once took the throne with Genoese help leaned towards Cherson in the same way. There is fighting on the northern shore, and the Genoese are in no mood to yield."
 oe_crm.2.desc_lu: "#F In 1380 and 1381 the khan's governor twice made terms with Caffa and ceded the coast from Cembalo to Soldaia to the Genoese. Two dioceses of the southern shore had belonged to the Metropolitans of Gothia and of Sougdaia; once the coast changed hands the Metropolitan of Cherson laid claim to them, with the new masters of Caffa behind the claim. The suit dragged on at the patriarchate for eight years and left five documents behind.#!\n\nNow the envoys of all three metropolitans are in the capital, each with a different story, waiting for the emperor and the patriarch to decide. The one who once took the throne with Genoese help leaned towards Cherson in the same way."
