 OE_CRM_SU_W: "The suit of the metropolitans: it has not yet come before the capital."
 OE_CRM_SK_1: "The Solkhat war: Caffa is fighting the governor of the steppe."
 OE_CRM_SK_2: "The Solkhat war: peace was made, and each side kept its old lines."
