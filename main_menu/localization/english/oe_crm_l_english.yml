 oe_crm.11.t: "The Lament for the City of Theodoro"
 oe_crm.11.desc_c: "#F The monk Matthew came back from the northern shore of the Black Sea with a long poem: the city of Theodoro on its mountain had been stormed by barbarians, and its palace and churches lay in ruins. Some say it was the army of Timur; the poem gives no name.#!\n\nNow the poem is being copied in the capital. The faithful of Gothia belong to our patriarch, and [GetCountry('FEO').GetGovernment.GetRuler.GetFirstNameWithNoTooltip], the Lord of Gothia, is trying to gather what is left. But the capital itself is under the sultan's blockade, short of bread and of hands."
 oe_crm.11.desc_x: "#F The monk Matthew came back from the northern shore of the Black Sea with a long poem: the city of Theodoro on its mountain had been stormed by barbarians, and its palace and churches lay in ruins. Some say it was the army of Timur; the poem gives no name.#!\n\nNow the poem is being copied in the capital. The faithful of Gothia belong to our patriarch, and [GetCountry('FEO').GetGovernment.GetRuler.GetFirstNameWithNoTooltip], the Lord of Gothia, is trying to gather what is left."
 oe_crm.11.a: "Send the patriarch's clergy north with money to comfort the faithful of Gothia"
 oe_crm.11.a.tt: "Costs #R 1#! month of trade and tax income\n[Concept('oe_tu_patriarchate','patriarchal standing')|e] #G +1#!\nTheodoro: opinion of the empire #G +15#! for #Y 10#! years\nGothia will remember this"
 oe_crm.11.b: "Take in the Greeks who have crossed the sea from the northern shore"
 oe_crm.11.b.tt: "The empire gains [ShowModifier('oe_crm_north_craftsmen')] for #Y 5#! years: trade income #G +2%#!"
 oe_crm.11.c: "We have troubles enough of our own"
 oe_crm.11.c.tt: "The empire lets the matter rest"
 oe_crm.12.t: "A Bride for Gothia"
 oe_crm.12.desc_ltr: "#F From 1422 Alexios, Lord of Gothia, fought the Genoese for the coast they held, and Caffa spent heavily to stop the attack. The city of Theodoro on its mountain was built up again. In an inscription of 1425 the lord is styled 'Lord of the City of Theodoro and of the Coast'; in the same year the lord's eldest son married a lady of both Palaiologan and Asen descent. It is said that from then on the double-headed eagle was carved on the stones of Mangup.#!\n\nNow envoys of [GetCountry('FEO').GetGovernment.GetRuler.GetFirstNameWithNoTooltip] have come to the capital to ask for a bride of imperial blood for the heir. The empire has not forgotten the northern shore in these years, and the envoys speak all the more warmly. It is said that the court of Trebizond is also negotiating a marriage with Mangup."
