 oe_crm.2.b.tt: "Theodoro: opinion of the empire #G +20#! for #Y 10#! years\nGothia will remember this\nCaffa: opinion of the empire #R −10#! for #Y 10#! years\nGenoa: opinion of the empire #R −10#! for #Y 10#! years\n[Concept('oe_tu_patriarchate','patriarchal standing')|e] #G +1#!"
