 oe_crm.1.t: "A New Banner over Sougdaia"
 oe_crm.1.desc_gd: "#F In 1365, while the Golden Horde was in turmoil, the Genoese of Caffa seized Sougdaia, which the Italians call Soldaia. It is one of the oldest Greek cities of the northern shore of the Black Sea, and its metropolitan has always been consecrated at Constantinople.#!\n\nNow the banner of Saint George flies over the walls, and the Greeks of the city and their churches answer to a Latin consul. The news has reached the capital, and the patriarch's clergy ask whether the emperor will take the matter up. Our grain agreement with the northern shore still stands, and this is no time for a quarrel. The Genoese of Pera say it is good for everyone's trade."
 oe_crm.1.desc_g: "#F In 1365, while the Golden Horde was in turmoil, the Genoese of Caffa seized Sougdaia, which the Italians call Soldaia. It is one of the oldest Greek cities of the northern shore of the Black Sea, and its metropolitan has always been consecrated at Constantinople.#!\n\nNow the banner of Saint George flies over the walls, and the Greeks of the city and their churches answer to a Latin consul. The news has reached the capital, and the patriarch's clergy ask whether the emperor will take the matter up. Our grain agreement with the northern shore still stands, and this is no time for a quarrel."
