 oe_crm.12.b: "Send a letter of good wishes and the gift of a double-headed eagle banner"
 oe_crm.12.b.tt: "Theodoro: opinion of the empire #G +10#! for #Y 10#! years\nGothia will remember this"
 oe_crm.12.c: "The imperial name is not given in marriage abroad"
 oe_crm.12.c.tt: "Theodoro: opinion of the empire #R −10#! for #Y 10#! years"
 oe_crm.13.t: "The Fleet for Cembalo"
 oe_crm.13.desc_lkd: "#F In 1433 the Greeks of Cembalo rose, drove out the Genoese and gave the town to Alexios, Lord of Gothia. Genoa resolved to fit out a fleet at home and take the town back. There is only one way by water into the Black Sea, and it runs under our walls. In March 1434 Carlo Lomellino sailed from Genoa with some twenty ships.#!\n\nNow the Genoese fleet is nearing the straits. The lady who was married to Mangup is waiting for word from the capital as well. By treaty Genoese ships pass the straits free of toll and need not ask us at all."
