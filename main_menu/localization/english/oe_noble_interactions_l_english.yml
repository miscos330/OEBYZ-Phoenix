l_english:
 oe_npi_support: "Request Political Support"
 oe_npi_support_desc: "The great houses have clients throughout court and countryside. A fitting gift can secure their public support for the Emperor.\n\nRequires loyalty above 50, opinion of Eastern Rome above 100, and a privy purse sufficient to pay three months of recurring income. The house receives the full payment; gain 2 Authority. Shared nationwide cooldown: 12 months."
 oe_npi_honor: "Bestow a Court Dignity"
 oe_npi_honor_desc: "A decree read before the court grants the house an honored dignity. Imperial favor binds its allegiance while strengthening its political standing.\n\nRequires loyalty above 50 and opinion of Eastern Rome above 50. Spend 1 Authority; the house gains 2 Influence, +50 opinion of Eastern Rome and +10 Loyalty. Opinion and Loyalty bonuses last 3 years. Cooldown per house: 36 months."
 oe_npi_recommend: "Request a Recommended Retainer"
 oe_npi_recommend_desc: "Ask the head of the house to select a capable client and send them to the imperial court with a letter of recommendation. Their service will honor the Emperor and enhance their patron’s standing.\n\nRequires loyalty above 50 and opinion of Eastern Rome above 150. Spend 1 Authority; the house gains 2 Influence. The recommended courtier is Roman and Orthodox, with at least one administrative, diplomatic or military ability above 65. Cooldown per house: 36 months."
 OE_NPI_SELECT_HOUSE: "Select a Noble House"
 OE_NPI_LOYALTY_50: "House Loyalty is above #Y 50#!"
 OE_NPI_RELATIONS_50: "The house’s opinion of Eastern Rome is above #Y 50#!"
 OE_NPI_RELATIONS_100: "The house’s opinion of Eastern Rome is above #Y 100#!"
 OE_NPI_RELATIONS_150: "The house’s opinion of Eastern Rome is above #Y 150#!"
 OE_NPI_SUPPORT_COOLDOWN: "No house has been asked for political support nationwide in the past #Y 12 months#!"
 OE_NPI_HONOR_COOLDOWN: "This house has not received a court dignity in the past #Y 36 months#!"
 OE_NPI_RECOMMEND_COOLDOWN: "This house has not been asked to recommend a retainer in the past #Y 36 months#!"
 OE_NPI_PURSE_REQUIRED: "The privy purse can cover three months of recurring income"
 OE_NPI_AUTHORITY_REQUIRED: "At least #Y 1#! Authority is available"
 OE_NPI_SUPPORT_EFFECT: "Transfer three months of recurring privy-purse income to the selected house; gain #G 2#! Authority. Begin the nationwide #Y 12-month#! cooldown."
 OE_NPI_HONOR_EFFECT: "Spend #R 1#! Authority. The house gains #G 2#! Influence, #G 50#! opinion of Eastern Rome and #G 10#! Loyalty. Opinion and Loyalty last #Y 3 years#!; the dignity cooldown for this house is #Y 36 months#!."
 OE_NPI_RECOMMEND_EFFECT: "Spend #R 1#! Authority. The house gains #G 2#! Influence. Recruit a Roman Orthodox client recommended by the house, with at least one ability above #Y 65#!. The recommendation cooldown for this house is #Y 36 months#!."
 oe_npi_court_honor_opinion: "Imperial Court Dignity"
 STATIC_MODIFIER_NAME_oe_npi_court_honor: "Imperial Court Dignity"
 STATIC_MODIFIER_DESC_oe_npi_court_honor: "An imperial dignity strengthens this house’s allegiance to the court."
 oe_npi_support_cd: "Political Support: Nationwide Cooldown"
 oe_npi_honor_cd: "Court Dignity: House Cooldown"
 oe_npi_recommend_cd: "Recommendation: House Cooldown"
 oe_np_monthly_change: "Monthly House Influence Change"
 oe_noble_interactions.1.t: "A Worthy Retainer"
 oe_noble_interactions.1.d: "At the Emperor’s request, [scope:oe_npi_patron.GetName] has selected a promising client from the household’s retainers. [scope:oe_npi_recommended.GetName] has now arrived in Constantinople bearing a letter of recommendation and an offer of service.\n\nThis Orthodox Roman has joined our court. The seal upon the letter vouches for their merit—and reminds the court of the patron who opened its doors."
 oe_noble_interactions.1.a: "Receive them into imperial service."
