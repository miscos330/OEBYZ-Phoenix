 STATIC_MODIFIER_DESC_oe_twe_adriatic_accord_mod: "Keeping Adriatic sea lanes open amid imperial rivalry steadies commerce and diplomacy at a small cost to imperial pride."
 STATIC_MODIFIER_DESC_oe_twe_concord_talks_mod: "Dedicated envoys negotiate protocol and borders between the two courts, aiding diplomacy and stability while curbing triumphalist rhetoric."
 STATIC_MODIFIER_DESC_oe_twe_concordat_mod: "Both emperors recognize one another's crowns along an agreed European boundary, fostering trade and stability at a modest toll to imperial pride."
 STATIC_MODIFIER_DESC_oe_twe_danube_alert_mod: "Fortresses along the Danube and Adriatic stand at high readiness, bolstering defense and morale at steeper military upkeep."
 STATIC_MODIFIER_DESC_oe_twe_envoy_detente_mod: "Envoys shuttle between Constantinople and the Imperial court to draft a settlement, easing tension while costing hawkish prestige."
 STATIC_MODIFIER_DESC_oe_twe_french_subsidy_mod: "Paris quietly backs New Rome against Central European hegemony, boosting trade and diplomacy while alienating Catholic clergy."
 STATIC_MODIFIER_DESC_oe_twe_hre_bulwark_mod: "The Imperial Diet reaffirms the Golden Bull and rallies its banners, lifting army morale at heavier upkeep cost."
 STATIC_MODIFIER_DESC_oe_twe_hre_vindicated_mod: "The Holy Roman Empire withstands Eastern pressure, restoring imperial authority and prestige while maintaining costly frontier readiness."
 STATIC_MODIFIER_DESC_oe_twe_imperial_diet_schism_mod: "Exploiting Europe's confessional war expands diplomatic reach and discipline while provoking domestic clerical disapproval."
 STATIC_MODIFIER_DESC_oe_twe_old_order_shaken_mod: "Revolutionary tides sweep Europe, overshadowing ancient disputes of Roman translatio while destabilizing the old imperial edifice."
 STATIC_MODIFIER_DESC_oe_twe_papal_crown_mod: "Rome and the Electors arbitrate the clash of crowns, gaining diplomatic stature while bearing the strain of upholding the old order."
 STATIC_MODIFIER_DESC_oe_twe_prot_eastern_relief_mod: "Protestant princes coordinate quietly with New Rome to relieve Imperial pressure, strengthening defense and morale at diplomatic cost."
 STATIC_MODIFIER_DESC_oe_twe_translatio_edict_mod: "Constantinople proclaims sole Roman imperium, raising prestige and assertiveness at the price of Western diplomatic alienation."
 STATIC_MODIFIER_DESC_oe_twe_unus_imperator_mod: "With the rival Western empire dismantled, one Roman Emperor stands unchallenged—at the lasting burden of ruling vast domains and restive nobles."
 STATIC_MODIFIER_DESC_oe_twe_west_retreat_mod: "Worsted in the struggle of the Two Emperors, New Rome retreats from western ambitions, suffering twenty years of tarnished prestige and diplomacy while consolidating its core."
