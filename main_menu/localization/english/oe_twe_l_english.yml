 oe_twe_act_french_counterweight_desc: "France spends 150+ gold, angers Catholic clergy, and loses 20 opinion with the Papacy and Emperor to back New Rome: Balance #G +6#!, Tension #R +4#!, +35 mutual Franco-Roman opinion, and a 5-year pact modifier. Cooldown: 6 years."
