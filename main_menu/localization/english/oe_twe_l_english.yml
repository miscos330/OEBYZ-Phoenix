 oe_sit_two_emperors: "The Contest of Two Emperors"
 oe_sit_two_emperors_desc: "Dormant since Charlemagne's coronation in 800, the Zweikaiserproblem erupts as New Rome returns to Italy, Illyricum, and the Danube. Constantinople and the Holy Roman Emperor contest sole Roman legitimacy while France, the Papacy, Electors, and confessional leagues maneuver across Europe."
 oe_sit_two_emperors_outcome_concord: "Pax Duorum Imperiorum"
 oe_sit_two_emperors_outcome_concord_desc: "Concord reaches 80 while Balance stays between 35 and 65 for 12 consecutive months at peace. Both emperors ratify the Concordat of the Two Romes, mutually recognizing their titles."
 oe_sit_two_emperors_outcome_retreat: "Imperial Retreat"
 oe_sit_two_emperors_outcome_retreat_desc: "Balance drops to 15 or below, New Rome falls, or after 1680 New Rome holds zero contested hubs with Balance <= 35. The HRE is vindicated while East Rome endures a twenty-year retreat penalty."
 oe_sit_two_emperors_outcome_revolution: "Fall of the Old Imperial Order"
 oe_sit_two_emperors_outcome_revolution_desc: "The Age of Revolutions dawns with the Revolution active (or the year 1790 arrives). Revolutionary ideologies eclipse ancient disputes of Roman translatio, closing the rivalry as the old order trembles."
 oe_sit_two_emperors_outcome_unus: "Unus Imperator"
 oe_sit_two_emperors_outcome_unus_desc: "Imperial Balance reaches 85, or New Rome directly holds Rome alongside Vienna or Aachen for 12 months (or the HRE loses its Emperor). The Holy Roman Empire is dismantled, leaving one Roman Emperor."
 oe_twe.1.a: "There can be only one Roman Emperor!"
 oe_twe.1.b: "Keep diplomatic channels open and test the waters."
 oe_twe.1.d: "The purple seal of Constantinople and the Golden Bull of the Holy Roman Empire now collide across Italy, Illyricum, and the Danube. A legitimacy rift opened in 800 can no longer be ignored as French, papal, electoral, and confessional envoys converge on both courts."
 oe_twe.1.t: "The Contest of Two Emperors: Who Rules Rome?"
 oe_twe.10.a: "The old order fades; brace for the age of revolutions."
 oe_twe.10.d: "Enlightenment ideals and revolutionary fervor sweep across Europe, eclipsing eight-hundred-year debates over imperial translatio. The Contest of Two Emperors closes as both ancient realms brace for the storm of the Revolutionary Age."
 oe_twe.10.t: "Fall of the Old Imperial Order"
 oe_twe.2.a: "Fund legal manifestos and press our imperial claim."
 oe_twe.2.b: "De-escalate the polemic and signal openness to talks."
 oe_twe.2.d: "As tension rises, papal jurists and imperial chanceries clash over Translatio Imperii. The West invokes papal coronation and the Golden Bull; the East cites Justinian's law and unbroken Roman continuity."
 oe_twe.2.t: "Papal Protest & the Debate of Translatio Imperii"
 oe_twe.20.t: "The Contest of Two Emperors: Outcome Resolution"
 oe_twe.3.a: "Fortify the Danube and Adriatic approaches!"
 oe_twe.3.b: "Arrange pragmatic Adriatic transit to avoid attrition."
 oe_twe.3.d: "Garrisons around Buda, Ravenna, and the Adriatic trade provocations as frontier commanders warn of open war. Will the crown pour treasure into fortifications or arrange a pragmatic transit truce?"
 oe_twe.3.t: "Flashpoint on the Danube & Adriatic"
 oe_twe.4.a: "Accept the compact and counterbalance Central Europe."
 oe_twe.4.b: "Decline the intrigue and preserve diplomatic restraint."
 oe_twe.4.d: "Seeking to break Central European encirclement, French envoys quietly propose trade privileges and secret subsidies to align Paris with Constantinople—a realpolitik gambit sure to outrage conservative clergy."
 oe_twe.4.t: "French Counterweight: Envoys from Paris"
 oe_twe.5.a: "Exploit the religious war to expand our leverage."
 oe_twe.5.b: "Steady the realm and push for detente amid exhaustion."
 oe_twe.5.d: "The Protestant Union and Catholic League lock horns across Germany, engulfing the Holy Roman Empire in confessional war. The Two Emperors may exploit the upheaval to redraw Europe or seek respite amid exhaustion."
 oe_twe.5.t: "Twin Eagles Amid the War of Religions"
 oe_twe.6.a: "Fund the permanent mission toward the Concordat."
 oe_twe.6.b: "Reject the draft and reassert uncompromising dignity."
 oe_twe.6.d: "After years of quiet diplomacy, envoys from Vienna and Constantinople sit down to draft the Danube-Apennine Charter: mutual imperial recognition, commercial corridors, and frontier restraint. Hawks call it surrender; pragmatists see a century of peace."
 oe_twe.6.t: "Envoys of the Two Romes: Blueprint for Concord"
 oe_twe.7.a: "One Rome, one Emperor—forevermore!"
 oe_twe.7.d: "With the Holy Roman Empire formally dissolved, the Zweikaiserproblem that began in 800 reaches its decisive end. New Rome stands as the sole Roman imperium—now facing the immense task of governing vast lands and restive nobility."
 oe_twe.7.t: "Unus Imperator"
 oe_twe.8.a: "May the Two Romes endure in peace and commerce."
 oe_twe.8.d: "Before the courts of Europe, both emperors seal the Danube-Apennine Charter, mutually recognizing each other's imperial crowns and spheres. Though imperial pride yields a step, a golden age of cross-European trade and diplomacy opens."
 oe_twe.8.t: "Pax Duorum Imperiorum"
 oe_twe.9.a: "Accept the verdict and look to the empire's borders."
 oe_twe.9.d: "After protracted rivalry, the Eastern Roman push into Italy and the Danube falters. The Holy Roman Emperor emerges vindicated across Central Europe, while Constantinople must pull back and endure twenty years of diminished western standing."
 oe_twe.9.t: "Imperial Retreat"
 oe_twe.90.a: "Understood."
