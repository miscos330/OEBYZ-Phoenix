 oe_twe_act_translatio_edict_cd: "Proclaim the Edict of Sole Imperium"
 oe_twe_act_translatio_edict_desc: "East Rome spends 180+ gold and suffers −1 Diplomatic Reputation (5y) plus −25 opinion with the HRE Emperor and Papacy; Imperial Balance shifts #G +8#! (+4 extra with 3+ hubs) and Tension rises #R +6#!. Cooldown: 5 years."
 oe_twe_act_two_romes_envoy: "Dispatch Envoys of the Two Romes"
 oe_twe_act_two_romes_envoy_cd: "Dispatch Envoys of the Two Romes"
 oe_twe_act_two_romes_envoy_desc: "At peace with Tension below 75, either Emperor spends 120+ gold and 8 prestige to advance detente: Concord #G +14#!, Tension #G −8#!, and Balance nudged 4 points toward 50. Cooldown: 5 years."
