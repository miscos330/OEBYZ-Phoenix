 oe_twe_act_papal_arbitration: "Papal & Electoral Crown Arbitration"
 oe_twe_act_papal_arbitration_cd: "Papal & Electoral Crown Arbitration"
 oe_twe_act_papal_arbitration_desc: "The Papacy or an HRE Elector spends 120+ gold and 10 religious influence (or prestige) for a 5-year arbitration modifier; when Tension >= 50 or East leads, raises Concord #G +5#! and cuts Tension −3, otherwise bolsters the Western crown (−3 Balance, +2 Tension; global 1-year throttle). Personal cooldown: 6 years."
 oe_twe_act_protestant_subsidy: "Protestant Eastern Overture"
 oe_twe_act_protestant_subsidy_cd: "Protestant Eastern Overture"
 oe_twe_act_protestant_subsidy_desc: "Protestant or Protestant Union states spend 100+ gold and 2.5 stability to coordinate with Constantinople: 5-year defense/morale relief, −25 Emperor/Papal opinion, plus Balance #G +3#! and Tension #R +3#! (global 1-year throttle). Personal cooldown: 6 years."
