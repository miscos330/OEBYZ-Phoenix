 oe_v58_afr_out_golden_caravan_supremacy:0 "Golden Caravan Supremacy"
 oe_v58_afr_out_golden_caravan_supremacy_desc:0 "Guarded desert wells, Sankore libraries, and Zimbabwe reef mines anchor an unmatched inland gold-and-learning order."
 oe_v58_afr_out_shifting_trade_winds:0 "Shifting Trade Winds of the Continent"
 oe_v58_afr_out_shifting_trade_winds_desc:0 "As oceanic routes evolve, resilient African kingdoms adapt their gold trails, libraries, and coastal ports to a new era."
 oe_v58_afr_out_sovereign_monsoon_ocean:0 "Sovereign Monsoon & Atlantic Network"
 oe_v58_afr_out_sovereign_monsoon_ocean_desc:0 "Swahili dhows and Kongolese royal embassies secure African maritime independence across the Indian and Atlantic oceans."
 oe_v58_afr_ref_bornu_aluma_ribat_order:0 "Sayfawa & Sahel Ribat Musketeer Order"
 oe_v58_afr_ref_bornu_aluma_ribat_order_desc:0 "Pair fortified brick frontier ribats, armored cavalry, and imported matchlock corps to master savanna and desert campaigns at heightened treasury upkeep."
 oe_v58_afr_ref_kilwa_coral_patriciate:0 "Coral-Stone Waungwana Patriciate"
 oe_v58_afr_ref_kilwa_coral_patriciate_desc:0 "Entrust Swahili stone-town harbors to hereditary merchant-patrician lineages who mint copper coinage and finance monsoon dhows, tempering inland noble ambitions."
 oe_v58_afr_ref_kongo_mani_electoral_court:0 "Manikongo Electoral & Literate Chancery"
 oe_v58_afr_ref_kongo_mani_electoral_court_desc:0 "Combine Kongo's rotational Mani provincial governorships and nzimbu shell treasury with royal schools and multilingual secretaries, checking entrenched provincial lords."
 oe_v58_afr_ref_zimbabwe_dzimbahwe_council:0 "Dzimbahwe Stone-Court Gold Council"
 oe_v58_afr_ref_zimbabwe_dzimbahwe_council_desc:0 "Unite Shona cattle-wealth patronage, dry-stone royal enclosures, and deep-shaft gold tribute under the sovereign's ritual council, tightening oversight over coastal middlemen."
