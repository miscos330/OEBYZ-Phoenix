 oe_v58_afr_dec_drill_bornu_musketeer_corps:0 "Drill Mai Idris Aluma's Musketeer & Ribat Corps"
 oe_v58_afr_dec_drill_bornu_musketeer_corps.a:0 "Sound the War-Drums of Ngazargamu"
 oe_v58_afr_dec_drill_bornu_musketeer_corps.desc:0 "Import Tripoli arquebuses and Ottoman drillmasters to weld Kanem-Bornu's quilted cavalry, camel corps, and mud-brick ribats into an unstoppable Sahel army."
