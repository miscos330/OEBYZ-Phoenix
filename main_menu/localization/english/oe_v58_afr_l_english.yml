 oe_v58_afr_dec_consecrate_zimbabwe_gold_trust:0 "Consecrate the Zimbabwe Plateau Gold Trust"
 oe_v58_afr_dec_consecrate_zimbabwe_gold_trust.a:0 "Seal the Stone-City Gold Compact"
 oe_v58_afr_dec_consecrate_zimbabwe_gold_trust.desc:0 "Expand dry-stone hill enclosures, regulate Zambezi-Save gold caravans, and formalize royal cattle redistributions across the Shona plateau."
 oe_v58_afr_dec_consecrate_zimbabwe_gold_trust.title:0 "Consecrate the Zimbabwe Plateau Gold Trust"
 oe_v58_afr_dec_consecrate_zimbabwe_gold_trust_desc:0 "Expand dry-stone hill enclosures, regulate Zambezi-Save gold caravans, and formalize royal cattle redistributions across the Shona plateau."
