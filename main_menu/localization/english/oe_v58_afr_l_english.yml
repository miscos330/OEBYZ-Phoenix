 oe_v58_afr_dec_guard_caravan_monsoon_corridors:0 "Proclaim the Pan-African Caravan & Monsoon Accord"
 oe_v58_afr_dec_guard_caravan_monsoon_corridors.a:0 "Protect Every Caravan & Dhow"
 oe_v58_afr_dec_guard_caravan_monsoon_corridors.desc:0 "Guarantee safe-conduct passports, watered desert wells, and coastal beacon lights linking Sahelian gold, Central African copper, and Swahili ports."
