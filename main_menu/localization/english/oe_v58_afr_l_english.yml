 oe_v58_afr_dec_codify_askia_weights_and_courts:0 "Codify Askia's Niger Weights, Fleet & Qadi Courts"
 oe_v58_afr_dec_codify_askia_weights_and_courts.a:0 "Enact the Statutes of the Niger Bend"
 oe_v58_afr_dec_codify_askia_weights_and_courts.desc:0 "Appoint inspectors of weights across Timbuktu, Gao, and Djenne, pair Malikite qadi benches with the Hi-Koy river fleet, and endow Sankore chairs."
 oe_v58_afr_dec_codify_askia_weights_and_courts.title:0 "Codify Askia's Niger Weights, Fleet & Qadi Courts"
 oe_v58_afr_dec_codify_askia_weights_and_courts_desc:0 "Appoint inspectors of weights across Timbuktu, Gao, and Djenne, pair Malikite qadi benches with the Hi-Koy river fleet, and endow Sankore chairs."
 oe_v58_afr_dec_codify_askia_weights_and_courts_eff_tt:0 "Grants the #Y Askia Weights & Sankore Patronage#! modifier for 25 years, advancing trade, research, and control."
