 hint_oe_sit_v58_afr_trans_saharan_and_monsoon:0 "Trans-Saharan & Monsoon Africa Guide"
 hint_oe_sit_v58_afr_trans_saharan_and_monsoon_desc:0 "Use the six Situation Actions to elevate #Y Trans-Saharan & Gold Wealth#! (Sahel, Lake Chad & Zimbabwe bullion corridors) or #Y Monsoon & Ocean Reach#! (Swahili & Atlantic Kongo maritime sovereignty). Reaching 80/100 after 1450 seals a continental triumph."
 oe_sit_v58_afr_trans_saharan_and_monsoon:0 "Africa: Trans-Saharan Gold & Monsoon Networks"
 oe_sit_v58_afr_trans_saharan_and_monsoon_desc:0 "Linking Timbuktu's Sankore scholars and Ngazargamu's musketeers with Mbanza-Kongo's royal chancery, Great Zimbabwe's granite gold plateau, and Kilwa's coral monsoon harbors, sovereign African empires shape two oceans and the Great Desert."
 oe_v58_afr.1.a:0 "Expand Husuni Kubwa's domed commercial courts and harbor stairs."
 oe_v58_afr.1.b:0 "Enlarge the Great Mosque's barrel vaults to honor visiting scholars."
 oe_v58_afr.1.c:0 "Lease cliffside stone godowns to Yemeni and Omani captains."
 oe_v58_afr.1.desc:0 "When the Moroccan traveler Ibn Battuta praised Kilwa as one of the finest and best-built cities on earth, masons were already carving fresh porites coral from the reef to raise the domed courts and octagonal pool of Husuni Kubwa above the emerald strait."
 oe_v58_afr.1.title:0 "Coral-Stone Palaces of Husuni Kubwa"
 oe_v58_afr.10.a:0 "Commission the Hi-Koy riverine war-canoe fleet along the Niger."
 oe_v58_afr.10.b:0 "Dig irrigation and transport canals linking the Niger lagoons."
 oe_v58_afr.10.c:0 "Levy river-toll customs at Kabara and Djenne landings."
 oe_v58_afr.10.desc:0 "Where the Niger curves past the desert fringe, Sonni Ali Ber welds riverine Sorko fishermen into the formidable Hi-Koy fleet of four hundred war-canoes. Paired with swift savanna horsemen, the river armada outflanks desert raiders and brings Gao, Timbuktu, and Djenne under one iron standard."
 oe_v58_afr.10.title:0 "Sonni Ali Ber & the War-Canoes of the Niger Bend"
 oe_v58_afr.11.a:0 "Institute Askia's salaried provincial governors and qadi courts."
 oe_v58_afr.11.b:0 "Fund charitable hostels for Sahelian pilgrims in Cairo and Mecca."
 oe_v58_afr.11.c:0 "Encourage returning Cairo merchants to establish Gao warehouses."
 oe_v58_afr.11.desc:0 "Escorted by five hundred horsemen and chests of refined Bambuk gold, Askia Muhammad journeys to Cairo and Mecca, conferring with the famed jurist al-Suyuti and returning bearing a green silk turban as Caliph of the Western Sudan. Now Gao reorganizes its ministries with professional governors and judges."
 oe_v58_afr.11.title:0 "Askia Muhammad's Pilgrimage & Investiture as Caliph of the Takrur"
 oe_v58_afr.12.a:0 "Endow Sankore professorial chairs and royal manuscript vaults."
 oe_v58_afr.12.b:0 "Commission a grand Arabic-Songhai chronicle of the Sahel."
 oe_v58_afr.12.c:0 "Tax the lucrative desert paper-and-parchment caravans."
 oe_v58_afr.12.desc:0 "Leo Africanus marveled that in Timbuktu, handwritten books imported from Barbary and copied by local calligraphers fetch higher profit than any other merchandise—even gold or salt. Twenty-five thousand students gather around the earthen courtyards of Sankore, Djinguereber, and Sidi Yahya."
 oe_v58_afr.12.title:0 "Sankore University & the Timbuktu Book Market"
 oe_v58_afr.13.a:0 "Raise the fired-brick ramparts and royal palace of Ngazargamu."
 oe_v58_afr.13.b:0 "Reconcile the twelve Sayfawa noble councilors under a new charter."
 oe_v58_afr.13.c:0 "Open Lake Chad natron and dried-fish markets to Hausa caravans."
 oe_v58_afr.13.desc:0 "Leaving behind the contested eastern dunes of Njimi, Mai Ali Gaji raises the monumental red-brick walled metropolis of Birni Ngazargamu beside the fertile Komadugu Yobe. Four grand mosques, wide cavalry avenues, and royal granaries herald three centuries of Bornu ascendancy."
 oe_v58_afr.13.title:0 "From Njimi to Birni Ngazargamu: The Sayfawa Rebirth"
 oe_v58_afr.14.a:0 "Train permanent musketeer companies alongside armored Kanuri horse."
 oe_v58_afr.14.b:0 "Build frontier brick ribat fortresses along every caravan road."
 oe_v58_afr.14.c:0 "Reorganize royal grain depots to sustain long dry-season marches."
 oe_v58_afr.14.desc:0 "Returning from pilgrimage through Tripoli and Cairo, Mai Idris Aluma brings matchlock arquebuses and Ottoman drill instructors straight across the Sahara. Chronicler Ahmad ibn Furtu records how disciplined Bornu musketeers and quilted Kanuri heavy cavalry shatter every walled rival around Lake Chad."
 oe_v58_afr.14.title:0 "Mai Idris Aluma's Turkish Musketeers & Quilted Cavalry"
 oe_v58_afr.15.a:0 "Sign the Bornu-Tripoli oasis pact and import Barbary warhorses."
 oe_v58_afr.15.b:0 "Garrison the Bilma salt pans to secure crown salt royalties."
 oe_v58_afr.15.c:0 "Grant diplomatic quarters in Ngazargamu to Maghrebi scholars."
 oe_v58_afr.15.desc:0 "Across the stark Bilma oases and Fezzan wells runs the oldest central Saharan highway linking Lake Chad to the Mediterranean. Bornu envoys negotiate mutual safe-conduct with Tripoli and Fezzan governors, trading kola nuts, leather, and natron for Barbary chargers and steel armor."
 oe_v58_afr.15.title:0 "The Bornu-Tripoli Caravan Diplomacy & Bilma Salt Trail"
 oe_v58_afr.16.a:0 "Sponsor continental craft guilds and standardized fair tolls."
 oe_v58_afr.16.b:0 "Commission royal brasswork and woven banners for court ceremonies."
 oe_v58_afr.16.c:0 "Collect market-stall rents from visiting caravan brokers."
 oe_v58_afr.16.desc:0 "From lost-wax Benin brass plaques and Kano's deep-indigo dye pits to Kongo raffia velvets and Hausa leatherwork, specialized artisan guilds sustain vibrant continental fairs connecting forest kingdoms with Sahelian caravan metropolises."
 oe_v58_afr.16.title:0 "Brass, Indigo & Raffia: The Forest-to-Sahel Fairs"
 oe_v58_afr.17.a:0 "Raise coral-stone cannon bastions and coastal beacon chains."
 oe_v58_afr.17.b:0 "Dispatch urgent envoys to Omani and Ottoman fleets for naval aid."
 oe_v58_afr.17.c:0 "Negotiate selective port charters to buy time and silver."
 oe_v58_afr.17.desc:0 "Heavily gunned foreign carracks round the Cape of Good Hope, demanding tribute and exclusive control over the Sofala gold route. Swahili harbor lords and Zimbabwe envoys debate how best to fortify their reefs, signal beacons, and inland gold trails."
 oe_v58_afr.17.title:0 "Coral Bastions & Defense of the Monsoon Harbors"
 oe_v58_afr.18.a:0 "Commission a grand multi-lingual chronicle of the realm's glories."
 oe_v58_afr.18.b:0 "Hold a continental assembly of merchants, elders, and envoys."
 oe_v58_afr.18.c:0 "Reward royal treasurers and open new caravan trade exemptions."
 oe_v58_afr.18.desc:0 "From the sandstone libraries of Timbuktu and the red-brick walls of Ngazargamu to Mbanza-Kongo's royal chancery, Great Zimbabwe's granite towers, and Kilwa's coral palaces, griots and chroniclers celebrate centuries of resilient African diplomacy, learning, and trade."
 oe_v58_afr.18.title:0 "The Golden Chronicle of Sovereign Africa"
 oe_v58_afr.2.a:0 "Exchange royal gifts and inlay Ming porcelain in palace halls."
 oe_v58_afr.2.b:0 "Study visiting navigators' kamal star-boards and hull joinery."
 oe_v58_afr.2.c:0 "Collect brisk customs duties on silk, porcelain, and ivory."
 oe_v58_afr.2.desc:0 "Tall multi-masted Chinese treasure junks and Gujarati cloth ships anchor off Malindi and Kilwa. Blue-and-white Jingdezhen porcelain plates gleam beside Indian silks while Swahili envoys present ivory, frankincense, and a living giraffe to astound distant emperors."
 oe_v58_afr.2.title:0 "Ming Treasure Ships & Gujarati Merchants on the Swahili Coast"
 oe_v58_afr.3.a:0 "Broker a unified Swahili customs and convoy compact."
 oe_v58_afr.3.b:0 "Assert sole royal monopoly over the Sofala bullion fleet."
 oe_v58_afr.3.c:0 "Equip Swahili coast-guard dhows to deter interlopers."
 oe_v58_afr.3.desc:0 "Every monsoon season, gold carried down from the Zimbabwe highlands reaches the mangrove sandbars of Sofala. Rival patricians in Mombasa, Malindi, and Kilwa argue over harbor tolls and the right to escort the precious northern dhows."
 oe_v58_afr.3.title:0 "Sofala Gold Tolls & the Stone-Town League"
 oe_v58_afr.4.a:0 "Crown the Great Enclosure with the Conical Tower and chevron frieze."
 oe_v58_afr.4.b:0 "Expand royal cattle herds to reward loyal plateau chiefs."
 oe_v58_afr.4.c:0 "Direct stone-cutters to quarry gold-bearing quartz veins instead."
 oe_v58_afr.4.desc:0 "Splitting sun-heated granite exfoliation slabs with fire and water, master Shona masons fit curved chevron courses thirty feet high without a trace of mortar. Above the Great Enclosure, carved soapstone birds watch over the sovereign's ancestral court."
 oe_v58_afr.4.title:0 "Mortarless Granite Walls of Great Zimbabwe"
 oe_v58_afr.5.a:0 "Organize royal reef-mining guilds and guarded Save waystations."
 oe_v58_afr.5.b:0 "Send royal goldsmiths to craft diplomatic regalia for Kilwa."
 oe_v58_afr.5.c:0 "Levy an immediate export tithe on all ivory and gold trains."
 oe_v58_afr.5.desc:0 "During the dry winter months between harvests, highland miners sink shafts into quartz reefs while royal goldsmiths hammer gold foil, wire bangles, and ceremonial staffs. Caravans descend the Save River to exchange bullion and ivory for glass beads, Persian glaze, and Chinese celadon."
 oe_v58_afr.5.title:0 "The Shona Gold Plateau & the Sofala Caravan Road"
 oe_v58_afr.6.a:0 "Charter royal Zambezi trade fairs and bind northern vassals."
 oe_v58_afr.6.b:0 "Muster highland spear regiments to subdue frontier rivals."
 oe_v58_afr.6.c:0 "Collect river-fair duties in cloth, salt, and gold dust."
 oe_v58_afr.6.desc:0 "Seeking rich salt pans and direct access to Zambezi river markets, northern Shona princes rally around the lineage of Mutota. Stone-walled zimbabwes multiply along the escarpment as traders from the Indian Ocean paddle upriver to regulated royal trade fairs."
 oe_v58_afr.6.title:0 "Nyatsimba Mutota & the Northern Zambezi Salt-Gold Fairs"
 oe_v58_afr.7.a:0 "Consecrate the royal ironworking guilds and provincial Mani oaths."
 oe_v58_afr.7.b:0 "Honor the hereditary electors of Mbata to secure domestic peace."
 oe_v58_afr.7.c:0 "Collect copper and raffia-cloth tribute from the river provinces."
 oe_v58_afr.7.desc:0 "Across the fertile highland plateau south of the Congo River, Lukeni lua Nimi unites the riverine chiefdoms of Mpangu, Mbata, Nsundi, and Soyo. Revered as both blacksmith-king and supreme judge, the Manikongo binds provincial Mani governors through sacred ironworking rites and woven raffia tribute."
 oe_v58_afr.7.title:0 "Lukeni lua Nimi & the Forging of Mbanza-Kongo"
 oe_v58_afr.8.a:0 "Expand royal schools and dispatch sovereign Kongolese embassies."
 oe_v58_afr.8.b:0 "Station royal customs inspectors at Mpinda harbor to enforce law."
 oe_v58_afr.8.c:0 "Negotiate silver trade duties with visiting Atlantic captains."
 oe_v58_afr.8.desc:0 "Mastering Latin and Portuguese alongside Kikongo, King Afonso I Mvemba a Nzinga dispatches royal sons to study in Lisbon and Rome—one even consecrated bishop—while drafting fearless diplomatic letters to European monarchs insisting upon lawful trade, teachers, and the protection of Kongolese citizens."
 oe_v58_afr.8.title:0 "King Afonso I Mvemba a Nzinga & Sovereign Atlantic Diplomacy"
 oe_v58_afr.9.a:0 "Audit the Luanda nzimbu fisheries and Nsundi copper smelters."
 oe_v58_afr.9.b:0 "Mint ceremonial copper crosses and cloths for interior diplomacy."
 oe_v58_afr.9.c:0 "Release reserve nzimbu coffers to fund urgent crown projects."
 oe_v58_afr.9.desc:0 "Sorted by lustrous color and size on the royal island of Luanda, nzimbu shells serve as the crown's closely guarded currency across Kongo, complemented by fine copper ingots smelted in Nsundi and velvety raffia palm cloths prized even in Lisbon."
 oe_v58_afr.9.title:0 "The Nzimbu Shell Treasury & Nsundi Copper Guilds"
 oe_v58_afr_act_bornu_musketeer_escort:0 "Deploy Musketeer & Armored Camel Escorts"
 oe_v58_afr_act_bornu_musketeer_escort_desc:0 "Guard desert oases and savanna river crossings with matchlock guards and quilted Kanuri heavy cavalry."
 oe_v58_afr_act_bornu_musketeer_escort_tt:0 "Raises #Y Trans-Saharan & Gold Wealth#! by #G +9#! and grants the #Y Desert Musketeer Escorts#! modifier for 12 years."
 oe_v58_afr_act_indian_ocean_envoys:0 "Dispatch Red Sea & Indian Ocean Envoys"
 oe_v58_afr_act_indian_ocean_envoys_desc:0 "Negotiate reciprocal warehouse rights with Cairo, Muscat, Calicut, and Malacca to keep oceanic trade balanced."
 oe_v58_afr_act_indian_ocean_envoys_tt:0 "Raises #Y Monsoon & Ocean Reach#! by #G +8#! and grants the #Y Indian Ocean Envoy League#! modifier for 12 years."
 oe_v58_afr_act_kongo_atlantic_embassy:0 "Send Atlantic & Royal Literacy Missions"
 oe_v58_afr_act_kongo_atlantic_embassy_desc:0 "Commission noble envoys, translators, and stone-masons to negotiate sovereign equality, printing, and shipbuilding charters."
 oe_v58_afr_act_kongo_atlantic_embassy_tt:0 "Raises #Y Monsoon & Ocean Reach#! by #G +10#! and grants the #Y Sovereign Atlantic Chancery#! modifier for 12 years."
 oe_v58_afr_act_swahili_monsoon_dhows:0 "Fit Out Swahili Lateen Monsoon Dhows"
 oe_v58_afr_act_swahili_monsoon_dhows_desc:0 "Dispatch stitched-plank mtepe and dhow convoys loaded with Sofala gold and ivory to Aden, Hormuz, and Gujarat."
 oe_v58_afr_act_swahili_monsoon_dhows_tt:0 "Raises #Y Monsoon & Ocean Reach#! by #G +10#! and grants the #Y Monsoon Dhow Convoys#! modifier for 12 years."
 oe_v58_afr_act_timbuktu_manuscript_caravan:0 "Sponsor Sankore Paper & Manuscript Caravans"
 oe_v58_afr_act_timbuktu_manuscript_caravan_desc:0 "Import fine Mediterranean paper and ink across the Sahara for Timbuktu, Djenne, and Gao scholars to copy legal and astronomical works."
 oe_v58_afr_act_timbuktu_manuscript_caravan_tt:0 "Raises #Y Trans-Saharan & Gold Wealth#! by #G +10#! and grants the #Y Sankore Manuscript Caravans#! modifier for 12 years."
 oe_v58_afr_act_zimbabwe_gold_assay:0 "Standardize Highland Gold & Salt Assays"
 oe_v58_afr_act_zimbabwe_gold_assay_desc:0 "Station royal assayers along the Zimbabwe reef shafts and Niger-Sahara salt marts to guarantee pure bullion."
 oe_v58_afr_act_zimbabwe_gold_assay_tt:0 "Raises #Y Trans-Saharan & Gold Wealth#! by #G +9#! and grants the #Y Royal Gold & Salt Assay#! modifier for 12 years."
 oe_v58_afr_bld_great_zimbabwe_enclosure:0 "Great Zimbabwe Royal Enclosure"
 oe_v58_afr_bld_great_zimbabwe_enclosure_desc:0 "Soaring mortarless granite walls and the iconic Conical Tower crown the Zimbabwe plateau, housing royal goldsmiths, carved soapstone birds, and sovereign councils."
 oe_v58_afr_bld_kilwa_husuni_kubwa_palace:0 "Kilwa Husuni Kubwa Coral Palace"
 oe_v58_afr_bld_kilwa_husuni_kubwa_palace_desc:0 "Perched atop a coral cliff overlooking Kilwa harbor, this domed hundred-room palace and commercial court greets monsoon captains with octagonal pools and Ming porcelain vaults."
 oe_v58_afr_bld_mbanza_kongo_cathedral:0 "Mbanza-Kongo Royal Cathedral of Kulumbimbi"
 oe_v58_afr_bld_mbanza_kongo_cathedral_desc:0 "Built of dressed local stone beside the sacred royal plateau of Mbanza-Kongo, Kulumbimbi anchors Kongolese royal literacy, Latin-Kikongo chanceries, and Atlantic diplomacy."
 oe_v58_afr_bld_ngazargamu_brick_citadel:0 "Ngazargamu Fired-Brick Citadel"
 oe_v58_afr_bld_ngazargamu_brick_citadel_desc:0 "Encircled by a mile-wide rampart of kiln-fired red brick near the Komadugu Yobe, Birni Ngazargamu shelters the Sayfawa court, mosques, and Idris Aluma's musketeer barracks."
 oe_v58_afr_bld_timbuktu_sankore_university:0 "Sankore University of Timbuktu"
 oe_v58_afr_bld_timbuktu_sankore_university_desc:0 "Pyramidal earthen minarets and private family libraries housing hundreds of thousands of astronomical, legal, and medical manuscripts make Timbuktu the jewel of Sahelian scholarship."
 oe_v58_afr_dec_charter_kilwa_mint:0 "Charter the Kilwa Royal Mint & Monsoon Stone-Towns"
 oe_v58_afr_dec_charter_kilwa_mint.a:0 "Strike the Coinage of Kilwa"
 oe_v58_afr_dec_charter_kilwa_mint.desc:0 "Strike copper and silver Kilwa coinage bearing rhymed Arabic couplets and bind Swahili harbors from Sofala to Malindi in shared dhow protection."
 oe_v58_afr_dec_charter_kilwa_mint.title:0 "Charter the Kilwa Royal Mint & Monsoon Stone-Towns"
 oe_v58_afr_dec_charter_kilwa_mint_desc:0 "Strike copper and silver Kilwa coinage bearing rhymed Arabic couplets and bind Swahili harbors from Sofala to Malindi in shared dhow protection."
