l_english:
 oe_guarantee_cilicia: "Guarantee Cilicia"
 oe_guarantee_cilicia_desc: "Cilician castles guard the Taurus passes, while its harbors link Cyprus to the Syrian trade routes. The empire will proclaim that any assault on the Armenian kingdom's independence will also invite Roman intervention.\n\nA one-time action visible only before 1375. Cilicia must exist and be independent. Byzantium must share a direct land border with it, directly own all of Cyprus Province, or have more than 30 ships. Costs 200 gold and establishes a Byzantine guarantee of Cilician independence."
 oe_cilicia_protectorate: "Cilician Protectorate"
 oe_cilicia_protectorate_desc: "Our guarantee has ended Cilicia's isolation. With Roman borders restored to the foothills of the Taurus, that promise can become a lasting compact, preserving the local ruler under imperial protection.\n\nUnlocked after Guarantee Cilicia. Cilicia must exist and be independent; Byzantium must share a direct land border and have at least 200 tax base. Costs 200 gold and makes Cilicia a Roman Alliance subject of Byzantium."
 oe_tribes_romanization: "Romanization"
 oe_tribes_romanization_desc: "The empire recognizes tribal leaders and brings their communities into Roman administration through registers, land deeds and shared military obligations. Families may settle as farmers, retaining the memory of their homeland while living under imperial law.\n\nTribal satisfaction equilibrium +10%, estate power +33%, monthly prosperity +0.05%, tribesmen-to-peasants promotion +20%, and monthly movement towards Roman identity +0.1."
