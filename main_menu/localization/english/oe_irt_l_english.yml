l_english:
 oe_irt_b_sheep_rivalry: "Black and White Sheep Plateau Rivalry"
 oe_irt_b_despina_alliance: "Despina Khatun Eastern Alliance"
 oe_irt_b_ottoman_pincer: "Eastern Pincer Antagonism"
 oe_irt_b_chaldiran_frontier: "Chaldiran Gunpowder Frontier Hostility"
 STATIC_MODIFIER_NAME_oe_irt_black_sheep_ascendancy: "Black Sheep Ascendancy at Tabriz"
 STATIC_MODIFIER_DESC_oe_irt_black_sheep_ascendancy: "Qara Qoyunlu horsemen dominate Tabriz and Baghdad, surging cavalry punch and prestige while tribal chiefs erode central control."
 STATIC_MODIFIER_NAME_oe_irt_tabriz_war_seat: "Tabriz Wartime Camp"
 STATIC_MODIFIER_DESC_oe_irt_tabriz_war_seat: "Turcoman warbands massed around Tabriz boost local manpower while stirring urban unrest."
 STATIC_MODIFIER_NAME_oe_irt_persian_diwan: "Persian Diwan Continuity"
 STATIC_MODIFIER_DESC_oe_irt_persian_diwan: "Retaining Persian chancery scribes sharpens taxation and cabinet governance while alienating tribal horsemen."
 STATIC_MODIFIER_NAME_oe_irt_white_sheep_surge: "Uzun Hasan's White Sheep Surge"
 STATIC_MODIFIER_DESC_oe_irt_white_sheep_surge: "Aq Qoyunlu heavy cavalry drive across Azerbaijan and Fars, accelerating conquest and tradition while swelling tribal power and stability costs."
 STATIC_MODIFIER_NAME_oe_irt_plateau_citadels: "Fortified Plateau Citadels"
 STATIC_MODIFIER_DESC_oe_irt_plateau_citadels: "Anchoring rule in the walled cities of Tabriz, Isfahan, Shiraz, and Herat strengthens defense and revenue at a modest cost in martial prestige."
 STATIC_MODIFIER_NAME_oe_irt_eastern_pincer: "Pontic-Aq Qoyunlu Eastern Pincer"
 STATIC_MODIFIER_DESC_oe_irt_eastern_pincer: "Theodora Komnene's marriage links Trebizond, Constantinople, and Tabriz in an eastern front against Ottoman power, though rigorist clergy murmur against the match."
 STATIC_MODIFIER_NAME_oe_irt_pontic_caravans: "Trebizond-Tabriz Caravan Accord"
 STATIC_MODIFIER_DESC_oe_irt_pontic_caravans: "Confining Pontic-Iranian ties to silk caravan treaties secures steady trade receipts without the rigors of a military alliance."
 STATIC_MODIFIER_NAME_oe_irt_gunpowder_reforms: "Otlukbeli Gunpowder Reforms"
 STATIC_MODIFIER_DESC_oe_irt_gunpowder_reforms: "Adopting field cannon and matchlock wagons after Otlukbeli sharpens artillery and discipline while inflating ordnance costs and angering tribal lords."
 STATIC_MODIFIER_NAME_oe_irt_turcoman_horsemen: "Traditional Turcoman Horse-Archers"
 STATIC_MODIFIER_DESC_oe_irt_turcoman_horsemen: "Doubling down on mobile steppe horsemen pleases tribal chiefs and speeds levy recovery while leaving fortresses and artillery lagging."
 STATIC_MODIFIER_NAME_oe_irt_qizilbash_zeal: "Ardabil Order & Qizilbash Zeal"
 STATIC_MODIFIER_DESC_oe_irt_qizilbash_zeal: "Red-capped Qizilbash devotees rally around the Safavid synthesis, driving fierce morale and rapid conversion at the cost of sectarian friction and tribal leverage."
 STATIC_MODIFIER_NAME_oe_irt_sunni_continuity: "Sunni-Persian Legal Continuity"
 STATIC_MODIFIER_DESC_oe_irt_sunni_continuity: "Curbing radical Sufi militias preserves confessional calm and fiscal order across the plateau at the price of lower battlefield zeal."
 STATIC_MODIFIER_NAME_oe_irt_chaldiran_musketeers: "Post-Chaldiran Royal Musketeer Corps"
 STATIC_MODIFIER_DESC_oe_irt_chaldiran_musketeers: "Forging crown musketeers and scorched-earth logistics after Chaldiran elevates discipline, artillery, and defense while straining taxes and tribal loyalty."
 STATIC_MODIFIER_NAME_oe_irt_zagros_bulwark: "Bulwark of the Zagros Passes"
 STATIC_MODIFIER_DESC_oe_irt_zagros_bulwark: "Trading open-field glory for fortified Zagros passes blunts invading armies and war exhaustion at the cost of prestige and offensive élan."
 STATIC_MODIFIER_NAME_oe_irt_royal_silk_monopoly: "Royal Silk Monopoly of Qazvin & Isfahan"
 STATIC_MODIFIER_DESC_oe_irt_royal_silk_monopoly: "Centralizing court and silk exports through Qazvin and Isfahan empowers the Crown and treasury while antagonizing Qizilbash amirs and private merchants."
 STATIC_MODIFIER_NAME_oe_irt_royal_capital_seat: "Royal Plateau Capital Seat"
 STATIC_MODIFIER_DESC_oe_irt_royal_capital_seat: "Palaces, grand bazaars, and royal silk vaults rapidly expand trade power and urban growth with mild civic growing pains."
 STATIC_MODIFIER_NAME_oe_irt_amirs_compact: "Compact of Qizilbash Amirs & Silk Guilds"
 STATIC_MODIFIER_DESC_oe_irt_amirs_compact: "Sharing silk revenues and provincial commands with tribal amirs secures levies and calm while curbing central crown power."
 STATIC_MODIFIER_NAME_oe_irt_gunpowder_empire: "Iranian Gunpowder Empire & Silk Hub"
 STATIC_MODIFIER_DESC_oe_irt_gunpowder_empire: "Artillery, central bureaucracy, and silk wealth forge a formidable gunpowder empire across Iran, demanding steady effort to check stability costs and tribal friction."
 STATIC_MODIFIER_NAME_oe_irt_plateau_equilibrium: "Amasya Equilibrium of the Iranian Plateau"
 STATIC_MODIFIER_DESC_oe_irt_plateau_equilibrium: "Negotiated borders and balanced governance bring lasting prosperity and defensive poise to the plateau while softening offensive zeal."
 STATIC_MODIFIER_NAME_oe_irt_silk_caravanserai_net: "Plateau Silk Caravanserai Network"
 STATIC_MODIFIER_DESC_oe_irt_silk_caravanserai_net: "Fortified caravanserais linking Tabriz, Isfahan, Qazvin, and Herat boost silk trade and prosperity at a modest garrison upkeep cost."
 oe_irt_dec_despina_embassy.title: "Renew the Pontic-Iranian Accord"
 oe_irt_dec_despina_embassy.desc: "Send envoys to renew diplomatic and caravan agreements between Pontus and Tabriz, trading gold and prestige for steady trade and eastern goodwill."
 oe_irt_dec_despina_embassy.a: "Seal the Pontic-Iranian Accord"
 oe_irt_dec_gunpowder_foundry.title: "Found the Royal Plateau Cannon Foundry"
 oe_irt_dec_gunpowder_foundry.desc: "Establish a state artillery foundry in Tabriz, Isfahan, Qazvin, or Herat, paying steep gold, manpower, and stability costs for lasting gunpowder reforms."
 oe_irt_dec_gunpowder_foundry.a: "Commission the Royal Cannon Foundry"
 oe_irt_dec_silk_caravanserais.title: "Charter the Plateau Silk Caravanserais"
 oe_irt_dec_silk_caravanserais.desc: "Fund fortified caravanserais linking Tabriz, Isfahan, Qazvin, Shiraz, and Herat to boost silk revenues and prosperity at a modest garrison cost."
 oe_irt_dec_silk_caravanserais.a: "Charter the Silk Caravanserais"
 oe_irt.1.t: "Twilight of the Jalayirids and Rise of the Black Sheep"
 oe_irt.1.d: "As the last Jalayirid remnants fade across Baghdad and Tabriz after Timur's passing, Qara Qoyunlu horsemen seize the roads of Azerbaijan. The Iranian plateau enters a new era poised between Turcoman tribal power and the old Persian chancery."
 oe_irt.1.a: "Consolidate Black Sheep Turcoman rule at Tabriz and Baghdad"
 oe_irt.1.a.tt: "Advances Late Iran line to Stage #Y 1#!; costs #R 90#! gold and #R 3#! stability; grants #G +10#! prestige, [ShowModifier('oe_irt_black_sheep_ascendancy')] (#Y 25#! years, raising tribal power and easing control), and [ShowModifier('oe_irt_tabriz_war_seat')] in Tabriz if owned."
 oe_irt.1.b: "Preserve the Persian diwan bureaucracy and urban tax rolls"
 oe_irt.1.b.tt: "Advances Late Iran line to Stage #Y 1#!; costs #R 70#! gold and #R 8#! prestige; grants [ShowModifier('oe_irt_persian_diwan')] (#Y 25#! years, lowering tribal satisfaction and light cavalry power)."
 oe_irt.2.t: "Uzun Hasan and the White Sheep Ascendancy"
 oe_irt.2.d: "From Diyarbakir, the Aq Qoyunlu chief Uzun Hasan marches east to contest Tabriz, Isfahan, and Shiraz against both Black Sheep and Timurid princes. Across western Iran and Fars, rival citadels and nomadic confederations brace for a decisive reckoning."
 oe_irt.2.a: "Back the White Sheep bid for Azerbaijan and Fars"
 oe_irt.2.a.tt: "Advances to Stage #Y 2#!; costs #R 110#! gold and #R 2#! manpower; grants #G +8#! army tradition, [ShowModifier('oe_irt_white_sheep_surge')] (#Y 25#! years, higher tribal power and stability cost), and sharpens Aq-Qara rivalry."
 oe_irt.2.b: "Fortify the plateau cities against tribal consolidation"
 oe_irt.2.b.tt: "Advances to Stage #Y 2#!; costs #R 100#! gold and #R 3#! stability; grants [ShowModifier('oe_irt_plateau_citadels')] (#Y 25#! years, slight monthly prestige trade-off)."
 oe_irt.3.t: "Despina Khatun and the Trebizond-Aq Qoyunlu Alliance"
 oe_irt.3.d: "As Ottoman banners press eastward, the Komnenian court of Trebizond gives Princess Theodora (Despina Khatun) in marriage to Uzun Hasan of the White Sheep. Bridging Pontus, Constantinople, and Tabriz, the match promises an eastern pincer—if courts can endure its political cost."
 oe_irt.3.a: "Seal the marriage of Despina Khatun and the eastern pincer"
 oe_irt.3.a.tt: "Costs #R 120#! gold and #R 2#! stability; grants #G +12#! prestige, [ShowModifier('oe_irt_eastern_pincer')] (#Y 25#! years, slight clergy dissatisfaction), deepens Aq Qoyunlu-Pontic/Roman ties, and provokes Ottoman hostility."
 oe_irt.3.b: "Limit ties to Pontic-Tabriz caravan treaties"
 oe_irt.3.b.tt: "Costs #R 50#! gold and #R 6#! prestige; grants [ShowModifier('oe_irt_pontic_caravans')] (#Y 25#! years, slight army tradition trade-off)."
 oe_irt.4.t: "Battle of Otlukbeli: Clash of Firearms"
 oe_irt.4.d: "On the upland field of Otlukbeli, proud Turcoman cavalry shatter against wagon forts, bronze cannon, and disciplined volley fire. The bloody reckoning forces every realm from Anatolia to Iran to confront the brutal price of the gunpowder revolution."
 oe_irt.4.a: "Overhaul the army with field artillery and matchlock wagons"
 oe_irt.4.a.tt: "Advances to Stage #Y 3#!; costs #R 180#! gold, #R 2.5#! manpower, and #R 3#! stability; grants #G +10#! army tradition and [ShowModifier('oe_irt_gunpowder_reforms')] (#Y 30#! years, raising artillery upkeep and tribal discontent)."
 oe_irt.4.b: "Double down on steppe horse-archers and tribal raids"
 oe_irt.4.b.tt: "Advances to Stage #Y 3#!; costs #R 80#! gold and #R 5#! prestige; grants [ShowModifier('oe_irt_turcoman_horsemen')] (#Y 25#! years, weakening fort defense and artillery)."
 oe_irt.5.t: "The Ardabil Order and the Rise of Ismail"
 oe_irt.5.d: "Sweeping out of Ardabil behind red-capped Qizilbash warriors, young Ismail enters Tabriz and Qazvin to proclaim a Twelver Shia-Turcoman synthesis. The Safavid revolution promises fierce unity across Iran—at the cost of profound sectarian upheaval."
 oe_irt.5.a: "Proclaim the Safavid Shia-Turcoman synthesis and rally the Qizilbash"
 oe_irt.5.a.tt: "Advances to Stage #Y 4#!; costs #R 120#! gold and #R 6#! stability; grants #G +15#! prestige and [ShowModifier('oe_irt_qizilbash_zeal')] (#Y 30#! years, slashing heretic tolerance and boosting tribal power); IRA/AQQ/QAR adopt Shia Islam."
 oe_irt.5.b: "Curb radical Sufi militias and uphold Sunni-Persian continuity"
 oe_irt.5.b.tt: "Advances to Stage #Y 4#!; costs #R 100#! gold and #R 2#! manpower; grants [ShowModifier('oe_irt_sunni_continuity')] (#Y 30#! years, modest morale and prestige trade-off)."
 oe_irt.6.t: "Chaldiran Echo and the Gunpowder Frontier"
 oe_irt.6.d: "Massed western artillery and janissary volleys pierce the Azerbaijan frontier at Chaldiran, shattering illusions of cavalry invincibility and exposing Tabriz. The court must decide whether to finance a royal musketeer corps or anchor survival in the Zagros mountain passes."
 oe_irt.6.a: "Forge a royal musketeer corps and scorched-earth defense"
 oe_irt.6.a.tt: "Costs #R 200#! gold, #R 3#! manpower, and #R 3#! stability; grants #G +12#! army tradition, [ShowModifier('oe_irt_chaldiran_musketeers')] (#Y 30#! years, lowering taxes and tribal satisfaction), and sharpens frontier rivalry with the Ottomans."
 oe_irt.6.b: "Seek tactical truce and fortify the Zagros passes"
 oe_irt.6.b.tt: "Costs #R 110#! gold and #R 10#! prestige; grants [ShowModifier('oe_irt_zagros_bulwark')] (#Y 25#! years, lowering prestige and offensive morale)."
 oe_irt.7.t: "Royal Capital and Silk Monopoly"
 oe_irt.7.d: "As the royal court shifts inland from exposed Tabriz toward Qazvin and Isfahan, Iranian raw silk draws silver from Aleppo, Trebizond, and the Gulf. Shall the Crown seize a royal silk monopoly to curb Qizilbash amirs, or share revenues to keep tribal levies content?"
 oe_irt.7.a: "Centralize the court at Qazvin and Isfahan under a royal silk monopoly"
 oe_irt.7.a.tt: "Advances to Stage #Y 5#!; costs #R 220#! gold and #R 5#! stability; grants [ShowModifier('oe_irt_royal_silk_monopoly')] (#Y 35#! years, lowering tribal and burgher satisfaction) and [ShowModifier('oe_irt_royal_capital_seat')] in Isfahan or Qazvin if owned."
 oe_irt.7.b: "Balance Qizilbash amirs with provincial silk guilds"
 oe_irt.7.b.tt: "Advances to Stage #Y 5#!; costs #R 90#! gold and #R 8#! prestige; grants [ShowModifier('oe_irt_amirs_compact')] (#Y 35#! years, curbing crown power and tax efficiency)."
 oe_irt.8.t: "Balance of the Iranian Plateau"
 oe_irt.8.d: "Since the twilight of the Ilkhanate's first heirs in 1411, Qara Qoyunlu, Aq Qoyunlu, Timurid princes, and Safavid shahs have remade the plateau from Tabriz and Baghdad to Isfahan, Shiraz, Qazvin, and Herat. Now the realm seals its enduring early-modern settlement."
 oe_irt.8.a: "Proclaim the gunpowder empire and silk crossroads of Iran"
 oe_irt.8.a.tt: "Completes the Late Iran line (Stage #Y 6#!); costs #R 200#! gold and #R 4#! stability; grants #G +20#! prestige and [ShowModifier('oe_irt_gunpowder_empire')] (#Y 50#! years, with higher stability costs and tribal friction)."
 oe_irt.8.b: "Establish an Amasya-style diplomatic equilibrium across the plateau"
 oe_irt.8.b.tt: "Completes the Late Iran line (Stage #Y 6#!); costs #R 120#! gold and #R 8#! prestige; grants #G +6#! stability and [ShowModifier('oe_irt_plateau_equilibrium')] (#Y 50#! years, slight morale trade-off)."
 oe_irt.20.t: "Late Iran Line: Choice Takes Effect"
 oe_irt.90.t: "[TEST] Late Iran Line: Readings"
 oe_irt.90.d: "#T Late Iran State (1411-1560)#!\nstage(0..6) [ROOT.GetCountry.MakeScope.ScriptValue('oe_irt_rd_stage')|0]  despina(1All/2Tr) [ROOT.GetCountry.MakeScope.ScriptValue('oe_irt_rd_despina')|0]  gunpowder(1Gun/2Cav) [ROOT.GetCountry.MakeScope.ScriptValue('oe_irt_rd_gun')|0]\n#T Safavid & Centralization#!\nsafavid(1Shia/2Sun) [ROOT.GetCountry.MakeScope.ScriptValue('oe_irt_rd_safavid')|0]  central(1Cr/2Amir) [ROOT.GetCountry.MakeScope.ScriptValue('oe_irt_rd_cent')|0]\n#T Scheduler#!\nsent [ROOT.GetCountry.MakeScope.ScriptValue('oe_irt_rd_cnt')|0]  ran month [ROOT.GetCountry.MakeScope.ScriptValue('oe_irt_rd_m')|0]"
 oe_irt.90.a: "Close"
 oe_irt.90.b: "Refresh"
