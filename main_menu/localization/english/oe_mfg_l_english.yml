 oe_mfg.90.desc: "v11.8 manufactory readout:\n· Silk works #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_mfg_silk_count')|0]#!, ordnance foundries #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_mfg_arsenal_count')|0]#!, kilns #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_mfg_kiln_count')|0]#!, ironworks #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_mfg_ural_count')|0]#!, Arsenale works #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_mfg_arsenale_count')|0]#!, karkhaneh #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_mfg_karkhaneh_count')|0]#!"
