 oe_mfg_imperial_arsenal_foundry: "Imperial Ordnance Foundry"
 oe_mfg_imperial_arsenal_foundry_desc: "A state arsenal that brings powder-making, casting and the supply of a standing army under one roof. Requires the Imperial Ordnance advance."
