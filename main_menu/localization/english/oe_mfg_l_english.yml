 oe_dem_chinoiserie_boom_desc: "The market clamours for porcelain, tea and silk."
 oe_dem_ordnance_war_surge: "Wartime Demand for Arms"
 oe_dem_ordnance_war_surge_desc: "With war pressing, firearms, cannon, saltpetre and steel are all short."
 oe_dem_arsenale_fleet_wave: "Shipbuilding Wave"
 oe_dem_arsenale_fleet_wave_desc: "Many hulls are laid down at once, and demand for naval stores and timber soars."
 oe_dem_indian_calico_craze: "Craze for Calico and Spices"
 oe_dem_indian_calico_craze_desc: "Printed cottons and spices sell everywhere."
 oe_dem_ural_iron_export: "Iron Export Boom"
 oe_dem_ural_iron_export_desc: "Iron and steel are exported in bulk, pulling demand for ore, coal and tools with them."
 oe_dem_royal_karkhaneh_silk: "Fashion for Court Brocade"
 oe_dem_royal_karkhaneh_silk_desc: "Courts and great houses compete to buy brocade."
 oe_mfg_adv_imperial_ordnance: "Imperial Ordnance"
 oe_mfg_adv_imperial_ordnance_desc: "The court founds an office to make firearms and cannon; the Imperial Ordnance Foundry can be built."
 oe_mfg_adv_royal_karkhaneh: "Royal Silk Workshops"
 oe_mfg_adv_royal_karkhaneh_desc: "The crown monopolises raw silk and runs its own workshops; the silk works can turn to velvet."
 oe_mfg_adv_ural_metallurgy: "Ural Metallurgy"
 oe_mfg_adv_ural_metallurgy_desc: "Large water-powered blast furnaces; the Ural Ironworks can be built."
 oe_mfg_adv_rifled_arsenal: "Steel Ordnance"
 oe_mfg_adv_rifled_arsenal_desc: "Firearms made of fine steel; the ordnance foundry can switch to the steel recipe."
 oe_mfg_player_only_tt: "Only a player-controlled country can use this"
 oe_mfg_dev_free_build_tt: "Test: free construction"
 oe_mfg_dec_eparch_silk_charter.title: "Issue the Purple Charter"
 oe_mfg_dec_eparch_silk_charter.desc: "After the old Book of the Eparch, reaffirm the court's monopoly of court silk and set off a fashion for brocade in the capital's market. Costs 150 gold; lasts 15 years."
 oe_mfg_dec_eparch_silk_charter.a: "Issue the charter"
 oe_mfg_dec_imperial_kiln_commission.title: "Send a Commissioner to the Kilns"
 oe_mfg_dec_imperial_kiln_commission.desc: "Send a commissioner to reside at the imperial kilns and oversee the court's porcelain, stirring demand for porcelain and tea. Costs 150 gold; lasts 15 years."
 oe_mfg_dec_imperial_kiln_commission.a: "Send the commissioner"
 oe_mfg_dec_demidov_ural_concession.title: "Grant an Ironworks Concession"
 oe_mfg_dec_demidov_ural_concession.desc: "Hand the state ironworks to an able family of ironmasters in return for a steady flow of iron. Costs 200 gold; lasts 15 years."
 oe_mfg_dec_demidov_ural_concession.a: "Grant the concession"
 oe_mfg_dec_arsenale_assembly_charter.title: "Adopt the Arsenale Standard"
 oe_mfg_dec_arsenale_assembly_charter.desc: "After the manner of the Arsenale, make ship parts to one standard and fit hulls out along an assembly line. Costs 200 gold; lasts 15 years."
 oe_mfg_dec_arsenale_assembly_charter.a: "Adopt the standard"
 oe_mfg.1.title: "The Purple Monopoly"
 oe_mfg.1.desc: "The charter repeats that true purple brocade may be woven only in the imperial works and never sold abroad. The heads of the guilds ask how strictly the ban is to be kept."
 oe_mfg.1.a: "Not a single bolt leaves the realm"
 oe_mfg.1.b: "Lesser cloths may be sold abroad for gold"
 oe_mfg.2.title: "Cobalt Reaches the Kilns"
 oe_mfg.2.desc: "Fine cobalt from the west has reached the imperial kilns. The commissioner asks whether court pieces with the slightest flaw are to be smashed and buried as before, or sold to the public."
 oe_mfg.2.a: "Smash and bury them; court ware is for the court"
 oe_mfg.2.b: "Sell them and support the kilns"
 oe_mfg.3.title: "The Proving of the Guns"
 oe_mfg.3.desc: "The first great guns cast in the foundry are proved outside the walls, and the sound carries for miles. Ministers and envoys come to watch."
 oe_mfg.3.a: "Reward the craftsmen"
 oe_mfg.3.b: "Have the armies drill with firearms"
 oe_mfg.4.title: "The Concession and the Assigned Peasants"
 oe_mfg.4.desc: "The ironmaster asks that peasants of the nearby villages be assigned to labour at the works, saying there will not be enough iron otherwise. The local officials fear unrest."
 oe_mfg.4.a: "Assign the peasants"
 oe_mfg.4.b: "Hired labour only"
 oe_mfg.5.title: "A Galley in a Day"
 oe_mfg.5.desc: "A galley fitted out to the new standard went from bare hull to full rig in a single day. The visiting envoys could hardly believe it."
 oe_mfg.5.a: "This is the majesty of the state"
 oe_mfg.6.title: "The Glassmakers Flee"
 oe_mfg.6.desc: "Several masters of the cristallo have fled abroad with the recipe. Shall we punish their families and send men after them, or throw the craft open and let craftsmen and scholars come and go?"
 oe_mfg.6.a: "Punish them and keep the secret"
 oe_mfg.6.b: "Open the craft to exchange"
 oe_mfg.7.title: "Silk Merchants Settle in the Capital"
 oe_mfg.7.desc: "A community of weavers and merchants skilled in silk has moved to the capital and built a new quarter beside the royal workshops."
 oe_mfg.7.a: "Grant them protection and privileges"
 oe_mfg.8.title: "Crucible Steel and Fine Cotton Sell Everywhere"
 oe_mfg.8.desc: "The crucible steel and printed cottons of our workshops are carried off by merchants to every market."
 oe_mfg.8.a: "Expand production"
 oe_mfg.9.title: "A Distant Craze for Porcelain and Tea"
 oe_mfg.9.desc: "Distant courts and rich houses compete for our porcelain and tea, and silver arrives by the shipload."
 oe_mfg.9.a: "Fire more ware for export"
 oe_mfg.10.title: "Not Enough Arms"
 oe_mfg.10.desc: "With the war pressing, saltpetre, copper and tin are soaring in price, and the foundry cannot keep up with the front though it works day and night."
 oe_mfg.10.a: "Buy materials at any price"
 oe_mfg.10.b: "Order the armies to save powder"
 oe_mfg.11.title: "The Steel Line"
 oe_mfg.11.desc: "The foundry has turned to fine steel and makes its parts to one gauge; it turns out far more than before."
 oe_mfg.11.a: "Spread the method to every works"
 oe_mfg.12.title: "The Prize of the Workshops"
 oe_mfg.12.desc: "The best goods of many lands were gathered and judged, and the products of the imperial workshops took first place."
 oe_mfg.12.a: "Proclaim it"
