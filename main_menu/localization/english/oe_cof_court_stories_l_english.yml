l_english:
 oe_cof_latin_learning: "A Court That Reads Latin"
 oe_cof_galata_tolls: "The Customs War in the Golden Horn"
 STATIC_MODIFIER_NAME_oe_cof_domestikos_command: "The Domestikos in Command"
 STATIC_MODIFIER_DESC_oe_cof_domestikos_command: "The Domestikos has at least #Y 60#! Military ability. While a campaign runs, its war pressure #G −1#! a month."
 STATIC_MODIFIER_NAME_oe_cof_domestikos_inept: "An Inept Domestikos"
 STATIC_MODIFIER_DESC_oe_cof_domestikos_inept: "The Domestikos has less than #Y 30#! Military ability. While a campaign runs, its war pressure #R +1#! a month."
 STATIC_MODIFIER_NAME_oe_cof_admiral_convoys: "The Megas Doux's Convoys"
 STATIC_MODIFIER_DESC_oe_cof_admiral_convoys: "The Megas Doux has at least #Y 60#! Military ability. While a maritime campaign (Egypt, North Africa, Italy, the Black Sea) runs, its war pressure #G −1#! a month."
 STATIC_MODIFIER_NAME_oe_cof_admiral_ports: "The Megas Doux's Harbours"
 STATIC_MODIFIER_DESC_oe_cof_admiral_ports: "The Megas Doux's people collect the customs of several harbours, in return for the galleys the Megas Doux refitted at private expense."
 STATIC_MODIFIER_NAME_oe_cof_horn_trade: "Ships in the Golden Horn"
 STATIC_MODIFIER_DESC_oe_cof_horn_trade: "Since the dues were lowered, the ships passing the straits call at the south shore of the Golden Horn."
 STATIC_MODIFIER_NAME_oe_cof_jewels_pawned: "The Crown Jewels in Pawn"
 STATIC_MODIFIER_DESC_oe_cof_jewels_pawned: "The empire's crown jewels are in pawn in Venice. Until they are redeemed, every great ceremony reminds people how poor the empire is."
 oe_cof.1.t: "The Minister's Fortune"
 oe_cof.1.desc: "Theodore Metochites served Andronikos II as mesazon from 1305, handling his papers and passing on his orders, and later rose to grand logothete. He became one of the richest men of his age and paid for the restoration of the Chora monastery, where a mosaic in the narthex still shows him offering the church to Christ. When the old emperor was overthrown by his grandson in 1328, Metochites fell with him: all his property was seized, he was exiled to Didymoteicho, and four years later he died at the Chora as a monk. Now the Grand Chancellor [SCOPE.sCharacter('oe_cof_holder').GetName] keeps enlarging [SCOPE.sCharacter('oe_cof_holder').GetHerHis] mansion and has endowed a monastery in the city. People in the capital say the money came too quickly.\n\nGrand Chancellor [SCOPE.sCharacter('oe_cof_holder').GetName]: Administrative ability [SCOPE.sCharacter('oe_cof_holder').GetAbility('adm')|0]"
 oe_cof.1.a: "Let [SCOPE.sCharacter('oe_cof_holder').GetHerHim] be"
 oe_cof.1.a.tt: "Prestige #G +5#!\nIf [SCOPE.sCharacter('oe_cof_holder').GetName] belongs to one of the great houses: that house's influence #Y +30#!\n[oe_tu_authority|e] #R −2#!"
 oe_cof.1.b: "Audit [SCOPE.sCharacter('oe_cof_holder').GetHerHis] accounts"
 oe_cof.1.b.tt: "If [SCOPE.sCharacter('oe_cof_holder').GetName] has at least #Y 60#! Administrative ability: [SCOPE.sCharacter('oe_cof_holder').GetHerHis] books are in perfect order and the audit finds only #G +75#! gold; otherwise: the audit finds #G +150#! gold\nIf [SCOPE.sCharacter('oe_cof_holder').GetName] belongs to one of the great houses: that house's influence #Y −20#!"
 oe_cof.1.c: "Do as in 1328: dismiss [SCOPE.sCharacter('oe_cof_holder').GetHerHim] and seize [SCOPE.sCharacter('oe_cof_holder').GetHerHis] property"
 oe_cof.1.c.tt: "[SCOPE.sCharacter('oe_cof_holder').GetName] is removed as Grand Chancellor; the office falls vacant and its bonus stops at once\nLegitimacy #R −5#!\n#G +250#! gold\nIf [SCOPE.sCharacter('oe_cof_holder').GetName] belongs to one of the great houses: that house's influence #Y −50#!\n[oe_tu_authority|e] #G +3#!"
 oe_cof.2.t: "Two Pens"
 oe_cof.2.desc: "Nikephoros Choumnos became mesazon to Andronikos II in 1294 and head of the imperial chancery the next year. In 1305 the post of mesazon went to Theodore Metochites, and Choumnos was later sent to govern Thessaloniki. In the 1320s the two men traded essay after essay: Choumnos called Metochites' prose obscure, and Metochites mocked Choumnos for knowing no astronomy. Now the Grand Chancellor [SCOPE.sCharacter('oe_cof_holder').GetName] and the Chief Secretary [SCOPE.sCharacter('oe_cof_holder2').GetName] will not give way to each other either; the same document has gone back and forth between them three times."
 oe_cof.2.a: "Back the chancellor and send [SCOPE.sCharacter('oe_cof_holder2').GetName] to [SCOPE.sCountry('oe_cof_theme').GetName]"
 oe_cof.2.a.tt: "[SCOPE.sCharacter('oe_cof_holder2').GetName] is removed as Chief Secretary; the office falls vacant and its bonus stops at once\n[SCOPE.sCountry('oe_cof_theme').GetName] civil administration efficiency #G +15#! (#Y 5#! years)\n[oe_tu_authority|e] #G +2#!"
 oe_cof.2.b: "Back the chancellor"
 oe_cof.2.b.tt: "[SCOPE.sCharacter('oe_cof_holder2').GetName] is removed as Chief Secretary; the office falls vacant and its bonus stops at once\n[oe_tu_authority|e] #G +2#!"
 oe_cof.2.c: "Back the secretary"
 oe_cof.2.c.tt: "[SCOPE.sCharacter('oe_cof_holder').GetName] is removed as Grand Chancellor; the office falls vacant and its bonus stops at once\nLegitimacy #R −5#!\nIf [SCOPE.sCharacter('oe_cof_holder2').GetName] belongs to one of the great houses: that house's influence #Y +30#!"
 oe_cof.2.d: "Keep both and let them write"
 oe_cof.2.d.tt: "Prestige #G +5#!\n[oe_tu_authority|e] #R −3#!"
 oe_cof.3.t: "The Judges on Trial"
 oe_cof.3.desc: "In 1329 Andronikos III cut the old twelve-man tribunal down to four, the 'Universal Judges of the Romans', at least one of them a bishop. Within a few years three of the four were accused of taking bribes. Bishop Joseph of Apros, Glabas and Kleidas were found guilty: they paid back the money, gave up their judgeships and were banished from Constantinople. Only Matarangos was acquitted. The office itself survived until the end of the empire. Now the Universal Judge [SCOPE.sCharacter('oe_cof_holder').GetName] has been denounced before the throne.\n\nUniversal Judge [SCOPE.sCharacter('oe_cof_holder').GetName]: Administrative ability [SCOPE.sCharacter('oe_cof_holder').GetAbility('adm')|0]"
 oe_cof.3.a: "Try [SCOPE.sCharacter('oe_cof_holder').GetHerHim] in public, as in 1337"
 oe_cof.3.a.tt: "#Y 50%#!: [SCOPE.sCharacter('oe_cof_holder').GetSheHe] is found guilty and pays the money back: #G +100#! gold, [SCOPE.sCharacter('oe_cof_holder').GetName] is removed as Universal Judge; the office falls vacant and its bonus stops at once, [oe_tu_authority|e] #G +3#!, Every theme whose judge is sent from the capital: justice efficiency #G +10#! (#Y 5#! years)\n#Y 50%#!: [SCOPE.sCharacter('oe_cof_holder').GetSheHe] is acquitted and stays in office: Prestige #G +5#!, Imperial Authority #G +2#!"
 oe_cof.3.b: "Fine [SCOPE.sCharacter('oe_cof_holder').GetHerHim] quietly and keep [SCOPE.sCharacter('oe_cof_holder').GetHerHim]"
 oe_cof.3.b.tt: "#G +60#! gold\nEvery theme whose judge is sent from the capital: justice efficiency #R −10#! (#Y 5#! years)"
 oe_cof.3.c: "Replace [SCOPE.sCharacter('oe_cof_holder').GetHerHim] with [SCOPE.sCharacter('oe_cof_cand').GetName]"
 oe_cof.3.c.tt: "[SCOPE.sCharacter('oe_cof_holder').GetName] is removed as Universal Judge; the office falls vacant and its bonus stops at once\n[SCOPE.sCharacter('oe_cof_cand').GetName] becomes Universal Judge\nLegitimacy #R −5#!"
 oe_cof.4.t: "Judges for the Provinces"
 oe_cof.4.desc: "In the fourteenth century the practice of the Universal Judges spread beyond Constantinople: Thessaloniki, the Morea and Lemnos each set up a board of judges of their own. Now the Universal Judge [SCOPE.sCharacter('oe_cof_holder').GetName] writes that lawsuits are piling up in [SCOPE.sCountry('oe_cof_theme').GetName], where the strategos [SCOPE.sCharacter('oe_cof_strategos').GetName]'s own men hear every case, and asks that a judge from the capital be stationed there.\n\nUniversal Judge [SCOPE.sCharacter('oe_cof_holder').GetName]: Administrative ability [SCOPE.sCharacter('oe_cof_holder').GetAbility('adm')|0]"
 oe_cof.4.a: "Station a judge from the capital in [SCOPE.sCountry('oe_cof_theme').GetName]"
 oe_cof.4.a.tt: "[SCOPE.sCountry('oe_cof_theme').GetName]'s judge is now sent from the capital (as the option of the same name for theme officials: paid monthly from the treasury, officials locked for #Y 2#! years)\n[SCOPE.sCountry('oe_cof_theme').GetName] loyalty #R −5#!, also added to its loyalty target for #Y 5#! years"
 oe_cof.4.b: "Send [SCOPE.sCharacter('oe_cof_holder').GetName] on circuit himself"
 oe_cof.4.b.tt: "#R −50#! gold\nIf [SCOPE.sCharacter('oe_cof_holder').GetName] has at least #Y 60#! Administrative ability: [SCOPE.sCountry('oe_cof_theme').GetName] justice efficiency #G +15#! (#Y 5#! years); otherwise: [SCOPE.sCountry('oe_cof_theme').GetName] justice efficiency #G +5#! (#Y 5#! years)"
 oe_cof.4.c: "Leave it to the province"
 oe_cof.4.c.tt: "[SCOPE.sCountry('oe_cof_theme').GetName] loyalty #G +5#!, also added to its loyalty target for #Y 5#! years\n[SCOPE.sCountry('oe_cof_theme').GetName] justice efficiency #R −10#! (#Y 5#! years)"
 oe_cof.5.t: "The Latin Books"
 oe_cof.5.desc: "Demetrios Kydones served John VI Kantakouzenos as mesazon from 1347 and, at the emperor's urging, learned to read and write Latin well. In December 1354 he finished his translation of Thomas Aquinas's Summa contra Gentiles. He and his brother opposed the theology of Gregory Palamas and were later condemned by several synods. Now the Chief Secretary [SCOPE.sCharacter('oe_cof_holder').GetName], who handles the Latin correspondence, is translating Latin books as well, and the monks are already talking about [SCOPE.sCharacter('oe_cof_holder').GetHerHim].\n\nChief Secretary [SCOPE.sCharacter('oe_cof_holder').GetName]: Administrative ability [SCOPE.sCharacter('oe_cof_holder').GetAbility('adm')|0]"
 oe_cof.5.a: "Protect [SCOPE.sCharacter('oe_cof_holder').GetHerHim]"
 oe_cof.5.a.tt: "Clergy satisfaction #R −10%#!\nIf the Papal States exist: their opinion of us #G +30#! (fades by #Y 2#! a year)\nPrestige #G +5#!"
 oe_cof.5.b: "Have [SCOPE.sCharacter('oe_cof_holder').GetHerHim] put the translations away"
 oe_cof.5.b.tt: "Clergy satisfaction #G +5%#!"
 oe_cof.5.c: "Dismiss [SCOPE.sCharacter('oe_cof_holder').GetHerHim] and leave [SCOPE.sCharacter('oe_cof_holder').GetHerHim] to the Patriarch"
 oe_cof.5.c.tt: "[SCOPE.sCharacter('oe_cof_holder').GetName] is removed as Chief Secretary; the office falls vacant and its bonus stops at once\nLegitimacy #R −5#!\nClergy satisfaction #G +10%#!"
 oe_cof.6.t: "A Million Hyperpyra"
 oe_cof.6.desc: "In 1320 Andronikos II raised taxes and collected them strictly, and so raised about a million hyperpyra for the coming year. He meant to keep 3,000 horsemen and build twenty warships. But much of what the peasants paid stayed in the pockets of the officials who collected it, and the civil war between the emperor and his grandson soon wrecked the plan. Now the Grand Tax Comptroller [SCOPE.sCharacter('oe_cof_holder').GetName] has drawn up a plan to survey the lands of every theme again.\n\nGrand Tax Comptroller [SCOPE.sCharacter('oe_cof_holder').GetName]: Diplomatic ability [SCOPE.sCharacter('oe_cof_holder').GetAbility('dip')|0]"
 oe_cof.6.a: "Send assessors from the capital"
 oe_cof.6.a.tt: "If [SCOPE.sCharacter('oe_cof_holder').GetName] has at least #Y 60#! Diplomatic ability: #G +200#! gold; otherwise: #G +100#! gold\nEvery theme whose finance officer is sent from the capital: finance efficiency #G +10#! (#Y 5#! years)\nEvery other theme: loyalty #R −5#!, also added to the loyalty target for #Y 5#! years"
 oe_cof.6.b: "Leave it to the tax farmers"
 oe_cof.6.b.tt: "#G +150#! gold\nEvery theme under tax farming: justice efficiency #R −10#! (#Y 5#! years)"
 oe_cof.6.c: "Keep the old registers"
 oe_cof.6.c.tt: "Nothing changes"
 oe_cof.7.t: "The Crown Jewels in Pawn"
 oe_cof.7.desc: "In August 1343, in the middle of the civil war, the Empress Anna pawned the crown jewels to Venice for 30,000 ducats. The money was soon spent, the jewels went into the treasury of St Mark's, and they were never redeemed. Now the treasury is empty, and the Grand Tax Comptroller [SCOPE.sCharacter('oe_cof_holder').GetName] proposes the same.\n\nGrand Tax Comptroller [SCOPE.sCharacter('oe_cof_holder').GetName]: Diplomatic ability [SCOPE.sCharacter('oe_cof_holder').GetAbility('dip')|0]"
 oe_cof.7.a: "Pawn them to the Venetians"
 oe_cof.7.a.tt: "#G +400#! gold\nIf [SCOPE.sCharacter('oe_cof_holder').GetName] has at least #Y 60#! Diplomatic ability: [SCOPE.sCharacter('oe_cof_holder').GetSheHe] gets a little more out of the Venetians, #G +100#! gold; otherwise: nothing more\nPrestige #R −10#!\nGain [ShowModifier('oe_cof_jewels_pawned')] (monthly prestige #R −0.1#!, #Y 20#! years)\nUntil they are redeemed, the great ceremonies at court will be the harder for it"
 oe_cof.7.b: "Melt down the church plate"
 oe_cof.7.b.tt: "#G +300#! gold\nClergy satisfaction #R −15%#!"
 oe_cof.7.c: "Levy it from the themes"
 oe_cof.7.c.tt: "Every theme with at least #Y 50#! gold in its treasury hands over #Y 50#! gold and loses #R 5#! loyalty, also from its loyalty target for #Y 5#! years"
 oe_cof.8.t: "The Order of Precedence"
 oe_cof.8.desc: "The Book of Offices, written between 1347 and 1368, lists the court titles in order, with the hat and staff of each rank and where each stands at the ceremonies of the year. The order could be changed: Andronikos III raised the office of his friend Kantakouzenos, the grand domestic, to fourth place, ahead of every title outside the imperial family. Now [SCOPE.sCharacter('oe_cof_family_head').GetName], head of the [SCOPE.sDynasty('oe_cof_family').GetName] family, asks to stand further forward at the next great ceremony, and the Master of Ceremonies [SCOPE.sCharacter('oe_cof_holder').GetName] awaits instructions.\n\nMaster of Ceremonies [SCOPE.sCharacter('oe_cof_holder').GetName]: Diplomatic ability [SCOPE.sCharacter('oe_cof_holder').GetAbility('dip')|0]"
 oe_cof.8.a: "Grant it"
 oe_cof.8.a.tt: "Influence of the [SCOPE.sDynasty('oe_cof_family').GetName] family #Y +50#!\n[oe_tu_authority|e] #R −3#!"
 oe_cof.8.b: "Keep to the book"
 oe_cof.8.b.tt: "[oe_tu_authority|e] #G +2#!\nInfluence of the [SCOPE.sDynasty('oe_cof_family').GetName] family #Y −30#!"
 oe_cof.8.c: "Let [SCOPE.sCharacter('oe_cof_holder').GetName] arrange it"
 oe_cof.8.c.tt: "If [SCOPE.sCharacter('oe_cof_holder').GetName] has at least #Y 60#! Diplomatic ability: [SCOPE.sCharacter('oe_cof_holder').GetSheHe] keeps the order of the book and still saves the family's face: Influence of the [SCOPE.sDynasty('oe_cof_family').GetName] family #Y +20#!, [oe_tu_authority|e] #G +1#!; otherwise: nobody is satisfied: Influence of the [SCOPE.sDynasty('oe_cof_family').GetName] family #Y −20#!, Prestige #R −5#!"
 oe_cof.9.t: "A Crown of Glass"
 oe_cof.9.desc: "When John VI was crowned in 1347, his crown was set with glass; the real stones were still in pawn in Venice. A historian of the time wrote that there was not a single vessel of gold or silver at the coronation feast, only pewter and earthenware. Now a great ceremony is due again, the empire's jewels are still in pawn, and the Master of Ceremonies [SCOPE.sCharacter('oe_cof_holder').GetName] asks what is to be done.\n\nMaster of Ceremonies [SCOPE.sCharacter('oe_cof_holder').GetName]: Diplomatic ability [SCOPE.sCharacter('oe_cof_holder').GetAbility('dip')|0]"
 oe_cof.9.a: "Redeem the jewels"
 oe_cof.9.a.tt: "#R −600#! gold\nPrestige #G +10#!\nLegitimacy #G +5#!\n'The Crown Jewels in Pawn' ends"
 oe_cof.9.b: "Make do with glass"
 oe_cof.9.b.tt: "If [SCOPE.sCharacter('oe_cof_holder').GetName] has at least #Y 60#! Diplomatic ability: the ceremony is solemn all the same: Legitimacy #G +5#!; otherwise: everyone sees how poor it is: Prestige #R −5#!, Legitimacy #R −5#!"
 oe_cof.9.c: "Put off the ceremony"
 oe_cof.9.c.tt: "Legitimacy #R −5#!"
 oe_cof.10.t: "The Megas Doux's Purse"
 oe_cof.10.desc: "Alexios Apokaukos was of humble birth. He began as a tax official, later ran the state's finances, made a great fortune and built a fortified tower at Epibatai near Selymbria. Early in 1341 he became megas doux and re-equipped the fleet with 100,000 hyperpyra of his own money. A few months later civil war broke out, and he led the regency's side. Now the Megas Doux [SCOPE.sCharacter('oe_cof_holder').GetName] also offers to refit the galleys at [SCOPE.sCharacter('oe_cof_holder').GetHerHis] own expense, if [SCOPE.sCharacter('oe_cof_holder').GetHerHis] people may collect the customs of several harbours.\n\nMegas Doux [SCOPE.sCharacter('oe_cof_holder').GetName]: Military ability [SCOPE.sCharacter('oe_cof_holder').GetAbility('mil')|0]"
 oe_cof.10.a: "Accept"
 oe_cof.10.a.tt: "Navy tradition #G +5#!\nIf a maritime campaign (Egypt, North Africa, Italy, the Black Sea) is running: its war pressure #G −10#!\nIf [SCOPE.sCharacter('oe_cof_holder').GetName] belongs to one of the great houses: that house's influence #Y +40#!\nGain [ShowModifier('oe_cof_admiral_ports')] (tariff income #R −5%#!, #Y 10#! years)\n[oe_tu_authority|e] #R −2#!"
 oe_cof.10.b: "Pay from the treasury"
 oe_cof.10.b.tt: "#R −300#! gold\nNavy tradition #G +5#!\nIf a maritime campaign (Egypt, North Africa, Italy, the Black Sea) is running: its war pressure #G −10#!"
 oe_cof.10.c: "Decline"
 oe_cof.10.c.tt: "If [SCOPE.sCharacter('oe_cof_holder').GetName] belongs to one of the great houses: that house's influence #Y −10#!"
 oe_cof.11.t: "The Galata Tolls"
 oe_cof.11.desc: "In 1348 John VI lowered the customs dues of Constantinople, and merchant ships stopped calling at Genoese Galata and crossed the Golden Horn instead. The treasury was empty, so he borrowed 50,000 hyperpyra from private lenders to build new ships. The Genoese declared war in August, crossed the Horn and attacked the imperial fleet; by early 1349 the new fleet was gone. At the peace Genoa paid 100,000 hyperpyra but kept its customs privileges. Now the Megas Doux [SCOPE.sCharacter('oe_cof_holder').GetName] says Galata has taken the trade of the straits again.\n\nMegas Doux [SCOPE.sCharacter('oe_cof_holder').GetName]: Military ability [SCOPE.sCharacter('oe_cof_holder').GetAbility('mil')|0]"
 oe_cof.11.a: "Cut the dues and build ships"
 oe_cof.11.a.tt: "#R −200#! gold\nIf Genoa exists: its opinion of us #R −30#! (fades by #Y 2#! a year)\nIf [SCOPE.sCharacter('oe_cof_holder').GetName] has at least #Y 60#! Military ability: the fleet holds off the Genoese: Navy tradition #G +5#!, Gain [ShowModifier('oe_cof_horn_trade')] (tariff income #G +10%#!, #Y 10#! years); otherwise: the new fleet is destroyed: Navy tradition #R −5#!, Prestige #R −10#!"
 oe_cof.11.b: "Negotiate with the Genoese"
 oe_cof.11.b.tt: "#G +100#! gold\nPrestige #R −5#!"
 oe_cof.11.c: "Leave things as they are"
 oe_cof.11.c.tt: "Nothing changes"
 oe_cof.12.t: "The Marching Camp"
 oe_cof.12.desc: "A treatise of Constantine VII lists six camps in Asia Minor, from Malagina in Bithynia to Dazimon. Before a campaign the troops of the themes gathered there to join the emperor's main army, and supplies were stored in them. Now a campaign is under way: the Domestikos [SCOPE.sCharacter('oe_cof_holder').GetName] wants the troops of [SCOPE.sCountry('oe_cof_theme').GetName] merged into [SCOPE.sCharacter('oe_cof_holder').GetHerHis] main army, and [SCOPE.sCharacter('oe_cof_strategos').GetName], the strategos, insists on leading the theme's own men.\n\nDomestikos [SCOPE.sCharacter('oe_cof_holder').GetName]: Military ability [SCOPE.sCharacter('oe_cof_holder').GetAbility('mil')|0]"
 oe_cof.12.desc.good: "A treatise of Constantine VII lists six camps in Asia Minor, from Malagina in Bithynia to Dazimon. Before a campaign the troops of the themes gathered there to join the emperor's main army, and supplies were stored in them. Now a campaign is under way: the Domestikos [SCOPE.sCharacter('oe_cof_holder').GetName] wants the troops of [SCOPE.sCountry('oe_cof_theme').GetName] merged into [SCOPE.sCharacter('oe_cof_holder').GetHerHis] main army, and [SCOPE.sCharacter('oe_cof_strategos').GetName], the strategos, insists on leading the theme's own men. [SCOPE.sCharacter('oe_cof_holder').GetName] is a seasoned soldier, and the army trusts [SCOPE.sCharacter('oe_cof_holder').GetHerHim].\n\nDomestikos [SCOPE.sCharacter('oe_cof_holder').GetName]: Military ability [SCOPE.sCharacter('oe_cof_holder').GetAbility('mil')|0]"
 oe_cof.12.desc.bad: "A treatise of Constantine VII lists six camps in Asia Minor, from Malagina in Bithynia to Dazimon. Before a campaign the troops of the themes gathered there to join the emperor's main army, and supplies were stored in them. Now a campaign is under way: the Domestikos [SCOPE.sCharacter('oe_cof_holder').GetName] wants the troops of [SCOPE.sCountry('oe_cof_theme').GetName] merged into [SCOPE.sCharacter('oe_cof_holder').GetHerHis] main army, and [SCOPE.sCharacter('oe_cof_strategos').GetName], the strategos, insists on leading the theme's own men. [SCOPE.sCharacter('oe_cof_holder').GetName] has seen little fighting, and the veterans of the theme do not trust [SCOPE.sCharacter('oe_cof_holder').GetHerHim].\n\nDomestikos [SCOPE.sCharacter('oe_cof_holder').GetName]: Military ability [SCOPE.sCharacter('oe_cof_holder').GetAbility('mil')|0]"
 oe_cof.12.a: "Put everything under [SCOPE.sCharacter('oe_cof_holder').GetName]"
 oe_cof.12.a.tt: "If [SCOPE.sCharacter('oe_cof_holder').GetName] has at least #Y 60#! Military ability: Current campaign pressure #G −10#!; otherwise: Current campaign pressure #G −3#!\n[SCOPE.sCountry('oe_cof_theme').GetName] loyalty #R −10#!, also added to its loyalty target for #Y 5#! years"
 oe_cof.12.b: "Let [SCOPE.sCharacter('oe_cof_strategos').GetName] lead the theme's own men"
 oe_cof.12.b.tt: "[SCOPE.sCountry('oe_cof_theme').GetName] loyalty #G +5#!, also added to its loyalty target for #Y 5#! years\n[SCOPE.sCountry('oe_cof_theme').GetName] military efficiency #G +10#! (#Y 5#! years)\nCurrent campaign pressure #R +5#!"
 oe_cof.12.c: "Replace [SCOPE.sCharacter('oe_cof_holder').GetName] with [SCOPE.sCharacter('oe_cof_cand').GetName]"
 oe_cof.12.c.tt: "[SCOPE.sCharacter('oe_cof_holder').GetName] is removed as Domestikos; the office falls vacant and its bonus stops at once\n[SCOPE.sCharacter('oe_cof_cand').GetName] becomes Domestikos\nLegitimacy #R −5#!\n[SCOPE.sCountry('oe_cof_theme').GetName] loyalty #G +5#!, also added to its loyalty target for #Y 5#! years"
 oe_cof.13.t: "Land and Sea"
 oe_cof.13.desc: "In 917 Leo Phokas, Domestic of the Schools, led the army against Bulgaria. The fleet under Romanos Lekapenos was to ferry the Pechenegs across the Danube to join him, but Romanos quarrelled with their leader and the help never came. On 20 August the imperial army was all but destroyed at the Achelous, and Romanos was blamed for the defeat. Yet in March 919 he seized the palace with his fleet and married his daughter to the young Constantine VII, and the next year he took the throne himself; Leo rose against him and was blinded. Now the Domestikos [SCOPE.sCharacter('oe_cof_holder').GetName] and the Megas Doux [SCOPE.sCharacter('oe_cof_holder2').GetName] are blaming each other before the throne.\n\nDomestikos [SCOPE.sCharacter('oe_cof_holder').GetName]: Military ability [SCOPE.sCharacter('oe_cof_holder').GetAbility('mil')|0]\nMegas Doux [SCOPE.sCharacter('oe_cof_holder2').GetName]: Military ability [SCOPE.sCharacter('oe_cof_holder2').GetAbility('mil')|0]"
 oe_cof.13.a: "Side with [SCOPE.sCharacter('oe_cof_holder').GetName]"
 oe_cof.13.a.tt: "[SCOPE.sCharacter('oe_cof_holder2').GetName] is removed as Megas Doux; the office falls vacant and its bonus stops at once\nLegitimacy #R −5#!\nArmy tradition #G +5#!\nIf [SCOPE.sCharacter('oe_cof_holder2').GetName] belongs to one of the great houses: that house's influence #Y −30#!"
 oe_cof.13.b: "Side with [SCOPE.sCharacter('oe_cof_holder2').GetName]"
 oe_cof.13.b.tt: "[SCOPE.sCharacter('oe_cof_holder').GetName] is removed as Domestikos; the office falls vacant and its bonus stops at once\nLegitimacy #R −5#!\nNavy tradition #G +5#!\nIf [SCOPE.sCharacter('oe_cof_holder').GetName] belongs to one of the great houses: that house's influence #Y −30#!"
 oe_cof.13.c: "Draw clear lines and keep both"
 oe_cof.13.c.tt: "[oe_tu_authority|e] #R −2#!\nIf a campaign is running: its war pressure #R +5#!\nIf both have at least #Y 60#! Military ability, each sets out to outdo the other: Army tradition #G +2.5#!, Navy tradition #G +2.5#!"
