l_english:
 OE_VAS_STAGE_1: "The empire is the sultan's vassal and pays tribute. The sultan will ask for service in the field and a prince as hostage."
 OE_VAS_STAGE_2: "The usurper's war: tide #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_vas_tide').GetValue|0]#! / #Y 100#! (at #Y 100#! the emperor wins; at #Y 0#!, or if the rebels hold Constantinople for #Y 2#! months, the usurper takes the throne); #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_vas_wm').GetValue|0]#! months of war so far, and after #Y 24#! the two sides make peace before the walls. The tide moves each month with control of Constantinople, Selymbria, Tzouroulos, Metrai and Bizye; the sultan's troops push it #R −1.5#! a month, Venetian ships #G +1#!."
 OE_VAS_STAGE_3: "The usurper reigns and the old emperor is shut in the Tower of Anemas. The sultan is still the empire's overlord."
 OE_VAS_STAGE_4: "The old emperor is restored and the usurper holds out in Galata; the succession is unresolved."
 oe_vas_vassalage: "Vassal of the Sultan"
 oe_vas_vassalage_desc: "#F After the Maritsa, John V accepted the Ottoman sultan as overlord. For decades afterwards the empire paid tribute, marched in the sultan's wars, and survived between the sultan and its own princes.#!\n\n[GetCountry('BYZ').Custom('OeVasStage')]\nThe sultan's patience: #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_vas_patience').GetValue|0]#! / #Y 100#! (at #Y 0#! the sultan turns on us; refused service, hostages refused and tribute withheld lower it, and each year's tribute paid on time raises it by #Y 5#!)\nYearly tribute: #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_vas_tribute').GetValue|0]#! gold, paid each January; the agreement renews itself when it expires. 'Stop Paying Tribute' on the Tribute and Truce card stops it, at the cost of the sultan's anger.\nIf the Ottoman army is less than #Y 1.5#! times ours for #Y 12#! months running, the yoke can be thrown off."
 STATIC_MODIFIER_NAME_oe_vas_vassal: "Vassal of the Sultan"
 STATIC_MODIFIER_NAME_oe_vas_tenedos_ven: "The Tenedos Debt"
 STATIC_MODIFIER_NAME_oe_vas_tenedos_dispute: "The Tenedos Quarrel"
 STATIC_MODIFIER_NAME_oe_vas_turk_aid: "The Sultan's Troops"
 STATIC_MODIFIER_NAME_oe_vas_selymbria: "Appanage of Selymbria"
 STATIC_MODIFIER_NAME_oe_vas_one_eye: "Half-Blinded"
 STATIC_MODIFIER_NAME_oe_vas_hostage: "Hostage at the Sultan's Court"
 oe_vas_refused_op: "Refused to Submit"
 oe_vas_stall_op: "Stalled over Submission"
 oe_vas_defied_op: "Refused to Punish the Prince"
 oe_vas_tenedos_ven_glad: "Was Given Tenedos"
 oe_vas_tenedos_spurned: "Refused Tenedos"
 oe_vas_tenedos_gen_angry: "Tenedos Given to Venice"
 oe_vas_tenedos_gen_glad: "Promised Tenedos"
 oe_vas_tenedos_ven_angry: "Tenedos Promised to Genoa"
 oe_vas_galata_betrayed: "The Emperor Broke His Word"
 oe_vas_venice_help: "Helped Restore the Old Emperor"
 oe_vas_galata_siege: "Galata Besieged"
 OE_VAS_REBELS: "The Usurper's Party"
 OE_VAS_REBELS_country: "The Usurper's Party"
 OE_VAS_REBELS_country_adjective: "Usurper's"
 oe_vas.1.t: "The Sultan's Terms"
 oe_vas.1.desc: "#F After the battle on the Maritsa the Serbian lords were dead or had submitted, and the empire had no friend left in Thrace. John V at last accepted Murad I as overlord: tribute, service in the sultan's campaigns, and a prince sent to the sultan's court.#!\n\nNow the envoys of [SCOPE.sCharacter('oe_vas_su').GetName] have come to Constantinople with the same terms: tribute every year, the emperor to march with the sultan's army, and a prince to live at the sultan's court. Accept, and the capital and the few towns left can be kept; refuse, and the Turkish horse in Thrace can be at the walls any day."
 oe_vas.1.a: "Accept the sultan as overlord"
 oe_vas.1.a.tt: "Pay the Ottomans #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_ttb_peace_amount')|0]#! gold each January (#Y 3#! months of our total income), the first year now; a truce of #Y 5#! years; an agreement already running with them is kept\nThe price of signing: prestige #R −15#!, [oe_tu_authority|e] #R −5#!, and the [Concept('oe_tu_senate','senate')|e] will grumble at the tribute\nGain [ShowModifier('oe_vas_vassal')] while the vassalage lasts\nThe situation 'Vassal of the Sultan' begins: the sultan will ask for service in the field and a prince as hostage; if the sultan's patience falls to #Y 0#!, the sultan turns on us"
 oe_vas.1.b: "Refuse"
 oe_vas.1.b.tt: "Ottoman opinion of us #R −50#! (#Y 5#! years)\nThe sultan will ask again in #Y 3#! years; after #Y 3#! refusals, no more"
 oe_vas.1.c: "Play for time with the promise of Western help"
 oe_vas.1.c.tt: "Ottoman opinion of us #R −20#! (#Y 2#! years)\nThe sultan will come back in #Y 2#! years"
 oe_vas.2.t: "Marching with the Sultan"
 oe_vas.2.desc: "#F In 1373 John V marched with Murad into Asia Minor, as the terms required. To contemporaries a Roman emperor fighting the sultan's wars was a deeper humiliation than tribute.#!\n\nThis year [SCOPE.sCharacter('oe_vas_su').GetName] campaigns against the Turkish lords of Asia Minor, and by the terms the Roman emperor must come with troops. The palace is divided: some say the emperor must go in person to show obedience, some that a theme's levy will do, and some that it is cheaper to pay."
 oe_vas.2.desc_alt: "#F Andronikos IV won the throne with the sultan's troops, handed Gallipoli back to Murad once crowned, and went on paying tribute as the sultan's vassal.#!\n\n[SCOPE.sCharacter('oe_vas_su').GetName] is campaigning again this year, and sends to remind [SCOPE.sCharacter('oe_vas_h').GetName] who helped open the city gates. The court knows the new emperor's throne was the sultan's gift and refusing would cost dearly; yet the throne is not secure, and leaving the capital may give the old emperor's friends their chance."
 oe_vas.2.a: "The emperor goes in person"
 oe_vas.2.a.tt: "The sultan's patience #G +15#!"
 oe_vas.2.b: "Send a theme's troops"
 oe_vas.2.b.tt: "An army-[Concept('oe_tu_course','course')|e] theme [Concept('oe_tu_march','marches')|e]: loyalty #R −5#! (also in its target for #Y 5#! years)\nThe sultan's patience #G +10#!"
 oe_vas.2.c: "Pay instead"
 oe_vas.2.c.tt: "Costs #Y 1#! month of our total income\nThe sultan's patience #G +5#!"
 oe_vas.2.d: "Make excuses"
 oe_vas.2.d.tt: "The sultan's patience #R −25#!"
 oe_vas.3.t: "A Prince for the Sultan's Court"
 oe_vas.3.desc: "#F John V's second son Manuel spent time as a hostage at the Ottoman court, and later had to follow the sultan on campaign.#!\n\n[SCOPE.sCharacter('oe_vas_su').GetName] wants a prince at court to 'learn its manners'. Everyone knows what that means: a hostage. The sultan has named the emperor's second son, [SCOPE.sCharacter('oe_vas_s').GetName]."
 oe_vas.3.a: "Send [SCOPE.sCharacter('oe_vas_s').GetName]"
 oe_vas.3.a.tt: "[SCOPE.sCharacter('oe_vas_s').GetName] becomes a #bold #color_yellow Hostage at the Sultan’s Court#!#! for #Y 5#! years and cannot sit in the cabinet\nThe sultan's patience #G +20#!"
 oe_vas.3.b: "Send the heir's son [SCOPE.sCharacter('oe_vas_g').GetName] instead"
 oe_vas.3.b.tt: "[SCOPE.sCharacter('oe_vas_g').GetName] goes to the sultan's court for #Y 5#! years\n[SCOPE.sCharacter('oe_vas_h').GetName] is embittered\nThe sultan's patience #G +10#!"
 oe_vas.3.c: "Refuse"
 oe_vas.3.c.tt: "The sultan's patience #R −20#!"
 oe_vas.4.t: "Two Princes Conspire"
 oe_vas.4.desc: "#F In May 1373 Andronikos joined Murad's son Savcı in Thrace, and the two rose together against their fathers.#!\n\nOur agents report that [SCOPE.sCharacter('oe_vas_h').GetName] and [SCOPE.sCharacter('oe_vas_t').GetName], son of [SCOPE.sCharacter('oe_vas_su').GetName], have met in Thrace. Two heirs too impatient to wait have agreed to rise together, one against the Roman emperor and one against the sultan."
 oe_vas.4.a: "Strike first and arrest [SCOPE.sCharacter('oe_vas_h').GetName]"
 oe_vas.4.a.tt: "[SCOPE.sCharacter('oe_vas_h').GetName] is imprisoned for #Y 5#! years and cannot be heir meanwhile\n[SCOPE.sCharacter('oe_vas_h').GetName] is embittered\nThe sultan's patience #G +5#!"
 oe_vas.4.b: "Wait and see"
 oe_vas.4.b.tt: "It will be decided within a month"
 oe_vas.4.c: "Warn the sultan"
 oe_vas.4.c.tt: "[SCOPE.sCharacter('oe_vas_h').GetName] is embittered; it will be decided within a month\nThe sultan's patience #G +10#!"
 oe_vas.5.t: "The Sultan's Demand"
 oe_vas.5.desc: "#F The rising soon failed. Murad blinded Savcı and then had Savcı put to death, and required John V to do the same to Andronikos. John V had Andronikos blinded in one eye only.#!\n\nThe rising has failed. [SCOPE.sCharacter('oe_vas_su').GetName] has blinded [SCOPE.sCharacter('oe_vas_t').GetName] and then had them put to death, and now sends to Constantinople: the emperor must do the same to [SCOPE.sCharacter('oe_vas_h').GetName], or the agreement between us is void."
 oe_vas.5.a: "Blind them in both eyes"
 oe_vas.5.a.tt: "[SCOPE.sCharacter('oe_vas_h').GetName] is blinded, #R loses the right to succeed#! and is imprisoned for #Y 5#! years\nThe eldest son of [SCOPE.sCharacter('oe_vas_h').GetName], if alive, suffers the same\nThe sultan's patience #G +30#!"
 oe_vas.5.b: "Blind one eye only"
 oe_vas.5.b.tt: "[SCOPE.sCharacter('oe_vas_h').GetName] is #bold #color_yellow Half-Blinded#!#!: they keep the right to succeed, but are imprisoned for #Y 5#! years and embittered\nThe sultan's patience #G +15#!"
 oe_vas.5.c: "Refuse"
 oe_vas.5.c.tt: "Ottoman opinion of us #R −50#! (#Y 10#! years)\nThe sultan's patience #R −40#!"
 oe_vas.6.t: "The Second Son as Heir"
 oe_vas.6.desc: "#F Andronikos was shut in the Tower of Anemas, and John V made the second son, Manuel, heir.#!\n\n[SCOPE.sCharacter('oe_vas_h').GetName] has been shut in the Tower of Anemas. The emperor decrees that [SCOPE.sCharacter('oe_vas_s').GetName] is heir."
 oe_vas.6.a: "[SCOPE.sCharacter('oe_vas_s').GetName] is heir"
 oe_vas.6.a.tt: "[SCOPE.sCharacter('oe_vas_s').GetName] becomes heir"
 oe_vas.7.t: "Venice Wants Tenedos"
 oe_vas.7.desc: "#F On the way home from Rome John V was held in Venice for debt, and the Venetians asked for the island of Tenedos in settlement.#!\n\nThe Venetians have come with the emperor's old notes of debt: #bold #color_yellow Tenedos#!#! to settle them, and a sum in cash besides. The island guards the mouth of the Dardanelles. The Genoese let it be known that if it goes to Venice, Galata will not stand by."
 oe_vas.7.a: "Hand over the island"
 oe_vas.7.a.tt: "Gain [ShowModifier('oe_vas_tenedos_ven')] for #Y 20#! years\nVenetian opinion of us #G +20#!, Genoese #R −30#!\nIf the crown jewels are still pawned in Venice, they come back too (#G prestige rises#!)"
 oe_vas.7.b: "Refuse"
 oe_vas.7.b.tt: "Venetian opinion of us #R −20#!"
 oe_vas.8.t: "Friends in Galata"
 oe_vas.8.desc: "#F In July 1376 the Genoese helped Andronikos out of prison, and Andronikos went straight to the sultan.#!\n\nThe Genoese have bribed the gaolers, and [SCOPE.sCharacter('oe_vas_h').GetName] has slipped out of the Tower of Anemas by night and across the Golden Horn to Galata. The whole city is guessing whom [SCOPE.sCharacter('oe_vas_h').GetName] will turn to next."
 oe_vas.8.a: "Search the city"
 oe_vas.8.a.tt: "#G 40%#! chance to bring [SCOPE.sCharacter('oe_vas_h').GetName] back; otherwise [SCOPE.sCharacter('oe_vas_h').GetName] goes to the sultan"
 oe_vas.8.b: "Strengthen the walls"
 oe_vas.8.b.tt: "If it comes to a fight, #G tide +10#! at the start; [SCOPE.sCharacter('oe_vas_h').GetName] goes to the sultan"
 oe_vas.8.c: "Let it be"
 oe_vas.8.c.tt: "[SCOPE.sCharacter('oe_vas_h').GetName] goes to the sultan"
 oe_vas.9.t: "The Prince's Price"
 oe_vas.9.desc: "#F Andronikos promised to give Gallipoli back to the Ottomans, and got the sultan's horsemen in return.#!\n\n[SCOPE.sCharacter('oe_vas_h').GetName] has reached the camp of [SCOPE.sCharacter('oe_vas_su').GetName] with a rich offer: help take the capital, and the empire's castles on the straits are the sultan's, the tribute paid as before. The sultan is weighing it."
 oe_vas.9.a: "Outbid the prince"
 oe_vas.9.a.tt: "Costs one year's tribute\n#G 60%#! chance the sultan stays out: [SCOPE.sCharacter('oe_vas_h').GetName] stays in Galata and there is no war; otherwise the sultan [Concept('oe_tu_march','marches')|e]"
 oe_vas.9.b: "Ask Venice for ships"
 oe_vas.9.b.tt: "Venetian ships stand with us: in the fighting, #G tide +1#! a month"
 oe_vas.9.c: "Prepare for the worst"
 oe_vas.9.c.tt: "#G Tide +10#! at the start"
 oe_vas.10.t: "The Usurper at the Gates"
 oe_vas.10.desc: "#F On 12 August 1376 Andronikos broke into Constantinople with Ottoman and Genoese troops and imprisoned John V and Manuel.#!\n\n[SCOPE.sCharacter('oe_vas_h').GetName] has come to the walls with Turks and Genoese, and there are friends waiting inside. The emperor must hold the city, and the throne."
 oe_vas.10.a: "Hold the city"
 oe_vas.10.a.tt: "If we still hold towns outside the capital, [SCOPE.sCharacter('oe_vas_h').GetName] rises there and the situation 'Vassal of the Sultan' shows the tide of the usurper's war; if the rebels hold Constantinople for #Y 2#! months, [SCOPE.sCharacter('oe_vas_h').GetName] takes the throne\nIf we hold nothing outside the walls, it is a palace coup, decided within a month"
 oe_vas.11.t: "A New Emperor"
 oe_vas.11.desc: "#F Andronikos IV was crowned in October 1377, and shut John V and Manuel in the Tower of Anemas.#!\n\nThe gates are open. [SCOPE.sCharacter('oe_vas_h').GetName] is crowned in Hagia Sophia; the old emperor [SCOPE.sCharacter('oe_vas_e').GetName] and [SCOPE.sCharacter('oe_vas_s').GetName] are shut in the Tower of Anemas. From today the empire serves a new emperor."
 oe_vas.11.a: "Long live the emperor"
 oe_vas.11.a.tt: "[SCOPE.sCharacter('oe_vas_h').GetName] becomes emperor; [SCOPE.sCharacter('oe_vas_e').GetName] and [SCOPE.sCharacter('oe_vas_s').GetName] are imprisoned for #Y 10#! years\nThe eldest son of [SCOPE.sCharacter('oe_vas_h').GetName], if alive, becomes heir\nThe sultan is still the empire's overlord and the tribute is still paid"
 oe_vas.12.t: "Two Promises"
 oe_vas.12.desc: "#F Andronikos IV promised Tenedos to Genoa, but the garrison would not have it and handed the island to Venice; the two sea republics went to war over it.#!\n\nThe Genoese want their reward for the escape and the city: the island of #bold #color_yellow Tenedos#!#!. The Venetians have their eyes on it too, and both are waiting for the emperor's word."
 oe_vas.12.a: "Promise Tenedos to Genoa"
 oe_vas.12.a.tt: "Genoese opinion of us #G +20#!, Venetian #R −40#!\nGain [ShowModifier('oe_vas_tenedos_dispute')] for #Y 5#! years"
 oe_vas.12.b: "Go back on it"
 oe_vas.12.b.tt: "Genoese opinion of us #R −20#!"
 oe_vas.13.t: "Gallipoli for the Sultan"
 oe_vas.13.desc: "#F In 1376-1377 Andronikos IV gave back to the Ottomans the Gallipoli that the Count of Savoy had won for the empire ten years before.#!\n\nThe envoys of [SCOPE.sCharacter('oe_vas_su').GetName] have come for the promised reward: #bold #color_yellow Gallipoli#!#!, the empire's most important castle on the European shore of the straits."
 oe_vas.13.a: "Hand it over"
 oe_vas.13.a.tt: "#R Gallipoli goes to the Ottomans#!\nThe sultan's patience returns to #Y 100#!"
 oe_vas.13.b: "Break the promise"
 oe_vas.13.b.tt: "#R The sultan's patience falls to 0#!: the sultan turns on us"
 oe_vas.14.t: "The Old Emperor Escapes"
 oe_vas.14.desc: "#F On 1 July 1379 John V and Manuel escaped from the Tower of Anemas and were restored with the sultan's help; Andronikos withdrew to the Genoese at Galata.#!\n\n[SCOPE.sCharacter('oe_vas_e').GetName] and [SCOPE.sCharacter('oe_vas_s').GetName] have escaped from the Tower of Anemas. Many in the city still remember the old emperor, and [SCOPE.sCharacter('oe_vas_su').GetName] sends word: for a fifth more tribute, the sultan will help the old emperor back to the throne."
 oe_vas.14.a: "Restore the old emperor with the sultan's help"
 oe_vas.14.a.tt: "[SCOPE.sCharacter('oe_vas_e').GetName] is restored and [SCOPE.sCharacter('oe_vas_h').GetName] withdraws to Galata\nYearly tribute #R +20%#!\nThe sultan's patience #G +20#!"
 oe_vas.14.b: "Restore the old emperor with Venetian ships"
 oe_vas.14.b.tt: "[SCOPE.sCharacter('oe_vas_e').GetName] is restored and [SCOPE.sCharacter('oe_vas_h').GetName] withdraws to Galata\nVenetian opinion of us #G +20#!\nThe sultan's patience #R −10#!"
 oe_vas.14.c: "Seal the city and bring them back"
 oe_vas.14.c.tt: "[SCOPE.sCharacter('oe_vas_e').GetName] and [SCOPE.sCharacter('oe_vas_s').GetName] are caught and imprisoned #Y 5#! more years; no escape for #Y 3#! years\nThe sultan's patience #R −30#!"
 oe_vas.15.t: "Hostages in Galata"
 oe_vas.15.desc: "#F When Andronikos withdrew to Galata, members of the imperial family went with them as hostages, among them their mother Helena; the Genoese closed the gates.#!\n\n[SCOPE.sCharacter('oe_vas_h').GetName] took several members of the imperial family to Galata as hostages. The Genoese have shut the gates, and the city can only watch across the Golden Horn."
 oe_vas.15.a: "Besiege Galata"
 oe_vas.15.a.tt: "Genoese opinion of us #R −30#!\nThe hostages are freed and the succession comes to a head sooner (#G prestige rises#!)"
 oe_vas.15.b: "Negotiate"
 oe_vas.15.b.tt: "Talks begin and the succession comes to a head sooner"
 oe_vas.16.t: "The Succession Settled"
 oe_vas.16.desc: "#F In 1381 John V was reconciled with Andronikos: Andronikos and the young John became heirs again, ahead of Manuel, and were given Selymbria as an appanage.#!\n\nAfter so long a standoff all sides sit down to talk. [SCOPE.sCharacter('oe_vas_h').GetName] will lay down arms if they and their son [SCOPE.sCharacter('oe_vas_g').GetName] become heirs again, with #bold #color_yellow Selymbria#!#! as an appanage. The supporters of [SCOPE.sCharacter('oe_vas_s').GetName] refuse outright."
 oe_vas.16.a: "Restore the elder line"
 oe_vas.16.a.tt: "[SCOPE.sCharacter('oe_vas_h').GetName] returns and becomes heir again (if blind, [SCOPE.sCharacter('oe_vas_g').GetName] instead)\nSelymbria gains [ShowModifier('oe_vas_selymbria')]\n[SCOPE.sCharacter('oe_vas_s').GetName] is resentful and may yet go their own way"
 oe_vas.16.b: "Keep [SCOPE.sCharacter('oe_vas_s').GetName] as heir"
 oe_vas.16.b.tt: "[SCOPE.sCharacter('oe_vas_s').GetName] stays heir\n[SCOPE.sCharacter('oe_vas_h').GetName] stays in Galata and does not return"
 oe_vas.17.t: "The Peace of Turin"
 oe_vas.17.desc: "#F On 8 August 1381 Venice and Genoa made peace at Turin: Tenedos went to the Count of Savoy, its castle was to be pulled down and its people moved away.#!\n\nVenice and Genoa have made peace at last. So that neither can have #bold #color_yellow Tenedos#!#!, they agree to raze the castle and move the islanders away; no one is to hold it."
 oe_vas.17.a: "An empty island"
 oe_vas.17.a.tt: "Every modifier tied to Tenedos ends"
 oe_vas.18.t: "The Sultan's Wrath"
 oe_vas.18.desc: "#F The emperors after John V tried again and again to throw off Ottoman overlordship, and each time it brought the sultan's armies down on them.#!\n\nThe patience of [SCOPE.sCharacter('oe_vas_su').GetName] is at an end. The envoy brings back a single message: since the Roman emperor does not keep the agreement, neither need the sultan."
 oe_vas.18.a: "We shall see"
 oe_vas.18.a.tt: "The vassalage is over: the tribute agreement is void and #R the truce ends#!; if an agreement was still running, prestige #R −10#! and Ottoman opinion of us #R −40#!"
 oe_vas.19.t: "Free of the Yoke"
 oe_vas.19.desc: "#F After the battle of Ankara the Ottomans fell into civil war, and the empire was freed of tribute by the treaty of Gallipoli.#!\n\nThe Ottoman armies are not what they were, and the empire's troops can hold the Turkish horse again. Some at court say it is time to stop paying the sultan."
 oe_vas.19.a: "Stop the tribute"
 oe_vas.19.a.tt: "The tribute agreement ends without breach; #G prestige rises#!"
 oe_vas.19.b: "Keep paying for quiet"
 oe_vas.19.b.tt: "Keep paying until the agreement expires; no more service or hostages"
 oe_vas.20.t: "The Usurper Fails"
 oe_vas.20.desc: "#F In 1376 Andronikos IV took the city; this time it has held.#!\n\nThe forces of [SCOPE.sCharacter('oe_vas_h').GetName] break up beneath the walls and [SCOPE.sCharacter('oe_vas_h').GetName] is taken. The emperor has [SCOPE.sCharacter('oe_vas_h').GetName] shut in the Tower of Anemas again."
 oe_vas.20.a: "Back to the Tower of Anemas"
 oe_vas.20.a.tt: "[SCOPE.sCharacter('oe_vas_h').GetName] is imprisoned for #Y 10#! years; the rebels' towns return to the empire"
 oe_vas.21.t: "A Peace Before the Walls"
 oe_vas.21.desc: "#F John V and Andronikos IV were reconciled in 1381, and Andronikos was given Selymbria as an appanage.#!\n\nTwo years of fighting, and neither side can win. Peace is made before the walls: [SCOPE.sCharacter('oe_vas_h').GetName] lays down arms and becomes heir again, with #bold #color_yellow Selymbria#!#! as an appanage."
 oe_vas.21.a: "At least the fighting has stopped"
 oe_vas.21.a.tt: "The rebels' towns return to the empire; [SCOPE.sCharacter('oe_vas_h').GetName] becomes heir again (if blind, [SCOPE.sCharacter('oe_vas_g').GetName] instead)\nSelymbria gains [ShowModifier('oe_vas_selymbria')]"
