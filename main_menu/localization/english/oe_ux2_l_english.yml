 oe_ux2.1.t: "The Imperial Cartography Hall & Grand Ledger"
 oe_ux2.1.desc: "Master cosmographers and treasury clerks have unveiled six new strategic cartographic overlays and fifteen standardized ledger registers in the royal map room. From the forty-seven Destiny Mission realms and provincial control gradients to suzerain spheres and imperial corridors, the entire Eurasian order can now be inspected at a glance."
 oe_ux2.1.a: "Endow the Imperial Atlas & Geodetic Bureau"
 oe_ux2.1.b: "Standardize the Grand Cadastral Ledger Office"
 oe_ux2.1.c: "Publish Chancery Suzerain & Treaty Folios"
 oe_ux2.2.t: "The Prime Meridian Globe & Spheres of Influence"
 oe_ux2.2.desc: "Brass armillary spheres and hand-painted vellum globes now anchor our diplomatic chambers. Envoys trace suzerain tributary blocs and oceanic charter lines across both hemispheres, weighing how distant protectorates and maritime lanes reshape the balance of empires."
 oe_ux2.2.a: "Issue Prime Meridian Navigation Folios"
 oe_ux2.2.b: "Ratify the Hemispheric Suzerain Compact"
 oe_ux2.2.c: "Charter Oceanic Merchant Portolans"
 oe_ux2.3.t: "Survey of Imperial Roads, Grand Canals & Steam Depots"
 oe_ux2.3.desc: "Surveyors returning from every province have compiled a continental blueprint of paved highways, royal post roads, excavated canal locks, and emerging steam railway depots. By charting bottlenecks along our arterial corridors, the crown can turn scattered towns into a single high-velocity economic engine."
 oe_ux2.3.a: "Expand the Continental Road & Relay Charter"
 oe_ux2.3.b: "Commission the Grand Canal & Steam Survey Corps"
 oe_ux2.3.c: "Audit the Unified Corridor Toll Registry"
 oe_ux2.4.t: "The Little Ice Age Almanac & Grand State Audit"
 oe_ux2.4.desc: "Prolonged frosts, shifting harvests, and regional outbreaks have prompted our chancery to pair the Climate and Famine Risk overlay with a full parliamentary and granary audit. Forewarned by weather logs and reserve ledgers, wise sovereigns can shield their subjects before winter hardship turns into rebellion."
 oe_ux2.4.a: "Distribute the Imperial Harvest & Granary Almanac"
 oe_ux2.4.b: "Lay the Grand Ledger before Parliament & Councils"
 oe_ux2.4.c: "Establish the Epidemic & Climate Frontier Watch"
