 STATIC_MODIFIER_NAME_oe_mil_byz_feudal_cling: "Clinging to Old Feudal Cataphracts"
 STATIC_MODIFIER_DESC_oe_mil_byz_feudal_cling: "Preserving hereditary cataphract privileges placates magnates and keeps heavy cavalry strong in the short run, but leaves the empire exposed to modern volleys."
 STATIC_MODIFIER_NAME_oe_mil_yuan_shenji_doctrine: "Great Yuan Shenjiying Firearms Doctrine"
 STATIC_MODIFIER_DESC_oe_mil_yuan_shenji_doctrine: "Merging steppe discipline with imperial bronze-casting establishes standing Shenjiying handgonne regiments, lifting infantry and siegecraft at heavier arsenal upkeep."
 STATIC_MODIFIER_NAME_oe_mil_yuan_carabinier_doctrine: "Keshig Carabinier Maneuver Doctrine"
 STATIC_MODIFIER_DESC_oe_mil_yuan_carabinier_doctrine: "Equipping Keshig guards and Tammachi garrisons with carbines and light horse guns boosts cavalry shock and speed at steep remount and powder costs."
 STATIC_MODIFIER_NAME_oe_mil_yuan_modern_arsenal: "Dadu Arsenal & Reformed Shenjiying Order"
 STATIC_MODIFIER_DESC_oe_mil_yuan_modern_arsenal: "Centering military modernization on the Dadu Imperial Foundry unites line Shenjiying musketeers with heavy artillery at steep fiscal cost and princely grumbling."
 STATIC_MODIFIER_NAME_oe_mil_yuan_steppe_cling: "Clinging to Traditional Horse Archery"
 STATIC_MODIFIER_DESC_oe_mil_yuan_steppe_cling: "Steppe princes defend ancestral bow-and-saddle supremacy against foundry reforms, pleasing nobles and keeping mobility high while falling behind gunpowder warfare."
 STATIC_MODIFIER_NAME_oe_mil_rus_streltsy_charter: "Standing Streltsy Regimental Charter"
 STATIC_MODIFIER_DESC_oe_mil_rus_streltsy_charter: "Granting hereditary settlements and trade exemptions secures staunch arquebus-and-berdiche Streltsy regiments at fiscal cost and growing political entitlement."
 STATIC_MODIFIER_NAME_oe_mil_rus_cossack_charter: "Charter of the Six Frontier Cossack Hosts"
 STATIC_MODIFIER_DESC_oe_mil_rus_cossack_charter: "Imperial charters formalize the six frontier Cossack hosts from the Dnieper to Siberia, enhancing light cavalry and expedition endurance while irritating landed nobles."
 STATIC_MODIFIER_NAME_oe_mil_rus_new_order_doctrine: "New-Order Guards & Line Doctrine"
 STATIC_MODIFIER_DESC_oe_mil_rus_new_order_doctrine: "Replacing old pomestye levies and Streltsy with drilled New-Order line guards and Cossack lancers raises Russian discipline to first-rank standards at heavy upkeep."
 STATIC_MODIFIER_NAME_oe_mil_rus_old_order_cling: "Preserving Pomestye & Streltsy Privileges"
 STATIC_MODIFIER_DESC_oe_mil_rus_old_order_cling: "Leaving hereditary pomestye riders and Streltsy privileges untouched keeps conservatives quiet in the short run but traps the realm in a severe firepower gap."
 STATIC_MODIFIER_NAME_oe_mil_firepower_gap: "Firepower Gap: Obsolete Feudal Ranks"
 STATIC_MODIFIER_DESC_oe_mil_firepower_gap: "Entering the Age of Absolutism without modernizing into flintlock line armies leaves obsolete feudal formations shattered by volley fire and field cannon. Enact firearm modernization or the drill reform decision to remove this penalty."
 STATIC_MODIFIER_NAME_oe_mil_silk_artillery_exchange: "Silk Road Artillery Exchange: Twin-Phoenix Foundries"
 STATIC_MODIFIER_DESC_oe_mil_silk_artillery_exchange: "Across the Silk Road Twin Phoenix corridor, Constantinopolitan bronze founders and Dadu Shenjiying engineers trade casting molds, corned powder, and gunnery tables, boosting artillery and research at modest mission upkeep."
 STATIC_MODIFIER_NAME_oe_mil_drill_readiness: "Cross-Era Live-Fire Military Review"
 STATIC_MODIFIER_DESC_oe_mil_drill_readiness: "Full-scale live-fire volleys, combined-arms artillery drills, and frontier cavalry reviews sharpen discipline, morale, and army tradition at heavier upkeep."
 oe_mil_byz_pike_shot_tagma: "Pike-and-Shot Tagmata"
