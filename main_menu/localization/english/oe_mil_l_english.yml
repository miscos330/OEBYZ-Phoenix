 oe_mil_rus_cossack_lancers: "Life-Guard Cossack Lancers"
 oe_mil_rus_cossack_lancers_desc: "Imperial Guard light lancers recruited from the veteran frontier Cossack hosts, unmatched in rapid flanking, relentless pursuit, and low-attrition deep raids."
 oe_mil_cos_zaporozhian: "Zaporozhian Cossack Plastuny"
 oe_mil_cos_zaporozhian_desc: "Raised exclusively from Zaporozhian Cossack settlements along the Dnieper Sich, masters of musket skirmishing, wagon-fort tactics, and river-coastal raids."
 oe_mil_cos_don: "Don Cossack Steppe Raiders"
