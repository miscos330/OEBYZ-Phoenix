 oe_mil_adv_yuan_shenjiying: "Great Yuan Shenjiying Firearms"
 oe_mil_adv_yuan_shenjiying_desc: "Organizes centralized gunpowder regiments armed from imperial foundries, unlocking Yuan Shenjiying Handgonne Corps and boosting heavy infantry."
 oe_mil_adv_yuan_keshig_carabiniers: "Keshig Carabinier Modernization"
