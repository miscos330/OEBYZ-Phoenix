 STATIC_MODIFIER_NAME_oe_mil_byz_siphon_doctrine: "Siphonophoroi Assault Doctrine"
 STATIC_MODIFIER_DESC_oe_mil_byz_siphon_doctrine: "Refitting ancient Greek Fire siphons into portable projectors and incendiary grenades boosts siegecraft and artillery at steeper upkeep."
