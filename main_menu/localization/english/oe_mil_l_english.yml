 oe_mil.1.t: "Convergence of Matchlock and Greek Fire"
 oe_mil.1.d: "As Reformation-era warfare engulfs the Balkans and Italy, the ancient Roman Tagmata stand at a gunpowder crossroads. The Master of Ordnance presents two doctrines: weave dense pike squares around disciplined matchlock volleys, or revive the imperial Greek Fire formula in portable siphons and incendiary grenades to shatter enemy breaches."
 oe_mil.1.a: "Drill Pike-and-Shot Tagmata Squares"
 oe_mil.1.a.tt: "Costs #R 140#! gold; gain [ShowModifier('oe_mil_byz_pike_doctrine')] for #Y 25 years#!, advancing Tagmata pike-and-shot modernization."
 oe_mil.1.b: "Commission Siphonophoroi Grenadier Foundries"
 oe_mil.1.b.tt: "Costs #R 160#! gold; gain [ShowModifier('oe_mil_byz_siphon_doctrine')] for #Y 25 years#!, boosting siegecraft and morale shock."
 oe_mil.2.t: "Imperial Line Regiments and Cuirassier Kataphraktoi"
 oe_mil.2.d: "In the Age of Absolutism, standardized flintlock volleys and standing line regiments rule the battlefield. Reorganizing the Tagmata and provincial themes into musketeer lines and steel-clad cuirassier cataphracts will secure Roman military primacy; clinging to hereditary feudal cavalry will expose the empire to a punishing firepower gap."
 oe_mil.2.a: "Enact Full Line-Theme & Cuirassier Modernization"
 oe_mil.2.a.tt: "Completes Byzantine firearm modernization (enabling the #Y Imperial Musketeer Tagma#! advance and removing any Firepower Gap); gains [ShowModifier('oe_mil_byz_line_modernized')] for #Y 35 years#!, with halved reform cost if v8.0 military reform is already complete."
 oe_mil.2.b: "Placate Magnates and Keep Old Feudal Ranks"
 oe_mil.2.b.tt: "Gains [ShowModifier('oe_mil_byz_feudal_cling')] for #Y 20 years#!, but refusing Absolutism-era firearm reform immediately inflicts [ShowModifier('oe_mil_firepower_gap')] until modernized via decision!"
 oe_mil.3.t: "The Yuan Shenjiying and Keshig Firearms"
 oe_mil.3.d: "While the Imperial Keshig and Tammachi garrisons still command the steppe-agrarian frontier, gunpowder volleys and heavy ordnance are reshaping Eurasian warfare. The Privy Council proposes either expanding standing Shenjiying handgonne formations with imperial foundry support, or re-arming the Keshig elite with flintlock carbines for devastating mounted firepower."
 oe_mil.3.a: "Expand Standing Shenjiying Handgonne Corps"
 oe_mil.3.a.tt: "Costs #R 150#! gold; gains [ShowModifier('oe_mil_yuan_shenji_doctrine')] for #Y 25 years#!, laying the groundwork for combined-arms gunpowder doctrine."
 oe_mil.3.b: "Re-Arm the Keshig Guard as Carabiniers"
 oe_mil.3.b.tt: "Costs #R 160#! gold; gains [ShowModifier('oe_mil_yuan_carabinier_doctrine')] for #Y 25 years#!, boosting heavy cavalry shock and speed."
 oe_mil.4.t: "Dadu Imperial Artillery and Reformed Shenjiying"
 oe_mil.4.d: "As the Age of Absolutism dawns, line musketry and disciplined field batteries dominate Eurasian battlefields. The superintendents of the Dadu Foundry urge replacing legacy formations with Reformed Shenjiying line regiments and imperial artillery battalions, yet conservative steppe princes cling fiercely to ancestral bow-and-saddle privilege."
 oe_mil.4.a: "Enact New Shenjiying & Dadu Artillery Modernization"
 oe_mil.4.a.tt: "Completes Great Yuan firearm modernization (enabling #Y Reformed Shenjiying#! and #Y Dadu Imperial Artillery#! advances and removing any Firepower Gap); gains [ShowModifier('oe_mil_yuan_modern_arsenal')] for #Y 35 years#!, with halved cost if v8.0 Shenjiying reform is active."
 oe_mil.4.b: "Appease Steppe Princes and Keep Horse-Archery Primacy"
 oe_mil.4.b.tt: "Gains [ShowModifier('oe_mil_yuan_steppe_cling')] for #Y 20 years#!, but refusing Absolutism-era firearm modernization immediately inflicts [ShowModifier('oe_mil_firepower_gap')] until modernized via decision!"
 oe_mil.5.t: "Standing Streltsy and the Six Frontier Cossack Hosts"
 oe_mil.5.d: "As the Rus' realms outgrow feudal druzhiny and traditional pomestye levies, two pillars of power emerge: permanent Streltsy regiments armed with matchlocks and berdiche axes, and the six frontier Cossack hosts guarding the Dnieper, Don, Yaik, Terek, Siberian, and Kuban marches. The crown must decide which martial charter receives priority funding."
 oe_mil.5.a: "Enact the Standing Streltsy Regimental Charter"
 oe_mil.5.a.tt: "Costs #R 140#! gold; gains [ShowModifier('oe_mil_rus_streltsy_charter')] for #Y 25 years#!, strengthening standing heavy infantry and land morale."
 oe_mil.5.b: "Issue the Charter of the Six Frontier Cossack Hosts"
 oe_mil.5.b.tt: "Costs #R 130#! gold; gains [ShowModifier('oe_mil_rus_cossack_charter')] for #Y 25 years#!, boosting light cavalry, attrition resilience, and Cossack satisfaction."
 oe_mil.6.t: "The New-Order Guards Transition"
 oe_mil.6.d: "With the Age of Absolutism, once-feared pomestye riders and hereditary Streltsy falter before modern European flintlock lines and bayonet charges. Forging drilled New-Order Guards line regiments and Life-Guard Cossack lancers will elevate Russia into a first-rank military power; indulging old Streltsy privileges will condemn the army to a crippling firepower gap."
 oe_mil.6.a: "Modernize into New-Order Guards & Cossack Lancers"
 oe_mil.6.a.tt: "Completes Russian firearm modernization (enabling the #Y New-Order Guards Regulations#! advance and removing any Firepower Gap); gains [ShowModifier('oe_mil_rus_new_order_doctrine')] for #Y 35 years#!, with halved cost if Petrine reform is already active."
 oe_mil.6.b: "Keep Hereditary Pomestye & Streltsy Privileges"
 oe_mil.6.b.tt: "Gains [ShowModifier('oe_mil_rus_old_order_cling')] for #Y 20 years#!, but refusing Absolutism-era firearm modernization immediately inflicts [ShowModifier('oe_mil_firepower_gap')] until modernized via decision!"
 oe_mil.7.t: "Firepower Gap Warning: Feudal Ranks Shattered"
 oe_mil.7.d: "Grim dispatches flood the imperial court: though the realm has entered the Age of Absolutism, its armies have still not completed the shift to flintlock line infantry and modern field artillery. Traditional formations crumble under disciplined enemy volley fire. The crown must fund an emergency crash modernization or endure a severe firepower gap until reform is enacted."
 oe_mil.7.a: "Fund Emergency Crash Firearm Modernization"
 oe_mil.7.a.tt: "Costs #R 260#! gold and #R 5#! stability; immediately completes firearm modernization, clears [ShowModifier('oe_mil_firepower_gap')], and grants [ShowModifier('oe_mil_drill_readiness')] for #Y 10 years#!."
 oe_mil.7.b: "Endure the Gap Until the Treasury Recovers"
 oe_mil.7.b.tt: "Inflicts [ShowModifier('oe_mil_firepower_gap')] until this civilization completes early modern military reform or enacts its live-fire drill modernization decision."
 oe_mil.8.t: "Silk Road Artillery Exchange: Byzantine Foundries & Yuan Shenjiying"
 oe_mil.8.d: "Along the active Silk Road Twin Phoenix corridor, bronze founders from Constantinople and gunpowder engineers from the Dadu Shenjiying exchange casting molds, corned-powder formulas, and ballistic quadrants. Endowing a joint ordnance mission will bring a historic leap in artillery power and military research to both empires."
 oe_mil.8.a: "Ratify the Twin-Phoenix Joint Ordnance Mission"
 oe_mil.8.a.tt: "Costs #R 120#! gold; gains [ShowModifier('oe_mil_silk_artillery_exchange')] for #Y 30 years#! and advances #Y Artillery#! and #Y Military Revolution#! institution progress in the capital."
 oe_mil.8.b: "Guard Ordnance Secrets and Decline Exchange"
 oe_mil.8.b.tt: "Saves mission funding and gains #G +5#! prestige, but forgoes the Silk Road artillery exchange bonus."
