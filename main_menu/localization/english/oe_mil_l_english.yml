 oe_mil_yuan_tammachi: "Tammachi Frontier Garrison"
 oe_mil_yuan_tammachi_desc: "Hereditary Tammachi frontier troops garrisoning steppe-agrarian marches, prized for low supply attrition, wide flanking sweeps, and mastery of grasslands and plateaus."
 oe_mil_yuan_shenjiying: "Yuan Shenjiying Handgonne Corps"
 oe_mil_yuan_shenjiying_desc: "Standing gunpowder corps forged by Restored Yuan arsenals, deploying volley handgonnes and swivel guns in disciplined ranks to break armored charges."
 oe_mil_yuan_keshig_carabiniers: "Keshig Carabinier Guard"
 oe_mil_yuan_keshig_carabiniers_desc: "Reformation-era Keshig guards who traded composite bows for repeating carbine volleys, retaining steppe speed while delivering lethal close-range firepower."
 oe_mil_yuan_new_shenjiying: "Reformed Shenjiying Line Musketeers"
 oe_mil_yuan_new_shenjiying_desc: "Modernized Absolutism-era Shenjiying line regiments equipped with standardized flintlocks, paper cartridges, and drilled platoon fire under the Dadu reforms."
 oe_mil_yuan_imperial_artillery: "Dadu Imperial Artillery Battalion"
 oe_mil_yuan_imperial_artillery_desc: "Heavy siege and field artillery battalions cast by the Dadu Imperial Foundry, combining Eurasian ballistic science for devastating bombardments and battlefield firepower."
 oe_mil_rus_druzhina: "Princely Druzhina"
 oe_mil_rus_druzhina_desc: "Sworn armored retainers of the Rus' princes, famed for unyielding shield-and-axe battle lines across northern forests and winter campaigns."
 oe_mil_rus_pomestye_cav: "Pomestye Service Cavalry"
 oe_mil_rus_pomestye_cav_desc: "Service-gentry cavalry funded by conditional pomestye estates, blending steppe-influenced mounted archery with shock charges at economical crown upkeep."
 oe_mil_rus_streltsy: "Streltsy Arquebusiers"
 oe_mil_rus_streltsy_desc: "Russia's first standing gunpowder infantry: bracing heavy matchlocks atop crescent berdiche axes to deliver fierce volleys before wading into brutal melee."
 oe_mil_rus_new_order: "New-Order Guards Line Infantry"
