 oe_mil_cos_siberian: "Siberian Cossack Expeditionaries"
 oe_mil_cos_siberian_desc: "Raised exclusively from Siberian Cossack settlements, frost-hardened musket pioneers built for deep taiga marches and drastically reduced expedition attrition."
 oe_mil_cos_kuban: "Kuban Cossack Black Sea Cavalry"
 oe_mil_cos_kuban_desc: "Raised exclusively from Kuban Cossack settlements along the Black Sea frontier, swift light horsemen guarding coastal steppe approaches and harrying enemy flanks."
 oe_mil_adv_byz_pike_shot: "Pike-and-Shot Tagmata Drill"
