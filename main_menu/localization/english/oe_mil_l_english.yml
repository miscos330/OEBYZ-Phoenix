 oe_mil_adv_cos_steppe_hosts: "Dnieper & Don Cossack Host Charters"
 oe_mil_adv_cos_steppe_hosts_desc: "Charters the Zaporozhian and Don frontier hosts, enabling recruitment of their unique regiments in matching Cossack settlements."
 oe_mil_adv_cos_eastern_hosts: "Yaik & Siberian Cossack Expeditions"
 oe_mil_adv_cos_eastern_hosts_desc: "Extends Cossack frontier hosts across the Ural River and Siberian taiga, unlocking Yaik and Siberian regiments and cutting land attrition."
 oe_mil_adv_cos_caucasus_hosts: "Caucasus & Black Sea Cossack Hosts"
