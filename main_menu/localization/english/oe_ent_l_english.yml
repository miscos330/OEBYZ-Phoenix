l_english:
 STATIC_MODIFIER_NAME_oe_ent_tier_steady: "Imperial Entropy Tier I: Balanced Equilibrium"
 STATIC_MODIFIER_DESC_oe_ent_tier_steady: "Five-dimensional imperial entropy stands below 30, keeping administration, treasury, and frontiers in steady order; holding this equilibrium for 120 consecutive months unlocks Pax Imperialis."
 STATIC_MODIFIER_NAME_oe_ent_tier_pressure: "Imperial Entropy Tier II: Imperial Strain"
 STATIC_MODIFIER_DESC_oe_ent_tier_pressure: "Imperial entropy has reached 30-54: scale, inflation, or prolonged campaigns are beginning to erode tax efficiency and provincial control. Early active reforms are advised."
 STATIC_MODIFIER_NAME_oe_ent_tier_crisis: "Imperial Entropy Tier III: Crisis Alert"
 STATIC_MODIFIER_DESC_oe_ent_tier_crisis: "Imperial entropy stands at 55-79: overextension, frontier defiance, and fiscal strain converge, reducing revenue, manpower, control, and legitimacy while risking provincial crises."
 STATIC_MODIFIER_NAME_oe_ent_tier_decay: "Imperial Entropy Tier IV: Brink of Imperial Decay"
 STATIC_MODIFIER_DESC_oe_ent_tier_decay: "Imperial entropy has crossed 80: central authority frays across distant frontiers as upkeep spikes, revenues shrink, and separatism surges. Sweeping structural reform and peace are urgently required."
 STATIC_MODIFIER_NAME_oe_ent_pax_imperialis: "Pax Imperialis: Age of Enduring Peace"
 STATIC_MODIFIER_DESC_oe_ent_pax_imperialis: "Earned by keeping five-dimensional entropy below 30 for ten consecutive years across an empire of 150+ locations. Prosperity, law, and commerce flourish, permanently reducing positive monthly entropy growth by 25%."
 STATIC_MODIFIER_NAME_oe_ent_mod_currency_reform: "Monetary & Silver Stabilization Reform"
 STATIC_MODIFIER_DESC_oe_ent_mod_currency_reform: "Recalling debased coinage and anchoring bullion reserves sharply counters Dimension 2 monetary entropy (-0.65/month) at the price of tighter short-term commerce."
 STATIC_MODIFIER_NAME_oe_ent_mod_admin_inspect: "Imperial Inspectorate & Prefectural Audit"
 STATIC_MODIFIER_DESC_oe_ent_mod_admin_inspect: "Imperial auditors review provincial tax rolls and rotate frontier commands, countering Dimension 1 overextension (-0.60/month) and Dimension 3 satrapy (-0.50/month) while angering nobles and raising upkeep."
 STATIC_MODIFIER_NAME_oe_ent_mod_tolerance_charter: "Edict of Universal Tolerance & Autonomous Foederati"
 STATIC_MODIFIER_DESC_oe_ent_mod_tolerance_charter: "Guaranteeing religious liberties and autonomous frontier charters counters Dimension 4 cultural-religious overload (-0.60/month) and separatism while alienating orthodox clergy."
 STATIC_MODIFIER_NAME_oe_ent_mod_amnesty_peace: "Grand Amnesty & Peacetime Recovery"
 STATIC_MODIFIER_DESC_oe_ent_mod_amnesty_peace: "Remitting arrears and demobilizing levies in peacetime rapidly drains Dimension 5 war fatigue (-0.80/month extra in peace) and boosts prosperity at the cost of lower short-term tax and army morale."
 STATIC_MODIFIER_NAME_oe_ent_mod_silver_shock: "Silver Price Revolution Shock"
 STATIC_MODIFIER_DESC_oe_ent_mod_silver_shock: "Floods of bullion inflate grain prices and military wages; trade volume swells briefly while inflation and army upkeep squeeze the treasury."
 STATIC_MODIFIER_NAME_oe_ent_mod_satrap_defiance: "Frontier Governor Tax Defiance"
 STATIC_MODIFIER_DESC_oe_ent_mod_satrap_defiance: "Distant governors withhold crown taxes under the pretext of frontier defense, placating local magnates while eroding central revenue and control."
 STATIC_MODIFIER_NAME_oe_ent_mod_provincial_turmoil: "Restive Frontier Provinces"
 STATIC_MODIFIER_DESC_oe_ent_mod_provincial_turmoil: "Harsh requisitions inflame unassimilated provinces, raising separatism, hampering recruitment, and straining imperial stability."
 STATIC_MODIFIER_NAME_oe_ent_mod_great_reform_triumph: "Great Imperial Reform Renewal"
 STATIC_MODIFIER_DESC_oe_ent_mod_great_reform_triumph: "Decisive structural reform cleanses fiscal arrears and revitalizes imperial administration at the lasting resentment of entrenched aristocrats."
 STATIC_MODIFIER_NAME_oe_ent_mod_yuan_baochao_guard: "Great Yuan Baochao Reserve Board"
 STATIC_MODIFIER_DESC_oe_ent_mod_yuan_baochao_guard: "An imperial reserve board anchors paper Baochao to silver bullion, curbing inflation and steadying commerce at modest fiscal and merchant concessions."
 STATIC_MODIFIER_NAME_oe_ent_mod_rus_guberniya_audit: "Tsarist Guberniya & Frontier Audit"
 STATIC_MODIFIER_DESC_oe_ent_mod_rus_guberniya_audit: "Senate auditors tighten oversight over vast guberniyas and Cossack hosts, lifting control and manpower while stirring boyar resistance and audit expenses."
 oe_ent_dec_currency_reform.title: "Entropy Counter: Monetary & Silver Stabilization"
 oe_ent_dec_currency_reform.desc: "Recall debased coinage and establish bullion reserves: immediately reduces Imperial Entropy by 8 and cuts inflation while countering Dimension 2 monetary pressure (-0.65/month) for 10 years. Cost: 220 Gold, burgher displeasure, and short-term trade contraction."
 oe_ent_dec_currency_reform.a: "Enact the Monetary & Silver Stabilization Edict"
 oe_ent_dec_admin_inspect.title: "Entropy Counter: Imperial Inspectorate & Prefectural Audit"
 oe_ent_dec_admin_inspect.desc: "Dispatch imperial auditors to inspect provincial tax rolls and rotate frontier commanders: immediately reduces Imperial Entropy by 10 (plus Exarchate loyalty for Byzantium/Rome) while countering Dimension 1 (-0.60/month) and Dimension 3 (-0.50/month) for 10 years. Cost: 200 Gold, -4 Stability, noble displeasure."
 oe_ent_dec_admin_inspect.a: "Dispatch the Imperial Inspectorate"
 oe_ent_dec_tolerance_charter.title: "Entropy Counter: Universal Tolerance & Foederati Charter"
 oe_ent_dec_tolerance_charter.desc: "Grant religious tolerance and autonomous Foederati charters to diverse provinces: immediately reduces Imperial Entropy by 8 while countering Dimension 4 cultural-religious overload (-0.60/month) and separatism for 10 years. Cost: 160 Gold, 10 Prestige, clergy displeasure."
 oe_ent_dec_tolerance_charter.a: "Promulgate the Edict of Universal Tolerance"
 oe_ent_dec_amnesty_peace.title: "Entropy Counter: Grand Amnesty & Peacetime Recovery"
 oe_ent_dec_amnesty_peace.desc: "Peacetime only: remit tax arrears and demobilize tired levies, resetting prolonged-war count, sharply reducing war exhaustion, and cutting Imperial Entropy by 12 with an extra -0.80/month peacetime recovery for 6 years. Cost: 180 Gold, 12 Prestige, lower short-term tax and army morale."
 oe_ent_dec_amnesty_peace.a: "Proclaim the Grand Amnesty"
 OE_PILLARS_ENTROPY: "Entropy"
 OE_PILLARS_ENTROPY_DESC: "Open the Imperial Entropy Visual Dashboard: inspect the five-dimensional monthly ledger, Praetorian Prefecture and Exarchate mitigation, and enact all four active countermeasures."
 OE_ENT_UI_TITLE: "Imperial Entropy Overview"
 OE_ENT_UI_MODAL_TITLE: "Imperial Entropy Visual Dashboard"
 OE_ENT_UI_MODAL_CLOSE_TT: "Close the Imperial Entropy dashboard window."
 OE_ENT_UI_STATE_ACTIVE: "#G Engine Active#!"
 OE_ENT_UI_STATE_STANDBY: "#medium Standby (Below Threshold)#!"
 OE_ENT_UI_STATE_TT: "The Imperial Entropy engine activates automatically at 150 locations (Byzantium, Rome, Great Yuan, Russia), 200 locations (other sovereign realms), or when Burden of Rome begins. It stays off under Lite rule."
 OE_ENT_UI_BANNER_SUB: "Transparent Five-Dimension Ledger · Zero Hidden Penalties · Hold <30 for 120 mo for Pax Imperialis"
 OE_ENT_UI_BAR_LEFT: "0 Steady"
 OE_ENT_UI_BAR_MID: "Imperial Entropy Index (0-100)"
 OE_ENT_UI_BAR_RIGHT: "100 Decay"
 OE_ENT_UI_BAR_TIERS: "Tiers: 0-29 Steady | 30-54 Strain | 55-79 Crisis | 80+ Brink of Decay"
 OE_ENT_UI_KPI_IDX: "Entropy Index"
 OE_ENT_UI_KPI_IDX_TT: "Composite Imperial Entropy index (0-100), updated monthly from the five-dimension net delta and synchronized to a single active tier modifier."
 OE_ENT_UI_KPI_DELTA: "Monthly Delta"
 OE_ENT_UI_KPI_DELTA_TT: "Net monthly change across all five dimensions (green lowers entropy, red raises it). Hardcore adds +35% to positive growth; Pax Imperialis permanently cuts positive growth by 25%."
 OE_ENT_UI_KPI_PAX: "Pax Imperialis"
 OE_ENT_UI_KPI_PAX_DONE: "#color_yellow Pax Imperialis#!"
 OE_ENT_UI_KPI_PAX_TT: "Hold Imperial Entropy below 30 for 120 consecutive months (10 years) with 150+ locations to crown Pax Imperialis, permanently reducing positive monthly entropy growth by 25%."
 OE_ENT_UI_DIM_TITLE: "Five-Dimensional Monthly Breakdown"
 OE_ENT_UI_D1: "D1: Overextension"
 OE_ENT_UI_D1_TT: "Overextension & administrative decay beyond 150 locations. Offset by Praetorian Prefectures, Exarchates, capital settlements, Great Yuan / Russian reforms, and Imperial Audit (-0.60/mo)."
 OE_ENT_UI_D2: "D2: Inflation"
 OE_ENT_UI_D2_TT: "Monetary & Silver Price Revolution pressure driven by inflation (>=5%/10%/20%), deficits/loans, and post-1550 bullion shocks. Countered by Yuan Baochao/silver policies and Stabilize Currency (-0.65/mo)."
 OE_ENT_UI_D3: "D3: Satrapy Drift"
 OE_ENT_UI_D3_TT: "Frontier satrapy & governor drift driven by disloyal Themes/Exarchates and Military Prefectures (offset by Civil Prefectures), or low stability for other empires. Countered by Imperial Audit (-0.50/mo)."
 OE_ENT_UI_D4: "D4: Culture & Faith"
 OE_ENT_UI_D4_TT: "Cultural & religious overload from low religious unity (<80%/65%/50%) and vast scale. Countered by Romanization campaigns and the Edict of Universal Tolerance (-0.60/mo)."
 OE_ENT_UI_D5: "D5: War Fatigue"
 OE_ENT_UI_D5_TT: "Multi-front war & hegemonic fatigue: rises with war, exhaustion, and 36+ war months. Peacetime drains -2.00/mo (-1.00/mo extra at stability >=50, and -0.80/mo extra under Grand Amnesty)."
 OE_ENT_UI_MIT_TITLE: "Mitigation & Single-Track Ledger"
 OE_ENT_UI_MIT_REL: "Pref. Relief"
 OE_ENT_UI_MIT_REL_TT: "Monthly administrative relief snapshot from the Sacrum Consistorium's Praetorian Prefectures and 12 Dioceses (O(1) monthly cache offsetting Dimension 1 Overextension)."
 OE_ENT_UI_MIT_CIV: "Civil Pref."
 OE_ENT_UI_MIT_CIV_TT: "Active Senatorial Civil Praetorian Prefectures: stronger administrative relief while lowering Dimension 3 Satrapy Drift."
 OE_ENT_UI_MIT_MIL: "Mil. Pref."
 OE_ENT_UI_MIT_MIL_TT: "Active Military Praetorian Prefectures: strengthens frontier defense at modest Dimension 3 Satrapy Drift; balance with Civil Prefectures or Imperial Audit."
 OE_ENT_UI_MIT_LOY: "Disloyal"
 OE_ENT_UI_MIT_LOY_TT: "Monthly snapshot of low-loyalty Themes and Exarchates (band <=1, capped at 4; each adds +0.30/mo to Dimension 3)."
 OE_ENT_UI_AR_MERGED: "Single-Track Merged with Burden of Rome: unified tiers, zero double penalty"
 OE_ENT_UI_AR_MERGED_TT: "Imperial Entropy has merged seamlessly with Burden of Rome's Imperial Strain and removed legacy strain penalties so double punishment never occurs."
 OE_ENT_UI_MIT_NOTE: "Universal mitigation: peace (-2.0/mo base) and high stability >=50 (-1.0/mo extra) form the core decline engine; Byzantium/Rome leverage Prefectures & Exarchates, Great Yuan uses restored Secretariat & Baochao policies, and Russia uses Guberniya reforms."
 OE_ENT_UI_ACT_TITLE: "Active Countermeasures (One-Click)"
 OE_ENT_UI_BTN_CURRENCY: "Stabilize Currency (-8)"
 OE_ENT_UI_BTN_CURRENCY_TT: "Enact Monetary & Silver Stabilization (shared with Country Decisions): requires sovereign, >=220 Gold, off 10y cooldown, and inflation >=4% or entropy >=25. Effect: -8 entropy, lowers inflation, -0.65/mo to D2 for 10y (cost: 220 Gold & burgher friction)."
 OE_ENT_UI_BTN_INSPECT: "Imperial Audit (-10)"
 OE_ENT_UI_BTN_INSPECT_TT: "Enact Imperial Inspectorate & Prefectural Audit (shared with Country Decisions): requires sovereign, >=200 Gold, stability >=0, off 10y cooldown, and entropy >=20. Effect: -10 entropy, +10 Exarchate loyalty, -0.60/mo D1 and -0.50/mo D3 for 10y (cost: 200 Gold, -4 Stability, noble friction)."
 OE_ENT_UI_BTN_TOLERANCE: "Tolerance Edict (-8)"
 OE_ENT_UI_BTN_TOLERANCE_TT: "Enact Edict of Universal Tolerance & Foederati Autonomy (shared with Country Decisions): requires sovereign, >=160 Gold, >=10 Prestige, off 10y cooldown, and entropy >=20. Effect: -8 entropy, -0.60/mo D4 and lower separatism for 10y (cost: 160 Gold, 10 Prestige, clergy friction)."
 OE_ENT_UI_BTN_AMNESTY: "Grand Amnesty (-12)"
 OE_ENT_UI_BTN_AMNESTY_TT: "Enact Grand Amnesty & Peacetime Recovery (shared with Country Decisions): requires sovereign, at peace, >=180 Gold, >=12 Prestige, off 6y cooldown, and entropy >=15. Effect: -12 entropy, resets war months, cuts exhaustion, extra -0.80/mo in peace for 6y (cost: 180 Gold, 12 Prestige)."
 OE_ENT_UI_ACT_HINT: "Disabled buttons indicate standby mode, active cooldown, wartime, or unmet cost/threshold; open Decisions for full breakdown."
 OE_ENT_UI_BTN_DECISIONS: "Decisions"
 OE_ENT_UI_BTN_DECISIONS_TT: "Open the Country Decisions view to inspect all countermeasures and imperial decisions."
 OE_ENT_UI_ROADMAP_TITLE: "Imperial Scale Threshold · Entropy Unlock Roadmap"
 OE_ENT_UI_ROADMAP_PROG_LBL: "Owned Locations Progress (Activation Threshold: 150)"
 OE_ENT_UI_ROADMAP_PROG_TT: "Imperial Entropy activates on the next monthly tick once you own 150 locations (Byzantium, Rome, Great Yuan, Russia), 200 locations (other sovereign realms), or enter Burden of Rome. Disabled under Lite rule."
 OE_ENT_UI_ROADMAP_SUB: "While below the 150-location scale threshold, Imperial Entropy remains on standby with zero penalties. Reaching 150 locations promotes this tab and activates the full five-dimensional governance engine:"
 OE_ENT_UI_ROADMAP_B1: "• #Y Overextension Monitoring#!: Transparent monthly five-dimensional ledger tracking overextension, inflation, satrapy drift, cultural overload, and war fatigue with zero hidden penalties."
 OE_ENT_UI_ROADMAP_B2: "• #Y Corruption & Frontier Countermeasures#!: Unlocks 4 active decrees (Currency Reform, Imperial Audit, Tolerance Edict, Grand Amnesty) and the 120-month Pax Imperialis crown milestone."
 OE_ENT_UI_ROADMAP_B3: "• #Y Provincial Decentralization Relief#!: Praetorian Prefectures, Exarchates, and Romanization directly offset monthly entropy and merge cleanly with Burden of Rome with zero double penalty."
 OE_ENT_UI_JUMP_COURT: "Open Precedence"
 OE_ENT_UI_JUMP_COURT_TT: "Jump to the Day-1 active Precedence view to appoint the 7 court offices, manage noble houses, and expand Imperial Senate seats."
 OE_ENT_UI_JUMP_EDICTS: "Open Edicts"
 OE_ENT_UI_JUMP_EDICTS_TT: "Jump to the Day-1 active Edicts tab to enact military, fiscal, and civil imperial decrees."
 oe_ent.1.t: "Undercurrents of Grandeur: First Signs of Imperial Entropy"
 oe_ent.1.d: "As imperial borders span hundreds of provinces, ledgers in the treasury and chancery reveal growing administrative drag: distant dispatches slow, inflation and military wages bite into revenues, frontier governors grow bold, unassimilated realms chafe, and endless campaigns wear down the state.\n\nYet decline is never fate. Every point of Imperial Entropy stems transparently from five measurable pressures—overextension, currency, frontier satrapy, culture and faith, and war fatigue—each countered by active statecraft. Hold entropy below 30 for ten years to crown an age of Pax Imperialis."
 oe_ent.1.a: "Launch an Immediate Fiscal & Cadastral Audit"
 oe_ent.1.a.tt: "Gold #R −120#!, Stability #G +2#!, Imperial Entropy #G −6#!."
 oe_ent.1.b: "Delegate Routine Authority to Provincial Magnates"
 oe_ent.1.b.tt: "Gold #R −40#!, mild noble satisfaction gain, Imperial Entropy #G −3#!."
 oe_ent.1.c: "Stay the Course and Monitor the Five Ledgers"
 oe_ent.1.c.tt: "Prestige #G +5#!, Imperial Entropy #R +2#!."
 oe_ent.2.t: "Shock of the Silver Price Revolution"
 oe_ent.2.d: "Torrents of silver from oceanic routes and frontier mines collide with heavy war spending and debased coinage, sending grain prices and army wages soaring. Treasury ministers warn that unchecked inflation will relentlessly drive Dimension 2 monetary entropy higher.\n\nShall the crown spend hard reserves to mint high-fineness coinage, levy emergency customs surcharges on merchants, or let market prices absorb the bullion shock?"
 oe_ent.2.a: "Spend Reserves to Mint Stabilized Coinage and Recall Debased Bullion"
 oe_ent.2.a.tt: "Gold #R −240#!, lowers inflation, Imperial Entropy #G −8#!."
 oe_ent.2.b: "Impose Emergency Equalization Tariffs on Port Merchants"
 oe_ent.2.b.tt: "Burghers displeased; endure [ShowModifier('oe_ent_mod_silver_shock')] (#Y 8 years#!); Imperial Entropy #G −3#!."
 oe_ent.2.c: "Collect Seigniorage and Let Market Prices Float"
 oe_ent.2.c.tt: "Gold #G +120#!, raises inflation; endure [ShowModifier('oe_ent_mod_silver_shock')] (#Y 8 years#!); Imperial Entropy #R +6#!."
 oe_ent.3.t: "Frontier Governor Tax-Withholding Crisis"
 oe_ent.3.d: "Alarming dispatches arrive from distant frontier commands: governors holding military authority have begun withholding seasonal tax remittances under the pretext of garrison arrears, quietly expanding personal retinues. History records how great empires unravel when distant satraps outgrow the throne.\n\nShall the sovereign dispatch imperial inspectors to audit and rotate frontier commanders, concede local tax-farming to buy calm, or convene the Privy Council to negotiate shared oversight?"
 oe_ent.3.a: "Dispatch Imperial Inspectors and Rotate Frontier Commanders"
 oe_ent.3.a.tt: "Gold #R −180#!, Stability #R −4#!, noble displeasure; Imperial Entropy #G −10#! (also raises Exarchate loyalty for Byzantium/Rome)."
 oe_ent.3.b: "Concede Local Tax-Farming Rights to Avert Defiance"
 oe_ent.3.b.tt: "Gold #R −60#!; endure [ShowModifier('oe_ent_mod_satrap_defiance')] (#Y 6 years#!); Imperial Entropy #R +4#!."
 oe_ent.3.c: "Convene the Privy Council for a Negotiated Settlement"
 oe_ent.3.c.tt: "Gold #R −100#!, Prestige #R −8#!, Imperial Entropy #G −5#!."
 oe_ent.4.t: "Restive Multi-Ethnic Frontier Provinces"
 oe_ent.4.d: "Stretching across diverse tongues, customs, and creeds tests the sinews of empire. In several newly integrated and heterodox provinces, tax disputes and confessional friction spark coordinated market strikes and levy evasion, driving Dimension 4 cultural-religious overload upward.\n\nShall the court issue local charters of tolerance and autonomous Foederati rights, invest heavily in imperial schools and roads, or enforce compliance through punitive requisitions?"
 oe_ent.4.a: "Grant Charters of Tolerance and Autonomous Foederati Rights"
 oe_ent.4.a.tt: "Gold #R −140#!, clergy displeasure, Imperial Entropy #G −8#!."
 oe_ent.4.b: "Fund Imperial Assimilation Schools and Frontier Roads"
 oe_ent.4.b.tt: "Gold #R −220#!, Stability #R −3#!, Imperial Entropy #G −10#!."
 oe_ent.4.c: "Enforce Punitive Requisitions With Garrison Force"
 oe_ent.4.c.tt: "Gold #G +80#!; endure [ShowModifier('oe_ent_mod_provincial_turmoil')] (#Y 6 years#!); Imperial Entropy #R +6#!."
 oe_ent.5.t: "The Great Reckoning: Reform or Imperial Decay"
 oe_ent.5.d: "Alarm bells ring across the capital! Five-dimensional entropy has crossed the threshold of imperial decay: fiscal leakage, unruly satraps, inflation, and war fatigue converge into a systemic crisis. Piecemeal remedies no longer suffice—history separates enduring empires from fallen giants at this very crossroads.\n\nWill the throne pay the steep price of a sweeping Great Imperial Reform to break the spiral of decay, forge a compromise compact with the estates, or postpone reckoning?"
 oe_ent.5.a: "Enact the Great Imperial Reform Across Treasury, Provinces & Army"
 oe_ent.5.a.tt: "Gold #R −350#!, Stability #R −10#!, severe noble backlash; lowers inflation, cuts Imperial Entropy by #G −25#!, and grants [ShowModifier('oe_ent_mod_great_reform_triumph')] (#Y 20 years#!)."
 oe_ent.5.b: "Negotiate a Compromise Compact With Estates and Provinces"
 oe_ent.5.b.tt: "Gold #R −200#!, Prestige #R −15#!, lowers war exhaustion, Imperial Entropy #G −15#!."
 oe_ent.5.c: "Postpone Structural Reform and Cling to Emergency Levies"
 oe_ent.5.c.tt: "Stability #R −4#!, Prestige #R −10#!, Imperial Entropy #R +5#!."
 oe_ent.6.t: "Crowning of Pax Imperialis"
 oe_ent.6.d: "Ten unbroken years! Across an immense realm of 150 or more locations, your empire has held five-dimensional entropy below 30 for 120 consecutive months: provincial law holds firm, coinage stands trusted, frontier commanders obey, and merchants travel every highway in peace.\n\nChroniclers proclaim an age worthy of Augustus's Pax Romana and history's greatest golden eras. The permanent crown milestone of Pax Imperialis is yours, permanently reducing positive monthly entropy growth by 25%."
 oe_ent.6.a: "Proclaim the Age of Pax Imperialis Across Every Province"
 oe_ent.6.a.tt: "Permanently gain [ShowModifier('oe_ent_pax_imperialis')] (positive monthly entropy growth permanently #G −25%#!), Prestige #G +25#!, Legitimacy #G +15#!, Imperial Entropy #G −10#!."
 oe_ent.6.b: "Dedicate the Decade of Peace to Fiscal Reserves and Trade Charters"
 oe_ent.6.b.tt: "Permanently gain [ShowModifier('oe_ent_pax_imperialis')] (positive monthly entropy growth permanently #G −25%#!), Gold #G +250#!, Stability #G +8#!, Imperial Entropy #G −10#!."
 oe_ent.7.t: "Great Yuan Imperial Governance: Provinces, Baochao & Silver"
 oe_ent.7.d: "Restored Great Yuan spans steppe pastures, central plains, and southern maritime ports on a scale rarely matched in history. Yet censors of the Central Secretariat warn that unchecked branch secretariats, paper Baochao imbalances, and foreign silver inflows can reawaken late-Zhizheng decay.\n\nShall the Khagan establish an Imperial Baochao Reserve Board anchored in silver, empower Censorate inspectors over the branch secretariats, or uphold steady dual steppe-agrarian customs?"
 oe_ent.7.a: "Establish the Imperial Baochao & Silver Reserve Board"
 oe_ent.7.a.tt: "Gold #R −200#!, mild burgher friction; lowers inflation, cuts Imperial Entropy by #G −12#!, and grants [ShowModifier('oe_ent_mod_yuan_baochao_guard')] (#Y 15 years#!)."
 oe_ent.7.b: "Dispatch Central Censors to Audit Every Branch Secretariat"
 oe_ent.7.b.tt: "Gold #R −150#!, Stability #R −3#!, Prestige #G +10#!, Imperial Entropy #G −10#!."
 oe_ent.7.c: "Reaffirm Traditional Steppe-and-Agrarian Dual Customs"
 oe_ent.7.c.tt: "Stability #G +4#!, Imperial Entropy #G −4#!."
 oe_ent.8.t: "Tsarist Imperial Governance: Guberniya Audit & Frontier Cossacks"
 oe_ent.8.d: "From Moscow's white-stone Kremlin across the Volga, the Urals, and the boundless steppe, the Tsar's domains expand at breathtaking speed—bringing stretched supply lines, overlapping old Prikaz chanceries, and fiercely independent frontier Cossack hosts.\n\nShall the Tsar decree a sweeping Guberniya & Senate Frontier Audit, charter frontier Cossacks as autonomous marcher defenders, or rely on the traditional Boyar Duma for steady transition?"
 oe_ent.8.a: "Decree the Imperial Guberniya & Senate Frontier Audit"
 oe_ent.8.a.tt: "Gold #R −200#!, noble displeasure; cuts Imperial Entropy by #G −12#! and grants [ShowModifier('oe_ent_mod_rus_guberniya_audit')] (#Y 15 years#!)."
 oe_ent.8.b: "Charter Frontier Cossack Hosts as Autonomous Marcher Defenders"
 oe_ent.8.b.tt: "Gold #R −120#!, Stability #R −2#!, Prestige #G +10#!, Imperial Entropy #G −9#!."
 oe_ent.8.c: "Hold to the Traditional Boyar Duma and Prikaz Chanceries"
 oe_ent.8.c.tt: "Stability #G +4#!, Imperial Entropy #G −4#!."
 oe_ent.20.t: "Imperial Entropy: Decision Takes Effect"
 oe_ent.90.t: "Imperial Entropy: Five-Dimensional Transparent Ledger"
