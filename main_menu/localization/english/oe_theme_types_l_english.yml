l_english:
 oe_pillars_convert_theme_type: "Convert Theme Type"
 oe_pillars_convert_theme_type_desc: "#italic “Each command keeps its charge; all roads guard the throne.”#!\n\nConvert an ordinary, naval, administrative or frontier theme to another eligible type for 100 gold, without a cooldown. Its government reform, subject type, buildings and Pillars status change together. A naval conversion requires its existing capital to be coastal and grants ten current-age galleys there. An administrative conversion leaves shared wars with the overlord. Italian and Latin themes cannot be converted."
 oe_theme_conversion_choose_country: "Choose a Theme to Convert"
 oe_theme_conversion_choose_type: "Choose the New Theme Type"
 oe_theme_conversion_no_country: "@trigger_no! No eligible theme is available. Italian and Latin themes cannot be converted."
 oe_theme_conversion_no_type: "@trigger_no! No eligible target theme types are available."
 oe_theme_conversion_different_type: "Choose a type different from this theme's current type."
 oe_theme_conversion_coastal_seat: "A naval conversion requires the existing theme capital to be a coastal location owned by Byzantium."
 oe_empire_theme_naval: "Naval Theme"
 oe_empire_theme_naval_desc: "A naval command responsible for fleets, ports and sailors. Receives military pay but no manpower payment. Religious conversion is prohibited."
 oe_empire_theme_administrative: "Administrative Theme"
 oe_empire_theme_administrative_desc: "A provincial administration paying 10% of its tax base to its overlord each month. It does not join its overlord's wars or receive military pay or manpower payments. Religious conversion is prohibited."
 oe_empire_theme_frontier: "Frontier Theme"
 oe_empire_theme_frontier_desc: "A frontier command strengthening forts and garrisons, accelerating recruitment and reinforcement, and improving its overlord's army maintenance efficiency. Religious conversion is prohibited."
 oe_byz_theme_naval_subject: "Naval Theme System"
 oe_byz_theme_naval_subject_desc: "A coastal military administration supplying fleets and sailors. Expected fleet size increases by 50 ships; its naval maintenance subsidy declines as its fleet grows."
 oe_byz_theme_administrative_subject: "Administrative Theme System"
 oe_byz_theme_administrative_subject_desc: "Civil offices extend proximity, control and Crown authority while improving building upkeep efficiency."
 oe_byz_theme_frontier_subject: "Frontier Theme System"
 oe_byz_theme_frontier_subject_desc: "The imperial theme army system organized around fortified frontier seats and offices."
 oe_byz_theme_naval_seat: "Naval Theme Seat"
 oe_byz_theme_naval_seat_desc: "A coastal seat providing its building owner with gold equal to 100% of the local tax base, fixed income and 50 monthly sailors, while improving local shipbuilding and repairs."
 oe_byz_theme_naval_post: "Naval Theme Office"
 oe_byz_theme_naval_post_desc: "A naval office providing its building owner with gold equal to 15% of the local tax base and five monthly sailors, and increasing local sailors."
 oe_byz_theme_administrative_seat: "Administrative Theme Seat"
 oe_byz_theme_administrative_seat_desc: "A source of 50 proximity providing its building owner with gold equal to 100% of the local tax base and ten monthly gold, and strengthening local Crown power, while reducing local noble food consumption by 20%."
 oe_byz_theme_administrative_post: "Administrative Theme Office"
 oe_byz_theme_administrative_post_desc: "A civil office improving monthly control and proximity efficiency and providing its building owner with gold equal to 15% of the local tax base, while reducing local noble food consumption by 20%."
 oe_byz_theme_frontier_seat: "Frontier Theme Seat"
 oe_byz_theme_frontier_seat_desc: "A frontier seat providing its building owner with gold equal to 100% of the local tax base and fixed income while strengthening local forts and garrisons and reducing fort maintenance."
 oe_byz_theme_frontier_post: "Frontier Theme Office"
 oe_byz_theme_frontier_post_desc: "A frontier office providing its building owner with gold equal to 15% of the local tax base and 3 monthly manpower, and improving local forts and garrisons."
 oe_pillars_naval_theme: "Naval Theme"
 oe_pillars_naval_theme_desc: "A naval command counted for military pay by fleet size, but excluded from manpower payments."
 oe_pillars_administrative_theme: "Administrative Theme"
 oe_pillars_administrative_theme_desc: "A civil command excluded from military pay and manpower payments."
 oe_pillars_frontier_theme: "Frontier Theme"
 oe_pillars_frontier_theme_desc: "A frontier command receiving both military pay and manpower payments."
 oe_theme_naval_post_maintain: "Naval Office Upkeep"
 oe_theme_administrative_post_maintain: "Civil Office Upkeep"
 oe_theme_frontier_post_maintain: "Frontier Office Upkeep"
