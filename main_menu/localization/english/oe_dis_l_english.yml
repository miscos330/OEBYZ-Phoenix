 oe_dis_levantine_plague:0 "Levantine Recurrent Plague"
 oe_dis_levantine_plague_desc:0 "A recurrent early modern plague (1460-1750) resurfacing along busy shipping lanes from the Levant and Adriatic to Marseille and East Asian entrepots. Only double-island lazarettos, forty-day quarantena, and health magistracies can shield ports without starving commerce."
 oe_dis_levantine_plague_location_modifier:0 "Levantine Recurrent Plague in [location|e]"
 oe_dis_camp_fever:0 "Camp Fever & Liqi Pestilence"
 oe_dis_camp_fever_desc:0 "An early modern epidemic of siege-camp typhus and liqi pestilence (1485-1750) thriving in war-torn provinces and crowded bivouacs, posing grave danger to rulers and commanders alike. Frontier Pestkordon cordons, ever-normal granaries, and Wenyi Lun clinical wards curb its toll."
 oe_dis_camp_fever_location_modifier:0 "Camp Fever & Liqi Pestilence in [location|e]"
