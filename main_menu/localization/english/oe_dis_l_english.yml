 STATIC_MODIFIER_NAME_oe_dis_mild_buffer_mod:0 "Mild Epidemic Mode: Provincial Relief Buffer"
 STATIC_MODIFIER_DESC_oe_dis_mild_buffer_mod:0 "Under Rule #15 Mild mode, provincial quarantine reserves and charitable clinics cushion roughly half of the mortality and fiscal shock from early modern epidemics."
 STATIC_MODIFIER_NAME_oe_dis_asclepius_sanctuary_aegis_mod:0 "Sanctuary Aegis of Asclepius"
 STATIC_MODIFIER_DESC_oe_dis_asclepius_sanctuary_aegis_mod:0 "With Asclepius seated in the pantheon and the healing sanctuaries of Epidaurus and Pergamon held, sacred spring ablutions and secluded infirmaries shield the realm from early modern pestilence."
 STATIC_MODIFIER_NAME_oe_dis_granary_epidemic_cushion_mod:0 "Ever-Normal Granary Epidemic Relief"
 STATIC_MODIFIER_DESC_oe_dis_granary_epidemic_cushion_mod:0 "State ever-normal granaries distribute subsidized grain and medicinal broths to quarantined districts, breaking the famine-pestilence spiral and curbing unrest."
 STATIC_MODIFIER_NAME_oe_dis_quarantena_strict_mod:0 "Strict 40-Day Port Quarantena"
 STATIC_MODIFIER_DESC_oe_dis_quarantena_strict_mod:0 "All vessels arriving from suspect ports are detained forty days for cargo airing and fumigation; sea trade and burghers suffer temporarily to protect the realm's population."
 STATIC_MODIFIER_NAME_oe_dis_quarantena_nuovo_mod:0 "Double-Island 40-Day Quarantena"
 STATIC_MODIFIER_DESC_oe_dis_quarantena_nuovo_mod:0 "Using Lazzaretto Nuovo's ventilated tezoni warehouses to air cargo during the forty-day detention slashes trade disruption in half while maintaining full plague containment."
 STATIC_MODIFIER_NAME_oe_dis_quarantena_granary_mod:0 "Granary-Backed 40-Day Quarantena"
 STATIC_MODIFIER_DESC_oe_dis_quarantena_granary_mod:0 "Forty-day port detention paired with subsidized grain releases from ever-normal granaries softens urban shortages and burgher discontent during lockdowns."
 STATIC_MODIFIER_NAME_oe_dis_sanita_magistracy_mod:0 "Permanent Magistrato alla Sanita"
 STATIC_MODIFIER_DESC_oe_dis_sanita_magistracy_mod:0 "Modeled on Venice's permanent health magistracy, sworn commissioners audit foreign bills of health, inspect arriving manifests, and monitor Mediterranean contagion networks."
 STATIC_MODIFIER_NAME_oe_dis_wenyi_treatise_mod:0 "Wenyi Lun: Liqi Epidemic Medicine"
 STATIC_MODIFIER_DESC_oe_dis_wenyi_treatise_mod:0 "Official promulgation of Wu Youxing's Treatise on Pestilence replaces humoral guesswork with specific liqi contagion wards, curbing camp fever and typhus mortality while extending life expectancy."
 STATIC_MODIFIER_NAME_oe_dis_pestkordon_cordon_mod:0 "Frontier Pestkordon Sanitary Cordon"
 STATIC_MODIFIER_DESC_oe_dis_pestkordon_cordon_mod:0 "A permanent militarized border cordon of frontier garrisons and Kontumaz disinfection stations intercepts tainted caravans and shields interior provinces from recurrent plagues."
 STATIC_MODIFIER_NAME_oe_dis_court_seclusion_mod:0 "Royal Court Seclusion & Camp Seal"
 STATIC_MODIFIER_DESC_oe_dis_court_seclusion_mod:0 "Relocating the court away from stricken quarters and sealing infected bivouacs protects ruling elites at a modest cost to administrative speed and prestige."
 STATIC_MODIFIER_NAME_oe_dis_field_lazarets_mod:0 "Field Camp Lazarets & Sanitation"
 STATIC_MODIFIER_DESC_oe_dis_field_lazarets_mod:0 "Dedicated field lazarets, delousing pits, and boiled-water regulations along campaign camps sharply contain camp fever and typhus outbreaks."
 STATIC_MODIFIER_NAME_oe_dis_open_ports_gamble_mod:0 "Open-Port Customs Gamble"
 STATIC_MODIFIER_DESC_oe_dis_open_ports_gamble_mod:0 "Bowing to merchant lobbies keeps harbors open and duties flowing in the short run, but leaves coastal entrepots dangerously exposed to Levantine plague surges."
 STATIC_MODIFIER_NAME_oe_dis_venetian_model_mod:0 "Venetian Double-Island Exemplar"
 STATIC_MODIFIER_DESC_oe_dis_venetian_model_mod:0 "Adopting the Venetian two-island triage between sick wards and forty-day cargo fumigation preserves maritime confidence alongside strong epidemic resistance."
 STATIC_MODIFIER_NAME_oe_dis_tezoni_capitolari_mod:0 "Tezoni Warehouses & Capitularies"
 STATIC_MODIFIER_DESC_oe_dis_tezoni_capitolari_mod:0 "Airy fumigation warehouses governed by codified lazaretto capitularies enable rapid yet hygienic turnover of silk and wool cargoes."
 STATIC_MODIFIER_NAME_oe_dis_breached_quarantine_mod:0 "Breached Quarantine & Harbor Outbreak"
 STATIC_MODIFIER_DESC_oe_dis_breached_quarantine_mod:0 "Allowing a suspect merchantman to bypass forty-day quarantine unleashes an explosive urban plague wave across the harbor and surrounding hinterland."
 STATIC_MODIFIER_NAME_oe_dis_kontumaz_network_mod:0 "Border Kontumaz Disinfection Network"
 STATIC_MODIFIER_DESC_oe_dis_kontumaz_network_mod:0 "Frontier Kontumaz stations fumigate overland caravans, letters, and textiles with vinegar and sulfur, bolstering rural and border epidemic resistance."
 STATIC_MODIFIER_NAME_oe_dis_wenyi_school_mod:0 "Wenbing Clinical Medical Schools"
 STATIC_MODIFIER_DESC_oe_dis_wenyi_school_mod:0 "State-sponsored medical academies built around Wenyi Lun advance empirical contagion research and raise national life expectancy."
 STATIC_MODIFIER_NAME_oe_dis_karantina_reform_mod:0 "Imperial Karantina Decree"
 STATIC_MODIFIER_DESC_oe_dis_karantina_reform_mod:0 "An imperial Usul-i Tahaffuz quarantine decree establishes formal maritime inspection boards across eastern ports despite mild traditionalist grumbling."
 STATIC_MODIFIER_NAME_oe_dis_darussifa_charity_mod:0 "Darussifa Charitable Infirmaries"
 STATIC_MODIFIER_DESC_oe_dis_darussifa_charity_mod:0 "Endowed darussifa charitable infirmaries expand free care and herbal relief for stricken townsfolk, winning strong clerical and popular goodwill."
 STATIC_MODIFIER_NAME_oe_dis_reciprocal_patenti_mod:0 "Reciprocal Patenti di Sanita Accord"
 STATIC_MODIFIER_DESC_oe_dis_reciprocal_patenti_mod:0 "Mutual recognition of standardized bills of health and shared outbreak bulletins cuts retaliatory embargoes while preserving quarantine integrity."
 STATIC_MODIFIER_NAME_oe_dis_quarantine_triumph_mod:0 "Early Modern Quarantine Triumph"
 STATIC_MODIFIER_DESC_oe_dis_quarantine_triumph_mod:0 "Centuries of double-island lazarettos, health magistracies, frontier cordons, and empirical medicine finally break the recurrent cycle of early modern plague."
 oe_dis_lazzaretto_vecchio:0 "Lazzaretto Vecchio Isolation Hospital"
 oe_dis_lazzaretto_vecchio_desc:0 "A permanent coastal plague isolation hospital modeled on Venice's 1423 island of Santa Maria di Nazareth, treating stricken crews and citizens to slash local plague impact and lift life expectancy."
 oe_dis_lazzaretto_vecchio_maint:0 "Lazzaretto Vecchio Medical Upkeep"
 oe_dis_lazzaretto_nuovo:0 "Lazzaretto Nuovo 40-Day Tezoni"
 oe_dis_lazzaretto_nuovo_desc:0 "Modeled on Venice's 1468 Lazzaretto Nuovo filter: healthy crews observe forty-day quarantine while silks and woolens air in vast tezoni galleries with vinegar and sulfur, blocking plague while expanding local merchant capacity and trade power."
 oe_dis_lazzaretto_nuovo_maint:0 "Lazzaretto Nuovo Fumigation Upkeep"
 oe_dis_pestkordon_station:0 "Kontumaz Pestkordon Station"
 oe_dis_pestkordon_station_desc:0 "A frontier disinfection and inspection post modeled on the Habsburg Military Frontier Pestkordon (1710-1770), screening overland caravans and troops to curb camp fever and typhus."
 oe_dis_pestkordon_station_maint:0 "Kontumaz Station Disinfection Upkeep"
 oe_dis_adv_sanita_quarantine:0 "Sanita Law & Double-Island Quarantine"
 oe_dis_adv_sanita_quarantine_desc:0 "Codifies Ragusa's 1377 trentino, Venice's double-island triage, and reciprocal bills of health, unlocking Lazzaretto Nuovo and Pestkordon stations while lifting national disease resistance."
 oe_dis_cab_fumigation_corps:0 "Port Fumigation & Quarantine Audit"
 oe_dis_cab_fumigation_corps_desc:0 "Dispatch a minister to audit bills of health and supervise sulfur fumigation across a coastal province's docks, strongly boosting national and local resistance against Levantine plague at a mild sea-trade efficiency cost."
 oe_dis_cab_fumigation_corps_action:0 "Direct Port Fumigation & Audit in [SCOPE.sProvince('target').GetNameWithNoTooltip]"
 oe_dis_cab_fumigation_corps_active:0 "Auditing Port Fumigation & Quarantine in [SCOPE.sProvince('target').GetNameWithHighlightOnly]"
 oe_dis_cab_fumigation_corps_action_progress:0 "[SCOPE.sCountry('actor').GetModifierValue('global_disease_resistance')]"
 oe_dis_cab_fumigation_corps_action_progress_wordier:0 "Port Fumigation Audit Active in [SCOPE.sProvince('target').GetNameWithNoTooltip]"
 oe_dis_cab_fumigation_corps_action_progress_long_wordier:0 "Port Fumigation & Quarantine Audit Active in [SCOPE.sProvince('target').GetNameWithNoTooltip]"
 oe_dis_cab_fumigation_corps_action_progress_tooltip:0 "Sustains dockside sulfur fumigation and bill-of-health audits in the target coastal province, boosting disease resistance while cutting Levantine plague impact and growth."
 oe_dis_cab_fumigation_corps_select_province:0 "Select Coastal Province for Port Fumigation Audit"
 oe_dis_cab_fumigation_corps_no_provinces:0 "@trigger_no! No eligible owned and controlled coastal province is available for Port Fumigation Audit."
 oe_dis_cab_cordon_enforcement:0 "Military Cordon & Camp Sanitation"
 oe_dis_cab_cordon_enforcement_desc:0 "Assign a military minister to enforce sanitary roadblocks and camp hygiene across a controlled province, sharply boosting resistance against camp fever and typhus while curbing local spread at a slight upkeep cost."
 oe_dis_cab_cordon_enforcement_action:0 "Enforce Military Cordon & Sanitation in [SCOPE.sProvince('target').GetNameWithNoTooltip]"
 oe_dis_cab_cordon_enforcement_active:0 "Enforcing Military Cordon & Camp Sanitation in [SCOPE.sProvince('target').GetNameWithHighlightOnly]"
 oe_dis_cab_cordon_enforcement_action_progress:0 "[SCOPE.sCountry('actor').GetModifierValue('global_disease_resistance')]"
 oe_dis_cab_cordon_enforcement_action_progress_wordier:0 "Military Cordon Active in [SCOPE.sProvince('target').GetNameWithNoTooltip]"
 oe_dis_cab_cordon_enforcement_action_progress_long_wordier:0 "Military Cordon & Camp Sanitation Active in [SCOPE.sProvince('target').GetNameWithNoTooltip]"
 oe_dis_cab_cordon_enforcement_action_progress_tooltip:0 "Maintains sanitary cordons and field camp hygiene in the target province, raising resistance while cutting camp fever and typhus impact and growth."
 oe_dis_cab_cordon_enforcement_select_province:0 "Select Province for Military Cordon Enforcement"
 oe_dis_cab_cordon_enforcement_no_provinces:0 "@trigger_no! No eligible owned and controlled province is available for Military Cordon Enforcement."
 oe_dis_player_only_tt:0 "Only a player-controlled realm may enact this sanitary measure"
 oe_dis_quarantena_cd_tt:0 "Has not enacted the 40-Day Port Quarantena within the last 3 years"
 oe_dis_dev_free_build_tt:0 "Dev Panel zero-cost test construction"
 oe_dis_dec_quarantena_40_days.title:0 "Enact 40-Day Port Quarantena"
 oe_dis_dec_quarantena_40_days.desc:0 "Detain incoming merchantmen for forty days during domestic or neighboring outbreaks, trading short-term sea commerce for powerful plague resistance. Lazzaretto Nuovo halves trade penalties; Ever-Normal Granaries halve treasury outlays."
 oe_dis_dec_quarantena_40_days.a:0 "Seal the harbors for forty days to save lives"
 oe_dis_dec_sanita_magistracy.title:0 "Establish Permanent Magistrato alla Sanita"
 oe_dis_dec_sanita_magistracy.desc:0 "Charter a permanent port health magistracy backed by coastal cities and lazarettos to audit foreign bills of health and permanently strengthen national disease resistance and life expectancy."
 oe_dis_dec_sanita_magistracy.a:0 "Charter the permanent port health magistracy"
 oe_dis_dec_wenyi_treatise.title:0 "Promulgate Wu Youxing's Treatise on Pestilence"
 oe_dis_dec_wenyi_treatise.desc:0 "Promulgate Wu Youxing's Treatise on Pestilence and its liqi contagion principles across state medical bureaus, permanently curbing camp fever and typhus while raising life expectancy."
 oe_dis_dec_wenyi_treatise.a:0 "Print and circulate Wenyi Lun across the realm"
 oe_dis_dec_pestkordon_border.title:0 "Charter the Frontier Pestkordon Sanitary Cordon"
 oe_dis_dec_pestkordon_border.desc:0 "Construct a permanent militarized Pestkordon sanitary cordon along overland frontiers, staffing disinfection posts with border garrisons to block recurrent plagues and fortify border defense."
 oe_dis_dec_pestkordon_border.a:0 "Establish the militarized frontier Pestkordon"
 oe_dis.1.title:0 "Levantine Plague Reaches Our Ports"
 oe_dis.1.desc:0 "A merchantman laden with Levantine silk and spice has dropped anchor with black buboes raging below decks. Harbor guilds plead to unload before fair season, while health commissioners warn that anything short of a forty-day seal will doom the city."
 oe_dis.1.a:0 "Enforce a strict forty-day quarantena to save lives"
 oe_dis.1.b:0 "Route the vessel through our double-island lazarettos"
 oe_dis.1.c:0 "Keep the harbor open to safeguard customs revenue"
 oe_dis.1.d:0 "Invoke the sacred purification and healing courts of Asclepius"
 oe_dis.2.title:0 "Camp Fever & Liqi Pestilence Stalk the Realm"
 oe_dis.2.desc:0 "Crowded military bivouacs and war-scarred towns have ignited a fierce wave of camp fever and liqi pestilence. Contagion now creeps toward court chambers and provincial garrisons, threatening high officials and commanders alike."
 oe_dis.2.a:0 "Evacuate the court and seal stricken military camps"
 oe_dis.2.b:0 "Stand with the populace and fund field camp lazarets"
 oe_dis.2.c:0 "Open ever-normal granaries to issue grain and medicinal broths"
 oe_dis.3.title:0 "The Venetian Double-Island Model Spreads"
 oe_dis.3.desc:0 "Building on Ragusa's trentino, Venice paired Lazzaretto Vecchio for the sick with Lazzaretto Nuovo's forty-day cargo fumigation galleries and a permanent health magistracy, proving ports can stay open without inviting ruin."
 oe_dis.3.a:0 "Adopt the double-island model and standardized bills of health"
 oe_dis.3.b:0 "File the reports without disturbing harbor customs"
 oe_dis.4.title:0 "Forged Patenti di Sanita Smuggling Ring"
 oe_dis.4.desc:0 "Port inspectors have uncovered a syndicate forging clean Patenti di Sanita. Several prominent merchant houses bribed clerks to conceal calls at infected Levantine harbors and evade forty days of detention."
 oe_dis.4.a:0 "Prosecute the smugglers and burn suspect bales as a warning"
 oe_dis.4.b:0 "Levy discreet quarantine fines to avoid alienating merchant guilds"
 oe_dis.5.title:0 "Great Tezoni Galleries & Lazaretto Capitularies"
 oe_dis.5.desc:0 "Expansive ventilated tezoni galleries now crown our island lazarettos, governed by codified capitularies refined through decades of plague emergencies. Even in dark years, convoys move through inspection in disciplined order."
 oe_dis.5.a:0 "Publish the lazaretto capitularies across every port"
 oe_dis.6.title:0 "The Grand-Saint-Antoine Crisis"
 oe_dis.6.desc:0 "A treasure-laden Levantine merchantman lies off the harbor after losing sailors at sea. Influential merchants press the council to waive forty-day detention before the great fair opens—echoing the fateful gamble of Marseille in 1720."
 oe_dis.6.a:0 "Refuse entry and isolate or burn the cargo despite merchant fury"
 oe_dis.6.b:0 "Yield to the lobby for immediate customs windfalls"
 oe_dis.7.title:0 "The Frontier Pestkordon Completed"
 oe_dis.7.desc:0 "Disinfection stations and border guardposts now form an unbroken Pestkordon along our land frontier. Every caravan, traveler, and dispatch is screened and fumigated before crossing, sealing interior provinces from overland contagion."
 oe_dis.7.a:0 "Commend the frontier cordon garrisons and maintain the line"
 oe_dis.8.title:0 "Wu Youxing's Treatise on Pestilence (1642)"
 oe_dis.8.desc:0 "Amid devastating pestilence, the Suzhou physician Wu Youxing has compiled Wenyi Lun, breaking with traditional seasonal dogma to identify pestilence as specific invisible liqi entering via mouth and nose. Traditionalists protest, yet front-line doctors praise its remarkable cures."
 oe_dis.8.a:0 "Sponsor state editions of Wenyi Lun and open clinical schools"
 oe_dis.8.b:0 "Uphold classical medical orthodoxy to preserve harmony"
 oe_dis.9.title:0 "The Karantina Debate in the Eastern Mediterranean"
 oe_dis.9.desc:0 "As recurrent waves batter eastern ports, reformist ministers urge an imperial Karantina decree mandating strict maritime isolation, while traditional jurists favor expanding endowed darussifa charitable infirmaries without halting shipping."
 oe_dis.9.a:0 "Issue the imperial Karantina decree and empower port boards"
 oe_dis.9.b:0 "Expand charitable darussifa hospitals in keeping with custom"
 oe_dis.10.title:0 "Sacred Purification of Asclepius"
 oe_dis.10.desc:0 "Priests of Asclepius at Epidaurus and Pergamon have thrown open the sanctuary water courts, combining sacred spring ablutions, quiet isolation wards, and herbal fumigation to shield citizens and soldiers alike."
 oe_dis.10.a:0 "Honor Asclepius and extend sanctuary isolation protocols"
 oe_dis.11.title:0 "Ever-Normal Granaries Open for Epidemic Relief"
 oe_dis.11.desc:0 "Just as plague panic tempts speculators to hoard grain, imperial ever-normal granaries open at fixed prices and deliver salt, firewood, and herbal decoctions directly to quarantined quarters, steadying prices and public order."
 oe_dis.11.a:0 "Commend the granary wardens and sustain relief distributions"
 oe_dis.12.title:0 "Diplomatic Row Over Quarantine Embargoes"
 oe_dis.12.desc:0 "Neighboring maritime powers protest that our strict forty-day detentions are crippling their merchants and threaten retaliatory tariffs. Envoys suggest negotiating reciprocal bills of health to defuse the dispute."
 oe_dis.12.a:0 "Hold firm on public health without foreign exemptions"
 oe_dis.12.b:0 "Sign a reciprocal Patenti di Sanita and outbreak-bulletin accord"
 oe_dis.13.title:0 "Receding of the Early Modern Plague"
 oe_dis.13.desc:0 "Three centuries of relentless effort have reached a historic turning point: double-island lazarettos, permanent health boards, frontier cordons, and empirical medicine have finally broken the recurrent plague cycle across our core lands. This triumph shall endure in the imperial annals."
 oe_dis.13.a:0 "Inscribe this quarantine triumph into the imperial chronicle"
 oe_dis.14.title:0 "Mild Epidemic Mode: Provincial Relief Buffer Active"
 oe_dis.14.desc:0 "In accordance with Mild Epidemic Mode, provincial clinics and quarantine relief subsidies have automatically engaged to cushion mortality and treasury losses over the coming years."
 oe_dis.14.a:0 "Acknowledge the mild epidemic relief buffer"
