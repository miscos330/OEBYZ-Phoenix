# NEW 2026-11-22 v13.0 Worker 2 (Slot 97 oe_afr_). Generated by gen_v130_africa.py; edit the generator, not this file.
 oe_afr_school_ewostathian_tewahedo: "Ewostathian Tewahedo School"
 oe_afr_school_ewostathian_tewahedo_desc: "Reconciled at the 1450 Council of Debre Mitmaq under Emperor Zara Yaqob, the Ewostathian Tewahedo synthesis heals the double-Sabbath schism, uniting Alexandrian patriarchate canons with highland monastic discipline and the Mashafa Berhan."
 oe_afr_school_timbuktu_maliki: "Timbuktu Sankore Maliki School"
 oe_afr_school_timbuktu_maliki_desc: "Centered on the Great Madrasa of Sankore in Timbuktu, this Sahelian Maliki school pairs jurisprudence with astronomy, medicine, and commercial notary law across the Niger bend and trans-Saharan caravan routes."
 oe_afr_chewa_amba_citadel: "Chewa Amba Citadel"
 oe_afr_chewa_amba_citadel_desc: "A highland fortress perched atop an Ethiopian flat-topped amba massif, housing hereditary Chewa royal regiments that anchor provincial control in peacetime and bleed lowland invaders in war."
 oe_afr_chewa_amba_citadel_maint: "Chewa Garrison Upkeep"
 oe_afr_sankore_great_madrasa: "Great Madrasa of Sankore"
 oe_afr_sankore_great_madrasa_desc: "A monumental mudbrick academy and manuscript treasury standing at the crossroads of the Niger and Sahara, gathering tens of thousands of scholars in astronomy, medicine, mathematics, and Maliki jurisprudence."
 oe_afr_sankore_great_madrasa_maint: "Scriptorium & Madrasa Upkeep"
 oe_afr_husuni_kubwa_emporium: "Husuni Kubwa Monsoon Emporium"
 oe_afr_husuni_kubwa_emporium_desc: "A coral-stone royal emporium and warehouse complex linking Great Zimbabwe and Sofala gold caravans to the two Indian Ocean monsoons, welcoming Omani, Persian, and Gujarati fleets."
 oe_afr_husuni_kubwa_emporium_maint: "Emporium & Dhow Slipway Upkeep"
 oe_afr_adv_mashafa_berhan_canon: "Canon of the Mashafa Berhan"
 oe_afr_adv_mashafa_berhan_canon_desc: "Codified in classical Ge'ez, the Mashafa Berhan binds ecclesiastical discipline to Solomonic royal administration and commissions hereditary Chewa citadels across the highland passes."
 oe_afr_adv_prester_john_matchlocks: "Prester John Matchlock Companies"
 oe_afr_adv_prester_john_matchlocks_desc: "Drawing gunsmiths and matchlocks through Red Sea embassies, Solomonic commanders arm elite Chewa infantry companies to hold the mountain defiles against coastal gunpowder armies."
 oe_afr_adv_sankore_manuscript_guilds: "Sankore Manuscript Guilds"
 oe_afr_adv_sankore_manuscript_guilds_desc: "Organizes professional copyists, binders, and legal notaries across Timbuktu, Djenne, and Gao, turning trans-Saharan paper imports into the foundation of the Great Madrasa of Sankore."
 oe_afr_adv_tondibi_gunpowder_reform: "Tondibi Sahelian Gunpowder Reform"
 oe_afr_adv_tondibi_gunpowder_reform_desc: "Forged from the shock of desert matchlock warfare at Tondibi, this military reform fields standing Niger arquebusier regiments and light field batteries capable of shattering trans-Saharan expeditions."
 oe_afr_adv_al_mawahib_gold_monsoon: "Al-Mawahib Gold & Monsoon Network"
 oe_afr_adv_al_mawahib_gold_monsoon_desc: "Refines Kilwan coinage, customs assays, and monsoon credit linking the inland gold workings of Great Zimbabwe through Sofala to the coral-stone emporia of the Swahili coast."
 oe_afr_adv_counter_cartaz_dhows: "Counter-Cartaz Cannon Dhow Squadrons"
 oe_afr_adv_counter_cartaz_dhows_desc: "Refits oceangoing Swahili dhows and zambucs with bow swivel cannon and shallow-reef tactics, enabling nimble coastal squadrons to break European carrack blockades."
 oe_afr_trans_regional_charter_law: "Trans-Regional African Charter Law"
 oe_afr_trans_regional_charter_law_desc: "A foundational charter governing how African realms convert highland garrisons, trans-Saharan gold-salt caravans, or Swahili monsoon entrepots into enduring state power."
 oe_afr_pol_solomonic_gult_charter: "Solomonic Gult & Garrison Charter"
 oe_afr_pol_solomonic_gult_charter_desc: "Assigns revocable royal gult revenue grants to highland monasteries and Chewa garrisons, strengthening territorial defense, royal control, and religious authority."
 oe_afr_pol_trans_saharan_caravan_charter: "Trans-Saharan Gold-Salt Caravan Charter"
 oe_afr_pol_trans_saharan_caravan_charter_desc: "Places the Taghaza salt mines, Timbuktu entrepots, and Wangara gold routes under imperial caravan protection, accelerating both bullion revenue and scholarly exchange."
 oe_afr_pol_swahili_monsoon_port_charter: "Swahili Monsoon Port Charter"
 oe_afr_pol_swahili_monsoon_port_charter_desc: "Establishes uniform customs privileges across coral-stone Swahili harbors, attracting Indian Ocean dhow fleets while expanding maritime reach and merchant capacity."
 oe_afr_solomonic_chewa_monarchy: "Solomonic Chewa Monarchy"
 oe_afr_solomonic_chewa_monarchy_desc: "Governs the Ethiopian highlands through royal roving courts and hereditary Chewa regiments loyal directly to the Negusa Nagast, curbing regional warlords while hardening mountain defense."
 oe_afr_askia_sahel_bureaucracy: "Askia Sahelian Bureaucracy"
 oe_afr_askia_sahel_bureaucracy_desc: "Modeled on Askia Mohammad's imperial ministries, replacing loose tribal tribute with appointed provincial governors, river admirals, treasury inspectors, and Maliki courts."
 oe_afr_swahili_monsoon_thalassocracy: "Swahili Monsoon Thalassocracy"
 oe_afr_swahili_monsoon_thalassocracy_desc: "Binds the coral-stone port patriciates of Kilwa, Sofala, Mombasa, and Zanzibar with the Zimbabwe gold hinterland into a coordinated Indian Ocean maritime confederacy."
 oe_afr_priv_debre_libanos_monastic_grants: "Debre Libanos Monastic Grants"
 oe_afr_priv_debre_libanos_monastic_grants_desc: "Bestows tax-exempt monastic estates and Ge'ez scriptorium charters upon Debre Libanos and Lalibela, securing loyal clergy support and higher monastic literacy across the highlands."
 oe_afr_priv_wangara_gold_guilds: "Wangara Gold & Salt Guild Charter"
 oe_afr_priv_wangara_gold_guilds_desc: "Grants standard weight seals and caravan credit rights to the Wangara gold and salt merchant guilds, ensuring steady bullion flows into the Niger valley treasuries."
 oe_afr_priv_waungwana_dhow_patricians: "Waungwana Dhow Patrician Charter"
 oe_afr_priv_waungwana_dhow_patricians_desc: "Confirms the coastal Waungwana patrician families in their brokerage of ivory, gold dust, and seasonal monsoon shipping across the Swahili stone towns."
 oe_afr_cab_trans_saharan_gold_salt: "Escort Trans-Saharan Gold & Salt Caravans"
 oe_afr_cab_trans_saharan_gold_salt_desc: "Assigns a cabinet commissioner to guard the Taghaza salt flats and Timbuktu caravan wells, raising gold and salt output, overland trade efficiency, and imperial control."
 oe_afr_cab_trans_saharan_gold_salt_action: "$oe_afr_cab_trans_saharan_gold_salt$"
 oe_afr_cab_trans_saharan_gold_salt_active: "Escorting Trans-Saharan Gold & Salt Caravans"
