 oe_afr_cab_trans_saharan_gold_salt_action_progress_long_wordier: "Trans-Saharan Gold & Salt Escort Active"
 oe_afr_cab_trans_saharan_gold_salt_action_progress_tooltip: "Raises gold and salt output, overland trade efficiency, and monthly control across the Sahelian caravan corridors."
 oe_afr_cab_monsoon_dhow_patrol: "Patrol Indian Ocean Monsoon Dhow Lanes"
 oe_afr_cab_monsoon_dhow_patrol_desc: "Dispatches maritime commissioners to coordinate armed Swahili dhow patrols from Mombasa to Sofala, boosting maritime presence, sea trade efficiency, merchant power, and naval morale."
 oe_afr_cab_monsoon_dhow_patrol_action: "$oe_afr_cab_monsoon_dhow_patrol$"
 oe_afr_cab_monsoon_dhow_patrol_active: "Patrolling Indian Ocean Monsoon Dhow Lanes"
