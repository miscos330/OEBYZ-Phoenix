 oe_afr_cab_monsoon_dhow_patrol_action_progress_wordier: "Monsoon Dhow Patrol Active"
 oe_afr_cab_monsoon_dhow_patrol_action_progress_long_wordier: "Monsoon Dhow Patrol Active"
 oe_afr_cab_monsoon_dhow_patrol_action_progress_tooltip: "Boosts maritime presence, sea trade efficiency, merchant power, and naval morale along the Swahili coast."
 oe_afr_cb_swahili_monsoon_liberation: "Swahili Monsoon Liberation"
 oe_afr_cb_swahili_monsoon_liberation_PROV: "Expel foreign blockading fleets from the Swahili coast and Sofala"
 oe_afr_cb_swahili_monsoon_liberation_desc: "A European power has seized forts along the Swahili coast or Sofala to enforce coercive cartaz tolls upon Indian Ocean shipping. Swahili realms may wage war to break the blockade and reclaim the monsoon ports."
 OE_AFR_MONSOON_LEAGUE_REASON: "Swahili Anti-Cartaz Monsoon League Active"
 OE_AFR_CARTAZ_BREACH_REASON: "Indian Ocean Cartaz Blockade Active"
 oe_afr_player_only_tt: "Only a player-controlled country can use this"
 oe_afr_art_mashafa_berhan: "The Book of Light (Mashafa Berhan)"
 oe_afr_art_mashafa_berhan_desc: "Emperor Zara Yaqob's classical Ge'ez theological and royal canon of 1456, cementing the Debre Mitmaq ecclesiastical concord and Solomonic sovereignty."
 oe_afr_art_timbuktu_chronicles: "The Sankore Chronicles of Timbuktu"
 oe_afr_art_timbuktu_chronicles_desc: "An illuminated collection of Timbuktu manuscripts uniting Maliki jurisprudence, astronomical tables, and imperial annals of Mali and Songhai."
 oe_afr_art_saharan_astronomy_zij: "The Trans-Saharan Astronomical Zij"
 oe_afr_art_saharan_astronomy_zij_desc: "Precision celestial tables jointly compiled by Timbuktu scholars and trans-Saharan expedition savants, bridging West African and Mediterranean astronomy."
 oe_afr_art_gondar_fasil_ghebbi: "Architectural Folio of Fasil Ghebbi"
 oe_afr_art_gondar_fasil_ghebbi_desc: "An imperial architectural folio celebrating the stone castles and sacred art of the Gondarine renaissance."
 oe_afr_art_husuni_kubwa_palace: "Coral-Stone Navigational Stele of Husuni Kubwa"
 oe_afr_art_husuni_kubwa_palace_desc: "A carved coral-stone stele in Kilwa Kisiwani recording both monsoon sailing seasons, Sofala gold assays, and Indian Ocean star bearings."
 oe_afr_dec_council_debre_mitmaq.title: "Convene Council of Debre Mitmaq & Mashafa Berhan"
 oe_afr_dec_council_debre_mitmaq.desc: "Summon Ewostathian and Alexandrian prelates to Debre Mitmaq to heal the double-Sabbath schism, promulgate the Mashafa Berhan masterpiece in Ge'ez, and unite highland crown and church."
 oe_afr_dec_council_debre_mitmaq.a: "Promulgate the Mashafa Berhan and Heal the Schism"
 oe_afr_dec_prester_john_embassy.title: "Dispatch the Prester John Red Sea Embassy"
 oe_afr_dec_prester_john_embassy.desc: "Send Solomonic envoys across the Red Sea to Constantinople, Rome, or Lisbon to seal the Prester John accord. If the Chalcedonian reconciliation has been achieved, the pact ascends into a holy matchlock league."
 oe_afr_dec_prester_john_embassy.a: "Dispatch Envoys Across the Red Sea"
 oe_afr_dec_askia_sankore_charter.title: "Proclaim Askia's Great Sankore Charter"
 oe_afr_dec_askia_sankore_charter.desc: "Grant imperial endowments and scriptorium charters to Timbuktu's Sankore university, inaugurating the Sahelian academic golden age. Completion of the Saharan Scholar Caravan triggers a double manuscript and research surge."
 oe_afr_dec_askia_sankore_charter.a: "Charter the Great Madrasa of Sankore"
 oe_afr_dec_tondibi_arquebus_corps.title: "Raise the Tondibi Sahelian Arquebusier Corps"
 oe_afr_dec_tondibi_arquebus_corps.desc: "Recruit Mediterranean gunsmiths, fortify the Tondibi-Gao approaches, and train standing arquebusier regiments to defeat trans-Saharan gunpowder expeditions."
 oe_afr_dec_tondibi_arquebus_corps.a: "Reform into Modern Arquebusiers and Fortify the Niger"
 oe_afr_dec_sofala_zimbabwe_corridor.title: "Unify the Great Zimbabwe-Sofala-Kilwa Gold Corridor"
 oe_afr_dec_sofala_zimbabwe_corridor.desc: "Bind the inland granite goldfields of Great Zimbabwe to Sofala and the mints of Kilwa Kisiwani through unified customs assays and guarded caravan roads."
 oe_afr_dec_sofala_zimbabwe_corridor.a: "Open the Golden Corridor to the Monsoon Coast"
 oe_afr_dec_swahili_counter_cartaz.title: "Forge the Swahili Anti-Cartaz Monsoon League"
 oe_afr_dec_swahili_counter_cartaz.desc: "Unite the Swahili stone towns and Zimbabwe allies into a cannon-armed dhow league to break European cartaz blockades. If the Indian Ocean Diu Coalition is active, both fleets share cross-ocean naval synergy."
 oe_afr_dec_swahili_counter_cartaz.a: "Raise the Monsoon League and Break the Cartaz"
 oe_afr.1.title: "1450 Council of Debre Mitmaq and the Book of Light"
 oe_afr.1.desc: "For a century, the double-Sabbath dispute between Ewostathian monasteries and Alexandrian bishops has divided the Ethiopian highlands. Now the Negusa Nagast convenes prelates and abbots at Debre Mitmaq, preparing to promulgate the classical Ge'ez Book of Light (Mashafa Berhan) to unite church and throne."
 oe_afr.1.a: "Heal the double-Sabbath schism, issue Mashafa Berhan, and embrace the Ewostathian Tewahedo school"
 oe_afr.1.b: "Use the council to tighten royal gult taxes and expand highland Chewa garrisons"
 oe_afr.2.title: "The 1445 Battle of Gomit and the Chewa Regiments"
 oe_afr.2.desc: "Lowland armies from Ifat and Adal push into the Shewan marches to sever Solomonic trade routes toward the sea. Marching down from the plateau at the head of hereditary Chewa regiments, the emperor prepares to break the invaders at the Battle of Gomit."
 oe_afr.2.a: "Lead the Chewa regiments to victory at Gomit!"
 oe_afr.2.b: "Fortify the Shewan and Lalibela mountain passes for protracted defense"
 oe_afr.3.title: "Rock-Hewn Sanctuaries and Amba Monasteries"
 oe_afr.3.desc: "From the monolithic rock-hewn churches of Lalibela to the mountain cloisters of Debre Libanos, Ethiopia's monasteries preserve Ge'ez learning and anchor imperial loyalty across remote plateaus. Their abbots petition the crown for renewed endowments."
 oe_afr.3.a: "Endow the highland scriptoria and monastic estates"
 oe_afr.3.b: "Requisition surplus monastic grain for the royal garrison stores"
 oe_afr.4.title: "Envoys of Prester John Across the Red Sea"
 oe_afr.4.desc: "Ever since Ethiopian monks appeared at the Council of Florence in 1441, Christian courts across the Mediterranean and Atlantic have spoken of the mighty realm of Prester John beyond the Red Sea. Now royal envoys sail north bearing golden crosses to seek matchlocks, artisans, and an intercontinental alliance."
 oe_afr.4.a: "Seal the Prester John Red Sea pact and welcome foreign gunsmiths"
 oe_afr.4.b: "Keep exchanges strictly commercial and guard highland autonomy"
 oe_afr.5.title: "1529 Storm of Ahmad ibn Ibrahim al-Ghazi"
 oe_afr.5.desc: "Armed with imported Red Sea matchlocks and bronze field pieces, the Adali commander Ahmad ibn Ibrahim al-Ghazi sweeps out of Harar and Zeila toward the Ethiopian plateau. Signal fires blaze from Shewa to Axum in the gravest trial the Solomonic crown has faced."
 oe_afr.5.a: "Summon Red Sea matchlock allies and counterattack from the mountain passes!"
 oe_afr.5.b: "Scorch the valleys and bleed the invaders dry beneath the amba cliffs"
 oe_afr.6.title: "The Stone Castles of Gondar and Imperial Renaissance"
 oe_afr.6.desc: "After generations of roving military camps, the Solomonic court raises a permanent stone capital at Gondar north of Lake Tana. Battlemented castles rise above highland terraces while Ethiopian coffee, incense, and illuminated icons enrich the Red Sea markets."
 oe_afr.6.a: "Build the stone compound of Fasil Ghebbi and patronize highland arts"
 oe_afr.6.b: "Direct coffee and incense revenues straight into the royal treasury"
 oe_afr.7.title: "Askia Mohammad and the Golden Age of Sankore"
 oe_afr.7.desc: "Returning from Mecca as Caliph of the Sudan, Askia Mohammad centralizes the Niger bureaucracy and lavishes endowments upon Timbuktu's Sankore academy. Tens of thousands of scholars from Cairo, Fez, and Hausaland gather to copy manuscripts on astronomy, medicine, and Maliki law."
 oe_afr.7.a: "Proclaim the Sankore Charter and inaugurate the Sahelian Golden Age!"
 oe_afr.7.b: "Deploy Maliki notaries to modernize customs across Timbuktu and Djenne"
 oe_afr.8.title: "Salt Slabs of Taghaza and Wangara Gold Caravans"
 oe_afr.8.desc: "Deep in the Sahara, carved rock-salt slabs from Taghaza trade weight-for-weight against alluvial gold carried north from Wangara through Walata, Timbuktu, and Djenne. Whoever shields these desert wells commands the wealth of West Africa."
 oe_afr.8.a: "Garrison the Taghaza salt wells and regulate the Niger gold markets"
 oe_afr.8.b: "Lower caravan tolls to draw Maghrebi booksellers and artisans south"
 oe_afr.9.title: "The Standing Niger River Flotilla"
 oe_afr.9.desc: "The vast curve of the Niger River serves as the imperial highway of the Sahel. Following Sonni Ali and Askia Mohammad, the court commissions a standing war-canoe flotilla under the royal Hi-Koi admiral to move grain, tax collectors, and troops at unmatched speed."
 oe_afr.9.a: "Commission the standing Hi-Koi Niger River flotilla"
 oe_afr.9.b: "Dedicate the river fleet to Djenne grain and mercantile shipping"
 oe_afr.10.title: "1591 Tondibi: Arquebuses Across the Sahara!"
 oe_afr.10.desc: "Against all expectation, Judar Pasha's Saadian expedition crosses the scorching Sahara with thousands of European-made matchlocks and light bronze cannon, confronting the Sahelian host at Tondibi on the Niger! Amid rolling gunsmoke, ancient cavalry charges face a hail of lead at the decisive hinge of West African history."
 oe_afr.10.a: "Spare no gold: hire Mediterranean gunsmiths and forge a reformed arquebusier corps!"
 oe_afr.10.b: "Meet the volley with traditional cavalry and learn through bitter fire"
 oe_afr.11.title: "Triumph of the Sahelian Gunpowder Guard"
 oe_afr.11.desc: "Far from breaking the Niger empire, the ordeal of Tondibi has forged a disciplined modern gunpowder army. Regiments of Sahelian arquebusiers and camel-drawn field artillery parade before Gao and Timbuktu, proclaiming West Africa's full entry into the gunpowder age."
 oe_afr.11.a: "Codify arquebus and field-artillery drill as permanent imperial doctrine"
 oe_afr.11.b: "Expand cannon foundries in Gao and Timbuktu to strengthen state revenues"
 oe_afr.12.title: "Saharan Manuscript Caravans and Celestial Exchange"
 oe_afr.12.desc: "Scholarly caravans bearing fine paper, Cairo star tables, and Andalusian treatises arrive in Timbuktu, departing north with Sankore chronicles, astronomical commentaries, and medical codices bound for the Mediterranean. Learning bridges the Sahara."
 oe_afr.12.a: "Establish a royal manuscript translation bureau to absorb trans-Saharan science"
 oe_afr.12.b: "Tax the luxury book trade and standardize commercial manuals"
 oe_afr.13.title: "The Golden Corridor of Great Zimbabwe and Sofala"
 oe_afr.13.desc: "Alluvial gold and ivory from the granite enclosures of Great Zimbabwe stream down toward Sofala, where Kilwan monsoon ships exchange them for porcelain, silk, and Indian cottons. Inland kings and coastal sultans now negotiate a lasting commercial compact."
 oe_afr.13.a: "Seal the unified Zimbabwe-Sofala-Kilwa gold corridor compact"
 oe_afr.13.b: "Invest the gold surplus into coastal dockyards at Sofala and Kilwa"
 oe_afr.14.title: "Palaces of Coral Stone: Husuni Kubwa and the Al-Mawahib"
 oe_afr.14.desc: "Masons cut pale reef coral from the turquoise shallows to raise Husuni Kubwa atop the cliffs of Kilwa Kisiwani — a sprawling palace-emporium of vaulted courts and merchant warehouses where Omani, Persian, and Gujarati captains trade each monsoon season."
 oe_afr.14.a: "Dedicate Husuni Kubwa and erect the Coral-Stone Monsoon Stele"
 oe_afr.14.b: "Reward shipwrights and navigators to expand the monsoon merchant marine"
 oe_afr.15.title: "1505 Almeida's Broadsides: Cartaz Warning Off Kilwa!"
 oe_afr.15.desc: "Towering European carracks appear on the Swahili horizon! Fleet commander Francisco de Almeida bombards defiant coral-stone harbors, erects stone forts, and demands coercive cartaz trade passes to monopolize Sofala gold and Indian Ocean commerce."
 oe_afr.15.a: "Rally the Swahili Anti-Cartaz Monsoon League and arm cannon dhows to fight back!"
 oe_afr.15.b: "Play for time through mercantile diplomacy while fortifying harbors and yards"
 oe_afr.16.title: "Dhows of the Western Indian Ocean: The Diu-Kilwa Compact"
 oe_afr.16.desc: "Sailing south on the northeast monsoon, envoys from Oman, Gujarat, and the Red Sea arrive with bronze founders and news of the northern anti-cartaz league. Together, Swahili cannon dhows and allied Indian Ocean fleets squeeze European forts from both hemispheres."
 oe_afr.16.a: "Seal the Diu-Kilwa Naval Compact to reclaim the western Indian Ocean!"
 oe_afr.16.b: "Focus the compact on Gujarati textile and Swahili ivory trade expansion"
 oe_afr.17.title: "Walls of Granite: Great Zimbabwe and the Gold Highlands"
 oe_afr.17.desc: "Within the dry-stone granite walls of Great Zimbabwe, newly struck gold and copper veins bring fresh vigor to the inland realm. Royal elders meet coastal factors to standardize gold weights and guard the trails down to Sofala and Quelimane."
 oe_afr.17.a: "Establish royal gold-assay houses along the trail to Sofala"
 oe_afr.17.b: "Fortify the granite citadels against foreign inland expeditions"
 oe_afr.18.title: "Masters of the Two Monsoons: Kaskazi and Kusi"
 oe_afr.18.desc: "Swahili navigators compile centuries of Kaskazi and Kusi monsoon lore — star altitudes, reef soundings, and seasonal current charts — into authoritative sailing manuals. From Kilwa and Zanzibar to Mombasa and Lamu, East African fleets sail as equals across the Indian Ocean."
 oe_afr.18.a: "Publish the Royal Swahili Monsoon Navigation Charts"
 oe_afr.18.b: "Found maritime underwriting houses across the Swahili stone towns"
 oe_afr.90.title: "Africa's Three Civilization Axes: Status Overview"
 oe_afr.90.desc: "Slot 97 pulse count: [ROOT.GetCountry.MakeScope.ScriptValue('oe_afr_v_pulses')|0] | Current country axis: [ROOT.GetCountry.MakeScope.ScriptValue('oe_afr_v_axis')|0] (0=None, 1=Ethiopia, 2=Sahel, 3=Swahili/Zimbabwe) | African advances unlocked: [ROOT.GetCountry.MakeScope.ScriptValue('oe_afr_v_adv_count')|0] / 6\n\n#T Cross-Worker Milestone Contract Globals (W4 Synthesis)#!\nPrester John Red Sea Pact (oe_afr_prester_john_pact): [ROOT.GetCountry.MakeScope.ScriptValue('oe_afr_v_prester_john')|0]\nSankore Golden Age (oe_afr_sankore_golden_age): [ROOT.GetCountry.MakeScope.ScriptValue('oe_afr_v_sankore')|0]\nTondibi Gunpowder Reform Survived (oe_afr_tondibi_survived): [ROOT.GetCountry.MakeScope.ScriptValue('oe_afr_v_tondibi')|0]\nSwahili Anti-Cartaz Monsoon League (oe_afr_swahili_monsoon_league): [ROOT.GetCountry.MakeScope.ScriptValue('oe_afr_v_monsoon_league')|0]\n\n#T Live Cross-Module Synergy Probes#!\nChalcedon Axis (oe_rel2_axis_chalcedon, 2=Accord): [ROOT.GetCountry.MakeScope.ScriptValue('oe_afr_v_chalcedon')|0] | Saharan Scholar Caravan (oe_nav2_done_sahara): [ROOT.GetCountry.MakeScope.ScriptValue('oe_afr_v_sahara_exp')|0]\nPortuguese Cartaz Active (oe_weu2_por_cartaz_active): [ROOT.GetCountry.MakeScope.ScriptValue('oe_afr_v_cartaz')|0] | Diu Anti-Cartaz Coalition (oe_ind_diu_coalition_active): [ROOT.GetCountry.MakeScope.ScriptValue('oe_afr_v_diu')|0]"
 oe_afr.90.a: "Close"
 STATIC_MODIFIER_NAME_oe_afr_mashafa_berhan_mod: "Mashafa Berhan & Debre Mitmaq Concord"
 STATIC_MODIFIER_DESC_oe_afr_mashafa_berhan_mod: "The Council of Debre Mitmaq has healed the double-Sabbath schism and enshrined Zara Yaqob's Mashafa Berhan across the Ethiopian highlands."
 STATIC_MODIFIER_NAME_oe_afr_chewa_highland_muster_mod: "Chewa Highland Garrison Muster"
 STATIC_MODIFIER_DESC_oe_afr_chewa_highland_muster_mod: "Hereditary Chewa garrisons man the highland ambas in full readiness, hardening mountain defenses and royal levies."
 STATIC_MODIFIER_NAME_oe_afr_gomit_triumph_mod: "Triumph of Gomit"
 STATIC_MODIFIER_DESC_oe_afr_gomit_triumph_mod: "A decisive Solomonic triumph over lowland sultanate armies echoes across the Horn of Africa, lifting infantry prowess and prestige."
 STATIC_MODIFIER_NAME_oe_afr_prester_john_accord_mod: "Prester John Red Sea Accord"
 STATIC_MODIFIER_DESC_oe_afr_prester_john_accord_mod: "Ethiopian envoys have linked the Solomonic throne to Mediterranean and Atlantic Christian courts, bringing firearms, artisans, and diplomatic standing."
 STATIC_MODIFIER_NAME_oe_afr_chalcedon_holy_league_mod: "Alexandria-Constantinople-Axum Holy League"
 STATIC_MODIFIER_DESC_oe_afr_chalcedon_holy_league_mod: "Reconciliation on the Chalcedonian axis elevates the Prester John embassy into a seamless Alexandria-Constantinople-Axum holy league, unlocking matchlock aid and shared scholarship."
 STATIC_MODIFIER_NAME_oe_afr_gragn_resistance_mod: "Highland Resistance Against al-Ghazi"
 STATIC_MODIFIER_DESC_oe_afr_gragn_resistance_mod: "Confronted by Adali gunpowder campaigns, Solomonic garrisons fortify the mountain ambas and bleed advancing armies through attrition and fierce counterattacks."
 STATIC_MODIFIER_NAME_oe_afr_gondarine_renaissance_mod: "Gondarine Royal Renaissance"
 STATIC_MODIFIER_DESC_oe_afr_gondarine_renaissance_mod: "Royal stone castles rise at Gondar as highland coffee exports, sacred iconography, and Ge'ez literature flourish."
 STATIC_MODIFIER_NAME_oe_afr_sankore_golden_age_mod: "Askia Sankore Golden Age"
 STATIC_MODIFIER_DESC_oe_afr_sankore_golden_age_mod: "Under Askia patronage, Timbuktu's Sankore academy blossoms into an international beacon of literacy, manuscripts, and rapid institutional growth."
 STATIC_MODIFIER_NAME_oe_afr_sahara_caravan_synergy_mod: "Trans-Saharan Manuscript Network"
 STATIC_MODIFIER_DESC_oe_afr_sahara_caravan_synergy_mod: "Scholarly caravans bridge Timbuktu with Fez, Cairo, and the Mediterranean, accelerating institutional spread and attracting master scholars."
 STATIC_MODIFIER_NAME_oe_afr_taghaza_salt_monopoly_mod: "Taghaza Salt & Wangara Gold Monopoly"
 STATIC_MODIFIER_DESC_oe_afr_taghaza_salt_monopoly_mod: "Imperial guards secure both the Taghaza rock-salt quarries and Niger gold markets, filling the treasury through regulated caravan trade."
 STATIC_MODIFIER_NAME_oe_afr_niger_river_flotilla_mod: "Askia's Niger River Flotilla"
 STATIC_MODIFIER_DESC_oe_afr_niger_river_flotilla_mod: "Permanent war-canoe squadrons patrol the Niger bend between Gao, Timbuktu, and Djenne, speeding troop deployments and tightening provincial control."
 STATIC_MODIFIER_NAME_oe_afr_tondibi_shock_mod: "Shock of the Tondibi Arquebuses"
 STATIC_MODIFIER_DESC_oe_afr_tondibi_shock_mod: "Volleys of trans-Saharan matchlocks and light cannon have shaken traditional Sahelian formations, forcing urgent military adaptation."
 STATIC_MODIFIER_NAME_oe_afr_tondibi_arquebus_corps_mod: "Songhai Reformed Arquebusier Corps"
 STATIC_MODIFIER_DESC_oe_afr_tondibi_arquebus_corps_mod: "Equipped with imported matchlocks, cast cannon, and desert earthworks at Tondibi, the reformed Sahelian corps matches any Eurasian gunpowder army."
 STATIC_MODIFIER_NAME_oe_afr_zimbabwe_gold_corridor_mod: "Great Zimbabwe-Sofala Gold Corridor"
 STATIC_MODIFIER_DESC_oe_afr_zimbabwe_gold_corridor_mod: "Gold dust and ivory flow smoothly from Great Zimbabwe's granite citadels down to Sofala and Kilwa's monsoon markets."
 STATIC_MODIFIER_NAME_oe_afr_husuni_kubwa_prosperity_mod: "Al-Mawahib Monsoon Prosperity"
 STATIC_MODIFIER_DESC_oe_afr_husuni_kubwa_prosperity_mod: "Coral-stone palaces and shipyards hum through both monsoons as Kilwan and Swahili trade networks reach their zenith."
 STATIC_MODIFIER_NAME_oe_afr_almeida_raid_alert_mod: "Almeida Bombardment & Coastal Alert"
 STATIC_MODIFIER_DESC_oe_afr_almeida_raid_alert_mod: "European carrack broadsides off Kilwa spur frantic coastal fortification and accelerated refitting of armed Swahili dhows."
 STATIC_MODIFIER_NAME_oe_afr_swahili_monsoon_league_mod: "Swahili Anti-Cartaz Monsoon League"
 STATIC_MODIFIER_DESC_oe_afr_swahili_monsoon_league_mod: "Swahili stone towns and inland allies unite against European cartaz tolls, fielding cannon-armed dhow squadrons across the western Indian Ocean."
 STATIC_MODIFIER_NAME_oe_afr_diu_kilwa_naval_pact_mod: "Diu-Kilwa Cross-Ocean Naval Pact"
 STATIC_MODIFIER_DESC_oe_afr_diu_kilwa_naval_pact_mod: "Coordinated naval patrols between Kilwa, Oman, and the Diu coalition shatter European maritime monopolies across the western Indian Ocean."
 STATIC_MODIFIER_NAME_oe_afr_rival_ai_mod: "African Three-Axis Epic Resilience"
 STATIC_MODIFIER_DESC_oe_afr_rival_ai_mod: "Under Rule 17 Full AI Epic mode, African three-axis protagonists gain resilient finances, defense, and institutional diffusion."
