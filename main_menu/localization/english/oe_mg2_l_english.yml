# NEW 2026-11-22 v15.5 Module 15.5-B: Ming 2.0 Deep Overhaul (oe_mg2_, 0 slots, 0 vanilla overrides). Generated by gen_v155_ming_qing.py; edit the generator, not this file.
 oe_mg2_player_only_tt: "Controlled by a human player"
 oe_mg2_purge_cd_tt: "Have not purged factional abuses within the past 12 years"
 oe_mg2_loyalist_cd_tt: "Have not rallied Southern Ming loyalists within the past 12 years"
 oe_mg2_late_ming_uprising: "Late Ming Peasant & Little Ice Age Cataclysm"
 oe_mg2_late_ming_uprising_desc: "Little Ice Age droughts, silver deflation, and crushing wartime surtaxes ignite sweeping peasant uprisings across Shaanxi, Henan, and Sichuan. Only famine relief, clean governance, and restored stability can save the Ming realm."
 oe_mg2_dec_reform_six_ministries.title: "Reform Six Ministries & Grand Secretariat"
 oe_mg2_dec_reform_six_ministries.desc: "Codify Grand Secretariat drafting procedures and Six Ministry accountability to curb bureaucratic inertia and boost cabinet, legislative, and fiscal efficiency."
 oe_mg2_dec_reform_six_ministries.a: "Enact Six Ministries & Cabinet Reform"
 oe_mg2_dec_reform_six_ministries_tt: "Raises Grand Secretariat cohesion by +20 and grants the Reformed Six Ministries & Grand Secretariat modifier for 35 years."
 oe_mg2_dec_purge_factional_corruption.title: "Purge Factional Corruption & Eastern Depot Abuses"
 oe_mg2_dec_purge_factional_corruption.desc: "Dismantle secret-police extortion and partisan vendettas to restore censorial integrity, lower peasant uprising pressure, and help overcome late-Ming turmoil."
 oe_mg2_dec_purge_factional_corruption.a: "Cleanse the Court and Curb Factional Abuses"
 oe_mg2_dec_purge_factional_corruption_tt: "Clears Eastern Depot and mine-tax penalties, reduces uprising intensity by -20, raises cabinet cohesion by +15, and grants a 15-year clean censorate modifier."
 oe_mg2_dec_rally_southern_loyalists.title: "Rally Southern Ming Loyalists & Maritime Fleets"
 oe_mg2_dec_rally_southern_loyalists.desc: "In times of dynastic peril or the loss of Beijing, summon loyalist armies and coastal fleets across Jiangnan, Fujian, Guangdong, and Yunnan beneath the Ming banner."
 oe_mg2_dec_rally_southern_loyalists.a: "Raise the Southern Ming Loyalist Banner"
 oe_mg2_dec_rally_southern_loyalists_tt: "Grants army and navy tradition, lowers uprising intensity by -15, and grants the Southern Ming Loyalist Banner modifier for 20 years."
 STATIC_MODIFIER_NAME_oe_mg2_mod_jianwen_centralize: "Jianwen Princely Reduction"
 STATIC_MODIFIER_DESC_oe_mg2_mod_jianwen_centralize: "The Jianwen court curtails princely military commands to bolster crown centralization, sharpening tension with frontier princes."
 STATIC_MODIFIER_NAME_oe_mg2_mod_border_princes_guard: "Frontier Princes Enfeoffment"
 STATIC_MODIFIER_DESC_oe_mg2_mod_border_princes_guard: "Retaining border princedoms along the northern marches bolsters frontier defenses and heavy cavalry at the price of crown centralization."
 STATIC_MODIFIER_NAME_oe_mg2_mod_jingnan_vanguard: "Prince of Yan's Jingnan Vanguard"
 STATIC_MODIFIER_DESC_oe_mg2_mod_jingnan_vanguard: "Hardened northern border cavalry march south under the Jingnan banner, lifting morale and tradition amid civil upheaval."
 STATIC_MODIFIER_NAME_oe_mg2_mod_nanjing_loyalist_guard: "Nanjing Loyalist Defense"
 STATIC_MODIFIER_DESC_oe_mg2_mod_nanjing_loyalist_guard: "Southern garrisons answer the Nanjing throne's call, fortifying the Yangtze crossings and upholding dynastic legitimacy."
 STATIC_MODIFIER_NAME_oe_mg2_mod_yongle_dadian: "Yongle Dadian Grand Canon"
 STATIC_MODIFIER_DESC_oe_mg2_mod_yongle_dadian: "Over two thousand scholars compile eleven thousand volumes of classical, astronomical, and technical lore, elevating literacy and research."
 STATIC_MODIFIER_NAME_oe_mg2_mod_imperial_archives: "Wenyuan Pavilion Imperial Archives"
 STATIC_MODIFIER_DESC_oe_mg2_mod_imperial_archives: "Hanlin archivists organize imperial statutes, maps, and fiscal registers, sharpening cabinet and legislative efficiency."
 STATIC_MODIFIER_NAME_oe_mg2_mod_forbidden_city_court: "Forbidden City Imperial Court"
 STATIC_MODIFIER_DESC_oe_mg2_mod_forbidden_city_court: "Completing the Forbidden City in Beijing projects towering imperial majesty, strengthening legitimacy, control, and capital defenses."
 STATIC_MODIFIER_NAME_oe_mg2_mod_beijing_corvee_restraint: "Restrained Northern Palace Works"
 STATIC_MODIFIER_DESC_oe_mg2_mod_beijing_corvee_restraint: "Pacing timber requisitions and corvee levies for the northern capital spares rural households and lifts steady prosperity."
 STATIC_MODIFIER_NAME_oe_mg2_mod_five_northern_campaigns: "Five Northern Gobi Campaigns"
 STATIC_MODIFIER_DESC_oe_mg2_mod_five_northern_campaigns: "Imperial armies march deep beyond the Gobi with heavy cavalry and firearms, building martial renown at heavy campaign strain."
 STATIC_MODIFIER_NAME_oe_mg2_mod_northern_buffer_garrisons: "Northern Steppe Buffer Garrisons"
 STATIC_MODIFIER_DESC_oe_mg2_mod_northern_buffer_garrisons: "Layered frontier garrisons and tributary border guards economize army upkeep while holding the northern steppe approaches."
 STATIC_MODIFIER_NAME_oe_mg2_mod_renxuan_three_yangs: "Ren-Xuan Golden Age & Three Yangs"
 STATIC_MODIFIER_DESC_oe_mg2_mod_renxuan_three_yangs: "The Three Yangs institutionalize Grand Secretariat governance and fiscal moderation, ushering in the prosperous Ren-Xuan golden age."
 STATIC_MODIFIER_NAME_oe_mg2_mod_jinhua_silver_commutation: "Gold Floral Silver Commutation"
 STATIC_MODIFIER_DESC_oe_mg2_mod_jinhua_silver_commutation: "Commuting southern grain quotas into silver bullion boosts treasury efficiency and commercial liquidity across the empire."
 STATIC_MODIFIER_NAME_oe_mg2_mod_eunuch_red_brush: "Directorate Red-Ink Endorsement"
 STATIC_MODIFIER_DESC_oe_mg2_mod_eunuch_red_brush: "Palace eunuchs wielding the red endorsement brush expand crown leverage and intelligence at the cost of gentry alienation."
 STATIC_MODIFIER_NAME_oe_mg2_mod_tumu_shock: "Shock of Tumu Post-Station"
 STATIC_MODIFIER_DESC_oe_mg2_mod_tumu_shock: "The rout of the imperial host at Tumu shatters metropolitan elite regiments, severely bruising morale and prestige."
 STATIC_MODIFIER_NAME_oe_mg2_mod_yu_qian_defense: "Yu Qian's Defense of Beijing"
 STATIC_MODIFIER_DESC_oe_mg2_mod_yu_qian_defense: "War Minister Yu Qian rejects southern flight, rallies fresh armies before Desheng Gate, and restores imperial discipline and resolve."
 STATIC_MODIFIER_NAME_oe_mg2_mod_hongzhi_restoration: "Hongzhi Restoration of Six Ministries"
 STATIC_MODIFIER_DESC_oe_mg2_mod_hongzhi_restoration: "Open court audiences, ministerial integrity, and stocked public granaries revitalize mid-Ming governance and harvest resilience."
 STATIC_MODIFIER_NAME_oe_mg2_mod_great_rites_authority: "Imperial Prerogative of Great Rites"
 STATIC_MODIFIER_DESC_oe_mg2_mod_great_rites_authority: "Asserting sovereign ritual prerogative after fierce court clashes bolsters crown power and legislative drive while straining court elites."
 STATIC_MODIFIER_NAME_oe_mg2_mod_altan_feng_gong: "Longqing-Altan Horse-Market Accord"
 STATIC_MODIFIER_DESC_oe_mg2_mod_altan_feng_gong: "Granting frontier titles and reopening regulated horse markets along Datong turns decades of raids into peaceful overland commerce."
 STATIC_MODIFIER_NAME_oe_mg2_mod_qi_brick_great_wall: "Qi Jiguang's Brick Wall & Hollow Towers"
 STATIC_MODIFIER_DESC_oe_mg2_mod_qi_brick_great_wall: "Qi Jiguang encases the northern Wall in fired brick with over a thousand multi-story artillery watchtowers, forging an iron rampart."
 STATIC_MODIFIER_NAME_oe_mg2_mod_wanli_three_campaigns: "Triumph of Wanli's Three Campaigns"
 STATIC_MODIFIER_DESC_oe_mg2_mod_wanli_three_campaigns: "Victory across Ningxia, Joseon, and Bozhou confirms Ming siegecraft and regional prestige at considerable war-exhaustion cost."
 STATIC_MODIFIER_NAME_oe_mg2_mod_mine_tax_extortion: "Mine-Tax Eunuch Commissioners"
 STATIC_MODIFIER_DESC_oe_mg2_mod_mine_tax_extortion: "Imperial mine and tax eunuchs squeeze urban workshops for palace revenue, provoking burgher outrage and unrest."
 STATIC_MODIFIER_NAME_oe_mg2_mod_suzhou_guild_accord: "Jiangnan Silk-Weaver Conciliation"
 STATIC_MODIFIER_DESC_oe_mg2_mod_suzhou_guild_accord: "Recalling abusive tax commissioners and stabilizing urban levies restores Jiangnan silk-workshop productivity and civic calm."
 STATIC_MODIFIER_NAME_oe_mg2_mod_donglin_moral_censorate: "Donglin Academy Moral Censorate"
 STATIC_MODIFIER_DESC_oe_mg2_mod_donglin_moral_censorate: "Donglin scholars invigorate principled debate, scholarship, and legislative scrutiny, even as factionalism narrows royal latitude."
 STATIC_MODIFIER_NAME_oe_mg2_mod_eastern_depot_terror: "Eastern Depot Factional Purge"
 STATIC_MODIFIER_DESC_oe_mg2_mod_eastern_depot_terror: "The Eastern Depot silences critics through secret tribunals, tightening surveillance while alienating elites and stoking unrest."
 STATIC_MODIFIER_NAME_oe_mg2_mod_shaanxi_relief_granaries: "Shaanxi Famine Relief & Post Revival"
 STATIC_MODIFIER_DESC_oe_mg2_mod_shaanxi_relief_granaries: "Opening imperial granaries in famine-hit Shaanxi and restoring postal stipends undercuts rebel recruitment and calms rural distress."
 STATIC_MODIFIER_NAME_oe_mg2_mod_silver_deflation_shock: "Late Ming Silver Deflation Shock"
 STATIC_MODIFIER_DESC_oe_mg2_mod_silver_deflation_shock: "Contracting bullion inflows trigger severe silver deflation, crushing peasant taxpayers and eroding treasury receipts."
 STATIC_MODIFIER_NAME_oe_mg2_mod_copper_coin_relief: "Sovereign Mint & Arrears Remission"
 STATIC_MODIFIER_DESC_oe_mg2_mod_copper_coin_relief: "Accepting standard copper coinage alongside tax-arrears remission arrests deflation and dampens agrarian rebellion."
 STATIC_MODIFIER_NAME_oe_mg2_mod_central_plains_militia: "Central Plains Counter-Insurgency"
 STATIC_MODIFIER_DESC_oe_mg2_mod_central_plains_militia: "Disciplined provincial field armies and fortified county militias blunt insurgent sweeps across Henan, Huguang, and Sichuan."
 STATIC_MODIFIER_NAME_oe_mg2_mod_uprising_pacified: "Late Ming Uprisings Pacified"
 STATIC_MODIFIER_DESC_oe_mg2_mod_uprising_pacified: "Having overcome peasant cataclysm and Little Ice Age famine, the restored realm rebuilds fiscal stability and rural prosperity."
 STATIC_MODIFIER_NAME_oe_mg2_mod_hongguang_jiangbei: "Hongguang Jiangbei Four Defense Towns"
 STATIC_MODIFIER_DESC_oe_mg2_mod_hongguang_jiangbei: "Coordinating the Four Defense Towns north of the Yangtze under unified command fortifies the Huai-Yangtze shield."
 STATIC_MODIFIER_NAME_oe_mg2_mod_longwu_fujian_fleet: "Longwu Fujian Fleet & Mountain Passes"
 STATIC_MODIFIER_DESC_oe_mg2_mod_longwu_fujian_fleet: "Pairing Fujian's rugged mountain passes with seasoned merchant armadas secures maritime revenue and coastal sovereignty."
 STATIC_MODIFIER_NAME_oe_mg2_mod_yongli_southwest_rally: "Yongli Southwest & Li Dingguo Vanguard"
 STATIC_MODIFIER_DESC_oe_mg2_mod_yongli_southwest_rally: "Forging an alliance across Guangxi and Yunnan under fierce loyalist field commanders sparks a tenacious counteroffensive."
 STATIC_MODIFIER_NAME_oe_mg2_mod_koxinga_dongning: "Koxinga's Loyalist Fleet & Tungning"
 STATIC_MODIFIER_DESC_oe_mg2_mod_koxinga_dongning: "Koxinga's war junks expel colonial forts from Taiwan and command the strait, projecting formidable Ming naval power."
 STATIC_MODIFIER_NAME_oe_mg2_mod_reformed_six_ministries: "Reformed Six Ministries & Grand Secretariat"
 STATIC_MODIFIER_DESC_oe_mg2_mod_reformed_six_ministries: "Clarifying Grand Secretariat drafting and Six Ministry accountability eliminates bureaucratic drift and sharpens state revenue."
 STATIC_MODIFIER_NAME_oe_mg2_mod_clean_censorate: "Purged Factionalism & Clean Censorate"
 STATIC_MODIFIER_DESC_oe_mg2_mod_clean_censorate: "Curbing secret-police abuses and partisan vendettas restores censorial integrity and cools rebellion across the provinces."
 STATIC_MODIFIER_NAME_oe_mg2_mod_southern_loyalist_banner: "Southern Ming Loyalist Banner"
 STATIC_MODIFIER_DESC_oe_mg2_mod_southern_loyalist_banner: "Loyalist armies and maritime fleets across Jiangnan, Fujian, and Yunnan rally beneath the Ming banner for protracted resistance."
 oe_mg2.1.title: "The Jianwen Court and Reduction of the Princes"
 oe_mg2.1.desc: "Upon ascending the Nanjing throne, the young Jianwen Emperor faces powerful border uncles commanding veteran garrisons in Yan, Jin, and Ning. Scholars Qi Tai and Huang Zicheng urge rapid abolition of princely armies, while cautious elders warn against provoking a dynastic civil war."
 oe_mg2.1.a: "Press Swift Princely Reduction to Centralize Power"
 oe_mg2.1.b: "Preserve Frontier Princedoms Under Gradual Reform"
 oe_mg2.2.title: "The Jingnan Campaign: Prince of Yan Strikes South"
 oe_mg2.2.desc: "Banners rise above Beiping as Prince of Yan Zhu Di invokes the ancestral injunction to clear wicked counselors from the throne, leading battle-hardened northern cavalry south across the plains. The realm stands split between Yan's martial bid and Nanjing's loyalist defense."
 oe_mg2.2.a: "Embrace the Prince of Yan's Martial Mandate"
 oe_mg2.2.b: "Rally Loyalist Armies to Defend Nanjing"
 oe_mg2.3.title: "Compiling the Yongle Dadian: Great Canon of the Realm"
 oe_mg2.3.desc: "Over two thousand Hanlin scholars assemble at Wenyuan Pavilion under imperial decree to gather every surviving treatise on history, astronomy, medicine, agronomy, and statecraft into the eleven-thousand-volume Yongle Dadian. Shall the crown fund the full monumental canon?"
 oe_mg2.3.a: "Fund the Full Yongle Dadian Grand Canon"
 oe_mg2.3.b: "Focus on Practical Statutes and Imperial Archives"
 oe_mg2.4.title: "Raising the Forbidden City and Capital Transfer to Beijing"
 oe_mg2.4.desc: "Timber floats down from Sichuan while Suzhou kiln tiles and marble ascend the Grand Canal. Master builders raise the golden halls of the Forbidden City to anchor the imperial transfer north to Beijing, guarding the frontier gate at immense logistical scale."
 oe_mg2.4.a: "Complete the Forbidden City and Anchor Beijing"
 oe_mg2.4.b: "Pace Palace Construction to Spare Rural Corvee"
 oe_mg2.5.title: "Five Northern Expeditions Beyond the Gobi"
 oe_mg2.5.desc: "Restless steppe confederacies raid the northern marches. The Emperor proposes leading metropolitan cavalry and Shenjiying firearms deep beyond the Gobi to break northern threats outright, while treasury ministers warn of crushing supply costs across the desert."
 oe_mg2.5.a: "Lead Imperial Armies Across the Gobi"
 oe_mg2.5.b: "Hold the Frontier Fortresses and Conserve Treasury"
 oe_mg2.6.title: "The Ren-Xuan Golden Age and Three Yangs Grand Secretariat"
 oe_mg2.6.desc: "Following decades of monumental campaigns, the throne elevates Yang Shiqi, Yang Rong, and Yang Pu to formalize Grand Secretariat ticket-drafting, halt exhausting requisitions, and lower taxes—ushering in the celebrated Ren-Xuan golden age."
 oe_mg2.6.a: "Institutionalize the Three Yangs Cabinet and Fiscal Leniency"
 oe_mg2.6.b: "Channel Peacetime Surplus into Frontier Granaries"
 oe_mg2.7.title: "Gold Floral Silver and Eunuch versus Inner Cabinet Struggle"
 oe_mg2.7.desc: "Commuting four million piculs of southern grain tribute into Gold Floral Silver monetizes imperial revenue just as palace eunuchs of the Directorate of Ceremonial seize the red endorsement brush, igniting a lasting struggle with the Grand Secretariat."
 oe_mg2.7.a: "Expand Silver Commutation Under Ministry Oversight"
 oe_mg2.7.b: "Empower Directorate Eunuchs to Check Court Bureaucrats"
 oe_mg2.8.title: "1449: Catastrophe at Tumu Post-Station"
 oe_mg2.8.desc: "Oirat horsemen under Esen sweep toward Datong and Xuanfu; cut off from water at Huailai's Tumu post-station, the hastily marshaled imperial host collapses under encirclement, shattering the capital army and plunging the court into terror."
 oe_mg2.8.a: "Summon Frontier Divisions Immediately to Shield Beijing"
 oe_mg2.8.b: "Purge Reckless Palace Favorites and Rebuild Capital Regiments"
 oe_mg2.9.title: "Yu Qian's Stand: The Defense of Beijing"
 oe_mg2.9.desc: "With steppe horsemen outside Beijing's gates and panicked courtiers urging flight to Nanjing, Minister of War Yu Qian thunders that advocates of retreat deserve execution. Moving Tongzhou grain inside the walls, he arrays 220,000 fresh troops before Desheng Gate."
 oe_mg2.9.a: "Entrust Yu Qian with Full Command at Desheng Gate"
 oe_mg2.9.b: "Hold the Ramparts While Negotiating a Frontier Truce"
 oe_mg2.10.title: "The Hongzhi Restoration and Revival of the Six Ministries"
 oe_mg2.10.desc: "Determined to heal decades of sinecures and fiscal drift, the Hongzhi Emperor restores candid audiences with virtuous Grand Secretaries, purges superfluous offices, repairs river dikes, and refills public granaries across the provinces."
 oe_mg2.10.a: "Purge Sinecures and Restore Open Cabinet Governance"
 oe_mg2.10.b: "Invest Restored Surpluses into Northern Wall Garrisons"
 oe_mg2.11.title: "Leopard Quarter Excesses and the Great Rites Controversy"
 oe_mg2.11.desc: "After turbulent palace favorites give way to a collateral branch ascending the throne, a fierce constitutional showdown erupts over imperial ancestral rites. Hundreds of officials kneel in protest at Zuoshun Gate, testing whether crown will or ministerial precedent governs."
 oe_mg2.11.a: "Assert Sovereign Ritual Prerogative Over Court Precedent"
 oe_mg2.11.b: "Reconcile with the Six Ministries Through Classical Precedent"
 oe_mg2.12.title: "The Gengxu Incident and Altan Khan's Peace Accord"
 oe_mg2.12.desc: "When Altan Khan's horsemen breach Gubeikou and ride to Beijing's suburbs, ministers realize endless border raids bleed the treasury dry. Reformers propose granting Altan Khan a tributary title and opening regulated horse markets to buy generations of northern peace."
 oe_mg2.12.a: "Seal the Horse-Market Peace and Title Accord"
 oe_mg2.12.b: "Reject Border Concessions and Harden the Nine Garrisons"
 oe_mg2.13.title: "Qi Jiguang on the Northern Frontier: Brick Wall and Hollow Towers"
 oe_mg2.13.desc: "Transferred north after pacifying coastal pirates, General Qi Jiguang encases the decaying earthen ramparts of Jizhou in fired brick and constructs over a thousand multi-story hollow watchtowers bristling with swivel guns and interlocking fields of fire."
 oe_mg2.13.a: "Fund Qi Jiguang's Brick Great Wall and Hollow Watchtowers"
 oe_mg2.13.b: "Reinforce Key Passes While Conserving Silver Reserves"
 oe_mg2.14.title: "Wanli's Three Great Campaigns: Ningxia, Joseon, and Bozhou"
 oe_mg2.14.desc: "Within a single decade three fires erupt: mutineers seize Ningxia, an invasion sweeps Joseon across the Yalu, and Bozhou rises in the southwest. Drawing down decades of treasury reserves, Ming armies triumph on every front—at staggering fiscal cost."
 oe_mg2.14.a: "Commit Full Imperial Resources to Win All Three Campaigns"
 oe_mg2.14.b: "Coordinate Regional Levies and Cap Campaign Expenditure"
 oe_mg2.15.title: "Mine-Tax Eunuchs and the Suzhou Silk-Weaver Riots"
 oe_mg2.15.desc: "Seeking emergency silver after costly campaigns, imperial eunuch tax commissioners squeeze urban guilds across the provinces. In Suzhou, extortionate silk taxes spark thousands of weavers under Ge Xian to burn customs stations and halt commerce."
 oe_mg2.15.a: "Back the Tax Commissioners to Fill the Imperial Purse"
 oe_mg2.15.b: "Recall Abusive Tax Eunuchs and Conciliate Jiangnan Guilds"
 oe_mg2.16.title: "The Donglin Academy and Late Ming Factionalism"
 oe_mg2.16.desc: "Gu Xiancheng revives Wuxi's Donglin Academy to champion moral reform and candid criticism of court decay, yet rival regional factions counterattack relentlessly—trapping Six Ministry appointments and fiscal decisions in bitter partisan deadlock."
 oe_mg2.16.a: "Elevate Donglin Reformers to Revive the Censorate"
 oe_mg2.16.b: "Enforce Factional Balance and Practical Administrative Audits"
 oe_mg2.17.title: "Wei Zhongxian's Eastern Depot and the Six Gentlemen"
 oe_mg2.17.desc: "Chief eunuch Wei Zhongxian seizes control of the Eastern Depot and Brocade Guard, erecting living shrines nationwide while imprisoning Donglin's Six Gentlemen in secret tribunals. Fear paralyzes the court as frontier defense starves for honest leadership."
 oe_mg2.17.a: "Let the Eastern Depot Crush Factional Opposition"
 oe_mg2.17.b: "Dismantle the Eunuch Clique and Vindicate the Censors"
 oe_mg2.18.title: "Little Ice Age Drought and the Shaanxi Courier Uprising"
 oe_mg2.18.desc: "Freezing Little Ice Age droughts and locust swarms devastate northern Shaanxi just as austerity decrees abolish imperial courier stations. Starving soldiers and dismissed postmen rally behind Gao Yingxiang and Li Zicheng, igniting a firestorm across the northwest."
 oe_mg2.18.a: "Dispatch Famine Grain and Restore Shaanxi Courier Stipends"
 oe_mg2.18.b: "Order Frontier Armies to Crush the Insurgents Without Relief"
 oe_mg2.19.title: "Silver Squeeze and Little Ice Age Fiscal Collapse"
 oe_mg2.19.desc: "Sharp drops in Manila and Japanese bullion imports trigger devastating silver deflation. Peasants assessed in silver under the Single Whip Law face ruinous emergency military surtaxes, driving whole counties into bankruptcy and rebellion."
 oe_mg2.19.a: "Mint Standard Coinage and Remit Famine-Province Arrears"
 oe_mg2.19.b: "Enforce Silver Surtaxes to Sustain Both Fronts"
 oe_mg2.20.title: "Li Zicheng's Banner: Equal Land and No Grain Tax"
 oe_mg2.20.desc: "Heeding scholar advisors, Dashing King Li Zicheng sweeps across Henan and seizes Xi'an beneath the electrifying slogan 'Equal Land, No Grain Tax.' Starving counties throw open their gates as imperial field armies struggle to stem the tide."
 oe_mg2.20.a: "Mobilize Elite Field Armies to Hold the Central Plains"
 oe_mg2.20.b: "Proclaim Three-Year Tax Remission to Win Back the Peasantry"
 oe_mg2.21.title: "Zhang Xianzhong Sweeps Huguang into Sichuan"
 oe_mg2.21.desc: "Veteran insurgent commander Zhang Xianzhong storms Xiangyang and Wuchang before driving through the Yangtze gorges toward Chongqing and Chengdu, severing Sichuan's granaries and salt revenues from the imperial treasury."
 oe_mg2.21.a: "Coordinate Sichuan Garrisons and Local Militias Along the Yangtze"
 oe_mg2.21.b: "Pull Back to Protect the Yangtze Grain Arteries and Capital"
 oe_mg2.22.title: "The Jingshan Crisis and Fate of Shanhaiguan"
 oe_mg2.22.desc: "Rebel armies pour across the Taihang passes toward Beijing while hostile banners mass outside Shanhaiguan. At Jingshan Coal Hill the Ming throne faces its supreme test: stake everything on a desperate defense of the northern capital or preserve a southern succession."
 oe_mg2.22.a: "Empty the Inner Vault to Rally Beijing for a Decisive Stand"
 oe_mg2.22.b: "Send the Heir South to Nanjing to Preserve the Ming Line"
 oe_mg2.23.title: "The Hongguang Court in Nanjing and Four Defense Towns"
 oe_mg2.23.desc: "In the rich southern capital of Nanjing, loyal statesman Shi Kefa strives to weld the quarreling Four Defense Towns north of the Yangtze into a disciplined shield, urging court factions to set aside vendettas before the northern frontier collapses."
 oe_mg2.23.a: "Grant Shi Kefa Unified Command Over the Four Defense Towns"
 oe_mg2.23.b: "Conciliate Jiangnan Gentry and Regional Generals with Grants"
 oe_mg2.24.title: "The Longwu Court in Fuzhou and Maritime Fujian Fleets"
 oe_mg2.24.desc: "Anchored in Fuzhou behind the steep Xianxia mountain passes, Ming loyalists enlist Fujian's formidable armed merchant fleets, channeling maritime silver into coastal garrisons and northern counteroffensives."
 oe_mg2.24.a: "Charter the Fujian War Fleets to Fund Maritime Resistance"
 oe_mg2.24.b: "Fortify the Fujian Mountain Passes and Drill Provincial Infantry"
 oe_mg2.25.title: "The Yongli Court in the Southwest and Li Dingguo's Victories"
 oe_mg2.25.desc: "Operating across Zhaoqing, Guilin, and Kunming, the Yongli court sets aside old grudges to unite with former rebel general Li Dingguo. Striking like lightning through Guangxi and Hunan, his armies shatter rival princes in dazzling victories."
 oe_mg2.25.a: "Entrust Li Dingguo with Supreme Command for the Counteroffensive"
 oe_mg2.25.b: "Consolidate Yunnan-Guizhou Logistics and Tusi Allies"
 oe_mg2.26.title: "Koxinga's Ming Loyalist Banner and Recovery of Taiwan"
 oe_mg2.26.desc: "Bearing the Imperial Surname, Zheng Chenggong (Koxinga) leads hundreds of war junks from Quanzhou and Xiamen across the strait, expelling colonial fortresses on Taiwan to establish a thriving maritime bastion under the Ming calendar."
 oe_mg2.26.a: "Commission Koxinga to Secure Taiwan and Command the Strait"
 oe_mg2.26.b: "Coordinate Koxinga's Fleet for a Joint Yangtze Push"
