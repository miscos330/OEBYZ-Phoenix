 oe_chr.7.title:0 "1800 Dawn: Revolutions & Final Reckoning"
 oe_chr.7.desc:0 "The nineteenth century dawns with thirty-six years left before the 1836 grand sealing. The [ROOT.GetCountry.Custom('OeChrColTraditionTitle')] logs #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_chr_col_milestone_count')|0]#! / 22 milestones, #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_chr_col_rd_c5_locs')|0]#! locations, and #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_chr_col_rd_c5_inc')|0]#! monthly income."
