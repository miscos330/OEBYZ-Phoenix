 oe_chr.6.title:0 "Fourth Centennial (1737): Enlightenment & Hegemony"
 oe_chr.6.desc:0 "After four centuries, Enlightenment statecraft and four-dimensional hegemony push Great Power rivalry toward its climax. The [ROOT.GetCountry.Custom('OeChrColTraditionTitle')] records #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_chr_col_milestone_count')|0]#! / 22 milestones, #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_chr_col_rd_c4_locs')|0]#! locations, and #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_chr_col_rd_c4_inc')|0]#! monthly income."
