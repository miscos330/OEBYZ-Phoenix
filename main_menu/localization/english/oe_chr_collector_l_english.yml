 oe_chr.2.title:0 "Commissioning the Official Historiographical Style"
 oe_chr.2.desc:0 "Four great historiographical traditions record the rise and endurance of empires: the Byzantine and Orthodox Chronographia, the East Asian Veritable Records (Shilu), the Ottoman-Persian-Mamluk Imperial Court Annals (Vakanüvis), and the Latin-Western Royal Annals (Annales Regni). Under which tradition shall our five-century chronicle be compiled?"
 oe_chr.2.a:0 "Adopt the Imperial Chronographia Tradition"
 oe_chr.2.b:0 "Adopt the Veritable Records (Shilu) Tradition"
 oe_chr.2.c:0 "Adopt the Court Annals (Vakanüvis) Tradition"
 oe_chr.2.d:0 "Adopt the Royal Annals (Annales Regni) Tradition"
 oe_chr.3.title:0 "First Centennial (1437): Dawn of the Renaissance"
 oe_chr.3.desc:0 "From 1337 to 1437, a full century of trial and statecraft enters the [ROOT.GetCountry.Custom('OeChrColTraditionTitle')]. Inscribed on the world timeline graph, the realm holds #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_chr_col_milestone_count')|0]#! / 22 milestones, #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_chr_col_rd_c1_locs')|0]#! locations, and #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_chr_col_rd_c1_inc')|0]#! monthly income."
