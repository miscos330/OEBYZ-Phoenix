 oe_chr.3.b:0 "Inspect the Full Collector Chronicle"
 oe_chr.4.title:0 "Second Centennial (1537): Oceans & Reformation"
 oe_chr.4.desc:0 "Crossing 1537, oceanic voyages, gunpowder armies, and transcontinental bullion flows remake Eurasia. The [ROOT.GetCountry.Custom('OeChrColTraditionTitle')] records #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_chr_col_milestone_count')|0]#! / 22 milestones, #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_chr_col_rd_c2_locs')|0]#! locations, and #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_chr_col_rd_c2_inc')|0]#! monthly income."
