 oe_chr.8.title:0 "Marble Laurels of Hegemony & Great War"
 oe_chr.8.desc:0 "The [ROOT.GetCountry.Custom('OeChrColChroniclerTitle')] reports that our triumphs in late-era hegemony and the Eurasian Endgame Great War have been inscribed in the [ROOT.GetCountry.Custom('OeChrColTraditionTitle')]. Peak hegemonies held: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_chr_col_rd_peak_heg')|0]#!; Endgame role: [ROOT.GetCountry.Custom('OeChrColEndgameRole')]."
 oe_chr.8.a:0 "Raise the Triumphal Inscription"
 oe_chr.9.title:0 "1836 Grand Apotheosis: Sealing the [ROOT.GetCountry.Custom('OeChrColTraditionTitle')]"
 oe_chr.9.desc_header:0 "#T Five-Century Final Verdict (1337–1836)#!\n#T Final Grade#!: [ROOT.GetCountry.Custom('OeChrColGradeLabel')]  |  #T Milestones Inscribed#!: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_chr_col_milestone_count')|0]#! / #Y 22#!\n#T Cross-Wave Apex Seal#!: [ROOT.GetCountry.Custom('OeChrColApexSeal')]\n#T Peak Locations#!: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_chr_col_rd_peak_locs')|0]#!  |  #T Peak Hegemonies#!: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_chr_col_rd_peak_heg')|0]#!  |  #T Endgame Role#!: [ROOT.GetCountry.Custom('OeChrColEndgameRole')]\n\n"
 oe_chr.9.desc_s:0 "The chroniclers proclaim an Immortal World Empire: fifteen or more timeless milestones spanning commerce, quarantine, institutional renewal, hegemony, and endgame triumph seal a legend for all ages."
 oe_chr.9.desc_a:0 "With eleven to fourteen inscribed milestones, our realm shaped the political, commercial, and cultural destiny of Eurasia as a preeminent sovereign power."
 oe_chr.9.desc_b:0 "With seven to ten milestones achieved across five turbulent centuries, the realm endures proudly as a respected Great Power of lasting renown."
 oe_chr.9.desc_c:0 "With four to six milestones preserved against relentless rivals and crises, the realm earns lasting honor for its resilience and sovereignty."
 oe_chr.9.desc_d:0 "Though the tides of five centuries ran fierce, the realm endured unbroken to carry its ember into the modern world."
 oe_chr.9.a:0 "Seal the Five-Century Chronicle Forever"
 oe_chr.10.title:0 "Reorganizing the Imperial State Archives"
 oe_chr.10.desc:0 "The [ROOT.GetCountry.Custom('OeChrColChroniclerTitle')] petitions for funds to expand the archive vaults and catalogue centuries of edicts, treaties, port ledgers, and quarantine statutes."
 oe_chr.10.a:0 "Endow the Archives (80 Gold for Prestige, Tradition & Research)"
