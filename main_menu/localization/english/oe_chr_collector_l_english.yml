 oe_chr.4.b:0 "Inspect the Full Collector Chronicle"
 oe_chr.5.title:0 "Third Centennial (1637): General Crisis & Absolutism"
 oe_chr.5.desc:0 "In 1637, Little Ice Age winters, recurring plagues, and dynastic upheaval test every empire. The [ROOT.GetCountry.Custom('OeChrColTraditionTitle')] records #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_chr_col_milestone_count')|0]#! / 22 milestones, #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_chr_col_rd_c3_locs')|0]#! locations, and #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_chr_col_rd_c3_inc')|0]#! monthly income."
