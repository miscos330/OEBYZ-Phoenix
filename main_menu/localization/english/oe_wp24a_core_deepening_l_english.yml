 oe_wp24a_dec_pref_oriens_charter.desc:0 "Issue a regional governance charter from Antioch for the Praetorian Prefecture of Oriens, organizing Levantine silk customs, Syriac-Greek frontier councils, and Mesopotamian Limes commands. Costs #Y 120#! gold and launches the Oriens Prefectural Governance chain."
 oe_wp24a_dec_pref_oriens_charter.a:0 "Proclaim the Charter of Oriens"
 oe_wp24a_dec_pref_illyricum_charter:0 "Charter the Praetorian Prefecture of Illyricum"
 oe_wp24a_dec_pref_illyricum_charter_desc:0 "Issue a regional governance charter from Thessalonica for the Praetorian Prefecture of Illyricum, restoring Via Egnatia trade stations, Danube Iron-Gate fortresses, and Balkan military settlements. Costs #Y 120#! gold and launches the Illyricum Prefectural Governance chain."
