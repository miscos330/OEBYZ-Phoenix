 oe_wp24a_dec_pref_illyricum_charter.desc:0 "Issue a regional governance charter from Thessalonica for the Praetorian Prefecture of Illyricum, restoring Via Egnatia trade stations, Danube Iron-Gate fortresses, and Balkan military settlements. Costs #Y 120#! gold and launches the Illyricum Prefectural Governance chain."
 oe_wp24a_dec_pref_illyricum_charter.a:0 "Proclaim the Charter of Illyricum"
 oe_wp24a_dec_pref_italia_charter:0 "Charter the Praetorian Prefecture of Italia & Carthage"
 oe_wp24a_dec_pref_italia_charter_desc:0 "Issue a regional governance charter uniting the Exarchates of Ravenna and Carthage, reconciling the Roman Senate on the Capitoline, and reviving Sicilian grain fleets. Costs #Y 140#! gold and launches the Italia & Carthage Governance chain."
 oe_wp24a_dec_pref_italia_charter.title:0 "Charter the Praetorian Prefecture of Italia & Carthage"
 oe_wp24a_dec_pref_italia_charter.desc:0 "Issue a regional governance charter uniting the Exarchates of Ravenna and Carthage, reconciling the Roman Senate on the Capitoline, and reviving Sicilian grain fleets. Costs #Y 140#! gold and launches the Italia & Carthage Governance chain."
 oe_wp24a_dec_pref_italia_charter.a:0 "Proclaim the Charter of Italia and Carthage"
 oe_wp24a_dec_pref_gallia_charter:0 "Charter the Praetorian Prefecture of Gallia"
 oe_wp24a_dec_pref_gallia_charter_desc:0 "Issue a regional governance charter anchored at Lyon and Trier for the Praetorian Prefecture of Gallia, restoring the Rhine Limes, Gallo-Roman municipal curiae, and the Atlantic maritime frontier. Costs #Y 150#! gold and launches the Gallia Governance chain."
 oe_wp24a_dec_pref_gallia_charter.title:0 "Charter the Praetorian Prefecture of Gallia"
 oe_wp24a_dec_pref_gallia_charter.desc:0 "Issue a regional governance charter anchored at Lyon and Trier for the Praetorian Prefecture of Gallia, restoring the Rhine Limes, Gallo-Roman municipal curiae, and the Atlantic maritime frontier. Costs #Y 150#! gold and launches the Gallia Governance chain."
 oe_wp24a_dec_pref_gallia_charter.a:0 "Proclaim the Charter of Gallia"
 oe_wp24a_dec_teu_secularize_prussia:0 "Albrecht's 1525 Secularization of Prussia"
 oe_wp24a_dec_teu_secularize_prussia_desc:0 "Follow Grand Master Albrecht of Brandenburg-Ansbach in secularizing the monastic Ordensstaat into the hereditary Duchy of Prussia, launching Protestant administrative modernization, Junker service estates, the Albertina University, and Prussian army discipline. Mutually exclusive with the Eternal Catholic Crusade Order."
 oe_wp24a_dec_teu_secularize_prussia.title:0 "Albrecht's 1525 Secularization of Prussia"
 oe_wp24a_dec_teu_secularize_prussia.desc:0 "Follow Grand Master Albrecht of Brandenburg-Ansbach in secularizing the monastic Ordensstaat into the hereditary Duchy of Prussia, launching Protestant administrative modernization, Junker service estates, the Albertina University, and Prussian army discipline. Mutually exclusive with the Eternal Catholic Crusade Order."
 oe_wp24a_dec_teu_secularize_prussia.a:0 "Secularize the Ordensstaat into Prussia"
 oe_wp24a_dec_teu_eternal_crusade:0 "Reaffirm the Eternal Catholic Crusade Order"
 oe_wp24a_dec_teu_eternal_crusade_desc:0 "Reject Reformation secularization, lift high the Marian Banner, summon imperial and papal Catholic volunteers, fortify the Baltic Ordensburgen, and reform the Knights into a Counter-Reformation Militant Order. Mutually exclusive with Prussian Secularization."
 oe_wp24a_dec_teu_eternal_crusade.title:0 "Reaffirm the Eternal Catholic Crusade Order"
 oe_wp24a_dec_teu_eternal_crusade.desc:0 "Reject Reformation secularization, lift high the Marian Banner, summon imperial and papal Catholic volunteers, fortify the Baltic Ordensburgen, and reform the Knights into a Counter-Reformation Militant Order. Mutually exclusive with Prussian Secularization."
 oe_wp24a_dec_teu_eternal_crusade.a:0 "Swear the Eternal Marian Oath"
 oe_wp24a_dec_yuan_dayan_six_tumens:0 "Dayan Khan's Six Tumens Reorganization"
 oe_wp24a_dec_yuan_dayan_six_tumens_desc:0 "Convene a grand kurultai to reorganize the steppe banners into the Six Tumens (Zulgaan Tumen) under the Borjigin Golden Lineage, reviving rapid Mongol cavalry hosts and preparing the Northern Yuan resurgence. Costs #Y 100#! gold."
 oe_wp24a_dec_yuan_dayan_six_tumens.title:0 "Dayan Khan's Six Tumens Reorganization"
 oe_wp24a_dec_yuan_dayan_six_tumens.desc:0 "Convene a grand kurultai to reorganize the steppe banners into the Six Tumens (Zulgaan Tumen) under the Borjigin Golden Lineage, reviving rapid Mongol cavalry hosts and preparing the Northern Yuan resurgence. Costs #Y 100#! gold."
 oe_wp24a_dec_yuan_dayan_six_tumens.a:0 "Proclaim the Six Tumens Charter"
 oe_wp24a_dec_yuan_reconquest_dadu:0 "Proclaim the Reconquest of Dadu"
 oe_wp24a_dec_yuan_reconquest_dadu_desc:0 "Rally the resurgent Mongol banners around the Imperial Seal to march south toward Dadu or consolidate its recapture, forging renewed siege morale and a Twin-Capital steppe-and-settled governance charter."
 oe_wp24a_dec_yuan_reconquest_dadu.title:0 "Proclaim the Reconquest of Dadu"
 oe_wp24a_dec_yuan_reconquest_dadu.desc:0 "Rally the resurgent Mongol banners around the Imperial Seal to march south toward Dadu or consolidate its recapture, forging renewed siege morale and a Twin-Capital steppe-and-settled governance charter."
 oe_wp24a_dec_yuan_reconquest_dadu.a:0 "Raise the Banners for Dadu"
 oe_wp24a_dec_yuan_four_khanates_yam:0 "Relight the Yam: Reconnect the Four Khanates"
 oe_wp24a_dec_yuan_four_khanates_yam_desc:0 "Dispatch imperial paiza emissaries along the trans-Eurasian Yam postal network to reconnect the Great Khanate with the Golden Horde, the Chagatai Ulus, and the Persian Ilkhanate successors, renewing the Pax Mongolica. Costs #Y 120#! gold."
 oe_wp24a_dec_yuan_four_khanates_yam.title:0 "Relight the Yam: Reconnect the Four Khanates"
 oe_wp24a_dec_yuan_four_khanates_yam.desc:0 "Dispatch imperial paiza emissaries along the trans-Eurasian Yam postal network to reconnect the Great Khanate with the Golden Horde, the Chagatai Ulus, and the Persian Ilkhanate successors, renewing the Pax Mongolica. Costs #Y 120#! gold."
 oe_wp24a_dec_yuan_four_khanates_yam.a:0 "Dispatch the Paiza Emissaries"
 oe_wp24a_pref.1.t:0 "Oriens: Antioch and the Levantine Silk Arteries"
 oe_wp24a_pref.1.d:0 "From the colonnaded markets of Antioch to the desert depots of Aleppo and Damascus, silk caravans once more seek the protection of Roman standards. The Praetorian Prefect of Oriens petitions the Palace to decide whether eastern revenues should prioritize chartered merchant emporia or fortified frontier military granaries."
 oe_wp24a_pref.1.a:0 "Charter the Levantine silk emporia at Antioch"
 oe_wp24a_pref.1.b:0 "Direct customs gold into Mesopotamian frontier forts"
 oe_wp24a_pref.2.t:0 "Oriens: Syriac and Greek Frontier Harmony"
 oe_wp24a_pref.2.d:0 "Across Syria and Upper Mesopotamia, Syriac Christian artisans, Arabic-speaking tribesmen, and Greek municipal elites share the same fortified valleys. The local Strategos warns that rigid cultural centralization invites frontier resentment, whereas a bilingual civic concord can win enduring provincial peace."
 oe_wp24a_pref.2.a:0 "Ratify the Syriac-Greek frontier civic concord"
 oe_wp24a_pref.2.b:0 "Uphold direct imperial chancery & orthodox uniformity"
 oe_wp24a_pref.3.t:0 "Oriens: Command of the Mesopotamian Limes"
 oe_wp24a_pref.3.d:0 "As the Mesopotamian Limes takes shape along the Euphrates crossings, Constantinople's Senate demands oversight over the eastern Strategoi's war chests. Granting the Strategoi unified command sharpens eastern defense, while sharing financial audits with the Senate anchors domestic legitimacy."
 oe_wp24a_pref.3.a:0 "Empower the Strategos of Oriens with full Limes command"
 oe_wp24a_pref.3.b:0 "Establish joint Senate-Prefecture fiscal commissions"
 oe_wp24a_pref.4.t:0 "Illyricum: Thessalonica and the Via Egnatia"
 oe_wp24a_pref.4.d:0 "The ancient pavement of the Via Egnatia—linking the Adriatic ports through Thessalonica to the Queen of Cities—now lies secure beneath Roman authority. Prefectural engineers await imperial approval to rebuild the post stations as an artery of Balkan commerce and rapid troop movement."
 oe_wp24a_pref.4.a:0 "Rebuild the Via Egnatia trade and courier stations"
 oe_wp24a_pref.4.b:0 "Prioritize northern fortress roads toward the Danube"
 oe_wp24a_pref.5.t:0 "Illyricum: Fortifications of the Danube Iron Gates"
 oe_wp24a_pref.5.d:0 "Where the Danube narrows through the steep gorge of the Iron Gates, northern raiding hosts have crossed for centuries. Military architects propose anchoring an interlocking line of stone citadels and river-patrol forts from Belgrade down the lower Danube."
 oe_wp24a_pref.5.a:0 "Fund the Danube Iron-Gate fortress chain"
 oe_wp24a_pref.5.b:0 "Rely on mobile highway garrisons from Thessalonica"
 oe_wp24a_pref.6.t:0 "Illyricum: Vlach and Slavic Stratiotai Settlements"
 oe_wp24a_pref.6.d:0 "Highland Vlach herders and Slavic frontier communities along the Balkan passes offer hereditary military service in exchange for tax-exempt stratiotai land grants. Great provincial magnates protest any erosion of their estates, urging the Senate to protect aristocratic land titles instead."
 oe_wp24a_pref.6.a:0 "Charter hereditary Vlach and Slavic stratiotai plots"
 oe_wp24a_pref.6.b:0 "Side with the Senate magnates and levy regular crown rents"
 oe_wp24a_pref.7.t:0 "Italia: Twin Exarchates of Ravenna and Carthage"
 oe_wp24a_pref.7.d:0 "With Ravenna on the Adriatic and the harbors of Carthage across the Sicilian strait back under Roman eagles, the Prefecture of Italia and Africa commands the waist of the Mediterranean. Imperial admirals propose refurbishing both historic exarchal shipyards as permanent fleet anchors."
 oe_wp24a_pref.7.a:0 "Refurbish the Ravenna and Carthage exarchal arsenals"
 oe_wp24a_pref.7.b:0 "Favor civil Italian jurisprudence over naval outlay"
 oe_wp24a_pref.8.t:0 "Italia: Concordat with the Roman Senate"
 oe_wp24a_pref.8.d:0 "Senators assembling on the Capitoline Hill hail the return of Roman sovereignty yet respectfully request a formal Concordat defining the division of municipal courts, honorary consulships, and prefectural appointments between Old Rome and New Rome."
 oe_wp24a_pref.8.a:0 "Sign the Capitoline Senate power-sharing Concordat"
 oe_wp24a_pref.8.b:0 "Affirm indivisible imperial authority from the Consistorium"
 oe_wp24a_pref.9.t:0 "Italia: The Sicilian and African Annona Fleets"
 oe_wp24a_pref.9.d:0 "Golden harvests from Sicily and the plains behind Carthage once fed the greatest cities of antiquity. The Prefect of Italia presents a charter to reconstitute the state Annona grain fleets under armed naval convoy, stabilizing bread prices across the empire at the expense of private merchant speculation."
 oe_wp24a_pref.9.a:0 "Reconstitute the state Annona grain convoys"
 oe_wp24a_pref.9.b:0 "Auction private shipping licenses and bolster warships"
 oe_wp24a_pref.10.t:0 "Gallia: Lyon, Trier, and the Restored Rhine Limes"
 oe_wp24a_pref.10.d:0 "Imperial surveyors riding through Lyon and the old western capital of Trier trace the ruins of Roman watchtowers along the Rhine. Establishing Trier as the military anchor of the Rhine Limes promises iron border security, while focusing on Lyon's civil bureaus accelerates western integration."
 oe_wp24a_pref.10.a:0 "Rebuild the Rhine Limes fortresses from Trier"
 oe_wp24a_pref.10.b:0 "Expand Lyon's civil chancery and Latin curiae"
 oe_wp24a_pref.11.t:0 "Gallia: Gallo-Roman Municipal Curiae"
 oe_wp24a_pref.11.d:0 "Local notables across Gaul, Iberia, and the Rhineland seek recognition as revived municipal curiales, offering to underwrite road repair and provincial tax registers in return for senatorial rank and local legal privileges."
 oe_wp24a_pref.11.a:0 "Restore the Gallo-Roman municipal curiae"
 oe_wp24a_pref.11.b:0 "Collect direct imperial tribute through crown logothetes"
 oe_wp24a_pref.12.t:0 "Gallia: The Atlantic Maritime Frontier & Western Strategoi"
 oe_wp24a_pref.12.d:0 "With Roman standards planted once again where the rivers of Gaul meet the Atlantic Ocean, the Western Prefect proposes establishing an oceanic naval command alongside coordinated Strategoi across the western provinces. Should all four Praetorian Prefectures stand chartered together, the Empire celebrates the restoration of Diocletian's fourfold order."
 oe_wp24a_pref.12.a:0 "Charter the Atlantic Admiralty & Western Strategoi"
 oe_wp24a_pref.12.b:0 "Concentrate western forces along the Rhine frontier"
 oe_wp24a_teu.1.t:0 "1525: Grand Master Albrecht's Secularization of Prussia"
 oe_wp24a_teu.1.d:0 "The winds of the Reformation have swept through the Baltic ports and brick commanderies of Prussia. At the Diet of Konigsberg, Grand Master Albrecht urges the brethren and estates to cast off the medieval monastic rule and reconstitute the Ordensstaat as a hereditary secular Duchy of Prussia—risking papal outrage in exchange for Protestant administrative modernization."
 oe_wp24a_teu.1.a:0 "Secularize into the Lutheran Duchy of Prussia"
 oe_wp24a_teu.1.b:0 "Enact a cautious secular ducal charter"
 oe_wp24a_teu.2.t:0 "Prussia: The Secular Junker Service Estates"
 oe_wp24a_teu.2.d:0 "With monastic vows dissolved, hundreds of former knight-commanders and Prussian noblemen demand clarity over the old Order lands. Enfeoffing them as hereditary secular Junkers bound to military officer service builds a loyal martial aristocracy, though rural peasants bear steeper estate obligations."
 oe_wp24a_teu.2.a:0 "Confirm hereditary Junker military service estates"
 oe_wp24a_teu.2.b:0 "Retain the commandery lands as direct ducal domains"
 oe_wp24a_teu.3.t:0 "Prussia: Founding of the Albertina University of Konigsberg"
 oe_wp24a_teu.3.d:0 "To supply the newly secularized duchy with learned Protestant pastors, jurists, and treasury auditors, Duke Albrecht proposes founding a flagship university on the Pregel island of Kneiphof in Konigsberg—the Albertina—to anchor Baltic humanism and statecraft."
 oe_wp24a_teu.3.a:0 "Endow the Albertina University at Konigsberg"
 oe_wp24a_teu.3.b:0 "Keep ducal funds in the treasury and patronize local Latin schools"
 oe_wp24a_teu.4.t:0 "Prussia: The Military Ordinance & Standing Discipline"
 oe_wp24a_teu.4.d:0 "Surrounded by powerful neighbors across the Baltic plain, the secularized Duchy cannot survive on medieval feudal levies alone. Prussian marshals present a comprehensive Military Ordinance introducing canton recruitment, merit-tested officers, and relentless volley discipline."
 oe_wp24a_teu.4.a:0 "Codify the Prussian standing-army discipline ordinance"
 oe_wp24a_teu.4.b:0 "Rely on Junker cavalry retainers and lean budgets"
 oe_wp24a_teu.5.t:0 "1525: The Oath of the Marian Banner"
 oe_wp24a_teu.5.d:0 "While reformist preachers clamor inside the Baltic towns, the Chapter General gathers beneath the vaulted halls of Marienburg and swears an unbreakable vow before the Marian Banner: the Teutonic Order shall never dissolve into a secular fief, but shall stand as the eternal sword of the Catholic Church in the North."
 oe_wp24a_teu.5.a:0 "Reaffirm the Eternal Catholic Crusade Order"
 oe_wp24a_teu.5.b:0 "Maintain Catholic vows while conciliating Prussian burghers"
 oe_wp24a_teu.6.t:0 "Eternal Order: Imperial and Papal Volunteers"
 oe_wp24a_teu.6.d:0 "News that the Teutonic Knights defied secularization echoes across Rome and the Catholic courts of the Empire. Papal legates proclaim indulgences and recruit zealous noble volunteers eager to ride north beneath the Black Cross."
 oe_wp24a_teu.6.a:0 "Welcome the Imperial and Papal volunteer knights"
 oe_wp24a_teu.6.b:0 "Request monetary crusading subsidies instead of foreign cadres"
 oe_wp24a_teu.7.t:0 "Eternal Order: Bastions of the Baltic Ordensburgen"
 oe_wp24a_teu.7.d:0 "Heavy siege artillery now threatens the medieval brick walls of Marienburg and the frontier commanderies. Italian and imperial Catholic engineers offer to wrap the Baltic Ordensburgen in low-slung star bastions, transforming the Order's heartland into an impregnable northern citadel."
 oe_wp24a_teu.7.a:0 "Rebuild the Baltic Ordensburgen into star bastions"
 oe_wp24a_teu.7.b:0 "Save the treasury and strengthen mobile knightly garrisons"
 oe_wp24a_teu.8.t:0 "Eternal Order: Counter-Reformation Militant Statutes"
 oe_wp24a_teu.8.d:0 "Inspired by the Tridentine revival of Catholic discipline, the Grand Master and Papal nuncio promulgate revised Statutes of the Teutonic Order—fusing monastic obedience, Counter-Reformation missionary zeal, and modern pike-and-shot military drills into a feared Militant Order."
 oe_wp24a_teu.8.a:0 "Promulgate the Counter-Reformation Militant Statutes"
 oe_wp24a_teu.8.b:0 "Emphasize defensive monastic stewardship across the Baltic"
 oe_wp24a_yuan.1.t:0 "Dayan Khan's Kurultai: The Six Tumens"
 oe_wp24a_yuan.1.d:0 "Gathered beneath felt pavilions on the Mongolian steppe, Borjigin princes and veteran noyans swear to end generations of fractious clan feuds. Following Dayan Khan's grand design, the Khaganate reorganizes into the Left and Right Wings—the Six Tumens (Zulgaan Tumen)—restoring a single chain of command across the northern steppes."
 oe_wp24a_yuan.1.a:0 "Unite the Left and Right Wings into the Six Tumens"
 oe_wp24a_yuan.1.b:0 "Elevate the Orkhon banner and honor regional clan compacts"
 oe_wp24a_yuan.2.t:0 "Revival of the Zulgaan Tumen Cavalry Hosts"
 oe_wp24a_yuan.2.d:0 "Across the autumn pastures, tens of thousands of steppe remounts are branded with the tumen marks. Commanders drill the Zulgaan Tumen in coordinated feigned retreats, heavy-armored lancer charges, and rapid composite-bow volleys—reminding Eurasia why Mongol horsemen once shook every empire from the Yellow Sea to the Danube."
 oe_wp24a_yuan.2.a:0 "Establish permanent tumen remount herds and archery drills"
 oe_wp24a_yuan.2.b:0 "Focus on swift light-cavalry raids and pasture tolls"
 oe_wp24a_yuan.3.t:0 "The Orkhon Banner and Karakorum's Call"
 oe_wp24a_yuan.3.d:0 "Beside the stone tortoises of Karakorum on the Orkhon River, shamans, lamas, and princes raise the Nine-Yak-Tail Standard of Chinggis Khan. Messengers ride to every pasture declaring that the Great Yuan's Mandate never perished on the steppe—it merely gathered strength for the return."
 oe_wp24a_yuan.3.a:0 "Raise the Nine-Yak-Tail Standard at Karakorum"
 oe_wp24a_yuan.3.b:0 "Consolidate steppe law and winter granaries first"
 oe_wp24a_yuan.4.t:0 "Reconquest of Dadu: Mandate Resurgence"
 oe_wp24a_yuan.4.d:0 "Whether riding south through Juyong Pass to reclaim the Great Capital or celebrating the banner of the Khagan fluttering once more above Dadu's ramparts, a wave of fierce confidence sweeps the Mongol realm. Siege engineers and steppe horsemen alike pledge their lives to the restoration of the Great Yuan."
 oe_wp24a_yuan.4.a:0 "Press the Reconquest of Dadu with full imperial vigor"
 oe_wp24a_yuan.4.b:0 "Draft a balanced Twin-Capital administrative settlement"
 oe_wp24a_yuan.5.t:0 "Twin Capitals in Harmony: Shangdu and Dadu"
 oe_wp24a_yuan.5.d:0 "To avoid repeating the fatal rift between steppe lords and settled bureaucrats that once fractured the dynasty, imperial councillors propose enshrining a formal Twin-Capital Charter—balancing summer kurultais at Shangdu with disciplined winter administration."
 oe_wp24a_yuan.5.a:0 "Enshrine the Twin-Capital Steppe-and-Settled Charter"
 oe_wp24a_yuan.5.b:0 "Keep the court mobile with the Six Tumens host"
 oe_wp24a_yuan.6.t:0 "Relighting the Yam of the Yeke Mongol Ulus"
 oe_wp24a_yuan.6.d:0 "For decades, broken relay stations and rival tolls severed the great steppe road linking Dadu and Karakorum to the western khanates. Casting fresh silver and gold paiza tablets, the Khaganate prepares to relight the Yam—inviting the Golden Horde, Chagatai, and Persian realms back into diplomatic communion."
 oe_wp24a_yuan.6.a:0 "Rebuild the trans-Eurasian Yam stations and issue paizas"
 oe_wp24a_yuan.6.b:0 "Fund a leaner caravan post network along the inner steppe"
 oe_wp24a_yuan.7.t:0 "Yam Emissaries to the Golden Horde (Jochid Ulus)"
 oe_wp24a_yuan.7.d:0 "Bearing brocade silks and silver paizas, imperial envoys arrive along the northern steppe road to treat with the rulers of the Jochid Ulus. By offering mutual diplomatic concessions and lower customs duties, the Great Khanate can renew Kipchak cavalry exchanges and revive northern Eurasian trade."
 oe_wp24a_yuan.7.a:0 "Grant diplomatic concessions to seal the Jochid Accord"
 oe_wp24a_yuan.7.b:0 "Maintain proud ceremonial precedence and exchange horse masters"
 oe_wp24a_yuan.8.t:0 "Caravan Compact with the Chagatai Ulus"
 oe_wp24a_yuan.8.d:0 "Across the oases of Almaliq, Kashgar, and Samarkand lies the indispensable hinge of the overland Silk Road. Emissaries to the Chagatai realm propose harmonizing caravan escorts and customs tallies so merchants and warhorse breeders can travel freely from the Tarim to Transoxiana."
 oe_wp24a_yuan.8.a:0 "Ratify the Chagatai Silk Road Caravan Compact"
 oe_wp24a_yuan.8.b:0 "Collect frontier customs directly without ortoq concessions"
 oe_wp24a_yuan.9.t:0 "Envoys to the Ilkhanate Realm & Persian Successors"
 oe_wp24a_yuan.9.d:0 "From Tabriz and Baghdad to the mountain passes of Khorasan, memories of the Toluid brotherhood between Great Yuan and the Ilkhanate still endure in Persian chronicles and observatories. Reopening diplomatic posts with the rulers of Persia promises renewed astronomical exchange, siege craft, and western silk markets."
 oe_wp24a_yuan.9.a:0 "Endow diplomatic hostels and scholarly exchange with Persia"
 oe_wp24a_yuan.9.b:0 "Limit contact to veteran military observers and envoys"
 oe_wp24a_yuan.10.t:0 "Renewal of the Pax Mongolica: Four Khanates Reconnected"
 oe_wp24a_yuan.10.d:0 "From the pastures of the Orkhon to the Volga, Samarkand, and the Iranian plateau, couriers bearing the golden paiza ride unimpeded once again. Though no single sword rules every western steppe as in Chinggis Khan's day, the sovereign reconnection of the Four Great Khanates crowns the Great Khanate with renewed continental prestige, cavalry vitality, and Silk Road prosperity."
 oe_wp24a_yuan.10.a:0 "Proclaim the Renewed Pax Mongolica across Eurasia"
 oe_wp24a_yuan.10.b:0 "Channel the alliance chiefly into secure caravan revenue"
