 oe_wp24a_dec_pref_oriens_charter:0 "Charter the Praetorian Prefecture of Oriens"
 oe_wp24a_dec_pref_oriens_charter_desc:0 "Issue a regional governance charter from Antioch for the Praetorian Prefecture of Oriens, organizing Levantine silk customs, Syriac-Greek frontier councils, and Mesopotamian Limes commands. Costs #Y 120#! gold and launches the Oriens Prefectural Governance chain."
