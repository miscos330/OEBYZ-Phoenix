# NEW 2026-11-22 v10.0 Worker 4 Slot 83: 25-Nation Destiny Mission Chains (oe_msn_). Generated by gen_25_missions.py.
 STATIC_MODIFIER_NAME_oe_msn_destiny_crowned_mod:0 "Imperial Destiny Fulfilled"
 STATIC_MODIFIER_DESC_oe_msn_destiny_crowned_mod:0 "Completing one of Eurasia's twenty-five great destiny chains crowns the realm with lasting prestige and stability."
 STATIC_MODIFIER_NAME_oe_msn_multipolar_resonance_mod:0 "Multipolar Eurasian Destiny Resonance"
 STATIC_MODIFIER_DESC_oe_msn_multipolar_resonance_mod:0 "Multiple Eurasian civilizations fulfill their grand historical destinies, igniting continental trade and cultural brilliance."
 oe_msn_byz_destiny:0 "#bold #color_yellow Purple Destiny: Pan-Eurasian Roman Renewal#!#!"
 oe_msn_byz_destiny_DESCRIPTION:0 "Five Centuries of Renewal from the Queen of Cities"
 oe_msn_byz_destiny_CRITERIA_DESCRIPTION:0 "Restore imperial institutions, recover Mediterranean provinces, and forge a modern Rome."
 oe_msn_byz_destiny_BUTTON_TOOLTIP:0 "Embark on the Roman Destiny"
 oe_msn_byz_destiny_BUTTON_DETAILS:0 "A 500-year grand destiny for Byzantium and Rome: rebuild imperial themes and prefectures, bridge East and West, reclaim ancient capitals, and enter the modern era unbroken."
 STATIC_MODIFIER_NAME_oe_msn_byz_m1:0 "Restored Themes & Prefectures"
 STATIC_MODIFIER_DESC_oe_msn_byz_m1:0 "Revived thematic garrisons and praetorian administration sharpen discipline and logistics."
 STATIC_MODIFIER_NAME_oe_msn_byz_m2:0 "Mediterranean Provinces Reclaimed"
 STATIC_MODIFIER_DESC_oe_msn_byz_m2:0 "Reclaiming core Mediterranean capitals restores Roman supremacy across the inland sea."
 STATIC_MODIFIER_NAME_oe_msn_byz_m3:0 "Twin Phoenixes & Golden Horn Clearing"
 STATIC_MODIFIER_DESC_oe_msn_byz_m3:0 "Constantinople anchors Eurasian banking and maritime clearing across both halves of the continent."
 STATIC_MODIFIER_NAME_oe_msn_byz_m4:0 "Eternal Rome: Modern Imperial Destiny"
 STATIC_MODIFIER_DESC_oe_msn_byz_m4:0 "Five centuries of unbroken imperial renewal culminate in a disciplined, enlightened Roman superpower."
 oe_msn_byz_01_queen_of_cities:0 "Purple Renewal: Constantinople & Thessaloniki"
 oe_msn_byz_01_queen_of_cities_desc:0 "Standing astride the Bosphorus and the Thermaic Gulf, Constantinople and Thessaloniki remain the twin anchors of Roman survival. Rebuilding civic [buildings|e], restoring [development|e] in the [capital|e], and anchoring imperial [stability|e] shall revive the Queen of Cities and proclaim to all Mediterranean courts that the Purple still endures."
 oe_msn_byz_01_queen_of_cities_req_tt:0 "Own Constantinople and Thessaloniki, Stability >= 5, Capital Development >= 18, and own a Marketplace or Granary."
 oe_msn_byz_02_new_theme_corps:0 "Reform Themes & Imperial Tagmata"
 oe_msn_byz_02_new_theme_corps_desc:0 "Reliance on fickle Latin and Catalan mercenaries bled the Byzantine fisc dry and invited disaster upon Thrace. By reviving salaried imperial Tagmata alongside fortified provincial [buildings|e], raising disciplined [army_tradition|e], and securing noble [estate_satisfaction|e], the Basileus will forge a loyal Roman [army|e] ready to reclaim the eastern marches."
 oe_msn_byz_02_new_theme_corps_req_tt:0 "Own Constantinople, Stability >= 10, Treasury >= 200 Gold, and either Army Tradition >= 15 or own a Thema Headquarters or Castle."
 oe_msn_byz_03_ecumenical_bridge:0 "Pentarchy Synod or Classical Toleration"
 oe_msn_byz_03_ecumenical_bridge_desc:0 "As Italian humanists flock to Greek manuscripts and Orthodox synods weigh the fate of Christendom, Constantinople stands at an intellectual crossroads. Embracing the new [institutions|e] of learning while honoring the [estates|e] of the Church elevates Roman [cultural_tradition|e] and [prestige|e], bridging classical Hellenism with the living faith of the Ecumenical Patriarchate."
 oe_msn_byz_03_ecumenical_bridge_req_tt:0 "Own Constantinople, Stability >= 15, Age of Renaissance or later, and either embrace Renaissance or own a University or Cathedral."
 oe_msn_byz_04_praetorian_order:0 "Praetorian Prefectures & Modern Strategikon"
 oe_msn_byz_04_praetorian_order_desc:0 "A sprawling Mediterranean realm can no longer be ruled by improvisations from a besieged palace. Updating the ancient Strategikon with gunpowder [advances|e] and organizing vast provinces under revitalized Praetorian prefectures expands imperial [control|e] and [army_tradition|e], opening a historic debate over whether the Empire shall be governed by military Themes or a revived Imperial Senate."
 oe_msn_byz_04_praetorian_order_req_tt:0 "Own Constantinople, Age of Discovery or later, >= 40 Locations, and either Army Tradition >= 25, Pike and Shot advance, or a Training Fields building."
 oe_msn_byz_05_aegean_anatolia:0 "Anatolian Civic Renewal: Nicaea & Smyrna"
 oe_msn_byz_05_aegean_anatolia_desc:0 "Nicaea sheltered the exiled empire in its darkest hour, while Smyrna commands the rich Hermus valley and Aegean sea lanes. Whether governed directly or entrusted to loyal Theme [subjects|e], restoring tax rolls, coastal [prosperity|e], and civil [control|e] across western Anatolia binds both shores of the Aegean into one resilient Roman heartland."
 oe_msn_byz_05_aegean_anatolia_req_tt:0 "Own or subject-own Nicaea (Iznik) and Smyrna, Stability >= 10, and either command an Imperial Theme subject or hold >= 8 Ports."
 oe_msn_byz_06_levant_antioch:0 "Ecumenical Sees & Eastern Diplomatic Order"
 oe_msn_byz_06_levant_antioch_desc:0 "Antioch of the Orontes and the Holy City of Jerusalem stand among the ancient apostolic sees of the Pentarchy. By reclaiming these venerable Levantine pillars or knitting together a broad commonwealth of loyal [subjects|e], the Empire amplifies its [religious_influence|e], [diplomacy|e], and [prestige|e] across the Eastern Mediterranean and prepares the road toward Egypt."
 oe_msn_byz_06_levant_antioch_req_tt:0 "Own or non-sovereign subject-own Antioch and Jerusalem, or maintain >= 3 Subjects and Treasury >= 350 Gold."
 oe_msn_byz_07_nile_granary:0 "Imperial Granary & Fiscal Clearing"
 oe_msn_byz_07_nile_granary_desc:0 "For centuries the imperial grain fleets sailing from Alexandria fed the teeming quarters of Constantinople and anchored the fiscal might of the Caesars. Whether by restoring Roman authority over the Nile delta or by cultivating booming [trade|e] revenues that fill the imperial treasury with [gold|e], securing steady food supplies and [prosperity|e] guarantees the Empire's demographic and fiscal vitality."
 oe_msn_byz_07_nile_granary_req_tt:0 "Own or non-sovereign subject-own Alexandria and Cairo, or hold Treasury >= 600 Gold, Monthly Trade & Tax Income >= 35, and >= 30 Locations."
 oe_msn_byz_08_eternal_rome:0 "Charter of the Eagles: Cross-Regional Integration"
 oe_msn_byz_08_eternal_rome_desc:0 "From Justinian's Exarchate of Ravenna to the Palaiologan dream of reunification, the Tiber and the Mezzogiorno have called out to New Rome. Bringing Old Rome and Naples back beneath the double-headed eagle—or standing as an uncontested [great_power|e] across sixty cities—cements Roman [legitimacy|e], [control|e], and [prestige|e] under a unified Corpus Juris stretching from the Adriatic to the Euphrates."
 oe_msn_byz_08_eternal_rome_req_tt:0 "Own or non-sovereign subject-own Rome and Naples, or hold Stability >= 25, Age of Reformation or later, >= 60 Locations, and Great Power status."
 oe_msn_byz_09_golden_horn_clearing:0 "Golden Horn Clearing & Sound Nomisma"
 oe_msn_byz_09_golden_horn_clearing_desc:0 "The debasement of the hyperpyron broke the financial prestige that once made the Byzantine nomisma the dollar of the Middle Ages. By erecting disciplined commercial [buildings|e], curbing [inflation|e], and drawing steady [trade|e] receipts into the Golden Horn, Constantinople reclaims its role as the premier clearing [market|e] between Venice, Genoa, and the Black Sea."
 oe_msn_byz_09_golden_horn_clearing_req_tt:0 "Own Constantinople, Treasury >= 400 Gold, Monthly Trade & Tax Income >= 20, and own a Counting House or Marketplace."
 oe_msn_byz_10_silk_phoenix_link:0 "Crossroads of Continents & Silk Trade"
 oe_msn_byz_10_silk_phoenix_link_desc:0 "Control of Crimean Kaffa opens the steppe caravan roads to Sarai and Cathay, while Cretan Candia anchors the sea lanes linking Venice to Alexandria. Backed by a veteran imperial [navy|e] rich in [navy_tradition|e] and strong [maritime_presence|e], Roman merchant fleets turn the Black Sea and Eastern Mediterranean into a golden bridge of transcontinental [trade|e]."
 oe_msn_byz_10_silk_phoenix_link_req_tt:0 "Own or non-sovereign subject-own Kaffa or Candia, Age of Discovery or later, and either >= 12 Ports or Navy Tradition >= 20."
 oe_msn_byz_11_imperial_academy:0 "Imperial Academy & Classical Letters"
 oe_msn_byz_11_imperial_academy_desc:0 "Since Theodosius founded the Pandidakterion, scholarship has been the proudest jewel of the Roman state. Pairing Greek typography and modern [institutions|e] with imperial [buildings|e] of science raises [literacy|e] and accelerates state [advances|e], ensuring Constantinople shines not merely as an heirloom of antiquity but as a beacon of early modern enlightenment."
 oe_msn_byz_11_imperial_academy_req_tt:0 "Own Constantinople, Stability >= 20, Age of Reformation or later, and either embrace Printing Press or own a Printing Press Shop or University."
 oe_msn_byz_12_eternal_roman_destiny:0 "Eternal Rome: Modern Constitutional Empire"
 oe_msn_byz_12_eternal_roman_destiny_desc:0 "Five centuries after the brink of extinction, the purple banners of the Romans fly unchallenged from the Bosphorus to the Tiber. As a supreme [great_power|e] whose [capital|e] overflows with [development|e], [prestige|e], and constitutional [stability|e], Eternal Rome ascends to its modern destiny—ready to decide the final charter that will define the Empire for ages to come."
 oe_msn_byz_12_eternal_roman_destiny_req_tt:0 "Complete all three branches, own Constantinople, own or non-sovereign subject-own Rome, Stability >= 20, Age of Absolutism or later, Great Power status, and Capital Development >= 32."
 oe_msn_tur_destiny:0 "#bold #color_yellow Sublime Porte: Three-Continent Ottoman Destiny#!#!"
 oe_msn_tur_destiny_DESCRIPTION:0 "From Ghazi Beylik of Bursa to Three-Continent Empire"
 oe_msn_tur_destiny_CRITERIA_DESCRIPTION:0 "Unite Anatolia, claim the Straits and Danube, secure Cairo and the Holy Cities, and modernize the Porte."
 oe_msn_tur_destiny_BUTTON_TOOLTIP:0 "Embark on the Ottoman Destiny"
 oe_msn_tur_destiny_BUTTON_DETAILS:0 "Follow five centuries of Ottoman statecraft: cross from Bursa into Rumelia, forge Timar and Janissary institutions, master siege artillery, claim Cairo and the Two Holy Cities, and reform the late Porte."
 STATIC_MODIFIER_NAME_oe_msn_tur_m1:0 "Timar Cavalry & Imperial Divan"
 STATIC_MODIFIER_DESC_oe_msn_tur_m1:0 "Disciplined Timariot levies and Divan chancelleries sustain rapid mobilization and governance."
 STATIC_MODIFIER_NAME_oe_msn_tur_m2:0 "Danube to Nile Imperial Dominion"
 STATIC_MODIFIER_DESC_oe_msn_tur_m2:0 "Dominion spanning Belgrade, Constantinople, and Cairo crowns the Porte across three continents."
 STATIC_MODIFIER_NAME_oe_msn_tur_m3:0 "Dual-Sea Customs & Imperial Foundry"
 STATIC_MODIFIER_DESC_oe_msn_tur_m3:0 "Control of strait tolls and the Imperial Foundry fills the treasury while equipping siege batteries."
 STATIC_MODIFIER_NAME_oe_msn_tur_m4:0 "Sublime Empire of Three Continents"
 STATIC_MODIFIER_DESC_oe_msn_tur_m4:0 "A reformed, three-continent Sublime Porte commands both Mediterranean waters and continental armies."
 oe_msn_tur_01_bursa_ghazi:0 "Ghazi Foundations at Bursa"
 oe_msn_tur_01_bursa_ghazi_desc:0 "From the foothills of Mount Uludag, Bursa serves as the first true imperial seat of the House of Osman, where frontier gazis, Anatolian merchants, and ulema converge. Strengthening local [buildings|e], nurturing early [army_tradition|e], and anchoring dynastic [stability|e] transforms a border beylik into a disciplined [army|e] poised to cross the straits into Europe."
 oe_msn_tur_01_bursa_ghazi_req_tt:0 "Own Bursa, Stability >= 5, and either Army Tradition >= 12 or own a Castle or Marketplace."
 oe_msn_tur_02_timar_order:0 "Timariot Estates & Sipahi Host"
 oe_msn_tur_02_timar_order_desc:0 "The Timar land-grant registry binds provincial agrarian revenues directly to armored Sipahi cavalry service without bankrupting the Sultan's silver treasury. By maintaining cadastral [control|e] over newly won provinces and harmonizing military [estate_satisfaction|e], the Sublime Porte secures deep [manpower|e] reserves and a swift mounted [army|e] capable of campaigning on two fronts."
 oe_msn_tur_02_timar_order_req_tt:0 "Own Bursa, Stability >= 10, >= 18 Locations, and Nobles Estate Satisfaction >= 50% (45%+)."
 oe_msn_tur_03_imperial_divan:0 "Imperial Divan & Kanun Code"
 oe_msn_tur_03_imperial_divan_desc:0 "An empire spanning Muslims, Orthodox Christians, and diverse Anatolian tribes demands law above arbitrary custom. Codifying Sultanic Kanun edicts in the Imperial Divan, funding administrative [buildings|e], and organizing a skilled [cabinet|e] strengthens [crown_power|e] and [stability|e], establishing a durable bureaucratic framework respected from Rumelia to the Euphrates."
 oe_msn_tur_03_imperial_divan_req_tt:0 "Own Bursa, Treasury >= 250 Gold, Age of Renaissance or later, and either own a Madrasa/Counting House or Monthly Trade & Tax Income >= 25."
 oe_msn_tur_04_tophane_foundry:0 "Tophane Cannon Foundry & Guards"
 oe_msn_tur_04_tophane_foundry_desc:0 "Beneath the hills of Pera, the Imperial Tophane Foundry casts monumental bronze bombards and standardized field culverins for the Janissary corps. Combining state ordnance [buildings|e] with disciplined gunpowder [advances|e] elevates Ottoman [army_tradition|e] and battlefield dominance, rendering medieval castle walls obsolete before the Sultan's marching [army|e]."
 oe_msn_tur_04_tophane_foundry_req_tt:0 "Own Constantinople, Age of Discovery or later, and either own a Cannon Maker/Training Fields or Army Tradition >= 25."
 oe_msn_tur_05_city_worlds_desire:0 "City of the World's Desire"
 oe_msn_tur_05_city_worlds_desire_desc:0 "The conquest of Constantinople shatters the millennium-old frontier between Asia and Europe and crowns the Ottoman monarch Kayser-i Rum. Securing this peerless [capital|e] yields unmatched [prestige|e], anchors imperial [control|e] over the Straits, and ignites rapid [development|e], calling upon the Sultan to decree the foundational imperial order of Kostantiniyye."
 oe_msn_tur_05_city_worlds_desire_req_tt:0 "Own Constantinople."
 oe_msn_tur_06_rumelia_danube:0 "Danube Rampart: Sofia & Belgrade"
 oe_msn_tur_06_rumelia_danube_desc:0 "From the Via Militaris through Sofia to the river fortress of Belgrade, the Danube marks the grand highway into Central Europe. Establishing solid [core|e] holdings and frontier [fort|e] garrisons along this river rampart projects Ottoman [army_tradition|e] deep into the Pannonian basin while shielding Rumelian [prosperity|e] from northern counterattacks."
 oe_msn_tur_06_rumelia_danube_req_tt:0 "Own Sofia (Sredets) and Belgrade, and either Army Tradition >= 20 or >= 35 Locations."
 oe_msn_tur_07_anatolia_unity:0 "Mastery of Anatolia"
 oe_msn_tur_07_anatolia_unity_desc:0 "Uniting the rival beyliks of Karaman and central Anatolia under a single banner ends generations of fractured highland politics. Extending royal [control|e] and stone waystation [buildings|e] across Ankara and Konya secures the eastern silk highways, bolsters [manpower|e], and clears the strategic road southward into Syria and Egypt."
 oe_msn_tur_07_anatolia_unity_req_tt:0 "Own Ankara and Konya, and either Stability >= 10 or own a Caravanserai."
 oe_msn_tur_08_cairo_sanctuaries:0 "Cairo & Two Sanctuaries: Caliphate"
 oe_msn_tur_08_cairo_sanctuaries_desc:0 "Marching into Cairo and receiving the keys to Mecca and Medina elevates the Ottoman Sultan to Servant of the Two Holy Sanctuaries and preeminent Islamic [great_power|e]. Linking the grain wealth of the Nile with the Red Sea pilgrimage routes confers immense [prestige|e], [religious_influence|e], and [legitimacy|e] across three continents."
 oe_msn_tur_08_cairo_sanctuaries_req_tt:0 "Own Cairo, own or non-sovereign subject-own Mecca and Medina, and hold Great Power status."
 oe_msn_tur_09_strait_caravanserais:0 "Imperial Waystations & Strait Customs"
 oe_msn_tur_09_strait_caravanserais_desc:0 "Bridging the Black Sea, the Aegean, and the Persian caravan trails, Ottoman customs houses sit atop Eurasia's busiest tollgate. Constructing fortified road [buildings|e], protecting merchant guilds to raise [estate_satisfaction|e], and capturing transit [trade|e] fills imperial vaults with [gold|e] and sustains brisk urban [prosperity|e] along the Straits."
 oe_msn_tur_09_strait_caravanserais_req_tt:0 "Own Constantinople, Treasury >= 350 Gold, Monthly Trade & Tax Income >= 25, and own a Caravanserai or Marketplace."
 oe_msn_tur_10_mediterranean_navy:0 "Eastern Mediterranean Galley Fleet"
 oe_msn_tur_10_mediterranean_navy_desc:0 "Under captains forged in the Aegean and Barbary corsair wars, the Imperial Tersane turns out swift war galleys and heavy broadside ships to contest every sea lane. Expanding coastal shipyard [buildings|e] and seasoned [navy_tradition|e] projects overwhelming [maritime_presence|e], securing Levantine [trade|e] and transforming the Ottoman [navy|e] into the undisputed guardian of the Eastern Mediterranean."
 oe_msn_tur_10_mediterranean_navy_req_tt:0 "Own Smyrna or Alexandria, Age of Discovery or later, >= 14 Ports, and either Navy Tradition >= 20 or own a Dry Dock/Dock."
 oe_msn_tur_11_late_porte_reform:0 "Sublime Fiscal & Chancery Reform"
 oe_msn_tur_11_late_porte_reform_desc:0 "As silver inflation and tax-farming abuses test sprawling early modern states, Koprulu-style fiscal discipline becomes the lifeblood of imperial endurance. Embracing modern commercial [institutions|e], tightening state [control|e] over provincial customs [buildings|e], and curbing [inflation|e] revitalizes [literacy|e] and chancery efficiency across the entire Sublime Porte."
 oe_msn_tur_11_late_porte_reform_req_tt:0 "Own Constantinople, Stability >= 15, Age of Reformation or later, and either embrace Global Trade or own a Customs House/University."
 oe_msn_tur_12_three_continents:0 "Sublime Destiny Across Three Continents"
 oe_msn_tur_12_three_continents_desc:0 "Ruling over Europe, Asia, and Africa from the Golden Horn to the Red Sea, the Sublime Porte stands among the titans of the early modern world. With a thriving [capital|e] rich in [development|e], unshakable [stability|e], and global [prestige|e] as a foremost [great_power|e], the Sultan now convenes the grand imperial council to seal the Empire's enduring modern path."
 oe_msn_tur_12_three_continents_req_tt:0 "Complete all three branches, own Constantinople and Cairo, Stability >= 15, Age of Absolutism or later, Great Power status, and Capital Development >= 30."
 oe_msn_mam_destiny:0 "#bold #color_yellow Spice Sultanate: Mamluk Red Sea Destiny#!#!"
 oe_msn_mam_destiny_DESCRIPTION:0 "From Rawk Cadastre to Diu and Dual-Sea Supremacy"
 oe_msn_mam_destiny_CRITERIA_DESCRIPTION:0 "Reform Iqta estates, empower Karimi spice trade, build the Fifth Corps, and master the Red Sea."
 oe_msn_mam_destiny_BUTTON_TOOLTIP:0 "Embark on the Mamluk Destiny"
 oe_msn_mam_destiny_BUTTON_DETAILS:0 "Pairs with the Mamluk protagonist arc: renew the Rawk cadastre, balance Bahri and Burji politics, command the Karimi spice corridor, field the Fifth Corps, and link the Nile to the Red Sea."
 STATIC_MODIFIER_NAME_oe_msn_mam_m1:0 "Fifth Corps & Reformed Mamluks"
 STATIC_MODIFIER_DESC_oe_msn_mam_m1:0 "Blending Furusiyya cavalry with Fifth Corps arquebusiers breaks military stagnation."
 STATIC_MODIFIER_NAME_oe_msn_mam_m2:0 "Levant & Two Sanctuaries Bastion"
 STATIC_MODIFIER_DESC_oe_msn_mam_m2:0 "Commanding Syrian citadels and the Two Holy Sanctuaries secures the Arab heartland."
 STATIC_MODIFIER_NAME_oe_msn_mam_m3:0 "Karimi Spice Monopoly & Nile Granary"
 STATIC_MODIFIER_DESC_oe_msn_mam_m3:0 "Karimi spice ports and Nile granaries pour bullion and abundant grain into Cairo."
 STATIC_MODIFIER_NAME_oe_msn_mam_m4:0 "Dual-Sea Modern Nile Sultanate"
 STATIC_MODIFIER_DESC_oe_msn_mam_m4:0 "Suez canal navigation, reformed armies, and spice mastery secure a modern Mamluk superpower."
 oe_msn_mam_01_rawk_cadastre:0 "Renew the Rawk al-Nasiri Cadastre"
 oe_msn_mam_01_rawk_cadastre_desc:0 "Sultan al-Nasir Muhammad's great land survey rebalanced Egypt's agrarian tax base in favor of the royal fisc over grasping emirs. Renewing cadastral [control|e] across Cairo and Alexandria, expanding agrarian [buildings|e], and raising [capital|e] [development|e] strengthens [stability|e] while filling the Citadel treasury with reliable Nile [gold|e]."
 oe_msn_mam_01_rawk_cadastre_req_tt:0 "Own Cairo and Alexandria, Stability >= 5, Capital Development >= 18, and own a Granary or Marketplace."
 oe_msn_mam_02_bahri_burji_order:0 "Bahri & Burji Court Discipline"
 oe_msn_mam_02_bahri_burji_order_desc:0 "Factional coups between Kipchak Bahri barracks and Circassian Burji retainers long threatened to tear the Cairo Citadel apart from within. Enforcing strict barracks discipline, honoring loyal military [estates|e], and elevating [army_tradition|e] secures uncontested [legitimacy|e] and forges a united Mamluk [army|e] capable of deterring northern rivals."
 oe_msn_mam_02_bahri_burji_order_req_tt:0 "Own Cairo, Stability >= 12, and either Army Tradition >= 15 or own a Castle or Madrasa."
 oe_msn_mam_03_fifth_corps_firearms:0 "Commission the Fifth Corps"
 oe_msn_mam_03_fifth_corps_firearms_desc:0 "Proud heavy lancers once disdained black powder as an unchivalrous weapon, yet the clash of early modern empires punishes military nostalgia. Commissioning the salaried Fifth Corps armed with matchlocks, field guns, and modern [advances|e] transforms Mamluk [army_tradition|e] and [regulars|e], giving Cairo the firepower to match any rival across Syria and the Indian Ocean."
 oe_msn_mam_03_fifth_corps_firearms_req_tt:0 "Own Cairo, Treasury >= 250 Gold, Age of Discovery or later, and either Gunpowder/Pike & Shot advance or own a Cannon Maker/Training Fields."
 oe_msn_mam_04_abolish_iqta_farming:0 "Replace Iqta Farming with Salaries"
 oe_msn_mam_04_abolish_iqta_farming_desc:0 "Fragmented iqta tax assignments drained the Sultanate whenever provincial emirs withheld grain and silver in times of crisis. Replacing feudal revenue farms with central payrolls—or integrating loyal Niyabat [subjects|e] into an accountable [cabinet|e]—transforms imperial [control|e] and [crown_power|e], forcing Cairo to choose its permanent fiscal architecture."
 oe_msn_mam_04_abolish_iqta_farming_req_tt:0 "Own Cairo, Age of Reformation or later, >= 35 Locations, and either govern a Niyabat/Sharifate subject or Monthly Trade & Tax Income >= 40."
 oe_msn_mam_05_levant_citadels:0 "Syrian Bulwarks: Damascus & Aleppo"
 oe_msn_mam_05_levant_citadels_desc:0 "Damascus and Aleppo form the twin northern shields of the Sultanate, guarding the caravan highways from Mesopotamia and the passes out of Anatolia. Fortifying their stone [fort|e] citadels directly or through Syrian Niyabat [subjects|e] secures vital [core|e] frontiers, safeguards Levantine silk [trade|e], and projects Cairo's authority to the Euphrates."
 oe_msn_mam_05_levant_citadels_req_tt:0 "Own or non-sovereign subject-own Damascus and Aleppo, and either hold a Niyabat subject or own a Castle."
 oe_msn_mam_06_hejaz_sanctuaries:0 "Guardian of the Two Sanctuaries"
 oe_msn_mam_06_hejaz_sanctuaries_desc:0 "Every year the Mahmal caravan departs Cairo bearing grain, gold, and the embroidered Kiswa for the Two Holy Mosques while Red Sea vessels unload spices at Jeddah. Guaranteeing the protection of Mecca, Medina, and their Sharifate [subjects|e] elevates the Sultan's [religious_influence|e], [prestige|e], and clerical [estate_satisfaction|e] across the entire Islamic world."
 oe_msn_mam_06_hejaz_sanctuaries_req_tt:0 "Own or non-sovereign subject-own Jeddah, Mecca, and Medina."
 oe_msn_mam_07_aden_red_sea_gate:0 "Key to the Bab-el-Mandeb: Aden"
 oe_msn_mam_07_aden_red_sea_gate_desc:0 "Set within the volcanic rim guarding the Bab-el-Mandeb, Aden is the iron padlock of the Red Sea and the gateway to Gujarat and Malabar. Anchoring Mamluk [maritime_presence|e] and [navy|e] stations at Aden blocks hostile European blockades, protects Muslim spice [trade|e], and turns the Red Sea into a secure imperial lake."
 oe_msn_mam_07_aden_red_sea_gate_req_tt:0 "Own or non-sovereign subject-own Aden, and either >= 10 Ports or Navy Tradition >= 15."
 oe_msn_mam_08_diu_indian_ocean:0 "Suez Shipyard & Indian Ocean Armada"
 oe_msn_mam_08_diu_indian_ocean_desc:0 "Importing Anatolian timber across the desert to Suez, Mamluk admirals build ocean-going cannon galleys and carracks to contest the monsoon seas. Mastering naval dockyard [buildings|e] and seasoned [navy_tradition|e] empowers the Sultan's [navy|e] to break Atlantic encirclement, keeping the ancient Indian Ocean spice [trade|e] flowing through Egyptian ports."
 oe_msn_mam_08_diu_indian_ocean_req_tt:0 "Own Suez, own or non-sovereign subject-own Aden, Age of Discovery or later, and either Navy Tradition >= 25 or own a Dry Dock/Shipyard."
 oe_msn_mam_09_karimi_funduqs:0 "Karimi Guild & Balanced Spice Customs"
 oe_msn_mam_09_karimi_funduqs_desc:0 "Heavy-handed royal monopolies once drove the fabled Karimi spice syndicates to ruin and starved Alexandria of Venetian ducats. By partnering with wealthy merchant houses, honoring burgher [estate_satisfaction|e], and fostering vibrant [market|e] exchanges, Cairo secures booming [trade|e] customs and lasting [gold|e] liquidity without stifling private enterprise."
 oe_msn_mam_09_karimi_funduqs_req_tt:0 "Own Cairo and Alexandria, Treasury >= 350 Gold, Monthly Trade & Tax Income >= 25, and Burghers Satisfaction >= 50%."
 oe_msn_mam_10_shuna_nile_granary:0 "Nile Barrages & Shuna Granaries"
 oe_msn_mam_10_shuna_nile_granary_desc:0 "Every pulse of the Nilometer dictates feast or famine across the Delta. Investing in stone dams, irrigation [buildings|e], and imperial Shuna granaries across Cairo, Alexandria, and Damietta cushions Egypt against low floods, accelerates urban [development|e] and [prosperity|e], and turns surplus grain into a potent instrument of Mediterranean [diplomacy|e]."
 oe_msn_mam_10_shuna_nile_granary_req_tt:0 "Own Cairo, Alexandria, and Damietta, and own a Granary or Aqueduct System."
 oe_msn_mam_11_trajan_suez_canal:0 "Dredge the Trajan–Suez Canal"
 oe_msn_mam_11_trajan_suez_canal_desc:0 "Pharaohs, Emperors, and Caliphs alike dreamed of uniting the Nile and the Red Sea by a navigable ship canal. Harnessing early modern engineering [institutions|e] and port [buildings|e] to dredge the Trajan-Suez waterway halves the voyage between Europe and India, bringing unparalleled [trade|e] dominance, naval mobility, and [prestige|e] to Egypt."
 oe_msn_mam_11_trajan_suez_canal_req_tt:0 "Own Suez, Cairo, and Alexandria, Age of Reformation or later, and either embrace Global Trade or own a Port Authority/Customs House."
 oe_msn_mam_12_dual_sea_sultanate:0 "Dual-Sea Modern Mamluk Sultanate"
 oe_msn_mam_12_dual_sea_sultanate_desc:0 "Defying history's verdict, the Mamluk Sultanate has mastered gunpowder warfare, oceanic navigation, and the Suez waterway to command both the Mediterranean and the Indian Ocean. As a peerless [great_power|e] anchored by Cairo's soaring [development|e], unbroken [stability|e], and towering [prestige|e], the Dual-Sea Sultanate now proclaims its eternal modern settlement."
 oe_msn_mam_12_dual_sea_sultanate_req_tt:0 "Complete all three branches, own Cairo and Alexandria, own or non-sovereign subject-own Aden, Stability >= 15, Age of Absolutism or later, Great Power status, and Capital Development >= 30."
 oe_msn_ven_destiny:0 "#bold #color_yellow Serenissima: Venetian Stato da Mar Destiny#!#!"
 oe_msn_ven_destiny_DESCRIPTION:0 "From the Lagoon Arsenale to Mediterranean Sea Mastery"
 oe_msn_ven_destiny_CRITERIA_DESCRIPTION:0 "Win the Adriatic, scale the Arsenale galleass line, secure Stato da Mar, and modernize the Republic."
 oe_msn_ven_destiny_BUTTON_TOOLTIP:0 "Embark on the Venetian Destiny"
 oe_msn_ven_destiny_BUTTON_DETAILS:0 "Pairs with the Maritime Republics arc: fortify the lagoon with the Council of Ten and Lazzaretti, launch Arsenale galleasses, hold Stato da Mar from Zara to Cyprus, and reform the Golden Book."
 STATIC_MODIFIER_NAME_oe_msn_ven_m1:0 "Council of Ten & Arsenale Line"
 STATIC_MODIFIER_DESC_oe_msn_ven_m1:0 "Disciplined security and standardized Arsenale slipways turn out warships at unmatched speed."
 STATIC_MODIFIER_NAME_oe_msn_ven_m2:0 "Stato da Mar Island Chain"
 STATIC_MODIFIER_DESC_oe_msn_ven_m2:0 "Corfu, Crete, and Cyprus forge an unbroken maritime fortress chain across the Eastern Mediterranean."
 STATIC_MODIFIER_NAME_oe_msn_ven_m3:0 "Lazzaretti, Printing & Murano Crafts"
 STATIC_MODIFIER_DESC_oe_msn_ven_m3:0 "Quarantine harbors, Aldine printing houses, and Murano artisans anchor civic wealth."
 STATIC_MODIFIER_NAME_oe_msn_ven_m4:0 "Immortal Serenissima Maritime Federation"
 STATIC_MODIFIER_DESC_oe_msn_ven_m4:0 "With an opened Libro d'Oro and invincible fleets, La Serenissima endures into the modern age."
 oe_msn_ven_01_lagoon_adriatic:0 "Lagoon Fortress & Zara Gateway"
 oe_msn_ven_01_lagoon_adriatic_desc:0 "Behind mudflats and timber palisades, the Venetian [capital|e] anchors its [navy|e] across the Adriatic shore at Zara. Timber quays and patrol galleys lock the gulf into a Venetian lake, turning Dalmatian coves into shields for our [trade|e] and [maritime_presence|e]."
 oe_msn_ven_01_lagoon_adriatic_req_tt:0 "Own Venice, control Zara (directly or via subject), have at least 5 Stability, a port, and a Wharf."
 oe_msn_ven_02_council_of_ten:0 "Council of Ten & Civic Security"
 oe_msn_ven_02_council_of_ten_desc:0 "Since the Tiepolo conspiracy, the Council of Ten has watched every canal and palazzo to spare the Serenissima from signorial tyranny. Vigilant [cabinet|e] inquiries balance patrician ambition against [estate_satisfaction|e], preserving civic [stability|e] and urban [development|e]."
 oe_msn_ven_02_council_of_ten_req_tt:0 "Own Venice, have at least 12 Stability, 50% Burghers Satisfaction, and at least 22 Capital Development."
 oe_msn_ven_03_arsenale_galleass:0 "Arsenale Assembly & War-Galleasses"
 oe_msn_ven_03_arsenale_galleass_desc:0 "Inside the walled Arsenale, master arsenalotti fit standardized ribs, ropes, and bronze ordnance along a moving slipway. Heavy war-galleasses roll out in days, turning republican [gold|e] and [buildings|e] into unmatched [navy_tradition|e] and [sailors|e] readiness."
 oe_msn_ven_03_arsenale_galleass_req_tt:0 "Own Venice in the Age of Discovery or later, hold at least 250 Gold, 25 Navy Tradition, and a Dock or Dry Dock."
 oe_msn_ven_04_libro_doro_reform:0 "Open the Libro d'Oro & Naval Doctrine"
 oe_msn_ven_04_libro_doro_reform_desc:0 "Opening the Golden Book to wealthy Terraferma lineages and oceanic captains refreshes an aging patriciate without surrendering republican law. Embracing new [institutions|e] unites the [estates|e] behind modernized [parliament|e] votes and enduring [prestige|e]."
 oe_msn_ven_04_libro_doro_reform_req_tt:0 "Own Venice in the Age of Reformation or later, have 15 Stability, 50% Nobles Satisfaction, and embrace Global Trade."
 oe_msn_ven_05_ionian_corfu:0 "Ionian Watch: Corfu & Adriatic Rim"
 oe_msn_ven_05_ionian_corfu_desc:0 "Standing sentinel at the Strait of Otranto, Corfu bars rival armadas from raiding the Adriatic heartland. Reinforcing its rocky [fort|e] secures a loyal [core|e] along the Ionian sea lane, projecting our [maritime_presence|e] and [control|e] eastward."
 oe_msn_ven_05_ionian_corfu_req_tt:0 "Control Corfu (directly or via subject) and hold at least 4 ports."
 oe_msn_ven_06_candia_crete:0 "Kingdom of Candia: Crete Stronghold"
 oe_msn_ven_06_candia_crete_desc:0 "The Kingdom of Candia crowns the Stato da Mar, exporting Malmsey wine while sheltering our Levant convoys beneath towering seawalls. Anchoring this Cretan [core|e] behind a stone [fort|e] deepens island [prosperity|e] and steadies eastern [navy|e] logistics."
 oe_msn_ven_06_candia_crete_req_tt:0 "Control Candia (directly or via subject) and own at least one Castle."
 oe_msn_ven_07_cyprus_sugar_isle:0 "Jewel of Cyprus: Nicosia & Famagusta"
 oe_msn_ven_07_cyprus_sugar_isle_desc:0 "From Famagusta's bastioned harbor to Nicosia's fertile plain, Cyprus commands the sea lanes between Anatolia, Syria, and Alexandria. Turning its sugar and cotton harvests into Venetian [trade|e] swells our [gold|e], strengthens [navy_tradition|e], and affirms a vital [core|e]."
 oe_msn_ven_07_cyprus_sugar_isle_req_tt:0 "Control Nicosia or Famagusta (directly or via subject) and have at least 15 Navy Tradition."
 oe_msn_ven_08_terraferma_shield:0 "Stato di Terraferma: Lombard Shield"
 oe_msn_ven_08_terraferma_shield_desc:0 "Relying solely on sea grain left the lagoon hostage to mainland sieges; securing the Lombard plain gives Venice food, river roads, and alpine watchtowers. Condottieri banners build [army_tradition|e] while provincial [control|e] feeds our [market|e] and [manpower|e]."
 oe_msn_ven_08_terraferma_shield_req_tt:0 "Own Venice or control Milan (directly or via subject), hold at least 20 locations, and own a Guild Hall."
 oe_msn_ven_09_lazzaretto_quarantine:0 "Lazzaretti Quarantine & Health Board"
 oe_msn_ven_09_lazzaretto_quarantine_desc:0 "First in Europe to isolate incoming crews for forty days on the Lazzaretto Vecchio and Nuovo, Venice turned contagion control into civic science. Sanitary [buildings|e] safeguard urban [prosperity|e], steady merchant [stability|e], and sustain high [development|e] along the Grand Canal."
 oe_msn_ven_09_lazzaretto_quarantine_req_tt:0 "Own Venice in the Age of Renaissance or later, own a Hospital, and have at least 25 Capital Development."
 oe_msn_ven_10_levant_spice_accord:0 "Levant Spice Convoys & Alexandria Pact"
 oe_msn_ven_10_levant_spice_accord_desc:0 "Even as ocean caravels round Africa, Venetian mude convoys still bargain for pepper, silk, and alum in Alexandria and Aleppo under consular charters. Disciplined [diplomacy|e] keeps eastern wares flowing into the Rialto [market|e], enriching our [trade|e] and filling the [gold|e] vaults."
 oe_msn_ven_10_levant_spice_accord_req_tt:0 "Own Venice, control Candia, hold 400 Gold, earn 25 monthly trade & tax income, and own a Marketplace."
 oe_msn_ven_11_aldine_printing:0 "Venetian Printing & Enlightenment Press"
 oe_msn_ven_11_aldine_printing_desc:0 "Aldus Manutius forged italic type and pocket classics beside Murano glassmakers and Titian's workshops, making Venice the publishing capital of Europe. Thriving presses spread [literacy|e] and [institutions|e], elevating republican [cultural_tradition|e] alongside urban [prosperity|e]."
 oe_msn_ven_11_aldine_printing_req_tt:0 "Own Venice in the Age of Reformation or later, have 15 Stability, a Printing Press Shop, and embrace Printing Press."
 oe_msn_ven_12_immortal_serenissima:0 "Defy Campo Formio: Maritime Federation"
 oe_msn_ven_12_immortal_serenissima_desc:0 "No Campo Formio shall strike down the Winged Lion while Venice welds its Adriatic islands, Lombard cities, and merchant fleets into a federated maritime commonwealth. Standing as a [great_power|e], the republic unites [trade|e], [navy|e] mastery, and [diplomatic_reputation|e] across the Mediterranean."
 oe_msn_ven_12_immortal_serenissima_req_tt:0 "Own Venice and control Candia in the Age of Absolutism or later, have 18 Stability, a Shipyard or Stock Exchange, and be a Great Power or earn 70 monthly income."
 oe_msn_gen_destiny:0 "#bold #color_yellow House of Saint George: Genoese Financial Destiny#!#!"
 oe_msn_gen_destiny_DESCRIPTION:0 "From Black Sea Gazaria to the Century of the Genoese"
 oe_msn_gen_destiny_CRITERIA_DESCRIPTION:0 "Found the Bank of Saint George, hold Gazaria, lead Piacenza clearing, and forge a maritime credit republic."
 oe_msn_gen_destiny_BUTTON_TOOLTIP:0 "Embark on the Genoese Destiny"
 oe_msn_gen_destiny_BUTTON_DETAILS:0 "Pairs with the Maritime Republics and Eurasian Economy 2.0: anchor Liguria, charter the Bank of Saint George (1407), defend Kaffa and Chios, and command the Piacenza silver fairs."
 STATIC_MODIFIER_NAME_oe_msn_gen_m1:0 "Casa di San Giorgio Sovereign Credit"
 STATIC_MODIFIER_DESC_oe_msn_gen_m1:0 "Joint-stock public banking gives Genoa Europe's finest interest spreads and deep loan capacity."
 STATIC_MODIFIER_NAME_oe_msn_gen_m2:0 "Gazaria & Aegean Commercial Chain"
 STATIC_MODIFIER_DESC_oe_msn_gen_m2:0 "Kaffa and Chios funnel Black Sea grain, silk, and mastic wealth straight to Genoa."
 STATIC_MODIFIER_NAME_oe_msn_gen_m3:0 "Piacenza Fairs & Silver Asientos"
 STATIC_MODIFIER_DESC_oe_msn_gen_m3:0 "Genoese clearing houses direct European bullion settlements through offshore exchange fairs."
 STATIC_MODIFIER_NAME_oe_msn_gen_m4:0 "Century of the Genoese: Maritime Credit"
 STATIC_MODIFIER_DESC_oe_msn_gen_m4:0 "Merging convoy protection, public banking, and civic reform turns Genoa into an enduring financial superpower."
 oe_msn_gen_01_ligurian_superba:0 "La Superba: Anchor Genoa"
 oe_msn_gen_01_ligurian_superba_desc:0 "Pressed between the Apennine ridge and the Ligurian Sea, La Superba lives by its stone mole, lantern lighthouse, and daring merchant captains. Expanding our [capital|e] waterfront channels Mediterranean [trade|e] into solid [gold|e] while anchoring coastal [maritime_presence|e]."
 oe_msn_gen_01_ligurian_superba_req_tt:0 "Own Genoa, have at least 5 Stability, a port, and a Wharf."
 oe_msn_gen_02_casa_san_giorgio:0 "Charter the Bank of Saint George"
 oe_msn_gen_02_casa_san_giorgio_desc:0 "Founded in 1407 to consolidate public compere debts, the Casa di San Giorgio evolved into Europe's most formidable credit bank and colonial custodian. Embracing [institutions|e] curbs [inflation|e], deepens [estate_satisfaction|e], and turns Genoese [buildings|e] into vaults of sovereign credit."
 oe_msn_gen_02_casa_san_giorgio_req_tt:0 "Own Genoa in the Age of Renaissance or later, hold 250 Gold, own a Counting House, and embrace Banking."
 oe_msn_gen_03_pavise_mercenary_guard:0 "Pavise Guards & Escort Carracks"
 oe_msn_gen_03_pavise_mercenary_guard_desc:0 "From famous pavise crossbowmen to broad-beamed escort carracks bristling with swivels, Genoa protects high-value bullion cargoes by steel and discipline. Drilling shipboard [regulars|e] elevates [navy_tradition|e] and [army_tradition|e] while safeguarding our [sailors|e] on contested sea lanes."
 oe_msn_gen_03_pavise_mercenary_guard_req_tt:0 "Own Genoa in the Age of Discovery or later, have 22 Navy Tradition, and own a Dry Dock or Armory."
 oe_msn_gen_04_andrea_doria_charter:0 "Civic Charter & Oligarchic Union"
 oe_msn_gen_04_andrea_doria_charter_desc:0 "Andrea Doria's 1528 reform merged warring old and new lineages into twenty-eight alberghi, ending generations of factional street battles and foreign protectorates. Balanced [estates|e] and steady [cabinet|e] rotations secure lasting [stability|e] and international [prestige|e]."
 oe_msn_gen_04_andrea_doria_charter_req_tt:0 "Own Genoa in the Age of Reformation or later, have 15 Stability, 50% Nobles Satisfaction, and 55% Burghers Satisfaction."
 oe_msn_gen_05_chios_maona:0 "Maona of Chios & Aegean Hub"
 oe_msn_gen_05_chios_maona_desc:0 "Chartered by shareholder consortia known as the Maona, Chios turns Aegean mastic resin and Phocaean alum into steady dividends for Ligurian investors. Integrating this island [core|e] strengthens our eastern [trade|e], swells the [gold|e] ledger, and extends naval [maritime_presence|e]."
 oe_msn_gen_05_chios_maona_req_tt:0 "Control Chios or Kaffa (directly or via subject) and hold at least 3 ports."
 oe_msn_gen_06_gazaria_kaffa:0 "Hold Gazaria: Bastion of Kaffa"
 oe_msn_gen_06_gazaria_kaffa_desc:0 "Rising on the Crimean coast, double-walled Kaffa anchors Gazaria and links steppe caravans from Astrakhan and Tana directly to Genoese galleys. Fortifying this Black Sea [core|e] behind a stout [fort|e] protects northern [prosperity|e] and eastern [control|e]."
 oe_msn_gen_06_gazaria_kaffa_req_tt:0 "Control Kaffa (directly or via subject) and own at least one Castle."
 oe_msn_gen_07_western_med_nodes:0 "Western Mediterranean Entrepots"
 oe_msn_gen_07_western_med_nodes_desc:0 "From Corsican watchtowers to Tyrrhenian coral harbors and Iberian merchant quarters, a chain of western anchorages insulates Genoa against eastern blockades. Controlling these coastal hubs amplifies our [navy|e] reach, boosts [navy_tradition|e], and deepens western [market|e] [trade|e]."
 oe_msn_gen_07_western_med_nodes_req_tt:0 "Own Genoa, hold at least 15 locations, and control at least 6 ports."
 oe_msn_gen_08_italian_balance:0 "Italian Balance: Rivaling Venice & Milan"
 oe_msn_gen_08_italian_balance_desc:0 "Wedged between Milanese condottieri, Venetian armadas, and French kings, Genoa survives only when diplomacy and wealth command equal fear across northern Italy. Rising urban [development|e] and deft [diplomacy|e] uphold our [prestige|e] while keeping our [army|e] ready behind Ligurian passes."
 oe_msn_gen_08_italian_balance_req_tt:0 "Own Genoa or control Milan, hold at least 22 locations, and have at least 24 Capital Development."
 oe_msn_gen_09_black_sea_grain_bills:0 "Black Sea Grain & Marine Insurance"
 oe_msn_gen_09_black_sea_grain_bills_desc:0 "Genoese notaries drafted the earliest standalone marine insurance contracts, pooling risk on Black Sea grain hulls and silk galleys against tempests and corsairs. Liquid [market|e] instruments stabilize [trade|e], enrich our [gold|e] reserves, and multiply harbor [prosperity|e]."
 oe_msn_gen_09_black_sea_grain_bills_req_tt:0 "Own Genoa, hold 350 Gold, earn at least 22 monthly trade & tax income, and own a Marketplace."
 oe_msn_gen_10_piacenza_asientos:0 "Piacenza Fairs & Silver Asientos"
 oe_msn_gen_10_piacenza_asientos_desc:0 "At the quarterly Piacenza exchange fairs, Genoese bankers convert New World silver into bills payable in Antwerp, Naples, and Madrid on a single ledger stroke. Mastering royal asientos directs continent-wide [gold|e] flows, lifts [diplomatic_reputation|e], and rewards [estates|e] and [trade|e] alike."
 oe_msn_gen_10_piacenza_asientos_req_tt:0 "Own Genoa in the Age of Reformation or later, hold 500 Gold, earn 40 monthly income, and own a Customs House."
 oe_msn_gen_11_sovereign_clearing_crown:0 "Offshore Sovereign Clearing Capital"
 oe_msn_gen_11_sovereign_clearing_crown_desc:0 "Along the marble palaces of the Strada Nuova, clearinghouses settle sovereign loans and maritime freights from Lisbon to Constantinople in Genoese scudi. Embracing [institutions|e] keeps [inflation|e] tame while fueling monumental [capital|e] [development|e] and financial authority."
 oe_msn_gen_11_sovereign_clearing_crown_req_tt:0 "Own Genoa in the Age of Reformation or later, have 15 Stability, 30 Capital Development, and embrace Global Trade."
 oe_msn_gen_12_maritime_credit_republic:0 "Maritime Financial Federation"
 oe_msn_gen_12_maritime_credit_republic_desc:0 "Binding bank ledgers, overseas maone, and armed merchantmen under one constitutional charter, Genoa enters the modern era as an unassailable financial federation. Recognized as a [great_power|e], the republic fuses [gold|e], [trade|e], and [navy|e] power into a lasting Mediterranean order."
 oe_msn_gen_12_maritime_credit_republic_req_tt:0 "Own Genoa in the Age of Absolutism or later, have 18 Stability, a Stock Exchange or Shipyard, and be a Great Power or earn 70 monthly income."
 oe_msn_rus_destiny:0 "#bold #color_yellow Third Rome: Eurasian Russian Destiny#!#!"
 oe_msn_rus_destiny_DESCRIPTION:0 "From Gathering the Rus Lands to Neva and Siberia"
 oe_msn_rus_destiny_CRITERIA_DESCRIPTION:0 "Gather the Rus lands, end the steppe yoke, reach the Baltic and Siberia, and modernize the Empire."
 oe_msn_rus_destiny_BUTTON_TOOLTIP:0 "Embark on the Russian Destiny"
 oe_msn_rus_destiny_BUTTON_DETAILS:0 "Unite Rus from Moscow to Novgorod, break the Tatar yoke at Kazan and Astrakhan, cross Siberia to Irkutsk, open the Window on the Neva, and modernize the imperial army."
 STATIC_MODIFIER_NAME_oe_msn_rus_m1:0 "Streltsy & New Order Regiments"
 STATIC_MODIFIER_DESC_oe_msn_rus_m1:0 "Standing musketeer corps and royal artillery yards forge a premier continental army."
 STATIC_MODIFIER_NAME_oe_msn_rus_m2:0 "Volga, Siberia & Neva Dominion"
 STATIC_MODIFIER_DESC_oe_msn_rus_m2:0 "Imperial dominion stretching from the Neva to Lake Baikal spans northern Eurasia."
 STATIC_MODIFIER_NAME_oe_msn_rus_m3:0 "Kyakhta Fur Trade & Ural Metallurgy"
 STATIC_MODIFIER_DESC_oe_msn_rus_m3:0 "Siberian sable furs, Kyakhta trade, and Ural foundries enrich the imperial fisc."
 STATIC_MODIFIER_NAME_oe_msn_rus_m4:0 "Modern All-Russian Imperial Destiny"
 STATIC_MODIFIER_DESC_oe_msn_rus_m4:0 "Blending Orthodox majesty with early modern military and industrial power, Russia stands supreme."
 oe_msn_rus_01_gather_rus:0 "Gather the Rus: Moscow & Novgorod"
 oe_msn_rus_01_gather_rus_desc:0 "Uniting the Grand Principality of Moscow with the vast northern fur forests of Novgorod transforms a fragmented river duchy into the undisputed hearth of All Rus. Securing Novgorod as an integral [core|e], strengthening urban [buildings|e], and fostering [capital|e] [development|e] steadies [stability|e] and prepares the northern forest realms to cast off steppe overlordship."
 oe_msn_rus_01_gather_rus_req_tt:0 "Own Moscow and Novgorod, Stability >= 5, and either Capital Development >= 16 or own a Marketplace/Castle."
 oe_msn_rus_02_third_rome_patriarch:0 "Moscow Patriarchate & Tsardom"
 oe_msn_rus_02_third_rome_patriarch_desc:0 "As the grand domes of the Kremlin rise above the Moskva, the elevation of the Moscow Patriarchate crowns the Tsar as supreme defender of Eastern Orthodoxy. Endowing sacred [buildings|e] and nurturing clerical [estate_satisfaction|e] cements sovereign [legitimacy|e] and [religious_influence|e], giving the rising Russian state an unshakable spiritual banner."
 oe_msn_rus_02_third_rome_patriarch_req_tt:0 "Own Moscow, Stability >= 12, and either own a Cathedral/Monastery or Clergy Satisfaction >= 55%."
 oe_msn_rus_03_artillery_yard:0 "Pushkarsky Dvor & Standing Guards"
 oe_msn_rus_03_artillery_yard_desc:0 "At Moscow's Pushkarsky Dvor, master bronze-casters forge heavy siege guns and mobile field batteries while salaried Streltsy drill with arquebus and bardiche. Expanding ordnance [buildings|e] and adopting gunpowder [advances|e] elevates Russian [army_tradition|e], giving the Tsardom's [army|e] decisive firepower to shatter both steppe horse arches and western bastions."
 oe_msn_rus_03_artillery_yard_req_tt:0 "Own Moscow, Treasury >= 250 Gold, Age of Discovery or later, and either own a Cannon Maker/Armory or Army Tradition >= 22."
 oe_msn_rus_04_new_order_guard:0 "Imperial Guards & Table of Ranks"
 oe_msn_rus_04_new_order_guard_desc:0 "Modernizing Russia's vast domain pits service autocracy against the ancient assemblies of boyars, clergy, and provincial townsmen. Drilling new-formation [regulars|e] inside upgraded military [buildings|e] boosts [army_tradition|e] and [crown_power|e], bringing the Tsardom to a decisive reckoning between Oprichnina absolutism, the Zemsky Sobor, and a meritocratic Table of Ranks."
 oe_msn_rus_04_new_order_guard_req_tt:0 "Own Moscow, Age of Reformation or later, >= 45 Locations, and either Army Tradition >= 28 or own a Barracks/Bastion."
 oe_msn_rus_05_volga_kazan:0 "Break the Yoke: Take Kazan"
 oe_msn_rus_05_volga_kazan_desc:0 "Storming the fortified river bluff of Kazan breaks centuries of Tatar raids across the upper Volga and throws open the eastern horizon. Integrating Kazan as a staunch [core|e] extends Muscovite [control|e] down the Volga waterway, bolsters [prestige|e], and clears the vital staging ground for both Caspian trade and Siberian conquest."
 oe_msn_rus_05_volga_kazan_req_tt:0 "Own Kazan."
 oe_msn_rus_06_astrakhan_caspian:0 "Reach the Caspian: Astrakhan"
 oe_msn_rus_06_astrakhan_caspian_desc:0 "With Astrakhan firmly in Russian hands, the entire course of the Volga—from Valdai forests to the Caspian Sea—belongs to a single sovereign. Establishing a fortified [core|e] at the delta unlocks Persian silk and Bukharan caravan [trade|e], multiplying customs [gold|e] and elevating imperial [prosperity|e] along the great river artery."
 oe_msn_rus_06_astrakhan_caspian_req_tt:0 "Own Astrakhan, and either >= 40 Locations or Monthly Trade & Tax Income >= 25."
 oe_msn_rus_07_siberia_eastward:0 "Across the Urals: Tobolsk & Irkutsk"
 oe_msn_rus_07_siberia_eastward_desc:0 "Crossing the Ural stone belt by river portage and timber ostrog, Cossack pioneers carry the double-headed eagle toward Tobolsk and Lake Baikal. Turning Siberian river forts into secure [core|e] outposts while rewarding frontier [estates|e] unleashes sable fur [trade|e] and stretches Russian [control|e] across the breadth of northern Asia."
 oe_msn_rus_07_siberia_eastward_req_tt:0 "Own Tobolsk or Irkutsk, and either >= 50 Locations or >= 2 Subjects."
 oe_msn_rus_08_window_on_neva:0 "Window on Europe: Neva Outlet"
 oe_msn_rus_08_window_on_neva_desc:0 "Rising from the marshy islands where the Neva meets the Gulf of Finland, Russia's Baltic bastion cuts a bold window straight toward Western Europe. Forging a permanent maritime [core|e] and modern Baltic [navy|e] cultivates [navy_tradition|e], expands oceanic [trade|e], and announces Russia's arrival as a northern naval power."
 oe_msn_rus_08_window_on_neva_req_tt:0 "Own Neva (St. Petersburg), and either >= 6 Ports or Navy Tradition >= 15."
 oe_msn_rus_09_white_stone_tax:0 "Skilled Tax Collectors & Northern Trade"
 oe_msn_rus_09_white_stone_tax_desc:0 "Turning sprawling forest territories into a solvent empire requires disciplined fiscal offices and secure northern trade depots. Building modern accounting [buildings|e], curbing local corruption to enhance [control|e], and backing urban merchants fills the Kremlin treasury with [gold|e] while driving steady [prosperity|e] across Muscovite towns."
 oe_msn_rus_09_white_stone_tax_req_tt:0 "Own Moscow, Treasury >= 300 Gold, Monthly Trade & Tax Income >= 22, and own a Counting House or Marketplace."
 oe_msn_rus_10_kyakhta_fur_tea:0 "Kyakhta Fur & Tea Caravan Trade"
 oe_msn_rus_10_kyakhta_fur_tea_desc:0 "Caravans laden with Siberian sable and silver fox march south and east to exchange pelts for fine Chinese tea, silk, and rhubarb along the northern frontier. Anchoring continental exchange [buildings|e] unlocks a booming trans-Asian [market|e] and reliable customs [gold|e], enriching Russia's eastern [trade|e] network from Tobolsk to Moscow."
 oe_msn_rus_10_kyakhta_fur_tea_req_tt:0 "Own Kazan or Tobolsk, Age of Discovery or later, and either Monthly Trade & Tax Income >= 32 or own Merchants Quarters/Trading Hub."
 oe_msn_rus_11_moscow_university:0 "Imperial Academy & Ural Ironworks"
 oe_msn_rus_11_moscow_university_desc:0 "Pairing Lomonosov's academy of sciences with the roaring blast furnaces of the Ural ironworks lifts Russia into the vanguard of early modern industry. Embracing scientific [institutions|e] and erecting university and foundry [buildings|e] elevates [literacy|e] and accelerates [advances|e], equipping the Empire with home-forged steel, maps, and scholars."
 oe_msn_rus_11_moscow_university_req_tt:0 "Own Moscow, Stability >= 15, Age of Reformation or later, and either embrace Printing Press or own a University/Iron Foundry."
 oe_msn_rus_12_all_russian_empire:0 "Eurasian Colossus: Modern Russian Empire"
 oe_msn_rus_12_all_russian_empire_desc:0 "Stretching from the Baltic waves of the Neva to the Caspian delta and the Siberian taiga, All Russia stands transformed into a Eurasian colossus. Crowned as a premier [great_power|e] backed by soaring [capital|e] [development|e], iron [stability|e], and global [prestige|e], the Imperator now proclaims the defining imperial doctrine of the modern Russian age."
 oe_msn_rus_12_all_russian_empire_req_tt:0 "Complete all three branches, own Moscow, Astrakhan, and Neva, Stability >= 15, Age of Absolutism or later, Great Power status, and Capital Development >= 28."
 oe_msn_plc_destiny:0 "#bold #color_yellow Intermarium: Polish-Lithuanian Destiny#!#!"
 oe_msn_plc_destiny_DESCRIPTION:0 "From Krewo and Grunwald to the May Third Constitution"
 oe_msn_plc_destiny_CRITERIA_DESCRIPTION:0 "Unite Poland-Lithuania, secure the Baltic-Black Sea corridor, raise Hussaria, and enact May Third."
 oe_msn_plc_destiny_BUTTON_TOOLTIP:0 "Embark on the Commonwealth Destiny"
 oe_msn_plc_destiny_BUTTON_DETAILS:0 "Pairs with the Commonwealth protagonist arc: forge Krewo and Grunwald, secure Gdansk, seal Lublin and Warsaw toleration, field Winged Hussars and Registered Cossacks, and enact the May Third Constitution."
 STATIC_MODIFIER_NAME_oe_msn_plc_m1:0 "Executionist Reform & Warsaw Toleration"
 STATIC_MODIFIER_DESC_oe_msn_plc_m1:0 "Reclaimed royal estates and the Warsaw Confederation yield fiscal health and religious peace."
 STATIC_MODIFIER_NAME_oe_msn_plc_m2:0 "Winged Hussaria & Intermarium Shield"
 STATIC_MODIFIER_DESC_oe_msn_plc_m2:0 "Charging Winged Hussars and Registered Cossacks defend the realm from the Baltic to the Black Sea."
 STATIC_MODIFIER_NAME_oe_msn_plc_m3:0 "Vistula–Gdansk Granary of Europe"
 STATIC_MODIFIER_DESC_oe_msn_plc_m3:0 "Gdansk's grain trade and the National Education Commission pair commercial wealth with enlightenment."
 STATIC_MODIFIER_NAME_oe_msn_plc_m4:0 "May Third Constitution: Intermarium Crown"
 STATIC_MODIFIER_DESC_oe_msn_plc_m4:0 "Abolishing the Liberum Veto secures a constitutional Intermarium superpower for the modern era."
 oe_msn_plc_01_krewo_crown:0 "Jagiellonian Core: Krakow & Vilnius"
 oe_msn_plc_01_krewo_crown_desc:0 "The Union of Krewo joined Wawel's royal hill with the forested castles of Vilnius into a single shield stretching from the Carpathians to the Baltic pines. Securing dynastic [legitimacy|e] and [estate_satisfaction|e] rallies the [army|e] behind our [capital|e] banner."
 oe_msn_plc_01_krewo_crown_req_tt:0 "Own Krakow or Vilnius, have 5 Stability, 45% Nobles Satisfaction, and own a Castle."
 oe_msn_plc_02_warsaw_confederation:0 "Lublin Union & Warsaw Toleration"
 oe_msn_plc_02_warsaw_confederation_desc:0 "At Lublin and Warsaw, Polish and Lithuanian magnates swore to keep civil peace across Catholic, Orthodox, and Protestant estates alike. Enshrining mutual oaths in our [parliament|e] deepens [stability|e], binds loyal [subjects|e], and safeguards civic [diplomacy|e]."
 oe_msn_plc_02_warsaw_confederation_req_tt:0 "Control Warsaw or Krakow, have 10 Stability, 45% Clergy Satisfaction, and either 1 subject or 25 locations."
 oe_msn_plc_03_executionist_cossacks:0 "Executionist Audit & Registered Cossacks"
 oe_msn_plc_03_executionist_cossacks_desc:0 "Auditing alienated royal estates funds a permanent Quarter Army while enrolling Zaporozhian Cossacks on regular payroll guards the Dnieper steppe frontier. Reclaiming [crown_power|e] fills our [gold|e] coffers, builds [army_tradition|e], and mobilizes frontier [manpower|e]."
 oe_msn_plc_03_executionist_cossacks_req_tt:0 "Own Krakow, Warsaw, or Vilnius in the Age of Discovery or later, hold 200 Gold, 22 Army Tradition, and a Training Fields or Armory."
 oe_msn_plc_04_great_sejm_reforms:0 "Great Sejm & Majority Legislation"
 oe_msn_plc_04_great_sejm_reforms_desc:0 "No single bribed envoy shall paralyze the Commonwealth with a shout of liberum veto once majority ballots rule the Great Sejm. Strengthening [parliament|e] and [cabinet|e] authority restores [crown_power|e] while keeping modern [institutions|e] aligned with national survival."
 oe_msn_plc_04_great_sejm_reforms_req_tt:0 "Own Warsaw, Krakow, or Vilnius in the Age of Reformation or later, have 15 Stability, 50% Burghers Satisfaction, and embrace Confessionalism."
 oe_msn_plc_05_grunwald_malbork:0 "Grunwald Legacy: Malbork & Gdansk"
 oe_msn_plc_05_grunwald_malbork_desc:0 "Fulfilling the victory won on the fields of Grunwald, brick-red Malbork and bustling Gdansk open the Vistula mouth directly onto the Baltic Sea. Securing this northern [core|e] lifts martial [prestige|e], unlocks maritime [trade|e], and anchors our [fort|e] frontier."
 oe_msn_plc_05_grunwald_malbork_req_tt:0 "Control Malbork and Gdansk (directly or via subject) and have at least 15 Army Tradition."
 oe_msn_plc_06_ruthenian_heartland:0 "Ruthenian Heartland: Kyiv & Lviv"
 oe_msn_plc_06_ruthenian_heartland_desc:0 "From the vaulted bazaars of Lviv to the golden domes overlooking the Dnieper at Kyiv, Ruthenia forms the rich black-earth heart of the union. Integrating these eastern [core|e] lands expands agrarian [prosperity|e], bolsters [control|e], and supplies vast [manpower|e]."
 oe_msn_plc_06_ruthenian_heartland_req_tt:0 "Control Kyiv and Lviv (directly or via subject) and own at least one Granary."
 oe_msn_plc_07_winged_hussaria:0 "Thunder of Kircholm: Winged Hussars"
 oe_msn_plc_07_winged_hussaria_desc:0 "Lowering hollow six-meter lances beneath leopard pelts and rushing eagle wings, the Husaria shattered triple odds at Kircholm and Klushino. Drilling elite noble [regulars|e] cements fearsome [army_tradition|e], sustains [army|e] shock supremacy, and wins European [prestige|e]."
 oe_msn_plc_07_winged_hussaria_req_tt:0 "Own Krakow, Warsaw, or Vilnius in the Age of Reformation or later, hold 30 locations, 35 Army Tradition, and a Barracks."
 oe_msn_plc_08_intermarium_corridor:0 "Intermarium: Riga to Cetatea Alba"
 oe_msn_plc_08_intermarium_corridor_desc:0 "From Riga's Daugava docks to the stone ramparts of Cetatea Alba on the Dniester estuary, a sea-to-sea corridor binds Baltic timber to Black Sea caravans. Holding this Intermarium [core|e] amplifies [trade|e], nurtures [navy_tradition|e], and widens our [maritime_presence|e]."
 oe_msn_plc_08_intermarium_corridor_req_tt:0 "Control Riga or Cetatea Alba (directly or via subject) and hold at least 3 ports."
 oe_msn_plc_09_vistula_granary:0 "Vistula Grain & Gdansk Exchange"
 oe_msn_plc_09_vistula_granary_desc:0 "Each spring flat-bottomed barges float rye, wheat, potash, and oak planks down the Vistula straight into Gdansk's brick granaries for Dutch and English buyers. Guiding this riverine [market|e] multiplies [trade|e] tolls, enriches [gold|e] reserves, and lifts coastal [prosperity|e]."
 oe_msn_plc_09_vistula_granary_req_tt:0 "Control Gdansk, hold 300 Gold, earn at least 25 monthly trade & tax income, and own a Marketplace."
 oe_msn_plc_10_polish_renaissance:0 "Polish-Lithuanian Renaissance"
 oe_msn_plc_10_polish_renaissance_desc:0 "From Jagiellonian scholars who trained Copernicus to Vilnius academies and Italianate arcades at Wawel, humanist learning illuminates the eastern realms. Funding civic [buildings|e] spreads [institutions|e] and [literacy|e], raising Commonwealth [cultural_tradition|e] to continental renown."
 oe_msn_plc_10_polish_renaissance_req_tt:0 "Own Krakow or Vilnius in the Age of Renaissance or later, own a University, and embrace the Renaissance."
 oe_msn_plc_11_national_education:0 "National Education Commission"
 oe_msn_plc_11_national_education_desc:0 "Establishing Europe's first ministry of public instruction, the National Education Commission standardizes vernacular schools, cadet colleges, and scientific presses. State-backed [literacy|e] accelerates [advances|e], raises [capital|e] [development|e], and nurtures enlightened citizens."
 oe_msn_plc_11_national_education_req_tt:0 "Own Warsaw, Krakow, or Vilnius in the Age of Reformation or later, have 18 Stability, 26 Capital Development, and a Printing Press Shop."
 oe_msn_plc_12_may_third_constitution:0 "1791 May Third Constitutional Crown"
 oe_msn_plc_12_may_third_constitution_desc:0 "Proclaimed before a cheering Royal Castle, the Constitution of May Third binds crown, burghers, and rural estates into an unbreakable constitutional realm between three seas. Standing as a [great_power|e], the Commonwealth joins [parliament|e] liberty with [crown_power|e] and [stability|e]."
 oe_msn_plc_12_may_third_constitution_req_tt:0 "Control Gdansk and Kyiv in the Age of Absolutism or later, have 18 Stability, a Stock Exchange or Star Fort, and be a Great Power or earn 75 monthly income."
 oe_msn_glh_destiny:0 "#bold #color_yellow Ulus of Jochi: Golden Horde Gunpowder Destiny#!#!"
 oe_msn_glh_destiny_DESCRIPTION:0 "From New Sarai's Qarachi Begs to a Gunpowder Steppe Empire"
 oe_msn_glh_destiny_CRITERIA_DESCRIPTION:0 "Unite the Jochid wings, settle under a New Yassa, dig the Volga-Don canal, and field Tabur guns."
 oe_msn_glh_destiny_BUTTON_TOOLTIP:0 "Embark on the Golden Horde Destiny"
 oe_msn_glh_destiny_BUTTON_DETAILS:0 "Pairs with the Steppe Gunpowder protagonist arc: balance the four Qarachi clans, renew Rus tribute, settle New Sarai, link the Volga and Don, and field Tabur musketeer-artillery formations."
 STATIC_MODIFIER_NAME_oe_msn_glh_m1:0 "New Yassa & Steppe Tabur Doctrine"
 STATIC_MODIFIER_DESC_oe_msn_glh_m1:0 "Combining Kipchak horse mobility with wagon-fortress muskets and cannon dominates the plains."
 STATIC_MODIFIER_NAME_oe_msn_glh_m2:0 "Kipchak Steppe & Dual-Sea Dominion"
 STATIC_MODIFIER_DESC_oe_msn_glh_m2:0 "Unbroken steppe sovereignty from Crimea and Tana to Kazan and the Caspian commands inner Eurasia."
 STATIC_MODIFIER_NAME_oe_msn_glh_m3:0 "Volga–Don Canal & Northern Silk Road"
 STATIC_MODIFIER_DESC_oe_msn_glh_m3:0 "Linking the Black and Caspian Seas turns Sarai and Astrakhan into booming Eurasian entrepots."
 STATIC_MODIFIER_NAME_oe_msn_glh_m4:0 "Eurasian Gunpowder Khaganate Destiny"
 STATIC_MODIFIER_DESC_oe_msn_glh_m4:0 "Transcending nomadic decline, the heirs of Jochi rule central Eurasia as a modern gunpowder empire."
 oe_msn_glh_01_sarai_qarachi:0 "Qarachi Council at New Sarai"
 oe_msn_glh_01_sarai_qarachi_desc:0 "Reconciling the four great Qarachi clans—Shirin, Baryn, Arghun, and Kipchak—under the gilded pavilion of New Sarai arrests the creeping fracture of Jochi's legacy. Strengthening nomadic [horde_unity|e] and loyal ulus [subjects|e] alongside steppe [buildings|e] restores [stability|e] and reminds every wing beg that the Great Khan still rules the Volga."
 oe_msn_glh_01_sarai_qarachi_req_tt:0 "Own New Sarai, Astrakhan, or Qirq-Yer, Stability >= 5, and either command a Golden Horde Ulus subject, >= 2 Subjects, or own a Kurultai/Caravanserai."
 oe_msn_glh_02_yarliq_tribute:0 "Yarliq Charters & Darugha Fisc"
 oe_msn_glh_02_yarliq_tribute_desc:0 "Stamped with the crimson imperial tamgha, the Khan's Yarliq charters compel forest princes and caravan cities alike to render punctual silver tribute along the Yam roads. Tightening imperial [control|e] over tributary [subjects|e] fills Sarai's coffers with [gold|e] and reinforces [legitimacy|e], warning defiant northern vassals that the Golden Horde's writ remains backed by steel."
 oe_msn_glh_02_yarliq_tribute_req_tt:0 "Own New Sarai/Astrakhan/Qirq-Yer, Stability >= 10, >= 25 Locations, and either an Ulus subject, >= 2 Subjects, or Monthly Trade & Tax Income >= 20."
 oe_msn_glh_03_steppe_tabur_guns:0 "Steppe Tabur & Zamburak Guns"
 oe_msn_glh_03_steppe_tabur_guns_desc:0 "No steppe empire can survive the gunpowder revolution on composite bows alone. Fusing mobile fortified wagon-laagers, swivel zamburak guns, and gunpowder [advances|e] with ferocious Kipchak horsemanship revitalizes [army_tradition|e], forging a hybrid steppe [army|e] that breaks pike squares and fortress gates alike."
 oe_msn_glh_03_steppe_tabur_guns_req_tt:0 "Own New Sarai/Astrakhan/Qirq-Yer, Treasury >= 220 Gold, Age of Discovery or later, and either Gunpowder advance, a Cannon Maker/Hand Cannon Guild, or Army Tradition >= 22."
 oe_msn_glh_04_new_yassa_settlement:0 "Proclaim the New Yassa Settlement Charter"
 oe_msn_glh_04_new_yassa_settlement_desc:0 "Proclaiming the New Yassa Settlement Charter bridges the ancient divide between pastoral tumens and brick-built Volga river cities. With thriving [capital|e] [development|e], steady [stability|e], and modernized fiscal [control|e], the Kurultai gathers to decide whether Jochi's realm becomes a centralized gunpowder monarchy, an ulus federation, or a transcontinental trade brokerage."
 oe_msn_glh_04_new_yassa_settlement_req_tt:0 "Own New Sarai/Astrakhan/Qirq-Yer, Stability >= 15, Age of Reformation or later, and Capital Development >= 22."
 oe_msn_glh_05_crimea_tana_coast:0 "Black Sea Rim: Tana & Qirq-Yer"
 oe_msn_glh_05_crimea_tana_coast_desc:0 "Securing Azov's Tana entrepot alongside the rocky bastion of Qirq-Yer puts the northern Black Sea rim squarely under the Khan's customs seal. Integrating these maritime gateways as permanent [core|e] holdings with bustling port [buildings|e] channels Italian and Anatolian [trade|e] directly into the steppe, multiplying customs [gold|e] and strategic reach."
 oe_msn_glh_05_crimea_tana_coast_req_tt:0 "Own Tana and Qirq-Yer, and either >= 4 Ports or own a Wharf/Marketplace."
 oe_msn_glh_06_kazan_upper_volga:0 "Upper Volga Wing: Secure Kazan"
 oe_msn_glh_06_kazan_upper_volga_desc:0 "Heir to ancient Volga Bulghar, Kazan stands watch over the northern timberlands where Rus' princes plot to break eastward. Holding Kazan as a fortified [core|e] backed by solid [fort|e] ramparts and vigilant [army_tradition|e] locks down the upper Volga [trade|e] routes and secures the northern wing of the Kipchak realm."
 oe_msn_glh_06_kazan_upper_volga_req_tt:0 "Own Kazan, and either Army Tradition >= 18 or own a Castle."
 oe_msn_glh_07_caspian_astrakhan:0 "Caspian Gate: Sarai & Astrakhan"
 oe_msn_glh_07_caspian_astrakhan_desc:0 "Rebuilding New Sarai and Astrakhan restores the twin jewels of the lower Volga delta after decades of civil strife and southern raids. Anchoring these delta [core|e] cities with bustling caravan [buildings|e] sparks rapid urban [development|e] and [prosperity|e], drawing Persian silk, Urgench carpets, and Russian furs into one resplendent imperial [market|e]."
 oe_msn_glh_07_caspian_astrakhan_req_tt:0 "Own New Sarai and Astrakhan, and own a Caravanserai or Marketplace."
 oe_msn_glh_08_rus_or_transoxiana:0 "Steppe Hegemony: Moscow or Samarkand"
 oe_msn_glh_08_rus_or_transoxiana_desc:0 "Whether compelling Moscow's submission in the forests or clasping hands with Transoxiana across the steppes, the Golden Horde stands unchallenged across Inner Eurasia. Rising as an undeniable [great_power|e] across fifty-five territories amplifies [prestige|e], deepens [horde_unity|e], and binds vast frontier [subjects|e] beneath the sovereign banner of Sarai."
 oe_msn_glh_08_rus_or_transoxiana_req_tt:0 "Own or non-sovereign subject-own Moscow or Samarkand (or own New Sarai), >= 55 Locations, and Great Power status."
 oe_msn_glh_09_fur_silk_customs:0 "Black–Caspian Fur & Silk Customs"
 oe_msn_glh_09_fur_silk_customs_desc:0 "Controlled customs tariffs at Tana and Astrakhan replace erratic plunder with predictable silver revenue along the northern Silk Road. Constructing fiscal [buildings|e] and reassuring merchant guilds to lift [estate_satisfaction|e] turns transit [trade|e] into abundant [gold|e], funding permanent fortifications, bronze guns, and prosperous Volga river towns."
 oe_msn_glh_09_fur_silk_customs_req_tt:0 "Own Astrakhan or Tana, Treasury >= 300 Gold, Monthly Trade & Tax Income >= 24, and own a Counting House or Marketplace."
 oe_msn_glh_10_volga_don_canal:0 "Volga–Don Intersea Canal"
 oe_msn_glh_10_volga_don_canal_desc:0 "Where the Volga and Don bend within forty miles at Perevoloka, digging an intersea ship canal fulfills a geopolitical masterstroke coveted by sultans and tsars alike. Backed by river dockyard [buildings|e] and booming [trade|e], linking the Caspian directly to the Black Sea elevates [maritime_presence|e], [development|e], and [prestige|e] across the entire Eurasian interior."
 oe_msn_glh_10_volga_don_canal_req_tt:0 "Own Astrakhan and Tana, Age of Discovery or later, and either Monthly Trade & Tax Income >= 35 or own a Dry Dock/Trading Hub."
 oe_msn_glh_11_sarai_polyglot_academy:0 "Sarai Polyglot Academy & Gun Foundry"
 oe_msn_glh_11_sarai_polyglot_academy_desc:0 "A cosmopolitan academy in Sarai uniting Kipchak Turkic, Persian, Arabic, and Slavonic scholarship transforms the steppe court into an engine of early modern science. Embracing new [institutions|e] and funding learned [buildings|e] raises [literacy|e], fosters [cultural_tradition|e], and accelerates military [advances|e] from artillery metallurgy to transcontinental cartography."
 oe_msn_glh_11_sarai_polyglot_academy_req_tt:0 "Own New Sarai or Astrakhan, Stability >= 15, Age of Reformation or later, and either embrace Printing Press or own a University/Madrasa."
 oe_msn_glh_12_gunpowder_khaganate:0 "Ultimate Eurasian Gunpowder Khaganate"
 oe_msn_glh_12_gunpowder_khaganate_desc:0 "Rather than splintering into prey for its neighbors, the Ulus of Jochi has forged a modern gunpowder super-khaganate commanding the Volga, the Black Sea, and the steppe heartland. Standing as an undisputed [great_power|e] crowned by high [capital|e] [development|e], unbroken [stability|e], and lasting [prestige|e], Sarai now convenes the supreme assembly to seal its modern imperial destiny."
 oe_msn_glh_12_gunpowder_khaganate_req_tt:0 "Complete all three branches, own New Sarai and Astrakhan, Stability >= 15, Age of Absolutism or later, Great Power status, and Capital Development >= 28."
 oe_msn_hun_destiny:0 "#bold #color_yellow Crown of Saint Stephen: Hungarian Destiny#!#!"
 oe_msn_hun_destiny_DESCRIPTION:0 "From Buda and the Black Army to Danubian Supremacy"
 oe_msn_hun_destiny_CRITERIA_DESCRIPTION:0 "Secure Buda and Belgrade, forge the standing Black Army, and command the Carpathian-Adriatic corridor."
 oe_msn_hun_destiny_BUTTON_TOOLTIP:0 "Embark on the Hungarian Destiny"
 oe_msn_hun_destiny_BUTTON_DETAILS:0 "Defend the Carpathian basin and Danube line: build Matthias Corvinus's standing Black Army and Renaissance library at Buda to forge a Danubian-Adriatic great power."
 STATIC_MODIFIER_NAME_oe_msn_hun_m1:0 "Standing Black Army of Corvinus"
 STATIC_MODIFIER_DESC_oe_msn_hun_m1:0 "Centrally funded professional infantry, war wagons, and heavy cavalry anchor Danubian defense."
 STATIC_MODIFIER_NAME_oe_msn_hun_m2:0 "Danube & Adriatic Bulwark"
 STATIC_MODIFIER_DESC_oe_msn_hun_m2:0 "Belgrade's citadel and Adriatic ports lock down Central Europe's southern approaches."
 STATIC_MODIFIER_NAME_oe_msn_hun_m3:0 "Corvinian Library & Carpathian Silver"
 STATIC_MODIFIER_DESC_oe_msn_hun_m3:0 "Carpathian precious mines and Buda's famed Renaissance library fuel royal revenue and science."
 STATIC_MODIFIER_NAME_oe_msn_hun_m4:0 "Danubian Empire of Saint Stephen"
 STATIC_MODIFIER_DESC_oe_msn_hun_m4:0 "Defying Mohacs, Hungary stands as a fortified, enlightened Central European superpower."
 oe_msn_hun_01_buda_pest_crown:0 "Crown of St. Stephen: Buda & Pest"
 oe_msn_hun_01_buda_pest_crown_desc:0 "From the coronation hill of Pressburg to the twin banks of Buda and Pest, the Holy Crown of Saint Stephen binds the Carpathian basin beneath royal law. Fortifying our Danube [capital|e] steadies [legitimacy|e], reassures the [estates|e], and anchors regional [control|e]."
 oe_msn_hun_01_buda_pest_crown_req_tt:0 "Own Buda and Pest, control Bratislava (directly or via subject), have 5 Stability, and own a Castle."
 oe_msn_hun_02_castle_warriors:0 "Border Castles & Hussar Horsemen"
 oe_msn_hun_02_castle_warriors_desc:0 "Along the southern river marches, border castle garrisons and swift hussar lancers screen every ford against sudden raids from the Balkan passes. Honoring frontier service lifts [army_tradition|e], keeps [estate_satisfaction|e] firm, and guards every [fort|e] and [manpower|e] levy."
 oe_msn_hun_02_castle_warriors_req_tt:0 "Own Buda, have 10 Stability, 15 Army Tradition, and 45% Nobles Satisfaction."
 oe_msn_hun_03_black_army_standing:0 "Standing Black Army of Matthias"
 oe_msn_hun_03_black_army_standing_desc:0 "Paid directly from royal extraordinaria taxes, King Matthias's Black Army combines Bohemian handgunners, armored lancers, and field bombards into a year-round force. Embracing new [institutions|e] turns [gold|e] into hardened [regulars|e] and sovereign [crown_power|e]."
 oe_msn_hun_03_black_army_standing_req_tt:0 "Own Buda in the Age of Renaissance or later, hold 250 Gold, own an Armory, and embrace Professional Armies."
 oe_msn_hun_04_danube_multi_faith:0 "Carpathian Multi-Confessional Charter"
 oe_msn_hun_04_danube_multi_faith_desc:0 "Inspired by the 1568 Edict of Torda, our royal diet guarantees confessional peace among Magyars, Transylvanian Saxons, Slovaks, and Croats alike. Wise [parliament|e] charters calm sectarian strife, sustain [stability|e], harmonize [estates|e], and elevate [diplomatic_reputation|e]."
 oe_msn_hun_04_danube_multi_faith_req_tt:0 "Own Buda in the Age of Reformation or later, have 15 Stability, 50% Clergy Satisfaction, and embrace Confessionalism."
 oe_msn_hun_05_belgrade_bulwark:0 "Danube Bulwark: Hold Belgrade"
 oe_msn_hun_05_belgrade_bulwark_desc:0 "Where the Sava meets the Danube, white-walled Nandorfehervar stood unbroken under Janos Hunyadi as the shield of Christendom. Holding this southern [core|e] behind a reinforced [fort|e] blunts every invasion, securing frontier [control|e] and [prestige|e]."
 oe_msn_hun_05_belgrade_bulwark_req_tt:0 "Control Belgrade (directly or via subject) and own at least one Weapon Guild."
 oe_msn_hun_06_adriatic_zara:0 "Adriatic Corridor: Reclaim Zara"
 oe_msn_hun_06_adriatic_zara_desc:0 "Restoring the Treaty of Zadar reopens the Croatian-Dalmatian coast, freeing Hungarian copper, cattle, and salt from Venetian customs monopolies. Securing this Adriatic [core|e] launches our [navy|e], cultivates [navy_tradition|e], and opens direct sea [trade|e]."
 oe_msn_hun_06_adriatic_zara_req_tt:0 "Control Zara (directly or via subject) and possess at least one port."
 oe_msn_hun_07_vienna_or_bohemia:0 "Central European Ascendancy"
 oe_msn_hun_07_vienna_or_bohemia_desc:0 "Just as Matthias Corvinus marched into Vienna and claimed the Bohemian lands, Buda now asserts primacy along the upper Danube and Vltava. Extending royal [core|e] claims backed by seasoned [army|e] columns elevates [army_tradition|e] and continental [prestige|e]."
 oe_msn_hun_07_vienna_or_bohemia_req_tt:0 "Control Vienna or Prague (or own Buda), hold 35 locations, and have at least 25 Army Tradition."
 oe_msn_hun_08_carpathian_mastery:0 "Carpathian–Balkan Mastery"
 oe_msn_hun_08_carpathian_mastery_desc:0 "Every pass of the Carpathian arc and every river gate into the Balkans now answers to royal bans and loyal marcher lords sworn to Buda. Integrating border [subjects|e] multiplies imperial [manpower|e], deepens [control|e], and enriches Danubian [development|e]."
 oe_msn_hun_08_carpathian_mastery_req_tt:0 "Own Buda, control Belgrade, hold 40 locations, and have at least 1 subject or 22 Capital Development."
 oe_msn_hun_09_gold_forint_coinage:0 "Golden Forint & Carpathian Mines"
 oe_msn_hun_09_gold_forint_coinage_desc:0 "Struck at Kremnica from Upper Hungarian gold and Transylvanian silver, the pure Hungarian Forint circulates as trusted tender from Venice to Krakow. Sound minting wards off [inflation|e], swells our [gold|e] treasury, energizes [market|e] commerce, and lifts [prosperity|e]."
 oe_msn_hun_09_gold_forint_coinage_req_tt:0 "Own Buda, control Bratislava, hold 300 Gold, earn 22 monthly trade & tax income, and own a Marketplace."
 oe_msn_hun_10_corvinian_library:0 "Buda Renaissance & Bibliotheca Corviniana"
 oe_msn_hun_10_corvinian_library_desc:0 "Rivaling the Vatican itself, the Bibliotheca Corviniana gathers illuminated Greek codices, Florentine architects, and humanist astronomers inside Buda Castle. Investing in royal [buildings|e] advances [literacy|e], blooms [cultural_tradition|e], and accelerates capital [development|e]."
 oe_msn_hun_10_corvinian_library_req_tt:0 "Own Buda in the Age of Renaissance or later, own a Library or University, and have 24 Capital Development."
 oe_msn_hun_11_danube_river_commerce:0 "Danube River Trade & Modern Agronomy"
 oe_msn_hun_11_danube_river_commerce_desc:0 "Drained marshlands across the Great Plain yield golden wheat and Tokaj vintages, while regulated river convoys tie Vienna, Pest, and Belgrade into one commercial artery. Modern [trade|e] tolls, guild [buildings|e], and agrarian [prosperity|e] strengthen state [gold|e] revenues."
 oe_msn_hun_11_danube_river_commerce_req_tt:0 "Own Buda in the Age of Reformation or later, have 15 Stability, earn 40 monthly income, and own a Customs House or Cloth Workshop."
 oe_msn_hun_12_danubian_superpower:0 "Eternal Crown of Saint Stephen"
 oe_msn_hun_12_danubian_superpower_desc:0 "No disaster at Mohacs broke the Dragon's shield: unbroken from the Tatras to the Adriatic and the lower Danube, Saint Stephen's realm stands sovereign and feared. Rising as a [great_power|e], Hungary unites [army|e] prowess, [crown_power|e], and [diplomacy|e] across Central Europe."
 oe_msn_hun_12_danubian_superpower_req_tt:0 "Own Buda and control Belgrade in the Age of Absolutism or later, have 15 Stability, a Star Fort or Stock Exchange, and be a Great Power or earn 70 monthly income."
 oe_msn_ser_destiny:0 "#bold #color_yellow Code of Dusan: Serbian Balkan Destiny#!#!"
 oe_msn_ser_destiny_DESCRIPTION:0 "From Dusan's Code and Silver Mines to a Balkan Orthodox Empire"
 oe_msn_ser_destiny_CRITERIA_DESCRIPTION:0 "Enact Dusan's Code, elevate the Patriarchate, harness Balkan silver, and unite the peninsula."
 oe_msn_ser_destiny_BUTTON_TOOLTIP:0 "Embark on the Serbian Destiny"
 oe_msn_ser_destiny_BUTTON_DETAILS:0 "Fulfill Stefan Dusan's imperial vision: codify the 1349 Zakonik, elevate the Serbian Patriarchate, turn silver mining into modern armies, hold Belgrade, and forge a Balkan Orthodox power."
 STATIC_MODIFIER_NAME_oe_msn_ser_m1:0 "Code of Dusan & Serbian Patriarchate"
 STATIC_MODIFIER_DESC_oe_msn_ser_m1:0 "Written imperial law and an autocephalous patriarchate fortify legality and Orthodox devotion."
 STATIC_MODIFIER_NAME_oe_msn_ser_m2:0 "Balkan Orthodox Bulwark"
 STATIC_MODIFIER_DESC_oe_msn_ser_m2:0 "Holding Skopje, Belgrade, and the mountain passes turns Serbia into an unconquerable fortress."
 STATIC_MODIFIER_NAME_oe_msn_ser_m3:0 "Balkan Silver Mines & Enlightenment"
 STATIC_MODIFIER_DESC_oe_msn_ser_m3:0 "Rich silver seams and enlightened Orthodox academies invigorate Balkan commerce and culture."
 STATIC_MODIFIER_NAME_oe_msn_ser_m4:0 "Balkan Orthodox Imperial Destiny"
 STATIC_MODIFIER_DESC_oe_msn_ser_m4:0 "Overcoming historic peril, Serbia crowns a prosperous, fortified Balkan Orthodox empire."
 oe_msn_ser_01_dusan_code:0 "1349 Code of Dusan: Prizren & Skopje"
 oe_msn_ser_01_dusan_code_desc:0 "Promulgated at Skopje in 1349, Tsar Dusan's Zakonik places even the emperor under written law, curbing unruly boyars while shielding merchants and peasants. Upholding royal [legitimacy|e] and [stability|e] tames feudal [estates|e] and fortifies imperial [control|e]."
 oe_msn_ser_01_dusan_code_req_tt:0 "Own Prizren and Skopje, have 5 Stability, 45% Nobles Satisfaction, and own a Castle."
 oe_msn_ser_02_patriarchate_pec:0 "Legacy of St. Sava & Patriarchate"
 oe_msn_ser_02_patriarchate_pec_desc:0 "From the autocephalous Patriarchate of Pec to the stone shrines of Visoki Decani and Studenica, Saint Sava's spiritual legacy binds scattered valleys into one Orthodox people. Patronizing sacred [buildings|e] deepens [religious_influence|e], lifts [estate_satisfaction|e], and preserves national [prestige|e]."
 oe_msn_ser_02_patriarchate_pec_req_tt:0 "Own Prizren, have 10 Stability, 50% Clergy Satisfaction, and own a Monastery or Cathedral."
 oe_msn_ser_03_hajduk_firearms:0 "Mountain Guards & Balkan Musketeers"
 oe_msn_ser_03_hajduk_firearms_desc:0 "Forging mountain hajduk marksmen and heavily armored gusar cavalry into regular musketeer companies turns Balkan ravines into death traps for invading armies. Equipping disciplined [regulars|e] from our [gold|e] vaults raises [army_tradition|e] and sharpens [army|e] resilience."
 oe_msn_ser_03_hajduk_firearms_req_tt:0 "Own Prizren, Skopje, or Belgrade in the Age of Discovery or later, hold 200 Gold, 22 Army Tradition, and a Training Fields or Armory."
 oe_msn_ser_04_orthodox_league:0 "Balkan Orthodox League & Synod"
 oe_msn_ser_04_orthodox_league_desc:0 "Convening bishops, voivodes, and clan knezes in a standing Balkan Synod replaces feudal splintering with a sworn mutual defense pact across the peninsula. Joint [diplomacy|e] and cohesive [cabinet|e] councils align [subjects|e] and modern [institutions|e] behind one banner."
 oe_msn_ser_04_orthodox_league_req_tt:0 "Own Belgrade, Skopje, or Prizren in the Age of Reformation or later, have 15 Stability, embrace Confessionalism, and have 1 subject or 32 Army Tradition."
 oe_msn_ser_05_danube_belgrade:0 "Danube Citadel: Secure Belgrade"
 oe_msn_ser_05_danube_belgrade_desc:0 "Rebuilt by Despot Stefan Lazarevic into a twin-tiered citadel above the Sava confluence, Kalemegdan makes Belgrade the unyielding northern anchor of the Serbian crown. Reclaiming this river [core|e] strengthens our [fort|e] belt, lifts [prosperity|e], and commands Danubian [trade|e]."
 oe_msn_ser_05_danube_belgrade_req_tt:0 "Control Belgrade (directly or via subject) and have at least 12 Army Tradition."
 oe_msn_ser_06_adriatic_outlet:0 "Adriatic Access: Maritime Gateway"
 oe_msn_ser_06_adriatic_outlet_desc:0 "Descending from the Dinaric limestone ridges onto the stone quays of Ragusa and Zeta breaks landlocked isolation and links Serbian silver straight to Italian fleets. Establishing an Adriatic [core|e] fosters our [navy|e], awakens [navy_tradition|e], and broadens sea [trade|e]."
 oe_msn_ser_06_adriatic_outlet_req_tt:0 "Control Dubrovnik, Zara, or Belgrade, hold 22 locations, and possess at least one port."
 oe_msn_ser_07_aegean_thessaloniki:0 "Southern Horizon: Thessaloniki or Sofia"
 oe_msn_ser_07_aegean_thessaloniki_desc:0 "Marching down the Vardar valley toward Thessaloniki or across the Balkan ridge into Sofia seals the ancient Via Egnatia and Via Militaris under Serbian banners. Integrating this southern [core|e] multiplies [manpower|e], commands overland [market|e] caravans, and widens imperial [control|e]."
 oe_msn_ser_07_aegean_thessaloniki_req_tt:0 "Control Thessaloniki or Sofia (directly or via subject) and own a Weapon Guild."
 oe_msn_ser_08_balkan_hegemon:0 "Orthodox Pillar of Southeastern Europe"
 oe_msn_ser_08_balkan_hegemon_desc:0 "From the Sava riverbanks to the Macedonian lakes, Serbia stands no longer as a threatened buffer but as the undisputed arbiter of southeastern Europe. Uniting urban [development|e] with veteran [army|e] leadership cements [crown_power|e] and lasting imperial [prestige|e]."
 oe_msn_ser_08_balkan_hegemon_req_tt:0 "Control Belgrade and Skopje, hold at least 32 locations, and have 20 Capital Development."
 oe_msn_ser_09_balkan_silver_mines:0 "Balkan Silver Seams & Royal Mint"
 oe_msn_ser_09_balkan_silver_mines_desc:0 "In the deep galleries of Novo Brdo and Rudnik, Saxon Sasi engineers extract glama gold-bearing silver that once bankrolled Serbian cathedrals and mercenary armies alike. Chartering mining towns expands our [gold|e] mint, invigorates regional [market|e] [trade|e], and raises mountain [prosperity|e]."
 oe_msn_ser_09_balkan_silver_mines_req_tt:0 "Own Prizren or Skopje, hold 250 Gold, earn 18 monthly trade & tax income, and own a Marketplace."
 oe_msn_ser_10_monastery_frescoes:0 "Monastery Frescoes & Literary Revival"
 oe_msn_ser_10_monastery_frescoes_desc:0 "Building on the luminous Morava school of Manasija and Ravanica, fresco masters and Resava copyists fuse Byzantine grace with Italian humanism across the Balkans. Supporting artistic [buildings|e] spreads [institutions|e], uplifts [literacy|e], and crowns Serbian [cultural_tradition|e]."
 oe_msn_ser_10_monastery_frescoes_req_tt:0 "Own Prizren or Belgrade in the Age of Renaissance or later, have 10 Stability, a Scriptorium or Art School, and embrace the Renaissance."
 oe_msn_ser_11_serbian_enlightenment:0 "Serbian Enlightenment & Academies"
 oe_msn_ser_11_serbian_enlightenment_desc:0 "From Cetinje's Cyrillic incunabula to Dositej Obradovic's academies in Belgrade, vernacular printing and secular science awaken a modern South Slavic republic of letters. Rising [literacy|e] speeds scientific [advances|e], enriches [capital|e] [development|e], and strengthens civil society."
 oe_msn_ser_11_serbian_enlightenment_req_tt:0 "Own Belgrade in the Age of Reformation or later, have 15 Stability, 25 Capital Development, and a Printing Press Shop or University."
 oe_msn_ser_12_balkan_orthodox_empire:0 "Immortal Balkan Orthodox Empire"
 oe_msn_ser_12_balkan_orthodox_empire_desc:0 "The shadow of Kosovo Field is lifted forever as the double-headed white eagle flies unchallenged from the Danube bastions to the Aegean littoral. Standing as a [great_power|e], the Serbian Empire fuses [legitimacy|e], [religious_influence|e], and disciplined [army|e] might."
 oe_msn_ser_12_balkan_orthodox_empire_req_tt:0 "Control Belgrade and Skopje in the Age of Absolutism or later, have 15 Stability, a Star Fort or Iron Foundry, and be a Great Power or earn 60 monthly income."
 oe_msn_fra_destiny:0 "#bold #color_yellow Fleur-de-Lis: French Continental Destiny#!#!"
 oe_msn_fra_destiny_DESCRIPTION:0 "From the Hundred Years War to Gendarmes and Enlightenment"
 oe_msn_fra_destiny_CRITERIA_DESCRIPTION:0 "Unite France, raise the standing Gendarmes, contest Italy, and crown an enlightened continental power."
 oe_msn_fra_destiny_BUTTON_TOOLTIP:0 "Embark on the French Destiny"
 oe_msn_fra_destiny_BUTTON_DETAILS:0 "End the Hundred Years War at Orleans, Bordeaux, and Calais, build Europe's premier standing Gendarmes, reform royal taxes, heal confessional strife, and lead enlightened Europe."
 STATIC_MODIFIER_NAME_oe_msn_fra_m1:0 "Royal Gendarmes & Centralized Fisc"
 STATIC_MODIFIER_DESC_oe_msn_fra_m1:0 "Standing Gendarmes and centralized crown taxation power Western Europe's strongest monarchy."
 STATIC_MODIFIER_NAME_oe_msn_fra_m2:0 "Natural Frontiers & Italian Reach"
 STATIC_MODIFIER_DESC_oe_msn_fra_m2:0 "Uniting France's frontiers while projecting force into Italy secures continental primacy."
 STATIC_MODIFIER_NAME_oe_msn_fra_m3:0 "Fontainebleau Arts & Royal Manufactures"
 STATIC_MODIFIER_DESC_oe_msn_fra_m3:0 "Royal manufactures, refined arts, and Parisian academies make France Europe's cultural beacon."
 STATIC_MODIFIER_NAME_oe_msn_fra_m4:0 "Enlightened Continental Hegemon"
 STATIC_MODIFIER_DESC_oe_msn_fra_m4:0 "Armed with disciplined legions, modern civil codes, and cultural prestige, France leads Europe."
 oe_msn_fra_01_paris_orleans:0 "Paris & Orleans: Royal Resurgence"
 oe_msn_fra_01_paris_orleans_desc:0 "Holding the Ile-de-France and the Loire crossing at Orleans secures the beating heart of the French monarchy against invasion and feudal splintering. Expanding civic [buildings|e], raising [capital|e] [development|e], and anchoring royal [stability|e] rallies the kingdom's [manpower|e] to drive foreign crowns from French soil."
 oe_msn_fra_01_paris_orleans_req_tt:0 "Own Paris and Orleans, Stability >= 5, Capital Development >= 18, and own a Marketplace or Castle."
 oe_msn_fra_02_compagnies_gendarmes:0 "Ordonnance Companies & Gendarmes"
 oe_msn_fra_02_compagnies_gendarmes_desc:0 "With the royal taille funding the Compagnies d'Ordonnance and the Bureau brothers' mobile siege trains, France fields Western Europe's first permanent standing army. Funding military [buildings|e] and cultivating battle-hardened [army_tradition|e] elevates disciplined [regulars|e], shifting battlefield supremacy decisively toward the royal [army|e]."
 oe_msn_fra_02_compagnies_gendarmes_req_tt:0 "Own Paris, Treasury >= 220 Gold, and either Army Tradition >= 15 or own an Armory/Castle."
 oe_msn_fra_03_edict_reconciliation:0 "Edict of Reconciliation & Crown Peace"
 oe_msn_fra_03_edict_reconciliation_desc:0 "Decades of confessional slaughter nearly tore France apart before statesmen placed the survival of the state above sectarian vengeance. Navigating Reformation [institutions|e] with a measured royal settlement restores domestic [stability|e], calms [estate_satisfaction|e], and heals war-torn towns into renewed [prosperity|e] under a unified crown."
 oe_msn_fra_03_edict_reconciliation_req_tt:0 "Own Paris, Stability >= 15, Age of Reformation or later, Clergy Satisfaction >= 45%, and either embrace Confessionalism or own a Cathedral/University."
 oe_msn_fra_04_royal_absolutism:0 "Intendants & Fiscal Centralization"
 oe_msn_fra_04_royal_absolutism_desc:0 "Royal Intendants dispatched straight from the Louvre audit provincial taxes, break unruly magnates, and bind forty-five domains to Paris. Surging [crown_power|e], disciplined [cabinet|e] administration, and nationwide [control|e] bring France to a historic crossroads: shall the realm enthrone Sun King absolutism, renew the Estates-General, or champion Colbertian mercantilism?"
 oe_msn_fra_04_royal_absolutism_req_tt:0 "Own Paris, Age of Reformation or later, >= 45 Locations, and Monthly Trade & Tax Income >= 40."
 oe_msn_fra_05_bordeaux_aquitaine:0 "Reclaim Aquitaine: Bordeaux"
 oe_msn_fra_05_bordeaux_aquitaine_desc:0 "Reclaiming Bordeaux and the vineyards of Gascony ends three centuries of Plantagenet rule along the Gironde estuary. Binding Aquitaine as an uncontested royal [core|e] with bustling Atlantic port [buildings|e] redirects lucrative claret [trade|e] into the French fisc and expands royal [maritime_presence|e] along the Bay of Biscay."
 oe_msn_fra_05_bordeaux_aquitaine_req_tt:0 "Own Bordeaux, and either >= 6 Ports or own a Wharf/Marketplace."
 oe_msn_fra_06_calais_channel:0 "End the Hundred Years War: Calais"
 oe_msn_fra_06_calais_channel_desc:0 "Expelling the last English garrison from the Pale of Calais closes the final chapter of the Hundred Years War in decisive French triumph. Fortifying this Channel [core|e] and northern [fort|e] bridgehead safeguards Picard [prosperity|e], elevates royal [prestige|e], and frees the Valois monarchy to turn its ambition southward across the Alps."
 oe_msn_fra_06_calais_channel_req_tt:0 "Own Calais."
 oe_msn_fra_07_italian_wars_milan:0 "Across the Alps: Milan or Naples"
 oe_msn_fra_07_italian_wars_milan_desc:0 "Descending the Alpine passes into Lombardy and the Mezzogiorno exposes French chivalry and artillery to the dazzling courts of Renaissance Italy. Whether asserting dynastic claims over Milan and Naples or rallying loyal [subjects|e] behind unmatched [army_tradition|e], French arms import Italian humanist [cultural_tradition|e] while projecting decisive [diplomacy|e] across Western Europe."
 oe_msn_fra_07_italian_wars_milan_req_tt:0 "Own or non-sovereign subject-own Milan or Naples (or own Paris), >= 50 Locations, and either Army Tradition >= 24 or >= 2 Subjects."
 oe_msn_fra_08_continental_arbiter:0 "Arbiter of Western Europe"
 oe_msn_fra_08_continental_arbiter_desc:0 "From the English Channel to the Pyrenees and the Rhine approaches, a unified France commands the demographic and military center of gravity of Latin Christendom. Standing supreme as Europe's preeminent continental [great_power|e] lifts French [diplomatic_reputation|e] and [prestige|e], making Paris the indispensable arbiter of peace and war."
 oe_msn_fra_08_continental_arbiter_req_tt:0 "Own Paris, Bordeaux, and Calais, >= 55 Locations, and Great Power status."
 oe_msn_fra_09_atlantic_privateers:0 "Atlantic Trade & Royal Shipyards"
 oe_msn_fra_09_atlantic_privateers_desc:0 "Refusing to concede the New World to Iberian papal bulls alone, captains from Dieppe, La Rochelle, and Bordeaux chart the St. Lawrence and Caribbean sea lanes. Building Atlantic dockyard [buildings|e] and fostering a vigorous royal [navy|e] grows [navy_tradition|e], expands [maritime_presence|e], and opens transoceanic [trade|e] and colonial prospects for the Fleur-de-Lis."
 oe_msn_fra_09_atlantic_privateers_req_tt:0 "Own Bordeaux, Age of Discovery or later, >= 10 Ports, and either Navy Tradition >= 18 or own a Dry Dock/Dock."
 oe_msn_fra_10_fontainebleau_arts:0 "Fontainebleau Arts & Royal Manufactures"
 oe_msn_fra_10_fontainebleau_arts_desc:0 "Inviting Renaissance painters, silk weavers, and royal glassmakers to Fontainebleau and Paris transforms court taste into a pillar of national wealth. Embracing cultural [institutions|e] and erecting artistic [buildings|e] boosts [cultural_tradition|e] and [capital|e] [development|e], establishing French craftsmanship and high fashion as the envy of Europe."
 oe_msn_fra_10_fontainebleau_arts_req_tt:0 "Own Paris, Treasury >= 400 Gold, and either embrace Renaissance or own an Art School/Arts Academy."
 oe_msn_fra_11_enlightenment_salons:0 "Enlightenment Salons & Academy of Sciences"
 oe_msn_fra_11_enlightenment_salons_desc:0 "In Parisian salons and the halls of the Academie des Sciences, philosophes, cartographers, and engineers debate reason, law, and natural philosophy. Supporting printing [institutions|e] and scholarly [buildings|e] drives rapid gains in [literacy|e] and scientific [advances|e], making French the universal language of European thought and diplomacy."
 oe_msn_fra_11_enlightenment_salons_req_tt:0 "Own Paris, Stability >= 18, Age of Reformation or later, and either embrace Printing Press or own a Printing Press Shop/University."
 oe_msn_fra_12_french_code_destiny:0 "Civil Code & Continental Supremacy"
 oe_msn_fra_12_french_code_destiny_desc:0 "Crowned by Europe's finest standing armies, glittering academies, and unified legal administration, France stands at the radiant summit of the early modern world. As a supreme [great_power|e] powered by Paris's unrivaled [capital|e] [development|e], unbroken [stability|e], and continental [prestige|e], France now decrees the enduring code that will shape Europe's destiny."
 oe_msn_fra_12_french_code_destiny_req_tt:0 "Complete all three branches, own Paris, Bordeaux, and Calais, Stability >= 18, Age of Absolutism or later, Great Power status, and Capital Development >= 32."
 oe_msn_eng_destiny:0 "#bold #color_yellow Rule Britannia: English & British Destiny#!#!"
 oe_msn_eng_destiny_DESCRIPTION:0 "From British Union to Royal Navy, Parliament, and Global Trade"
 oe_msn_eng_destiny_CRITERIA_DESCRIPTION:0 "Unite the British Isles, pair Parliament with the Royal Navy, and command Atlantic and Indian commerce."
 oe_msn_eng_destiny_BUTTON_TOOLTIP:0 "Embark on the British Destiny"
 oe_msn_eng_destiny_BUTTON_DETAILS:0 "Consolidate London and York, unite Edinburgh and Dublin into Great Britain, marry parliamentary credit with the Royal Navy, and link Atlantic colonies to Indian entrepots."
 STATIC_MODIFIER_NAME_oe_msn_eng_m1:0 "Parliamentary Credit & Bill of Rights"
 STATIC_MODIFIER_DESC_oe_msn_eng_m1:0 "Parliament-backed public credit and secure property rights unlock unmatched fiscal depth."
 STATIC_MODIFIER_NAME_oe_msn_eng_m2:0 "United Isles & Wooden Walls"
 STATIC_MODIFIER_DESC_oe_msn_eng_m2:0 "Uniting the British Isles behind the Royal Navy renders the realm unassailable at sea."
 STATIC_MODIFIER_NAME_oe_msn_eng_m3:0 "Woolen Manufactures & Global Commerce"
 STATIC_MODIFIER_DESC_oe_msn_eng_m3:0 "Textile workshops, oceanic charters, and Indian entrepots pour global trade into London."
 STATIC_MODIFIER_NAME_oe_msn_eng_m4:0 "Oceanic Workshop Empire Destiny"
 STATIC_MODIFIER_DESC_oe_msn_eng_m4:0 "With supreme fleets, deep credit, and rising industry, Britain commands the early modern oceans."
 oe_msn_eng_01_london_york:0 "Thames & York: Crown of England"
 oe_msn_eng_01_london_york_desc:0 "Binding the booming Thames wharves of London with the fortified northern capital of York extinguishes baronial anarchy and cements royal justice across England. Upgrading urban [buildings|e], cultivating [capital|e] [development|e], and anchoring domestic [stability|e] fills the Exchequer with wool [gold|e] and secures the realm for British unification."
 oe_msn_eng_01_london_york_req_tt:0 "Own London and York, Stability >= 5, Capital Development >= 18, and own a Marketplace or Wharf."
 oe_msn_eng_02_parliament_fisc:0 "Parliamentary Subsidies & Wool Fisc"
 oe_msn_eng_02_parliament_fisc_desc:0 "When Crown and Commons agree upon transparent customs grants in Westminster, England outgrows desperate medieval borrowing from foreign bankers. Working harmoniously with [parliament|e] and safeguarding burgher [estate_satisfaction|e] strengthens sovereign credit, curtails [inflation|e], and channels abundant [trade|e] receipts into national defense."
 oe_msn_eng_02_parliament_fisc_req_tt:0 "Own London, Stability >= 10, Treasury >= 220 Gold, Monthly Trade & Tax Income >= 22, and Burghers Satisfaction >= 50%."
 oe_msn_eng_03_royal_navy_charter:0 "Royal Navy & Ecclesiastical Sovereignty"
 oe_msn_eng_03_royal_navy_charter_desc:0 "At Deptford, Woolwich, and Portsmouth, oak hulls pierced with broadside gunports mark the birth of a permanent standing Royal Navy. Expanding shipyard [buildings|e] and training seasoned [sailors|e] elevates [navy_tradition|e] and [maritime_presence|e], forging wooden walls that shield the island realm and project British [navy|e] power onto the high seas."
 oe_msn_eng_03_royal_navy_charter_req_tt:0 "Own London, Age of Discovery or later, >= 12 Ports, and either Navy Tradition >= 22 or own a Dry Dock/Dock."
 oe_msn_eng_04_bill_of_rights:0 "Bill of Rights & Bank of England"
 oe_msn_eng_04_bill_of_rights_desc:0 "Constitutional balance between monarch, legislature, and a national central bank unlocks low-interest public credit unmatched anywhere in Europe. Harnessing financial [institutions|e], fiscal [buildings|e], and sovereign [parliament|e] trust sets the stage for a decisive constitutional choice over how Crown, Commons, and Admiralty shall steer Britain's global ascent."
 oe_msn_eng_04_bill_of_rights_req_tt:0 "Own London, Stability >= 15, Age of Reformation or later, and either embrace Banking or own a Customs House/Counting House."
 oe_msn_eng_05_dublin_ireland:0 "Emerald Isle: Secure Dublin"
 oe_msn_eng_05_dublin_ireland_desc:0 "Controlling Dublin and the Irish Sea ports denies continental rivals a western staging ground on England's flank. Consolidating Dublin as a loyal [core|e] strengthens imperial [control|e] across the western approaches, secures vital [sailors|e] and shipping lanes, and clears the sea road toward the open Atlantic."
 oe_msn_eng_05_dublin_ireland_req_tt:0 "Own Dublin, and either >= 10 Ports or Stability >= 10."
 oe_msn_eng_06_edinburgh_union:0 "Union of the Crowns: Edinburgh"
 oe_msn_eng_06_edinburgh_union_desc:0 "Bringing Edinburgh and the Scottish crown into permanent union with London ends centuries of bloody border marches and the Auld Alliance threat. Securing northern [core|e] harmony raises British [stability|e], unleashes shared [prosperity|e] and scholarly vigor, and unites the whole island behind a single oceanic destiny."
 oe_msn_eng_06_edinburgh_union_req_tt:0 "Own or non-sovereign subject-own Edinburgh, and either Stability >= 12 or Great Power status."
 oe_msn_eng_07_atlantic_ventures:0 "North Atlantic Routes & Charters"
 oe_msn_eng_07_atlantic_ventures_desc:0 "From Bristol and Plymouth, chartered explorers cross the roaring North Atlantic to map Newfoundland fisheries and plant overseas trading settlements. Embracing oceanic [institutions|e] and harnessing veteran [navy_tradition|e] fuels overseas [colony|e] expansion and booming Atlantic [trade|e], turning Britain from an island perimeter into the hub of a maritime empire."
 oe_msn_eng_07_atlantic_ventures_req_tt:0 "Own London and Dublin, Age of Discovery or later, and either embrace New World or Navy Tradition >= 25."
 oe_msn_eng_08_indian_entrepot:0 "East India Factory: Surat or Ocean Fleet"
 oe_msn_eng_08_indian_entrepot_desc:0 "Armed with royal charters and broadside Indiamen, British merchants establish fortified factories in Gujarat and extend oceanic reach from the Atlantic to the Indian Ocean. Achieving global [great_power|e] stature multiplies long-distance [trade|e], strengthens [maritime_presence|e], and channels Asian calico, tea, and spices directly to London's docks."
 oe_msn_eng_08_indian_entrepot_req_tt:0 "Own or non-sovereign subject-own Surat (or own Edinburgh), >= 40 Locations, and Great Power status."
 oe_msn_eng_09_woolen_broadcloth:0 "English Broadcloth Manufactures"
 oe_msn_eng_09_woolen_broadcloth_desc:0 "By weaving English fleeces at home instead of shipping raw wool across to Flanders, Tudor and Stuart workshops capture the lion's share of European textile value. Investing in specialized cloth [buildings|e] lifts urban [prosperity|e] and [development|e], enriching domestic [market|e] guilds and pouring steady customs [gold|e] into the London Exchequer."
 oe_msn_eng_09_woolen_broadcloth_req_tt:0 "Own London and York, Treasury >= 350 Gold, and own a Cloth Guild or Cloth Workshop."
 oe_msn_eng_10_navigation_clearing:0 "Navigation Acts & London Clearing"
 oe_msn_eng_10_navigation_clearing_desc:0 "Enforcing the Navigation Acts channels colonial tobacco, sugar, and Asian cargoes aboard British hulls straight into London's bonded warehouses and insurance exchanges. Backed by maritime [buildings|e] and dominant [trade|e] clearing, the Thames grows into the world's premier [market|e], accumulating unmatched reserves of commercial [gold|e] and merchant [sailors|e]."
 oe_msn_eng_10_navigation_clearing_req_tt:0 "Own London, Treasury >= 500 Gold, Monthly Trade & Tax Income >= 38, and either >= 16 Ports or own a Port Authority/Merchants Quarters."
 oe_msn_eng_11_royal_society:0 "Royal Society & Industrial Enlightenment"
 oe_msn_eng_11_royal_society_desc:0 "Under the motto Nullius in Verba, London's Royal Society and Scottish philosophers unite experimental physics, chronometer navigation, and mechanical engineering. Fostering scholarly [institutions|e] and university [buildings|e] propels national [literacy|e], [cultural_tradition|e], and industrial [advances|e] toward the threshold of steam and steel."
 oe_msn_eng_11_royal_society_req_tt:0 "Own London, Stability >= 18, Age of Reformation or later, and either embrace Printing Press or own a University/Printing Press Shop."
 oe_msn_eng_12_rule_britannia:0 "Rule Britannia: Global Sea & Industry"
 oe_msn_eng_12_rule_britannia_desc:0 "With the British Isles united in constitutional harmony, Royal Navy squadrons patrolling every ocean, and London's workshops humming with invention, Britannia rules the waves. Crowned as a global [great_power|e] backed by towering [capital|e] [development|e], [stability|e], and [prestige|e], Westminster now proclaims the grand imperial vision of Britain's modern century."
 oe_msn_eng_12_rule_britannia_req_tt:0 "Complete all three branches, own London and Dublin, own or non-sovereign subject-own Edinburgh, Stability >= 18, Age of Absolutism or later, Great Power status, and Capital Development >= 32."
 oe_msn_spa_destiny:0 "#bold #color_yellow Plus Ultra: Spanish Twin-Ocean Destiny#!#!"
 oe_msn_spa_destiny_DESCRIPTION:0 "From Reconquista to Tercios, Potosi Silver, and Manila Galleons"
 oe_msn_spa_destiny_CRITERIA_DESCRIPTION:0 "Complete the Reconquista, unite Castile and Aragon, field the Tercios, and link Potosi to Manila."
 oe_msn_spa_destiny_BUTTON_TOOLTIP:0 "Embark on the Spanish Destiny"
 oe_msn_spa_destiny_BUTTON_DETAILS:0 "Links directly with Eurasian Economy 2.0 and the Silver Tide: finish the Reconquista, unite Castile and Aragon, field the Tercios, and command the Seville-Potosi-Manila bullion loop."
 STATIC_MODIFIER_NAME_oe_msn_spa_m1:0 "Spanish Tercios & Marine Infantry"
 STATIC_MODIFIER_DESC_oe_msn_spa_m1:0 "Disciplined pike-and-shot Tercios and royal marines dominate European and colonial battlefields."
 STATIC_MODIFIER_NAME_oe_msn_spa_m2:0 "United Iberia & Twin-Ocean Viceroyalties"
 STATIC_MODIFIER_DESC_oe_msn_spa_m2:0 "United Iberian kingdoms and oceanic viceroyalties project royal power across both hemispheres."
 STATIC_MODIFIER_NAME_oe_msn_spa_m3:0 "Casa de Contratacion & Siglo de Oro"
 STATIC_MODIFIER_DESC_oe_msn_spa_m3:0 "The School of Salamanca and regulated bullion clearing channel silver wealth into enduring prosperity."
 STATIC_MODIFIER_NAME_oe_msn_spa_m4:0 "Plus Ultra: Twin-Ocean Imperial Destiny"
 STATIC_MODIFIER_DESC_oe_msn_spa_m4:0 "Crowned with Tercios, transoceanic silver lanes, and Golden Age brilliance, Spain rules two oceans."
 oe_msn_spa_01_castile_aragon_core:0 "Iberian Crown Core: Toledo & Barcelona"
 oe_msn_spa_01_castile_aragon_core_desc:0 "From the fortified mesas of Castile to the merchant guilds of Catalonia, the Christian kingdoms of Iberia stand poised to unite a peninsula forged by seven centuries of frontier war. Strengthening core [buildings|e], raising [capital|e] [development|e], and anchoring royal [stability|e] marshals Iberia's [manpower|e] for the final campaign of the Reconquista."
 oe_msn_spa_01_castile_aragon_core_req_tt:0 "Own Valladolid, Toledo, or Barcelona, Stability >= 5, and either Capital Development >= 16 or own a Castle/Marketplace."
 oe_msn_spa_02_tercio_pike_shot:0 "Forge the Spanish Tercios"
 oe_msn_spa_02_tercio_pike_shot_desc:0 "Blending dense hedges of steel pikes with disciplined sleeves of arquebusiers and Toledo sword-and-buckler veterans, the Spanish Tercio rewrites the art of war. Embracing gunpowder [advances|e] and rigorous drill lifts [army_tradition|e], fielding hardened professional [regulars|e] whose iron discipline makes the Spanish [army|e] the terror of every European battlefield."
 oe_msn_spa_02_tercio_pike_shot_req_tt:0 "Own Toledo/Barcelona/Seville, Treasury >= 220 Gold, Age of Discovery or later, and either Pike and Shot advance, Army Tradition >= 22, or a Training Fields."
 oe_msn_spa_03_marine_infantry:0 "Royal Marines & Treasure Escorts"
 oe_msn_spa_03_marine_infantry_desc:0 "To guard silver galleons against corsairs and contest the Mediterranean against Ottoman fleets, the Crown establishes the world's oldest permanent Infanteria de Marina. Backing naval [buildings|e] with veteran [sailors|e] and soaring [navy_tradition|e] projects formidable [maritime_presence|e] wherever the royal [navy|e] sails across two oceans."
 oe_msn_spa_03_marine_infantry_req_tt:0 "Own Seville or Barcelona, Age of Discovery or later, >= 12 Ports, and either Navy Tradition >= 20 or own a Dry Dock/Dock."
 oe_msn_spa_04_viceroyalty_council:0 "Council of the Indies & Viceroyalties"
 oe_msn_spa_04_viceroyalty_council_desc:0 "Governing a global composite monarchy spanning Iberia, Italy, and overseas viceroyalties stretches medieval councils to the breaking point. Organizing the Council of the Indies and loyal Adelantado [subjects|e] through an efficient [cabinet|e] sharpens imperial [control|e] and [crown_power|e], summoning Madrid to decide how its two hemispheres shall be ruled."
 oe_msn_spa_04_viceroyalty_council_req_tt:0 "Own Toledo/Seville/Barcelona, Age of Reformation or later, >= 40 Locations, and either an Adelantado subject, >= 2 Subjects, or Monthly Trade & Tax Income >= 38."
 oe_msn_spa_05_reconquista_granada:0 "Finish the Reconquista: Granada"
 oe_msn_spa_05_reconquista_granada_desc:0 "As the royal banners unfurl above the red towers of the Alhambra, the eight-century Reconquista reaches its triumphant consummation. Securing Granada as an eternal [core|e] brings immense [prestige|e], deepens [religious_influence|e], and rewards clerical [estate_satisfaction|e], freeing Spain's boundless energy to sail beyond the Pillars of Hercules."
 oe_msn_spa_05_reconquista_granada_req_tt:0 "Own Granada."
 oe_msn_spa_06_iberian_union:0 "Twin Crowns: Seville & Barcelona"
 oe_msn_spa_06_iberian_union_desc:0 "Uniting Castilian Seville on the Atlantic with Aragonese Barcelona on the Mediterranean fuses two proud maritime traditions beneath one Catholic Monarchy. Integrating both ports as solid [core|e] gateways multiplies dual-sea [trade|e], strengthens dynastic [legitimacy|e], and links Iberian [prosperity|e] directly to Naples, Sicily, and the New World."
 oe_msn_spa_06_iberian_union_req_tt:0 "Own Seville and Barcelona, and either >= 10 Ports or Stability >= 10."
 oe_msn_spa_07_potosi_silver_mountain:0 "Andean Silver: Potosi or New World Reach"
 oe_msn_spa_07_potosi_silver_mountain_desc:0 "From the silver veins of Cerro Rico in Potosi—or through towering Iberian Atlantic customs—rivers of bullion flood the royal mints of Spain. Harnessing transoceanic [institutions|e] and colonial [trade|e] fills imperial chests with dazzling [gold|e], though wise treasurers must guard carefully against silver-driven [inflation|e] while funding Spain's global ambitions."
 oe_msn_spa_07_potosi_silver_mountain_req_tt:0 "Own or non-sovereign subject-own Potosi (or own Seville), >= 50 Locations, and either embrace New World or Monthly Trade & Tax Income >= 38."
 oe_msn_spa_08_manila_galleon_port:0 "Pacific Crown: Manila Galleon Run"
 oe_msn_spa_08_manila_galleon_port_desc:0 "As heavy Manila Galleons ride the Pacific trade winds carrying pieces of eight to trade for Chinese silk and porcelain, humanity's first truly planetary economy is born. Securing global [great_power|e] dominance and twin-ocean [maritime_presence|e] turns Spanish silver into the universal currency of transcontinental [trade|e] and [prestige|e]."
 oe_msn_spa_08_manila_galleon_port_req_tt:0 "Own or non-sovereign subject-own Manila (or own Seville), Age of Reformation or later, and Great Power status."
 oe_msn_spa_09_seville_contratacion:0 "Casa de Contratacion & Bullion Assay"
 oe_msn_spa_09_seville_contratacion_desc:0 "Inside Seville's Casa de Contratacion, royal assayers verify bullion purity while chief pilots guard the Padron Real master sea chart of the globe. Erecting commercial [buildings|e] and tightening fiscal [control|e] over transoceanic [market|e] flows enriches royal coffers with [gold|e] and elevates Andalusia into the financial heart of the Atlantic."
 oe_msn_spa_09_seville_contratacion_req_tt:0 "Own Seville, Treasury >= 350 Gold, Monthly Trade & Tax Income >= 26, and own a Counting House or Marketplace."
 oe_msn_spa_10_school_salamanca:0 "School of Salamanca & Monetary Theory"
 oe_msn_spa_10_school_salamanca_desc:0 "At the University of Salamanca, jurists and economists pioneer international law and uncover the quantity theory of money to explain the price revolution. Backing academic [buildings|e] and economic [institutions|e] lifts [literacy|e], deepens [cultural_tradition|e], and equips the Crown with sound monetary wisdom to tame [inflation|e]."
 oe_msn_spa_10_school_salamanca_req_tt:0 "Own Valladolid/Toledo/Seville, Stability >= 12, Age of Discovery or later, and either embrace Banking or own a University/Printing Press Shop."
 oe_msn_spa_11_siglo_de_oro:0 "Siglo de Oro & Royal Academy"
 oe_msn_spa_11_siglo_de_oro_desc:0 "Painters of luminous shadow, playwrights of the Madrid corrales, and royal architects turn imperial wealth into the immortal splendor of Spain's Siglo de Oro. Sustaining artistic [buildings|e] and printing [institutions|e] enriches [cultural_tradition|e], boosts [prestige|e], and accelerates modern [advances|e] across every province of the monarchy."
 oe_msn_spa_11_siglo_de_oro_req_tt:0 "Own Toledo/Seville/Barcelona, Stability >= 15, Age of Reformation or later, and either own an Arts Academy/University or embrace Printing Press."
 oe_msn_spa_12_plus_ultra_destiny:0 "Plus Ultra: Twin-Ocean Imperial Destiny"
 oe_msn_spa_12_plus_ultra_destiny_desc:0 "True to the motto Plus Ultra, the banners of unified Spain span Iberia, the Americas, and the Pacific islands in an empire upon which the sun never sets. Reigning as a paramount [great_power|e] backed by soaring [capital|e] [development|e], [stability|e], and global [prestige|e], the Crown now convenes the grand imperial cortez to seal Spain's modern destiny."
 oe_msn_spa_12_plus_ultra_destiny_req_tt:0 "Complete all three branches, own Seville and Granada, Stability >= 15, Age of Absolutism or later, Great Power status, and Capital Development >= 30."
 oe_msn_por_destiny:0 "#bold #color_yellow Estado da India: Portuguese Oceanic Destiny#!#!"
 oe_msn_por_destiny_DESCRIPTION:0 "From Lisbon's Navigators to Goa, Malacca, and the Spice Islands"
 oe_msn_por_destiny_CRITERIA_DESCRIPTION:0 "Take Ceuta, round the Cape, establish Goa and Malacca, and command the Indian Ocean spice route."
 oe_msn_por_destiny_BUTTON_TOOLTIP:0 "Embark on the Portuguese Destiny"
 oe_msn_por_destiny_BUTTON_DETAILS:0 "From Lisbon, Porto, and Ceuta, pioneer oceanic navigation around the Cape, secure Goa, Kozhikode, Malacca, and Ternate, and build a maritime spice empire spanning half the globe."
 STATIC_MODIFIER_NAME_oe_msn_por_m1:0 "Avis Navigators & Royal Bombardeiros"
 STATIC_MODIFIER_DESC_oe_msn_por_m1:0 "Celestial navigation and skilled naval gunners give Portugal unmatched oceanic reach."
 STATIC_MODIFIER_NAME_oe_msn_por_m2:0 "Estado da India Fortress Network"
 STATIC_MODIFIER_DESC_oe_msn_por_m2:0 "Fortified coastal factories from Ceuta to Malacca turn the Indian Ocean into a Portuguese lake."
 STATIC_MODIFIER_NAME_oe_msn_por_m3:0 "Casa da India & Oceanic Spice Monopoly"
 STATIC_MODIFIER_DESC_oe_msn_por_m3:0 "Pepper, cloves, and porcelain funneling through Lisbon give the crown imperial revenues."
 STATIC_MODIFIER_NAME_oe_msn_por_m4:0 "Oceanic Spice Empire Destiny"
 STATIC_MODIFIER_DESC_oe_msn_por_m4:0 "With invincible oceanic fleets and worldwide spice factories, Portugal crowns the Age of Sail."
 oe_msn_por_01_lisbon_porto:0 "Lisbon & Porto: Atlantic Departure"
 oe_msn_por_01_lisbon_porto_desc:0 "Sheltered behind the Tagus estuary and the Douro cliffs, Lisbon and Porto gaze directly onto the swelling Atlantic winds beyond Cape St. Vincent. Outfitting royal quays nurtures [navy_tradition|e], builds [maritime_presence|e], and prepares our [sailors|e] and [capital|e] for oceanic destiny."
 oe_msn_por_01_lisbon_porto_req_tt:0 "Own Lisbon and Porto, have 5 Stability, a port, and a Wharf."
 oe_msn_por_02_caravel_bombardeiros:0 "Caravels & Naval Bombardeiros"
 oe_msn_por_02_caravel_bombardeiros_desc:0 "Lateen-rigged caravels beat windward down Africa's uncharted coast while square-rigged caravelas redondas mount bronze broadside guns cast in Lisbon's foundries. Pairing seamanship with heavy ordnance turns [gold|e] and [buildings|e] into unbeatable [navy|e] fire and [navy_tradition|e]."
 oe_msn_por_02_caravel_bombardeiros_req_tt:0 "Own Lisbon in the Age of Renaissance or later, hold 200 Gold, 20 Navy Tradition, and own a Dock or Cannon Maker."
 oe_msn_por_03_ordenancas_militia:0 "Ordenancas & Overseas Garrisons"
 oe_msn_por_03_ordenancas_militia_desc:0 "Because a small Atlantic kingdom must defend fortresses across three oceans, King Sebastian's Ordenancas register every parish for disciplined pike-and-musket musters. Embracing [institutions|e] multiplies homeland [manpower|e], drills colonial [regulars|e], and lifts [army_tradition|e]."
 oe_msn_por_03_ordenancas_militia_req_tt:0 "Own Lisbon in the Age of Discovery or later, own a Training Fields or Armory, and embrace New World."
 oe_msn_por_04_colonial_governors:0 "Estado da India Governors & Cartaz"
 oe_msn_por_04_colonial_governors_desc:0 "Under royal regimentos and the cartaz maritime pass system, viceroys from Mozambique to Hormuz and Goa regulate Asian sea traffic in the king's name. Centralized [cabinet|e] oversight harnesses global [institutions|e], extends oceanic [control|e], and maximizes imperial [trade|e]."
 oe_msn_por_04_colonial_governors_req_tt:0 "Own Lisbon in the Age of Reformation or later, have 15 Stability, a Port Authority or Customs House, and embrace Global Trade."
 oe_msn_por_05_ceuta_gateway:0 "African Foothold: Seize Ceuta"
 oe_msn_por_05_ceuta_gateway_desc:0 "Stormed in 1415 under the banners of Aviz, Ceuta guards the Pillars of Hercules and reveals the Saharan gold trails that spur Prince Henry's expeditions southward. Holding this North African [core|e] strengthens our strait [fort|e], enhances [maritime_presence|e], and wins crusading [prestige|e]."
 oe_msn_por_05_ceuta_gateway_req_tt:0 "Control Ceuta (directly or via subject) and hold at least 4 ports."
 oe_msn_por_06_cape_voyage:0 "Round the Cape into the Indian Ocean"
 oe_msn_por_06_cape_voyage_desc:0 "Following Bartolomeu Dias and Vasco da Gama past the Cape of Good Hope, Portuguese astrolabes and monsoon pilots shatter the overland monopoly on Asian spices. Mastery of ocean gyres proves unmatched [navy_tradition|e], awards global [prestige|e], and guides [sailors|e] into eastern [trade|e]."
 oe_msn_por_06_cape_voyage_req_tt:0 "Own Lisbon and control Ceuta in the Age of Discovery or later, have 28 Navy Tradition, and own a Dry Dock."
 oe_msn_por_07_goa_kozhikode:0 "Triumph of Diu & Viceroyalty of Goa"
 oe_msn_por_07_goa_kozhikode_desc:0 "Victory off Diu and Afonso de Albuquerque's capture of Goa establish a fortified vice-regal capital along the pepper-rich Malabar coast. Holding this Indian [core|e] anchors eastern [navy|e] squadrons, redirects spice [market|e] flows, and fills royal [gold|e] chests."
 oe_msn_por_07_goa_kozhikode_req_tt:0 "Control Goa or Kozhikode (or own Lisbon), hold 25 locations, and control at least 8 ports."
 oe_msn_por_08_malacca_ternate:0 "Malacca & the Moluccan Spice Isles"
 oe_msn_por_08_malacca_ternate_desc:0 "He who is lord of Malacca has his hand on the throat of Venice, and beyond its strait lie the clove groves of Ternate and the silk junks of Macau. Holding the eastern choke points crowns [maritime_presence|e], seals spice [trade|e], and builds monumental [gold|e] and [prestige|e]."
 oe_msn_por_08_malacca_ternate_req_tt:0 "Control Malacca, Ternate, or Goa in the Age of Reformation or later, and have at least 35 Navy Tradition."
 oe_msn_por_09_porto_wine_gold:0 "Porto Commerce & Atlantic Plantations"
 oe_msn_por_09_porto_wine_gold_desc:0 "Terraced Douro vineyards, Madeira sugar mills, and Azorean wheat barns weave mainland Portugal and the Atlantic islands into a resilient commercial hinterland. Growing [market|e] exports reward loyal [estates|e], raise coastal [prosperity|e], and steady domestic [gold|e] inflows."
 oe_msn_por_09_porto_wine_gold_req_tt:0 "Own Lisbon and Porto, hold 300 Gold, earn 20 monthly trade & tax income, and own a Marketplace."
 oe_msn_por_10_casa_da_india:0 "Casa da India: Global Spice Clearing"
 oe_msn_por_10_casa_da_india_desc:0 "Rising beside the Ribeira palace, the Casa da India weighs every bale of pepper, cinnamon, porcelain, and Brazilian sugar arriving on the annual Carreira fleets. Concentrating oceanic [trade|e] inside our [capital|e] [buildings|e] transforms Lisbon into Europe's golden [development|e] showcase."
 oe_msn_por_10_casa_da_india_req_tt:0 "Own Lisbon in the Age of Discovery or later, hold 450 Gold, earn 35 monthly income, and own a Trading Hub or Merchants Quarters."
 oe_msn_por_11_pombaline_renewal:0 "Pombaline Renewal & Enlightened Commerce"
 oe_msn_por_11_pombaline_renewal_desc:0 "Wide seismic-grid boulevards, chartered wine companies, and secularized universities remake Lisbon along Pombaline lines of rational administration and mercantile rigor. Decisive [cabinet|e] reform strengthens [crown_power|e], lifts [estate_satisfaction|e], and accelerates [advances|e]."
 oe_msn_por_11_pombaline_renewal_req_tt:0 "Own Lisbon in the Age of Reformation or later, have 15 Stability, 28 Capital Development, and 55% Burghers Satisfaction."
 oe_msn_por_12_oceanic_spice_empire:0 "Twin-Ocean Spice Empire Destiny"
 oe_msn_por_12_oceanic_spice_empire_desc:0 "With the armillary sphere gleaming over Atlantic Brazil, African forts, and Asian spice emporia, Portugal rules the first truly global thalassocracy without rival. Acclaimed as a [great_power|e], the crown unites [navy|e], oceanic [trade|e], and [maritime_presence|e] across two oceans."
 oe_msn_por_12_oceanic_spice_empire_req_tt:0 "Own Lisbon and control Ceuta in the Age of Absolutism or later, have 15 Stability, a Stock Exchange or Shipyard, and be a Great Power or earn 70 monthly income."
 oe_msn_hab_destiny:0 "#bold #color_yellow AEIOU: Habsburg Danubian Destiny#!#!"
 oe_msn_hab_destiny_DESCRIPTION:0 "From Alpine Patrimony to Danubian Monarchy and Enlightened Rule"
 oe_msn_hab_destiny_CRITERIA_DESCRIPTION:0 "Secure Vienna, unite Prague and Buda, build the Military Frontier, and crown an enlightened empire."
 oe_msn_hab_destiny_BUTTON_TOOLTIP:0 "Embark on the Habsburg Destiny"
 oe_msn_hab_destiny_BUTTON_DETAILS:0 "Links with the Contest of Two Emperors: consolidate Alpine lands around Vienna, unite Bohemia and Hungary through marriage diplomacy, fortify the Military Frontier, and modernize Central Europe."
 STATIC_MODIFIER_NAME_oe_msn_hab_m1:0 "Habsburg Marriage Diplomacy & Aulic Council"
 STATIC_MODIFIER_DESC_oe_msn_hab_m1:0 "Dynastic diplomacy and the Aulic Council knit Central European crowns together smoothly."
 STATIC_MODIFIER_NAME_oe_msn_hab_m2:0 "Danubian Triple Crown & Military Frontier"
 STATIC_MODIFIER_DESC_oe_msn_hab_m2:0 "Uniting Vienna, Prague, and Buda behind the Military Frontier fortifies Central Europe."
 STATIC_MODIFIER_NAME_oe_msn_hab_m3:0 "Viennese Cameralism & State Industry"
 STATIC_MODIFIER_DESC_oe_msn_hab_m3:0 "Cameralist fiscal science, state manufactures, and civic education modernize the monarchy."
 STATIC_MODIFIER_NAME_oe_msn_hab_m4:0 "Danubian Superpower: Enlightened Eagle"
 STATIC_MODIFIER_DESC_oe_msn_hab_m4:0 "Crowned by dynastic legitimacy, reformed regiments, and enlightened industry, Vienna leads Central Europe."
 oe_msn_hab_01_vienna_alpine:0 "Alpine Patrimony: Secure Vienna"
 oe_msn_hab_01_vienna_alpine_desc:0 "Anchored along the upper Danube and the mountain passes of Styria and Tyrol, the Habsburg hereditary lands form the natural keystone of Central Europe. Strengthening Viennese [buildings|e], raising [capital|e] [development|e], and consolidating dynastic [stability|e] equips the Archdukes to claim the wider crowns of the Danube basin."
 oe_msn_hab_01_vienna_alpine_req_tt:0 "Own Vienna, Stability >= 5, Capital Development >= 16, and own a Castle or Marketplace."
 oe_msn_hab_02_marriage_diplomacy:0 "Felix Austria: Dynastic Marriage Policy"
 oe_msn_hab_02_marriage_diplomacy_desc:0 "Bella gerant alii, tu felix Austria nube: while rival kings exhaust their treasuries in endless sieges, Habsburg diplomacy weaves crowns together through marriage and treaty. Cultivating [diplomatic_reputation|e], loyal [subjects|e], and noble [estate_satisfaction|e] elevates Vienna's [diplomacy|e] and [prestige|e] across every court in Christendom."
 oe_msn_hab_02_marriage_diplomacy_req_tt:0 "Own Vienna, Stability >= 10, and either >= 2 Subjects or Nobles Satisfaction >= 55%."
 oe_msn_hab_03_military_frontier:0 "Military Frontier & Alpine Regiments"
 oe_msn_hab_03_military_frontier_desc:0 "Along the contested valleys of Croatia and Slavonia, tax-exempt Grenzer soldier-settlers man watchtowers and star forts against sudden frontier incursions. Maintaining fortified border [buildings|e] and seasoned Alpine regiments raises [army_tradition|e] and deep [manpower|e], turning the Habsburg [army|e] into Europe's stalwart shield along the Danube."
 oe_msn_hab_03_military_frontier_req_tt:0 "Own Vienna, Treasury >= 250 Gold, Age of Discovery or later, and either Army Tradition >= 22 or own a Training Fields/Castle."
 oe_msn_hab_04_aulic_chancery:0 "Aulic Council & Imperial Chancery"
 oe_msn_hab_04_aulic_chancery_desc:0 "Binding German duchies, Bohemian estates, and Hungarian counties into one coherent realm requires far more than a shared dynastic surname. Forging the Aulic War Council and unified [cabinet|e] administration sharpens [crown_power|e] and Danubian [control|e], confronting Vienna with the eternal choice between central chancery authority and federal crownland diets."
 oe_msn_hab_04_aulic_chancery_req_tt:0 "Own Vienna, Age of Reformation or later, >= 35 Locations, and either Monthly Trade & Tax Income >= 36 or >= 3 Subjects."
 oe_msn_hab_05_bohemian_crown:0 "Crown of Bohemia: Unite Prague"
 oe_msn_hab_05_bohemian_crown_desc:0 "Uniting the Crown of Saint Wenceslas with Vienna brings Bohemia's rich silver lodes, glassworks, and storied Prague university beneath the Habsburg eagle. Securing Prague as a prized [core|e] or loyal crownland expands imperial [development|e], swells treasury [gold|e], and reinforces Austrian [legitimacy|e] across the Holy Roman Empire."
 oe_msn_hab_05_bohemian_crown_req_tt:0 "Own or non-sovereign subject-own Prague."
 oe_msn_hab_06_hungarian_crown:0 "Danubian Union: Buda & Bratislava"
 oe_msn_hab_06_hungarian_crown_desc:0 "Wearing the Sacred Crown of Saint Stephen extends Vienna's shield across the fertile Carpathian basin from Pressburg to Buda. Whether governing directly as a fortified [core|e] or through Hungarian [subjects|e], linking the Pannonian plains to Austria deepens strategic [manpower|e] and cements Danubian [control|e]."
 oe_msn_hab_06_hungarian_crown_req_tt:0 "Own or non-sovereign subject-own Buda or Bratislava, and either hold a Hungarian Dominion/Voivodate subject or >= 28 Locations."
 oe_msn_hab_07_italian_foothold:0 "Alpine Reach: Lombardy or Adriatic"
 oe_msn_hab_07_italian_foothold_desc:0 "Reaching south across the Brenner and Karst passes to Lombardy or the Adriatic coast breaks Austria's landlocked isolation. Holding Milan or Adriatic harbors as strategic [core|e] outposts taps directly into Mediterranean [trade|e] and banking [gold|e], broadening Habsburg [diplomacy|e] across both Germany and Italy."
 oe_msn_hab_07_italian_foothold_req_tt:0 "Own or non-sovereign subject-own Milan or Zara (or own Vienna), >= 40 Locations, and either >= 3 Ports or Monthly Trade & Tax Income >= 32."
 oe_msn_hab_08_two_emperors_arbiter:0 "Imperial Arbiter of Central Europe"
 oe_msn_hab_08_two_emperors_arbiter_desc:0 "Caught between Bourbon ambitions in the West and Ottoman or Roman titans in the East, the Double-Headed Eagle rises unbowed as the fulcrum of European equilibrium. Standing as an uncontested [great_power|e] elevates imperial [prestige|e], [diplomatic_reputation|e], and sovereign [legitimacy|e] throughout Central Europe."
 oe_msn_hab_08_two_emperors_arbiter_req_tt:0 "Own Vienna, own or non-sovereign subject-own Prague, >= 45 Locations, and Great Power status."
 oe_msn_hab_09_alpine_trade_mines:0 "Alpine Pass Trade & Tyrolean Silver"
 oe_msn_hab_09_alpine_trade_mines_desc:0 "Silver pouring from Schwaz and Tyrolean galleries, paired with busy north-south Alpine toll roads, finances Habsburg embassies and armies across Europe. Building modern fiscal [buildings|e] and fostering burgher [estate_satisfaction|e] strengthens Vienna's [market|e] credit and feeds steady bullion [gold|e] into the imperial Hofkammer."
 oe_msn_hab_09_alpine_trade_mines_req_tt:0 "Own Vienna, Treasury >= 350 Gold, Monthly Trade & Tax Income >= 24, and own a Counting House or Marketplace."
 oe_msn_hab_10_baroque_vienna:0 "Baroque Vienna: Music & Grandeur"
 oe_msn_hab_10_baroque_vienna_desc:0 "Grand Baroque palaces, gilded concert halls, and symphonic patronage transform the frontier fortress of Vienna into Europe's radiant capital of music and architecture. Endowing cultural [buildings|e] elevates [capital|e] [development|e], boosts [cultural_tradition|e], and projects magnetic [prestige|e] that draws artisans and diplomats from across the continent."
 oe_msn_hab_10_baroque_vienna_req_tt:0 "Own Vienna, Age of Discovery or later, and either own an Art School/Theater or Capital Development >= 24."
 oe_msn_hab_11_enlightened_industry:0 "Enlightened Absolutism & State Industry"
 oe_msn_hab_11_enlightened_industry_desc:0 "Inspired by cameralist reformers, the Habsburgs curb harsh serfdom, expand parish schooling, and nurture Bohemian textile and Styrian iron workshops. Embracing modern [institutions|e] and productive [buildings|e] raises [literacy|e], accelerates [advances|e], and spreads enduring [prosperity|e] across every Danubian crownland."
 oe_msn_hab_11_enlightened_industry_req_tt:0 "Own Vienna, Stability >= 18, Age of Reformation or later, and either embrace Printing Press or own a University/Cloth Workshop."
 oe_msn_hab_12_danubian_super_empire:0 "Danubian Superpower Destiny"
 oe_msn_hab_12_danubian_super_empire_desc:0 "Vienna, Prague, and Buda shine as the triple crown of a Danubian super-empire uniting enlightened statecraft, Baroque grandeur, and formidable modern armies. Crowned as a foremost [great_power|e] with high [capital|e] [development|e], [stability|e], and peerless [prestige|e], the Double-Headed Eagle now proclaims its lasting imperial synthesis."
 oe_msn_hab_12_danubian_super_empire_req_tt:0 "Complete all three branches, own Vienna, own or non-sovereign subject-own Prague and Buda, Stability >= 15, Age of Absolutism or later, Great Power status, and Capital Development >= 30."
 oe_msn_swe_destiny:0 "#bold #color_yellow Lion of the North: Swedish Baltic Destiny#!#!"
 oe_msn_swe_destiny_DESCRIPTION:0 "From Vasa Independence to Dominium Maris Baltici"
 oe_msn_swe_destiny_CRITERIA_DESCRIPTION:0 "Break Kalmar tutelage, ring the Baltic Sea, pioneer linear firepower, and rule the North."
 oe_msn_swe_destiny_BUTTON_TOOLTIP:0 "Embark on the Swedish Destiny"
 oe_msn_swe_destiny_BUTTON_DETAILS:0 "Rise from Stockholm, Kalmar, and Abo to shatter Kalmar tutelage, turn Swedish copper and iron into a military revolution, and forge Dominium Maris Baltici."
 STATIC_MODIFIER_NAME_oe_msn_swe_m1:0 "Gustavian Combined-Arms Revolution"
 STATIC_MODIFIER_DESC_oe_msn_swe_m1:0 "Mobile regimental guns, salvo musketry, and shock cavalry redefine European warfare."
 STATIC_MODIFIER_NAME_oe_msn_swe_m2:0 "Dominium Maris Baltici"
 STATIC_MODIFIER_DESC_oe_msn_swe_m2:0 "Ringing the Baltic from Tallinn and Riga to the Sound secures unmatched northern power."
 STATIC_MODIFIER_NAME_oe_msn_swe_m3:0 "Swedish Steel, Copper & Royal Post"
 STATIC_MODIFIER_DESC_oe_msn_swe_m3:0 "Copper mines, fine ironworks, and the Royal Post Office finance a nimble northern superpower."
 STATIC_MODIFIER_NAME_oe_msn_swe_m4:0 "Lion of the North: Baltic Superpower"
 STATIC_MODIFIER_DESC_oe_msn_swe_m4:0 "Disciplined arms, Baltic customs, and fine steel crown Sweden as the enduring Lion of the North."
 oe_msn_swe_01_stockholm_kalmar:0 "Free Sweden: Stockholm & Kalmar"
 oe_msn_swe_01_stockholm_kalmar_desc:0 "Breaking free of Kalmar tutelage, royal banners rise over Stockholm's archipelago and Kalmar's southern bastion, restoring sovereign Swedish kingship. Securing our island [capital|e] affirms national [legitimacy|e], rallies free yeoman [estates|e], and anchors coastal [control|e]."
 oe_msn_swe_01_stockholm_kalmar_req_tt:0 "Own Stockholm, control Kalmar (directly or via subject), have 5 Stability, a port, and a Castle."
 oe_msn_swe_02_vasa_central_fisc:0 "Vasa Central Fisc & Allotment Army"
 oe_msn_swe_02_vasa_central_fisc_desc:0 "Gustav Vasa's bailiffs audit every homestead and mine while the allotment system binds provincial farms to maintain native regiments year-round without bankrupting the realm. Strengthening [crown_power|e] unlocks reliable [manpower|e], lifts [army_tradition|e], and balances [gold|e] accounts."
 oe_msn_swe_02_vasa_central_fisc_req_tt:0 "Own Stockholm, have 10 Stability, 15 Army Tradition, and 45% Peasants Satisfaction."
 oe_msn_swe_03_salvo_regimental_guns:0 "Military Revolution: Salvo & Light Guns"
 oe_msn_swe_03_salvo_regimental_guns_desc:0 "Replacing ponderous tercios with shallow brigades, rolling musket salvos, and three-pounder regimental guns, Sweden pioneers combined-arms shock warfare across Europe. Embracing [institutions|e] turns drilled [regulars|e] into a lethal [army|e], soaring [army_tradition|e] with every victory."
 oe_msn_swe_03_salvo_regimental_guns_req_tt:0 "Own Stockholm in the Age of Reformation or later, hold 220 Gold, own a Barracks or Cannon Maker, and embrace Artillery."
 oe_msn_swe_04_carolean_absolutism:0 "Carolean Discipline & Royal Absolutism"
 oe_msn_swe_04_carolean_absolutism_desc:0 "Through the Great Reduction of noble fiefs and the rigid Gaa Paa shock doctrine of the Carolean regiments, the Swedish crown commands unmatched administrative and tactical discipline. Uniting [cabinet|e] efficiency with [crown_power|e] sustains [stability|e] and relentless [regulars|e] cohesion."
 oe_msn_swe_04_carolean_absolutism_req_tt:0 "Own Stockholm in the Age of Reformation or later, have 15 Stability, 35 Army Tradition, and 22 Capital Development."
 oe_msn_swe_05_abo_finland_gulf:0 "Across the Gulf: Secure Abo"
 oe_msn_swe_05_abo_finland_gulf_desc:0 "Across the island-studded Aland Sea, Abo Castle and its bishopric anchor the eastern half of the realm and supply hardy Hakkapeliitta light horse. Integrating this Finnish [core|e] safeguards gulf [maritime_presence|e], bolsters [manpower|e], and extends royal [control|e]."
 oe_msn_swe_05_abo_finland_gulf_req_tt:0 "Control Abo (directly or via subject) and own at least one Wharf."
 oe_msn_swe_06_estonia_tallinn_narva:0 "Eastern Baltic: Tallinn & Narva"
 oe_msn_swe_06_estonia_tallinn_narva_desc:0 "Securing Reval's limestone walls and Narva's river fortress places the eastern Baltic fur, flax, and Russian timber routes firmly beneath Swedish customs ships. Holding this eastern [core|e] fortifies our [fort|e] screen, boosts [navy_tradition|e], and captures northern [trade|e]."
 oe_msn_swe_06_estonia_tallinn_narva_req_tt:0 "Control Tallinn or Narva (directly or via subject) and hold at least 5 ports."
 oe_msn_swe_07_livonia_riga:0 "Pearl of Livonia: Capture Riga"
 oe_msn_swe_07_livonia_riga_desc:0 "Once Riga's merchants swear fealty to Stockholm, the grandest city of the Swedish crown pays customs duties on every barge descending the Daugava. Anchoring this Livonian [core|e] enriches royal [gold|e], deepens Baltic [market|e] reach, and elevates imperial [prosperity|e]."
 oe_msn_swe_07_livonia_riga_req_tt:0 "Control Riga (directly or via subject) and have at least 22 Army Tradition."
 oe_msn_swe_08_sound_copenhagen:0 "Baltic Straits: Copenhagen or Ring Mastery"
 oe_msn_swe_08_sound_copenhagen_desc:0 "Marching across frozen belts or commanding every major eastern harbor breaks the Sound Toll chokehold and seals Dominium Maris Baltici in Swedish hands. Dominating northern sea lanes empowers our [navy|e], maximizes [maritime_presence|e], and secures naval [prestige|e] and [trade|e]."
 oe_msn_swe_08_sound_copenhagen_req_tt:0 "Control Copenhagen or Riga (directly or via subject) and hold at least 8 ports."
 oe_msn_swe_09_falun_copper_coins:0 "Great Copper Mountain & Royal Mint"
 oe_msn_swe_09_falun_copper_coins_desc:0 "Stora Kopparberget at Falun supplies two-thirds of Europe's copper, underwriting Swedish war chests, Dutch credits, and royal plate-money coinage. Channeling mineral output through chartered [market|e] houses curbs [inflation|e], builds [gold|e], and boosts urban [prosperity|e]."
 oe_msn_swe_09_falun_copper_coins_req_tt:0 "Own Stockholm, hold 300 Gold, earn 20 monthly trade & tax income, and own a Marketplace."
 oe_msn_swe_10_swedish_steel_post:0 "Swedish Steelworks & Royal Post"
 oe_msn_swe_10_swedish_steel_post_desc:0 "Walloon ironmasters at Bergslagen forge Europe's purest bar iron and bronze ordnance while Axel Oxenstierna's postal relays carry royal dispatches across snow and sea. Upgraded industrial [buildings|e] deepen [control|e], expand [trade|e], and push capital [development|e] upward."
 oe_msn_swe_10_swedish_steel_post_req_tt:0 "Own Stockholm in the Age of Discovery or later, earn 30 monthly income, and own a Trading Hub or Weapon Guild."
 oe_msn_swe_11_polhem_mechanical_age:0 "Northern Engineering & Royal Academy"
 oe_msn_swe_11_polhem_mechanical_age_desc:0 "From Uppsala's halls to Christopher Polhem's mechanical workshop and the Royal Academy of Sciences, Swedish engineering turns timber, waterpower, and botany into statecraft. High [literacy|e] and modern [institutions|e] spur technical [advances|e] alongside luminous [cultural_tradition|e]."
 oe_msn_swe_11_polhem_mechanical_age_req_tt:0 "Own Stockholm in the Age of Reformation or later, have 15 Stability, a University or Printing Press Shop, and embrace Printing Press."
 oe_msn_swe_12_lion_of_the_north:0 "Lion of the North: Baltic Imperium"
 oe_msn_swe_12_lion_of_the_north_desc:0 "No Poltava breaks the Lion of the North: ringed by iron foundries, coastal fortresses, and disciplined brigades, the Baltic has become a Swedish lake. Standing tall as a [great_power|e], Sweden commands [army|e] discipline, [navy|e] mastery, and European [diplomatic_reputation|e]."
 oe_msn_swe_12_lion_of_the_north_req_tt:0 "Own Stockholm and control Kalmar and Riga in the Age of Absolutism or later, have 15 Stability, an Iron Foundry or Star Fort, and be a Great Power or earn 65 monthly income."
 oe_msn_tim_destiny:0 "#bold #color_yellow Stars of Samarkand: Timurid Imperial Destiny#!#!"
 oe_msn_tim_destiny_DESCRIPTION:0 "From Samarkand's Observatory to Transoxianan Gunpowder Empire"
 oe_msn_tim_destiny_CRITERIA_DESCRIPTION:0 "Secure Transoxiana and Herat, sponsor Ulugh Beg's Renaissance, take Persia or India, and build a gunpowder empire."
 oe_msn_tim_destiny_BUTTON_TOOLTIP:0 "Embark on the Timurid Destiny"
 oe_msn_tim_destiny_BUTTON_DETAILS:0 "Pairs with the Steppe Gunpowder line: anchor Samarkand and Bukhara, discipline Suyurghal fiefs, ignite the Timurid Renaissance at Herat and Samarkand, and rule inner Asia."
 STATIC_MODIFIER_NAME_oe_msn_tim_m1:0 "Reformed Suyurghal & Timurid Arms"
 STATIC_MODIFIER_DESC_oe_msn_tim_m1:0 "Turco-Persian heavy cavalry backed by siege artillery sweeps across plateau and steppe."
 STATIC_MODIFIER_NAME_oe_msn_tim_m2:0 "Crossroads of Eurasia: Tabriz to Oxus"
 STATIC_MODIFIER_DESC_oe_msn_tim_m2:0 "Holding Transoxiana, Khorasan, and western Iran commands the strategic rooftop of Asia."
 STATIC_MODIFIER_NAME_oe_msn_tim_m3:0 "Timurid Renaissance & Ulugh Beg Tables"
 STATIC_MODIFIER_DESC_oe_msn_tim_m3:0 "Samarkand astronomy and Herat's architectural wonders raise Islamic learning to its zenith."
 STATIC_MODIFIER_NAME_oe_msn_tim_m4:0 "Gunpowder Empire of Samarkand"
 STATIC_MODIFIER_DESC_oe_msn_tim_m4:0 "Defeating dynastic fragmentation, the house of Timur endures as Asia's radiant gunpowder empire."
 oe_msn_tim_01_samarkand_bukhara:0 "Transoxianan Twin Jewels: Samarkand & Bukhara"
 oe_msn_tim_01_samarkand_bukhara_desc:0 "Irrigated by the Zeravshan River, turquoise-domed Samarkand and scholarly Bukhara formed the emerald cradle of Timurid majesty across Transoxiana. Raising caravan [buildings|e] stabilizes the [capital|e], revives oasis [development|e], and restores dynastic [prestige|e]."
 oe_msn_tim_01_samarkand_bukhara_req_tt:0 "Hold Samarkand and Bukhara (or via subjects), Stability >= 5, and own a Caravanserai or Marketplace."
 oe_msn_tim_02_suyurghal_discipline:0 "Discipline Suyurghal Fiefs & Princes"
 oe_msn_tim_02_suyurghal_discipline_desc:0 "Hereditary suyurghal appanages tempted Timurid mirzas into endless fratricidal civil wars whenever a sovereign died. Taming princely [estates|e] through clear succession raises [crown_power|e], anchors imperial [legitimacy|e], and secures lasting domestic [stability|e]."
 oe_msn_tim_02_suyurghal_discipline_req_tt:0 "Hold Samarkand (or via subjects), Stability >= 12, Nobles Satisfaction >= 50%, and own a Castle or Madrasa."
 oe_msn_tim_03_gunpowder_siege_train:0 "Transoxianan Siege Train & Tabur"
 oe_msn_tim_03_gunpowder_siege_train_desc:0 "Blending steppe horse-archery with chained wagon forts, bronze culverins, and matchlock musketeers transformed Timurid heirs into masters of early gunpowder battlefields. Funding military [advances|e] with [gold|e] equips elite [regulars|e] and sharpens [army_tradition|e]."
 oe_msn_tim_03_gunpowder_siege_train_req_tt:0 "Age of Discovery+, hold Samarkand, Gold >= 250, Cannon Maker or Training Fields, and Army Tradition >= 22 or Pike and Shot."
 oe_msn_tim_04_settled_imperial_divan:0 "Settled Imperial Divan & Administration"
 oe_msn_tim_04_settled_imperial_divan_desc:0 "By wedding Turco-Mongol military command with Persian fiscal bureaus, the imperial Divan transcended nomadic raiding to govern cities from the Oxus to the Zagros. Embracing modern [institutions|e] strengthens [cabinet|e] oversight, deepens [control|e], and sustains [crown_power|e]."
 oe_msn_tim_04_settled_imperial_divan_req_tt:0 "Age of Reformation+, hold Samarkand, 40+ locations owned or by subjects, embrace Artillery, and own a Barracks or Customs House."
 oe_msn_tim_05_khorasan_herat:0 "Jewel of Khorasan: Herat & Merv"
 oe_msn_tim_05_khorasan_herat_desc:0 "Under Shah Rukh, Herat blossomed into the radiant twin capital of Khorasan while ancient Merv guarded the Karakum caravan gates. Establishing both oasis jewels as our [core|e] secures eastern Iranian [control|e], enriches caravan [trade|e], and lifts urban [development|e]."
 oe_msn_tim_05_khorasan_herat_req_tt:0 "Hold Herat and Merv (or via subjects), and Army Tradition >= 12."
 oe_msn_tim_06_persian_gate_tabriz:0 "March into Iran: Tabriz & Isfahan"
 oe_msn_tim_06_persian_gate_tabriz_desc:0 "Marching west across the Iranian plateau to enter Isfahan's tiled bazaars or Tabriz's northern citadel reasserts Timurid mastery over the heart of Persia. Anchoring western Iran as our [core|e] expands imperial [manpower|e], draws silk [gold|e], and amplifies [prestige|e]."
 oe_msn_tim_06_persian_gate_tabriz_req_tt:0 "Hold Tabriz or Isfahan (or via subjects), and Nobles Satisfaction >= 50%."
 oe_msn_tim_07_mesopotamia_baghdad:0 "Tigris or Gulf: Baghdad or Hormuz"
 oe_msn_tim_07_mesopotamia_baghdad_desc:0 "Whether planting horsetail banners beside the Tigris in Baghdad or taxing Indian spice dhows off Hormuz, our arms now reach the warm southern seas. Securing Mesopotamia or the Gulf as a [core|e] joins overland [trade|e] with ocean [market|e] wealth and deepens [prosperity|e]."
 oe_msn_tim_07_mesopotamia_baghdad_req_tt:0 "Hold Baghdad or Hormuz (or via subjects), and Army Tradition >= 18 or Trade/Tax Income >= 40."
 oe_msn_tim_08_steppe_or_india:0 "Steppe or Hindustan: Sarai or Delhi"
 oe_msn_tim_08_steppe_or_india_desc:0 "Timur broke Tokhtamysh upon the Kipchak steppe and humbled the Delhi Sultanate across the Indus, proving no rival empire stood beyond Samarkand's reach. Commanding vast [subjects|e] with a peerless [army|e] proves our [army_tradition|e] and seals Eurasian [great_power|e] awe."
 oe_msn_tim_08_steppe_or_india_req_tt:0 "Hold Delhi, New Sarai, or Samarkand, 55+ locations owned or by subjects, and Great Power or Army Tradition >= 24."
 oe_msn_tim_09_registan_silk_hub:0 "Registan & Silk Road Crossroads"
 oe_msn_tim_09_registan_silk_hub_desc:0 "Six arterial roads converged upon Samarkand's Registan square, where Chinese porcelain, Indian indigo, and Russian furs changed hands beneath lapis-tiled arches. Expanding central [market|e] [buildings|e] draws continental [trade|e] and crowns the oasis with unmatched [prosperity|e]."
 oe_msn_tim_09_registan_silk_hub_req_tt:0 "Hold Samarkand (or via subjects), Gold >= 350, Caravanserai or Silk Production Guild, and Trade/Tax Income >= 30."
 oe_msn_tim_10_ulugh_beg_observatory:0 "Stars of Samarkand: Ulugh Beg Observatory"
 oe_msn_tim_10_ulugh_beg_observatory_desc:0 "Carving a colossal marble sextant into Kuhak hill, Prince Ulugh Beg and Ali Qushji measured the sidereal year and catalogued a thousand stars with unmatched precision. Sponsoring scholarly [buildings|e] raises [literacy|e], speeds [advances|e], and elevates [cultural_tradition|e]."
 oe_msn_tim_10_ulugh_beg_observatory_req_tt:0 "Age of Renaissance+, hold Samarkand, Madrasa or University, and Capital Development >= 22."
 oe_msn_tim_11_herat_enlightenment:0 "Herat Atelier & Transcontinental Academies"
 oe_msn_tim_11_herat_enlightenment_desc:0 "Under Sultan Husayn Bayqara, painter Behzad and poet Ali-Shir Nava'i elevated Chagatai and Persian letters into a Timurid Renaissance admired from Istanbul to Agra. Linking cultural [institutions|e] with urban [development|e] refines [diplomatic_reputation|e] and [cultural_tradition|e]."
 oe_msn_tim_11_herat_enlightenment_req_tt:0 "Age of Reformation+, hold Herat and Samarkand, Arts Academy or Library, and Capital Development >= 28."
 oe_msn_tim_12_timurid_gunpowder_apex:0 "Samarkand Gunpowder Imperial Destiny"
 oe_msn_tim_12_timurid_gunpowder_apex_desc:0 "Uniting steppe cavalry lineage, modern gunpowder arsenals, and the brightest observatories of the Islamic world, the House of Timur stands unbroken across Central Eurasia. Crowned by [capital|e] [prosperity|e] and imperial [legitimacy|e], Samarkand rules as a supreme [great_power|e]."
 oe_msn_tim_12_timurid_gunpowder_apex_req_tt:0 "Age of Absolutism+, hold Samarkand and Herat, Stability >= 15, Capital Development >= 32, and Great Power or Trade/Tax Income >= 120."
 oe_msn_ira_destiny:0 "#bold #color_yellow Half the World: Persian & Ilkhanid Destiny#!#!"
 oe_msn_ira_destiny_DESCRIPTION:0 "From Ilkhanid Fragmentation to Ghulam Reform and Isfahan"
 oe_msn_ira_destiny_CRITERIA_DESCRIPTION:0 "Unite the Iranian plateau, reform the Ghulam gunpowder corps, build Isfahan, and claim Hormuz."
 oe_msn_ira_destiny_BUTTON_TOOLTIP:0 "Embark on the Persian Destiny"
 oe_msn_ira_destiny_BUTTON_DETAILS:0 "Unite the heirs of Iran (IRA/ILK/ABL/ERA/CHB/JAL/INJ/QAR): end Ilkhanid division, revive Tabriz, forge Abbas I's Ghulam gunpowder army, build Isfahan, and master Hormuz."
 STATIC_MODIFIER_NAME_oe_msn_ira_m1:0 "Ghulam Musketeers & Royal Artillery"
 STATIC_MODIFIER_DESC_oe_msn_ira_m1:0 "Standing Ghulam musketeers and royal artillery balance tribal horse to dominate the plateau."
 STATIC_MODIFIER_NAME_oe_msn_ira_m2:0 "Iranian Plateau & Gulf Supremacy"
 STATIC_MODIFIER_DESC_oe_msn_ira_m2:0 "Tabriz, Isfahan, Baghdad, and Hormuz secure Persia from the Caucasus to the Indian Ocean."
 STATIC_MODIFIER_NAME_oe_msn_ira_m3:0 "Isfahan Royal Silk & Carpet Looms"
 STATIC_MODIFIER_DESC_oe_msn_ira_m3:0 "Royal silk monopolies, qanat irrigation, and famed carpet looms make Isfahan 'Half the World'."
 STATIC_MODIFIER_NAME_oe_msn_ira_m4:0 "Immortal Empire of the Iranian Plateau"
 STATIC_MODIFIER_DESC_oe_msn_ira_m4:0 "Uniting Persian high culture, modern firepower, and Gulf-Silk commerce crowns an immortal Iran."
 oe_msn_ira_01_end_ilkhan_strife:0 "End Ilkhanid Strife: Plateau Core"
 oe_msn_ira_01_end_ilkhan_strife_desc:0 "After the collapse of Abu Sa'id's Ilkhanate left Persia partitioned among warring Jalayirid, Muzaffarid, and Turkmen emirs, restoring one sovereign plateau throne ends decades of chaos. Rebuilding caravan [buildings|e] anchors domestic [stability|e], revives urban [development|e], and rebuilds royal [legitimacy|e]."
 oe_msn_ira_01_end_ilkhan_strife_req_tt:0 "Hold Tabriz, Shiraz, Isfahan, Ardabil, or Baghdad (or via subjects), Stability >= 5, and own a Caravanserai or Marketplace."
 oe_msn_ira_02_tabriz_awakening:0 "Tabriz Revival & Sacred Sovereignty"
 oe_msn_ira_02_tabriz_awakening_desc:0 "Whether crowned beneath the azure dome of Tabriz in the footsteps of Shah Ismail or reviving ancient Iranian kingship, Azerbaijan's great emporium rallies the plateau behind one sacred banner. Making Tabriz a loyal [core|e] deepens [religious_influence|e], strengthens [crown_power|e], and wins clerical [estate_satisfaction|e]."
 oe_msn_ira_02_tabriz_awakening_req_tt:0 "Hold Tabriz (or via subjects), Stability >= 10, Madrasa or Temple, and Clergy Satisfaction >= 50%."
 oe_msn_ira_03_abbas_ghulam_corps:0 "Shah Abbas's Ghulam Gunpowder Corps"
 oe_msn_ira_03_abbas_ghulam_corps_desc:0 "To break tribal Qizilbash factionalism and match Ottoman artillery, Shah Abbas raised salaried Georgian and Circassian ghulam regiments armed with matchlocks and cast bronze cannon. Investing [gold|e] in military [advances|e] builds loyal [regulars|e] and sharpens [army_tradition|e]."
 oe_msn_ira_03_abbas_ghulam_corps_req_tt:0 "Age of Discovery+, hold Tabriz, Isfahan, or Shiraz, Gold >= 240, Training Fields or Cannon Maker, and Army Tradition >= 20 or Pike and Shot."
 oe_msn_ira_04_nazir_central_court:0 "Nazir Treasury & Royal Administration"
 oe_msn_ira_04_nazir_central_court_desc:0 "Converting tribal provinces into royal khassa domains under the Nazir-i Buyutat gave the Shah direct revenues independent of unruly amirs. Merging Persian scribal [cabinet|e] mastery with modern [institutions|e] deepens provincial [control|e] and cements sovereign [crown_power|e]."
 oe_msn_ira_04_nazir_central_court_req_tt:0 "Age of Reformation+, hold Isfahan or Tabriz, 35+ locations owned or by subjects, embrace Global Trade, and own a Customs House or Barracks."
 oe_msn_ira_05_fars_shiraz_isfahan:0 "Heart of Persia: Shiraz & Isfahan"
 oe_msn_ira_05_fars_shiraz_isfahan_desc:0 "From the cypress gardens of Shiraz where Hafez sang to the Zayanderud bridges of Isfahan, uniting Fars with central Iraq-i Ajam restores the beating heart of Eranshahr. Making both jewels our [core|e] lifts urban [development|e], nurtures [cultural_tradition|e], and enriches [prosperity|e]."
 oe_msn_ira_05_fars_shiraz_isfahan_req_tt:0 "Hold Shiraz and Isfahan (or via subjects), and Nobles Satisfaction >= 50%."
 oe_msn_ira_06_khorasan_shield:0 "Eastern Shield: Secure Herat"
 oe_msn_ira_06_khorasan_shield_desc:0 "Every steppe conqueror from the Oxus sought the gateway of Herat to pour into Mashhad and the Iranian heartland. Fortifying Khorasan's eastern [fort|e] as a permanent [core|e] secures our Transoxianan frontier [control|e] and safeguards caravan [trade|e] into Central Asia."
 oe_msn_ira_06_khorasan_shield_req_tt:0 "Hold Herat (or via subjects), Castle or Caravanserai, and Army Tradition >= 14."
 oe_msn_ira_07_baghdad_tigris:0 "Western Horizon: Reclaim Baghdad"
 oe_msn_ira_07_baghdad_tigris_desc:0 "Descending from the Zagros passes to reclaim Baghdad and the shrine cities of Mesopotamia revives memories of Ctesiphon and checks Anatolian ambitions. Securing the Tigris plain as our [core|e] expands imperial [manpower|e], deepens [religious_influence|e], and magnifies royal [prestige|e]."
 oe_msn_ira_07_baghdad_tigris_req_tt:0 "Hold Baghdad (or via subjects), and Army Tradition >= 18 or 30+ locations owned or by subjects."
 oe_msn_ira_08_hormuz_gulf_gate:0 "Key to the Gulf: Reclaim Hormuz"
 oe_msn_ira_08_hormuz_gulf_gate_desc:0 "Called the jewel set in the world's ring, the island fortress of Hormuz commanded every dhow carrying Indian pepper, Bahraini pearls, and Arabian horses into the Persian Gulf. Reclaiming this strait as a sovereign [core|e] builds [maritime_presence|e], trains [sailors|e], and captures oceanic [trade|e]."
 oe_msn_ira_08_hormuz_gulf_gate_req_tt:0 "Hold Hormuz (or via subjects), and possess at least one port."
 oe_msn_ira_09_qanat_irrigation:0 "Qanat Irrigation & Highland Agronomy"
 oe_msn_ira_09_qanat_irrigation_desc:0 "Beneath scorching highland deserts, miles of hand-dug qanat channels carried mountain snowmelt to orchard oases, cotton fields, and mulberry groves. Funding hydraulic [buildings|e] with [gold|e] sustains peasant [estate_satisfaction|e] and multiplies plateau [prosperity|e]."
 oe_msn_ira_09_qanat_irrigation_req_tt:0 "Hold Isfahan or Tabriz (or via subjects), Gold >= 280, Aqueduct System or Granary, and Peasants Satisfaction >= 50%."
 oe_msn_ira_10_isfahan_silk_carpets:0 "Isfahan 'Half the World': Silk & Carpets"
 oe_msn_ira_10_isfahan_silk_carpets_desc:0 "Around the vast Naqsh-e Jahan square, royal karkhaneh workshops wove gilded silk brocades and knotted carpets coveted from Venice to Kyoto, inspiring the boast Isfahan Nisf-e Jahan. Raising artisan [buildings|e] transforms our [capital|e], lifts [development|e], and elevates [cultural_tradition|e]."
 oe_msn_ira_10_isfahan_silk_carpets_req_tt:0 "Age of Discovery+, hold Isfahan, Silk Production Guild or Trading Hub, and Capital Development >= 22."
 oe_msn_ira_11_improved_silk_road:0 "Improved Silk Road & Gulf Customs"
 oe_msn_ira_11_improved_silk_road_desc:0 "Nine hundred paved caravanserais linked Caspian raw silk from Gilan with Bandar Abbas customs houses, drawing Armenian, Indian, and European companies into Persian markets. Coordinating royal [market|e] monopolies with skilled [diplomacy|e] floods coffers with [gold|e] and steadies [inflation|e]."
 oe_msn_ira_11_improved_silk_road_req_tt:0 "Age of Reformation+, hold Isfahan and Hormuz, Port Authority or Customs House, and Trade/Tax Income >= 85."
 oe_msn_ira_12_immortal_iran:0 "Immortal Empire of Iran"
 oe_msn_ira_12_immortal_iran_desc:0 "From the snows of the Caucasus to the warm waters of the Gulf, the revived King of Kings presides over an empire of silk, poetry, and modern gunpowder armies. Crowned by [capital|e] [prosperity|e] and unbroken imperial [legitimacy|e], Immortal Iran reigns as an enduring [great_power|e]."
 oe_msn_ira_12_immortal_iran_req_tt:0 "Age of Absolutism+, hold Isfahan, Tabriz, and Hormuz, Stability >= 15, Capital Development >= 30, and Great Power or Trade/Tax Income >= 115."
 oe_msn_dlh_destiny:0 "#bold #color_yellow Peacock Throne: Delhi & Mughal Destiny#!#!"
 oe_msn_dlh_destiny_DESCRIPTION:0 "From the Grand Trunk Road and Mansabdars to the Peacock Throne"
 oe_msn_dlh_destiny_CRITERIA_DESCRIPTION:0 "Unite Delhi, Agra, and Lahore, forge Mansabdar firepower, take Gujarat and Bengal, and rule India."
 oe_msn_dlh_destiny_BUTTON_TOOLTIP:0 "Embark on the Delhi/Mughal Destiny"
 oe_msn_dlh_destiny_BUTTON_DETAILS:0 "Span the Delhi Sultanate and Mughal Empire: hold Delhi, Agra, and Lahore, build the Grand Trunk Road, institute Mansabdar ranks and toleration, seize Gujarat and Bengal, and crown the Peacock Throne."
 STATIC_MODIFIER_NAME_oe_msn_dlh_m1:0 "Mansabdar Ranks & Field Artillery"
 STATIC_MODIFIER_DESC_oe_msn_dlh_m1:0 "Unified Mansabdar ranks and disciplined field artillery dominate South Asian warfare."
 STATIC_MODIFIER_NAME_oe_msn_dlh_m2:0 "Twin Indian Seas: Gujarat to Bengal"
 STATIC_MODIFIER_DESC_oe_msn_dlh_m2:0 "Commanding both Gujarat and Bengal unites South Asia's twin oceanic commercial engines."
 STATIC_MODIFIER_NAME_oe_msn_dlh_m3:0 "Grand Trunk Textiles & Indo-Persian Arts"
 STATIC_MODIFIER_DESC_oe_msn_dlh_m3:0 "The Grand Trunk Road, world-leading cotton looms, and grand architecture generate unmatched wealth."
 STATIC_MODIFIER_NAME_oe_msn_dlh_m4:0 "Peacock Throne Imperial Destiny"
 STATIC_MODIFIER_DESC_oe_msn_dlh_m4:0 "Tolerance, vast textile exports, and gunpowder legions crown the Peacock Throne as a global titan."
 oe_msn_dlh_01_delhi_agra_core:0 "Heart of Hindustan: Delhi & Agra"
 oe_msn_dlh_01_delhi_agra_core_desc:0 "Commanding the fertile Yamuna-Ganges Doab from Delhi and Agra anchors supreme power over northern Hindustan. Securing these imperial [core|e] cities, erecting urban [buildings|e], and elevating [capital|e] [development|e] steadies dynastic [stability|e] and provides the agrarian wealth required to unite the subcontinent."
 oe_msn_dlh_01_delhi_agra_core_req_tt:0 "Own Delhi or Sargadwari, Stability >= 5, Capital Development >= 18, and own a Marketplace or Granary."
 oe_msn_dlh_02_mansabdar_zamindar:0 "Mansabdar Ranks & Land Registry"
 oe_msn_dlh_02_mansabdar_zamindar_desc:0 "By pairing transparent land surveys with graded military-administrative ranks, Delhi curtails rebellious provincial warlords and aligns tax collection with cavalry quotas. Strengthening imperial [control|e] across both crown lands and Iqta [subjects|e] lifts [crown_power|e], reassures peasant [estate_satisfaction|e], and turns the vast Gangetic plain into a disciplined fiscal engine."
 oe_msn_dlh_02_mansabdar_zamindar_req_tt:0 "Own Delhi, Stability >= 10, and either hold a Delhi Iqta subject, >= 2 Subjects, or Monthly Trade & Tax Income >= 26."
 oe_msn_dlh_03_panipat_field_guns:0 "Gunpowder Field Artillery & Matchlocks"
 oe_msn_dlh_03_panipat_field_guns_desc:0 "Chained artillery wagons, iron-cased Mysorean rockets, and matchlock infantry shatter traditional elephant hosts across the plains of Panipat. Adopting modern gunpowder [advances|e] and erecting ordnance [buildings|e] surges [army_tradition|e], equipping Delhi's [army|e] with the decisive firepower needed to dominate Hindustan and the Deccan."
 oe_msn_dlh_03_panipat_field_guns_req_tt:0 "Own Delhi, Treasury >= 260 Gold, Age of Discovery or later, and either Gunpowder advance, a Cannon Maker/Training Fields, or Army Tradition >= 24."
 oe_msn_dlh_04_imperial_toleration:0 "Sulh-i-Kul & Imperial Code"
 oe_msn_dlh_04_imperial_toleration_desc:0 "Ruling tens of millions of Hindus, Muslims, Jains, and Sikhs demands grand statesmanship beyond mere conquest. Proclaiming Sulh-i-Kul—universal peace—alongside balanced [estate_satisfaction|e] and steady [stability|e] cements imperial [legitimacy|e], calling Delhi to choose its ultimate constitutional settlement between centralized Diwan rule, Iqta federalism, and religious synthesis."
 oe_msn_dlh_04_imperial_toleration_req_tt:0 "Own Delhi, Stability >= 15, Age of Reformation or later, and either Dhimmi Satisfaction >= 50% or embrace Global Trade."
 oe_msn_dlh_05_punjab_lahore:0 "Five Rivers Shield: Secure Lahore"
 oe_msn_dlh_05_punjab_lahore_desc:0 "Standing watch over the Five Rivers of Punjab and the Khyber approaches, Lahore is the northwestern fortress-gate of India against Central Asian invaders. Consolidating Lahore as a fortified [core|e] backed by solid [fort|e] garrisons and disciplined [army_tradition|e] protects the Gangetic heartland and controls the lucrative caravan [trade|e] descending from Kabul and Samarkand."
 oe_msn_dlh_05_punjab_lahore_req_tt:0 "Own or non-sovereign subject-own Lahore, and either Army Tradition >= 16 or own a Castle."
 oe_msn_dlh_06_gujarat_ports:0 "Arabian Sea Gate: Khambat & Surat"
 oe_msn_dlh_06_gujarat_ports_desc:0 "Securing Gujarat's thriving entrepots of Khambat and Surat links Delhi's inland plains straight to Red Sea pilgrims, Persian Gulf merchants, and European East Indiamen. Integrating these coastal [core|e] ports expands Indian [maritime_presence|e], enriches burgher [estate_satisfaction|e], and funnels prodigious Arabian Sea [trade|e] customs into the imperial fisc."
 oe_msn_dlh_06_gujarat_ports_req_tt:0 "Own or non-sovereign subject-own Khambat or Surat, and either >= 6 Ports or Monthly Trade & Tax Income >= 28."
 oe_msn_dlh_07_bengal_gaur:0 "Eastern Breadbasket: Conquer Gaur"
 oe_msn_dlh_07_bengal_gaur_desc:0 "Known as the Paradise of Nations, the lush delta of Bengal yields double harvests of rice, gossamer muslin textiles, and vast teak shipyards. Bringing Gaur into Delhi's [core|e] domain unlocks staggering [prosperity|e] and commercial [gold|e], transforming the Empire into the richest manufacturing powerhouse on earth."
 oe_msn_dlh_07_bengal_gaur_req_tt:0 "Own or non-sovereign subject-own Gaur (Bengal), and either Monthly Trade & Tax Income >= 32 or own a Cloth Guild/Granary."
 oe_msn_dlh_08_padshah_hindustan:0 "Padshah of Hindustan"
 oe_msn_dlh_08_padshah_hindustan_desc:0 "Holding the heartland from Lahore across the Gangetic plains to the Bay of Bengal and the Deccan frontier crowns the ruler Padshah of Hindustan. As a colossal Eurasian [great_power|e] commanding immense [manpower|e], unchallenged [prestige|e], and deep provincial [control|e], the Delhi throne stands peer to Constantinople and Beijing."
 oe_msn_dlh_08_padshah_hindustan_req_tt:0 "Own Delhi, own or non-sovereign subject-own Lahore, >= 55 Locations, and Great Power status."
 oe_msn_dlh_09_grand_trunk_road:0 "Rebuild the Grand Trunk Road"
 oe_msn_dlh_09_grand_trunk_road_desc:0 "Rebuilding the ancient Sadak-e-Azam—the Grand Trunk Road—with shaded trees, wells, and stone sarais every few miles knits Punjab, Delhi, and Bengal into a single artery. Erecting roadside [buildings|e] slashes distance friction, extends imperial [control|e], and accelerates overland [trade|e] and [prosperity|e] across the entire northern subcontinent."
 oe_msn_dlh_09_grand_trunk_road_req_tt:0 "Own Delhi, own or non-sovereign subject-own Lahore, Treasury >= 350 Gold, and own a Caravanserai or Marketplace."
 oe_msn_dlh_10_fine_textile_looms:0 "Indian Cotton Looms & Global Bullion"
 oe_msn_dlh_10_fine_textile_looms_desc:0 "Printed calicoes, fine Bengal muslins, and rich indigo dyes make India the great silver sink of the early modern world economy. Expanding state karkhana and textile [buildings|e] elevates domestic [market|e] output and international [trade|e], drawing vast streams of American and Japanese bullion [gold|e] into Indian hands."
 oe_msn_dlh_10_fine_textile_looms_req_tt:0 "Own Delhi, Age of Discovery or later, and either own a Cloth/Dyes Workshop or Monthly Trade & Tax Income >= 40."
 oe_msn_dlh_11_mughal_monuments:0 "Indo-Persian Monuments & Jurisprudence"
 oe_msn_dlh_11_mughal_monuments_desc:0 "White marble domes inlaid with semi-precious stone, Persianate gardens, and codified jurisprudence immortalize the Indo-Persian golden age of Delhi and Agra. Patronizing monumental [buildings|e] lifts [capital|e] [development|e], nurtures [cultural_tradition|e] and [literacy|e], and radiates breathtaking imperial [prestige|e] from Isfahan to London."
 oe_msn_dlh_11_mughal_monuments_req_tt:0 "Own Delhi and Agra, Stability >= 15, Age of Reformation or later, and either own an Arts Academy/Madrasa or Capital Development >= 26."
 oe_msn_dlh_12_peacock_throne:0 "Peacock Throne of the Subcontinent"
 oe_msn_dlh_12_peacock_throne_desc:0 "Jewel-encrusted beneath its golden canopy, the Peacock Throne presides over an empire uniting the Grand Trunk Road, booming Indian Ocean workshops, and disciplined gunpowder legions. Standing supreme as Asia's wealthiest [great_power|e] with soaring [capital|e] [development|e], [stability|e], and [prestige|e], Delhi now decrees the grand imperial legacy of the subcontinent."
 oe_msn_dlh_12_peacock_throne_req_tt:0 "Complete all three branches, own Delhi, own or non-sovereign subject-own Lahore and Gaur, Stability >= 15, Age of Absolutism or later, Great Power status, and Capital Development >= 32."
 oe_msn_vij_destiny:0 "#bold #color_yellow City of Victory: Vijayanagara Destiny#!#!"
 oe_msn_vij_destiny_DESCRIPTION:0 "From Nayankara Forts and Reservoirs to Southern Indian Mastery"
 oe_msn_vij_destiny_CRITERIA_DESCRIPTION:0 "Elevate Vijayanagar, build Nayankara forts and dams, secure Arabian horse ports, and unite southern India."
 oe_msn_vij_destiny_BUTTON_TOOLTIP:0 "Embark on the Vijayanagara Destiny"
 oe_msn_vij_destiny_BUTTON_DETAILS:0 "Raise the City of Victory as South India's beacon: balance Nayankara military governors and grand irrigation dams, command Malabar horse and spice ports, triumph in the Deccan, and sail the Indian Ocean."
 STATIC_MODIFIER_NAME_oe_msn_vij_m1:0 "Nayankara Governors & Royal Musketeers"
 STATIC_MODIFIER_DESC_oe_msn_vij_m1:0 "Reformed Nayankara governors and firearms-backed garrisons render the Deccan frontier impregnable."
 STATIC_MODIFIER_NAME_oe_msn_vij_m2:0 "Unified Deccan & Tamil Throne"
 STATIC_MODIFIER_DESC_oe_msn_vij_m2:0 "Dominion from Bijapur and Golconda to Madurai and Thanjavur crowns southern India's sole throne."
 STATIC_MODIFIER_NAME_oe_msn_vij_m3:0 "Irrigation Tanks, Horse Ports & Carnatic Arts"
 STATIC_MODIFIER_DESC_oe_msn_vij_m3:0 "Monumental dams, Malabar spice ports, and flourishing temple arts drive immense prosperity."
 STATIC_MODIFIER_NAME_oe_msn_vij_m4:0 "Hindu Renaissance & Indian Ocean Empire"
 STATIC_MODIFIER_DESC_oe_msn_vij_m4:0 "Defying Talikota, Vijayanagara endures as South Asia's radiant maritime and cultural empire."
 oe_msn_vij_01_city_of_victory:0 "City of Victory: Secure Vijayanagar"
 oe_msn_vij_01_city_of_victory_desc:0 "Carved amid the granite boulders of the Tungabhadra River, Hampi rises as the unconquered [capital|e] of the Sangama dynasty and a towering symbol of southern [prestige|e]. Ringing its sacred shrines with strong [fort|e] walls anchors internal [stability|e] against northern sultanates."
 oe_msn_vij_01_city_of_victory_req_tt:0 "Own Vijayanagar, have at least 5 Stability, and own a Castle or Temple."
 oe_msn_vij_02_nayankara_system:0 "Nayankara Governors & Royal Oversight"
 oe_msn_vij_02_nayankara_system_desc:0 "By granting Amaram military estates to loyal Nayaka governors under royal inspection, the Raya binds regional warlords to the throne and safeguards [crown_power|e]. Balanced quotas of levies expand [manpower|e] while fair charters preserve high [estate_satisfaction|e] and sharp [army_tradition|e]."
 oe_msn_vij_02_nayankara_system_req_tt:0 "Own Vijayanagar, have at least 10 Stability, and keep Nobles Satisfaction at least 50% (if present)."
 oe_msn_vij_03_arabian_horse_cavalry:0 "Arabian Warhorses & Royal Army"
 oe_msn_vij_03_arabian_horse_cavalry_desc:0 "Persian and Arabian destriers unloaded at Malabar quays transform Vijayanagar's [army|e], pairing armored cavalry with disciplined archers and war elephants paid in royal [gold|e]. Securing remount [trade|e] gives our [regulars|e] decisive speed across the open plateaus of the Deccan and Orissa."
 oe_msn_vij_03_arabian_horse_cavalry_req_tt:0 "Control Goa or Kozhikode (directly or via subject) or own Vijayanagar, hold 250 Gold and 15 Army Tradition, and own a Weapon Guild or Wharf."
 oe_msn_vij_04_royal_code_integration:0 "Multilingual Court & Southern Unity"
 oe_msn_vij_04_royal_code_integration_desc:0 "Following Krishnadevaraya's Amuktamalyada statecraft, our multilingual [cabinet|e] harmonizes Kannada, Telugu, and Tamil provinces under equitable charters and high [legitimacy|e]. Modernizing fiscal [institutions|e] strengthens administrative [control|e] from the Krishna River to Cape Comorin."
 oe_msn_vij_04_royal_code_integration_req_tt:0 "In the Age of Reformation or later, own Vijayanagar, have 15 Stability and Capital Development 30, and embrace Banking or research Artillery."
 oe_msn_vij_05_malabar_spice_ports:0 "Western Spice Ports: Goa & Kozhikode"
 oe_msn_vij_05_malabar_spice_ports_desc:0 "Black pepper, cardamom, and Arabian warhorses converge upon the palm-fringed harbors of Goa and Kozhikode, making the Malabar coast a vital [core|e] of our oceanic [trade|e]. Securing these western ports channels bullion into our [market|e] and projects [maritime_presence|e] across the Arabian Sea."
 oe_msn_vij_05_malabar_spice_ports_req_tt:0 "Control Goa or Kozhikode (directly or via subject) and possess at least one Port."
 oe_msn_vij_06_tamil_coromandel:0 "Tamil Heartland: Madurai & Thanjavur"
 oe_msn_vij_06_tamil_coromandel_desc:0 "Integrating the Kaveri delta and ancient Pandya and Chola seats of Madurai and Thanjavur turns the Coromandel plain into a loyal [core|e] brimming with rice and cotton [prosperity|e]. Patronizing Tamil guilds accelerates regional [development|e] and deepens our [cultural_tradition|e] across the Bay of Bengal."
 oe_msn_vij_06_tamil_coromandel_req_tt:0 "Control Madurai and Thanjavur directly or through non-sovereign subjects."
 oe_msn_vij_07_deccan_triumph:0 "Deccan Triumph: Bijapur & Golconda"
 oe_msn_vij_07_deccan_triumph_desc:0 "Breaking the northern coalitions along the Raichur Doab plants the Varaha banner atop the basalt citadels of Bijapur and Golconda, vindicating our [army_tradition|e] and diamond-rich [core|e] claims. Controlling the Krishna frontier neutralizes northern threats and cements Vijayanagar's [prestige|e] and [control|e] over the Deccan."
 oe_msn_vij_07_deccan_triumph_req_tt:0 "Control Bijapur or Golconda (directly or via subject) and have at least 20 Army Tradition."
 oe_msn_vij_08_indian_ocean_throne:0 "Sovereign Throne of Southern India"
 oe_msn_vij_08_indian_ocean_throne_desc:0 "Ruling both the Arabian Sea and the Bay of Bengal from a single peninsula throne fulfills the ancient title of Lord of the Eastern and Western Oceans, elevating [legitimacy|e] and [diplomatic_reputation|e]. Tributary [subjects|e] and coastal captains salute our [navy|e] from Ceylon to the Konkan shore."
 oe_msn_vij_08_indian_ocean_throne_req_tt:0 "Own Vijayanagar, control Thanjavur (directly or via subject), hold at least 45 Locations, and own at least 6 Ports."
 oe_msn_vij_09_grand_irrigation_dams:0 "Grand Irrigation Dams & Reservoirs"
 oe_msn_vij_09_grand_irrigation_dams_desc:0 "Stone weirs across the Tungabhadra and the massive Kamalapura tank channel monsoon runoff into terraced paddies and royal gardens, multiplying [development|e] through hydraulic [buildings|e]. Reliable harvests fill granaries with surplus, lifting rural [prosperity|e] and peasant [estate_satisfaction|e]."
 oe_msn_vij_09_grand_irrigation_dams_req_tt:0 "Own Vijayanagar, hold at least 300 Gold, and own an Aqueduct System or Granary."
 oe_msn_vij_10_carnatic_temples:0 "Temple Architecture & Carnatic Arts"
 oe_msn_vij_10_carnatic_temples_desc:0 "Towering raya-gopurams, musical stone pillars of Vittala, and the Eight Elephants of Telugu poetry ignite a Carnatic renaissance that enriches our [cultural_tradition|e] and temple [buildings|e]. Generous endowments deepen [religious_influence|e] and spread Sanskrit and vernacular [literacy|e] across the south."
 oe_msn_vij_10_carnatic_temples_req_tt:0 "In the Age of Renaissance or later, own Vijayanagar, own a University or Theater, and keep Clergy Satisfaction at least 50% (if present)."
 oe_msn_vij_11_indian_ocean_fleet:0 "Indian Ocean Fleet & Maritime Diplomacy"
 oe_msn_vij_11_indian_ocean_fleet_desc:0 "Teak-hulled ocean caravels and cannon-armed galleys slip from Coromandel and Kanara yards, renewing Chola [navy_tradition|e] and recruiting seasoned [sailors|e] along every monsoon shore. Royal envoys backed by resolute [maritime_presence|e] conduct proud [diplomacy|e] from Hormuz to Malacca."
 oe_msn_vij_11_indian_ocean_fleet_req_tt:0 "In the Age of Reformation or later, control Thanjavur (directly or via subject), own at least 8 Ports, have 20 Navy Tradition, and own a Shipyard or Port Authority."
 oe_msn_vij_12_victorious_south_empire:0 "Eternal City of Victory: Oceanic Empire"
 oe_msn_vij_12_victorious_south_empire_desc:0 "Having weathered every storm that once threatened Talikota, the Eternal City of Victory presides over the Indian Ocean as an opulent [great_power|e] crowned with unshakable [prestige|e]. Flourishing [trade|e] and gilded [capital|e] plazas proclaim a southern empire that outshines every rival court in Asia."
 oe_msn_vij_12_victorious_south_empire_req_tt:0 "In the Age of Absolutism or later, own Vijayanagar, control Thanjavur (directly or via subject), have 15 Stability, and be a Great Power or earn at least 90 monthly trade and tax income."
 oe_msn_chi_destiny:0 "#bold #color_yellow Great Yuan Restoration: Celestial Destiny#!#!"
 oe_msn_chi_destiny_DESCRIPTION:0 "From Zhizheng Restoration and Jiaochao Reform to Modern Great Yuan"
 oe_msn_chi_destiny_CRITERIA_DESCRIPTION:0 "Steady Dadu, anchor Jiaochao in silver, secure sea grain and Zaytun, deter Timur, and modernize Great Yuan."
 oe_msn_chi_destiny_BUTTON_TOOLTIP:0 "Embark on the Great Yuan Destiny"
 oe_msn_chi_destiny_BUTTON_DETAILS:0 "Links seamlessly with Great Yuan's restoration lines: calm the Red Turbans, anchor Jiaochao currency, secure coastal grain and Quanzhou trade, check Timur in Central Asia, and modernize the empire."
 STATIC_MODIFIER_NAME_oe_msn_chi_m1:0 "Yuan Shenjiying & Reformed Keshig"
 STATIC_MODIFIER_DESC_oe_msn_chi_m1:0 "Blending Keshig cavalry mobility with Shenjiying firearms forges an unrivaled Eurasian army."
 STATIC_MODIFIER_NAME_oe_msn_chi_m2:0 "Steppe, China & Silk Road Dominion"
 STATIC_MODIFIER_DESC_oe_msn_chi_m2:0 "Commanding Dadu, Jiangnan, and Kashgar unites the steppe and agrarian worlds of East Asia."
 STATIC_MODIFIER_NAME_oe_msn_chi_m3:0 "Silver-Anchored Jiaochao & Zaytun Trade"
 STATIC_MODIFIER_DESC_oe_msn_chi_m3:0 "Silver-backed paper currency and thriving Zaytun maritime customs enrich the imperial treasury."
 STATIC_MODIFIER_NAME_oe_msn_chi_m4:0 "Modern Great Yuan & Silk Phoenix Destiny"
 STATIC_MODIFIER_DESC_oe_msn_chi_m4:0 "Completing the Great Yuan Restoration crowns a modern Eurasian colossus at the eastern anchor of the Silk Road."
 oe_msn_chi_01_steady_dadu_kaifeng:0 "Calm the Heartland: Dadu & Kaifeng"
 oe_msn_chi_01_steady_dadu_kaifeng_desc:0 "Yellow River floods and peasant unrest threaten the Central Plain, making the twin anchors of Dadu and Kaifeng vital to the Great Yuan's survival. Repairing civic [buildings|e], sustaining [capital|e] [development|e], and calming provincial [stability|e] restores agrarian [prosperity|e] and halts the Red Turban tempest before it engulfs the North."
 oe_msn_chi_01_steady_dadu_kaifeng_req_tt:0 "Own Dadu, own or non-sovereign subject-own Kaifeng, Stability >= 5, Capital Development >= 20, and own a Granary or Marketplace."
 oe_msn_chi_02_keshig_shenjiying:0 "Reformed Keshig & Imperial Yam Relays"
 oe_msn_chi_02_keshig_shenjiying_desc:0 "Reforming the hereditary Keshig imperial guard alongside the vast Yam relay station network restores the lightning speed that once awed Marco Polo. Tightening command over loyal provincial [subjects|e] and relay [buildings|e] sharpens [army_tradition|e] and imperial [control|e], ensuring Dadu's decrees reach every frontier garrison within days."
 oe_msn_chi_02_keshig_shenjiying_req_tt:0 "Own Dadu, Stability >= 12, and either govern a Xingsheng/Touxia subject, Army Tradition >= 16, or own a Caravanserai/Castle."
 oe_msn_chi_03_yuan_firearms_corps:0 "Yuan Gunpowder Corps & Fleet"
 oe_msn_chi_03_yuan_firearms_corps_desc:0 "Heir to the earliest bronze hand-cannons cast under the Zhizheng reign, Great Yuan equips permanent Shenjiying firearm brigades and armored river war-junks. Scaling imperial ordnance [buildings|e] and gunpowder [advances|e] elevates [army_tradition|e], giving the restored Yuan [army|e] overwhelming shock and volley firepower across both steppe and coast."
 oe_msn_chi_03_yuan_firearms_corps_req_tt:0 "Own Dadu, Treasury >= 280 Gold, Age of Discovery or later, and either Gunpowder advance, a Hand Cannon Guild/Cannon Maker, or Army Tradition >= 24."
 oe_msn_chi_04_yuan_modern_cabinet:0 "Zhizheng Renewal: Three Teachings & Secretariat"
 oe_msn_chi_04_yuan_modern_cabinet_desc:0 "Reopening civil examinations across Mongol, Semu, and Han talents reshapes the Central Secretariat into a truly meritocratic imperial engine. Balancing central [cabinet|e] efficiency, [crown_power|e], and provincial [subjects|e] brings Great Yuan to its grand constitutional turning point: southern fiscal reform, steppe aristocracy, or a federated Xingsheng compact."
 oe_msn_chi_04_yuan_modern_cabinet_req_tt:0 "Own Dadu, Stability >= 18, Age of Reformation or later, and either hold a Xingsheng subject or Monthly Trade & Tax Income >= 45."
 oe_msn_chi_05_jiangnan_haiyun:0 "Sea Grain & Jiangnan: Hangzhou & Suzhou"
 oe_msn_chi_05_jiangnan_haiyun_desc:0 "Millions of piculs of tax rice and bolts of silk flow northward from Hangzhou and Suzhou along both the Grand Canal and the coastal sea-grain fleet to feed Dadu. Securing Jiangnan's rich [core|e] cities and coastal shipping [buildings|e] sustains metropolitan [prosperity|e] and fiscal [gold|e], binding North and South into an unbreakable imperial union."
 oe_msn_chi_05_jiangnan_haiyun_req_tt:0 "Own or non-sovereign subject-own Hangzhou and Suzhou, and either >= 8 Ports or own a Granary/Wharf."
 oe_msn_chi_06_quanzhou_maritime_silk:0 "Maritime Silk Road: Jinjiang & Guangzhou"
 oe_msn_chi_06_quanzhou_maritime_silk_desc:0 "Zaytun and Canton—hailed by Ibn Battuta as the grandest harbors on earth—welcome Arab dhows, Javanese junks, and Indian spice merchants beneath the Maritime Trade Offices. Integrating these southeastern [core|e] gateways multiplies [maritime_presence|e], lifts merchant [estate_satisfaction|e], and crowns Great Yuan master of East Asian oceanic [trade|e]."
 oe_msn_chi_06_quanzhou_maritime_silk_req_tt:0 "Own or non-sovereign subject-own Jinjiang (Quanzhou) and Guangzhou, and either >= 12 Ports or own a Marketplace/Wharf."
 oe_msn_chi_07_kashgar_western_silk:0 "Check Timur: Secure Kashgar & Silk Gate"
 oe_msn_chi_07_kashgar_western_silk_desc:0 "Garrisoning the oasis crossroads of Kashgar shields the Hexi Corridor against Timurid ambitions while reopening direct caravan passage to Samarkand and Rome. Backed by veteran [army_tradition|e] and loyal frontier [subjects|e], Great Yuan extends its western [control|e] and reclaims the continental Silk Road [trade|e] of Genghis and Kublai."
 oe_msn_chi_07_kashgar_western_silk_req_tt:0 "Own or non-sovereign subject-own Kashgar (or own Dadu), >= 70 Locations, and either Army Tradition >= 24 or >= 3 Subjects."
 oe_msn_chi_08_silk_phoenix_mastery:0 "Pax Mongolica & Eurasian Silk Phoenix"
 oe_msn_chi_08_silk_phoenix_mastery_desc:0 "Holding both the overland Silk Road and the maritime ports of Hangzhou and Zaytun revives the Pax Mongolica on a truly oceanic scale. Reigning as an unrivaled Eastern [great_power|e], Great Yuan commands immense [prestige|e], booming [trade|e], and continental [diplomacy|e] in resonant balance with the western powers of Eurasia."
 oe_msn_chi_08_silk_phoenix_mastery_req_tt:0 "Own Dadu, own or non-sovereign subject-own Hangzhou and Jinjiang, >= 75 Locations, and Great Power status."
 oe_msn_chi_09_jiaochao_silver_peg:0 "Jiaochao Silver-Anchor Reform"
 oe_msn_chi_09_jiaochao_silver_peg_desc:0 "Unbacked paper emissions during late-Yuan crises wrecked public faith in the world's pioneering fiat currency. Anchoring Zhizheng Jiaochao notes to auditable silver vaults and disciplined monetary [buildings|e] crushes [inflation|e], restores [market|e] trust, and turns Dadu's paper bills once again into accepted [gold|e] across all of Asia."
 oe_msn_chi_09_jiaochao_silver_peg_req_tt:0 "Own Dadu, Treasury >= 400 Gold, Monthly Trade & Tax Income >= 32, and own a Counting House or Paper Guild."
 oe_msn_chi_10_imperial_porcelain_tea:0 "Blue-and-White Porcelain & Maritime Surge"
 oe_msn_chi_10_imperial_porcelain_tea_desc:0 "Fusing Persian cobalt pigments with Jiangxi kaolin kilns, Yuan blue-and-white porcelain captivates courts from Topkapi to Malacca and Cairo. Expanding artisan [buildings|e] and merchant shipping swells oceanic [trade|e], multiplies urban [prosperity|e], and draws oceans of silver [gold|e] back into Great Yuan's coffers."
 oe_msn_chi_10_imperial_porcelain_tea_req_tt:0 "Own or non-sovereign subject-own Jinjiang or Hangzhou, Age of Discovery or later, and either own a Porcelain/Silk Guild or Monthly Trade & Tax Income >= 45."
 oe_msn_chi_11_guo_shoujing_academy:0 "Shoushi Astronomy & Yuan Enlightenment"
 oe_msn_chi_11_guo_shoujing_academy_desc:0 "Building upon Guo Shoujing's Shoushi calendar and the Islamic Astronomical Bureau, Dadu's imperial academy fuses Chinese, Persian, and Western mathematics. Embracing scientific [institutions|e] and printing [buildings|e] lifts [literacy|e], [cultural_tradition|e], and cutting-edge [advances|e] to the very pinnacle of early modern Asia."
 oe_msn_chi_11_guo_shoujing_academy_req_tt:0 "Own Dadu, Stability >= 18, Age of Reformation or later, and either embrace Printing Press or own a University/Printing Press Shop."
 oe_msn_chi_12_modern_great_yuan:0 "Modern Great Yuan Imperial Destiny"
 oe_msn_chi_12_modern_great_yuan_desc:0 "Defying the cycle of dynastic collapse, the Great Yuan has bridged steppe and sown into a radiant modern superpower backed by silver-pegged currency, science, and twin Silk Roads. Reigning as a paramount [great_power|e] crowned by Dadu's immense [capital|e] [development|e], unbroken [stability|e], and universal [prestige|e], the Son of Heaven and Great Khan now seals the Yuan's eternal mandate."
 oe_msn_chi_12_modern_great_yuan_req_tt:0 "Complete all three branches, own Dadu, own or non-sovereign subject-own Hangzhou and Jinjiang, Stability >= 18, Age of Absolutism or later, Great Power status, and Capital Development >= 34."
 oe_msn_mng_destiny:0 "#bold #color_yellow Bright Mandate: Great Ming Celestial Destiny#!#!"
 oe_msn_mng_destiny_DESCRIPTION:0 "From Hongwu and Zheng He to Single Whip, Ningyuan, and Oceanic Ming"
 oe_msn_mng_destiny_CRITERIA_DESCRIPTION:0 "Unite Nanjing and Beijing, launch Treasure Fleets, enact Single Whip, hold Ningyuan, and master the seas."
 oe_msn_mng_destiny_BUTTON_TOOLTIP:0 "Embark on the Great Ming Destiny"
 oe_msn_mng_destiny_BUTTON_DETAILS:0 "Pairs with the Ming protagonist line: unite Shangyuan and Dadu, open Jingdezhen kilns and Zheng He's treasure fleets, drill Qi Jiguang's musketeers, enact Single Whip and Ningyuan cannons, and forge an oceanic Ming."
 STATIC_MODIFIER_NAME_oe_msn_mng_m1:0 "Yuanyang Musketeers & Hongyi Cannons"
 STATIC_MODIFIER_DESC_oe_msn_mng_m1:0 "Combined-arms Yuanyang infantry and heavy Hongyi siege cannon turn Ming armies into steel."
 STATIC_MODIFIER_NAME_oe_msn_mng_m2:0 "Treasure Fleets & Pacific Opening"
 STATIC_MODIFIER_DESC_oe_msn_mng_m2:0 "Imperial treasure fleets and open southern ports command maritime trade from Malacca to Manila."
 STATIC_MODIFIER_NAME_oe_msn_mng_m3:0 "Single-Whip Finance & Tiangong Kaiwu"
 STATIC_MODIFIER_DESC_oe_msn_mng_m3:0 "Single-Whip fiscal efficiency, Jingdezhen kilns, and empirical science power an economic zenith."
 STATIC_MODIFIER_NAME_oe_msn_mng_m4:0 "Oceanic Great Ming Imperial Destiny"
 STATIC_MODIFIER_DESC_oe_msn_mng_m4:0 "Weathering every seventeenth-century storm, an oceanic, scientifically awakened Ming leads East Asia."
 oe_msn_mng_01_hongwu_shangyuan:0 "Hongwu Foundation: Shangyuan & Weisuo"
 oe_msn_mng_01_hongwu_shangyuan_desc:0 "Rising from the fires of rebellion to establish the Ming court in Shangyuan, the Hongwu settlement compiles Fish-Scale land registers and self-sustaining Weisuo garrisons. Rebuilding granary [buildings|e], boosting [capital|e] [development|e], and anchoring agrarian [stability|e] nurtures peasant [estate_satisfaction|e] and lays the bedrock of a resurgent Chinese dynasty."
 oe_msn_mng_01_hongwu_shangyuan_req_tt:0 "Own Shangyuan (Nanjing) or Dadu, Stability >= 5, Capital Development >= 18, and own a Granary or Marketplace."
 oe_msn_mng_02_yongle_two_capitals:0 "Two Capitals: Beijing & Grand Canal"
 oe_msn_mng_02_yongle_two_capitals_desc:0 "With the Emperor guarding the northern frontier gate at Beijing while Nanjing anchors the wealth of Jiangnan, the dredged Grand Canal stitches North and South together. Cementing both capitals as eternal [core|e] pillars backed by sturdy [fort|e] ramparts strengthens imperial [control|e] and [legitimacy|e], enabling Great Ming to deter the steppe while projecting power across the seas."
 oe_msn_mng_02_yongle_two_capitals_req_tt:0 "Own Dadu (Beijing) and Shangyuan (Nanjing), and either own a Castle or >= 55 Locations."
 oe_msn_mng_03_yuanyang_folangji:0 "Qi Jiguang's Yuanyang & Folangji Guns"
 oe_msn_mng_03_yuanyang_folangji_desc:0 "General Qi Jiguang's eleven-man Yuanyang combined-arms squad pairs bamboo shields, spears, and breech-loading Folangji swivel cannon to annihilate coastal raiders. Embracing gunpowder [advances|e] and rigorous drill lifts [army_tradition|e], molding salaried Ming [regulars|e] into a disciplined modern [army|e] victorious on both coast and northern wall."
 oe_msn_mng_03_yuanyang_folangji_req_tt:0 "Own Shangyuan or Dadu, Treasury >= 250 Gold, Age of Discovery or later, and either Gunpowder advance, Army Tradition >= 22, or a Cannon Maker/Training Fields."
 oe_msn_mng_04_single_whip_cabinet:0 "1581 Single-Whip Tax & Grand Secretariat"
 oe_msn_mng_04_single_whip_cabinet_desc:0 "Grand Secretary Zhang Juzheng's Kaocheng administrative audits and the 1581 Single-Whip Law consolidate tangled corvee obligations into a single silver tax based on surveyed land. Sharpening [cabinet|e] accountability and nationwide [control|e] curbs tax evasion, fills the Taicang treasury with [gold|e], and revitalizes commercial [prosperity|e] across every Ming province."
 oe_msn_mng_04_single_whip_cabinet_req_tt:0 "Own Dadu or Shangyuan, Stability >= 15, Age of Reformation or later, and Monthly Trade & Tax Income >= 45."
 oe_msn_mng_05_southeast_ports:0 "Southeastern Ports: Jinjiang, Ningbo & Canton"
 oe_msn_mng_05_southeast_ports_desc:0 "Securing Quanzhou, Ningbo, and Canton places the great maritime gateways of Fujian, Zhejiang, and Guangdong under imperial harbor offices alongside the giant Longjiang dry docks. Building deep-water naval [buildings|e] across these coastal [core|e] hubs mobilizes skilled [sailors|e] and launches Great Ming's oceanic [maritime_presence|e]."
 oe_msn_mng_05_southeast_ports_req_tt:0 "Own Jinjiang, Yinxian (Ningbo), and Guangzhou, >= 12 Ports, and own a Wharf or Dock."
 oe_msn_mng_06_zheng_he_voyages:0 "Zheng He's Seven Treasure Voyages"
 oe_msn_mng_06_zheng_he_voyages_desc:0 "Nine-masted Longjiang treasure ships unfurl scarlet sails toward Champa, Malacca, Calicut, and Hormuz, displaying celestial majesty across the Indian Ocean. Yet as soaring [navy_tradition|e] and [prestige|e] clash with the cost of northern frontier walls, the Ming court faces history's most fateful debate: commit to a permanent oceanic [navy|e] empire or retrench behind the Great Wall?"
 oe_msn_mng_06_zheng_he_voyages_req_tt:0 "Own Shangyuan and Guangzhou, Age of Renaissance or later, and either Navy Tradition >= 18 or >= 16 Ports."
 oe_msn_mng_07_ningyuan_guanning:0 "1626 Ningyuan: Guanning Cannon Line"
 oe_msn_mng_07_ningyuan_guanning_desc:0 "Mounting heavy European-style Hongyi red-barbarian cannon atop angled stone ramparts at Shanhaiguan and Ningyuan turns the Liaoxi corridor into a fiery killing ground. Strengthening northern [fort|e] lines and border [core|e] strongholds bolsters [army_tradition|e] and imperial [control|e], shattering steppe cavalry assaults before they can threaten Beijing."
 oe_msn_mng_07_ningyuan_guanning_req_tt:0 "Own Ningyuan, Funing (Shanhaiguan), or Dadu, >= 70 Locations, and either own a Bastion/Castle or Army Tradition >= 25."
 oe_msn_mng_08_pacific_ming_network:0 "Longqing Opening & Pacific Commerce"
 oe_msn_mng_08_pacific_ming_network_desc:0 "Lifting the sea bans at Yuegang opens legal licensed trade across Manila, Malacca, and Nagasaki, linking Ming workshops to the silver mines of Peru and Japan. Supported by loyal maritime [subjects|e] and unmatched [great_power|e] clout, Great Ming dominates Pacific [trade|e] and [maritime_presence|e] from the Ryukyus to the Strait of Malacca."
 oe_msn_mng_08_pacific_ming_network_req_tt:0 "Own or non-sovereign subject-own Manila or Malacca (or own Guangzhou), Age of Reformation or later, Great Power status, and either a Celestial vassal subject or >= 18 Ports."
 oe_msn_mng_09_jingdezhen_kilns:0 "Jingdezhen Imperial Porcelain Kilns"
 oe_msn_mng_09_jingdezhen_kilns_desc:0 "Established in the second year of Hongwu, the Imperial Kilns of Jingdezhen and silk looms of Jiangnan set the gold standard of global luxury manufacture. Investing in artisan [buildings|e] elevates domestic [market|e] output and international [trade|e], bringing torrents of bullion [gold|e] and flourishing [prosperity|e] to the lower Yangtze."
 oe_msn_mng_09_jingdezhen_kilns_req_tt:0 "Own Shangyuan and Hangzhou, Treasury >= 350 Gold, and own a Porcelain Guild or Silk Production Guild."
 oe_msn_mng_10_ever_normal_silver:0 "Ever-Normal Granaries & Silver Resilience"
 oe_msn_mng_10_ever_normal_silver_desc:0 "When Little Ice Age droughts and sudden foreign silver famines struck the late Ming, empty granaries and erratic coinage turned famine into dynastic ruin. By maintaining full Ever-Normal granary [buildings|e] and standardized royal silver coinage, the court tames [inflation|e], protects rural [prosperity|e], and fortifies national [stability|e] against every climatic shock."
 oe_msn_mng_10_ever_normal_silver_req_tt:0 "Own Dadu and Shangyuan, Treasury >= 500 Gold, Monthly Trade & Tax Income >= 40, and own a Granary or Counting House."
 oe_msn_mng_11_tiangong_kaiwu:0 "Tiangong Kaiwu & Practical Learning"
 oe_msn_mng_11_tiangong_kaiwu_desc:0 "From Xu Guangqi's translation of Euclid and agricultural treatises to Song Yingxing's Tiangong Kaiwu industrial encyclopedia, late-Ming practical learning blazes with empirical brilliance. Backing printing [institutions|e] and learned [buildings|e] lifts [literacy|e], deepens [cultural_tradition|e], and accelerates early modern [advances|e] in metallurgy, agronomy, and astronomy."
 oe_msn_mng_11_tiangong_kaiwu_req_tt:0 "Own Shangyuan or Dadu, Stability >= 18, Age of Reformation or later, and either embrace Printing Press or own a Printing Press Shop/University."
 oe_msn_mng_12_oceanic_bright_ming:0 "Bright Mandate: Oceanic Great Ming"
 oe_msn_mng_12_oceanic_bright_ming_desc:0 "Sun and Moon shine anew over the Two Capitals, the red-cannon ramparts of Guanning, the treasure fleets of the Pacific, and the academies of practical learning. Standing as the supreme Eastern [great_power|e] anchored by soaring [capital|e] [development|e], unbroken [stability|e], and peerless [prestige|e], Great Ming now proclaims its luminous modern mandate."
 oe_msn_mng_12_oceanic_bright_ming_req_tt:0 "Complete all three branches, own Dadu, Shangyuan, and Guangzhou, Stability >= 18, Age of Absolutism or later, Great Power status, and Capital Development >= 34."
 oe_msn_mch_destiny:0 "#bold #color_yellow Eight Banners: Jurchen & Manchu Destiny#!#!"
 oe_msn_mch_destiny_DESCRIPTION:0 "From Hetu Ala and Eight Banners to Sarhu, Shanhaiguan, and Beijing"
 oe_msn_mch_destiny_CRITERIA_DESCRIPTION:0 "Unite the Jurchens, raise Eight Banners and Ujen Cooha guns, cross Shanhaiguan to Dadu, and build Lifan Yuan."
 oe_msn_mch_destiny_BUTTON_TOOLTIP:0 "Embark on the Manchu Destiny"
 oe_msn_mch_destiny_BUTTON_DETAILS:0 "Pairs with the Jurchen/Manchu Eight Banners line and Shanhaiguan situation: unite the Jurchen tribes, organize Eight Banners and Manchu script, win Sarhu, forge Ujen Cooha heavy artillery, cross Shanhaiguan to Dadu, and establish Lifan Yuan."
 STATIC_MODIFIER_NAME_oe_msn_mch_m1:0 "Eight Banners & Ujen Cooha Artillery"
 STATIC_MODIFIER_DESC_oe_msn_mch_m1:0 "Eight-Banner heavy cavalry paired with Ujen Cooha siege artillery shatters field armies and forts alike."
 STATIC_MODIFIER_NAME_oe_msn_mch_m2:0 "Shanhaiguan Entry & Lifan Yuan Empire"
 STATIC_MODIFIER_DESC_oe_msn_mch_m2:0 "Entering Beijing and governing Manchu, Han, Mongol, and Tibetan realms through Lifan Yuan cements continental rule."
 STATIC_MODIFIER_NAME_oe_msn_mch_m3:0 "Tan Ding Ru Mu, Kyakhta & Cohong Wealth"
 STATIC_MODIFIER_DESC_oe_msn_mch_m3:0 "Commuting poll taxes into land revenue while tapping Kyakhta and Canton fuels booming prosperity."
 STATIC_MODIFIER_NAME_oe_msn_mch_m4:0 "Dual Inner-Asian Imperial Destiny"
 STATIC_MODIFIER_DESC_oe_msn_mch_m4:0 "Renewing the Banners with modern firepower, scientific astronomy, and maritime reach crowns an Asian superpower."
 oe_msn_mch_01_hetu_ala_jurchen:0 "White Mountain & Black River: Hetu Ala"
 oe_msn_mch_01_hetu_ala_jurchen_desc:0 "Amid the pine ridges of Changbai and the frozen meanders of the Sungari, fortifying our Jianzhou [capital|e] at Hetu Ala rallies scattered Jurchen clans into disciplined [army_tradition|e]. Uniting tribal elders under firm [stability|e] prepares our banners for the struggle over Liaodong."
 oe_msn_mch_01_hetu_ala_jurchen_req_tt:0 "Control Hetu Ala, Shenyang, Girin Ula, or Ningguta (directly or via subject), have 5 Stability, and own a Castle or Marketplace."
 oe_msn_mch_02_eight_banners_script:0 "Eight Banners (Baqi) & Manchu Script"
 oe_msn_mch_02_eight_banners_script_desc:0 "Organizing every household into yellow, white, red, and blue Niru companies fuses military and civil command, dramatically expanding our [manpower|e] and [crown_power|e]. Simultaneously adapting the Mongol alphabet into Manchu script raises administrative [literacy|e] and cements [cultural_tradition|e] across all Eight Banners."
 oe_msn_mch_02_eight_banners_script_req_tt:0 "Control Hetu Ala or Shenyang (directly or via subject), have 10 Stability, own a Scriptorium or Weapon Guild, and keep Nobles Satisfaction at least 45% (if present)."
 oe_msn_mch_03_ujen_cooha_guns:0 "Forge Ujen Cooha Heavy Artillery Corps"
 oe_msn_mch_03_ujen_cooha_guns_desc:0 "Having felt the sting of Hongyi culverins at Ningyuan, our foundries cast heavy bronze siege guns to arm the Ujen Cooha Han Banner corps as hardened [regulars|e]. Pairing steppe horse archers with gunpowder [advances|e] transforms our [army|e] and sharpens [army_tradition|e] for breaching Ming walls."
 oe_msn_mch_03_ujen_cooha_guns_req_tt:0 "In the Age of Discovery or later, control Shenyang, Liaoyang, Dadu, or Hetu Ala (directly or via subject), hold 220 Gold and 20 Army Tradition, own a Cannon Maker or Training Fields, and embrace Professional Armies or research Pike and Shot."
 oe_msn_mch_04_lifan_yuan_dyarchy:0 "Establish Lifan Yuan & Inner-Asian Dyarchy"
 oe_msn_mch_04_lifan_yuan_dyarchy_desc:0 "Through the Lifan Yuan court and Manchu-Han dyarchy in the Six Ministries, the Emperor governs agrarian China as Son of Heaven while presiding over Mongol khans and Tibetan lamas through deft [diplomacy|e]. This bilingual [cabinet|e] fortifies [legitimacy|e] and binds Inner Asian [subjects|e] into durable harmony."
 oe_msn_mch_04_lifan_yuan_dyarchy_req_tt:0 "In the Age of Reformation or later, control Dadu or Shenyang (directly or via subject), have 15 Stability, have at least 1 Subject or 60 Locations, and own a University or Barracks."
 oe_msn_mch_05_unite_haixi_manchuria:0 "Unite the Jurchens: Shenyang, Kaiyuan & Ula"
 oe_msn_mch_05_unite_haixi_manchuria_desc:0 "Absorbing the Haixi federations of Ula, Yehe, Hoifa, and Hada unifies the fertile Liao River valley and Sungari forests into an indivisible Manchu [core|e]. Transforming Mukden into a bustling garrison city spurs regional [development|e], tightens [control|e], and lifts our [prestige|e] across the steppe."
 oe_msn_mch_05_unite_haixi_manchuria_req_tt:0 "Control Shenyang, Kaiyuan, and Girin Ula directly or through non-sovereign subjects."
 oe_msn_mch_06_sarhu_liaoyang:0 "Triumph of Sarhu: Liaoyang & Fushun"
 oe_msn_mch_06_sarhu_liaoyang_desc:0 "Defeating four converging imperial columns in detail at Sarhu proves our doctrine of striking one route with full force, opening Liaoyang and Fushun as our new agrarian [core|e]. Capturing walled Liaodong towns enriches our [army_tradition|e], swells military [prestige|e], and secures fertile eastern [prosperity|e]."
 oe_msn_mch_06_sarhu_liaoyang_req_tt:0 "Control Liaoyang and Fushun (directly or via subject) and have at least 15 Army Tradition."
 oe_msn_mch_07_shanhaiguan_pass:0 "Break the Pass: Ningyuan & Shanhaiguan"
 oe_msn_mch_07_shanhaiguan_pass_desc:0 "After grueling siege battles from Songshan to Jinzhou, breaking the Ningyuan-Jinzhou defense line carries our standards through the First Pass Under Heaven at Shanhaiguan. Mastering this coastal [fort|e] corridor multiplies available [manpower|e], opens the North China Plain to our [army|e], and cements unchallenged [control|e] over the Great Wall."
 oe_msn_mch_07_shanhaiguan_pass_req_tt:0 "Control Ningyuan and Funing (Shanhaiguan) directly or through non-sovereign subjects."
 oe_msn_mch_08_enter_beijing_dadu:0 "Dragon Over Beijing: Enter Dadu"
 oe_msn_mch_08_enter_beijing_dadu_desc:0 "Ascending the marble steps of the Forbidden City in Beijing transfers the Mandate of Heaven to our dynasty, anchoring a peerless imperial [capital|e] and [core|e] seat. Respecting scholar-official rituals wins rapid [legitimacy|e] and accelerates the pacification and [development|e] of the Central Plains."
 oe_msn_mch_08_enter_beijing_dadu_req_tt:0 "Control Beijing (Dadu) directly or through a non-sovereign subject."
 oe_msn_mch_09_fushun_ginseng_fur:0 "Ginseng, Sable & Manchurian Markets"
 oe_msn_mch_09_fushun_ginseng_fur_desc:0 "Wild Changbai ginseng, prized Heilongjiang sable pelts, and river pearls turn the horse fairs of Fushun and Kaiyuan into lucrative engines of northern [trade|e] and bullion [gold|e]. Chartering regulated frontier [market|e] halls brings steady [prosperity|e] to our homeland even before crossing the Great Wall."
 oe_msn_mch_09_fushun_ginseng_fur_req_tt:0 "Control Shenyang or Hetu Ala (directly or via subject), hold at least 260 Gold, and own a Marketplace or Guild Hall."
 oe_msn_mch_10_tan_ding_ru_mu:0 "Tan Ding Ru Mu & Frontier Integration"
 oe_msn_mch_10_tan_ding_ru_mu_desc:0 "Merging the head tax permanently into the land assessment under Tan Ding Ru Mu lifts crushing levies from landless households while stabilizing imperial revenue and checking [inflation|e]. Replacing hereditary frontier chieftains with salaried magistrates deepens provincial [control|e], boosts rural [estate_satisfaction|e], and sustains lasting [stability|e]."
 oe_msn_mch_10_tan_ding_ru_mu_req_tt:0 "Control Beijing (Dadu) directly or via subject, hold 400 Gold, earn 35 monthly trade and tax income, and keep Peasants Satisfaction at least 50% (if present)."
 oe_msn_mch_11_kyakhta_cohong_trade:0 "Kyakhta Fur Road & Canton Sea Trade"
 oe_msn_mch_11_kyakhta_cohong_trade_desc:0 "In the north, brick-tea caravans cross the Mongolian steppe to Kyakhta for Siberian furs; in the south, Canton's Cohong hongs exchange silk and porcelain for oceans of New World silver [gold|e]. Managing both gateways through dedicated customs [buildings|e] crowns global [trade|e] and amplifies [market|e] dominance."
 oe_msn_mch_11_kyakhta_cohong_trade_req_tt:0 "In the Age of Reformation or later, control Guangzhou or Dadu (directly or via subject), hold 70 Locations, have Capital Development 32, and own a Customs House or Trading Hub."
 oe_msn_mch_12_dual_asian_apex:0 "Modern Dual Inner-Asian Empire"
 oe_msn_mch_12_dual_asian_apex_desc:0 "Binding Manchuria, Mongolia, Tibet, Xinjiang, and the Eighteen Provinces into one modern multi-ethnic empire elevates our realm as East Asia's supreme [great_power|e]. Fusing Confucian scholarship with modernizing [institutions|e] and vigorous [development|e] secures unrivalled imperial [prestige|e] for the ages."
 oe_msn_mch_12_dual_asian_apex_req_tt:0 "In the Age of Absolutism or later, control Dadu and Shenyang (directly or via subject), have 15 Stability, and be a Great Power or earn at least 100 monthly trade and tax income."
 oe_msn_kor_destiny:0 "#bold #color_yellow Hangul & Turtle Ships: Korean Destiny#!#!"
 oe_msn_kor_destiny_DESCRIPTION:0 "From Namgyeong and Hangul to Geobukseon, Daedongbeop, and Gunpowder Power"
 oe_msn_kor_destiny_CRITERIA_DESCRIPTION:0 "Secure Kaesong and Namgyeong, promulgate Hangul, build turtle ships and Hwacha, and enact Daedongbeop."
 oe_msn_kor_destiny_BUTTON_TOOLTIP:0 "Embark on the Korean Destiny"
 oe_msn_kor_destiny_BUTTON_DETAILS:0 "Anchor the peninsula at Kaesong and Namgyeong (Seoul), promulgate Hangul for peerless literacy, fortify the northern frontier, build Hwacha rockets and Yi Sun-sin's turtle ships, and enact the 1608 Daedongbeop tax reform."
 STATIC_MODIFIER_NAME_oe_msn_kor_m1:0 "Border Defense Council & Hwacha Artillery"
 STATIC_MODIFIER_DESC_oe_msn_kor_m1:0 "Border defense planning and indigenous Hwacha rocket-artillery corps make Korea a fortress."
 STATIC_MODIFIER_NAME_oe_msn_kor_m2:0 "Geobukseon Navy & Peninsular Shield"
 STATIC_MODIFIER_DESC_oe_msn_kor_m2:0 "Armored turtle ships and northern river forts turn the peninsula into an unbreachable bastion."
 STATIC_MODIFIER_NAME_oe_msn_kor_m3:0 "Hangul Literacy & Daedongbeop Reform"
 STATIC_MODIFIER_DESC_oe_msn_kor_m3:0 "Hangul universal literacy and unified Daedongbeop land taxes fuel sustained prosperity and science."
 STATIC_MODIFIER_NAME_oe_msn_kor_m4:0 "Enlightened Gunpowder Power of East Asia"
 STATIC_MODIFIER_DESC_oe_msn_kor_m4:0 "Uniting peerless literacy, armored fleets, and indigenous artillery crowns a modern Korean power."
 oe_msn_kor_01_kaesong_namgyeong:0 "Peninsular Core: Kaesong & Namgyeong"
 oe_msn_kor_01_kaesong_namgyeong_desc:0 "Anchoring both historic Kaesong and the geomantically favored basin of Hanyang along the Han River crowns our [capital|e] with enduring [legitimacy|e]. Stocking rice granaries and regulating central markets accelerates urban [development|e] and cements peninsular [stability|e]."
 oe_msn_kor_01_kaesong_namgyeong_req_tt:0 "Own Kaesong and Namgyeong, have at least 5 Stability, and own a Granary or Marketplace."
 oe_msn_kor_02_hopae_border_council:0 "Hopae Registry & Border Defense Council"
 oe_msn_kor_02_hopae_border_council_desc:0 "Issuing ivory and wood Hopae identity plaques registers every adult subject for equitable corvee and military duty, sharpening administrative [control|e] and dependable [manpower|e]. Coordinating frontier generals through the Border Defense [cabinet|e] unites yangban nobles in steadfast [army_tradition|e]."
 oe_msn_kor_02_hopae_border_council_req_tt:0 "Own Namgyeong, have at least 10 Stability, and keep Nobles Satisfaction at least 50% (if present)."
 oe_msn_kor_03_hwacha_gunpowder:0 "Gunpowder Bureau & Hwacha Rockets"
 oe_msn_kor_03_hwacha_gunpowder_desc:0 "Expanding Choe Museon's Gunpowder Bureau yields mobile Hwacha rocket carts capable of unleashing a hundred flaming Singijeon arrows in a single thunderous volley. Investing treasury [gold|e] into native fire-weapon [advances|e] equips our [army|e] with lethal range and peerless defensive [army_tradition|e]."
 oe_msn_kor_03_hwacha_gunpowder_req_tt:0 "In the Age of Renaissance or later, own Namgyeong, hold 220 Gold and 15 Army Tradition, own a Cannon Maker or Armory, and embrace Professional Armies or research its advance."
 oe_msn_kor_04_modern_korean_cannon:0 "Heavy Bronze Artillery & Modern Garrisons"
 oe_msn_kor_04_modern_korean_cannon_desc:0 "Casting Heaven- and Earth-class bronze Chongtong cannon alongside salaried Five Military Commands garrisons turns mountain citadels like Namhansanseong into impregnable [fort|e] anchors. Well-drilled [regulars|e] stationed in modern [buildings|e] deter continental and island invasions alike, safeguarding royal [crown_power|e]."
 oe_msn_kor_04_modern_korean_cannon_req_tt:0 "In the Age of Reformation or later, own Namgyeong, have 15 Stability and 25 Army Tradition, and own a Barracks or Bastion."
 oe_msn_kor_05_gyeongju_dongnae:0 "Southeastern Shield: Gyeongju & Dongnae"
 oe_msn_kor_05_gyeongju_dongnae_desc:0 "From Silla's ancient capital of Gyeongju to the bustling harbor fortress of Dongnae facing Tsushima, southeastern Gyeongsang forms the maritime [core|e] guarding the Korea Strait. Fortifying Busan's quays regulates coastal [trade|e], spurs southern [development|e], and denies Wokou raiders any foothold."
 oe_msn_kor_05_gyeongju_dongnae_req_tt:0 "Control Gyeongju and Dongnae (directly or via subject) and possess a Port."
 oe_msn_kor_06_turtle_ship_armada:0 "Admiral Yi & Armored Turtle Ships"
 oe_msn_kor_06_turtle_ship_armada_desc:0 "Inspired by Admiral Yi Sun-sin's crane-wing tactics, flat-bottomed Panokseon gunships and iron-spiked Geobukseon turtle ships turn narrow southern currents into graveyards for hostile armadas. Trained Korean [sailors|e] elevate [navy_tradition|e], forging a lethal [navy|e] and ironclad [maritime_presence|e] across the strait."
 oe_msn_kor_06_turtle_ship_armada_req_tt:0 "In the Age of Discovery or later, control Dongnae (directly or via subject), have 18 Navy Tradition, and own a Dry Dock or Dock."
 oe_msn_kor_07_northern_forts:0 "Northern River Forts & Frontier Garrisons"
 oe_msn_kor_07_northern_forts_desc:0 "Establishing the Four Commanderies along the Yalu and the Six Garrisons on the Tumen pushes permanent [control|e] to the peninsula's natural mountain rivers. Frontier beacon towers and stone [fort|e] chains shield northern settlers, tempering border [army_tradition|e] and securing long-term [prosperity|e]."
 oe_msn_kor_07_northern_forts_req_tt:0 "Own Kaesong and Namgyeong, control at least 28 Locations, and own a Castle or Weapon Guild."
 oe_msn_kor_08_northeast_asian_shield:0 "Northeast Asian Maritime Bastion"
 oe_msn_kor_08_northeast_asian_shield_desc:0 "Commanding both the Yellow Sea approaches and the East Sea lanes transforms the Korean peninsula from a vulnerable bridge into an armored oceanic bastion of high [maritime_presence|e]. Balanced fleets and dignified [diplomacy|e] raise our [diplomatic_reputation|e] and compel mainland and island rivals to respect Korean [prestige|e]."
 oe_msn_kor_08_northeast_asian_shield_req_tt:0 "In the Age of Reformation or later, control Kaesong, Namgyeong, Gyeongju, and Dongnae (directly or via subject), own at least 6 Ports, and own a Shipyard or Port Authority."
 oe_msn_kor_09_hangul_hall_worthies:0 "Hangul Alphabet & Hall of Worthies"
 oe_msn_kor_09_hangul_hall_worthies_desc:0 "Scholars of King Sejong's Hall of Worthies promulgate the phonetic Hunminjeongeum alphabet alongside astronomical instruments and agricultural treatises, sparking a surge in popular [literacy|e]. Endowing royal academies and scholarly [buildings|e] enriches [cultural_tradition|e] and accelerates national [advances|e]."
 oe_msn_kor_09_hangul_hall_worthies_req_tt:0 "In the Age of Renaissance or later, own Namgyeong, have Capital Development 22, and own a University or Library."
 oe_msn_kor_10_korean_artisanry:0 "Celadon, Porcelain & Movable Type Crafts"
 oe_msn_kor_10_korean_artisanry_desc:0 "Kingfisher-green celadon, luminous Joseon white porcelain, mulberry Hanji paper, and pioneering cast-metal movable type fill royal kilns and guild [buildings|e] with coveted treasures. Exporting fine craft through regulated [trade|e] grows treasury [gold|e] and strengthens domestic [prosperity|e]."
 oe_msn_kor_10_korean_artisanry_req_tt:0 "Own Namgyeong and Kaesong, hold at least 300 Gold, and own a Porcelain Guild or Paper Guild."
 oe_msn_kor_11_daedongbeop_reform:0 "1608 Daedongbeop Tax & Silhak Learning"
 oe_msn_kor_11_daedongbeop_reform_desc:0 "The 1608 Daedongbeop reform replaces arbitrary local tribute with a uniform rice-and-coin land tax, curbing [inflation|e] while fueling Gongin merchant contractors across every provincial [market|e]. Guided by pragmatic Silhak thinkers, agrarian relief uplifts peasant [estate_satisfaction|e] and spreads rural [prosperity|e]."
 oe_msn_kor_11_daedongbeop_reform_req_tt:0 "In the Age of Reformation or later, own Namgyeong, have 15 Stability, earn 30 monthly trade and tax income, and keep Peasants Satisfaction at least 50% (if present)."
 oe_msn_kor_12_enlightened_gunpowder_korea:0 "Enlightened Gunpowder Power of East Asia"
 oe_msn_kor_12_enlightened_gunpowder_korea_desc:0 "Blending Silhak scientific learning, ironclad naval engineering, and high public [literacy|e], Korea rises as an enlightened gunpowder [great_power|e] of Northeast Asia. Progressive [institutions|e] and unyielding royal [legitimacy|e] ensure the peninsula dictates its own destiny across the modern era."
 oe_msn_kor_12_enlightened_gunpowder_korea_req_tt:0 "In the Age of Absolutism or later, control Kaesong, Namgyeong, and Dongnae (directly or via subject), have 18 Stability, and be a Great Power or earn at least 75 monthly trade and tax income."
 oe_msn_jap_destiny:0 "#bold #color_yellow Tenka Fubu: Japanese Oceanic Destiny#!#!"
 oe_msn_jap_destiny_DESCRIPTION:0 "From Kyoto Shogunate and Tanegashima Muskets to Iwami Silver and Pacific Trade"
 oe_msn_jap_destiny_CRITERIA_DESCRIPTION:0 "Unify Japan across Kyoto, Osaka, and Edo, drill matchlock Ashigaru, mine Iwami silver, and sail the Pacific."
 oe_msn_jap_destiny_BUTTON_TOOLTIP:0 "Embark on the Japanese Destiny"
 oe_msn_jap_destiny_BUTTON_DETAILS:0 "Unify Japan under authentic tags (JAP/ASK/NTC/STC): heal the Nanbokucho and Sengoku wars, pair Jokamachi castle towns with Ashigaru matchlocks, mine Iwami silver at Nima, and send Red Seal ships across the Pacific."
 STATIC_MODIFIER_NAME_oe_msn_jap_m1:0 "Tenka Fubu: Bushido & Ashigaru Matchlocks"
 STATIC_MODIFIER_DESC_oe_msn_jap_m1:0 "Combining samurai martial spirit with volley-firing Ashigaru matchlocks yields elite discipline."
 STATIC_MODIFIER_NAME_oe_msn_jap_m2:0 "Unified Japan: Kyoto, Osaka & Edo"
 STATIC_MODIFIER_DESC_oe_msn_jap_m2:0 "Uniting Kanto, Kinai, and Kyushu forges an unbreakable island empire ready for oceanic reach."
 STATIC_MODIFIER_NAME_oe_msn_jap_m3:0 "Iwami Ginzan Silver & Red Seal Fleets"
 STATIC_MODIFIER_DESC_oe_msn_jap_m3:0 "Abundant Iwami silver and Red Seal merchant fleets command East Asian bullion and silk arbitrage."
 STATIC_MODIFIER_NAME_oe_msn_jap_m4:0 "Modern Japanese Maritime Hegemony"
 STATIC_MODIFIER_DESC_oe_msn_jap_m4:0 "Rejecting isolation, a modernized Japan projects naval, commercial, and industrial power across the Pacific."
 oe_msn_jap_01_kyoto_kamakura:0 "Heal the Two Courts: Kyoto & Kamakura"
 oe_msn_jap_01_kyoto_kamakura_desc:0 "Reconciling the rival Northern and Southern Courts unites the imperial [capital|e] of Kyoto with the samurai traditions of Kamakura under renewed [legitimacy|e]. Restraining turbulent shugo lords restores archipelago [stability|e] and elevates the Shogunate's [prestige|e] across every province."
 oe_msn_jap_01_kyoto_kamakura_req_tt:0 "Control Kyoto, Kamakura, or Toshima (directly or via subject), have 5 Stability, and own a Castle or Temple."
 oe_msn_jap_02_jokamachi_land_survey:0 "Jokamachi Castle Towns & Land Survey"
 oe_msn_jap_02_jokamachi_land_survey_desc:0 "Conducting uniform Taiko land surveys and separating samurai retainers from the soil gathers artisans and merchants into bustling Jokamachi castle towns of soaring [development|e]. Standardized rice assessments expand tax [gold|e], deepen central [control|e], and stimulate free-guild [market|e] vitality."
 oe_msn_jap_02_jokamachi_land_survey_req_tt:0 "Control Kyoto, Osaka, or Toshima (directly or via subject), have 10 Stability and 220 Gold, and own a Marketplace or Granary."
 oe_msn_jap_03_ashigaru_tanegashima:0 "Ashigaru Matchlocks & Volley Drill"
 oe_msn_jap_03_ashigaru_tanegashima_desc:0 "Sakai and Kunitomo gunsmiths mass-produce Tanegashima matchlocks for drilled Ashigaru ranks firing in disciplined rotating volleys behind bamboo palisades. Turning gunpowder [advances|e] into tactical doctrine reshapes our [army|e] into lethal [regulars|e] and elevates samurai-era [army_tradition|e] to world-leading heights."
 oe_msn_jap_03_ashigaru_tanegashima_req_tt:0 "In the Age of Discovery or later, control Kyoto, Osaka, or Toshima (directly or via subject), hold 250 Gold and 20 Army Tradition, own a Cannon Maker or Training Fields, and embrace Professional Armies or research Pike and Shot."
 oe_msn_jap_04_bushido_central_bakufu:0 "Bushido Laws & Centralized Shogunate"
 oe_msn_jap_04_bushido_central_bakufu_desc:0 "Codifying the Laws for the Military Houses channels proud warrior clans from civil strife into civil administration and disciplined garrison service, consolidating [crown_power|e]. Alternate attendance and balanced [estates|e] charters guarantee realm-wide [stability|e] while modern [regulars|e] stand ever ready."
 oe_msn_jap_04_bushido_central_bakufu_req_tt:0 "In the Age of Reformation or later, control Toshima or Kyoto (directly or via subject), have 15 Stability and 28 Army Tradition, keep Nobles Satisfaction at least 50% (if present), and own a Barracks or Bastion."
 oe_msn_jap_05_osaka_kinai_heart:0 "Kitchen of the Realm: Osaka & Kyoto"
 oe_msn_jap_05_osaka_kinai_heart_desc:0 "Pairing the imperial court of Kyoto with the granite-moated fortress and rice exchanges of Osaka transforms the Kinai heartland into the Kitchen of the Realm and our unshakable [core|e]. Inland Sea barges pour grain and textiles into Osaka's [market|e], driving rapid [development|e] and unmatched commercial [prosperity|e]."
 oe_msn_jap_05_osaka_kinai_heart_req_tt:0 "Control Kyoto and Osaka directly or through non-sovereign subjects."
 oe_msn_jap_06_edo_kanto_capital:0 "Kanto Fortress: Build Edo (Toshima)"
 oe_msn_jap_06_edo_kanto_capital_desc:0 "Draining the Hibiya marshes and raising spiral stone ramparts turns Edo on the wide Kanto plain into an impregnable [fort|e] and towering political [capital|e]. Five highways radiate outward from Nihonbashi, drawing merchants and artisans that multiply eastern [development|e] and tighten imperial [control|e]."
 oe_msn_jap_06_edo_kanto_capital_req_tt:0 "Control Toshima (Edo) and Kamakura directly or through non-sovereign subjects."
 oe_msn_jap_07_kyushu_hakata_nagasaki:0 "Kyushu Maritime Gate: Hakata & Nagasaki"
 oe_msn_jap_07_kyushu_hakata_nagasaki_desc:0 "Hakata's merchant warehouses and Nagasaki's deep sheltered bay open Kyushu as Japan's indispensable southern [core|e] for continental and oceanic [trade|e]. Supervising foreign carracks and Chinese junks secures vital customs [gold|e] and anchors vigilant [maritime_presence|e] along the East China Sea."
 oe_msn_jap_07_kyushu_hakata_nagasaki_req_tt:0 "Control Hakata and Nishisonogi (Nagasaki) directly or via subject and possess a Port."
 oe_msn_jap_08_rising_sun_unity:0 "Land of the Rising Sun Unified"
 oe_msn_jap_08_rising_sun_unity_desc:0 "From Kyushu's volcanic bays to the fertile Kanto lowlands, a century of Sengoku bloodshed closes beneath one unified banner, crowning our realm with deep [stability|e] and sovereign [legitimacy|e]. Disciplined regional [subjects|e] and coastal towns unite under peaceful governance, lifting Japanese [prestige|e] across Asia."
 oe_msn_jap_08_rising_sun_unity_req_tt:0 "Control Kyoto, Osaka, Toshima, and Hakata (directly or via subject) and own at least 8 Ports."
 oe_msn_jap_09_iwami_ginzan_silver:0 "Iwami Ginzan (Nima): Cupellation Silver"
 oe_msn_jap_09_iwami_ginzan_silver_desc:0 "Cupellation smelting along the wooded valleys of Iwami Ginzan transforms raw ore into a torrent of pure silver that fuels East Asian [trade|e] and swells state [gold|e]. Minting standardized koban and silver ingots curbs [inflation|e] and spreads enduring fiscal [prosperity|e] from mountain shafts to port exchanges."
 oe_msn_jap_09_iwami_ginzan_silver_req_tt:0 "Control Nima (Iwami Ginzan) directly or via subject, hold 300 Gold, and earn 25 monthly trade and tax income."
 oe_msn_jap_10_red_seal_ships:0 "Red Seal Ships: Pacific & Nanyang Trade"
 oe_msn_jap_10_red_seal_ships_desc:0 "Bearing vermilion shogunal patents, armed Shuinsen merchantmen sail southward to Manila, Hoi An, and Ayutthaya, linking Japanese silver with Southeast Asian silk and spices in vibrant [trade|e]. Bold voyages train ocean-going [sailors|e], raise [navy_tradition|e], and boost merchant [estate_satisfaction|e]."
 oe_msn_jap_10_red_seal_ships_req_tt:0 "In the Age of Discovery or later, control Nishisonogi or Hakata (directly or via subject), have 15 Navy Tradition, and own a Dry Dock or Trading Hub."
 oe_msn_jap_11_rangaku_open_seas:0 "Rangaku Science & Oceanic Dockyards"
 oe_msn_jap_11_rangaku_open_seas_desc:0 "Rather than shutting the sea gates, Nagasaki scholars translate European cartography, ballistics, and medicine through Rangaku academies, fusing Western [advances|e] with our refined [cultural_tradition|e]. High urban [literacy|e] and modern ocean dockyards launch a formidable blue-water [navy|e]."
 oe_msn_jap_11_rangaku_open_seas_req_tt:0 "In the Age of Reformation or later, control Nishisonogi (directly or via subject), have 15 Stability, Capital Development 32, and own a Shipyard or Printing Press Shop."
 oe_msn_jap_12_pacific_maritime_hegemon:0 "Modern Japanese Pacific Hegemony"
 oe_msn_jap_12_pacific_maritime_hegemon_desc:0 "With silver-backed finance, open oceanic dockyards, and unified domestic power, the Land of the Rising Sun stands as an industrialized Pacific [great_power|e]. Commanding [maritime_presence|e] from the Ryukyus to the South Seas and pioneering modern [institutions|e] crown Japan with indelible global [prestige|e]."
 oe_msn_jap_12_pacific_maritime_hegemon_req_tt:0 "In the Age of Absolutism or later, control Kyoto, Toshima, and Nima (directly or via subject), have 18 Stability, and be a Great Power or earn at least 90 monthly trade and tax income."
 oe_msn.1.title:0 "Destiny Crowned: Triumph of a Eurasian Great Power"
 oe_msn.1.desc:0 "Through centuries of institutional reform, strategic expansion, and cultural mastery, a grand Eurasian destiny mission chain stands fulfilled. Chroniclers record the age as foreign envoys arrive in tribute."
